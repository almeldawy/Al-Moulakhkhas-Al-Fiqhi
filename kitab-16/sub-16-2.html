<h2 id="بسم-الله-الرحمن-الرحيم"><strong><span dir="rtl">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</span></strong></h2>
<p><strong>Chapitre sur les règles de l'allaitement</strong></p>
<p>⁕ Allah le Très-Haut a dit, dans le contexte de l'explication des femmes qui sont interdites [au mariage] :</p>
<p class="ar"><span dir="rtl">﴿وَأُمَّهَاتُكُمُ اللَّاتِي أَرْضَعْنَكُمْ وَأَخَوَاتُكُم مِّنَ الرَّضَاعَةِ﴾ [النساء: ٢٣]</span></p>
<p><strong>﴾ ...vos mères qui vous ont allaités et vos sœurs de lait... ﴿</strong> [Les Femmes : 23].</p>
<p>Et dans les deux recueils authentiques (<em>Al-Bukhârî</em> et <em>Muslim</em>), le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="rtl">«يَحْرُمُ مِنَ الرَّضَاعِ مَا يَحْرُمُ مِنَ النَّسَبِ»</span></p>
<p><em><strong>« L'allaitement interdit ce que la parenté (la consanguinité) interdit. »</strong></em><a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a></p>
<p>Et sa parole <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«يَحْرُمُ مِنَ الرَّضَاعِ مَا يَحْرُمُ مِنَ الْوِلَادَةِ»</span></p>
<p><em><strong>« L'allaitement interdit ce que la naissance interdit. »</strong></em> Rapporté par le groupe (les auteurs des recueils majeurs) <a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a>.</p>
<p>⁕ L'allaitement (<em>Ar-Radâ'</em>) au sens linguistique signifie : sucer le lait du sein ou le boire.</p>
<p>Au sens religieux, il s'agit de la succion de lait par un enfant de moins de deux ans, lait provenant d'une grossesse [de la femme], ou le fait qu'il le boive ou procédé similaire.</p>
<p>⁕ Le statut de l'allaitement est identique à celui de la parenté en ce qui concerne [l'interdiction du] mariage, l'isolement [avec la femme], la qualité de <em>Mahram</em> (proche parent interdit au mariage) et la permission de la regarder, selon les détails qui vont suivre.</p>
<p>⁕ Cependant, ces règles ne s'appliquent qu'à deux conditions :</p>
<p><strong>La première condition :</strong> Que l'allaitement soit constitué de cinq tétées ou plus. Ceci en raison du hadith d'Aïcha, qu'Allah l'agrée, qui a dit :</p>
<p class="ar"><span dir="rtl">كَانَ فِيمَا أُنْزِلَ مِنَ الْقُرْآنِ عَشْرُ رَضَعَاتٍ مَعْلُومَاتٍ يُحَرِّمْنَ ثُمَّ نُسِخْنَ بِخَمْسٍ مَعْلُومَاتٍ فَتُوُفِّيَ رَسُولُ اللَّهِ ﷺ وَهُنَّ فِيمَا يُقْرَأُ مِنَ الْقُرْآنِ»</span></p>
<p><em><strong>« Il figurait parmi ce qui a été descendu du Coran : "dix tétées connues interdisent [le mariage]", puis elles ont été abrogées par "cinq tétées connues". Le Messager d'Allah <span dir="rtl">ﷺ</span> mourut alors que cela faisait encore partie de ce qui était lu dans le Coran. »</strong></em> Rapporté par Muslim <a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a>. Et ceci relève de l'abrogation de la récitation textuelle et non du statut juridique, et cela vient expliciter ce qui a été mentionné de façon globale dans le verset et les hadiths au sujet de l'allaitement.</p>
<p><strong>La deuxième condition :</strong> Que les cinq tétées aient lieu au cours des deux premières années [de l'enfant] ; ceci en raison de la parole d'Allah le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿وَالْوَالِدَاتُ يُرْضِعْنَ أَوْلَادَهُنَّ حَوْلَيْنِ كَامِلَيْنِ ۖ لِمَنْ أَرَادَ أَن يُتِمَّ الرَّضَاعَةَ﴾ [البقرة: ٢٣٣]</span></p>
<p><strong>﴾ Et les mères, qui veulent compléter l'allaitement, allaiteront leurs enfants deux ans complets. ﴿</strong> Al-Baqarah : 233]. Ce noble verset prouve ainsi que l'allaitement pris en considération juridique est celui qui se déroule durant les deux premières années.</p>
<p>Également en raison de sa parole <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«لَا يُحَرِّمُ مِنَ الرَّضَاعَةِ إِلَّا مَا فَتَقَ الْأَمْعَاءَ فِي الثَّدْيِ وَكَانَ قَبْلَ الْفِطَامِ»</span></p>
<p><em><strong>« N'interdit [le mariage] par l'allaitement que ce qui fend (remplit) les intestins à partir du sein et qui a lieu avant le sevrage »</strong></em>, l'imam At-Tirmidhî a dit : « C'est un hadith bon et authentique » <a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a>.</p>
<p>Et son sens est qu'aucun allaitement n'établit d'interdiction sauf s'il parvient aux intestins et les élargit (les remplit) ; ainsi, une petite quantité qui ne pénètre pas jusqu'à eux et ne les élargit pas n'interdit rien. De plus, il n'interdit que ce qui a lieu avant le sevrage, c'est-à-dire durant la petite enfance, lorsque le lait fait office de nourriture principale. Ce qui établit l'interdiction est donc la situation où le nourrisson est un enfant dont le lait apaise la faim et fait croître la chair, devenant ainsi une partie intégrante de lui.</p>
<p>La limite d'une tétée [singulière] est que l'enfant tète le sein, puis s'interrompe pour reprendre son souffle, pour passer d'un sein à l'autre ou pour toute autre raison : cela lui est alors compté comme une seule tétée. S'il y retourne, cela fait deux tétées... et ainsi de suite, même au cours d'une seule et même assise. Il en est ainsi parce que le Législateur a pris en considération le nombre de tétées sans définir [précisément] ce qu'est une tétée unique ; on s'en remet donc à la coutume (<em>Al-'Urf</em>) pour en déterminer la définition.</p>
<p>⁕ Même si le lait parvient à l'intérieur du corps de l'enfant par un autre moyen que la tétée directe, son statut juridique reste le même que celui de l'allaitement. C'est le cas par exemple s'il est versé goutte à goutte dans sa bouche ou son nez, ou s'il le boit depuis un récipient ou autre procédé similaire ; cela prend le statut juridique de l'allaitement car il en découle la même nutrition que celle obtenue par la tétée. Cela reste toutefois conditionné par le fait que ce procédé se répète à cinq reprises distinctes.</p>
<p>⁕ Quant à <strong>l'étendue de l'interdiction</strong> établie par l'allaitement : dès lors qu'une femme allaite un enfant de moins de deux ans à hauteur de cinq tétées ou plus, le nourrisson devient son enfant en ce qui concerne l'interdiction de l'épouser, la permission de la regarder et de s'isoler avec elle. Il devient ainsi un <em>Mahram</em> (proche parent interdit au mariage) pour elle, conformément à la parole d'Allah le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿ وَأُمَّهَاتُكُمُ اللَّاتِي أَرْضَعْنَكُمْ ﴾ [النساء: ٢٣]</span></p>
<p><strong>﴾ ...vos mères qui vous ont allaités... ﴿</strong> [Les Femmes : 23].</p>
<p>Cependant, il ne prend pas le statut de son enfant pour le reste des règles juridiques: sa pension alimentaire ne lui incombe pas, il n'y a pas de succession (héritage) mutuelle entre eux, il ne paie pas le prix du sang (<em>Al-Aql</em>) à sa place, et il ne peut pas être son tuteur légal (<em>Walî</em>). En effet, la filiation de sang est plus forte que la parenté de lait ; cette dernière ne s'égalise donc avec elle que dans les cas explicitement mentionnés par les textes textuels, à savoir l'interdiction [du mariage] et ce qui en découle comme relations de <em>Mahram</em> et d'isolement permis.</p>
<p>⁕ De même, le nourrisson devient l'enfant de celui à qui le lait de la femme est attribué [le père de lait], en raison de la grossesse qu'elle a eue de lui, ou en raison des rapports charnels qu'il a eus avec elle dans le cadre d'un mariage ou d'une similitude (<em>Shubhah</em> — un mariage présumé valide). En effet, la filiation de l'enfant à naître lui est légalement attribuée dans ces situations, et l'allaitement en découle directement. Le nourrisson devient alors son enfant uniquement vis-à-vis des règles précédemment mentionnées concernant la nourrice. Ces règles sont : l'interdiction du mariage, la permission de regarder, de s'isoler avec elle et la qualité de <em>Mahram</em>, à l'exclusion du reste des autres statuts juridiques.</p>
<p>⁕ De même, les parents interdits (les <em>Mahrams</em>) de celui à qui le lait est attribué [le père de lait] — tels que ses pères (ascendants), ses enfants, ses mères, ses grands-pères, ses grands-mères, ses frères, ses sœurs ainsi que leurs enfants, ses oncles et tantes paternels, et ses oncles et tantes maternels — deviennent tous des <em>Mahrams</em> pour le nourrisson. De la même manière, les <em>Mahrams</em> de la nourrice — tels que ses pères, ses enfants, ses mères, ses sœurs, ses oncles paternels et leurs semblables — deviennent également des <em>Mahrams</em> pour le nourrisson.</p>
<p>⁕ Tout comme l'interdiction s'établit pour le nourrisson vis-à-vis de la nourrice, elle se propage de la même manière à sa propre descendance (ses branches descendantes), à savoir ses enfants et ses petits-enfants, à l'exclusion de ses ascendants (ses branches paternelles et maternelles) et de ses collatéraux. Ainsi, l'interdiction ne se propage pas à ceux qui se situent au-dessus de lui, tels que ses pères, ses mères, ses oncles et tantes paternels ou ses oncles et tantes maternels. De même, elle ne s'étend pas aux collatéraux qui se situent au même degré que lui, à savoir ses propres frères et sœurs.</p>
<p>⁕ Quiconque a été allaité par le lait d'une femme ayant eu des rapports charnels dans le cadre d'un mariage caduc (<em>'Aqd Bâtil</em>) ou d'une relation de fornication (<em>Zinâ</em>) devient l'enfant de la nourrice uniquement. En effet, étant donné que la paternité par la filiation de sang n'est pas établie [dans ces cas-là], elle ne s'établit pas non plus par l'allaitement, qui n'en est qu'une ramification secondaire.</p>
<p>⁕ Le lait d'un animal (une bête) n'engendre aucune interdiction. Par conséquent, si deux enfants venaient à boire le lait d'un même animal, cela ne propagerait aucune interdiction de mariage entre eux.</p>
<p>⁕ Une divergence existe concernant le lait d'une femme lorsque celui-ci coule sans qu'il n'y ait eu de grossesse ni de rapports charnels préalables, et qu'un enfant en est allaité. Il a été dit : il ne propage pas l'interdiction, car il ne s'agit pas d'un lait véritable mais plutôt d'une humidité générée ; et aussi parce que le lait [qui interdit] est celui qui consolide les os et fait croître la chair, ce qui n'est pas le cas ici. Le second avis énonce : il propage bien l'interdiction, et c'est l'avis qu'a choisi Al-Muwaffaq [Ibn Qudâmah] ainsi que d'autres savants.</p>
<p>⁕ L'allaitement est établi par le témoignage d'une seule femme dont la pratique religieuse est intègre et agréée. Cheikh al-Islam [Ibn Taymiyyah] a dit <a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a> : <em>« Si elle est connue pour sa véracité et qu'elle mentionne avoir allaité l'enfant à cinq reprises, cela est accepté selon l'avis authentique, et le statut juridique de l'allaitement est alors établi. »</em> Fin de citation.</p>
<p>⁕ Si un doute subsiste quant à l'existence même de l'allaitement, ou quant à son accomplissement à hauteur de cinq tétées, et qu'il n'y a aucune preuve évidente, alors il n'y a pas d'interdiction. En effet, la règle de base (<em>Al-Asl</em>) est l'absence d'allaitement. Et Allah est Le plus Savant.</p>
