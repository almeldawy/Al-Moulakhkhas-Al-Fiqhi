<p>⁕ <em>An-Nafaqât</em> (les dépenses/pensions) est le pluriel de <em>Nafaqah</em>. Linguistiquement, cela désigne : les dirhams et ce qui s'y apparente parmi les biens (financiers). Et sur le plan légal (religieux) : il s'agit de pourvoir suffisamment aux besoins de la personne dont on a la charge, de manière convenable, en termes de nourriture, de vêtements, de logement et ce qui s'y rattache.</p>
<p>⁕ Et la première des dépenses qui incombe à l'homme est celle destinée à son épouse. Il est donc obligatoire pour le mari de subvenir aux besoins de sa femme en matière de nourriture, d'habillement et de logement, d'une manière qui convienne à une femme de sa condition.</p>
<p>Le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿لِيُنْفِقْ ذُو سَعَةٍ مِنْ سَعَتِهِ﴾ [الطلاق: ٧]</span></p>
<p><strong>﴾ Que celui qui est aisé dépense de sa fortune. ﴿</strong> [At-Talâq : 7]</p>
<p>Et le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿وَلَهُنَّ مِثْلُ الَّذِي عَلَيْهِنَّ بِالْمَعْرُوفِ﴾ [البقرة: ٢٢٨]</span></p>
<p><strong>﴾ Quant à elles, elles ont des droits équivalents à leurs obligations, conformément à la bienséance. ﴿</strong> [Al-Baqarah : 228]</p>
<p>Et le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="rtl">«وَلَهُنَّ عَلَيْكُمْ رِزْقُهُنَّ وَكِسْوَتُهُنَّ بِالْمَعْرُوفِ»</span></p>
<p><em><strong>« Elles ont le droit sur vous d'être nourries et vêtues convenablement. »</strong></em> Rapporté par Muslim et Abû Dâwûd.<a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a></p>
<p>Et Cheikh Al-Islâm Ibn Taymiyyah (qu'Allah lui fasse miséricorde) a dit <a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a>: <em>« Et entre dans [la signification du verset] <strong>﴾ Quant à elles, elles ont des droits équivalents à leurs obligations, conformément à la bienséance ﴿</strong> : l'ensemble des droits en faveur de la femme et de ses devoirs, et la référence en la matière est ce que les gens reconnaissent entre eux comme coutume, considèrent comme établi, et qui se répète (habituellement). »</em> Fin de citation.</p>
<p>Il est ainsi imposé comme dépense d'entretien pour la femme aisée mariée à un homme aisé la quantité suffisante correspondant à ce que mange une femme aisée auprès d'un mari aisé dans leur localité. Il lui est également imposé, en matière d'habillement, ce que portent les femmes de sa condition parmi les femmes aisées de ce pays, ainsi que pour la literie et le mobilier, ce qui convient à son rang dans ce même pays.</p>
<p>Et il est imposé pour la femme pauvre mariée à un homme pauvre, en termes de nourriture, de vêtements, de literie et de mobilier, ce qui convient à une femme de sa condition dans le pays.</p>
<p>Quant à la femme de condition moyenne mariée à un homme de condition moyenne, ainsi que la femme riche mariée à un homme pauvre, ou la femme pauvre mariée à un homme riche, il leur est imposé un niveau intermédiaire situé entre le seuil maximal — qui est la dépense des personnes aisées — et le seuil minimal — qui est la dépense de deux personnes pauvres —, et ce, conformément à la coutume et à l'usage, car c'est cela qui convient à leur situation respective.</p>
<p>⁕ Il incombe également au mari de prendre en charge les frais liés à la propreté de son épouse, tels que les huiles, le jujubier (<em>sidr</em>), le savon, ainsi que l'eau nécessaire à la boisson, à la purification rituelle et à l'hygiène.</p>
<p>⁕ Ce qui vient d'être mentionné s'applique lorsque l'épouse est encore sous son lien conjugal. En revanche, s'il divorce d'elle et qu'elle entre en période de viduité (<em>'iddah</em>) : s'il s'agit d'un divorce révocable (<em>raj'î</em>), son entretien reste obligatoirement à la charge du mari tant qu'elle se trouve dans sa période de viduité, au même titre qu'une épouse, car elle est toujours considérée comme son épouse. La preuve en est la parole du Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿وَبُعُولَتُهُنَّ أَحَقُّ بِرَدِّهِنَّ فِي ذَلِكَ﴾ [البقرة: ٢٢٨].</span></p>
<p><strong>﴾ Et leurs époux sont plus en droit de les reprendre durant cette période ﴿</strong> [Al-Baqarah : 228].</p>
<p>⁕ Quant à la femme divorcée de manière irrévocable — qu'il s'agisse d'une irrévocabilité majeure (<em>baynûnah kubrâ</em>) ou mineure (<em>baynûnah sughrâ</em>) —, elle ne bénéficie ni de l'entretien financier ni du logement. Cela s'appuie sur ce qui est rapporté dans les deux recueils authentiques (<em>al-Sahîhayn</em>) d'après le hadith de Fâtimah bint Qays : son époux avait divorcé d'elle définitivement, et le Prophète <span dir="rtl">ﷺ</span> lui dit alors :</p>
<p class="ar"><span dir="rtl">«لَا نَفَقَةَ لَكِ وَلَا سُكْنَىٰ»</span></p>
<p><em><strong>« Tu n'as droit ni à l'entretien financier ni au logement. »</strong></em><a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a></p>
<p>L'érudit Ibn al-Qayyim (qu'Allah lui fasse miséricorde) a dit : <em>« La femme divorcée de manière irrévocable n'a droit ni à l'entretien ni au logement, conformément à la Sounnah authentique du Messager d'Allah <span dir="rtl">ﷺ</span>, qui est d'ailleurs en parfaite conformité avec le Livre d'Allah. C'est également ce qui découle de l'analogie (qiyâs) et constitue la doctrine des juristes de l'école du Hadith (fuqahâ al-hadîth). »</em> Fin de citation.</p>
<p>⁕ À moins que la femme divorcée de manière irrévocable ne soit enceinte ; dans ce cas, elle a droit à l'entretien financier. Cela s'appuie sur la parole du Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿وَإِنْ كُنَّ أُولَاتِ حَمْلٍ فَأَنْفِقُوا عَلَيْهِنَّ حَتَّى يَضَعْنَ حَمْلَهُنَّ﴾ [الطلاق: ٦]</span></p>
<p><strong>﴾ Et si elles sont enceintes, pourvoyez à leurs besoins jusqu'à ce qu'elles aient accouché ﴿</strong> [At-Talâq : 6]</p>
<p>ainsi que Sa parole :</p>
<p class="ar"><span dir="rtl">﴿أَسْكِنُوهُنَّ مِنْ حَيْثُ سَكَنْتُمْ مِنْ وُجْدِكُمْ﴾ [الطلاق: ٦]</span></p>
<p><strong>﴾ Logez-les là où vous habitez, selon vos moyens ﴿</strong> [At-Talâq : 6].</p>
<p>De même, cela se base sur la parole du Prophète <span dir="rtl">ﷺ</span> à Fâtimah bint Qays :</p>
<p class="ar"><span dir="rtl">«لَا نَفَقَةَ لَكِ؛ إِلَّا أَنْ تَكُونِي حَامِلًا»</span></p>
<p><em><strong>« Tu n'as pas droit à l'entretien, à moins que tu ne sois enceinte »</strong></em>.<a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a></p>
<p>Enfin, parce que le fœtus est l'enfant de l'homme qui a divorcé, il lui incombe donc de dépenser pour lui, et il ne peut le faire qu'en subvenant aux besoins de la mère.</p>
<p>Al-Muwaffaq <a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a> ainsi que d'autres ont dit : <em>« Cela fait l'objet d'un consensus (Ijmâ') parmi les gens de science. Cependant, les savants ont divergé sur la question suivante : la pension est-elle due pour le fœtus lui-même, ou bien est-elle due à la femme enceinte en raison de sa grossesse ? »</em></p>
<p>De ces deux avis découlent de nombreuses règles juridiques dont la place détaillée se trouve dans les ouvrages de jurisprudence (<em>Fiqh</em>) et de maximes juridiques (<em>Al-Qawâ'id al-Fiqhiyyah</em>).</p>
<p>⁕ L'obligation pour le mari de subvenir aux besoins de son épouse s'annule pour plusieurs raisons :</p>
<p>⁃ <strong>Parmi celles-ci :</strong> Si elle est emprisonnée (ou retenue) loin de lui, sa pension s'annule. En effet, le mari se trouve alors dans l'impossibilité de jouir de la vie conjugale avec elle, or l'entretien n'est obligatoire qu'en contrepartie de cette disponibilité conjugale.</p>
<p>⁃ <strong>Parmi celles-ci :</strong> Si elle entre en état de désobéissance conjugale (<em>Nushûz</em>), sa pension s'annule. Le <em>Nushûz</em> désigne le fait qu'elle lui désobéisse dans ce qui lui incombe obligatoirement envers lui. C'est le cas par exemple si elle se refuse à son lit, si elle refuse de s'installer avec lui dans un logement qui convient à son rang, ou si elle sort de sa demeure sans sa permission. Elle ne bénéficie d'aucun entretien dans ces situations car elle est considérée comme insoumise (<em>Nâshiz</em>) ; le mari ne pouvant plus jouir de la vie conjugale avec elle, alors que la pension est la contrepartie de sa disponibilité à cette vie commune.</p>
<p>⁃ <strong>Parmi celles-ci :</strong> Si elle entreprend un voyage pour ses besoins personnels, sa pension s'annule. Par cet acte, elle s'est soustraite elle-même à son époux pour une cause qui ne provient pas de lui ; sa pension s'annule donc.</p>
<p>⁕ La femme dont l'époux est décédé n'a pas droit à une pension d'entretien prélevée sur l'héritage (<em>Tarikah</em>) du mari. En effet, les biens ont été transférés du mari aux héritiers, et il n'y a plus de cause rendant cette obligation d'entretien effective sur ces biens. Par conséquent, ses dépenses d'entretien lui incombent à elle-même, ou bien reviennent à la personne qui doit subvenir à ses besoins si elle est pauvre.</p>
<p>⁕ En revanche, si la veuve est enceinte, son entretien devient obligatoire et doit être prélevé sur la part de l'héritage qui revient à l'enfant à naître (le fœtus), si le défunt a laissé un héritage. Dans le cas contraire (s'il n'y a pas d'héritage), son entretien incombe à l'héritier du fœtus qui est de condition aisée.</p>
<p>⁕ Si les deux époux conviennent d'un accord pour verser la valeur équivalente de la pension d'entretien, ou s'ils s'entendent pour l'avancer (la payer par anticipation) ou pour la différer pour une période longue ou courte, cela est tout à fait permis, car ce droit leur appartient exclusivement. En revanche, s'ils divergent, il devient obligatoire de verser la pension de chaque journée dès le début de celle-ci, prête à l'usage. De même, s'ils conviennent de verser cette pension sous forme de grains (matière brute), cela est permis ; toutefois, comme cela nécessite des frais et une préparation, elle n'est pas contrainte de l'accepter sauf si elle y consent de son plein gré.</p>
<p>L'habillement lui est également dû au début de chaque année ; le mari lui fournit donc les vêtements nécessaires pour l'année entière. Par ailleurs, quiconque s'absente de son épouse sans lui laisser de quoi subsister, ou reste présent mais s'abstient de dépenser pour elle, demeure redevable de toutes les pensions passées non versées. En effet, il s'agit d'un droit qui s'impose obligatoirement, que le mari soit dans l'aisance ou dans la gêne financière, et il ne s'annule donc pas avec le passage du temps.</p>
<p>⁕ Le moment où l'entretien de l'épouse devient obligatoire pour son mari commence dès lors qu'elle se rend disponible à lui. Si le mari se trouve dans l'indigence (l'incapacité financière) de subvenir à ses besoins, elle a alors le droit de faire annuler son mariage d'avec lui. Cela s'appuie sur le hadith de Abû Hurayrah, rapporté de manière prophétique (<em>marfû'</em>), concernant l'homme qui ne trouve pas de quoi dépenser pour sa femme ; il a dit :</p>
<p class="ar"><span dir="rtl">«يُفَرَّقُ بَيْنَهُمَا»</span></p>
<p><em><strong>« On les sépare. »</strong></em><a href="#fn6" class="footnote-ref" id="fnref6" role="doc-noteref"><sup>6</sup></a> Rapporté par Al-Dâraqutnî.</p>
<p>C'est également en conformité avec la parole du Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿فَإِمْسَاكٌ بِمَعْرُوفٍ أَوْ تَسْرِيحٌ بِإِحْسَانٍ﴾ [البقرة: ٢٢٩]</span></p>
<p><strong>﴾ C'est soit le maintien dans la bienséance, soit la libération avec gentillesse ﴿</strong> [Al-Baqarah : 229]. Or, retenir son épouse tout en délaissant son entretien ne constitue en rien un maintien convenable.</p>
<p>⁕ Si un mari aisé s'absente sans laisser de pension à sa femme, et qu'il lui est impossible de prélever sur ses biens ou d'emprunter à sa charge, elle a le droit de demander l'annulation du mariage avec l'autorisation du juge (<em>Al-Hâkim</em>). En revanche, si elle a la possibilité d'accéder à ses biens, elle peut y puiser ce qui lui suffit. Cela est fondé sur ce qui est rapporté dans les deux recueils authentiques (<em>Al-Sahîhayn</em>), où le Prophète <span dir="rtl">ﷺ</span> a dit à Hind :</p>
<p class="ar"><span dir="rtl">«خُذِي مَا يَكْفِيكِ وَوَلَدَكِ بِالْمَعْرُوفِ»</span></p>
<p><em><strong>« Prends ce qui te suffit, à toi et à ton enfant, convenablement »</strong></em><a href="#fn7" class="footnote-ref" id="fnref7" role="doc-noteref"><sup>7</sup></a>, lorsqu'elle lui eut exposé que son époux ne lui donnait pas de quoi subvenir à ses besoins et à ceux de son enfant.</p>
<p>À travers cela et bien d'autres exemples, nous percevons la perfection de cette législation (<em>Sharî'ah</em>) et le fait qu'elle accorde à chaque ayant droit son droit légitime, comme c'est le cas dans l'ensemble de ses sages prescriptions. Qu'Allah enlaidisse donc un peuple qui s'en détourne pour recourir à d'autres lois de mécréance :</p>
<p class="ar"><span dir="rtl">﴿أَفَحُكْمَ الْجَاهِلِيَّةِ يَبْغُونَ وَمَنْ أَحْسَنُ مِنَ اللهِ حُكْماً لِقَوْمٍ يُوقِنُونَ ٥٠﴾ [المائدة]</span></p>
<p><strong>﴾ Est-ce donc le jugement du temps de l'ignorance (<em>Jâhiliyyah</em>) qu'ils cherchent ? Et qui est meilleur qu'Allah en matière de jugement pour des gens qui croient avec certitude ? ﴿</strong> [Al-Mâ'idah : 50].</p>
