<p>⁕ <strong>Ce que l'on entend ici par "les proches" d'une personne</strong> désigne toute personne qui hérite d'elle, que ce soit par une part fixe (Fard) ou par l'asabah (les parents masculins du côté paternel). Et ce que l'on entend par "les personnes/animaux à charge" (Al-Mamâlîk) désigne tout ce qui est sous l'autorité de l'homme parmi les esclaves et le bétail.</p>
<p>⁕ <strong>Il est stipulé comme condition pour que l'obligation de subvenir aux besoins du proche soit effective</strong> — lorsqu'il fait partie des deux lignes de parenté (directes), à savoir les parents de celui qui dépense et ses grands-parents même s'ils s'élèvent (dans l'arbre généalogique), ainsi que ses enfants et leurs descendants même s'ils descendent (dans l'arbre généalogique) — ce qui suit :</p>
<ul>
<li><blockquote>
<p>Que la personne à charge parmi eux soit pauvre, ne possédant rien, ou ne possédant pas ce qui lui suffit, et qu'elle ne soit pas capable de travailler pour gagner sa vie.</p>
</blockquote></li>
<li><blockquote>
<p>Que celui qui dépense soit riche, disposant d'un surplus par rapport à sa propre nourriture, celle de son épouse et de ceux qui sont à sa charge.</p>
</blockquote></li>
<li><blockquote>
<p>Et que celui qui dépense et la personne à charge soient de la même religion.</p>
</blockquote></li>
</ul>
<p>⁕ <strong>Et si la personne à charge ne fait pas partie des enfants de celui qui dépense, ni de ses parents (ascendants) ;</strong> il est alors stipulé comme condition — en plus de cela — que celui qui dépense soit un héritier de la personne à charge.</p>
<p><strong>La preuve concernant l'obligation de l'entretien financier des parents à la charge de leur enfant</strong> réside dans la parole de Allah le Très-Haut :</p>
<p class="ar"><span dir="rtl"><br />
﴿وَبِالْوَالِدَيْنِ إِحْسَانًا﴾</span></p>
<p><strong>﴾ et agissez avec bonté envers vos père et mère ﴿</strong> [Al-Baqarah: 83].</p>
<p>Et subvenir à leurs besoins (financiers) fait partie de la bonté, c'est même l'une des plus grandes formes de bienfaisance à l'égard des parents.</p>
<p>⁕ <strong>La preuve concernant l'obligation de l'entretien financier des enfants à la charge de leur père</strong> réside dans la parole de Allah le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿وَعَلَى الْمَوْلُودِ لَهُ رِزْقُهُنَّ وَكِسْوَتُهُنَّ بِالْمَعْرُوفِ﴾</span></p>
<p><strong>﴾ Au père de l'enfant incombe l'obligation de les nourrir et de les vêtir de manière convenable ﴿</strong> [Al-Baqarah: 233].</p>
<p>C'est-à-dire : il incombe à celui pour qui l'enfant est né — et qui est le père — <strong>﴾ de les nourrir ﴿</strong>, à savoir la nourriture des mères. <strong>﴾ et de les vêtir ﴿</strong>, à savoir leurs vêtements. <strong>﴾ de manière convenable ﴿</strong>, c'est-à-dire selon ce qui est d'usage pour leurs semblables dans leur pays, à la mesure des moyens (du père), sans gaspillage (excès) ni avarice (privation).</p>
<p>Et le Prophète <span dir="rtl">ﷺ</span> a certes dit :</p>
<p class="ar"><span dir="rtl">«خُذِي مَا يَكْفِيكِ وَوَلَدَكِ بِالْمَعْرُوفِ»</span></p>
<p><em><strong>« Prends ce qui te suffit, à toi et à ton enfant, de manière convenable. »</strong></em> <a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a></p>
<p>⁕ <strong>La preuve concernant l'obligation de l'entretien financier du proche dont celui qui dépense hérite — que ce soit par une part fixe (Fard) ou par l'asabah —</strong> réside dans la parole de Allah le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿وَعَلَى الْوَارِثِ مِثْلُ ذَلِكَ﴾</span> </p>
<p><strong>﴾ Et la même obligation incombe à l'héritier ﴿</strong> [Al-Baqarah: 233].</p>
<p>De plus, il existe entre deux personnes appelées à hériter l'une de l'autre un lien de parenté qui implique que l'héritier a plus de droit sur les biens de celui dont il hérite que le reste des gens. Il convient donc qu'il soit désigné en priorité, à l'exclusion de celui qui n'hérite pas, par l'obligation de maintenir le lien à travers l'entretien financier.</p>
<p>Et dans ce verset, qui est la parole du Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿وَعَلَى الْوَارِثِ مِثْلُ ذَلِكَ﴾</span></p>
<p><strong>﴾ Et la même obligation incombe à l'héritier ﴿</strong></p>
<p>Cela signifie : il incombe à l'héritier de l'enfant — autre que son père (c'est-à-dire celui qui hériterait de cet enfant si ce dernier mourait en laissant des biens) — de dépenser pour cet enfant une charge similaire à celle qui incombait à son père.</p>
<p>Et le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿وَآتِ ذَا الْقُرْبَى حَقَّهُ﴾</span> </p>
<p></p>
<p><strong>﴾ Et donne au proche parent ce qui lui est dû ﴿</strong> [Al-Isrâ: 26].</p>
<p>Ainsi que d'autres preuves démontrant l'obligation de subvenir aux besoins des proches nécessiteux, à la charge de leur parent riche.</p>
<p>⁕ Et Abû Dâwûd a rapporté qu'un homme a demandé au Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">مَنْ أَبَرُّ؟</span></p>
<p><em><strong>« Envers qui dois-je faire preuve de de bonté ? »</strong></em></p>
<p>Il répondit :</p>
<p class="ar"><span dir="rtl">«أُمَّكَ وَأَبَاكَ، وَأُخْتَكَ وَأَخَاكَ»</span></p>
<p><strong><em>« Envers ta mère, ton père, ta sœur et ton frère. »</em></strong> <a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a></p>
<p>Et selon An-Nasâ'î — et Al-Hâkim l'a authentifié — d'après le Hadith de Târiq Al-Muhâribî :</p>
<p class="ar"><span dir="rtl">«وَابْدَأْ بِمَنْ تَعُولُ: أُمَّكَ وَأَبَاكَ، وَأُخْتَكَ وَأَخَاكَ، ثُمَّ أَدْنَاكَ أَدْنَاكَ»</span></p>
<p><strong><em>« Et commence par ceux qui sont à ta charge : ta mère, ton père, ta sœur et ton frère, puis le plus proche, puis le plus proche. »</em></strong> <a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a></p>
<p>Et ce Hadith explique la parole de Allah le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿وَآتِ ذَا الْقُرْبَى حَقَّهُ﴾</span></p>
<p><strong>﴾ Et donne au proche parent ce qui lui est dû ﴿</strong>.</p>
<p>⁕ <strong>Il incombe obligatoirement au père d'assurer l'entretien financier complet de son enfant, de manière exclusive.</strong> La preuve en est la parole du Prophète <span dir="rtl">ﷺ</span> adressée à Hind :</p>
<p class="ar"><span dir="rtl">«خُذِي مَا يَكْفِيكِ وَوَلَدَكِ بِالْمَعْرُوفِ»</span></p>
<p><em><strong>« Prends ce qui te suffit, à toi et à ton enfant, de manière convenable. »</strong></em> <a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a></p>
<p>Ce noble Hadith démontre ainsi que le père est le seul à devoir assumer la charge financière de son enfant. Cela s'ajoute à la parole de Allah le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿وَعَلَى الْمَوْلُودِ لَهُ رِزْقُهُنَّ وَكِسْوَتُهُنَّ بِالْمَعْرُوفِ﴾</span> </p>
<p><strong>﴾ Au père de l'enfant incombe l'obligation de les nourrir et de les vêtir de manière convenable ﴿</strong> [Al-Baqarah: 233],</p>
<p>ainsi que Sa parole :</p>
<blockquote>
<p class="ar"><span dir="rtl">﴿فَإِنْ أَرْضَعْنَ لَكُمْ فَآتُوهُنَّ أُجُورَهُنَّ﴾</span></p>
</blockquote>
<p><strong>﴾ Et si elles allaitent [les enfants] pour vous, donnez-leur leur salaire ﴿</strong> [At-Talâq: 6].</p>
<p>Allah a donc rendu obligatoire la charge financière de l'allaitement pour le père, à l'exclusion de la mère.</p>
<p>⁕ <strong>Quant à la personne pauvre qui a des proches riches parmi lesquels ne figure pas le père ;</strong> ils s'associent alors pour subvenir à ses besoins, chacun à proportion de la part d'héritage qu'il recevrait d'elle. En effet, Allah le Très-Haut a indexé l'obligation d'entretien financier sur l'héritage par Sa parole :</p>
<p class="ar"><span dir="rtl">﴿وَعَلَى الْوَارِثِ مِثْلُ ذَلِكَ﴾</span></p>
<p><strong>﴾ Et la même obligation incombe à l'héritier ﴿</strong> [Al-Baqarah: 233].</p>
<p>Il est donc obligatoire que le montant de la charge financière soit proportionnel à la part d'héritage. Ainsi, pour celui qui a pour seuls parents une grand-mère et un frère germain (de même père et même mère) par exemple : il incombe à la grand-mère un sixième (1/6) de son entretien financier, et le reste incombe au frère germain, car c'est ainsi que tous deux hériteraient de lui ; et prends cela comme modèle pour les autres cas similaires.</p>
<p>⁕ <strong>Quant à l'entretien financier des personnes et animaux à charge (esclaves et bétail) ;</strong> il incombe obligatoirement au maître d'assurer à son esclave la nourriture, le vêtement et le logement de manière convenable, conformément à la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«وَلِلْمَمْلُوكِ طَعَامُهُ وَكِسْوَتُهُ بِالْمَعْرُوفِ، لَا يُكَلَّفُ مِنَ الْعَمَلِ مَا لَا يُطِيقُ»</span></p>
<p><strong><em>« L'esclave a droit à sa nourriture et à ses vêtements de manière convenable, et on ne lui impose pas un travail qui dépasse ses capacités. »</em></strong> Rapporté par Al-Shâfi'î dans son <em>Musnad</em> ainsi que par Muslim <a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a>.</p>
<p>Et il est également rapporté dans les deux recueils authentiques (<em>Al-Bukhârî et Muslim</em>) d'après le Hadith d'Abû Dharr , d'après le Prophète <span dir="rtl">ﷺ</span> qu'il a dit :</p>
<p class="ar"><span dir="rtl">«إِخْوَانُكُمْ خَوَلُكُمْ، جَعَلَهُمُ اللهُ تَحْتَ أَيْدِيكُمْ، فَمَنْ كَانَ أَخُوهُ تَحْتَ يَدِهِ؛ فَلْيُطْعِمْهُ مِمَّا يَأْكُلُ، وَلْيُلْبِسْهُ مِمَّا يَلْبَسُ، وَلَا تُكَلِّفُوهُمْ مَا يَغْلِبُهُمْ»</span></p>
<p><em><strong>« Vos esclaves sont vos frères, Allah les a placés sous votre autorité. Quiconque a son frère sous son autorité, qu'il le nourrisse de ce qu'il mange lui-même, qu'il l'habille de ce qu'il porte lui-même, et ne leur imposez pas de tâches qui les surchargent. »</strong></em> <a href="#fn6" class="footnote-ref" id="fnref6" role="doc-noteref"><sup>6</sup></a></p>
<p>Cela s'ajoute à la parole de Allah le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿قَدْ عَلِمْنَا مَا فَرَضْنَا عَلَيْهِمْ فِي أَزْوَاجِهِمْ وَمَا مَلَكَتْ أَيْمَانُهُمْ﴾</span></p>
<p><strong>﴾ Nous savons bien ce que Nous leur avons imposé au sujet de leurs épouses et des esclaves qu'ils possèdent ﴿</strong> [Al-Ahzâb: 50].</p>
<p>Ces textes constituent ainsi une preuve de l'obligation de l'entretien financier de l'esclave à la charge de son propriétaire.</p>
<p>⁕ <strong>Et si l'esclave (homme) demande à se marier, son maître a l'obligation de le marier ou de le vendre.</strong> Cela repose sur la parole de Allah le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿وَأَنْكِحُوا الْأَيَامَى مِنْكُمْ وَالصَّالِحِينَ مِنْ عِبَادِكُمْ وَإِمَائِكُمْ﴾</span></p>
<p><strong>﴾ Mariez les célibataires d'entre vous et les gens de bien parmi vos esclaves, hommes et femmes ﴿</strong> [An-Nûr: 32].</p>
<p>Or, l'impératif (dans le verset) implique une obligation dès lors que la demande est formulée.</p>
<p>⁕ <strong>Et si c'est une esclave (femme) qui formule cette demande, son maître a le choix entre trois options :</strong> avoir des rapports intimes avec elle , la marier, ou la vendre ; et ce, afin de dissiper le préjudice qu'elle subit.</p>
<p>⁕ <strong>Il incombe obligatoirement à quiconque possède une bête de lui fournir sa nourriture, son abreuvage et tout ce qui contribue à son bien-être.</strong> Cela repose sur la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«عُذِّبَتِ امْرَأَةٌ فِي هِرَّةٍ حَبَسَتْهَا، حَتَّى مَاتَتْ جُوعاً؛ فَلَا هِيَ أَطْعَمَتْهَا، وَلَا هِيَ أَرْسَلَتْهَا تَأْكُلُ مِنْ خَشَاشِ الْأَرْضِ»</span></p>
<p><em><strong>« Une femme a été châtiée à cause d'une chatte qu'elle avait séquestrée jusqu'à ce qu'elle meure de faim. Elle ne l'avait ni nourrie, ni libérée pour qu'elle puisse se nourrir des petites bêtes de la terre. »</strong></em> Rapporté par Al-Bukhârî et Muslim <a href="#fn7" class="footnote-ref" id="fnref7" role="doc-noteref"><sup>7</sup></a>.</p>
<p>Ce Hadith démontre ainsi l'obligation de subvenir aux besoins de l'animal que l'on possède. En effet, la cause de l'entrée de cette femme en Enfer fut le fait d'avoir délaissé la chatte sans subvenir à ses besoins. Et si cela concerne un chat, alors pour les autres animaux placés sous sa propriété, cela s'applique à plus forte raison.</p>
<p>⁕ <strong>Il n'est pas permis au propriétaire de la bête de lui faire transporter une charge qui dépasse ses capacités,</strong> car cela constitue une forme de torture à son encontre.</p>
<p>⁕ <strong>Il ne lui est pas permis non plus de traire de son lait une quantité qui porterait préjudice à son petit (en le privant),</strong> conformément à la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«لَا ضَرَرَ وَلَا ضِرَارَ»</span></p>
<p><em><strong>« Il ne doit y avoir ni préjudice subi, ni préjudice infligé. »</strong></em> <a href="#fn8" class="footnote-ref" id="fnref8" role="doc-noteref"><sup>8</sup></a></p>
<p>⁕ <strong>Il lui est strictement interdit de maudire la bête, de la frapper au visage ou de la marquer au fer rouge sur celui-ci.</strong> Si le propriétaire de la bête devient incapable de subvenir à ses besoins, il est alors contraint de la vendre, de la louer, ou de l'égorger si elle fait partie des animaux dont la viande est consommable. En effet, la maintenir sous sa propriété tout en cessant de l'entretenir constitue une injustice , et l'injustice doit impérativement être éliminée et Allah le Très-Haut est Le plus Savant.</p>
