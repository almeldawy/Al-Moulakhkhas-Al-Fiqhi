<p>⁕ Parmi les empêchements à la garde, il y a l'esclavage. Ainsi, la garde n'est pas accordée à quiconque se trouve dans une condition d'esclavage, même pour une part infime. En effet, la garde est une forme d'autorité juridique (wilāyah), et l'esclave ne fait pas partie des personnes aptes à l'exercer. De plus, il est occupé au service de son maître et sa force de travail appartient à ce dernier.</p>
<p>⁕ La garde n'est pas non plus accordée au pervers (<em>fāsiq</em>), car on ne peut pas lui faire confiance pour l'assurer, et le fait que l'enfant gardé reste auprès de lui représente un préjudice pour ce dernier, puisqu'il l'éduquera mal et l'élèvera selon ses propres mœurs.</p>
<p>⁕ De même, le non-musulman (<em>kāfir</em>) n'a pas le droit de garde sur un musulman, car il est encore plus légitime de l'en priver que le pervers, son préjudice étant plus grand. En effet, il égarerait l'enfant gardé dans sa religion et le ferait sortir de l'Islam en lui enseignant la mécréance et en l'élevant dans celle-ci.</p>
<p>⁕ La garde n'est pas non plus accordée à la femme mariée à un homme étranger à l'enfant gardé, conformément à la parole du Prophète <span dir="rtl">ﷺ</span> adressée à la mère de l'enfant :</p>
<p class="ar"><span dir="rtl">«أَنْتِ أَحَقُّ بِهِ مَا لَمْ تَنْكِحِي»</span></p>
<p><em><strong>« Tu es la plus en droit de l'avoir tant que tu ne te maries pas. »</strong></em> <a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a></p>
<p>De plus, le mari dispose du temps et des services de son épouse, et il est en droit de lui interdire d'exercer la garde. Par "étranger", on entend ici celui qui ne fait pas partie des parents agnats (parents du côté paternel) de l'enfant. Par conséquent, si elle se marie avec un parent [agnat] de son enfant gardé, son droit de garde ne s'annule pas.</p>
<p>⁕ Si l'un de ces empêchements vient à disparaître — comme l'affranchissement de l'esclave, le repentir du pervers, la conversion à l'Islam du mécréant, ou le divorce de la femme mariée —, celui de ces individus pour qui l'empêchement a cessé recouvre alors son droit à la garde de l'enfant (Al-Hadânah) ; et ce, en raison de la présence de la cause de ce droit et de la disparition de son empêchement.</p>
<p>⁕ Et si l'un des parents de l'enfant gardé souhaite entreprendre un long voyage, sans intention de causer un tort, vers une contrée lointaine pour s'y installer, alors que la destination et la route sont sûres, la garde revient alors au père, qu'il soit celui qui voyage ou celui qui reste résident. En effet, c'est lui qui se charge de l'éducation (l'instruction) de son enfant et de sa protection. Dès lors, s'il se trouve éloigné de lui, il ne sera plus en mesure de le faire, et l'enfant sera délaissé.</p>
<p>⁕ Si le voyage se fait vers une localité proche, à une distance inférieure à celle permettant le raccourcissement des prières (Massâfat al-Qasr), dans le but d'y résider, la garde revient alors à la mère, qu'elle soit celle qui voyage ou celle qui reste résidente. Car elle éprouve une compassion plus complète envers l'enfant gardé, et parce qu'il reste possible pour son père de le superviser dans cette situation.</p>
<p>⁕ Quant au cas où le voyage est entrepris pour un besoin ponctuel, après lequel le voyageur retourne [chez lui], ou bien si la route ou la contrée de destination s'avèrent dangereuses, la garde revient alors à celui des deux parents qui réside (qui ne voyage pas). En effet, le fait de voyager avec l'enfant gardé dans ces deux situations lui causerait un préjudice.</p>
<p>L'Imam Ibn al-Qayyim <a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a> — qu'Allah lui fasse miséricorde — a dit : <em>"Si [le père] cherche à nuire et à user de ruse pour faire déchoir la mère de son droit de garde, en voyageant afin que l'enfant le suive, cette ruse est alors en totale contradiction avec l'objectif du Législateur. En effet, Celui-ci a considéré la mère comme prioritaire vis-à-vis de l'enfant par rapport au père en cas de proximité des demeures et de possibilité de se rencontrer à tout moment..."</em></p>
<p>Jusqu'à ce qu'il dise : <em>"Et il a informé (c'est-à-dire le Prophète <span dir="rtl">ﷺ</span>) que quiconque sépare une mère de son enfant, Allah le séparera de ses êtres chers le Jour de la Résurrection. Il a également interdit que l'on vende la mère sans son enfant, ou l'enfant sans sa mère, même s'ils se trouvent dans la même localité. Dès lors, comment peut-il être permis, malgré cela, de ruser pour séparer une mère de son enfant, d'une séparation rendant sa vue et sa rencontre difficiles, et rendant son deuil et sa perte insupportables pour elle ? Cela relève de la plus pure absurdité ! Au contraire, le jugement d'Allah et de Son Messager est plus digne d'être suivi : l'enfant revient à la mère, que le père voyage ou qu'il réside. Le Prophète <span dir="rtl">ﷺ</span> a dit : « Tu es la plus en droit de le garder tant que tu ne te remaries pas »</em><a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a> <em>. Comment peut-on alors dire : 'Tu es la plus en droit de le garder tant que le père ne voyage pas' ? Où trouve-t-on cela dans le Livre d'Allah, dans la Sunnah de Son Messager <span dir="rtl">ﷺ</span>, dans les avis juridiques (fatawa) de ses Compagnons ou encore dans une analogie authentique ? Il n'y a là ni texte explicite (Nass), ni analogie (Qiyas), ni intérêt public (Maslahah)."</em> Fin de citation.</p>
<p>⁕ Quant au choix laissé au jeune garçon (Al-Ghulam) entre ses deux parents, il intervient lorsqu'il atteint l'âge de sept ans. Ainsi, lorsqu'il a atteint sept ans et qu'il est doué de raison, on lui donne le choix entre ses deux parents, et il demeure auprès de celui qu'il choisit parmi eux. 'Umar et 'Alî — qu'Allah les agrée tous deux — ont ainsi jugé.</p>
<p>De plus, At-Tirmidhî et d'autres ont rapporté d'après un hadith d'Abû Hurayrah — qu'Allah l'agrée — qui a dit : Une femme vint trouver le Prophète <span dir="rtl">ﷺ</span> et dit : <em><strong>"Mon mari veut s'en aller avec mon fils."</strong></em> Le Prophète <span dir="rtl">ﷺ</span> dit alors : <em><strong>« Ô jeune garçon ! Voici ton père et voici ta mère ; prends donc la main de celui des deux que tu veux. »</strong></em> Il prit alors la main de sa mère, et elle repartit avec lui <a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a>.</p>
<p>Ce hadith démontre donc que lorsque le jeune garçon devient autonome, on lui donne le choix entre ses deux parents. En effet, lorsqu'il atteint un âge où il est capable de s'exprimer de lui-même et qu'il penche vers l'un de ses deux parents, cela prouve que ce parent est plus doux et plus compatissant envers lui ; c'est pourquoi ce dernier est prioritaire.</p>
<p>⁕ <strong>Et on ne lui donne le choix qu'à deux conditions :</strong></p>
<p><strong>La première :</strong> Que les deux parents fassent partie des gens éligibles à la garde (c'est-à-dire qu'ils remplissent les conditions juridiques requises).</p>
<p><strong>La deuxième :</strong> Que le jeune garçon soit doué de raison. S'il souffre d'une déficience mentale (idiotie/démence), il demeure alors auprès de la mère ; car elle est plus compatissante envers lui et plus à même de veiller sur ses intérêts.</p>
<p>⁕ Et si le jeune garçon doué de raison choisit son père, il reste auprès de lui nuit et jour, afin que celui-ci le protège, l'instruise et l'éduque. Cependant, [le père] ne doit pas l'empêcher de visiter sa mère, car l'en priver reviendrait à l'élever dans l'ingratitude filiale (Al-'Uqûq) et la rupture des liens de parenté.</p>
<p>S'il choisit sa mère, il demeure auprès d'elle la nuit, et auprès de son père le jour, afin que ce dernier l'instruise et l'éduque.</p>
<p>Enfin, s'il ne choisit aucun des deux, on procède alors à un tirage au sort (Al-Qur'ah) entre eux ; car l'un ne possède aucun privilège sur l'autre si ce n'est par le biais du tirage au sort.</p>
<p>⁕ Et la fille, lorsqu'elle a atteint l'âge de sept ans, reste auprès de son père jusqu'à ce que son époux la prenne avec lui (au moment du mariage). En effet, [le père] est plus à même de veiller sur elle et il est plus en droit de détenir sa tutelle (Wilâyah) que quiconque d'autre. Cependant, on ne doit pas interdire à la mère de lui rendre visite tant que cela ne présente aucun inconvénient (ou danger). Mais si le père s'avère incapable de veiller sur la fillette, ou s'il ne s'en soucie guère en raison de ses occupations ou de son manque de religiosité, alors que la mère possède les aptitudes pour la préserver, la fillette reste dans ce cas auprès de sa mère.</p>
<p>Cheikh Al-Islam Ibn Taymiyyah <a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a>— qu'Allah lui fasse miséricorde — a dit : <em>"Certes, [l'Imam] Ahmad et ses compagnons ne donnent la priorité au père que si cela ne cause aucun préjudice à la fille. Ainsi, si l'on suppose qu'il est incapable de la préserver et de la protéger, et qu'il la délaisse en raison de ses occupations professionnelles ou autres, alors que la mère s'applique à la préserver et à la protéger, c'est elle qui est prioritaire dans ce cas de figure. Par conséquent, s'il y a un risque de perversion ou de dégradation de la situation de la fille chez l'un des deux parents, l'autre devient indubitablement le plus en droit de la garder."</em></p>
<p>Et il a dit <a href="#fn6" class="footnote-ref" id="fnref6" role="doc-noteref"><sup>6</sup></a> — qu'Allah lui fasse miséricorde — : <em>"Et si l'on suppose que le père s'est marié avec une autre femme (une co-épouse), et qu'il laisse la fillette chez cette co-épouse de sa mère, laquelle n'agit pas dans l'intérêt de l'enfant mais lui nuit au contraire et néglige ses intérêts, alors que sa propre mère agit pour son bien et ne lui cause aucun tort ; la garde revient alors ici à la mère, de manière catégorique."</em> Fin de citation. Et Allah est Le plus Savant.</p>
