<p>⁕ « <em>Al-Hadânah</em> » (la garde) est dérivé du mot « <em>Al-Hidn</em> », qui signifie le flanc (ou la poitrine) ; car l'éducateur serre l'enfant contre son flanc. Et « <em>Al-Hâdinah</em> » désigne la nourrice (ou l'éducatrice). Tel est son sens sur le plan linguistique.</p>
<p>Quant à sa signification dans la législation islamique , elle consiste à préserver l'enfant en bas âge — ou toute personne se trouvant dans une situation similaire — de ce qui peut lui nuire, et à veiller à son éducation en œuvrant pour ses intérêts physiques et moraux.</p>
<p>⁕ Et la sagesse qui sous-tend cette législation est évidente. En effet, le petit enfant, ainsi que quiconque partage son statut parmi ceux qui ne discernent pas leurs propres intérêts — à l'instar du fou ou du déficient mental —, ont besoin de quelqu'un pour les prendre en charge, veiller sur eux en leur apportant ce qui leur est bénéfique, en écartant d'eux les préjudices, et en leur assurant une éducation saine.</p>
<p>⁕ C'est pourquoi notre législation est venue instaurer le droit de garde (<em>Al-Hadânah</em>) pour ces catégories de personnes, par miséricorde à leur égard, pour veiller sur leurs affaires et par bienfaisance envers elles. Car s’ils étaient livrés à eux-mêmes, ils s’égareraient et subiraient des préjudices. Notre religion est celle de la miséricorde, de la solidarité mutuelle et du réconfort ; elle interdit de les délaisser et rend obligatoire leur prise en charge (<em>Kafâlah</em>). La garde est ainsi un droit pour l'enfant gardé (<em>Al-Mahdûn</em>) vis-à-vis de ses proches, et un droit pour le gardien (<em>Al-Hâdin</em>) de diriger les affaires de son parent, au même titre que les autres formes de tutelles légales.</p>
<p>⁕ Et elle (la garde) revient de droit aux personnes chargées de la garde selon un ordre de priorité établi :</p>
<p>⁃ Ainsi, la personne qui a le plus de droit à la garde de l'enfant est la mère.</p>
<p>L'Imam Muwaffaq ad-Dîn Ibn Qudâmah <a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a>— qu'Allah lui fasse miséricorde — a dit : <em>« Lorsque les deux époux se séparent et qu'ils ont un enfant en bas âge ou un déficient mental, sa mère est alors la personne la plus en droit de sa prise en charge (garde) si elle remplit toutes les conditions requises, qu'il s'agisse d'un garçon ou d'une fille. C'est l'avis de Mâlik et des gens de l'avis (les Hanafites), et nous ne connaissons personne qui les ait contredits. »</em> Fin de citation.</p>
<p>⁃ Si la mère se marie, la garde est alors transférée d'elle à une autre personne et son droit à la garde tombe, en raison de la parole du Messager d'Allah <span dir="rtl">ﷺ</span> lorsqu'une femme vint à lui et dit : <em><strong>« Ô Messager d'Allah ! Certes, mon fils que voici, mon ventre lui a servi de récipient, mon sein de gourde pour s'abreuver, et mon giron de refuge. Et voilà que son père m'a divorcée et veut me l'arracher ? »</strong></em> Il dit alors :</p>
<p class="ar"><span dir="rtl">«أَنْتِ أَحَقُّ بِهِ مَا لَمْ تَنْكِحِي»</span></p>
<p><em><strong>« Tu es la plus en droit de le garder tant que tu ne te remaries pas. »</strong></em> Rapporté par Ahmad, Abû Dâwûd et Al-Hâkim <a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a>, qui l'a authentifié. Ce hadith prouve donc que la mère est la plus en droit de la garde de son enfant si son père la divorce et veut le lui retirer, et que si elle se marie, son droit à la garde tombe.</p>
<p>Et la priorité donnée à la mère pour la garde de son enfant s'explique par le fait qu'elle est plus tendre (compatissante) envers lui et plus proche de lui. Nul ne partage avec elle cette proximité si ce n'est son père, mais il n'a pas la même tendresse qu'elle et n'assume pas la garde par lui-même, il ne ferait que le confier à sa femme (la belle-mère) ; or, sa mère est plus en droit de le garder que la femme de son père. Et Ibn ‘Abbâs a dit à un homme : <em><strong>« Son odeur, sa couche et son giron valent mieux pour lui que toi, jusqu'à ce qu'il grandisse et choisisse pour lui-même. »</strong></em></p>
<p>Cheikh Al-Islam Ibn Taymiyyah — qu'Allah lui fasse miséricorde — a dit <a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a> : <em>« La mère est plus apte que le père, car elle est plus proche du petit enfant, plus expérimentée dans sa nutrition, la façon de le porter et de le faire dormir, et plus savante et miséricordieuse envers lui. Elle est donc plus capable, plus avertie et plus patiente dans ce domaine ; elle est ainsi désignée par la Législation comme une obligation pour l'enfant qui n'a pas encore atteint l'âge de discernement. »</em> Fin de citation.</p>
<p>⁃ Puis, après la perte du droit de la mère à la garde, celle-ci est transférée à ses mères à elle (les mères de la mère), qui sont les grands-mères maternelles de l'enfant, de la plus proche à la plus proche. Cela s'explique par le fait qu'elles ont le même statut que la mère, leur propre maternité étant avérée, et que leur tendresse envers l'enfant gardé est plus parfaite que celle de toute autre personne.</p>
<p>⁃ Puis, après les grands-mères du côté maternel, la garde est transférée au père de l'enfant ; car il est l'origine de la filiation, le plus proche parmi les autres parents restants, et celui dont la tendresse est la plus complète [parmi eux] ; il est donc prioritaire par rapport aux autres.</p>
<p>⁃ Puis, après la perte du droit du père à la garde, celle-ci est transférée aux mères du père — c'est-à-dire les grands-mères paternelles, de la plus proche à la plus proche — ; car elles sont liées à l'enfant par un parent agnat (<em>‘Asabah</em>) proche. Et elles ont priorité sur le grand-père, car le fait d'être une femme, à degré d'égalité égal, implique la prépondérance ; tout comme la mère a été préférée au père.</p>
<p>⁃ Puis, après la perte du droit à la garde des grands-mères du côté paternel, elle est transférée au grand-père paternel, du plus proche au plus proche ; car il a le même statut que le père de l'enfant gardé, il occupe donc sa place.</p>
<p>⁃ Puis, après le grand-père, la garde est transférée aux mères du grand-père, de la plus proche à la plus proche ; car elles sont liées [à l'enfant] par le grand-père, et en raison de leur qualité de génitrices ; l'enfant gardé fait ainsi partie d'elles (il est un morceau d'elles).</p>
<p>⁃ Puis, après les mères du grand-père, la garde est transférée aux sœurs de l'enfant gardé ; car elles sont liées à lui par ses deux parents ou par l'un d'eux. Ainsi, la sœur germaine (de même père et même mère) passe en premier en raison de la force de sa parenté et de sa priorité dans l'héritage. Ensuite vient la sœur utérine (de même mère), car son lien passe par la maternité, et la mère est prioritaire sur le père. Puis vient la sœur consanguine (de même père).</p>
<p>Et il a été dit : il est préférable de faire passer la sœur consanguine avant la sœur utérine, car la tutelle revient au père, et qu'elle est plus forte dans l'héritage, du fait qu'elle y remplace la sœur germaine en son absence ; et cet avis est tout à fait pertinent (fondé).</p>
<p>⁃ Puis, après les sœurs, la garde est transférée aux tantes maternelles ; car les tantes maternelles sont liées à l'enfant par la mère, et en raison de ce qui est rapporté dans les « Deux Sahîhs » [Al-Bukhârî et Muslim] : le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="rtl">«الْخَالَةُ بِمَنْزِلَةِ الْأُمِّ»</span></p>
<p><em><strong>« La tante maternelle a le statut de la mère »</strong></em> <a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a>.</p>
<p>Et l'on donne la priorité à la tante maternelle germaine (sœur de la mère de même père et même mère), puis à la tante maternelle consanguine (sœur de la mère de même père) ; à l'instar de ce qui s'applique pour les sœurs.</p>
<p>⁃ Puis, après les tantes maternelles, la garde est transférée aux tantes paternelles ; car elles sont liées [à l'enfant] par le père, or ce dernier vient après la mère (dans l'ordre de priorité).</p>
<p>Cheikh Al-Islam Ibn Taymiyyah <a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a> — qu'Allah lui fasse miséricorde — a dit : <em>« La tante paternelle a plus de droit que la tante maternelle, tout comme les femmes (les parentes) du père ont plus de droit et priment sur les parentes de la mère ; car la tutelle légale (Al-Wilâyah) appartient au père, de même qu'à ses proches. La mère n'a eu la priorité sur le père que parce que personne d'autre, dans ce domaine, ne peut la remplacer pour accomplir l'intérêt de l'enfant. Et si le Législateur (le Prophète) a donné la priorité à la tante maternelle de la fille de Hamzah sur sa tante paternelle Safiyyah, c'est uniquement parce que Safiyyah ne l'avait pas réclamée, tandis que Ja‘far l'a réclamée en tant que représentant de sa tante maternelle (son épouse), il a donc statué en sa faveur pour la garde en son absence (à Safiyyah). »</em></p>
<p>Et il a dit <a href="#fn6" class="footnote-ref" id="fnref6" role="doc-noteref"><sup>6</sup></a> — qu'Allah lui fasse miséricorde — : <em>« L'ensemble des fondements de la Législation donne la priorité aux proches du père sur les proches de la mère. Par conséquent, quiconque leur donne la priorité (aux parentes de la mère) dans la garde a contredit les fondements et la Législation. »</em> Fin de citation.</p>
<p>⁃ Puis, après les tantes paternelles, la garde est transférée aux filles des frères (les nièces par le frère).</p>
<p>⁃ Puis, après elles, aux filles des sœurs (les nièces par la sœur).</p>
<p>⁃ Puis, après les filles des frères et les filles des sœurs, la garde est transférée aux filles des oncles paternels (les cousines paternelles).</p>
<p>⁃ Puis, aux filles des tantes paternelles (les cousines par la tante paternelle).</p>
<p>⁃ Puis, après elles, la garde est transférée au reste des parents agnats (<em>‘Asabah</em>), du plus proche au plus proche : les frères, puis leurs fils, puis les oncles paternels, puis leurs fils.</p>
<p>⁃ Et si l'enfant gardé est de sexe féminin (une fille), il est alors conditionné que le gardien fasse partie de ses hommes qui sont ses <em>Mahârim</em>. S'il n'est pas un <em>Mahram</em>, il doit alors la confier à une femme de confiance qu'il choisira.</p>
