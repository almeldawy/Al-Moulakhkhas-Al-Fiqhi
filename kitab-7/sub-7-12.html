<p>⁕ Le Salam ou le Salaf : consiste à avancer le prix et à reporter la livraison de la marchandise. Les juristes (Fuqahâ) – qu'Allah leur fasse miséricorde – le définissent comme étant : un contrat portant sur une marchandise décrite de manière précise, à livrer ultérieurement à une échéance fixée, en contrepartie d'un prix payé au comptant (perçu) sur le lieu même de la conclusion du contrat.</p>
<p>⁕ Ce type de transaction est autorisé par le Livre (le Coran), la Sunnah et le consensus (Al-Ijmâ') :</p>
<h3 id="allah-le-très-haut-a-dit">- Allah le Très-Haut a dit : </h3>
<h3 id="يأيها-ٱلذين-ءامنوا-إذا-تداينتم-بدين-إلى-أجل-مسمى-فٱكتبوه-البقرة-٢٨٢"><strong><span dir="rtl">﴿يَٰأَيُّهَا ٱلَّذِينَ ءَامَنُوٓاْ إِذَا تَدَايَنتُم بِدَيْنٍ إِلَىٰٓ أَجَلٍ مُّسَمًّى فَٱكْتُبُوهُ﴾ [البقرة: ٢٨٢]</span></strong></h3>
<h3 id="ô-les-croyants-quand-vous-contractez-une-dette-à-échéance-déterminée-mettez-la-par-écrit.-sourate-al-baqarah-282."><em><strong>{Ô les croyants ! Quand vous contractez une dette à échéance déterminée, mettez-la par écrit.}</strong></em> [Sourate Al-Baqarah : 282].</h3>
<h3 id="ibn-abbâs-quallah-lagrée-lui-et-son-père-a-dit">Ibn 'Abbâs – qu'Allah l'agrée, lui et son père – a dit : </h3>
<h3 id="أشهد-أن-السلف-المضمون-إلى-أجل-مسمى-قد-أحله-الله-في-كتابه-وأذن-فيه-ثم-قرأ-هذه-الآية."><strong><span dir="rtl">«أَشْهَدُ أَنَّ السَّلَفَ الْمَضْمُونَ إِلَىٰ أَجَلٍ مُسَمًّى قَدْ أَحَلَّهُ اللهُ فِي كِتَابِهِ وَأَذِنَ فِيهِ»، ثُمَّ قَرَأَ هَٰذِهِ الْآيَةَ.</span></strong></h3>
<h3 id="je-témoigne-quallah-a-rendu-licite-la-vente-à-terme-al-salaf-garantie-jusquà-une-échéance-déterminée-dans-son-livre-et-quil-la-autorisée-puis-il-récita-ce-verset."><em><strong>« Je témoigne qu'Allah a rendu licite la vente à terme (Al-Salaf) garantie jusqu'à une échéance déterminée dans Son Livre et qu'Il l'a autorisée »</strong></em>, puis il récita ce verset.</h3>
<h3 id="lorsque-le-prophète-ﷺ-arriva-à-médine-les-habitants-payaient-à-lavance-pour-des-récoltes-de-dattes-un-deux-ou-trois-ans-avant-la-livraison.-il-dit-alors">- Lorsque le Prophète <span dir="rtl">ﷺ</span> arriva à Médine, les habitants payaient à l'avance pour des récoltes de dattes un, deux ou trois ans avant la livraison. Il dit alors : </h3>
<h3 id="من-أسلف-في-شيء-وفي-لفظ-في-تمر-فليسلف-في-كيل-معلوم-ووزن-معلوم-إلى-أجل-معلوم"><strong><span dir="rtl">«مَنْ أَسْلَفَ فِي شَيْءٍ (وَفِي لَفْظٍ: فِي تَمْرٍ)؛ فَلْيُسْلِفْ فِي كَيْلٍ مَعْلُومٍ وَوَزْنٍ مَعْلُومٍ إِلَىٰ أَجَلٍ مَعْلُومٍ»</span></strong></h3>
<h3 id="quiconque-paie-à-lavance-pour-une-chose-et-dans-une-autre-version-pour-des-dattes-quil-le-fasse-pour-une-mesure-déterminée-un-poids-déterminé-et-jusquà-un-terme-déterminé.-rapporté-de-concert-par-al-bukhârî-et-muslim."><em><strong>« Quiconque paie à l'avance pour une chose (et dans une autre version : pour des dattes), qu'il le fasse pour une mesure déterminée, un poids déterminé et jusqu'à un terme déterminé. »</strong></em> [Rapporté de concert par Al-Bukhârî et Muslim]. <a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a></h3>
<h3 id="ce-hadith-prouve-donc-la-permission-de-la-vente-à-terme-al-salam-sous-le-respect-de-ces-conditions.">Ce hadith prouve donc la permission de la vente à terme (Al-Salam) sous le respect de ces conditions.</h3>
<h3 id="ibn-al-mundhir-ainsi-que-dautres-savants-ont-rapporté-le-consensus-des-savants-sur-sa-légitimité.">- Ibn Al-Mundhir, ainsi que d'autres savants, ont rapporté le consensus des savants sur sa légitimité.</h3>
<h3 id="de-plus-les-gens-en-ont-un-réel-besoin-car-lun-des-deux-contractants-tire-profit-de-la-perception-immédiate-du-prix-le-capital-tandis-que-lautre-tire-profit-du-prix-avantageux-plus-bas-de-la-marchandise.">De plus, les gens en ont un réel besoin, car l'un des deux contractants tire profit de la perception immédiate du prix (le capital), tandis que l'autre tire profit du prix avantageux (plus bas) de la marchandise.</h3>
<p>⁕ Et il est exigé, pour la validité de la vente à terme (Al-Salam), des conditions particulières qui s'ajoutent aux conditions générales de la vente :</p>
<p><strong>La première condition :</strong> La possibilité de définir et de préciser rigoureusement les caractéristiques de la marchandise faisant l'objet du contrat. En effet, ce dont les caractéristiques ne peuvent être définies avec précision varie énormément, ce qui mènerait inévitablement à un litige entre les deux parties. Ainsi, le Salam n'est pas valable pour les choses dont les caractéristiques divergent de manière incontrôlable, comme les légumes (légumineuses), les peaux (cuirs), les récipients de formes diverses et les pierres précieuses (joyaux).</p>
<p><strong>La deuxième condition :</strong> La mention du genre (la catégorie) de la marchandise et de sa variété. Le genre correspond par exemple au blé, et la variété au blé de type "Salmûnî" par exemple, qui est une variété de blé particulière.</p>
<p><strong>La troisième condition :</strong> La mention de la quantité de la marchandise, que ce soit par la mesure (de capacité), par le poids ou par la longueur (la coudée). Cela se base sur la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><strong><span dir="rtl">«مَنْ أَسْلَفَ فِي شَيْءٍ؛ فَلْيُسْلِفْ فِي كَيْلٍ مَعْلُومٍ وَوَزْنٍ مَعْلُومٍ إِلَىٰ أَجَلٍ مَعْلُومٍ»</span></strong></p>
<p><em><strong>« Quiconque paie à l'avance pour une chose, qu'il le fasse pour une mesure déterminée, un poids déterminé et jusqu'à un terme déterminé. »</strong></em> [Rapporté de concert par Al-Bukhârî et Muslim] <a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a>.</p>
<p>De plus, si la quantité de la marchandise est inconnue, son acquittement (sa livraison correcte) devient impossible.</p>
<p><strong>La quatrième condition :</strong> La mention d'une échéance (un terme) bien déterminée. Cela s'appuie sur la parole du Prophète <span dir="rtl">ﷺ</span> : <em><strong>« ...jusqu'à un terme déterminé »</strong></em> , ainsi que sur la parole d'Allah le Très-Haut :</p>
<p class="ar"><strong><span dir="rtl">﴿يَٰأَيُّهَا ٱلَّذِينَ ءَامَنُوٓاْ إِذَا تَدَايَنتُم بِدَيْنٍ إِلَىٰٓ أَجَلٍ مُّسَمًّى فَٱكْتُبُوهُ﴾ [البقرة: ٢٨٢]</span></strong></p>
<p><em><strong>{Ô les croyants ! Quand vous contractez une dette à échéance déterminée, mettez-la par écrit.}</strong></em> [Sourate Al-Baqarah : 282].</p>
<p>Ce noble verset ainsi que le noble hadith prouvent l'obligation d'inclure un délai dans la vente à terme (Al-Salam), et de définir cette échéance de manière précise et connue des deux parties.</p>
<p><strong>La cinquième condition :</strong> Que la marchandise faisant l'objet du contrat soit généralement disponible au moment de l'échéance fixée, afin que sa livraison soit possible en temps voulu. Si la marchandise est indisponible au moment de l'échéance, la vente à terme (Al-Salam) n'est pas valable. C'est le cas, par exemple, si une personne conclut un contrat de Salam pour des dattes fraîches (Rutab) ou des raisins à livrer en hiver.</p>
<p><strong>La Sixième condition :</strong> Percevoir l'intégralité du prix, dont le montant doit être connu, sur le lieu même de la conclusion du contrat (Majlis al-'Aqd). Cela s'appuie sur la parole du Prophète <span dir="rtl">ﷺ</span> : <em><strong>« Quiconque paie à l'avance pour une chose, qu'il le fasse pour une mesure déterminée... »</strong></em> jusqu'à la fin du hadith ; c'est-à-dire : qu'il donne (le prix).</p>
<p>L'Imam Ach-Châfi'î – qu'Allah lui fasse miséricorde – a dit : « <em>Car l'appellation de "Salaf" (vente à terme) ne s'applique pas tant que l'acheteur n'a pas donné l'avance financière à son vendeur avant de se séparer de lui. De plus, si le vendeur ne perçoit pas le prix au comptant sur le lieu du contrat, cela se transforme en une vente d'une créance contre une autre créance (vente de dette contre dette), et cela est interdit.</em> »</p>
<p><strong>La septième condition :</strong> Que la marchandise faisant l'objet du contrat (Al-Muslam fîh) ne soit pas une chose individualisée (spécifique), mais plutôt une dette (une obligation descriptive) à la charge du vendeur. Ainsi, la vente à terme (Al-Salam) n'est pas valable si elle porte sur une maison bien précise ou un arbre bien précis, car un bien individualisé peut périr avant sa livraison, ce qui annulerait l'objectif du contrat. L'acquittement et la livraison de la marchandise doivent se faire sur le lieu de conclusion du contrat, si celui-ci s'y prête. S'il ne s'y prête pas – comme s'ils concluaient le contrat dans le désert ou en mer –, il est alors obligatoire de mentionner le lieu de la livraison. Dès lors que les deux parties s'accordent sur un lieu de livraison, cela est permis. En cas de désaccord, on se réfère au lieu de conclusion du contrat si celui-ci s'y prête, comme mentionné précédemment.</p>
<p>⁕ Parmi les règles de la vente à terme (Al-Salam), il y a le fait qu'il est interdit de revendre la marchandise faisant l'objet du contrat avant de l'avoir effectivement réceptionnée (prise de possession). Cela est dû à l'interdiction prononcée par le Prophète <span dir="rtl">ﷺ</span> de vendre de la nourriture avant de l'avoir réceptionnée. De même, le transfert de créance (Al-Hawâlah) sur cette marchandise n'est pas valable, car le transfert de créance ne s'applique que sur une dette stable et définitive, alors que le contrat de Salam est exposé à un risque d'annulation.</p>
<p>⁕ Parmi les règles de la vente à terme (Al-Salam), si la marchandise se trouve indisponible au moment de l'échéance fixée – comme si une personne avait conclu un Salam pour des fruits, mais que les arbres n'avaient rien produit cette année-là –, l'acheteur (Rabb al-Salam) a le choix : soit il patiente jusqu'à ce que la marchandise devienne disponible pour l'exiger, soit il choisit de résilier le contrat et de réclamer son capital d'origine. En effet, lorsque le contrat est annulé, la restitution du prix devient obligatoire ; et si l'argent du prix a été dépensé ou détruit, le vendeur doit lui restituer son équivalent. Et Allah est Le plus Savant.</p>
<p>La permission de cette transaction illustre parfaitement la fluidité et la tolérance de la législation islamique (la Sharî'ah). En effet, cette transaction facilite grandement la vie des gens et répond à leurs intérêts, tout en étant totalement exempte d'usure (Riba) et de toute autre interdiction. Louange à Allah pour Sa facilité.</p>
