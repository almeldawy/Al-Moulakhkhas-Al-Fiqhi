<p>⁕ <strong>Le gage (Ar-Rahn) au sens linguistique :</strong> désigne la fixité, la stabilité et la permanence. On dit par exemple : « une eau <em>râhin</em> », c'est-à-dire : une eau stagnante (immobile).</p>
<p><strong>Le gage (Ar-Rahn) au sens juridique (religieux) :</strong> C'est la sécurisation d'une dette par un bien matériel (un actif) permettant de s'acquitter de cette dette à partir de ce bien lui-même ou de sa valeur (son prix de vente) ; c'est-à-dire : le fait de placer un bien de valeur financière comme garantie pour une dette.</p>
<p>⁕ Le gage (Ar-Rahn) est autorisé (permis) selon le Livre (le Coran), la Sunnah et le consensus (Al-Ijmâ').</p>
<p><strong>- Allah Le Très-Haut a dit :</strong></p>
<p class="ar"><strong><span dir="rtl">﴿وَإِن كُنتُمْ عَلَىٰ سَفَرٍ وَلَمْ تَجِدُوا كَاتِبًا فَرِهَانٌ مَّقْبُوضَةٌ﴾ [البقرة: ٢٨٣]</span></strong></p>
<p><em><strong>« Et si vous êtes en voyage et ne trouvez pas de scribe, un gage reçu suffira. »</strong></em> [Sourate Al-Baqarah, verset 283].</p>
<p><strong>- Le Prophète <span dir="rtl">ﷺ</span> est certes mort alors que sa cotte de mailles était laissée en gage</strong> <a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a><strong>.</strong></p>
<p><strong>-</strong> Les savants ont convergé de manière unanime (consensus) sur la permission du gage durant le voyage, et la majorité d'entre eux (Al-Jumhûr) l'a également autorisé en état de résidence (lorsqu'on n'est pas en voyage).</p>
<p>⁕ La sagesse derrière sa légifération (le gage) réside dans la préservation des biens et la protection contre leur perte.</p>
<p><strong>Certes, Allah a ordonné de sécuriser la dette par l'écrit ; Le Très-Haut a dit :</strong></p>
<p class="ar"><strong><span dir="rtl">﴿يَٰأَيُّهَا ٱلَّذِينَ ءَامَنُواْ إِذَا تَدَايَنتُم بِدَيْنٍ إِلَىٰٓ أَجَلٍ مُّسَمًّى فَٱكْتُبُوهُ...﴾</span></strong> <span dir="rtl">[البقرة: ٢٨٢] إِلَى قَوْلِهِ تَعَالَى:</span> <strong><span dir="rtl">﴿وَإِن كُنتُمْ عَلَىٰ سَفَرٍ وَلَمْ تَجِدُواْ كَاتِبًا فَرِهَٰنٌ مَّقْبُوضَةٌ﴾</span></strong> <span dir="rtl">[البقرة: ٢٨٣].</span></p>
<p><em><strong>« Ô les croyants ! Quand vous contractez une dette à terme fixé, écrivez-la... »</strong></em> [Sourate Al-Baqarah, verset 282] jusqu'à Sa parole, Le Très-Haut : <em><strong>« Et si vous êtes en voyage et ne trouvez pas de scribe, un gage reçu suffira. »</strong></em> [Sourate Al-Baqarah, verset 283].</p>
<p>Et cela relève de la miséricorde d'Allah envers Ses serviteurs, car Il les guide vers ce qui contient leur propre bien (leur intérêt).</p>
<p>⁕ Et il est exigé, pour la validité du gage (Ar-Rahn), la connaissance de sa quantité (sa valeur/mesure), de sa nature (son genre) et de ses caractéristiques (sa description). De même, il est requis que le déposant du gage (le débiteur / Ar-Râhin) soit juridiquement apte à disposer de ses biens, qu'il soit propriétaire du bien mis en gage, ou qu'il ait reçu l'autorisation de l'utiliser à cette fin.</p>
<p>⁕ Et il est permis à une personne de mettre en gage son propre bien en garantie de la dette d'autrui.</p>
<p>⁕ Et il est exigé, concernant le bien mis en gage (l'actif consenti), qu'il fasse partie des choses dont la vente est licite (valide) ; afin qu'il soit possible de s'acquitter [du droit de créance] à partir de ce gage.</p>
<p>⁕ Et il est valide de stipuler la condition du gage au cœur même du contrat (au moment de sa conclusion), tout comme cela est valide après le contrat ; en raison de la parole d'Allah Le Très-Haut :</p>
<p class="ar"><strong><span dir="rtl">﴿وَإِن كُنتُمْ عَلَىٰ سَفَرٍ وَلَمْ تَجِدُوا كَاتِبًا فَرِهَانٌ مَّقْبُوضَةٌ﴾ [البقرة: ٢٨٣]</span></strong></p>
<p><em><strong>« Et si vous êtes en voyage et ne trouvez pas de scribe, un gage reçu suffira. »</strong></em> [Sourate Al-Baqarah, verset 283].</p>
<p>Allah — Gloire et Pureté à Lui — a ainsi institué le gage comme un substitut à l'écrit, or l'écriture n'intervient qu'après l'établissement effectif (l'exigibilité) du droit.</p>
<p>⁕ Et le contrat de gage est contraignant (irrévocable) du côté du déposant du gage (le débiteur / Ar-Râhin) uniquement ; car l'avantage (la protection) de ce contrat revient à autrui (au créancier), il est donc devenu obligatoire de son côté à lui.</p>
<p><strong>En revanche, il n'est pas contraignant du côté du bénéficiaire du gage (le créancier / Al-Murtahin) ;</strong> il a donc le droit de l'annuler (de le révoquer), car l'avantage de ce contrat lui revient à lui seul.</p>
<p>⁕ Et il est permis [à un individu] de mettre en gage sa propre part d'un bien détenu en copropriété (en indivision) entre lui et autrui ; car il est tout à fait permis de vendre sa part lors de l'échéance de la dette, et d'acquitter la dette à partir de celle-ci.</p>
<p><strong>De même, il est permis de mettre en gage le bien vendu en garantie de son propre prix ;</strong> car son prix constitue une dette à la charge [de l'acheteur], et le bien vendu est désormais la propriété de l'acheteur ; il est donc permis de le donner en gage contre cette somme.</p>
<p><em>Exemple :</em> Si une personne achète une maison ou une voiture par exemple, à un prix à paiement différé (à crédit) ou à paiement immédiat mais non encore encaissé, il lui est alors permis de la laisser en gage jusqu'à ce que le prix lui soit intégralement réglé.</p>
<p>⁕ Et la libre disposition (la transaction ou l'aliénation) du bien mis en gage par l'une des deux parties — qu'il s'agisse du créancier (Al-Murtahin) ou du débiteur déposant (Ar-Râhin) — n'est pas exécutoire (valide) sans l'autorisation de l'autre partie. Car si l'un d'eux en disposait sans l'accord de l'autre, il le priverait de son droit. En effet, l'acte de disposition du débiteur (Ar-Râhin) annulerait le droit du créancier à disposer d'une garantie sécurisée, tandis que l'acte de disposition du créancier (Al-Murtahin) constituerait une ingérence et une disposition sur la propriété d'autrui.</p>
<p>⁕ Quant à la jouissance (l'exploitation) du bien mis en gage, elle se fait selon ce que les deux parties conviennent entre elles : s'ils s'accordent pour le louer ou autre, cela est permis. S'ils ne parviennent pas à un accord, le bien reste inutilisé (bloqué) jusqu'à ce que le gage soit levé (libéré).</p>
<p><strong>De même, on donne la possibilité au débiteur déposant (Ar-Râhin) d'accomplir tout ce qui concourt au bon entretien et à la préservation du bien mis en gage ;</strong> comme l'arrosage des arbres, leur pollinisation ou leurs soins pastoraux/médicaux ; car cela relève de l'intérêt direct et de la sauvegarde du gage.</p>
<p>⁕ L'accroissement (le profit généré par) du bien mis en gage, qu'il soit lié (indissociable) — comme la prise de poids [du bétail] ou l'apprentissage d'un métier [par un esclave] — ou qu'il soit séparé (distinct) — comme la naissance d'un petit, les fruits, la laine ou les gains professionnels : y est rattaché d'office. Cet accroissement devient lui aussi une partie intégrante du gage, et il est vendu avec celui-ci pour s'acquitter de la dette. Il en va de même pour l'ensemble de ses revenus (récoltes/rendements) ; car ils en découlent directement.</p>
<p>De la même manière, si le bien en gage subit un préjudice ou une dégradation [causée par un tiers], l'indemnité financière liée à ce préjudice (<em>Arsh al-Jinâyah</em>) est alors greffée au gage ; car cette indemnité constitue le substitut d'une partie manquante de ce bien.</p>
<p>⁕ Et les frais d'entretien du gage — qu'il s'agisse de sa nourriture, du fourrage pour le bétail, de ses réparations (rénovations/maintenance) ou autre — incombent entièrement au débiteur déposant (Ar-Râhin) ; en raison du hadith de Sa'îd ibn al-Musayyib, d'après Abû Hurayrah, selon lequel le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><strong><span dir="rtl">«لَا يُغْلَقُ الرَّهْنُ مِنْ صَاحِبِهِ الَّذِي رَهَنَهُ؛ لَهُ غُنْمُهُ، وَعَلَيْهِ غُرْمُهُ»</span></strong></p>
<p><em><strong>« Le gage ne peut être confisqué au détriment de son propriétaire qui l'a déposé ; à lui en revient le gain (le profit) et à lui en incombe la charge (la perte). »</strong></em> Rapporté par Ach-Châfi'î et Ad-Dâraqutnî, ce dernier ayant précisé : « Sa chaîne de transmission est bonne et authentique (<em>Hasan Sahîh</em>) » <a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a>.</p>
<p><strong>De plus, le gage étant la propriété du débiteur (Ar-Râhin), c'est à lui que revient la responsabilité de sa prise en charge financière.</strong> Il incombe également au débiteur de payer les frais de location de l'entrepôt (du local) où est déposé le bien mis en gage, ainsi que les frais de son gardiennage, car cela entre dans le cadre des dépenses obligatoires liées à sa conservation. Il en va de même pour les frais de pâturage (du berger) s'il s'agit de bétail mis en gage.</p>
<p>⁕ Et si une partie du bien mis en gage est détruite (pérille) tandis qu'une autre partie subsiste, alors la partie restante demeure en gage pour la totalité de la dette. Cela s'explique par le fait que l'intégralité de la dette est adossée (liée) à l'ensemble des composants du gage. Par conséquent, si une partie vient à disparaître, l'autre partie subsistante reste engagée pour couvrir l'entièreté de la dette.</p>
<p>⁕ Et s'il s'acquitte d'une partie de la dette, aucune part du bien mis en gage n'est libérée tant qu'il n'a pas tout remboursé ; ainsi, rien du gage ne sera restitué jusqu'à ce qu'il s'acquitte de l'intégralité de la dette.</p>
<p>⁕ Et lorsque la dette pour laquelle un gage a été donné arrive à échéance, il incombe au débiteur (l'emprunteur) de la rembourser, au même titre qu'une dette sans gage ; car cela est l'exigence même du contrat conclu entre eux.</p>
<p>Allah le Très-Haut a dit :</p>
<p class="ar"><strong><span dir="rtl">﴿فَلْيُؤَدِّ الَّذِي اؤْتُمِنَ أَمَانَتَهُ وَلْيَتَّقِ اللهَ رَبَّهُ﴾ [البقرة: ٢٨٣]</span></strong></p>
<p><em><strong>{Que celui à qui on a fait confiance restitue son dépôt, et qu'il craigne Allah son Seigneur}</strong></em> [Al-Baqarah : 283],</p>
<p>et :</p>
<p class="ar"><strong><span dir="rtl">﴿وَلَا يَبْخَسْ مِنْهُ شَيْئًا﴾ [البقرة: ٢٨٢]</span></strong></p>
<p><em><strong>{et qu'il n'en diminue rien}</strong></em> [Al-Baqarah : 282].</p>
<p>Si le débiteur refuse de s'acquitter de sa dette, il devient alors un procrastinateur (en situation de retard injustifié). À ce moment-là, le juge le contraint à rembourser la dette. S'il refuse toujours, le juge l'emprisonne et le sanctionne (Ta'zîr) jusqu'à ce qu'il s'acquitte de ce qu'il doit par ses propres moyens, ou qu'il vende le gage pour rembourser la dette avec sa valeur.</p>
<p>S'il refuse [de vendre le gage], le juge vend alors lui-même le gage et rembourse la dette à partir de son prix d'achat. En effet, il s'agit d'un droit qui incombait obligatoirement au débiteur, le juge se substitue donc à lui en raison de son refus. De plus, le gage constitue une garantie pour la dette afin d'être vendu lors de son échéance.</p>
<p>Si, après le remboursement de la dette, il reste un surplus du prix de la vente du gage, ce surplus revient à son propriétaire (le débiteur) et lui est restitué, car il s'agit de ses biens. En revanche, s'il reste une partie de la dette que le prix du gage n'a pas pu couvrir, cette somme reste à la charge du constituant du gage (le débiteur), et il a l'obligation de la rembourser.</p>
<p>⁕ Et parmi les règles du gage, il y a le fait que s'il s'agit d'un animal qui nécessite des dépenses [pour sa nourriture et son entretien] et qu'il se trouve en possession du créancier gagiste (le prêteur), le Législateur Sage lui a alors accordé la permission de le monter et de dépenser pour lui s'il est apte à être monté, et de le traire et de dépenser pour lui s'il est apte à l'allaitement.</p>
<p>Le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><strong><span dir="rtl">«الظَّهْرُ يُرْكَبُ بِنَفَقَتِهِ إِذَا كَانَ مَرْهُوناً، وَلَبَنُ الدَّرِّ يُشْرَبُ بِنَفَقَتِهِ إِذَا كَانَ مَرْهُوناً، وَعَلَى الَّذِي يَرْكَبُ وَيَشْرَبُ النَّفَقَةُ»</span></strong></p>
<p><em><strong>"L'animal de monture peut être monté en contrepartie de ce que l'on dépense pour lui lorsqu'il est mis en gage, et le lait de la bête peut être bu en contrepartie de ce que l'on dépense pour elle lorsqu'elle est mise en gage. Et il incombe à celui qui monte [l'animal] et boit [le lait] d'en assurer la dépense."</strong></em> Rapporté par Al-Bukhârî <a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a>.</p>
<p>C'est-à-dire : il est obligatoire pour celui qui monte l'animal et boit son lait d'assumer les frais d'entretien en contrepartie de la jouissance qu'il en tire. Et tout excédent des bénéfices tirés par rapport aux dépenses engagées revient à son propriétaire [le débiteur].</p>
<p>L'Imam Ibn Al-Qayyim (qu'Allah lui fasse miséricorde) a dit <a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a>: <em>"Le hadith, ainsi que les règles fondamentales et les principes de la Législation islamique (Charia), prouvent que l'animal mis en gage possède une sacralité en lui-même (un statut respecté) en raison du droit d'Allah le Très-Haut. De plus, le propriétaire possède sur lui un droit de propriété, et le créancier possède sur lui un droit de garantie. Ainsi, si l'animal reste entre ses mains sans qu'il ne le monte ni ne le traie, son utilité se perdrait en vain. L'exigence de la justice, de l'analogie (Qiyâs), ainsi que l'intérêt du constituant du gage (le débiteur), du créancier et de l'animal, impliquent donc que le créancier jouisse de l'utilité de la monture et de la traite, et qu'il compense cela par la prise en charge des dépenses. Lorsque le créancier tire profit de l'animal et compense cela par les frais d'entretien, cela concilie les deux intérêts et les deux droits."</em> Fin de citation.</p>
<p><strong>Certains juristes (<em>Fuqahâ</em>) (qu'Allah leur fasse miséricorde) ont dit : Le gage se divise en deux catégories : ce qui nécessite des frais d'entretien, et ce qui ne nécessite pas de frais d'entretien.</strong></p>
<p><strong>Ce qui nécessite des frais d'entretien se divise en deux types :</strong></p>
<ol type="1">
<li><blockquote>
<p>Un animal apte à être monté ou trait : sa règle juridique a déjà été exposée précédemment.</p>
</blockquote></li>
<li><blockquote>
<p>Ce qui n'est ni montable ni trait : comme l'esclave [mâle] ou la servante. Pour ce type de bien, il n'est pas permis au créancier gagiste d'en tirer profit, sauf avec l'autorisation de son propriétaire. Ainsi, si son propriétaire lui permet de dépenser pour son entretien et d'en tirer profit en contrepartie de cela, cela devient permis, car il s'agit d'une forme de compensation (d'échange de services).</p>
</blockquote></li>
</ol>
<p><strong>La seconde catégorie :</strong> ce qui ne nécessite pas de frais d'entretien : comme une maison, des marchandises (biens matériels) ou ce qui y ressemble. Pour ce type de bien, il n'est pas permis au créancier gagiste d'en tirer profit, sauf avec l'autorisation du constituant du gage (le débiteur) également.</p>
<p>Toutefois, exception est faite si le gage a été conclu en garantie d'une dette découlant d'un prêt (<em>Qard</em>) : dans ce cas, il n'est pas du tout permis au prêteur d'en tirer profit [même avec l'autorisation du débiteur], comme cela a été mentionné précédemment, afin que ce prêt ne devienne pas un prêt qui engendre un profit, ce qui constituerait alors de l'usure (<em>Ribâ</em>).</p>
