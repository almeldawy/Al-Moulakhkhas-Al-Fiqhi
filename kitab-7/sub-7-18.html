<p>⁕ <strong>Al-Wakâlah (<span dir="rtl">الْوَكَالَة</span>ُ)</strong> — avec la voyelle <em>Fathah</em> sur la lettre <em>Wâw</em> (Al-Wakâlah) ou la <em>Kasrah</em> (Al-Wikâlah) — signifie [littéralement] : <strong>la délégation</strong>. Tu dis par exemple : <em>« J’ai confié (wakaltu) mon affaire à Allah »</em>, c'est-à-dire : <em>« Je la Lui ai déléguée »</em>.</p>
<p><strong>Et dans le jargon juridique (<span dir="rtl">اصْطِلَاحا</span>ً) :</strong> C'est le fait qu'une personne, ayant la capacité juridique d’agir, mandate une autre personne semblable à elle [en matière de capacité] pour le remplacer dans ce qui est susceptible d'être délégué.</p>
<p>⁕ <strong>Et il [le mandat] est permis (<span dir="rtl">جَائِزَة</span>ٌ) selon le Livre (le Coran), la Sunnah et le consensus (Al-Ijmâ‘).</strong></p>
<p><strong>Allah — Qu'Il soit Exalté — a dit :</strong></p>
<p class="ar"><strong><span dir="rtl">﴿فَابْعَثُوا أَحَدَكُم بِوَرِقِكُمْ هَٰذِهِ إِلَى الْمَدِينَةِ﴾</span></strong></p>
<p><em><strong>« Envoyez donc l'un de vous avec votre monnaie d'argent que voici vers la ville »</strong></em> [Al-Kahf : 19].</p>
<p><strong>Et Il — Qu'Il soit Exalté — a dit :</strong></p>
<p class="ar"><strong><span dir="rtl">﴿قَالَ اجْعَلْنِي عَلَىٰ خَزَائِنِ الْأَرْضِ﴾</span></strong></p>
<p><em><strong>« [Yûsuf] dit : "Assigne-moi les dépôts du territoire" »</strong></em> [Yûsuf : 55].</p>
<p><strong>Et Il — Qu'Il soit Exalté — a dit :</strong></p>
<p class="ar"><strong><span dir="rtl">﴿وَالْعَامِلِينَ عَلَيْهَا﴾</span></strong></p>
<p><em><strong>« [...] et à ceux qui y travaillent (ceux chargés de la collecter) »</strong></em> [At-Tawbah : 60].</p>
<p>⁓ <strong>Le Prophète <span dir="rtl">ﷺ</span> a mandaté</strong> ‘Urwah ibn Al-Ja‘d pour lui acheter un ovin (un mouton), ainsi qu'Abû Râfi‘ pour conclure son mariage avec Maymûnah. De même, il envoyait ses percepteurs pour collecter la Zakat.</p>
<p>⁓ <strong>Al-Muwaffaq (Ibn Qoudâmah) ainsi que d'autres ont mentionné</strong> le consensus (Ijmâ‘) de la communauté sur la légitimité globale du mandat. De plus, le besoin s'en fait grandement sentir, car il n'est pas possible pour chacun d'accomplir lui-même tout ce dont il a besoin.</p>
<p>⁕ <strong>Ce par quoi le mandat se conclut (les modalités de sa formulation) :</strong></p>
<ul>
<li><blockquote>
<p>Le mandat se conclut par toute parole qui indique l'autorisation (la permission d'agir), comme le fait de dire : <em>« Fais ceci »</em>, ou : <em>« Je t'autorise à faire cela »</em>...</p>
</blockquote></li>
<li><blockquote>
<p>L'acceptation du mandat est valable qu'elle soit faite immédiatement (sur le champ) ou de manière différée (plus tard), et ce par toute parole ou acte qui manifeste l'acceptation. La preuve en est que l'acceptation des mandataires du Prophète <span dir="rtl">ﷺ</span> (ses représentants) intervenait parfois un certain temps après qu'il les ait mandatés.</p>
</blockquote></li>
</ul>
<ul>
<li><blockquote>
<p>Le mandat est tout à fait valable s'il est limité dans le temps (temporaire) ou s'il est suspendu à une condition. Par exemple, s'il dit : <em>« Tu es mon mandataire pour une durée d'un mois »</em>. Ou encore s'il dit : <em>« Dès que le contrat de location de ma maison prend fin, alors vends-la »</em>.</p>
</blockquote></li>
<li><blockquote>
<p>La désignation précise du mandataire est une condition obligatoire. Ainsi, le mandat n'est pas valable si l'on dit : <em>« J'ai mandaté l'un de ces deux hommes »</em>, ou en mandatant une personne que l'on ne connaît pas (qui n'est pas identifiée).</p>
</blockquote></li>
</ul>
<p>⁕ <strong>Ce pour quoi le mandat est valable (son champ d'application) :</strong></p>
<p>Il est valable de mandater quelqu'un pour tout acte qui accepte la délégation (la substitution d'une personne par une autre) parmi les droits des êtres humains, qu'il s'agisse de contrats (<span dir="rtl">العُقُود</span>) ou de résiliations (<span dir="rtl">الْفُسُوخ</span>).</p>
<ul>
<li><blockquote>
<p><strong>Les contrats</strong> incluent par exemple : la vente, l'achat, la location, le prêt et le partenariat commercial (Al-Mudârabah).</p>
</blockquote></li>
<li><blockquote>
<p><strong>Les résiliations (ou ruptures d'engagements)</strong> incluent par exemple : le divorce (At-Talâq), la répudiation à la demande de l'épouse moyennant compensation (Al-Khul‘), l'affranchissement d'un esclave et la résiliation à l'amiable d'un contrat (Al-Iqâlah).</p>
</blockquote></li>
</ul>
<p>Le mandat est également valable pour tout acte acceptant la délégation parmi les droits d'Allah en matière d'adorations (<span dir="rtl">الْعِبَادَات</span>) ; comme la distribution de l'aumône, le versement de la Zakat, l'acquittement d'un vœu pieux (An-Nadhr), l'expiation (Al-Kaffârah), ainsi que l'accomplissement du Hajj et de la ‘Omrah, en raison des preuves textuelles établies à ce sujet.</p>
<p><strong>Quant aux droits d'Allah — Exalté soit-Il — qui n'acceptent pas la délégation :</strong> il n'est pas valide d'y recourir au mandat. Il s'agit des adorations purement corporelles (<span dir="rtl">الْعِبَادَاتُ الْبَدَنِيَّة</span>ُ) ; telles que la prière (As-Salât), le jeûne (As-Sawm) et la purification rituelle (rituels des ablutions majeures ou mineures) visant à lever l'état d'impureté (<em>Al-Hadath</em>). En effet, ces actes sont intrinsèquement liés au corps de la personne qui doit s'en acquitter.</p>
<p>⁕ <strong>Le mandat est également valable pour l'établissement des peines légales (<em>Al-Hudûd</em>) et leur exécution.</strong></p>
<p>La preuve en est la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><strong><span dir="rtl">«وَاغْدُ يَا أُنَيْسُ إِلَى اِمْرَأَةِ هَذَا، فَإِنْ اِعْتَرَفَتْ؛ فَارْجُمْهَا»</span></strong></p>
<p><em><strong>« Ô Unays, rends-toi demain matin chez la femme de cet homme. Si elle avoue [son crime], alors applique-lui la peine de la lapidation »</strong></em>. (rapporté par Al-Bukhârî et Muslim) <a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a>.</p>
<p>⁕ Il n'appartient pas au mandataire (<em>Al-Wakîl</em>) de déléguer (nommer un sous-mandataire) ce pour quoi il a été mandaté, sauf dans certains cas précis, qui sont :</p>
<ul>
<li><blockquote>
<p><strong>Le premier :</strong> Lorsque le mandant (<em>Al-Muwakkil</em>) le lui a autorisé, en disant par exemple : « Délègue si tu le souhaites », ou en disant : « Fais ce que tu veux ».</p>
</blockquote></li>
<li><blockquote>
<p><strong>Le deuxième :</strong> Lorsque le travail pour lequel il a été mandaté n'est pas le genre de tâche qu'une personne de son rang accomplit habituellement ; du fait qu'il fait partie des notables (gens honorables) qui se placent au-dessus de ce genre de travaux.</p>
</blockquote></li>
<li><blockquote>
<p><strong>Le troisième :</strong> Lorsqu'il se retrouve incapable d'accomplir le travail pour lequel il a été mandaté.</p>
</blockquote></li>
<li><blockquote>
<p><strong>Le quatrième :</strong> Lorsqu'il ne maîtrise pas (n'est pas qualifié pour) le travail pour lequel il a été mandaté.</p>
</blockquote></li>
</ul>
<p><strong>Et dans ces situations (particulières), il ne lui est permis de déléguer qu'à une personne digne de confiance (<em>Amîn</em>), car il ne lui a pas été autorisé de mandater quelqu'elle qui ne soit pas digne de confiance.</strong></p>
<p><strong>⁕</strong> Et la procuration (<em>Al-Wakâlah</em>) est un contrat révocable (non contraignant / <em>jâ'iz</em>) pour les deux parties ; car du côté du mandant (<em>Al-Muwakkil</em>), elle constitue une autorisation, et du côté du mandataire (<em>Al-Wakîl</em>), elle est une contribution à un profit (un rendu de service). Aucun des deux aspects n'étant obligatoire (contraignant / <em>lâzim</em>), chacun d'eux a donc le droit de l'annuler (la résilier) à tout moment (au moment où il le souhaite).</p>
<p>⁕ <strong>Les causes d'annulation de la procuration (<em>Mubtilâtu-l-Wakâlah</em>) :</strong></p>
<p>La procuration devient caduque (s'annule) par la résiliation de l'une des deux parties, par la mort de l'une d'elles, ou par sa folie totale (permanente). En effet, la procuration repose sur la vie et la raison ; si ces deux conditions disparaissent, la validité de la procuration disparaît également.</p>
<p>Elle s'annule aussi par la révocation du mandataire (<em>Al-Wakîl</em>) par le mandant (<em>Al-Muwakkil</em>).</p>
<p>De même, elle s'annule par la mise sous tutelle (<em>Al-Hajr</em>) de la personne faible d'esprit (ou dépensière / <em>As-Safîh</em>), qu'elle soit le mandataire ou le mandant, et ce, en raison de la perte de la capacité juridique d'agir (de disposer des biens).</p>
<p>⁕ <strong>Ce dans quoi il est permis de mandater ou d'être mandaté :</strong></p>
<p>Quiconque a le droit de disposer d'une chose a le droit de mandater (quelqu'un) ou d'être mandaté à son sujet. En revanche, celui dont l'acte (la disposition) n'est pas valable par lui-même, il est encore plus évident qu'il ne peut pas être accompli par son représentant.</p>
<p>Et quiconque est mandaté pour une vente ou un achat ne doit ni vendre à lui-même ni acheter de lui-même. En effet, la coutume (<em>Al-'Urf</em>) en matière de commerce veut qu'un homme vende à autrui, et parce qu'un tel acte l'exposerait à un soupçon (de conflit d'intérêts).</p>
<p>De même, il n'est pas valable qu'il vende à son enfant, à son parent, à son épouse, ainsi qu'à toute autre personne dont le témoignage ne serait pas accepté en sa faveur. Car il est suspecté à leur égard (de favoritisme) de la même manière qu'il est suspecté à l'égard de sa propre personne.</p>
<p>⁕ <strong>Ce qui incombe au mandant (Al-Mouwakki l) et ce qui incombe au mandataire (Al-Wakîl) parmi les actes juridiques :</strong></p>
<p>Les droits et obligations découlant du contrat incombent au mandant, tels que le paiement du prix, la prise de possession de la marchandise vendue, le retour [de la marchandise] en raison d'un défaut, et la garantie contre les vices cachés ou les revendications de tiers (Dhamân ad-Darak).</p>
<p>Le mandataire chargé de la vente livre la marchandise vendue, mais il ne doit pas réceptionner le prix sans l'autorisation du mandant ou sans un indice (un usage) qui prouve cette autorisation ; comme par exemple s'il vendait la marchandise dans un endroit où le prix risquerait d'être perdu s'il ne l'encaissait pas immédiatement.</p>
<p>Le mandataire chargé de l'achat, quant à lui, remet le prix [au vendeur], car cela fait partie de la finalisation de l'achat et de ses droits afférents.</p>
<p>Le mandataire chargé d'un litige (représentation en justice) n'a pas le droit d'encaisser [les biens ou l'argent]. En revanche, le mandataire chargé de la perception (de recouvrer un droit) a le droit de mener le litige, car la perception ne peut être obtenue que par ce biais.</p>
<p>⁕ <strong>Ce que le mandataire (Al-Wakîl) est tenu de garantir et ce qu'il n'est pas tenu de garantir :</strong></p>
<p>Le mandataire est un dépositaire de confiance (<em>Amîn</em>). Il n'est pas tenu de garantir (de compenser) ce qui subit une perte ou une détérioration entre ses mains sans qu'il n'y ait eu de sa part un manque de diligence (négligence) ou une transgression. S'il commet une négligence, une transgression, ou si l'argent lui est réclamé et qu'il refuse de le restituer sans excuse valable, il devient alors garant [et doit rembourser].</p>
<p>La parole du mandataire est acceptée concernant ce pour quoi il a été mandaté — qu'il s'agisse d'une vente ou d'une location — lorsqu'il affirme avoir perçu le prix ou le loyer et que ceux-ci ont été perdus [ou détruits] entre ses mains. Sa parole est également acceptée concernant le montant du prix et du loyer [en cas de divergence]. Et Allah sait mieux.</p>
