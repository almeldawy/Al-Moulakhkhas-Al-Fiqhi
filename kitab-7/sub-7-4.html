<p>⁕ Les conditions dans la vente sont d'une occurrence fréquente. Il se peut que les deux contractants, ou l'un d'entre eux, aient besoin d'imposer une ou plusieurs conditions. Cela nécessite donc d'étudier ces conditions et d'exposer celles qui sont valides et contraignantes, ainsi que celles qui ne sont pas valides.</p>
<p>⁕ Les juristes — qu'Allah leur fasse miséricorde — définissent la condition (<em>ach-chart</em>) dans la vente comme étant l'obligation imposée par l'un des deux contractants à l'autre, en raison du contrat, de ce en quoi il trouve un intérêt. Pour eux, la condition dans la vente n'est considérée comme effective que si elle est stipulée au cœur même du contrat. Ainsi, la stipulation n'est pas valide si elle a lieu avant le contrat, ni après celui-ci.</p>
<p>⁕ Les conditions dans la vente se divisent en deux catégories : les conditions valides (<em>sahîha</em>) et les conditions viciées (<em>fâsida</em>).</p>
<p><strong>Premièrement : Les conditions valides.</strong> Ce sont les conditions qui ne sont pas contraires à l'objet (ou l'essence) du contrat. Cette catégorie est contraignante selon ses termes, conformément à la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><strong><span dir="rtl">«الْمُسْلِمُونَ عَلَى شُرُوطِهِمْ»</span></strong></p>
<p><em><strong>"Les musulmans sont tenus par leurs conditions".</strong></em> <a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a></p>
<p>De plus, le principe fondamental concernant les conditions est la validité, sauf ce que le Législateur a invalidé ou interdit.</p>
<p><strong>La catégorie des conditions valides se divise en deux types :</strong></p>
<p><strong>Le premier type : Une condition pour l'intérêt du contrat.</strong> C'est une condition par laquelle le contrat est renforcé et dont l'intérêt revient à celui qui l'a stipulée. Par exemple :</p>
<ul>
<li><blockquote>
<p>Stipuler une garantie par un gage (<em>rahn</em>) ou stipuler la présence d'un garant (<em>damin</em>), ce qui rassure le vendeur.</p>
</blockquote></li>
<li><blockquote>
<p>Stipuler un délai pour le paiement du prix (ou d'une partie de celui-ci) jusqu'à une échéance connue, ce qui profite à l'acheteur.</p>
</blockquote></li>
</ul>
<p>Si cette condition est respectée, la vente devient ferme et définitive. Il en est de même si l'acheteur stipule une caractéristique précise pour la marchandise, comme le fait qu'elle soit de bonne qualité, d'une fabrication particulière ou d'une production spécifique, car les préférences varient selon ces critères.</p>
<p>Si l'objet vendu correspond à la description stipulée, la vente est conclue. S'il en diffère, l'acheteur a le choix entre :</p>
<ol type="1">
<li><blockquote>
<p><strong>L'annulation (<em>al-faskh</em>)</strong> du contrat.</p>
</blockquote></li>
<li><blockquote>
<p><strong>Le maintien de l'achat</strong>, tout en étant dédommagé pour l'absence de la condition. Le dédommagement est calculé en estimant la valeur de la marchandise avec la caractéristique stipulée, puis sa valeur sans celle-ci ; la différence entre les deux estimations lui est alors versée s'il en fait la demande.</p>
</blockquote></li>
</ol>
<p><strong>Le second type de conditions valides dans la vente :</strong> Il consiste en ce que l'un des deux contractants impose à l'autre une prestation d'utilité licite liée à l'objet vendu.</p>
<ul>
<li><blockquote>
<p>Par exemple, que le vendeur stipule d'habiter la maison vendue pendant une durée déterminée.</p>
</blockquote></li>
<li><blockquote>
<p>Ou qu'il stipule le transport de ses affaires sur la bête ou dans la voiture vendue jusqu'à un endroit précis.</p>
</blockquote></li>
<li><blockquote>
<p>Ceci est basé sur ce qu'a rapporté Jâbir : « <em><strong>Le Prophète <span dir="rtl">ﷺ</span> a vendu un chameau et a stipulé d'en utiliser le dos (pour le monter) jusqu'à Médine</strong></em> », un hadith faisant l'unanimité (<em>Rapporté par Al-Boukhari et Muslim</em>)<a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a>.</p>
</blockquote></li>
<li><blockquote>
<p>Ce hadith prouve la permission de vendre une bête tout en exceptant son utilisation pour le transport jusqu'à un lieu défini, et d'autres cas peuvent être traités par analogie (<em>qiyâs</em>).</p>
</blockquote></li>
<li><blockquote>
<p>De même, si l'acheteur impose au vendeur une prestation de travail sur l'objet vendu.</p>
</blockquote></li>
<li><blockquote>
<p>Comme le fait d'acheter du bois et de stipuler son transport jusqu'à un lieu connu.</p>
</blockquote></li>
<li><blockquote>
<p>Ou d'acheter un vêtement et de stipuler au vendeur de le coudre.</p>
</blockquote></li>
</ul>
<p><strong>Deuxièmement : Les conditions viciées (<em>fâsida</em>) :</strong></p>
<p>Cette catégorie comporte plusieurs types :</p>
<p><strong>Le premier type : Une condition viciée qui annule le contrat dans son fondement.</strong> L'exemple de cela est que l'un des deux contractants impose à l'autre un autre contrat comme condition. Comme s'il disait :</p>
<ul>
<li><blockquote>
<p>« Je te vends cette marchandise à condition que tu me loues ta maison. »</p>
</blockquote></li>
<li><blockquote>
<p>Ou s'il dit : « Je te vends cette marchandise à condition que tu m'associes avec toi dans telle affaire ou dans ta maison. »</p>
</blockquote></li>
<li><blockquote>
<p>Ou s'il dit : « Je te vends cette marchandise à tel prix à condition que tu me prêtes telle somme de dirhams. »</p>
</blockquote></li>
</ul>
<p>Cette condition est viciée et elle annule le contrat depuis sa base, en raison de l'interdiction par le Prophète <span dir="rtl">ﷺ</span> de conclure deux transactions en une seule (<em>bay'atayn fî bay'ah</em>)<a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a>. L'Imam Ahmad — qu'Allah lui fasse miséricorde — a d'ailleurs expliqué le hadith par ce que nous venons de mentionner.</p>
<p><strong>Le second type de conditions viciées dans la vente :</strong> Ce qui est vicié en soi mais n'annule pas la vente.</p>
<ul>
<li><blockquote>
<p>Par exemple, que l'acheteur stipule au vendeur que s'il subit une perte sur la marchandise, il la lui rendra.</p>
</blockquote></li>
<li><blockquote>
<p>Ou que le vendeur stipule à l'acheteur qu'il ne doit pas revendre la marchandise, ou d'autres conditions similaires.</p>
</blockquote></li>
</ul>
<p>Ceci est une condition viciée car elle contredit l'essence du contrat. En effet, l'essence de la vente implique que l'acheteur dispose de la marchandise de manière absolue. Ceci est également fondé sur la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><strong><span dir="rtl">«مَنِ اشْتَرَطَ شَرْطًا لَيْسَ فِي كِتَابِ اللهِ؛ فَهُوَ بَاطِلٌ، وَإِنْ كَانَ مِئَةَ شَرْطٍ»</span></strong></p>
<p><strong><em>« Quiconque stipule une condition qui n'est pas dans le Livre d'Allah, alors elle est caduque, quand bien même il y aurait cent conditions »</em></strong> (Rapporté par Al-Bukhârî et Muslim). <a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a></p>
<p>Ce qui est entendu par « <em><strong>Livre d'Allah</strong></em> » ici, c'est Son jugement, afin que cela inclue la Sunna du Messager d'Allah <span dir="rtl">ﷺ</span>.</p>
<p>Cependant, la vente n'est pas annulée malgré la nullité de cette condition. Car le Prophète <span dir="rtl">ﷺ</span>, dans l'histoire de Barîrah — lorsque son vendeur avait stipulé que son droit de cité (<em>Al-Walâ</em>) lui reviendrait si elle était affranchie — a annulé la condition sans annuler le contrat. Il <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><strong><span dir="rtl">«إِنَّمَا الْوَلَاءُ لِمَنْ أَعْتَقَ»</span></strong></p>
<p><em><strong>« Certes, l'allégeance (Al-Walâ) appartient à celui qui affranchit ».</strong></em><a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a></p>
<p>⁕ Il convient au musulman qui s'occupe de vente et d'achat d'apprendre les règles de la vente, ainsi que les conditions qui y sont valides et celles qui ne le sont pas. Cela lui permettra d'agir en toute connaissance de cause dans ses transactions et d'éviter que ne surgissent des litiges et des différends entre musulmans. En effet, la majorité de ces conflits provient de l'ignorance des deux contractants — ou de l'un d'eux — concernant les règles de la vente, ou de l'imposition de conditions viciées.</p>
