<p>⁕ <strong>Par "fruits" (Al-Thimâr), on entend</strong> ce qui se trouve sur les palmiers et autres arbres, parmi les fruits destinés à la consommation.</p>
<p>⁕ Si ces fruits sont vendus indépendamment de leurs arbres (l'origine), cette vente n'est pas valide avant que leur maturité (bon état) ne devienne apparente. En effet, le Prophète <span dir="rtl">ﷺ</span> « <em><strong>a interdit la vente des fruits avant que leur maturité ne soit apparente ; il l'a interdit au vendeur et à l'acheteur</strong></em> » (Rapporté par Al-Boukhârî et Muslim).<a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a></p>
<p>Le Prophète <span dir="rtl">ﷺ</span> a ainsi interdit au vendeur de vendre le fruit avant l'apparition de sa maturité afin qu'il ne consomme pas l'argent d'autrui de manière injuste (illicite). Et il l'a interdit à l'acheteur car, en agissant ainsi, il aide à consommer les biens de manière injuste.</p>
<p>Il est également rapporté dans les deux recueils authentiques (Al-Sahîhayn) :</p>
<p class="ar"><strong><span dir="rtl">«أَنَّ النَّبِيَّ ﷺ نَهَى عَنْ بَيْعِ الثِّمَارِ حَتَّى تَزْهُوَ، قِيلَ: وَمَا زَهْوُهَا؟ قَالَ: «تَحْمَارُّ أَوْ تَصْفَارُّ»»</span></strong></p>
<p>« <em><strong>Le Prophète <span dir="rtl">ﷺ</span> a interdit la vente des fruits jusqu'à ce qu'ils mûrissent (tazhou). On demanda : "Et que signifie leur mûrissement ?" Il répondit : "Qu'ils rougissent ou jaunissent"</strong></em> ».<a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a></p>
<p>L'interdiction énoncée dans ces deux hadiths implique la nullité de la vente et son invalidité.</p>
<p>⁕ De même, il n'est pas permis de vendre les cultures (les céréales) avant que leurs grains ne se soient endurcis (affermis). Cela repose sur ce qu'a rapporté Muslim d'après Ibn 'Umar :</p>
<p class="ar"><strong><span dir="rtl">«أَنَّ رَسُولَ اللَّهِ ﷺ نَهَى عَنْ بَيْعِ النَّخْلِ حَتَّى يَزْهُوَ، وَعَن بَيْعِ السُّنْبُلِ حَتَّى يَبْيَضَّ وَيَأْمَنَ الْعَاهَةَ؛ نَهَى الْبَائِعَ وَالْمُشْتَرِيَ»</span></strong></p>
<p>« <em><strong>Le Messager d'Allah <span dir="rtl">ﷺ</span> a interdit la vente des palmiers [des dattes] jusqu'à ce qu'ils mûrissent (tazhou), et la vente des épis jusqu'à ce qu'ils blanchissent et soient à l'abri des fléaux (maladies) ; il l'a interdit au vendeur et à l'acheteur</strong></em> ».<a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a></p>
<p>Ce hadith prouve donc l'interdiction de vendre les cultures tant que leur maturité (bon état) n'est pas apparente. Et l'apparition de leur maturité consiste à ce que le grain blanchisse, se durcisse et soit préservé de tout fléau.</p>
<p>⁕ La sagesse derrière l'interdiction de vendre les fruits avant l'apparition de leur maturité, et de vendre les cultures avant que leurs grains ne se soient endurcis, réside dans le fait que durant cette période, ils sont généralement exposés aux maladies (fléaux) et sujets à la perte (destruction).</p>
<p>C'est d'ailleurs ce que le Prophète <span dir="rtl">ﷺ</span> a mis en évidence à travers sa parole :</p>
<p class="ar"><strong><span dir="rtl">«أَرَأَيْتَ إِنْ مَنَعَ اللَّهُ الثَّمَرَةَ؛ بِمَ يَأْخُذُ أَحَدُكُمْ مَالَ أَخِيهِ؟»</span></strong></p>
<p><em><strong>« Vois-tu si Allah prive [le vendeur] de la récolte, à quel titre l'un d'entre vous s'approprierait-il l'argent de son frère ? »</strong></em>.</p>
<p>Et il a dit concernant les épis :</p>
<p class="ar"><strong><span dir="rtl">«حَتَّى يَبْيَضَّ وَيَأْمَنَ الْعَاهَةَ»</span></strong></p>
<p><em><strong>« ...jusqu'à ce qu'ils blanchissent et soient à l'abri des fléaux ».</strong></em></p>
<p>Le fléau (Al-'Âhah) désigne la calamité ou la maladie qui frappe la récolte et la corrompt. Il y a en cela [dans cette législation] une miséricorde envers les gens, une préservation de leurs biens, et une cessation des litiges qui pourraient mener à l'animosité et à la haine.</p>
<p>⁕ C'est à partir de là que l'on prend conscience du caractère sacré (l'inviolabilité) des biens du musulman. Le Prophète <span dir="rtl">ﷺ</span> a dit en effet :</p>
<p class="ar"><strong><span dir="rtl">«أَرَأَيْتَ إِنْ مَنَعَ اللَّهُ الثَّمَرَةَ؛ بِمَ يَسْتَحِلُّ أَحَدُكُمْ مَالِ أَخِيهِ؟»</span></strong></p>
<p><em><strong>« Vois-tu si Allah prive [le vendeur] de la récolte, à quel titre l'un d'entre vous s'approprierait-il de droit l'argent de son frère ? ».</strong></em><a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a></p>
<p>Il y a dans cette parole un avertissement et une réprimande sévère envers ceux qui usent de ruses contre les gens pour s'emparer de leurs biens par divers stratagèmes. De même, ce hadith contient une incitation pour le musulman à préserver ses biens et à ne pas les gaspiller. C'est pourquoi le Prophète <span dir="rtl">ﷺ</span> a interdit à l'acheteur d'acquérir les fruits avant l'apparition de leur maturité et avant que leur préservation ne soit prépondérante (le cas le plus probable). Car si la récolte venait à périr alors qu'il y a déjà investi son argent, celui-ci serait définitivement perdu pour lui, et il deviendrait difficile, voire impossible, de le récupérer auprès du vendeur.</p>
<p>On comprend également de ce noble hadith que la règle juridique est indexée sur le cas prépondérant (la situation générale). En effet, le sort le plus probable pour un fruit avant l'apparition de sa maturité est la détérioration (la perte) ; il n'est donc pas permis de le vendre. À l'inverse, après l'apparition de sa maturité, le sort le plus probable est sa préservation (son bon développement) ; il est alors permis de le vendre.</p>
<p>Nous tirons aussi de ce hadith qu'il n'est pas permis à l'être humain de mettre ses biens en péril et de les exposer à la perte, même s'il s'agit d'une transaction commerciale (un échange) dont l'issue n'est pas garantie.</p>
<p>⁕ <strong>Dès lors que nous avons appris de ce qui précède qu'il n'est pas permis de vendre les fruits avant l'apparition de leur maturité,</strong> il faut savoir que cela s'applique uniquement lorsqu'ils sont vendus séparément de leurs arbres (l'origine) avec la condition de les laisser [sur l'arbre jusqu'à maturation]. En revanche, si les fruits sont vendus en tant que dépendance de leurs arbres, ou sans la condition de les laisser [sur pied], cela devient permis. Cela se décline en trois cas de figure mentionnés par les juristes (<em>Al-Fuqahâ</em>), qu'Allah leur fasse miséricorde :</p>
<p><strong>Le premier cas de figure :</strong> Lorsque le fruit est vendu avant l'apparition de sa maturité conjointement avec ses arbres (ses racines) ; c'est-à-dire qu'il vend le fruit en même temps que l'arbre. Dans ce cas, la vente est valide et le fruit est inclus dans la transaction en tant que dépendance (accessoire). Il en va de même si l'on vend une culture verdoyante (non mûre) avec sa terre : cela est permis, et la culture verdoyante y est alors incluse en tant que dépendance.</p>
<p><strong>Le deuxième cas de figure :</strong> Lorsque le fruit est vendu avant l'apparition de sa maturité, ou la culture verdoyante est vendue, au propriétaire de la base (l'origine) ; c'est-à-dire : au propriétaire des arbres ou au propriétaire de la terre. Cela est également permis car s'il les vend au propriétaire de la base, la livraison à l'acheteur s'accomplit de manière parfaite, puisqu'il possède déjà la base (le support) et le terrain d'ancrage. La vente est donc valide — bien qu'il y ait une divergence de avis sur ce cas précis, car certains savants estiment que ce cas de figure entre dans la portée générale de l'interdiction de vendre les fruits avant l'apparition de leur maturité.</p>
<p><strong>Le troisième cas de figure :</strong> La vente des fruits avant l'apparition de leur maturité, et des cultures avant que leurs grains ne se soient endurcis, à la condition d'une coupe immédiate, et à condition qu'il soit possible d'en tirer profit une fois coupés. En effet, l'interdiction de la vente est motivée par la crainte de la détérioration (la perte) ou de la survenue d'un fléau, or ce risque est écarté pour ce qui est coupé sur-le-champ. En revanche, s'il n'est pas possible d'en tirer profit une fois coupés, leur vente n'est pas valide, car cela relèverait du gaspillage et de la perte de biens, alors que le Prophète <span dir="rtl">ﷺ</span> a interdit le gaspillage (la perte) des biens.<a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a></p>
<p>⁕ Selon le avis prépondérant (authentique) des deux avis des savants, il est permis de vendre ce dont la récolte se répète (par cueillettes successives), comme la luzerne (le trèfle/fourrage), les herbes potagères (les légumes-feuilles), les concombres (ou courgettes) et les aubergines. Il est ainsi permis de vendre sa cueillette ou sa fauche actuelle ainsi que ses cueillettes ou fauches futures.</p>
<p>Le Cheikh al-Islam Ibn Taymiyyah — qu'Allah lui fasse miséricorde — a dit <a href="#fn6" class="footnote-ref" id="fnref6" role="doc-noteref"><sup>6</sup></a>: « <em>L'avis authentique est que ces types de récoltes n'entrent pas dans l'interdiction du Prophète <span dir="rtl">ﷺ</span>. Au contraire, le contrat de vente est valide pour la cueillette déjà existante ainsi que pour la cueillette future (non encore apparente) jusqu'à ce que le champ de cucurbitacées se dessèche. En effet, le besoin des gens appelle à cela ; il est donc permis de vendre les produits de ces plantations sans vendre leurs racines (la plante elle-même)</em> ».</p>
<p>Et l'éminent savant Ibn al-Qayyim — qu'Allah lui fasse miséricorde — a dit <a href="#fn7" class="footnote-ref" id="fnref7" role="doc-noteref"><sup>7</sup></a>: « <em>Le Prophète <span dir="rtl">ﷺ</span> a seulement interdit la vente des fruits dont il est possible de retarder la transaction jusqu'à l'apparition de leur maturité. C'est pourquoi les champs de cucurbitacées (et cultures similaires) n'entrent pas dans son interdiction</em> ». Fin de citation.</p>
