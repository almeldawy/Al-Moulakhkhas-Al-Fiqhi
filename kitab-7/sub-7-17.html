<p>⁕ Linguistiquement, <em>Al-Hawâlah</em> (le transfert) dérive du mot <em>Al-Tahawwul</em> (le déplacement / le changement), car elle transfère la dette d'une responsabilité (<em>Dhimmah</em>) à une autre responsabilité. C'est pourquoi les juristes (<em>Al-Fuqahâ</em>) l'ont définie comme étant : <em><strong>le transfert d'une dette d'une responsabilité à une autre responsabilité</strong></em>.</p>
<p>⁕ <strong>Et elle (la validité du transfert de dette / <em>Al-Hawâlah</em>) est établie par la preuve de la Sounnah et du consensus (<em>Al-Ijmâ'</em>) :</strong></p>
<p>Le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><strong><span dir="rtl">«إِذَا أُتْبِعَ أَحَدُكُمْ عَلَى مَلِيءٍ؛ فَلْيَتْبَعْ»</span></strong></p>
<p><strong>« Si l'un de vous est renvoyé vers une personne solvable [pour recouvrer sa créance], qu'il accepte ce renvoi »</strong>.</p>
<p>Et dans une autre version :</p>
<p class="ar"><strong><span dir="rtl">«مَنْ أُحِيلَ بِحَقِّهِ عَلَى مَلِيءٍ؛ فَلْيَحْتَلْ»</span></strong></p>
<p><strong>« Quiconque voit son droit [sa créance] transféré vers une personne solvable, qu'il accepte le transfert »</strong> <a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a>.</p>
<p>Et plus d'un savant a rapporté le consensus quant à sa légitimité.</p>
<p>⁕ Et elle [la cession de dette / Al-Hawâlah] comporte une bienveillance entre les gens, une facilitation des voies de leurs transactions, de l'indulgence, ainsi qu'une entraide pour accomplir leurs besoins, régler leurs dettes et assurer leur confort.</p>
<p>⁕ Certains ont pensé que la cession de dette (Al-Hawâlah) était contraire à l'analogie ('alâ ghayri wafqi-l-qiyâs), car elle consiste à vendre une dette contre une autre dette, et que la vente d'une dette contre une dette est interdite, mais qu'elle aurait été exceptionnellement autorisée pour la cession de dette en dérogation à l'analogie. Or, l'érudit Ibn al-Qayyim <a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a> a réfuté cela et a démontré qu'elle est tout à fait conforme à l'analogie, car elle relève du fait d'acquitter un droit, et non du genre de la vente.</p>
<p>Il a dit : « <em>Même s'il s'agissait de la vente d'une dette contre une dette, le Législateur ne l'a pas interdite. Au contraire, les règles de la Législation impliquent sa permission, car elle implique le transfert de la dette et sa transmission de la responsabilité du cédant (Al-Muhîl) vers la responsabilité du cessionnaire (Al-Muhâl 'alayhi).</em> » Fin de citation.</p>
<p>⁕ <strong>La cession de dette (<em>Al-Hawâlah</em>) n'est valide qu'à certaines conditions :</strong></p>
<p><strong>La première condition :</strong> Que le transfert porte sur une dette stable (<em>Mustaqirr</em>) à la charge de la personne sur qui se fait le transfert (<em>Al-Muhâl 'alayhi</em> / le tiers débiteur). En effet, l'implication de ce transfert est de contraindre le tiers débiteur à payer la dette. Or, si cette dette n'est pas stable, elle est susceptible d'être annulée, et le transfert ne peut donc s'y appliquer fermement. Ainsi, il n'est pas valide d'effectuer un transfert sur le prix d'un bien vendu durant la période de l'option de rétractation (<em>Muddat al-Khiyâr</em>), de même qu'il n'est pas valide pour le fils d'effectuer un transfert de dette à la charge de son père sans le consentement de ce dernier.</p>
<p><strong>La deuxième condition :</strong> La concordance entre les deux dettes — celle qui fait l'objet du transfert (<em>Al-Muhâl bihi</em>) et celle due par le tiers débiteur (<em>Al-Muhâl 'alayhi</em>). C'est-à-dire :</p>
<ul>
<li><blockquote>
<p><strong>Leur similitude quant à la nature (ou le genre) :</strong> comme des dirhams contre des dirhams.</p>
</blockquote></li>
<li><blockquote>
<p><strong>Leur similitude quant à la description :</strong> comme le fait de transférer une dette en dirhams frappés (en pièces monnayées) sur une autre dette en dirhams frappés, ou de l'argent saoudien par exemple sur de l'argent saoudien identique.</p>
</blockquote></li>
<li><blockquote>
<p><strong>Leur similitude quant au terme (le temps) :</strong> c'est-à-dire concernant l'exigibilité immédiate (<em>Al-Houloûl</em>) ou le report (<em>At-Ta'jîl</em>). Si l'une des deux dettes est immédiatement exigible et que l'autre est à terme (différée), ou si l'une arrive à échéance dans un mois et l'autre dans deux mois, la cession de dette n'est pas valide.</p>
</blockquote></li>
<li><blockquote>
<p><strong>Leur similitude quant au montant (la quantité) :</strong> ainsi, il n'est pas valide d'effectuer, par exemple, le transfert d'une dette de cent riyals sur une dette de quatre-vingt-dix riyals. Car la cession de dette est un contrat de bienfaisance/assistance (<em>'Aqd Irfâq</em>), tout comme le prêt (<em>Al-Qard</em>). Si l'inégalité de montant (<em>At-Tafâdoul</em>) y était autorisée, ce contrat sortirait de son objectif initial — qui est l'assistance — pour devenir une recherche de profit (un gain supplémentaire), ce qui est illicite, tout comme cela est illicite dans le prêt. Cependant, si une personne transfère une partie seulement de la dette qu'elle doit, ou qu'elle effectue un transfert sur une partie seulement de la dette qui lui est due, cela est tout à fait permis, et le montant restant (l'excédent) demeure tel quel en faveur de son propriétaire.</p>
</blockquote></li>
</ul>
<p><strong>La troisième condition :</strong> Le consentement du cédant (<em>Al-Muhîl</em>). Car la dette lui incombe, et il ne peut être contraint de s'en acquitter par le biais de la cession de dette.</p>
<p>En revanche, le consentement du tiers débiteur (<em>Al-Muhâl 'alayhi</em>) n'est pas requis. De même, le consentement du créancier (<em>Al-Muhtâl</em> / <em>Al-Muhâl</em>) n'est pas exigé s'il est renvoyé vers un tiers solvable (<em>Malî'</em>) et non procrastinateur ; il est plutôt contraint d'accepter le transfert et de réclamer son droit auprès du tiers débiteur.</p>
<p>Ceci en raison de la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><strong><span dir="rtl">« مَطْلُ الْغَنِيِّ ظُلْمٌ، وَإِذَا أُتْبِعَ أَحَدُكُمْ عَلَى مَلِيءٍ؛ فَلْيَتْبَعْ »</span></strong></p>
<p>« <em><strong>Le fait, pour une personne riche (ou solvable), de différer le paiement de sa dette est une injustice. Et si l'un de vous est renvoyé vers une personne solvable, qu'il accepte alors ce renvoi.</strong></em> » (Rapporté par Al-Boukhari et Muslim)</p>
<p>Et dans une autre formulation :</p>
<p class="ar"><strong><span dir="rtl">« مَنْ أُحِيلَ بِحَقِّهِ عَلَى مَلِيءٍ؛ فَلْيَحْتَلْ »</span></strong></p>
<p>« <em><strong>Quiconque voit son droit transféré vers une personne solvable, qu'il accepte alors le transfert.</strong></em> »</p>
<p>C'est-à-dire : qu'il accepte la cession de dette (<em>Al-Hawâlah</em>).</p>
<p>La personne solvable (<em>Al-Malî'</em>) est celle qui a la capacité financière d'honorer son engagement et qui n'est pas connue pour sa procrastination (ou ses faux-fuyants). Dès lors, si le tiers débiteur (<em>Al-Muhâl 'alayhi</em>) n'est pas solvable, le créancier (<em>Al-Muhâl</em>) n'est pas tenu d'accepter le transfert vers lui, en raison du préjudice (<em>Al-Dardar</em>) que cela lui causerait.</p>
<p>⁕ <strong>À cette occasion, le conseil adressé à ceux qui ont des dettes (ou des obligations) envers autrui et qui ont la capacité de les régler, est de s'empresser de libérer leur conscience (et leur responsabilité) en s'en acquittant auprès de leurs ayants droit ou auprès de ceux qui ont été renvoyés vers eux par le biais d'un transfert de dette.</strong></p>
<p>Ils doivent également veiller à ne pas ternir leur réputation par la procrastination, les faux-fuyants et les ruses. En effet, nous entendons fréquemment les plaintes et les doléances des titulaires de droits en raison du retard accumulé dans la perception de ce qui leur est dû, et à cause du laxisme des débiteurs qui ne remboursent pas alors qu'ils n'ont aucune excuse valable sur le plan religieux.</p>
<p>De même, nous constatons bien souvent la procrastination des personnes aisées (ou solvables) lorsqu'il s'agit de régler les transferts de dettes qui sont dirigés vers elles, causant ainsi une fatigue et un épuisement immenses aux créanciers transférés (<em>Al-Muhâlîn</em>). À tel point que la cession de dette (<em>Al-Hawâlah</em>) est devenue un spectre effrayant que beaucoup de gens cherchent à fuir, et ce, en raison de l'injustice commise par les gens les uns envers les autres.</p>
<p>⁕ <strong>Lorsque la cession de dette (<em>Al-Hawâlah</em>) est valide — par la réunion de l'ensemble de ses conditions précitées —, le droit (la créance) est alors transféré de la responsabilité du cédant (<em>Al-Muhîl</em>) vers la responsabilité du tiers débiteur (<em>Al-Muhâl 'alayhi</em>). Dès lors, le cédant est totalement déchargé et quitte de cette obligation.</strong></p>
<p>En effet, le sens même de ce contrat est le transfert d'un droit d'une responsabilité à une autre responsabilité. Il n'est donc plus permis au créancier (<em>Al-Muhâl</em>) de se retourner contre le cédant initial, puisque son droit a été transféré à un tiers.</p>
<p>Il lui incombe désormais de diriger ses démarches et ses réclamations exclusivement vers le tiers débiteur (<em>Al-Muhâl 'alayhi</em>), afin de percevoir son dû auprès de lui, ou de trouver un terrain d'entente (un compromis) avec lui, sous quelque forme que ce soit, quant aux modalités de recouvrement.</p>
<p>La cession de dette conforme à la législation (<em>Al-Hawâlah Al-Shar'iyyah</em>) constitue donc un acquittement valide et une voie légiférée. Elle comporte une grande facilitation pour les gens lorsqu'elle est exploitée de manière saine, utilisée à bon escient, et qu'elle demeure exempte de toute tromperie ou de tout subterfuge.</p>
