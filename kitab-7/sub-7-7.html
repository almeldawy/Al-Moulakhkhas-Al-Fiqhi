<p>⁕ Ce sujet fait partie des sujets les plus graves. Il s'agit du sujet de l'usure (Ar-Ribâ) sur l'interdiction duquel toutes les législations [divines] se sont accordées à l'unanimité, et au sujet duquel Allah a menacé celui qui le pratique du plus sévère des châtiments.</p>
<p>Allah Très-Haut a dit :</p>
<p class="ar"><strong><span dir="rtl">﴿الَّذِينَ يَأْكُلُونَ الرِّبَا لَا يَقُومُونَ إِلَّا كَمَا يَقُومُ الَّذِي يَتَخَبَّطُهُ الشَّيْطَانُ مِنَ الْمَسِّ﴾ [البقرة: ٢٧٥]</span></strong></p>
<p><strong>"Ceux qui mangent [pratiquent] l'usure ne se lèvent que comme se lève celui que le Diable a terrassé par son toucher [folie/possession]."</strong> [Sourate Al-Baqarah, verset 275]</p>
<p>Gloire à Lui, Il a ainsi informé que ceux qui pratiquent l'usure <strong>"ne se lèvent que"</strong> – c'est-à-dire de leurs tombes lors de la Résurrection – <strong>"comme se lève celui que le Diable a terrassé par son toucher"</strong>, à savoir : comme se lève l'épileptique au moment de sa crise. Et cela est dû au gonflement [démesuré] de leurs ventres, en raison de leur consommation de l'usure dans la vie d'ici-bas.</p>
<p>De même, Allah — Gloire à Lui — a menacé quiconque retourne à la consommation de l'usure, après avoir pris connaissance de son interdiction, de faire partie des gens du Feu qui y demeureront éternellement. Le Très-Haut a dit :</p>
<p class="ar"><strong><span dir="rtl">﴿وَمَنْ عَادَ فَأُولَٰئِكَ أَصْحَابُ النَّارِ ۖ هُمْ فِيهَا خَالِدُونَ﴾ [البقرة: ٢٧٥]</span></strong></p>
<p><strong>"Et quiconque récidive... alors ceux-là sont les gens du Feu, ils y demeureront éternellement."</strong> [Sourate Al-Baqarah, verset 275].</p>
<p>De plus, Allah — Gloire à Lui — a informé qu'Il anéantit [le profit de] l'usure.</p>
<p>Le Très-Haut a dit :</p>
<p class="ar"><strong><span dir="rtl">﴿يَمْحَقُ اللَّهُ الرِّبَا﴾ [البقرة: ٢٧٦]</span></strong></p>
<p><strong>"Allah anéantit l'usure"</strong> [Sourate Al-Baqarah, verset 276]</p>
<p>c'est-à-dire qu'Il fait disparaître la bénédiction des biens auxquels s'est mêlée l'usure. Ainsi, peu importe à quel point les biens de l'usurier s'accentuent et fructifient, ils sont totalement dépourvus de bénédiction et ne contiennent aucun bien. Ils ne sont qu'un fardeau [et une source de malheur] pour leur possesseur : une fatigue dans la vie d'ici-bas et un châtiment dans l'au-delà, sans qu'il n'en tire aucun [véritable] profit.</p>
<p>Et Allah a qualifié l'usurier de grand mécréant [ou ingrat] et de grand pécheur. Le Très-Haut a dit :</p>
<p class="ar"><strong><span dir="rtl">﴿يَمْحَقُ اللَّهُ الرِّبَا وَيُرْبِي الصَّدَقَاتِ ۗ وَاللَّهُ لَا يُحِبُّ كُلَّ كَفَّارٍ أَثِيمٍ﴾ [البقرة: ٢٧٦]</span></strong></p>
<p><strong>"Allah anéantit l'usure et fait fructifier les aumônes. Et Allah n'aime pas le grand mécréant [ou ingrat] et pécheur."</strong> [Sourate Al-Baqarah, verset 276].</p>
<p>Allah — Gloire à Lui — a donc informé qu'Il n'aime pas l'usurier. Or, le fait d'être privé de l'amour d'Allah implique nécessairement qu'Allah le déteste et l'abhorre. Et le fait de le nommer <em>"Kaffâr"</em> (grand mécréant/ingrat) signifie : quelqu'un qui fait preuve d'une ingratitude extrême envers les bienfaits [d'Allah]. Et il s'agit ici de la mécréance [ingratitude] qui ne fait pas sortir de la religion [l'Islam]. Il est donc un grand ingrat envers le bienfait d'Allah, car il ne fait pas miséricorde à la personne impuissante, ne vient pas en aide au pauvre et n'accorde pas de délai au débiteur en difficulté.</p>
<p>Ou alors, ce qui est visé [par ce terme], c'est qu'il commet la mécréance majeure qui fait sortir de la religion <strong>s'il considère l'usure comme licite (Istitshâl)</strong>.</p>
<p>Et Allah l'a qualifié dans ce verset de <em>"Athîm"</em> (grand pécheur) ; c'est-à-dire : quelqu'un qui s'enfonce excessivement dans le péché, et qui est totalement embourbé dans les préjudices matériels et moraux.</p>
<p>Et Allah a proclamé, de Sa part et de la part de Son Messager, la guerre contre l'usurier, car celui-ci s'établit en ennemi envers Eux s'il ne délaisse pas l'usure ; et Il l'a qualifié d'injuste. Le Très-Haut a dit :</p>
<p class="ar"><strong><span dir="rtl">﴿يَا أَيُّهَا الَّذِينَ آمَنُوا اتَّقُوا اللَّهَ وَذَرُوا مَا بَقِيَ مِنَ الرِّبَا إِنْ كُنْتُمْ مُؤْمِنِينَ * فَإِنْ لَمْ تَفْعَلُوا فَأْذَنُوا بِحَرْبٍ مِنَ اللَّهِ وَرَسُولِهِ ۖ وَإِنْ تُبْتُمْ فَلَكُمْ رُؤُوسُ أَمْوَالِكُمْ لَا تَظْلِمُونَ وَلَا تُظْلَمُونَ﴾ [البقرة: ٢٧٨ - ٢٧٩]</span></strong></p>
<p><strong>"Ô vous qui croyez ! Craignez Allah et abandonnez ce qui reste de l'usure, si vous êtes croyants. Et si vous ne le faites pas, alors recevez l'annonce d'une guerre de la part d'Allah et de Son Messager. Et si vous vous repentez, vous aurez vos capitaux [de base]. Vous ne léserez personne, et vous ne serez point lésés."</strong> [Sourate Al-Baqarah, versets 278-279].</p>
<p>En plus de ces avertissements coraniques stricts contre la pratique de l'usure, d'autres répressions sont venues s'ajouter dans la Sounnah du Messager <span dir="rtl">ﷺ</span>. En effet, le Prophète <span dir="rtl">ﷺ</span> a compté [l'usure] parmi les grands péchés pernicieux (Al-Mûbiqât), c'est-à-dire destructeurs.</p>
<p>Et il <span dir="rtl">ﷺ</span> a maudit celui qui consomme l'usure, celui qui la fait consommer [le client], ses deux témoins ainsi que celui qui rédige le contrat.<a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a></p>
<p>De même qu'il <span dir="rtl">ﷺ</span> a informé qu'un seul dirham provenant de l'usure est plus grave [en termes de péché] auprès d'Allah que de commettre trente-trois — ou trente-six — adultères en Islam.<a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a> Et il a informé que l'usure comporte soixante-douze portes, dont la moindre équivaut [en gravité] au fait qu'un homme commette l'inceste avec sa propre mère.<a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a></p>
<p>Cheikh al-Islam Ibn Taymiyyah — qu'Allah lui fasse miséricorde — a dit <a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a>: "<em>L'interdiction de l'usure (Ar-Ribâ) est plus stricte que l'interdiction du jeu de hasard (Al-Maysir), qui est le jeu d'argent (le pari). En effet, l'usurier prend un surplus certain et garanti de la part d'une personne dans le besoin. Le joueur de hasard, quant à lui, peut obtenir un gain comme il peut ne pas en obtenir. L'usure constitue donc une injustice certaine et absolue, car elle donne au riche un pouvoir de domination sur le pauvre ; contrairement au jeu de hasard, où il arrive parfois que le pauvre prenne du riche. De plus, il se peut que les deux joueurs soient d'un niveau égal de richesse ou de pauvreté. Ainsi, même si [le jeu de hasard] consiste à s'approprier les biens d'autrui de manière illégitime — ce qui est illicite —, il ne renferme pas l'injustice et le préjudice envers la personne dans le besoin que l'on retrouve dans l'usure. Or, il est bien connu que l'injustice commise envers une personne dans le besoin est plus grave que l'injustice envers une personne qui n'est pas dans le besoin.</em>" Fin [de citation].</p>
<p>Et la consommation de l'usure fait partie des caractéristiques des Juifs, à cause de laquelle ils ont mérité la malédiction éternelle et continue.</p>
<p>Allah Très-Haut a dit :</p>
<p class="ar"><strong><span dir="rtl">﴿فَبِظُلْمٍ مِنَ الَّذِينَ هَادُوا حَرَّمْنَا عَلَيْهِمْ طَيِّبَاتٍ أُحِلَّتْ لَهُمْ وَبِصَدِّهِمْ عَنْ سَبِيلِ اللَّهِ كَثِيرًا * وَأَخْذِهِمُ الرِّبَا وَقَدْ نُهُوا عَنْهُ وَأَكْلِهِمْ أَمْوَالَ النَّاسِ بِالْبَاطِلِ ۚ وَأَعْتَدْنَا لِلْكَافِرِينَ مِنْهُمْ عَذَابًا أَلِيمًا﴾ [النساء: ١٦٠ - ١٦١].</span></strong></p>
<p><strong>"C'est en raison de l'injustice des Juifs que Nous leur avons rendu illicites de bonnes nourritures qui leur étaient auparavant licites, et parce qu'ils obstruaient fréquemment le sentier d'Allah, et à cause de leur pratique de l'usure — alors qu'elle leur avait été interdite — et de leur consommation illégitime des biens des gens. Et Nous avons préparé aux mécréants d'entre eux un châtiment douloureux."</strong> [Sourate An-Nisâ', versets 160-161]. »</p>
<p>⁕ <strong>La sagesse derrière l'interdiction de l'usure (Ar-Ribâ) :</strong></p>
<p>[Elle réside dans le fait] qu'elle implique une appropriation illégitime des biens des gens, car l'usurier perçoit d'eux un intérêt sans qu'ils ne tirent aucun profit en contrepartie.</p>
<p>De même, elle cause un préjudice certain aux pauvres et aux nécessiteux en multipliant [le montant de] leurs dettes lorsqu'ils se retrouvent incapables de les rembourser.</p>
<p>Elle engendre également la rupture de la bienfaisance entre les hommes, la fermeture de la porte du prêt désintéressé (<em>Al-Qard al-Hassan</em>), et l'ouverture de la porte du prêt à intérêt qui accable le pauvre.</p>
<p>En outre, elle provoque la paralysie des moyens de subsistance, des commerces, des métiers et des industries, sans lesquels les intérêts du monde ne peuvent pourtant pas prospérer. En effet, dès lors que l'usurier obtient l'augmentation de ses biens par le biais de l'usure et sans le moindre effort, il ne cherchera plus d'autres voies de gain nécessitant de la peine.</p>
<p>Or, Allah le Très-Haut a établi que les relations mutuelles des hommes pour leur subsistance reposent sur le principe suivant : le profit que chacun tire de l'autre doit se faire en contrepartie d'un travail qu'il accomplit pour lui, ou d'un bien matériel (<em>'Ayn</em>) qu'il lui cède. L'usure, quant à elle, est totalement exempte de cela, car elle consiste simplement à donner un bien financier d'une partie à une autre, pour qu'il soit restitué multiplié, sans aucune contrepartie sous forme de bien matériel ni de travail.</p>
<p>⁕ <strong>L'usure (Ar-Ribâ) :</strong> son sens dans la langue [arabe] est "le surplus" (ou l'augmentation). Dans la législation islamique (<em>As-Shar'</em>), il s'agit d'un surplus appliqué à des biens spécifiques.</p>
<p>L'usure se divise en deux catégories : <strong>Ribâ an-Nasî'ah</strong> (l'usure de l'ajournement/retard) et <strong>Ribâ al-Fadl</strong> (l'usure de surplus/surévaluation immédiate).</p>
<p>⁕ <strong>Explication de <em>Ribâ an-Nasî'ah</em> :</strong></p>
<p><em>Ribâ an-Nasî'ah</em> est un terme dérivé du mot <em>"Al-Nas'"(<span dir="rtl">النَّسْء</span>ِ)</em>, qui signifie "le délai" (ou le retard). Et il se décline en deux types :</p>
<p><strong>Le premier des deux :</strong> Le reversement de la dette au détriment du débiteur en difficulté. C'était là l'origine même de l'usure à l'époque préislamique (<em>Al-Jâhiliyyah</em>). Un homme était créancier d'un autre pour une somme à terme ; lorsque l'échéance arrivait, il lui disait : <em>"Rembourses-tu ou augmentes-tu [l'intérêt] ?"</em> Si le débiteur payait, [l'affaire était réglée], sinon le créancier prolongeait le délai et le débiteur augmentait la somme. Ainsi, la dette se multipliait à la charge du débiteur.</p>
<p>Allah a donc interdit cela par Sa parole :</p>
<p class="ar"><strong><span dir="rtl">﴿وَإِن كَانَ ذُو عُسْرَةٍ فَنَظِرَةٌ إِلَىٰ مَيْسَرَةٍ﴾ [البقرة: ٢٨٠]</span></strong></p>
<p><strong>"À celui qui est dans la gêne, accordez un sursis jusqu'à ce qu'il soit dans l'aisance."</strong> [Sourate Al-Baqarah, verset 280].</p>
<p>Dès lors, quand la dette arrive à échéance et que le débiteur est en difficulté, il n'est pas permis de reconduire la dette à la hausse contre lui ; il est plutôt obligatoire de lui accorder un délai. Et s'il est solvable, il lui incombe de s'acquitter de sa dette. Il n'y a donc aucun besoin d'augmenter la dette, que le débiteur soit dans l'aisance ou dans la gêne.</p>
<p><strong>Le second type de <em>Ribâ an-Nasî'ah</em> :</strong> Celui qui intervient lors de la vente de deux biens de même nature (ou de natures différentes) partageant la même cause juridique (<em>'Illah</em>) que celle de <em>Ribâ al-Fadl</em>, lorsque l'on retarde la prise de possession (<em>Qabd</em>) des deux biens ou de l'un d'eux.</p>
<p>C'est le cas, [par exemple], de la vente d'or contre de l'or, d'argent contre de l'argent, de blé contre du blé, d'orge contre de l'orge, de dattes contre des dattes, et de sel contre du sel. Il en va de même pour la vente à terme (<em>Mû'ajjalan</em>) d'une nature de bien contre une autre parmi celles mentionnées.</p>
<p>De plus, tout ce qui partage la même cause juridique (<em>'Illah</em>) que ces éléments subit le même statut. L'explication de cela suivra.</p>
<p>⁕ <strong>Explication de <em>Ribâ al-Fadl</em> [L'usure de surplus] :</strong></p>
<p><em>Ribâ al-Fadl</em> est un terme dérivé du mot <em>"Al-Fadl" (<span dir="rtl">الفَضْل</span>ِ)</em>. Il consiste en un surplus [ou une augmentation] appliqué à l'une des deux contreparties [lors de l'échange de biens de même nature].</p>
<p>Le Législateur a explicitement texté son interdiction concernant six éléments, qui sont : l'or, l'argent, le blé, l'orge, les dattes et le sel. Ainsi, lorsque l'un de ces éléments est vendu contre un élément de sa propre nature (sa propre catégorie), l'inégalité de quantité (Al-Tafâdul) entre les deux est formellement interdite à l'unanimité. Cela s'appuie sur le hadith de 'Ubâdah ibn As-Sâmit (qu'Allah l'agrée), rapporté de manière prophétique (Marfû') :</p>
<p class="ar"><strong><span dir="rtl">«الذَّهَبُ بِالذَّهَبِ، وَالفِضَّةُ بِالفِضَّةِ، وَالبُرُّ بِالبُرِّ، وَالشَّعِيرُ بِالشَّعِيرِ، وَالتَّمْرُ بِالتَّمْرِ، وَالمِلْحُ بِالمِلْحِ؛ مِثْلاً بِمِثْلٍ، يَدَاً بِيَدٍ»</span></strong></p>
<p></p>
<p>« <em><strong>L'or contre l'or, l'argent contre l'argent, le blé contre le blé, l'orge contre l'orge, les dattes contre les dattes, et le sel contre le sel ; en quantités égales (semblable pour semblable), de main à main.</strong></em> » Rapporté par l'Imam Ahmad et Muslim <a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a>.</p>
<p>Ce hadith prouve donc l'interdiction de vendre de l'or contre de l'or, sous toutes ses formes, qu'il soit frappé (sous forme de monnaie/pièces) ou autre. De même, [le hadith prouve l'interdiction de] la vente d'argent contre de l'argent sous toutes ses formes, excepté si cela est fait en quantités égales (semblable pour semblable), de main à main, de manière strictement identique.</p>
<p>Il en est de même pour la vente de blé contre du blé, d'orge contre de l'orge, de dattes contre des dattes — sous toutes leurs variétés —, et de sel contre du sel : [ces ventes sont interdites] sauf si les biens sont équivalents, en quantités égales (semblable pour semblable), de manière strictement identique, de main à main.</p>
<p>Enfin, tout ce qui partage la même cause juridique ('Illah) que ces six éléments leur est assimilé par analogie (Qiyâs). Par conséquent, l'inégalité de quantité (Al-Tafâdul) y est également interdite selon la majorité des gens de science (Djoumhoor Ahl al-'Ilm) ; cependant, ils ont divergé quant à la définition exacte de cette cause juridique ('Illah).</p>
<p>L'avis authentique (correct) est que la cause légale (Illah) concernant les deux monnaies [l'or et l'argent] est leur fonction de valeur marchande (le prix). Ainsi, on leur assimile par analogie (Qiyâs) tout ce qui sert de monnaie d'échange, comme les billets de banque utilisés à notre époque. Dès lors, l'inégalité de quantité (le surplus) y est interdite lorsque ces billets sont vendus les uns contre les autres tout en étant de même nature, c'est-à-dire lorsqu'ils proviennent d'un même État.</p>
<p>Et l'avis authentique (correct) est que la cause légale (Illah) concernant le reste des six catégories [citées dans le hadith, à savoir] : le blé, l'orge, les dattes et le sel, est la mesure de capacité (le volume) ou le poids, tout en étant des denrées comestibles. Ainsi, le statut juridique s'étend à tout ce qui partage cette même cause légale parmi ce qui se mesure ou se pèse tout en étant comestible ; il y est donc interdit de pratiquer l'usure d'inégalité (Ribâ At-Tafâdul).</p>
<p>Cheikh al-Islam Ibn Taymiyyah (qu'Allah lui fasse miséricorde) a dit :</p>
<p>« <em>Et la cause légale (Illah) concernant l'interdiction de l'usure d'inégalité (Ribâ al-Fadl) est : la mesure de capacité (le volume) ou le poids, conjointement avec le fait d'être une denrée comestible. Et c'est une version rapportée [de l'avis] d'Ahmad.</em> » Fin de citation.</p>
<p>En se basant sur cela, tout ce qui partage avec ces six éléments textuellement cités la même cause légale (Illah) — en étant soit mesuré (au volume) et comestible, soit pesé et comestible, ou encore si la cause de la valeur marchande (fonction monétaire) s'y réalise s'il s'agit d'une monnaie — est alors sujet à l'usure (Ribâ).</p>
<p>Si, en plus de la cause légale commune, s'ajoute l'unicité de nature (le même genre) : comme le fait de vendre du blé contre du blé par exemple, il est alors interdit de pratiquer l'inégalité de quantité (le surplus) ainsi que le délai de livraison (le paiement différé). Cela s'appuie sur la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><strong><span dir="rtl">«الذَّهَبُ بِالذَّهَبِ، وَالفِضَّةُ بِالفِضَّةِ، وَالبُرُّ بِالبُرِّ، وَالشَّعِيرُ بِالشَّعِيرِ، وَالتَّمْرُ بِالتَّمْرِ، وَالمِلْحُ بِالمِلْحِ؛ مِثْلاً بِمِثْلٍ، يَدَاً بِيَدٍ»</span></strong></p>
<p><em><strong>« L'or contre l'or, l'argent contre l'argent, le blé contre le blé, l'orge contre l'orge, les dattes contre les dattes, et le sel contre le sel : quantité égale pour quantité égale, main à main (immédiatement). »</strong></em> <a href="#fn6" class="footnote-ref" id="fnref6" role="doc-noteref"><sup>6</sup></a></p>
<p>Si la cause légale est identique mais que la nature (le genre) diffère : comme [vendre] du blé contre de l'orge, il est alors interdit de pratiquer le délai de livraison (le paiement différé), tandis que l'inégalité de quantité (le surplus) est autorisée. Cela s'appuie sur la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><strong><span dir="rtl">«فَإِذَا اخْتَلَفَتْ هَذِهِ الأَشْيَاءُ؛ فَبِيعُوا كَيْفَ شِئْتُمْ إِذَا كَانَ يَدَاً بِيَدٍ»</span></strong></p>
<p><em><strong>« Si ces catégories diffèrent, alors vendez comme bon vous semble, tant que cela se fait main à main (immédiatement). »</strong></em> Rapporté par Muslim et Aboû Dâwoûd <a href="#fn7" class="footnote-ref" id="fnref7" role="doc-noteref"><sup>7</sup></a>.</p>
<p>Et le sens de sa parole « <em><strong>main à main</strong></em> » signifie : une transaction au comptant, avec une prise de possession immédiate dans l'assise du contrat, avant que les deux parties ne se séparent l'une de l'autre.</p>
<p>Si la cause légale et la nature (le genre) diffèrent toutes deux : les deux procédés sont alors autorisés : l'inégalité de quantité (le surplus) ainsi que le délai de livraison (le paiement différé), à l'exemple de [la vente de] l'or contre du blé, ou de l'argent contre de l'orge.</p>
<p>Ensuite, sachons qu'il n'est pas permis de vendre un bien mesurable (au volume) contre un bien de même nature si ce n'est par une mesure de capacité (volume), ni un bien pesable contre un bien de même nature si ce n'est au poids. Cela s'appuie sur la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><strong><span dir="rtl">«الذَّهَبُ بِالذَّهَبِ وَزْناً بِوَزْنٍ، وَالفِضَّةُ بِالفِضَّةِ وَزْناً بِوَزْنٍ، وَالبُرُّ بِالبُرِّ كَيْلاً بِكَيْلٍ، وَالشَّعِيرُ بِالشَّعِيرِ كَيْلاً بِكَيْلٍ»</span></strong></p>
<p><em><strong>« L'or contre l'or au poids pour du poids, l'argent contre l'argent au poids pour du poids, le blé contre le blé à la mesure pour de la mesure, et l'orge contre l'orge à la mesure pour de la mesure »</strong></em> <a href="#fn8" class="footnote-ref" id="fnref8" role="doc-noteref"><sup>8</sup></a>.</p>
<p>De plus, pour tout échange où l'on contreviendrait à l'unité de mesure fixée par la législation islamique (la <em>Shar'iah</em>), l'égalité stricte ne peut être garantie.</p>
<p>Par conséquent, il n’est pas permis de vendre un bien mesurable contre son semblable de même nature de manière estimative (à vue de nez / en bloc / <em>Juzâfan</em>), ni de vendre un bien pesable contre son semblable de même nature de manière estimative ; et ce, en raison de l'absence de certitude quant à l'égalité [des quantités]. Or, l'ignorance de l'égalité équivaut à la certitude de l'inégalité (du surplus).</p>
<p>⁕ Ensuite, le change monétaire (<em>As-Sarf</em>) consiste en la vente d'une valeur monétaire contre une autre valeur monétaire, que la nature (le genre) soit identique ou différente. Et peu importe que cette valeur monétaire soit de l'or, de l'argent ou des billets de banque (monnaie fiduciaire) utilisés à notre époque ; ces derniers prennent en effet le même statut juridique que l'or et l'argent, car ils partagent avec eux la même cause légale (<em>Illah</em>) liée à l'usure, à savoir : la fonction de valeur marchande (le prix).</p>
<ul>
<li><blockquote>
<p>Ainsi, lorsqu'une valeur monétaire est vendue contre une autre de même nature — comme de l'or contre de l'or, de l'argent contre de l'argent, ou un billet de banque contre son semblable (de même nature), à l'instar d'un dollar contre un dollar, ou de riyals saoudiens en billets contre des riyals saoudiens en billets —, il est alors obligatoire de respecter l'égalité stricte de la quantité ainsi que la prise de possession immédiate (le troc main à main) dans l'assise du contrat.</p>
</blockquote></li>
<li><blockquote>
<p>En revanche, si une valeur monétaire est vendue contre une autre de nature différente — comme le fait de vendre des riyals saoudiens en billets contre des dollars américains par exemple, ou de l'or contre de l'argent —, une seule chose est alors obligatoire : l'immédiateté (la transaction au comptant) et la prise de possession dans l'assise du contrat. Quant à la différence de quantité (le surplus), elle est autorisée. Il en va de même si des bijoux en or sont vendus contre des dirhams en argent ou contre des billets de banque : l'immédiateté et la prise de possession dans l'assise du contrat sont obligatoires. De la même manière, [cette règle s'applique] si des bijoux en argent sont vendus contre de l'or par exemple.</p>
</blockquote></li>
<li><blockquote>
<p>Quant au cas où des bijoux en or ou en argent sont vendus contre des bijoux ou de la monnaie de même nature — comme le fait de vendre des bijoux en or contre de l'or, ou des bijoux en argent contre de l'argent —, les deux conditions deviennent alors obligatoires : l'égalité stricte du poids, ainsi que l'immédiateté (la transaction au comptant) et la prise de possession dans l'assise du contrat.</p>
</blockquote></li>
</ul>
<p>⁕ <strong>Le danger de l'usure (Ribâ) est immense, et il est impossible de s'en prémunir sans en connaître les règles juridiques.</strong> Dès lors, quiconque n'est pas capable de les connaître par lui-même se doit d'interroger les gens de science à ce sujet.</p>
<p>Il ne lui est pas permis de s'engager dans une transaction financière sans s'être préalablement assuré qu'elle est exempte d'usure, afin de préserver sa religion et d'échapper au châtiment d'Allah dont Il a menacé ceux qui pratiquent l'usure.</p>
<p>De même, il n'est pas permis d'imiter aveuglément les gens dans leurs pratiques sans une preuve claire (Basîrah), particulièrement à notre époque actuelle où l'insouciance s'est généralisée quant à la nature et la licéité des gains. Le Prophète <span dir="rtl">ﷺ</span> a d'ailleurs annoncé qu'à la fin des temps, le recours à l'usure se multiplierait, au point que celui qui ne la consomme pas sera tout de même atteint par sa poussière.</p>
<p>⁕ Parmi les transactions usuraires contemporaines, on trouve le refinancement ou le report de la dette au détriment du débiteur en difficulté (Qalbou ad-dayn 'alâ al-mou'sir) : lorsque la dette arrive à échéance et que le débiteur n'a pas de quoi rembourser, on augmente alors le montant de sa dette selon des quantités ou un pourcentage précis en fonction du retard de paiement. C'est exactement cela, l'usure de l'époque préislamique (Ribâ al-Jâhiliyyah), et cela est interdit à l'unanimité (Ijmâ') des musulmans.</p>
<p>Allah — Le Très-Haut — a dit à ce sujet :</p>
<p class="ar"><strong><span dir="rtl">﴿يَٰأَيُّهَا ٱلَّذِينَ ءَامَنُواْ ٱتَّقُواْ ٱللَّهَ وَذَرُواْ مَا بَقِيَ مِنَ ٱلرِّبَوٰٓاْ إِن كُنتُم مُّؤْمِنِينَ ﴿٢٧٨﴾ فَإِن لَّمْ تَفْعَلُواْ فَأْذَنُواْ بِحَرْبٍ مِّنَ ٱللَّهِ وَرَسُولِهِۦۖ وَإِن تُبْتُمْ فَلَكُمْ رُءُوسُ أَمْوَٰلِكُمْ لَا تَظْلِمُونَ وَلَا تُظْلَمُونَ ﴿٢٧٩﴾ وَإِن كَانَ ذُو عُسْرَةٍ فَنَظِرَةٌ إِلَىٰ مَيْسَرَةٍ﴾ [البقرة: ٢٧٨ - ٢٨٠]</span></strong></p>
<p>« <strong>Ô les croyants ! Craignez Allah, et renoncez au reliquat de l’intérêt usuraire, si vous êtes croyants. Et si vous ne le faites pas, alors recevez l'annonce d'une guerre de la part d'Allah et de Son messager. Et si vous vous repentez, vous aurez vos capitaux. Vous ne léserez personne, et vous ne serez point lésés. À celui qui est dans la gêne, accordez un délai jusqu’à ce qu’il soit dans l’aisance.</strong> » [Sourate Al-Baqarah, versets 278 à 280].</p>
<p>Dans ce noble verset figure un ensemble de menaces [sévères] concernant la pratique de ce type d'usure :</p>
<p><strong>Premièrement :</strong> Le fait qu'Il — Gloire et Pureté à Lui — a interpellé Ses serviteurs par l'attribut de la foi :</p>
<p class="ar"><strong><span dir="rtl">﴿يَٰأَيُّهَا ٱلَّذِينَ ءَامَنُواْ﴾</span></strong></p>
<p><strong>﴾ Ô les croyants ! ﴿</strong></p>
<p>puis Il a dit :</p>
<p class="ar"><strong><span dir="rtl">﴿إِن كُنتُم مُّؤْمِنِينَ﴾</span></strong></p>
<p><strong>﴾ ...si vous êtes croyants ﴿</strong></p>
<p>Cela prouve donc que la pratique de l'usure ne convient pas au croyant.</p>
<p><strong>Deuxièmement :</strong> Allah — Le Très-Haut — a dit :</p>
<p class="ar"><strong><span dir="rtl">﴿ٱتَّقُواْ ٱللَّهَ﴾</span></strong></p>
<blockquote>
<p><strong>﴾ Craignez Allah ﴿</strong></p>
</blockquote>
<p>Cela prouve donc que celui qui pratique l'usure ne préserve pas sa relation avec Allah (ne fait pas preuve de piété) et ne Le redoute pas.</p>
<p><strong>Troisièmement :</strong> Allah — Le Très-Haut — a dit :</p>
<p class="ar"><strong><span dir="rtl">﴿وَذَرُواْ مَا بَقِيَ مِنَ ٱلرِّبَوٰٓاْ﴾</span></strong></p>
<blockquote>
<p><strong>﴾...et renoncez au reliquat de l’intérêt usuraire ﴿</strong></p>
</blockquote>
<p>C'est-à-dire : délaissez-le. Il s'agit là d'un ordre d'abandonner l'usure, et l'ordre [dans la législation] implique l'obligation (<em>Al-Woujoûb</em>). Cela prouve donc que quiconque pratique l'usure a certes désobéi à l'ordre d'Allah.</p>
<p><strong>Quatrièmement :</strong> Le fait qu'Il — Gloire et Pureté à Lui — a déclaré la guerre à quiconque ne délaisse pas les transactions usuraires. Allah — Le Très-Haut — a en effet dit :</p>
<p class="ar"><strong><span dir="rtl">﴿فَإِن لَّمْ تَفْعَلُواْ﴾</span></strong></p>
<blockquote>
<p><strong>﴾ Et si vous ne le faites pas ﴿</strong></p>
</blockquote>
<p>C'est-à-dire : si vous ne délaissez pas l'usure ;</p>
<p class="ar"><strong><span dir="rtl">﴿فَأْذَنُواْ بِحَرْبٍ مِّنَ ٱللَّهِ وَرَسُولِهِۦ﴾</span></strong></p>
<p><strong>﴾...alors recevez l'annonce d'une guerre de la part d'Allah et de Son messager﴿</strong></p>
<p>C'est-à-dire : sachez que vous entrez en guerre contre Allah et Son messager.</p>
<p><strong>Cinquièmement :</strong> La qualification de celui qui pratique l'usure (le créancier usurier) comme étant un injuste (un oppresseur). Cela apparaît dans la parole d'Allah — Le Très-Haut — :</p>
<p class="ar"><strong><span dir="rtl">﴿فَلَكُمْ رُءُوسُ أَمْوَٰلِكُمْ لَا تَظْلِمُونَ وَلَا تُظْلَمُونَ﴾</span></strong></p>
<p><strong>﴾...vous aurez vos capitaux. Vous ne léserez personne (vous ne commettrez pas d'injustice), et vous ne serez point lésés (vous ne subirez pas d'injustice)﴿</strong>.</p>
<p>⁕ <strong>Parmi les transactions usuraires, on trouve le prêt à intérêt.</strong> Cela consiste à prêter une chose à quelqu'un à la condition qu'il rende plus que ce qu'il a reçu, ou à lui verser une somme d'argent à charge pour lui de la restituer majorée d'un pourcentage déterminé, comme cela se pratique couramment dans les banques. Et il s'agit là d'une usure explicite (Ribâ Sarîh).</p>
<p>Les banques concluent en effet des contrats de prêt avec les personnes dans le besoin, les chefs d'entreprise (commerçants), les propriétaires d'usines et les différents artisans ; elles versent à ces derniers des sommes d'argent en contrepartie d'un intérêt fixé selon un taux de pourcentage. De plus, ce pourcentage augmente en cas de retard de paiement par rapport à l'échéance fixée. Ainsi se trouvent réunies dans cette pratique les deux formes d'usure : l'usure d'inégalité (Ribâ al-Fadl) et l'usure de délai (Ribâ an-Nasî'ah).</p>
<p>⁕ Et parmi les transactions usuraires (riba), il y a ce qui se pratique dans les banques sous forme de dépôt à intérêt. Il s'agit des dépôts à terme fixe, que la banque utilise jusqu'à l'échéance du terme, et pour lesquels elle verse à leur propriétaire un intérêt fixe selon un pourcentage déterminé, comme dix ou cinq pour cent.</p>
<p>⁕ Et parmi les transactions usuraires, il y a <em>Bay' al-'Înah</em>. Elle consiste à vendre une marchandise à une personne à un prix payé à terme (à crédit), puis à la lui racheter immédiatement à un prix au comptant inférieur au prix à terme. Cette transaction a été nommée <em>Bay' al-'Înah</em> car l'acheteur de la marchandise à terme prend en échange de celle-ci du <em>'Ayn</em>, c'est-à-dire de l'argent liquide immédiat.</p>
<p>La vente sous cette forme n'est en réalité qu'une ruse pour parvenir à l'usure (<em>Riba</em>). L'interdiction de cette transaction a certes été rapportée dans de nombreux hadiths et récits (<em>Âthâr</em>). Parmi ceux-ci, la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><strong><span dir="rtl">«إِذَا تَبَايَعْتُمْ بِالْعِينَةِ، وَأَخَذْتُمْ أَذْنَابَ الْبَقَرِ، وَرَضِيتُمْ بِالزَّرْعِ، وَتَرَكْتُمُ الْجِهَادَ؛ سَلَّطَ اللَّهُ عَلَيْكُمْ ذُلًّا لَا يَنْزِعُهُ حَتَّى تَرْجِعُوا إِلَى دِينِكُمْ»</span></strong></p>
<p><em><strong>"Quand vous pratiquerez la Bay' al-'Înah, que vous saisirez les queues des vaches, que vous vous contenterez de la culture et que vous délaisserez le Jihâd, Allah fera s'abattre sur vous une humiliation qu'Il ne retirera pas tant que vous ne reviendrez pas à votre religion."</strong></em> (Rapporté par Abou Dâwoûd).<a href="#fn9" class="footnote-ref" id="fnref9" role="doc-noteref"><sup>9</sup></a></p>
<p>Et il <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><strong><span dir="rtl">«يَأْتِي عَلَى النَّاسِ زَمَانٌ يَسْتَحِلُّونَ الرِّبَا بِالْبَيْعِ»</span></strong></p>
<p><em><strong>"Il viendra une époque pour les gens où ils rendront licite l'usure (Riba) en l'appelant commerce (vente)."</strong></em><a href="#fn10" class="footnote-ref" id="fnref10" role="doc-noteref"><sup>10</sup></a></p>
<p>⁕ Prenez donc garde à l'introduction de l'usure (<em>Riba</em>) dans vos transactions, ainsi qu'à son mélange avec vos biens. En effet, le fait de consommer l'usure et d'y recourir compte parmi les plus grands péchés majeurs (<em>Al-Kabâ'ir</em>). L'usure et la fornication ne se propagent jamais au sein d'un peuple sans que n'apparaissent parmi eux la pauvreté, les maladies incurables et l'injustice du détenteur du pouvoir. De plus, l'usure détruit les richesses et annihile les bénédictions (<em>Al-Barakât</em>).</p>
<p>⁕ Allah a certes intensifié la menace à l'encontre de celui qui consomme l'usure (<em>Riba</em>). Il a fait de sa consommation l'une des immondices les plus abominables et l'un des plus grands péchés majeurs. Il a exposé le châtiment de l'usurier dans l'ici-bas et dans l'au-delà, et a informé qu'il est en guerre contre Allah et Son messager.</p>
<p>Ainsi, son châtiment dans l'ici-bas réside dans le fait qu'Il annihile la bénédiction (<em>Barakah</em>) des biens et les expose à la destruction et à la perte. Combien de fois entendez-vous parler de la perte de richesses immenses causée par des incendies, des noyades ou des inondations, laissant leurs propriétaires pauvres parmi les gens ? Et même si ces biens usuraires restent entre les mains de leurs possesseurs, ils sont dépourvus de toute bénédiction : ils n'en tirent aucun profit réel, mais ils n'en endurent que les peines, en assument les comptes (le jour du Jugement) et en subissent le châtiment.</p>
<p>L'usurier est détesté auprès d'Allah et auprès de Sa création, car il prend et ne donne pas, il amasse et retient, il ne dépense pas et ne fait pas l'aumône. Il est avare et cupide, accumulateur et refusant le bien. Les cœurs éprouvent de l'aversion pour lui et la société le rejette ; ceci constitue son châtiment immédiat. Quant à son châtiment futur (dans l'au-delà), il est plus sévère et plus durable, comme Allah l'a exposé dans Son Livre. Et il n'en est ainsi que parce que l'usure est un gain impur, un bien illicite (<em>Suht</em>) nuisible et un lourd cauchemar qui pèse sur les sociétés humaines.</p>
