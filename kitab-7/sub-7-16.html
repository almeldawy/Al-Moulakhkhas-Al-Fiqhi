<p><strong>⁕</strong> La <em>Kafâlah</em> consiste à s'engager à mener (présenter) la personne redevable d'un droit financier devant le titulaire de ce droit (le créancier).</p>
<p>Ainsi, le contrat de <em>Kafâlah</em> porte sur le corps de la personne cautionnée (<em>Al-Makfoûl</em>). De ce fait, le cautionnement corporel est valable pour toute personne redevable d'un droit financier, comme une dette.</p>
<p>En revanche, le cautionnement corporel n'est pas valable pour une personne passible d'une peine légale (<em>Hadd</em>), car la <em>Kafâlah</em> est une recherche de garantie (de certitude), alors que les peines légales reposent sur le principe de leur annulation en cas de doute ; la notion de garantie ne s'y applique donc pas.</p>
<p>De même, le cautionnement corporel n'est pas valable pour une personne passible du talion (<em>Qisâs</em>), car le talion ne peut être appliqué à un autre que le coupable lui-même, et il n'est pas permis de l'appliquer au garant (<em>Al-Kafîl</em>) s'il s'avère incapable de présenter la personne cautionnée.</p>
<p>⁕ Et il est exigé, pour la validité de la <em>Kafâlah</em> (le cautionnement), qu'elle se fasse avec le consentement du garant (<em>Al-Kafîl</em>), car une obligation ne peut lui incomber initialement sans son consentement.</p>
<p>⁕ Le garant (<em>Al-Kafîl</em>) est déchargé de son obligation en cas de mort de la personne cautionnée (<em>Al-Makfoûl</em>) qu'il est désormais impossible de présenter. Il en est également déchargé si la personne cautionnée se livre elle-même au titulaire du droit (au créancier), au lieu et au moment prévus pour la remise, car elle a ainsi accompli ce qui incombait au garant.</p>
<p>En revanche, s'il s'avère impossible de présenter la personne cautionnée alors qu'elle est vivante, ou si elle s'est absentée (a disparu) et qu'un laps de temps suffisant pour la ramener s'est écoulé, le garant doit alors s'acquitter de la dette dont elle est redevable. Cela s'applique en raison de la portée générale de la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><strong>«<span dir="rtl">الزَّعِيمُ غَارِم</span>ٌ»</strong></p>
<p><em><strong>« Le garant est redevable (de la dette). »</strong></em><a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a></p>
<p>⁕ Parmi les questions relatives à la <em>Kafâlah</em>, il y a le fait qu'il est permis de garantir « la connaissance (l'identification) de la personne ». C'est le cas, par exemple, si un individu vient demander un prêt à un autre, et que ce dernier lui répond : « Je ne te connais pas, je ne te donne donc rien. » Un tiers intervient alors en disant : « Je me porte garant de sa connaissance pour toi », c'est-à-dire : « Je te ferai savoir qui il est et où il se trouve. » Dans ce cas, il est tenu de le présenter s'il vient à s'absenter (à disparaître). Il ne suffit pas de mentionner simplement son nom et son adresse. S'il s'avère incapable de le présenter alors que ce dernier est toujours vivant, il doit alors rembourser ce dont il est redevable (la dette). En effet, c'est lui qui a poussé le créancier à donner son argent en se portant garant de son identification. C'est comme s'il avait dit : « Je te garantis sa présence quand tu le souhaiteras. » Cela revient donc au même que s'il avait dit : « Je me porte garant corporellement pour lui (<em>Takaffaltu laka bi-badinihi</em>). »</p>
