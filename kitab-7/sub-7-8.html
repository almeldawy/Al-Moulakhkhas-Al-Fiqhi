  <!-- ▼ CONTENU DU CHAPITRE ▼ -->
  <template id="chapter-content">
<p>⁕ Les capitaux fixes (Al-Usûl) désignent les maisons, les terres et les arbres. Il s'agit [également] de déterminer ce qui est rattaché à ces biens lorsqu'ils sont vendus et qui revient ainsi à l'acheteur, et ce qui ne s'y rattache pas et reste donc la propriété du vendeur. La connaissance de cela permet de trancher tout litige entre les deux parties, afin que chacun sache ce qui lui revient de droit et ce qu'il doit assumer. En effet, notre religion n'a laissé aucune chose comportant un intérêt pour nous ou un préjudice à notre encontre sans l'avoir clairement explicitée. Ainsi, lorsque cette religion est appliquée et que ses règles sont exécutées, il ne reste plus de place pour les disputes et les querelles.</p>
<p>Fait partie de cela le sujet que nous nous apprêtons à aborder : il arrive qu'une personne vende un bien lui appartenant, alors que ce bien est lié à des dépendances, des éléments complémentaires et des commodités, ou qu'il possède un produit/croissance, qu'il soit continu [lié au bien] ou distinct. Un désaccord surgit alors entre les deux contractants : lequel des deux est en droit d'obtenir ces éléments dépendants ? C'est afin de trancher entre eux lors d'un tel différend que les juristes (Al-Fuqahâ), qu'Allah leur fasse miséricorde, ont établi un chapitre dans le droit islamique (Al-Fiqh) qu'ils ont intitulé : « Chapitre de la vente des biens immobiliers (Al-Usûl) et des fruits », dans lequel ils ont exposé ces règles.</p>
<p>⁕ Ainsi, lorsqu'une personne vend une maison, la vente englobe sa construction et son toit, car tout cela est inclus dans la désignation même de « maison ». De même, elle englobe ce qui y est rattaché et qui concourt à son bon usage (son intérêt), à l'instar des portes installées, des escaliers, des étagères qui y sont clouées, ainsi que des appareils mécaniques qui y sont montés comme les ascenseurs (ou monte-charges). [Sont aussi inclus] les installations électriques, les luminaires suspendus pour l'éclairage, les réservoirs d'eau enterrés ou fixés sur le toit, les canalisations déployées pour la distribution de l'eau, ainsi que les appareils de climatisation fixés à leur emplacement pour réguler l'air ou pour chauffer l'eau. La vente comprend également les arbres et les plantations se trouvant dans la propriété, les auvents (ou tonnelles) qui y sont érigés, tout comme elle englobe les minéraux solides situés dans le sous-sol de la propriété.</p>
<p>Quant aux objets simplement déposés (entreposés) dans la maison et qui en sont distincts (amovibles), ils ne sont pas inclus dans la vente. C'est le cas par exemple du bois [en vrac], des cordes, des ustensiles, des tapis et meubles non fixés, ou encore de ce qui a été enfoui dans la terre de la propriété dans le but d'être conservé, comme des pierres précieuses, des trésors ou autre. Tous ces éléments ne sont pas concernés par la vente car ils sont séparés de la maison et n'entrent pas dans sa définition ; à l'exception de ce qui est indispensable à son bon usage, comme les clés, car celles-ci suivent le bien [vendu] bien qu'elles en soient physiquement séparées.</p>
<p>⁕ Et lorsqu'une personne vend un terrain, la vente englobe tout ce qui y est rattaché de manière permanente et durable, à l'instar des plantations (arbres, jeunes pousses) et des constructions.</p>
<p>⁕ De même, s'il vend un verger (ou jardin), la vente englobe son terrain, ses arbres, ses murs d'enceinte ainsi que les habitations qui s'y trouvent.</p>
<p>En revanche, s'il vend un terrain comportant une culture qui ne se récolte qu'une seule fois, à l'instar du blé et de l'orge, celle-ci revient au vendeur et n'est pas incluse dans le contrat.</p>
<p>Si, toutefois, le terrain vendu comporte une culture qui se fauche (ou se coupe) à plusieurs reprises, comme la luzerne (Al-Qitt), ou qui se cueille à plusieurs reprises, comme le concombre arménien (Al-Qithâ') et l'aubergine, alors ses racines (la base de la plante) reviennent à l'acheteur du terrain, par rattachement à la terre. Quant à la coupe ou à la récolte déjà apparente et mûre au moment de la vente, elle revient au vendeur.</p>
<p>⁕ Tout le détail qui vient d'être exposé — concernant ce qui revient au vendeur et ce qui revient à l'acheteur lors de la vente de biens immobiliers (ou capitaux fixes) — s'applique uniquement en l'absence de condition préalable stipulée entre les deux parties. En revanche, si une clause contractuelle attribue ces éléments à l'un plutôt qu'à l'autre, il est obligatoire de s'y conformer. Cela s'appuie sur la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><strong><span dir="rtl">«الْمُسْلِمُونَ عَلَى شُرُوطِهِمْ»</span></strong></p>
<p>« <em><strong>Les musulmans sont tenus de respecter leurs conditions (engagements)</strong></em> »<a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a>.</p>
<p>⁕ Et quiconque vend des palmiers dont les spathes (fleurs) ont déjà été pollinisées, leurs fruits reviennent alors au vendeur. Cela s'appuie sur la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><strong><span dir="rtl">«مَنِ ابْتَاعَ نَخْلاً بَعْدَ أَنْ تُؤَبَّرَ؛ فَثَمَرَتُهَا لِلَّذِي بَاعَهَا؛ إِلَّا أَنْ يَشْتَرِطَهُ الْمُبْتَاعُ»</span></strong></p>
<p>« <em><strong>Quiconque achète des palmiers après qu'ils ont été pollinisés, leurs fruits reviennent à celui qui les a vendus, à moins que l'acheteur ne l'ait stipulé [dans le contrat]</strong></em> » (rapporté par Al-Bukhârî et Muslim)<a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a>.</p>
<p>La pollinisation (<em>Al-Ta'bîr</em>) désigne ici la fécondation (<em>Al-Talqîh</em>). Et il en va de même, concernant cette règle juridique, pour les vignes, les mûriers et les grenadiers : s'ils sont vendus après l'apparition de leurs fruits, ces derniers reviennent au vendeur.</p>
<p>En revanche, tout ce qui se trouve avant la pollinisation pour le palmier, et avant l'apparition [des fruits] pour la vigne et ses équivalents, revient à l'acheteur. Cela est déduit par implication (<em>Mafhûm</em>) du noble Hadith concernant le palmier, et par analogie (<em>Qiyâs</em>) des autres types d'arbres sur celui-ci.</p>
<p>⁕ À travers cela, tu comprends la perfection de cette Législation islamique (<em>Shari'ah</em>) ainsi que sa capacité à résoudre les problèmes des gens. Elle accorde à chaque ayant droit son dû, sans la moindre injustice ni préjudice envers autrui. Il n'est pas un problème sans qu'elle n'y ait apporté une solution pleinement suffisante, englobant l'intérêt général et la sagesse. C'est une législation émanant d'un Sage, digne de louange, qui connaît parfaitement ce qui est bénéfique pour Ses serviteurs et ce qui leur nuit, en tout temps et en tout lieu.</p>
<p>Et Allah le Très Grand a dit vrai lorsqu'Il dit :</p>
<p class="ar"><strong><span dir="rtl">﴿يَٰأَيُّهَا ٱلَّذِينَ ءَامَنُواْ أَطِيعُواْ ٱللَّهَ وَأَطِيعُواْ ٱلرَّسُولَ وَأُوْلِي ٱلأَمْرِ مِنكُمْ فَإِن تَنَٰزَعْتُمْ فِي شَيْءٍ فَرُدُّوهُ إِلَى ٱللَّهِ وَٱلرَّسُولِ إِن كُنتُمْ تُؤْمِنُونَ بِٱللَّهِ وَٱلْيَوْمِ ٱلْآخِرِ ذَٰلِكَ خَيْرٌ وَأَحْسَنُ تَأْوِيلًا ٥٩﴾ [النساء: ٥٩]</span></strong></p>
<p><em><strong>« Ô les croyants ! Obéissez à Allah, et obéissez au Messager et à ceux d'entre vous qui détiennent le commandement. Puis, si vous vous disputez en quoi que ce soit, renvoyez-le à Allah et au Messager, si vous croyez en Allah et au Jour dernier. Ce sera bien mieux et de meilleure interprétation (aboutissement). »</strong></em> (Sourate An-Nisâ', verset 59).</p>
<p>Rien ne tranche définitivement les litiges entre les hommes, ne préserve les intérêts et n'apaise les âmes croyantes si ce n'est le jugement d'Allah et de Son Messager. Quant aux systèmes conçus par les hommes, ils demeurent imparfaits de l'imperfection même de l'être humain, et sont sujets aux passions ainsi qu'aux discordes, comme l'a dit Allah le Très-Haut :</p>
<p class="ar"><strong><span dir="rtl">﴿وَلَوِ ٱتَّبَعَ ٱلْحَقُّ أَهْوَآءَهُمْ لَفَسَدَتِ ٱلسَّمَٰوَٰتُ وَٱلأَرْضُ وَمَن فِيهِنَّ﴾ [المؤمنون: ٧١]</span></strong></p>
<p><em><strong>« Si la Vérité avait suivi leurs passions, les cieux et la terre et ceux qui s'y trouvent auraient certes été corrompus. »</strong></em> (Sourate Al-Mu'minûn, verset 71).</p>
<p>Malheur et perdition donc à ces esprits qui substituent aux lois d'Allah et de Son Messager les lois humaines !</p>
<p class="ar"><strong><span dir="rtl">﴿أَفَحُكْمَ ٱلْجَٰهِلِيَّةِ يَبْغُونَ وَمَنْ أَحْسَنُ مِنَ ٱللَّهِ حُكْمًا لِّقَوْمٍ يُوقِنُونَ ٥٠﴾ [المائدة: ٥٠]</span></strong><span dir="ltr">.</span></p>
<p><em><strong>« Est-ce donc le jugement du temps de l'Ignorance (Al-Jâhiliyyah) qu'ils cherchent ? Et qui est meilleur qu'Allah en matière de jugement pour des gens qui ont une foi ferme ? »</strong></em> (Sourate Al-Mâ'idah, verset 50).</p>
<p>Nous demandons à Allah de faire triompher Sa religion, d'élever Sa parole et de préserver les musulmans des ruses de leurs ennemis. Certes, Il est Celui qui entend tout et qui exauce les invocations.</p>
