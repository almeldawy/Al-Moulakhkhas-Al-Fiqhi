<h2 id="بسم-الله-الرحمن-الرحيم"><span dir="rtl">بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيم</span>ِ</h2>
<p><strong>Chapitre sur les règles des ventes</strong></p>
<p>⁕ Allah a clarifié dans Son Noble Livre, et le Prophète <span dir="rtl">ﷺ</span> a exposé dans sa Sunna purifiée, les règles des transactions ؛ en raison du besoin des gens à cela ؛ car ils ont besoin de la nourriture par laquelle leurs corps se fortifient, ainsi que des vêtements, des logements, des moyens de transport et autres nécessités ou compléments de la vie.</p>
<p>⁕ La vente est autorisée selon le Livre (Coran), la Sunna, le consensus (Ijmâ') et le raisonnement par analogie (Qiyâs).</p>
<p>Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="ltr">﴿</span><strong><span dir="rtl">وَأَحَلَّ اللهُ الْبَيْعَ</span></strong><span dir="rtl">﴾ [البقرة: ٢٧٥]</span></p>
<p>« <em><strong>Et Allah a rendu licite le commerce</strong></em> » [Al-Baqarah : 275].</p>
<p>Et Il a dit :</p>
<p class="ar"><span dir="ltr">﴿</span><strong><span dir="rtl">لَيْسَ عَلَيْكُمْ جُنَاحٌ أَنْ تَبْتَغُوا فَضْلًا مِنْ رَبِّكُمْ</span></strong><span dir="rtl">﴾ [البقرة: ١٩٨]</span></p>
<p>« <em><strong>Ce n'est pas un péché que d'aller en quête de quelque grâce de votre Seigneur</strong></em> » [Al-Baqarah : 198].</p>
<p>Le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="ltr">«</span><strong><span dir="rtl">الْبَيِّعَانِ بِالْخِيَارِ مَا لَمْ يَتَفَرَّقَا، فَإِنْ صَدَقَا وَبَيَّنَا؛ بُورِكَ لَهُمَا فِي بَيْعِهِمَا، وَإِنْ كَذَبَا وَكَتَمَا؛ مُحِقَتْ بَرَكَةُ بَيْعِهِمَا</span></strong><span dir="ltr">»</span></p>
<p>« <em><strong>Les deux parties contractantes ont le droit d'option tant qu'elles ne se sont pas séparées. S'ils sont sincères et clarifient les choses, leur vente sera bénie ; mais s'ils mentent et cachent [les défauts], la bénédiction de leur vente sera anéantie</strong></em> ».<a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a></p>
<p>Les savants se sont accordés à l'unanimité sur cela de manière générale.</p>
<p>Quant au raisonnement par analogie : d'un côté, le besoin des gens appelle à l'existence de la vente ; car les besoins d'une personne dépendent de ce que possède autrui, qu'il s'agisse d'argent ou d'un bien. Or, personne ne cède un bien sans contrepartie. La sagesse a donc exigé la permission de la vente pour atteindre l'objectif recherché.</p>
<p>⁕ La vente se conclut par la forme verbale ou par la forme gestuelle (acte).</p>
<p>⁓ <strong>La forme verbale</strong> se compose de : <strong>l'offre (al-îjâb)</strong>, qui est la parole émanant du vendeur, comme lorsqu'il dit : « <em><strong>J'ai vendu</strong></em> » ، et <strong>l'acceptation (al-qabûl)</strong>, qui est la parole émanant de l'acheteur, comme lorsqu'il dit : « <em><strong>J'ai acheté</strong></em> ».</p>
<p>⁓ <strong>La forme gestuelle</strong> est le don mutuel (al-mu‘âtâh) qui <strong>consiste en la prise et la remise</strong>, comme le fait de lui remettre la marchandise et qu'il lui donne en retour son prix habituel.</p>
<p>⁓ <strong>Il arrive également que la forme soit composée à la fois de paroles et d'actes</strong>.</p>
<p>Le Cheikh Taqî ad-Dîn (Ibn Taymiyyah) — qu'Allah lui fasse miséricorde — a dit : « <em>La vente par don mutuel (al-mu‘âtâh) revêt plusieurs formes :</em></p>
<p><em>⁓ <strong>La première :</strong> qu'il y ait de la part du vendeur une offre verbale seulement, et de la part de l'acheteur une prise du bien ؛ comme s'il dit : "Prends ce vêtement pour un dinar" et que l'autre le prend. Il en est de même si le prix est un objet précis ؛ par exemple s'il dit : "Prends ce vêtement en échange de ton vêtement" et qu'il le prend.</em></p>
<p><em>⁓ <strong>La deuxième :</strong> qu'il y ait une parole de la part de l'acheteur et une remise du bien de la part du vendeur, que le prix soit un objet défini ou une dette dont il se porte garant (engagement de paiement).</em></p>
<p><em>⁓ <strong>La troisième :</strong> qu'aucun des deux ne prononce de parole, mais qu'il existe un usage (coutume) consistant à poser le prix et à prendre l'objet vendu</em> ». Fin de citation.</p>
<p>⁕ <strong>Des conditions sont requises pour la validité de la vente.</strong> Certaines concernent les deux parties contractantes, tandis que d'autres concernent l'objet de la transaction. <strong>Si l'une de ces conditions fait défaut, la vente n'est pas valide</strong> :</p>
<p>⁓ <strong>Ainsi, il est requis pour les deux contractants</strong> :</p>
<p><strong>Premièrement :</strong> Le consentement mutuel des deux parties , la vente n'est donc pas valide si l'un des deux est contraint injustement , conformément à la parole du Très-Haut :</p>
<p class="ar"><span dir="ltr">﴿</span><strong><span dir="rtl">إِلَّا أَنْ تَكُونَ تِجَارَةً عَنْ تَرَاضٍ مِنْكُمْ</span></strong><span dir="rtl">﴾ [النساء: ٢٩]</span></p>
<p>« <em><strong>à moins que ce ne soit un commerce par consentement mutuel entre vous</strong></em> » [An-Nisa : 29].</p>
<p>Et le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="ltr">«</span><strong><span dir="rtl">إِنَّمَا البَيْعُ عَنْ تَرَاضٍ</span></strong><span dir="ltr">»</span></p>
<p></p>
<p>« <em><strong>La vente ne se fait que par consentement mutuel</strong></em> », rapporté par Ibn Hibbân, Ibn Mâjah et d'autres.<a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a></p>
<p>Cependant, si la contrainte est exercée de bon droit, la vente est valide ؛ comme si le juge contraint quelqu'un à vendre ses biens pour rembourser ses dettes ؛ car il s'agit là d'une contrainte légitime.</p>
<p><strong>Deuxièmement :</strong> Il est requis pour chacune des deux parties contractantes d'être apte à disposer de ses biens ; en étant libre, responsable (pubère et doué de raison) et avisé (mûr) ; ainsi, l'achat et la vente ne sont pas valides de la part d'un enfant, d'une personne irresponsable ( prodigue ou peu avisée dans la gestion de ses biens ), d'un fou ou d'un esclave sans l'autorisation de son maître.</p>
<p><strong>Troisièmement :</strong> Il est requis pour chacune des deux parties d'être propriétaire de l'objet du contrat ou de remplacer son propriétaire (mandataire), conformément à la parole du Prophète <span dir="rtl">ﷺ</span> à Hakîm ibn Hizâm :</p>
<p class="ar"><span dir="ltr">«</span><strong><span dir="rtl">لا تَبِعْ مَا لَيْسَ عِنْدَكَ</span></strong><span dir="ltr">»</span></p>
<p>« <em><strong>Ne vends pas ce que tu ne possèdes pas</strong></em> », rapporté par Ibn Mâjah et At-Tirmidhî qui l'a authentifié <a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a> ؛ c'est-à-dire : <strong>ne vends pas des biens matériels qui ne sont pas en ta possession</strong>.</p>
<p>Le Ministre (Ibn Hubayrah) a dit : « <em>Ils [les savants] se sont accordés sur le fait qu'il n'est pas permis de vendre ce que l'on n'a pas ou ce que l'on ne possède pas, pour ensuite aller l'acheter pour lui [l'acheteur], et qu'une telle transaction est nulle</em> ».</p>
<p>‣ <strong>Et trois conditions sont requises concernant l'objet de la vente :</strong></p>
<p><strong>Premièrement :</strong> Qu'il fasse partie de ce dont l'usage est absolument licite ؛ ainsi, la vente de ce dont l'usage est interdit n'est pas valide ؛ comme l'alcool, le porc, les instruments de divertissement [interdits] et la bête morte (non immolée), car le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="ltr">«</span><strong><span dir="rtl">إِنَّ اللَّهَ وَرَسُولَهُ حَرَّمَ بَيْعَ الْخَمْرِ وَالْمَيْتَةِ وَالْأَصْنَامِ</span></strong><span dir="ltr">»</span></p>
<p>« <em><strong>Certes, Allah et Son Messager ont interdit la vente de l'alcool, de la bête morte, du porc et des idoles</strong></em> », (Unanimement reconnu authentique). <a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a></p>
<p>Et selon Abu Dawud :</p>
<p class="ar"><span dir="ltr">«</span><strong><span dir="rtl">حَرَّمَ الْخَمْرَ وَثَمَنَهَا، وَحَرَّمَ الْمَيْتَةَ وَثَمَنَهَا، وَحَرَّمَ الْخِنْزِيرَ وَثَمَنَهُ</span></strong><span dir="ltr">»</span></p>
<p>« <em><strong>Il a interdit l'alcool et son prix, Il a interdit la bête morte et son prix, et Il a interdit le porc et son prix</strong></em> ». <a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a></p>
<p>Il n'est pas valide de vendre des graisses impures (Najas) ou souillées par une impureté ؛ car le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="ltr">«</span><strong><span dir="rtl">إِنَّ اللَّهَ إِذَا حَرَّمَ شَيْئًا؛ حَرَّمَ ثَمَنَهُ</span></strong><span dir="ltr">»</span></p>
<p>« <em><strong>Certes, quand Allah interdit une chose, Il en interdit le prix</strong></em> ».<a href="#fn6" class="footnote-ref" id="fnref6" role="doc-noteref"><sup>6</sup></a></p>
<p>Et dans le hadith faisant l'unanimité : [On demanda] :</p>
<p class="ar"><span dir="rtl">أَرَأَيْتَ شُحُومَ الْمَيْتَةِ؛ فَإِنَّهَا تُطْلَى بِهَا السُّفُنُ، وَتُدْهَنُ بِهَا الْجُلُودُ، وَيَسْتَصْبِحُ بِهَا النَّاسُ؟ فَقَالَ: «لَا، هُوَ حَرَامٌ»</span></p>
<p>"<em>Que dis-tu des graisses de la bête morte ? Car on en enduit les bateaux, on en graisse les peaux et les gens s'en servent pour l'éclairage.<strong>"</strong> Il répondit : « <strong>Non, c'est interdit</strong></em> <em>»</em>.<a href="#fn7" class="footnote-ref" id="fnref7" role="doc-noteref"><sup>7</sup></a></p>
<p><strong>Deuxièmement :</strong> Il est requis pour l'objet de la vente (le prix comme la marchandise) qu'il soit possible de le livrer ; car ce que l'on ne peut livrer est semblable à ce qui n'existe pas, sa vente n'est donc pas valide ; ainsi, il n'est pas valide de vendre un esclave fugitif, ni un chameau égaré, ni un oiseau dans les airs, ni un bien spolié vendu à quelqu'un d'autre que le spoliateur ou à quelqu'un incapable de le récupérer auprès de lui.</p>
<p><strong>Troisièmement :</strong> Il est requis que le prix et la marchandise soient tous deux connus des contractants ; car l'ignorance (Jahâlah) constitue un risque (Gharar), et le Gharar est interdit. Il n'est donc pas valide d'acheter ce que l'on n'a pas vu, ou ce que l'on a vu sans en connaître la nature. De même, il n'est pas valide de vendre un fœtus dans le ventre ou du lait dans le pis séparément [de la bête].</p>
<p>La vente par "toucher" (Mulâmasah) n'est pas valide non plus ؛ comme s'il dit : "<em>Tout vêtement que tu touches est à toi pour tel prix</em>".</p>
<p>Ni la vente par "jet" (Munâbadhah) ؛ comme s'il dit : "<em>Tout vêtement que tu me jettes est à tel prix</em>" ؛ d'après le hadith d'Abu Hurayrah : « <em><strong>Le Prophète <span dir="rtl">ﷺ</span> a interdit la Mulâmasah et la Munâbadhah</strong></em> » (Unanimement reconnu authentique) <a href="#fn8" class="footnote-ref" id="fnref8" role="doc-noteref"><sup>8</sup></a>.</p>
<p>Enfin, la vente par "jet de pierre" (Hasâh) n'est pas valide ؛ comme s'il dit : "<em>Lance ce caillou, et le vêtement sur lequel il tombera sera à toi pour tel prix</em>".</p>
