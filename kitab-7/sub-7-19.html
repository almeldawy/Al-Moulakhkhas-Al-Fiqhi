<p>⁕ Certes, l'Islam est venu pour préserver les biens et préserver les droits des gens. C'est pour cela qu'il a légiféré la mise sous tutelle (<em>Al-Hajr</em>) à l'encontre de quiconque le mérite, afin de protéger les biens des gens et leurs droits.</p>
<p>⁕ Littéralement (<em>Lughatan</em>), <em>Al-Hajr</em> signifie l'interdiction ou l'empêchement. C'est de là que ce qui est illicite (<em>Al-Harâm</em>) a été nommé <em>Hijr</em>, car on en est empêché. Le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿وَيَقُولُونَ حِجْراً مَحْجُوراً﴾</span></p>
<p><em><strong>« ...et ils s'écrieront : "Barrage totalement défendu !" »</strong></em> (Al-Furqân : 22), c'est-à-dire : une interdiction formelle.</p>
<p>De même, la raison (l'intellect) a été nommée <em>Hijr</em>. Le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿هَلْ فِي ذَلِكَ قَسَمٌ لِذِي حِجْرٍ﴾</span></p>
<p><strong><em>« N'y a-t-il pas là un serment de poids pour quiconque est doué de raison ? »</em></strong> (Al-Fajr : 5), c'est-à-dire : doué de raison. Car la raison empêche son possesseur de commettre ce qui est laid et dont les conséquences sont nuisibles.</p>
<p>⁕ Et le sens de <em>Al-Hajr</em> dans la législation islamique (<em>Char'an</em>) est : <strong>le fait d'interdire à une personne de disposer de ses propres biens</strong>.</p>
<p>⁕ Sa preuve tirée du Noble Coran est la parole du Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿وَلَا تُؤْتُوا السُّفَهَاءَ أَمْوَالَكُمُ...﴾</span></p>
<p><em><strong>« Et ne confiez pas aux incapables les biens... »</strong></em> (An-Nisâ' : 5), jusqu'à Sa parole :</p>
<p class="ar"><span dir="rtl">﴿وَابْتَلُوا الْيَتَامَى حَتَّى إِذَا بَلَغُوا النِّكَاحَ فَإِنْ آنَسْتُمْ مِنْهُمْ رُشْداً فَادْفَعُوا إِلَيْهِمْ أَمْوَالَهُمْ﴾</span></p>
<p><em><strong>« Et éprouvez les orphelins jusqu'à ce qu'ils atteignent l'âge du mariage ; et si vous trouvez en eux une bonne conduite (de la maturité), alors remettez-leur leurs biens. »</strong></em> (An-Nisâ' : 6).</p>
<p>Ces deux versets démontrent ainsi l'interdiction faite à l'insensé (<em>As-Safîh</em>) et à l'orphelin de disposer de leurs biens, afin qu'ils ne les dilapident pas et ne les perdent pas, et stipulent que leurs biens ne leur seront restitués qu'après confirmation de leur maturité dans leur gestion.</p>
<p>Et le Prophète <span dir="rtl">ﷺ</span> a effectivement mis sous tutelle (frappé d'interdiction de disposer de ses biens) certains Compagnons <a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a> afin d'acquitter les dettes qui leur incombaient.</p>
<p>⁕ <strong>Et la mise sous tutelle (Al-Hajr) est de deux sortes :</strong></p>
<p><strong>Le premier type : Une interdiction imposée à une personne pour préserver le droit (l'intérêt) d'autrui.</strong></p>
<p><strong>Exemples :</strong> La mise sous tutelle du failli (<em>Al-Muflis</em>) pour préserver l'intérêt de ses créanciers (<em>Al-Ghuramâ'</em>), ou l'interdiction faite au malade [atteint d'une maladie mortelle] de faire un testament léguant plus du tiers de ses biens, afin de préserver le droit de ses héritiers.</p>
<p><strong>Le second type :</strong> Une interdiction imposée à une personne pour son propre intérêt (sa propre sauvegarde), afin qu'elle ne dilapide pas ses biens et ne les perde pas.</p>
<p><strong>Exemples :</strong> La mise sous tutelle du mineur (l'enfant), de l'insensé (<em>As-Safîh</em>) et du fou (<em>Al-Majnûn</em>).</p>
<p>La preuve en est la parole du Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿وَلَا تُؤْتُوا السُّفَهَاءَ أَمْوَالَكُمُ﴾</span></p>
<p><em><strong>« Et ne confiez pas aux incapables les biens... »</strong></em> (An-Nisâ' : 5).</p>
<p>Il a été dit : ce qui est visé ici, ce sont les enfants et les femmes [lorsqu'ils ne savent pas gérer], afin de ne pas leur donner d'argent qu'ils dépenseraient par gaspillage.</p>
<p>Et il a été dit : ce qui est visé, ce sont les personnes stupides (irresponsables), les mineurs et les aliénés, à qui l'on ne donne pas leurs biens de peur qu'ils ne les dilapident.</p>
<p>Le Très-Haut a attribué ces biens aux tuteurs (en disant <em>« vos biens »</em>), car ce sont eux qui les supervisent, les gèrent et les préservent.</p>
<p>⁕ <strong>Le premier type : L'interdiction imposée à une personne pour préserver le droit d'autrui :</strong></p>
<p>Et ce qui est visé ici, c'est la mise sous tutelle du failli (<em>Al-Muflis</em>). Le failli est celui qui est redevable d'une dette immédiate (exigible) que ses biens disponibles ne permettent pas de couvrir. Il lui est alors interdit de disposer de ses biens afin de ne pas causer de tort aux créanciers (détenteurs des dettes).</p>
<p>Quant au débiteur en difficulté (<em>Al-Mu'sir</em>) qui n'est pas capable d'acquitter quoi que ce soit de sa dette, on ne doit pas le harceler pour son remboursement, et il est obligatoire de lui accorder un délai. Cela conformément à la parole du Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿وَإِنْ كَانَ ذُو عُسْرَةٍ فَنَظِرَةٌ إِلَى مَيْسَرَةٍ﴾</span></p>
<p><em><strong>« À celui qui est dans la gêne, accordez un sursis jusqu'à ce qu'il soit dans l'aisance. »</strong></em> (Al-Baqarah : 280).</p>
<p>Et concernant le mérite d'accorder un délai au débiteur en difficulté, le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="rtl">«مَنْ سَرَّهُ أَنْ يُظِلَّهُ اللهُ فِي ظِلِّهِ؛ فَلْيُيَسِّرْ عَلَى مُعْسِرٍ»</span></p>
<p><em><strong>« Quiconque aimerait qu'Allah l'abrite sous Son ombre, qu'il facilite alors la tâche à une personne en difficulté. »</strong></em><a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a></p>
<p>De plus, le fait de décharger complètement (effacer la dette) le débiteur en difficulté est encore meilleur que de lui accorder un sursis, conformément à la parole du Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿وَأَنْ تَصَدَّقُوا خَيْرٌ لَكُمْ﴾</span></p>
<p><strong><em>« Et faire remise de la dette à titre d'aumône est encore meilleur pour vous. »</em></strong> (Al-Baqarah : 280).</p>
<p>Quant à celui qui a la capacité d'acquitter sa dette, il n'est pas permis de le mettre sous tutelle (de le frapper d'interdiction de disposer de ses biens), car cela n'est pas nécessaire. Cependant, on lui ordonne de rembourser ses dettes dès lors que les créanciers le réclament ; en raison de la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«مَطْلُ الْغَنِيِّ ظُلْمٌ»</span></p>
<p><em><strong>« Le fait, pour une personne riche (aisée), de différer le paiement de sa dette est une injustice. »</strong></em><a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a></p>
<p>C'est-à-dire : le fait que celui qui est capable d'acquitter sa dette en retarde le règlement constitue une injustice, car il empêche la restitution des droits des gens qu'il avait pourtant l'obligation d'honorer. S'il refuse obstinément de régler ses dettes, il est alors emprisonné.</p>
<p>Cheikh al-Islâm Taqî ad-Dîn Ibn Taymiyyah (qu'Allah lui fasse miséricorde) a dit <a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a>:</p>
<p><em>« Quiconque est capable d'acquitter sa dette mais s'y refuse, on le contraint à payer par la flagellation et l'emprisonnement. C'est ce qu'ont stipulé les imams parmi les compagnons de [l'école de] Mâlik, Ach-Châfi'î, Ahmad et d'autres. »</em></p>
<p>Il a ajouté :</p>
<p><em>« Et je ne connais aucune divergence à ce sujet. »</em> Fin de citation.</p>
<p>Et le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="rtl">«لَيُّ الْوَاجِدِ ظُلْمٌ يُحِلُّ عِرْضَهُ وَعُقُوبَتَهُ»</span></p>
<p><em><strong>« Le fait, pour celui qui a les moyens, de tarder à s'acquitter de sa dette est une injustice qui permet d'attenter à son honneur et de le punir. »</strong></em></p>
<p>Rapporté par Ahmad, Abû Dâwûd et d'autres.<a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a></p>
<p><em>« Son honneur »</em> [signifie qu'il est permis de] se plaindre de lui, et <em>« sa punition »</em> [signifie] son emprisonnement.</p>
<p>Ainsi, celui qui cherche à gagner du temps (qui tergiverse) pour s'acquitter du droit qui lui incombe mérite la punition par l'emprisonnement et la peine correctionnelle (<em>At-Ta'zîr</em>). Cette sentence lui est répétée jusqu'à ce qu'il s'acquitte de sa dette.</p>
<p>S'il persiste dans sa volonté de temporiser, le gouverneur (ou le juge) intervient alors, vend ses biens et règle ses dettes à partir de cette vente. En effet, le gouverneur se substitue à celui qui refuse d'obtempérer, et ce, dans le but de dissiper le préjudice causé aux créanciers. Le Prophète <span dir="rtl">ﷺ</span> a d'ailleurs dit :</p>
<p class="ar"><span dir="rtl">«لَا ضَرَرَ وَلَا ضِرَارَ»</span></p>
<p><em><strong>« Pas de préjudice à subir, ni de préjudice à infliger. »</strong></em><a href="#fn6" class="footnote-ref" id="fnref6" role="doc-noteref"><sup>6</sup></a></p>
<p>De ce qui précède, il devient clair que le débiteur se trouve dans l'une de ces deux situations :</p>
<p><strong>La première situation :</strong> Que la dette soit à terme (non encore échue).</p>
<p>Dans ce cas, on ne peut pas réclamer au débiteur le remboursement de la dette tant que son terme n’est pas échu, et il n'est pas tenu de s'en acquitter avant son échéance.</p>
<p>De même, si l'argent qu'il possède est inférieur au montant de la dette à terme dont il est redevable, il ne sera pas mis sous tutelle (frappé d'interdiction de disposer de ses biens) pour cette raison, et il ne sera pas empêché de disposer de ses biens.</p>
<p><strong>La seconde situation :</strong> Que la dette soit immédiate (échue et exigible). Dans ce cas, le débiteur se trouve dans l'une de ces deux configurations :</p>
<p><strong>La première :</strong> Que ses biens soient supérieurs à la dette dont il est redevable.</p>
<p>Celui-ci n'est pas mis sous tutelle (on ne lui interdit pas de gérer ses biens), mais on lui ordonne d'acquitter sa dette dès lors que son créancier le réclame. S'il s'y refuse, il est emprisonné et reçoit une peine correctionnelle (<em>At-Ta'zîr</em>) jusqu'à ce qu'il paie sa dette. Et s'il endure l'emprisonnement et le châtiment corporel tout en persistant dans son refus de payer, le gouverneur (ou le juge) intervient alors, liquide sa dette à partir de ses biens et vend ce qui est nécessaire à cet effet.</p>
<p><strong>La seconde :</strong> Que ses biens soient inférieurs à la dette immédiate dont il est redevable.</p>
<p>Dans ce cas, il est frappé d'interdiction de disposer de ses biens si ses créanciers en font la demande, afin de ne pas leur causer de tort. Cela s'appuie sur le hadith de Ka'b ibn Mâlik (qu'Allah l'agrée) :</p>
<p><em>« Le Messager d'Allah <span dir="rtl">ﷺ</span> a mis sous tutelle Mu'âdh et a vendu ses biens. » Rapporté par Ad-Dâraqutnî et Al-Hâkim qui l'a authentifié, et Ibn al-Tallâ' a dit : « C'est un hadith fermement établi. »</em><a href="#fn7" class="footnote-ref" id="fnref7" role="doc-noteref"><sup>7</sup></a></p>
<p>Et lorsqu'il est mis sous tutelle dans cette situation, cela doit être rendu public ; on annonce ouvertement aux gens qu'il fait l'objet d'une interdiction légale, afin qu'ils ne soient pas trompés à son sujet, qu'ils ne fassent pas d'affaires avec lui et que leurs biens ne soient pas ainsi perdus.</p>
<p><strong>Et quatre règles découlent de sa mise sous tutelle (interdiction légale) :</strong></p>
<p><strong>⁂ La première règle :</strong> Le droit des créanciers se rattache aux biens qu'il possédait déjà avant la mise sous tutelle, ainsi qu'aux biens qu'il acquiert par la suite (après l'interdiction), que ce soit par le biais d'un héritage, d'une compensation financière liée à un préjudice corporel (<em>Arch Jinâyah</em>), d'un don, d'un legs testamentaire ou autre.</p>
<p>Par conséquent, ces nouveaux biens sont frappés par l'interdiction au même titre que ceux qui existaient avant la mise sous tutelle. Ainsi, aucun acte de disposition de la part de la personne sous tutelle concernant ses biens après l'interdiction n'est exécutoire (valide), quel que soit le type de transaction.</p>
<p>De même, sa reconnaissance de dette (<em>Iqrâr</em>) au profit de quiconque sur une partie de ses biens n'est pas valable, car les droits des créanciers sont directement liés à la nature même de ses possessions ; sa reconnaissance de dette n'est donc pas acceptée à leur détriment.</p>
<p>Enfin, même avant que la mise sous tutelle ne soit officiellement prononcée, il lui est strictement interdit de disposer de ses biens d'une manière qui causerait un préjudice à ses créanciers.</p>
<p>L'Imam Ibn al-Qayyim (qu'Allah lui fasse miséricorde) a dit <a href="#fn8" class="footnote-ref" id="fnref8" role="doc-noteref"><sup>8</sup></a>: <em>« Lorsque les dettes englobent la totalité de ses biens, sa donation volontaire (ou son acte de bienfaisance) n'est pas valable si elle cause un préjudice aux créanciers (détenteurs des dettes), que le gouverneur [ou le juge] ait prononcé sa mise sous tutelle ou non. C'est là la doctrine (Madhhab) de Mâlik ainsi que le choix de notre Cheikh (il désigne par là Cheikh al-Islâm Ibn Taymiyyah, qu'Allah lui fasse miséricorde). »</em></p>
<p>Il a ajouté : « Et c'est cela l'avis authentique, et aucun autre ne saurait convenir aux fondements de la doctrine. C'est même une exigence des fondements de la législation islamique (Chari'ah) et de ses règles universelles ; car le droit des créanciers s'est d'ores et déjà attaché à ses biens, et c'est précisément pour cela que le gouverneur le frappe d'interdiction. Si le droit des créanciers ne s'était pas attaché à ses biens, il n'aurait pas été permis au gouverneur de prononcer cette interdiction à son encontre. *</p>
<p><em>Le débiteur se retrouve alors dans la même situation que le malade atteint d'une maladie mortelle [dont les largesses financières sont limitées]. Permettre à ce débiteur de faire des donations volontaires conduirait à l'annulation des droits des créanciers. Or, la Chari'ah n'apporte jamais de telles dispositions ; elle est au contraire venue pour préserver par tous les moyens les droits des ayants droit, et pour barrer la route menant à leur perte. »</em> Fin de citation, qu'Allah lui fasse miséricorde.</p>
<p><strong>⁂ La deuxième règle :</strong> Quiconque retrouve la nature même de son bien (le bien en lui-même) qu'il avait vendu, prêté ou loué au débiteur avant sa mise sous tutelle, a le droit de le reprendre et de le récupérer auprès du failli (<em>Al-Muflis</em>). Cela s'appuie sur la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«مَنْ أَدْرَكَ مَتَاعَهُ عِنْدَ إِنْسَانٍ أَفْلَسَ؛ فَهُوَ أَحَقُّ بِهِ»</span></p>
<p><em><strong>« Quiconque retrouve sa marchandise en nature chez une personne qui a fait faillite y a plus de droit [que les autres créanciers]. »</strong></em> Rapporté par Al-Boukhari et Muslim.<a href="#fn9" class="footnote-ref" id="fnref9" role="doc-noteref"><sup>9</sup></a></p>
<p>Les juristes (qu'Allah leur fasse miséricorde) ont mentionné que la récupération du bien en nature chez le failli frappé d'interdiction légale est soumise à <strong>six conditions</strong> :</p>
<p><strong>La première condition :</strong> Que le failli soit encore vivant au moment où le créancier reprend son bien. Cela s'appuie sur ce qu'a rapporté Abû Dâwûd, d'après la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«فَإِنْ مَاتَ؛ فَصَاحِبُ الْمَتَاعِ أُسْوَةُ الْغُرَمَاءِ»</span></p>
<p><em><strong>« S'il meurt, le propriétaire de la marchandise devient alors à l'égal des autres créanciers [pour le partage]. »</strong></em><a href="#fn10" class="footnote-ref" id="fnref10" role="doc-noteref"><sup>10</sup></a></p>
<p><strong>La deuxième condition :</strong> Que la totalité du prix de la marchandise demeure une dette à la charge du failli. Si le propriétaire de la marchandise a déjà perçu une partie de son prix, il perd alors le droit de récupérer son bien en nature.</p>
<p><strong>La troisième condition :</strong> Que le bien subsiste intégralement en nature dans la propriété du failli. S'il n'en retrouve qu'une partie, il ne peut pas la récupérer, car il n'a pas retrouvé son bien tel quel, mais seulement une partie de celui-ci.</p>
<p><strong>La quatrième condition :</strong> Que la marchandise soit restée en l'état, sans qu'aucune de ses caractéristiques ou qualités n'ait été modifiée.</p>
<p><strong>La cinquième condition :</strong> Que la marchandise ne fasse l'objet d'aucun droit rattaché à un tiers ; par exemple, que le failli ne l'ait pas donnée en gage (<em>Rahn</em>) ou toute autre situation similaire.</p>
<p><strong>La sixième condition :</strong> Que la marchandise n'ait pas subi une augmentation intrinsèque (liée et non séparable du bien), comme le fait qu'un animal ait engraissé.</p>
<p>Lorsque ces [six] conditions sont réunies, il est alors permis au propriétaire de la marchandise de la retirer et de la récupérer dès que la faillite de celui qui la détient est avérée, et ce, conformément au hadith précédent.</p>
<p><strong>⁂ La troisième règle :</strong> L'interruption de toute réclamation (poursuite) à son encontre après sa mise sous tutelle, et ce, jusqu'à ce que cette interdiction légale soit levée. Par conséquent, quiconque lui vend ou lui prête quelque chose pendant cette période [d'interdiction] ne pourra lui en réclamer le paiement ou la restitution qu'après la levée de sa mise sous tutelle.</p>
<p><strong>⁂ La quatrième règle :</strong> Le gouverneur (ou le juge) vend ses biens et en partage le prix proportionnellement au montant des dettes immédiates (exigibles) de ses créanciers ; car c'est là le but recherché par sa mise sous tutelle, et tout retard dans cette exécution constituerait une tergiversation et une injustice à leur égard.</p>
<p>Le gouverneur laisse toutefois au failli ce dont il a strictement besoin comme logement, nourriture (subsistance) et autres nécessités similaires.</p>
<p>Quant à la dette à terme (non encore échue), elle ne devient pas immédiatement exigible du fait de la faillite, et elle ne vient pas concurrencer les dettes immédiates. En effet, le terme (le délai accordé) est un droit qui appartient au failli ; il ne s'annule donc pas, à l'instar de ses autres droits, et cette dette reste à la charge du failli.</p>
<p>Ensuite, après la distribution de ses biens aux créanciers des dettes immédiates : s'il les a entièrement réglées et qu'il n'en reste rien, la mise sous tutelle est levée d'office sans qu'une décision du gouverneur ne soit nécessaire, puisque la cause qui l'avait motivée a disparu. En revanche, s'il reste une partie de ses dettes immédiates non honorée, l'interdiction légale ne peut être levée que par une décision du gouverneur. Étant donné que c'est ce dernier qui a prononcé la mise sous tutelle, c'est également à lui qu'il revient d'en ordonner la levée.</p>
<p>⁕ <strong>Le second type parmi les sortes de mise sous tutelle (Al-Hajr) :</strong></p>
<p>Il s'agit de l'interdiction imposée à une personne pour son propre intérêt, afin de préserver ses biens et de les lui épargner. En effet, cette religion est une religion de miséricorde, qui n'a pas laissé une seule chose profitable sans inciter à l'accomplir, ni une seule chose nuisible sans mettre en garde contre elle.</p>
<p>Fait partie de cela le fait qu'elle a laissé le champ libre à l'être humain qui possède la capacité juridique (<em>Ahlîyah</em>) de disposer de ses biens et de pratiquer le commerce, dans les limites du licite (<em>Al-Mubâh</em>) et du gain honnête (<em>Al-Kasb At-Tayyib</em>), en raison de l'intérêt que cela comporte tant pour l'individu que pour la communauté.</p>
<p>En revanche, si l'individu n'est pas apte à chercher un gain ou à pratiquer le commerce — en raison de son jeune âge (minorité), de son insensibilité (<em>Safah</em>) ou de la perte de sa raison —, l'Islam lui interdit alors de disposer de ses biens. Il lui désigne un tuteur légal (<em>Wassî</em>) chargé de lui préserver ses biens et de les faire fructifier, jusqu'à ce que l'empêchement disparaisse, après quoi ses biens lui seront restitués intégralement.</p>
<p>Le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿وَلَا تُؤْتُوا السُّفَهَاءَ أَمْوَالَكُمُ الَّتِي جَعَلَ اللَّهُ لَكُمْ قِيَاماً...﴾</span></p>
<p><strong><em>« Et ne confiez pas aux incapables vos biens que Allah a établis pour vous comme moyen de subsistance... »</em></strong> (An-Nisâ' : 5), jusqu'à Sa parole :</p>
<p class="ar"><span dir="rtl">﴿وَابْتَلُوا الْيَتَامَى حَتَّى إِذَا بَلَغُوا النِّكَاحَ فَإِنْ آنَسْتُمْ مِنْهُمْ رُشْداً فَادْفَعُوا إِلَيْهِمْ أَمْوَالَهُمْ﴾</span></p>
<p><em><strong>« Et éprouvez les orphelins jusqu'à ce qu'ils atteignent l'âge du mariage ; et si vous trouvez en eux une bonne conduite (de la maturité), alors remettez-leur leurs biens. »</strong></em> (An-Nisâ' : 6).</p>
<p>C’est cela que l’on nomme « l’interdiction imposée à une personne pour son propre intérêt », car le profit tiré de cette mesure lui revient directement.</p>
<p>Et ce type de mise sous tutelle englobe à la fois la responsabilité financière (<em>Ad-Dhimmah</em>) et les biens (<em>Al-Mâl</em>). Ainsi, quiconque est frappé par cette mesure ne peut disposer de ses biens, que ce soit par une vente, une donation volontaire ou tout autre acte. De même, il ne peut contracter à sa charge aucune dette, aucun engagement de garantie (<em>Damân</em>), aucune caution (<em>Kafâlah</em>) ou autre acte similaire, car cela conduirait à la perte des biens d'autrui.</p>
<p>Les transactions des personnes lucides avec ces individus [mis sous tutelle] ne sont pas valides, comme le fait de leur céder un bien par vente, prêt, dépôt de confiance (<em>Wadî'ah</em>) ou prêt à usage (<em>'Âriyah</em>).</p>
<p>Quiconque agit ainsi pourra récupérer ce qu'il leur a donné s'il le retrouve encore intact et en nature. En revanche, si le bien a péri entre leurs mains ou s'ils l'ont détruit, sa valeur est perdue à jamais [pour son propriétaire] ; ils ne sont pas tenus de le rembourser. En effet, c'est le propriétaire qui a fait preuve de négligence en leur donnant l'autorité sur son bien et en le leur remettant de son plein gré et par son propre choix.</p>
<p>Cependant, si la personne mise sous tutelle — en raison de son jeune âge ou autre — porte atteinte à l'intégrité physique d'autrui ou à ses biens par un délit (un acte dommageable), elle en est alors pleinement responsable et doit assumer les réparations financières (ou amendes) découlant de son forfait.</p>
<p>La raison en est que la victime n'a commis aucune négligence et ne leur a pas donné la permission d'agir ainsi. À ce sujet, la règle jurisprudentielle (<em>Al-Qâ'idah Al-Fiqhîyah</em>) stipule :</p>
<p class="ar"><span dir="rtl">«إِنَّ ضَمَانَ الْإِتْلَافِ يَسْتَوِي فِيهِ الْأَهْلُ وَغَيْرُهُ»</span></p>
<p><em>« En matière de responsabilité pour destruction (ou dommage causé), celui qui possède la pleine capacité juridique et celui qui en est dépourvu sont logés à la même enseigne. »</em></p>
<p>Le savant émérite (<em>Al-'Allâmah</em>) Ibn al-Qayyim (qu'Allah lui fasse miséricorde) a dit <a href="#fn11" class="footnote-ref" id="fnref11" role="doc-noteref"><sup>11</sup></a>:</p>
<p>« <em>L'enfant (le mineur), le fou et la personne endormie sont financièrement responsables de tous les biens qu'ils détruisent [ou endommagent]. Et cela fait partie des législations d'ordre général sans lesquelles les intérêts de la communauté ne sauraient se réaliser (ou être préservés). En effet, s'ils n'étaient pas tenus pour responsables des préjudices causés par leurs propres mains, les uns détruiraient les biens des autres tout en prétextant l'erreur et l'absence d'intention.</em> »</p>
<p>⁕ <strong>Et la mise sous tutelle du mineur (de l'enfant) prend fin grâce à deux conditions :</strong></p>
<p><strong>→La première :</strong> Qu'il atteigne l'âge de la puberté / majorité (<em>Sin Al-Blûgh</em>). Et cela se reconnaît par plusieurs signes :</p>
<p><strong>Le premier signe :</strong> L'émission de sperme (<em>Al-Manî</em>), que ce soit à l'état d'éveil ou durant le sommeil. Le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿وَإِذَا بَلَغَ الْأَطْفَالُ مِنْكُمُ الْحُلُمَ فَلْيَسْتَأْذِنُوا﴾</span></p>
<p><em><strong>« Et quand les enfants d’entre vous atteignent la puberté, qu’ils demandent permission... »</strong></em> (Al-Nûr : 55).</p>
<p>Et <em>Al-Hulum</em> désigne le fait que l'enfant voie durant son sommeil ce qui provoque l'émission de sperme jaillissant.</p>
<p><strong>Le deuxième signe :</strong> La pousse de poils drus (pubiens) autour de son sexe.</p>
<p><strong>Le troisième signe :</strong> Le fait d'atteindre l'âge de quinze ans. 'Abdullah ibn 'Umar (qu'Allah l'agrée, lui et son père) a dit :</p>
<p class="ar"><span dir="rtl">«عُرِضْتُ عَلَى النَّبِيِّ ﷺ يَوْمَ أُحُدٍ وَأَنَا ابْنُ أَرْبَعَ عَشْرَةَ سَنَةً فَلَمْ يُجِزْنِي ، وَعُرِضْتُ عَلَيْهِ يَوْمَ الْخَنْدَقِ وَأَنَا ابْنُ خَمْسَ عَشْرَةَ سَنَةً فَأَجَازَنِي»</span></p>
<p><em><strong>« J'ai été présenté au Prophète <span dir="rtl">ﷺ</span> le jour de [la bataille d'] Uhud alors que j'étais âgé de quatorze ans, et il ne m'a pas autorisé [à combattre]. Puis je lui ai été présenté le jour de [la bataille du] Fossé (Al-Khandaq) alors que j'avais quinze ans, et il m'a alors autorisé. »</strong></em> Rapporté par Al-Bukhârî et Muslim.<a href="#fn12" class="footnote-ref" id="fnref12" role="doc-noteref"><sup>12</sup></a></p>
<p>Le sens de <em>« il m'a autorisé »</em> signifie : il m'a permis de sortir pour participer au combat. Cela prouve donc que le fait d'atteindre l'âge de quinze ans depuis la naissance constitue la puberté légale.</p>
<p>Et dans une autre version, explicitant la raison pour laquelle il avait été refusé la première fois, il est dit : <em><strong>« Il a dit : "Il ne m'a pas considéré comme ayant atteint la puberté." »</strong></em></p>
<p><strong>Le quatrième signe :</strong> La jeune fille possède, par rapport au garçon, un quatrième signe supplémentaire qui indique sa puberté : les menstrues (Al-Hayd). Cela s'appuie sur la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«لَا يَقْبَلُ اللهُ صَلَاةَ حَائِضٍ إِلَّا بِخِمَارٍ»</span></p>
<p><em><strong>« Allah n'accepte pas la prière d'une femme qui a ses menstrues [c'est-à-dire qui a atteint l'âge de la puberté] sans qu'elle ne porte un voile (Khimâr). »</strong></em> Rapporté par At-Tirmidhî qui l'a déclaré bon (Hasan).<a href="#fn13" class="footnote-ref" id="fnref13" role="doc-noteref"><sup>13</sup></a></p>
<p>→<strong>La deuxième condition [nécessaire] en plus de la puberté : la maturité / le bon discernement (<em>Ar-Ruchd</em>).</strong> Il s'agit de l'aptitude à gérer convenablement ses biens (la droiture financière), conformément à la parole du Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿وَابْتَلُوا الْيَتَامَى حَتَّى إِذَا بَلَغُوا النِّكَاحَ فَإِنْ آنَسْتُمْ مِنْهُمْ رُشْداً فَادْفَعُوا إِلَيْهِمْ أَمْوَالَهُمْ﴾</span></p>
<p><em><strong>« Et éprouvez les orphelins jusqu'à ce qu'ils atteignent l'âge du mariage ; et si vous trouvez en eux une bonne conduite (de la maturité), alors remettez-leur leurs biens. »</strong></em> (An-Nisâ' : 6).</p>
<p><strong>Et l'on reconnaît sa maturité (son discernement) en le mettant à l'épreuve :</strong> On lui accorde ainsi une certaine liberté d'action pour effectuer quelques transactions. Si, après avoir géré des affaires à plusieurs reprises, il ne subit pas de lésion flagrante (ou d'escroquerie majeure) dans ses transactions, et qu'il ne dépense pas son argent dans ce qui est illicite (<em>Harâm</em>) ou dans des choses futiles dénuées de toute utilité, cela constitue alors la preuve de sa maturité (<em>Ruchd</em>).</p>
<p>⁕ <strong>Et la mise sous tutelle du fou (l'aliéné) prend fin grâce à deux conditions :</strong> <strong>La première :</strong> La disparition de la folie et le retour de sa raison. <strong>La deuxième :</strong> Qu'il fasse preuve de maturité / bon discernement (<em>Rachîd</em>), tout comme cela a été mentionné précédemment au sujet du mineur lorsqu'il atteint la puberté.</p>
<p>⁕ <strong>Et [la mise sous tutelle] prend fin pour l'insensé (<em>As-Safîh</em>) :</strong> Par la disparition de son insensibilité (sa prodigalité) et par le fait qu'il se caractérise désormais par la maturité (le bon discernement) dans ses transactions financières.</p>
<p>⁕ <strong>Et la gestion des biens de chacun de ces trois individus — le mineur, le fou et l'insensé — durant la période de mise sous tutelle, revient :</strong> À leur père, si celui-ci est intègre (<em>'Adl</em>) et doué de bon discernement, en raison de la perfection de sa compassion (et de sa bienveillance).</p>
<p>Puis, après le père, cette charge incombe à son légataire (le tuteur testamentaire qu'il a désigné, <em>Wassî</em>), car il est son représentant ; il s'apparente ainsi au mandataire (<em>Wakîl</em>) du père de son vivant.</p>
<p>⁕ <strong>Et il est obligatoire pour quiconque prend en charge leurs biens parmi ceux qui ont été cités, d'agir au mieux de leurs intérêts (de la manière la plus avantageuse pour eux) :</strong> Cela s'appuie sur la parole du Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿وَلَا تَقْرَبُوا مَالَ الْيَتِيمِ إِلَّا بِالَّتِي هِيَ أَحْسَنُ﴾</span></p>
<p><em><strong>« Et ne vous approchez des biens de l'orphelin que de la plus belle manière... »</strong></em> (Al-An'âm : 152).</p>
<p>C'est-à-dire : Ne disposez des biens de l'orphelin que par des actes qui comportent un intérêt (<em>Maslahah</em>) et qui permettent de les faire fructifier.</p>
<p>Et ce noble verset, bien qu'il textuellement stipulé au sujet des biens de l'orphelin, englobe également par analogie (<em>Qiyâs</em>) les biens de l'insensé et du fou.</p>
<p>⁕ <strong>Et il incombe au tuteur des biens de l'orphelin — et de ses semblables — de veiller à leur préservation,</strong> de ne pas les négliger, de ne pas les exposer au danger (au risque), et de ne pas les consommer injustement. Le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿إِنَّ الَّذِينَ يَأْكُلُونَ أَمْوَالَ الْيَتَامَى ظُلْماً إِنَّمَا يَأْكُلُونَ فِي بُطُونِهِمْ نَاراً وَسَيَصْلَوْنَ سَعِيراً﴾</span></p>
<p><em><strong>« Ceux qui mangent injustement les biens des orphelin n'introduisent que du feu dans leurs entrailles ; et ils brûleront bientôt dans les flammes de l'Enfer. »</strong></em> (An-Nisâ' : 10).</p>
<p><strong>Et Allah a exhorté les tuteurs des orphelins en leur rappelant d'imaginer la situation de leurs propres enfants</strong> si ces derniers venaient à être placés sous la tutelle de quelqu'un d'autre.</p>
<p>De la même manière qu'ils aimeraient que l'on agisse avec bienfaisance envers leur propre progéniture, qu'ils fassent eux-mêmes preuve de bienfaisance envers les enfants d'autrui parmi les orphelins placés sous leur responsabilité. Le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿وَلْيَخْشَ الَّذِينَ لَوْ تَرَكُوا مِنْ خَلْفِهِمْ ذُرِّيَّةً ضِعَافاً خَافُوا عَلَيْهِمْ فَلْيَتَّقُوا اللَّهَ وَلْيَقُولُوا قَوْلاً سَدِيداً﴾</span></p>
<p><em><strong>« Que la crainte saisisse ceux qui laisseraient après eux une descendance faible et qui seraient inquiets à leur sujet ; qu'ils craignent donc Allah et qu'ils prononcent des paroles justes. »</strong></em> (An-Nisâ' : 9).</p>
<p>Et comme ces individus [les personnes mineures ou incapables] ne sont pas en mesure de préserver leurs biens ni de les gérer de façon à les faire fructifier en leur faveur, Allah a institué pour eux des tuteurs légaux afin de prendre en charge cette gestion à leur place et de veiller à leurs intérêts.</p>
<p>De plus, Il a octroyé à ces tuteurs des directives à suivre scrupuleusement durant toute la période de leur tutelle sur ces personnes. C'est ainsi qu'Il a formellement interdit aux tuteurs de restituer aux mineurs (ou personnes frappées d'incapacité) leurs biens ou de leur en laisser le libre contrôle, ceci afin d'éviter qu'ils ne les détériorent ou ne les dilapident.</p>
<p>Le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿وَلَا تُؤْتُوا السُّفَهَاءَ أَمْوَالَكُمُ الَّتِي جَعَلَ اللَّهُ لَكُمْ قِيَاماً﴾</span></p>
<p><em><strong>« Et ne confiez pas aux incapables (insensés) vos biens que Allah a établis pour vous comme moyen de subsistance. »</strong></em> (An-Nisâ' : 5).</p>
<p>Le Hafidh Ibn Kathîr (qu'Allah lui fasse miséricorde) a dit <a href="#fn14" class="footnote-ref" id="fnref14" role="doc-noteref"><sup>14</sup></a>: <em>« Allah le Très-Haut interdit de laisser les personnes incapables disposer librement des biens qu'Allah a établis pour les gens comme un moyen de subsistance ; c'est-à-dire les biens par lesquels s'articule leur vie quotidienne, à travers le commerce et autres activités. C'est d'ailleurs de ce passage précis que découle le principe de la mise sous tutelle (l'interdiction légale) des personnes insensées. »</em> Fin de citation.</p>
<p>Et tout comme Allah a interdit de laisser ces mineurs disposer de leurs biens et a placé ceux-ci sous la tutelle de personnes capables de discernement et de saine gestion, Il met également en garde — Gloire et Pureté à Lui — ces mêmes tuteurs contre le fait d'y toucher, à moins que ce ne soit d'une manière qui améliore ces biens et les fasse fructifier.</p>
<p>Le Très-Haut dit ainsi :</p>
<p class="ar"><span dir="rtl">﴿وَلَا تَقْرَبُوا مَالَ الْيَتِيمِ إِلَّا بِالَّتِي هِيَ أَحْسَنُ حَتَّى يَبْلُغَ أَشُدَّهُ﴾</span></p>
<p><em><strong>« Et ne vous approchez des biens de l'orphelin que de la plus belle manière, jusqu'à ce qu'il ait atteint sa majorité... »</strong></em> (Al-An'âm : 152).</p>
<p>C'est-à-dire : Ne réalisez aucune transaction avec les biens de l'orphelin si ce n'est dans ce qui comporte un avantage manifeste (<em>Ghibtah</em>) et un intérêt direct pour lui.</p>
<p>D'après Ibn 'Abbâs (qu'Allah l'agrée, lui et son père) : « Lorsque Allah le Très-Haut fit descendre Sa parole : <em>« Et ne vous approchez des biens de l'orphelin que de la plus belle manière »</em>, ainsi que Sa parole : <em>« Ceux qui mangent injustement les biens des orphelins n'introduisent que du feu dans leurs entrailles »</em> (An-Nisâ' : 10) ; toute personne qui hébergeait un orphelin chez elle s'en alla séparer la nourriture de l'enfant de la sienne, et sa boisson de la sienne.</p>
<p>Dès lors, lorsqu'il restait un surplus [de nourriture appartenant à l'orphelin], on le lui réservait de côté jusqu'à ce qu'il le consomme ou que cela se gâte. Cette situation devint alors très pénible pour eux (les tuteurs et les enfants).</p>
<p>Ils exposèrent alors ce problème au Messager d'Allah <span dir="rtl">ﷺ</span>, et c'est alors qu'Allah fit descendre le verset :</p>
<p class="ar"><span dir="rtl">﴿وَيَسْأَلُونَكَ عَنِ الْيَتَامَى قُلْ إِصْلَاحٌ لَهُمْ خَيْرٌ وَإِنْ تُخَالِطُوهُمْ فَإِخْوَانُكُمْ﴾</span></p>
<p><em><strong>« Et ils t'interrogent au sujet des orphelins. Dis : "Leur faire du bien (veiller à leur intérêt) est le meilleur. Et si vous partagez votre vie avec eux, ce sont alors vos frères." »</strong></em> (Al-Baqarah : 220).</p>
<p>[Ibn 'Abbâs] dit : « <em>Dès lors, ils mélangèrent de nouveau leur nourriture à la leur, et leur boisson à la leur.</em> »<a href="#fn15" class="footnote-ref" id="fnref15" role="doc-noteref"><sup>15</sup></a></p>
<p>⁕ Et fait partie de la bienfaisance (<em>Al-Ihsân</em>) envers les biens des orphelins le fait de les engager dans le commerce afin d'en rechercher le profit et la croissance. Le tuteur a donc le droit de commercer lui-même avec ces biens, tout comme il lui est permis de les confier à un tiers qui les fera fructifier sous forme d'un contrat de commandite (<em>Mudârabah</em>).</p>
<p>En effet, 'Âishah (qu'Allah l'agrée) avait confié les biens de [son neveu] Muhammad ibn Abî Bakr (qu'Allah les agrée) sous forme de marchandise d'investissement. De plus, 'Umar (qu'Allah l'agrée) a dit :</p>
<p class="ar"><em><span dir="rtl">«اتَّجِرُوا بِأَمْوَالِ الْيَتَامَى؛ كَيْلَا تَأْكُلَهَا الصَّدَقَةُ».</span></em></p>
<p><em>« Faites du commerce avec les biens des orphelins afin que l'aumône légale (Zakât) ne les consume pas [à force d'être prélevée chaque année sur un capital stagnant]. »</em></p>
<p>⁕ De même, il incombe au tuteur de l'orphelin de dépenser pour l'entretien de ce dernier à partir de ses propres biens [ceux de l'orphelin], de manière convenable (selon les usages et sans excès).</p>
<p>Cheikh al-Islâm Ibn Taymiyyah (qu'Allah lui fasse miséricorde) a dit :</p>
<p><em>« Et il est recommandé d'honorer l'orphelin, de lui apporter de la joie et de repousser de lui toute forme d'humiliation (ou de maltraitance) ; car réconforter son cœur (et panser sa blessure affective) fait partie de ses plus grands intérêts. »</em> Fin de citation.</p>
<p>⁕ Le tuteur de l'orphelin a également le droit de lui acheter une bête de sacrifice (<em>Al-Udhiyah</em>) en la prélevant sur ses biens si l'orphelin est aisé financièrement, car il s'agit d'un jour d'allégresse et de réjouissance [le jour de l'Aïd].</p>
<p>De la même manière, son tuteur peut financer son éducation et son instruction en payant des frais (ou un enseignant) à partir de ses biens, car cela relève directement de ses intérêts [à long terme].</p>
<p>⁕ Et si le tuteur de l'orphelin est pauvre, il lui est alors permis de consommer une partie des biens de l'orphelin à hauteur de la valeur de son travail, en contrepartie des services qu'il rend pour la gestion de ce patrimoine.</p>
<p>Le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿وَمَنْ كَانَ فَقِيراً فَلْيَأْكُلْ بِالْمَعْرُوفِ﴾</span></p>
<p><em><strong>« ...Et quiconque est pauvre, alors qu'il en consomme convenablement. »</strong></em> (An-Nisâ' : 6).</p>
<p>C’est à dire : Quiconque est dans le besoin pour sa propre subsistance alors qu'il assure la garde des biens de l'orphelin et qu'il veille sur eux, <em>« alors qu'il en consomme »</em> <em>« convenablement »</em> (selon les usages, de manière équitable et sans excès).</p>
<p>L'Imam Ibn Kathîr a dit <a href="#fn16" class="footnote-ref" id="fnref16" role="doc-noteref"><sup>16</sup></a>: « <em>Ce verset a été révélé au sujet du tuteur de l'orphelin qui le prend en charge et préserve ses intérêts, afin qu'il puisse consommer de ses biens s'il est dans le besoin. Et il est rapporté d'après 'Âishah qu'elle a dit : "Ce verset a été révélé concernant le tuteur de l'orphelin :</em></p>
<p class="ar"><em><span dir="rtl">﴿وَمَنْ كَانَ غَنِيّاً فَلْيَسْتَعْفِفْ وَمَنْ كَانَ فَقِيراً فَلْيَأْكُلْ بِالْمَعْرُوفِ﴾</span></em></p>
<p><em>{Quiconque est aisé, qu'il s'abstienne d'en prendre ; et quiconque est pauvre, alors qu'il en consomme convenablement}, c'est-à-dire à proportion de la charge et du travail qu'il fournit pour lui."</em> »<a href="#fn17" class="footnote-ref" id="fnref17" role="doc-noteref"><sup>17</sup></a></p>
<p>⁕ Les juristes (<em>Al-Fuqahâ'</em>) ont dit : Il est permis [au tuteur pauvre] de prendre la plus petite des deux valeurs entre le salaire équivalent à son travail (<em>Ujratu mithlihi</em>) ou le montant strict de son besoin.</p>
<p>Il est rapporté qu'un homme vint trouver le Prophète <span dir="rtl">ﷺ</span> et dit : « J'ai à ma charge un orphelin qui possède des biens, alors que moi-même je n'ai aucun bien. Puis-je consommer de ses biens ? » Le Prophète <span dir="rtl">ﷺ</span> répondit : <em>« Consommes-en convenablement, sans commettre d'excès (gaspillage). »</em><a href="#fn18" class="footnote-ref" id="fnref18" role="doc-noteref"><sup>18</sup></a></p>
<p>Quant à ce qui dépasse cette limite pour laquelle Allah a accordé une dispense, il n'est absolument pas permis d'en consommer à partir des biens de l'orphelin. Certes, Allah a proféré à ce sujet la plus sévère des menaces.</p>
<p>Le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿وَلَا تَأْكُلُوهَا إِسْرَافاً وَبِدَاراً أَنْ يَكْبَرُوا﴾</span></p>
<p><em><strong>« Et ne les consommez pas avec prodigalité et hâte, avant qu'ils ne grandissent. »</strong></em> (An-Nisâ' : 6).</p>
<p>Et le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿وَلَا تَأْكُلُوا أَمْوَالَهُمْ إِلَى أَمْوَالِكُمْ إِنَّهُ كَانَ حُوباً كَبِيراً﴾</span></p>
<p><em><strong>« Et ne mangez pas leurs biens en les mêlant à vos propres biens, car c'est un énorme péché. »</strong></em> (An-Nisâ' : 2).</p>
<p>C'est-à-dire : Le fait de consommer leurs biens en les joignant aux vôtres constitue un péché immense et une faute majeure ; préservez-vous-en donc et évitez-le.</p>
<p>Le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿إِنَّ الَّذِينَ يَأْكُلُونَ أَمْوَالَ الْيَتَامَى ظُلْماً إِنَّمَا يَأْكُلُونَ فِي بُطُونِهِمْ نَاراً وَسَيَصْلَوْنَ سَعِيراً﴾</span></p>
<p><em><strong>« Ceux qui mangent injustement les biens des orphelin n'introduisent que du feu dans leurs entrailles ; et ils brûleront bientôt dans les flammes de l'Enfer. »</strong></em> (An-Nisâ' : 10).</p>
<p>L'Imam Ibn Kathîr a dit <a href="#fn19" class="footnote-ref" id="fnref19" role="doc-noteref"><sup>19</sup></a>: « <em>C'est-à-dire : s'ils consomment les biens des orphelins sans motif légal ; ils ne font alors qu'introduire un feu ardent qui brûlera intensément dans leurs entrailles au Jour de la Résurrection.</em> »</p>
<p>Et dans les deux recueils authentiques (<em>Al-Sahîhayn</em>, à savoir Al-Boukhârî et Muslim), d'après Abû Hurayrah, le Messager d'Allah <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="rtl">«اجْتَنِبُوا السَّبْعَ الْمُوبِقَاتِ»</span></p>
<p><em><strong>« Écartez-vous des sept péchés destructeurs (majeurs). »</strong></em></p>
<p>On demanda : « Ô Messager d'Allah ! Et quels sont-ils ? » Il répondit <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«الشِّرْكُ بِاللهِ ، وَالسِّحْرُ ، وَقَتْلُ النَّفْسِ الَّتِي حَرَّمَ اللهُ إِلَّا بِالْحَقِّ ، وَأَكْلُ الرِّبَا ، وَأَكْلُ مَالِ الْيَتِيمِ ، وَالتَّوَلِّي يَوْمَ الزَّحْفِ ، وَقَذْفُ الْمُحْصَنَاتِ الْغَافِلَاتِ الْمُؤْمِنَاتِ»</span></p>
<p><em><strong>« L'association à Allah (le Shirk), la sorcellerie, le meurtre d'une âme qu'Allah a rendu sacrée sauf s'il y a un droit légitime, la consommation du produit de l'usure (le Ribâ), la consommation des biens de l'orphelin, la fuite le jour du combat (la désertion), et la fausse accusation de fornication (la calomnie) portée contre les femmes chastes, croyantes et insouciantes. »</strong></em><a href="#fn20" class="footnote-ref" id="fnref20" role="doc-noteref"><sup>20</sup></a></p>
<p>⁕ Ensuite, Il a ordonné — Gloire et Pureté à Lui — de restituer aux orphelins leurs biens dès lors que l'état d'orphelin prend fin pour eux, et qu'ils deviennent aptes à en disposer de manière judicieuse (avec droiture), et ce, de façon pleine et entière.</p>
<p>Le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿وَآتُوا الْيَتَامَى أَمْوَالَهُمْ﴾</span></p>
<p><em><strong>« Et donnez aux orphelins leurs biens ; » (An-Nisâ' : 2).</strong></em></p>
<p>Et Il a dit :</p>
<p class="ar"><span dir="rtl">﴿حَتَّى إِذَا بَلَغُوا النِّكَاحَ فَإِنْ آنَسْتُمْ مِنْهُمْ رُشْداً فَادْفَعُوا إِلَيْهِمْ أَمْوَالَهُمْ﴾</span></p>
<p><em><strong>« ...jusqu'à ce qu'ils atteignent l'âge du mariage ; et si vous trouvez en eux une saine conduite (un bon discernement), remettez-leur alors leurs biens. »</strong></em> (An-Nisâ' : 6).</p>
<p>Et le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿فَإِذَا دَفَعْتُمْ إِلَيْهِمْ أَمْوَالَهُمْ فَأَشْهِدُوا عَلَيْهِمْ وَكَفَى بِاللَّهِ حَسِيباً﴾</span></p>
<p><em><strong>« Et si vous leur remettez leurs biens, prenez des témoins devant eux. Et Allah suffit amplement pour dresser les comptes. »</strong></em> (An-Nisâ' : 6).</p>
<p>C'est-à-dire : Et Allah suffit comme Comptable, Témoin et Observateur de l'action des tuteurs, tant lors de leur période de gestion envers les orphelins qu'au moment de leur restituer leurs biens, afin de voir si ces biens sont rendus au complet et de manière parfaite, ou bien s'ils sont diminués et spoliés.</p>
