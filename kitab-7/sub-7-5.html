<h3 id="introduction"><strong>Introduction :</strong></h3>
<p>⁕ La religion de l'Islam est une religion de tolérance et de globalité. Elle prend en considération les intérêts (des gens) ainsi que les circonstances, et elle lève la gêne et la difficulté de la communauté. Fait partie de cela ce qu'elle a légiféré dans le domaine de la vente, à savoir le fait d'accorder le droit d'option (de rétractation ou de réflexion) au contractant, afin qu'il puisse réfléchir mûrement à son affaire et examiner son propre intérêt derrière cette transaction. Ainsi, il s'engage dans ce dont il espère un bien, et il s'abstient ou se rétracte de ce qu'il ne juge pas être en sa faveur.</p>
<p>⁕ <strong>Ainsi, l'option (Al-Khiyâr) dans la vente signifie : rechercher la meilleure des deux issues entre la conclusion (définitive) ou l'annulation (du contrat). Elle se divise en huit catégories :</strong></p>
<p><strong>– Premièrement : L'option du lieu de conclusion du contrat (Khiyâr al-Majlis) :</strong> c'est-à-dire le lieu où s'est déroulée la transaction. Chacune des deux parties contractantes dispose du droit d'option tant qu'elles se trouvent (toutes deux) sur le lieu du contrat.</p>
<p>La preuve en est la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><strong><span dir="rtl">«إِذَا تَبَايَعَ الرَّجُلَانِ؛ فَكُلُّ وَاحِدٍ مِنْهُمَا بِالْخِيَارِ، مَا لَمْ يَتَفَرَّقَا وَكَانَا جَمِيعاً»</span></strong></p>
<p>« <em><strong>Lorsque deux hommes concluent une vente, chacun d'eux conserve le droit d'option tant qu'ils ne se sont pas séparés et qu'ils sont encore ensemble.</strong></em> »<a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a></p>
<p>L’illustre savant Ibn al-Qayyim (qu'Allah lui fasse miséricorde) a dit :</p>
<p>« <em>Le fait que le Législateur ait instauré l’option du lieu de conclusion du contrat (Khiyâr al-Majlis) dans la vente renferme une sagesse et un intérêt pour les deux contractants, afin que se réalise le plein consentement qu’Allah — Exalté soit-Il — a conditionné par Sa parole :</em></p>
<p class="ar"><em><strong><span dir="rtl">﴿عَنْ تَرَاضٍ مِنْكُمْ﴾ [النساء: ٢٩]</span></strong></em></p>
<p><em><strong>« ... si ce n'est un commerce basé sur un consentement mutuel entre vous » [Le Coran, Sourate An-Nisâ, v.29].</strong></em></p>
<p><em>En effet, le contrat s’exécute parfois de manière soudaine, sans mûre réflexion et sans examen approfondi de la valeur (du bien). Les beautés de cette législation parfaite ont donc exigé qu’un temps sacré soit accordé au contrat, durant lequel les deux parties peuvent réfléchir, réexaminer l’affaire et se raviser.</em></p>
<p><em>Ainsi, en vertu de ce noble hadith, chacun des deux contractants dispose du droit d’option tant qu’ils ne se sont pas séparés physiquement du lieu de la transaction.</em></p>
<p><em>Cependant, s'ils renoncent tous deux à ce droit d'option — en concluant la vente sous condition qu'il n'y ait pas d'option de rétractation —, ou si l'un des deux seulement y renonce, l'option s'annule alors. La vente devient dès lors définitive à l'égard de tous deux, ou à l'égard de celui qui y a renoncé dès la conclusion du contrat. Cela s'explique par le fait que l'option est un droit propre au contractant, qui s'annule donc par sa propre renonciation, et conformément à la parole du Prophète <span dir="rtl">ﷺ</span> :</em></p>
<p class="ar"><em><strong><span dir="rtl">«مَا لَمْ يَتَفَرَّقَا، أَوْ يُخَيِّرْ أَحَدُهُمَا الْآخَرَ»</span></strong></em></p>
<p><em><strong>« ... tant qu'ils ne se sont pas séparés, ou que l'un d'eux n'ait proposé à l'autre de choisir (et qu'il ait accepté d'entériner la vente) »</strong></em><a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a><em>.</em></p>
<p><em>Il est par ailleurs interdit à l'un d'eux de quitter son frère dans l'intention délibérée d'annuler le droit d'option. Cela s'appuie sur le hadith de 'Amr ibn Chou'ayb, dans lequel il est dit :</em></p>
<p class="ar"><em><strong><span dir="rtl">«وَلَا يَحِلُّ لَهُ أَنْ يُفَارِقَهُ خَشْيَةَ أَنْ يَسْتَقِيلَهُ»</span></strong></em></p>
<p><em><strong>« Il ne lui est pas licite de le quitter par crainte que l'autre ne demande l'annulation (de la vente) »</strong></em><a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a>.</p>
<p><strong>– Deuxièmement : L'option de condition (Khiyâr ash-Shart) :</strong> Elle consiste en ce que les deux parties contractantes stipulent une option [de rétractation] au cœur même du contrat, ou après la conclusion du contrat pendant la période de l'option de l'assemblée (Khiyâr al-Majlis), et ce, pour une durée déterminée.</p>
<p>Ceci repose sur la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><strong><span dir="rtl">«الْمُسْلِمُونَ عَلَى شُرُوطِهِمْ»</span></strong></p>
<p><strong>"<em>Les musulmans doivent respecter leurs conditions</em>"</strong> <a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a></p>
<p>ainsi que sur la portée générale de la parole d'Allah le Très-Haut :</p>
<p class="ar"><strong><span dir="rtl">﴿يَٰأَيُّهَا ٱلَّذِينَ ءَامَنُوٓاْ أَوْفُواْ بِٱلْعُقُودِ﴾ [المائدة: ١]</span></strong></p>
<p><strong>"Ô vous qui croyez ! Remplissez fidèlement vos engagements"</strong> [Al-Mâ'idah : 1].</p>
<p>Il est également valable que les deux co-vendeurs stipulent l'option en faveur de l'un d'eux seulement, à l'exclusion de l'autre, car le droit leur appartient à tous deux. Ainsi, quelle que soit la modalité sur laquelle ils s'accordent mutuellement, elle est permise.</p>
<p><strong>– Troisièmement : L'option pour lésion (Khiyâr al-Ghabn) :</strong> Si l'une des parties est lésée lors de la vente d'une manière qui dépasse la coutume (l'usage habituel du marché), la partie lésée a alors le choix entre conserver le bien ou annuler la vente.</p>
<p>Ceci repose sur la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><strong><span dir="rtl">«لَا ضَرَرَ وَلَا ضِرَارَ»</span></strong></p>
<p><em><strong>"Il ne doit y avoir ni préjudice subi, ni préjudice infligé"</strong></em><a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a></p>
<p>ainsi que sur sa parole <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><strong><span dir="rtl">«لَا يَحِلُّ مَالُ امْرِئٍ مُسْلِمٍ إِلَّا بِطِيبَةِ نَفْسٍ مِنْهُ»</span></strong></p>
<p><em><strong>"Les biens d'un musulman ne sont licites qu'avec son plein consentement"</strong></em><a href="#fn6" class="footnote-ref" id="fnref6" role="doc-noteref"><sup>6</sup></a></p>
<p>or la personne lésée n'a pas consenti de bon cœur à cette lésion. En revanche, si la lésion est minime et correspond à ce qui est toléré par l'usage courant, il n'y a pas d'option de rétractation possible.</p>
<p><strong>L'option pour lésion est établie dans trois cas de figure :</strong></p>
<p><strong>Le premier cas de figure de l'option pour lésion (Khiyâr al-Ghabn) :</strong> L'interception des caravanes (Talaqqî ar-Rukbân). On entend par là [les caravaniers ou marchands] qui arrivent pour importer leurs marchandises dans la ville. Si quelqu'un va à leur rencontre, leur achète [leurs biens] et qu'il s'avère qu'il les a lésés d'une manière flagrante (excessive), ils disposent alors du choix [d'annuler ou de confirmer la vente].</p>
<p>Ceci conformément à la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><strong><span dir="rtl">«لَا تَلَقَّوُا الْجَلَبَ، فَمَنْ تَلَقَّاهُ فَاشْتَرَى مِنْهُ، فَإِذَا أَتَى سَيِّدُهُ السُّوقَ؛ فَهُوَ بِالْخِيَارِ»</span></strong></p>
<p><strong>"<em>N'allez pas à la rencontre des marchandises importées. Et quiconque va à leur rencontre et en achète quelque chose, alors lorsque le propriétaire de la marchandise arrive au marché, il a le choix [de rétractation]</em>"</strong>. Rapporté par Muslim <a href="#fn7" class="footnote-ref" id="fnref7" role="doc-noteref"><sup>7</sup></a>.</p>
<p>Le Prophète <span dir="rtl">ﷺ</span> a donc interdit d'intercepter les marchandises importées en dehors du marché où elles sont habituellement vendues. Et il a ordonné que lorsque le vendeur arrive au marché — là où la valeur réelle des marchandises est connue — et qu'il prend connaissance de cette valeur, il a alors le choix entre confirmer la vente ou l'annuler.</p>
<p><strong>Sheykh al-Islâm Ibn Taymiyyah — qu'Allah lui fasse miséricorde — a dit</strong> <a href="#fn8" class="footnote-ref" id="fnref8" role="doc-noteref"><sup>8</sup></a><strong>:</strong> "<em>Le Prophète <span dir="rtl">ﷺ</span> a accordé aux caravaniers l'option de rétractation lorsqu'ils sont interceptés, car cela comporte une forme de dissimulation (Tadlîs) et de tromperie (Ghish).</em>"</p>
<p><strong>Et Ibn al-Qayyim a dit</strong> <a href="#fn9" class="footnote-ref" id="fnref9" role="doc-noteref"><sup>9</sup></a><strong>:</strong> "<em>Il [le Prophète <span dir="rtl">ﷺ</span>] a interdit cela en raison de la duperie (Taghrîr) causée au vendeur. En effet, celui-ci ne connaît pas les prix du marché, et l'acheteur lui acquiert donc [sa marchandise] à un montant inférieur à sa valeur réelle. C'est pourquoi le Prophète <span dir="rtl">ﷺ</span> lui a accordé l'option de rétractation dès qu'il pénètre dans le marché.</em></p>
<p><em>Il n'y a aucune divergence quant au fait que cette option lui soit accordée en cas de lésion (Ghabn). Car lorsque l'importateur ne connaît pas le cours du marché, il ignore le juste prix (le prix du marché pour un bien similaire). L'acheteur se trouve alors à le duper.</em></p>
<p><em>Il en va de même pour le vendeur [habitant de la ville] s'il leur vend quelque chose [en allant à leur rencontre] : ils [les caravaniers] disposent de l'option de rétractation lorsqu'ils descendent au marché et qu'ils s'aperçoivent qu'ils ont subi une lésion qui sort de l'usage habituel.</em>" Fin de citation.</p>
<p><strong>Le deuxième cas de figure de l'option pour lésion (Khiyâr al-Ghabn) :</strong> La lésion provoquée par la surenchère d'un faux enchérisseur (<em>an-Nâjish</em>) sur le prix de la marchandise.</p>
<p>Le faux enchérisseur (<em>an-Nâjish</em>) désigne celui qui fait monter l'enchère d'un bien sans avoir nullement l'intention de l'acheter, mais dans le seul but d'en augmenter le prix au détriment de l'acheteur [réel].</p>
<p>Il s'agit d'un acte interdit (<em>Muharram</em>), que le Prophète <span dir="rtl">ﷺ</span> a formellement proscrit par sa parole :</p>
<p class="ar"><strong><span dir="rtl">«وَلَا تَنَاجَشُوا»</span></strong></p>
<p><strong>"<em>Ne pratiquez pas la surenchère artificielle (Najash)</em>"</strong> <a href="#fn10" class="footnote-ref" id="fnref10" role="doc-noteref"><sup>10</sup></a>.</p>
<p>Cela s'explique par le fait que cette pratique induit l'acheteur en erreur et constitue une tromperie à son égard ; elle s'apparente ainsi pleinement à de la fraude (<em>Ghish</em>).</p>
<p><strong>Parmi les autres formes interdites de surenchère artificielle (<em>Najash</em>), il y a le fait que le propriétaire de la marchandise dise :</strong> "On m'a offert tant et tant pour ce bien", alors qu'il ment, ou qu'il dise : "Je l'ai acheté à tel prix", alors qu'il ment [pour faire grimper la valeur].</p>
<p><strong>Une autre forme interdite de <em>Najash</em> consiste pour le propriétaire du bien à déclarer :</strong> "Je ne la vendrai pas à moins de tant ou tant", dans le seul but d'amener l'acheteur à l'acquérir à un prix proche de la somme annoncée. Par exemple, pour une marchandise dont la valeur réelle est de cinq, il va dire : "Je la vends à dix", afin que l'acheteur finisse par la prendre à un prix très proche de dix.</p>
<p><strong>Le troisième cas de figure de l'option pour lésion par lequel l'option est établie : La lésion subie par le client candide (<em>Ghabn al-Mustarsil</em>).</strong></p>
<p><strong>L'Imam Ibn al-Qayyim — qu'Allah lui fasse miséricorde — a dit</strong> <a href="#fn11" class="footnote-ref" id="fnref11" role="doc-noteref"><sup>11</sup></a><strong>:</strong> "Il est mentionné dans le hadith :</p>
<p class="ar"><strong><span dir="rtl">"غَبْنُ الْمُسْتَرْسِلِ رِباً"</span></strong></p>
<p><strong>"<em>Léser le client candide (al-Mustarsil) relève de l'usure (Ribâ)</em>"</strong> <a href="#fn12" class="footnote-ref" id="fnref12" role="doc-noteref"><sup>12</sup></a><em>.</em></p>
<p>Et le <em>Mustarsil</em> désigne celui qui ignore la valeur réelle des biens et ne sait pas marchander (négocier le prix), mais s'en remet plutôt à la bonne foi et à la sincérité du vendeur en raison de sa propre pureté d'intention. Dès lors, s'il subit une lésion flagrante (excessive), l'option de rétractation lui est de plein droit accordée."</p>
<p>Provoquer une telle lésion est interdit (<em>Muharram</em>), car cela implique de tromper et d'abuser de la confiance de l'acheteur.</p>
<p><strong>De même, parmi les pratiques en cours sur certains marchés des musulmans — et qui est formellement interdite :</strong> le fait que lorsqu'une personne apporte une marchandise pour l'importer au marché, les habitués du marché s'entendent entre eux pour s'abstenir de faire des offres. Ils désignent délibérément l'un d'entre eux pour négocier avec le propriétaire du bien. Ainsi, ne trouvant personne pour surenchérir, le vendeur se voit contraint de lui vendre sa marchandise à un prix dérisoire, après quoi les autres marchands partagent le gain avec l'acheteur.</p>
<p>Ceci constitue une lésion et une injustice (<em>Dhulm</em>) interdites. S'il vient à l'apprendre, le propriétaire de la marchandise dispose de l'option [de rétractation] et du droit de leur retirer son bien.</p>
<p>Il est donc obligatoire pour quiconque commet une telle tromperie d'y mettre fin et de s'en repentir. De plus, quiconque a connaissance de cette pratique se doit de la réprouver auprès de ses auteurs et d'en informer les autorités responsables afin de les en dissuader.</p>
<p><strong>– Quatrièmement : L'option pour dissimulation (<em>Khiyâr at-Tadlîs</em>) :</strong> C'est-à-dire l'option qui est de droit en raison d'une dissimulation.</p>
<p>Le <em>Tadlîs</em> (la dissimulation) consiste à présenter une marchandise défectueuse sous l'apparence d'une marchandise saine. Ce terme est dérivé étymologiquement du mot <em>ad-Dulsah</em>, qui signifie "l'obscurité" ; c'est comme si le vendeur, par sa dissimulation, plongeait l'acheteur dans les ténèbres, l'empêchant ainsi de voir la réalité de la marchandise. Il en existe deux types :</p>
<ul>
<li><blockquote>
<p><strong>Le premier type :</strong> La dissimulation d'un défaut existant sur la marchandise.</p>
</blockquote></li>
<li><blockquote>
<p><strong>Le second type :</strong> Le fait d'embellir et de farder la marchandise par un artifice qui en augmente artificiellement le prix.</p>
</blockquote></li>
</ul>
<p>La dissimulation (<em>Tadlîs</em>) est interdite (<em>Harâm</em>), et la Législation islamique (<em>al-Shari'ah</em>) autorise l'acheteur à restituer le bien à cause d'elle. En effet, l'acheteur n'a dépensé son argent pour ce bien qu'en se basant sur les caractéristiques que le vendeur lui a montrées. S'il avait su que la réalité était tout autre, il n'aurait pas investi son argent dans cet achat.</p>
<p><strong>Parmi les exemples de dissimulation cités [dans les textes] :</strong> la technique du <em>Tasriyah</em> sur les moutons (ou chèvres), les vaches et les chamelles. Cela consiste à retenir leur lait dans les mamelles au moment de les exposer à la vente, de sorte que l'acheteur s'imagine qu'elles produisent toujours du lait en abondance. Le Prophète <span dir="rtl">ﷺ</span> a dit à ce sujet :</p>
<p class="ar"><strong><span dir="rtl">«لَا تُصَرُّوا الْإِبِلَ وَالْغَنَمَ، فَمَنِ ابْتَاعَهَا؛ فَهُوَ بِخَيْرِ النَّظَرَيْنِ بَعْدَ أَنْ يَحْلِبَهَا: إِنْ شَاءَ أَمْسَكَ، وَإِنْ شَاءَ رَدَّهَا وَصَاعاً مِنْ تَمْرٍ»</span></strong></p>
<p><strong>"<em>Ne retenez pas le lait dans les mamelles des chamelles et des brebis. Quiconque en achète une [dans cet état] dispose, après l'avoir traite, de la meilleure des deux options : s'il le souhaite, il la garde, et s'il le souhaite, il la rend en y joignant un Sâ' de dattes.</em>"</strong> <a href="#fn13" class="footnote-ref" id="fnref13" role="doc-noteref"><sup>13</sup></a></p>
<p><strong>Parmi les autres exemples contemporains de dissimulation :</strong> le fait de maquiller des maisons défectueuses pour tromper l'acheteur ou le locataire, ou le fait de relooker des voitures de manière à ce qu'elles paraissent neuves (non usagées) afin de duper l'acheteur, ainsi que d'autres formes similaires de dissimulation.</p>
<p><strong>Il est obligatoire pour le musulman d'être véridique et de clarifier la réalité.</strong> Le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><strong><span dir="rtl">«الْبَيِّعَانِ بِالْخِيَارِ مَا لَمْ يَتَفَرَّقَا، فَإِنْ صَدَقَا وَبَيَّنَا؛ بُورِكَ لَهُمَا فِي بَيْعِهِمَا، وَإِنْ كَذَبَا وَكَتَمَا؛ مُحِقَتْ بَرَكَةُ بَيْعِهِمَا»</span></strong></p>
<p><strong>"<em>Les deux contractants (le vendeur et l'acheteur) disposent de l'option [de rétractation] tant qu'ils ne se sont pas séparés. S'ils se montrent véridiques et clairs [sur les qualités et défauts du bien], la bénédiction sera placée dans leur transaction. Mais s'ils mentent et dissimulent, la bénédiction de leur transaction sera anéantie.</em>"</strong> <a href="#fn14" class="footnote-ref" id="fnref14" role="doc-noteref"><sup>14</sup></a></p>
<p>Le Prophète <span dir="rtl">ﷺ</span> a ainsi informé que la véridicité dans le commerce (la vente et l'achat) compte parmi les causes de la bénédiction (<em>al-Barakah</em>), tandis que le mensonge est une cause d'anéantissement de celle-ci.</p>
<p>Par conséquent, même si le gain (le prix perçu) est minime mais accompagné de sincérité, Allah y placera Sa bénédiction. À l'inverse, même si le gain est élevé mais entaché de mensonge, il sera totalement privé de bénédiction et ne contiendra aucun bien.</p>
<p><strong>– Cinquièmement : L'option pour défaut (<em>Khiyâr al-'Ayb</em>) :</strong> C'est-à-dire l'option de rétractation qui est de droit pour l'acheteur en raison de la présence d'un défaut sur la marchandise, que le vendeur ne lui a pas signalé ou que le vendeur lui-même ignorait, mais dont il s'avère qu'il existait déjà dans le bien avant la vente.</p>
<p>La règle d'évaluation (le critère) pour définir le défaut ouvrant droit à cette option est : <em><strong>tout ce qui diminue habituellement la valeur marchande du bien vendu, ou qui en altère la substance physique ('Ayn)</strong></em>. Pour identifier cela, on se réfère aux commerçants experts et reconnus dans ce domaine : ce qu'ils considèrent comme un défaut valide l'ouverture de l'option de rétractation ; et ce qu'ils ne considèrent pas comme un défaut diminuant la valeur ou la substance du bien n'est pas pris en compte.</p>
<p>Ainsi, lorsque l'acheteur prend connaissance du défaut après la conclusion du contrat, il dispose du choix entre deux options :</p>
<ol type="1">
<li><blockquote>
<p><strong>Confirmer la vente</strong> et percevoir une compensation pour le défaut (<em>'Arsh</em>). Cette compensation correspond à la différence entre la valeur du bien à l'état neuf (sain) et sa valeur avec le défaut.</p>
</blockquote></li>
<li><blockquote>
<p><strong>Annuler la vente</strong>, restituer la marchandise et récupérer l'intégralité du prix qu'il avait payé.</p>
</blockquote></li>
</ol>
<p><strong>– Sixièmement : Ce que l'on nomme l'option d'information sur le prix d'achat (<em>Khiyâr at-Takhbîr bith-Thaman</em>) :</strong> Cela correspond au cas où [le vendeur] cède la marchandise en se basant sur le prix auquel il l'a lui-même achetée initialement, en informant [l'acheteur] de son montant, puis qu'il s'avère par la suite que l'information fournie était contraire à la réalité (par exemple s'il apparaît que le prix réel était supérieur ou inférieur à ce qu'il a prétendu).</p>
<p>[Ce type d'option englobe également les cas suivants] :</p>
<ol type="1">
<li><blockquote>
<p>S'il dit : « Je t'associe avec moi dans cette marchandise au prix coûtant (mon capital de départ). »</p>
</blockquote></li>
<li><blockquote>
<p>Ou s'il dit : « Je te vends cette marchandise avec une marge de profit de tant et tant au-dessus de mon prix coûtant. »</p>
</blockquote></li>
<li><blockquote>
<p>Ou s'il dit : « Je te vends cette marchandise avec une remise de tant et tant par rapport au prix auquel je l'ai achetée. »</p>
</blockquote></li>
</ol>
<p>Dans ces quatre cas de figure, s'il s'avère que le prix coûtant réel (le capital) est différent de ce que le vendeur a annoncé :</p>
<ul>
<li><blockquote>
<p><strong>Selon un premier avis de l'école juridique (le Madhhab) :</strong> L'acheteur dispose de l'option de rétractation, il a le choix entre conserver le bien ou le restituer.</p>
</blockquote></li>
<li><blockquote>
<p><strong>Selon le second avis :</strong> L'acheteur ne bénéficie pas d'une option d'annulation dans cette situation. La transaction reste valide mais elle est ajustée sur la base du prix réel et véridique, et le montant excédentaire (surfait) est automatiquement déduit des obligations de l'acheteur.</p>
</blockquote></li>
</ul>
<p>Et Allah est Le Plus Savant.</p>
<p><strong>– Septièmement : L'option qui s'applique en cas de litige entre les deux co-vendeurs (<em>Khiyâr at-TahâluF</em>) :</strong> Il s'agit de l'option de rétractation établie lorsque les deux parties contractantes divergent sur certains aspects de la transaction. C'est le cas, par exemple, s'ils ne s'entendent pas sur le montant du prix, sur l'identité même du bien vendu (<em>'Ayn al-Mabî'</em>), sur sa quantité (sa mesure), ou encore sur ses caractéristiques (sa description), alors qu'aucun des deux ne dispose d'une preuve factuelle (<em>Bayyinah</em>).</p>
<p>Dans cette situation, ils doivent alors prêter serment mutuellement (<em>Yatahâlafân</em>) : chacun d'eux jure solennellement sur ce qu'il avance. Suite à cette prestation de serment, si l'un d'eux refuse toujours d'accepter la version de l'autre, chacun des deux contractants possède le droit d'annuler purement et simplement la vente.</p>
<p><strong>– Huitièmement : L'option sur la modification d'un bien vu préalablement (<em>Khiyâr ar-Ru'yah</em>) :</strong> Il s'agit de l'option de rétractation accordée à l'acheteur lorsque celui-ci acquiert un bien sur la base d'une observation antérieure, puis qu'il constate [au moment de la livraison] que ses caractéristiques ou son état ont changé.</p>
<p>Dans ce cas, il dispose du choix entre confirmer la vente ou l'annuler.</p>
<p>Et Allah est Le Plus Savant.</p>
