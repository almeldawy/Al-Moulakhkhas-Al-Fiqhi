<p>⁕ Parmi les garanties juridiques (<em>Ach-Char'iyyah</em>) relatives aux dettes, on trouve : <strong>la garantie (<em>Al-Damân</em>)</strong>.</p>
<p>Ce terme est dérivé de <em>Al-Dimn</em> (l'intérieur / l'incorporation), car la responsabilité de l'engagement (<em>Dhimmah</em>) du garant s'est introduite à l'intérieur de la responsabilité du garanti (le débiteur).</p>
<p>Il a également été dit qu'il dérive de <em>At-Tadammun</em> (l'inclusion / l'implication), car la responsabilité du garant inclut le droit garanti.</p>
<p>Et il a été dit [enfin] qu'il dérive de <em>Al-Damm</em> (la jonction / l'annexion), en raison de la jonction de la responsabilité du garant à celle du garanti dans l'obligation de s'acquitter du droit (de la dette). Ainsi, le droit s'établit simultanément sur leurs deux responsabilités juridiques.</p>
<p>⁕ <strong>Et le sens de la garantie (<em>Al-Damân</em>) sur le plan juridique (<em>Char'an</em>) est :</strong> L’engagement à s'acquitter de ce qui est obligatoire pour autrui, tout en maintenant cette obligation à la charge du garanti (le débiteur initial). Cela englobe également l'engagement à s'acquitter d'une obligation qui pourrait survenir dans le futur ; comme le fait de dire : « Tout ce que tu donneras à untel, j'en prends la responsabilité (c'est à ma charge). »</p>
<p>⁕ <strong>La garantie (<em>Al-Damân</em>) est licite (<em>Jâ-iz</em>) selon le Livre (le Coran), la Sunnah et le consensus (<em>Al-Ijmâ'</em>) :</strong></p>
<p>Le Très-Haut a dit :</p>
<p class="ar"><strong><span dir="rtl">﴿وَلِمَن جَاءَ بِهِ حِمْلُ بَعِيرٍ وَأَنَاْ بِهِ زَعِيمٌ﴾ [يوسف: ٧٢]</span></strong></p>
<p><strong>« (...) et à quiconque l’apportera, une charge de chameau [sera donnée] ; et j’en suis le garant (<em>Za'îm</em>). »</strong> [Sourate Yûsuf : 72] ; c'est-à-dire : le garant (<em>Dâmin</em>).</p>
<p>L'Imam At-Tirmidhî a rapporté, dans une tradition prophétique remontant jusqu'au Prophète (<em>Marfû'an</em>) :</p>
<p class="ar"><strong><span dir="rtl">«الزَّعِيمُ غَارِمٌ»</span></strong></p>
<p><strong>« Le garant (<em>Al-Za'îm</em>) est redevable (<em>Gârim</em>) »</strong><a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a> ; c'est-à-dire : qu'il est garant (<em>Dâmin</em>).</p>
<p>Et les savants ont unanimement accordé leur consensus (<em>Ajma'a</em>) sur la licéité globale de la garantie.</p>
<p>De plus, l'intérêt général (<em>Al-Maslahah</em>) l'exige ; le besoin ou la nécessité absolue peuvent même y inviter. Cela fait partie de l'entraide dans la piété et la dévotion, ainsi que de l'accomplissement du besoin du musulman et du soulagement de sa détresse.</p>
<p>⁕ <strong>Il est conditionné, pour sa validité (de l'acte de garantie), que le garant soit juridiquement apte à disposer de ses biens (<em>Jâ-iz at-Tasarruf</em>)</strong>, car il s'agit d'une prise en charge financière.</p>
<p>Par conséquent, la garantie n'est pas valable de la part d'un enfant (mineur), ni d'une personne faible d'esprit (<em>Safîh</em>) placée sous tutelle juridique (<em>Mahjûr 'alayhi</em>).</p>
<p>De même, <strong>son consentement (<em>Ridâhu</em>) est également une condition sine qua non</strong>. Ainsi, s'il a été contraint (forcé) à garantir, l'acte n'est pas valide. Car la garantie est une contribution bénévole (<em>Tabarru'</em>) par laquelle on s'engage à s'acquitter d'un droit ; le consentement y est donc considéré comme obligatoire au même titre que la donation bénévole de biens financiers.</p>
<p>⁕ <strong>La garantie (<em>Al-Damân</em>) est un contrat de bienfaisance (<em>'Aqd Irfâq</em>) par lequel on vise le profit du garanti (le débiteur) et son assistance.</strong> Il n'est donc pas permis de percevoir une contrepartie financière (<em>'Iwad</em>) en échange de celle-ci. De plus, percevoir une contrepartie pour une garantie s'apparenterait à un prêt qui engendre un profit (<em>Qard jarr nafa'an</em>). En effet, le garant est tenu d'acquitter la dette à la place du garanti lorsque cela lui est réclamé. Ainsi, lorsqu'il la paye au créancier (<em>Al-Madmûn lahu</em>), il va ensuite la récupérer auprès du garanti (<em>Al-Madmûn 'anhu</em>) à la manière d'un prêt. [La contrepartie perçue initialement] ferait alors de cet acte un prêt ayant généré un profit.</p>
<p>Il est donc obligatoire de s'éloigner de ce genre de pratique, et la garantie doit impérativement avoir pour but l'entraide et la bienfaisance, et non l'exploitation ou l'asphyxie de la personne dans le besoin.</p>
<p>⁕ <strong>La garantie (<em>Al-Damân</em>) est valable en utilisant la formule :</strong> « Je suis garant (<em>Damîn</em>) », ou : « Je suis caution (<em>Qabîl</em>) », ou : « Je suis responsable (<em>Hamîl</em>) », ou : « Je suis garant (<em>Za'îm</em>) ».</p>
<p><strong>Elle est également valable par l'expression :</strong> « Je prends en charge ta dette », ou : « Je la garantis », ou : « Elle est à ma charge (elle est chez moi) ».</p>
<p>De manière générale, elle se réalise par <strong>toute formule qui exprime le sens de la garantie</strong>. En effet, le Législateur (<em>Ach-Châri'</em>) n'a pas limité cela à une formulation spécifique ; on se réfère donc en la matière à l'usage coutumier (<em>Al-'Urf</em>).</p>
<p>⁕ <strong>Le titulaire du droit (le créancier) a le droit de réclamer [le paiement] à qui il veut entre le garant (<em>Al-Dâmin</em>) ou le garanti (<em>Al-Madmûn</em>)</strong> ; car son droit est établi à la charge de leurs deux responsabilités juridiques. Il possède donc le droit de réclamer à quiconque il souhaite parmi les deux.</p>
<p>Et cela s'appuie également sur la parole du Prophète <span dir="rtl">ﷺ</span> : <strong>« Le garant (<em>Al-Za'îm</em>) est redevable (<em>Gârim</em>) »</strong><a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a> rapporté par Abû Dâwûd et At-Tirmidhî qui l'a jugé bon (<em>Hassanahu</em>).</p>
<p><em>Al-Za'îm</em> désigne le garant (<em>Al-Dâmin</em>), et le sens de <em>Al-Gârim</em> est : celui qui s'acquitte d'une chose qui lui est devenue obligatoire.</p>
<p><strong>Et ceci est l'avis de la majorité des savants (<em>Al-Jumhûr</em>).</strong></p>
<p>Certains savants ont [toutefois] été d'avis qu'il n'est pas permis au titulaire du droit (le créancier) de réclamer la dette au garant, sauf s'il s'avère impossible de la réclamer au garanti (le débiteur principal).</p>
<p>[Leurs arguments sont les suivants] :</p>
<ul>
<li><blockquote>
<p>Car la garantie est une branche (<em>Far'</em>), et l'on ne se tourne vers la branche que si l'accès à l'origine (<em>Al-Asl</em>) est impossible.</p>
</blockquote></li>
<li><blockquote>
<p>Car la garantie est une sécurisation du droit au même titre que le gage (<em>Al-Rahn</em>). Or, on ne saisit le gage pour solder le droit que lorsqu'il est impossible de se faire payer par le débiteur qui a gagé (<em>Al-Râhin</em>).</p>
</blockquote></li>
<li><blockquote>
<p>Car réclamer au garant, alors que le garanti est présent et solvable, est une pratique perçue comme blâmable (<em>Istiqbâh</em>) par les gens. En effet, ce qui est communément admis parmi eux, c'est que l'on ne sollicite pas le garant sauf en cas d'impossibilité de réclamer au garanti, ou si ce dernier est incapable de rembourser. C'est cela qui est d'usage courant (<em>Al-Muta'âraf</em>) chez les gens.</p>
</blockquote></li>
</ul>
<p>C'est là le sens de ce qu'a mentionné l'Imam Ibn Al-Qayyim, en disant : « <em>Cet avis, comme tu peux le constater, possède une force probante évidente.</em> »</p>
<p>⁕ Parmi les questions relatives à la garantie, il y a le fait que la responsabilité juridique (Dhimmah) du garant ne se trouve dégagée (acquittée) que lorsque la responsabilité du garanti (le débiteur) est elle-même libérée de la dette, que ce soit par une remise de dette (Ibrâ') [de la part du créancier] ou par un paiement effectif (Qadâ').</p>
<p>[Les arguments sont les suivants] :</p>
<ul>
<li><blockquote>
<p>Car la responsabilité du garant est une branche (Far') découlant de la responsabilité du garanti et elle en est dépendante (Taba').</p>
</blockquote></li>
<li><blockquote>
<p>Car la garantie constitue une sécurité (un acte de cautionnement), et dès lors que l'obligation principale (Al-Asl) est éteinte, la sécurité disparaît également ; au même titre que le gage (Al-Rahn).</p>
</blockquote></li>
</ul>
<p>⁕ <strong>Parmi les questions relatives à la garantie, il y a le fait qu'il est permis d'avoir une pluralité de garants.</strong> Il est ainsi permis que deux personnes ou plus garantissent une seule et même dette, que chacun d'eux s'engage à garantir la totalité de celle-ci ou seulement une partie.</p>
<p>[Dans le cas où chacun garantit la totalité], aucun d'entre eux ne se trouve libéré de sa responsabilité sans la libération de l'autre. En revanche, ils se trouvent tous définitivement libérés dès lors que le garanti (le débiteur principal) est lui-même acquitté.</p>
<p>⁕ <strong>Parmi les questions relatives à la garantie, il y a le fait qu'il n'est pas conditionné, pour sa validité, que le garant connaisse le garanti (le débiteur)</strong> ; comme s'il disait : « Quiconque t'emprunte de l'argent, j'en suis le garant. »</p>
<p><strong>De même, il n'est pas conditionné que le garant connaisse le bénéficiaire de la garantie (le créancier).</strong> En effet, puisque le consentement du créancier (<em>Al-Madmûn lahu</em>) et du débiteur (<em>Al-Madmûn 'anhu</em>) n'est pas une condition requise, leur connaissance mutuelle ne l'est pas non plus.</p>
<p>⁕ <strong>Parmi les questions relatives à la garantie, il y a le fait qu'il est aussi bien valide de garantir une chose connue (<em>Al-Ma'lûm</em>) qu'une chose inconnue (<em>Al-Majhûl</em>) si celle-ci est amenée à être connue plus tard (déterminable).</strong></p>
<p>Cela s'appuie sur la parole du Très-Haut :</p>
<p class="ar"><strong><span dir="rtl">﴿وَلِمَن جَاءَ بِهِ حِمْلُ بَعِيرٍ وَأَنَاْ بِهِ زَعِيمٌ﴾ [يوسف: ٧٢]</span></strong></p>
<p><strong>« (...) et à quiconque l’apportera, une charge de chameau [sera donnée] ; et j’en suis le garant. »</strong> [Sourate Yûsuf : 72] ; en effet, « la charge de chameau » n'est pas précisément connue au moment de la déclaration, mais elle est amenée à être connue par la suite. Ce verset prouve donc la licéité de cette pratique.</p>
<p>⁕ <strong>Parmi les questions relatives à la garantie, il y a le fait qu'il est valide de garantir la responsabilité liée à la marchandise vendue (<em>'Uhdat al-Mabî'</em>) — la <em>'Uhdah</em> désignant ici la garantie contre les vices ou l'éviction (<em>Al-Darak</em>) —.</strong> Cela consiste à garantir [la restitution du] prix d'achat au cas où il apparaîtrait que la marchandise vendue appartient de droit à un autre que le vendeur.</p>
<p>⁕ <strong>Parmi les questions relatives à la garantie, il y a le fait qu'il est permis de garantir ce qui incombe obligatoirement à une personne.</strong> C'est le fait, par exemple, de se porter garant pour ce qu'elle se trouve obligée d'acquitter comme dette ou autre engagement similaire.</p>
