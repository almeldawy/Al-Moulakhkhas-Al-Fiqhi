<h3 id="بسم-الله-الرحمن-الرحيم"><span dir="rtl">بِسْمِ اللهِ الرَّحْمَٰنِ الرَّحِيم</span>ِ</h3>
<p><strong>Chapitre sur les règles du prêt (Al-Qard)</strong></p>
<p><strong>⁕ Le prêt (Al-Qard) au sens linguistique :</strong> Signifie la coupure (le détachement) ; car le prêteur coupe une partie de ses biens pour la donner à l'emprunteur.</p>
<p><strong>Et sa définition dans la législation islamique (Shari'ah) :</strong> C'est le fait de céder un bien à quelqu'un afin qu'il en tire profit, à charge pour lui d'en restituer l'équivalent.</p>
<p>Et cela relève du domaine de la bienfaisance (et de l'entraide). Le Prophète <span dir="rtl">ﷺ</span> l'a d'ailleurs qualifié de <em>Manîhah</em> (don temporaire / prêt) <a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a>; car l'emprunteur en tire profit, puis le restitue au prêteur.</p>
<p>⁕ <strong>Accorder un prêt est recommandé (Mustahabb)</strong>, et cela renferme une immense récompense. Le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><strong><span dir="rtl">«مَا مِنْ مُسْلِمٍ يُقْرِضُ مُسْلِمًا قَرْضًا مَرَّتَيْنِ؛ إِلَّا كَانَ كَصَدَقَةٍ مَرَّةً»</span></strong></p>
<p><em><strong>« Il n'y a pas un musulman qui prête deux fois de l'argent à un autre musulman sans que cela ne soit équivalent à une aumône qu'il aurait donnée une fois »</strong></em>, rapporté par Ibn Mâjah <a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a>.</p>
<p>Il a d'ailleurs été dit : le prêt est préférable à l'aumône (Sadaqah), car nul ne demande un prêt si ce n'est une personne dans le besoin. Et il est rapporté dans le hadith authentique :</p>
<p class="ar"><strong><span dir="rtl">«مَنْ نَفَّسَ عَنْ مُسْلِمٍ كُرْبَةً مِنْ كُرَبِ الدُّنْيَا؛ نَفَّسَ اللهُ عَنْهُ كُرْبَةً مِنْ كُرَبِ يَوْمِ الْقِيَامَةِ»</span></strong></p>
<p><em><strong>« Quiconque soulage un musulman d'une affliction parmi les afflictions de ce monde, Allah le soulagera d'une affliction parmi les afflictions du Jour de la Résurrection »</strong></em> <a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a>.</p>
<p>Le prêt est donc un acte de bienfaisance, il permet de dissiper la détresse du musulman et de subvenir à son besoin.</p>
<p>De plus, le fait de demander un prêt ne relève pas de la mendicité blâmable (Al-Mas-alah Al-Makrûhah), car le Prophète <span dir="rtl">ﷺ</span> a lui-même emprunté.</p>
<p>⁕ Il est stipulé comme condition de validité du prêt que le prêteur soit une personne dont les actes de donation (ou libéralités) sont juridiquement valables. Ainsi, il n'est pas permis au tuteur de l'orphelin, par exemple, de prêter à partir des biens de l'orphelin. De même, il est obligatoire de connaître la quantité (la valeur) de l'argent versé dans le prêt, ainsi que ses caractéristiques, afin que [l'emprunteur] soit en mesure d'en restituer l'équivalent à son propriétaire. Le prêt devient alors une dette sous la responsabilité de l'emprunteur, qu'il est obligatoire de rendre à son propriétaire dès qu'il en a la capacité, sans aucun retard.</p>
<p>⁕ <strong>Il est interdit (Harâm) au prêteur</strong> de stipuler comme condition une augmentation [à rembourser] par l’emprunteur sur le prêt. Les savants sont en effet unanimes sur le fait que s'il impose une condition d'augmentation et qu'il la perçoit, cela constitue de l'usure (Riba). Ce que font les banques aujourd’hui, à savoir prêter avec intérêt, est de l'usure flagrante, que ce soit un prêt de consommation ou un prêt de développement (d'investissement) comme ils l'appellent. Il n'est donc pas permis au prêteur — qu'il s'agisse d'une banque, d'un particulier ou d'une société — de percevoir une augmentation stipulée dans le prêt, quel que soit le nom donné à cette augmentation, et qu'on la nomme gain, intérêt, cadeau, hébergement dans une maison ou usage d'une voiture, tant que cette augmentation, ce cadeau ou ce profit découle d'une condition préalable.</p>
<p>Il est rapporté dans le hadith :</p>
<p class="ar"><strong><span dir="rtl">«كُلُّ قَرْضٍ جَرَّ نَفْعاً؛ فَهُوَ رِبًا»</span></strong></p>
<p><em><strong>« Tout prêt qui entraîne un profit est de l'usure »</strong></em> <a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a>.</p>
<p>Et dans le hadith élevé (Marfû') d'après Anas :</p>
<p class="ar"><strong><span dir="rtl">«إِذَا أَقْرَضَ أَحَدُكُمْ قَرْضاً، فَأَهْدَى إِلَيْهِ، أَوْ حَمَلَهُ عَلَى الدَّابَّةِ؛ فَلَا يَرْكَبْهَا، وَلَا يَقْبَلْهُ؛ إِلَّا أَنْ يَكُونَ جَرَى بَيْنَهُ وَبَيْنَهُ قَبْلَ ذَلِكَ»</span></strong></p>
<p><em><strong>« Si l'un de vous accorde un prêt, et qu'on [l'emprunteur] lui fait un cadeau ou lui propose de le transporter sur une monture, qu'il ne monte pas dessus et qu'il n'accepte pas [le cadeau], à moins que cela ne fût une habitude courante entre eux avant cela »</strong></em>, rapporté par Ibn Mâjah, et il possède de nombreuses attestations <a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a>.</p>
<p>Il est également authentifié d'après 'Abdullah Ibn Salâm ؓ qu'il a dit : <em><strong>« Si tu as un droit (une créance) sur un homme, et qu'il t'offre une charge de paille, ne l'accepte pas, car c'est de l'usure »</strong></em> <a href="#fn6" class="footnote-ref" id="fnref6" role="doc-noteref"><sup>6</sup></a>. Cette parole a le statut d'un hadith prophétique (Hukm ar-Raf'). Il n'est donc pas permis au prêteur d'accepter un cadeau ni tout autre profit de la part de l'emprunteur si cela est causé par le prêt, en raison de l'interdiction stipulée à ce sujet, et parce que le prêt n'est qu'un contrat d'entraide envers le besogneux et un acte de rapprochement vers Allah. Ainsi, si l'on y stipule une augmentation, ou qu'on la recherche, qu'on la vise et qu'on l'espère, on sort alors le prêt de son objectif initial — qui est de se rapprocher d'Allah en répondant au besoin de l'emprunteur — pour en faire une recherche de profit sur l'emprunteur ; cela ne s'appelle dès lors plus un prêt.</p>
<p>Il est donc obligatoire pour le musulman de prêter attention à cela, de s'en préserver, et de vouer une intention exclusive (Ikhlâs) dans le prêt ainsi que dans ses autres bonnes œuvres. En effet, le but du prêt n'est pas d'obtenir un accroissement matériel (financier), mais son but est plutôt d'obtenir un accroissement spirituel (moral), qui consiste à se rapprocher d'Allah en répondant au besoin de la personne nécessiteuse et en récupérant [uniquement] le capital initial. Dès lors, si tel est l'objectif visé à travers le prêt, Allah fait descendre sur les biens la bénédiction (Barakah) ainsi qu'une saine croissance.</p>
<p>⁕ <strong>Ceci étant dit, il convient de savoir</strong> que l'augmentation dont la perception est interdite dans le cadre d'un prêt est celle qui est stipulée comme condition. C'est le cas, par exemple, si [le prêteur] dit : « Je te prête tant et tant à condition que tu me rendes l'argent avec un surplus de tant et tant », ou « à condition que tu me loges dans ta maison ou [que tu me prêtes] ton magasin », ou « que tu m'offres ceci ou cela ». De même, [cela est interdit] s'il n'y a pas de condition explicitement formulée de vive voix, mais qu'il y a une intention d'obtenir ce surplus et qu'on l'espère (on l'attend en secret). Tout cela constitue la forme interdite et prohibée.</p>
<p>En revanche, si l'emprunteur accorde un surplus de son propre chef et de sa propre initiative, sans aucune condition préalable imposée par le prêteur, et sans que ce dernier ne l'ait espéré ou visé, il n'y a alors aucun empêchement à accepter cette augmentation à ce moment-là. En effet, cela est considéré comme faisant partie de la bonne manière de s'acquitter de sa dette (rembourser de façon exemplaire). De plus, le Prophète <span dir="rtl">ﷺ</span> avait emprunté un jeune chameau et a rendu un chameau de meilleure qualité, puis il a dit :</p>
<p class="ar"><strong><span dir="rtl">«خِيَارُكُمْ أَحْسَنُكُمْ قَضَاءً»</span></strong></p>
<p><em><strong>« Les meilleurs d'entre vous sont ceux qui s'acquittent de leurs dettes de la meilleure des manières »</strong></em> <a href="#fn7" class="footnote-ref" id="fnref7" role="doc-noteref"><sup>7</sup></a>.</p>
<p>Cela fait partie des nobles caractères loués à la fois par la coutume ('Urf) et par la législation islamique (Shari'ah). Cela n'entre pas non plus dans la catégorie du prêt qui entraîne un profit [interdit], car cela n'a pas été posé comme condition dans le prêt par le prêteur, et cela n'a pas fait l'objet d'un accord mutuel préalable ; il s'agit uniquement d'une libéralité (un geste volontaire) de la part de l'emprunteur.</p>
<p>Il en est de même si l'emprunteur accorde au prêteur un profit qui était déjà habituel entre eux avant le prêt. Si l'emprunteur avait par exemple l'habitude d'offrir ce service ou ce profit [au prêteur], et que l'élément moteur de ce geste n'est pas le prêt, il n'y a alors aucun empêchement à l'accepter, car le motif de l'interdiction (le fait de tirer un profit indu du prêt) est inexistant.</p>
<p>⁕ De plus, il est obligatoire pour l'emprunteur d'accorder une importance majeure au fait de s'acquitter de la dette découlant du prêt, et de la restituer à son propriétaire, sans aucune procrastination (tergiversation) ni retard, dès qu'il est en capacité de rembourser ; et ce, conformément à la parole d'Allah Ta'âlâ :</p>
<p class="ar"><strong><span dir="rtl">﴿هَلْ جَزَاءُ الْإِحْسَانِ إِلَّا الْإِحْسَانُ﴾</span></strong></p>
<p><em><strong>« Y a-t-il d'autre récompense pour le bien que le bien ? »</strong></em> [Sourate Ar-Rahmân : 60].</p>
<p>⁕ Cependant, certaines personnes font preuve de laxisme (négligence) concernant les droits des gens de manière générale, et au sujet des dettes en particulier. C'est là un trait de caractère blâmable qui a poussé de nombreuses personnes à s'abstenir d'accorder des prêts et de soulager ceux qui sont dans le besoin. Cela peut malheureusement contraindre le nécessiteux à se tourner vers les banques usuraires et à pratiquer ce qu'Allah a interdit, car il ne trouve personne pour lui accorder un prêt vertueux (Qardan Hasana), tandis que le prêteur ne trouve personne pour lui rembourser son prêt convenablement, au point que l'acte de bienfaisance finit par se perdre parmi les gens.</p>
