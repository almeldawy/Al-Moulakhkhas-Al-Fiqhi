  <!-- ▼ CONTENU DU CHAPITRE ▼ -->

<p>⁕ Nous aborderons dans ce chapitre, si Allah le veut, les règles relatives à la disposition de la marchandise vendue avant sa prise de possession — ce qui est valide et ce qui ne l'est pas — tout en clarifiant la manière dont s'effectue la prise de possession de la marchandise et ce qui est considéré comme une prise de possession valide, ainsi que ce qui n'est pas considéré comme une prise de possession valide.</p>
<p>⁕ Sache qu'il n'est pas valide de disposer de la marchandise vendue avant sa prise de possession si celle-ci est mesurée (au volume), pesée, comptée ou mesurée (à la coudée/longueur), et ce, par accord unanime des imams. Il en est de même si la marchandise est autre que cela, selon l'avis authentique et prépondérant parmi les deux avis des savants (qu'Allah leur fasse miséricorde), en raison de la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="ltr">«</span><strong><span dir="rtl">مَنِ ابْتَاعَ طَعَاماً؛ فَلَا يَبِعْهُ حَتَّى يَسْتَوْفِيَهُ</span></strong><span dir="rtl">»، مُتَّفَقٌ عَلَيْهِ، وَفِي لَفْظٍ: «<strong>حَتَّى يَقْبِضَهُ</strong></span><span dir="rtl">»، وَلِمُسْلِمٍ: «<strong>حَتَّى يَكْتَالَهُ</strong></span><span dir="ltr">».</span></p>
<p>« <em><strong>Quiconque achète de la nourriture ne doit pas la revendre avant d'en avoir complété la réception</strong></em> » (Al-Boukhârî et Muslim). Et dans une autre formulation : « <em><strong>jusqu'à ce qu'il la prenne en possession</strong></em> », et selon la version de Muslim : « <em><strong>jusqu'à ce qu'il la mesure</strong></em> ».<a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a></p>
<p>Ibn 'Abbâs (qu'Allah l'agrée, lui et son père) a dit : « <em>Et je ne considère pas que ce qui est autre que la nourriture soit différent d'elle</em> », c'est-à-dire : les choses autres que la nourriture. Bien plus, cela a été rapporté de manière explicite, comme l'a rapporté l'Imam Ahmad :</p>
<p class="ar"><strong><span dir="rtl">«إِذَا اشْتَرَيْتَ شَيْئاً؛ فَلَا تَبِعْهُ حَتَّى تَقْبِضَهُ»</span></strong></p>
<p>« <em><strong>Si tu achètes une chose, ne la revends pas avant de l'avoir prise en possession</strong></em> ». <a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a></p>
<p>Et Abou Dâwoûd a rapporté : « <em>Il a été interdit de revendre les marchandises là où elles ont été achetées, jusqu'à ce que les commerçants les transportent (les déplacent) vers leurs propres campements (ou locaux)</em> ».<a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a></p>
<p>Cheikh al-Islâm Ibn Taymiyyah et son élève Ibn al-Qayyim (qu'Allah leur fasse miséricorde) ont dit : « <em>La cause de l'interdiction de vendre avant la prise de possession est l'incapacité de l'acheteur à réceptionner la marchandise. En effet, le vendeur peut la lui livrer comme il peut ne pas la lui livrer, surtout s'il voit que l'acheteur a réalisé un profit ; il s'efforcera alors d'annuler la vente, soit par le déni (de la vente), soit par une ruse pour obtenir la résiliation. Cela est d'autant plus confirmé par l'interdiction de tirer un profit d'une chose dont on n'assure pas la garantie (Dhamân)</em> » Fin de citation.</p>
<p>Il est donc obligatoire pour les musulmans de se conformer à cela. Ainsi, lorsque le musulman achète une marchandise, il ne doit pas entreprendre d'en disposer, par la vente ou autre, jusqu'à ce qu'il la prenne pleinement et totalement en possession. Or, c'est une chose sur laquelle beaucoup de gens se montrent négligents ou qu'ils ignorent : ils achètent des marchandises, puis les revendent alors qu'ils ne les ont absolument pas prises en possession de la part du vendeur, ou qu'ils en ont pris possession de manière incomplète, ce qui n'est pas considéré comme une prise de possession valide. C'est le cas, par exemple, de celui qui compte les sacs, les colis ou les caisses alors qu'ils se trouvent encore dans le magasin (ou local) du vendeur, puis s'en va et les revend à un autre. Cela n'est pas considéré comme une prise de possession valide permettant à l'acheteur de disposer de la marchandise.</p>
<p>⁕ <strong>Si tu demandes : « Qu'est-ce que la prise de possession valide qui autorise l'acheteur à disposer de la marchandise ? »</strong></p>
<p><strong>La réponse est :</strong> la prise de possession des marchandises varie selon leur nature, et chaque catégorie possède un mode de prise de possession qui lui est propre :</p>
<ul>
<li><blockquote>
<p>Si la marchandise vendue est mesurée (au volume) : sa prise de possession se fait par le mesurage.</p>
</blockquote></li>
<li><blockquote>
<p>Si elle est pesée : sa prise de possession se fait par le pesage.</p>
</blockquote></li>
<li><blockquote>
<p>Si elle est comptée : sa prise de possession se fait par le comptage.</p>
</blockquote></li>
<li><blockquote>
<p>Si elle est mesurée à la coudée (longueur) : sa prise de possession se fait par le métrage.</p>
</blockquote></li>
</ul>
<p>Tout cela doit s'accompagner du transfert de ces biens vers le lieu propre à l'acheteur.</p>
<ul>
<li><blockquote>
<p>Pour ce qui est semblable aux vêtements, aux animaux et aux voitures : leur prise de possession s'effectue en les déplaçant (transférant) vers le lieu de l'acheteur.</p>
</blockquote></li>
<li><blockquote>
<p>Si la marchandise fait partie des choses qui se prennent à la main, comme les bijoux, les livres et ce qui y ressemble : sa prise de possession se réalise lorsque l'acheteur la prend en main et la reçoit physiquement.</p>
</blockquote></li>
<li><blockquote>
<p>Si la marchandise fait partie des choses qu'il est impossible de déplacer de leur endroit, comme les maisons, les terrains et les fruits encore sur les arbres : sa prise de possession se réalise par la "libération de jouissance" (Al-Takhliyah). Cela consiste à mettre le bien à la libre disposition de l'acheteur et à lever tout obstacle entre lui et le bien afin qu'il puisse agir dessus à la manière d'un propriétaire. Ainsi, la remise d'une maison ou autre se fait en lui ouvrant sa porte ou en lui remettant ses clés.</p>
</blockquote></li>
</ul>
<p>⁕ Des hadiths ont déjà été cités précédemment concernant l'interdiction de disposer de la marchandise vendue avant sa prise de possession légalement (considérée par la Loi religieuse). Cela réside dans l'intérêt de l'acheteur et du vendeur : (à savoir) mettre fin aux litiges et se préserver des disputes qui éclatent souvent entre les gens en raison de leur négligence vis-à-vis de la prise de possession, du manque de vérification de la marchandise par l'acheteur, du fait de ne pas la recevoir pleinement et intégralement, et (le fait de négliger) la cessation de la responsabilité du vendeur sur celle-ci. C'est une chose à laquelle le musulman se doit de se conformer et de mettre en application dans ses transactions.</p>
<p>⁕ Et beaucoup de gens aujourd'hui se montrent négligents concernant la prise de possession des marchandises, et ils en disposent avant la prise de possession légale (conforme à la Législation islamique). Ils commettent ainsi ce que le Messager <span dir="rtl">ﷺ</span> a interdit, et tombent alors dans les querelles et les litiges, ou sont frappés par le regret lorsque la marchandise leur apparaît sous sa véritable réalité alors qu'ils s'y sont déjà embourbés. Ils ne peuvent plus s'en défaire si ce n'est à travers des procédures judiciaires et des plaidoiries. Et il en est ainsi pour quiconque transgresse l'ordre du Messager <span dir="rtl">ﷺ</span> : il finira inévitablement par le regretter et tombera dans l'embarras (la difficulté).</p>
<p>⁕ Et parmi les choses auxquelles le Messager <span dir="rtl">ﷺ</span> a incité et encouragé, il y a : le fait que l'un des deux contractants accorde à l'autre la résiliation (Al-Iqâlah) en annulant la vente, lorsque ce dernier regrette le contrat, que son besoin pour la marchandise a disparu, ou qu'il se trouve en difficulté financière pour en payer le prix. Le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><strong><span dir="rtl">«مَنْ أَقَالَ مُسْلِماً؛ أَقَالَ اللهُ عَثْرَتَهُ يَوْمَ القِيَامَةِ»</span></strong></p>
<p>« <em><strong>Quiconque résilie la vente d'un musulman (qui le regrettait), Allah passera sur ses faux pas (le soulagera de ses trébuchements) le Jour de la Résurrection</strong></em> » .<a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a></p>
<p>Et le sens de la résiliation (Al-Iqâlah) est : l'annulation du contrat et le retour de chacun des deux contractants à ce qu'il possédait (auparavant), sans aucun ajout ni diminution. Elle fait partie du droit du musulman sur son frère musulman lorsque celui-ci en a besoin ; elle relève de la bonne conduite dans les transactions et découle des exigences de la fraternité dans la foi.</p>
