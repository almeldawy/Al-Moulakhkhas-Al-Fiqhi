  <!-- ▼ CONTENU DU CHAPITRE ▼ -->
  <template id="chapter-content">
<p>⁕ « Al-Jawâ'ih » est le pluriel de « Jâ'ihah ». Il s'agit du fléau (ou de la calamité) qui frappe les fruits et les détruit. Ce terme est dérivé de « Al-Jawh », qui signifie le déracinement (ou l'éradication totale).</p>
<p>⁕ Ainsi, lorsque le fruit est vendu après l'apparition de sa maturité (moment où sa vente devient alors licite), et qu'il est frappé par un fléau céleste qui le détruit — le fléau céleste étant tout événement dans lequel l'être humain n'a aucune part, tel que le vent, la forte chaleur, la sécheresse (le manque d'eau), la pluie, la grêle, les sauterelles... et autres calamités majeures similaires qui s'abattent sur les fruits et les ravagent — si ce fruit détruit avait été vendu mais que l'acheteur n'avait pas encore eu la possibilité de le récolter avant qu'il ne soit touché et mâté, l'acheteur se retourne alors contre le vendeur et réclame le remboursement du prix qu'il lui avait versé. Cela se fonde sur le hadith de Jâbir (qu'Allah l'agrée) :</p>
<p class="ar"><strong><span dir="rtl">«أَنَّ النَّبِيَّ ﷺ أَمَرَ بِوَضْعِ الْجَوَائِحِ»</span></strong></p>
<p>« <em><strong>Le Prophète <span dir="rtl">ﷺ</span> a ordonné l'exonération des calamités (Wad' al-Jawâ'ih)</strong></em> », rapporté par Muslim.<a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a></p>
<p>Ce hadith prouve donc que le fruit détruit reste sous la responsabilité et la propriété du vendeur, et que celui-ci ne mérite rien du prix de la part de l'acheteur. De ce fait, si la récolte est entièrement détruite, l'acheteur récupère la totalité du prix. Si une partie seulement est détruite, l'acheteur se retourne contre le vendeur pour récupérer la part du prix qui y correspond, en raison de la portée générale du hadith. Et cela est identique, que la vente ait eu lieu avant ou après l'apparition de la maturité, toujours en raison de la portée générale du hadith, ainsi que de la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><strong><span dir="rtl">«بِمَ تَأْخُذُ مَالَ أَخِيكَ بِغَيْرِ حَقٍّ؟»</span></strong></p>
<p><em><strong>« À quel titre prendrais-tu le bien de ton frère sans droit ? ».</strong></em></p>
<p>En revanche, si la quantité détruite est minime et insignifiante (difficile à évaluer précisément), la perte incombe à l'acheteur et ne relève pas de la responsabilité du vendeur. En effet, cela fait partie des pertes habituelles et courantes, cela n'est pas qualifié de « calamité » (Jâ'ihah) et il est impossible de s'en prémunir ; comme par exemple ce que les oiseaux consomment ou ce qui tombe au sol, etc. Certains savants ont délimité cette perte minime comme étant inférieure au tiers [de la récolte], mais l'avis le plus proche de la vérité est qu'elle n'est pas restreinte par cette limite, mais qu'il convient plutôt de se référer à la coutume ('Urf), car fixer une limite précise nécessite une preuve [textuelle].</p>
<p>⁕ Les savants – qu'Allah leur fasse miséricorde – ont expliqué la raison pour laquelle le vendeur doit supporter la responsabilité financière de la perte des fruits due à un fléau céleste (<em>Jâ'ihah</em>) : c'est parce que la prise de possession des fruits au sommet des arbres par simple mise à disposition (<em>At-Takhliyah</em>) est une prise de possession incomplète. C'est donc comme s'il ne les avait pas du tout pris en possession.</p>
<p>⁕ Ceci concerne la perte des fruits causée par un fléau céleste. Quant à la situation où ils sont détruits par l'action d'un être humain (comme un incendie criminel par exemple), l'acheteur a alors le choix entre deux options :</p>
<ul>
<li><blockquote>
<p><strong>Soit résilier la vente :</strong> il réclame alors au vendeur le remboursement du prix qu'il a payé, et le vendeur se retourne ensuite contre l'auteur des dégradations pour exiger d'être indemnisé pour ce qui a été détruit.</p>
</blockquote></li>
<li><blockquote>
<p><strong>Soit maintenir la vente :</strong> il valide l'achat et réclame directement à l'auteur des dégradations la valeur de compensation de ce qu'il a détruit. »</p>
</blockquote></li>
</ul>
<p>⁕ <strong>Le signe de l'apparition de la bonne maturité (<em>Budû as-Salâh</em>) pour les végétaux autres que les palmiers</strong> — c'est-à-dire le signe par lequel on reconnaît la maturité du fruit, condition à laquelle le Prophète <span dir="rtl">ﷺ</span> a suspendu la permission de la vente pour les arbres autres que les palmiers — varie selon la nature de chaque arbre.</p>
<p><strong>L'apparition de la maturité pour le raisin :</strong> c'est lorsqu'il se gorge de jus et devient sucré, conformément aux propos d'Anas [ibn Mâlik] :</p>
<p class="ar"><strong><span dir="rtl">«نَهَى النَّبِيُّ ﷺ عَنْ بَيْعِ الْعِنَبِ حَتَّى يَسْوَدَّ»</span></strong></p>
<p><em><strong>« Le Prophète <span dir="rtl">ﷺ</span> a interdit la vente du raisin jusqu'à ce qu'il devienne noir (qu'il mûrisse) »</strong></em>, rapporté par Ahmad et ses rapporteurs sont dignes de confiance <a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a></p>
<p><strong>Le signe de l'apparition de la maturité pour le reste des fruits</strong> comme les pommes, les pastèques/melons, les grenades, les abricots, les pêches, les noix et autres fruits similaires : c'est lorsque les signes de maturation y apparaissent et que leur consommation devient agréable. En effet, le Prophète <span dir="rtl">ﷺ</span> <em>« a interdit la vente des fruits jusqu'à ce qu'ils soient bons [à consommer] »</em> (Unanimement approuvé - <em>Muttafaqun 'alayh</em>), et dans une autre formulation : <em>« jusqu'à ce que leur consommation soit agréable »</em> <a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a>.</p>
<p><strong>L'apparition de la maturité pour les produits comme le concombre (<em>Qiththâ'</em>) :</strong> c'est lorsqu'il atteint le stade où il est habituellement consommé.</p>
<p><strong>Le signe de l'apparition de la maturité pour les grains (céréales) :</strong> c'est lorsqu'ils durcissent et blanchissent, car le Prophète <span dir="rtl">ﷺ</span> a fait du durcissement du grain la condition limite pour la validité de sa vente.</p>
