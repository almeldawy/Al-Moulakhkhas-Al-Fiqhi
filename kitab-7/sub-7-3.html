<p>⁕ Allah — Gloire à Lui — a autorisé à Ses serviteurs la vente et l'achat , tant que cela n'entraîne pas la perte de ce qui est plus utile et plus important ; comme le fait que cela vienne entraver l'accomplissement d'une adoration obligatoire , ou que cela cause un préjudice à autrui.</p>
<p>⁕ La vente et l'achat ne sont pas valides pour quiconque est tenu d'accomplir la prière du Vendredi après le second appel (al-adhân) ; en raison de la parole d'Allah le Très-Haut :</p>
<p class="ar"><strong><span dir="rtl">﴿يَا أَيُّهَا الَّذِينَ آمَنُوا إِذَا نُودِيَ لِلصَّلَاةِ مِنْ يَوْمِ الْجُمُعَةِ فَاسْعَوْا إِلَى ذِكْرِ اللَّهِ وَذَرُوا الْبَيْعَ ذَلِكُمْ خَيْرٌ لَكُمْ إِنْ كُنْتُمْ تَعْلَمُونَ﴾ [الجمعة: ٩]</span></strong></p>
<p><strong>« Ô vous qui avez cru ! Quand on appelle à la prière du jour du Vendredi, accourez à l'invocation d'Allah et laissez tout commerce. Cela est bien meilleur pour vous, si vous saviez. »</strong> [Sourate Al-Jumu'ah : 9].</p>
<p>Allah — Puissant et Majestueux — a donc interdit la vente au moment de l'appel à la prière du Vendredi, afin qu'elle ne soit pas utilisée comme un prétexte pour se préoccuper du commerce au détriment de sa présence [à la mosquée]. Il a spécifié la vente car elle fait partie des causes de subsistance les plus importantes qui occupent l'homme. Or, l'interdiction implique ici le caractère illicite (tahrîm) et la non-validité de la transaction. Ensuite, le Très-Haut a dit : <strong>« Cela »</strong> ; signifiant : ce que Je vous ai mentionné concernant le fait de délaisser le commerce et d'assister au Vendredi, <strong>« est bien meilleur pour vous »</strong> que de s'occuper de la vente, <strong>« si vous saviez »</strong> ce qui est dans l'intérêt de vos propres personnes. De la même manière, s'occuper d'autre chose que la vente au détriment de la prière est interdit.</p>
<p>Il en va de même pour le reste des prières obligatoires : il n'est pas permis de s'en distraire par la vente, l'achat ou autre chose, une fois que l'appel est lancé pour y assister dans les mosquées. Le Très-Haut a dit :</p>
<p class="ar"><strong><span dir="rtl">﴿فِي بُيُوتٍ أَذِنَ اللَّهُ أَنْ تُرْفَعَ وَيُذْكَرَ فِيهَا اسْمُهُ يُسَبِّحُ لَهُ فِيهَا بِالْغُدُوِّ وَالْآصَالِ * رِجَالٌ لَا تُلْهِيهِمْ تِجَارَةٌ وَلَا بَيْعٌ عَنْ ذِكْرِ اللَّهِ وَإِقَامِ الصَّلَاةِ وَإِيتَاءِ الزَّكَاةِ يَخَافُونَ يَوْمًا تَتَقَلَّبُ فِيهِ الْقُلُوبُ وَالْأَبْصَارُ * لِيَجْزِيَهُمُ اللَّهُ أَحْسَنَ مَا عَمِلُوا وَيَزِيدَهُمْ مِنْ فَضْلِهِ وَاللَّهُ يَرْزُقُ مَنْ يَشَاءُ بِغَيْرِ حِسَابٍ﴾ [النور: ٣٦-٣٨]</span></strong></p>
<p><strong>« Dans des maisons [des mosquées] qu'Allah a permis d'élever et où Son Nom est invoqué ; Le glorifient en elles, matin et soir, des hommes que ni le négoce ni la vente ne distraient de l'invocation d'Allah, de l'accomplissement de la prière et de l'acquittement de la Zakât ; ils craignent un jour où les cœurs et les regards seront bouleversés. Afin qu'Allah les récompense pour le meilleur de ce qu'ils ont fait et leur ajoute de Sa grâce. Et Allah accorde Sa subsistance à qui Il veut sans compter. »</strong> [Sourate An-Nûr : 36-38].</p>
<p>⁕ <strong>De même, il n'est pas valide de vendre une chose à quelqu'un qui s'en servira pour désobéir à Allah ou qui l'utilisera dans ce qu'Allah a interdit.</strong> Ainsi, il n'est pas permis de vendre du jus [de raisin ou autre] à celui qui en fera du vin (alcool), en raison de la parole du Très-Haut :</p>
<p class="ar"><strong><span dir="rtl">﴿وَلَا تَعَاوَنُوا عَلَى الْإِثْمِ وَالْعُدْوَانِ﴾ [المائدة: ٢]</span></strong></p>
<p><strong>« Et ne vous entraidez pas dans le péché et la transgression »</strong> [Sourate Al-Mâ'idah : 2], car cela constituerait une aide à la transgression.</p>
<p>⁕ <strong>De même, il n'est ni permis ni valide de vendre des armes en période de trouble (Fitna) entre les musulmans</strong>, afin qu'un musulman ne soit pas tué avec celles-ci. Il en va de même pour tous les instruments de combat dont la vente est interdite dans une telle situation ; car le Prophète <span dir="rtl">ﷺ</span> a interdit cela<a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a>, et en raison de la parole du Très-Haut :</p>
<p class="ar"><strong><span dir="rtl">﴿وَلَا تَعَاوَنُوا عَلَى الْإِثْمِ وَالْعُدْوَانِ﴾ [المائدة: ٢]</span></strong></p>
<p><strong>« Et ne vous entraidez pas dans le péché et la transgression »</strong> [Sourate Al-Mâ'idah : 2].</p>
<p><strong>Ibn al-Qayyim a dit</strong> <a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a><strong>:</strong> « <em>Les preuves de la Législation (Charia) concordent sur le fait que les intentions dans les contrats sont prises en compte, et qu'elles influent sur la validité ou la nullité du contrat, ainsi que sur son caractère licite ou illicite. Ainsi, l'arme qu'un homme vend à celui dont il sait qu'il l'utilisera pour tuer un musulman est [une vente] interdite et nulle, en raison de l'aide au péché et à la transgression que cela implique. En revanche, s'il la vend à celui dont il sait qu'il l'utilisera pour le combat dans le sentier d'Allah, cela constitue un acte d'obéissance et un rapprochement [vers Allah]. De même, il n'est pas permis de vendre des armes à ceux qui combattent les musulmans ou à ceux qui les utilisent pour le brigandage (coupeurs de route), car c'est une aide à la désobéissance.</em> »</p>
<p>⁕ <strong>Il n'est pas permis de vendre un esclave musulman à un non-musulman (mécréant) s'il n'est pas affranchi immédiatement par cette vente.</strong> Cela s'explique par l'humiliation et l'abaissement du musulman face au non-musulman que cela impliquerait. Or, Allah le Très-Haut a dit :</p>
<p class="ar"><strong><span dir="rtl">﴿وَلَنْ يَجْعَلَ اللهُ لِلْكَافِرِينَ عَلَى الْمُؤْمِنِينَ سَبِيلًا﴾ [النساء: ١٤١]</span></strong></p>
<p><strong>« Et Allah ne donnera jamais aux mécréants de voie sur les croyants »</strong> [Sourate An-Nisâ' : 141].</p>
<p>De même, le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><strong><span dir="rtl">«الإِسْلَامُ يَعْلُو وَلَا يُعْلَى عَلَيْهِ»</span></strong></p>
<p><strong>« L'Islam est supérieur et rien ne lui est supérieur. »</strong><a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a></p>
<p>⁕ Il est interdit de vendre sur la vente de son frère musulman. Par exemple : dire à celui qui a acheté une marchandise pour dix (dirhams) : "<em>Je t'en donne une semblable pour neuf</em>", ou "<em>Je t'en donne une meilleure pour le même prix</em>".</p>
<p>Le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><strong><span dir="rtl">«وَلَا يَبِعْ بَعْضُكُمْ عَلَى بَيْعِ بَعْضٍ»</span></strong></p>
<p>« <em><strong>Que l'un d'entre vous ne vende pas sur la vente d'autrui</strong></em> » (Rapporté par Al-Bukhârî et Muslim). <a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a></p>
<p>Et il <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><strong><span dir="rtl">«لَا يَبِعِ الرَّجُلُ عَلَى بَيْعِ أَخِيهِ»</span></strong></p>
<p>« <em><strong>Qu'un homme ne vende pas sur la vente de son frère.</strong></em> » (Rapporté par Al-Bukhârî et Muslim).<a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a></p>
<p>De même, il est interdit d'acheter sur l'achat de son frère (surenchérir après accord). Par exemple : dire à celui qui a vendu sa marchandise pour neuf : "<em>Je te l'achète pour dix</em>".</p>
<p>Combien de telles transactions interdites se produisent aujourd'hui sur les marchés des musulmans ! Il est donc obligatoire pour le musulman de s'en écarter, de l'interdire et de le désapprouver chez celui qui le commet.</p>
<p>⁕ <strong>Et parmi les ventes interdites : la vente du citadin pour le campagnard.</strong> Le citadin est celui qui réside dans les villes et les villages, tandis que le campagnard est celui qui vient de la brousse (campagne) ou d'ailleurs ; cela en raison de la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><strong><span dir="rtl">«لَا يَبِعْ حَاضِرٌ لِبَادٍ»</span></strong></p>
<p></p>
<p><strong>« Que le citadin ne vende pas pour le campagnard. »</strong><a href="#fn6" class="footnote-ref" id="fnref6" role="doc-noteref"><sup>6</sup></a></p>
<p>Ibn 'Abbâs (qu'Allah l'agrée, lui et son père) a dit : « <em>C'est-à-dire qu'il ne doit pas être son courtier (un intermédiaire) qui s'interpose entre le vendeur et l'acheteur.</em> »</p>
<p><strong>Et il <span dir="rtl">ﷺ</span> a dit :</strong></p>
<p class="ar"><strong><span dir="rtl">«دَعُوا النَّاسَ يَرْزُقُ اللَّهُ بَعْضَهُمْ مِن بَعْضٍ»</span></strong></p>
<p><strong>« Laissez les gens, Allah accorde la subsistance aux uns par le biais des autres. »</strong><a href="#fn7" class="footnote-ref" id="fnref7" role="doc-noteref"><sup>7</sup></a></p>
<p>De même qu'il n'est pas permis au citadin de prendre en charge la vente de la marchandise du campagnard, il ne lui convient pas non plus d'acheter pour lui. Ce qui est interdit, c'est que le citadin aille vers le campagnard et lui dise : « Je vends pour toi » ou « J'achète pour toi ». En revanche, si le campagnard vient trouver le citadin et lui demande de vendre ou d'acheter pour lui, alors rien ne s'oppose à cela.</p>
<p>⁕ Parmi les ventes interdites : <strong>la vente dite <em>al-'Inah</em></strong>. Elle consiste à vendre une marchandise à une personne pour un prix à terme (payé plus tard), puis à la lui racheter immédiatement pour un prix au comptant inférieur au prix à terme. Par exemple : lui vendre une voiture pour vingt mille (unités) à terme, puis la lui racheter pour quinze mille au comptant qu'il lui remet aussitôt, alors que les vingt mille restent à la charge de l'acheteur jusqu'à l'échéance. Cela est interdit car c'est un stratagème pour parvenir à l'usure (<em>Riba</em>). C'est comme s'il avait vendu des dirhams à terme contre des dirhams au comptant avec un surplus, en utilisant la marchandise uniquement comme un simple prétexte (ruse).</p>
<p>Le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><strong><span dir="rtl">«إِذَا تَبَايَعْتُمْ بِالْعِينَةِ، وَأَخَذْتُمْ أَذْنَابَ الْبَقَرِ، وَتَرَكْتُمُ الْجِهَادَ؛ سَلَّطَ اللَّهُ عَلَيْكُمْ ذُلّاً، لَا يَنْزِعُهُ مِنْكُمْ حَتَّى تَرْجِعُوا إِلَى دِينِكُمْ»</span></strong></p>
<p><strong>« <em>Lorsque vous pratiquerez la vente al-'Inah, que vous suivrez la queue des vaches (pour vous consacrer uniquement à l'agriculture) et que vous délaisserez le Jihad, Allah fera s'abattre sur vous une humiliation qu'Il ne retirera que lorsque vous reviendrez à votre religion.</em> »</strong><a href="#fn8" class="footnote-ref" id="fnref8" role="doc-noteref"><sup>8</sup></a></p>
<p>Et il <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><strong><span dir="rtl">«يَأْتِي عَلَى النَّاسِ زَمَانٌ يَسْتَحِلُّونَ الرِّبَا بِالْبَيْعِ»</span></strong></p>
<p><strong>« <em>Il viendra une époque pour les gens où ils rendront licite l'usure par le biais du commerce.</em> »</strong><a href="#fn9" class="footnote-ref" id="fnref9" role="doc-noteref"><sup>9</sup></a></p>
