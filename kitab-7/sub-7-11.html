  <!-- ▼ CONTENU DU CHAPITRE ▼ -->

<p>Il existe des éléments qui sont inclus par défaut dans la vente de la marchandise et reviennent donc à l'acheteur, à moins que le vendeur ne les ait exclus. En voici des exemples :</p>
<p><strong>⁕ Quiconque vend un esclave ou une bête :</strong> les vêtements habituels (portés au quotidien) de l'esclave suivent la vente (reviennent à l'acheteur), tout comme le licol, la longe et les fers qui se trouvent sur la bête. Ces éléments mentionnés sont inclus d'office dans l'acte de vente absolu, car cela est conforme à l'usage (la coutume). En revanche, ce que l'usage n'inclut pas dans la vente et qui ne relève pas des besoins essentiels de la marchandise — comme l'argent que possède l'esclave ou ses vêtements d'apparat (de fête) — cela ne suit pas la vente. Ceci est basé sur la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><strong><span dir="rtl">«مَنْ بَاعَ عَبْداً وَلَهُ مَالٌ؛ فَمَالُهُ لِبَائِعِهِ؛ إِلَّا أَنْ يَشْتَرِطَ المُبْتَاعُ»</span></strong></p>
<p><em><strong>« Quiconque vend un esclave qui possède des biens, ses biens appartiennent alors au vendeur, à moins que l'acheteur ne pose comme condition (de les acquérir). »</strong></em> Rapporté par Muslim <a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a>.</p>
<p>Cela prouve donc que les biens de l'esclave ne sont pas inclus avec lui dans la vente lorsqu'il est vendu, car la transaction porte uniquement sur l'esclave lui-même, et l'argent est un élément distinct (en surplus). C'est exactement comme si le maître possédait deux esclaves et qu'il n'en vendait qu'un seul. De plus, l'esclave et ses biens appartiennent à son maître ; ainsi, lorsque le maître vend l'esclave, les biens restent sa propriété.</p>
<p><strong>⁕ Si l'acheteur pose comme condition</strong> d'inclure dans la vente l'argent qui se trouve avec l'esclave, alors cet argent est inclus, conformément à la parole du Prophète <span dir="rtl">ﷺ</span> : <em><strong>« ... à moins que l'acheteur ne pose comme condition. »</strong></em></p>
