<p>⁕ Le Waqf consiste à immobiliser le bien d'origine (le capital) et à en libérer la jouissance (l'usufruit).</p>
<ul>
<li><blockquote>
<p><strong>Ce que l'on entend par "le bien d'origine" :</strong> tout ce dont il est possible de tirer profit tout en préservant son intégrité matérielle (sa substance), comme les maisons, les boutiques, les vergers et autres biens similaires.</p>
</blockquote></li>
<li><blockquote>
<p><strong>Ce que l'on entend par "la jouissance" (l'usufruit) :</strong> le rendement ou le fruit produit par ce bien d'origine, tel que les récoltes, le montant des loyers, le droit d'habitation d'une demeure et autres profits similaires.</p>
</blockquote></li>
</ul>
<p>⁕ <strong>Le statut juridique du Waqf est qu'il s'agit d'un acte d'adoration (un rapprochement vers Allah) recommandé en Islam. La preuve en est la Tradition (Sunnah) authentique :</strong></p>
<p><strong>Dans les deux recueils authentiques (Al-Bukhârî et Muslim) :</strong> Il est rapporté qu'Omar — qu'Allah l'agrée — a dit : « Ô Messager d'Allah ! J'ai acquis à Khaybar un bien si précieux que je n'ai jamais possédé de bien qui me soit plus cher. Que m'ordonnes-tu donc de faire à son sujet ? » Il répondit <span dir="rtl">ﷺ</span> : « Si tu le veux, tu peux immobiliser son bien d'origine (le capital) et faire l'aumône de ses fruits. » Omar en fit alors l'aumône à la condition que ce bien ne soit ni vendu, ni donné, ni transmis en héritage<a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a>. Ainsi, Omar en fit don aux pauvres, aux proches parents, pour l'affranchissement des esclaves, dans le sentier d'Allah, pour le voyageur en détresse et pour l'hôte...<a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a></p>
<p><strong>Muslim a également rapporté dans son « Authentique »</strong> d'après le Prophète <span dir="rtl">ﷺ</span> qu'il a dit :</p>
<p class="ar"><span dir="rtl">«إِذَا مَاتَ الْإِنْسَانُ؛ انْقَطَعَ عَنْهُ عَمَلُهُ؛ إِلَّا مِنْ ثَلَاثٍ: صَدَقَةٍ جَارِيَةٍ، أَوْ عِلْمٍ يُنْتَفَعُ بِهِ مَنْ بَعْدَهُ، أَوْ وَلَدٍ صَالِحٍ يَدْعُو لَهُ»</span></p>
<p><em><strong>« Quand l'être humain meurt, ses œuvres s'interrompent, sauf à travers trois choses : une aumône continue (Sadaqah Jâriyah), un savoir dont les gens profitent après lui, ou un enfant pieux qui prie (invoque) pour lui. »</strong></em><a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a></p>
<p><strong>Et Jâbir a dit :</strong> « Il n'y avait aucun des compagnons du Messager d'Allah ayant les moyens financiers qui n'ait établi un <em>Waqf</em>. »</p>
<p><strong>Et al-Qurtubî — qu'Allah lui fasse miséricorde — a dit :</strong> « Il n'y a aucune divergence parmi les imams (les savants) concernant l'immobilisation (la mise en <em>Waqf</em>) des ponts et des mosquées, tandis qu'ils ont divergé concernant le reste. »</p>
<p>⁕ Il est exigé (comme condition) que le donateur du Waqf (<em>Al-Wâqif</em>) soit juridiquement apte à disposer de ses biens ; c'est-à-dire qu'il doit être pubère, libre et jouir d'une pleine capacité de discernement (sage/responsable). Ainsi, le <em>Waqf</em> n'est pas valable de la part d'un enfant, d'une personne mentalement inapte (le faible d'esprit/<em>Al-Safîh</em>) ou d'un esclave.</p>
<p>⁕ Le Waqf se conclut et devient effectif par l'une des deux modalités suivantes :</p>
<ol type="1">
<li><blockquote>
<p><strong>La première : La parole explicite indiquant le Waqf.</strong> Comme le fait de dire : « J'institue cet endroit en <em>Waqf</em> », ou « Je l'ai désigné comme mosquée ».</p>
</blockquote></li>
<li><blockquote>
<p><strong>La seconde : L'acte indiquant le Waqf selon la coutume des gens ('Urf).</strong> Comme le fait qu'une personne transforme sa demeure en mosquée et accorde aux gens une autorisation générale d'y prier, ou qu'elle transforme son terrain en cimetière et autorise les gens à y enterrer leurs morts.</p>
</blockquote></li>
</ol>
<p>⁕ Les termes employés pour formaliser le Waqf sont de deux catégories :</p>
<ul>
<li><blockquote>
<p><strong>La première catégorie : Les termes explicites (Saréh).</strong> Comme le fait de dire : « J'ai mis en <em>Waqf</em> » (<em>Waqaftu</em>), « J'ai immobilisé » (<em>Habastu</em>), « J'ai voué à l'usage public » (<em>Sabbaltu</em>), « J'ai dénommé... » [Note : souvent compris ici comme l'acte formel]. Ces termes sont dits explicites car ils ne portent pas à confusion et ne peuvent désigner autre chose que le <em>Waqf</em>. Dès que le donateur emploie l'une de ces formules, le bien devient un <em>Waqf</em> de manière immédiate, sans qu'il soit nécessaire d'y ajouter un élément ou une condition supplémentaire.</p>
</blockquote></li>
<li><blockquote>
<p><strong>La seconde catégorie : Les termes implicites ou métaphoriques (Kinâyah).</strong> Comme le fait de dire : « J'ai fait aumône » (<em>Tasaddaqtu</em>), « J'ai rendu interdit » (<em>Harramtu</em>), « J'ai perpétué » (<em>Abbadtu</em>)... Ils sont qualifiés d'implicites car ils peuvent signifier le <em>Waqf</em> tout comme ils peuvent désigner autre chose (comme une aumône classique). Dès lors, lorsque le donateur prononce l'un de ces mots, la validité du <em>Waqf</em> est conditionnée par :</p>
</blockquote>
<ul>
<li><blockquote>
<p>Soit la présence simultanée de <strong>l'intention</strong> (<em>Niyyah</em>) de faire un <em>Waqf</em> au moment de la parole.</p>
</blockquote></li>
<li><blockquote>
<p>Soit l'association de ce terme implicite avec <strong>un terme explicite</strong>, ou avec un autre terme implicite qui en précise le sens.</p>
</blockquote></li>
<li><blockquote>
<p><strong>Exemple d'association avec des termes explicites/implicites :</strong> dire : « J'ai fait aumône de tel bien en tant qu'aumône immobilisée (<em>Mawqûfah</em>), bloquée (<em>Muhabbasah</em>), vouée au bien public (<em>Musabbalah</em>), rendue sacrée/inviolable (<em>Muharramah</em>) ou perpétuelle (<em>Mu-abbadah</em>) ».</p>
</blockquote></li>
<li><blockquote>
<p><strong>Exemple d'association du terme implicite avec une règle propre au Waqf :</strong> dire : « J'ai fait aumône de tel bien en tant qu'aumône qui ne peut être ni vendue, ni transmise en héritage ».</p>
</blockquote></li>
</ul></li>
</ul>
<p>⁕ Des conditions sont exigées pour la validité du Waqf, à savoir :</p>
<ul>
<li><blockquote>
<p><strong>Premièrement :</strong> Le donateur (<em>Al-Wâqif</em>) doit être juridiquement apte à disposer de ses biens, comme cela a été mentionné précédemment.</p>
</blockquote></li>
<li><blockquote>
<p><strong>Deuxièmement :</strong> Le bien mis en <em>Waqf</em> doit faire partie de ce dont on peut tirer un profit continu tout en préservant son intégrité matérielle (sa substance). Ainsi, il n'est pas valable de mettre en <em>Waqf</em> ce qui disparaît après utilisation, comme la nourriture.</p>
</blockquote></li>
<li><blockquote>
<p><strong>Troisièmement :</strong> Le bien mis en <em>Waqf</em> doit être précisément déterminé (spécifié). Il n'est donc pas valable de destiner un bien indéterminé, comme s'il disait : « J'institue en <em>Waqf</em> un esclave parmi mes esclaves » ou « une maison parmi mes maisons ».</p>
</blockquote></li>
<li><blockquote>
<p><strong>Quatrièmement :</strong> Le <em>Waqf</em> doit être établi pour une œuvre de bienfaisance et de piété (<em>Birr</em>), car le but recherché est de se rapprocher d'Allah le Très-Haut. C'est le cas [des donations pour] les mosquées, les ponts, les nécessiteux, les points d'eau potable, les livres de science et les proches parents. Par conséquent, le <em>Waqf</em> n'est pas valable s'il est affecté à autre chose qu'une œuvre de piété, comme le <em>Waqf</em> destiné aux lieux de culte des mécréants, aux livres d'hérésie/d'athéisme, ou le <em>Waqf</em> en faveur des tombeaux/mausolées pour leur éclairage, leur encensement, ou en faveur de leurs gardiens, car cela constitue une aide à la désobéissance, au polythéisme (<em>Shirk</em>) et à la mécréance (<em>Kufr</em>).</p>
</blockquote></li>
<li><blockquote>
<p><strong>Cinquièmement :</strong> Il est conditionné pour la validité du <em>Waqf</em>, s'il est fait au profit d'un bénéficiaire spécifique (nommément désigné), que ce dernier soit légalement apte à posséder de manière stable. En effet, le <em>Waqf</em> implique un transfert de propriété (de jouissance) ; il n'est donc pas valable au profit de ce qui ne peut pas posséder, comme un mort ou un animal.</p>
</blockquote></li>
<li><blockquote>
<p><strong>Sixièmement :</strong> Il est conditionné pour la validité du <em>Waqf</em> qu'il soit immédiat et sans condition (exécutoire). Ainsi, le <em>Waqf</em> temporaire n'est pas valable, de même que le <em>Waqf</em> suspendu à une condition future, à moins qu'il ne le suspende à sa propre mort, auquel cas cela devient valable. C'est le cas s'il dit : « Quand je mourrai, ma maison sera un <em>Waqf</em> pour les pauvres ». La preuve en est ce qu'a rapporté Abou Dâwoûd : « Omar a laissé pour instructions que s'il lui arrivait malheur (la mort), sa terre appelée Thamgh serait une aumône (<em>Sadaqah</em>) ». Cet acte a été rendu public et personne ne s'y est opposé, ce qui constitue un consensus (<em>Ijmâ'</em>). Ce type de <em>Waqf</em> suspendu à la mort s'exécute alors sur le tiers des biens [au maximum], car il est assimilé au statut juridique du testament (<em>Al-Wasiyyah</em>).</p>
</blockquote></li>
</ul>
<p>⁕ Parmi les règles du Waqf, figure l'obligation de se conformer aux conditions fixées par le donateur (Al-Wâqif), tant que celles-ci ne contreviennent pas à la Législation islamique (Shari'ah). Cela s'appuie sur la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«الْمُسْلِمُونَ عَلَى شُرُوطِهِمْ؛ إِلَّا شَرْطاً أَحَلَّ حَرَاماً أَوْ حَرَّمَ حَلَالاً»</span></p>
<p>« Les musulmans doivent respecter leurs conditions, sauf une condition qui autoriserait un interdit ou interdirait un acte licite »<a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a>. De plus, Omar — qu'Allah l'agrée — a établi un <em>Waqf</em> en y fixant des conditions ; si l'application de ses conditions n'avait pas été obligatoire, elles n'auraient eu aucune utilité.</p>
<p>Par conséquent, si le donateur stipule [pour un bénéficiaire] une part déterminée, ou s'il conditionne la priorité de certains bénéficiaires par rapport à d'autres, ou leur égalité (leur regroupement), ou s'il exige qu'un bénéficiaire possède une caractéristique précise (un attribut) ou qu'il en soit dépourvu, ou encore s'il attribue la gestion (le droit de regard) du <em>Waqf</em> à une personne en particulier, ou toute autre condition similaire : <strong>il est obligatoire de se conformer à sa condition, tant que celle-ci ne contredit pas le Livre (le Coran) ou la Sunnah.</strong></p>
<p>Cependant, si le donateur n'a fixé aucune condition particulière, les bénéficiaires désignés possèdent les mêmes droits de manière équitable : le riche et le pauvre, l'homme et la femme sont alors égaux dans l'éligibilité [aux fruits du <em>Waqf</em>].</p>
<p>⁕ Si le donateur n'a pas désigné d'administrateur (gardien/<em>Nâdhir</em>) pour le Waqf, ou s'il a désigné une personne et que celle-ci vient à mourir :</p>
<ul>
<li><blockquote>
<p>La gestion revient alors directement au bénéficiaire du <em>Waqf</em>, si ce dernier est une personne spécifique (nommément désignée).</p>
</blockquote></li>
<li><blockquote>
<p>En revanche, si le <em>Waqf</em> est destiné à un intérêt public comme les mosquées, ou à une catégorie de personnes qu'il est impossible de dénombrer précisément comme les nécessiteux, la gestion du <em>Waqf</em> incombe alors au gouverneur (ou au juge). Ce dernier s'en charge alors lui-même ou mandate un représentant pour s'en occuper.</p>
</blockquote></li>
</ul>
<p>⁕ Il est obligatoire à l'administrateur (le Nâdhir) de craindre Allah et de veiller à la saine gestion du Waqf, car il s'agit d'un dépôt de confiance (<em>Amânah</em>) qui lui a été confié.</p>
<p>⁕ Lorsqu'une personne établit un Waqf en faveur de ses enfants, les mâles et les femelles sont égaux dans l'éligibilité (le droit aux fruits du Waqf). En effet, le donateur les a associés collectivement, et le fait d'associer sans autre précision implique l'égalité des droits, tout comme s'il avait reconnu une dette ou un bien en leur faveur, l'objet de cette reconnaissance serait partagé équitablement entre eux. Il en va de même lorsqu'il établit un <em>Waqf</em> à leur bénéfice.</p>
<p>Ensuite, après les enfants nés de ses propres reins (ses enfants directs), le <em>Waqf</em> est transféré aux enfants de ses fils, à l'exclusion des enfants de ses filles. Cela s'explique par le fait que ces derniers sont issus d'un autre homme et sont donc affiliés à leurs propres pères, et parce qu'ils n'entrent pas dans la parole d'Allah le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿ يُوصِيكُمُ اللَّهُ فِي أَوْلَادِكُمْ ﴾</span></p>
<p><em><strong>« Allah vous commande au sujet de vos enfants »</strong></em> (Sourate An-Nisâ, v. 11).</p>
<p>Cependant, certains savants sont d'avis que les enfants des filles entrent bien dans le terme "enfants", car les filles du donateur sont ses propres enfants, et les enfants de celles-ci sont donc véritablement les enfants de ses enfants. Et Allah sait mieux.</p>
<p><strong>Si le donateur dit : « J'institue un Waqf au profit de mes fils (Abnâ-î) » ou « des fils de untel (Banî Fulân) », le Waqf est exclusivement réservé aux mâles.</strong> En effet, le terme <em>« Al-Banîn »</em> (les fils) a été linguistiquement institué pour désigner spécifiquement les mâles.</p>
<p>Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿ أَمْ لَهُ الْبَنَاتُ وَلَكُمُ الْبَنُونَ ﴾</span></p>
<p><em><strong>« Aurait-Il les filles, tandis que vous auriez les fils ? »</strong></em> (Sourate At-Tûr, v. 39).</p>
<p>L'unique exception est le cas où les bénéficiaires du <em>Waqf</em> désignent une tribu entière, comme le fait de dire : « les Banû Hâshim » ou « les Banû Tamîm ». Dans ce cas précis, les femmes sont incluses, car le nom de la tribu englobe aussi bien ses membres masculins que féminins.</p>
<p>⁕ Néanmoins, si le Waqf est établi au profit d'un groupe de personnes qu'il est possible de dénombrer précisément, il est alors obligatoire de faire bénéficier l'ensemble des membres et d'instaurer une égalité parfaite entre eux.</p>
<p>En revanche, s'il est impossible de les dénombrer et de tous les englober — comme c'est le cas pour les Banû Hâshim ou les Banû Tamîm —, il n'est plus obligatoire de l'étendre à tout le monde puisque cela est matériellement impossible. Il devient alors permis de restreindre l'attribution des bénéfices à certains d'entre eux seulement, et d'en privilégier certains par rapport à d'autres.</p>
<p>⁕ Le <em>Waqf</em> (la donation en bien de mainmorte) fait partie des contrats contraignants par la simple parole ; il n'est donc pas permis de l'annuler, en raison de la parole du Prophète (sur lui la prière et salut) :</p>
<p class="ar"><span dir="rtl">«لَا يُبَاعُ أَصْلُهَا وَلَا يُوهَبُ وَلَا يُورَثُ»</span></p>
<p>« <strong>Son bien d'origine ne peut être vendu, ni donné, ni reçu en héritage</strong> »<a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a>. Al-Tirmidhî a dit : « L'application de ce hadith est ce qui est en vigueur chez les gens de science ».</p>
<p>Il n'est donc pas permis de l'annuler car il est perpétuel. Il ne peut être ni vendu, ni transféré, à moins que son utilité ne devienne totalement caduque ; comme une demeure qui s'est effondrée et qu'il n'est pas possible de reconstruire à partir des revenus du <em>Waqf</em>, ou une terre agricole devenue dévastée et stérile, et qu'il est impossible de remettre en état de sorte que les revenus du <em>Waqf</em> ne suffisent pas à sa réhabilitation. Dans ce cas précis, le bien en <em>Waqf</em> est vendu, et son prix est employé dans un bien similaire, car cela est plus proche de l'intention du donateur (<em>al-wâqif</em>). Si un équivalent complet s'avère impossible à obtenir, il est alors employé dans un bien similaire en partie, et le substitut devient un <em>Waqf</em> par le simple fait de son achat.</p>
<p>⁕ Et si le <em>Waqf</em> est une mosquée qui se retrouve délaissée et dont on ne peut plus tirer profit à son emplacement d'origine – comme le fait que son quartier soit ruiné et déserté –, elle est alors vendue et son prix est employé pour une autre mosquée. De même, si un <em>Waqf</em> est attribué à une mosquée et que ses revenus dépassent ses besoins, il est permis de verser le surplus à une autre mosquée, car cela constitue une utilisation du bien dans la même catégorie de ce pour quoi il a été voué. Il est également permis de faire l'aumône aux pauvres avec le surplus des revenus du <em>Waqf</em> de la mosquée.</p>
<p>⁕ Si le <em>Waqf</em> (la fondation pieuse) est établi au profit d'un bénéficiaire désigné — comme s'il disait : « Ceci est un <em>Waqf</em> en faveur de Zeyd, auquel on versera cent [unités] chaque année » — et qu'il y a un excédent dans les revenus du <em>Waqf</em> par rapport à ce montant, il devient alors obligatoire de mettre ce surplus en réserve. Le Cheikh Taqî ad-Dîn (Ibn Taymiyyah), que Dieu lui fasse miséricorde, a dit : <em>« S'il est su que ses revenus seront constamment excédentaires, il est alors obligatoire de dépenser ce surplus, car le conserver ainsi mènerait à sa perte (ou sa détérioration) »</em>.</p>
<p>⁕ Et si le <em>Waqf</em> a été fait en faveur d'une mosquée, que celle-ci tombe en ruine et qu'il devient impossible de l'entretenir à partir de ce <em>Waqf</em>, [les revenus de] ce dernier doivent alors être dépensés pour une mosquée similaire.</p>
