<p>⁕ <strong>Le terme <em>Al-Mawât</em> (en prononçant le <em>Mîm</em> et le <em>Wâw</em> avec la voyelle <em>Fatha</em>) :</strong> Désigne à l'origine ce qui est dépourvu d'âme. Cependant, ce qui est visé ici, c'est la terre qui n'a pas de propriétaire.</p>
<p>⁕ <strong>Les juristes (qu'Allah leur fasse miséricorde) la définissent comme étant :</strong> La terre libre de tout droit d'usage exclusif (<em>Ikhtisâsât</em>) et de toute propriété appartenant à une personne protégée (<em>Ma'sûm</em> - c'est-à-dire un musulman ou un non-musulman vivant sous pacte de protection).</p>
<p>De cette définition, deux catégories de terres sont exclues :</p>
<ol type="1">
<li><blockquote>
<p><strong>La première :</strong> Ce qui est déjà sous la propriété exclusive d'une personne protégée (qu'elle soit musulmane ou non-musulmane), que ce soit par le biais d'un achat, d'un don ou autre.</p>
</blockquote></li>
<li><blockquote>
<p><strong>La seconde :</strong> Ce qui est lié à l'utilité d'une propriété appartenant à une personne protégée, comme les chemins d'accès, les cours extérieures et les voies d'écoulement des eaux. Sont également exclues les terres liées aux intérêts généraux des habitants d'une ville ou d'un village, telles que les cimetières pour enterrer les morts, les décharges publiques, les espaces réservés à la prière des deux fêtes (Eid), les zones de collecte de bois et les pâturages. Toutes ces catégories de terres ne peuvent pas être acquises par le biais de la revitalisation.</p>
</blockquote></li>
</ol>
<p>Par conséquent, si la terre est totalement libre de la propriété d'une personne protégée ainsi que de ses droits d'usage, et qu'un individu vient à la revitaliser, il en devient alors le propriétaire. Ceci est fondé sur le hadith de Jâbir (qu'Allah l'agrée), attribué de manière prophétique (<em>Marfû'</em>) :</p>
<p class="ar"><span dir="rtl">مَنْ أَحْيَا أَرْضاً مَيْتَةً؛ فَهِيَ لَهُ »</span></p>
<p><strong>« Quiconque revivifie une terre morte, elle lui appartient. »</strong> rapporté par Ahmad et At-Tirmidhî qui l'a authentifié. D'autres hadiths ont été rapportés dans le même sens, et certains figurent dans le <em>Sahîh al-Boukhârî</em> <a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a>.</p>
<p>⁕ <strong>La majorité des juristes des différentes contrées</strong> s'accordent à dire que la terre morte devient une propriété par le biais de sa revitalisation, même s'ils divergent quant aux conditions de celle-ci. Sont toutefois exclues les terres mortes du Sanctuaire (al-Haram de La Mecque) et de 'Arafât, qui ne peuvent être acquises par la revitalisation, car cela causerait une gêne dans l'accomplissement des rites [du Pèlerinage] et reviendrait à s'accaparer un lieu où tous les gens sont égaux en droits.</p>
<p><strong>La revitalisation d’une terre morte s'accomplit par plusieurs moyens :</strong></p>
<p><strong>Le premier :</strong> S'il entoure la terre d'un enclos (mur) protecteur selon ce qui est d'usage, il l'a alors revitalisée. Cela s'appuie sur la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">« مَنْ أَحَاطَ حَائِطاً عَلَى أَرْضٍ؛ فَهِيَ لَهُ »</span></p>
<p><strong>« Quiconque entoure une terre d'un enclos, elle lui appartient. »</strong> [Rapporté par Ahmad et Aboû Dâwoûd d'après Jâbir, et authentifié par Ibn al-Jâroûd, et un hadith similaire est rapporté d'après Samourah <a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a>].</p>
<p>Ce hadith prouve que le fait d'enclore une terre fait partie des actes qui confèrent sa propriété. La mesure prise en compte est ce qui est linguistiquement qualifié d'enclos (ou de mur). En revanche, s'il se contente de disposer autour de la terre morte des pierres, de la terre ou un muret bas qui n'empêche pas l'accès, ou s'il creuse un fossé tout autour, il n'en devient pas propriétaire pour autant. Cependant, il devient prioritaire sur quiconque pour sa revitalisation, et il ne lui est pas permis de la vendre tant qu'il ne l'a pas réellement revitalisée.</p>
<p><strong>Le deuxième :</strong> S'il creuse un puits dans la terre morte et qu'il atteint l'eau, il l'a alors revitalisée. S'il creuse le puits sans atteindre l'eau, il n'en devient pas propriétaire par cet acte, mais il est simplement plus en droit que quiconque de la revitaliser, car il a commencé les travaux de revitalisation.</p>
<p><strong>Le troisième :</strong> S'il achemine de l'eau vers la terre morte en la déviant depuis une source ou un fleuve, il l'a alors revitalisée par ce procédé, car l'apport d'eau est plus bénéfique pour la terre que l'érection d'un enclos.</p>
<p><strong>Le quatrième :</strong> S'il assèche la terre morte en barrant l'eau qui la submergeait (et qui la rendait impropre à l'agriculture) jusqu'à ce qu'elle devienne cultivable, il l'a alors revitalisée. En effet, l'utilité apportée à la terre par ce moyen est supérieure à celle de l'enclos, dont la preuve textuelle a pourtant établi qu'il conférait la propriété à celui qui l'érigeait.</p>
<p>Certains savants estiment que la revitalisation des terres mortes ne se limite pas aux cas précédemment cités, mais qu'il convient plutôt de se référer à la coutume (<em>Al-'Ourf</em>). Ainsi, tout ce que les gens considèrent [dans l'usage général] comme une revitalisation permet d'acquérir la propriété de la terre morte. C'est l'avis qu'a choisi un groupe parmi les imams hanbalites ainsi que d'autres juristes. En effet, la Législation islamique a lié l'obtention de la propriété à la revitalisation sans en définir précisément les modalités juridiques ; il est donc obligatoire de s'en remettre à ce qui est reconnu comme une revitalisation selon la coutume.</p>
<p>⁕ <strong>Le dirigeant des musulmans (l'Imam) a le droit d'octroyer des concessions</strong> (<em>Iqtâ'</em>) de terres mortes à ceux qui vont les revitaliser. En effet, le Prophète <span dir="rtl">ﷺ</span> a accordé une concession de la vallée d'Al-'Aqîq à Bilâl Ibn Al-Hârith, il a octroyé une terre à Hadramawt à Wâ'il Ibn Houjr, et 'Oumar, 'Outhmân ainsi qu'un grand nombre de compagnons ont également accordé de telles concessions. Cependant, le bénéficiaire n'en devient pas propriétaire par le simple fait de l'octroi de la concession tant qu'il ne l'a pas revitalisée ; il est seulement prioritaire sur quiconque. S'il la revitalise, il en acquiert la propriété, mais s'il s'avère incapable de la mettre en valeur, le dirigeant a le droit de la lui reprendre pour l'attribuer à quelqu'un d'autre capable de la revitaliser. C'est ainsi que 'Oumar Ibn Al-Khattâb (qu'Allah l'agrée) a repris des terres concédées à ceux qui s'étaient montrés incapables de les revitaliser.</p>
<p>⁕ <strong>Quiconque devance les autres vers un bien public autorisé</strong> (autre qu'une terre morte), tel que le gibier de chasse ou le bois à ramasser, est alors le plus en droit de le posséder <a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a>.</p>
<p>⁕ <strong>Lorsqu'une eau publique libre de droits</strong> (c'est-à-dire qui n'appartient à personne en propre), comme l'eau d'un fleuve ou d'une vallée, traverse les propriétés des gens : le propriétaire situé le plus en amont (le plus haut) a le droit d'irriguer sa terre en premier et de retenir l'eau jusqu'à hauteur de la cheville. Ensuite, il doit la laisser couler vers le propriétaire situé juste en aval (en dessous) de lui. Ce dernier procède de la même manière, puis libère l'eau pour le suivant... et ainsi de suite.</p>
<p>Ceci s'appuie sur la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">« اسْقِ يَا زُبَيْرُ! ثُمَّ احْبِسِ الْمَاءَ حَتَّى يَصِلَ إِلَى الْجَدْرِ »</span></p>
<p><strong>« Irrigue, ô Zoubayr ! Puis retiens l'eau jusqu'à ce qu'elle atteigne les murets (les pieds des arbres). »</strong> Rapporté par Al-Bukhâri et Muslim<a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a>.</p>
<p>'Abd ar-Razzâq a rapporté d'après Ma'mar, d'après Az-Zuhrî, qui a dit : <em>« Nous avons examiné la parole du Prophète <span dir="rtl">ﷺ</span> : "Puis retiens l'eau jusqu'à ce qu'elle atteigne les murets"</em> <a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a><em>, et cela correspondait à la hauteur des deux chevilles »</em>. C'est-à-dire qu'ils ont mesuré l'endroit exact où s'est déroulé cet événement et ont constaté que l'eau atteignait les chevilles. Ils ont donc établi cette mesure comme règle standard pour définir le droit de priorité de chacun, du plus en amont au plus en aval.</p>
<p>De plus, Aboû Dâwoûd et d'autres <a href="#fn6" class="footnote-ref" id="fnref6" role="doc-noteref"><sup>6</sup></a> ont rapporté d'après 'Amr Ibn Chou'ayb que le Prophète <span dir="rtl">ﷺ</span> a jugé concernant le cours d'eau de Mahzoûr (une vallée célèbre de Médine) :</p>
<p class="ar"><span dir="rtl">« أَنْ يُمْسَكَ الْأَعْلَى حَتَّى يَبْلُغَ السَّيْلُ الْكَعْبَيْنِ، ثُمَّ يُرْسِلُ الْأَعْلَى عَلَى الْأَسْفَلِ »</span></p>
<p><strong>« Que le plus en amont retienne l'eau jusqu'à ce que le flot atteigne les chevilles, puis que le plus haut la laisse couler vers le plus bas. »</strong></p>
<p>⁕ <strong>Quant au cas où l'eau fait l'objet d'une propriété privée :</strong> elle est alors partagée entre les propriétaires au prorata de leurs parts de propriété respectives, et chacun d'eux dispose de sa quote-part comme il l'entend.</p>
<p>⁕ <strong>Le dirigeant des musulmans (l'Imam) a le droit de réserver un pâturage gardé</strong> (<em>Himâ</em>) pour le bétail relevant du Trésor public des musulmans (<em>Bayt mâl al-mouslimîn</em>) — comme les chevaux destinés au Jihad ou les chameaux prélevés au titre de la Zakat (<em>Ibil as-Sadaqah</em>) — tant que cela ne porte pas préjudice aux musulmans en restreignant indûment leur espace.</p>
<p>Ceci s'appuie sur ce qu'a rapporté Ibn 'Oumar (qu'Allah l'agrée, lui et son père) : <strong>« Le Prophète <span dir="rtl">ﷺ</span> a réservé l'accès d'An-Naqî' (une plaine près de Médine) pour les chevaux des musulmans. »</strong><a href="#fn7" class="footnote-ref" id="fnref7" role="doc-noteref"><sup>7</sup></a></p>
<p>Il est donc permis au dirigeant de réserver l'usage de l'herbe d'une terre morte pour les chameaux de l'aumône obligatoire, les chevaux des combattants, le bétail collecté au titre de la <em>Jizyah</em>, ainsi que pour les bêtes égarées (<em>Al-Dawâl</em>), si le besoin s'en fait sentir et à condition de ne pas causer de gêne aux musulmans.</p>
