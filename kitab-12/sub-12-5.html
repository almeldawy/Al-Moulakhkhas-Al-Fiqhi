<p>⁕ Les règles de l'enfant trouvé (<em>Al-Laqît</em>) ont un lien étroit avec les règles des objets trouvés (<em>Al-Luqatah</em>). En effet, l'objet trouvé concerne les biens perdus, tandis que l'enfant trouvé désigne l'être humain égaré (ou abandonné). C'est à travers cela qu'apparaît l'exhaustivité des lois de l'Islam pour toutes les nécessités de la vie, ainsi que son avant-gardisme dans tout domaine utile et bénéfique. Cela dépasse ce que le monde d'aujourd'hui a mis en place à travers la création de crèches et de refuges pour préserver les orphelins, ainsi que les enfants et les personnes vulnérables qui n'ont personne pour subvenir à leurs besoins. Parmi cela figure l'attention que l'Islam porte au cas de l'enfant trouvé (<em>Al-Laqît</em>), qui est l'enfant que l'on trouve abandonné ou qui s'est égaré loin de sa famille, et dont la filiation n'est pas connue dans les deux cas.</p>
<p>Il incombe donc à quiconque le trouve dans une telle situation de le recueillir. Il s'agit d'une obligation communautaire (<em>Wâjib Kifâ’î</em>) : si un nombre suffisant de personnes s'en charge, le péché est levé pour le reste de la communauté. Mais si tout le monde le délaisse alors qu'il était possible de le recueillir, ils pèchent tous. Cela repose sur la parole de Allah Le Très Haut :</p>
<p class="ar"><span dir="rtl">﴿وَتَعَاوَنُوا عَلَى الْبِرِّ وَالتَّقْوَىٰ﴾ [المائدة: ٢]</span></p>
<p><strong>« Et entraidez-vous au bon comportement et à la piété »</strong> [Sourate Al-Mâ'idah : 2]. La portée générale de ce verset prouve l'obligation de recueillir l'enfant trouvé, car cela fait partie de l'entraide dans le bien et la piété, et parce que le fait de le recueillir revient à lui sauver la vie. C'est donc une obligation, au même titre que de le nourrir en cas de nécessité absolue ou de le sauver de la noyade.</p>
<p>⁕ L'enfant trouvé est considéré comme un homme libre concernant l'ensemble des règles juridiques. En effet, la liberté est le statut d'origine (<em>Al-Asl</em>), tandis que l'esclavage est un statut accidentel. Ainsi, tant que ce dernier n'est pas avéré, la règle de base est son inexistence.</p>
<p>⁕ Tout bien qui est trouvé sur lui (l'enfant) ou trouvé à sa proximité lui appartient, en application des apparences et du fait qu'il en a la possession matérielle. Celui qui l'a recueilli (<em>Al-Multaqit</em>) dépense alors pour lui à partir de ce bien de manière convenable, en raison de l'autorité légale qu'il exerce sur lui. Si aucun bien n'est trouvé avec lui, sa dépense est alors prise en charge par le Trésor public (<em>Bayt al-Mâl</em>), conformément à la parole de 'Umar – que Allah l'agrée – adressée à celui qui avait recueilli l'enfant trouvé lorsqu'il l'eut découvert : <strong>« Va, il est libre, tu as son alliance (<em>Walâ’</em>) et sa dépense nous incombe »</strong>. Le sens de « son alliance (<em>Walâ’</em>) » ici désigne son autorité/tutelle (<em>Wilâyah</em>), et sa parole « sa dépense nous incombe » signifie : à la charge du Trésor public des musulmans.</p>
<p>Dans une autre version, 'Umar – que Allah l'agrée – a dit : <strong>« Et son allaitement nous incombe »</strong>, c'est-à-dire : à la charge du Trésor public. Il n'est donc pas obligatoire pour celui qui l'a recueilli de subvenir à ses besoins ni de payer son allaitement, cela incombe plutôt au Trésor public. Si cela s'avère impossible (par absence de Trésor public ou manque de fonds), sa prise en charge financière devient alors obligatoire pour tout musulman qui a connaissance de sa situation, conformément à la parole de Allah Le Très Haut: <strong>« Et entraidez-vous au bon comportement et à la piété »</strong> [Sourate Al-Mâ'idah : 2], et parce que le délaissement de sa prise en charge conduirait à sa perte. De plus, dépenser pour lui relève de la solidarité et du secours mutuel, au même titre que l'hospitalité due à l'invité (<em>Qirâ ad-Dayf</em>).</p>
<p>⁕ Son statut du point de vue de la religion : s'il est trouvé en terre d'Islam (<em>Dâr al-Islâm</em>) ou dans un pays de mécréants où les musulmans sont nombreux, il est alors considéré comme musulman. Cela repose sur la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«كُلُّ مَوْلُودٍ يُولَدُ عَلَى الفِطْرَةِ»</span></p>
<p><strong>« Tout nouveau-né naît selon la saine nature (Al-Fitrah) »</strong> <a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a>. En revanche, s'il est trouvé dans un pays purement mécréant, ou un pays où le nombre de musulmans est infime, il est alors considéré comme mécréant, par ralliement au statut de la terre (<em>Taban li-d-Dâr</em>). Quant à sa garde (<em>Hadânah</em>), elle revient à celui qui l'a trouvé si ce dernier est digne de confiance. En effet, 'Umar – que Allah l'agrée – a laissé l'enfant trouvé entre les mains d'Abû Jamîlah lorsqu'il sut qu'il était un homme pieux, et il lui dit : <strong>« Tu as son alliance (Walâ’) »</strong>, c'est-à-dire sa tutelle. De plus, comme il a été le premier à lui porter secours, il est le plus en droit de le garder.</p>
<p>⁕ Celui qui l'a trouvé dépense pour lui à partir de l'argent (liquide) ou de tout autre bien trouvé en sa possession, car il est son tuteur légal, et il doit dépenser pour lui de manière convenable.</p>
<p>⁕ Si celui qui l'a trouvé n'est pas apte à assurer sa garde — du fait qu'il soit un pervers (Fâsiq) ou un mécréant alors que l'enfant trouvé est musulman —, l'enfant ne sera pas laissé entre ses mains. Cela s'explique par la négation de toute tutelle du pervers, ainsi que de la tutelle du mécréant sur le musulman, car il risquerait de le détourner de sa religion (Yaftinahu 'an dînih).</p>
<p>De même, sa garde ne sera pas maintenue entre les mains de celui qui l'a trouvé si ce dernier est un bédouin nomade se déplaçant d'un endroit à un autre. En effet, cela causerait de la pénibilité à l'enfant. On lui retirera donc l'enfant pour le confier à une personne sédentaire établie en ville (ou au village). Le séjour de l'enfant en milieu urbain/sédentaire est bien plus profitable pour lui, tant pour sa religion que pour sa vie d'ici-bas, et cela est plus propice à retrouver sa famille et à identifier sa filiation.</p>
<p>⁕ L'héritage de l'enfant trouvé s'il meurt, ainsi que le prix du sang (<em>Al-Diyah</em>) s'il subit une agression physique impliquant le versement de ce prix, reviennent tous deux au Trésor public (<em>Bayt al-Mâl</em>) s'il n'a pas de descendance. S'il a une épouse, celle-ci a droit au quart (de l'héritage). Son tuteur légal, en cas d'homicide volontaire, est le gouverneur (l'Imam), car ce sont les musulmans qui héritent de lui et l'Imam agit en leur nom. Il a alors le choix entre réclamer la loi du talion (<em>Al-Qisâs</em>) ou accepter le prix du sang (<em>Al-Diyah</em>) au profit du Trésor public, puisqu'il est le tuteur de quiconque n'a pas de tuteur.</p>
<p>Si l'agression volontaire qu'il subit est corporelle mais n'entraîne pas la mort (blessure, mutilation), on attend sa majorité et sa maturité pour qu'il puisse, à ce moment-là, exercer son droit au talion ou pardonner.</p>
<p>⁕ Si un homme ou une femme déclare sous serment (reconnaît) que l'enfant trouvé est son fils (ou sa fille), la filiation lui est alors officiellement attribuée. En effet, cela comporte un intérêt majeur pour l'enfant par l'établissement de sa lignée, sans causer de préjudice à autrui. Cela est toutefois conditionné par le fait qu'il (ou elle) soit seul(e) à revendiquer cette filiation, et qu'il soit biologiquement et temporellement possible que l'enfant soit le sien. Si un groupe de personnes le revendique en même temps, la priorité est accordée à celui qui apporte une preuve irréfutable (<em>Al-Bayyinah</em>). Si aucun d'eux n'a de preuve, ou s'ils présentent des preuves contradictoires, l'enfant est alors présenté avec eux aux experts en reconnaissance des traits de ressemblance (<em>Al-Qâfah</em>). Ainsi, celui à qui les experts attribuent l'enfant en aura la filiation, conformément au jugement rendu par 'Umar — que Allah l'agrée — à ce sujet, en présence des Compagnons — que Allah les agrée —.</p>
<p>Les experts physiognomonistes (<em>Al-Qâfah</em>) sont des gens qui savent identifier les généalogies et les liens de parenté par l'analyse des ressemblances physiques. Le recours à un seul expert (<em>Qâ'if</em>) suffit, et il est exigé qu'il soit un homme, intègre (<em>'Adl</em>) et dont l'exactitude des diagnostics a été éprouvée par l'expérience.</p>
