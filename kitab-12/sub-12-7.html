<p>⁕ <strong>La donation (Al-Hiba) :</strong> C’est le fait, pour une personne ayant la pleine capacité de disposer de ses biens, de faire un don de son vivant à autrui, portant sur un bien connu, sans contrepartie.</p>
<p>⁕ Le Prophète <span dir="rtl">ﷺ</span> offrait des cadeaux et on lui en offrait, il donnait et on lui donnait. La donation et le cadeau font ainsi partie de la Sounnah recommandée, en raison des bienfaits qui en découlent. Le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="rtl">«تَهَادَوْا تَحَابُّوا»</span></p>
<p><strong>« Offrez-vous des cadeaux, vous vous aimerez les uns les autres »</strong> <a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a>.</p>
<p>Et d'après 'Âishah (qu'Allah l'agrée), elle a dit : <strong>« Le Messager d'Allah <span dir="rtl">ﷺ</span> acceptait les cadeaux et récompensait (celui qui l'offrait) en retour »</strong> <a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a>.</p>
<p>Le Prophète <span dir="rtl">ﷺ</span> a également dit :</p>
<p class="ar"><span dir="rtl">«تَهَادَوْا؛ فَإِنَّ الْهَدِيَّةَ تَسُلُّ السَّخِيمَةَ».</span></p>
<p><strong>« Offrez-vous des cadeaux, car le cadeau extirpe la rancœur (du cœur) »</strong> <a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a>.</p>
<p>⁕ <strong>La donation devient irrévocable (obligatoire) dès lors que le bénéficiaire en prend possession</strong> avec l'autorisation du donateur. Dès cet instant, ce dernier ne peut plus revenir sur son don. En revanche, avant la prise de possession (Al-Qabd), il lui est permis de se rétracter. La preuve en est le hadith de 'Âishah (qu'Allah l'agrée) : <strong>« Abou Bakr lui avait donné une récolte de vingt Wasqs de ses biens situés à Al-Ghâbah. Lorsqu'il tomba malade, il lui dit : "Ô ma petite fille ! Je t'avais fait don d'une récolte de vingt Wasqs. Si tu l'avais récoltée et prise en ta possession, elle t'aurait appartenu. Mais aujourd'hui, ce bien fait partie des biens de l'héritage (qui reviendront à tous les héritiers). Partagez-le donc selon le Livre d'Allah le Très-Haut" »</strong> <a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a>.</p>
<p>⁕ Si le bien donné se trouve déjà entre les mains du bénéficiaire à titre de dépôt (Wadî'ah) ou de prêt ('Âriyyah), et que le propriétaire le lui offre en don, <strong>le simple fait qu'il maintienne sa possession sur ce bien suffit</strong> et remplace une nouvelle prise de possession.</p>
<p>⁕ <strong>Le don d'une dette à celui qui la doit est valide</strong>, et cela est considéré comme une remise de dette (une décharge). De manière générale, il est permis de faire don de tout ce qu'il est permis de vendre.</p>
<p>⁕ <strong>La donation suspendue à une condition future n'est pas valide.</strong> C'est le fait de dire, par exemple : <em>« S'il arrive telle chose, alors je te donne ceci »</em>.</p>
<p>⁕ <strong>La donation temporaire n'est pas valide non plus.</strong> C'est le fait de dire, par exemple : <em>« Je te donne ceci pour un mois ou pour un an »</em>. En effet, la donation est un transfert définitif de la propriété du bien en soi, elle n'accepte donc pas la limitation dans le temps, tout comme la vente. Cependant, il existe une exception à la suspension : <strong>la donation suspendue à la mort</strong>. C'est le fait de dire : <em>« Si je meurs, je te donne ceci et cela »</em>. Dans ce cas précis, elle est considérée comme un testament (Wasiyyah) et se voit appliquer les règles juridiques propres au testament.</p>
<p>⁕ <strong>Il n'est pas permis à une personne de faire un don à certains de ses enfants en en privant d'autres</strong>, ou de privilégier certains par rapport à d'autres dans la donation. Au contraire, <strong>il lui est obligatoire de faire preuve d'équité entre eux</strong> en les traitant sur un pied d'égalité. La preuve en est le hadith d'An-Nou'mân ibn Bachîr, dont le père l'avait emmené auprès du Prophète <span dir="rtl">ﷺ</span> pour le faire témoigner d'un don qu'il lui avait accordé. Le Prophète <span dir="rtl">ﷺ</span> lui demanda alors : <strong>« As-tu fait un don semblable à chacun de tes enfants ? »</strong> Il répondit : <em>« Non »</em>. Le Prophète <span dir="rtl">ﷺ</span> dit : <strong>« Reprends-le alors »</strong>. Puis il ajouta : <strong>« Craignez Allah et soyez équitables envers vos enfants »</strong> <a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a>. Ce hadith prouve l'obligation d'équité entre les enfants en matière de cadeaux. Il démontre également qu'il est interdit de servir de témoin (que ce soit pour enregistrer l'acte ou pour en témoigner plus tard) pour un don qui privilégie ou favorise certains enfants au détriment d'autres, si l'on est conscient de cette injustice.</p>
<p>⁕ <strong>Dès lors qu'une personne fait un don et que le bénéficiaire en prend possession, il lui est strictement interdit de se rétracter et de le lui reprendre.</strong> Cela s'appuie sur le hadith de Ibn 'Abbâs, rapporté textuellement du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«الْعَائِدُ فِي هِبَتِهِ كَالْكَلْبِ يَقِيءُ ثُمَّ يَعُودُ فِي قَيْئِهِ»</span></p>
<p><strong>« Celui qui reprend sa donation est semblable au chien qui vomit puis mange son propre vomi »</strong> <a href="#fn6" class="footnote-ref" id="fnref6" role="doc-noteref"><sup>6</sup></a>. Ce texte prouve l'interdiction de revenir sur un don, à l'exception de ce que le Législateur (Allah et Son Messager) a exclu : <strong>le père</strong>. En effet, le père a le droit de reprendre ce qu'il a donné à son enfant, conformément à la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«لَا يَحِلُّ لِلرَّجُلِ أَنْ يُعْطِيَ الْعَطِيَّةَ فَيَرْجِعَ فِيهَا؛ إِلَّا الْوَالِدَ فِيمَا يُعْطِي وَلَدَهُ»</span></p>
<p><strong>« Il n'est pas permis à un homme de faire un cadeau puis de revenir dessus, sauf s'il s'agit d'un père concernant ce qu'il donne à son enfant »</strong> Rapporté par les cinqs et authentifié par At-Tirmidhî <a href="#fn7" class="footnote-ref" id="fnref7" role="doc-noteref"><sup>7</sup></a>.</p>
<p>⁕ <strong>De même, le parent a le droit de prendre et de s'approprier une partie des biens de son enfant</strong>, à condition que cela ne nuise pas à l'enfant et qu'il n'en ait pas un besoin impérieux. Cela se base sur le hadith de 'Âishah (qu'Allah l'agrée) :</p>
<p class="ar"><span dir="rtl">«إِنَّ أَطْيَبَ مَا أَكَلْتُمْ مِنْ كَسْبِكُمْ، وَإِنَّ أَوْلَادَكُمْ مِنْ كَسْبِكُمْ»</span></p>
<p><strong>« Certes, ce que vous consommez de meilleur provient de votre propre labeur, et vos enfants font partie de votre labeur (de ce que vous avez acquis) »</strong> <a href="#fn8" class="footnote-ref" id="fnref8" role="doc-noteref"><sup>8</sup></a>. Ce hadith est rapporté par Al-Tirmidhî qui l'a jugé bon (Hasan), et d'autres l'ont également rapporté. Il possède plusieurs versions complémentaires qui prouvent, par leur ensemble, que le parent peut prendre et s'approprier le bien de son enfant tant que cela ne porte pas préjudice à ce dernier et ne touche pas à ce dont il a un besoin direct. De plus, la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«أَنْتَ وَمَالُكَ لِأَبِيكَ»</span></p>
<p><strong>« Toi et tes biens appartenez à ton père »</strong> <a href="#fn9" class="footnote-ref" id="fnref9" role="doc-noteref"><sup>9</sup></a> implique que la personne même de l'enfant est mise à la disposition de son père, au même titre que ses biens. Il est donc obligatoire pour l'enfant de servir son père de sa propre personne et de subvenir à ses besoins.</p>
<p>Cependant, <strong>il n'est pas permis au parent de s'approprier un bien de l'enfant si cela lui nuit</strong> ou s'il s'agit d'un bien dont l'enfant a absolument besoin, conformément à la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«لَا ضَرَرَ وَلَا ضِرَارَ»</span></p>
<p><strong>« Il ne doit y avoir ni préjudice subi, ni préjudice infligé »</strong> <a href="#fn10" class="footnote-ref" id="fnref10" role="doc-noteref"><sup>10</sup></a>.</p>
<p><strong>Il n'est pas permis à l'enfant de réclamer en justice le remboursement d'une dette (ou autre) à son père.</strong> En effet, un homme est venu trouver le Prophète <span dir="rtl">ﷺ</span> accompagné de son père pour lui réclamer une dette que ce dernier lui devait, et le Prophète <span dir="rtl">ﷺ</span> lui a dit :</p>
<p class="ar"><span dir="rtl">«أَنْتَ وَمَالُكَ لِأَبِيكَ»</span></p>
<p><strong>« Toi et tes biens appartenez à ton père »</strong> <a href="#fn11" class="footnote-ref" id="fnref11" role="doc-noteref"><sup>11</sup></a>. Cela prouve que l'enfant n'a pas le droit de poursuivre son parent pour une dette.</p>
<p>De plus, Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿وَبِالْوَالِدَيْنِ إِحْسَاناً﴾ [البقرة: ٨٣]</span></p>
<p><strong>« Et agissez avec bonté envers vos parents »</strong> [Al-Baqarah : 83]. Le Glorieux a ainsi ordonné de bien se comporter envers ses parents, et fait partie de cette bienfaisance le fait de ne pas exiger d'eux l'acquittement d'un droit financier qu'ils doivent à leur enfant.</p>
<p><strong>La seule exception est la pension alimentaire (An-Nafaqah) obligatoire qui incombe au père.</strong> Dans ce cas, l'enfant a le droit de la lui réclamer en raison de la nécessité absolue de préserver sa vie, si l'enfant est incapable de subvenir lui-même à ses besoins par le travail. Cela s'appuie également sur la parole du Prophète <span dir="rtl">ﷺ</span> à Hind :</p>
<p class="ar"><span dir="rtl">«خُذِي مَا يَكْفِيكِ وَوَلَدَكِ بِالْمَعْرُوفِ»</span></p>
<p><strong>« Prends (des biens de ton mari) ce qui te suffit à toi et à ton enfant, de manière convenable »</strong> <a href="#fn12" class="footnote-ref" id="fnref12" role="doc-noteref"><sup>12</sup></a>.</p>
<p>⁕ <strong>Le cadeau dissipe la rancune et engendre l'amour</strong>, conformément à la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«تَهَادَوْا؛ فَإِنَّ الْهَدَايَا تُذْهِبُ وَحَرَ الصُّدُورِ»</span></p>
<p><strong>« Offrez-vous des cadeaux, car les cadeaux extirpent la rancœur des poitrines »</strong> <a href="#fn13" class="footnote-ref" id="fnref13" role="doc-noteref"><sup>13</sup></a> <a href="#fn14" class="footnote-ref" id="fnref14" role="doc-noteref"><sup>14</sup></a><strong>.</strong></p>
<p><strong>⁕</strong> Il ne convient pas de refuser un cadeau, aussi minime soit-il. De plus, il est recommandé (Sounnah) de donner une contrepartie ou de récompenser la personne en retour <a href="#fn15" class="footnote-ref" id="fnref15" role="doc-noteref"><sup>15</sup></a>. Cela fait assurément partie des beautés de la religion et des nobles traits de caractère.</p>
