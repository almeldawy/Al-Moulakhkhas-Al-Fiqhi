<p>⁕ Elle est également appelée al-Ju'l, al-Ji'âl et al-Ja'îlah. Il s'agit de ce qui est donné à l'être humain en contrepartie d'une tâche qu'il accomplit. C’est comme le fait de dire : <em>« Quiconque fait ceci, aura telle somme d'argent »</em> ; en fixant une quantité déterminée d'argent pour celui qui accomplit pour lui un travail déterminé, comme la construction d'un mur.</p>
<p>⁕ Et la preuve de la permission de cela réside dans la parole d'Allah (Le Très-Haut) :</p>
<p class="ar"><span dir="rtl">﴿وَلِمَن جَاءَ بِهِ حِمْلُ بَعِيرٍ وَأَنَا بِهِ زَعِيمٌ﴾ [يوسف: ٧٢]</span></p>
<p><strong>« Et pour celui qui l'apportera, il y aura la charge d'un chameau ; et j'en suis le garant. »</strong> [Yûsuf : 72]. C’est-à-dire : pour quiconque indique [l'identité de] celui qui a volé la coupe du roi, il y aura la charge d'un chameau. Et ceci constitue une récompense (<em>Ju'l</em>). Ainsi, ce verset prouve la légitimité du contrat de récompense (<em>Al-Ji'âlah</em>).</p>
<p>Et sa preuve dans la Sounnah est le hadith de l’homme piqué [par un scorpion], qui est rapporté dans les deux recueils authentiques (<em>Al-Boukhârî et Mouslim</em>) ainsi que dans d'autres, d'après le hadith d'Aboû Sa'îd [Al-Khoudrî] : Des compagnons firent halte auprès d'une tribu parmi les tribus arabes et leur demandèrent l'hospitalité, mais ces derniers refusèrent de la leur accorder. C'est alors que le chef de cette tribu fut piqué. Ils cherchèrent pour lui toutes sortes de remèdes [mais en vain]. Ils vinrent alors trouver [les compagnons] et dirent : « L'un d'entre vous posséderait-il quelque chose [pour le guérir] ? » L’un d'eux répondit : « Oui, par Allah, je pratique certes la Roquia. Cependant, par Allah, nous vous avons demandé l'hospitalité et vous avez refusé de nous l'accorder. Je ne pratiquerai donc pas de Roquia pour vous à moins que vous ne nous fixiez une contrepartie (<em>Ju'l</em>). » Ils se mirent d'accord avec eux sur un troupeau de moutons. Il se mit alors à postillonner [légèrement] sur lui tout en récitant : <strong>« Louange à Allah, Seigneur de l'univers »</strong> [Al-Fâtihah]. Le chef fut alors [instantanément] délivré de son mal, comme s'il avait été détaché d'une entrave. Ils leur remirent alors la récompense convenue. Lorsqu'ils revinrent auprès du Prophète <span dir="rtl">ﷺ</span>, ils lui mentionnèrent cela, et il dit :</p>
<p class="ar"><span dir="rtl">«[قَدْ] أَصَبْتُمْ، اقْسِمُوا وَاضْرِبُوا لِي مَعَكُمْ سَهْمًا»</span></p>
<p><strong>« [Certes], vous avez bien agi. Partagez[-les] et attribuez-moi une part avec vous. »</strong><a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a></p>
<p>⁕ Ainsi, quiconque accomplit le travail pour lequel une récompense (<em>Ji'âlah</em>) a été fixée, après en avoir eu connaissance, mérite [pleinement] cette récompense (<em>Al-Ju'l</em>). En effet, le contrat devient effectif et définitif par l'achèvement du travail. Et si un groupe de personnes accomplit [ensemble] ce travail, ils se partagent la récompense fixée à parts égales. Cela s'explique par le fait qu'ils ont participé ensemble au travail qui ouvre droit à la contrepartie ; ils partagent donc logiquement cette contrepartie.</p>
<p>Cependant, si une personne accomplit le travail avant d'avoir connaissance de la récompense qui y était rattachée, elle ne mérite rien. En effet, il s'agit d'un travail qui n'a pas fait l'objet d'une autorisation [contractuelle préalable], elle ne peut donc prétendre à aucune compensation pour celui-ci.</p>
<p>Enfin, si la personne prend connaissance de la récompense au cours de l'accomplissement du travail (au milieu de la tâche), elle ne perçoit de la récompense que la part proportionnelle au travail qu'elle a fourni après en avoir pris connaissance.</p>
<p>⁕ Et le contrat de récompense (<em>Al-Ju'âlah</em>) est un contrat non contraignant (<em>'Aqd Jâ'iz</em>), chacune des deux parties ayant le droit de l'annuler.</p>
<ul>
<li><blockquote>
<p><strong>Si l'annulation provient de l'exécutant (<em>Al-'Âmil</em>) :</strong> il ne mérite alors aucune part de la récompense (<em>Al-Ju'l</em>), car il a lui-même renoncé à son droit.</p>
</blockquote></li>
<li><blockquote>
<p><strong>Et si l'annulation provient du donateur (<em>Al-Jâ'il</em>) :</strong> [si elle intervient après le début du travail]<a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a> alors il incombe de donner à l'exécutant un salaire équivalent (<em>Ujratu Mithl</em>) au travail qu'il a accompli, car il a effectué ce travail en contrepartie d'une compensation qui ne lui a pas été remise.</p>
</blockquote></li>
</ul>
<p>⁕ <strong>Et la <em>Ju'âlah</em> (le contrat de récompense) diffère de l'<em>Ijârah</em> (le louage/salariat) sur plusieurs points :</strong></p>
<ul>
<li><blockquote>
<p><strong>Parmi ceux-ci :</strong> Pour la validité de la <em>Ju'âlah</em>, il n'est pas stipulé comme condition de connaître [précisément] la nature du travail pour lequel la récompense est promise. Contrairement à l'<em>Ijârah</em>, où il est obligatoirement conditionné que le travail pour lequel le salaire est versé soit connu.</p>
</blockquote></li>
<li><blockquote>
<p><strong>Parmi ceux-ci :</strong> Dans la <em>Ju'âlah</em>, il n'est pas stipulé comme condition de connaître la durée du travail. Contrairement à l'<em>Ijârah</em>, où il est obligatoirement conditionné que la durée du travail soit connue.</p>
</blockquote></li>
<li><blockquote>
<p><strong>Parmi ceux-ci :</strong> Dans la <em>Ju'âlah</em>, il est permis de combiner le travail et la durée. Comme le fait de dire : <em>« Quiconque coud ce vêtement en une journée aura telle somme »</em>. S'il le coud dans la journée, il mérite la récompense, sinon non. Cela diffère de l'<em>Ijârah</em>, où il n'est pas valable de combiner [à la fois] le travail précis et la durée.</p>
</blockquote></li>
<li><blockquote>
<p><strong>Parmi ceux-ci :</strong> Dans la <em>Ju'âlah</em>, l'exécutant (<em>Al-'Âmil</em>) ne s'engage pas formellement à accomplir le travail [il est libre de ne pas commencer ou d'arrêter]. Contrairement à l'<em>Ijârah</em>, où l'employé s'est fermement engagé à accomplir le travail.</p>
</blockquote></li>
<li><blockquote>
<p><strong>Parmi ceux-ci :</strong> Dans la <em>Ju'âlah</em>, il n'est pas stipulé comme condition de désigner explicitement l'exécutant [l'offre peut être publique]. Contrairement à l'<em>Ijârah</em>, où cela est exigé.</p>
</blockquote></li>
<li><blockquote>
<p><strong>Parmi ceux-ci :</strong> La <em>Ju'âlah</em> est un contrat non contraignant (<em>'Aqd Jâ'iz</em>), chacune des deux parties peut l'annuler sans la permission de l'autre. Contrairement à l'<em>Ijârah</em>, qui est un contrat contraignant (<em>'Aqd Lâzim</em>), qu'aucune des deux parties n'a le droit d'annuler sans le consentement de l'autre.</p>
</blockquote></li>
</ul>
<p>⁕ Et les juristes (<em>Al-Fuqahâ</em>), qu'Allah leur fasse miséricorde, ont mentionné que quiconque accomplit un travail pour autrui sans qu'il n'y ait de récompense fixée ni de permission de la part du propriétaire du travail, ne mérite rien. En effet, il a fait don d'une utilité sans [demander de] contrepartie, il n'y a donc pas droit ; et parce qu'on ne peut imposer à un être humain une obligation qu'il n'a pas contractée. Cependant, deux cas font exception à cela :</p>
<p><strong>Le premier :</strong> Lorsque l'exécutant est une personne qui propose habituellement ses services contre rémunération, comme le courtier (<em>Al-Dallâl</em>), le porteur (<em>Al-Hammâl</em>) ou leurs semblables. S'il travaille avec la permission [du client], il mérite un salaire, car la coutume (<em>Al-'Urf</em>) atteste de cela. En revanche, celui qui ne propose pas habituellement ses services [à titre payant] ne mérite rien, même si la permission lui a été donnée, à moins qu'une condition [de rémunération] n'ait été stipulée.</p>
<p><strong>Le second :</strong> Quiconque entreprend de sauver les biens d'autrui d'une perte certaine — comme le fait de les retirer de la mer ou d'un incendie, ou de les trouver dans un lieu désertique où ils auraient disparu s'il les avait laissés —, a droit à un salaire équivalent (<em>Ujratu al-Mithl</em>), même si leur propriétaire ne lui en a pas donné la permission. Cela s'explique par la crainte de voir le bien périr et être perdu pour son propriétaire, et parce que le versement d'un salaire encourage ce genre d'action, à savoir le sauvetage des biens de la destruction.</p>
<p>Cheikh al-Islâm Ibn Taymiyyah, qu'Allah lui fasse miséricorde, a dit <a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a>: <em>« Quiconque sauve les biens d'autrui de la destruction et les restitue, mérite un salaire équivalent, même sans condition préalable, selon le plus correct des deux avis, et c'est ce qui est textuellement rapporté d'Ahmad et d'autres. »</em></p>
<p>Et l'érudit Ibn al-Qayyim, qu'Allah lui fasse miséricorde, a dit <a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a> : <em>« Ainsi, quiconque accomplit un travail sur les biens d'autrui sans sa permission, afin de parvenir par ce travail à un autre objectif, ou s'il l'a fait pour préserver les biens du propriétaire et les protéger de la perte : l'avis correct est qu'il se retourne contre lui pour réclamer le salaire de son travail, et Ahmad l'a explicitement stipulé dans plusieurs passages. »</em> Fin de citation.</p>
