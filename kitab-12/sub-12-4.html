<p>⁕ <em>Al-Luqatah</em> — avec une <em>Dammah</em> sur la lettre <em>Lâm</em> et une <em>Fathah</em> sur la lettre <em>Qâf</em> — désigne un bien, autre qu'un animal, qui a été égaré par son propriétaire. Cette religion pure (l'Islam) est venue pour préserver les biens et en prendre soin, tout comme elle est venue pour imposer le respect des biens du musulman et leur sauvegarde ; et les règles de l'objet trouvé (<em>Al-Luqatah</em>) font partie de cela.</p>
<p>⁕ Lorsqu'un bien est égaré par son propriétaire, il se trouve nécessairement dans l'une de ces trois situations :</p>
<p><strong>Le premier cas :</strong> Que le bien soit d'une valeur si insignifiante qu'un homme de condition moyenne ne chercherait pas à le retrouver (ne s'y attacherait pas), comme un fouet, une miche de pain, un fruit ou un bâton. Celui qui ramasse ce type d'objet en devient propriétaire et peut en profiter directement, sans avoir besoin de faire d'annonce publique. Cela s'appuie sur ce qu'a rapporté Jâbir, qui a dit : <em><strong>« Le Messager d'Allah <span dir="rtl">ﷺ</span> nous a accordé une concession concernant le bâton, le fouet et la corde qu'un homme ramasse. »</strong></em> (Rapporté par Abou Dâwoud)<a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a>.</p>
<p><strong>Le deuxième cas :</strong> Que l'animal égaré soit capable de se défendre seul contre les petits prédateurs : soit en raison de sa grande taille comme les chameaux, les chevaux, les vaches et les mulets ; soit en raison de sa capacité à voler comme les oiseaux ; soit en raison de sa rapidité à la course comme les gazelles ; soit parce qu'il se défend par ses crocs comme les guépards.</p>
<p>Il est strictement interdit (<em>Harâm</em>) de ramasser cette catégorie de bêtes, sous toutes ses formes, et celui qui la prend ne peut pas en devenir propriétaire, même s'il en faisait l'annonce publique. Ceci s'appuie sur la parole du Prophète <span dir="rtl">ﷺ</span> lorsqu'il fut interrogé sur le chameau égaré :</p>
<p class="ar"><span dir="rtl">«مَا لَكَ وَلَهَا؟! مَعَهَا سِقَاؤُهَا وَحِذَاؤُهَا، تَرِدُ الْمَاءَ وَتَأْكُلُ الشَّجَرَ، حَتَّى يَجِدَهَا رَبُّهَا»</span></p>
<p><em><strong>« Qu'as-tu à faire d'elle ?! Elle a avec elle sa réserve d'eau (son estomac) et ses sabots. Elle se rend aux points d'eau et mange les feuilles des arbres jusqu'à ce que son maître la retrouve. »</strong></em> (Rapporté par Al-Boukhârî et Muslim)<a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a>.</p>
<p>Et 'Omar (Ibn Al-Khattâb) a dit : <em><strong>« Quiconque prend un animal égaré (de cette catégorie) est lui-même égaré »</strong></em>, c'est-à-dire qu'il commet une erreur. Le Prophète <span dir="rtl">ﷺ</span> a statué dans ce hadith qu'ils ne doivent pas être ramassés, mais qu'on doit plutôt les laisser s'abreuver aux points d'eau et manger des arbres jusqu'à ce que leur propriétaire les retrouve.</p>
<p>Sont assimilés à cela (aux animaux de grande taille) les grands objets, tels que les marmites géantes, les pièces de bois, le fer, et tout ce qui se préserve par soi-même, ne risque guère de se perdre et ne se déplace pas de son endroit. Il est donc interdit (<em>Harâm</em>) de les ramasser, au même titre que les animaux égarés (capables de se défendre), et cette interdiction s'applique ici à plus forte raison.</p>
<p><strong>Le troisième cas :</strong> Que le bien égaré fasse partie du reste des biens, comme l'argent, les bagages (ou marchandises), ou les animaux qui ne peuvent pas se défendre contre les petits prédateurs, à l'instar des moutons, des jeunes chameaux (sevrés) et des veaux. Concernant cette catégorie, s'il s'agit d'une personne de confiance qui est sûre d'elle-même (quant au respect des dépôts), il lui est permis de la ramasser. Elle se divise en trois types :</p>
<p><strong>Le premier type :</strong> Un animal comestible, comme un jeune chameau, une brebis, une poule... Celui qui le trouve et le ramasse doit obligatoirement choisir, parmi trois options, celle qui s'avère la plus avantageuse pour le propriétaire :</p>
<p><strong>Premièrement :</strong> Le consommer, et il est redevable de sa valeur financière immédiate.</p>
<p><strong>Deuxièmement :</strong> Le vendre et conserver son prix pour son propriétaire, après avoir minutieusement consigné ses caractéristiques.</p>
<p><strong>Troisièmement :</strong> Le garder et le nourrir à ses propres frais sans en devenir propriétaire, puis réclamer le remboursement des dépenses au propriétaire lorsque celui-ci vient le récupérer. En effet, lorsque le Prophète <span dir="rtl">ﷺ</span> a été interrogé au sujet de la brebis égarée, il a dit :</p>
<p class="ar"><span dir="rtl">«خُذْهَا؛ فَإِنَّمَا هِيَ لَكَ أَوْ لِأَخِيكَ أَوْ لِلذِّئْبِ»</span></p>
<p><em><strong>« Prends-la, car elle est soit pour toi, soit pour ton frère, soit pour le loup. »</strong></em> (Rapporté par Al-Boukhârî et Muslim)<a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a>.</p>
<p>Le sens de ce hadith est que la brebis est faible, exposée à la perte, et que son sort balance entre le fait que tu la prennes, que quelqu'un d'autre la prenne, ou que le loup la dévore.</p>
<p>Ibn Al-Qayyim <a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a> a dit en commentant ce noble hadith : <em>« Ce hadith prouve la permission de ramasser les ovins égarés, et démontre que si le propriétaire de la brebis ne se manifeste pas, elle devient la propriété de celui qui l'a trouvée. Il a alors le choix entre la consommer immédiatement tout en étant redevable de sa valeur, la vendre en conservant son prix, ou la garder</em> <a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a> <em>en la nourrissant à ses frais. Et les savants ont unanimement accordé que si son propriétaire se présente avant que celui qui l'a trouvée ne la consomme, il a le droit absolu de la récupérer. »</em></p>
<p><strong>Le deuxième type :</strong> Ce dont on craint la corruption ou la détérioration rapide, comme une pastèque ou des fruits. Celui qui les trouve doit accomplir l'action la plus avantageuse pour le propriétaire : soit les consommer et en rembourser la valeur à son propriétaire, soit les vendre et en conserver le prix de vente jusqu'à ce que son propriétaire se manifeste.</p>
<p><strong>Le troisième type :</strong> Le reste des biens en dehors des deux catégories précédentes, à l'instar de l'argent et des récipients (ustensiles). Il est obligatoire pour celui qui les trouve de préserver l'ensemble de ces objets comme un dépôt de confiance (<em>Amânah</em>) entre ses mains, et d'en faire l'annonce publique dans les lieux de rassemblement des gens.</p>
<p>Il ne lui est pas permis de ramasser un objet trouvé, sous toutes ses formes, sauf s'il est sûr de sa propre probité à son sujet (qu'il ne va pas se l'approprier illégalement) et qu'il a la force d'assumer l'annonce publique de ce qui nécessite une annonce.</p>
<p>Cela s'appuie sur le hadith de Zayd ibn Khâlid al-Jouhanî (qu'Allah l'agrée) <a href="#fn6" class="footnote-ref" id="fnref6" role="doc-noteref"><sup>6</sup></a> qui a dit : Le Prophète <span dir="rtl">ﷺ</span> fut interrogé au sujet d'un objet trouvé en or ou en argent (<em>Al-Wariq</em>). Il répondit :</p>
<p class="ar"><span dir="rtl">«اعْرِفْ وِكَاءَهَا وَعِفَاصَهَا، ثُمَّ عَرِّفْهَا سَنَةً، فَإِنْ لَمْ تُعْرَفْ؛ فَاسْتَنْفِقْهَا، وَلْتَكُنْ وَدِيعَةً عِنْدَكَ، فَإِنْ جَاءَ طَالِبُهَا يَوْماً مِنَ الدَّهْرِ؛ فَادْفَعْهَا إِلَيْهِ»</span></p>
<p><em><strong>« Mémorise la description de son lien (la ficelle qui le ferme) et de son contenant (la bourse). Ensuite, fais-en l'annonce publique pendant un an. Si personne ne la réclame, alors dépense-la, et elle sera un dépôt auprès de toi ; si son propriétaire vient à la rechercher un jour de ta vie, remets-la lui. »</strong></em></p>
<p>Il l'interrogea ensuite au sujet de la brebis. Il répondit : <em><strong>« Elle est soit pour toi, soit pour ton frère, soit pour le loup. »</strong></em></p>
<p>Et il fut interrogé au sujet du chameau égaré. Il répondit :</p>
<p class="ar"><span dir="rtl">«مَا لَكَ وَلَهَا؟! مَعَهَا سِقَاؤُهَا وَحِذَاؤُهَا، تَرِدُ الْمَاءَ وَتَأْكُلُ الشَّجَرَ، حَتَّى يَجِدَهَا رَبُّهَا»</span></p>
<p><em><strong>« Qu'as-tu à faire d'elle ?! Elle a avec elle sa réserve d'eau et ses sabots. Elle se rend aux points d'eau et mange les feuilles des arbres jusqu'à ce que son maître la retrouve. »</strong></em> (Rapporté par Al-Boukhârî et Muslim) <a href="#fn7" class="footnote-ref" id="fnref7" role="doc-noteref"><sup>7</sup></a>.</p>
<p>Le sens de la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«اعْرِفْ وِكَاءَهَا وَعِفَاصَهَا»</span></p>
<p><em><strong>« Mémorise la description de son lien (Wikâ') et de son contenant ('Ifâs) »</strong></em> <a href="#fn8" class="footnote-ref" id="fnref8" role="doc-noteref"><sup>8</sup></a><em><strong>:</strong></em></p>
<ul>
<li><blockquote>
<p><em>Al-Wikâ'</em> désigne le lien (la corde ou la ficelle) avec lequel est attaché le récipient ou la bourse contenant l'argent.</p>
</blockquote></li>
<li><blockquote>
<p><em>Al-'Ifâs</em> désigne le contenant lui-même (l'enveloppe, la bourse ou le récipient) dans lequel se trouvent les biens ou l'argent.</p>
</blockquote></li>
</ul>
<p>Le sens de la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«ثُمَّ عَرِّفْهَا سَنَةً»</span></p>
<p><em><strong>« Ensuite, fais-en l'annonce publique pendant un an »</strong></em> <a href="#fn9" class="footnote-ref" id="fnref9" role="doc-noteref"><sup>9</sup></a> signifie : mentionne cet objet aux gens dans leurs lieux de rassemblement comme les marchés, aux portes des mosquées, les assemblées et les réunions. <em><strong>« Pendant un an »</strong></em> signifie : durant une année complète. Ainsi, lors de la première semaine suivant sa découverte, on doit faire l'annonce chaque jour, car la venue de son propriétaire durant cette période est plus probable. Puis, après la première semaine, l'annonce sera faite selon la coutume (<em>'Arf</em>) établie par les gens à ce sujet.</p>
<p>Le hadith démontre l'obligation de faire l'annonce publique de l'objet trouvé. De même, sa parole <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">« اعْرِفْ وِكَاءَهَا وَعِفَاصَهَا »</span></p>
<p><em><strong>« Mémorise la description de son lien et de son contenant »</strong></em> <a href="#fn10" class="footnote-ref" id="fnref10" role="doc-noteref"><sup>10</sup></a> est une preuve de l'obligation de connaître précisément ses caractéristiques. Ainsi, si son propriétaire se présente et la décrit d'une manière totalement conforme à ces caractéristiques, elle lui est remise. En revanche, si la description qu'il en donne diverge de la réalité, il n'est pas permis de la lui remettre.</p>
<p>Et dans sa parole <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="ltr">«</span> <span dir="rtl">فَإِنْ لَمْ تُعْرَفْ؛ فَاسْتَنْفِقْهَا »</span></p>
<p><em><strong>« Si personne ne la réclame, alors dépense-la »</strong></em> <a href="#fn11" class="footnote-ref" id="fnref11" role="doc-noteref"><sup>11</sup></a> : c'est une preuve que celui qui a trouvé l'objet en devient propriétaire après l'écoulement d'une année complète (<em>Al-Hawl</em>) et après en avoir fait l'annonce. Cependant, il ne doit pas en disposer (ou l'utiliser) avant d'avoir parfaitement cerné ses caractéristiques ; c'est-à-dire jusqu'à ce qu'il connaisse son contenant, son lien, sa quantité, sa nature (son genre) et sa catégorie. Si le propriétaire vient après l'année écoulée et la décrit d'une manière qui correspond parfaitement à ces attributs, il doit la lui restituer, conformément à la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="ltr">«</span> <span dir="rtl">فَإِنْ جَاءَ طَالِبُهَا يَوْماً مِنَ الدَّهْرِ؛ فَادْفَعْهَا إِلَيْهِ »</span></p>
<p><em><strong>« Si son propriétaire vient à la rechercher un jour de ta vie, remets-la lui. »</strong></em> <a href="#fn12" class="footnote-ref" id="fnref12" role="doc-noteref"><sup>12</sup></a>.</p>
<p>⁕ Il ressort clairement de ce qui a précédé que l'objet trouvé implique plusieurs obligations :</p>
<p><strong>Premièrement :</strong> Lorsqu'il la trouve, il ne doit entreprendre de la ramasser que s'il se sait probe et digne de confiance pour la préserver, et doté de la capacité de faire son annonce publique par proclamation jusqu'à ce qu'il retrouve son propriétaire. Quant à celui qui ne s'estime pas digne de confiance à son sujet, il ne lui est pas permis de la prendre. S'il la prend malgré tout, il est alors semblable à un usurpateur (<em>Ghâsib</em>), car il s'est approprié le bien d'autrui d'une manière qui lui est interdite, et parce qu'en la ramassant dans ces conditions, il cause la perte du bien d'autrui.</p>
<p><strong>Deuxièmement :</strong> Il lui est indispensable, avant de la ramasser, d'en consigner précisément les caractéristiques en identifiant son contenant, son lien, sa quantité, sa nature et sa catégorie. Par « contenant » (<em>Wi'â'</em>), on désigne l'enveloppe ou le récipient dans lequel elle se trouve, qu'il s'agisse d'un sac ou d'un morceau de tissu. Et par « lien » (<em>Wikâ'</em>), on désigne ce avec quoi elle est attachée. Cela s'explique par le fait que le Prophète <span dir="rtl">ﷺ</span> l'a ordonné, et l'ordre implique ici l'obligation jurisprudentielle (<em>Al-Woujoûb</em>).</p>
<p><strong>Troisièmement :</strong> Il est indispensable de proclamer sa découverte et de faire son annonce publique pendant une année complète : chaque jour durant la première semaine, puis ensuite selon ce que veut la coutume (<em>Al-'Âdah</em>). Celui qui fait l'annonce dit par exemple : « Qui a perdu quelque chose ? » ou une formule similaire. La proclamation doit avoir lieu dans les endroits de rassemblement des gens comme les marchés, ainsi qu'aux portes des mosquées aux moments des prières. Cependant, on ne doit pas faire cette proclamation à l'intérieur même des mosquées, car les mosquées n'ont pas été construites pour cela, conformément à la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«مَنْ سَمِعَ رَجُلًا يَنْشُدُ ضَالَّةً فِي الْمَسْجِدِ؛ فَلْيَقُلْ: لَا رَدَّهَا اللهُ عَلَيْكَ»</span></p>
<p><em><strong>« Quiconque entend un homme chercher un objet égaré (en faire l'annonce) dans la mosquée, qu'il dise alors : "Qu'Allah ne te le restitue pas !" »</strong></em> <a href="#fn13" class="footnote-ref" id="fnref13" role="doc-noteref"><sup>13</sup></a>.</p>
<p><strong>Quatrièmement :</strong> Si le demandeur se présente et la décrit d'une manière totalement conforme à ses caractéristiques, il devient alors obligatoire de la lui remettre sans exiger de preuve matérielle (<em>Bayyinah</em>) ni de serment (<em>Yamîn</em>). Cela s'explique par l'ordre du Prophète <span dir="rtl">ﷺ</span> à ce sujet, et parce que l'exactitude de la description remplace la preuve et le serment ; et il se peut même que sa description soit plus évidente et plus véridique qu'une preuve ou un serment. On doit également lui remettre l'objet accompagné de son gain (ou de son fruit), qu'il soit lié (ex: la prise de poids d'un animal) ou distinct (ex: le lait ou la laine produits). En revanche, s'il est incapable de la décrire, elle ne doit pas lui être remise, car cet objet constitue un dépôt de confiance entre les mains de celui qui l'a trouvé ; il ne lui est donc pas permis de le donner à quelqu'un qui n'a pas prouvé qu'il en est le propriétaire.</p>
<p><strong>Cinquièmement :</strong> Si son propriétaire ne se manifeste pas après une année complète d'annonce publique, l'objet devient alors la propriété de celui qui l'a trouvé. Toutefois, il lui est obligatoire, avant d'en disposer, d'en consigner précisément les caractéristiques, de sorte que si le propriétaire venait à se présenter à n'importe quel moment de sa vie pour la décrire, il devra la lui restituer en nature si elle est encore existante, ou lui en rendre l'équivalent (sa valeur) si elle ne l'est plus. En effet, sa propriété sur l'objet reste conditionnée par le retour éventuel du propriétaire, et il ne s'agit pas d'une propriété absolue.</p>
<p><strong>Sixièmement :</strong> Les savants ont divergé concernant l'objet trouvé dans le territoire sacré (<em>Luqata-ul-Haram</em>) : est-il semblable à l'objet trouvé en dehors du territoire sacré (<em>Al-Hill</em>), de sorte qu'on en devient propriétaire après l'annonce publique et l'écoulement d'une année, ou bien n'en devient-on jamais propriétaire de manière absolue ?</p>
<p>Certains d'entre eux sont d'avis qu'on en devient propriétaire de cette façon, en vertu de la portée générale des hadiths. Un autre groupe de savants a soutenu qu'on n'en devient pas propriétaire, mais qu'il est plutôt obligatoire d'en faire l'annonce perpétuellement, sans jamais pouvoir se l'approprier. Cela s'appuie sur la parole du Prophète <span dir="rtl">ﷺ</span> au sujet de la Noble Mecque :</p>
<p class="ar"><span dir="rtl">«وَلَا تَحِلُّ لُقَطَتُهَا إِلَّا لِمُعَرِّفٍ»</span></p>
<p><em><strong>« Et il n'est pas permis de ramasser son objet trouvé, sauf pour celui qui fait l'annonce publique. »</strong></em> <a href="#fn14" class="footnote-ref" id="fnref14" role="doc-noteref"><sup>14</sup></a>. Cheikh al-Islâm Ibn Taymiyyah (qu'Allah lui fasse miséricorde) <a href="#fn15" class="footnote-ref" id="fnref15" role="doc-noteref"><sup>15</sup></a> a opté pour ce second avis puisqu'il a dit : <em>« On n'en devient propriétaire en aucun cas, [en raison de l'interdiction la concernant], et il est obligatoire d'en faire l'annonce à tout jamais.</em> » Et c'est ce qui ressort explicitement du texte prophétique concernant cette interdiction.</p>
<p><strong>Septièmement :</strong> Quiconque abandonne un animal dans une terre déserte (un désert) parce que celui-ci est à bout de force et incapable de marcher, ou parce que son propriétaire est dans l'incapacité de s'en occuper, celui qui le récupère en devient le propriétaire. Cela s'appuie sur le récit prophétique :</p>
<p class="ar"><span dir="rtl">«مَنْ وَجَدَ دَابَّةً قَدْ عَجَزَ أَهْلُهَا عَنْهَا، فَسَيَّبُوهَا، فَأَخَذَهَا؛ فَهِيَ لَهُ»</span></p>
<p><em><strong>« Quiconque trouve une bête que ses propriétaires n'avaient plus la force de prendre en charge et qu'ils ont laissée à l'abandon, s'il la prend, elle lui appartient. »</strong></em> (Rapporté par Abou Dâwoud) <a href="#fn16" class="footnote-ref" id="fnref16" role="doc-noteref"><sup>16</sup></a>. De plus, elle a été délaissée par désintérêt, elle est donc semblable à tout autre bien abandonné par désintérêt.</p>
<p>Par ailleurs, celui à qui on a pris ses sandales — ou tout autre effet personnel similaire — et qui trouve à la place un autre objet, le statut juridique de cet objet trouvé est le même que celui de l'<em>Al-Luqatah</em> (l'objet trouvé). Il n'en devient pas propriétaire par sa simple présence, mais il doit obligatoirement en faire l'annonce publique. Après en avoir fait l'annonce, il pourra prélever de la valeur de cet objet l'équivalent de son propre droit (la valeur de ce qu'on lui a pris) et versera le reste en aumône.</p>
<p><strong>Huitièmement :</strong> Si l'enfant mineur (<em>As-Sabiy</em>) ou la personne simple d'esprit / sous curatelle (<em>As-Safîh</em>) trouvent un objet et le ramassent, leur tuteur (<em>Walî</em>) doit se charger de faire l'annonce publique à leur place. Il est d'ailleurs obligatoire pour le tuteur de récupérer l'objet de leurs mains, car aucun des deux n'a la capacité légale d'assumer un dépôt de confiance (<em>Amânah</em>) et de veiller à sa préservation. Si le tuteur le laisse entre leurs mains et que l'objet vient à périr ou être endommagé, il en devient financièrement garant (<em>Damina-hâ</em>), car il s'est rendu coupable de négligence. Une fois que le tuteur a procédé à l'annonce publique pendant un an sans que personne ne se manifeste pour réclamer l'objet, celui-ci devient la propriété des deux (le mineur ou le <em>Safîh</em>), sous condition de restitution (si le propriétaire revient un jour), exactement comme c'est le cas pour la personne majeure et douée de raison.</p>
<p><strong>Neuvièmement :</strong> Si une personne ramasse un objet trouvé à un endroit, puis décide de le reposer au même endroit, elle en devient financièrement garante (<em>Damina-hâ</em>). En effet, cet objet est devenu un dépôt de confiance (<em>Amânah</em>) dès lors qu'il est passé entre ses mains. Il a donc l'obligation de le préserver au même titre que tous les autres dépôts, et le fait de le délaisser à nouveau constitue une perte et une négligence caractérisée.</p>
<p>⁕ <strong>Remarque (Avertissement) :</strong> À travers la voie tracée par l'Islam au sujet de l'objet trouvé, on mesure toute l'importance qu'il accorde aux biens et à leur préservation, ainsi que son attachement au caractère sacré des biens du musulman et à leur sauvegarde. De manière générale, nous comprenons de tout cela que l'Islam incite ardemment à l'entraide dans le bien.</p>
<p>Nous demandons à Allah, Gloire à Lui, de nous raffermir tous sur l'Islam et de nous faire mourir en tant que musulmans.</p>
