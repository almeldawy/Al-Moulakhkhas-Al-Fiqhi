<h2 id="بسم-الله-الرحمن-الرحيم"><span dir="rtl">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</span></h2>
<p><strong>Chapitre sur les règles du métayage (<em>Al-Muzâra'ah</em>) et de l'irrigation partagée (<em>Al-Musâqât</em>)</strong></p>
<p>⁕ L'irrigation partagée (<em>Al-Musâqât</em>) et le métayage (<em>Al-Muzâra'ah</em>) font partie des activités que les gens pratiquent depuis l'Antiquité, en raison du besoin qu'ils en ont. En effet, une personne peut posséder des arbres sans avoir la capacité de s'en occuper et de les faire fructifier, ou elle peut posséder une terre agricole sans avoir la capacité d'y travailler et de l'exploiter. À l'inverse, une autre personne possède la capacité de travailler, mais ne possède ni arbres ni terre. C'est pourquoi le métayage et l'irrigation partagée ont été autorisés, afin de servir l'intérêt des deux parties. C'est ainsi que toutes les transactions légales en Islam reposent sur la justice, la réalisation des intérêts généraux et le rejet des causes de corruption (ou des préjudices).</p>
<p>⁕ <strong>L'irrigation partagée (<em>Al-Musâqât</em>) :</strong> les juristes l'ont définie comme étant le fait de confier des arbres déjà plantés, ou des arbres non encore plantés accompagnés du terrain à celui qui les y plantera, afin qu'il se charge de leur irrigation et de tout ce dont ils ont besoin jusqu'à ce qu'ils produisent des fruits. Le travailleur aura alors une part indivise (un pourcentage déterminé) des fruits de ces arbres, et le reste reviendra à leur propriétaire.</p>
<p><strong>Le métayage (<em>Al-Muzâra'ah</em>) :</strong> c'est le fait de confier une terre à celui qui la cultivera, ou de confier une terre ainsi que des semences à celui qui les y sèmera et s'en occupera, en contrepartie d'une part indivise de la récolte, le reste revenant au propriétaire de la terre.</p>
<p>Et il se peut que la part stipulée (définie par le contrat) dans l'irrigation partagée et le métayage soit attribuée au propriétaire de la terre ou des arbres, et que le reste revienne au travailleur.</p>
<p>⁕ La preuve de la légitimité de l'irrigation partagée (<em>Al-Musâqât</em>) et du métayage (<em>Al-Muzâra'ah</em>) est le hadith d'Ibn 'Umar (qu'Allah l'agrée, lui et son père) : <em><strong>« Le Prophète (<span dir="rtl">صَلَّى اللَّهُ عَلَيْهِ وَسَلَّم</span>َ) a traité avec les habitants de Khaybar contre la moitié de ce qu'elle produirait comme fruits ou récoltes »</strong></em> (Rapporté par Al-Boukhârî et Mouslim)<a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a>. Et Mouslim a rapporté : <em><strong>« Le Prophète (<span dir="rtl">صَلَّى اللَّهُ عَلَيْهِ وَسَلَّم</span>َ) a confié aux Juifs de Khaybar ses palmiers et ses terres à condition qu'ils les exploitent à leurs propres frais, et ils auraient la moitié de ses fruits »</strong></em><a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a> ; c'est-à-dire : sa moitié. L'Imam Ahmad a également rapporté : <em><strong>« Le Prophète (<span dir="rtl">صَلَّى اللَّهُ عَلَيْهِ وَسَلَّم</span>َ) a confié aux habitants de Khaybar sa terre et ses palmiers pour un partage équitable à moitié »</strong></em><a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a>. Ce hadith prouve donc la validité de l'irrigation partagée.</p>
<p>L'Imam Ibn Al-Qayyim a dit <a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a>: <em>« L'histoire de Khaybar contient une preuve de la légitimité de l'irrigation partagée et du métayage contre une part du rendement, qu'il s'agisse de fruits ou de récoltes. En effet, le Prophète (<span dir="rtl">صَلَّى اللَّهُ عَلَيْهِ وَسَلَّم</span>َ) a traité avec les habitants de Khaybar et a maintenu cette pratique jusqu'à sa mort, sans qu'elle ne soit jamais abrogée. Les califes bien guidés ont également perpétué cette pratique. Cela ne relève pas du contrat de location (Al-Mûâjarah), mais plutôt du contrat d'association (Al-Mushârakah), et c'est exactement le pendant du contrat de commandite (Al-Mudârabah)</em> ». Fin de citation.</p>
<p>Et Al-Muwaffaq Ibn Qoudâmah a dit <a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a>: <em>« Les califes bien guidés ont appliqué cela durant toute la période de leur califat, et cela s'est propagé sans que personne ne s'y oppose, constituant ainsi un consensus (Ijmâ') ».</em> Il a ajouté : <em>« Il n'est pas permis de s'appuyer sur ce qui contredit le hadith et le consensus. De plus, de nombreux propriétaires de palmeraies et d'arbres sont incapables de les entretenir et de les irriguer, et n'ont pas les moyens d'engager des salariés pour le faire. Inversement, de nombreuses personnes ne possèdent pas d'arbres mais ont besoin de fruits. L'autorisation de ces contrats permet donc de répondre à ces deux besoins et de réaliser l'intérêt des deux parties »</em>. Fin de citation.</p>
<p>⁕ Les juristes (qu'Allah leur fasse miséricorde) ont mentionné que, pour la validité de l'irrigation partagée (<em>Al-Musâqât</em>), il est conditionné que les arbres faisant l'objet du contrat produisent des fruits comestibles. Ainsi, ce contrat n'est pas valable pour des arbres qui ne donnent pas de fruits, ou qui donnent des fruits non comestibles, car cela ne s'appuie sur aucun texte scripturaire (absence de preuve textuelle).</p>
<p>⁕ Parmi les conditions de validité de l'irrigation partagée (<em>Al-Musâqât</em>), il y a la détermination de la part du travailleur ou du propriétaire par une fraction connue et indivise des fruits, comme le tiers ou le quart, que la part stipulée soit petite ou grande.</p>
<p>Ainsi, si les deux parties stipulent la totalité de la récolte pour l'une d'entre elles, le contrat n'est pas valide, car l'une des parties s'approprierait l'exclusivité du rendement. De même, s'ils stipulent un nombre déterminé de mesures (<em>As-wu'</em>) de fruits (par exemple : dix <em>As-wu'</em> ou vingt <em>Sâ'</em>), le contrat n'est pas valide. En effet, il se peut que la récolte ne produise rien d'autre que cette quantité précise, de sorte que celui à qui elle a été promise en ait l'exclusivité au détriment de l'autre.</p>
<p>Il en va de même si, dans le contrat d'irrigation partagée, on stipule pour l'une des parties une somme d'argent déterminée (en dirhams) : le contrat n'est pas valide, car la récolte pourrait ne pas rapporter l'équivalent de cette somme.</p>
<p>De la même manière, si l'on stipule pour l'une des parties la production d'un arbre spécifique ou d'arbres bien précis, l'irrigation partagée n'est pas valide. Car il se peut que les arbres ne produisent rien en dehors de ceux qui ont été spécifiés, ce qui donnerait l'exclusivité du rendement à l'un d'eux au détriment de l'autre ; ou bien, à l'inverse, cet arbre ou ces arbres spécifiés pourraient ne rien produire du tout, privant ainsi de récolte la partie à qui elle était promise. Cela engendrerait alors de l'aléa (<em>Al-Gharar</em>) et un préjudice (<em>Ad-Dirar</em>).</p>
<p>⁕ L'avis authentique, qui est celui de la majorité des savants (al-Jumhûr), est que le contrat d'irrigation et de métayage fruitier (<em>al-Musâqât</em>) est un contrat contraignant (irrévocable) qu'il n'est pas permis d'annuler sans le consentement de l'autre partie.</p>
<p>⁕ Il est indispensable d'en fixer la durée, même si celle-ci est longue, tant que les arbres subsistent.</p>
<p>⁕ Le travailleur est tenu d'accomplir tout ce qui contribue au bon développement des fruits : le labour, l'irrigation, l'émondage des branches qui nuisent aux arbres et aux fruits, la pollinisation des palmiers, le séchage des fruits, l'entretien des canaux d'irrigation et la répartition de l'eau entre les arbres.</p>
<p>⁕ Quant au propriétaire des arbres, il lui incombe d'assurer tout ce qui préserve le capital d'origine — c'est-à-dire les arbres eux-mêmes — comme le creusement du puits, la construction des clôtures (murs de protection), l'approvisionnement en eau dans le puits... et ce qui y est similaire. De même, il incombe au propriétaire de fournir les matières qui fortifient les arbres, telles que l'engrais et autres.</p>
<p>⁕ Fournir les graines en même temps que la terre n'est pas une condition de validité pour le contrat de métayage agricole (<em>al-Muzâra'ah</em>). Ainsi, s'il lui remet uniquement la terre pour que le travailleur la cultive avec des semences provenant de ses propres ressources, cela est tout à fait valable. C'est d'ailleurs l'avis d'un groupe de compagnons (du Prophète), la pratique courante des gens, et également parce que la preuve textuelle dont découle le statut de la <em>Muzâra'ah</em> est le hadith concernant le traité du Prophète <span dir="rtl">ﷺ</span> avec les habitants de Khaybar en contrepartie de la moitié de ce qu'elle produirait ; or, il n'est pas mentionné dans ce hadith que les semences incombaient aux musulmans.</p>
<p>⁕ L'Imam Ibn al-Qayyim — qu'Allah lui fasse miséricorde — a dit : <em>« Et ceux qui ont stipulé comme condition que les semences doivent être fournies par le propriétaire de la terre ont formulé une analogie (Qiyâs) avec la Mudârabah (le partenariat financier). Or, cette analogie, en plus d'être en contradiction avec la Sounnah authentique et les avis des compagnons, fait partie des analogies les plus erronées.</em></p>
<p><em>En effet, dans la Mudârabah, le capital (financier) retourne à son propriétaire originel et les deux parties se partagent uniquement le profit ; cela équivaut donc à la terre dans le cadre du métayage agricole (al-Muzâra'ah).</em></p>
<p><em>Quant aux semences, dont l'équivalent ne retourne pas à son propriétaire mais disparaît au même titre que disparaît l'usage de la terre, leur assimilation à l'élément périssable (l'usage de la terre) est bien plus appropriée que leur assimilation à l'élément permanent (le capital). »</em> <a href="#fn6" class="footnote-ref" id="fnref6" role="doc-noteref"><sup>6</sup></a>. Fin de citation.</p>
<p>⁕ Le terme <em>al-Muzâra'ah</em> (métayage agricole) est dérivé de <em>al-Zar'</em> (la culture / le semis). On l'appelle également <em>Mukhâbarah</em> ou <em>Muwâkarah</em>. Quant au travailleur dans ce contrat, il est appelé : <em>Muzâri'</em>, <em>Mukhâbir</em> ou <em>Muwâkir</em>.</p>
<p>⁕ La preuve de sa légitimité réside dans la Sounnah purifiée et authentique, comme mentionné précédemment. De plus, le besoin réel des gens exige sa permission. En effet, il y a parmi les hommes des personnes qui possèdent une terre agricole mais qui n'ont pas la capacité de la cultiver, tandis que d'autres ont la capacité de travailler la terre mais ne possèdent pas de propriété agricole. La sagesse législative a donc requis la permission du métayage agricole afin que les deux parties en tirent profit : l'un grâce à sa terre, l'autre par son travail, et pour instaurer une entraide mutuelle visant à concrétiser l'intérêt commun et à repousser le préjudice.</p>
<p>Cheikh al-Islâm Ibn Taymiyyah — qu'Allah lui fasse miséricorde — a dit <a href="#fn7" class="footnote-ref" id="fnref7" role="doc-noteref"><sup>7</sup></a>: <em>« Le métayage agricole (al-Muzâra'ah) est plus équitable (fondé sur une justice originelle) que la location (al-Ijârah), car les deux parties partagent aussi bien les gains que les pertes. »</em></p>
<p>Et l'Imam Ibn al-Qayyim — qu'Allah lui fasse miséricorde — a dit <a href="#fn8" class="footnote-ref" id="fnref8" role="doc-noteref"><sup>8</sup></a>: <em>« Elle est plus éloignée de l'injustice et du préjudice que la location. En effet, [dans la location], l'un des deux est obligatoirement gagnant. Quant au métayage agricole, si la récolte lève, ils la partagent ensemble ; et si elle échoue, ils partagent ensemble la privation. »</em></p>
<p>⁕ Il est stipulé comme condition de validité du métayage agricole (<em>al-Muzâra'ah</em>) de spécifier la part des récoltes qui revient au travailleur ou au propriétaire de la terre, et que cette part soit une fraction indivise (un pourcentage indéterminé en valeur absolue) de celle-ci, comme le tiers ou le quart de ce que produit la terre, ou ce qui y est similaire. En effet, le Prophète <span dir="rtl">ﷺ</span> a conclu un traité avec les habitants de Khaybar en contrepartie de la moitié de ce qu'elle produirait. Ainsi, dès lors que la part de l'un d'eux est connue, le reste revient automatiquement à l'autre, car la récolte leur appartient mutuellement ; dès que la quote-part de l'un est définie, celle de l'autre devient évidente.</p>
<p>Cependant, s'il est posé comme condition que l'un d'eux reçoive une quantité fixe et déterminée de mesures (comme dix <em>Sâ'</em>) ou la récolte d'une parcelle spécifiquement délimitée de la terre et le reste pour l'autre, le contrat n'est pas valide. De même, si le propriétaire de la terre exige de prélever d'abord l'équivalent de ses semences avant qu'ils ne partagent le reste, le métayage est invalide, car il se peut que la terre ne produise rien d'autre que cette quantité, de sorte qu'il se l'approprierait exclusivement au détriment de l'autre partie.</p>
<p>Ceci s'appuie également sur le hadith de Râfi' ibn Khadîj — qu'Allah l'agrée — qui a dit : <em>« Il n'y a pas de mal à louer la terre contre de l'or ou de l'argent. À l'époque du Messager d'Allah <span dir="rtl">ﷺ</span>, les gens louaient les terres en contrepartie des récoltes poussant au bord des canaux d'irrigation (al-Mâdhiyânât), à l'embouchure des ruisseaux (Aqbâl al-Jadâwil), ou sur des portions spécifiques de cultures. Parfois, cette partie périssait tandis que l'autre était préservée, et les gens n'avaient pas d'autre mode de location que celui-ci ; c'est pourquoi il l'a interdit »</em> <a href="#fn9" class="footnote-ref" id="fnref9" role="doc-noteref"><sup>9</sup></a>— c'est-à-dire le Prophète <span dir="rtl">ﷺ</span>. Cette interdiction est motivée par le préjudice manifeste que cela comporte, lequel engendre des disputes et mène à consommer les biens d'autrui de manière illicite (injuste).</p>
<p>Ce hadith prouve donc l'interdiction du métayage agricole (<em>al-Muzâra'ah</em>) lorsqu'il est conclu d'une manière qui mène au préjudice, à l'inconnu (l'incertitude majeure ou <em>al-Jahâlah</em>) et qui provoque inévitablement des disputes entre les gens.</p>
<p>Ibn al-Mundhir a dit : <em>« Les rapports transmis d'après Râfi' mentionnent des motifs (vices juridiques) indiquant que l'interdiction était précisément due à ces raisons-là, qui correspondaient à leurs pratiques habituelles. Il a dit : "Nous louions la terre en stipulant que telle parcelle nous revenait et que telle autre leur revenait. Il arrivait alors fréquemment que celle-ci produise et que celle-là ne produise rien." »</em> Fin de citation.</p>
