<p>⁕ Ce contrat se répète dans la vie des gens à travers leurs différents intérêts et leurs transactions quotidiennes, mensuelles et annuelles. Il convient donc d'en connaître les règles. En effet, il n'y a pas une transaction qui se déroule entre les gens, quels que soient les lieux et les époques, sans qu'elle ne soit régie par la législation de l'Islam, selon des critères juridiques par lesquels les intérêts sont préservés et les préjudices sont repoussés.</p>
<p>⁕ Et <em>Al-Ijârah</em> (le louage / la location) est dérivé de <em>Al-Ajr</em> (le salaire / la rétribution), qui est la contrepartie (la compensation).</p>
<p>Allah Ta'âla a dit :</p>
<blockquote>
<p class="ar"><span dir="rtl">﴿لَوْ شِئْتَ لَاتَّخَذْتَ عَلَيْهِ أَجْرًا﴾</span></p>
</blockquote>
<p><em>« <strong>Si tu avais voulu, tu aurais bien pu réclamer pour cela un salaire.</strong> »</em> [Sourate Al-Kahf : 77].</p>
<p>⁕ <strong>Et d'un point de vue religieux (dans la Sharî'ah)</strong>, elle est définie comme : <em><strong>Un contrat portant sur un usufruit (une utilité) autorisé, provenant d'un bien précis ou décrit de manière précise à charge, pour une durée déterminée ; ou [un contrat] portant sur un travail déterminé contre une rémunération déterminée.</strong></em></p>
<p>⁕ Et cette définition englobe la majorité des conditions de validité du louage et de ses types :</p>
<p>⁃ Ainsi, leur parole : <strong>« un contrat portant sur un usufruit »</strong> : exclut le contrat qui porte sur le bien lui-même (la propriété physique / le corps du bien). Un tel contrat n'est pas appelé louage (<em>Ijârah</em>), mais il est plutôt appelé vente (<em>Bay'</em>).</p>
<p>⁃ Et leur parole : <strong>« autorisé »</strong> : exclut le contrat portant sur une utilité interdite, comme la fornication (<em>Az-Zinâ</em>).</p>
<p>⁃ Et leur parole : <strong>« déterminée »</strong> : exclut l'utilité inconnue (ambiguë) ; le contrat ne formule donc aucune validité si l'utilité n'est pas définie.</p>
<p>⁃ Et leur parole : <strong>« provenant d'un bien précis, ou décrit de manière précise à charge, ou [portant sur] un travail déterminé »</strong> : on en déduit que le louage (<em>Al-Ijârah</em>) se divise en deux types :</p>
<p><strong>Le premier type :</strong> Que le louage porte sur l'utilité d'un bien spécifique, ou d'un bien décrit de façon précise. L'exemple du bien spécifique : [Dire] « <em>Je te loue cette maison</em> ». Et l'exemple du bien décrit : [Dire] « <em>Je te loue un chameau dont les caractéristiques sont telles et telles pour le transport de charge ou pour la monte</em> ».</p>
<p><strong>Le second type :</strong> Que le louage porte sur l'accomplissement d'un travail déterminé ; comme le fait de le transporter [lui ou sa marchandise] jusqu'à tel endroit, ou de lui construire un mur.</p>
<p>⁃ Et leur parole : <strong>« pour une durée déterminée »</strong> ; c'est-à-dire : il est conditionné que le louage de l'utilité se fasse pour une période délimitée, comme un jour ou un mois.</p>
<p>⁃ Et leur parole : <strong>« contre une rémunération déterminée »</strong> ; cela signifie : qu'il est impératif que le montant (le prix) du louage soit connu.</p>
<p><strong>Par cela, il devient clair que le résumé des conditions de validité du louage, sous ses deux formes, est :</strong></p>
<ul>
<li><blockquote>
<p>Que le contrat de louage porte sur l'utilité (l'usufruit) et non sur le bien lui-même,</p>
</blockquote></li>
<li><blockquote>
<p>Que l'utilité soit autorisée,</p>
</blockquote></li>
<li><blockquote>
<p>Que l'utilité soit connue,</p>
</blockquote></li>
<li><blockquote>
<p>Et si le louage porte sur un bien non spécifié (indéterminé dans son individualité), il est alors impératif qu'il s'agisse d'une chose qui puisse être définie précisément par la description,</p>
</blockquote></li>
<li><blockquote>
<p>Que la durée du louage soit connue,</p>
</blockquote></li>
<li><blockquote>
<p>Et que la contrepartie (le prix/salaire) dans le louage soit également connue.</p>
</blockquote></li>
</ul>
<p>⁕ Et le louage valide est autorisé par le Livre (le Coran), la Sunnah et le consensus (Al-Ijmâ‘) :</p>
<p>⁃ Allah Ta'âla a dit :</p>
<blockquote>
<p class="ar"><span dir="rtl">﴿فَإِنْ أَرْضَعْنَ لَكُمْ فَآتُوهُنَّ أُجُورَهُنَّ﴾</span></p>
</blockquote>
<p>« <strong>Et si elles allaitent [l'enfant] pour vous, donnez-leur leur salaire.</strong> » [Sourate At-Talâq : 6].</p>
<p>Et Allah Ta'âla a dit :</p>
<p class="ar"><span dir="rtl">﴿لَوْ شِئْتَ لَاتَّخَذْتَ عَلَيْهِ أَجْرًا﴾</span></p>
<p>« <strong>Si tu avais voulu, tu aurais bien pu réclamer pour cela un salaire.</strong> » [Sourate Al-Kahf : 77].</p>
<p>⁃ Le Prophète <span dir="rtl">ﷺ</span> a certes loué les services d'un homme pour lui indiquer le chemin lors de son voyage pour l'Émigration (Al-Hijrah).</p>
<p>⁃ Et Ibn al-Mundhir a certes rapporté le consensus concernant son autorisation.</p>
<p>⁃ Et le besoin [des gens] y invite, car le besoin vis-à-vis des utilités (des services/usufruits) est semblable au besoin vis-à-vis des biens eux-mêmes.</p>
<p>⁕ Et il est valide de louer les services d'un être humain pour un travail déterminé ; comme la couture d'un vêtement, la construction d'un mur, ou pour qu'il indique un chemin. Cela est conforme à ce qui est établi dans le « Sahîh Al-Boukhârî », d'après 'Âïshah (qu'Allah l'agrée) dans le hadith de l'Émigration :</p>
<p><em>« <strong>Le Prophète <span dir="rtl">ﷺ</span> et Aboû Bakr (qu'Allah l'agrée) ont loué les services de 'Abdullâh ibn Ourayqit al-Laythî, qui était un guide expert (Khirrît).</strong> »#</em> Et le <em>Khirrît</em> désigne celui qui est habile et expert dans le guidage.</p>
<p>⁕ Et il n'est pas permis de louer des maisons, des boutiques ou des commerces pour y commettre des péchés (actes de désobéissance) ; comme la vente d'alcool, ou la vente de substances interdites telles que le tabac, ainsi que pour [la pratique de] la photographie/l'imagerie (At-Taswîr) ; car cela constitue une aide à la désobéissance.</p>
<p>⁕ Et il est permis au locataire de sous-louer ce qu'il a loué à une autre personne qui prendra sa place dans la jouissance de l'utilité (du bien) ; car cette utilité lui appartient [pendant la durée du contrat]. Il lui est donc permis d'en jouir lui-même ou par le biais d'un représentant. Cependant, cela est conditionné par le fait que le second locataire soit équivalent au premier locataire dans sa manière de jouir de l'utilité, ou qu'il cause moins d'usure [au bien], mais pas plus de préjudice que lui. C'est le cas par exemple de celui qui loue une maison pour l'habiter : il lui est permis de la louer à autrui pour y habiter, ou pour un usage de moindre impact. En revanche, il ne lui est pas permis de la louer à quelqu'un qui en ferait une usine ou un atelier de fabrication.</p>
<p>⁕ Et le louage (le fait de salarier quelqu'un) n'est pas valide pour l'accomplissement des actes d'adoration et de rapprochement [d'Allah] ; comme le Pèlerinage (Al-Hajj) ou l'appel à la prière (Al-Adhân). En effet, ces œuvres ont pour but de se rapprocher d'Allah, et le fait de percevoir un salaire pour les accomplir les sort de ce cadre. Toutefois, il est permis de recevoir une attribution financière (Rizq) provenant du trésor public (Bayt al-Mâl) pour les actions dont l'utilité est publique ; comme le Hajj, l'Adhân, l'imama (diriger la prière), l'enseignement du Coran, de la jurisprudence (Al-Fiqh), la magistrature (Al-Qadâ) et la délivrance des avis juridiques (Al-Foutyâ). Car cette attribution ne constitue pas une transaction commerciale (une contrepartie), mais elle est plutôt une aide à l'accomplissement de l'obéissance. Cela ne prive en rien l'œuvre de son statut d'acte de rapprochement et ne nuit pas à la sincérité (Al-Ikhlâs).</p>
<p>Sheykh al-Islâm Ibn Taymiyyah (qu'Allah lui fasse miséricorde) a dit :</p>
<p><em>« Et les juristes sont unanimes sur la différence entre le fait de salarier quelqu'un pour accomplir des actes de rapprochement et le fait d'accorder une attribution financière à ceux qui les accomplissent. Ainsi, l'attribution financière accordée aux combattants, aux juges, aux mouadhins (ceux qui font l'appel à la prière) et aux imams est autorisée sans aucune divergence. Quant au fait de les employer sous forme de louage (salaire contractuel), cela n'est pas permis selon la majorité d'entre eux. »</em></p>
<p>Et il a dit également :</p>
<p><em>« Et ce qui est perçu du trésor public (Bayt al-Mâl) n'est pas une compensation ni un salaire, mais c'est une subsistance (Rizq) destinée à aider à l'accomplissement de l'obéissance. Par conséquent, celui d'entre eux qui accomplit une œuvre sincèrement pour Allah obtiendra sa récompense [auprès d'Allah], et ce qu'il perçoit n'est qu'une subsistance pour l'aider à accomplir cette obéissance. »</em> <a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a></p>
<p>⁕ <strong>Ce qui incombe (les obligations de) chacune des deux parties, le bailleur (Al-Mû'ajji r) et le locataire (Al-Mustâ'jir) :</strong></p>
<p>⁃ Il incombe ainsi au bailleur de fournir tout ce qui permet au locataire de jouir pleinement du bien loué ; comme le fait de réparer la voiture louée et de la préparer pour le transport et la route, ou d'entretenir la maison louée en réparant ce qui s'est dégradé dans sa structure, et en préparant ses installations (équipements) pour qu'elles soient fonctionnelles.</p>
<p>⁃ Et il incombe au locataire, lorsque [le contrat] prend fin, d'enlever (ou de réparer) ce qui a été causé par son propre fait.</p>
<p>⁃ Le louage est un contrat contraignant (irrévocable) pour les deux parties — le bailleur et le locataire — car il s'agit d'une forme de vente, et il en prend donc le statut juridique. Aucune des deux parties n'a le droit de l'annuler sans le consentement de l'autre, sauf si un vice (défaut caché) apparaît, dont le locataire n'avait pas connaissance au moment de la conclusion du contrat ; dans ce cas, il a le droit à l'annulation (Al-Faskh).</p>
<p>⁃ Il est obligatoire pour le bailleur de remettre le bien loué au locataire et de le mettre en mesure d'en jouir. S'il lui loue une chose mais l'empêche d'en jouir pendant toute la durée ou une partie de celle-ci, il ne mérite alors rien du loyer (salaire), ou du moins il n'y a pas droit dans sa totalité. En effet, il ne lui a pas livré ce sur quoi portait le contrat de louage ; il ne mérite donc de rémunération qu'à hauteur de l'utilité dont il a effectivement permis au locataire de jouir. À l'inverse, si le bailleur met le bien à la disposition du locataire pour qu'il en jouisse, mais que le locataire choisit de le délaisser (ne pas l'utiliser) pendant toute la durée ou une partie de celle-ci, la totalité du loyer reste due par le locataire. Car le louage est un contrat contraignant, et ses effets juridiques s'appliquent pleinement : à savoir que le bailleur devient propriétaire du loyer, et le locataire devient propriétaire de l'usage (des utilités).</p>
<p>⁕ Et le contrat de louage s'annule (est résilié) par plusieurs motifs :</p>
<p><strong>Premièrement :</strong> Lorsque le bien loué subit une perte totale (est détruit) : comme si une personne louait ses bêtes de somme et que celles-ci venaient à mourir, ou s'il louait une maison et que celle-ci s'effondrait, ou s'il louait une terre pour la cultiver et que son approvisionnement en eau venait à se couper.</p>
<p><strong>Deuxièmement :</strong> Le louage s'annule également par la disparition de l'objectif (du but) pour lequel le contrat a été conclu ; comme si une personne engageait (salariait) un médecin pour la soigner et qu'elle guérissait [avant l'intervention], en raison de l'impossibilité d'exécuter l'objet même du contrat.</p>
<p>⁕ Et quiconque a été engagé (salarié) pour accomplir un travail et vient à tomber malade, on désigne à sa place — à ses propres frais (sur ses deniers) — une personne pour exécuter ce travail par procuration (en remplacement).</p>
<p>Sauf s'il a été stipulé comme condition qu'il accomplisse le travail personnellement ; car l'objectif recherché pourrait ne pas être atteint par le travail d'un autre. Dans ce cas, il n'incombe pas à l'employeur (le locataire du service) d'accepter le travail d'autrui. L'employeur a alors le choix entre patienter et attendre que l'employé guérisse, ou annuler (résilier) le contrat en raison de l'impossibilité d'accéder à son droit.</p>
<p>⁕ <strong>L'employé (le prestataire / le salarié) se divise en deux catégories : l'employé exclusif (Al-Ajîr al-Khâss) et l'employé commun (Al-Ajîr al-Moushtarak) :</strong> L'employé exclusif est celui qui est engagé pour une durée déterminée, durant laquelle une seule et unique personne a le droit de bénéficier de ses services, sans que personne d'autre ne la partage avec elle. L'employé commun est celui dont l'utilité est définie par l'accomplissement d'un travail précis. Il n'est pas dédié à une seule personne, mais accepte plutôt d'exécuter des travaux pour plusieurs clients en même temps.</p>
<p>⁃ Ainsi, l'employé exclusif n'est pas tenu pour responsable (ne commet pas de faute financière ou de dédommagement) des dégâts causés par ses mains involontairement par erreur ; comme si l'outil avec lequel il travaille venait à se casser. Car il agit en tant que représentant du propriétaire, il n'est donc pas garant, au même titre que le mandataire (<em>Al-Wakîl</em>). En revanche, s'il commet une transgression (un abus) ou une négligence, il doit alors garantir (dédommager) ce qui a été détruit.</p>
<p>⁃ Quant à l'employé commun, il est pleinement garant de ce qui subit une détérioration par son action. En effet, il ne mérite sa rémunération que par la livraison du travail accompli ; son travail est donc sous sa propre responsabilité et garantie. Et tout dommage découlant d'une chose sous garantie est également garanti (sujet à dédommagement).</p>
<p>⁕ <strong>Le salaire de l'employé devient obligatoire dès la conclusion du contrat</strong>, mais il ne possède le droit de l'exiger qu'après avoir livré le travail qui lui incombait, ou après la jouissance complète de l'utilité, ou après la remise du bien loué et l'écoulement de la durée du contrat sans qu'aucun obstacle ne soit survenu. Car l'employé ne reçoit la totalité de sa rétribution que lorsqu'il a parachevé son travail (ou ce qui équivaut à son exécution). De plus, le salaire étant une contrepartie (une compensation), il n'est exigible que par la livraison de la chose compensée.</p>
<p>⁕ Ceci étant dit, il est obligatoire pour l'employé de perfectionner son travail et de le parachever. Il lui est strictement interdit de tricher (de duper) dans son travail ou de se montrer malhonnête (trahir la confiance). De même, il lui est obligatoire de poursuivre assidûment son travail durant toute la période pour laquelle il a été engagé, sans en perdre le moindre moment sans travailler, et il doit craindre Allah dans l'accomplissement de ce qui lui incombe.</p>
<p>Et il est obligatoire pour l'employeur (le locataire du service) de verser le salaire complet [à l'employé] dès qu'il termine son travail, conformément à la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«أَعْطُوا الأَجِيرَ أَجْرَهُ قَبْلَ أَنْ يَجِفَّ عَرَقُهُ»</span></p>
<p>« <strong>Donnez à l'employé son salaire avant que sa sueur ne sèche.</strong> » <a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a></p>
<p>Et d'après Aboû Hourayrah (qu'Allah l'agrée), le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="rtl">«قَالَ اللَّهُ تَعَالَى: ثَلَاثَةٌ أَنَا خَصْمُهُمْ يَوْمَ القِيَامَةِ، وَمَنْ كُنْتُ خَصْمَهُ؛ خَصَمْتُهُ يَوْمَ القِيَامَةِ: رَجُلٌ أَعْطَى بِي ثُمَّ غَدَرَ، وَرَجُلٌ بَاعَ حُرًّا فَأَكَلَ ثَمَنَهُ، وَرَجُلٌ اسْتَأْجَرَ أَجِيرًا، فَاسْتَوْفَى مِنْهُ، وَلَمْ يُعْطِهِ أَجْرَهُ»</span></p>
<p>« <strong>Allah Ta'âla a dit : "Il est trois catégories de personnes dont Je serai l'adversaire le Jour de la Résurrection. Et quiconque a Moi pour adversaire, Je le vaincrai (par Mes preuves) le Jour de la Résurrection : un homme qui a donné sa parole en Mon Nom puis a trahi, un homme qui a vendu un homme libre et en a consommé le prix, et un homme qui a loué les services d'un employé, a pleinement bénéficié de son travail, mais ne lui a pas versé son salaire."</strong> » Rapporté par Al-Boukhârî et d'autres<a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a>.</p>
<p>Ainsi, le travail de l'employé est un dépôt de confiance (Amânah) qui lui incombe ; il se doit de le préserver en perfectionnant son travail, en le menant à son terme et en agissant avec sincérité et loyauté. À l'inverse, le salaire de l'employé est une dette qui pèse sur l'employeur et un droit qui lui est dû ; il a l'obligation de s'en acquitter sans le moindre retard injustifié (procrastination) ni aucune diminution. Et Allah Ta'âla est Plus Savant.</p>
