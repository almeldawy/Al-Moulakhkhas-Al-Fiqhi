<p>⁕ <strong>La Qasâmah sur le plan linguistique :</strong> C'est un nom verbal (<em>Ism Masdar</em>) tiré de l'expression : « <span dir="rtl">أَقْسَمَ إِقْسَاماً وَقَسَامَة</span>ً », c'est-à-dire : prêter serment. Ce qui est visé ici par ce terme, ce sont les serments, à savoir des serments répétés dans le cadre d'une accusation de meurtre d'une personne protégée (dont le sang est sacré).</p>
<p>⁕ <strong>La légitimité de la Qasâmah :</strong> Elle est instituée lorsqu'un mort est retrouvé sans que l'on connaisse son meurtrier, mais qu'un individu (ou un groupe) est suspecté.</p>
<p>⁕ <strong>La preuve de sa légitimité :</strong> La Sounnah et le consensus (<em>Al-Ijmâ'</em>).</p>
<p>Il est rapporté dans les deux recueils authentiques (<em>Al-Boukhârî et Mouslim</em>), d'après Sahl ibn Abî Hathmah, que 'Abdoullah ibn Sahl et Mouhayyisah ibn Mas'oûd se rendirent à Khaybar. Mouhayyisah rejoignit 'Abdoullah ibn Sahl alors que ce dernier se vautrait dans son sang (agonisant). Il alla trouver les Juifs et leur dit : « C'est vous qui l'avez tué ! ». Ils répondirent : « Non ». Le Messager d'Allah <span dir="rtl">ﷺ</span> dit alors : « Prêtez-vous serment [cinquante fois] pour réclamer le sang (le talion ou le prix du sang) de votre compagnon ? ». Et dans une autre version : « Apportez-vous une preuve ? ». Ils dirent : « Nous n'avons pas de preuve ». Il dit : « Prêtez-vous alors serment ? ». Ils répondirent : « Comment pourrions-nous prêter serment alors que nous n'avons pas été témoins et que nous n'avons rien vu ?! ». Il dit alors : « Les Juifs vous disculperont en prêtant cinquante serments ». Ils dirent : « Comment accepter les serments d'un peuple mécréant ? ». Le Prophète paya alors lui-même le prix du sang (<em>Al-Diya</em>) en versant cent chamelles.<a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a></p>
<p>Cela prouve donc la légitimité de la Qasâmah, et qu'elle constitue un fondement autonome parmi les fondements de la législation islamique, ainsi qu'une règle parmi les règles juridiques, par laquelle les preuves générales sont spécifiées (<em>Takhsîs</em>).</p>
<p>⁕ <strong>Quant aux conditions de la Qasâmah :</strong></p>
<p>- <strong>[Parmi ces conditions], la plus importante est la présence du <em>Lawth</em> (l'indice de suspicion fort) :</strong> Il s'agit de l'animosité manifeste qui existait entre la victime et l'accusé. C'est le cas, par exemple, des tribus liées par des vendettas (dettes de sang), ou de quiconque nourrissait une rancœur telle envers le défunt qu'elle laisse fortement présumer qu'il l'a tué à cause de cela. Dans ce cas, il incombe aux ayants droit (<em>Awliyâ</em>) de prêter serment contre le meurtrier si leur intime conviction est qu'il a commis le crime, et ce, même s'ils étaient absents au moment des faits.</p>
<p>Cheikh al-Islâm Ibn Taymiyyah ~ qu'Allah lui fasse miséricorde ~ a soutenu que le <em>Lawth</em> ne se limite pas à la seule animosité. Il englobe plutôt tout élément qui fait prévaloir la véracité de l'accusation, comme le fait qu'un groupe de personnes se disperse en laissant derrière lui un cadavre, ou le témoignage de personnes dont le statut ne suffit pas à établir légalement le meurtre (par exemple, un seul témoin ou des témoignages incomplets), et d'autres cas similaires.</p>
<p><strong>L'Imam Ahmad a dit :</strong> <em>« J'applique la Qasâmah dès lors qu'il y a une suspicion (Latkh), un motif évident, une animosité avérée, ou lorsque l'accusé est le genre de personne capable de commettre un tel acte. »</em></p>
<p><strong>Cheikh al-Islâm Ibn Taymiyyah</strong> <a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a> <strong>a commenté cela en disant :</strong> <em>« Il a ainsi mentionné quatre éléments :</em></p>
<ol type="1">
<li><blockquote>
<p><em>Al-Latkh (la tache / la mauvaise réputation) : qui correspond aux accusations verbales portant atteinte à l'honneur, comme un témoignage rejeté (juridiquement insuffisant).</em></p>
</blockquote></li>
<li><blockquote>
<p><em>Le motif évident : comme le fait de fuir en laissant un corps.</em></p>
</blockquote></li>
<li><blockquote>
<p><em>L'animosité.</em></p>
</blockquote></li>
<li><blockquote>
<p><em>Le fait que le suspect soit connu pour être un criminel ou un meurtrier. Et c'est cela qui est l'avis correct. »</em></p>
</blockquote></li>
</ol>
<p><strong>L'Imam Ibn al-Qayyim</strong> <a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a> <strong>~ qu'Allah lui fasse miséricorde ~ a dit :</strong> <em>« C'est là une des meilleures manières d'argumenter. En effet, cela repose sur des indices apparents qui font prévaloir la véracité du plaignant. Il lui est donc permis de prêter serment sur cette base, et il est permis au juge — c'est même un devoir pour lui — d'établir en sa faveur le droit au talion (Qisâs) ou au prix du sang (Diya), tout en sachant pertinemment que le plaignant n'a pas vu la scène et n'en a pas été témoin... »</em> Fin de citation.</p>
<p>Cependant, il ne convient pas aux ayants droit (<em>Awliyâ</em>) de prêter serment sans s'être d'abord assurés de leur intime conviction. De même, il convient au juge de leur rappeler solennellement la gravité de l'acte et de leur faire prendre conscience du châtiment qu'implique un faux serment.</p>
<p>- <strong>Une autre condition de la Qasâmah :</strong> Il faut que l'individu accusé de meurtre soit légalement responsable (<em>Mukallaf</em>). Par conséquent, l'accusation dans le cadre de la <em>Qasâmah</em> n'est pas valable si elle est dirigée contre un enfant ou une personne atteinte de folie.</p>
<p>- <strong>[Parmi ses conditions], la possibilité physique que l'accusé ait commis le meurtre :</strong> Si le meurtre s'avère impossible de sa part — en raison, par exemple, de son éloignement géographique du lieu du crime au moment des faits —, l'action en justice (la plainte) menée contre lui n'est pas recevable.</p>
<p>⁕ <strong>La modalité d'exécution de la Qasâmah :</strong> Lorsque toutes les conditions de son application sont réunies, la procédure débute par les plaignants (les ayants droit de la victime). Ils doivent prêter cinquante serments, répartis entre eux au prorata de leur part d'héritage du défunt, attestant que : « Un tel est bien celui qui l'a tué ». Cela doit impérativement se faire en présence de l'accusé.</p>
<p>Si les héritiers refusent de prêter serment ou s'ils s'arrêtent avant d'avoir complété les cinquante serments, la responsabilité du serment est alors transférée à l'accusé. Ce dernier prête à son tour cinquante serments — à condition que les plaignants acceptent de s'en remettre à ses serments. S'il jure, il est définitivement disculpé.</p>
<p>En revanche, si les plaignants refusent que l'on fasse jurer l'accusé, le gouverneur (ou le juge) s'acquitte alors du prix du sang (<em>Al-Diya</em>) en le prélevant sur le Trésor public (<em>Bayt al-Mâl</em>). Cela s'appuie sur le fait que lorsque les Ansârs refusèrent de s'en remettre aux serments des Juifs, le Prophète <span dir="rtl">ﷺ</span> régla lui-même le prix du sang de la victime sur les fonds du Trésor public. De plus, puisqu'il ne reste aucune autre voie légale pour prouver la culpabilité de l'accusé, la compensation financière incombe au Trésor public afin que le sang d'une personne protégée ne soit pas versé en pure perte, sans la moindre réparation.</p>
<p>⁕ Les juristes ont divergé sur ce que la <em>Qasâmah</em> permet d'établir concrètement lorsque ses conditions sont remplies et que les proches de la victime ont prêté les cinquante serments.</p>
<p>L'avis prépondérant (<em>Al-Sahîh</em>) est que si les conditions requises pour le talion sont réunies, en plus de la validation complète des conditions de la <em>Qasâmah</em>, celle-ci permet bel et bien d'appliquer la peine du talion (<em>Al-Qisâs</em>) à l'encontre de l'accusé. La preuve en est la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl"><br />
« يَحْلِفُ خَمْسُونَ مِنْكُمْ عَلَى رَجُلٍ مِنْهُمْ، فَيُدْفَعُ إِلَيْكُمْ بِرُمَّتِهِ »</span></p>
<p><em><strong>« Cinquante d’entre vous doivent prêter serment contre un homme parmi eux, et il vous sera alors entièrement livré. »</strong></em></p>
<p>Et dans une version rapportée par l'Imam Muslim :</p>
<p class="ar"><span dir="rtl"><br />
« وَيُسَلَّمُ إِلَيْكُمْ »</span></p>
<p><em><strong>« ...et il vous sera remis. »</strong></em> <a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a></p>
<p><em><br />
</em>Par conséquent, la <em>Qasâmah</em> tient lieu de preuve irréfutable (<em>Al-Bayyinah</em>).</p>
<p><strong>L'érudit Ibn al-Qayyim</strong> <a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a> <strong>~ qu'Allah lui fasse miséricorde ~ a dit concernant l'établissement du jugement par la Qasâmah :</strong> <em>« Il ne s'agit pas d'accorder [gain de cause] sur la base d'une simple accusation. C'est en réalité fondé sur une preuve manifeste qui laisse fortement présumer la véracité [de la plainte], d'une force supérieure à la présomption apportée par deux témoins. Cette preuve, c'est le Lawth (l'indice de suspicion), l'animosité flagrante et la présomption manifeste. Le Législateur a donc renforcé ce motif en faisant prêter serment à cinquante personnes parmi les proches de la victime dont il est impossible qu'ils s'accordent tous à accuser une personne innocente d'un crime de sang qu'elle n'a pas commis. Quant à la parole du Prophète <span dir="rtl">ﷺ</span> :</em></p>
<p class="ar"><span dir="rtl">«وَلَوْ يُعْطَى أُنَاسٌ بِدَعْوَاهُمْ»</span></p>
<p><em><strong>“Si l'on accordait aux gens leurs revendications sur la base de leur simple accusation...”</strong></em> <a href="#fn6" class="footnote-ref" id="fnref6" role="doc-noteref"><sup>6</sup></a> , <em>elle ne contredit en rien la Qasâmah, car ce qui a été réfuté [dans ce hadith], c'est le fait d'accorder un droit sur la base d'une accusation pure et simple (dénuée de tout indice fort)... »</em> Fin de citation.</p>
<p><strong>Les juristes ~ qu'Allah leur fasse miséricorde ~ ont dit :</strong> Quiconque meurt piétiné dans la cohue de la prière du vendredi ou durant le Tawâf (les circonvolutions autour de la Ka'bah), le prix de son sang (<em>Al-Diya</em>) doit être payé par le Trésor public (<em>Bayt al-Mâl</em>). Cela s'appuie sur ce qui a été rapporté d'après 'Omar et 'Alî :</p>
<p><em><strong>« Un homme trouva la mort dans la bousculade de la foule à 'Arafah. Sa famille vint alors trouver 'Omar [qui était calife], et celui-ci dit : “Apportez la preuve de l'identité de son meurtrier”. 'Alî dit alors : “Ô Commandeur des croyants ! Le sang d'un homme musulman ne saurait être versé en pure perte (sans compensation). Si tu découvres son meurtrier, [applique la sentence], sinon, verse le prix de son sang depuis le Trésor public” »</strong></em> <a href="#fn7" class="footnote-ref" id="fnref7" role="doc-noteref"><sup>7</sup></a>.</p>
