<h2 id="بسم-الله-الرحمن-الرحيم"><span dir="rtl">بِسْمِ اللهِ الرَّحْمَنِ الرَّحِيمِ</span></h2>
<p><strong>Chapitre sur les règles du meurtre et ses différentes catégories</strong></p>
<p>⁕ Certes, nos jurisconsultes (Fuqahâ) — qu'Allah leur fasse miséricorde — ont défini le terme <em>Al-Jinâyât</em> comme étant le pluriel de <em>Jinâyah</em> (infraction criminelle / agression). Linguistiquement, cela signifie : l'agression (ou la transgression) contre un corps, un bien ou l'honneur.</p>
<p>Ils ont ainsi consacré au premier type d'entre elles — à savoir l'agression contre le corps — le « Livre des infractions criminelles » (<em>Kitâb Al-Jinâyât</em>). Et ils ont consacré aux deuxième et troisième types — qui sont l'agression contre les biens et l'honneur — le « Livre des peines légales » (<em>Kitâb Al-Hudûd</em>).</p>
<p>⁕ L'agression contre le corps est ce qui implique (l'application du) talion, ou (une compensation) financière, ou une expiation.</p>
<p>⁕ Et les musulmans ont convergé à l'unanimité (Ijmâ') sur l'interdiction du meurtre sans droit, et la preuve de cela provient du Livre (le Coran) et de la Sunnah.</p>
<p>⁃ Allah Le Très Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿وَلَا تَقْتُلُوا النَّفْسَ الَّتِي حَرَّمَ اللهُ إِلَّا بِالْحَقِّ﴾ [الإسراء: ٣٣]</span></p>
<p><strong>﴾ Et, sauf en droit, ne tuez point la vie qu'Allah a rendue sacrée. ﴿</strong> [Al-Isrâ' : 33].</p>
<p>⁃ Et le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="rtl">«لَا يَحِلُّ دَمُ امْرِئٍ مُسْلِمٍ إِلَّا بِإِحْدَى ثَلَاثٍ: الثَّيِّبُ الزَّانِي، وَالنَّفْسُ بِالنَّفْسِ، وَالتَّارِكُ لِدِينِهِ المُفَارِقُ لِلْجَمَاعَةِ»</span></p>
<p><em><strong>« Il n'est pas licite de verser le sang d'un musulman, si ce n'est dans l'un de ces trois cas : le marié qui commet l'adultère, une vie pour une vie (le talion), et celui qui abandonne sa religion et se sépare de la communauté »</strong></em>, rapporté par Muslim <a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a> et d'autres, et les hadiths ayant ce sens sont nombreux.</p>
<p>Quiconque tue un musulman par agression, Allah Le Très Haut l'a certes menacé par Sa parole :</p>
<p class="ar"><span dir="rtl">﴿وَمَن يَقْتُلْ مُؤْمِناً مُّتَعَمِّداً فَجَزَاؤُهُ جَهَنَّمُ خَالِداً فِيهَا وَغَضِبَ اللهُ عَلَيْهِ وَلَعَنَهُ وَأَعَدَّ لَهُ عَذَاباً عَظِيماً ٩٣﴾ [النساء].</span></p>
<p><strong>﴾ Quiconque tue intentionnellement un croyant, sa rétribution sera l'Enfer, pour y demeurer éternellement. Allah l'a frappé de Sa colère, l'a maudit et lui a préparé un énorme châtiment. ﴿</strong> [An-Nisâ' : 93].</p>
<p>⁕ Et son statut juridique est qu'il est considéré comme pervers (<em>fâsiq</em>), en raison de sa commission d'un grand péché parmi les péchés majeurs.</p>
<p>Son affaire dépend de Allah : s'Il veut, Il le châtie, et s'Il veut, Il lui pardonne. Le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿إِنَّ اللَّهَ لَا يَغْفِرُ أَن يُشْرَكَ بِهِ وَيَغْفِرُ مَا دُونَ ذَٰلِكَ لِمَن يَشَاءُ﴾ [النساء: ٤٨]</span></p>
<p><strong>﴾ Certes, Allah ne pardonne pas qu'on Lui donne des associés, mais Il pardonne, à qui Il veut, les péchés moindres que cela. ﴿</strong> [An-Nisâ : 48]. Il est donc soumis à la volonté [divine], car son péché est en deçà du polythéisme (<em>shirk</em>).</p>
<p>Et ceci s'applique s'il ne s'est pas repenti. Cependant, s'il se repent, son repentir est alors accepté. En effet, Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿قُلْ يَا عِبَادِيَ الَّذِينَ أَسْرَفُوا عَلَىٰ أَنفُسِهِمْ لَا تَقْنَطُوا مِن رَّحْمَةِ اللَّهِ ۚ إِنَّ اللَّهَ يَغْفِرُ الذُّنُوبَ جَمِيعًا ۚ إِنَّهُ هُوَ الْغَفُورُ الرَّحِيمُ﴾ [الزمر: ٥٣].</span></p>
<p><strong>﴾ Dis : "Ô Mes serviteurs qui avez commis des excès à votre propre détriment, ne désespérez pas de la miséricorde d'Allah. Car Allah pardonne tous les péchés. Oui, c'est Lui le Pardonneur, le Très Miséricordieux." ﴿</strong> [Az-Zumar : 53].</p>
<p>Cependant, le droit de la victime dans l'au-delà ne tombe pas du fait du simple repentir. Au contraire, la victime prélèvera des bonnes actions du meurtrier à la mesure de l'injustice subie, ou bien Allah lui accordera une compensation de Sa part. De même, le droit de la victime ne tombe pas par l'application de la peine de talion (<em>qisâs</em>), car le talion est un droit qui revient exclusivement aux ayants droit (<em>awliyâ</em>) de la victime.</p>
<p>L'érudit Ibn al-Qayyim <a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a> (qu'Allah lui fasse miséricorde) a dit : <em>« L'analyse rigoureuse est que trois droits sont liés au meurtre : un droit pour Allah, un droit pour la victime et un droit pour l'ayant droit (walî). Si le meurtrier se livre de lui-même à l'ayant droit, par regret pour ce qu'il a fait, par crainte d'Allah, et qu'il se repent d'un repentir sincère : le droit d'Allah tombe par le repentir, et le droit des ayants droit tombe par l'application du talion, la conciliation ou le pardon. Reste alors le droit de la victime, qu'Allah compensera au Jour de la Résurrection en faveur de Son serviteur repentant, et Il rétablira la concorde entre lui et elle. »</em></p>
<p>⁕ <strong>Le meurtre se divise en trois catégories</strong> selon la majorité des gens de science, à savoir : <strong>le meurtre intentionnel</strong> (<em>al-qatl al-'amd</em>), l<strong>e meurtre quasi-intentionnel</strong> (<em>al-qatl shibh al-'amd</em>) et <strong>le meurtre involontaire</strong> (<em>al-qatl al-khata'</em>).</p>
<p>⁃ Quant au meurtre intentionnel et au meurtre involontaire, ils ont tous deux été mentionnés dans le Noble Coran. Le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿وَمَا كَانَ لِمُؤْمِنٍ أَن يَقْتُلَ مُؤْمِنًا إِلَّا خَطَأً ۚ وَمَن قَتَلَ مُؤْمِنًا خَطَأً فَتَحْرِيرُ رَقَبَةٍ مُّؤْمِنَةٍ وَدِيَةٌ مُّسَلَّمَةٌ إِلَىٰ أَهْلِهِ إِلَّا أَن يَصَّدَّقُوا﴾ الْآيَةَ [النساء: ٩٢] إِلَى قَوْلِهِ: ﴿وَمَن يَقْتُلْ مُؤْمِنًا مُّتَعَمِّدًا فَجَزَاؤُهُ جَهَنَّمُ خَالِدًا فِيهَا وَغَضِبَ اللَّهُ عَلَيْهِ وَلَعَنَهُ وَأَعَدَّ لَهُ عَذَابًا عَظِيمًا﴾ [النساء: ٩٣]</span></p>
<p><strong>﴾ Il n'appartient pas à un croyant de tuer un croyant, si ce n'est par erreur. Quiconque tue un croyant par erreur doit affranchir un esclave croyant et remettre à sa famille le prix du sang (<em>diya</em>), à moins que celle-ci n'en fasse l'aumône... ﴿</strong> jusqu'à la fin du verset [An-Nisâ : 92], et jusqu'à Sa parole : <strong>﴾ Quiconque tue intentionnellement un croyant, sa rétribution sera l'Enfer, pour y demeurer éternellement et Allah courroucé contre lui, l'a maudit et lui a préparé un énorme châtiment. ﴿ [An-Nisâ : 93].</strong></p>
<p>⁃ Quant au meurtre quasi-intentionnel (<em>shibh al-'amd</em>), il est établi par la Sunnah purifiée, comme cela est rapporté dans le hadith de 'Amr ibn Shou'ayb, d'après son père, d'après son grand-père, selon lequel le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="rtl">«عَقْلُ شِبْهِ الْعَمْدِ مُغَلَّظٌ مِثْلُ عَقْلِ الْعَمْدِ، وَلَا يُقْتَلُ صَاحِبُهُ، وَذَلِكَ أَنْ يَنْزُغَ الشَّيْطَانُ بَيْنَ النَّاسِ، فَتَكُونَ دِمَاءٌ فِي عِمِّيَّا فِي غَيْرِ ضَغِينَةٍ وَلَا حَمْلِ سِلَاحٍ»</span></p>
<p><em><strong>« Le prix du sang ('aql/diya) pour le meurtre quasi-intentionnel est alourdi de la même manière que celui du meurtre intentionnel, mais son auteur n'est pas mis à mort. Cela se produit lorsque le Diable sème la discorde entre les gens, de sorte que du sang soit versé dans une mêlée confuse, sans haine préalable ni port d'arme. »</strong></em> Rapporté par Ahmad et Aboû Dâwoûd <a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a>.</p>
<p>Et d'après 'Abdoullah ibn 'Amr, le Messager d'Allah <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="rtl">«أَلَا إِنَّ قَتِيلَ الْخَطَأِ شِبْهِ الْعَمْدِ قَتِيلَ السَّوْطِ وَالْعَصَا فِيهِ مِائَةٌ مِنَ الْإِبِلِ، مِنْهَا أَرْبَعُونَ فِي بُطُونِهَا أَوْلَادُهَا»</span></p>
<p><em><strong>« Certes, pour la victime du meurtre involontaire qui s'apparente au meurtre intentionnel — c'est-à-dire la victime tuée par un fouet ou un bâton — le prix du sang est de cent chamelles, dont quarante pleines (portant leurs petits dans leur ventre). »</strong></em> Rapporté par les cinq, à l'exception d'At-Tirmidhî <a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a>.</p>
<p>⁕ Le meurtre intentionnel (<em>al-qatl al-'amd</em>) se définit comme le fait de viser délibérément une personne que l'on sait être un être humain protégé (<em>ma'soûm</em>), et de la tuer au moyen d'un instrument ou d'un acte dont on estime qu'il entraîne généralement la mort.</p>
<p>Nous déduisons de cette définition que le meurtre n'est qualifié d'intentionnel que si les conditions suivantes sont réunies :</p>
<p><strong>La première condition :</strong> La présence de l'intention chez le meurtrier, c'est-à-dire la volonté de tuer.</p>
<p><strong>La deuxième condition :</strong> Qu'il sache que la personne qu'il a l'intention de tuer est un être humain dont le sang est sacré/protégé (<em>ma'soûm ad-dam</em>).</p>
<p><strong>La troisième condition :</strong> Que l'instrument avec lequel il a perpétré le meurtre soit de nature à tuer habituellement, qu'il s'agisse d'un objet tranchant/perçant (<em>mouhaddad</em>) ou non.</p>
<p>Si l'une de ces conditions fait défaut, le meurtre n'est alors pas qualifié d'intentionnel, car l'absence de l'intention n'implique pas l'application de la peine de talion (<em>al-qawad</em>). De même, le fait que le meurtre survienne par un moyen dont on estime qu'il n'entraîne pas généralement la mort relève de la pure coïncidence, en raison d'une autre cause ayant provoqué la mort.</p>
<p>⁕ Le meurtre intentionnel revêt neuf formes, connues par induction (<em>istiqrâ'</em>) :</p>
<p><strong>La première :</strong> Qu'il le blesse avec un objet qui pénètre le corps, tel qu'un couteau, une broche (ou grande aiguille) ou tout autre objet tranchant/perçant similaire.</p>
<p>Al-Muwaffaq [Ibn Qoudâmah] a dit : <em>« Il n'y a aucune divergence à ce sujet entre les savants, pour autant que nous le sachions. »</em></p>
<p><strong>La deuxième :</strong> Qu'il le tue au moyen d'un objet lourd (<em>mouthaqqal</em>) de grande taille, comme une pierre ou autre. Si la pierre est petite, ce n'est pas un meurtre intentionnel, sauf s'il la frappe à un endroit mortel, ou si la victime se trouve dans un état de faiblesse physique (due à la maladie, au jeune âge, à la vieillesse, à une chaleur intense, un froid extrême ou autre), ou encore s'il répète les coups avec cette petite pierre jusqu'à ce que mort s'ensuive. L'équivalent de la mise à mort par objet lourd s'applique s'il fait écrouler un mur sur la victime, l'écrase avec une voiture, ou la précipite d'un lieu élevé et qu'elle meurt.</p>
<p><strong>La troisième :</strong> Qu'il le jette en pâture à un animal féroce, tel qu'un lion, ou à un serpent. En effet, lorsqu'il choisit délibérément de le livrer à ces agents mortels, il a l'intention de le tuer par un moyen qui donne généralement la mort.</p>
<p><strong>La quatrième :</strong> Qu'il le jette dans un feu ou dans une eau qui le submerge, alors qu'il lui est impossible de s'en extirper.</p>
<p><strong>La cinquième :</strong> Qu'il l'étrangle à l'aide d'une corde ou autre, ou qu'il lui obstrue la bouche et le nez, provoquant ainsi sa mort par asphyxie.</p>
<p><strong>La sixième :</strong> Qu'il l'enferme (le séquestre) et le prive de nourriture et de boisson, de sorte qu'il en meure dans un laps de temps durant lequel on meurt généralement, et alors qu'il lui est impossible d'appeler à l'aide ou de chercher de quoi subsister ; car un tel traitement est généralement mortel.</p>
<p><strong>La septième :</strong> Qu'il le tue par une sorcellerie (<em>sihr</em>) qui tue généralement, alors que le sorcier sait pertinemment que ce procédé est généralement mortel.</p>
<p><strong>La huitième :</strong> Qu'il lui fasse boire un poison à son insu, ou qu'il le mélange à sa nourriture, de sorte que la victime le consomme en ignorant totalement la présence de poison à l'intérieur.</p>
<p><strong>La neuvième :</strong> Que des témoins témoignent contre lui d'un acte impliquant sa mise à mort, tel que l'adultère (<em>zinâ</em> d'une personne mariée), l'apostasie (<em>riddah</em>) ou un meurtre, et qu'il soit exécuté, puis que les témoins reviennent sur leur témoignage en déclarant : <em>« Nous avons prémédité sa mort »</em>. Ils sont alors mis à mort en représailles (par talion), car ils sont parvenus à causer sa mort par un moyen qui tue généralement.</p>
<p>⁕ Le meurtre quasi-intentionnel (<em>shibh al-'amd</em>) a été défini par les juristes (<em>fouqahâ</em>), qu'Allah leur fasse miséricorde, par leur formulation : <em><strong>« Il consiste à viser délibérément [une personne] par une agression qui ne tue pas habituellement</strong></em> <a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a><em><strong>, mais dont la victime décède à la suite. Que cela soit fait avec une intention d'hostilité envers elle ou dans un but d'éducation/correction (ta'dîb) en ayant commis un excès. Cette catégorie d'infractions a été qualifiée de "quasi-intentionnelle" car le coupable avait l'intention de commettre l'acte, mais a causé la mort involontairement. »</strong></em></p>
<p>Ibn Roushd <a href="#fn6" class="footnote-ref" id="fnref6" role="doc-noteref"><sup>6</sup></a> a dit : <em>« Quiconque a l'intention de frapper un homme en particulier au moyen d'un instrument qui ne tue pas habituellement voit son statut osciller entre le meurtre intentionnel et le meurtre involontaire. Sa ressemblance avec le meurtre intentionnel réside dans le fait qu'il a délibérément visé à le frapper, tandis que sa ressemblance avec le meurtre involontaire réside dans le fait qu'il l'a frappé avec un objet par lequel on ne cherche pas à donner la mort. »</em> Fin de citation.</p>
<p>⁕ <strong>Parmi les exemples du meurtre quasi-intentionnel :</strong> le cas où une personne en frappe une autre, ailleurs que sur une zone mortelle, à l'aide d'un fouet ou d'un petit bâton, ou lui donne un coup de poing ou une gifle sur une partie non mortelle, et que la victime en meurt. Cela est qualifié de quasi-intentionnel. Cet acte rend obligatoire une expiation (<em>kaffârah</em>) imputable sur les biens propres du coupable, qui consiste à affranchir un esclave ; s'il n'en trouve pas, il doit alors jeûner deux mois consécutifs, tout comme cela est requis pour le meurtre involontaire. De même, le prix du sang alourdi (<em>ad-diya al-mughalladhah</em>) devient obligatoire et incombe à la charge du groupe familial du coupable (<em>'âqilah</em>), en vertu du hadith d'Aboû Hourayrah :</p>
<p class="ar"><span dir="rtl">«اقْتَتَلَتِ امْرَأَتَانِ مِنْ هُذَيْلٍ، فَرَمَتْ إِحْدَاهُمَا الْأُخْرَى بِحَجَرٍ، فَقَتَلَتْهَا وَمَا فِي بَطْنِهَا، فَقَضَى رَسُولُ اللَّهِ ﷺ بِدِيَةِ الْمَرْأَةِ عَلَى عَاقِلَتِهَا»</span></p>
<p><em><strong>« Deux femmes de la tribu de Houdhayl se disputèrent ; l'une d'elles lança une pierre sur l'autre, la tuant ainsi que l'enfant qu'elle portait dans son ventre. Le Messager d'Allah <span dir="rtl">ﷺ</span> a alors jugé que le prix du sang de la femme incombait à son groupe familial ('âqilah). »</strong></em> Rapporté unanimement (Al-Boukhârî et Mouslim) <a href="#fn7" class="footnote-ref" id="fnref7" role="doc-noteref"><sup>7</sup></a>.</p>
<p>Ce hadith démontre ainsi l'absence d'obligation de la peine de talion (<em>qisâs</em>) dans le meurtre quasi-intentionnel, et prouve que son prix du sang incombe à la <em>'âqilah</em> (le groupe familial) du coupable. Étant donné qu'il s'agit d'un homicide n'entraînant pas le talion, son prix du sang est supporté par le groupe familial du coupable (<em>'âqilah)</em>, à l'instar du meurtre involontaire.</p>
<p>Ibn al-Moundhir <a href="#fn8" class="footnote-ref" id="fnref8" role="doc-noteref"><sup>8</sup></a> a dit : <strong>«</strong> <em>Tous les gens de science dont nous avons conservé les avis sont unanimes sur le fait que [le prix du sang] incombe au groupe familial du coupable ('âqilah). »</em></p>
<p>Al-Muwaffaq [Ibn Qoudâmah] ainsi que d'autres ont dit : <em>« Nous ne connaissons aucune divergence sur le fait qu'elle [la diya] incombe à la 'âqilah... »</em> Fin de citation.</p>
<p>⁕ <strong>Quant au meurtre involontaire (<em>qatl al-khata'</em>),</strong> les juristes (<em>fouqahâ</em>) l'ont défini par leur formulation : <strong>« Il s'agit pour une personne d'accomplir un acte qui lui est initialement autorisé, comme le fait de tirer sur un gibier ou une cible, mais d'atteindre un être humain protégé (<em>ma'soûm</em>) qu'elle ne visait pas, et de provoquer sa mort ; ou encore de tuer un musulman se trouvant dans les rangs des mécréants en le prenant pour un mécréant. »</strong></p>
<p>⁕ <strong>L'acte intentionnel de l'enfant et du fou est assimilé au meurtre involontaire</strong>, car tous deux sont dépourvus d'intention réelle. Ils ont donc le même statut que la personne responsable (<em>moukallaf</em>) qui commet une erreur involontaire.</p>
<p>⁕ <strong>Est également assimilé au meurtre involontaire l'homicide par cause indirecte (<em>al-qatl bi-t-tasabboub</em>)</strong>, comme le fait de creuser un puits ou une fosse sur une voie publique, ou d'y stationner un véhicule, provoquant ainsi la mort d'un être humain.</p>
<p>⁕ <strong>Le meurtre involontaire rend obligatoire l'expiation (<em>kaffârah</em>) imputable sur les biens propres du meurtrier</strong>, qui consiste à affranchir un esclave croyant. S'il ne trouve pas d'esclave, ou s'il en trouve un mais n'a pas les moyens d'en payer le prix, il doit alors jeûner deux mois consécutifs. De plus, le prix du sang (<em>diya</em>) devient obligatoire et incombe à sa <em>'âqilah</em>, qui correspond aux membres masculins de sa parenté paternelle (<em>'asabah</em>).</p>
<p>⁕ Et quiconque tue un musulman se trouvant dans les rangs des mécréants en le pensant lui-même mécréant, il ne lui incombe alors pour cela que l'expiation (<em>Al-Kaffârah</em>) seulement, en raison de la parole d'Allah le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿وَمَا كَانَ لِمُؤْمِنٍ أَن يَقْتُلَ مُؤْمِناً إِلَّا خَطَئاً وَمَن قَتَلَ مُؤْمِناً خَطَئاً فَتَحْرِيرُ رَقَبَةٍ مُّؤْمِنَةٍ وَدِيَةٌ مُّسَلَّمَةٌ إِلَىٰ أَهْلِهِ إِلَّا أَن يَصَّدَّقُواْ فَإِن كَانَ مِن قَوْمٍ عَدُوٍّ لَّكُمْ وَهُوَ مُؤْمِنٌ فَتَحْرِيرُ رَقَبَةٍ مُّؤْمِنَةٍ وَإِن كَانَ مِن قَوْمٍ بَيْنَكُمْ وَبَيْنَهُم مِّيثَاقٌ فَدِيَةٌ مُّسَلَّمَةٌ إِلَىٰ أَهْلِهِ وَتَحْرِيرُ رَقَبَةٍ مُّؤْمِنَةٍ فَمَن لَّمْ يَجِدْ فَصِيَامُ شَهْرَيْنِ مُتَتَابِعَيْنِ تَوْبَةً مِّنَ اللَّهِ وَكَانَ اللَّهُ عَلِيماً حَكِيماً﴾ [النساء: ٩٢].</span></p>
<p><strong>﴾ Il n'appartient pas à un croyant de tuer un autre croyant, si ce n'est par erreur. Quiconque tue un croyant par erreur, qu'il affranchisse un esclave croyant et remette à sa famille le prix du sang (la Diya), à moins que celle-ci n'y renonce par charité. Si le tué appartenait à un peuple ennemi de vous, tout en étant lui-même croyant, alors l'expiation consiste en l'affranchissement d'un esclave croyant. S'il appartenait à un peuple auquel vous êtes liés par un pacte, le prix du sang doit être remis à sa famille et un esclave croyant doit être affranchi. Quiconque n'en trouve pas les moyens doit jeûner deux mois consécutifs, à titre de repentir auprès d'Allah. Et Allah est Omniscient et Sage. ﴿</strong> [Sourate An-Nisâ' : 92].</p>
<p>Il a donc divisé l'homicide involontaire (par erreur) en deux catégories :</p>
<ul>
<li><blockquote>
<p><strong>Une catégorie</strong> dans laquelle l'expiation (<em>Al-Kaffârah</em>) incombe au meurtrier et le prix du sang (<em>An-Diya</em>) incombe à sa famille paternelle (<em>'Âqilah</em>). Cela concerne le fait de tuer un croyant par erreur en dehors des rangs des mécréants, ainsi que le cas où la personne tuée appartient à un peuple avec lequel nous sommes liés par un pacte.</p>
</blockquote></li>
<li><blockquote>
<p><strong>Une catégorie</strong> dans laquelle seule le prix du sang (<em>An-Diya</em>) est obligatoire. Cela concerne le fait de tuer un croyant qui se trouve parmi les mécréants, alors que le meurtrier le pensait lui-même mécréant.</p>
</blockquote></li>
</ul>
<p>L'Imam Ach-Chawkânî (qu'Allah lui fasse miséricorde) a dit dans <em>« Fath al-Qadîr »</em> : <em>« Si le tué appartenait à un peuple ennemi de vous, tout en étant lui-même croyant, alors l'expiation consiste en l'affranchissement d'un esclave croyant. » C'est-à-dire : si la personne tuée appartenait à un peuple ennemi pour vous — qui sont les mécréants en état de guerre (Al-Harbiyyûn) —, et cela concerne le cas du croyant que les musulmans tuent sur la terre des mécréants dont il faisait partie, puis il a embrassé l'Islam mais n'a pas accompli l'hégire (Al-Hijrah). Les musulmans pensaient alors qu'il n'était pas devenu musulman et qu'il demeurait sur la religion de son peuple. Dans ce cas, aucun prix du sang (Diya) n'incombe à son meurtrier, mais il lui incombe plutôt d'affranchir un esclave croyant.</em></p>
<p><em>Et ils (les savants) ont divergé sur la raison de l'annulation du prix du sang (Ad-Diya) :</em></p>
<p><em><strong>- Certains ont dit :</strong> la raison est que les ayants droit du défunt sont des mécréants, et ils n'ont aucun droit à percevoir le prix du sang.</em></p>
<p><em><strong>- D'autres ont dit :</strong> la raison est que la sacralité de celui qui a cru mais n'a pas accompli l'hégire est moindre, en raison de la parole d'Allah le Très-Haut :</em></p>
<p class="ar"><em><span dir="rtl">﴿وَالَّذِينَ آمَنُوا وَلَمْ يُهَاجِرُوا مَا لَكُم مِّن وَلَايَتِهِم مِّن شَيْءٍ﴾ [الأنفال: ٧٢]</span></em></p>
<p><em><strong>« Et quant à ceux qui ont cru et n'ont pas émigré, vous n'êtes liés à eux par aucune alliance (ou protection). »</strong> [Sourate Al-Anfâl : 72].</em></p>
<p><em><strong>- Et certains gens de science ont dit :</strong> son prix du sang est dû et doit être versé au Trésor public (Bayt al-Mâl)... »</em> Fin de citation.</p>
<p>Cheikh al-Islâm Ibn Taymiyyah (qu'Allah lui fasse miséricorde) a dit : <em>« Cela concerne le musulman qui se trouve parmi les mécréants et qui est excusé, comme le prisonnier, ou le musulman qui n'a pas la capacité d'accomplir l'hégire et de sortir de leurs rangs. Quant à celui qui se tient de son plein gré dans les rangs de leur armée pour combattre, il n'est d'aucune manière couvert par une compensation financière (le prix du sang), car il s'est lui-même exposé à la destruction sans excuse valable. »</em></p>
<p>⁕ La preuve de l'obligation de verser le prix du sang (<em>Diya</em>) pour un homicide involontaire (par erreur) par la famille paternelle (<em>'Âqilah</em>) du meurtrier est le hadith d'Abû Hurayrah (qu'Allah l'agrée) :</p>
<p><em>« Le Messager d'Allah (<span dir="rtl">صَلَّى اللَّهُ عَلَيْهِ وَسَلَّم</span>َ) a jugé au sujet du fœtus d'une femme de la tribu des Banû Lihyân, qui était mort-né [à la suite d'un coup], qu'il devait y avoir une compensation (Ghurrah) consistant en un esclave ou une servante. Ensuite, la femme contre laquelle il avait rendu ce jugement de compensation vint à mourir. Le Messager d'Allah (<span dir="rtl">صَلَّى اللَّهُ عَلَيْهِ وَسَلَّم</span>َ) a alors jugé que son héritage revenait à son époux et à ses fils, et que le paiement du prix du sang (Al-'Aql) incombait à ses parents du côté paternel ('Asabah). »</em> Rapporté par Al-Bukhârî et Muslim. <a href="#fn9" class="footnote-ref" id="fnref9" role="doc-noteref"><sup>9</sup></a></p>
<p>Ce hadith prouve donc que le prix du sang (<em>Diya</em>) pour un homicide involontaire incombe à la famille paternelle (<em>'Âqilah</em>), et ils [les savants] ont fait l'unanimité (<em>Ijmâ'</em>) à ce sujet.</p>
<p>Et la sagesse sous-jacente — et Allah est le plus Savant — réside dans le fait qu'imposer le prix du sang sur les biens propres de celui qui a commis l'erreur lui causerait un immense préjudice sans qu'il n'ait commis de péché intentionnel. De plus, l'erreur est un fait fréquent ; lui faire supporter seul la responsabilité financière de sa méprise serait injuste pour ses propres biens.</p>
<p>Cependant, il est indispensable de fixer une compensation pour la personne tuée, car il s'agit d'une âme sacrée, et le fait de laisser son sang couler sans réparation causerait un tort considérable à ses héritiers, en particulier à sa famille. C'est pourquoi le Législateur Sage a rendu obligatoire, pour ceux qui ont le devoir d'alliance et de soutien envers le meurtrier, de l'aider dans cette épreuve. Cela s'apparente à l'obligation de subvenir aux dépenses financières (<em>Nafaqât</em>) ou au rachat des prisonniers.</p>
<p>De surcroît, les membres de la <em>'Âqilah</em> (famille paternelle) sont, de manière générale, ceux qui hériteraient de l'auteur de l'erreur s'il venait à mourir. Ils assument donc pour lui la charge de son délit involontaire selon la règle juridique :</p>
<p class="ar"><span dir="rtl">«الغُنْمُ بِالغُرْمِ».</span></p>
<p>« Le profit va de pair avec la charge » (<em>Al-Ghunmu bi-l-Ghurm</em>).</p>
<p>⁕ Le meurtrier a été chargé de l'expiation (<em>Al-Kaffârah</em>) pour plusieurs raisons :</p>
<p><strong>Premièrement :</strong> Par respect pour l'âme qui s'en est allée.</p>
<p><strong>Deuxièmement :</strong> Du fait que l'homicide n'est jamais totalement exempt d'une négligence de sa part.</p>
<p><strong>Troisièmement :</strong> Afin que le meurtrier ne se retrouve pas déchargé de toute responsabilité, étant donné qu'il n'a rien eu à assumer concernant le prix du sang (<em>Ad-Diya</em>).</p>
<p>⁕ Il y a donc, dans le fait de faire porter le prix du sang à la famille paternelle (<em>Al-'Âqilah</em>) et l'expiation au meurtrier, de multiples sagesses et intérêts. Gloire donc au Sage, à l'Omniscient, qui a légiféré pour les hommes ce qui les réforme et leur est profitable dans leur religion et leur vie d'ici-bas.</p>
<p>⁕ <strong>N'entrent pas dans la <em>'Âqilah</em> :</strong> l'esclave, l'indigent, l'enfant, le fou, la femme, ainsi que celui qui diverge de la religion du coupable. Car ceux-là ne font pas partie des gens de soutien et d'assistance.</p>
<p>⁕ Le prix du sang pour un homicide involontaire est échelonné pour la <em>'Âqilah</em> sur <strong>trois ans</strong>. Le juge s'efforce de faire porter à chacun d'eux ce qu'il est capable de supporter, en commençant par les plus proches parents, puis les plus proches suivants.</p>
<p>Cheikh al-Islâm Ibn Taymiyyah (qu'Allah lui fasse miséricorde) a dit :</p>
<p><em>« Le prix du sang n'est pas échelonné pour la 'Âqilah si le dirigeant (Al-Imâm) juge que l'intérêt général réside en cela... »</em> Fin de citation.</p>
