<p>⁕ Les montants du prix du sang (<em>diya</em>) pour l'homicide varient en fonction de l'Islam, de la liberté (statut d'homme libre ou d'esclave), du sexe masculin ou féminin, et selon que la personne tuée soit déjà née de manière visible ou qu'elle soit encore un fœtus dans le ventre de sa mère.</p>
<p>⁕ <strong>Le montant le plus élevé est celui du prix du sang d'un homme musulman libre.</strong> Il atteint mille mithqâls d'or, ou douze mille dirhams parmi les dirhams islamiques (dont chaque dizaine équivaut à sept mithqâls), ou cent chameaux, ou deux cents vaches, ou deux mille moutons. Cela repose sur le Hadith rapporté par Abû Dâwûd d'après Jâbir (qu'Allah l'agrée) : <em><strong>« Le Messager d'Allah</strong></em> <span dir="rtl">ﷺ</span> <em><strong>a imposé pour le prix du sang cent chameaux à ceux qui possèdent des chameaux, deux cents vaches à ceux qui possèdent des bovins, et deux mille moutons à ceux qui possèdent des ovins »</strong></em> <a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a>. Et d'après 'Ikrimah, selon Ibn 'Abbâs : <em><strong>« Un homme fut tué, et le Prophète</strong></em> <span dir="rtl">ﷺ</span> <em><strong>fixa le prix de son sang à douze mille dirhams »</strong></em>, rapporté par Abû Dâwûd et Ibn Mâjah <a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a>. De plus, il est mentionné dans la lettre de 'Amr ibn Hazm : <em><strong>« Pour ceux qui possèdent de l'or, [le montant est de] mille dinars »</strong></em>, rapporté par An-Nasâ'î et d'autres <a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a>.</p>
<p>⁕ <strong>Les gens de science divergent [sur la question suivante] :</strong> ces catégories mentionnées constituent-elles toutes des bases fondamentales (Usoûl) pour le prix du sang ? De sorte que si la personne redevable de la Diya s'acquitte de l'une d'entre elles, l'ayant droit (le tuteur de la victime) est dans l'obligation de l'accepter, que le responsable du crime appartienne à la catégorie de possesseurs de ce type de bien ou non, car il a fourni une base d'acquittement valable pour l'obligation qui lui incombe. Ceci est l'avis d'un groupe parmi les gens de science.</p>
<p><strong>Le second avis énonce que la seule et unique base fondamentale est le chameau.</strong> Ceci est l'avis de la majorité des savants (<em>Jumhoûr al-'Ulamâ</em>), en raison de la parole du Prophète (<span dir="rtl">ﷺ</span>) :</p>
<p class="ar"><span dir="rtl">«فِي النَّفْسِ المُؤْمِنَةِ مِئَةٌ مِنَ الإِبِلِ»</span></p>
<p><em><strong>« Pour [la vie d'] une âme croyante, [le prix du sang] est de cent chameaux »</strong></em><a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a></p>
<p>et de sa parole (<span dir="rtl">ﷺ</span>) :</p>
<p class="ar"><span dir="rtl">«أَلَا إِنَّ فِي قَتِيلِ عَمْدِ الخَطَأِ مِئَةً مِنَ الإِبِلِ»</span></p>
<p><em><strong>« Certes, pour l'homicide semi-intentionnel ('Amd al-Khata*), [le prix du sang] est de cent chameaux »</strong></em>.<a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a></p>
<p>De plus, il est rapporté par Abû Dâwûd qu'Oumar se leva pour prononcer un discours et dit : <em><strong>« Prenez garde ! Les chameaux sont devenus chers. »</strong></em> L'auteur dit : <em><strong>« Il imposa alors [le prix du sang] à ceux qui possèdent de l'or à hauteur de mille dinars, à ceux qui possèdent de l'argent (Al-Wariq) à hauteur de douze mille [dirhams], à ceux qui possèdent des bovins à hauteur de deux cents vaches, à ceux qui possèdent des ovins à hauteur de deux mille moutons, et à ceux qui possèdent des habits à hauteur de deux cents parures (Hullah) »</strong></em><a href="#fn6" class="footnote-ref" id="fnref6" role="doc-noteref"><sup>6</sup></a>.</p>
<p>Une autre preuve est que le Prophète (<span dir="rtl">ﷺ</span>) a durci le prix du sang en se basant sur les chameaux pour le meurtre volontaire, et l'a allégé [toujours en chameaux] pour l'homicide involontaire, et les gens de science sont unanimes à ce sujet. Le chameau constitue donc la base fondamentale.</p>
<p><strong>Et cet avis est l'avis prépondérant (<em>Al-Râjih</em>).</strong> Par conséquent, toutes les autres catégories mentionnées en dehors des chameaux ne sont prises en considération que par voie d'estimation de valeur (<em>Taqwîm</em>) [par équivalence].</p>
<p>⁕ <strong>Le prix du sang (La Diya) est alourdi en cas de meurtre volontaire (<em>'Amd</em>) ou semi-intentionnel (<em>Shibh 'Amd</em>). Ainsi, les cent chameaux sont répartis en quatre quarts égaux :</strong> vingt-cinq <em>Bint Makhâd</em> (chamelles entamant leur deuxième année), vingt-cinq <em>Bint Laboûn</em> (chamelles entamant leur troisième année), vingt-cinq <em>Hiqqah</em> (chamelles entamant leur quatrième année) et vingt-cinq <em>Jadha'ah</em> (chamelles entamant leur cinquième année).</p>
<p>Cela s'appuie sur ce qu'a rapporté Az-Zuhrî d'après As-Sâ'ib ibn Yazîd, qui a dit : <em><strong>« À l'époque du Messager d'Allah (<span dir="rtl">ﷺ</span>), le prix du sang était réparti en quatre quarts : vingt-cinq Jadha'ah, vingt-cinq Hiqqah, vingt-cinq Bint Laboûn et vingt-cinq Bint Makhâd »</strong></em> <a href="#fn7" class="footnote-ref" id="fnref7" role="doc-noteref"><sup>7</sup></a>.</p>
<p>Si le redevable apporte les chameaux selon cette répartition précise, l'ayant droit (le tuteur de la victime) est dans l'obligation de les accepter. S'il le souhaite, [le coupable] peut également s'acquitter de leur valeur financière, selon ce que valent ces catégories de chameaux à chaque époque respective.</p>
<p>⁕ Le prix du sang (La Diya) est allégé en cas d'homicide involontaire (<em>Al-Khata</em>), de sorte que les cent chameaux sont répartis en <strong>cinq catégories [égales] :</strong> vingt <em>Bint Makhâd</em> (chamelles entamant leur 2ème année), vingt <em>Bint Laboûn</em> (chamelles entamant leur 3ème année), vingt <em>Hiqqah</em> (chamelles entamant leur 4ème année), vingt <em>Jadha'ah</em> (chamelles entamant leur 5ème année), et vingt <em>Banû Makhâd</em> (chameaux mâles entamant leur 2ème année). On doit fournir ces catégories-là ou bien leur valeur financière, selon ce qu'elles valent à chaque époque respective.</p>
<p><strong>La <em>Bint Makhâd</em> est celle qui a un an révolu, la <em>Bint Laboûn</em> celle qui a deux ans révolus, la <em>Hiqqah</em> celle qui a trois ans révolus, et la <em>Jadha'ah</em> celle qui a quatre ans révolus.</strong></p>
<p>⁕ <strong>Le prix du sang (La Diya) d'un homme libre parmi les gens du Livre (juif ou chrétien), qu'il soit citoyen protégé (<em>Dhimmî</em>), sous pacte de sécurité (<em>Musta'man</em>) ou sous traité de paix (<em>Mu'âhad</em>), équivaut à la moitié du prix du sang d'un musulman.</strong> Cela repose sur le hadith de 'Amr ibn Shu'ayb, d'après son père, d'après son grand-père : <em><strong>« Le Prophète (<span dir="rtl">ﷺ</span>) a décrété que le prix du sang ('Aql*) des gens du Livre est la moitié du prix du sang des musulmans »</strong></em>, rapporté par Ahmad, Abû Dâwûd et d'autres <a href="#fn8" class="footnote-ref" id="fnref8" role="doc-noteref"><sup>8</sup></a>.</p>
<p>⁕ <strong>Le prix du sang d'un majousi (zoroastrien) — qu'il soit <em>Dhimmî</em>, <em>Mu'âhad</em> ou <em>Musta'man</em> — ainsi que le prix du sang d'un idolâtre (<em>Wathanî</em>) sous traité de paix ou sous pacte de sécurité, est de huit cents dirhams islamiques.</strong> Cela s'appuie sur ce qu'a rapporté Ibn 'Adî d'après 'Uqbah ibn 'Âmir (qu'Allah l'agrée) sous forme prophétique (<em>Marfoû'</em>) : <em><strong>« Le prix du sang du majousi est de huit cents dirhams »</strong></em> <a href="#fn9" class="footnote-ref" id="fnref9" role="doc-noteref"><sup>9</sup></a>. C'est d'ailleurs l'avis de la majorité des gens de science.</p>
<p>⁕ <strong>Le prix du sang des femmes parmi les gens du Livre, les zoroastriens et les adorateurs d'idoles équivaut à la moitié du prix du sang de leurs hommes, tout comme le prix du sang des femmes musulmanes équivaut à la moitié de celui de leurs hommes.</strong></p>
<p><strong>Ibn al-Mundhir a dit :</strong> <em>« Les gens de science sont unanimes sur le fait que le prix du sang de la femme est la moitié du prix du sang de l'homme »</em>. Et il est mentionné dans la lettre de 'Amr ibn Hazm : <em>« Le prix du sang de la femme est à la moitié du prix du sang de l'homme »</em>.</p>
<p><strong>L'érudit Ibn al-Qayyim</strong> <a href="#fn10" class="footnote-ref" id="fnref10" role="doc-noteref"><sup>10</sup></a> <strong>(qu'Allah lui fasse miséricorde) a dit :</strong> <em>« Étant donné que la femme a des capacités moindres que celles de l'homme,et que l'homme est d'une utilité plus large qu'elle — car il occupe des fonctions religieuses, des postes de gouvernance, assure la garde des frontières, participe au Jihad, au développement de la terre et à la réalisation des métiers indispensables au bon fonctionnement des intérêts de ce monde, tout comme il défend les affaires terrestres et la religion —, leur valeur respective [sur ce plan] ne pouvait donc pas être égale, cette valeur s'exprimant ici à travers le prix du sang (La Diya). En effet, la Diya de l'homme libre suit la même logique que la valeur estimative d'un esclave ou de tout autre bien de valeur. La sagesse du Législateur a donc requis de fixer la valeur de la femme à la moitié de la sienne, en raison de la différence [de responsabilités et d'impact socio-économique] qui existe entre les deux. »</em></p>
<p>⁕ <strong>L'homme et la femme sont à l'égalité concernant les préjudices corporels dont l'indemnisation est inférieure au tiers du prix du sang total (La Diya).</strong> Cela s'appuie sur le hadith de 'Amr ibn Shu'ayb, d'après son père, d'après son grand-père, rapporté sous forme prophétique (<em>Marfoû'</em>) :</p>
<p class="ar"><span dir="rtl">«عَقْلُ المَرْأَةِ مِثْلُ عَقْلِ الرَّجُلِ حَتَّى تَبْلُغَ الثُّلُثَ مِنْ دِيَتِهِ»</span></p>
<p><em><strong>« Le prix du sang ('Aql*) de la femme est identique à celui de l'homme jusqu'à ce qu'il atteigne le tiers de la Diya de ce dernier »</strong></em>, rapporté par An-Nasâ'î <a href="#fn11" class="footnote-ref" id="fnref11" role="doc-noteref"><sup>11</sup></a>.</p>
<p>De plus, Sa'îd ibn al-Musayyib a dit : <em>« C'est assurément la Sunnah »</em> <a href="#fn12" class="footnote-ref" id="fnref12" role="doc-noteref"><sup>12</sup></a>.</p>
<p><strong>L'Imam Ibn al-Qayyim</strong> <a href="#fn13" class="footnote-ref" id="fnref13" role="doc-noteref"><sup>13</sup></a> <strong>a dit :</strong> <em>« Même si Abû Hanîfah, Ach-Châfi'î et un groupe [de savants] ont divergé sur ce point en disant : "Elle est à la moitié, que le préjudice soit minime ou important", la Sunnah est pourtant plus en droit d'être suivie. La distinction entre ce qui est inférieur au tiers et ce qui lui est supérieur réside dans le fait que ce qui est en deçà du tiers reste minime ; le préjudice subi par la femme a donc été compensé en la mettant à l'égalité avec l'homme. C'est pour cette même raison que le fœtus (Janîn) mâle et femelle ont un prix du sang identique en raison du faible montant de leur Diya — qui est la Ghurrah (l'affranchissement d'un esclave) —, ainsi ce qui est inférieur au tiers a été assimilé au statut du fœtus... »</em>. Fin de citation.</p>
<p>⁕ <strong>Le prix du sang de l'esclave correspond à sa valeur marchande (<em>Qîmatuhu</em>), qu'il soit un homme ou une femme, jeune ou âgé, et quel que soit le montant atteint.</strong> Cela fait l'objet d'un consensus tant que sa valeur reste inférieure à la Diya d'un homme libre. En revanche, si sa valeur marchande atteint ou dépasse la Diya de l'homme libre, l'avis le plus célèbre de l'Imam Ahmad, ainsi que l'avis de Mâlik, Ach-Châfi'î et Abû Yûsuf, est qu'il faut tout de même s'acquitter de sa valeur réelle, quel que soit le montant atteint.</p>
<p>⁕ Il est obligatoire pour le fœtus (<em>Janîn</em>), qu'il soit mâle ou femelle, s'il est expulsé mort à la suite d'un acte criminel [délictueux] <strong>porté contre sa mère, que cet acte soit volontaire ou involontaire, de s'acquitter d'une <em>Ghurrah</em>, [qui correspond à] un esclave ou une servante, dont la valeur estimative équivaut à cinq chameaux.</strong> Cela repose sur le hadith d'Abû Hurayrah (qu'Allah l'agrée) qui a dit : <em><strong>« Le Messager d'Allah (<span dir="rtl">ﷺ</span>) a tranché au sujet du fœtus d'une femme de la tribu des Banû Lihyân, qui avait été expulsé mort, en imposant une Ghurrah : un esclave ou une servante »</strong></em>, (Al-Bukhâri et Muslim) <a href="#fn14" class="footnote-ref" id="fnref14" role="doc-noteref"><sup>14</sup></a>.</p>
<p><strong>Cette <em>Ghurrah</em> fait l'objet d'une succession de la part du fœtus, comme s'il était né vivant, car elle constitue le prix de son sang (sa Diya) ;</strong> et ceci est l'avis de la majorité des savants (<em>Madhab al-Jumhoûr</em>). La valeur de la <em>Ghurrah</em> est estimée à hauteur de cinq chameaux, c'est-à-dire le dixième (1/10) du prix du sang de sa mère.</p>
