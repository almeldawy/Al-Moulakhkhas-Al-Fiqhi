<p>⁕ Les savants ont convergé (consensus) sur la légitimité du talion (<em>Al-Qisâs</em>) en cas de meurtre prémédité, lorsque ses conditions sont réunies. Cela s'appuie sur la parole d'Allah le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿يَا أَيُّهَا الَّذِينَ آمَنُوا كُتِبَ عَلَيْكُمُ الْقِصَاصُ فِي الْقَتْلَى الْحُرُّ بِالْحُرِّ وَالْعَبْدُ بِالْعَبْدِ وَالْأُنْثَى بِالْأُنْثَى...﴾ [البقرة: ١٧٨]</span></p>
<p><strong>﴾ Ô vous qui croyez ! Le talion vous est prescrit en matière de meurtre : homme libre pour homme libre, esclave pour esclave, femme pour femme... ﴿</strong> (Al-Baqarah : 178), et Sa parole :</p>
<p class="ar"><span dir="rtl">﴿وَكَتَبْنَا عَلَيْهِمْ فِيهَا أَنَّ النَّفْسَ بِالنَّفْسِ﴾ [المائدة: ٤٥]</span></p>
<p><strong>﴾ Et Nous y avons prescrit pour eux : vie pour vie ﴿</strong> (Al-Mâ'idah : 45) — ceci concernait la législation de la Thora, et la législation de ceux qui nous ont précédés est une législation pour nous tant que notre propre législation ne s'y oppose pas. Allah le Très-Haut a également dit :</p>
<p class="ar"><span dir="rtl">﴿وَلَكُمْ فِي الْقِصَاصِ حَيَاةٌ يَا أُولِي الْأَلْبَابِ لَعَلَّكُمْ تَتَّقُونَ﴾ [البقرة: ١٧٩]</span></p>
<p><strong>﴾ C'est dans le talion que vous avez une préservation de la vie, ô vous doués d'intelligence, ainsi atteindrez-vous la piété. ﴿</strong> (Al-Baqarah : 179).</p>
<p>L'Imam Al-Chawkânî — qu'Allah lui fasse miséricorde — a dit : « <em>C'est-à-dire que dans ce jugement qu'Allah a institué pour vous, il y a une préservation de la vie. En effet, lorsque l'homme sait qu'il sera mis à mort en application du talion s'il tue autrui, il s'abstient de tuer et se retient de s'y précipiter ou d'y sombrer. Cela équivaut donc à donner la vie aux âmes humaines. C'est là une forme d'éloquence profonde et un style d'une immense clarté : il a désigné le talion, qui est pourtant une mort, comme étant une "vie", en considération de son aboutissement, à savoir que les gens renoncent à s'entre-tuer, préservant ainsi leurs propres existences et pérennisant leur vie. Et Il a adressé ce discours aux personnes douées d'intelligence (Oulî l-Albâb), car ce sont elles qui considèrent les conséquences et se prémunissent contre ce qui nuit à long terme. Quant à celui qui est frappé de folie, d'impulsivité et de légèreté, il ne regarde aucune conséquence lors de ses accès de colère et du bouillonnement de sa fureur, et ne réfléchit pas à l'avenir, à l'instar de ce que disait l'un de leurs brigands [de l'époque préislamique] :</em></p>
<p class="ar"><em><span dir="rtl">سَأَغْسِلُ عَنِّي الْعَارَ بِالسَّيْفِ جَالِباً ... عَلَيَّ قَضَاءَ اللهِ مَا كَانَ جَالِبَا</span></em></p>
<p><em>"Je laverai mon déshonneur par l'épée, dussé-je attirer sur moi le décret d'Allah, quel qu'il soit." »</em></p>
<p><em>Ensuite, Gloire à Lui, a explicité la cause de ce jugement qu'Il a légiféré pour Ses serviteurs par Sa parole : <strong>« ainsi atteindrez-vous la piété »</strong>, c'est-à-dire : vous éviterez le meurtre en préservant et en appliquant le talion, ce qui deviendra alors une cause d'acquisition de la piété... »</em> Fin de citation.</p>
<p>⁕ La Sounnah prophétique est venue établir que l'ayant droit du talion (<em>walî al-qisâs</em>) a le choix entre son application, le pardon en contrepartie du prix du sang (<em>ad-diyah</em>), ou le pardon gracieux (gratuit), ce dernier étant préférable. Abu Hourayrah ؓ a en effet rapporté que le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="rtl">«مَنْ قُتِلَ لَهُ قَتِيلٌ؛ فَهُوَ بِخَيْرِ النَّظَرَيْنِ: إِمَّا أَنْ يُودَى، وَإِمَّا أَنْ يُقَادَ»</span></p>
<p><em><strong>« Quiconque a un proche tué a le choix entre les deux meilleures options : soit le prix du sang lui est versé (an yoûdâ), soit le talion est appliqué (an yoûqâda) »</strong></em>. Rapporté par le groupe (les grands imams du Hadith) <a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a> sauf Al-Tirmidhî.</p>
<p>Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿فَمَنْ عُفِيَ لَهُ مِنْ أَخِيهِ شَيْءٌ فَاتِّبَاعٌ بِالْمَعْرُوفِ وَأَدَاءٌ إِلَيْهِ بِإِحْسَانٍ﴾ [البقرة: ١٧٨].</span></p>
<p><strong>﴾ Mais celui à qui son frère aura pardonné quelque chose doit alors se conformer à l'usage et lui payer des dommages avec générosité. ﴿</strong> (Al-Baqarah : 178).</p>
<p>Ce noble verset ainsi que le hadith démontrent donc que l'ayant droit a le choix entre le talion et le prix du sang : s'il le souhaite, il fait appliquer le talion, et s'il le souhaite, il prend le prix du sang. Cependant, son pardon gracieux est encore meilleur, conformément à la parole du Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿وَأَنْ تَعْفُوا أَقْرَبُ لِلتَّقْوَى﴾ [البقرة: ٢٣٧]</span></p>
<p><strong>﴾ Et que vous pardonniez est plus proche de la piété ﴿</strong> (Al-Baqarah : 237), et en raison du hadith d'Abu Hourayrah :</p>
<p class="ar"><span dir="rtl">«مَا عَفَا رَجُلٌ عَنْ مَظْلَمَةٍ؛ إِلَّا زَادَهُ اللهُ بِهَا عِزّاً»</span></p>
<p><em><strong>« Pas un homme ne pardonne une injustice sans qu'Allah ne l'élève en considération »</strong></em>. Rapporté par Ahmad, Mouslim et Al-Tirmidhî <a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a>.</p>
<p>Le pardon dispensant du talion est donc préférable tant que cela ne conduit pas à un préjudice (<em>mafsadah</em>). En effet, Cheikh al-Islam Ibn Taymiyyah — qu'Allah lui fasse miséricorde — a soutenu l'avis que le pardon n'est pas valable en cas de meurtre par traîtrise (<em>qatlah al-ghîlah</em>), en raison de l'impossibilité de s'en prémunir, à l'instar du meurtre commis lors d'un brigandage (<em>mouhârabah</em>) <a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a>. Le Qâdî a également mentionné un avis selon lequel celui qui assassine les dirigeants (les Imams) doit être mis à mort à titre de peine légale (<em>haddan</em>), car son préjudice est d'ordre général.</p>
<p>De même, l'éminent savant Ibn al-Qayyim a mentionné au sujet de l'histoire des gens d'Uraynah : <em>« Le meurtre par traîtrise impose la mise à mort du tueur à titre de peine légale (hadd). Par conséquent, le pardon ne peut pas l'annuler, et l'équivalence de statut (moukâfa'ah) n'y est pas requise. C'est là la doctrine des gens de Médine, l'une des deux options au sein de l'école de l'imam Ahmad, ainsi que le choix pour lequel le Cheikh [Ibn Taymiyyah] a opté et émis une fatwa — qu'Allah lui fasse miséricorde... »</em>. Fin de citation.</p>
<p>⁕ L'ayant droit de la personne tuée ne peut prétendre au talion que si quatre conditions sont réunies :</p>
<p><strong>La première :</strong> L'inviolabilité (<em>'Ismah</em>) de la personne tuée ; c'est-à-dire qu'elle ne doit pas faire partie de ceux dont le sang est licite (<em>Mouhdar ad-dam</em>). En effet, le talion a été légiféré pour préserver les vies, or celui dont le sang est licite ne bénéficie pas de cette inviolabilité. Ainsi, si un musulman tue un mécréant en état de guerre (<em>Kâfir Harbî</em>), un apostat avant son repentir, ou un adultère [passible de la lapidation], il n'est soumis ni au talion, ni au prix du sang (<em>Diyah</em>). Cependant, il écope d'une peine correctionnelle (<em>Tou'azzar</em>) pour s'être arrogé le droit de statuer à la place de l'autorité légitime (<em>Al-Hâkim</em>).</p>
<p><strong>La deuxième :</strong> Que le tueur soit pubère (<em>Bâligh</em>) et doté de sa raison (<em>'Âqil</em>). Le talion étant une peine majeure (très lourde), il n'est pas permis de l'appliquer à l'enfant ou au fou, en raison de l'absence d'intention criminelle de leur part, ou parce qu'ils ne disposent pas d'un discernement valide. Cela s'appuie également sur la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«رُفِعَ الْقَلَمُ عَنْ ثَلَاثَةٍ: عَنِ النَّائِمِ حَتَّى يَسْتَيْقِظَ، وَعَنِ الصَّبِيِّ حَتَّى يَبْلُغَ، وَعَنِ الْمَجْنُونِ حَتَّى يُفِيقَ»</span></p>
<p><em><strong>« La plume est levée pour trois catégories de personnes : le dormeur jusqu'à ce qu'il se réveille, l'enfant jusqu'à ce qu'il atteigne la puberté, et le fou jusqu'à ce qu'il retrouve la raison »</strong></em><a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a>.</p>
<p>L'Imam Mouwaffaq ad-Dîn Ibn Qoudâmah a dit : <em>« Il n'y a aucune divergence parmi les gens de science sur le fait qu'il n'y a pas de talion applicable à un enfant ni à un fou. Il en va de même pour toute personne ayant perdu l'usage de sa raison pour une cause valable (indépendante de sa volonté), comme le dormeur ou la personne évanouie. »</em></p>
<p><strong>La troisième condition :</strong> L'équivalence (<em>Al-Moukâfa'ah</em>) entre la personne tuée et son meurtrier au moment du crime, dans le sens où le tueur doit être l'égal de la victime en termes de religion et de statut de liberté ou de servitude. Le tueur ne doit pas être supérieur à la victime par l'Islam ou par la liberté :</p>
<p>- Ainsi, un musulman n'est pas mis à mort pour le meurtre d'un mécréant, conformément à la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«لَا يُقْتَلُ مُسْلِمٌ بِكَافِرٍ»</span></p>
<p><em><strong>« Un musulman n'est pas mis à mort pour [le meurtre d']un mécréant »</strong></em>. Rapporté par Al-Boukhârî et Abu Dâwoûd <a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a>.</p>
<p>- De même, un homme libre n'est pas mis à mort pour [le meurtre d']un esclave, en raison de ce qu'Ahmad a rapporté d'après 'Alî ؓ :</p>
<p class="ar"><span dir="rtl">«مِنَ السُّنَّةِ أَنْ لَا يُقْتَلُ حُرٌّ بِعَبْدٍ»</span></p>
<p><em><strong>« Fait partie de la Sounnah qu'un homme libre ne soit pas mis à mort pour un esclave »</strong></em><a href="#fn6" class="footnote-ref" id="fnref6" role="doc-noteref"><sup>6</sup></a>. Et parce que si la victime n'est pas l'égale du meurtrier dans les critères mentionnés, le fait d'exécuter le meurtrier reviendrait à réclamer plus que ce qui est de droit.</p>
<p>En revanche, toute autre disparité entre le criminel et la victime en dehors de ce qui a été mentionné n'a aucune influence. Ainsi, l'homme beau est mis à mort pour le laid, le noble pour son opposé (le roturier), l'adulte pour l'enfant, l'homme pour la femme, et la personne saine d'esprit pour le fou ou l'idiot. Cela s'applique en raison de la portée générale de la parole d'Allah le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿وَكَتَبْنَا عَلَيْهِمْ فِيهَا أَنَّ النَّفْسَ بِالنَّفْسِ﴾ [المائدة: ٤٥]</span></p>
<p><strong>﴾ Et Nous y avons prescrit pour eux : vie pour vie ﴿</strong> (Al-Mâ'idah : 45)</p>
<p>et Sa parole :</p>
<p class="ar"><span dir="rtl">﴿الْحُرُّ بِالْحُرِّ﴾ [البقرة: ١٧٨]</span></p>
<p><strong>﴾ homme libre pour homme libre ﴿</strong> (Al-Baqarah : 178).</p>
<p><strong>La quatrième condition :</strong> L'absence de lien de filiation (génération) ; c'est-à-dire que la personne tuée ne doit pas être un descendant du tueur (son enfant, le fils de son fils aussi bas que remonte la lignée, ou le fils de sa fille aussi bas que remonte la lignée). Ainsi, aucun des deux parents (père ou mère), aussi haut que remonte la lignée, n'est mis à mort pour [le meurtre de] son enfant ou descendant, aussi bas soit-il, conformément à la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«لَا يُقْتَلُ وَالِدٌ بِوَلَدِهِ»</span></p>
<p><em><strong>« Un parent n'est pas mis à mort pour son enfant »</strong></em> <a href="#fn7" class="footnote-ref" id="fnref7" role="doc-noteref"><sup>7</sup></a>.</p>
<p>Ibn 'Abd al-Barr a dit <a href="#fn8" class="footnote-ref" id="fnref8" role="doc-noteref"><sup>8</sup></a> : <em>« C'est un hadith célèbre chez les gens de science du Hedjaz et de l'Irak, et largement diffusé (moustafîd) parmi eux... »</em>. Fin de citation.</p>
<p>Par ce hadith et ses équivalents, on restreint la portée des textes généraux qui imposent l'obligation du talion, et c'est là l'avis de la majorité des gens de science (<em>Joumhoûr al-'ilm</em>).</p>
<p>À l'inverse, l'enfant est mis à mort s'il tue l'un de ses parents, en vertu de la portée générale de la parole du Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿كُتِبَ عَلَيْكُمُ الْقِصَاصُ فِي الْقَتْلَى﴾ [البقرة: ١٧٨]</span></p>
<p><strong>﴾ Le talion vous est prescrit en matière de meurtre ﴿</strong> (Al-Baqarah : 178) ; le cas du parent qui tue son enfant ayant été spécifiquement exclu par une preuve (le hadith cité plus haut).</p>
<p>Dès lors que ces quatre conditions sont réunies, les ayants droit de la victime sont fondés à réclamer l'application du talion.</p>
<p>⁕ L'instauration du talion renferme une miséricorde pour les hommes et une préservation de leur sang, comme le Très-Haut l'a dit :</p>
<p class="ar"><span dir="rtl">﴿وَلَكُمْ فِي الْقِصَاصِ حَيَاةٌ﴾ [البقرة: ١٧٩]</span></p>
<p><strong>﴾ C'est dans le talion que vous avez une préservation de la vie ﴿</strong> (Al-Baqarah : 179).</p>
<p>Périssent donc les gens qui prétendent que le talion est une forme de sauvagerie et de cruauté ! Ceux-là n'ont pas considéré la sauvagerie du criminel lorsqu'il a osé assassiner l'innocent, semer la terreur dans le pays, condamner des femmes au veuvage, des enfants à l'orphelinat et détruire des foyers. Ceux-là s'apitoient sur l'agresseur mais n'ont aucune pitié pour la victime innocente. Périssent donc leurs esprits et périsse leur étroitesse de vue !</p>
<p class="ar"><span dir="rtl">﴿أَفَحُكْمَ الْجَاهِلِيَّةِ يَبْغُونَ وَمَنْ أَحْسَنُ مِنَ اللهِ حُكْماً لِقَوْمٍ يُوقِنُونَ﴾ [المائدة: ٥٠].</span></p>
<p><strong>﴾ Est-ce donc le jugement du temps de l'ignorance qu'ils cherchent ? Qu'y a-t-il de meilleur qu'Allah, en matière de jugement, pour des gens qui ont une foi ferme ? ﴿</strong> (Al-Mâ'idah : 50).</p>
<p>⁕ Le talion consiste, pour la victime ou son ayant droit, à infliger au criminel un acte identique ou similaire à celui qu'il a commis. Sa sagesse réside dans l'apaisement des cœurs et le soulagement de l'ardeur de la colère. Allah a en effet légiféré le talion comme une sanction dissuasive contre l'agression, un remède à ce qui pèse sur les âmes, et pour faire goûter au criminel ce qu'il a fait subir à la victime. C'est en cela que résident la pérennité et la préservation du genre humain.</p>
<p>⁕ À l'époque de l'ignorance (<em>Al-Jâhiliyyah</em>), les gens outrepassaient les limites dans la vengeance et s'en prenaient, pour un crime donné, à une autre personne que le véritable criminel. C'était là une injustice qui ne permettait nullement d'atteindre l'objectif recherché, mais qui ne faisait qu'accroître les troubles et provoquer l'effusion de sang. La religion de l'Islam et sa législation parfaite sont alors venues instaurer le droit au talion en réservant l'application de la peine au seul criminel. C'est ainsi que se sont établis la justice, la miséricorde et la préservation des vies.</p>
<p>⁕ L'explication des conditions rendant le talion obligatoire a certes déjà été exposée. Cependant, même si ces conditions-là sont réunies et que le talion devient obligatoire, il n'est pas permis de procéder à sa mise en exécution avant que d'autres conditions ne soient remplies. Les juristes (<em>al-fouqahâ'</em>) — qu'Allah leur fasse miséricorde — les ont évoquées et les ont nommées : les conditions de mise en exécution du talion (<em>Chouroût istîfâ'i al-qisâs</em>), et elles sont au nombre de trois :</p>
<p><strong>La première condition :</strong> Que le bénéficiaire (l'ayant droit) du talion soit légalement responsable (<em>moukallaf</em>), c'est-à-dire majeur (pubère) et sain d'esprit. Si le bénéficiaire du talion — ou l'un des co-bénéficiaires — est un enfant ou un fou, leur tuteur légal (<em>walî</em>) ne peut pas l'exécuter à leur place. En effet, le talion vise à apaiser les cœurs et à obtenir réparation, et cela ne s'accomplit pas pour l'ayant droit si c'est un autre que lui qui l'exécute.</p>
<p>Il est donc obligatoire de surseoir à l'exécution du talion, et le criminel est maintenu en détention jusqu'à la majorité de l'enfant ou le rétablissement du fou parmi les ayants droit. Pour cause, [le calife] Mou'âwiyah a fait emprisonner Houdbah ibn Khachram dans une affaire de talion jusqu'à ce que le fils de la victime atteigne sa majorité. Cela s'est produit à l'époque des Compagnons sans que personne ne s'y oppose ; ce fut donc un consensus (<em>ijmâ'</em>) de la part des Compagnons présents à l'époque de Mou'âwiyah ؓ.</p>
<p>Toutefois, si l'enfant ou le fou parmi les ayants droit du talion a un besoin impérieux d'une pension alimentaire (de subsistance), le tuteur du fou — et lui seul — est autorisé à accorder le pardon en contrepartie du prix du sang (<em>ad-diyah</em>). Cela s'explique par le fait qu'on ignore quand la folie du fou prendra fin, contrairement à l'enfant [dont on sait qu'il finira par grandir].</p>
<p><strong>La deuxième condition :</strong> L'accord unanime des proches (ayants droit) et des co-partageants du droit au talion quant à sa mise en exécution. Il n'est pas permis à l'un d'entre eux d'agir unilatéralement à l'exclusion des autres, car l'exécution est un droit commun qui ne peut être fractionné. Si l'un d'eux l'exécutait seul, il s'approprierait le droit d'autrui sans son autorisation et sans disposer d'une tutelle légitime sur lui.</p>
<p>Et si l'un des co-partageants du droit au talion est absent, mineur ou fou, on doit obligatoirement attendre le retour de l'absent, la majorité de l'enfant et le retour à la raison du fou parmi eux.</p>
<p>Quiconque parmi les ayants droit du talion vient à mourir, son propre héritier prend alors sa place (reprend ses droits). Et si l'un des co-partageants du droit au talion accorde son pardon, le talion s'annule (et tombe).</p>
<p>L'ensemble des héritiers — qu'ils le soient par le lien de parenté (<em>nasab</em>) ou par une cause légale (<em>sabab</em>, comme le mariage) — participent au droit au talion : les hommes comme les femmes, les adultes comme les enfants. Cependant, certains savants ont dit : <em>« Le droit au pardon est une spécificité des parents agnats ('asabah) uniquement »</em>. C'est l'avis de l'Imam Mâlik, une version rapportée de l'Imam Ahmad, et c'est également l'avis qu'a choisi Cheikh al-Islam Ibn Taymiyyah.</p>
<p><strong>La troisième condition :</strong> Que l'on soit assuré que la mise à exécution ne transgressera pas (ne s'étendra pas) à un autre que le criminel. Cela s'appuie sur la parole du Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿وَمَنْ قُتِلَ مَظْلُوماً فَقَدْ جَعَلْنَا لِوَلِيِّهِ سُلْطَاناً فَلَا يُسْرِفْ فِي الْقَتْلِ إِنَّهُ كَانَ مَنْصُوراً﴾ [الإسراء: ٣٣].</span></p>
<p><strong>﴾ Quiconque est tué injustement, Nous avons donné un pouvoir à son ayant droit. Que celui-ci ne commette pas d'excès dans le meurtre, car il est déjà secouru. ﴿</strong> (Al-Isrâ' : 33).</p>
<p>Ainsi, si l'application du talion conduit à une transgression, elle constitue alors un excès, et ce noble verset en prouve l'interdiction. Dès lors, si le talion devient obligatoire à l'encontre d'une femme enceinte, ou d'une femme qui tombe enceinte après que le talion est devenu obligatoire contre elle, elle ne sera pas mise à mort avant d'avoir accouché de son enfant. En effet, son exécution s'étendra au fœtus, alors que celui-ci est innocent, et Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿وَلَا تَزِرُ وَازِرَةٌ وِزْرَ أُخْرَى﴾ [الأنعام: ١٦٤]</span></p>
<p><strong>﴾ Nul ne portera le fardeau d'autrui ﴿</strong> (Al-An'âm : 164).</p>
<p>Puis, après l'accouchement : s'il se trouve une personne pour allaiter le nourrisson, on le confie à cette nourrice et la femme subit le talion, car l'empêchement a disparu du fait qu'une autre personne la remplace pour l'allaitement de l'enfant. En revanche, s'il ne se trouve personne pour l'allaiter, on la laisse en vie jusqu'à ce qu'elle le sevrer au bout de deux ans, conformément à la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«إِذَا قَتَلَتِ الْمَرْأَةُ عَمْداً؛ لَمْ تُقْتَلْ حَتَّى تَضَعَ مَا فِي بَطْنِهَا إِنْ كَانَتْ حَامِلاً، وَحَتَّى تَكْفُلَ وَلَدَهَا، وَإِذَا زَنَتْ؛ لَمْ تُرْجَمْ حَتَّى تَضَعَ مَا فِي بَطْنِهَا (إِنْ كَانَتْ حَامِلاً)، وَحَتَّى تَكْفُلَ وَلَدَهَا»</span></p>
<p><em><strong>« Si une femme commet un meurtre de manière volontaire, elle n'est pas mise à mort jusqu'à ce qu'elle accouche de ce qu'elle porte dans son ventre si elle est enceinte, et jusqu'à ce qu'elle assure la prise en charge de son enfant. Et si elle commet l'adultère, elle n'est pas lapidée jusqu'à ce qu'elle accouche de ce qu'elle porte dans son ventre (si elle est enceinte), et jusqu'à ce qu'elle assure la prise en charge de son enfant »</strong></em>, rapporté par Ibn Mâjah <a href="#fn9" class="footnote-ref" id="fnref9" role="doc-noteref"><sup>9</sup></a>.</p>
<p>Et en raison de la parole du Prophète <span dir="rtl">ﷺ</span> à la femme qui avait confessé son adultère :</p>
<p class="ar"><span dir="rtl">«ارْجِعِي حَتَّى تَضَعِي مَا فِي بَطْنِكِ»، ثُمَّ قَالَ لَهَا: «ارْجِعِي حَتَّى تُرْضِعِيهِ»</span></p>
<p><em><strong>« Retourne chez toi jusqu'à ce que tu accouches de ce que tu portes dans ton ventre », puis il lui dit [après l'accouchement] : « Retourne chez toi jusqu'à ce que tu l'allaites »</strong></em> <a href="#fn10" class="footnote-ref" id="fnref10" role="doc-noteref"><sup>10</sup></a>.</p>
<p>Les deux hadiths ainsi que le verset démontrent donc le report du talion en raison de la grossesse, et cela fait l'objet d'un consensus (<em>ijmâ'</em>). Ceci témoigne de la perfection de cette législation et de sa justice, puisqu'elle a préservé le droit des fœtus dans les ventres maternels en n'autorisant pas qu'on leur cause préjudice, tout comme elle a préservé le droit des enfants et des êtres faibles en écartant d'eux le tort et en leur garantissant ce qui maintient leur vie. Louange à Allah pour cette législation tolérante, parfaite et établie pour le bien des serviteurs.</p>
<p>⁕ Lorsque l'on veut mettre à exécution le talion, il est indispensable que son exécution se déroule sous la supervision du gouverneur (l'Imam) ou de son représentant, afin d'empêcher toute injustice lors de son application et de s'en tenir strictement à la méthode légiférée en la matière.</p>
<p>⁕ Il est exigé que l'instrument avec lequel le talion est exécuté soit tranchant (affûté), comme une épée ou un couteau, conformément à la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«إِذَا قَتَلْتُمْ؛ فَأَحْسِنُوا الْقِتْلَةَ»</span></p>
<p><em><strong>« Quand vous tuez, tuez de la meilleure manière »</strong></em><a href="#fn11" class="footnote-ref" id="fnref11" role="doc-noteref"><sup>11</sup></a>.</p>
<p>⁕ Il est formellement interdit d'exécuter le talion à l'aide d'un instrument émoussé (qui ne coupe pas bien), car cela constitue un excès (un supplice inutile) dans la mise à mort.</p>
<p>⁕ Enfin, si l'ayant droit maîtrise l'exécution conformément à la méthode légale, [il peut s'en charger] ; dans le cas contraire, le juge (l'autorité) lui ordonne de mandater une personne compétente pour exécuter le talion en son nom.</p>
<p>⁕ L'avis prépondérant (correct) parmi les deux opinions des savants est qu'on inflige au criminel le même procédé que celui qu'il a fait subir à la victime. Cela s'appuie sur la parole du Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿وَإِنْ عَاقَبْتُمْ فَعَاقِبُوا بِمِثْلِ مَا عُوقِبْتُمْ بِهِ﴾ [النحل: ١٢٦]</span></p>
<p><strong>﴾ Et si vous punissez, punissez de la même manière que vous avez été punis ﴿</strong> (Al-Nahl : 126)</p>
<p>et Sa parole :</p>
<p class="ar"><span dir="rtl">﴿فَمَنِ اعْتَدَى عَلَيْكُمْ فَاعْتَدُوا عَلَيْهِ بِمِثْلِ مَا اعْتَدَى عَلَيْكُمْ﴾ [البقرة: ١٩٤]</span></p>
<p><strong>﴾ Donc, quiconque transgresse contre vous, transgressez contre lui à transgression égale ﴿</strong> (Al-Baqarah : 194), ainsi que sur le fait que le Prophète <span dir="rtl">ﷺ</span> a ordonné d'écraser la tête d'un juif parce que celui-ci avait écrasé la tête d'une jeune fille parmi les Ansars.</p>
<p>L'Imam Ibn al-Qayyim — qu'Allah lui fasse miséricorde — a dit : <em>« Le Livre (le Coran) et l'équité de la balance convergent vers le fait qu'on inflige au criminel la même chose que ce qu'il a fait subir à la victime, tout comme le Prophète <span dir="rtl">ﷺ</span> l'a fait. Le Livre, la Sounnah et les récits des Compagnons s'accordent tous sur cela... »</em> Fin de citation.</p>
<p>En vertu de cela, si le meurtrier a coupé les deux mains [de la victime] avant de la tuer, on lui fera subir la même chose. S'il l'a tuée à coups de pierres, par noyade ou par tout autre procédé, on lui infligera exactement ce qu'il a fait.</p>
<p>Toutefois, si l'ayant droit du talion préfère se limiter à lui trancher le cou par l'épée, cela lui est permis et c'est même préférable. En revanche, si le criminel a tué sa victime par un moyen intrinsèquement illicite (comme le viol ou l'alcool), il devient alors obligatoire de l'exécuter par l'épée. Et l'équivalent de l'exécution par l'épée à l'époque contemporaine est l'exécution par arme à feu, administrée par une personne qui maîtrise le tir.</p>
