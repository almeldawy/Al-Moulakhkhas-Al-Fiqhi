<p>⁕ La loi du talion concernant les membres et les blessures est solidement établie par le Livre (le Coran), la Sunnah et le consensus (Al-Ijmâ') :</p>
<p>⁃ Allah Le Très Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿ وَكَتَبْنَا عَلَيْهِمْ فِيهَا أَنَّ النَّفْسَ بِالنَّفْسِ وَالْعَيْنَ بِالْعَيْنِ وَالْأَنْفَ بِالْأَنْفِ وَالْأُذُنَ بِالْأُذُنِ وَالسِّنَّ بِالسِّنِّ وَالْجُرُوحَ قِصَاصٌ ﴾ [المائدة : ٤٥]</span></p>
<p><strong>﴾ Et Nous y avons prescrit pour eux : âme pour âme, œil pour œil, nez pour nez, oreille pour oreille, dent pour dent. Et pour les blessures, la loi du talion. ﴿</strong> [Sourate Al-Mâ'idah : 45].</p>
<p>⁃ Et il est rapporté dans les deux recueils authentiques (Al-Boukhârî et Muslim), concernant l'histoire de la incisive cassée de Ar-Rubayyi', que le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="rtl">« كِتَابُ اللهِ الْقِصَاصُ »</span></p>
<p><em><strong>« Le Livre d'Allah [prescrit] la loi du talion. »</strong></em><a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a></p>
<p>⁕ Ainsi, quiconque est soumis à la loi du talion (Al-Qisâs) vis-à-vis d'une personne pour un homicide (atteinte à la vie) y sera également soumis pour les membres et les blessures, dès lors que les conditions du talion mentionnées précédemment sont réunies, à savoir : la protection légale (<em>Al-'Ismah</em>), la responsabilité légale (<em>At-Taklîf</em>), l'équivalence (<em>Al-Mukâfa'ah</em>), et l'absence de lien de parenté directe (le fait que l'auteur ne soit pas le géniteur).</p>
<p>Cela implique que la victime soit protégée (par la loi islamique), que l'auteur de l'infraction soit légalement responsable (pubère et doué de raison), que la victime soit l'équivalente de l'auteur en termes de liberté ou d'esclavage, et que l'auteur ne soit pas le parent de la victime.</p>
<p>Par conséquent, quiconque ne peut être soumis au talion envers une personne pour un homicide ne le sera pas non plus pour les membres et les blessures. Telle est la règle fondamentale dans ce chapitre.</p>
<p>⁕ Et le facteur contraignant (la condition d'application) du talion pour les membres et les blessures est le même que celui du talion pour l'âme (l'homicide), à savoir : l'acte délibéré pur (<em>Al-'Amd Al-Mahd</em>). Il n'y a donc pas de talion en cas d'erreur (<em>Al-Khata'</em>) ni de quasi-délibéré (<em>Shibh Al-'Amd</em>).</p>
<p>Le talion s'applique aux membres : ainsi, l'œil est pris pour l'œil, le nez pour le nez, l'oreille pour l'oreille, la main pour la main, et le pied pour le pied ; le droit pour le droit, et le gauche pour le gauche, pour tout ce qui a été mentionné. La dent de l'auteur de l'infraction est brisée pour la dent similaire de la victime, et la paupière est prise pour la paupière : la supérieure pour la supérieure, et l'inférieure pour l'inférieure. Et est prise la lèvre pour la lèvre : la supérieure pour la supérieure, et l'inférieure pour l'inférieure, en raison de la parole d'Allah le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿ وَالْجُرُوحَ قِصَاصٌ ﴾</span></p>
<p><strong>﴾ Et pour les blessures, la loi du talion ﴿</strong></p>
<p>et parce que la paupière tout comme la lèvre ont une limite distincte où elles s'arrêtent.</p>
<p>Le doigt est pris pour le doigt qui lui correspond par sa position et par son nom. La paume (ou main jusqu'au poignet) est prise pour la paume correspondante : la droite pour la droite, et la gauche pour la gauche. Le coude est pris pour son équivalent : le droit pour le droit, et le gauche pour le gauche, en raison de leur parfaite similitude.</p>
<p>Le membre viril est pris pour le membre viril, car il possède une limite bien définie où il se termine, et il est possible d'y appliquer le talion sans commettre d'injustice (ou de dépassement), conformément à la portée générale de la parole d'Allah le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿ وَالْجُرُوحَ قِصَاصٌ ﴾</span></p>
<p><strong>﴾ Et pour les blessures, la loi du talion ﴿</strong></p>
<p>⁕ Et trois conditions sont requises pour l'application du talion au niveau des membres :</p>
<p><strong>La première condition :</strong> La garantie d'être à l'abri de toute injustice (ou dépassement). Cela implique que l'amputation se fasse à partir d'une articulation, ou qu'elle ait une limite bien définie où elle s'arrête. Si ce n'est pas le cas, le talion n'est pas permis.</p>
<p>Ainsi, il n'y a pas de talion pour une blessure qui ne s'arrête pas à une limite précise, comme la blessure pénétrante (<em>Al-Jâ'ifah</em>), qui est celle qui atteint l'intérieur de la cavité corporelle (le tronc), car elle n'a pas de limite fixe où l'incision s'arrête. De même, il n'y a pas de talion pour la fracture d'un os autre que la dent, comme la fracture de la jambe, de la cuisse ou de l'avant-bras, en raison de l'impossibilité de garantir une parfaite similitude.</p>
<p>Quant à la fracture de la dent, le talion s'y applique : la dent de l'auteur de l'infraction sera limée jusqu'à ce qu'il en soit retiré une quantité équivalente à ce qui a été cassé de la dent de la victime.</p>
<p><strong>La deuxième condition :</strong> La correspondance (similitude) entre les deux membres respectifs de l'auteur et de la victime, tant par le nom que par l'emplacement.</p>
<p>Par conséquent, un membre droit ne peut être pris pour un membre gauche, ni un gauche pour un droit, qu'il s'agisse des mains, des pieds, des yeux, des oreilles ou de tout autre organe similaire, car chacun d'eux se distingue par un nom propre et possède une utilité spécifique ; il n'y a donc pas de correspondance exacte.</p>
<p>De même, parmi les doigts, un auriculaire ne peut être pris pour un annulaire, en raison de la différence de nom. Enfin, un membre d'origine (normal) ne peut être pris en réparation d'un membre surnuméraire (en trop).</p>
<p><strong>La troisième condition :</strong> L'égalité entre les deux membres respectifs de l'auteur de l'infraction et de la victime en termes de santé et d'intégrité (perfection).</p>
<p>Par conséquent, une main ou un pied sain ne peut être pris en réparation d'une main ou d'un pied paralysé (<em>Shallâ'</em>). De même, une main ou un pied ayant la totalité de ses doigts ou de ses ongles ne peut être pris en réparation d'un membre auquel il en manque. Enfin, un œil sain (voyant) ne peut être pris pour un œil éteint (<em>Qâ'imah</em>), c'est-à-dire l'œil dont le blanc et le noir sont intacts (clairs) mais qui ne voit pas, et ce, en raison du défaut d'égalité. Une langue dotée de la parole ne peut pas non plus être prise pour une langue muette, en raison du manquement (de cette dernière).</p>
<p>En revanche, le membre défectueux (ou incomplet) peut être pris pour le membre complet : ainsi, le membre paralysé peut être amputé en réparation du membre sain, et celui auquel il manque des doigts peut être pris pour celui qui est complet. En effet, l'organe défectueux à cet égard reste semblable à l'organe sain dans sa structure d'origine (<em>Al-Khilqah</em>), le manquement ne résidant que dans une caractéristique (<em>As-Sifah</em>). De plus, l'exercice du talion revient ici (pour la victime) à ne recouvrer qu'une partie de son droit, il n'y a donc aucune injustice (envers l'auteur). Et si la victime le souhaite, elle peut exiger le prix du sang (<em>Al-Diyah</em>) en remplacement du talion.</p>
<p>⁕ Quant au talion pour les blessures (<em>Al-Jurûh</em>) :</p>
<p>⁃ Le talion s'applique pour toute blessure qui se termine (parvient) jusqu'à un os, car il est possible d'exécuter la peine de manière équitable, sans injustice ni dépassement. C'est le cas par exemple de la blessure à la tête ou au visage qui met l'os à nu (<em>Al-Mûdihah</em>), ou d'une blessure au bras, à la jambe, à la cuisse ou au pied, en raison de la parole du Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿ وَالْجُرُوحَ قِصَاصٌ ﴾</span></p>
<p><strong>﴾ Et pour les blessures, la loi du talion ﴿</strong></p>
<p>⁃ Quant aux blessures qui ne se terminent pas au niveau d'un os, le talion n'y est pas permis, qu'il s'agisse d'une blessure à la tête (<em>Shajjah</em>) ou autre ; comme la blessure pénétrante (<em>Al-Jâ'ifah</em>), qui est celle qui atteint l'intérieur d'une cavité corporelle, telle que le ventre, la poitrine ou la gorge, en raison de l'impossibilité de garantir l'absence d'injustice et de dépassement.</p>
<p>Ibn Mâjah a rapporté, dans un Hadith élevé jusqu'au Prophète (<em>Marfû'</em>), :</p>
<p class="ar"><span dir="rtl">« لَا قَوَدَ فِي الْمَأْمُومَةِ وَلَا فِي الْجَائِفَةِ وَلَا فِي الْمُنَقِّلَةِ »</span></p>
<p><em><strong>« Pas de talion pour la blessure qui atteint la méninge (Al-Ma'mûmah), ni pour la blessure pénétrante (Al-Jâ'ifah), ni pour la fracture déplaçant les os (Al-Munaqqilah). »</strong></em><a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a></p>
<ul>
<li><blockquote>
<p><em>Al-Ma'mûmah</em> : C'est la blessure à la tête qui atteint la membrane du cerveau (la méninge).</p>
</blockquote></li>
<li><blockquote>
<p><em>Al-Jâ'ifah</em> : C'est celle qui atteint l'intérieur d'une cavité corporelle.</p>
</blockquote></li>
<li><blockquote>
<p><em>Al-Munaqqilah</em> : C'est celle qui fracasse le crâne et déplace les os.</p>
</blockquote></li>
</ul>
<p>Cheikh al-Islâm Ibn Taymiyyah <a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a> (qu'Allah lui fasse miséricorde) a dit : <em>« Le talion pour les blessures est établi par le Livre, la Sunnah et le consensus, sous condition d'égalité. S'il lui inflige une blessure à la tête, la victime a le droit de lui infliger une blessure identique. Mais si cela n'est pas possible, comme le fait de briser un os interne, ou de lui infliger une blessure à la tête qui n'atteint pas l'os (inférieure à Al-Mûdihah), alors le talion n'est pas légiféré ; c'est plutôt le prix du sang (Al-Diyah) qui devient obligatoire. »</em></p>
<p>⁕ Quant au talion pour les coups portés avec la main, un bâton, un fouet ou autre objet similaire :</p>
<p>Le Cheikh (Ibn Taymiyyah) a dit : <em>« Un groupe [de savants] a dit : Il n'y a pas de talion pour cela, mais plutôt une peine de correction subsidiaire (At-Ta'zîr). Cependant, ce qui est rapporté des califes et d'autres parmi les Compagnons et les Suivants (At-Tâbi'în), c'est que le talion est légiféré dans ce cas. C'est le texte explicite d'Ahmad et d'autres juristes, et c'est ce qu'a apporté la Sunnah du Messager d'Allah <span dir="rtl">ﷺ</span>, et c'est cela l'avis correct.</em></p>
<p><em>'Umar a dit :</em></p>
<p class="ar"><span dir="rtl">إِنِّي مَا أُرْسِلُ عُمَّالِي لِيَضْرِبُوا أَبْشَارَكُمْ، فَوَالَّذِي نَفْسِي بِيَدِهِ؛ مَنْ فَعَلَ لَأُقِصَّنَّهُ، وَقَدْ رَأَيْتُ رَسُولَ اللهِ ﷺ يُقِصُّ مِنْ نَفْسِهِ،</span></p>
<p><em>"Certes, je n'envoie pas mes gouverneurs pour qu'ils frappent vos corps (peaux) ; par Celui qui tient mon âme entre Ses Mains, quiconque fait cela, je lui appliquerai le talion. Et j'ai certes vu le Messager d'Allah <span dir="rtl">ﷺ</span> appliquer le talion sur sa propre personne." Rapporté par Ahmad</em> <a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a><em>. Le sens de cela concerne le cas où le gouverneur frappe ses administrés d'un coup illicite. Quant aux coups légiférés (justifiés), ils ne font l'objet d'aucun talion, par consensus (Al-Ijmâ'). »</em> Fin des propos du Cheikh.</p>
<p>Et Ibn al-Qayyim <a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a> (qu'Allah lui fasse miséricorde) a dit : <em>« Les Chafi'ites, les Hanafites, les Malikites et les derniers savants de notre école (les Hanbalites) ont dit : Il n'y a pas de talion pour la gifle ni pour le coup, et certains d'entre eux ont même évoqué un consensus. Ce faisant, ils se sont écartés de l'analogie pure (Al-Qiyâs), de l'exigence des textes juridiques et du consensus des Compagnons.</em></p>
<p><em>Et le Très-Haut a dit :</em></p>
<p class="ar"><span dir="rtl">﴿ وَإِنْ عَاقَبْتُمْ فَعَاقِبُوا بِمِثْلِ مَا عُوقِبْتُمْ بِهِ ﴾ [النحل: ١٢٦]</span></p>
<p><em>﴾ Et si vous punissez, punissez de la même manière que vous avez été punis. ﴿ [Sourate An-Nahl : 126].</em></p>
<p><em>Le droit obligatoire de celui qui a reçu une gifle est donc d'agir envers l'auteur de l'infraction de la même manière qu'il a agi envers lui : une gifle pour une gifle, et un coup pour un coup, au même endroit, avec l'instrument utilisé ou son équivalent. Cela est plus proche de la similitude ordonnée, tant sur le plan physique (sensible) que religieux, qu'une peine de correction subsidiaire (At-Ta'zîr) d'une nature et d'une forme différentes de l'agression subie. Et ceci est la guidée du Messager <span dir="rtl">ﷺ</span>, de ses califes, l'analogie pure, ainsi que les textes explicites d'Ahmad. »</em> Fin de citation.</p>
