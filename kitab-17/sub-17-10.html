<p>⁕ L'expiation (<em>al-Kaffârah</em>) a été ainsi nommée par dérivation du mot <em>al-Kufr</em>, qui signifie le fait de dissimuler (ou couvrir), car elle dissimule le péché et le couvre.</p>
<p>⁕ La preuve de l'obligation de l'expiation du meurtre réside dans le Livre (le Coran), la Sunnah et le consensus (<em>al-Ijmâ‘</em>).</p>
<p>- Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿وَمَا كَانَ لِمُؤْمِنٍ أَن يَقْتُلَ مُؤْمِناً إِلَّا خَطَئاً وَمَن قَتَلَ مُؤْمِناً خَطَئاً فَتَحْرِيرُ رَقَبَةٍ مُّؤْمِنَةٍ وَدِيَةٌ مُّسَلَّمَةٌ إِلَى أَهْلِهِ إِلَّا أَن يَصَّدَّقُواْ...﴾ إِلَى قَوْلِهِ تَعَالَى: ﴿فَمَن لَّمْ يَجِدْ فَصِيَامُ شَهْرَيْنِ مُتَتَابِعَيْنِ تَوْبَةً مِّنَ اللهِ وَكَانَ اللهُ عَلِيماً حَكِيماً﴾ [النساء: ٩٢].</span></p>
<p><strong>﴾ Il n'appartient pas à un croyant de tuer un autre croyant, si ce n'est par erreur. Quiconque tue par erreur un croyant, qu'il affranchisse alors un esclave croyant et remette à sa famille le prix du sang, à moins que celle-ci n'en fasse l'aumône... ﴿ jusqu'à la parole du Très-Haut : ﴾ Quiconque n'en trouve pas les moyens, qu'il jeûne deux mois consécutifs, à titre d'absolution de la part d'Allah. Et Allah est Omniscient et Sage. ﴿</strong> [Sourate An-Nisâ' : 92].</p>
<p>- Et Abû Dâwûd et An-Nasâ'î ont rapporté que le Prophète <span dir="rtl">ﷺ</span> a dit au sujet du meurtrier :</p>
<p class="ar"><span dir="rtl">«أَعْتِقُوا عَنْهُ؛ يُعْتِقِ اللهُ بِكُلِّ عُضْوٍ مِنْهُ عُضْواً مِنْهُ مِنَ النَّارِ»</span></p>
<p><em><strong>« Affranchissez [un esclave] en sa faveur, Allah affranchira ainsi pour chaque membre de cet esclave un membre de son propre corps du Feu. »</strong></em> <a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a>.</p>
<p>⁕ L'expiation n'est obligatoire que dans le meurtre par erreur (<em>al-Khata'</em>) et le meurtre quasi-intentionnel (<em>Shibh al-'Amd</em>). Quant au meurtre volontaire et agressif (<em>al-'Amd al-'Udwân</em>), il n'y a pas d'expiation possible pour celui-ci, en raison de la parole du Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿وَمَن يَقْتُلْ مُؤْمِناً مُّتَعَمِّداً فَجَزَاؤُهُ جَهَنَّمُ خَالِداً فِيهَا وَغَضِبَ اللهُ عَلَيْهِ وَلَعَنَهُ وَأَعَدَّ لَهُ عَذَاباً عَظِيماً﴾ [النساء: ٩٣]</span></p>
<p><strong>﴾ Quiconque tue intentionnellement un croyant, sa rétribution sera l'Enfer, pour y demeurer éternellement. Allah lui impose Sa colère, le maudit et lui prépare un énorme châtiment. ﴿</strong> [Sourate An-Nisâ' : 93], et aucune expiation n'y a été mentionnée.</p>
<p>Et il a été rapporté que Suwayd ibn As-Sâmit avait tué un homme, le Prophète <span dir="rtl">ﷺ</span> imposa alors contre lui la loi du talion (<em>al-Qawad</em>), mais il n'imposa pas d'expiation. De même, 'Amr ibn Umayyah Ad-Damrî tua deux hommes volontairement, le Prophète <span dir="rtl">ﷺ</span> paya alors leur prix du sang (<em>Diyah</em>), mais il n'imposa pas d'expiation à son encontre.</p>
<p>Et parce que l'expiation a été rendue obligatoire pour le meurtre par erreur afin d'en effacer le péché — car ce type d'acte n'est pas exempt d'une certaine négligence —, elle ne s'applique donc pas à une situation où la gravité du péché est telle qu'elle ne saurait être effacée par celle-ci.</p>
<p>Cheikh al-Islâm Ibn Taymiyyah <a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a> — qu'Allah lui fasse miséricorde — a dit : <em>« Il n'y a pas d'expiation pour le meurtre intentionnel, ni pour le serment parjure (al-Yamîn al-Ghamûs), et cela ne constitue en rien un allègement en faveur de celui qui commet ces actes. »</em></p>
<p>Muwaffaq ad-Dîn Ibn Qudâmah <a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a> et d'autres ont mentionné : <em>« Le meurtre par erreur n'est qualifié ni d'interdit, ni d'autorisé, car il s'apparente à l'acte commis par un fou. Cependant, l'âme qui a péri par cet acte est protégée (ma‘sûmah) et sacrée, c'est pourquoi l'expiation y a été rendue obligatoire... »</em> Fin de citation.</p>
<p>⁕ Ce qui signifie que la sagesse derrière la législation de l'expiation dans le meurtre par erreur repose sur deux éléments :</p>
<p><strong>Le premier élément :</strong> le fait que l'erreur n'est pas exempte d'une certaine négligence de la part de l'auteur du meurtre.</p>
<p><strong>Le second élément :</strong> la considération du caractère sacré de l'âme qui a péri à cause de cet acte.</p>
<p>⁕ Quant au meurtre intentionnel, l'expiation n'y est pas obligatoire car son péché ne saurait être effacé par une expiation, en raison de son immense gravité et de sa lourdeur. Cependant, si le meurtrier volontaire se repent à Allah le Très-Haut et se livre afin de subir la loi du talion (<em>Qisâs</em>), alors son péché s'en trouve allégé : le droit d'Allah tombe par le repentir, le droit des ayants droit de la victime tombe par l'application du talion ou par le pardon accordé, et il ne reste que le droit de la victime elle-même, qu'Allah satisfera au Jour dernier de la manière qu'Il voudra. Tel est le sens de ce qu'a établi l'érudit Ibn al-Qayyim dans son livre <em>« Al-Jawâb al-Kâfî »</em>.</p>
<p>⁕ Quiconque tue une âme sacrée — fût-elle son propre esclave, ou un non-musulman lié par un pacte (<em>Mu‘âhad</em>) ou bénéficiant d'un sauf-conduit (<em>Musta'man</em>), qu'il soit déjà né ou qu'il s'agisse d'un fœtus (par exemple en frappant le ventre d'une femme enceinte, provoquant l'expulsion d'un fœtus mort) — quiconque tue l'un d'entre eux se voit obligé d'accomplir l'expiation, en raison de la portée générale de la parole du Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿وَمَن قَتَلَ مُؤْمِناً خَطَئاً فَتَحْرِيرُ رَقَبَةٍ مُّؤْمِنَةٍ وَدِيَةٌ مُّسَلَّمَةٌ إِلَى أَهْلِهِ إِلَّا أَن يَصَّدَّقُواْ فَإِن كَانَ مِن قَوْمٍ عَدُوٍّ لَّكُمْ وَهُوَ مُؤْمِنٌ فَتَحْرِيرُ رَقَبَةٍ مُّؤْمِنَةٍ وَإِن كَانَ مِن قَوْمٍ بَيْنَكُمْ وَبَيْنَهُم مِّيثَاقٌ فَدِيَةٌ مُّسَلَّمَةٌ إِلَى أَهْلِهِ وَتَحْرِيرُ رَقَبَةٍ مُّؤْمِنَةٍ فَمَن لَّمْ يَجِدْ فَصِيَامُ شَهْرَيْنِ مُتَتَابِعَيْنِ تَوْبَةً مِّنَ اللهِ وَكَانَ اللهُ عَلِيماً حَكِيماً﴾ [النساء: ٩٢]</span></p>
<p><strong>﴾ Quiconque tue par erreur un croyant, qu'il affranchisse alors un esclave croyant et remette à sa famille le prix du sang, à moins que celle-ci n'en fasse l'aumône. Si la victime appartenait à un peuple ennemi, tout en étant croyante, il y a alors l'affranchissement d'un esclave croyant. S'il appartenait à un peuple auquel vous êtes liés par un pacte, le prix du sang doit être remis à sa famille et un esclave croyant affranchi. Quiconque n'en trouve pas les moyens, qu'il jeûne deux mois consécutifs, à titre d'absolution de la part d'Allah. Et Allah est Omniscient et Sage. ﴿</strong> [Sourate An-Nisâ' : 92].</p>
<p>⁕ Et [la règle reste la même] que l'auteur ait agi seul pour ôter la vie ou qu'il ait eu un complice, et que le meurtre ait eu lieu par action directe (<em>Mubâsharah</em>) ou par causalité indirecte (<em>Tasabbub</em>) ; comme celui qui creuse un puits de manière illicite (sans autorisation ou au mauvais endroit), ou qui dresse un couteau, ou tout autre acte similaire ayant entraîné la mort d'une personne.</p>
<p>Al-Muwaffaq <a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a> a dit : <em>« Chacun des complices se voit obligé d'accomplir une expiation entière. C'est là l'avis de la majorité des gens de science, parmi lesquels Mâlik, Al-Shâfi‘î et les partisans de l'analogie (As-hâb ar-Ra'y). »</em> Fin de citation.</p>
<p>⁕ L'expiation incombe au meurtrier, qu'il soit un adulte, un enfant ou un fou, et qu'il soit un homme libre ou un esclave, en raison de la portée générale du verset.</p>
<p>⁕ L'expiation consiste à affranchir un esclave croyant. S'il n'en trouve pas les moyens, il doit alors jeûner deux mois consécutifs. Nourrir des pauvres (<em>Al-It‘âm</em>) n'est pas valable dans ce cas précis. Ainsi, s'il n'est pas capable de jeûner, cette obligation reste à sa charge (une dette envers Allah), et le fait de nourrir des pauvres ne peut s'y substituer, car Allah le Très-Haut ne l'a pas mentionné. En effet, les solutions de substitution (<em>Al-Abdâl</em>) dans les expiations dépendent strictement des textes scripturaires (<em>An-Nass</em>) et ne peuvent faire l'objet d'une analogie (<em>Al-Qiyâs</em>).</p>
<p>⁕ L'esclave, quant à lui, s'acquitte de l'expiation par le jeûne, car il ne possède pas de biens lui permettant de procéder à un affranchissement.</p>
<p>⁕ Si le meurtrier est un fou ou un enfant en bas âge, son tuteur légal (<em>Walî</em>) accomplit l'expiation en son nom par l'affranchissement [d'un esclave]. En effet, le jeûne est impossible pour eux deux et la délégation (le fait de jeûner à la place de quelqu'un d'autre) n'est pas admise pour le jeûne. L'expiation est pourtant obligatoire pour chacun d'eux car il s'agit d'un droit financier lié au meurtre, semblable au prix du sang (<em>Al-Diyah</em>), et parce qu'elle constitue une adoration financière semblable à la Zakat.</p>
<p>⁕ L'expiation se multiplie en fonction du nombre de meurtres commis, tout comme le prix du sang se multiplie selon le nombre de victimes. Par conséquent, si une personne tue plusieurs individus, elle devra accomplir autant d'expiations qu'il y a de victimes.</p>
<p>⁕ Si le meurtre est autorisé — comme le fait de tuer le transgresseur (<em>al-Bâghî</em>), l'apostat (<em>al-Murtadd</em>), le fornicateur marié (<em>az-Zânî al-Muhsan</em>), celui qui est tué par l'application de la loi du talion (<em>Qisâs</em>) ou d'une peine légale (<em>Hadd</em>) — ou s'il a lieu dans le cadre de la légitime défense, alors il n'y a aucune expiation dans tous ces cas, car la personne tuée ne bénéficie pas de l'inviolabilité (<em>Hurmah</em>).</p>
<p>⁕ <strong>Avertissement :</strong> L'accomplissement de l'expiation du meurtre fait partie des choses que certaines personnes prennent à la légère aujourd'hui, particulièrement lors d'accidents de la route où de nombreuses vies périssent. Celui qui en porte la responsabilité peut trouver le jeûne trop lourd, d'autant plus si les expiations se multiplient à sa charge. Il ne jeûne donc pas, et sa responsabilité (sa dette envers Allah) reste ainsi engagée.</p>
<p>De même, il existe un autre phénomène : les proches parents masculins (<em>al-'Âqilah</em>) du meurtrier n'assument pas le prix du sang (<em>Diyah</em>) dans le cadre du meurtre par erreur. Et si l'un d'entre eux en assume une partie, il pense que cela relève de l'acte de charité volontaire (<em>Tabarru'</em>). C'est pourquoi nous voyons certains auteurs de meurtre par erreur demander aux gens de payer la <em>Diyah</em> pour eux. Ceci constitue une annulation d'une prescription religieuse majeure, conduisant à ce que beaucoup l'ignorent. Il se peut même que certains mendiants usent de supercherie au nom de cette compensation. Il incombe alors de les stopper et de les dissuader de consommer des biens illégalement et de tromper les gens, notamment lorsque certains d'entre eux portent des copies de documents qui ne sont ni légaux ni authentiques, et sur lesquels un long laps de temps s'est parfois écoulé.</p>
