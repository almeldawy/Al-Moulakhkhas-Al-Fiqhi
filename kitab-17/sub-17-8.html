<h3 id="premièrement-le-prix-du-sang-diyah-des-membres"><strong>Premièrement : Le prix du sang (<em>Diyah</em>) des membres :</strong></h3>
<p>⁕ Certains savants ont dit : L'être humain possède quarante-cinq membres. Parmi ces membres, certains sont uniques chez l'homme (présents en un seul exemplaire), et d'autres sont présents en deux exemplaires ou plus :</p>
<p>⁕ Ainsi, si une partie du corps humain qui est unique (dont l'homme ne possède qu'un seul exemplaire), comme le nez, la langue ou le sexe masculin, est détruite, il incombe alors pour celle-ci le prix du sang complet (<em>Diya</em>) de cette même personne à qui elle a été coupée, selon les détails mentionnés précédemment. Et ce, qu'il s'agisse d'un homme ou d'une femme, d'un homme libre ou d'un esclave, d'un <em>Dhimmi</em> (non-musulman sous pacte de protection) ou autre.</p>
<p>Car la destruction de cet organe — dont Allah n'a créé qu'un seul exemplaire chez l'être humain — entraîne la perte totale de la fonction liée à ce genre d'organe, ce qui équivaut à la suppression de la vie elle-même. Dès lors, le prix du sang entier d'une âme devient obligatoire pour cet organe, et cela fait l'objet d'un consensus général (<em>Wifâq</em>).</p>
<p>Et dans le hadith de 'Amr ibn Hazm, il est rapporté que le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="rtl">«وَفِي الذَّكَرِ الدِّيَةُ، وَفِي الأَنْفِ إِذَا أُوعِبَ جَدْعًا الدِّيَةُ، وَفِي اللِّسَانِ الدِّيَةُ»</span></p>
<p><em><strong>« Et pour le sexe masculin, le prix du sang (Diya) [complet] ; pour le nez s'il est entièrement sectionné, le prix du sang ; et pour la langue, le prix du sang »</strong></em>. — Rapporté par Ahmad et An-Nasa'i (la formulation lui appartient), et authentifié par Ahmad, Ibn Hibbân, Al-Hâkim et Al-Bayhaqî <a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a>.</p>
<p>⁕ Et pour tout ce dont l'être humain possède deux exemplaires — comme les deux yeux, les deux oreilles, les deux lèvres, les deux mâchoires (qui sont les deux os dans lesquels sont ancrées les dents), les deux seins de la femme, les deux mamelons de l'homme, les deux mains, les deux pieds et les deux testicules : la destruction des deux [organes d'une même paire] parmi ceux qui ont été cités impose le prix du sang complet (<em>Diya kâmila</em>). Et la destruction de l'un des deux seulement impose la moitié [du prix du sang]. Car ils recèlent tous deux une utilité (fonctionnelle) ainsi qu'une beauté (esthétique), et il n'existe pas d'autres organes de leur même catégorie dans le reste du corps.</p>
<p>Al-Muwaffaq (Ibn Qoudâmah Al-Maqdisî) a dit : <em>« Nous ne connaissons aucun avis divergent à ce sujet. »</em></p>
<p>Et dans l'écrit de 'Amr ibn Hazm, il est rapporté que le Messager d'Allah <span dir="rtl">ﷺ</span> lui a écrit :</p>
<p class="ar"><span dir="rtl">«وَفِي الأَنْفِ إِذَا أُوعِبَ جَدْعاً الدِّيَةُ، وَفِي اللِّسَانِ الدِّيَةُ، وَفِي الشَّفَتَيْنِ الدِّيَةُ، وَفِي البَيْضَتَيْنِ الدِّيَةُ، وَفِي الصُّلْبِ الدِّيَةُ، وَفِي العَيْنَيْنِ الدِّيَةُ، وَفِي الرِّجْلِ الوَاحِدَةِ نِصْفُ الدِّيَةِ».</span></p>
<p><em><strong>« Et pour le nez, s'il est entièrement sectionné, le prix du sang (Diya) [complet] ; pour la langue, le prix du sang ; pour les deux lèvres, le prix du sang ; pour les deux testicules, le prix du sang ; pour la colonne vertébrale, le prix du sang ; pour les deux yeux, le prix du sang ; et pour un seul pied, la moitié du prix du sang. »</strong></em></p>
<p>Ibn 'Abd Al-Barr — qu'Allah lui fasse miséricorde — a dit <a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a>: <em>« Le livre de 'Amr ibn Hazm est célèbre et reconnu auprès des savants, et ce qu'il contient fait l'objet d'un consensus, à l'exception de rares points. »</em></p>
<p>⁕ Et pour tout ce dont l'être humain possède trois exemplaires : s'il les détruit tous ensemble, ils impliquent le prix du sang complet (<em>Diya kâmila</em>), et pour un seul d'entre eux, le tiers du prix du sang. C'est le cas du nez, car il comprend trois éléments : les deux narines et la cloison qui les sépare. Le prix du sang est donc réparti entre eux, à l'instar de la répartition pour les doigts.</p>
<p>⁕ Et pour tout ce dont l'être humain possède quatre exemplaires : s'ils sont tous détruits, ils impliquent le prix du sang complet ; et pour un seul d'entre eux, le quart du prix du sang. C'est le cas des quatre paupières, car elles présentent une beauté évidente et une utilité totale, du fait qu'elles abritent l'œil et le protègent de la chaleur et du froid. Le prix du sang y est donc obligatoire [pour l'ensemble], et pour une partie d'entre elles, proportionnellement à sa valeur.</p>
<p>⁕ Et pour les doigts des deux mains, le prix du sang est complet. Il en est de même pour les orteils des deux pieds : le prix du sang est complet s'ils sont tous coupés. Pour chaque doigt ou orteil, il incombe un dixième du prix du sang, en raison du hadith d'Ibn 'Abbâs élevé jusqu'au Prophète (<em>Marfû'an</em>) :</p>
<p class="ar"><span dir="rtl">«دِيَةُ أَصَابِعِ اليَدَيْنِ وَالرِّجْلَيْنِ سَوَاءٌ عَشْرٌ مِنَ الإِبِلِ لِكُلِّ أُصْبُعٍ»</span></p>
<p><em><strong>« Le prix du sang pour les doigts des mains et les orteils des pieds est identique : dix chameaux pour chaque doigt. »</strong></em> — Rapporté par At-Tirmidhî qui l'a authentifié <a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a>.</p>
<p>Et selon Al-Boukhârî, d'après lui [Ibn 'Abbâs], de manière élevée (<em>Marfû'an</em>) :</p>
<p class="ar"><span dir="rtl">«هَذِهِ وَهَذِهِ سَوَاءٌ» (يَعْنِي: الخِنْصَرَ وَالإِبْهَامَ)</span></p>
<p><em><strong>« Celui-ci et celui-là sont égaux » (c'est-à-dire : l'auriculaire et le pouce)</strong></em> <a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a><em><strong>.</strong></em></p>
<p>⁕ Et pour chaque phalange (<em>Anmoulah</em>) des doigts des mains et des orteils des pieds, il incombe le tiers du dixième du prix du sang [soit 1/30ème de la Diya totale]. En effet, chaque doigt possède trois articulations (phalanges) ; le prix du sang du doigt entier est donc divisé selon leur nombre, tout comme le prix du sang de la main a été réparti équitablement entre les doigts. Quant au pouce, il comporte deux articulations : pour chacune d'elles, il est dû la moitié du dixième du prix du sang [soit 1/20ème de la Diya totale], conformément à ce qui a précédé.</p>
<p>⁕ Et pour chaque dent, il incombe la moitié du dixième du prix du sang (c'est-à-dire : cinq chameaux), en raison du hadith de 'Amr ibn Hazm élevé jusqu'au Prophète (<em>Marfû'an</em>) :</p>
<p class="ar"><span dir="rtl">«وَفِي السِّنِّ خَمْسٌ مِنَ الْإِبِلِ»</span></p>
<p><em><strong>« Et pour la dent, cinq chameaux. »</strong></em> — Rapporté par An-Nasa'i <a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a>.</p>
<p>Al-Muwaffaq (Ibn Qoudâmah) a dit : <em>« Nous ne connaissons aucune divergence sur le fait que le prix du sang des dents est de cinq [chameaux] pour chaque dent. »</em></p>
<h3 id="deuxièmement-le-prix-du-sang-pour-la-perte-des-facultés-les-fonctions-dun-organe"><strong>Deuxièmement : Le prix du sang pour la perte des facultés (les fonctions d'un organe) :</strong></h3>
<p>⁕ Par "facultés" (<em>Al-Manâfi'</em>), on entend les fonctions et l'utilité des organes mentionnés précédemment, telles que l'ouïe, la vue, l'odorat, la parole ou la marche. En effet, chaque organe possède une fonction qui lui est propre.</p>
<p>⁕ Cela inclut quatre des sens qui sont : l'ouïe, la vue, l'odorat et le goût. Pour chacun de ces sens, s'il vient à être anéanti en raison d'une agression, il incombe le prix du sang complet (<em>Diya kâmila</em>).</p>
<p>Ibn Al-Mundhir a dit : <em>« L'ensemble des gens de science s'accorde à l'unanimité sur le fait que la perte de l'ouïe implique le prix du sang. »</em></p>
<p>Al-Muwaffaq (Ibn Qoudâmah) a dit : <em>« Il n'y a aucune divergence quant à l'obligation du prix du sang pour la suppression de l'ouïe. »</em></p>
<p>Et dans l'écrit de 'Amr ibn Hazm : <em>« Et pour le sens de l'odorat (Al-Mashâmm), le prix du sang »</em> <a href="#fn6" class="footnote-ref" id="fnref6" role="doc-noteref"><sup>6</sup></a>.</p>
<p>Cela s'appuie également sur le jugement rendu par 'Omar [ibn Al-Khattâb] ؓ concernant un homme qui en avait frappé un autre, lui faisant ainsi perdre l'ouïe, la vue, la capacité sexuelle et la raison. 'Omar condamna l'agresseur à verser quatre prix du sang distincts (<em>Diyât</em>), alors même que la victime était toujours vivante. Et on ne connaît aucun avis divergent parmi les Compagnons à ce sujet.</p>
<p>⁕ De même, le prix du sang complet est obligatoire pour la perte de chacune des facultés suivantes : la parole, la raison, la marche, la capacité de manger, la capacité sexuelle (<em>Al-Nikâh</em>), ainsi que l'incontinence urinaire ou fécale (la perte du contrôle des sphincters). Car chacune de ces fonctions représente une utilité majeure, dont il n'existe aucun équivalent par ailleurs dans le corps.</p>
<p>⁕ Et il est obligatoire de verser le prix du sang complet (<em>Diya kâmila</em>) pour la perte de chacune des quatre zones de pilosité, qui sont : les cheveux de la tête, les poils de la barbe, les poils des deux sourcils et les cils des deux yeux. Pour un seul sourcil, il incombe la moitié du prix du sang, et pour un seul cil, le quart du prix du sang [de l'œil concerné] ; car le prix du sang est réparti proportionnellement à leur nombre.</p>
<p>C'est à partir de là que l'on mesure le respect et la haute valeur accordés à la barbe en Islam, puisque sa destruction totale exige le prix du sang complet d'un homme. Cela s'explique par son immense utilité, sa beauté et la dignité qu'elle confère. Le Prophète <span dir="rtl">ﷺ</span> a certes ordonné de la laisser pousser généreusement et de l'honorer, de même qu'il a interdit de la raser, de la tailler [excessivement] ou de lui porter atteinte. Malheur donc à ces gens qui lui ont déclaré la guerre et l'ont agressée en la rasant et en la supprimant de leurs visages, cherchant ainsi à ressembler aux femmes, ainsi qu'aux mécréants et aux hypocrites, délaissant de la sorte la virilité et la noblesse d'âme pour sombrer dans l'efféminement... et ainsi de suite.</p>
<p class="ar"><span dir="rtl">يُقْضَى عَلَى الْمَرْءِ فِي أَيَّامِ مِحْنَتِهِ ... حَتَّى يَرَى حَسَنًا مَا لَيْسَ بِالْحَسَنِ</span></p>
<p>L'homme est tellement éprouvé lors de ses jours d'égarement,</p>
<p>Qu'il en vient à considérer comme beau ce qui ne l'est point.</p>
<p>Il incombe donc à ces personnes de retrouver la raison, de faire preuve de bon sens, d'obéir à leur Messager <span dir="rtl">ﷺ</span> et de laisser pousser leur barbe qu'Allah a créée comme une parure de beauté pour eux et un signe distinctif de leur virilité.</p>
