<p>⁕ <strong>Ash-Shijâj (<span dir="rtl">الشِّجَاج</span>ُ) :</strong> C'est le pluriel de <em>Shajjah</em> (<span dir="rtl">شَجَّة</span>). Il s'agit spécifiquement d'une blessure située au niveau de la tête et du visage. Elle a été nommée ainsi d'après le mot <em>Ash-Shajj</em> (<span dir="rtl">الشَّج</span>ّ), qui signifie linguistiquement "la coupure", car elle coupe la peau. Si la coupure se situe ailleurs que sur la tête et le visage, elle est alors appelée simple blessure (<em>Jurh</em> / <span dir="rtl">جُرْح</span>) et non une <em>Shajjah</em>.</p>
<p>⁕ <strong>Et les blessures à la tête (<em>Ash-Shajjah</em>) se divisent</strong>, selon les appellations rapportées par les Arabes, en <strong>dix catégories</strong>. Chaque catégorie possède un nom spécifique ainsi qu'un statut juridique propre :</p>
<p><strong>La première : <em>Al-Hârisah</em> (<span dir="rtl">الْحَارِصَة</span>ُ).</strong> C'est celle qui égratigne la peau, c'est-à-dire qu'elle la fend légèrement sans faire couler de sang. Elle est également appelée <em>Al-Qâshirah</em> (<span dir="rtl">الْقَاشِرَة</span>ُ), car elle pèle la peau.</p>
<p><strong>La deuxième : <em>Al-Bâzilah</em> (<span dir="rtl">الْبَازِلَة</span>ُ).</strong> C'est celle dont le sang coule un peu. Elle est aussi appelée <em>Ad-Dâmi'ah</em> (<span dir="rtl">الدَّامِعَة</span>ُ) par analogie avec les larmes qui coulent de l'œil.</p>
<p><strong>La troisième : <em>Al-Bâdi'ah</em> (<span dir="rtl">الْبَاضِعَة</span>ُ).</strong> C'est celle qui entaille la chair, c'est-à-dire qu'elle la fend après avoir traversé la peau.</p>
<p><strong>La quatrième : <em>Al-Mutalâhimah</em> (<span dir="rtl">الْمُتَلَاحِمَة</span>ُ).</strong> C'est celle qui pénètre profondément dans la chair, et c'est de là que son nom est dérivé (<em>Al-Lahm</em> / la chair).</p>
<p><strong>La cinquième : <em>As-Simhâq</em> (<span dir="rtl">السِّمْحَاق</span>ُ).</strong> C'est celle qui traverse toute la chair, au point qu'il ne reste entre elle et l'os qu'une fine membrane appelée <em>As-Simhâq</em> (le périoste). La blessure qui atteint cette membrane a donc été nommée d'après le nom de celle-ci.</p>
<p>Ces cinq types de blessures à la tête mentionnés ne possèdent pas de montant de compensation financière (<em>Diyah</em>) prédéfini par le Législateur (<em>Ash-Shâri'</em>). On évalue donc pour elles une compensation estimée (<em>Hukûmah</em>), que le juge s'efforce de déterminer par effort de réflexion (<em>Ijtihâd</em>).</p>
<p><strong>La sixième : <em>Al-Mûdihah</em> (<span dir="rtl">الْمُوضِحَة</span>ُ).</strong> C’est celle qui rend l’os apparent et le découvre. Sa compensation (<em>Diyah</em>) est de cinq chameaux, en raison du Hadith de 'Amr ibn Hazm :</p>
<p class="ar"><span dir="rtl">«وَفِي الْمُوضِحَةِ خَمْسٌ مِنَ الْإِبِلِ»</span></p>
<p><em><strong>« Et pour la blessure qui laisse apparaître l'os (Al-Mûdihah), cinq chameaux. »</strong></em><a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a></p>
<p><strong>La septième : <em>Al-Hâshimah</em> (<span dir="rtl">الْهَاشِمَة</span>ُ).</strong> C’est celle qui rend l’os apparent et le fracasse, c’est-à-dire qu’elle le brise. Elle exige une compensation de dix chameaux. Cela est rapporté d'après Zayd ibn Thâbit (qu'Allah l'agrée), et on ne lui connaît aucun opposant parmi les Compagnons à son époque.</p>
<p><strong>La huitième : <em>Al-Munaqqilah</em> (<span dir="rtl">الْمُنَقِّلَة</span>ُ).</strong> C’est celle qui rend l’os apparent, le fracasse et déplace les fragments osseux, de sorte qu’ils nécessitent d'être réassemblés pour pouvoir se ressouder. Elle exige une compensation de quinze chameaux, en raison du Hadith de 'Amr ibn Hazm que le Prophète <span dir="rtl">ﷺ</span> lui avait écrit, où il est dit :</p>
<p class="ar"><span dir="rtl">«وَفِي الْمُنَقِّلَةِ خَمْسَ عَشْرَةَ مِنَ الْإِبِلِ».</span></p>
<p><em><strong>« Et pour la blessure qui déplace les os (Al-Munaqqilah), quinze chameaux. »</strong></em><a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a></p>
<p><strong>La neuvième : <em>Al-Ma'mûmah</em> (<span dir="rtl">الْمَأْمُومَة</span>ُ).</strong> C’est celle qui atteint la dure-mère (<em>Oumm Ad-Dimâgh</em>), c'est-à-dire la membrane qui enveloppe le cerveau.</p>
<p><strong>La dixième : <em>Ad-Dâmighah</em> (<span dir="rtl">الدَّامِغَة</span>ُ).</strong> C’est celle qui transperce cette membrane (la dure-mère).</p>
<p>Pour chacune de ces deux blessures à la tête — <em>Al-Ma'mûmah</em> et <em>Ad-Dâmighah</em> —, il incombe un tiers du prix du sang (<em>Thuluth Ad-Diyah</em>). Cela s'appuie sur le Hadith de 'Amr ibn Hazm : « Et pour <em>Al-Ma'mûmah</em>, un tiers du prix du sang. » <em>Ad-Dâmighah</em> étant plus grave encore que cette dernière, elle y donne droit à plus forte raison. Le plus souvent, la victime d'une telle blessure n'en réchappe pas, et c'est pourquoi il n'est pas parvenu d'évaluation textuelle spécifique à son sujet.</p>
<p><strong>Et pour la blessure pénétrante (<em>Al-Jâ'ifah</em>), un tiers du prix du sang est dû</strong>, en raison de ce qui figure dans l'écrit de 'Amr ibn Hazm :</p>
<p class="ar"><span dir="rtl">«وَفِي الْجَائِفَةِ ثُلُثُ الدِّيَةِ»</span></p>
<p><em><strong>« Et pour la blessure pénétrante (Al-Jâ'ifah), un tiers du prix du sang. »</strong></em></p>
<p>L'Imam Al-Muwaffaq (Ibn Qoudamah) a dit : <em>« C'est l'avis de la majorité des gens de science, parmi lesquels les savants de Médine, les savants de Koufa, les gens du Hadith (Ahl Al-Hadîth) et les partisans du raisonnement (As-hâb Ar-Ra'y). »</em></p>
<p><strong>Ce que l'on entend par <em>Al-Jâ'ifah</em> :</strong> Il s'agit de la blessure qui atteint l'intérieur d'une cavité corporelle, qu'il s'agisse de l'abdomen, du dos, de la poitrine, de la gorge ou de la vessie.</p>
<p>⁕ <strong>Quant à ce qui incombe pour la fracture des os :</strong></p>
<p>- <strong>Pour la côte</strong>, lorsqu'elle se ressoude correctement après avoir été fracturée comme elle l'était initialement, il incombe : <strong>un chameau</strong>. De même, il incombe pour <strong>chacune des deux clavicules : un chameau</strong>. Cela s'appuie sur ce qui a été rapporté d'après 'Omar (qu'Allah l'agrée), qui a dit :</p>
<p class="ar"><span dir="rtl">«فِي الضِّلْعِ جَمَلٌ، وَفِي التَّرْقُوَةِ جَمَلٌ»</span></p>
<p><em><strong>« Pour la côte, un chameau ; et pour la clavicule, un chameau. »</strong></em><a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a> La clavicule (<em>At-Tarquwah</em>) est l'os arrondi situé autour du cou, allant de la base de la gorge jusqu'à l'épaule. Chaque être humain possède deux clavicules.</p>
<p>- Si la côte ou la clavicule se ressoude de manière incorrecte (sans retrouver sa rectitude), il incombe alors pour cela <strong>une compensation estimée (<em>Hukûmah</em>)</strong>.</p>
<p>- <strong>Pour la fracture de l'avant-bras</strong> — qui est la partie reliant les deux os du cubitus/radius à l'humérus —, lorsqu'il se ressoude correctement, il incombe : <strong>deux chameaux</strong>. Cette même sentence s'applique également pour la fracture du <strong>cuisseau (fémur)</strong>, la fracture de la <strong>jambe (tibia/péroné)</strong> et la fracture de l'un des <strong>os de l'avant-bras</strong>. Cela s'appuie sur ce que Sa'îd a rapporté d'après 'Amr ibn Chou'ayb : <em><strong>« 'Amr ibn Al-'Âs (qu'Allah l'agrée) écrivit à 'Omar au sujet de l'un des deux os de l'avant-bras lorsqu'il est fracturé. 'Omar lui répondit par écrit qu'il implique une compensation de deux chameaux, et si les deux os de l'avant-bras sont fracturés, ils impliquent quatre chameaux. »</strong></em><a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a> Et on ne lui a connu aucun opposant parmi les Compagnons.</p>
<p>⁕ <strong>Voilà ce pour quoi il est parvenu une évaluation déterminée</strong> concernant les blessures et les fractures. Quant à toute autre blessure ou fracture d'os non mentionnée — comme la fracture des vertèbres de la colonne vertébrale (<em>Kharaz As-Sulb</em>) ou de l'os du pubis (<em>'Azm Al-'Ânah</em>) —, elle implique alors une compensation estimée (<em>Hukûmah</em>).</p>
<p><strong>Et le sens de la <em>Hukûmah</em> (la compensation estimée) est le suivant :</strong> on estime la valeur de la victime comme s'il s'agissait d'un esclave exempt de toute agression. Ensuite, on réévalue sa valeur (en tant qu'esclave) une fois que sa blessure est guérie. La diminution constatée sur sa valeur initiale représente la proportion que la victime est en droit de percevoir sur le montant total du prix du sang (<em>Ad-Diyah</em>).</p>
<p><strong>Exemple de cela :</strong> Si l'on estime que sa valeur, s'il avait été un esclave bien portant, était de soixante, et que sa valeur suite à l'agression est de cinquante ; il incombe alors un sixième de son prix du sang (<em>Diyah</em>). En effet, la perte constatée par l'estimation est de un sur six, ce qui correspond à un sixième de sa valeur. La victime a donc droit à un sixième de son prix du sang.</p>
<p>L'Imam Al-Muwaffaq (Ibn Qoudamah) — qu'Allah lui fasse miséricorde — a dit : <em>« L'avis authentique est qu'il n'y a pas d'évaluation déterminée textuellement en dehors de ces cinq os : la côte, les deux clavicules et les deux os de l'avant-bras (cubitus/radius). Car l'évaluation fixe ne s'établit que par un texte prophétique (Tawqîf). Or, ce qui découle de la preuve est l'obligation d'appliquer une compensation estimée (Hukûmah) pour l'ensemble de ces os internes (c'est-à-dire en dehors de ces cinq), conformément au jugement de 'Omar... »</em> Fin de citation.</p>
<p>Les juristes (<em>Al-Fuqahâ</em>) — qu'Allah leur fasse miséricorde — ont dit : Si la blessure pour laquelle on doit procéder à une compensation estimée (<em>Hukûmah</em>) se situe à un endroit pour lequel il existe un montant fixe établi par la Législation — comme une blessure à la tête inférieure à celle qui laisse apparaître l'os (<em>Al-Mûdihah</em>) —, il n'est alors pas permis que le montant de sa <em>Hukûmah</em> atteigne la compensation fixée pour <em>Al-Mûdihah</em>. En effet, si la blessure avait été une <em>Mûdihah</em>, son amende n'aurait pas dépassé cinq chameaux ; il est donc fort logique qu'une blessure de moindre gravité ne la dépasse pas.</p>
<p><strong>⁕ Et si la victime guérit et rediffuse de sa condition initiale</strong>, de sorte que l'agression ne lui cause aucune diminution (séquelle) ; on l'estime alors au moment où le sang coulait. En effet, il y a nécessairement dans cette situation une dépréciation de sa valeur en raison de la crainte pour sa vie et de l'impact immédiat de la blessure sur lui à ce moment-là.</p>
