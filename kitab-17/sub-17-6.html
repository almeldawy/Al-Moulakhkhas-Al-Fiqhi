<p>⁕ <strong>Le terme <em>Diyât</em> est le pluriel de <em>Diyah</em></strong>. Il s'agit du bien financier versé à la victime d'un crime ou à son ayant droit (tuteur) en raison d'une infraction subie. On dit en arabe : « J'ai payé le prix du sang du tué » (<em>wadaytu al-qatîl</em>) lorsque l'on s'acquitte de sa <em>Diyah</em>. Le mot <em>Diyah</em> est donc le nom d'action (masdar) du verbe <em>wada</em>. Le <em>hâ’</em> [le suffixe <span dir="rtl">ة</span>] y remplace le <em>wâw</em> [<span dir="rtl">و</span>] qui a été supprimé, à l'instar des mots <em>'idah</em> (promesse) et <em>silah</em> (lien) dérivés de <em>al-wa'd</em> et <em>al-wasl</em>.</p>
<p>⁕ <strong>La preuve de l'obligation de la <em>Diyah</em> repose sur le Livre (le Coran), la Sunnah et le Consensus (al-Ijmâ').</strong></p>
<p>Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿وَمَن قَتَلَ مُؤْمِنًا خَطَأً فَتَحْرِيرُ رَقَبَةٍ مُُّؤْمِنَةٍ وَدِيَةٌ مُُّسَلَّمَةٌ إِلَىٰ أَهْلِهِ﴾ ... الآية [النساء: ٩٢]</span></p>
<p><strong>﴾ Quiconque tue un croyant par erreur, qu'il affranchisse un esclave croyant et remette à sa famille le prix du sang...﴿</strong> ... fin du verset [Sourate An-Nisâ' : 92].</p>
<p>Et dans le hadith authentique :</p>
<p class="ar"><span dir="rtl">«مَنْ قُتِلَ لَهُ قَتِيلٌ؛ فَهُوَ بِخَيْرِ النَّظَرَيْنِ: إِمَّا أَنْ يَفْدِيَ، وَإِمَّا أَنْ يُقْتَلَ»</span></p>
<p><em><strong>« Quiconque a un proche tué est face au meilleur des deux choix : soit recevoir la compensation financière (la rançon), soit que le coupable soit exécuté (Talion). »</strong></em> Rapporté par le groupe de savants du hadith <a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a>.</p>
<p>⁕ <strong>La <em>Diyah</em> est obligatoire pour quiconque cause la mort d'un être humain de manière directe</strong>, comme s'il l'avait frappé ou renversé avec une voiture, <strong>ou de manière indirecte (par causalité)</strong>, comme celui qui creuse un puits sur un chemin ou y dépose une pierre à cause de laquelle une personne trouve la mort. Cela s'applique que la victime soit musulmane, citoyenne non-musulmane (dhimmi), bénéficiaire d'un droit d'asile (musta'man) ou liée par un pacte de paix (muhâdin), conformément à la parole d'Allah le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿وَإِن كَانَ مِن قَوْمٍ بَيْنَكُمْ وَبَيْنَهُم مِّيثَاقٌ فَدِيَةٌ مُُّسَلَّمَةٌ إِلَىٰ أَهْلِهِ﴾ [النساء: ٩٢]</span></p>
<p><strong>﴾ S'il appartenait à un peuple auquel vous êtes liés par un pacte, qu'on remette alors le prix du sang à sa famille ﴿</strong> [Sourate An-Nisâ' : 92].</p>
<p>⁕ <strong>Si l'infraction ayant causé la mort de la victime est un homicide volontaire pur</strong>, la <em>Diyah</em> doit alors être intégralement payée à partir des biens propres du criminel et de manière immédiate. En effet, la règle de base exige que la compensation d'un élément détruit incombe directement à celui qui l'a détruit.</p>
<p><strong>Al-Muwaffaq Ibn Qoudâmah a dit :</strong> <em>« Les gens de science se sont accordés à l'unanimité sur le fait que le prix du sang (Diyah) pour un homicide volontaire incombe aux biens propres du tueur, et qu'il n'est pas pris en charge par sa famille élargie (Al-'Âqilah). C'est d'ailleurs ce qu'exige la règle de base, car le Très-Haut a dit : ﴾ Et nulle âme ne portera le fardeau d'une autre﴿ [Sourate Al-An'âm : 164]. »</em> Fin de citation.</p>
<p><strong>Cette règle fondamentale n'a été transgressée concernant la <em>Diyah</em> de l'homicide involontaire (par erreur) qu'en raison de la fréquence de l'erreur.</strong> En effet, les délits par inadvertance sont nombreux et le prix du sang pour un être humain est élevé ; l'imposer au seul coupable sur ses propres biens lui causerait ainsi un préjudice considérable (la ruine).</p>
<p>La sagesse [divine] a donc exigé de l'imposer à la <em>'Âqilah</em> (la famille élargie/les proches du tueur) à titre de solidarité et d'assistance envers le tueur afin de le soulager, car il bénéficie d'une excuse (l'absence d'intention de tuer).</p>
<p>À l'inverse, l'auteur d'un acte volontaire ne dispose d'aucune excuse ; il ne mérite donc aucun allègement. De plus, la peine du talion (<em>Al-Qisâs</em>) lui était initialement applicable. Par conséquent, s'il obtient le pardon [de la famille de la victime en échange du prix du sang], il doit assumer lui-même la <em>Diyah</em> en guise de rançon pour racheter sa propre vie. Cette <em>Diyah</em> devient alors exigible immédiatement (non échelonnée), à l'instar de toute autre compensation due pour un bien détruit ou dégradé.</p>
<p>⁕ <strong>Quant au prix du sang (<em>Diyah</em>) pour l'homicide involontaire assimilé au volontaire (<em>Shibh al-'Amd</em>) et pour l'homicide involontaire pur (<em>Al-Khata'</em>), ils incombent tous deux à la famille élargie (<em>'Âqilah</em>) du tueur.</strong> Cela s'appuie sur le hadith d'Abu Hurayrah (qu'Allah l'agrée) qui a dit : « Deux femmes de la tribu de Hudhayl se sont battues. L'une d'elles a jeté une pierre sur l'autre, la tuant ainsi que l'enfant qu'elle portait dans son ventre. Le Messager d'Allah <span dir="rtl">ﷺ</span> a alors jugé que le prix du sang de la femme incombait à sa <em>'Âqilah</em> » (Rapporté de manière consensuelle par Al-Boukhari et Moslim) <a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a> . Ce hadith prouve donc que la <em>Diyah</em> de l'homicide assimilé au volontaire (<em>Shibh al-'Amd</em>) est prise en charge par la <em>'Âqilah</em> du tueur.</p>
<p>⁕ <strong>Concernant la <em>Diyah</em> de l'homicide involontaire pur (<em>Al-Khata')</em></strong>, Ibn al-Mundhir a dit : <em>« Tous les gens de science dont nous avons conservé les avis s'accordent à l'unanimité pour dire qu'elle incombe à la 'Âqilah. »</em> Et Al-Muwaffaq [Ibn Qoudâmah] a dit : <em>« Nous ne connaissons aucune divergence sur le fait qu'elle incombe à la 'Âqilah. »</em> Il en va de même pour la <em>Diyah</em> de ce qui est assimilé à l'erreur (par extension), comme le cas d'une personne endormie qui se retourne sur un individu et l'étouffe à mort, ou le fait de creuser injustement (sans autorisation) un puits dans lequel une personne tombe et trouve la mort.</p>
<p>⁕ <strong>Tout dommage ou décès découlant d'un acte légalement autorisé en charia ne donne lieu à aucune compensation (<em>ghayr madmûn</em>).</strong> C'est le cas, par exemple, si un homme corrige [fût-ce de manière symbolique et éducative] son enfant ou son épouse, ou si un gouverneur corrige l'un de ses administrés, sans qu'aucun d'eux ne commette d'excès dans cette correction, et que la personne corrigée vient à mourir : il n'incombe alors <strong>aucune obligation [financière ou pénale] à celui qui a dispensé la correction. En effet, il n'a fait qu'accomplir un acte qui lui est religieusement permis sans commettre de transgression.</strong> En revanche, s'il se montre excessif dans la correction en dépassant la mesure d'usage et que la personne corrigée en meurt, il doit alors en assumer la responsabilité financière (<em>damina-hu</em>), en raison de la transgression caractérisée par son excès.</p>
<p>⁕ <strong>Si la correction est administrée à une femme enceinte et qu'elle avorte de son fœtus à cause de cela</strong>, il incombe alors à celui qui a dispensé la correction de compenser la perte du fœtus par une <em>Ghourrah</em> (l'équivalent de la valeur d'un esclave, homme ou femme). Cela s'appuie sur ce qui est rapporté dans les deux recueils authentiques (Al-Boukhari et Muslim) : <em><strong>« Le Prophète <span dir="rtl">ﷺ</span> a jugé, concernant l'avortement provoqué de la femme (suite à un coup ou un effroi), qu'une compensation d'un esclave homme ou femme était due »</strong></em> <a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a>. C'est là l'avis de la majorité des gens de science.</p>
<p>⁕ <strong>De même, quiconque effraie une femme enceinte, provoquant ainsi sa fausse couche, doit assumer la responsabilité financière du fœtus</strong> en raison de sa perte causée par cet effroi. C'est le cas, par exemple, si le gouverneur la fait convoquer ou qu'un homme envoie la police contre elle. Cela repose sur ce qui a été rapporté au sujet de 'Omar [Ibn Al-Khattâb] (qu'Allah l'agrée) : <em><strong>« Il fit convoquer une femme dont l'époux était absent et chez qui des personnes se rendaient. Elle s'écria : "Malheur à moi ! Qu'a donc 'Omar à mon encontre ?" En chemin, elle fut saisie d'effroi, fut prise des douleurs de l'accouchement et mit au monde un enfant qui poussa deux cris avant de mourir. 'Omar consulta alors les compagnons du Prophète <span dir="rtl">ﷺ</span>. Certains dirent : "Tu n'as rien à te reprocher". 'Ali dit alors : "S'ils ont parlé pour abonder dans ton sens, ils ne t'ont pas conseillé sincèrement. Son prix du sang (Diyah) t'incombe, car tu l'as effrayée et c'est ainsi qu'elle a accouché" »</strong></em> <a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a>.</p>
<p>⁕ <strong>Quiconque ordonne à une personne juridiquement responsable (majeure et douée de raison - <em>Mukallaf</em>) de descendre dans un puits ou de monter sur un arbre ou autre</strong>, et que celle-ci s'exécute puis trouve la mort en raison de sa descente ou de sa montée, le donneur d'ordre n'en est pas tenu responsable financièrement. En effet, il n'a commis aucun crime ni aucune transgression directe à son encontre.</p>
<p><strong>Cependant, si la personne ayant reçu l'ordre n'est pas juridiquement responsable</strong> , le donneur d'ordre doit en assumer la responsabilité financière, car il est la cause directe de sa perte.</p>
<p><strong>De la même manière, si quelqu'un engage un travailleur salarié pour descendre dans un puits ou monter sur un arbre, et que celui-ci meurt à cause de cela</strong>, l'employeur (<em>Al-Musta'jir</em>) n'en est pas responsable financièrement, car il n'a commis ni crime ni transgression.</p>
<p>⁕ <strong>Et quiconque fait appel à quelqu'un pour lui creuser un puits dans sa demeure, et que ce dernier meurt suite à un éboulement que personne ne lui a causé, sa mort est alors considérée comme une perte sans réparation (<em>Hadar</em>)</strong>, en raison de l'absence de toute transgression commise à son encontre.</p>
<p><strong>À travers cela, nous mesurons l'immense importance que l'Islam accorde à la préservation des vies humaines et à la protection du sang des innocents.</strong></p>
<p><strong>Cependant, à notre époque, la négligence vis-à-vis de cette responsabilité s'est largement propagée par le fait de ceux qui se montrent imprudents au volant de leurs véhicules.</strong> Ils exposent ainsi leur propre vie et celle d'autrui à la destruction. Combien de vies innocentes et sacrées ont péri à cause de cela ! Parfois, un groupe entier ou une famille complète est décimée par la faute d'un conducteur écervelé et téméraire, incapable d'estimer la responsabilité qui lui incombe et de mesurer les conséquences de ses actes. La cause première de cette situation revient parfois aux pères de ces adolescents ou jeunes inconscients, lorsqu'ils leur achètent des voitures luxueuses et les leur confient, leur permettant ainsi de faucher des vies innocentes. En agissant de la sorte, ils leur remettent en réalité une arme mortelle avec laquelle ils s'amusent, moissonnant des vies et terrorisant les personnes paisibles.</p>
<p><strong>Il est donc du devoir de ces parents de craindre Allah vis-à-vis de leurs enfants et des vies des musulmans.</strong> De même, il incombe aux gouverneurs – qu'Allah leur accorde la réussite – de réprimer fermement tout le monde afin de garantir la sécurité de chacun et de stabiliser l'ordre public. Certes, Allah réprime par le pouvoir temporel (le gouverneur) ce qu'Il ne réprime pas par le seul Coran.</p>
