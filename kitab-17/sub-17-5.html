  <!-- ▼ CONTENU DU CHAPITRE ▼ -->

<p>⁕ Si un groupe de personnes participe au meurtre d'une personne de manière intentionnelle et agressive, le talion est exercé contre eux tous en sa faveur, et ils sont exécutés pour ce meurtre, selon l'avis authentique (correct) des deux avis des savants — qu'Allah leur fasse miséricorde. Cela s'appuie sur la portée générale de la parole d'Allah le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿يَٰأَيُّهَا ٱلَّذِينَ ءَامَنُواْ كُتِبَ عَلَيْكُمُ ٱلْقِصَاصُ فِي ٱلْقَتْلَىۖ...﴾ إِلَى قَوْلِهِ تَعَالَى: ﴿وَلَكُمْ فِي ٱلْقِصَاصِ حَيَوٰةٌ يَٰأُوْلِي ٱلْأَلْبَٰبِ لَعَلَّكُمْ تَتَّقُونَ﴾ [البقرة]</span></p>
<p><strong>﴾ Ô vous qui croyez ! Le talion vous est prescrit en matière de meurtre… ﴿</strong> jusqu'à Sa parole : <strong>﴾ C’est dans le talion que vous avez la préservation de la vie, ô vous doués d'intelligence, afin que vous soyez pieux ﴿</strong> [Al-Baqarah]. Cela s'appuie également sur le consensus (<em>Ijma'</em>) des Compagnons à ce sujet. En effet, Sa'id ibn al-Musayyib a rapporté qu'Umar ibn al-Khattab — qu'Allah l'agrée — a fait exécuter sept personnes parmi les habitants de Sanaa qui avaient tué un seul homme, et il a dit — qu'Allah l'agrée : <em><strong>« Si tous les habitants de Sanaa s'étaient ligués contre lui, je les aurais tous exécutés pour lui »</strong></em><a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a>. Il est également établi d'après d'autres Compagnons l'application du talion à un groupe pour le meurtre d'un seul individu, et aucun opposant ne leur a été connu à leur époque ; cela constitue donc un consensus.</p>
<p>L'Imam, le grand savant Ibn al-Qayyim <a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a> — qu'Allah lui fasse miséricorde — a dit : <em>« Les Compagnons et la majorité des juristes se sont accordés sur l'exécution du groupe pour le meurtre d'un seul individu, même si le principe de base du talion s'y opposerait [en apparence], afin que l'absence de talion ne devienne pas un prétexte (un moyen) pour s'entraider à verser le sang. »</em> Fin de citation.</p>
<p>Et Ibn Rushd a dit <a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a> : <em>« Le concept profond du talion est que la mise à mort n'a été légiférée que pour bannir le meurtre, comme le Coran l'a souligné. Si le groupe n'était pas exécuté pour le meurtre d'un seul, les gens utiliseraient cela comme un moyen de tuer, en s'organisant à plusieurs pour préméditer le meurtre d'une seule personne. De plus, l'apaisement [des familles des victimes] et la dissuasion ne s'obtiennent que par la mise à mort de tous. »</em> Fin de citation.</p>
<p>⁕ Il est conditionné, pour l'application du talion à un groupe pour le meurtre d'une seule personne, que l'acte de chacun d'eux soit de nature à donner la mort s'il avait été accompli isolément. Cela se réalise lorsque tous participent directement à l'exécution du meurtre, et que l'acte de chacun d'eux aurait été mortel s'il avait été seul.</p>
<p>Cependant, si l'acte de chacun d'eux n'était pas de nature à causer la mort s'il avait été commis seul, mais qu'ils se sont ligués et mis d'accord pour tuer la victime, le talion s'applique alors à eux tous, car celui qui n'a pas porté le coup direct a servi de soutien et de renfort à celui qui l'a porté.</p>
<p>⁕ Quiconque contraint une personne à en tuer une autre, et que celle-ci l'exécute, le talion devient obligatoire à la fois pour l'instigateur (celui qui contraint) et pour l'exécuteur (celui qui est contraint), si les conditions requises sont réunies. En effet, l'exécuteur a cherché à préserver sa propre vie en prenant celle d'autrui, tandis que l'instigateur a causé le meurtre par un moyen qui y mène généralement.</p>
<p>⁕ Quiconque ordonne à un enfant (mineur) ou à un aliéné (fou) de tuer une personne, et que celui-ci la tue, le talion s'impose uniquement à l'ordonnateur (celui qui donne l'ordre). En effet, l'exécutant n'est qu'un instrument entre les mains de l'ordonnateur, et il est impossible de lui imposer le talion ; il est donc obligatoire que la peine repose sur celui qui en a été la cause.</p>
<p>Il en va de même si l'exécutant est juridiquement responsable (<em>Mukallaf</em>, c'est-à-dire pubère et doué de raison), mais qu'il ignore l'interdiction du meurtre — comme celui qui a grandi en dehors des terres de l'Islam. Le talion est alors obligatoire pour l'ordonnateur, car il est inapplicable à l'encontre de l'exécutant en raison de son ignorance ; la peine incombe donc à celui qui a causé l'acte.</p>
<p>Quant à l'exécutant qui est pubère, doué de raison et qui n'ignore pas l'interdiction, le talion s'impose obligatoirement à lui en raison de sa participation directe au meurtre injustifié. Le Prophète <span dir="rtl">ﷺ</span> a dit en effet :</p>
<p class="ar"><span dir="rtl">«لَا طَاعَةَ لِمَخْلُوقٍ فِي مَعْصِيَةِ الْخَالِقِ»</span></p>
<p><em><strong>« Point d'obéissance à une créature dans la désobéissance au Créateur »</strong></em> <a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a>, que l'ordonnateur soit un gouverneur, un maître ou autre. Dans ce cas, l'ordonnateur est passible d'une peine discrétionnaire (<em>Ta'zîr</em>) selon ce que le gouverneur (l'autorité) juge approprié, car il a commis un péché, et afin qu'il en soit dissuadé.</p>
<p>⁕ Si deux personnes participent au meurtre d'une personne de manière intentionnelle et agressive, et que l'une d'elles ne remplit pas les conditions requises pour l'obligation du talion alors que l'autre les remplit, le talion s'applique obligatoirement à celle qui remplit les conditions. En effet, elle a pris part à un meurtre intentionnel et agressif, et si le talion n'a pas pu être appliqué à son complice, c'est en raison d'une situation (ou d'un statut) qui lui est propre, et non à cause d'un manquement dans la cause même du talion. La peine est donc obligatoire pour celui qui ne présente aucun empêchement légal à son application.</p>
<p>Quiconque maintient (immobilise) un être humain pour un autre jusqu'à ce que ce dernier le tue : le meurtrier est alors exécuté [en vertu du talion], tandis que celui qui l'a maintenu est emprisonné jusqu'à sa mort.</p>
<p>⁕ De même que le talion est appliqué à un groupe en faveur d'une seule personne pour l'homicide (l'âme), il lui est également appliqué à leur encontre pour l'amputation d'un membre et pour les blessures. Ainsi, si un groupe ampute un membre ou cause une blessure qui nécessite le talion (<em>Al-Qawad</em>), et qu'il n'est pas possible de distinguer les actes des uns et des autres — comme s'ils plaçaient une lame sur la main d'une personne et qu'ils appuyaient tous ensemble dessus jusqu'à ce que la main soit coupée —, il est alors obligatoire de leur couper la main à tous. Cela s'appuie sur ce qui a été rapporté d'après 'Ali — qu'Allah l'agrée : deux témoins avaient témoigné devant lui contre un homme pour vol, il lui coupa donc la main. Ensuite, ils revinrent en amenant un autre individu et dirent : <em><strong>« C'est lui le voleur, et nous nous sommes trompés au sujet du premier »</strong></em>. 'Ali rejeta alors leur témoignage contre le second, leur imposa de payer le prix du sang (<em>Diyah</em>) du premier, et dit : « Si j'avais su que vous aviez fait cela intentionnellement, je vous aurais coupé les mains à tous les deux ». Rapporté par Al-Boukhari et d'autres <a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a>. Cela prouve que le talion se serait appliqué à chacun d'eux s'ils avaient agi intentionnellement, et cela s'aligne par analogie (<em>Qiyas</em>) sur le cas du groupe exécuté pour le meurtre d'une seule personne.</p>
<p>⁕ La complication (la propagation des séquelles) d'une agression sur l'âme ou sur ce qui est moindre a le même statut juridique que l'agression initiale, car elle en est la conséquence directe, et la conséquence d'un acte dont on est garant engage également la responsabilité. Ainsi, si quelqu'un coupe un doigt, et que la nécrose se propage à un autre doigt ou à la main entière au point qu'elle tombe de son articulation, le talion devient obligatoire pour la main complète. Et si l'atteinte se propage jusqu'à causer la mort de la victime, le talion pour homicide s'impose alors.</p>
<p>⁕ Il n'est pas permis d'appliquer le talion pour un membre ou une blessure avant sa guérison complète, en raison du hadith de Jâbir : « Un homme en avait blessé un autre, et la victime voulut appliquer le talion immédiatement... Le Prophète <span dir="rtl">ﷺ</span> interdit alors que le talion soit exercé sur l'auteur de la blessure tant que le blessé n'était pas complètement guéri. » Rapporté par Al-Dâraqutnî et d'autres <a href="#fn6" class="footnote-ref" id="fnref6" role="doc-noteref"><sup>6</sup></a>. Cela est prescrit dans l'intérêt de la victime elle-même. En effet, l'agression peut se propager (complication) à un autre membre ou à l'âme (entraîner la mort) ; il est donc indispensable de connaître l'issue finale des séquelles de l'agression. Si la victime exerçait le talion avant sa guérison, et que l'agression se propageait par la suite, elle ne pourrait plus rien réclamer, car elle a agi avec précipitation, annulant ainsi son droit. Cela s'appuie aussi sur le hadith de 'Amr ibn Shou'ayb, d'après son père, d'après son grand-père : un homme en avait poignardé un autre au genou avec une corne. Le blessé vint trouver le Prophète <span dir="rtl">ﷺ</span> et dit : « Accorde-moi le talion ! ». Le Prophète dit : « Attends d'être guéri ». Plus tard, l'homme revint et dit : « Accorde-moi le talion ! », et le Prophète le lui accorda. Plus tard encore, l'homme revint et dit : « Ô Messager d'Allah ! Je boite désormais à présent ». Le Prophète dit alors : « Je te l'avais interdit, mais tu m'as désobéi. Qu'Allah t'éloigne [de Sa miséricorde] ! Ta boiterie ne sera pas compensée (ton droit est caduc) ». Puis, le Messager d'Allah <span dir="rtl">ﷺ</span> interdit définitivement d'exercer le talion pour une blessure avant la guérison totale du blessé. Rapporté par Ahmad et Al-Dâraqutnî <a href="#fn7" class="footnote-ref" id="fnref7" role="doc-noteref"><sup>7</sup></a>.</p>
<p>Par cela, ô musulman, tu prends connaissance des beautés de la Législation islamique (<em>Charî'ah</em>), ainsi que de sa parfaite justice et de sa miséricorde globale. Et Allah le Très-Grand a dit la vérité :</p>
<p class="ar"><span dir="rtl">﴿وَتَمَّتْ كَلِمَتُ رَبِّكَ صِدْقاً وَعَدْلاً لَّا مُبَدِّلَ لِكَلِمَٰتِهِۦۚ وَهُوَ ٱلسَّمِيعُ ٱلْعَلِيمُ﴾ [الأنعام]</span></p>
<p><strong>﴾ Et la parole de ton Seigneur s'est accomplie en toute vérité et justice. Nul ne peut modifier Ses paroles. Il est l'Audient, l'Omniscient. ﴿</strong> [Al-An'âm].</p>
<p>Malheur donc à un peuple qui substitue à celle-ci d'autres jugements parmi les lois du Tâghoût et les législations positives humaines, imparfaites et injustes.</p>
<p class="ar"><span dir="rtl">﴿بِئْسَ لِلظَّٰلِمِينَ بَدَلًا﴾ [الكهف: ٥٠]</span></p>
<p><strong>﴾ Quel détestable échange pour les injustes ! ﴿</strong> [Al-Kahf : 50].</p>
<p>Et la louange est à Allah, Seigneur des mondes.</p>
