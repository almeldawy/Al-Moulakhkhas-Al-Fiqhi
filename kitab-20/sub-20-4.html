<p>⁕ <strong>Le vœu au sens linguistique :</strong> L'obligation ( <span dir="rtl">الْإِيجَاب</span>ُ ). On dit : « J'ai voué telle chose », lorsque tu t'imposes une chose à toi-même. ( <span dir="rtl">نَذَرْتُ كَذَا: إِذَا أَوْجَبْتَهُ عَلَى نَفْسِك</span>َ )</p>
<p><strong>Sa définition sur le plan religieux (Shar'î) :</strong> C'est le fait, pour une personne responsable (moukallaf) et libre de son choix (moukhtâr), de s'imposer à elle-même une chose pour Allah le Très-Haut. ( <span dir="rtl">إِلْزَامُ مُكَلَّفٍ مُخْتَارٍ نَفْسَهُ شَيْئاً لِلَّهِ تَعَالَى</span> )</p>
<p>⁕ Le vœu est une forme d'adoration parmi d'autres. Il n'est pas permis de l'adresser à un autre qu'Allah le Très-Haut. Ainsi, quiconque fait un vœu pour autre qu'Allah le Très-Haut – que ce soit pour une tombe, un ange, un prophète ou un saint (walî) – a certes commis une association majeure (Ac-Chirk al-Akbar) qui fait sortir de l'Islam, car par cet acte, il a adoré autre qu'Allah.</p>
<p>De ce fait, ceux qui, de nos jours, font des vœux pour les tombes des saints et des pieux ont certes commis une association majeure envers Allah – et nous cherchons refuge auprès d'Allah contre cela. Il leur est donc obligatoire de se repentir à Allah, de prendre garde à cela, et d'avertir leur peuple afin qu'ils s'en préservent.</p>
<p>⁕ Le statut initial du vœu (le fait d'en formuler un au départ) est qu'il est détestable (makroûh), et un groupe de savants l'a même jugé interdit (harâm). Cela s'appuie sur ce qu'a rapporté Ibn 'Umar (qu'Allah l'agrée, lui et son père), selon lequel le Prophète <span dir="rtl">ﷺ</span> a interdit le vœu en disant :</p>
<p class="ar"><span dir="rtl">«إِنَّهُ لَا يَرُدُّ شَيْئاً، وَإِنَّمَا يُسْتَخْرَجُ بِهِ مِنَ الْبَخِيلِ»</span></p>
<p><em><strong>« Certes, il (le vœu) ne repousse rien [du destin], mais on l'extirpe seulement de l'avare. »</strong></em> (Rapporté par le groupe [des grands imams du Hadith] à l'exception d'Al-Tirmidhî).<a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a></p>
<p>De plus, celui qui fait un vœu s'impose à lui-même une chose qui ne lui était pas obligatoire à la base dans la législation islamique. Il se met ainsi en difficulté et s'alourdit par ce vœu, alors qu'il est demandé au musulman d'accomplir le bien spontanément, sans avoir recours à un vœu.</p>
<p>⁕ Cependant, s'il fait le vœu d'accomplir un acte d'obéissance, il lui est alors obligatoire de s'y tenir (de l'accomplir).</p>
<p>- En raison de la parole d'Allah le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿وَمَا أَنفَقْتُم مِّن نَّفَقَةٍ أَوْ نَذَرْتُم مِّن نَّذْرٍ فَإِنَّ اللَّهَ يَعْلَمُهُ﴾ [البقرة: ٢٧٠]</span></p>
<p>﴾ <strong>Quelles que soient les dépenses que vous avez faites, ou les vœux que vous avez voués, Certes Allah le sait.</strong> ﴿ [Al-Baqarah: 270].</p>
<p>- Et le Très-Haut a dit en décrivant les pieux :</p>
<p class="ar"><span dir="rtl">﴿يُوفُونَ بِالنَّذْرِ وَيَخَافُونَ يَوْمًا كَانَ شَرُّهُ مُسْتَطِيرًا ﴾ [الإنسان: ٧]</span></p>
<p>﴾ <strong>Ils accomplissent leurs vœux et redoutent un jour dont le mal se répandra partout.</strong> ﴿ [Al-Insân: 7].</p>
<p>- Et le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿وَلْيُوفُوا نُذُورَهُمْ﴾ [الحج: ٢٩]</span></p>
<p>﴾ <strong>...et qu'ils accomplissent leurs vœux.</strong> ﴿ [Al-Hajj: 29].</p>
<p>- Et il est rapporté dans le <em>Sahîh</em> [d'Al-Boukhârî] que le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="rtl">«مَنْ نَذَرَ أَنْ يُطِيعَ اللهَ؛ فَلْيُطِعْهُ، وَمَنْ نَذَرَ أَنْ يَعْصِيَ اللهَ؛ فَلَا يَعْصِهِ».</span></p>
<p><strong>« <em>Quiconque a voué d'obéir à Allah, qu'il Lui obéisse donc. Et quiconque a voué de Lui désobéir, qu'il ne Lui désobéisse pas.</em> »</strong><a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a></p>
<p>L'Imam Ibn al-Qayyim a dit <a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a>: <em>« Celui qui s'engage à accomplir un acte d'obéissance envers Allah ne sort pas de quatre cas de figure :</em></p>
<ul>
<li><blockquote>
<p><em>Soit par un simple serment (Yamîn),</em></p>
</blockquote></li>
<li><blockquote>
<p><em>Soit par un simple vœu (Nadhr),</em></p>
</blockquote></li>
<li><blockquote>
<p><em>Soit par un serment renforcé par un vœu,</em></p>
</blockquote></li>
<li><blockquote>
<p><em>Soit par un vœu renforcé par un serment.</em></p>
</blockquote></li>
</ul>
<p><em>À l'exemple de Sa parole [le Très-Haut] :</em></p>
<p class="ar"><span dir="rtl">﴿وَمِنْهُم مَّنْ عَاهَدَ اللَّهَ لَئِنْ آتَانَا مِن فَضْلِهِ لَنَصَّدَّقَنَّ﴾ [التوبة: ٧٥]</span></p>
<p><em><strong>﴾ Et il en est parmi eux qui ont pris l'engagement envers Allah : "S'Il nous donne de Sa grâce, nous ferons certainement l'aumône..." ﴿</strong> [At-Tawbah: 75]. Il lui est donc obligatoire de s'y tenir, sous peine d'entrer dans le cadre de Sa parole :</em></p>
<p class="ar"><span dir="rtl">﴿فَأَعْقَبَهُمْ نِفَاقًا فِي قُلُوبِهِمْ﴾ [التوبة: ٧٧]</span></p>
<p><em>﴾ <strong>Il a donc suscité l'hypocrisie dans leurs cœurs…</strong> ﴿ [At-Tawbah: 77]. Et cet [engagement] revêt un caractère obligatoire encore plus prononcé que le fait de dire simplement : "Je m'impose envers Allah telle chose". » Fin de citation.</em></p>
<p>Les juristes (Fuqahâ) — qu'Allah leur fasse miséricorde — ont mentionné que, pour que le vœu soit juridiquement valide, il est conditionné par le fait que la personne qui le formule soit majeure (bâligh), dotée de sa raison ('âqil) et libre de son choix (moukhtâr).</p>
<p>Cela s'appuie sur la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«رُفِعَ الْقَلَمُ عَنْ ثَلَاثَةٍ: الصَّغِيرِ حَتَّى يَبْلُغَ، وَالْمَجْنُونِ حَتَّى يَفِيقَ، وَالنَّائِمِ حَتَّى يَسْتَيْقِظَ»</span></p>
<p><em><strong>« La plume a été levée pour trois [catégories de personnes] : l'enfant jusqu'à ce qu'il atteigne la puberté, le fou jusqu'à ce qu'il retrouve la raison, et le dormeur jusqu'à ce qu'il se réveille. »</strong></em><a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a></p>
<p>Ce hadith démontre ainsi que le vœu n'est pas contraignant pour ces personnes, étant donné que la plume [qui consigne les actes] est levée pour elles.</p>
<p>⁕ Le vœu formulé par le mécréant est valide s'il a voué un acte d'adoration, et il lui est obligatoire de l'accomplir s'il embrasse l'Islam. Cela s'appuie sur le hadith d''Umar [Ibn al-Khattâb] — qu'Allah l'agrée — qui a dit :</p>
<p class="ar"><span dir="rtl">نِّي نَذَرْتُ فِي الْجَاهِلِيَّةِ أَنْ أَعْتَكِفَ لَيْلَةً فِي الْمَسْجِدِ الْحَرَامِ</span></p>
<p>« <em>J'avais voué, à l'époque de l'ignorance (Al-Jâhiliyyah), de faire une retraite spirituelle (I'tikâf) d'une nuit dans la Mosquée Sacrée (Al-Masjid al-Harâm).</em> » Le Prophète <span dir="rtl">ﷺ</span> lui dit alors :</p>
<p class="ar"><span dir="rtl">«أَوْفِ بِنَذْرِكَ».</span></p>
<p>« <em>Accomplis ton vœu.</em> »<a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a></p>
<p>⁕ Le vœu valide se divise en cinq catégories :</p>
<p><strong>Le premier d'entre eux : Le vœu absolu (non spécifié) :</strong> Par exemple, qu'il dise : « Je dois un vœu à Allah », sans spécifier quoi que ce soit. Il lui incombe alors de s'acquitter d'une expiation de serment (<em>Kaffârat Yamîn</em>) qu'il soit absolu ou conditionnel ; en raison de ce qu'a rapporté 'Ouqbah ibn 'Âmir (qu'Allah l'agrée), qui a dit : Le Messager d'Allah (que la prière et le salut d'Allah soient sur lui) a dit :</p>
<p class="ar"><span dir="rtl">«كَفَّارَةُ النَّذْرِ إِذَا لَمْ يُسَمِّ كَفَّارَةُ يَمِينٍ»</span></p>
<p><em><strong>« L'expiation du vœu, lorsqu'il n'a pas été spécifié, est celle du serment »</strong></em>, rapporté par Ibn Mâjah et At-Tirmidhî, et ce dernier a dit : « [Un hadith] Bon, Authentique, Étrange (<em>Hasan Sahîh Gharîb</em>) » <a href="#fn6" class="footnote-ref" id="fnref6" role="doc-noteref"><sup>6</sup></a> ; ce hadith prouve donc l'obligation de l'expiation lorsque la personne n'a pas spécifié ce qu'elle a voué à Allah (Puissant et Majestueux).</p>
<p><strong>Le deuxième : Le vœu de dispute (obstination) et de colère :</strong> Il consiste à lier son vœu à une condition par laquelle on vise à s'empêcher de faire une chose, à s'y inciter, ou à confirmer ou démentir [une information]. C'est comme s'il disait : « Si je te parle », ou : « Si je ne te dénonce pas », ou : « Si cette information n'est pas vraie », ou : « Si c'est un mensonge ; alors je m'engage à accomplir le pèlerinage (Hajj) ou à affranchir [un esclave]... » et ce qui y ressemble. Cet auteur du vœu a le choix entre accomplir ce qu'il a voué ou s'acquitter d'une expiation de serment (<em>Kaffârat Yamîn</em>), en raison du hadith de 'Imrân ibn Housayn qui a dit : J'ai entendu le Messager d'Allah (que la prière et le salut d'Allah soient sur lui) dire :</p>
<p class="ar"><span dir="rtl">«لَا نَذْرَ فِي غَضَبٍ، وَكَفَّارَتُهُ كَفَّارَةُ يَمِينٍ»</span></p>
<p><em><strong>« Pas de vœu en cas de colère, et son expiation est celle du serment »</strong></em>, rapporté par Sa'îd dans ses <em>« Sounan »</em> <a href="#fn7" class="footnote-ref" id="fnref7" role="doc-noteref"><sup>7</sup></a>.</p>
<p><strong>Le troisième : Le vœu permis (<em>Al-Moubâh</em>) :</strong> C'est comme s'il vouait de porter son vêtement ou de monter sa monture. Il a alors le choix entre le faire ou s'acquitter d'une expiation de serment s'il ne le fait pas, tout comme pour la deuxième catégorie. Cependant, l'avis choisi par Cheikh al-Islâm Ibn Taymiyyah (qu'Allah lui fasse miséricorde) est qu'il n'a rien à se reprocher [et aucune expiation à charge] pour le vœu permis, en raison de ce qu'a rapporté l'Imam Al-Boukhârî : Alors que le Prophète (que la prière et le salut d'Allah soient sur lui) faisait un sermon, il aperçut un homme debout. Il s'enquit de lui et on lui répondit : « C'est Abou Isrâ'îl, il a voué de rester debout et de ne pas s'asseoir, de ne pas se mettre à l'ombre, de ne pas parler, et de jeûner ». Il dit alors :</p>
<p class="ar"><span dir="rtl">«مُرْهُ؛ فَلْيَتَكَلَّمْ، وَلْيَسْتَظِلَّ، وَلْيَقْعُدْ، وَلْيُتِمَّ صَوْمَهُ»</span></p>
<p><em><strong>« Ordonne-lui : qu'il parle, qu'il se mette à l'ombre, qu'il s'asseye, et qu'il mène son jeûne à son terme »</strong></em> <a href="#fn8" class="footnote-ref" id="fnref8" role="doc-noteref"><sup>8</sup></a>.</p>
<p><strong>Quatrièmement : Le vœu d'actes de désobéissance (Nadr al-Ma'siyah) :</strong> Comme le fait de vouer de boire du vin, de jeûner pendant les jours de menstrues ou le jour du sacrifice (<em>Yaoum an-Nahr</em>). Il n'est pas permis d'accomplir ce vœu, en raison de la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«مَنْ نَذَرَ أَنْ يَعْصِيَ اللَّهَ؛ فَلَا يَعْصِهِ»</span></p>
<p><em><strong>« Quiconque fait le vœu de désobéir à Allah, qu'il ne Lui désobéisse pas. »</strong></em><a href="#fn9" class="footnote-ref" id="fnref9" role="doc-noteref"><sup>9</sup></a> Ce hadith prouve donc qu'il n'est pas permis d'accomplir un vœu de désobéissance, car le péché n'est autorisé en aucun cas.</p>
<p>Fait partie du vœu de désobéissance : le vœu formulé pour les tombes ou pour les occupants des tombes, et cela constitue du polythéisme majeur (<em>Chirk Akbar</em>), comme cela a été mentionné précédemment. Selon certains gens de science, l'expiation de ce vœu consiste en une expiation de serment (<em>Kaffârat Yamîn</em>). Cela est rapporté d'après Ibn Mas'ûd, Ibn 'Abbâs, 'Imrân ibn Husayn et Samurah ibn Jundub (qu'Allah les agrée).</p>
<p>Un autre groupe de gens de science est d'avis que le vœu de désobéissance ne se noue pas [religieusement] et qu'aucune expiation ne lui est obligatoire. C'est une version rapportée d'Ahmad, et c'est l'école (madhhab) d'Abû Hanîfah, de Mâlik et d'Al-Shâfi'î, et c'est l'avis qu'a choisi Cheykh al-Islâm Ibn Taymiyyah, qui a dit : <em>« Quiconque allume un luminaire sur une tombe, un cimetière, une montagne ou un arbre, ou fait un vœu pour eux, pour leurs habitants ou pour ceux qui sont affiliés à cet endroit : cela n'est pas valide, et il n'est pas permis d'accomplir [ce vœu] par consensus (Ijma'). Et [l'argent de ce vœu] doit être dépensé dans l'intérêt public, tant que son propriétaire n'est pas connu... »</em> Fin de citation.</p>
<p><strong>Cinquièmement : Le vœu de piété (Nadr at-Tabarrur) :</strong> Il s'agit du vœu d'accomplir un acte d'obéissance, comme le fait d'accomplir la prière, le jeûne, le pèlerinage (<em>Hajj</em>) ou autre action similaire. Qu'il soit absolu (c'est-à-dire non suspendu à la réalisation d'une condition), comme s'il disait : « Je m'engage envers Allah à prier ou à jeûner... », ou qu'il soit suspendu à la réalisation d'une condition, à l'exemple de sa parole : « Si Allah guérit mon malade, je m'engage envers Allah à faire ceci ». Dès lors que la condition se réalise, il devient obligatoire pour lui d'accomplir ce vœu, en raison de la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«مَنْ نَذَرَ أَنْ يُطِيعَ اللَّهَ؛ فَلْيُطِعْهُ»</span></p>
<p><em><strong>« Quiconque fait le vœu d'obéir à Allah, qu'il Lui obéisse »</strong></em>, rapporté par Al-Bukhârî <a href="#fn10" class="footnote-ref" id="fnref10" role="doc-noteref"><sup>10</sup></a>. Et également en raison de la parole d'Allah (Le Très-Haut) :</p>
<p class="ar"><span dir="rtl">﴿يُوفُونَ بِالنَّذْرِ﴾</span></p>
<p><strong>﴾ Ils accomplissent leurs vœux ﴿</strong> [L'Homme (Al-Insân) : 7]</p>
<p>Et de Sa parole (Le Très-Haut) :</p>
<p class="ar"><span dir="rtl">﴿وَلْيُوفُوا نُذُورَهُمْ﴾</span></p>
<p><strong>﴾ et qu'ils accomplissent leurs vœux ﴿</strong> [Le Pèlerinage (Al-Hajj) : 29].</p>
<p>Et Allah sait mieux.</p>
