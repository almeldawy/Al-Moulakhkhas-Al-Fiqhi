<p>⁕ <em>Al-Aymân</em> est le pluriel de <em>Yamîn</em> (serment). Le serment consiste à appuyer (confirmer) une affirmation en mentionnant une entité sacrée/magnifiée d'une manière spécifique. Il a été nommé ainsi en référence à la main droite (<em>al-yad al-yumnâ</em>), car celui qui prête serment tend sa main droite et frappe dans la main droite de son compagnon, comme cela se fait lors d'un pacte ou d'un engagement contractuel.</p>
<p>⁕ Le serment qui nécessite une expiation est celui prêté par l'un des Noms d'Allah ou par l'un de Ses Attributs. Comme le fait de dire : « Par Allah », ou « Par la Face d'Allah », ou « Par Sa grandeur, Sa superbe, Sa majesté, Sa puissance, Sa miséricorde », ou « Par Son pacte », ou « Par Sa volonté », ou « Par le Coran », ou « Par le Moushaf » .</p>
<p>⁕ Jurer par un autre qu'Allah le Très-Haut est interdit (Harâm), et c'est un acte de polythéisme (Chirk) ; en raison de la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">مَنْ كَانَ حَالِفاً؛ فَلْيَحْلِفْ بِاللَّهِ أَوْ لِيَصْمُتْ»</span></p>
<p><em><strong>« Quiconque doit jurer, qu'il jure par Allah ou qu'il se taise »</strong></em> (Rapporté par Al-Boukhârî et Muslim <a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a>.</p>
<p>Et il <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="rtl">«مَنْ حَلَفَ بِغَيْرِ اللَّهِ؛ فَقَدْ كَفَرَ أَوْ أَشْرَكَ»</span></p>
<p><em><strong>« Quiconque jure par un autre qu'Allah a certes mécru ou commis un acte de polythéisme »</strong></em>. <a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a></p>
<p>Et il <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="rtl">«لَيْسَ مِنَّا مَنْ حَلَفَ بِالأَمَانَةِ»</span></p>
<p><em><strong>« N'est pas des nôtres quiconque jure par le dépôt de confiance (al-Amânah) »</strong></em> Rapporté par Aboû Dâwoûd. <a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a></p>
<p>Ces hadiths prouvent donc l'interdiction de jurer par autre qu'Allah et démontrent que cela relève du polythéisme, comme le fait de dire : « Par le Prophète », « Par ta vie », « Par le dépôt de confiance », « Par la Ka'bah »... et tout ce qui ressemble à cela.</p>
<p>Ibn 'Abd Al-Barr a dit : <em>« Et c'est une chose sur laquelle il y a un consensus »</em>.</p>
<p>Cheikh Taqî ad-Dîn Ibn Taymiyyah <a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a> a dit : <em>« Il est interdit de jurer par autre qu'Allah »</em>, et Ibn Mas'ûd a dit : <em>« Jurer par Allah en mentant m’est préférable à jurer par un autre que Lui en étant véridique »</em>.</p>
<p>Et le Cheikh [Ibn Taymiyyah] a dit, pour expliquer cette parole d'Ibn Mas'ûd : <em>« Car la bonne action du Tawhîd (monothéisme) est plus grande que la bonne action de la véracité, et le péché du mensonge est moins grave que le péché du polythéisme (Chirk)... »</em>. Fin de citation.</p>
<p>⁕ Trois conditions sont requises pour que l'expiation soit obligatoire lorsque l'on jure par Allah puis que l'on rompt son serment :</p>
<p><strong>La première condition :</strong> Que le serment soit solennellement engagé (liant), c'est-à-dire que celui qui jure ait l'intention de formuler ce serment concernant une affaire future et possible.</p>
<p>Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿لَا يُؤَاخِذُكُمُ اللَّهُ بِاللَّغْوِ فِي أَيْمَانِكُمْ وَلَٰكِن يُؤَاخِذُكُم بِمَا عَقَّدتُّمُ الْأَيْمَانَ﴾</span></p>
<p><strong>﴾ Allah ne vous punit pas pour la frivolité dans vos serments, mais Il vous punit pour les serments que vous avez solennellement engagés. ﴿</strong> [Al-Mâ'idah : 89]. Ce verset prouve donc que l'expiation n'est obligatoire que pour les serments solennellement engagés.</p>
<p>Et l'engagement formel ne s'applique que pour l'avenir, et non pour le passé, car il y est impossible d'honorer ou de rompre le serment. Cependant, s'il jure de façon délibérément mensongère sur un fait passé, c'est alors le serment d'immersion (<em>Al-Yamîn al-Ghamoûs</em>) ; car il plonge [celui qui le commet] dans le péché, puis dans le Feu. Il n'y a pas d'expiation pour ce serment car il est trop grave pour être expié, et il fait partie des grands péchés.</p>
<p>Et s'il prononce un serment sans en avoir l'intention, comme s'il disait : « Non, par Allah », ou « Si, par Allah », alors qu'il ne vise pas le serment mais que cette expression a simplement glissé sur sa langue sans intention : c'est alors une parole frivole (<em>Laghw</em>), qui ne nécessite aucune expiation.</p>
<p>Cela en raison de la parole du Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿لَا يُؤَاخِذُكُمُ اللَّهُ بِاللَّغْوِ فِي أَيْمَانِكُمْ﴾</span></p>
<p><strong>« Allah ne vous punit pas pour la frivolité dans vos serments »</strong></p>
<p>et du hadith de 'Â'ishah (qu'Allah l'agrée) attribué au Prophète (Marfoû') :</p>
<p class="ar"><span dir="rtl">«اللَّغْوُ فِي الْيَمِينِ كَلَامُ الرَّجُلِ فِي بَيْتِهِ: كَلَّا وَاللَّهِ، وَبَلَىٰ وَاللَّهِ»</span></p>
<p><em><strong>« La frivolité dans le serment correspond aux paroles de l'homme chez lui : "Non, par Allah" et "Si, par Allah" »</strong></em>, rapporté par Aboû Dâwoûd <a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a>.</p>
<p>De même s'il jure avec l'intention de dire la vérité, en étant convaincu de sa sincérité, mais qu'il s'avère que c'est le contraire.</p>
<p>Cheikh al-Islâm Ibn Taymiyyah a dit : <em>« Il en va de même s'il le lie à un temps futur, en étant convaincu de sa véracité, mais que cela ne se réalise pas ; comme celui qui jure au sujet d'autrui, pensant qu'il lui obéira, mais que celui-ci ne le fait pas. »</em> Fin de citation.</p>
<p><strong>La deuxième condition :</strong> Que le serment soit prêté de son plein gré. S'il jure sous la contrainte, son serment n'est pas valide ; en raison de la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«رُفِعَ عَنْ أُمَّتِي الْخَطَأُ وَالنِّسْيَانُ وَمَا اسْتُكْرِهُوا عَلَيْهِ»</span></p>
<p><em><strong>« Il a été levé pour ma communauté l'erreur, l'oubli, et ce pour quoi ils ont été contraints »</strong></em> <a href="#fn6" class="footnote-ref" id="fnref6" role="doc-noteref"><sup>6</sup></a>, ce qui prouve que celui qui est contraint de prêter serment est pardonné.</p>
<p><strong>La troisième condition :</strong> Qu'il commette un parjure (<em>Hinth</em>) en faisant ce qu'il avait juré de délaisser, ou en délaissant ce qu'il avait juré de faire, de son plein gré et en étant conscient de son serment. S'il se parjure en oubliant son serment ou sous la contrainte, il n'y a pas d'expiation, car il n'y a pas de péché sur lui ; en raison de la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«عُفِيَ لِأُمَّتِي الْخَطَأُ وَالنِّسْيَانُ وَمَا اسْتُكْرِهُوا عَلَيْهِ»</span></p>
<p><em><strong>« Il a été pardonné à ma communauté l'erreur, l'oubli, et ce pour quoi ils ont été contraints »</strong></em> <a href="#fn7" class="footnote-ref" id="fnref7" role="doc-noteref"><sup>7</sup></a>.</p>
<p>⁕ Et s'il fait une exception dans son serment, comme s'il disait : « Par Allah, je ferai certainement ceci si Allah le veut », il ne se parjure pas s'il rompt son serment ; à condition qu'il ait l'intention de l'exception (l'exception doit être reliée au serment, dans la prononciation ou dans le sens juridique) ; en raison de la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«مَنْ حَلَفَ فَقَالَ: إِنْ شَاءَ اللَّهُ؛ لَمْ يَحْنَثْ»</span></p>
<p><em><strong>« Quiconque prête serment puis dit : "si Allah le veut", ne se parjure pas »</strong></em>, rapporté par Ahmad et d'autres <a href="#fn8" class="footnote-ref" id="fnref8" role="doc-noteref"><sup>8</sup></a>.</p>
<p>Si l'auteur du serment n’a pas eu l’intention de formuler une exception, mais qu'il visait par sa parole <em>“si Allah le veut” (In shâ'a Allâh)</em> la simple recherche de bénédiction (<em>Tabarruk</em>) par cette formule et non la suspension du serment à la volonté divine (<em>Ta'lîq</em>), ou s’il n’a dit <em>“si Allah le veut”</em> qu’après l’écoulement d'un laps de temps suivant la fin de la prononciation du serment, sans excuse valable : alors cette exception ne lui est d’aucune utilité [et il reste lié par son serment].</p>
<p>Cependant, il a été dit : l'exception lui est utile, même s’il ne l’a voulue qu’après avoir terminé de prononcer son serment. Au point que si l’une des personnes présentes lui disait : <em>“Dis : si Allah le veut”</em> et qu'il le disait, cela lui serait profitable. Cheikh al-Islâm [Ibn Taymiyyah] a dit : <em>“Et c’est cela l’avis correct.”</em></p>
<p>⁕ La rupture du serment (le parjure) est tantôt obligatoire, tantôt interdite, et tantôt autorisée :</p>
<p><strong>Il est obligatoire</strong> de rompre le serment s'il a juré de délaisser une obligation, comme s'il jurait de ne pas entretenir ses liens de parenté ; ou s'il a juré d'accomplir un acte interdit, comme s'il jurait de boire du vin. Dans ce cas, il lui est obligatoire de rompre son serment et de s'en acquitter par une expiation.</p>
<p><strong>- Et il est interdit</strong> de rompre le serment s'il a juré de délaisser un interdit ou d'accomplir une obligation. Il lui est alors obligatoire de respecter son serment, et il ne lui est pas permis de le rompre.</p>
<p><strong>- Et il est permis (autorisé)</strong> de rompre le serment lorsqu'il a juré d'accomplir un acte permis ou de le délaisser.</p>
<p>Le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="rtl">«مَا حَلَفْتُ عَلَىٰ يَمِينٍ، فَرَأَيْتُ غَيْرَهَا خَيْراً مِنْهَا؛ إِلَّا أَتَيْتُ الَّذِي هُوَ خَيْرٌ، وَكَفَّرْتُ عَنْ يَمِينِي»</span></p>
<p><em><strong>« Je ne prête jamais un serment pour lequel je vois ensuite une meilleure alternative sans accomplir ce qui est meilleur et expier mon serment »</strong></em>.<a href="#fn9" class="footnote-ref" id="fnref9" role="doc-noteref"><sup>9</sup></a></p>
<p>Et il <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="rtl">«مَنْ حَلَفَ عَلَىٰ يَمِينٍ، فَرَأَىٰ غَيْرَهَا خَيْراً مِنْهَا؛ فَلْيَأْتِ الَّذِي هُوَ خَيْرٌ، وَلْيُكَفِّرْ عَنْ يَمِينِهِ»</span></p>
<p><em><strong>« Quiconque prête un serment puis voit une meilleure alternative, qu'il accomplisse ce qui est meilleur et qu'il expie son serment »</strong></em>.<a href="#fn10" class="footnote-ref" id="fnref10" role="doc-noteref"><sup>10</sup></a></p>
<p>⁕ Quiconque s'interdit une chose licite autre que son épouse — comme de la nourriture, de la boisson ou un vêtement — en disant par exemple : « Ce qu'Allah m'a rendu licite m'est interdit », ou en disant : « Cette nourriture m'est interdite » : cette chose ne lui devient pas interdite. Il lui est permis de la consommer, et il devra verser une expiation de serment.</p>
<p>Cela en raison de la parole d'Allah le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿يَٰأَيُّهَا ٱلنَّبِيُّ لِمَ تُحَرِّمُ مَا أَحَلَّ ٱللَّهُ لَكَ ۖ تَبْتَغِي مَرْضَاتَ أَزْوَٰجِكَ...﴾ إِلَىٰ قَوْلِهِ تَعَالَىٰ: ﴿قَدْ فَرَضَ ٱللَّهُ لَكُمْ تَحِلَّةَ أَيْمَٰنِكُمْ﴾ [التحريم: ١، ٢]</span></p>
<p><strong>﴾ Ô Prophète ! Pourquoi t'interdis-tu ce qu'Allah t'a rendu licite, en recherchant l'agrément de tes épouses ? ﴿</strong> Jusqu’ à sa Parole <strong>﴾ Allah a certes prescrit pour vous l'expiation de vos serments. Et Allah est votre Maître, et c'est Lui l'Omniscient, le Sage. ﴿</strong> [At-Tahrîm : 1,2]</p>
<p>⁕ En revanche, s'il s'interdit son épouse, cela est alors considéré comme un <em>Zhihâr</em> (une formule d'unilatérale de répudiation assimilant l'épouse à la mère), pour lequel l'expiation spécifique du <em>Zhihâr</em> est obligatoire, et l'expiation du serment ne suffit pas.</p>
<p>⁕ Parmi les choses sur lesquelles il est obligatoire d'attirer l'attention dans ce chapitre, il y a le statut du serment par une religion autre que l'Islam. C'est le fait de dire par exemple : « Il est juif ou chrétien s'il fait telle ou telle chose ! » ou « s'il ne la fait pas ! ».</p>
<p>Cela fait partie des expressions détestables ; et cet acte est strictement interdit (<em>Muḥarram shadîd al-taḥrîm</em>), en raison de ce qui figure dans les deux recueils authentiques (<em>Al-Ṣaḥîḥayn</em>), d'après le Prophète <span dir="rtl">ﷺ</span> qui a dit :</p>
<p class="ar"><span dir="rtl">«مَنْ حَلَفَ عَلَىٰ مِلَّةٍ غَيْرِ الْإِسْلَامِ كَاذِباً مُتَعَمِّداً؛ فَهُوَ كَمَا قَالَ»</span></p>
<p><em><strong>« Quiconque jure par une religion autre que l'Islam en mentant délibérément, alors il est tel qu'il a dit »</strong></em>.</p>
<p>Et dans une version de l'Imam Ahmad :</p>
<p class="ar"><span dir="rtl">«مَنْ قَالَ: إِنَّهُ بَرِيءٌ مِنَ الْإِسْلَامِ: فَإِنْ كَانَ كَاذِباً؛ فَهُوَ كَمَا قَالَ، وَإِنْ كَانَ صَادِقاً؛ لَمْ يَعُدْ إِلَى الْإِسْلَامِ سَالِماً»</span></p>
<p><em><strong>« Quiconque dit qu'il est désavoué de l'Islam : s'il ment, il est alors tel qu'il a dit ; et s'il est véridique, il ne retournera pas à l'Islam sain et sauf »</strong></em> <a href="#fn11" class="footnote-ref" id="fnref11" role="doc-noteref"><sup>11</sup></a>.</p>
<p>Nous demandons à Allah de nous préserver des mauvaises paroles, et nous Lui demandons de guider nos propos, nos actes et nos intentions. Certes, Il est Proche et Il exauce les invocations.</p>
