<p>⁕ C'est une marque de la miséricorde d'Allah envers Ses serviteurs qu'Il leur ait légiféré l'expiation permettant de délier le serment.</p>
<p>- Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿قَدْ فَرَضَ اللَّهُ لَكُمْ تَحِلَّةَ أَيْمَانِكُمْ﴾ [التحريم: ٢]</span></p>
<p><strong>﴾ Allah a certes prescrit pour vous la libération de vos serments. ﴿</strong> [Sourate At-Tahrîm, verset 2].</p>
<p>- Et dans les deux recueils authentiques (<em>Al-Boukhârî</em> et <em>Muslim</em>), d'après le Prophète <span dir="rtl">ﷺ</span> qui a dit :</p>
<p class="ar"><span dir="rtl">«إِذَا حَلَفْتَ عَلَى يَمِينٍ، فَرَأَيْتَ غَيْرَهَا خَيْرًا مِنْهَا؛ فَأْتِ الَّذِي هُوَ خَيْرٌ، وَكَفِّرْ عَنْ يَمِينِكَ»</span></p>
<p><strong>« Si tu prêtes un serment, puis que tu t'aperçois qu'une autre option est meilleure que celle-ci, accomplis alors ce qui est meilleur et expie ton serment. »</strong><a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a></p>
<p>⁕ <strong>L'expiation du serment comporte à la fois un choix libre (<em>Takh-yîr</em>) et un ordre de priorité (<em>Tartîb</em>).</strong> Celui à qui elle incombe a ainsi le choix entre : nourrir dix pauvres, à raison d'un demi-<em>Sâ’</em> de nourriture pour chaque pauvre ; ou vêtir dix pauvres, en donnant à chacun d'eux un vêtement suffisant pour qu'il puisse accomplir sa prière ; ou affranchir un esclave croyant et exempt de tout défaut. Quant à celui qui ne trouve rien de ces trois options susmentionnées, il doit alors jeûner trois jours.</p>
<p>Il apparaît donc clairement, à travers ces détails, que l'expiation du serment réunit le choix et l'ordre : un choix entre la nourriture, le vêtement et l'affranchissement d'une part, et un ordre de priorité hiérarchisé entre ces trois options et le jeûne d'autre part.</p>
<p>⁕ Et la preuve de cela est la parole d'Allah le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿فَكَفَّارَتُهُ إِطْعَامُ عَشَرَةِ مَسَاكِينَ مِنْ أَوْسَطِ مَا تُطْعِمُونَ أَهْلِيكُمْ أَوْ كِسْوَتُهُمْ أَوْ تَحْرِيرُ رَقَبَةٍ فَمَنْ لَمْ يَجِدْ فَصِيَامُ ثَلَاثَةِ أَيَّامٍ﴾ [المائدة: ٨٩]</span></p>
<p><strong>﴾ L’expiation en sera de nourrir dix pauvres, de ce dont vous nourrissez normalement vos familles, ou de les vêtir, ou d'affranchir un esclave. Quiconque n'en trouve pas les moyens devra jeûner trois jours. ﴿</strong> [Sourate Al-Mâ'idah, verset 89].</p>
<p>Le sens global de ce noble verset est que l'expiation des serments que vous avez conclus, si vous les violez, consiste à : <strong>« nourrir dix pauvres, de ce dont vous nourrissez normalement vos familles »</strong> ; c'est-à-vis de la nourriture habituelle, de qualité moyenne et convenable que vous donnez à vos dépendants, <strong>« ou de les vêtir »</strong> avec des habits permettant d'accomplir la prière, ou d'affranchir un esclave — et la majorité des savants ont posé comme condition qu'il soit croyant. Et le Prophète <span dir="rtl">ﷺ</span> a commencé par ce qui est le plus simple puis le plus simple. Ainsi, peu importe laquelle de ces options la personne accomplit, cela lui suffit par consensus (<em>Ijmâ’</em>).</p>
<p>Et la majorité des savants ont conditionné le jeûne des trois jours à ce qu'ils soient consécutifs, en raison de la récitation (variante) d' 'Abdullâh ibn Mas'ûd (qu'Allah l'agrée) :</p>
<p class="ar"><span dir="rtl">(فَصِيَامُ ثَلَاثَةِ أَيَّامٍ مُتَتَابِعَاتٍ)</span></p>
<p><strong><em>(Quiconque n'en trouve pas les moyens devra jeûner trois jours consécutifs)</em>.</strong></p>
<p>⁕ Et c'est ici que beaucoup de gens du commun commettent une erreur : ils pensent qu'ils ont le choix entre le jeûne et les autres options de l'expiation. Ils se mettent alors à jeûner alors qu'ils ont la capacité de nourrir ou de vêtir [des pauvres]. Or, dans ce cas précis, le jeûne ne leur suffit pas et ne les décharge pas de leur obligation concernant l'expiation du serment ; car il n'est valable qu'en cas d'incapacité à nourrir, vêtir ou affranchir. Il est donc obligatoire de prêter attention et d'avertir contre ce genre de chose.</p>
<p>⁕ Il est permis d'accomplir l'expiation avant la violation du serment (<em>Al-Hinth</em>), tout comme il est permis de la reporter après celle-ci. Si la personne l'accomplit à l'avance, elle rend le serment délié, et si elle la reporte, elle l'efface.</p>
<p>Et la preuve de cela réside dans ce qui est authentifié dans les deux recueils authentiques (<em>Al-Boukhârî</em> et <em>Muslim</em>), d'après le Prophète <span dir="rtl">ﷺ</span> qui a dit :</p>
<p class="ar"><span dir="rtl">«إِذَا حَلَفْتَ عَلَى يَمِينٍ، فَرَأَيْتَ غَيْرَهَا خَيْرًا مِنْهَا؛ فَأْتِ الَّذِي هُوَ خَيْرٌ، وَكَفِّرْ عَنْ يَمِينِكَ»</span></p>
<p><strong>« Si tu prêtes un serment, puis que tu t'aperçois qu'une autre option est meilleure que celle-ci, accomplis alors ce qui est meilleur et expie ton serment. »</strong> Ce hadith prouve donc la permission de reporter l'expiation après la violation du serment.</p>
<p>Et dans la version d'Abû Dâwûd :</p>
<p class="ar"><span dir="rtl">«فَكَفِّرْ عَنْ يَمِينِكَ، ثُمَّ ائْتِ الَّذِي هُوَ خَيْرٌ»</span></p>
<p><strong>« ...alors expie ton serment, puis accomplis ce qui est meilleur »</strong><a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a> ; ce hadith prouve ainsi la permission d'accomplir l'expiation avant la violation du serment. Les hadiths démontrent donc la permission de l'avancer comme de la reporter.</p>
<p>⁕ Fait partie de la Sunna, et des droits du frère sur son frère musulman, d'honorer son serment lorsqu'il jure par lui (pour lui demander de faire une chose licite). En effet, d'après Al-Barâ ibn 'Âzib (qu'Allah l'agrée) qui a dit :</p>
<p class="ar"><span dir="rtl">«أَمَرَنَا رَسُولُ اللهِ ﷺ بِسَبْعٍ: أَمَرَنَا بِعِيَادَةِ المَرِيضِ، وَاتِّبَاعِ الجَنَائِزِ، وَتَشْمِيتِ العَاطِسِ، وَإِبْرَارِ القَسَمِ أَوِ المُقْسِمِ، وَنَصْرِ المَظْلُومِ، وَإِجَابَةِ الدَّاعِي، وَإِفْشَاءِ السَّلَامِ»</span></p>
<p><strong>« Le Messager d'Allah <span dir="rtl">ﷺ</span> nous a ordonné sept choses : il nous a ordonné de visiter le malade, de suivre les cortèges funèbres, de souhaiter la miséricorde à celui qui éternue (en disant <em>Yarhamuka-llâh</em>), d'honorer le serment (ou celui qui jure), de secourir l'opprimé, de répondre à l'invitation et de propager le Salam. »</strong><a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a></p>
<p>⁕ Si une personne répète plusieurs serments avant de s'acquitter de l'expiation pour une seule et même action, puis qu'elle viole ses serments, elle ne sera redevable que d'une seule expiation.<a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a></p>
<p>⁕ De même, si elle prête un seul serment portant sur plusieurs choses à la fois, comme si elle disait : « Par Allah, je ne mangerai pas, je ne boirai pas et je ne m'habillerai pas », puis qu'elle viole son serment concernant l'une de ces choses ; elle ne doit alors qu'une seule expiation, et le reste du serment est délié, car il s'agissait initialement d'un unique serment.</p>
<p>⁕ En revanche, si elle prête plusieurs serments distincts portant sur des actions différentes, puis qu'elle les viole, elle doit alors s'acquitter d'une expiation pour chaque serment.</p>
<p>Cheikh al-Islâm Ibn Taymiyyah (qu'Allah lui fasse miséricorde) a dit <a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a>: <em>« Quant à celui qui réitère des serments avant de procéder à l'expiation, il existe [à ce sujet] plusieurs rapports (au sein de l'école), dont le troisième — qui est l'avis authentique — stipule : si ces serments portent sur une seule et même action, il n'y a qu'une seule expiation, sinon, il y a plusieurs expiations. »</em> Fin de citation.</p>
<p>⁕ Si une personne jure de ne pas faire une chose, puis qu'elle la fait par oubli, par contrainte, ou par ignorance du fait qu'il s'agissait de la chose visée par le serment, elle ne commet pas de violation (<em>Hinth</em>) et aucune expiation ne lui est obligatoire. Cela en raison de la parole d'Allah le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿رَبَّنَا لَا تُؤَاخِذْنَا إِنْ نَسِينَا أَوْ أَخْطَأْنَا﴾ [البقرة: ٢٨٦]</span></p>
<p><strong>﴾ Seigneur, ne nous châtie pas s'il nous arrive d'oublier ou de commettre une erreur. ﴿</strong> [Sourate Al-Baqarah, verset 286], et parce que l'acte de celui qui est contraint ne lui est pas imputé. Certes, Allah a absous cette communauté de l'erreur, de l'oubli et de ce à quoi ils sont contraints.</p>
<p>Et Cheikh al-Islâm Ibn Taymiyyah (qu'Allah lui fasse miséricorde) a dit : <em>« Si une personne prête serment envers autrui dans l'intention de l'honorer (et que cet autrui n'exécute pas la demande), elle ne viole absolument pas son serment. Sauf si son intention était de lui imposer une obligation stricte ; dans ce cas, elle commet une violation (de serment)... »</em> Fin de citation.</p>
<p>⁕ <strong>Remarque :</strong></p>
<p>Allah le Très-Haut dit, après avoir mentionné l'expiation du serment :</p>
<p class="ar"><span dir="rtl">﴿وَاحْفَظُوا أَيْمَانَكُمْ﴾ [المائدة: ٨٩]</span></p>
<p><strong>﴾ Et tenez à vos serments ﴿</strong> [Al-Mâ'idah : 89].</p>
<p>Il a ainsi ordonné, Gloire à Lui, de préserver les serments. Et le sens de cela est : ne pas se précipiter à prêter serment, ou ne pas se précipiter à le rompre (se parjurer), ou encore qu'un serment [rompu] ne doit pas être délaissé sans expiation. Quoi qu'il en soit, il y a dans ce noble verset l'ordre de respecter le serment et de ne pas le prendre à la légère.</p>
<p>⁕ <strong>Parmi les choses sur lesquelles il est obligatoire d'attirer l'attention :</strong> le fait que certaines personnes, lorsqu'elles prêtent serment, usent de ruses pour transgresser ce serment, tout en pensant que cette ruse les préservera des conséquences juridiques du parjure.</p>
<p>L'Imam Ibn al-Qayyim — qu'Allah lui fasse miséricorde — a mis en garde contre cela en disant <a href="#fn6" class="footnote-ref" id="fnref6" role="doc-noteref"><sup>6</sup></a> : <em>« Parmi les ruses vaines (infondées) : si une personne jure de ne pas manger ce pain-ci, ou de ne pas habiter dans cette demeure cette année, ou de ne pas manger cette nourriture, ils [les partisans de ces ruses] disent : "Qu'elle mange le pain en laissant une seule bouchée, qu'elle habite la demeure toute l'année sauf un seul jour, et qu'elle mange toute la nourriture à l'exception d'une infime quantité, ne serait-ce qu'une bouchée". Or, c'est une ruse vaine et absurde. Dès lors qu'elle agit ainsi, elle commet en réalité le parjure lui-même et accomplit précisément ce qu'elle avait juré de ne pas faire. De plus, si l'on suivait la logique de cet imposteur, il faudrait alors autoriser à la personne responsable [le serviteur] d'accomplir tout ce que le Législateur a globalement interdit, en commettant l'interdit en totalité à l'exception d'une infime quantité ! En effet, le respect ou la rupture des serments sont analogues à l'obéissance et à la désobéissance face à un ordre ou à une interdiction. C'est pourquoi on ne s'acquitte de son serment qu'en accomplissant la totalité de ce sur quoi on a juré, et non en n'en faisant qu'une partie, tout comme on n'est considéré comme obéissant qu'en accomplissant la totalité de l'ordre. De même, on se parjure en commettant une partie [de l'action jurée], tout comme on devient désobéissant en commettant une partie [de l'interdit]. »</em> Fin de citation.</p>
<p>⁕ <strong>De même, il y a parmi les gens</strong> celui qui jure de ne pas faire une chose, puis mandate quelqu'un d'autre pour l'accomplir à sa place. Cela fait partie des ruses qui ne libèrent pas sa conscience de la responsabilité du serment, sauf s'il visait spécifiquement par son serment le fait de ne pas accomplir l'action directement par lui-même ; dans ce cas, il obtient ce qu'il a l'intention d'accomplir.</p>
<p>Quoi qu'il en soit, l'affaire des serments est d'une importance majeure. Il n'est pas permis de la prendre à la légère, ni de recourir à des subterfuges pour se soustraire à ses règles juridiques.</p>
