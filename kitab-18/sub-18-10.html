<p>⁕ « Al-Muskir » est le participe actif de « askara ach-charâb » (la boisson a enivré) : est « muskir » ce qui rend son buveur ivre ; l'ivre (sakrân) est le contraire du sobre ; et l'ivresse (sukr), dans le sens terminologique, est le trouble (ikhtilât) de l'intellect.</p>
<p>⁕ Le vin (Al-Khamr) est interdit par le Livre, la Sunna et le consensus :</p>
<p>⁃ Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿يَا أَيُّهَا الَّذِينَ آمَنُوا إِنَّمَا الْخَمْرُ وَالْمَيْسِرُ وَالْأَنصَابُ وَالْأَزْلَامُ رِجْسٌ مِّنْ عَمَلِ الشَّيْطَانِ فَاجْتَنِبُوهُ لَعَلَّكُمْ تُفْلِحُونَ ۝ إِنَّمَا يُرِيدُ الشَّيْطَانُ أَن يُوقِعَ بَيْنَكُمُ الْعَدَاوَةَ وَالْبَغْضَاءَ فِي الْخَمْرِ وَالْمَيْسِرِ وَيَصُدَّكُمْ عَن ذِكْرِ اللَّهِ وَعَنِ الصَّلَاةِ ۖ فَهَلْ أَنتُم مُّنتَهُونَ﴾</span></p>
<p><strong>﴾ Ô vous qui croyez ! Le vin, le jeu de hasard, les pierres dressées et les flèches de divination ne sont qu'une souillure, œuvre du Diable. Évitez-les, afin que vous réussissiez. Par le vin et le jeu de hasard, le Diable ne veut que jeter parmi vous l'inimitié et la haine, et vous détourner du rappel d'Allah et de la prière. Allez-vous donc cesser ? ﴿</strong> [Sourate Al-Mâ'idah : 90-91]. Le khamr est tout ce qui « voile » l'intellect (khâmara al-'aql), c'est-à-dire le recouvre, de quelque matière que ce soit.</p>
<p>⁃ Dans les deux Sahîh et ailleurs :</p>
<p class="ar"><span dir="rtl">«كُلُّ مُسْكِرٍ حَرَامٌ»</span></p>
<p>« Toute boisson enivrante est interdite »<a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a> ;</p>
<p class="ar"><span dir="rtl">«كُلُّ مُسْكِرٍ خَمْرٌ، وَكُلُّ خَمْرٍ حَرَامٌ»</span></p>
<p>« Tout enivrant est du khamr, et tout khamr est interdit »<a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a>. Toute boisson dont une grande quantité enivre est donc interdite même en petite quantité ; c'est du khamr, quelle qu'en soit l'origine, que ce soit du jus de raisin ou autre chose.</p>
<p>⁕ 'Umar ibn al-Khattâb (qu'Allah l'agrée) a dit :</p>
<p class="ar"><span dir="rtl">«الْخَمْرُ مَا خَامَرَ الْعَقْلَ»</span></p>
<p>« Le khamr est ce qui voile l'intellect. » Ainsi toute chose qui couvre l'intellect s'appelle khamr, car elle a reçu ce nom parce qu'elle « voile » l'intellect, c'est-à-dire le couvre. Tel est l'avis de la majorité des linguistes.</p>
<p>⁕ Le Cheikh Taqî ad-Dîn Ibn Taymiyyah (qu'Allah lui fasse miséricorde) a dit<a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a> : « Le haschich est, selon l'avis le plus juste, une souillure (najasah). Il est interdit, qu'on en soit enivré ou non ; ce qui enivre est interdit par accord des musulmans. Son dommage est, à certains égards, plus grand que celui du vin, et son apparition date du VIe siècle. » Fin de ses propos.</p>
<p>⁕ Le haschich et les autres stupéfiants comptent parmi ce qui frappe le plus aujourd'hui la jeunesse des musulmans ; c'est la plus grande arme que nous envoient les ennemis, et que propagent sur terre les corrupteurs parmi les Juifs et leurs agents, afin de ravager les musulmans, de corrompre leur jeunesse, de les détourner de travailler pour leurs sociétés et de combattre pour leur religion, et de repousser l'agression des agresseurs contre leurs peuples et leurs pays, au point que beaucoup de jeunes musulmans sont devenus drogués, à la charge de leur société, ou vivent prisonniers des prisons. Tout cela est une conséquence de la diffusion de ces stupéfiants et enivrants dans les pays des musulmans. Il n'y a de force ni de puissance qu'en Allah, le Très-Haut, le Très-Grand.</p>
<p>⁕ Le khamr est interdit en toute circonstance ; il n'est permis de le boire ni par plaisir, ni pour se soigner, ni pour étancher la soif, ni pour autre chose :</p>
<p>⁃ Quant à l'interdiction de se soigner avec le khamr : en raison de la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«إِنَّهُ لَيْسَ بِدَوَاءٍ، وَلَكِنَّهُ دَاءٌ»</span></p>
<p>« Ce n'est pas un remède, mais une maladie » (rapporté par Mouslim)<a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a>. Et Ibn Mas'oûd (qu'Allah l'agrée) a dit :</p>
<p class="ar"><span dir="rtl">«إِنَّ اللهَ لَمْ يَجْعَلْ شِفَاءَكُمْ فِيمَا حَرَّمَ عَلَيْكُمْ»</span></p>
<p>« Allah n'a pas placé votre guérison dans ce qu'Il vous a interdit. »<a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a></p>
<p>⁃ Quant à l'interdiction de le boire pour étancher la soif : parce qu'il ne désaltère pas, il comporte plutôt une chaleur qui accroît la soif.</p>
<p>⁕ Lorsqu'un musulman boit du vin, ou boit ce dans quoi il a été mélangé, comme l'eau de Cologne et les autres parfums contenant de l'alcool qui enivrent, dès lors qu'il en boit de son plein gré, sachant que sa grande quantité enivre, il est obligatoire de lui appliquer la peine légale, en raison de la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«مَنْ شَرِبَ الْخَمْرَ فَاجْلِدُوهُ»</span></p>
<p>« Quiconque boit du vin, flagellez-le » (rapporté par Abû Dâwoûd et d'autres)<a href="#fn6" class="footnote-ref" id="fnref6" role="doc-noteref"><sup>6</sup></a>.</p>
<p>⁕ La mesure de la peine du vin est de quatre-vingts coups de fouet, car 'Umar consulta les gens sur la peine du vin ; 'Abd ar-Rahmân ibn 'Awf dit : « Fais-la comme la plus légère des peines légales : quatre-vingts. » 'Umar fit donc flageller de quatre-vingts coups et écrivit à Khâlid et Abû 'Ubaydah au Châm (rapporté par Ad-Dâraqoutnî et d'autres)<a href="#fn7" class="footnote-ref" id="fnref7" role="doc-noteref"><sup>7</sup></a>. Cela eut lieu en présence des Émigrés et des Ansâr (qu'Allah les agrée) et aucun d'eux ne le désapprouva.</p>
<p>L'imam Ibn al-Qayyim (qu'Allah lui fasse miséricorde) a dit<a href="#fn8" class="footnote-ref" id="fnref8" role="doc-noteref"><sup>8</sup></a> : « Le vrai est que 'Umar a fixé la peine du vin sur le modèle de la peine de la calomnie, et les Compagnons l'ont approuvé. »</p>
<p>Et Cheikh al-Islâm Ibn Taymiyyah a dit<a href="#fn9" class="footnote-ref" id="fnref9" role="doc-noteref"><sup>9</sup></a> : « La peine de la boisson est établie par la Sunna et par le consensus des musulmans : quarante coups. L'ajout est une décision de l'imam en cas de besoin, quand les gens s'adonnent au vin et ne sont pas dissuadés sans cela. »</p>
<p>Et il a dit<a href="#fn10" class="footnote-ref" id="fnref10" role="doc-noteref"><sup>10</sup></a> : « Le plus juste est que l'ajout de quarante à quatre-vingts n'est ni obligatoire en toute situation, ni interdit en toute situation ; on s'en remet plutôt à l'effort de réflexion (ijtihâd) de l'imam, comme nous lui avons permis l'ijtihâd sur la modalité des coups… » Fin de citation.</p>
<p>⁕ La peine du vin est établie par l'aveu du buveur ou par le témoignage de deux hommes intègres.</p>
<p>⁕ Les savants ont divergé pour savoir si la peine du vin est établie contre celui chez qui l'on a senti l'odeur du vin, selon deux avis. On a dit : on ne lui applique pas la peine légale mais une peine discrétionnaire (Ta'zîr). Et l'on a dit : on lui applique la peine s'il ne prétend pas à une ambiguïté ; c'est une version rapportée d'Ahmad, l'avis de Mâlik et le choix de Taqî ad-Dîn Ibn Taymiyyah. Cheikh al-Islâm a dit<a href="#fn11" class="footnote-ref" id="fnref11" role="doc-noteref"><sup>11</sup></a> : « Celui contre qui les indices de sa situation attestent le crime, comme l'odeur du vin, est plus digne d'une sanction que celui contre qui un témoignage a été porté ou qui s'est accusé lui-même, deux cas où la véracité et le mensonge sont possibles ; et ceci fait l'objet d'un accord parmi les Compagnons. » Et Ibn al-Qayyim a dit<a href="#fn12" class="footnote-ref" id="fnref12" role="doc-noteref"><sup>12</sup></a> : « 'Umar et Ibn Mas'oûd ont jugé obligatoire la peine pour l'odeur du vin, chez un homme ou un autre, et on ne leur connaît pas de contradicteur. » Fin de citation.</p>
<p>⁕ Le danger du vin est immense : c'est la monture du Diable, qu'il chevauche pour nuire aux musulmans : <strong>﴾ Par le vin et le jeu de hasard, le Diable ne veut que jeter parmi vous l'inimitié et la haine, et vous détourner du rappel d'Allah et de la prière. Allez-vous donc cesser ? ﴿</strong> [Sourate Al-Mâ'idah : 91].</p>
<p>⁕ Le vin est la mère des turpitudes ; le Prophète <span dir="rtl">ﷺ</span> a maudit à son sujet dix personnes, lorsqu'il a dit :</p>
<p class="ar"><span dir="rtl">«لَعَنَ اللهُ الْخَمْرَ، وَشَارِبَهَا، وَسَاقِيَهَا، وَبَائِعَهَا، وَمُبْتَاعَهَا، وَعَاصِرَهَا، وَمُعْتَصِرَهَا، وَحَامِلَهَا، وَالْمَحْمُولَةَ إِلَيْهِ»</span></p>
<p>« Qu'Allah maudisse le vin, celui qui le boit, celui qui le sert, celui qui le vend, celui qui l'achète, celui qui le presse, celui pour qui on le presse, celui qui le porte et celui à qui on le porte »<a href="#fn13" class="footnote-ref" id="fnref13" role="doc-noteref"><sup>13</sup></a> (ainsi que, dans la version d'Ibn Mâjah, « et celui qui en consomme le prix »). Il incombe donc aux musulmans de se tenir face à lui avec fermeté et courage, en coupant sa matière, en punissant celui qui s'y livre ou le propage, par la peine dissuasive ; car il entraîne tout mal, jette dans toute bassesse et détourne de tout bien. Qu'Allah préserve les musulmans de son mal et de son danger.</p>
<p>⁕ Il est rapporté dans le hadith que, à la fin des temps, des gens le rendront licite, le désigneront parfois par un autre nom et le boiront ; les musulmans doivent donc se tenir sur leurs gardes et vigilants face à ces gens mauvais.</p>
