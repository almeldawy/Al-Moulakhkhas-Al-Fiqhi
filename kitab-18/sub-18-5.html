<p>⁕ <strong>Le Ta'zîr au sens linguistique :</strong> Signifie l'empêchement (ou la répression). Le terme <em>Ta'zîr</em> est également employé pour désigner le secours (ou le soutien), car il empêche l'ennemi de nuire.</p>
<p>Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿وَتُعَزِّرُوهُ وَتُوَقِّرُوهُ﴾ [الفتح: ٩]</span></p>
<p><strong>﴾ Afin que vous le secouriez (et l'honoriez) ﴿</strong> [Al-Fath : 9], c'est-à-dire le Prophète <span dir="rtl">ﷺ</span>. On dit : « <span dir="rtl">عَزَّرْتُه</span>ُ » au sens de « je l'ai honoré », et on dit aussi : « <span dir="rtl">عَزَّرْتُه</span>ُ » au sens de « je l'ai corrigé (éduqué) ». C'est donc un mot qui fait partie des termes à sens antonymiques (Al-Aḍdâd).</p>
<p>⁕ <strong>La signification du Ta'zîr dans la terminologie jurisprudentielle (fiqh) :</strong> C'est la correction (ou la peine éducative). Il a été nommé ainsi parce qu'il empêche la commission de ce qui est illicite, et parce qu'il mène à la respectabilité ; en effet, lorsque le coupable s'abstient, grâce à cette peine, de commettre ce qui ne convient pas, il acquiert de la dignité (et de la respectabilité).</p>
<p>⁕ <strong>Le statut juridique du Ta'zîr en Islam est qu'il est obligatoire</strong> pour toute désobéissance qui ne comporte ni peine légale fixe (<em>Hadd</em>) ni expiation (<em>Kaffârah</em>), qu'il s'agisse de l'accomplissement d'un acte interdit ou du délaissement d'une obligation. C'est le gouverneur (l'autorité légitime) qui l'applique s'il y voit un intérêt public (<em>Maslahah</em>), et il peut y renoncer s'il juge que l'intérêt réside dans son omission. L'application du <em>Ta'zîr</em> ne requiert pas de plainte préalable : l'agresseur est ainsi sanctionné même si la victime ne réclame pas de poursuites. Son décret est laissé à l'effort de réflexion (<em>Ijtihâd</em>) du juge, étant donné que les délits varient en gravité, en légèreté, en fréquence et en rareté.</p>
<p>⁕ <strong>L'avis authentique est qu'il n'y a pas de limite fixe (ou de peine déterminée) pour le Ta'zîr.</strong> Cependant, si le péché commis correspond à un délit pour lequel le Législateur a fixé une peine déterminée (comme la fornication ou le vol), la peine du <em>Ta'zîr</em> ne doit pas atteindre la valeur de cette peine fixe (<em>Hadd</em>).</p>
<p>⁕ <strong>Le Ta'zîr peut parfois aller jusqu'à la peine de mort si l'intérêt général (Maslahah) l'exige.</strong> C'est le cas, par exemple, de l'exécution de l'espion, de l'exécution de celui qui divise la communauté des musulmans, ou de celui qui appelle à autre chose que le Livre d'Allah et la Sunnah de Son Prophète... ainsi que d'autres cas similaires de nuisances qui ne peuvent être repoussées que par la mise à mort.</p>
<p>Cheikh de l'Islam Ibn Taymiyyah — qu'Allah lui fasse miséricorde — a dit <a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a>: <em>« Et ceci est la plus juste des opinions. C'est elle qui est démontrée par la Sounnah du Messager d'Allah <span dir="rtl">ﷺ</span> et la Sounnah des califes bien guidés. En effet, il a ordonné de flageller de cent coups [l'homme] à qui sa femme avait rendu licite sa servante. De même, Abou Bakr et 'Omar ont ordonné de flageller de cent coups chacun un homme et une femme trouvés sous une même couverture. Et 'Omar a frappé Sabîgh d'un grand nombre de coups. »</em></p>
<p>Le Cheikh a dit <a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a>: <em>« Si le but recherché est de repousser la corruption, et que celle-ci ne peut être repoussée que par la mise à mort, alors [le coupable] est exécuté. Dès lors, quiconque réitère le même genre de corruption et n'est pas dissuadé par les peines légales prescrites (al-houdoûd), mais persiste au contraire dans la corruption, est alors semblable à l'agresseur (al-sâ'il) dont on ne peut repousser le tort que par la mort ; il est donc exécuté. »</em></p>
<p>⁕ Il n'y a pas de limite minimale pour la peine de correction discrétionnaire (<em>at-ta'zîr</em>), en raison de la variation de la gravité des crimes (entre force et faiblesse) et selon la divergence des situations et des époques. Les sanctions pour certains crimes ont donc été laissées à l'effort de réflexion (<em>ijtihâd</em>) du gouvernant (ou du juge), en fonction du besoin et de l'intérêt général (<em>al-maslahah</em>), sans pour autant transgresser ce qu'Allah a ordonné ou interdit. Et tout comme la correction discrétionnaire peut se faire par les coups, elle peut également se faire par l'emprisonnement, la gifle, la réprimande, la destitution d'une fonction d'autorité, et d'autres mesures similaires...</p>
<p>Le Cheikh de l'Islam Ibn Taymiyyah — qu'Allah lui fasse miséricorde — a dit <a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a>: <em>« La correction discrétionnaire peut parfois se faire en portant atteinte à l'honneur [du coupable], comme en lui disant : "Ô injuste ! Ô transgresseur !", ou en le faisant exclure de l'assemblée. »</em></p>
<p>⁕ Quant à ceux qui ont autorisé le fait de dépasser dix coups de fouet dans le cadre de la correction discrétionnaire (<em>at-ta'zîr</em>), ils ont répondu à la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«لَا يُجْلَدُ أَحَدٌ فَوْقَ عَشَرَةِ أَسْوَاطٍ؛ إِلَّا فِي حَدٍّ مِنْ حُدُودِ اللَّهِ»</span></p>
<p><em><strong>« Nul ne doit être flagellé de plus de dix coups de fouet, sauf s'il s'agit d'une peine parmi les peines légales d'Allah (haddun min houdoûdillâh) »</strong></em> (Rapporté par Al-Boukhari et Muslim)<a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a>, en expliquant que le terme <em>Hadd</em> désigne ici le péché (la désobéissance) et non les peines fixes fixées par la Législation. Le sens visé est plutôt les interdits, car les limites d'Allah (<em>houdoûdillâh</em>) sont Ses interdits. Ainsi, le coupable est sanctionné disciplinairement selon l'intérêt général et proportionnellement à la gravité du crime.</p>
<p>⁕ Il n'est pas permis que la peine de correction discrétionnaire (<em>at-ta'zîr</em>) consiste à couper un membre, à blesser le coupable, ou à lui raser la barbe, en raison de la mutilation (<em>al-muthlah</em>) et de la défiguration que cela engendre. De même, il n'est pas permis de punir par un acte interdit (<em>harâm</em>), comme le fait de lui faire boire du vin.</p>
<p>⁕ Quiconque est notoirement connu pour causer du tort aux gens et s'en prendre spécifiquement à leurs biens sera emprisonné jusqu'à sa mort ou jusqu'à ce qu'il se repente.</p>
<p>L'Imam Ibn al-Qayyim — qu'Allah lui fasse miséricorde — a dit <a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a>: <em>« Il doit être obligatoirement emprisonné ; cela a été mentionné par de nombreux juristes , et il ne devrait y avoir aucune divergence à ce sujet, car cela relève du conseil sincère envers les musulmans (nasîhah) et du fait de repousser le tort loin d'eux. »</em></p>
<p>Et il a dit : <em>« Agir, au sein du pouvoir, selon la politique [gouvernementale] relève de la fermeté et de la bonne gestion. Aucun dirigeant ne peut s'en passer tant qu'elle ne contredit pas la Législation (al-Char'). Ainsi, lorsque les indices de la justice apparaissent et que sa voie se clarifie par quelque moyen que ce soit, c'est là que se trouve la Loi d'Allah. On ne doit pas dire : "La politique juste est en contradiction avec ce que la Législation a prononcé", mais elle est plutôt conforme à ce qu'elle a apporté, et fait même partie intégrante de ses composantes. Nous l'appelons "politique" pour nous conformer à votre terminologie, mais en réalité, c'est une législation authentique. Le Prophète <span dir="rtl">ﷺ</span> a en effet emprisonné sous le coup d'une accusation, et il a puni sous le coup d'une accusation lorsque les indices de la suspicion étaient manifestes. Dès lors, quiconque relâche chacun d'eux et le laisse s'en aller, ou se contente de lui faire prêter serment alors qu'il sait qu'il est notoirement connu pour semer la corruption sur terre, sa parole est en contradiction avec la politique religieuse (al-siyâsah al-char'iyyah). Au contraire, les gens suspects doivent être punis, et l'on ne doit pas accepter les revendications que l'habitude et la coutume contredisent. »</em></p>
<p>Et le Cheikh Taqi al-Din [Ibn Taymiyyah] — qu'Allah lui fasse miséricorde — a dit au sujet des charlatans <a href="#fn6" class="footnote-ref" id="fnref6" role="doc-noteref"><sup>6</sup></a>: <em>« On doit punir disciplinairement celui qui manipule les serpents, entre dans le feu ou fait des choses similaires. »</em></p>
<p>⁕ De même, doit être puni disciplinairement quiconque dénigre un musulman en l'appelant "petit musulman" (<em>mouslimânî</em>), ou quiconque dit à un non-musulman sous traité de protection (<em>dhimmî</em>) : "Ô pèlerin !" (<em>Yâ Hâjj</em>), ou qualifie de "pèlerin" celui qui visite les tombes et les mausolées... et autres expressions semblables.</p>
<p>⁕ Et s'il s'avère que le plaignant a menti dans le but de nuire à l'accusé, il sera puni disciplinairement et devra rembourser tout ce que l'accusé a dû dépenser à cause de lui injustement, car il a été la cause de son préjudice sans aucun droit.</p>
