<p>- Allah Le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿وَالسَّارِقُ وَالسَّارِقَةُ فَاقْطَعُوا أَيْدِيَهُمَا جَزَاءً بِمَا كَسَبَا نَكَالًا مِّنَ اللَّهِ ۗ وَاللَّهُ عَزِيزٌ حَكِيمٌ﴾ [المائدة: ٣٨]</span></p>
<p><strong>﴾ Le voleur et la voleuse, coupez-leur les mains, en punition de ce qu'ils ont acquis, et comme châtiment exemplaire de la part d'Allah. Allah est Puissant et Sage. ﴿</strong> [Sourate Al-Mâ'idah : 38]</p>
<p>- Et le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="rtl">«تُقْطَعُ اليَدُ فِي رُبُعِ دِينَارٍ فَصَاعِدًا»</span></p>
<p><em><strong>« La main est coupée pour [le vol de] la valeur d'un quart de dinar ou plus. »</strong></em> <a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a></p>
<p>- Les musulmans se sont accordés de manière unanime (Ijmâ') sur l'obligation de couper la main du voleur globalement.</p>
<p>⁕ Le voleur est un élément corrompu au sein de la société. S'il est laissé libre, sa corruption se propage dans le corps de la communauté. Il est donc indispensable d'y couper court en appliquant la peine légale appropriée afin de le dissuader. C'est pourquoi Allah a légiféré l'amputation de sa main ; cette main injuste qui s'est étendue vers ce qu'il ne lui était pas permis d'atteindre, cette main qui détruit et ne construit pas, qui prend et ne donne pas.</p>
<p>⁕ Et le vol se définit [en droit islamique] comme suit : Le fait de s'emparer d'un bien en cachette de son propriétaire ou de son représentant, à condition que l'auteur de cet acte soit soumis aux lois de l'Islam, que le bien dérobé ait atteint le seuil minimum requis (<em>An-Nisâb</em>), qu'il l'ait pris depuis un lieu de conservation adéquat (<em>Hirz</em>), que le propriétaire du bien volé soit protégé [dans ses biens par la législation], et qu'il n'y ait aucune ambiguïté (<em>Shubhah</em>) en faveur de l'auteur permettant de justifier son acte.</p>
<p>⁕ Il est donc impératif que le voleur, la victime du vol, le bien dérobé, ainsi que les circonstances du vol réunissent des caractéristiques précises incluses dans cette définition. Dès lors qu'une seule de ces conditions fait défaut, la peine d'amputation s'annule. Ces caractéristiques sont les suivantes :</p>
<p>- [La première condition est] que la prise du bien se fasse en cachette (à l'insu d'autrui). Si elle ne se fait pas en cachette : alors il n'y a pas d'amputation [légale pour vol]. C'est le cas par exemple si une personne pille un bien par la force et la contrainte au vu et au su de tout le monde, ou s'il s'en empare par usurpation (<em>Ightisâb</em>). En effet, dans une telle situation, le propriétaire du bien peut appeler à l'aide et stopper le transgresseur ou l'usurpateur.</p>
<p>L'imam Ibn Al-Qayyim <a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a> a dit : <em>« L'amputation a été instituée pour le voleur, à l'exclusion du pilleur et de l'usurpateur, parce qu'il est impossible de se prémunir contre lui. En effet, il perce les habitations, enfreint les lieux de conservation (Hirz) et brise les verrous. Si sa sentence d'amputation n'avait pas été légiférée, les gens se voleraient les uns les autres, le préjudice grandirait et l'épreuve deviendrait terrible. »</em> Fin de citation.</p>
<p>L'auteur de l'ouvrage <em>Al-Ifsâh</em> a dit : <em>« Ils [les savants] se sont accordés à dire que le pickpocket, le pilleur et l'usurpateur, malgré la gravité de leur crime et de leurs péchés, ne subissent aucune peine d'amputation. Cependant, il est légitime de stopper leur agression par la flagellation, le châtiment exemplaire, la longue peine de prison et toute sanction dissuasive (Ta'zîr). »</em></p>
<p>- Parmi les caractéristiques requises pour rendre l'amputation obligatoire lors d'un vol : que le bien dérobé soit une valeur sacrée/protégée (<em>Mâl Mouhtaram</em>). Car ce qui n'est pas considéré comme un bien [licite] ne jouit d'aucune sacralité, comme les instruments de divertissement [interdits], l'alcool, le porc ou la bête morte. De même, un bien qui possède une valeur mais n'est pas protégé — du fait que son propriétaire est un mécréant en état de guerre contre les musulmans (<em>Kâfir Harbî</em>) — n'entraîne pas d'amputation, puisque le sang et les biens du mécréant en état de guerre ne sont pas sacrés.</p>
<p>- Parmi les conditions devant obligatoirement être réunies pour appliquer l'amputation : que l'objet volé atteigne le seuil de prélèvement (<em>Nisâb</em>). Ce seuil est de trois dirhams islamiques, ou d'un quart de dinar islamique, ou l'équivalent de l'un des deux en autres monnaies, ou encore la valeur des marchandises volées selon l'estimation propre à chaque époque. Cela s'appuie sur la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«لَا تُقْطَعُ اليَدُ إِلَّا فِي رُبُعِ دِينَارٍ فَصَاعِدًا»</span></p>
<p><em><strong>« La main n'est coupée que pour [le vol de] la valeur d'un quart de dinar ou plus »</strong></em><a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a>, rapporté par Ahmad, Mouslim et d'autres. Et à cette époque, le quart de dinar valait trois dirhams.</p>
<p>Et dans la spécification de la coupure [de la main] à cette valeur précise, il y a une sagesse apparente ; car cette valeur suffit pour sa journée, pour lui et pour ceux dont il a la charge en général. Vois donc comment la main est coupée pour le vol d'un quart de dinar, alors que son prix du sang (<em>diya</em>), si elle subissait une agression, serait de cinq cents dinars. C'est parce que tant qu'elle était honnête (<em>amînah</em>), elle était précieuse (<em>thamînah</em>), mais lorsqu'elle a trahi (<em>khânat</em>), elle a perdu sa valeur (<em>hânat</em>).</p>
<p>C'est pour cela que lorsqu'un des athées — à savoir Al-Ma'arrî — a objecté en disant [vers de poésie] :</p>
<p class="ar"><span dir="rtl">يَدٌ بِخَمْسِ مِئِينِ عَسْجَدٍ وُدِيَتْ ... مَا بَالُهَا قُطِعَتْ فِي رُبْعِ دِينَارِ</span></p>
<p><em>« Une main dont la diya est de cinq cents pièces d'or... Pourquoi est-elle coupée pour un quart de dinar ? »</em></p>
<p>Certains savants lui ont répondu en disant :</p>
<p class="ar"><span dir="rtl">عِزُّ الْأَمَانَةِ أَغْلَاهَا وَأَرْخَصَهَا ... ذُلُّ الْخِيَانَةِ فَافْهَمْ حِكْمَةَ الْبَارِي</span></p>
<p><em>« L'honneur de l'honnêteté l'a rendue précieuse, et l'humiliation de la trahison l'a rabaissée ; comprends donc la sagesse du Créateur ! »</em></p>
<p>- Parmi les caractéristiques (conditions) qui doivent être réunies pour appliquer la coupure lors d'un vol : il faut que le voleur prenne l'objet volé de son lieu de conservation (<em>hirz</em>). Le <em>hirz</em> des biens correspond à l'endroit où ils sont habituellement préservés, car le sens linguistique du <em>hirz</em> est la préservation.</p>
<p>Le lieu de conservation varie selon la nature des biens, les pays, la justice ou l'injustice du gouverneur, ainsi que sa force ou sa faiblesse. Ainsi, les biens de grande valeur ont pour <em>hirz</em> les maisons, les boutiques et les édifices fortifiés derrière des portes et des verrous solides. Les biens de moindre importance ont un <em>hirz</em> proportionnel à leur valeur, selon la coutume locale (<em>'urf</em>). Par conséquent, si une personne vole un bien en dehors de son <em>hirz</em> — comme le fait de trouver une porte ouverte ou un lieu de conservation déjà forcé, et d'y prendre quelque chose — la peine de coupure ne s'applique pas à elle.</p>
<p>- Il est également impératif que toute ambiguïté (<em>shubhah</em>) soit écartée concernant le voleur et ce qu'il a pris. S'il possède une ambiguïté lui faisant penser que la prise de ce bien lui est permise, la main n'est pas coupée, conformément à la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«ادْرَؤُوا الْحُدُودَ بِالشُّبُهَاتِ مَا اسْتَطَعْتُمْ»</span></p>
<p><em><strong>« Repoussez les peines légales par les ambiguïtés autant que vous le pouvez »</strong></em><a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a>.</p>
<p>Ainsi, la peine de coupure ne s'applique pas s'il vole dans les biens de son père, ni s'il vole dans les biens de son enfant, car la charge financière (<em>nafaqah</em>) de chacun d'eux peut être obligatoire sur les biens de l'autre, et cela constitue une ambiguïté qui repousse la peine légale (<em>hadd</em>). Il en va de même pour quiconque possède un droit ou une part légitime dans un bien et en prend une partie : il ne subit pas la coupure. Cependant, cet acte lui demeure interdit, il doit être réprimandé (sanction discrétionnaire / <em>ta'zîr</em>), et il est tenu de restituer ce qu'il a pris.</p>
<p>- En plus de la réunion des caractéristiques précédentes, il est indispensable que le vol soit prouvé : soit par le témoignage de deux personnes intègres décrivant les modalités du vol, le lieu de conservation (le <em>Hirz</em>), la valeur de l'objet volé et sa nature, afin de dissiper les doutes et les ambiguïtés ; soit par l'aveu du voleur contre lui-même, répété à deux reprises, en raison de ce qu'a rapporté Abou Dawoud : on amena au Prophète <span dir="rtl">ﷺ</span> un voleur qui avait avoué. Le Prophète <span dir="rtl">ﷺ</span> lui dit alors : « Je ne pense pas que tu aies volé. » L'homme répondit : « Si, (j'ai volé). » Il lui répéta cela à deux ou trois reprises, puis il donna l'ordre [d'appliquer la peine], et sa main fut coupée.<a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a></p>
<p>Il est également nécessaire que, lors de son aveu, il décrive le vol, afin d'écarter la possibilité qu'il s'imagine qu'une amputation est requise pour un acte qui ne la justifie pas, et pour que l'on sache si les conditions de l'amputation sont réunies ou non.</p>
<p>- Il est aussi indispensable que la victime du vol réclame son bien. S'il ne le réclame pas, l'amputation n'est pas obligatoire, car un bien devient licite dès lors que son propriétaire l'autorise ou l'offre. Ainsi, s'il ne réclame pas son bien, il est possible qu'il l'ait cédé de bon cœur, et cela constitue une ambiguïté (shubhah) qui annule la peine légale (<em>Hadd</em>).</p>
<p>* Lorsque l'amputation devient obligatoire en raison de la réunion de toutes ses conditions, sa main droite est coupée, conformément à la variante de lecture d'Ibn Mas'oûd concernant la parole d'Allah le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿ فَاقْطَعُوا أَيْمَانَهُمَا ﴾</span></p>
<p><strong>﴾ Coupez leurs mains droites ﴿.</strong></p>
<p>L'endroit de l'amputation se situe au niveau de l'articulation du poignet (la main), car la main est l'instrument du vol ; le coupable est donc puni par la suppression de cet instrument. L'amputation se limite au poignet car lorsque le mot « main » (<em>Yad</em>) est employé de manière absolue, il désigne cette partie. Après l'amputation, on applique les soins appropriés à chaque époque pour stopper l'hémorragie et permettre à la blessure de cicatriser.</p>
<p>Et Allah le Très-Haut est Plus Savant.</p>
