<p>- Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿وَإِنْ طَائِفَتَانِ مِنَ الْمُؤْمِنِينَ اقْتَتَلُوا فَأَصْلِحُوا بَيْنَهُمَا فَإِنْ بَغَتْ إِحْدَاهُمَا عَلَى الْأُخْرَى فَقَاتِلُوا الَّتِي تَبْغِي حَتَّى تَفِيءَ إِلَى أَمْرِ اللهِ فَإِنْ فَاءَتْ فَأَصْلِحُوا بَيْنَهُمَا بِالْعَدْلِ وَأَقْسِطُوا إِنَّ اللهَ يُحِبُّ الْمُقْسِطِينَ (٩) إِنَّمَا الْمُؤْمِنُونَ إِخْوَةٌ فَأَصْلِحُوا بَيْنَ أَخَوَيْكُمْ وَاتَّقُوا اللهَ لَعَلَّكُمْ تُرْحَمُونَ (١٠)﴾ [الحجرات]</span></p>
<p><strong>﴾ Et si deux groupes de croyants se combattent, faites la paix entre eux. Si l'un d'eux se rebelle contre l'autre, combattez le groupe qui se rebelle jusqu'à ce qu'il se conforme à l'ordre d'Allah. Puis, s'il s'y conforme, réconciliez-les avec justice et soyez équitables car Allah aime les équitables. Les croyants ne sont que des frères. Établissez la paix entre vos deux frères, et craignez Allah, afin qu'on vous fasse miséricorde. ﴿</strong> [Al-Hujurât : 9-10]. Le Très-Haut a ainsi rendu obligatoire, dans ce noble verset, le combat des croyants contre les rebelles si ces derniers refusent la conciliation.</p>
<p>- Et le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="rtl">«مَنْ أَتَاكُمْ، وَأَمْرُكُمْ جَمِيعٌ عَلَى رَجُلٍ وَاحِدٍ، يُرِيدُ أَنْ يَشُقَّ عَصَاكُمْ أَوْ يُفَرِّقَ جَمَاعَتَكُمْ؛ فَاقْتُلُوهُ»</span></p>
<p><em><strong>« Quiconque vient à vous alors que vous êtes unis derrière un seul homme, voulant ainsi diviser votre unité ou dissoudre votre communauté, tuez-le. »</strong></em> Rapporté par Muslim <a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a>.</p>
<p>- Et il <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="rtl">«مَنْ خَرَجَ عَلَى أُمَّتِي وَهُمْ جَمِيعٌ؛ فَاضْرِبُوا عُنُقَهُ بِالسَّيْفِ، كَائِنًا مَنْ كَانَ»</span></p>
<p><em><strong>« Quiconque s'insurge contre ma communauté alors qu'ils sont unis, tranchez-lui le cou avec l'épée, peu importe qui il est. »</strong></em> Rapporté également par Muslim <a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a>.</p>
<p>- Et les Compagnons ont unanimement convenu du combat contre le rebelle.</p>
<p>⁕ <strong>À l'origine, le terme "Al-Baghy" signifie l'injustice, l'oppression et le détournement de la vérité. Les rebelles (Ahl al-Baghy) sont donc les gens de l'injustice, de l'oppression, de l'écartement du vrai et de l'opposition aux gouverneurs des musulmans. En effet, il est indispensable pour les musulmans d'avoir un groupe uni et un dirigeant.</strong></p>
<p>Allah a dit :</p>
<p class="ar"><span dir="rtl">﴿ وَاعْتَصِمُوا بِحَبْلِ اللهِ جَمِيعًا وَلَا تَفَرَّقُوا ﴾ [آل عمران: ١٠٣]</span></p>
<p><strong>﴾ Et cramponnez-vous tous ensemble au "Habl" (câble) d'Allah et ne vous divisez pas ﴿</strong> [Âl 'Imrân : 103]</p>
<p>et le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿ يَا أَيُّهَا الَّذِينَ آمَنُوا أَطِيعُوا اللهَ وَأَطِيعُوا الرَّسُولَ وَأُولِي الْأَمْرِ مِنْكُمْ ﴾ [النساء: ٥٩]</span></p>
<p><strong>﴾ Ô les croyants ! Obéissez à Allah, et obéissez au Messager et à ceux d'entre vous qui détiennent le commandement ﴿</strong> [An-Nisâ' : 59],</p>
<p>et le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="rtl">«أُوْصِيكُمْ بِتَقْوَى اللهِ، وَالسَّمْعِ وَالطَّاعَةِ، وَإِنْ تَأَمَّرَ عَلَيْكُمْ عَبْدٌ»</span></p>
<p><em><strong>« Je vous recommande la piété envers Allah, ainsi que l'écoute et l'obéissance, même si un esclave est nommé à votre tête. »</strong></em><a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a> Cela fait partie des nécessités absolues, car les gens en ont un besoin impératif afin de protéger l'intégrité de la communauté, de défendre le territoire, d'appliquer les peines légales (Hudûd), de restituer les droits à chacun, d'ordonner le bien et d'interdire le blâmable...</p>
<p><strong>Cheikh al-Islâm Ibn Taymiyyah (qu'Allah lui fasse miséricorde) a dit</strong> <a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a> <strong>:</strong> <em>« Il faut savoir que l'exercice du pouvoir (l'autorité politique) sur les gens compte parmi les plus grands devoirs de la religion. Mieux encore, il n'y a pas de maintien possible pour la religion ni pour les affaires mondaines sans cette autorité. En effet, les intérêts des fils d'Adam ne peuvent être pleinement réalisés que par leur regroupement en communauté les uns avec les autres, et lors de ce regroupement, ils doivent impérativement avoir un chef à leur tête. Le Législateur a d'ailleurs rendu cela obligatoire lors d'un rassemblement restreint et temporaire (comme le voyage), afin d'attirer l'attention par cela sur l'obligation [d'avoir un chef] dans toutes les formes de rassemblements. »</em></p>
<p><strong>Et il (qu'Allah lui fasse miséricorde) a dit</strong> <a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a> <strong>:</strong> <em>« Il est de notoriété publique que les affaires des gens ne sauraient être droites et réformées sans dirigeants. Même si celui qui accède au pouvoir fait partie des injustes, cela reste préférable pour les gens plutôt que leur absence de dirigeant. Comme le dit le dicton :</em></p>
<p class="ar"><span dir="rtl">سَنَةٌ مِنْ إِمَامٍ جَائِرٍ خَيْرٌ مِنْ لَيْلَةٍ بِلَا إِمَارَةٍ...</span></p>
<p><em>"Un an sous l'autorité d'un dirigeant injuste vaut mieux qu'une seule nuit sans gouverneur..." »</em> Fin de citation.</p>
<p>⁕ <strong>Ainsi, si un groupe de personnes possédant une force armée et une puissance (capacité de résistance) s'insurge contre le dirigeant en se basant sur une interprétation ambiguë/erronée</strong>, cherchant à le destituer, à s'opposer à lui, à rompre le pacte d'obéissance et à diviser la communauté, alors ce sont des rebelles (Bughât) injustes. Il incombe donc au dirigeant d'entrer en communication avec eux pour leur demander ce qu'ils lui reprochent. S'ils mentionnent une injustice subie, il se doit de la réparer ; et s'ils invoquent une ambiguïté, il se doit de la dissiper (l'éclaircir), conformément à la parole du Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿ فَأَصْلِحُوا بَيْنَهُمَا ﴾ [الحجرات: ٩]</span></p>
<p><strong>﴾ ...faites la paix entre eux ﴿</strong> [Al-Hujurât : 9].</p>
<p>⁕ Et la réconciliation ne se fait que par cela. Si ce qu'ils lui reprochent fait partie de ce qu'il n'est pas permis de faire, il doit y mettre fin. Et si cela est licite, mais qu'il y a eu pour eux une ambiguïté (une confusion) de sorte qu'ils ont cru que cela était contraire à la vérité ; il leur expose sa preuve et leur en clarifie le sens. S'ils reviennent et retournent à la vérité tout en se soumettant à l'obéissance, il les laisse. Mais s'ils ne reviennent pas, il doit obligatoirement les combattre, et ses sujets ont le devoir de lui prêter assistance, conformément à la parole du Très Haut :</p>
<p class="ar"><span dir="rtl">﴿فَقَٰتِلُواْ ٱلَّتِي تَبۡغِي حَتَّىٰ تَفِيٓءَ إِلَىٰٓ أَمۡرِ ٱللَّهِۚ﴾ [الحجرات: ٩]</span></p>
<p><strong>﴾ combattez le groupe qui se rebelle jusqu'à ce qu'il se conforme à l'ordre d'Allah ﴿</strong> [Al-Hujurât : 9]. Il est donc obligatoire de les combattre jusqu'à ce que leur mal soit repoussé et que leur discorde (<em>Fitnah</em>) soit éteinte.</p>
<p>⁕ Et l'on doit éviter, dans le combat contre eux, les choses suivantes :</p>
<p><strong>Premièrement :</strong> Il est interdit de les combattre par des moyens à effet global, tels que les projectiles destructeurs.</p>
<p><strong>Deuxièmement :</strong> Il est interdit de tuer leur descendance, celui d'entre eux qui fuit (le combat), leur blessé, ainsi que quiconque parmi eux abandonne le combat.</p>
<p><strong>Troisièmement :</strong> Celui d'entre eux qui est fait prisonnier doit être détenu jusqu'à ce que la discorde (Al-Fitnah) s'apaise.</p>
<p><strong>Quatrièmement :</strong> Leurs biens ne sont pas pris comme butin de guerre, car ils sont semblables aux biens des autres musulmans ; il n'est pas permis de se les approprier puisque leur droit de propriété subsiste. Une fois les combats terminés et la discorde apaisée, quiconque d'entre eux retrouve son bien entre les mains d'un autre le reprend. Ce qui a été détruit durant la guerre est considéré comme une perte sans compensation (<em>Hadar</em>). De même, le sang de quiconque est tué parmi les deux groupes durant la guerre ne donne lieu à aucune compensation (ni prix du sang, ni loi du talion).</p>
<p>Al-Zuhrî a dit : <em>« La discorde a éclaté alors que les compagnons du Messager d'Allah <span dir="rtl">ﷺ</span> étaient nombreux. Ils se sont alors accordés à l'unanimité sur le fait que nul ne fait l'objet de la loi du talion (Qisâs), et aucun bien n'est saisi en raison d'une interprétation erronée du Coran (Ta'wîl), à l'exception du bien meuble qui est retrouvé en nature. »</em> Fin de citation.</p>
<p><strong>Et il est dit dans <em>Al-Ifsâh</em> :</strong> <em>« Ils (les savants) se sont accordés sur le fait que ce que les gens de la justice (le gouverneur légitime et son armée) détruisent aux dépens des insurgés (Ahl al-Baghî) ne donne lieu à aucune garantie (compensation financière). Et il en est de même pour ce que les insurgés détruisent. »</em></p>
<p>⁕ Et si deux groupes de musulmans s'entretuent sans que l'un d'eux ne soit dans l'obéissance de l'imam (le gouverneur), mais plutôt par esprit de clan (<em>'Asabiyyah</em>) entre eux ou par quête de pouvoir, alors ils sont tous deux injustes. En effet, chacun d'eux transgresse contre l'autre puisqu'il n'y a aucun privilège pour l'un par rapport à l'autre. Par conséquent, chaque groupe doit compenser ce qu'il a détruit à l'autre. En revanche, si l'un des deux groupes combat sur ordre de l'imam, alors il est dans son droit, et l'autre est un groupe rebelle (<em>Bâghiyah</em>), comme mentionné précédemment.</p>
<p>⁕ Et si des gens manifestent l'opinion des Khawârij — comme le fait de déclarer mécréant (<em>Takfîr</em>) l'auteur d'un grand péché, de rendre licite le sang des musulmans, ou d'insulter les Compagnons —, ils deviennent alors des Khawârij rebelles et pervers (<em>Fasaqah</em>). Si, en plus de cela, ils se rebellent contre l'autorité de l'imam des musulmans, il devient alors obligatoire de les combattre.</p>
<p>Cheikh al-Islâm Ibn Taymiyyah — qu'Allah lui fasse miséricorde — a dit au sujet des Khawârij <a href="#fn6" class="footnote-ref" id="fnref6" role="doc-noteref"><sup>6</sup></a>: <em>« Les gens de la Sunnah (Ahl us-Sunnah) sont unanimes sur le fait qu'ils sont des innovateurs, et qu'il est obligatoire de les combattre selon les textes authentiques. Bien plus, les Compagnons se sont accordés à les combattre. De même, il n'y a aucune divergence parmi les savants de la Sunnah sur le fait qu'on les combat aux côtés des imams justes. Mais doit-on les combattre aux côtés des imams injustes ?</em></p>
<p><em>Il a été rapporté d'après certains gens de science qu'on les combat [aussi avec les imams injustes], de même que l'on combat quiconque parmi les citoyens non-musulmans (Ahl adh-Dhimmah) rompt le pacte. C'est d'ailleurs l'avis de la majorité (Al-Jumhûr). Ils ont dit : On mène l'expédition avec chaque émir, qu'il soit pieux ou pervers, tant que l'expédition qu'il mène est licite. Ainsi, s'il combat les mécréants, les apostats, ceux qui rompent le pacte ou les Khawârij d'un combat légitime, on combat à ses côtés. Mais si son combat n'est pas licite, on ne combat pas à ses côtés. »</em> Fin de citation.</p>
<p>⁕ Et si ceux qui manifestent l'opinion des Khawârij ne se rebellent pas contre l'autorité de l'imam et ne rompent pas le pacte d'obéissance, on ne les combat pas. Les règles de l'Islam s'appliquent à eux, mais il est obligatoire de leur infliger une peine correctionnelle (<em>Ta'zîr</em>), de réprouver leurs actes, et de ne pas leur permettre d'exposer leur opinion ni de propager leur innovation (<em>Bid'ah</em>) parmi les musulmans.</p>
<p>Ceci repose sur l'avis qui stipule qu'ils ne sont pas déclarés mécréants, conformément à la position de la majorité (<em>Al-Jumhûr</em>). Quant à celui qui est d'avis que les Khawârij sont mécréants, alors le fait de les combattre est, selon lui, obligatoire dans tous les cas.</p>
