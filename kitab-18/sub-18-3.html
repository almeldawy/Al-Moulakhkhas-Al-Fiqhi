<p>⁕ <strong>Et les juristes (Fuqahâ) — qu'Allah leur fasse miséricorde — ont dit :</strong> « Il est obligatoire, pour l'application de la peine de la fornication/adultère, que soient présents le dirigeant (Imam) ou son représentant, ainsi qu'un groupe de croyants ; en raison de la parole d'Allah le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿وَلْيَشْهَدْ عَذَابَهُمَا طَائِفَةٌ مِّنَ الْمُؤْمِنِينَ﴾ [النور: ٢]</span></p>
<p><strong>﴾ Et qu’un groupe de croyants assiste à leur punition. ﴿</strong> [Sourate An-Nûr : 2]. »</p>
<p>⁕ <strong>La fornication/adultère fait partie des plus grands crimes.</strong> Sa monstruosité, sa gravité en termes de péché et sa laideur varient : ainsi, commettre le Zina avec une femme mariée, avec une femme qui est un parent incestueux (Mahram), ou avec l'épouse de son voisin, compte parmi ses formes les plus graves.</p>
<p>⁕ <strong>Et puisque la fornication/adultère est l'un des plus grands crimes et des péchés majeurs</strong> — en raison du mélange des filiations qu'elle entraîne, par lequel s'annulent la connaissance mutuelle et l'entraide mutuelle pour la vérité, et parce qu'elle contient la destruction des cultures et de la descendance —, et puisqu'elle comporte ces effets hideux, Allah a institué contre elle cette peine légale stricte. Celle-ci consiste à lapider le coupable avec des pierres jusqu'à ce que mort s'ensuive, ou à le flageller et le bannir de sa ville, afin de garantir ainsi une dissuasion contre sa commission. Cela s'ajoute aux maladies qui en découlent et qui ravagent les sociétés. C'est pourquoi le Législateur l'a interdite de la manière la plus stricte, en disant — le Très-Haut — :</p>
<p class="ar"><span dir="rtl">﴿وَلَا تَقْرَبُوا الزِّنَىٰ ۖ إِنَّهُ كَانَ فَاحِشَةً وَسَاءَ سَبِيلًا﴾ [الإسراء: ٣٢]</span></p>
<p><strong>﴾ Et n’approchez point la fornication/l'adultère. En vérité, c'est une turpitude et quel mauvais chemin ! ﴿</strong> [Sourate Al-Isrâ' : 32], et Il a établi ce châtiment rigoureux pour sanctionner cet acte.</p>
<p>⁕ Les juristes — qu'Allah leur fasse miséricorde — ont défini le <em>Zina</em> comme étant <strong>l'accomplissement de l'acte charnel illicite, que ce soit par voie vaginale ou anale.</strong></p>
<p><strong>Et Ibn Rouchd</strong> <a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a> <strong>a dit :</strong> <em>« Il s'agit de tout rapport charnel accompli en dehors d'un mariage valide, d'une apparence de mariage légitime, ou d'un droit de possession servile. Cela fait globalement l'objet d'un consensus parmi les savants de l'Islam, bien qu'ils aient divergé sur la nature exacte de l'ambiguïté capable d'écarter la peine légale ou non...»</em> Fin de citation.</p>
<p>⁕ <strong>Si l'auteur du <em>Zina</em> (la fornication/l'adultère) est un <em>Mouhsan</em> [une personne ayant déjà été mariée légitimement] et qu'il est pleinement responsable de ses actes (<em>Moukalaf</em>)</strong>, il doit être lapidé avec des pierres jusqu'à ce que mort s'ensuive, qu'il s'agisse d'un homme ou d'une femme. Tel est l'avis des gens de science parmi les Compagnons, les Suivants (<em>Tabi'în</em>) et, après eux, les savants des différentes contrées à toutes les époques. Personne n'a divergé sur ce point, à l'exception des Kharijites.</p>
<p>⁕ <strong>De plus, la lapidation est fermement établie par la Sounnah du Messager d'Allah <span dir="rtl">ﷺ</span></strong>, tant par ses paroles que par ses actes, à travers des voies de transmission textuelles explicites et notoires (<em>Moutawâtirah</em>).</p>
<p>⁕ <strong>La lapidation était initialement mentionnée dans le Noble Coran.</strong> Sa formulation textuelle a ensuite été abrogée (<em>Naskh</em>), tandis que sa sentence juridique est restée en vigueur. Cela figurait dans la parole du Très-Haut :</p>
<blockquote>
<p class="ar"><span dir="rtl">«وَالشَّيْخُ وَالشَّيْخَةُ إِذَا زَنَيَا فَارْجُمُوهُمَا الْبَتَّةَ نَكَالًا مِنَ اللهِ وَاللهُ عَزِيزٌ حَكِيمٌ».</span></p>
</blockquote>
<p><strong>﴾ Quant à l'homme marié et la femme mariée, s'ils commettent le Zina, lapidez-les impérativement en punition de la part d'Allah. Et Allah est Puissant et Sage. ﴿</strong></p>
<p>Malgré le fait que la lapidation soit attestée par le Coran (dont le texte a été abrogé mais non la sentence), par la Sounnah authentique de masse (<em>Moutawâtirah</em>) et par le consensus (<em>Ijmâ'</em>), les Kharijites — ainsi que certains écrivains contemporains qui partagent leur logique — ont eu l'audace de nier la lapidation. Ce faisant, ils ont simplement suivi leurs passions, transgressant les preuves scripturaires de la Loi islamique ainsi que le consensus unanime des musulmans.</p>
<p>⁕ <strong>Le <em>Mouhsan</em> auquel s'applique la peine de lapidation s'il commet le <em>Zina</em> est :</strong> quiconque a déjà consommé le mariage avec son épouse (qu'elle soit musulmane ou issue des Gens du Livre bénéficiant du statut de protection/<em>Dhimmiyyah</em>) dans le cadre d'une union valide, alors que les deux conjoints étaient pubères, dotés de leur raison et libres. Si l'une de ces conditions fait défaut chez l'un des deux conjoints, le statut de <em>Mouhsan</em> (<em>Ihçân</em>) n'est pas établi.</p>
<p><strong>Ces conditions se résument ainsi :</strong></p>
<ol type="1">
<li><blockquote>
<p>Le rapport charnel doit avoir été consommé par la voie naturelle (vaginale).</p>
</blockquote></li>
<li><blockquote>
<p>Ce rapport doit avoir eu lieu au sein d'un mariage juridiquement valide.</p>
</blockquote></li>
<li><blockquote>
<p>La pleine capacité doit être réunie chez chacun d'eux, à savoir : être pubère, libre et doté de sa raison.</p>
</blockquote></li>
</ol>
<p>⁕ <strong>La peine de lapidation a été réservée exclusivement au <em>Thayyib</em> [la personne ayant déjà connu le mariage]</strong>, car ayant été marié, il a pu goûter à ce qui permet de préserver sa chasteté des relations interdites. Il disposait ainsi d'un moyen légitime de s'en passer et s'était mis à l'abri de subir la peine du <em>Zina</em>. Par conséquent, son excuse disparaît sous tous les rapports, et le bienfait [d'Allah] à son égard était total. Or, quiconque jouit d'un bienfait complet commet un crime d'autant plus odieux ; il est donc le plus à même de recevoir le châtiment le plus rigoureux.</p>
<p>⁕ <strong>Et si l'auteur du <em>Zina</em> est une personne responsable (<em>Moukalaf</em>), libre (<em>Hourr</em>) et non mariée (<em>Ghayr Mouhsan</em>)</strong>, elle est sanctionnée par une peine de cent coups de fouet. Cela s'appuie sur la parole du Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿الزَّانِيَةُ وَالزَّانِي فَاجْلِدُوا كُلَّ وَاحِدٍ مِّنْهُمَا مِائَةَ جَلْدَةٍ﴾ [النور: ٢]</span></p>
<p><strong>﴾ La fornicatrice et le fornicateur, flagellez chacun d'eux de cent coups de fouet. ﴿</strong> [Sourate An-Nûr : 2].</p>
<p>La peine du <em>Mouhsan</em> [la personne mariée] — qui est la mise à mort [par lapidation] — a été allégée en sa faveur pour être ramenée à la flagellation, en raison de l'excuse que constitue son statut [de célibataire]. Son sang est ainsi préservé, tout en le dissuadant de récidiver par une douleur infligée à l'ensemble de son corps par la forme de flagellation la plus rigoureuse, à savoir le coup de fouet cutané. Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿وَلَا تَأْخُذْكُم بِهِمَا رَأْفَةٌ فِي دِينِ اللَّهِ﴾ [النور: ٢]</span></p>
<p><strong>﴾ Et que nulle indulgence à leur égard ne vous prenne dans la religion d'Allah ﴿</strong> [Sourate An-Nûr : 2], c'est-à-dire : ne leur faites pas miséricorde en renonçant à appliquer la peine légale (<em>Hadd</em>) contre eux,</p>
<p class="ar"><span dir="rtl">﴿إِن كُنتُمْ تُؤْمِنُونَ بِاللَّهِ وَالْيَوْمِ الْآخِرِ﴾ [النور: ٢]</span></p>
<p><strong>﴾ si vous croyez en Allah et au Jour dernier. ﴿</strong> [Sourate An-Nûr : 2]. En effet, la foi exige de la fermeté dans la religion et de la rigueur dans l'application de ses lois.</p>
<p>⁕ <strong>Il est également établi, en plus de la flagellation, le bannissement [hors de la ville] pour une durée d'un an</strong>, conformément à la Sounnah du Messager d'Allah <span dir="rtl">ﷺ</span>. Cela repose sur ce qu'a rapporté At-Tirmidhî et d'autres :</p>
<p class="ar"><span dir="rtl">«أَنَّ النَّبِيَّ ﷺ ضَرَبَ وَغَرَّبَ، وَأَنَّ أَبَا بَكْرٍ ضَرَبَ وَغَرَّبَ، وَأَنَّ عُمَرَ ضَرَبَ وَغَرَّبَ»</span></p>
<p><em><strong>« Le Prophète <span dir="rtl">ﷺ</span> a flagellé et banni, Abû Bakr a flagellé et banni, et 'Oumar a flagellé et banni »</strong></em> <a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a> .</p>
<p>De plus, le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="rtl">«الْبِكْرُ بِالْبِكْرِ جَلْدُ مِائَةٍ وَتَغْرِيبُ عَامٍ»</span></p>
<p><em><strong>« Pour les deux célibataires [qui commettent le Zina], la peine est de cent coups de fouet et un an de bannissement. »</strong></em> <a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a>.</p>
<p>⁕ <strong>Si l'auteur du <em>Zina</em> est une personne de condition servile [esclave]</strong>, elle reçoit cinquante coups de fouet. Cela est fondé sur la parole du Très-Haut concernant les servantes :</p>
<p class="ar"><span dir="rtl">﴿فَإِذَا أُحْصِنَّ فَإِنْ أَتَيْنَ بِفَاحِشَةٍ فَعَلَيْهِنَّ نِصْفُ مَا عَلَى الْمُحْصَنَاتِ مِنَ الْعَذَابِ﴾ [النساء: ٢٥]</span></p>
<p><strong>﴾ Une fois mariées, si elles commettent une infamie (le Zina), elles s’exposent à la moitié du châtiment qui s'applique aux femmes libres [célibataires]. ﴿</strong> [Sourate An-Nisâ' : 25]. Il n'y a aucune différence ici entre l'homme et la femme. Le châtiment mentionné dans le Noble Coran [qui est divisible par deux] désigne la flagellation. Quant à la lapidation (<em>Rajm</em>), bien qu'elle ait été mentionnée dans le Coran, sa formulation textuelle et sa récitation ont été abrogées, tandis que sa sentence est restée en vigueur.</p>
<p>⁕ Il n'y a pas de bannissement appliqué à l'esclave ; car cela causerait un préjudice à son maître, et parce que la Sounnah ne mentionne pas le bannissement de la personne de condition servile lorsqu'elle commet le Zina. Le Prophète <span dir="rtl">ﷺ</span> a en effet dit au sujet de l'esclave qui n'est pas mariée :</p>
<p class="ar"><span dir="rtl">«إِذَا زَنَتْ؛ فَاجْلِدُوهَا، ثُمَّ إِنْ زَنَتْ؛ فَاجْلِدُوهَا، ثُمَّ إِنْ زَنَتْ؛ فَاجْلِدُوهَا»</span></p>
<p><em><strong>« Si elle commet le Zina, flagellez-la ; puis si elle récidive, flagellez-la ; puis si elle récidive encore, flagellez-la »</strong></em> <a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a>, sans mentionner son bannissement.</p>
<p>⁕ <strong>La peine légale (<em>Hadd</em>) n'est obligatoire que si le rapport sexuel est exempt de toute ambiguïté (<em>Choubha</em>)</strong>, en raison de la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«ادْرَؤُوا الْحُدُودَ بِالشُّبُهَاتِ مَا اسْتَطَعْتُمْ»</span></p>
<p><em><strong>« Écartez les peines légales par les ambiguïtés autant que vous le pouvez »</strong></em> <a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a>.</p>
<p>Ainsi, aucune peine légale ne s'applique à celui qui a un rapport avec une femme en pensant qu'elle est son épouse, ou qui l'accomplit dans le cadre d'un contrat de mariage caduc qu'il croyait valide, ou dans le cadre d'un mariage faisant l'objet de divergences [entre les savants]. De même, aucune peine ne s'applique à celui qui ignorait l'interdiction du <em>Zina</em> parce qu'il vient de se convertir à l'Islam ou parce qu'il a grandi dans une campagne reculée, loin des terres de l'Islam, ou encore si la femme a été contrainte par la force à subir le <em>Zina</em>.</p>
<p><strong>Ibn al-Moundhir a dit :</strong> <em>« Tous les gens de science dont nous avons conservé les avis s'accordent à l'unanimité pour dire que les peines légales sont écartées par les ambiguïtés... »</em> Fin de citation.</p>
<p>Cela témoigne de la flexibilité et de la tolérance de cette Législation islamique (<em>Charî'ah</em>). En effet, l'ambiguïté démontre l'absence d'intention délibérée de commettre le crime, et Allah le Très-Haut dit :</p>
<p class="ar"><span dir="rtl">﴿وَلَيْسَ عَلَيْكُمْ جُنَاحٌ فِيمَا أَخْطَأْتُم بِهِ وَلَٰكِن مَّا تَعَمَّدَتْ قُلُوبُكُمْ ۚ وَكَانَ اللَّهُ غَفُورًا رَّحِيمًا﴾ [الأحزاب: ٥]</span></p>
<p><strong>﴾ Nul blâme ne vous est imputé pour les fautes que vous commettez involontairement, mais seuls comptent les actes que vos cœurs commettent délibérément. Et Allah est Pardonneur et Miséricordieux. ﴿</strong> [Sourate Al-Ahzâb : 5].</p>
<p>⁕ <strong>Parmi les conditions requises pour rendre obligatoire l'application de la peine légale au fornicateur/adulterin : l'établissement de la preuve matérielle que le <em>Zina</em> a bien été commis par lui.</strong> Cela ne peut être prouvé que par l'une des deux modalités suivantes :</p>
<p><strong>La première modalité : Qu'il l'avoue de lui-même à quatre reprises.</strong> Cela s'appuie sur le hadith de Mâ'iz ibn Mâlik ؓ qui a confessé son acte devant le Prophète <span dir="rtl">ﷺ</span> à quatre moments distincts : la première fois, puis la deuxième... Le Prophète <span dir="rtl">ﷺ</span> le renvoyait à chaque fois jusqu'à ce qu'il complète ses quatre aveux <a href="#fn6" class="footnote-ref" id="fnref6" role="doc-noteref"><sup>6</sup></a>. Si un nombre inférieur d'aveux avait suffi, le Prophète aurait appliqué la peine dès les premières déclarations.</p>
<p>Pour que l'aveu de <em>Zina</em> (fornication/adultère) soit juridiquement valide, il est exigé que l'auteur formule explicitement la réalité du rapport charnel, et qu'il ne revienne pas sur son aveu jusqu'à ce que la peine légale (<em>Hadd</em>) soit exécutée. Ainsi, s'il n'évoque pas explicitement la réalité de l'acte, la peine ne lui est pas appliquée ; en raison de la possibilité qu'il ait visé une autre forme de jouissance interdite qui n'entraîne pas la peine capitale ou corporelle. Le Prophète <span dir="rtl">ﷺ</span> a d'ailleurs dit à Mâ'iz ؓ lorsque ce dernier est venu confesser son acte auprès de lui :</p>
<p class="ar"><span dir="rtl">«لَعَلَّكَ قَبَّلْتَ، أَوْ غَمَزْتَ؟»</span></p>
<p><strong>« Peut-être as-tu seulement embrassé, ou fait des clins d'œil [ou touché] ? »</strong><a href="#fn7" class="footnote-ref" id="fnref7" role="doc-noteref"><sup>7</sup></a>. Il répondit : « Non. » Et le Prophète <span dir="rtl">ﷺ</span> a multiplié les demandes de clarification avec lui jusqu'à dissiper toute ambiguïté. De même, si l'auteur revient sur son aveu avant l'exécution de la peine, celle-ci n'est plus appliquée. Cela est prouvé par le fait que le Prophète <span dir="rtl">ﷺ</span> ait poussé Mâ'iz et d'autres à s'expliquer à plusieurs reprises dans l'espoir qu'ils reviennent sur leurs déclarations, ainsi que par sa parole <span dir="rtl">ﷺ</span> lorsque Mâ'iz s'est enfui [pendant la lapidation] :</p>
<p class="ar"><span dir="rtl">«فَهَلَّا تَرَكْتُمُوهُ، لَعَلَّهُ يَتُوبُ فَيَتُوبَ اللهُ عَلَيْهِ»</span></p>
<p><strong>« Que ne l'avez-vous laissé tranquille ! Peut-être se serait-il repenti et qu'Allah aurait accepté son repentir »</strong> <a href="#fn8" class="footnote-ref" id="fnref8" role="doc-noteref"><sup>8</sup></a>.</p>
<p><strong>La deuxième modalité : Que quatre témoins témoignent contre lui.</strong> Cela s'appuie sur la parole du Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿لَّوْلَا جَاءُو عَلَيْهِ بِأَرْبَعَةِ شُهَدَاءَ﴾ [النور: ١٣]</span></p>
<p><strong>﴾ Pourquoi n’ont-ils pas produit à l’appui de leurs accusations quatre témoins ? ﴿</strong> [Sourate An-Nûr : 13]</p>
<p>et Sa parole du Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿وَالَّذِينَ يَرْمُونَ الْمُحْصَنَاتِ ثُمَّ لَمْ يَأْتُوا بِأَرْبَعَةِ شُهَدَاءَ﴾ [النور: ٤]</span></p>
<p><strong>﴾ Et ceux qui lancent des accusations contre des femmes chastes sans produire par la suite quatre témoins ﴿</strong> [Sourate An-Nûr : 4]</p>
<p>ainsi que Sa parole du Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿فَاسْتَشْهِدُوا عَلَيْهِنَّ أَرْبَعَةً مِّنكُمْ﴾ [النساء: ١٥]</span></p>
<p><strong>﴾ Appelez alors quatre témoins parmi vous pour témoigner contre elles ﴿</strong> [Sourate An-Nisâ' : 15].</p>
<p>Pour que leur témoignage soit valide, plusieurs conditions doivent être réunies :</p>
<p><strong>La première :</strong> Qu'ils déposent leur témoignage contre lui au cours d'une seule et même séance [devant le juge].</p>
<p><strong>La deuxième :</strong> Qu'ils témoignent qu'il s'agit d'un seul et même acte de <em>Zina</em> (c'est-à-dire un seul et même fait précis).</p>
<p><strong>La troisième :</strong> Qu'ils décrivent le <em>Zina</em> d'une manière qui écarte toute autre interprétation. En effet, le terme <em>Zina</em> est parfois employé pour désigner des actes qui n'entraînent pas la peine légale corporelle ou capitale. Il est donc indispensable qu'ils l'énoncent clairement afin de lever toute ambiguïté.</p>
<p><strong>La quatrième :</strong> Qu'ils soient des hommes intègres (<em>'Oudoûl</em>). Par conséquent, le témoignage des femmes n'est pas recevable dans ce cas précis, pas plus que le témoignage des personnes perverses (<em>Foussâq</em>).</p>
<p><strong>La cinquième :</strong> Qu'il n'y ait parmi eux personne qui présente un empêchement [à la constatation des faits], tel que la cécité ou autre... Si l'une de ces conditions fait défaut, il devient obligatoire d'appliquer contre eux la peine légale de la calomnie (<em>Hadd al-Qadhf</em>), car ils sont alors considérés comme des calomniateurs. Et Allah le Très-Haut dit :</p>
<p class="ar"><span dir="rtl">﴿وَالَّذِينَ يَرْمُونَ الْمُحْصَنَاتِ ثُمَّ لَمْ يَأْتُوا بِأَرْبَعَةِ شُهَدَاءَ فَاجْلِدُوهُمْ ثَمَانِينَ جَلْدَةً﴾ [النور: ٤]</span></p>
<p><strong>﴾ Et ceux qui lancent des accusations contre des femmes chastes sans produire par la suite quatre témoins, flagellez-les de quatre-vingts coups de fouet. ﴿</strong> [Sourate An-Nûr : 4].</p>
<p>⁕ <strong>L'établissement de la preuve du <em>Zina</em> par le témoignage oculaire susmentionné ou par l'aveu fait l'objet d'un consensus unanime entre les savants.</strong> Cependant, ils ont divergé sur sa validité par un troisième élément : la grossesse (<em>Al-Habal</em>). C'est le cas par exemple d'une femme qui se retrouve enceinte alors qu'elle n'a ni époux ni maître. Certains savants ont dit : la peine légale ne peut être établie par ce seul fait, car il reste possible que cela résulte d'un rapport sexuel sous la contrainte (<em>Ikrâh</em>) ou par ambiguïté (<em>Choubha</em>). D'autres ont dit : au contraire, la peine légale lui est appliquée, à moins qu'elle ne revendique une ambiguïté.</p>
<p><strong>Cheikh al-Islam Ibn Taymiyyah</strong> <a href="#fn9" class="footnote-ref" id="fnref9" role="doc-noteref"><sup>9</sup></a> <strong>a dit :</strong> <em>« Et c'est ce qui est rapporté traditionnellement des Califes bien guidés. C'est également ce qui est le plus en conformité avec les fondements de la Loi islamique (Al-Ousoûl ach-Char'iyyah) ainsi que la doctrine des gens de Médine ; car les suppositions infondées ne sauraient être prises en considération. »</em></p>
<p><strong>Et Ibn al-Qayyim</strong> <a href="#fn10" class="footnote-ref" id="fnref10" role="doc-noteref"><sup>10</sup></a> <strong>a dit :</strong> <em>« 'Omar a jugé de la lapidation de la femme enceinte sans époux ni maître. C'est la doctrine de Mâlik ainsi que la plus authentique des deux versions rapportées d'Ahmad, en se basant sur la présomption manifeste (Al-Qarînah adh-Zhâhirah). »</em></p>
<p>⁕ <strong>Tout comme la peine légale est obligatoire pour le <em>Zina</em> lorsque les conditions de son application sont réunies, elle l'est également pour l'acte du peuple de Loût (<em>Al-Liwât</em>)</strong>, qui consiste à commettre l'infamie par la voie anale. C'est un crime abject et une déviance hideuse qui s'oppose à la saine nature humaine (<em>Al-Fitrah as-Salîmah</em>).</p>
<p>Allah le Très-Haut a dit au sujet du peuple de Loût :</p>
<p class="ar"><span dir="rtl">﴿أَتَأْتُونَ الْفَاحِشَةَ مَا سَبَقَكُم بِهَا مِنْ أَحَدٍ مِّنَ الْعَالَمِينَ ۝ إِنَّكُمْ لَتَأْتُونَ الرِّجَالِ شَهْوَةً مِّن دُونِ النِّسَاءِ ۚ بَلْ أَنْتُمْ قَوْمٌ مُّسْرِفُونَ﴾ [الأعراف: ٨٠ - ٨١]</span></p>
<p><strong>﴾ Vous livrez-vous à cette turpitude que nul autre monde n'a commise avant vous ? Certes, vous assouvissez vos désirs charnels avec les hommes au lieu des femmes ! Vous êtes plutôt un peuple outrancier. ﴿</strong> [Sourate Al-A'râf : 80 - 81]. Son interdiction stricte est formellement connue par le Livre (le Coran), la Sounnah et le consensus unanime (<em>Ijmâ'</em>).</p>
<p>Et Allah a qualifié ceux qui commettent l'acte du peuple de Loût comme pratiquant une turpitude dans laquelle nul ne les avait devancés parmi les mondes ; ils constituent ainsi une anomalie dans l'univers. Il les a décrits comme étant transgresseurs, outranciers et criminels, et Il a abattu sur eux un châtiment qu'Il n'a infligé à aucun autre peuple, en raison de la laideur de leur crime : Il les a engloutis sous terre et a fait pleuvoir sur eux des pierres d'argile cuite.</p>
<p>Le Messager d'Allah <span dir="rtl">ﷺ</span> a d'ailleurs maudit l'auteur de cet acte et celui qui le subit.</p>
<p><strong>Cheikh al-Islam Ibn Taymiyyah</strong> <a href="#fn11" class="footnote-ref" id="fnref11" role="doc-noteref"><sup>11</sup></a> <strong>— qu'Allah lui fasse miséricorde — a dit :</strong> <em>« L'avis authentique, qui est celui des Compagnons, est que les deux protagonistes doivent être mis à mort : l'actif et le passif, qu'ils aient déjà été mariés ou non. » Il ajouta : « Les Compagnons n'ont pas divergé sur sa mise à mort, bien que certains d'entre eux estimaient qu'il fallait le précipiter du plus haut mur de la ville, puis lui jeter des pierres. »</em></p>
<p><strong>Et Al-Mouwafaq [Ibn Qoudâmah]</strong> <a href="#fn12" class="footnote-ref" id="fnref12" role="doc-noteref"><sup>12</sup></a> <strong>a dit :</strong> <em>« Et parce que cela (c'est-à-dire la mise à mort de celui qui commet l'acte du peuple de Loût) relève du consensus des Compagnons ; ils se sont en effet accordés à l'unanimité sur sa mise à mort, et n'ont divergé que sur sa modalité d'exécution. »</em></p>
<p><strong>Et Ibn Rajab a dit :</strong> « L'avis authentique est sa mise à mort, qu'il ait déjà été marié ou non, en raison de la parole du Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿وَأَمْطَرْنَا عَلَيْهِمْ حِجَارَةً مِّن سِجِّيلٍ﴾ [الحجر: ٧٤]</span></p>
<p><strong>﴾ Et Nous fîmes pleuvoir sur eux des pierres d'argile cuite ﴿</strong> [Sourate Al-Hijr : 74]. Et il est rapporté d'Ahmad : <em>"Sa peine légale est la lapidation, qu'il soit célibataire ou qu'il ait déjà été marié"</em>. C'est également l'avis de Mâlik et d'autres, ainsi que l'une des deux positions de Ach-Châfi'î, en raison de la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«مَنْ وَجَدْتُمُوهُ يَعْمَلُ عَمَلَ قَوْمِ لُوطٍ؛ فَاقْتُلُوا الْفَاعِلَ وَالْمَفْعُولَ بِهِ»</span></p>
<p><em><strong>« Quiconque vous trouvez en train de commettre l'acte du peuple de Loût, tuez l'auteur et celui qui le subit »</strong></em>, rapporté par Abû Dâwoûd. Et dans une autre version :</p>
<p class="ar"><span dir="rtl">«فَارْجُمُوا الْأَعْلَى وَالْأَسْفَلَ»</span></p>
<p><em><strong>« Lapidez l'actif et le passif »</strong></em> <a href="#fn13" class="footnote-ref" id="fnref13" role="doc-noteref"><sup>13</sup></a>.</p>
<p>Et s'assimile à l'acte du peuple de Loût le fait qu'un homme approche son épouse par la voie anale. Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿فَأْتُوهُنَّ مِنْ حَيْثُ أَمَرَكُمُ اللَّهُ ۚ إِنَّ اللَّهَ يُحِبُّ التَّوَّابِينَ وَيُحِبُّ الْمُتَطَهِّرِينَ﴾ [البقرة: ٢٢٢]</span></p>
<p><strong>﴾ Approchez-les donc par là où Allah vous l'a prescrit. En vérité, Allah aime ceux qui se repentent et Il aime ceux qui se purifient. ﴿</strong> [Sourate Al-Baqarah : 222]. Ibn 'Abbâs, Moujâhid et bien d’autres ont dit : « <em>C'est-à-dire : par le sexe féminin. »</em> 'Alî ibn Abî Talhah a rapporté d'Ibn 'Abbâs au sujet du verset <strong>﴾ Approchez-les donc par là où Allah vous l'a prescrit ﴿</strong> [Sourate Al-Baqarah : 222] : <em>« Il dit : par le sexe féminin, et ne la dépassez pas vers une autre. Quiconque commet quoi que ce soit de cela a certes transgressé. »</em></p>
<p>Un tel individu se doit d'être sanctionné par une peine dissuasive. Si l'époux persiste dans la commission de ce crime, il devient alors obligatoire pour son épouse de demander la séparation et de s'éloigner de lui ; car il s'agit d'un acte d'une bassesse ignoble, et il ne lui sied point de demeurer avec lui dans une telle situation.</p>
