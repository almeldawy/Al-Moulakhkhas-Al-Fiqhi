<h3 id="بسم-الله-الرحمن-الرحيم"><strong><span dir="rtl">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</span></strong></h3>
<p><strong>Chapitre sur les règles relatives aux peines légales (Al-Hudûd)</strong></p>
<p>⁕ Les « <em><strong>Hudûd</strong></em> » (peines légales) : c'est le pluriel de « <em><strong>Hadd</strong></em> ».</p>
<p>Linguistiquement, cela signifie : <em><strong>l'empêchement (ou la restriction)</strong></em>. Et les limites (Hudûd) d'Allah le Très-Haut désignent Ses interdits dont l'accomplissement et la transgression ont été prohibés.</p>
<p>Dans la terminologie religieuse (Chari'ah), les Hudûd désignent : <em><strong>une sanction déterminée par la législation islamique pour un péché spécifique, afin d'empêcher de commettre un acte similaire.</strong></em></p>
<p>Le fondement scripturaire (légal) de leur légitimité réside dans : le Livre (le Coran), la Sunnah et le Consensus (Al-Ijmâ').</p>
<p>Cheikh al-Islam Ibn Taymiyyah — qu'Allah lui fasse miséricorde — a dit <a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a> : <em>« Les peines légales découlent de la miséricorde envers les créatures et d'une volonté de leur faire du bien. C'est pourquoi celui qui châtie les gens pour leurs péchés doit viser, par cela, la bienfaisance à leur égard et la miséricorde pour eux ; tout comme le père vise à éduquer son enfant, et tout comme le médecin vise à soigner le malade... »</em>. Fin de citation.</p>
<p>⁕ La sagesse derrière la législation des peines légales (Al-Hudûd) réside dans le fait qu'elles ont été instituées comme des freins (dissuasions) pour les âmes, un châtiment exemplaire et une purification. Elles constituent une sanction déterminée pour le droit d'Allah le Très-Haut, puis pour l'intérêt de la société. Allah le Très-Haut les a imposées aux auteurs de crimes vers lesquels la nature humaine peut tendre. Elles font ainsi partie des plus grands intérêts des serviteurs dans leur vie d'ici-bas et dans l'au-delà. En effet, la gouvernance d'un État ne peut s'accomplir sans mesures de dissuasion et sans sanctions appliquées aux criminels, par lesquelles le pécheur est réfréné, l'obéissant est rassuré, la justice se concrétise sur terre, et les gens se trouvent en sécurité pour leurs épouses, <em>leurs honneurs et leurs biens, comme cela est constaté dans les sociétés qui appliquent les peines légales d'Allah. Il s'y réalise en effet une sécurité, une stabilité et une douceur de vivre qu'aucun détracteur ne peut nier. Il en va tout autrement pour les sociétés qui ont suspendu les peines légales d'Allah, prétendant qu'elles sont barbares et qu'elles ne conviennent pas à la civilisation contemporaine ; leurs sociétés se sont alors vues privées de cette justice divine, ainsi que du bienfait de la sécurité et de la stabilité, et ce, même si elles possèdent toutes les armes et les technologies de pointe qu'elles veulent. Tout cela ne leur sera d'aucune utilité tant qu'elles n'appliqueront pas les peines d'Allah qu'Il a légiférées pour le bien de Ses serviteurs. Les sociétés humaines ne se gouvernent pas uniquement par le fer et les machines, mais elles se gouvernent par la législation d'Allah et Ses peines légales. Le fer et les technologies ne sont que des outils pour exécuter les peines de la Chari'ah, si on sait les utiliser à bon escient. Et comment ces égarés peuvent-ils qualifier de barbares les peines d'Allah, alors qu'elles sont une guidance et une miséricorde pour l'univers ?! Comment les qualifient-ils de barbares, sans qualifier de barbarie l'acte du criminel agresseur lorsqu'il terrorise les personnes paisibles, s'en prend aux innocents et ébranle la sécurité de la société ?! C'est bien cela la barbarie. Et celui qui éprouve de la compassion pour ce criminel est encore plus injuste et plus barbare que lui. Cependant, lorsque les raisons s'altèrent et que les natures saines (Fitrah) se corrompent, elles voient la vérité comme un faux et le faux comme une vérité, tout comme l'a dit le poète :</em></p>
<p class="ar"><strong><span dir="rtl">قَدْ تُنْكِرُ الْعَيْنُ ضَوْءَ الشَّمْسِ مِنْ رَمَدٍ … وَيُنْكِرُ الْفَمُ طَعْمَ الْمَاءِ مِنْ سَقَمِ</span></strong> </p>
<p><em>Parfois l'œil nie la lumière du soleil en raison d'une ophtalmie</em></p>
<p><em>Et la bouche nie le goût de l'eau en raison de la maladie.</em></p>
<p>⁕ Ceci étant dit, il n'est pas permis d'appliquer la peine légale (Al-Hadd) à l'auteur d'un délit à moins que les conditions de son application ne soient réunies, et elles sont les suivantes :</p>
<p><strong>La première condition :</strong> L'auteur du crime doit être pubère et doté de sa raison, en raison de la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«رُفِعَ الْقَلَمُ عَنْ ثَلَاثَةٍ: الصَّغِيرِ حَتَّىٰ يَبْلُغَ، وَالْمَجْنُونِ حَتَّىٰ يُفِيقَ، وَالنَّائِمِ حَتَّىٰ يَسْتَيْقِظَ»</span></p>
<p><em><strong>« La plume a été levée pour trois personnes : l'enfant jusqu'à ce qu'il atteigne la puberté, le fou jusqu'à ce qu'il retrouve la raison, et le dormeur jusqu'à ce qu'il se réveille »</strong></em>, rapporté par les auteurs des Sunan et d'autres <a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a>. Ainsi, si les actes d'adoration ne sont pas obligatoires pour ces personnes, la peine légale est à plus forte raison abandonnée, en raison de l'absence de responsabilité légale (Taklîf) et parce qu'elle s'annule par le doute.</p>
<p><strong>La deuxième condition :</strong> L'auteur du crime doit avoir connaissance de l'interdiction ; ainsi, il n'y a pas de peine légale contre celui qui ignore l'interdiction, conformément à la parole de 'Umar, 'Uthmân et 'Alî — qu'Allah les agrée — : <em><strong>« Il n'y a pas de peine légale sauf pour celui qui avait connaissance [de l'interdiction] »</strong></em>, et on ne leur connaît aucun contradicteur parmi les Compagnons. Et Al-Muwaffaq Ibn Qudâmah a dit : <em>« C'est l'avis de la majorité des gens de science »</em>.</p>
<p><strong>Lorsque ces conditions sont réunies chez l'auteur du crime qui implique une peine légale, c'est au gouverneur (l'Imam) ou à son représentant de l'appliquer.</strong> En effet, le Prophète <span dir="rtl">ﷺ</span> appliquait les peines légales, puis ses califes après lui les ont appliquées. De plus, le Prophète <span dir="rtl">ﷺ</span> a mandaté quelqu'un pour appliquer la peine en son nom lorsqu'il a dit :</p>
<p class="ar"><span dir="rtl">«وَاغْدُ يَا أُنَيْسُ إِلَىٰ امْرَأَةِ هَٰذَا، فَإِنِ اعْتَرَفَتْ فَارْجُمْهَا»</span></p>
<p><em><strong>« Ô Unays, rends-toi demain matin chez la femme de cet homme, et si elle avoue, alors lapide-la »</strong></em>.<a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a></p>
<p>Le Prophète <span dir="rtl">ﷺ</span> a également ordonné la lapidation de Mâ'iz sans y assister lui-même<a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a>, et il a dit au sujet d'un voleur :</p>
<p class="ar"><span dir="rtl">«اذْهَبُوا بِهِ فَاقْطَعُوهُ»</span></p>
<p><em><strong>« Emmenez-le et coupez-lui [la main] ».</strong></em></p>
<p>De surcroît, parce que l'application de la peine requiert un effort de réflexion (Ijtihâd) et qu'on n'est pas à l'abri d'une injustice, il est obligatoire que le gouverneur ou son représentant s'en charge, afin de garantir l'équité dans son exécution, que ces peines relèvent du droit d'Allah le Très-Haut comme la peine pour fornication, ou du droit d'un être humain comme la peine pour fausse accusation (Qadhf).</p>
<p>Cheikh Taqî ad-Dîn Ibn Taymiyyah — qu'Allah lui fasse miséricorde — a dit <a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a> : <em>« Les peines légales (Al-Hudûd) qui ne concernent pas des personnes spécifiques sont appelées les limites d'Allah et les droits d'Allah. C'est le cas, par exemple, pour les bandits de grand chemin, les voleurs, les fornicateurs et leurs semblables. Il en va de même pour le jugement concernant les biens publics souverains (Al-Amwâl As-Sultâniyyah), les fondations pieuses (Al-Wuqûf) et les testaments qui ne sont pas destinés à des bénéficiaires spécifiques. Ces questions comptent parmi les responsabilités les plus importantes des gouverneurs. Il incombe aux gouvernants d'investiguer à leur sujet et de les appliquer sans qu'il soit nécessaire qu'une plainte ne soit déposée par quiconque. De même, le témoignage y est établi sans qu'une plainte préalable ne soit requise. Et il est obligatoire de les appliquer de manière égale, que ce soit sur le noble ou le roturier, le fort ou le faible... »</em> Fin de citation.</p>
<p>⁕ Il est interdit d'appliquer la peine légale (Al-Hadd) au sein de la mosquée ; elle doit obligatoirement être exécutée en dehors de celle-ci. Cela se base sur le hadith de Hakîm ibn Hizâm :</p>
<p class="ar"><span dir="rtl">«أَنَّ رَسُولَ اللَّهِ ﷺ نَهَى أَنْ يُسْتَقَادَ بِالْمَسْجِدِ، وَأَنْ تُنْشَدَ الْأَشْعَارُ، وَأَنْ تُقَامَ فِيهِ الْحُدُودُ»</span></p>
<p><em><strong>« Le Messager d'Allah <span dir="rtl">ﷺ</span> a interdit que l'on applique la loi du talion (Yustaqâd) dans la mosquée, que l'on y déclame des poèmes et que l'on y applique les peines légales »</strong></em><a href="#fn6" class="footnote-ref" id="fnref6" role="doc-noteref"><sup>6</sup></a>... Et ce qui est visé par les poèmes interdits, ce sont les poèmes qui ne sont pas convenables (indécents).</p>
<p>⁕ L'intercession concernant une peine légale (<em>Hadd</em>) est interdite une fois que l'affaire a atteint le gouverneur, lorsque le but est de l'annuler et de ne pas l'appliquer. Il est également interdit aux détenteurs de l'autorité d'accepter une intercession à ce sujet, en raison de la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«مَنْ حَالَتْ شَفَاعَتُهُ دُونَ حَدٍّ مِنْ حُدُودِ اللَّهِ؛ فَقَدْ ضَادَّ اللَّهَ فِي أَمْرِهِ»</span></p>
<p><em><strong>« Celui dont l'intercession empêche l'application d'une des peines prescrites par Allah s'est certes opposé à Allah dans Son commandement. »</strong></em> <a href="#fn7" class="footnote-ref" id="fnref7" role="doc-noteref"><sup>7</sup></a> Et il <span dir="rtl">ﷺ</span> a dit à celui qui voulait pardonner au voleur :</p>
<p class="ar"><span dir="rtl">«فَهَلَّا قَبْلَ أَنْ تَأْتِيَنِي بِهِ»</span></p>
<p><em><strong>« Pourquoi ne l'as-tu fait avant de me l'amener ? »</strong></em> <a href="#fn8" class="footnote-ref" id="fnref8" role="doc-noteref"><sup>8</sup></a></p>
<p>Cheikh al-Islam Ibn Taymiyyah <a href="#fn9" class="footnote-ref" id="fnref9" role="doc-noteref"><sup>9</sup></a> (qu'Allah lui fasse miséricorde) a dit : <em>« Il n'est pas permis de l'annuler (c'est-à-dire : la peine légale), que ce soit par une intercession, un cadeau ou par autre chose, et l'intercession à son sujet n'est pas permise. Quiconque l'annule pour ces raisons alors qu'il est capable de l'appliquer, que la malédiction d'Allah, des anges et de tous les hommes soit sur lui. »</em></p>
<p>Il <a href="#fn10" class="footnote-ref" id="fnref10" role="doc-noteref"><sup>10</sup></a> (qu'Allah lui fasse miséricorde) a également dit : <em>« Il n'est pas permis de prendre du voleur, du fornicateur, du buveur [d'alcool], du coupeur de route ou de quiconque de semblable, un bien par lequel la peine serait annulée, ni pour le trésor public (Bayt al-Mâl) ni pour autre chose. Ce bien pris pour annuler la peine est un gain illicite et mauvais (Suht). Si le détenteur de l'autorité fait cela, il aura réuni deux immenses corruptions : la première est l'annulation de la peine, et la seconde est la consommation d'un gain illicite. Il aura ainsi délaissé une obligation et commis un interdit. Ils (les savants) sont unanimes sur le fait que l'argent pris du fornicateur, du voleur, du buveur, du coupeur de route et de ceux qui leur ressemblent, afin d'annuler la peine légale, est un gain illicite et mauvais. C'est d'ailleurs la cause de corruption la plus répandue dans les affaires des musulmans, et c'est la cause de la perte de respect envers le dirigeant, de la chute de sa valeur et de la dissolution de son autorité... »</em>. Fin de ses propos (qu'Allah lui fasse miséricorde).</p>
<p>Ainsi, les crimes ne peuvent être endigués, et la société ne peut être protégée de leur mal, que par l'application des peines légales (<em>Hudud</em>) à l'encontre de ceux qui les commettent. Quant au fait de leur prendre une amende financière, de les emprisonner, ou toute autre sanction similaire parmi les lois forgées par les hommes (<em>Al-'Uqoubât al-Wad'iyyah</em>) ; cela n'est que pure perte, injustice et un accroissement du mal.</p>
<p>⁕ Nos juristes (<em>Fouqahâ</em>), qu'Allah leur fasse miséricorde, ont dit : <strong>Les infractions pour lesquelles les peines légales (<em>Hudud</em>) sont obligatoires sont au nombre de cinq</strong> ; ce sont : la fornication/l'adultère (<em>Ad-Zinâ</em>), le vol (<em>As-Sariqah</em>), le brigandage/coupe de route (<em>Qat' at-Tarîq</em>), la consommation de vin/d'alcool (<em>Chourb al-Khamr</em>) et la fausse accusation de fornication (<em>Al-Qadhf</em>). <strong>Tout ce qui est en dehors de cela relève de la peine correctionnelle disciplinaire (<em>At-Ta'zîr</em>)</strong>, comme cela sera explicité plus loin, si Allah le veut.</p>
<p>⁕ Et ils ont dit : La flagellation la plus intense parmi les peines légales est celle de la fornication, vient ensuite celle de la fausse accusation, puis celle de la consommation d'alcool, et enfin celle de la peine correctionnelle (<em>Ta'zîr</em>). Cela s'explique par le fait qu'Allah le Très-Haut a spécifié la fornication par une insistance accrue, conformément à Sa parole :</p>
<p class="ar"><span dir="rtl">﴿وَلَا تَأْخُذْكُم بِهِمَا رَأْفَةٌ فِي دِينِ اللَّهِ﴾ [النور: ٢]</span></p>
<p><strong>﴾ Et que nulle indulgence à leur égard ne vous prenne dans la religion d'Allah ﴿</strong> [An-Nour : 2]. Et ce qui est inférieur [à la fornication] étant déjà plus léger quant au nombre [de coups], il n'est donc pas permis que [l'intensité de sa flagellation] surpasse celle-ci dans sa modalité d'exécution.</p>
<p>⁕ Et ils ont dit : Quiconque meurt suite à l'application d'une peine légale (<em>Hadd</em>), sa mort est considérée comme vaine (sans contrepartie), et aucune responsabilité ne pèse sur celui qui a appliqué la peine ; car il l'a exécutée selon la modalité légiférée, conformément à l'ordre d'Allah le Très-Haut et à l'ordre de Son Messager <span dir="rtl">ﷺ</span>.</p>
<p>En revanche, s'il transgresse la modalité légiférée lors de l'application de la peine, et que la personne châtiée meurt par la suite, il en est alors garant et doit verser le prix du sang (<em>Ad-Diyah</em>) ; car la mort est survenue en raison de son agression, ce qui s'apparente au cas où il l'aurait frappée en dehors de tout cadre légal. Al-Muwaffaq (Ibn Qoudâmah) — qu'Allah lui fasse miséricorde — a dit : <em>« Sans aucune divergence à notre connaissance. »</em></p>
