<p>⁕ <strong>L'apostat (Al-Murtadd) au sens linguistique :</strong> C'est celui qui revient en arrière. On dit : « <span dir="rtl">ارْتَدَّ فَهُوَ مُرْتَدٌّ: إِذَا رَجَع</span>َ » « <em>il a apostasié (irtadda), il est donc apostat (murtadd) lorsqu'il retourne sur ses pas</em> .»</p>
<p>Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿ وَلَا تَرْتَدُّوا عَلَىٰ أَدْبَارِكُمْ ﴾ [المائدة: ٢١]</span></p>
<p><strong>﴾ Et ne retournez pas sur vos pas ﴿</strong> [Al-Mâ'idah : 21], c'est-à-dire : ne revenez pas en arrière.</p>
<p>⁕ <strong>L'apostat au sens juridique (religieux) :</strong> C'est celui qui mécroit de plein gré après avoir été musulman, que ce soit par une parole, une croyance, un doute ou un acte.</p>
<p class="ar"><span dir="rtl">( هُوَ الَّذِي يَكْفُرُ بَعْدَ إِسْلَامِهِ طَوْعًا بِنُطْقٍ أَوِ اعْتِقَادٍ أَوْ شَكٍّ أَوْ فِعْلٍ )</span></p>
<p>⁕ L'apostat est soumis à un statut dans ce bas-monde et à un statut dans l'au-delà.</p>
<p>- <strong>Quant à son statut dans ce bas-monde :</strong> Le Messager <span dir="rtl">ﷺ</span> l'a explicité par sa parole :</p>
<p class="ar"><span dir="rtl">«مَنْ بَدَّلَ دِينَهُ فَاقْتُلُوهُ»</span></p>
<p><em><strong>« Quiconque change sa religion, tuez-le »</strong></em> <a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a>. Et les savants ont convergé de manière unanime (Ijmâ') sur cela, ainsi que sur les conséquences qui en découlent, telles que la séparation d'avec son épouse et l'interdiction de disposer de ses biens avant son exécution.</p>
<p>- <strong>Quant à son statut dans l'au-delà :</strong> Allah le Très-Haut l'a exposé par Sa parole :</p>
<p class="ar"><span dir="rtl">﴿ وَمَن يَرْتَدِدْ مِنكُمْ عَن دِينِهِۦ فَيَمُتْ وَهُوَ كَافِرٌ فَأُو۟لَٰٓئِكَ حَبِطَتْ أَعْمَٰلُهُمْ فِى ٱلدُّنْيَا وَٱلْءَاخِرَةِ ۖ وَأُو۟لَٰٓئِكَ أَصْحَٰبُ ٱلنَّارِ ۖ هُمْ فِيهَا خَٰلِدُونَ ﴾ [البقرة: ٢١٧].</span></p>
<p><strong>﴾ Et ceux parmi vous qui apostasient de leur religion et meurent en étant mécréants, alors leurs actions seront vaines dans ce monde et dans l'au-delà. Ceux-là sont les gens du Feu, ils y demeureront éternellement. ﴿</strong> [Al-Baqarah : 217].</p>
<p>⁕ L'apostasie se produit par la commission de l'un des annulateurs de l'Islam, que la personne soit sérieuse ( <span dir="rtl">جَادًّا</span> ), plaisante ( <span dir="rtl">هَازِلًا</span> ) ou moqueuse ( <span dir="rtl">مُسْتَهْزِئًا</span> ).</p>
<p>Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿وَلَئِن سَأَلْتَهُمْ لَيَقُولُنَّ إِنَّمَا كُنَّا نَخُوضُ وَنَلْعَبُ ۚ قُلْ أَبِٱللَّهِ وَءَايَٰتِهِۦ وَرَسُولِهِۦ كُنتُمْ تَسْتَهْزِءُونَ ۝ لَا تَعْتَذِرُوا۟ قَدْ كَفَرْتُم بَعْدَ إِيمَٰنِكُمْ﴾ [التوبة: ٦٥، ٦٦]</span></p>
<p><strong>﴾ Et si tu les interrogeais, ils diraient très certainement : "Nous ne faisions que bavarder et jouer." Dis : "Est-ce d'Allah, de Ses versets et de Son messager que vous vous moquiez ?" Ne vous excusez pas, vous avez bel et bien mécru après avoir eu la foi. ﴿</strong> [At-Tawbah : 65, 66].</p>
<p>⁕ Quant à la personne contrainte, si elle prononce [une parole de mécréance] en raison de la contrainte, elle n'apostasie pas, en vertu de la parole d'Allah le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿مَن كَفَرَ بِٱللَّهِ مِنۢ بَعْدِ إِيمَٰنِهِۦٓ إِلَّا مَنْ أُكْرِهَ وَقَلْبُهُۥ مُطْمَئِنٌّۢ بِٱلْإِيمَٰنِ﴾ [النحل: ١٠٦].</span></p>
<p><strong>﴾ Quiconque mécroit en Allah après avoir eu la foi — sauf celui qui y a été contraint alors que son cœur demeure plein de sérénité dans la foi... ﴿</strong> [An-Nahl : 106].</p>
<p>⁕ <strong>Et les annulateurs de l'Islam par lesquels l'apostasie se produit sont nombreux :</strong></p>
<p><strong>Parmi les plus grands :</strong> Le polythéisme (<em>al-Chirk</em>) envers Allah le Très-Haut. Quiconque associe à Allah le Très-Haut — en invoquant autre qu'Allah parmi les morts, les alliés d'Allah <em>(Al-Awliyâ)</em> et les pieux, ou en égorgeant (un sacrifice) pour leurs tombes, ou en leur vouant un vœu, ou en demandant le secours <em>(Al-Ghawth)</em> et le soutien aux morts, comme le font les adorateurs des tombes aujourd'hui — a certes apostasié de la religion de l'Islam. Le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿إِنَّ اللَّهَ لَا يَغْفِرُ أَن يُشْرَكَ بِهِ وَيَغْفِرُ مَا دُونَ ذَٰلِكَ لِمَن يَشَاءُ﴾ [النساء: ٤٨]</span></p>
<p><strong>﴾ Certes, Allah ne pardonne pas qu'on Lui associe quoi que ce soit, et Il pardonne ce qui est inférieur à cela à qui Il veut. ﴿</strong> [An-Nisâ : 48].</p>
<p><strong>Cheikh al-Islam Ibn Taymiyyah</strong> <a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a> <strong>a dit :</strong> <em>« Quiconque place entre lui et Allah des intermédiaires qu'il invoque, auxquels il demande (l'intercession) et en qui il place sa confiance, a mécru à l'unanimité. De même, quiconque renie certains messagers ou certains Livres divins a certes apostasié, car il dément le Livre, la Sunnah et le consensus (Al-Ijmâ'). De même, quiconque insulte Allah le Très-Haut ou insulte un prophète parmi Ses prophètes a certes mécru, car il dément la parole du Très-Haut :</em></p>
<p class="ar"><span dir="rtl">﴿وَلَٰكِن رَّسُولَ اللَّهِ وَخَاتَمَ النَّبِيِّينَ﴾ [الأحزاب: ٤٠]</span></p>
<p><strong>﴾ ...mais il est le Messager d'Allah et le dernier des prophètes. ﴿</strong> <em>[Al-Ahzâb : 40].</em></p>
<p><em>Quiconque renie l'interdiction de la fornication (Az-Zinâ), ou renie l'interdiction d'une chose parmi les interdits apparents et faisant l'objet d'un consensus quant à leur interdiction, comme la viande de porc et le vin, ou déclare illicite une chose faisant l'objet d'un consensus quant à sa licéité, parmi les choses dont la licéité ne fait l'objet d'aucune divergence, comme la bête de cheptel égorgée selon le rite, a certes mécru. De même, quiconque renie l'obligation d'une adoration parmi les cinq adorations mentionnées dans la parole du Prophète <span dir="rtl">ﷺ</span> :</em></p>
<p class="ar"><span dir="rtl">«بُنِيَ الْإِسْلَامُ عَلَىٰ خَمْسٍ: شَهَادَةِ أَنْ لَا إِلَٰهَ إِلَّا اللَّهُ وَأَنَّ مُحَمَّداً رَسُولُ اللَّهِ، وَإِقَامِ الصَّلَاةِ، وَإِيتَاءِ الزَّكَاةِ، وَصَوْمِ رَمَضَانَ، وَحَجِّ بَيْتِ اللَّهِ الْحَرَامِ»</span></p>
<p><em><strong>« L'Islam est bâti sur cinq (piliers) : l'attestation qu'il n'y a de divinité digne d'adoration qu'Allah et que Muhammad est le Messager d'Allah, l'accomplissement de la prière, l'acquittement de la Zakat, le jeûne de Ramadan et le pèlerinage à la Maison Sacrée d'Allah. »</strong></em> <a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a><em>.</em></p>
<p><em>Et quiconque se moque de la religion, ou méprise le Noble Coran, ou prétend qu'il manque quelque chose au Coran ou que quelque chose en a été dissimulé, il n'y a alors aucune divergence quant à sa mécréance. »</em></p>
<p>Et Cheikh al-Islâm Ibn Taymiyyah — qu'Allah lui fasse miséricorde — a dit <a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a>: <em>« Il est connu par nécessité dans la religion de l'Islam, et par le consensus de tous les musulmans, que quiconque autorise le fait de suivre une autre religion que l'Islam, ou de suivre une législation autre que la Loi (Charia) de Muhammad <span dir="rtl">ﷺ</span>, est un mécréant. Sa mécréance est semblable à celle de quiconque croit en une partie du Livre et mécroit en une autre partie. »</em></p>
<p>Et il a dit : <em>« Quiconque se moque de la promesse d'Allah (le Paradis) ou de Sa menace (l'Enfer), ou ne déclare pas mécréant quiconque professe une autre religion que l'Islam — comme les chrétiens —, ou doute de leur mécréance, ou valide leur doctrine, est mécréant à l'unanimité (par consensus). »</em></p>
<p>Et il a dit : <em>« Quiconque insulte les Compagnons ou l'un d'entre eux, et que son insulte s'accompagne de la prétention qu'Ali est une divinité ou un prophète, et que [l'ange] Gabriel s'est trompé [dans la transmission de la révélation], alors il n'y a aucun doute quant à sa mécréance. »</em> Fin de ses paroles, qu'Allah lui fasse miséricorde.</p>
<p>- Et quiconque juge par les lois forgées [par l'homme] à la place de la Législation islamique (Charia), en considérant qu'elles sont plus profitables aux gens que la Législation islamique, ou embrasse l'idéologie du communisme ou du nationalisme arabe comme alternative à l'Islam ; il n'y a alors aucun doute quant à son apostasie.</p>
<p>- Et les types d'apostasie sont nombreux ; comme celui qui prétend connaître l'Inconnaissable (<em>al-Ghayb</em>), ou celui qui ne déclare pas mécréants les associateurs (polythéistes), ou doute de leur mécréance, ou valide la voie sur laquelle ils se trouvent.</p>
<p>De même pour celui qui croit qu'une guidée autre que celle du Prophète <span dir="rtl">ﷺ</span> est plus parfaite que la sienne, ou que le jugement d'un autre que le Prophète <span dir="rtl">ﷺ</span> est meilleur que le sien.</p>
<p>De même pour celui qui déteste une chose parmi celles apportées par le Messager <span dir="rtl">ﷺ</span>, ou quiconque se moque d'une partie de la religion du Messager, de sa récompense ou de son châtiment.</p>
<p>Il en va de même pour celui qui soutient les associateurs et les aide contre les musulmans, ou celui qui croit qu'il est permis à certaines personnes de s'affranchir de la Législation (<em>Charia</em>) de Muhammad <span dir="rtl">ﷺ</span> — à l'instar des extrémistes parmi les soufis.</p>
<p>Enfin, quiconque se détourne de la religion d'Allah, ne l'apprenant pas et ne la mettant pas en pratique ; toutes ces situations font partie des causes de l'apostasie et des annulateurs de l'Islam.</p>
<p>Cheikh Muhammad ibn 'Abd al-Wahhâb — qu'Allah lui fasse miséricorde — a dit : <em>« Et il n'y a aucune différence, concernant l'ensemble de ces annulateurs, entre celui qui plaisante, celui qui est sérieux, et celui qui a peur ; excepté celui qui y est contraint (sous la menace). Chacun d'entre eux fait partie des choses les plus graves qui soient et des plus fréquemment commises. Il convient donc au musulman d'y prendre garde et de les redouter pour lui-même. Nous cherchons refuge auprès d'Allah contre les causes de Sa colère et la rigueur de Son châtiment. »</em></p>
<p>Ce sont là des exemples parmi les annulateurs de l'Islam, et ils sont bien plus nombreux que ce qui a été mentionné. Il t'incombe donc de les apprendre et de les connaître afin de t'en méfier et de les éviter ; car certes, quiconque ne connaît pas l'association (<em>al-Chirk</em>) est sur le point d'y tomber.</p>
<p>Et ‘Umar ibn al-Khattâb (qu'Allah l'agrée) a dit :</p>
<p class="ar"><span dir="rtl">« يُوشِكُ أَنْ تُنْقَضَ عُرَى الْإِسْلَامِ عُرْوَةً عُرْوَةً إِذَا نَشَأَ فِي الْإِسْلَامِ مَنْ لَا يَعْرِفُ الْجَاهِلِيَّةَ ».</span></p>
<p><em><strong>« Les liens de l'Islam s'en trouveront bientôt dénoués, maille par maille, lorsque grandira au sein de l'Islam celui qui ne connaît pas la Jâhilîyah (la période de l'ignorance préislamique). »</strong></em></p>
<p>Et je te conseille vivement de lire le livre <em>« Iqtidâ' as-Sirât al-Mustaqîm Mukhâlafat Ashâb al-Jahîm »</em> (L'exigence du droit chemin dans la distinction des gens de l'Enfer) de Cheikh al-Islam Ibn Taymiyyah, ainsi que le livre <em>« Al-Masâ'il allatî khâlafa fîhâ Rasûlullâh (Sallallâhu 'alayhi wa sallam) Ahla al-Jâhilîyah »</em> (Les questions sur lesquelles le Messager d'Allah a contredit les gens de la Jâhilîyah) de Cheikh Muhammad ibn 'Abd al-Wahhâb, avec son explication par le grand savant irakien Mahmûd Shukrî al-Alûsî (qu'Allah lui fasse miséricorde).</p>
<p>⁕ Quiconque apostasie de la religion de l'Islam, il est alors obligatoire de lui demander de se repentir et de lui accorder un délai de trois jours. S'il se repent (tant mieux), sinon il est exécuté. Ceci, en raison de la parole de 'Umar (qu'Allah l'agrée) lorsqu'il apprit qu'un homme avait mécru après son Islam et qu'il avait eu le cou tranché avant qu'on ne lui demande de se repentir. Il dit alors :</p>
<p class="ar"><span dir="rtl">«فَهَلَّا حَبَسْتُمُوهُ ثَلَاثاً، فَأَطْعَمْتُمُوهُ كُلَّ يَوْمٍ رَغِيفاً، وَاسْتَتَبْتُمُوهُ؛ لَعَلَّهُ يَتُوبُ أَوْ يُرَاجِعُ أَمْرَ اللَّهِ، اللَّهُمَّ إِنِّي لَمْ أَحْضُرْ وَلَمْ أَرْضَ إِذْ بَلَغَنِي»</span></p>
<p><em><strong>"Que ne l'avez-vous enfermé pendant trois jours, en le nourrissant chaque jour d'une miche de pain, tout en l'appelant au repentir ? Peut-être aurait-il regretté ou serait-il revenu à l'ordre d'Allah. Ô Allah ! Je n'étais pas présent et je n'ai pas agréé [cela] lorsque la nouvelle m'est parvenue."</strong></em> Rapporté par Mâlik dans <em>Al-Muwatta</em> <a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a>.</p>
<p>Et parce que l'apostasie ne survient généralement qu'en raison d'une ambiguïté (Shubhah), et celle-ci ne se dissipe pas instantanément ; il est donc obligatoire de patienter pendant une période durant laquelle il pourra mener sa réflexion.</p>
<p>Quant à la preuve de l'obligation de l'exécuter s'il ne se repent pas, c'est la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«مَنْ بَدَّلَ دِينَهُ؛ فَاقْتُلُوهُ»</span></p>
<p><em><strong>"Quiconque change sa religion, tuez-le."</strong></em> Rapporté par Al-Boukhârî et Aboû Dâwoûd <a href="#fn6" class="footnote-ref" id="fnref6" role="doc-noteref"><sup>6</sup></a>.</p>
<p>⁕ Et celui qui se charge de son exécution est le gouverneur (l'Imam) ou son représentant, car il s'agit d'une exécution pour un droit d'Allah ; cela revient donc à l'autorité publique (Waliyy al-Amr).</p>
<p>⁕ Et la sagesse derrière l'obligation d'exécuter l'apostat est la suivante : puisqu'il a connu la vérité puis l'a délaissée, il est devenu un corrupteur sur terre, ne convenant plus à y subsister, car il est un membre corrompu qui nuit à la société et porte atteinte à la religion.</p>
<p>⁕ Le repentir de l'apostat se réalise par sa prononciation des deux attestations de foi (Ach-Chahâdatayn), en raison de la portée générale de la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«أُمِرْتُ أَنْ أُقَاتِلَ النَّاسَ حَتَّى يَقُولُوا: لَا إِلَهَ إِلَّا اللَّهُ، فَإِذَا قَالُوهَا؛ عَصَمُوا مِنِّي دِمَاءَهُمْ وَأَمْوَالَهُمْ إِلَّا بِحَقِّهَا»</span></p>
<p><em><strong>"Il m’a été ordonné de combattre les gens jusqu’à ce qu’ils disent : 'Il n’y a de divinité digne d'adoration qu’Allah'. S’ils le disent, ils préservent de moi leur sang et leurs biens, sauf s'ils en transgressent les droits."</strong></em> <a href="#fn7" class="footnote-ref" id="fnref7" role="doc-noteref"><sup>7</sup></a>. Quant à celui dont l'apostasie est due au reniement d'une chose obligatoirement connue de la religion, son repentir nécessite — en plus de la prononciation des deux attestations — sa reconnaissance explicite de ce qu'il avait renié.</p>
<p>⁕ Il est interdit à l'apostat de disposer de ses biens, car le droit d'autrui s'y trouve rattaché, à l'instar des biens d'une personne en faillite. Ses dettes sont acquittées, et ses besoins ainsi que ceux de sa famille sont pris en charge sur ses biens pendant la durée de cette interdiction. S'il revient à l'Islam, il récupère ses biens et est de nouveau autorisé à en disposer, car l'empêchement a disparu. En revanche, s'il meurt en état d'apostasie ou s'il est exécuté comme tel, ses biens deviennent un butin (<em>Fay'</em>) pour le Trésor public des Musulmans (<em>Bayt Mâl</em>) dès l'instant de sa mort, car il n'a pas d'héritier. Ainsi, aucun Musulman ne l'hérite, car le Musulman n'hérite pas du mécréant, et aucun mécréant ne l'hérite non plus, fût-il adepte de la religion vers laquelle l'apostat s'est tourné, car son apostasie n'est pas reconnue [légalement]. De même, l'apostat n'hérite ni d'un mécréant ni d'un Musulman, en raison de la parole du Prophète <span dir="rtl">ﷺ</span> <a href="#fn8" class="footnote-ref" id="fnref8" role="doc-noteref"><sup>8</sup></a>:</p>
<p class="ar"><span dir="rtl">«لَا يَرِثُ الْمُسْلِمُ الْكَافِرَ وَلَا الْكَافِرُ الْمُسْلِمَ»</span></p>
<p></p>
<p><em><strong>"Le Musulman n'hérite pas du mécréant, et le mécréant n'hérite pas du Musulman."</strong></em> <a href="#fn9" class="footnote-ref" id="fnref9" role="doc-noteref"><sup>9</sup></a>.</p>
<p>⁕ Les savants (qu'Allah leur fasse miséricorde) ont certes divergé au sujet du statut de l'acceptation du repentir de celui qui insulte Allah le Très-Haut ou insulte Son Messager <span dir="rtl">ﷺ</span> :</p>
<p>- Certains d'entre eux ont dit : Son repentir n'est pas accepté concernant les jugements de la vie d'ici-bas, comme le fait d'annuler son exécution, d'hériter ou de léguer un héritage. Il est plutôt exécuté dans tous les cas, en raison de la gravité de son péché, de la corruption de son dogme ('Aqîdah) et de son dénigrement d'Allah le Très-Haut.</p>
<p>- Le deuxième avis : Son repentir est accepté, en raison de la parole de Sa part, le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿قُل لِّلَّذِينَ كَفَرُوا إِن يَنتَهُوا يُغْفَرْ لَهُم مَّا قَدْ سَلَفَ﴾ [الأَنفَال : ٣٨] .</span></p>
<p><strong>﴾ Dis à ceux qui ont mécru que, s'ils cessent, on leur pardonnera ce qui s'est passé le passé ﴿</strong> [Al-Anfâl : 38].</p>
<p>⁕ Et de même, les savants (qu'Allah leur fasse miséricorde) ont divergé concernant l'acceptation du repentir de celui dont l'apostasie se répète :</p>
<p>- Certains d'entre eux ont dit : il n'est pas accepté dans ce bas monde ; il est donc indispensable d'appliquer la sentence de l'apostat à son encontre, même s'il se repent, en raison de la parole du Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿إِنَّ الَّذِينَ آمَنُوا ثُمَّ كَفَرُوا ثُمَّ آمَنُوا ثُمَّ كَفَرُوا ثُمَّ ازْدَادُوا كُفْرًا لَمْ يَكُنِ اللَّهُ لِيَغْفِرَ لَهُمْ وَلَا لِيَهْدِيَهُمْ سَبِيلًا﴾ [النساء : ١٣٧] .</span></p>
<p><strong>﴾ Ceux qui ont cru, puis ont mécru, puis ont cru de nouveau, puis ont mécru, et n'ont fait que croître en mécréance, Allah ne leur pardonnera pas, ni ne les guidera vers un chemin. ﴿</strong> [An-Nisâ' : 137].</p>
<p>- Et il a été dit : son repentir est accepté, en raison de la parole du Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿قُل لِّلَّذِينَ كَفَرُوا إِن يَنتَهُوا يُغْفَرْ لَهُم مَّا قَدْ سَلَفَ﴾ [الأَنفَال : ٣٨] .</span></p>
<p><strong>﴾ Dis à ceux qui ont mécru que, s'ils cessent, on leur pardonnera ce qui s'est passé le passé ﴿</strong> [Al-Anfâl : 38] ; le verset est donc de portée générale, englobant par sa généralité quiconque a répété son apostasie.</p>
<p>⁕ De même, ils [les savants] ont divergé concernant l'acceptation du repentir de l'hérétique (Al-Zindîq), qui est l'hypocrite manifestant l'Islam tout en dissimulant la mécréance :</p>
<p>- Il a été dit : son repentir n'est pas accepté, car ce qu'il manifeste ne permet pas de distinguer clairement son retour à l'Islam, alors qu'Allah le Très-Haut dit :</p>
<p class="ar"><span dir="rtl">﴿إِلَّا الَّذِينَ تَابُوا وَأَصْلَحُوا وَبَيَّنُوا﴾ [البقرة: ١٦٠]</span></p>
<p><strong>﴾ Sauf ceux qui se repentent, se réforment et rendent manifeste [la vérité]. ﴿</strong> [Al-Baqarah : 160]. Ainsi, lorsqu'il manifeste le repentir, il ne fait rien de plus que ce qu'il faisait auparavant, à savoir extérioriser l'Islam et cacher la mécréance.</p>
<p>- Et il a été dit : le repentir de l'hérétique (Al-Zindîq) est accepté, en raison de la parole du Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿إِنَّ الْمُنَافِقِينَ فِي الدَّرْكِ الْأَسْفَلِ مِنَ النَّارِ وَلَنْ تَجِدَ لَهُمْ نَصِيرًا ۝ إِلَّا الَّذِينَ تَابُوا وَأَصْلَحُوا وَاعْتَصَمُوا بِاللَّهِ وَأَخْلَصُوا دِينَهُمْ لِلَّهِ فَأُولَئِكَ مَعَ الْمُؤْمِنِينَ وَسَوْفَ يُؤْتِ اللَّهُ الْمُؤْمِنِينَ أَجْرًا عَظِيمًا﴾ [النساء: ١٤٥-١٤٦]</span></p>
<p><strong>﴾ Les hypocrites seront, certes, au plus profond du Feu, et tu ne leur trouveras jamais de secoureur,</strong> ۝ <strong>sauf ceux qui se repentent, se réforment, s'attachent fermement à Allah et lui vouent un culte exclusif. Ceux-là seront avec les croyants. Et Allah donnera aux croyants une énorme récompense. ﴿</strong> [An-Nisâ' : 145-146], et parce que le Prophète <span dir="rtl">ﷺ</span> s'est abstenu [de châtier] les hypocrites sur la base de l'Islam qu'ils manifestaient.</p>
<p>⁕ Et font partie des hérétiques (<em>Al-Zanâdiqah</em>) : les adeptes de l'incarnationnisme (<em>Al-Houlouliyyah</em>), du libertarisme moral (<em>Al-Ibâhiyyah</em>), quiconque préfère son guide spirituel à Mouhammad <span dir="rtl">ﷺ</span>, quiconque estime que lorsqu'il atteint la connaissance spirituelle (<em>Al-Ma'rifah</em>), les obligations et les interdits s'abolissent pour lui, ou que lorsqu'il atteint la connaissance, il lui est permis de pratiquer la religion des Juifs, des Chrétiens ou de leurs semblables parmi les sectes ayant dévié de l'Islam, à l'instar des soufis extrémistes (<em>Ghoulât as-Soûfiyyah</em>) et d'autres.</p>
<p>⁕ De même, les savants (qu'Allah leur fasse miséricorde) ont divergé concernant la validité de l'Islam de l'enfant doué de discernement (<em>Al-Moumayyiz</em>) et la survenue de l'apostasie de sa part. Il a été dit : l'apostasie est effective de sa part s'il commet l'un des actes qui la provoquent, car quiconque voit son Islam être valide, voit également son apostasie être effective. Or, l'enfant doué de discernement voit son Islam être valide, son apostasie est donc effective. Cependant, il n'est pas exécuté tant qu'on ne lui demande pas de se repentir après avoir atteint la puberté, et qu'on ne lui accorde un délai de trois jours : s'il se repent, son repentir est accepté, et s'il persiste dans son apostasie, il est exécuté.</p>
<p>⁕ <strong>Et ils [les savants] ont certes divergé concernant celui qui délaisse la prière par paresse tout en reconnaissant son obligation.</strong> L'avis authentique (correct) est qu'il mécroit, en raison de la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«بَيْنَ الرَّجُلِ وَبَيْنَ الشِّرْكِ وَالْكُفْرِ تَرْكُ الصَّلَاةِ»</span></p>
<p><em><strong>"Entre l'homme et le polythéisme (Chirk) et la mécréance (Koufr), il y a le délaissement de la prière."</strong></em> <a href="#fn10" class="footnote-ref" id="fnref10" role="doc-noteref"><sup>10</sup></a>, et de sa parole <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«الْعَهْدُ الَّذِي بَيْنَنَا وَبَيْنَهُمُ الصَّلَاةُ، فَمَنْ تَرَكَهَا؛ فَقَدْ كَفَرَ»</span></p>
<p><em><strong>"L'engagement qui nous lie à eux est la prière, quiconque la délaisse a certes mécru."</strong></em> <a href="#fn11" class="footnote-ref" id="fnref11" role="doc-noteref"><sup>11</sup></a>.</p>
<p>Et en raison de la parole du Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿مَا سَلَكَكُمْ فِي سَقَرَ ۝ قَالُوا لَمْ نَكُ مِنَ الْمُصَلِّينَ﴾ [المدثر: ٤٢-٤٣]</span></p>
<p><strong>﴾ Qu'est-ce qui vous a acheminés dans Saqar [l'Enfer] ? Ils diront : "Nous n'étions pas de ceux qui priaient" ﴿</strong> [Al-Mouddatthir : 42-43].</p>
<p>Et le Très-Haut dit :</p>
<p class="ar"><span dir="rtl">﴿فَإِنْ تَابُوا وَأَقَامُوا الصَّلَاةَ وَآتَوُا الزَّكَاةَ فَإِخْوَانُكُمْ فِي الدِّينِ﴾ [التوبة: ١١]</span></p>
<p><strong>﴾ Mais s'ils se repentent, accomplissent la prière et acquittent la Zakât, ils deviennent vos frères en religion. ﴿</strong> [At-Tawbah : 11] ; ce noble verset prouve ainsi que quiconque n'accomplit pas la prière n'est pas notre frère en religion. Et Il n'a pas dit : <em>"et s'ils reconnaissent l'obligation de la prière"</em>, mais Il a bien dit :</p>
<blockquote>
<p class="ar"><span dir="rtl">﴿وَأَقَامُوا الصَّلَاةَ﴾،</span></p>
</blockquote>
<p><strong>« et s'ils accomplissent la prière »</strong>.</p>
<p>Et le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="rtl">«بُنِيَ الْإِسْلَامُ عَلَى خَمْسٍ: شَهَادَةِ أَنْ لَا إِلَهَ إِلَّا اللَّهُ وَأَنَّ مُحَمَّدًا رَسُولُ اللَّهِ، وَإِقَامِ الصَّلَاةِ...»</span></p>
<p>"<em><strong>L'Islam est bâti sur cinq piliers : l'attestation qu'il n'y a de divinité digne d'adoration qu'Allah et que Mouhammad est le Messager d'Allah, l'accomplissement de la prière..."</strong></em><a href="#fn12" class="footnote-ref" id="fnref12" role="doc-noteref"><sup>12</sup></a> jusqu'à la fin du hadith. Et il n'a pas dit : <em>"et la reconnaissance de l'obligation de la prière"</em>, mais il a bien dit : <em><strong>"et l'accomplissement de la prière"</strong></em>.</p>
<p>Et de nos jours, la négligence à l'égard de la prière et la paresse à l'accomplir se sont multipliées, alors que la situation est extrêmement grave. Il est donc obligatoire pour quiconque fait preuve de négligence envers la prière de se repentir auprès d'Allah, et de sauver son âme du Feu ; car la prière est assurément le pilier de l'Islam, et elle préserve des turpitudes et des péchés.</p>
