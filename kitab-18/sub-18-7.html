<p>⁕ Allah, Gloire à Lui, veut pour les musulmans qu'ils se déplacent sur Sa terre en toute sécurité, afin d'échanger leurs intérêts, de faire fructifier leurs biens, de préserver les liens de parenté entre eux, et de s'entraider dans la piété et la dévotion, en particulier lors du voyage vers Sa Maison Antique (la Ka'bah) pour accomplir les rituels du Hajj et de la 'Omrah.</p>
<p>Ainsi, pour quiconque cherche à entraver leur marche, à leur barrer la route ou à leur faire peur durant leurs voyages, [Allah] a légiféré une peine dissuasive qui supprime cet obstacle et écarte le danger du chemin. Le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿إِنَّمَا جَزَاءُ الَّذِينَ يُحَارِبُونَ اللَّهَ وَرَسُولَهُ وَيَسْعَوْنَ فِي الْأَرْضِ فَسَادًا أَنْ يُقَتَّلُوا أَوْ يُصَلَّبُوا أَوْ تُقَطَّعَ أَيْدِيهِمْ وَأَرْجُلُهُمْ مِنْ خِلَافٍ أَوْ يُنْفَوْا مِنَ الْأَرْضِ ذَلِكَ لَهُمْ خِزْيٌ فِي الدُّنْيَا وَلَهُمْ فِي الْآخِرَةِ عَذَابٌ عَظِيمٌ ۝ إِلَّا الَّذِينَ تَابُوا مِنْ قَبْلِ أَنْ تَقْدِرُوا عَلَيْهِمْ فَاعْلَمُوا أَنَّ اللَّهَ غَفُورٌ رَحِيمٌ﴾ [المائدة: 33-34].</span></p>
<p><strong>﴾ La récompense de ceux qui font la guerre contre Allah et Son messager, et qui s’efforcent de semer la corruption sur la terre, c’est qu’ils soient tués, ou crucifiés, ou que soient coupées leur main et leur jambe opposées, ou qu’ils soient expulsés du pays. Ce sera pour eux une ignominie ici-bas ; et dans l’au-delà, il y aura pour eux un énorme châtiment, excepté ceux qui se sont repentis avant que vous ne fussiez maîtres d’eux : sachez alors qu’Allah est Pardonneur et Miséricordieux. ﴿</strong> [Sourate Al-Mā'idah : 33-34].</p>
<p>⁕ Ce que l'on entend par "ceux qui font la guerre et s'efforcent de semer la corruption sur la terre", ce sont les coupeurs de route. Ce sont ceux qui interceptent les gens, que ce soit dans le désert ou en milieu urbain, et s'emparent de leurs biens par la force et de manière flagrante (au grand jour), et non de façon secrète (comme le vol qualifié classique).</p>
<p>⁕ L'application de cette peine à leur encontre est soumise à plusieurs conditions :</p>
<ul>
<li><blockquote>
<p>Que la valeur de ce qu'ils ont dérobé atteigne le quorum (Nisâb) requis pour le vol.</p>
</blockquote></li>
<li><blockquote>
<p>Qu'ils l'aient pris depuis un lieu sécurisé ou préservé (Hirz), par exemple en arrachant le bien des mains de son propriétaire alors qu'il se trouve au sein d'une caravane.</p>
</blockquote></li>
<li><blockquote>
<p>Que leur acte de banditisme soit prouvé, soit par leur propre aveu, soit par le témoignage de deux personnes intègres.</p>
</blockquote></li>
</ul>
<p>⁕ Leur peine varie en fonction de la nature de leurs crimes :</p>
<p>- Quiconque parmi eux a tué et a pris les biens sera obligatoirement mis à mort et crucifié jusqu'à ce que son cas soit rendu public. Il n'est pas permis de lui accorder de grâce, et ce, selon le consensus des savants (Ijmâ'), comme l'a rapporté Ibn Al-Mundhir.</p>
<p>- Et quiconque a tué mais n'a pas pris de biens sera obligatoirement mis à mort, mais il ne sera pas crucifié.</p>
<p>- Et quiconque a pris les biens mais n'a pas tué, on lui coupera la main droite et le pied gauche en une seule fois (lors de la même sentence), puis la plaie sera cautérisée pour stopper l'hémorragie, après quoi il sera relâché.</p>
<p>- Et quiconque a seulement semé la terreur sur le chemin, sans tuer ni prendre de biens, sera banni de la terre. Cela consiste à le traquer de sorte qu'on ne le laisse s'installer dans aucune ville, mais qu'il soit constamment poursuivi.</p>
<p>Leur châtiment varie donc selon la nature de leurs crimes, conformément à la parole du Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿إِنَّمَا جَزَاءُ الَّذِينَ يُحَارِبُونَ اللَّهَ وَرَسُولَهُ وَيَسْعَوْنَ فِي الْأَرْضِ فَسَادًا أَنْ يُقَتَّلُوا أَوْ يُصَلَّبُوا أَوْ تُقَطَّعَ أَيْدِيهِمْ وَأَرْجُلُهُمْ مِنْ خِلَافٍ أَوْ يُنْفَوْا مِنَ الْأَرْضِ﴾ [المائدة: ٣٣]</span></p>
<p><strong>﴾ La récompense de ceux qui font la guerre contre Allah et Son messager, et qui s’efforcent de semer la corruption sur la terre, c’est qu’ils soient tués, ou crucifiés, ou que soient coupées leur main et leur jambe opposées, ou qu’ils soient expulsés du pays. ﴿</strong> [Sourate Al-Mā'idah : 33]. Ce verset a été révélé au sujet des coupeurs de route selon la majorité des Pieux Prédécesseurs (Al-Salaf), et il constitue le fondement juridique (Al-Asl) de leur statut.</p>
<p>Ibn 'Abbâs (qu'Allah l'agrée) a dit :</p>
<p class="ar"><span dir="rtl">«إِذَا قَتَلُوا وَأَخَذُوا الْمَالَ؛ قُتِلُوا وَصُلِبُوا، وَإِذَا قَتَلُوا وَلَمْ يَأْخُذُوا الْمَالَ؛ قُتِلُوا وَلَمْ يُصْلَبُوا، وَإِذَا أَخَذُوا الْمَالَ وَلَمْ يَقْتُلُوا؛ قُطِعَتْ أَيْدِيهِمْ وَأَرْجُلُهُمْ مِنْ خِلَافٍ، وَإِذَا أَخَافُوا السَّبِيلَ وَلَمْ يَأْخُذُوا مَالاً؛ نُفُوا مِنَ الْأَرْضِ»</span></p>
<p><em><strong>« S'ils ont tué et ont pris les biens, ils sont tués et crucifiés. S'ils ont tué mais n'ont pas pris de biens, ils sont tués mais ne sont pas crucifiés. S'ils ont pris les biens sans tuer, on leur coupe la main et le pied opposés. Et s'ils ont seulement semé la terreur sur le chemin sans prendre de biens, ils sont bannis de la terre. »</strong></em> Rapporté par Al-Shâfi'î <a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a>.</p>
<p>⁕ Même si un seul d'entre eux commet le meurtre, la sentence de mort s'applique à eux tous. Et si certains d'entre eux tuent tandis que d'autres s'emparent des biens, ils seront tous mis à mort et crucifiés.</p>
<p>⁕ Et quiconque parmi eux se repent avant que vous ne l'ayez capturé (avant d'être sous votre pouvoir), toutes les peines qui constituaient un droit exclusif d'Allah le Très-Haut tombent (sont annulées) : à savoir le bannissement du pays, l'amputation de la main et du pied, ainsi que la mise à mort obligatoire. Cependant, il reste redevable des droits des êtres humains (les droits lésés) concernant les vies, les membres blessés et les biens dérobés, à moins qu'il n'en soit gracié par les ayants droit. Cela conformément à la parole du Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿إِلَّا الَّذِينَ تَابُوا مِنْ قَبْلِ أَنْ تَقْدِرُوا عَلَيْهِمْ فَاعْلَمُوا أَنَّ اللَّهَ غَفُورٌ رَحِيمٌ﴾ [المائدة: ٣٤].</span></p>
<p><strong>﴾ excepté ceux qui se sont repentis avant que vous ne fussiez maîtres d’eux : sachez alors qu’Allah est Pardonneur et Miséricordieux. ﴿</strong> [Sourate Al-Mā'idah : 34].</p>
<p>Cheikh A-Islam Ibn Taymiyyah (qu'Allah lui fasse miséricorde) a dit <a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a>: <em>« Ils [les savants] se sont accordés à dire que si le brigand (coupeur de route), le voleur ou leurs semblables sont traduits devant le gouverneur (l'autorité publique), puis se repentent après cela, la peine légale (Hadd) n'est pas annulée pour autant. Au contraire, son application reste obligatoire, même s'ils se sont repentis et même s'ils sont sincères dans leur repentir. »</em></p>
<p>L'exception liée au repentir ne s'applique donc que si ce dernier a lieu avant qu'on ne se saisisse d'eux. Quant à celui qui se repent après avoir été capturé, il fait toujours partie de ceux à qui la peine légale doit s'appliquer, et ce, en vertu de la portée générale des textes, de leur sens implicite et de leur explication détaillée. De plus, cela permet d'éviter que le repentir ne devienne un prétexte pour suspendre les peines légales d'Allah. En effet, il serait trop facile pour quiconque mérite une peine de feindre le repentir afin d'échapper au châtiment.</p>
<p>⁕ Quiconque subit l'agression d'une personne voulant le tuer, ou portant atteinte à son honneur et à ses femmes (comme sa mère, sa fille, sa sœur ou son épouse) en voulant les violer, ou s'en prenant à ses biens pour les voler ou les détruire : il a le droit de repousser cette agression. Cela s'applique que l'agresseur soit un être humain ou un animal.</p>
<p>Il doit alors le repousser par le moyen le plus doux qu'il estime suffisant pour y parvenir. Car si on lui interdisait de se défendre, cela mènerait à sa propre perte ou à celle de son honneur et de ses biens. De plus, si cela n'était pas autorisé, les gens se prêteraient mutuellement à l'oppression. Et si l'agresseur ne peut être repoussé que par la mort, la victime a le droit de le tuer, sans qu'aucune compensation (<em>Diyyah</em>) ou responsabilité ne lui incombe, puisqu'elle l'a tué pour repousser son mal.</p>
<p>Si la victime agressée est tuée, elle est alors considérée comme martyre (<em>Chahîd</em>), conformément à la parole du Prophète (sur lui la prière et salut) :</p>
<p class="ar"><span dir="rtl">«مَنْ أُرِيدَ مَالُهُ بِغَيْرِ حَقٍّ، فَقَاتَلَ، فَقُتِلَ؛ فَهُوَ شَهِيدٌ»</span></p>
<p><em><strong>« Quiconque subit une agression visant ses biens de manière injuste, combat et se fait tuer, est un martyr. »</strong></em><a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a></p>
<p>Muslim et d'autres ont également rapporté d'après Abou Hourayrah (qu'Allah l'agrée) qui a dit : <em><strong>Un homme vint et dit : « Ô Messager d'Allah ! Vois-tu, si un homme vient pour s'emparer de mes biens ? » Le Prophète répondit : « Ne les lui donne pas. » L'homme demanda : « Vois-tu s'il me combat ? » Il répondit : « Combats-le. » L'homme demanda : « Vois-tu s'il me tue ? » Il répondit : « Tu seras alors un martyr. » L'homme dit : « Vois-tu si je le tue ? » Le Prophète répondit : « Il sera dans le Feu. »</strong></em><a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a></p>
<p>Et cette défense de sa propre personne et de son honneur devient obligatoire pour lui tant qu’elle ne mène pas à une discorde (<em>Fitnah</em>) [plus grande] ; en raison de la parole du Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿ وَلَا تُلْقُوا بِأَيْدِيكُمْ إِلَى التَّهْلُكَةِ ﴾ [البقرة: ١٩٥]</span></p>
<p><strong>﴾ Et ne vous jetez pas de vos propres mains dans la destruction. ﴿</strong> [Sourate Al-Baqarah : 195].</p>
<p>⁕ De même, il est obligatoire d’intervenir pour défendre la vie et l’honneur d’autrui, conformément à la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«انْصُرْ أَخَاكَ ظَالِماً أَوْ مَظْلُوماً»</span></p>
<p><em><strong>« Secours ton frère, qu’il soit oppresseur ou opprimé. »</strong></em><a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a></p>
<p>Quant au secours à lui apporter s’il est oppresseur, il consiste à l’empêcher de commettre son injustice.</p>
<p>⁕ Si un voleur s'introduit dans la demeure d'une personne, le statut qui lui est appliqué est le même que celui de l'agresseur (<em>As-Sâ'il</em>) : l'occupant doit le repousser en allant du moyen le plus doux vers le plus sévère (graduellement).</p>
<p>⁕ Quiconque regarde à l’intérieur de la maison d’autrui à travers la fente d'une porte, d'une fenêtre ou depuis le haut d’un toit : le propriétaire a le droit de le repousser et de l’en empêcher. Si, ce faisant, il l'atteint à l'œil et le lui crève, cela reste impuni (sans responsabilité financière ni pénale). Il en est de même s’il le pique avec un bâton et lui détruit l’œil : cela est considéré comme nul (<em>Hadar</em>, sans réparation), en raison du hadith :</p>
<p class="ar"><span dir="rtl">«مَنِ اطَّلَعَ فِي بَيْتٍ، فَفَقِئَتْ عَيْنُهُ؛ فَلَا دِيَةَ وَلَا قِصَاصَ»</span></p>
<p><em><strong>« Quiconque regarde furtivement dans une maison et dont on crève l’œil, il n’y a pour lui ni prix du sang (Diyyah) ni loi du talion (Qisâs). »</strong></em><a href="#fn6" class="footnote-ref" id="fnref6" role="doc-noteref"><sup>6</sup></a></p>
<p>Tout cela découle de la sacralité du musulman, ainsi que de la sacralité de ses biens, de son honneur et de sa dignité auprès d'Allah.</p>
<p>C’est cela la justice de l’Islam, sa préservation de la sécurité de la société et la bonne organisation de ses intérêts, afin que les pays prospèrent, que les serviteurs d'Allah vivent en sécurité et que les voies de communication entre les contrées soient sûres, permettant ainsi aux gens d'y voyager des nuits et des jours en toute tranquillité.</p>
<p>Il n’y a de salut pour l’humanité que dans l’application de cette législation sage. Certes, l’ensemble des systèmes terrestres et de leurs puissances matérielles se sont montrés incapables d'apporter aux hommes la moindre sécurité tant espérée sans la mise en pratique de cette Sharî'ah. Et Allah le Très-Grand a dit la vérité :</p>
<p class="ar"><span dir="rtl">﴿أَفَحُكْمَ الْجَاهِلِيَّةِ يَبْغُونَ وَمَنْ أَحْسَنُ مِنَ اللَّهِ حُكْمًا لِّقَوْمٍ يُوقِنُونَ﴾ [المائدة: ٥٠]</span></p>
<p><strong>﴾ Est-ce donc le jugement du temps de l'Ignorance qu'ils cherchent ? Qu'y a-t-il de meilleur qu'Allah, en matière de jugement, pour des gens qui ont une foi ferme ? ﴿</strong> [Sourate Al-Mâ'idah : 50].</p>
