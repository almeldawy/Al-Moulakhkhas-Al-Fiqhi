<p>⁕ Les juristes (qu'Allah leur fasse miséricorde) ont défini la calomnie (<em>Al-Qadhf</em>) comme étant l'accusation de fornication (<em>Zina</em>) ou de sodomie (<em>Liwât</em>). À l'origine, ce terme désigne le fait de jeter (un objet) avec force, puis il a été employé pour désigner l'accusation de fornication et de sodomie.</p>
<p>⁕ Et elle (la calomnie) est interdite par le Livre (le Coran), la Sunnah et le consensus (<em>Al-Ijmâ‘</em>).</p>
<p>⁃ Allah Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿وَالَّذِينَ يَرْمُونَ الْمُحْصَنَاتِ ثُمَّ لَمْ يَأْتُوا بِأَرْبَعَةِ شُهَدَاءَ فَاجْلِدُوهُمْ ثَمَانِينَ جَلْدَةً وَلَا تَقْبَلُوا لَهُمْ شَهَادَةً أَبَدًا وَأُولَئِكَ هُمُ الْفَاسِقُونَ﴾ [النور: ٤]</span></p>
<p><strong>﴾ Et ceux qui lancent des accusations contre des femmes chastes sans produire quatre témoins, fouettez-les de quatre-vingts coups de fouet, et n'acceptez plus jamais leur témoignage. Et ceux-là sont les pervers. ﴿</strong> [Nour : 4].</p>
<p>Ceci est la punition immédiate du calomniateur dans la vie d'ici-bas : la flagellation, le rejet de son témoignage, et le fait d'être considéré comme un pervers, rabaissé et vil, s'il ne prouve pas ce qu'il a avancé.</p>
<p>Quant à son châtiment dans l'au-delà, Allah Très-Haut l'a exposé par Sa parole :</p>
<p class="ar"><span dir="rtl">﴿إِنَّ الَّذِينَ يَرْمُونَ الْمُحْصَنَاتِ الْغَافِلَاتِ الْمُؤْمِنَاتِ لُعِنُوا فِي الدُّنْيَا وَالْآخِرَةِ وَلَهُمْ عَذَابٌ عَظِيمٌ * يَوْمَ تَشْهَدُ عَلَيْهِمْ أَلْسِنَتُهُمْ وَأَيْدِيهِمْ وَأَرْجُلُهُمْ بِمَا كَانُوا يَعْمَلُونَ * يَوْمَئِذٍ يُوَفِّيهِمُ اللَّهُ دِينَهُمُ الْحَقَّ وَيَعْلَمُونَ أَنَّ اللَّهَ هُوَ الْحَقُّ الْمُبِينُ﴾ [النور: ٢٣ - ٢٥]</span></p>
<p><strong>﴾ Ceux qui accusent les femmes chastes, douées de discernement (ou insouciantes) et croyantes, sont maudits ici-bas comme dans l'au-delà ; et ils auront un énorme châtiment. Le jour où leurs langues, leurs mains et leurs pieds témoigneront contre eux de ce qu'ils faisaient. Ce jour-là, Allah leur donnera leur juste rétribution, et ils sauront que c'est Allah qui est la Vérité Éclatante. ﴿</strong> [La Lumière : 23-25].</p>
<p>⁃ Et le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="rtl">«اجْتَنِبُوا السَّبْعَ الْمُوبِقَاتِ»</span></p>
<p><em><strong>« Évitez les sept péchés destructeurs »</strong></em><a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a>, et il a compté parmi eux la calomnie des femmes chastes, croyantes et insouciantes.</p>
<p>⁃ Les musulmans se sont unanimement accordés sur l'interdiction de la calomnie, et ils l'ont comptée parmi les grands péchés (<em>Al-Kabâ'ir</em>).</p>
<p>⁕ Et Allah a rendu obligatoire la peine légale (<em>Al-Hadd</em>) dissuasive contre la calomnie. Ainsi, lorsque la personne responsable (majeure et dotée de sa raison : <em>Al-Mukallaf</em>) et agissant de son plein gré (<em>Al-Mukhtâr</em>) accuse une personne chaste (<em>Muhsan</em>) de fornication (<em>Zina</em>) ou de sodomie (<em>Liwât</em>), elle est alors flagellée de quatre-vingts coups de fouet, conformément à Sa parole (Le Très-Haut) :</p>
<p class="ar"><span dir="rtl">﴿وَالَّذِينَ يَرْمُونَ الْمُحْصَنَاتِ ثُمَّ لَمْ يَأْتُوا بِأَرْبَعَةِ شُهَدَاءَ فَاجْلِدُوهُمْ ثَمَانِينَ جَلْدَةً﴾ [النور: ٤]</span></p>
<p><strong>﴾ Et ceux qui lancent des accusations contre des femmes chastes sans produire quatre témoins, fouettez-les de quatre-vingts coups de fouet ﴿</strong> [La Lumière : 4].</p>
<p>Le sens de ce noble verset est le suivant : <em>ceux qui accusent de fornication des femmes chastes, libres, pures et insouciantes, puis que ces calomniateurs n'apportent pas quatre témoins pour appuyer l'accusation portée contre elles, alors flagellez-les de quatre-vingts coups de fouet</em>.</p>
<p>Et il n'y a aucune différence que la personne calomniée soit un homme ou une femme. Les femmes ont seulement été mentionnées spécifiquement en raison des circonstances du contexte de révélation (<em>Khusoos al-wâqi'ah</em>), et parce que la calomnie des femmes est plus infâme et plus fréquente.</p>
<p>⁕ Le calomniateur n'a mérité cette punition que pour préserver l'honneur des musulmans de toute souillure, pour retenir les langues d'employer ces paroles immondes qui sâlissent l'honneur des innocents, et pour protéger la société islamique contre la propagation de la turpitude en son sein.</p>
<p>⁕ <strong>La personne chaste (<em>Al-Muhsan</em>)</strong> dont la calomnie exige l'application de la peine légale (<em>Al-Hadd</em>) est : <strong>l'homme libre, musulman, doué de raison, chaste, et ayant l'âge d'avoir des rapports intimes</strong>.</p>
<p>Ibn Rushd a dit <a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a> : <em>« Ils (les savants) se sont accordés sur le fait que parmi les conditions de la personne calomniée, cinq caractéristiques doivent être réunies en elle : la puberté, la liberté, la chasteté, l'Islam, et qu'elle possède l'organe permettant l'acte de fornication. Si l'une de ces caractéristiques fait défaut, la peine légale (Al-Hadd) n'est pas obligatoire. »</em></p>
<p>⁕ La peine de la calomnie est un droit appartenant à la personne calomniée ; elle s'annule par son pardon et n'est exécutée que de son propre chef (à sa demande). Ainsi, si la victime pardonne au calomniateur, la peine légale tombe. Cependant, il subit une peine discrétionnaire (Ta'zîr) afin de le dissuader de persister dans cette calomnie interdite, pour laquelle la malédiction et le châtiment douloureux ont été promis.</p>
<p>Cheikh Al-Islâm Ibn Taymiyyah <a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a> — qu'Allah lui fasse miséricorde — a dit : <em>« Le calomniateur n'est pas soumis à la peine légale sans qu'il n'y ait une demande (de la victime), et ce, par consensus. »</em> Fin de citation.</p>
<p>⁕ Quiconque calomnie une personne absente ne subira pas la peine légale tant que la personne calomniée ne se présente pas pour réclamer son droit, ou que sa demande soit formellement établie durant son absence.</p>
<p>⁕ <strong>Et les termes de la calomnie se divisent en deux catégories :</strong></p>
<p>- Des termes explicites (<em>Sarîhah</em>) qui ne portent pas d'autre sens que la calomnie ; on n'accepte pas de l'auteur une explication visant à leur donner une autre signification.</p>
<p>- Et des termes implicites ou par métaphore (<em>Kinâyât</em>) qui peuvent signifier la calomnie ou autre chose. Si l'auteur les explique par un autre sens que la calomnie, cela est accepté de sa part.</p>
<p>Les termes explicites sont, par exemple, le fait de dire : « Ô fornicateur ! », « Ô sodomite ! », « Ô débauché ! ».</p>
<p>Ses termes implicites (ou métaphoriques) sont, par exemple : « Ô traînée ! », « Ô dévergondée ! », « Ô mauvaise ! ». Si le calomniateur dit : « Je voulais dire par <em>Qahbah</em> (traînée) qu'elle feint la débauche », ou s'il dit : « Je voulais dire par <em>Fâjirah</em> (dévergondée) qu'elle désobéit à son mari dans ce qui lui est obligatoirement dû », ou : « Je voulais dire par <em>Khabîthah</em> (mauvaise) qu'elle a un mauvais caractère » ; alors cette explication est acceptée de sa part, et il n'est pas soumis à la peine légale (<em>Al-Hadd</em>). En effet, le terme employé peut contenir ce sens, et les peines légales sont repoussées par les doutes (<em>Shubuhât</em>).</p>
<p>⁕ Et s'il calomnie un groupe de personnes dont on ne peut imaginer la fornication de leur part, ou s'il calomnie les habitants d'une ville entière, il ne subit pas la peine légale (<em>Al-Hadd</em>). Cependant, il subit une peine discrétionnaire (<em>Ta'zîr</em>) pour cela, car son mensonge est une certitude absolue, et aucun déshonneur ne rejaillit sur eux de ce fait. Il est sanctionné par le <em>Ta'zîr</em> uniquement pour réprimer l'usage de ces termes affreux et de ces insultes grossières. C'est en effet un péché pour lequel il doit obligatoirement être réprimandé (ou corrigé), même si aucun d'entre eux ne réclame de poursuites.</p>
<p>⁕ Et quiconque calomnie un prophète parmi les prophètes a certes mécru, car cela constitue une apostasie (<em>Riddah</em>) vis-à-vis de l'Islam.</p>
<p>Cheikh Al-Islâm Ibn Taymiyyah <a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a> — qu'Allah lui fasse miséricorde — a dit : <em>« Et la calomnie des épouses du Prophète <span dir="rtl">ﷺ</span> est semblable à sa propre calomnie ; c'est-à-dire qu'elle équivaut à la calomnie du Prophète <span dir="rtl">ﷺ</span> concernant le statut d'apostasie du calomniateur. »</em></p>
<p>⁕ Et le Cheikh a dit, concernant le calomniateur qui se repent avant que la personne calomniée ne soit au courant, pour savoir si son repentir est valide : <em>« Le plus probable est que cela varie selon les personnes. Et la majorité des savants ont dit : si la personne calomniée est au courant, son repentir n'est pas valide (sans son pardon), sinon, il est valide ; il doit alors invoquer en sa faveur et demander pardon pour elle... »</em>. Fin de citation.</p>
<p>De cela, il nous apparaît clairement le danger de la langue, ainsi que les responsabilités (et sanctions) qui découlent de ses paroles. Le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="rtl">«وَهَلْ يَكُبُّ النَّاسَ فِي النَّارِ عَلَى وُجُوهِهِمْ إِلَّا حَصَائِدُ أَلْسِنَتِهِمْ»</span></p>
<p><em><strong>« Et est-ce que les gens sont jetés face contre terre dans le Feu pour autre chose que les récoltes de leurs langues ? »</strong></em>.<a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a></p>
<p>Et Allah Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿مَا يَلْفِظُ مِنْ قَوْلٍ إِلَّا لَدَيْهِ رَقِيبٌ عَتِيدٌ﴾ [ق: ١٨]</span></p>
<p><strong>﴾ Il ne prononce pas une parole sans qu'il n'y ait auprès de lui un observateur prêt à l'inscrire. ﴿</strong> [Qâf : 18].</p>
<p>Il est donc obligatoire pour l'être humain de préserver sa langue, de peser ses mots et de rectifier ses propos.</p>
<p>Allah Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿يَأَيُّهَا الَّذِينَ ءَامَنُوا اتَّقُوا اللَّهَ وَقُولُوا قَوْلًا سَدِيدًا﴾ [الأحزاب: ٧٠]</span></p>
<p><strong>﴾ Ô vous qui croyez ! Craignez Allah et parlez avec droiture. ﴿</strong> [Al-Ahzâb : 70].</p>
