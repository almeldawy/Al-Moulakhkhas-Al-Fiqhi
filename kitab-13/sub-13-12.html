<p><strong>Chapitre sur l'héritage des sœurs avec les filles et l'héritage des frères utérins</strong></p>
<p>⁕ Lorsque se trouvent une fille ou davantage avec une sœur germaine ou consanguine, ou davantage : la ou les filles présentes, une seule ou davantage, voient leur part prélevée, puis la majorité des savants parmi les Compagnons et les Tâbi'ûn estiment que les sœurs germaines ou consanguines deviennent héritières agnates avec les filles (c'est ce que les spécialistes des parts légales appellent l'agnation par un autre : At-Ta'sîb ma'a al-ghayr) ; elles prennent donc ce qui reste après la part des filles présentes ou des filles du fils, sur la base du hadith rapporté par Al-Bukhârî<a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a> et d'autres : Abû Mûsâ fut interrogé au sujet d'une fille, d'une fille de fils et d'une sœur. Il dit : « À la fille, la moitié, et à la sœur, la moitié. » Puis il dit à l'interrogateur : « Va voir Ibn Mas'ûd, il te suivra. » On interrogea Ibn Mas'ûd, et on l'informa de la parole d'Abû Mûsâ. Il dit : « Je me serais alors égaré, et je ne serais pas parmi les bien-guidés. Je vais en juger selon ce dont le Prophète ﷺ a jugé : à la fille, la moitié ; à la fille du fils, le sixième, pour compléter les deux tiers ; et ce qui reste, à la sœur. » Dans ce hadith se trouve une indication évidente que la sœur avec les filles est une héritière agnate : elle prend ce qui reste après leur part prescrite et la part prescrite de la fille du fils.</p>
<p>⁕ L'unique frère utérin hérite du sixième, qu'il soit de sexe masculin ou féminin. Et lorsqu'ils sont deux ou davantage, ils héritent du tiers, réparti entre eux de manière égale, le mâle comme la femelle, selon la parole d'Allah le Très-Haut :</p>
<p class="ar">﴿وَإِن كَانَ رَجُلٌ يُورَثُ كَلَالَةً أَوِ امْرَأَةٌ وَلَهُ أَخٌ أَوْ أُخْتٌ فَلِكُلِّ وَاحِدٍ مِّنْهُمَا السُّدُسُ فَإِن كَانُوا أَكْثَرَ مِن ذَٰلِكَ فَهُمْ شُرَكَاءُ فِي الثُّلُثِ﴾ [النساء: 12]</p>
<p>« Et si un homme, ou une femme, dont on hérite, n'a ni ascendant ni descendant, mais a un frère ou une sœur, à chacun des deux revient le sixième. Mais s'ils sont plus de deux, ils seront alors associés dans le tiers » [Sourate An-Nisâ' : 12].</p>
<p>Les savants ont été unanimes pour dire que ce qui est visé par les « frères » dans ce noble verset, ce sont les frères utérins ; Ibn Mas'ûd et Sa'd ibn Abî Waqqâs l'ont récité ainsi, et [Sa'd] a dit : « (et il a un frère ou une sœur de mère) ».</p>
<p>Allah le Très-Haut les a mentionnés sans détail ; cela implique donc que la femelle d'entre eux soit traitée à égalité avec le mâle.</p>
<p>L'imam Ibn al-Qayyim<a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a> a dit : « C'est l'analogie correcte et la balance conforme à l'indication du Coran et à la compréhension des grands Compagnons. »</p>
<p>⁕ Pour que le fils de la mère ait droit au sixième, trois conditions sont requises :</p>
<p><strong>La première condition :</strong> l'absence de descendance héritière.</p>
<p><strong>La deuxième condition :</strong> l'absence d'ascendant masculin héritier.</p>
<p><strong>La troisième condition :</strong> qu'il soit seul.</p>
<p>⁕ Pour que les frères utérins aient droit au tiers, trois conditions sont requises :</p>
<p><strong>La première condition :</strong> qu'ils soient deux ou davantage ; deux mâles, ou deux femelles, ou un mâle et une femelle, ou davantage que cela.</p>
<p><strong>La deuxième condition :</strong> l'absence de descendance héritière parmi les enfants et les enfants des fils, même s'ils descendent [très bas].</p>
<p><strong>La troisième condition :</strong> l'absence d'ascendant masculin héritier, à savoir le père et le grand-père paternel qui le précède [en remontant].</p>
<p>⁕ Les frères utérins sont caractérisés par cinq règles :</p>
<p><strong>La première et la deuxième règle :</strong> le mâle d'entre eux n'est pas avantagé par rapport à leur femelle dans l'héritage, qu'ils soient réunis ou seuls, selon la parole d'Allah le Très-Haut dans le cas où il est seul : ﴿وَإِن كَانَ رَجُلٌ يُورَثُ كَلَالَةً أَوِ امْرَأَةٌ وَلَهُ أَخٌ أَوْ أُخْتٌ فَلِكُلِّ وَاحِدٍ مِّنْهُمَا السُّدُسُ﴾ « Et si un homme, ou une femme, dont on hérite, n'a ni ascendant ni descendant, mais a un frère ou une sœur, à chacun des deux revient le sixième », et selon Sa parole, le Très-Haut, dans le cas où ils sont réunis : ﴿فَإِن كَانُوا أَكْثَرَ مِن ذَٰلِكَ فَهُمْ شُرَكَاءُ فِي الثُّلُثِ﴾ « Mais s'ils sont plus de deux, ils seront alors associés dans le tiers ». La Kalâlah (Al-Kalâlah), selon l'avis de la majorité des savants, désigne celui qui n'a ni enfant ni géniteur (Al-Wâlid) ; ils ont donc posé comme condition à leur droit d'hériter l'absence de l'enfant (Al-Walad) et du géniteur (Al-Wâlid) ; or l'enfant englobe le mâle et la femelle, et le géniteur englobe le père et le grand-père. Et dans Sa parole, le Très-Haut : ﴿فَإِن كَانُوا أَكْثَرَ مِن ذَٰلِكَ فَهُمْ شُرَكَاءُ فِي الثُّلُثِ﴾ « Mais s'ils sont plus de deux, ils seront alors associés dans le tiers », il y a une preuve qu'il n'y a pas d'avantage du mâle sur leur femelle : car Allah, Gloire à Lui, les a rendus associés quant au droit à l'héritage, et l'association, lorsqu'elle est énoncée sans restriction, implique l'égalité. La sagesse en cela, et Allah sait mieux, est qu'ils héritent par la seule matrice (Ar-Rahim al-mujarradah) ; or la parenté par laquelle ils héritent est uniquement une parenté de la mère, et ils y sont égaux ; il n'y a donc aucune raison d'avantager leur mâle par rapport à leur femelle, contrairement à la parenté du père.</p>
<p><strong>La troisième règle :</strong> leur mâle se rattache [au défunt] par une femelle et hérite, contrairement aux autres ; car lorsque [quelqu'un d'autre] se rattache par une femelle, il n'hérite pas ; tel le fils de la fille.</p>
<p><strong>La quatrième règle :</strong> ils excluent partiellement (Hajb nuqsân) ceux par lesquels ils se rattachent, c'est-à-dire que la mère par laquelle ils se rattachent est ramenée par eux du tiers au sixième, contrairement aux autres ; car celui par lequel on se rattache exclut celui qui se rattache.</p>
<p><strong>La cinquième règle :</strong> ils héritent avec celui par lequel ils se rattachent ; ils héritent donc avec la mère par laquelle ils se rattachent, alors que les autres n'héritent pas avec celui par lequel ils se rattachent ; tel le fils du fils : il n'hérite pas avec le fils. C'est pourquoi la grand-mère, mère du père, et la mère du grand-père partagent cela avec eux : elle se rattache par son fils et hérite avec lui. La vérification en est que l'intermédiaire n'exclut pas celui qui se rattache par lui, sauf s'il le remplace en prenant sa part ; en revanche, s'il ne prend pas sa part, il ne l'exclut pas, comme cela est le cas pour les frères utérins : ils ne prennent pas la part de la mère en son absence, et la grand-mère, mère du père, et la mère du grand-père ne prennent pas leur part, mais elles n'héritent que par la maternité (Al-Umûmah), en remplacement de la mère. Et Allah sait mieux.</p>
