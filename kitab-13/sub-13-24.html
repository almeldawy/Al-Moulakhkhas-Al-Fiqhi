<p><strong>Chapitre sur l'héritage de la femme répudiée</strong></p>
<p>⁕ Il est connu que le contrat de mariage fait partie de ce qu'Allah a établi comme l'une des causes de l'héritage, puisque Allah, Majestueux soit Son état, dit :</p>
<p class="ar">﴿وَلَكُمْ نِصْفُ مَا تَرَكَ أَزْوَاجُكُمْ إِن لَّمْ يَكُن لَّهُنَّ وَلَدٌ ۚ فَإِن كَانَ لَهُنَّ وَلَدٌ فَلَكُمُ الرُّبُعُ مِمَّا تَرَكْنَ ۚ مِن بَعْدِ وَصِيَّةٍ يُوصِينَ بِهَا أَوْ دَيْنٍ ۚ وَلَهُنَّ الرُّبُعُ مِمَّا تَرَكْتُمْ إِن لَّمْ يَكُن لَّكُمْ وَلَدٌ ۚ فَإِن كَانَ لَكُمْ وَلَدٌ فَلَهُنَّ الثُّمُنُ مِمَّا تَرَكْتُم ۚ مِّن بَعْدِ وَصِيَّةٍ تُوصُونَ بِهَا أَوْ دَيْنٍ﴾ [النساء: 12]</p>
<p>« Et à vous la moitié de ce que laissent vos épouses, si elles n'ont pas d'enfant. Si elles ont un enfant, à vous alors le quart de ce qu'elles laissent, après exécution du legs qu'elles auraient fait ou paiement d'une dette. Et à elles le quart de ce que vous laissez, si vous n'avez pas d'enfant. Si vous avez un enfant, à elles alors le huitième de ce que vous laissez, après exécution du legs que vous auriez fait ou paiement d'une dette. » [Sourate An-Nisâ' : 12].</p>
<p>⁕ Tant que le contrat de mariage demeure, l'héritage demeure, tant qu'il n'y a pas là un empêchement parmi les empêchements à l'héritage.</p>
<p>⁕ Lorsque le contrat de mariage est dissous par la répudiation, d'une dissolution complète — c'est ce qu'on appelle la répudiation irrévocable (at-talâq al-bâ'in) —, l'héritage cesse, car lorsque la cause disparaît, ce qui en découle disparaît ; toutefois, il peut y avoir autour de la répudiation des circonstances qui font qu'elle n'empêche pas l'héritage. De même, si le contrat de mariage n'a pas été dissous complètement par la répudiation, le droit d'hériter entre les deux conjoints ne cesse pas, tant que la femme est dans le délai de viduité ('iddah), et c'est ce qu'on appelle la répudiation révocable (at-talâq ar-raj'î). C'est pourquoi les juristes consacrent un chapitre qu'ils appellent « Chapitre sur l'héritage de la femme répudiée ».</p>
<p>⁕ Les femmes répudiées sont, de manière générale, de trois types :</p>
<p><strong>Le premier type :</strong> la femme répudiée de manière révocable, que sa répudiation ait eu lieu alors que celui qui l'a répudiée était en bonne santé ou malade.</p>
<p><strong>Le deuxième :</strong> la femme répudiée de manière irrévocable, dont la répudiation a eu lieu alors que celui qui l'a répudiée était en bonne santé.</p>
<p><strong>Le troisième :</strong> la femme répudiée de manière irrévocable, dont la répudiation a eu lieu durant la maladie mortelle de celui qui l'a répudiée.</p>
<p>⁕ La femme répudiée de manière révocable hérite, par consensus (Ijmâ'), si celui qui l'a répudiée meurt alors qu'elle est dans le délai de viduité ('iddah), car elle est une épouse qui a ce qu'ont les épouses tant qu'elle est dans le délai de viduité.</p>
<p>⁕ La femme répudiée de manière irrévocable alors que le mari est en bonne santé n'hérite pas, par consensus (Ijmâ'), en raison de la rupture du lien conjugal, sans qu'aucun soupçon ne touche le mari à ce sujet ; de même si cette répudiation a eu lieu durant la maladie du mari, une maladie non redoutable.</p>
<p>⁕ La femme répudiée de manière irrévocable durant la maladie du mari, une maladie redoutable, alors qu'il n'est pas soupçonné d'avoir voulu la priver de l'héritage, n'hérite pas non plus.</p>
<p>⁕ La femme répudiée de manière irrévocable durant la maladie mortelle redoutable, lorsque le mari est soupçonné d'avoir voulu priver l'épouse de l'héritage, hérite durant le délai de viduité ('iddah) et après celui-ci, tant qu'elle ne s'est pas remariée ou n'a pas apostasié.</p>
<p>⁕ La preuve de l'héritage de la femme répudiée d'une répudiation irrévocable dont le mari est soupçonné est que 'Uthmân (qu'Allah l'agrée) a jugé que l'épouse de 'Abd ar-Rahmân ibn 'Awf (qu'Allah l'agrée) héritait, alors qu'il l'avait répudiée de manière définitive durant sa maladie mortelle ; ce jugement s'est fait connaître parmi les Compagnons et n'a pas été désapprouvé, avec en outre la règle de la fermeture des voies menant au mal (sadd adh-dharâ'i'), car ce mari a eu une intention corrompue en matière d'héritage, il a donc été traité à l'opposé de son intention ; et ce sens ne se limite pas à la durée du délai de viduité ('iddah), de sorte que l'héritage serait restreint à la durée du délai de viduité. Et Allah sait mieux.</p>
<p>⁕ Les deux conjoints héritent l'un de l'autre par le contrat de mariage si l'un d'eux meurt avant la consommation et l'isolement (al-khalwah), en raison du caractère général du noble verset, qui est la parole d'Allah le Très-Haut : ﴿وَلَكُمْ نِصْفُ مَا تَرَكَ أَزْوَاجُكُمْ ...﴾ jusqu'à Sa parole : ﴿وَلَهُنَّ الرُّبُعُ مِمَّا تَرَكْتُمْ ...﴾ le verset ; car le lien conjugal est un lien solide et noble, auquel se rattachent des règles et sur lequel reposent de grands intérêts ; Allah a ainsi donné à chacun des deux une part des biens de l'autre lorsqu'il meurt, comme Il l'a fait pour ses proches parents. Cela fait partie de ce qui renforce, pour les deux conjoints, l'obligation de regarder chacun l'autre avec un regard de respect et de considération.</p>
<p>Et ces règles font partie des règles de l'Islam, toutes sont bien et bénédiction ; nous demandons à Allah ﷻ de nous raffermir sur elle et de nous faire mourir sur elle.</p>
