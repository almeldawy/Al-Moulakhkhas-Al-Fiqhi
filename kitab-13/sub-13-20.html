<p><strong>Chapitre sur l'héritage du disparu (Al-Mafqûd)</strong></p>
<p>⁕ Le disparu (Al-Mafqûd), sur le plan de la langue, est un nom du patient (ism maf'ûl) dérivé de « faqada ach-chay' » : lorsque la chose est introuvable. Le « faqd » (la disparition) consiste à chercher la chose sans la trouver. Ce que l'on entend ici par « disparu » est celui dont on n'a plus de nouvelles et dont la situation est ignorée, de sorte que l'on ne sait pas s'il est vivant ou mort, que la cause en soit son voyage, sa présence à un combat, le naufrage de son navire, sa capture entre les mains des gens de guerre, ou autre chose encore.</p>
<p>⁕ Or, comme la situation du disparu, au moment de sa disparition, était incertaine et hésitante entre l'existence et l'inexistence, et que chacune de ces deux situations a des règles qui lui sont propres : des règles concernant son épouse, des règles concernant son héritage de la part d'autrui et l'héritage d'autrui de sa part, ainsi que l'héritage d'autres personnes en même temps que lui, et comme l'une des deux éventualités ne l'emportait pas sur l'autre, il fallait nécessairement fixer un délai dans lequel sa situation réelle puisse être confirmée, qui soit une occasion de rechercher de ses nouvelles, et dont l'écoulement sans que l'on ait appris quoi que ce soit à son sujet constitue une preuve de son inexistence.</p>
<p>⁕ Sur cette base, les savants se sont accordés sur la fixation de ce délai, mais ils ont divergé sur sa durée en deux avis :</p>
<p><strong>Le premier avis :</strong> La détermination de la durée est laissée à l'effort de réflexion (ijtihâd) du juge, car le principe est que le disparu est en vie, et l'on ne sort de ce principe que par une certitude ou par ce qui en tient lieu. C'est l'avis de la majorité des savants. Il en est ainsi, que la sauvegarde ou la perte soit l'éventualité la plus probable à son sujet, et qu'il ait disparu avant ses quatre-vingt-dix ans ou après. On attend donc jusqu'à ce qu'une preuve établisse sa mort, ou jusqu'à ce que s'écoule une durée telle qu'il soit fortement présumé qu'il ne vit pas au-delà.</p>
<p><strong>Le second avis :</strong> La distinction. Cela, parce que le disparu connaît deux situations :</p>
<p><strong>La première :</strong> que l'éventualité dominante à son sujet soit la perte, comme celui qui disparaît dans un lieu de perdition, ou entre deux rangs de combattants, ou à partir d'un navire qui a sombré, de sorte que certains de ses gens ont été sauvés et que d'autres ont péri, ou encore celui qui disparaît au milieu des siens, comme celui qui sort pour une prière ou une chose semblable, et ne revient pas. On attend alors quatre ans depuis sa disparition, car c'est une durée dans laquelle les voyageurs et les commerçants vont et viennent à plusieurs reprises ; l'interruption de ses nouvelles jusqu'à cette durée fait donc fortement présumer qu'il n'est pas vivant.</p>
<p><strong>La seconde :</strong> que l'éventualité dominante à son sujet soit la sauvegarde, comme celui qui a voyagé pour le commerce, le tourisme ou la recherche de la science, et dont les nouvelles se sont tues. On attend alors l'accomplissement de quatre-vingt-dix ans depuis sa naissance, car l'éventualité dominante est qu'il ne vit pas plus longtemps que cela.</p>
<p>L'avis le plus juste est le premier, à savoir que la détermination de la durée d'attente du disparu est laissée à l'effort de réflexion du juge, car cela diffère selon les époques, les pays et les personnes, puisqu'à notre époque les moyens d'information et de communication sont disponibles, au point que le monde entier est devenu comme un seul pays, ce qui diffère grandement de la situation des temps passés.</p>
<p>⁕ Si le défunt dont héritait le disparu meurt pendant la durée d'attente mentionnée :</p>
<ul>
<li>S'il n'a pas d'héritier autre que le disparu, tout son bien est mis en suspens jusqu'à ce que la situation devienne claire, ou que la durée s'écoule.</li>
<li>S'il a des héritiers autres que le disparu, les savants ont divergé sur la manière de les traiter, selon plusieurs avis, dont le plus juste est l'avis de la plupart des savants : on traite les héritiers qui sont avec le disparu de la façon la plus défavorable pour eux : chacun reçoit la part dont il hérite avec certitude, et le reste est mis en suspens. Cela, en partageant le cas une première fois en considérant le disparu comme vivant, puis une seconde fois en le considérant comme mort. Celui qui hérite dans les deux cas avec des parts inégales reçoit la moindre ; celui qui hérite dans les deux cas à parts égales reçoit sa part entière ; et celui qui n'hérite que dans l'un des deux cas seulement ne reçoit rien. Le reste est mis en suspens jusqu'à ce que la situation du disparu soit éclaircie.</li>
</ul>
<p>⁕ Tout cela concerne l'héritage du disparu de la part d'autrui. Quant à l'héritage d'autrui de sa part, lorsque la durée d'attente s'est écoulée sans que sa situation soit éclaircie, on prononce sa mort, et son bien propre est partagé, ainsi que ce qui a été mis en suspens pour lui du bien de ceux dont il héritait, entre ses héritiers présents au moment où l'on prononce sa mort, à l'exclusion de ceux qui sont morts pendant la durée d'attente ; car le jugement de sa mort est intervenu après le décès de celui qui est mort pendant la durée d'attente, et l'une des conditions de l'héritage est la vie de l'héritier après la mort du défunt.</p>
