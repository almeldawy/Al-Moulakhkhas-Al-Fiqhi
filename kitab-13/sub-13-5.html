<p><strong>Chapitre sur les causes de l'héritage et l'exposé des héritiers</strong></p>
<p>⁕ L'héritage est le transfert des biens du défunt à une personne vivante après lui, selon ce qu'Allah a légiféré.</p>
<p>⁕ Il a trois causes :</p>
<p><strong>La première :</strong> la parenté (ar-rahim), c'est-à-dire la proximité (al-qarâbah), et ce sont les liens du sang (qarâbat an-nasab). Allah le Très-Haut a dit :</p>
<p class="ar">﴿وَأُولُو الْأَرْحَامِ بَعْضُهُمْ أَوْلَىٰ بِبَعْضٍ فِي كِتَابِ اللَّهِ﴾ [الأنفال: 75]</p>
<p>« Ceux qui sont unis par les liens du sang ont priorité les uns sur les autres, dans le Livre d'Allah » [Sourate Al-Anfâl : 75],</p>
<p>que la parenté soit proche du défunt ou éloignée, s'il n'y a personne en deçà d'elle qui l'exclue.</p>
<p>Elle comprend les ascendants, les descendants et les collatéraux : les ascendants sont les pères et les grands-pères, même s'ils remontent, par des mâles purs ; les descendants sont les enfants et les fils des fils, même s'ils descendent ; et les collatéraux sont les frères et leurs fils, même s'ils descendent, ainsi que les oncles paternels, même s'ils remontent, et leurs fils, même s'ils descendent.</p>
<p><strong>Et la deuxième :</strong> le mariage (an-nikâh), qui est le contrat de mariage valide, même s'il n'a pas été suivi de rapport conjugal ni de tête-à-tête (khalwah), en raison de la généralité de Sa parole le Très-Haut :</p>
<p class="ar">﴿وَلَكُمْ نِصْفُ مَا تَرَكَ أَزْوَاجُكُمْ ...﴾ [النساء: 12]</p>
<p>« À vous revient la moitié de ce que laissent vos épouses... » [Sourate An-Nisâ' : 12]</p>
<p>jusqu'à Sa parole :</p>
<p class="ar">﴿وَلَهُنَّ الرُّبُعُ مِمَّا تَرَكْتُمْ﴾ [النساء: 12]</p>
<p>« Et à elles revient le quart de ce que vous laissez » [Sourate An-Nisâ' : 12].</p>
<p>Les deux époux héritent l'un de l'autre par le contrat de mariage, des deux côtés ; chacun d'eux hérite donc de l'autre, en raison du noble verset. Les deux époux héritent également l'un de l'autre par son moyen pendant le délai de viduité (idda) d'une répudiation révocable, car la femme répudiée de façon révocable reste une épouse. Et leur expression « le contrat de mariage valide » exclut le contrat non valide : on n'hérite donc pas par un mariage vicié, car son existence équivaut à son inexistence.</p>
<p><strong>Et la troisième :</strong> le Walâ' de l'affranchissement : c'est une succession par agnation (Ta'sîb), dont la cause est le bienfait de l'affranchisseur envers son esclave en l'affranchissant. On hérite par son moyen d'un seul côté uniquement : l'affranchisseur hérite de son affranchi, et non l'inverse. Après lui, l'affranchisseur est remplacé par ses agnats par eux-mêmes (bi-n-nafs), et non par les agnats par autrui (bi-l-ghayr) ni par les agnats avec autrui (ma'a l-ghayr).</p>
<p>La preuve de la transmission de l'héritage par le Walâ' est la parole du Prophète ﷺ :</p>
<p class="ar">«الْوَلَاءُ لُحْمَةٌ كَلُحْمَةِ النَّسَبِ»</p>
<p>« Le Walâ' est un lien comme le lien de parenté. » Rapporté par Ibn Hibbân dans son « Sahîh », par Al-Hâkim, qui l'a jugé authentique.<a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a> Le Walâ' a donc été assimilé à la parenté, et on hérite par la parenté ; il en va de même par le Walâ'. Et cela se fait par consensus (Ijmâ'). Et dans les deux « Sahîh », le Prophète ﷺ a dit :</p>
<p class="ar">«إِنَّمَا الْوَلَاءُ لِمَنْ أَعْتَقَ»</p>
<p>« Le Walâ' revient seulement à celui qui a affranchi. »<a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a></p>
<p><strong>Les catégories d'héritiers selon le sexe</strong></p>
<p>⁕ Les héritiers se divisent, selon le sexe, en mâles et femelles.</p>
<p>⁕ Les héritiers parmi les mâles sont au nombre de dix :</p>
<ul>
<li>Le fils et son fils, même s'il descend, par des mâles purs ; en raison de Sa parole le Très-Haut :</li>
</ul>
<p class="ar">﴿يُوصِيكُمُ اللَّهُ فِي أَوْلَادِكُمْ ۖ لِلذَّكَرِ مِثْلُ حَظِّ الْأُنثَيَيْنِ﴾ [النساء: 11]</p>
<p>« Allah vous recommande, au sujet de vos enfants : au garçon, la part de deux filles » [Sourate An-Nisâ' : 11]. Le fils du fils est compté comme un fils, en raison de Sa parole le Très-Haut :</p>
<p class="ar">﴿يَا بَنِي آدَمَ﴾ [الأعراف: 26]، ﴿يَا بَنِي إِسْرَائِيلَ﴾ [البقرة: 40]</p>
<p>« Ô fils d'Adam » [Sourate Al-A'râf : 26], « Ô fils d'Israël » [Sourate Al-Baqarah : 40].</p>
<ul>
<li>Le père et son père, même s'il remonte, par des mâles purs ; comme le père du père et le père du grand-père ; en raison de Sa parole le Très-Haut :</li>
</ul>
<p class="ar">﴿وَلِأَبَوَيْهِ لِكُلِّ وَاحِدٍ مِنْهُمَا السُّدُسُ﴾ [النساء: 11]</p>
<p>« Et pour ses père et mère, à chacun d'eux le sixième » [Sourate An-Nisâ' : 11] ; le grand-père est un père, et le Prophète ﷺ lui a donné le sixième.</p>
<ul>
<li>Et le frère, de façon absolue, qu'il soit germain, de même père ou de même mère ; en raison de Sa parole le Très-Haut :</li>
</ul>
<p class="ar">﴿يَسْتَفْتُونَكَ قُلِ اللَّهُ يُفْتِيكُمْ فِي الْكَلَالَةِ ۚ إِنِ امْرُؤٌ هَلَكَ لَيْسَ لَهُ وَلَدٌ وَلَهُ أُخْتٌ فَلَهَا نِصْفُ مَا تَرَكَ ۚ وَهُوَ يَرِثُهَا إِنْ لَمْ يَكُنْ لَهَا وَلَدٌ ...﴾ الآية [النساء: 176]</p>
<p>« Ils te demandent de rendre une sentence. Dis : "Allah vous donne Sa sentence au sujet de la Kalâlah. Si un homme périt sans enfant, et qu'il ait une sœur, à celle-ci la moitié de ce qu'il laisse ; et lui, il hérite d'elle si elle n'a pas d'enfant..." » le verset [Sourate An-Nisâ' : 176] ;</p>
<p>celui-ci concerne les frères autres que ceux de mère. Et au sujet des frères de mère, Il a dit :</p>
<p class="ar">﴿وَإِنْ كَانَ رَجُلٌ يُورَثُ كَلَالَةً أَوِ امْرَأَةٌ وَلَهُ أَخٌ أَوْ أُخْتٌ فَلِكُلِّ وَاحِدٍ مِنْهُمَا السُّدُسُ﴾ [النساء: 12]</p>
<p>« Si un homme dont on hérite, ou une femme, n'a ni ascendant ni descendant, et qu'il ait un frère ou une sœur, à chacun d'eux le sixième » [Sourate An-Nisâ' : 12].</p>
<ul>
<li><p>Et le fils du frère, autre que de mère ; quant au fils du frère de mère, il n'hérite pas, car il fait partie des proches parents non héritiers (Dhawû al-Arhâm).</p></li>
<li><p>Et l'oncle paternel, autre que de mère, et son fils, même s'il descend, par des mâles purs ; en raison de sa parole ﷺ :</p></li>
</ul>
<p class="ar">«أَلْحِقُوا الْفَرَائِضَ بِأَهْلِهَا؛ فَمَا بَقِيَ؛ فَلِأَوْلَى رَجُلٍ ذَكَرٍ»</p>
<p>« Attribuez les parts légales à leurs ayants droit ; ce qui reste revient à l'homme mâle le plus proche. »<a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a></p>
<ul>
<li>Et l'époux ; en raison de Sa parole le Très-Haut :</li>
</ul>
<p class="ar">﴿وَلَكُمْ نِصْفُ مَا تَرَكَ أَزْوَاجُكُمْ﴾ [النساء: 12]</p>
<p>« À vous revient la moitié de ce que laissent vos épouses » [Sourate An-Nisâ' : 12].</p>
<ul>
<li>Et le dixième, celui qui a le Walâ', et c'est l'affranchisseur ou celui qui prend sa place ; en raison de sa parole ﷺ :</li>
</ul>
<p class="ar">«الْوَلَاءُ لُحْمَةٌ كَلُحْمَةِ النَّسَبِ»</p>
<p>« Le Walâ' est un lien comme le lien de parenté »<a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a>, et de sa parole ﷺ :</p>
<p class="ar">«وَإِنَّمَا الْوَلَاءُ لِمَنْ أَعْتَقَ»</p>
<p>« Le Walâ' revient seulement à celui qui a affranchi. »<a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a></p>
<p>⁕ Les héritières parmi les femmes sont au nombre de sept :</p>
<ul>
<li>La fille et la fille du fils, même si son père descend, par des mâles purs ; en raison de Sa parole le Très-Haut :</li>
</ul>
<p class="ar">﴿يُوصِيكُمُ اللَّهُ فِي أَوْلَادِكُمْ ۖ لِلذَّكَرِ مِثْلُ حَظِّ الْأُنثَيَيْنِ ۚ فَإِنْ كُنَّ نِسَاءً فَوْقَ اثْنَتَيْنِ فَلَهُنَّ ثُلُثَا مَا تَرَكَ ۖ وَإِنْ كَانَتْ وَاحِدَةً فَلَهَا النِّصْفُ﴾ [النساء: 11]</p>
<p>« Allah vous recommande, au sujet de vos enfants : au garçon, la part de deux filles. S'il n'y a que des filles, plus de deux, à elles les deux tiers de ce qu'il laisse ; s'il n'y en a qu'une, à elle la moitié » [Sourate An-Nisâ' : 11].</p>
<ul>
<li>Et la mère et la grand-mère ; en raison de Sa parole le Très-Haut :</li>
</ul>
<p class="ar">﴿فَإِنْ لَمْ يَكُنْ لَهُ وَلَدٌ وَوَرِثَهُ أَبَوَاهُ فَلِأُمِّهِ الثُّلُثُ ۚ فَإِنْ كَانَ لَهُ إِخْوَةٌ فَلِأُمِّهِ السُّدُسُ﴾ [النساء: 11]</p>
<p>« S'il n'a pas d'enfant et que ses père et mère héritent de lui, à sa mère le tiers ; s'il a des frères, à sa mère le sixième » [Sourate An-Nisâ' : 11], et d'après Buraydah, de façon rapportée au Prophète (marfû') :</p>
<p class="ar">«لِلْجَدَّةِ السُّدُسُ إِذَا لَمْ يَكُنْ دُونَهَا أُمٌّ»</p>
<p>« À la grand-mère revient le sixième, s'il n'y a pas de mère en deçà d'elle. » Rapporté par Abû Dâwûd.<a href="#fn6" class="footnote-ref" id="fnref6" role="doc-noteref"><sup>6</sup></a></p>
<ul>
<li>Et la sœur, de façon absolue, germaine, de même père ou de même mère ; en raison de Sa parole le Très-Haut :</li>
</ul>
<p class="ar">﴿وَإِنْ كَانَ رَجُلٌ يُورَثُ كَلَالَةً أَوِ امْرَأَةٌ وَلَهُ أَخٌ أَوْ أُخْتٌ فَلِكُلِّ وَاحِدٍ مِنْهُمَا السُّدُسُ﴾ [النساء: 12]</p>
<p>« Si un homme dont on hérite, ou une femme, n'a ni ascendant ni descendant, et qu'il ait un frère ou une sœur, à chacun d'eux le sixième » [Sourate An-Nisâ' : 12],</p>
<p>et en raison de Sa parole le Très-Haut :</p>
<p class="ar">﴿إِنِ امْرُؤٌ هَلَكَ لَيْسَ لَهُ وَلَدٌ وَلَهُ أُخْتٌ فَلَهَا نِصْفُ مَا تَرَكَ ۚ ...﴾</p>
<p>« Si un homme périt sans enfant, et qu'il ait une sœur, à celle-ci la moitié de ce qu'il laisse... »</p>
<p>jusqu'à Sa parole :</p>
<p class="ar">﴿فَإِنْ كَانَتَا اثْنَتَيْنِ فَلَهُمَا الثُّلُثَانِ مِمَّا تَرَكَ﴾ [النساء: 176]</p>
<p>« S'il y a deux sœurs, à elles deux les deux tiers de ce qu'il laisse » [Sourate An-Nisâ' : 176].</p>
<ul>
<li>Et l'épouse ; en raison de Sa parole le Très-Haut :</li>
</ul>
<p class="ar">﴿وَلَهُنَّ الرُّبُعُ مِمَّا تَرَكْتُمْ ...﴾ الآية [النساء: 12]</p>
<p>« Et à elles revient le quart de ce que vous laissez... » le verset [Sourate An-Nisâ' : 12].</p>
<ul>
<li>Et l'affranchisseuse (al-mu'tiqah) ; en raison de sa parole ﷺ :</li>
</ul>
<p class="ar">«إِنَّمَا الْوَلَاءُ لِمَنْ أَعْتَقَ»</p>
<p>« Le Walâ' revient seulement à celui qui a affranchi. »<a href="#fn7" class="footnote-ref" id="fnref7" role="doc-noteref"><sup>7</sup></a></p>
<p>Voilà l'ensemble des héritiers, mâles et femelles.</p>
<p>Et lorsqu'on les détaille, le nombre des hommes atteint quinze et celui des femmes atteint dix ; cela se connaît par la réflexion et le recours aux sources. Et Allah le Très-Haut est plus savant.</p>
<p><strong>Les types d'héritiers selon l'héritage</strong></p>
<p>⁕ Les héritiers, selon l'héritage, sont de trois types : un type qui hérite par part prescrite (al-fard), un type qui hérite par agnation (at-ta'sîb), et un type qui hérite en tant que proche parent non héritier (Dhawû al-Arhâm).</p>
<ul>
<li><p>L'héritier à part prescrite (Sâhib al-Fard) est celui qui prend une part déterminée légalement, qui n'augmente que par la redistribution du reliquat (Radd) et ne diminue que par la réduction proportionnelle des parts ('Awl).</p></li>
<li><p>Les héritiers agnats ('Asabah) sont ceux qui héritent sans part déterminée.</p></li>
<li><p>Et les Dhawû al-Arhâm sont ceux qui héritent en l'absence des héritiers à part prescrite autres que les deux époux, et en l'absence des agnats.</p></li>
<li><p>Les héritiers à part prescrite (Dhawû al-Furûd) sont de dix catégories : les deux époux, les deux parents, le grand-père, les filles, les filles du fils, les sœurs de toute origine, et les frères de mère, mâles et femelles.</p></li>
</ul>
<p>Et nous parlerons de chacune de ces catégories de manière quelque peu détaillée.</p>
