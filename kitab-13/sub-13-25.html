<p><strong>Chapitre sur l'héritage entre personnes de religions différentes</strong></p>
<p>⁕ La différence de religion consiste en ce que le défunt soit d'une religion (milla) et l'héritier d'une autre religion.</p>
<p>⁕ Sous cela se trouvent deux questions :</p>
<p><strong>La première question : l'héritage du mécréant venant du musulman et l'héritage du musulman venant du mécréant :</strong></p>
<p>Les savants ont divergé sur cette question selon quatre avis :</p>
<p><strong>Le premier avis :</strong> il n'y a pas d'héritage mutuel entre un musulman et un mécréant, de manière absolue, et c'est l'avis de la plupart des gens de science, en raison de la parole du Prophète ﷺ :</p>
<p class="ar">«لا يَرِثُ المُسلِمُ الكافِرَ، ولا الكافِرُ المُسلِمَ»</p>
<p>« Le musulman n'hérite pas du mécréant, ni le mécréant du musulman. » Sur lequel il y a accord (Muttafaq 'alayh).<a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a></p>
<p><strong>Le deuxième avis :</strong> il n'y a pas d'héritage mutuel entre un musulman et un mécréant, sauf par le lien d'affranchissement (Walâ'), en raison du hadith :</p>
<p class="ar">«لا يَرِثُ المُسلِمُ النَّصرانيَّ؛ إلا أن يكونَ عبدَهُ أو أَمَتَهُ»</p>
<p>« Le musulman n'hérite pas du chrétien, sauf s'il est son esclave ou sa servante. » Rapporté par Ad-Dâraqutnî.<a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a> Cela indique l'héritage du musulman de son esclave affranchi chrétien, et on raisonne par analogie sur lui pour l'inverse, c'est-à-dire l'héritage du chrétien, par exemple, de son esclave affranchi musulman.</p>
<p><strong>Le troisième avis :</strong> le mécréant hérite de son proche musulman s'il se convertit à l'Islam avant le partage de la succession, en raison du hadith :</p>
<p class="ar">«كلُّ قَسْمٍ قُسِمَ في الجاهليةِ؛ فهو على ما قُسِمَ، وكلُّ قَسْمٍ أدرَكَهُ الإسلامُ؛ فإنه على ما قَسَمَ الإسلامُ»</p>
<p>« Tout partage effectué à l'époque préislamique reste tel qu'il a été effectué, et tout partage que l'Islam a atteint se fait selon ce qu'a établi l'Islam. »<a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a> Le hadith indique que si un mécréant se convertit avant le partage de l'héritage de son défunt musulman, il hérite.</p>
<p><strong>Le quatrième avis :</strong> le musulman hérite du mécréant, et non l'inverse, en raison du hadith :</p>
<p class="ar">«الإسلامُ يَزيدُ ولا يَنقُصُ»</p>
<p>« L'Islam augmente et ne diminue pas. »<a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a> Le fait de faire hériter le musulman du mécréant est un gain, et le fait de ne pas le faire hériter de lui est une diminution ; et le hadith indique que l'Islam apporte le gain et n'apporte pas la diminution.</p>
<p>Et l'avis le plus juste — et Allah sait mieux — est le premier avis, à savoir qu'il n'y a pas d'héritage mutuel entre le musulman et le mécréant, en raison de l'authenticité de sa preuve et de son caractère explicite, contrairement au reste des avis, car leurs preuves sont soit non authentiques, soit non explicites ; elles ne s'opposent donc pas à la preuve du premier avis.</p>
<p><strong>La deuxième question : l'héritage mutuel des mécréants entre eux :</strong></p>
<p>Les mécréants ont deux situations :</p>
<p><strong>La première situation :</strong> qu'ils soient d'une même religion, comme le Juif avec le Juif, et le chrétien avec le chrétien ; dans cette situation, il n'y a pas de divergence sur l'héritage des uns des autres.</p>
<p><strong>La deuxième situation :</strong> que leurs religions soient différentes, comme les Juifs avec les chrétiens, ou les mazdéens (Al-Majûs), ou les idolâtres ; dans cette situation, les savants ont divergé sur la règle de leur héritage mutuel, et le fondement de la divergence est de savoir si la mécréance est une seule religion (milla) ou plusieurs religions.</p>
<p>Ils ont divergé à ce sujet selon trois avis :</p>
<p><strong>Le premier avis :</strong> la mécréance est une seule religion, et c'est l'avis des hanafites et des chaféites, à condition que le lieu de résidence soit le même, ainsi qu'une version rapportée dans l'école hanbalite, et c'est l'avis de la majorité des savants (Jumhûr) : la mécréance, sous toutes ses formes et malgré la diversité de ses doctrines, est une seule religion ; les mécréants héritent donc les uns des autres, sans considération de la différence de leurs religions, en raison du caractère général des textes concernant l'héritage mutuel entre pères et enfants ; on ne restreint donc rien de leur généralité, sauf ce que le Législateur a excepté, en raison de la parole d'Allah le Très-Haut :</p>
<p class="ar">﴿وَالَّذِينَ كَفَرُوا بَعْضُهُمْ أَوْلِيَاءُ بَعْضٍ﴾ [الأنفال: 73]</p>
<p>« Et ceux qui ont mécru sont alliés les uns des autres. » [Sourate Al-Anfâl : 73].</p>
<p><strong>Le deuxième avis :</strong> la mécréance comprend trois religions : le judaïsme est une religion, le christianisme est une religion, et le reste de la mécréance est une religion, car ce qui les réunit est qu'ils n'ont pas de Livre ; le Juif n'hérite donc pas du chrétien, et aucun des deux n'hérite de l'idolâtre.</p>
<p><strong>Le troisième avis :</strong> la mécréance comprend plusieurs religions ; les gens de chaque religion n'héritent donc pas des gens d'une autre religion, en vertu de la parole du Prophète ﷺ :</p>
<p class="ar">«لا يَتَوارَثُ أهلُ مِلَّتَينِ شَتَّى»</p>
<p>« Les gens de deux religions différentes n'héritent pas les uns des autres. » Rapporté par Ahmad, Abû Dâwûd, An-Nasâ'î et Ibn Mâjah.<a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a></p>
<p>Et peut-être cet avis est-il le plus juste, en raison de ce hadith, qui est un texte explicite sur le point de litige, et en raison de l'absence de solidarité mutuelle (at-tanâsur) entre les gens des religions ; ils n'héritent donc pas les uns des autres, comme les musulmans avec les mécréants ; et parce que la cause de l'héritage s'est opposée à l'empêchement de l'héritage, qui est la différence de religion, car la différence de religion implique une séparation totale sous tous les aspects ; l'empêchement est donc devenu fort, a interdit la cause de l'héritage, et la cause n'a pas eu d'effet en raison de la présence de l'empêchement.</p>
<p>Et ceux qui estiment que la mécréance est une seule religion estiment que la différence de lieu de résidence est un empêchement à l'héritage mutuel de certains mécréants avec d'autres, en raison de l'absence de solidarité mutuelle (at-tanâsur) et d'entraide (at-ta'âzur) entre eux, et ce sens existe avec la différence des religions ; ainsi, selon cet avis qui nous paraît le plus juste, le chrétien, par exemple, n'hérite pas de son proche juif, ni de son proche mazdéen ou idolâtre, et l'idolâtre, par exemple, n'hérite pas de son proche juif ; les chrétiens n'héritent que les uns des autres, les Juifs n'héritent que les uns des autres, les mazdéens n'héritent que les uns des autres, et de même pour le reste des religions de mécréance. Et Allah sait mieux.</p>
