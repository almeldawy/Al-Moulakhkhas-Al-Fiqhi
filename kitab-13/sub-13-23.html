<p><strong>Chapitre sur l'héritage des proches parents (Dhawû al-Arhâm)</strong></p>
<p>⁕ Les Dhawû al-Arhâm, dans la terminologie des spécialistes des parts légales (Al-Faradiyyîn), sont : tout parent qui n'a ni part prescrite ni qualité d'héritier agnat ('Asabah). Ils se répartissent, selon le consensus (Ijmâ'), en quatre catégories :</p>
<p><strong>La première catégorie :</strong> ceux qui se rattachent au défunt, c'est-à-dire les enfants des filles et les enfants des filles des fils, même s'ils descendent bas.</p>
<p><strong>La deuxième catégorie :</strong> ceux auxquels le défunt se rattache, c'est-à-dire les grands-pères non héritiers (as-sâqitûn) et les grands-mères non héritières (as-sawâqit), même s'ils remontent haut.</p>
<p><strong>La troisième catégorie :</strong> ceux qui se rattachent aux deux parents du défunt, c'est-à-dire les enfants des sœurs, les filles des frères, les enfants des frères utérins, et ceux qui se rattachent à eux, même s'ils descendent bas.</p>
<p><strong>La quatrième catégorie :</strong> ceux qui se rattachent aux grands-pères et aux grands-mères du défunt, et ce sont : les oncles paternels utérins, les tantes paternelles en toute circonstance, les filles des oncles paternels en toute circonstance, les oncles maternels et tantes maternelles en toute circonstance, même s'ils sont éloignés, ainsi que leurs enfants, même s'ils descendent bas.</p>
<p>⁕ Ce sont là leurs catégories de manière générale. Ils héritent lorsqu'il n'existe aucun des héritiers à part prescrite autre que les deux conjoints, et qu'il n'existe aucun héritier agnat ('Asabah), et cela en vertu de preuves, parmi lesquelles :</p>
<p>Premièrement : la parole d'Allah le Très-Haut :</p>
<p class="ar">﴿وَأُولُو الْأَرْحَامِ بَعْضُهُمْ أَوْلَىٰ بِبَعْضٍ فِي كِتَابِ اللَّهِ﴾ [الأنفال: 75]</p>
<p>« Et les liens du sang ont, les uns envers les autres, la priorité dans le Livre d'Allah. » [Sourate Al-Anfâl : 75] ; c'est-à-dire : les uns sont plus en droit que les autres d'hériter, selon le jugement d'Allah le Très-Haut.</p>
<p>Deuxièmement : le caractère général de la parole d'Allah le Très-Haut :</p>
<p class="ar">﴿لِلرِّجَالِ نَصِيبٌ مِمَّا تَرَكَ الْوَالِدَانِ وَالْأَقْرَبُونَ وَلِلنِّسَاءِ نَصِيبٌ مِمَّا تَرَكَ الْوَالِدَانِ وَالْأَقْرَبُونَ﴾ [النساء: 7]</p>
<p>« Aux hommes revient une part de ce que laissent les père et mère et les proches parents, et aux femmes revient une part de ce que laissent les père et mère et les proches parents. » [Sourate An-Nisâ' : 7] ; car les termes « les hommes », « les femmes » et « les proches parents » englobent les Dhawû al-Arhâm, et celui qui prétend qu'il y a une restriction (takhsîs) doit apporter la preuve.</p>
<p>Troisièmement : la parole du Messager ﷺ :</p>
<p class="ar">«الخالُ وارثُ مَنْ لا وارثَ لَهُ»</p>
<p>« L'oncle maternel est l'héritier de celui qui n'a pas d'héritier. » Rapporté par Ahmad, Abû Dâwûd, Ibn Mâjah et At-Tirmidhî, qui a dit : « Hadith hasan ».<a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a> Le point de démonstration qu'on en tire est qu'il a fait de l'oncle maternel un héritier en l'absence d'héritier par part prescrite ou par agnation ('Asabah), alors qu'il fait partie des Dhawû al-Arhâm ; on rattache donc à lui les autres parmi eux.</p>
<p>⁕ Ce sont là quelques-unes des preuves de ceux qui estiment qu'il faut faire hériter les Dhawû al-Arhâm. Cela est rapporté d'un groupe de Compagnons, parmi lesquels 'Umar et 'Alî (qu'Allah les agrée), et c'est l'école des hanbalites et des hanafites, ainsi que le second avis dans l'école des chaféites lorsque le trésor public (Bayt al-Mâl) n'est pas bien géré.</p>
<p>⁕ Ceux qui sont d'avis de faire hériter les Dhawû al-Arhâm ont divergé sur la manière de les faire hériter, selon plusieurs avis, dont les deux plus célèbres sont :</p>
<p><strong>Le premier avis :</strong> ils héritent par assimilation (at-tanzîl) : chacun d'eux est placé au rang de celui par lequel il se rattache au défunt, et on lui attribue sa part. Ainsi, les enfants des filles et les enfants des filles des fils sont placés au rang de leurs mères ; l'oncle paternel utérin et les tantes paternelles au rang du père ; les oncles maternels, les tantes maternelles et le père de la mère au rang de la mère ; les filles des frères et les filles de leurs fils au rang de leurs pères... et ainsi de suite.</p>
<p><strong>Le second avis :</strong> l'héritage des Dhawû al-Arhâm est semblable à l'héritage des héritiers agnats ('Asabât) : on fait donc passer en premier le plus proche, puis le plus proche parmi eux. Et Allah le Très-Haut sait mieux.</p>
