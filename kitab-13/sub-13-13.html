<p><strong>Chapitre sur la succession par agnation (At-Ta'sîb)</strong></p>
<p>⁕ At-Ta'sîb, sur le plan de la langue : c'est le nom d'action (masdar) de « 'assaba, yu'assibu, ta'sîban » ; il est donc « mu'assib », dérivé de « al-'asab » (le nerf), dans le sens de : serrer, entourer et renforcer ; de là vient « al-'asâ'ib », qui sont les turbans.</p>
<p>⁕ Et « Al-'Asabah », dans les parts légales (Al-Farâ'id) (pluriel de « 'âsib »), est un terme qui s'applique à une seule personne : on dit : « Zayd est un 'asabah », et il s'applique aussi à un groupe. Les 'asabah d'un homme sont ses proches du côté de son père. On les a appelés 'asabah parce qu'ils « 'assabû bihi », c'est-à-dire : ils l'ont entouré ; et toute chose qui entoure une autre chose l'a « 'assabahâ ». Ainsi le père est une extrémité, le fils est une extrémité, le frère est un côté et l'oncle paternel est un côté. Et il a été dit : on les a ainsi appelés parce qu'ils se renforcent les uns les autres, à partir de « al-'asab », qui est le fait de serrer et d'empêcher ; certains d'entre eux en serrent donc d'autres et empêchent les autres de s'en prendre à lui.</p>
<p>⁕ Et l'héritier agnat ('Âsib), dans la terminologie des spécialistes des parts légales, est celui qui hérite sans part déterminée ; car lorsqu'il est seul, il rassemble la totalité des biens, et lorsqu'il est avec un héritier à part prescrite, il prend ce qui reste après la part prescrite, selon la parole du Prophète ﷺ :</p>
<p class="ar">«أَلْحِقُوا الْفَرَائِضَ بِأَهْلِهَا؛ فَمَا بَقِيَ فَلِأَوْلَى رَجُلٍ ذَكَرٍ»</p>
<p>« Donnez les parts prescrites à leurs ayants droit ; ce qui reste revient à l'homme mâle le plus proche. »<a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a></p>
<p>⁕ La succession par agnation se divise en trois catégories : l'agnation par soi-même, l'agnation par un autre, et l'agnation avec un autre.</p>
<p><strong>La première catégorie : l'agnation par soi-même (Al-'Asabah bi-n-nafs) :</strong></p>
<p>⁕ Ce sont ceux dont l'héritage a fait l'objet du consensus parmi les hommes, à l'exception de l'époux et du frère utérin ; ils sont au nombre de quatorze : le fils, le fils du fils même s'il descend [très bas], le père, le grand-père du côté du père même s'il remonte [très haut], le frère germain, le frère consanguin, leurs fils même s'ils descendent [très bas], l'oncle paternel germain et l'oncle paternel consanguin même s'ils remontent [très haut], leurs deux fils même s'ils descendent [très bas], l'affranchisseur et l'affranchisseuse.</p>
<p><strong>La deuxième catégorie : l'agnation par un autre (Al-'Asabah bi-l-ghayr) :</strong></p>
<p>Ils sont de quatre sortes :</p>
<p><strong>La première :</strong> la fille ou davantage, avec le fils ou davantage.</p>
<p><strong>La deuxième :</strong> la fille du fils ou davantage, avec le fils du fils ou davantage, lorsqu'il est de son degré, qu'il soit son frère ou son cousin paternel, ou avec le fils du fils qui est plus bas qu'elle, lorsqu'elle en a besoin.</p>
<p>Et la preuve de ces deux sortes d'agnation par un autre est la parole d'Allah le Très-Haut : ﴿يُوصِيكُمُ اللَّهُ فِي أَوْلَادِكُمْ ۖ لِلذَّكَرِ مِثْلُ حَظِّ الْأُنثَيَيْنِ﴾ [النساء: 11]</p>
<p>« Allah vous recommande, au sujet de vos enfants : au garçon, l'équivalent de la part de deux filles » [Sourate An-Nisâ' : 11].</p>
<p>Ce noble verset a donc visé les enfants et les enfants du fils.</p>
<p><strong>La troisième :</strong> la sœur germaine ou davantage, avec le frère germain ou davantage.</p>
<p><strong>La quatrième :</strong> la sœur consanguine ou davantage, avec le frère consanguin ou davantage.</p>
<p>Et la preuve de ces deux sortes est la parole d'Allah le Très-Haut : ﴿وَإِن كَانُوا إِخْوَةً رِّجَالًا وَنِسَاءً فَلِلذَّكَرِ مِثْلُ حَظِّ الْأُنثَيَيْنِ﴾</p>
<p>« Et s'il y a des frères, hommes et femmes, au mâle revient l'équivalent de la part de deux femelles » ; ce noble verset a donc visé l'enfant des deux parents et l'enfant du père.</p>
<p>Ainsi, ces quatre parmi les mâles : le fils, le fils du fils, le frère germain, le frère consanguin ; leurs sœurs héritent avec eux par la voie de l'agnation par eux. Quant à ceux qui sont autres qu'eux parmi les mâles, leurs sœurs n'héritent rien avec eux ; et cela comme les fils des frères, les oncles paternels et les fils des oncles paternels.</p>
<p><strong>La troisième catégorie : l'agnation avec un autre (Al-'Asabah ma'a al-ghayr) :</strong></p>
<p>Ils sont de deux sortes :</p>
<p><strong>La première :</strong> la sœur germaine ou davantage, avec la fille ou davantage, ou la fille du fils ou davantage.</p>
<p><strong>La deuxième :</strong> la sœur consanguine ou davantage, avec la fille ou davantage, ou la fille du fils ou davantage ; et c'est l'avis de la majorité des savants parmi les Compagnons et les Tâbi'ûn et ceux qui sont venus après eux : que les sœurs germaines ou consanguines sont des héritières agnates avec les filles ou les filles du fils. Leur preuve est ce que « le groupe » (Al-Jamâ'ah) a rapporté, à l'exception de Muslim<a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a>, ainsi qu'An-Nasâ'î : Abû Mûsâ fut interrogé au sujet d'une fille, d'une fille de fils et d'une sœur. Il dit : « À la fille, la moitié, et à la sœur, la moitié. » Et il dit à l'interrogateur : « Va voir Ibn Mas'ûd, il te suivra. » Lorsque [l'interrogateur] vint à Ibn Mas'ûd et l'informa de la parole d'Abû Mûsâ, il dit : « Je me serais alors égaré, et je ne serais pas parmi les bien-guidés. Je vais en juger selon ce dont le Prophète ﷺ a jugé : à la fille, la moitié ; à la fille du fils, le sixième, pour compléter les deux tiers ; et ce qui reste, à la sœur. »</p>
<p>⁕ Ceci étant, l'héritier agnat par soi-même, lorsqu'il est seul, rassemble la totalité des biens, selon la parole d'Allah le Très-Haut : ﴿وَهُوَ يَرِثُهَا إِن لَّمْ يَكُن لَّهَا وَلَدٌ﴾ [النساء: 176]</p>
<p>« Et lui, il hérite d'elle si elle n'a pas d'enfant » [Sourate An-Nisâ' : 176] ; le frère a donc hérité dans ce verset de la totalité des biens de sa sœur, et les héritiers agnats par soi-même sont seuls à avoir cette règle, et ils partagent avec le reste des héritiers agnats le fait que, lorsqu'ils sont avec des héritiers à part prescrite, ils prennent ce qui reste ; selon la parole de l'Envoyé d'Allah ﷺ : «أَلْحِقُوا الْفَرَائِضَ بِأَهْلِهَا؛ فَمَا بَقِيَ فَلِأَوْلَى رَجُلٍ ذَكَرٍ» « Donnez les parts prescrites à leurs ayants droit ; ce qui reste revient à l'homme mâle le plus proche »<a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a> ; et s'il ne reste rien après les parts prescrites, ils tombent [ils sont exclus].</p>
<p>⁕ Ceci étant, les héritiers agnats ont six directions, qui sont : la direction de la filiation (Al-Bunuwwah), puis la direction de la paternité (Al-Ubuwwah), puis la direction de la fraternité (Al-Ukhuwwah), puis la direction des fils des frères, puis la direction du Walâ' (le lien d'affranchissement) ; et le Walâ', comme cela a précédé, est une agnation dont la cause est le bienfait de l'affranchisseur envers son esclave par l'affranchissement, et sa preuve est la parole du Prophète ﷺ :</p>
<p class="ar">«إِنَّمَا الْوَلَاءُ لِمَنْ أَعْتَقَ»</p>
<p>« Le Walâ' revient seulement à celui qui a affranchi. »<a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a></p>
<p>⁕ Et lorsque deux héritiers agnats ou davantage se trouvent réunis, ils ont quatre cas :</p>
<p><strong>Le premier :</strong> qu'ils soient identiques par la direction, le degré et la force ; ils partagent alors l'héritage, comme les fils, les frères germains et les oncles paternels.</p>
<p><strong>Le deuxième :</strong> qu'ils diffèrent par la direction ; celui qui est le plus fort par la direction est alors prioritaire dans l'héritage, comme le fils et le père : le fils est prioritaire sur le père dans l'agnation.</p>
<p><strong>Le troisième :</strong> qu'ils soient identiques par la direction et diffèrent par le degré, comme lorsque se trouvent réunis un fils et un fils de fils : le fils est alors prioritaire sur le fils du fils, car il est plus proche en degré.</p>
<p><strong>Le quatrième :</strong> qu'ils soient identiques par la direction et le degré et diffèrent par la force, de sorte que l'un d'eux est plus fort que l'autre ; le plus fort est alors prioritaire, comme lorsque se trouvent réunis un frère germain et un frère consanguin : le frère germain est alors prioritaire car il est plus fort, du fait qu'il se rattache par les deux parents, alors que le frère consanguin se rattache uniquement par le père.</p>
