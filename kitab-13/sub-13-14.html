<p><strong>Chapitre sur l'exclusion (Al-Hajb)</strong></p>
<p>⁕ Ce chapitre revêt une importance particulière parmi les chapitres des héritages ; car la connaissance de ses détails entraîne la remise des droits à ceux qui y ont droit, et l'ignorance des règles de ce chapitre entraîne un grave danger ; car on peut donner l'héritage à celui qui n'y a pas droit selon la législation et priver celui qui y a droit ; c'est pourquoi certains savants ont dit : il est interdit à celui qui ne connaît pas l'exclusion de rendre des fatwas en matière de parts légales.</p>
<p>⁕ Et « Al-Hajb », sur le plan de la langue : l'empêchement ; on dit : « hajabahu » lorsqu'il l'a empêché d'entrer ; et « Al-Hâjib », sur le plan de la langue : celui qui empêche ; de là vient « le chambellan (Hâjib) du sultan », car il empêche d'entrer chez lui.</p>
<p>⁕ Quant à l'exclusion (Al-Hajb), dans la terminologie des spécialistes des parts légales, son sens est : empêcher celui chez qui la cause de l'héritage est réalisée d'hériter de manière totale, ou de la plus ample de ses deux parts.</p>
<p>⁕ Et l'exclusion, dans les parts légales, se divise en deux catégories :</p>
<p>La première catégorie : l'exclusion par qualité (Hajb al-Awsâf) : elle concerne celui qui présente l'un des trois empêchements à l'héritage, qui sont : l'esclavage, le meurtre ou la différence de religion ; celui qui présente l'une de ces qualités n'hérite pas, et sa présence est comme son absence.</p>
<p>La deuxième catégorie : l'exclusion par personne (Hajb al-Ashkhâs) : c'est l'empêchement d'une personne déterminée d'hériter de manière totale, et on l'appelle l'exclusion totale (Hajb al-Hirmân) ; ou son empêchement de passer d'un héritage plus important à un héritage moindre, et on l'appelle l'exclusion partielle (Hajb an-Nuqsân). La cause de cette exclusion, dans ses deux types, est la présence d'une personne qui y a plus droit que lui ; c'est pourquoi on l'a appelée l'exclusion par personne. Elle comprend sept types, dont quatre se produisent à cause de la surcharge (Al-Izdihâm), et trois à cause du passage d'une part prescrite à une [autre] part prescrite. Ces sept sont :</p>
<p><strong>Premièrement :</strong> le passage d'une part prescrite à une part prescrite moindre, comme le passage de l'époux de la moitié au quart, par exemple.</p>
<p><strong>Deuxièmement :</strong> le passage d'une agnation à une agnation moindre, comme le passage de la sœur autre que de mère, de sa qualité d'héritière agnate avec un autre à sa qualité d'héritière agnate par un autre.</p>
<p><strong>Troisièmement :</strong> [le passage] d'une part prescrite à une agnation moindre, comme le passage de celles qui ont la moitié à l'agnation par un autre.</p>
<p><strong>Quatrièmement :</strong> le passage d'une agnation à une part prescrite moindre, comme le passage du père et du grand-père de l'héritage par l'agnation à l'héritage par la part prescrite.</p>
<p><strong>Cinquièmement :</strong> la surcharge dans une part prescrite, comme la surcharge des épouses dans le quart et le huitième, par exemple.</p>
<p><strong>Sixièmement :</strong> la surcharge dans l'agnation, comme la surcharge des héritiers agnats dans les biens ou dans ce que les parts prescrites ont laissé.</p>
<p><strong>Septièmement :</strong> la surcharge à cause du 'Awl, comme la surcharge des héritiers à part prescrite dans les bases de calcul que le 'Awl affecte ; car chacun d'eux prend sa part prescrite diminuée à cause du 'Awl.</p>
<p>⁕ Et l'exclusion a des règles autour desquelles elle tourne :</p>
<p><strong>La première règle :</strong> celui qui se rattache par un intermédiaire est exclu par cet intermédiaire, et cela comme le fils du fils avec le fils, la grand-mère avec la mère, le grand-père avec le père, et les frères avec le père.</p>
<p><strong>La deuxième règle :</strong> lorsque deux héritiers agnats ou davantage se trouvent réunis, on donne la priorité à celui dont la direction est la plus prioritaire ; et cela comme le fils avec le père ou avec le grand-père : l'agnation revient alors au fils, car sa direction est la plus prioritaire ; et si les deux présents sont identiques par la direction, on donne la priorité au plus proche d'entre eux du défunt ; comme lorsque se trouvent réunis un fils et le fils d'un autre fils, ou lorsque se trouvent réunis un frère germain et le fils d'un autre frère germain... Et ainsi de suite ; et si les deux présents sont égaux par la direction et la proximité, on donne la priorité au plus fort d'entre eux ; comme lorsque se trouvent réunis un frère germain et un frère consanguin : on donne alors la priorité au frère germain, à cause de sa force, du fait qu'il se rattache par les deux parents, alors que le frère consanguin se rattache uniquement par le père.</p>
<p><strong>La troisième règle :</strong> elle concerne l'exclusion totale : les ascendants ne sont exclus que par des ascendants ; le grand-père n'est donc exclu que par le père ou par un grand-père qui lui est plus proche, la grand-mère n'est exclue que par la mère ou par une grand-mère qui lui est plus proche, et les descendants ne sont exclus que par des descendants ; le fils du fils n'est donc exclu que par le fils ou par un fils de fils qui lui est plus haut, et les collatéraux, qui sont les frères, leurs fils, les oncles paternels et leurs fils, sont exclus par des ascendants, des descendants et des collatéraux.</p>
<p>Par exemple, les frères consanguins : ils tombent [sont exclus] par le fils et le fils du fils même s'il descend [très bas], par le père, par le grand-père selon l'avis correct, par le frère germain, et par la sœur germaine lorsqu'elle est héritière agnate avec un autre.</p>
<p>Et ainsi nous trouvons que le frère consanguin a été exclu par des ascendants, des descendants et des collatéraux.</p>
<p>⁕ Nous revenons et disons : le chapitre de l'exclusion est un chapitre très important ; il incombe donc à celui qui rend des fatwas en matière de parts légales de maîtriser ses règles, de réfléchir à ses subtilités et de l'appliquer aux cas concrets, afin de ne pas se tromper dans sa fatwa, de sorte qu'il détournerait les héritages de leur cours légal, priverait celui qui y a droit et donnerait à celui qui n'y a pas droit ; et Allah est le Maître du succès.</p>
