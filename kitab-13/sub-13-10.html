<p><strong>Chapitre sur l'héritage des filles</strong></p>
<p>⁕ La fille unique reçoit la moitié (1/2) à deux conditions :</p>
<p><strong>La première condition :</strong> qu'elle soit seule, sans personne parmi ses frères et sœurs qui partage avec elle.</p>
<p><strong>La deuxième condition :</strong> qu'elle soit seule, sans personne parmi ses frères qui la rende agnate (Mu'assib).</p>
<p>Et cela, d'après la parole d'Allah le Très-Haut :</p>
<p class="ar">﴿يُوصِيكُمُ اللَّهُ فِي أَوْلَادِكُمْ ۖ لِلذَّكَرِ مِثْلُ حَظِّ الْأُنثَيَيْنِ ۚ فَإِن كُنَّ نِسَاءً فَوْقَ اثْنَتَيْنِ فَلَهُنَّ ثُلُثَا مَا تَرَكَ ۖ وَإِن كَانَتْ وَاحِدَةً فَلَهَا النِّصْفُ﴾ [النساء: 11]</p>
<p>« Allah vous recommande, au sujet de vos enfants : au garçon, une part équivalente à celle de deux filles. S'il n'y a que des filles, plus de deux, à elles les deux tiers de ce qu'il laisse ; et s'il n'y en a qu'une, à elle la moitié » [Sourate An-Nisâ' : 11].</p>
<p>Ainsi, Sa parole : ﴿وَإِن كَانَتْ وَاحِدَةً﴾ : on en tire la condition qu'elle soit seule, sans personne parmi ses sœurs qui partage avec elle ; et Sa parole, le Très-Haut : ﴿لِلذَّكَرِ مِثْلُ حَظِّ الْأُنثَيَيْنِ﴾ : on en tire la condition de l'absence d'un agnat qui la rende agnate (Mu'assib).</p>
<p>⁕ La fille du fils reçoit la moitié (1/2) à trois conditions :</p>
<p><strong>La première condition :</strong> l'absence de celui qui la rend agnate, à savoir son frère ou le fils de son oncle paternel qui est à son degré.</p>
<p><strong>La deuxième condition :</strong> l'absence de celle qui partage avec elle, à savoir sa sœur ou la fille de son oncle paternel qui est à son degré.</p>
<p><strong>La troisième condition :</strong> l'absence de la descendance héritière qui est plus haute qu'elle.</p>
<p>⁕ Les filles, deux ou plus, reçoivent les deux tiers (2/3), à deux conditions :</p>
<p><strong>La première condition :</strong> qu'elles soient deux ou plus.</p>
<p><strong>La deuxième condition :</strong> l'absence de celui qui les rend agnates (Mu'assib), à savoir le fils du défunt, issu de ses reins.</p>
<p>Et cela, d'après la parole d'Allah le Très-Haut :</p>
<p class="ar">﴿يُوصِيكُمُ اللَّهُ فِي أَوْلَادِكُمْ ۖ لِلذَّكَرِ مِثْلُ حَظِّ الْأُنثَيَيْنِ ۚ فَإِن كُنَّ نِسَاءً فَوْقَ اثْنَتَيْنِ فَلَهُنَّ ثُلُثَا مَا تَرَكَ﴾</p>
<p>« Allah vous recommande, au sujet de vos enfants : au garçon, une part équivalente à celle de deux filles. S'il n'y a que des filles, plus de deux, à elles les deux tiers de ce qu'il laisse. »</p>
<p>On a donc tiré de Sa parole : ﴿لِلذَّكَرِ مِثْلُ حَظِّ الْأُنثَيَيْنِ﴾ la condition de l'absence d'un agnat qui rende agnates les filles en matière d'héritage des deux tiers ; et l'on a tiré de Sa parole, le Très-Haut : ﴿فَإِن كُنَّ نِسَاءً فَوْقَ اثْنَتَيْنِ﴾ la condition qu'elles soient deux ou plus.</p>
<p>⁕ Cependant, le terme ﴿فَوْقَ اثْنَتَيْنِ﴾ (« plus de deux ») dans le noble verset a posé une difficulté ; car son sens apparent est que les deux filles ne reçoivent pas les deux tiers, et que seules trois ou plus les prennent, comme cela est rapporté d'après Ibn 'Abbâs (qu'Allah l'agrée en lui et en son père) ; or la majorité des gens de science est de l'avis contraire, et les deux filles reçoivent les deux tiers, sur la preuve du hadith de Jâbir (qu'Allah l'agrée). Il a dit : « La femme de Sa'd ibn ar-Rabî' vint trouver le Messager d'Allah ﷺ avec ses deux filles de Sa'd, et dit : Ô Messager d'Allah ! Voici les deux filles de Sa'd ibn ar-Rabî', dont le père a été tué en martyr avec toi à Uhud, et leur oncle paternel a pris leur bien et ne leur a laissé aucun bien ; or on ne les épouse que si elles ont des biens. Il dit : "Allah rendra son jugement à ce sujet." Alors le verset de l'héritage fut révélé, et le Messager d'Allah ﷺ envoya [chercher] leur oncle paternel et dit : "Donne aux deux filles de Sa'd les deux tiers, à leur mère le huitième, et ce qui reste est pour toi." » Rapporté par les Cinq, sauf An-Nasâ'î, et At-Tirmidhî l'a jugé bon (hasan)<a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a>. Cela indique que les deux filles ont les deux tiers ; c'est un texte (Nass) sur le point de litige, et une explication de la part du Prophète ﷺ de Sa parole, le Très-Haut : ﴿فَإِن كُنَّ نِسَاءً فَوْقَ اثْنَتَيْنِ فَلَهُنَّ ثُلُثَا مَا تَرَكَ﴾, ainsi qu'une clarification de son sens, d'autant plus que la cause de sa révélation est l'histoire des deux filles de Sa'd ibn ar-Rabî', et la question de leur mère à leur sujet, et que, lorsqu'il fut révélé, le Prophète ﷺ envoya [chercher] leur oncle paternel.</p>
<p>Et l'on répond au sujet du terme ﴿فَوْقَ اثْنَتَيْنِ﴾ dont ont tiré argument ceux qui ont estimé que les deux filles ne reçoivent pas les deux tiers jusqu'à ce qu'elles soient trois ou plus, par plusieurs réponses :</p>
<ul>
<li><p>Parmi elles : cela relève de la concordance des parties du discours entre elles ; car Il, le Très-Haut, a dit : ﴿يُوصِيكُمُ اللَّهُ فِي أَوْلَادِكُمْ ۖ لِلذَّكَرِ مِثْلُ حَظِّ الْأُنثَيَيْنِ ۚ فَإِن كُنَّ نِسَاءً فَوْقَ اثْنَتَيْنِ فَلَهُنَّ ثُلُثَا مَا تَرَكَ﴾ ; le pronom de ﴿كُنَّ﴾ est donc un pronom du pluriel qui s'accorde avec les enfants (Al-Awlâd) s'ils sont des femmes. Dans le noble verset se sont donc réunis trois éléments : le terme « Al-Awlâd », qui est un pluriel, le pronom de ﴿كُنَّ﴾, qui est un pronom du pluriel, et « nisâ' » (femmes), qui est un nom collectif ; il convenait donc de s'exprimer par « plus de deux ».</p></li>
<li><p>Parmi les réponses à cette difficulté : Allah le Très-Haut a fait pour le garçon une part équivalente à celle de deux filles ; si donc le garçon prend les deux tiers et la fille le tiers, on sait de façon certaine que la part de deux filles est les deux tiers ; car si une seule a le tiers avec un garçon, qu'elle l'ait avec une fille est donc d'autant plus logique, et cela relève de l'avertissement par le plus bas sur le plus haut. Ainsi, puisque Lui, Gloire à Lui, a mentionné expressément l'héritage d'une seule, et l'héritage de deux par avertissement : le mot ﴿فَوْقَ اثْنَتَيْنِ﴾ indique que la part prescrite n'augmente pas avec l'augmentation du nombre, même si elles sont plus de deux. Et Allah sait mieux.</p></li>
</ul>
<p>⁕ Les deux filles du fils sont comme les filles issues des reins pour ce qui est de leur droit aux deux tiers (2/3), qu'elles soient deux sœurs ou deux filles de deux oncles paternels de même rang ; elles reçoivent donc les deux tiers par analogie avec les deux filles issues des reins, car la fille du fils est comme la fille, mais il faut que trois conditions se réunissent pour elles :</p>
<p><strong>La première condition :</strong> qu'elles soient deux ou plus.</p>
<p><strong>La deuxième condition :</strong> l'absence de celui qui les rend agnates, à savoir le fils du fils, qu'il soit leur frère ou le fils de leur oncle paternel qui est à leur degré.</p>
<p><strong>La troisième condition :</strong> l'absence de la descendance héritière qui est plus haute qu'elles, à savoir le fils issu des reins, ou le fils du fils, ou les filles issues des reins, ou les filles d'un seul fils, ou plus. Et Allah sait mieux.</p>
