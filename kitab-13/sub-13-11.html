<p><strong>Chapitre sur l'héritage des sœurs germaines</strong></p>
<p>⁕ Allah ﷻ a mentionné l'héritage des sœurs germaines et des sœurs consanguines (de même père) avec les frères d'une mère autre que la leur, ainsi que leur groupe, dans Sa parole à la fin de la sourate An-Nisâ' :</p>
<p class="ar">﴿يَسْتَفْتُونَكَ قُلِ اللَّهُ يُفْتِيكُمْ فِي الْكَلَالَةِ ۚ إِنِ امْرُؤٌ هَلَكَ لَيْسَ لَهُ وَلَدٌ وَلَهُ أُخْتٌ فَلَهَا نِصْفُ مَا تَرَكَ ۚ وَهُوَ يَرِثُهَا إِن لَّمْ يَكُن لَّهَا وَلَدٌ ۚ فَإِن كَانَتَا اثْنَتَيْنِ فَلَهُمَا الثُّلُثَانِ مِمَّا تَرَكَ ۚ وَإِن كَانُوا إِخْوَةً رِّجَالًا وَنِسَاءً فَلِلذَّكَرِ مِثْلُ حَظِّ الْأُنثَيَيْنِ﴾ [النساء: 176]</p>
<p>« Ils te demandent de rendre une décision. Dis : Allah vous donne Sa décision au sujet de la Kalâlah : si un homme meurt sans enfant et qu'il a une sœur, à elle la moitié de ce qu'il laisse ; et lui, il hérite d'elle si elle n'a pas d'enfant. S'il y a deux sœurs, à elles les deux tiers de ce qu'il laisse ; et s'ils sont des frères, hommes et femmes, au garçon une part équivalente à celle de deux filles » [Sourate An-Nisâ' : 176].</p>
<p>Et Il a mentionné l'héritage des sœurs de même mère, qu'il y en ait une seule ou plus, avec les frères d'une mère, dans Sa parole, le Très-Haut :</p>
<p class="ar">﴿وَإِن كَانَ رَجُلٌ يُورَثُ كَلَالَةً أَوِ امْرَأَةٌ وَلَهُ أَخٌ أَوْ أُخْتٌ فَلِكُلِّ وَاحِدٍ مِّنْهُمَا السُّدُسُ ۚ فَإِن كَانُوا أَكْثَرَ مِن ذَٰلِكَ فَهُمْ شُرَكَاءُ فِي الثُّلُثِ﴾ [النساء: 12]</p>
<p>« Et si un homme dont on hérite, ou une femme, n'a laissé ni ascendant ni descendant, mais a un frère ou une sœur, à chacun des deux revient le sixième ; s'ils sont plus nombreux, ils sont alors associés dans le tiers » [Sourate An-Nisâ' : 12] : au début de la sourate.</p>
<p>⁕ La sœur germaine reçoit la moitié (1/2) à quatre conditions :</p>
<p><strong>La première condition :</strong> l'absence de celui qui la rend agnate (Mu'assib), à savoir le frère germain ; car Allah le Très-Haut a dit :</p>
<p class="ar">﴿وَإِن كَانُوا إِخْوَةً رِّجَالًا وَنِسَاءً فَلِلذَّكَرِ مِثْلُ حَظِّ الْأُنثَيَيْنِ﴾ [النساء: 176].</p>
<p>« Et s'ils sont des frères, hommes et femmes, au garçon une part équivalente à celle de deux filles » [Sourate An-Nisâ' : 176].</p>
<p><strong>La deuxième condition :</strong> l'absence de celle qui partage avec elle, à savoir la sœur germaine ; car Allah le Très-Haut a dit :</p>
<p class="ar">﴿إِنِ امْرُؤٌ هَلَكَ لَيْسَ لَهُ وَلَدٌ وَلَهُ أُخْتٌ فَلَهَا نِصْفُ مَا تَرَكَ ۚ وَهُوَ يَرِثُهَا إِن لَّمْ يَكُن لَّهَا وَلَدٌ ۚ فَإِن كَانَتَا اثْنَتَيْنِ فَلَهُمَا الثُّلُثَانِ مِمَّا تَرَكَ﴾ [النساء: 176].</p>
<p>« Si un homme meurt sans enfant et qu'il a une sœur, à elle la moitié de ce qu'il laisse ; et lui, il hérite d'elle si elle n'a pas d'enfant. S'il y a deux sœurs, à elles les deux tiers de ce qu'il laisse » [Sourate An-Nisâ' : 176].</p>
<p><strong>La troisième condition :</strong> l'absence de l'ascendant parmi les hommes héritiers ; et ce que l'on entend par là, ce sont le père et le grand-père paternel, selon l'avis correct.</p>
<p><strong>La quatrième condition :</strong> l'absence de la descendance héritière, à savoir le fils et le fils du fils, même s'il descend, ainsi que la fille et la fille du fils, même si son père descend.</p>
<p>Et la preuve de ces deux conditions est que les frères et les sœurs n'héritent que dans le cas de la Kalâlah, et la Kalâlah est celui qui n'a ni ascendant ni descendant.</p>
<p>⁕ La sœur consanguine reçoit la moitié (1/2) à cinq conditions : ce sont les quatre conditions précédentes concernant la sœur germaine, et la cinquième est l'absence du frère germain et de la sœur germaine ; car celui qui existe parmi eux deux est plus fort qu'elle.</p>
<p>⁕ Les deux sœurs germaines, ou plus, reçoivent les deux tiers (2/3), d'après la parole d'Allah le Très-Haut : ﴿فَإِن كَانَتَا اثْنَتَيْنِ فَلَهُمَا الثُّلُثَانِ مِمَّا تَرَكَ﴾, et elles ne reçoivent les deux tiers qu'à quatre conditions :</p>
<p><strong>La première condition :</strong> qu'elles soient deux ou plus ; d'après le noble verset : ﴿فَإِن كَانَتَا اثْنَتَيْنِ﴾.</p>
<p><strong>La deuxième condition :</strong> l'absence de celui qui les rend agnates, à savoir le frère germain, un ou plus ; d'après Sa parole, le Très-Haut : ﴿وَإِن كَانُوا إِخْوَةً رِّجَالًا وَنِسَاءً فَلِلذَّكَرِ مِثْلُ حَظِّ الْأُنثَيَيْنِ﴾.</p>
<p><strong>La troisième condition :</strong> l'absence de la descendance héritière, à savoir les enfants et les enfants des fils ; d'après Sa parole, le Très-Haut : ﴿إِنِ امْرُؤٌ هَلَكَ لَيْسَ لَهُ وَلَدٌ وَلَهُ أُخْتٌ فَلَهَا نِصْفُ مَا تَرَكَ ...﴾ jusqu'à la fin du verset.</p>
<p><strong>La quatrième condition :</strong> l'absence de l'ascendant parmi les hommes héritiers, à savoir le père selon le consensus (Ijmâ'), et le grand-père selon l'avis correct.</p>
<p>⁕ Les sœurs consanguines, deux ou plus, reçoivent les deux tiers (2/3) selon le consensus (Ijmâ'), du fait de leur entrée dans la généralité du verset de la Kalâlah :</p>
<p class="ar">﴿إِنِ امْرُؤٌ هَلَكَ لَيْسَ لَهُ وَلَدٌ وَلَهُ أُخْتٌ فَلَهَا نِصْفُ مَا تَرَكَ ۚ وَهُوَ يَرِثُهَا إِن لَّمْ يَكُن لَّهَا وَلَدٌ ۚ فَإِن كَانَتَا اثْنَتَيْنِ فَلَهُمَا الثُّلُثَانِ مِمَّا تَرَكَ﴾ [النساء: 176]</p>
<p>« Si un homme meurt sans enfant et qu'il a une sœur, à elle la moitié de ce qu'il laisse ; et lui, il hérite d'elle si elle n'a pas d'enfant. S'il y a deux sœurs, à elles les deux tiers de ce qu'il laisse » [Sourate An-Nisâ' : 176].</p>
<p>Mais elles ne reçoivent pas les deux tiers, sauf si cinq conditions sont réalisées : les quatre conditions précédentes concernant les sœurs germaines, et la cinquième condition : l'absence des frères germains et des sœurs germaines. Si donc il y avait là des germains, un ou plus, homme ou femme, les sœurs consanguines n'hériteraient pas les deux tiers, mais seraient exclues par l'homme et par les deux sœurs germaines, sauf s'il y a avec elles quelqu'un qui les rend agnates (Mu'assib). Quant au cas où celle qui existe est une seule sœur germaine, la sœur consanguine ou les sœurs consanguines ont alors le sixième (1/6), en complément des deux tiers.</p>
<p>⁕ Et s'il se trouve une fille et une ou plusieurs filles de fils, la fille reçoit la moitié (1/2), et la fille du fils, ou plus, reçoit avec elle le sixième (1/6), en complément des deux tiers, d'après le jugement d'Ibn Mas'ûd (qu'Allah l'agrée) à ce sujet, et sa parole : « C'est le jugement du Messager d'Allah ﷺ à ce sujet. » Rapporté par Al-Bukhârî<a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a> ; et parce que plus d'une des filles du défunt se sont réunies, elles ont donc les deux tiers, d'après Sa parole, le Très-Haut : ﴿فَإِن كُنَّ نِسَاءً فَوْقَ اثْنَتَيْنِ فَلَهُنَّ ثُلُثَا مَا تَرَكَ﴾ ; et la fille issue des reins a été spécifiée par la moitié parce qu'elle est plus proche, et il reste donc à la fille du fils, ou plus, le sixième, en complément des deux tiers. Et cela, après que ces deux conditions sont réunies :</p>
<p><strong>La première condition :</strong> l'absence de celui qui la rend agnate, à savoir le fils du fils qui est à son degré, qu'il soit son frère ou le fils de son oncle paternel.</p>
<p><strong>La deuxième condition :</strong> l'absence de la descendance héritière qui est plus haute qu'elle, en dehors de celle qui reçoit la moitié ; car elle ne prend le sixième qu'avec elle.</p>
<p>⁕ La sœur consanguine, avec la sœur germaine, reçoit le sixième (1/6), en complément des deux tiers, et la preuve en est le consensus (Ijmâ') des savants, comme l'ont rapporté plusieurs, ainsi que son analogie avec la fille du fils avec la fille issue des reins ; mais la sœur consanguine ne prend le sixième qu'à deux conditions :</p>
<p><strong>La première condition :</strong> qu'elle soit avec une sœur germaine qui hérite de la moitié comme part prescrite ; car si les sœurs germaines étaient plusieurs, elles feraient écarter la sœur consanguine, car elles complètent les deux tiers.</p>
<p><strong>La deuxième condition :</strong> l'absence de celui qui la rend agnate (Mu'assib), à savoir son frère ; car s'il y a avec elle son frère, le reste après la [part de la] sœur germaine leur revient par agnation, au garçon une part équivalente à celle de deux filles. Et Allah sait mieux.</p>
