<p><strong>Chapitre sur la règle de l'héritage du meurtrier</strong></p>
<p>⁕ Il se peut que les causes de l'héritage soient réunies, mais qu'il ne se réalise pas en raison d'un empêchement survenu à ces causes, qui empêche alors la réalisation de leur effet.</p>
<p>⁕ Les empêchements à l'héritage sont nombreux ; parmi eux, le fait que l'héritier tue celui dont il hérite, et cela en raison de la parole du Prophète ﷺ :</p>
<p class="ar">«ليسَ للقاتِلِ ميراثٌ»<a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a></p>
<p>« Le meurtrier n'a pas d'héritage. » et de Sa parole ﷺ :</p>
<p class="ar">«لا يَرِثُ القاتِلُ شيئاً»<a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a></p>
<p>« Le meurtrier n'hérite de rien. » ; et afin de fermer la voie au mal (sadd adh-dharî'ah), car l'héritier peut être poussé par l'amour des biens à tuer celui dont il hérite afin d'obtenir ses biens ; et la règle bien connue est : celui qui se hâte d'obtenir une chose avant son temps est puni en en étant privé.</p>
<p>⁕ La privation du meurtrier de l'héritage fait l'objet d'un consensus (Ijmâ') parmi les gens de science dans l'ensemble, même s'ils ont divergé pour déterminer la nature du meurtre qui empêche l'héritage :</p>
<ul>
<li>Et l'avis correct de l'école chaféite est que le meurtrier n'hérite en aucun cas, quelle que soit la nature du meurtre, en raison du caractère général de Sa parole ﷺ : «لا يَرِثُ القاتِلُ شيئاً»<a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a>, et parce que le meurtrier a été privé de l'héritage afin que le meurtre ne soit pas rendu une voie vers la hâte d'obtenir l'héritage ; il faut donc le priver en toute circonstance, pour trancher la question.</li>
</ul>
<p>⁕ Sur cette base, n'hérite pas toute personne qui a pris part au meurtre, même s'il a eu lieu à bon droit, comme celui qui exécute le talion (al-muqtaṣṣ) ; et celui qui a prononcé la sentence de mort, comme le juge ; de même le témoin ; et même si le meurtre a eu lieu sans intention, comme le meurtre commis par un dormeur, un fou ou un enfant ; et de même si le meurtre résulte d'un acte autorisé par la Loi, comme l'éducateur et le soignant, lorsque la mort de celui qui est éduqué ou soigné résulte de l'éducation et du traitement.</p>
<ul>
<li><p>Et les hanbalites sont d'avis que le meurtre qui empêche l'héritage est le meurtre sans droit, c'est-à-dire ce pour quoi une responsabilité est due, par talion (qawad), par prix du sang (diyah) ou par expiation (kaffârah), comme le meurtre volontaire, le meurtre semblable au volontaire, le meurtre par erreur et ce qui y est assimilé, tel le meurtre par causalité (at-tasabbub) et le meurtre commis par l'enfant, le fou et le dormeur, ainsi que ce qui n'a pas de responsabilité pour quoi que ce soit de ce qui a été mentionné ; il n'empêche pas l'héritage, comme le meurtre en talion ou en peine légale (hadd), ou pour la légitime défense, ou si le meurtrier est juste et le tué rebelle, ou si le meurtre résulte d'un acte autorisé par la Loi, comme l'éducation et le traitement.</p></li>
<li><p>Et de même l'école hanafite, sauf qu'ils ont considéré que le meurtre par causalité (at-tasabbub) n'empêche pas l'héritage, comme lorsqu'on creuse un puits ou qu'on place une pierre sur la route et que son défunt (mawrûth) s'y tue ; et de même le meurtre sans intention n'empêche pas l'héritage, comme le meurtre commis par l'enfant et le fou.</p></li>
<li><p>Et chez les malikites, le meurtrier a deux situations :</p></li>
</ul>
<p><strong>La première situation :</strong> que le meurtre de son défunt (mawrûth) soit volontaire et par agression ; dans cette situation, il n'hérite ni des biens de son défunt ni de son prix du sang (diyah).</p>
<p><strong>La deuxième situation :</strong> que le meurtre de son défunt soit par erreur ; dans cette situation, il hérite de ses biens et n'hérite pas de son prix du sang (diyah) ; la raison pour laquelle il hérite des biens chez eux est qu'il ne s'est pas hâté par le meurtre, et la raison pour laquelle il n'hérite pas du prix du sang est qu'il est dû par lui, et cela n'a pas de sens qu'il hérite de quelque chose qui est dû par lui.</p>
<p>⁕ En examinant ces avis, nous trouvons l'avis médian parmi eux, à savoir que le meurtre qui entraîne une responsabilité pour le meurtrier empêche l'héritage, et que le meurtre qui n'entraîne pas de responsabilité pour le meurtrier n'empêche pas l'héritage, comme l'ont dit les hanbalites et les hanafites ; car ce qui a rendu la responsabilité obligatoire, c'est que le meurtrier n'y est pas excusable et en assume la responsabilité ; il en résulte donc sa privation de l'héritage ; et ce qui n'entraîne pas de responsabilité, c'est que le meurtrier y est excusable et n'en assume pas la responsabilité ; il ne l'empêche donc pas de l'héritage ; et si nous avions appliqué l'avis des chaféites, en faisant de tout meurtre un empêchement à l'héritage, cela aurait été une cause de non-application des peines légales obligatoires et de non-obtention des droits dus, comme le talion et ce qui y ressemble.</p>
<p>Sur cette base, le caractère général de la parole du Messager ﷺ : «ليسَ للقاتِلِ ميراثٌ»<a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a> est restreint au cas où le meurtre est sans droit et sans responsabilité. Et Allah le Très-Haut sait mieux.</p>
