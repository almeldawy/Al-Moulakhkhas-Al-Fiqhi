<p><strong>Chapitre sur l'héritage des frères avec le grand-père</strong></p>
<p>⁕ Ahmad, Ash-Shâfi'î et Mâlik ont adopté, dans cette question, la doctrine de Zayd ibn Thâbit (qu'Allah l'agrée), comme l'ont également adoptée Abû Yûsuf et Muhammad ibn al-Hasan parmi les hanafites, ainsi qu'un groupe de gens de science.</p>
<p>⁕ En résumé : lorsque les frères se trouvent réunis avec le grand-père, ils sont soit uniquement des frères germains (des deux parents), soit uniquement des frères consanguins (du père), soit un ensemble des deux catégories.</p>
<ul>
<li>Si c'est une seule des deux catégories qui est avec lui, il y a pour lui avec eux deux situations :</li>
</ul>
<p><strong>La première situation : qu'il n'y ait pas avec eux d'héritier à part prescrite.</strong></p>
<p>⁕ Il a alors avec eux trois situations :</p>
<p><strong>La première situation :</strong> que le partage (muqâsamah) lui soit plus avantageux que le tiers du bien. Sa règle est que les frères soient moins que le double de lui, c'est-à-dire qu'ils soient son égal et la moitié [de lui en nombre], ou moins que cela. Cela se limite à cinq cas :</p>
<p><strong>Le premier :</strong> un grand-père et une sœur ; il a dans ce cas les deux tiers (2/3).</p>
<p><strong>Le deuxième :</strong> un grand-père et un frère ; il a dans ce cas la moitié du bien (1/2).</p>
<p><strong>Le troisième :</strong> un grand-père et deux sœurs ; il a dans ce cas la moitié (1/2), comme dans le cas qui précède, et c'est plus que le tiers.</p>
<p><strong>Le quatrième :</strong> un grand-père et trois sœurs ; il a dans ce cas les deux cinquièmes (2/5), et c'est plus que le tiers, car le nombre qui réunit les deux fractions est quinze : son tiers est cinq, et ses deux cinquièmes sont six, et c'est plus que cinq d'une unité.</p>
<p><strong>Le cinquième :</strong> un grand-père, un frère et une sœur ; il a dans ce cas autant qu'il a dans le cas qui précède.</p>
<p><strong>La deuxième situation :</strong> que le partage et le tiers du bien soient égaux pour lui. Sa règle est que les frères soient le double de lui, et cela se limite à trois cas :</p>
<p><strong>Le premier :</strong> un grand-père et deux frères.</p>
<p><strong>Le deuxième :</strong> un grand-père, un frère et deux sœurs.</p>
<p><strong>Le troisième :</strong> un grand-père et quatre sœurs.</p>
<p>Le partage et le tiers sont donc égaux pour lui dans ces cas : s'il partage, il prend un tiers, et s'il ne partage pas, il en est de même.</p>
<p>Il y a eu divergence : faut-il alors s'exprimer par le partage, de sorte que son héritage se fasse par agnation (ta'sîb), ou s'exprimer par le tiers, de sorte que son héritage se fasse par la part prescrite, ou bien a-t-on le choix entre s'exprimer par le partage ou par le tiers ? Certains ont jugé plus juste de s'exprimer par le tiers plutôt que par le partage, car le fait de prendre la part prescrite, si c'est possible, est préférable, en raison de la force de la part prescrite et de la priorité des héritiers à part prescrite sur les héritiers agnats. Et Allah sait mieux.</p>
<p><strong>La troisième situation :</strong> que le tiers du bien lui soit plus avantageux que le partage ; il le prend alors comme part prescrite. Sa règle est que les frères soient plus que le double de lui, et les cas de cette situation ne se limitent pas, comme se limitaient les cas des deux situations qui la précèdent. Le moins [de frères] en est : un grand-père, deux frères et une sœur, ou un grand-père et cinq sœurs, ou un grand-père, un frère et trois sœurs... et ainsi de suite, au-delà.</p>
<p><strong>La deuxième situation : qu'il y ait avec le grand-père et les frères un héritier à part prescrite.</strong></p>
<p>Il a alors avec eux sept situations, qui sont, en résumé : le partage est ce qui est déterminé pour lui, le tiers du reste est ce qui est déterminé pour lui, le sixième de tout le bien est ce qui est déterminé pour lui, le partage et le tiers du reste sont égaux, le partage et le sixième de tout le bien sont égaux, le tiers du reste et le sixième de tout le bien sont égaux, le partage, le sixième de tout le bien et le tiers du reste sont égaux.</p>
<p>Leur détail est le suivant :</p>
<p><strong>La première situation :</strong> que le partage lui soit plus avantageux que le tiers du reste et que le sixième du bien. Un exemple en est : un époux, un grand-père et un frère, parmi les cas où la part prescrite est de l'ordre de la moitié, et où les frères sont moins que le double de lui.</p>
<p>La raison de la détermination du partage dans ce cas est que le reste, après la moitié de l'époux, est l'autre moitié pour le grand-père et le frère ; et il n'y a aucun doute que sa moitié, qui est le quart (1/4), est plus que le tiers du reste et que le sixième ; mais le reste ne se divise pas entre le grand-père et le frère. On multiplie donc deux dans la base du calcul (Asl al-Mas'alah), qui est deux, et cela fait quatre : pour l'époux un multiplié par deux, soit deux ; et pour le grand-père et le frère un multiplié par deux, soit deux, un pour chacun.</p>

<p><strong>La deuxième situation :</strong> que le tiers du reste lui soit plus avantageux que le partage et que le sixième. Un exemple en est : une mère, un grand-père et cinq frères, parmi les cas où la part prescrite est inférieure à la moitié, et où les frères sont plus que le double de lui.</p>
<p>La raison de la détermination du tiers du reste dans ce cas est que le reste, après le sixième de la mère, est cinq pour le grand-père et les cinq frères ; son tiers est un et deux tiers (1 + 2/3), et cela est plus que le partage et que le sixième. Mais le reste n'a pas de tiers entier. On multiplie donc trois, qui est le dénominateur du tiers, dans la base du calcul, qui est six, et cela fait dix-huit : pour la mère, un de sa base multiplié par trois, soit trois ; et pour le grand-père, le tiers du reste est cinq, il reste donc dix pour les cinq frères, soit deux pour chacun.</p>

<p><strong>La troisième situation :</strong> que le sixième du bien lui soit plus avantageux que le partage et que le tiers du reste. Un exemple en est : un époux, une mère, un grand-père et deux frères, parmi les cas où la part prescrite est de l'ordre des deux tiers, et où les frères sont plus que le double de lui d'une unité, même s'il s'agit d'une femme.</p>
<p>La raison de la détermination du sixième dans ce cas est que le reste, après la moitié de l'époux et le sixième de la mère, est deux pour le grand-père et les deux frères ; et il n'y a aucun doute que le sixième est plus que le tiers du reste et que le partage, mais il reste une unité qui ne se divise pas entre les deux frères. On multiplie donc deux, le nombre de leurs têtes, dans la base du calcul, qui est six, et cela fait douze : pour l'époux, de sa base trois multiplié par deux, soit six ; pour la mère, de sa base un multiplié par deux, soit deux ; pour le grand-père, de sa base un multiplié par deux, soit deux ; et pour les frères, de leur base un multiplié par deux, soit deux, un pour chacun.</p>

<p><strong>La quatrième situation :</strong> que le partage et le tiers du reste lui soient égaux, et qu'ils lui soient plus avantageux que le sixième du bien. Un exemple en est : une mère, un grand-père et deux frères, parmi les cas où la part prescrite est inférieure à la moitié, et où les frères sont le double de lui.</p>
<p>La raison de l'égalité du partage et du tiers du reste est que le reste, après le sixième de la mère, est cinq pour le grand-père et les deux frères ; le tiers du reste est un et deux tiers (1 + 2/3), et cela est égal au partage. Mais il n'y a pas de tiers entier du reste. On multiplie donc trois, qui est le dénominateur du tiers, dans la base du calcul, qui est six, et cela fait dix-huit : pour la mère, un de sa base multiplié par trois, soit trois ; il reste quinze : pour le grand-père cinq, par le partage, ou parce que c'est le tiers du reste ; et pour les frères dix, soit cinq pour chacun.</p>

<p><strong>La cinquième situation :</strong> que le partage et le sixième du bien lui soient égaux, et qu'ils lui soient plus avantageux que le tiers du reste. Un exemple en est : un époux, une grand-mère, un grand-père et un frère, parmi les cas où la part prescrite est de l'ordre des deux tiers, et où les frères présents sont son égal.</p>
<p>La raison de l'égalité du partage et du sixième est que le reste, après la moitié de l'époux et le sixième de la grand-mère, est deux pour le grand-père et le frère : le grand-père a donc un par le partage, ou parce que c'est le sixième, et le frère a un.</p>

<p><strong>La sixième situation :</strong> que le sixième du bien et le tiers du reste lui soient égaux. Un exemple en est : un époux, un grand-père et trois frères, parmi les cas où la part prescrite est de l'ordre de la moitié, et où les frères sont plus que le double de lui.</p>
<p>La raison de l'égalité du sixième et du tiers du reste est que le reste, après la moitié de l'époux, est l'autre moitié pour le grand-père et les trois frères ; le sixième est donc de l'ordre du tiers du reste, mais le reste n'a pas de tiers entier. On multiplie donc le dénominateur du tiers, qui est trois, dans la base du calcul, qui est deux, et cela fait six : pour l'époux, de sa base un multiplié par trois, soit trois ; il reste trois, dont une pour le grand-père, et c'est le tiers du reste, et elle est égale au sixième du tout ; et pour les frères deux, et leurs têtes sont trois, elles ne se divisent pas et sont distinctes. On multiplie donc la valeur corrigée du calcul, six, par le nombre des têtes des frères, trois, et cela fait dix-huit : pour l'époux, de ce qui lui revient, trois multiplié par trois, soit neuf ; pour le grand-père, un multiplié par trois, soit trois ; et pour les frères, deux multiplié par trois, soit six, deux pour chacun.</p>

<p><strong>La septième situation :</strong> que les trois choses lui soient égales : le partage, le tiers du reste et le sixième du bien. Un exemple en est : un époux, un grand-père et deux frères, parmi les cas où la part prescrite est de l'ordre de la moitié, et où les frères sont le double de lui.</p>
<p>La raison de l'égalité des trois choses est que le reste, après la moitié de l'époux, est l'autre moitié pour le grand-père et les deux frères ; le tiers du reste, le partage et le sixième sont donc égaux, mais le reste n'a pas de tiers entier. On multiplie donc le dénominateur du tiers, qui est trois, dans la base du calcul, qui est deux, et cela fait six : pour l'époux, de sa base un multiplié par trois, soit trois ; il reste trois, dont une pour le grand-père dans tous les cas, et il reste deux pour les deux frères, un pour chacun.<a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a></p>

<p><strong>Un point utile :</strong> pour le grand-père, en considérant ce qui reste en surplus de la part prescrite, qu'il y en ait ou non, il y a quatre situations :</p>
<p><strong>La première situation :</strong> que le surplus après la part prescrite soit plus que le sixième ; le grand-père a alors le meilleur des trois choses : le partage, le tiers du reste et le sixième du bien.</p>
<p><strong>La deuxième situation :</strong> que reste l'équivalent du sixième ; c'est alors pour le grand-père à titre de part prescrite.</p>
<p><strong>La troisième situation :</strong> que reste moins que le sixième ; on fait alors subir le 'awl au grand-père afin qu'il ait le sixième complet.</p>
<p><strong>La quatrième situation :</strong> qu'il ne reste rien, parce que les parts prescrites épuisent la totalité du bien ; on fait alors subir le 'awl, au moyen du sixième, au grand-père.</p>
<p>Dans ces trois situations, les frères sont exclus, sauf la sœur dans Al-Akdariyyah, comme cela viendra.<a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a></p>
<p><strong>Un point utile :</strong> on donne au grand-père, dans certaines situations, le tiers du reste par analogie avec la mère dans Al-'Umariyyatân, car chacun des deux a un enfant ; et parce que, s'il n'y avait pas là d'héritier à part prescrite, il prendrait le tiers du bien ; et lorsque l'héritier à part prescrite a pris sa part prescrite, le grand-père prend le tiers du reste, et le reste revient aux frères, sans qu'on donne au grand-père le tiers complet, afin de ne pas léser les frères. Quant à la raison pour laquelle on lui donne le sixième, c'est qu'il n'est pas diminué en dessous de cela en présence de l'enfant, qui est plus fort ; en présence d'un autre, c'est donc d'autant plus vrai.<a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a></p>
