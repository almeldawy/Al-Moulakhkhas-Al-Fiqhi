<p><strong>Chapitre sur Al-Mu'âddah (le décompte des frères consanguins)</strong></p>
<p>⁕ Ce qui a précédé dans l'étude du grand-père et des frères et sœurs concerne le cas où il n'y a avec lui que l'une des deux catégories seulement : les frères et sœurs germains, ou les frères et sœurs consanguins. Quant au cas où il y a avec lui l'ensemble des deux catégories, c'est-à-dire des frères germains et des frères consanguins : les frères germains comptent contre le grand-père, au moyen d'eux [les consanguins] (Mu'âddah), lorsqu'ils en ont besoin. Puis, lorsque le grand-père a pris sa part, les germains reviennent sur les enfants du père et prennent ce qu'ils ont entre les mains ; et si la personne présente est une seule sœur germaine, elle prend le complément de sa part prescrite, et ce qui reste revient à l'enfant du père.</p>
<p>⁕ Le germain compte donc l'enfant du père contre le grand-père, en raison de leur union dans la fraternité du côté du père, et parce que le côté de la mère chez le germain est exclu par le grand-père ; ainsi l'enfant du père entre avec lui dans le calcul du partage avec le grand-père, afin que, de ce fait, [la part du grand-père] soit réduite du partage au tiers, ou au tiers du reste, ou au sixième de l'ensemble des biens.</p>
<p>⁕ De même, les enfants des deux parents n'ont compté les enfants du père contre le grand-père que parce qu'ils disent au grand-père : « Notre rang et leur rang sont, auprès de toi, un seul et même rang ; nous te disputons [la part] avec eux. » Puis ils disent aux enfants du père : « Vous n'héritez pas avec nous, et nous ne vous avons fait entrer avec nous dans le partage que pour exclure le grand-père ; nous prenons donc ce qui vous revient en propre, comme si le grand-père n'était pas avec nous. »<a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a></p>
<p><strong>Quand y a-t-il Al-Mu'âddah ?</strong></p>
<p>La Mu'âddah n'a lieu que lorsque les enfants des deux parents sont inférieurs au double du grand-père, et qu'après la part prescrite il reste plus que le quart ; s'ils sont le double [du grand-père] ou plus, il n'y a pas lieu à la Mu'âddah.</p>
<p><strong>Les cas de la Mu'âddah :</strong></p>
<p>Les cas de la Mu'âddah sont soixante-huit, et la raison de leur limitation à ce nombre est que les cas de Mu'âddah exigent nécessairement que les germains soient en nombre inférieur au double [du grand-père] ; et ce qui est inférieur au double se limite à cinq cas, qui sont : un grand-père et une germaine ; un grand-père et deux germaines ; un grand-père et trois germaines ; un grand-père, un germain et une germaine ; et il y a, avec ceux mentionnés dans ces cinq cas, du côté du père, celui qui complète le double ou moins que lui.</p>
<p>On conçoit avec la sœur germaine cinq cas, qui sont : une germaine et une sœur consanguine ; une germaine et deux sœurs consanguines ; une germaine et trois sœurs consanguines ; une germaine et un frère consanguin ; une germaine, un frère et une sœur consanguins.</p>
<p>Et on conçoit avec les deux sœurs germaines trois cas, qui sont : deux germaines et une sœur consanguine ; deux germaines et deux sœurs consanguines ; deux germaines et un frère consanguin.</p>
<p>Et on conçoit avec le frère germain trois cas, qui sont : un germain et une sœur consanguine ; un germain et deux sœurs consanguines ; un germain et un frère consanguin.</p>
<p>Et on conçoit avec les trois sœurs germaines un seul cas, qui est : trois germaines et une sœur consanguine.</p>
<p>Et on conçoit avec le frère germain et la sœur germaine un seul cas, qui est : un germain, une germaine et une sœur consanguine.</p>
<p>Le total de ces cas est de treize cas. Puis ils ne sont pas sans que, soit il n'y ait pas avec eux d'héritier à part prescrite, soit il y en ait un. Dans le second cas, la part prescrite est soit le quart, soit le sixième, soit le quart et le sixième, soit la moitié ; cela fait donc cinq situations<a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a>, que l'on multiplie par les treize cas, ce qui donne soixante-cinq.</p>
<p>Le soixante-sixième cas : qu'il y ait avec le grand-père et les frères et sœurs deux héritiers, l'un à la moitié et l'autre au sixième ; par exemple une fille, une fille du fils, un grand-père, une sœur germaine et une sœur consanguine.</p>
<p>Le soixante-septième : qu'il y ait avec eux des héritiers aux deux tiers ; par exemple deux filles, un grand-père, une germaine et une sœur consanguine.</p>
<p>Le soixante-huitième : qu'il y ait avec eux deux héritiers, l'un à la moitié et l'autre au huitième ; par exemple une fille, une épouse, un grand-père, une germaine et une sœur consanguine.</p>
<p><strong>Est-il concevable que les frères consanguins prennent quelque chose avec les germains dans un cas de Mu'âddah ?</strong></p>
<p>Quant au cas où il y a parmi les germains un mâle, ou bien deux germaines ou plus, il n'est pas concevable qu'il leur reste quoi que ce soit ; et s'il y a une seule germaine, elle [reçoit] ce qui complète la moitié, et s'il reste quelque chose, cela revient à l'enfant du père.</p>
<p>Parmi les cas où il reste quelque chose à l'enfant du père, il y a les quatre Zaydiyyât (Az-Zaydiyyât), [ainsi nommées] par rapport à Zayd, car c'est lui qui a jugé en elles. Ce sont :</p>
<ol type="1">
<li><p><strong>Al-'Ashriyyah :</strong> c'est [le cas de] un grand-père, une germaine et un frère consanguin. Sa base est de cinq, le nombre des têtes ; elle est rattachée à dix parce qu'elle se corrige à partir de dix. La raison de sa correction à partir de dix est que la germaine [reçoit] la moitié, et qu'il n'y a pas de moitié entière pour cinq ; on multiplie donc le dénominateur de la moitié, deux, par la base du cas, cinq, ce qui donne dix : le grand-père [reçoit] ses deux cinquièmes, soit quatre ; la sœur [reçoit] sa moitié, soit cinq ; il reste un, pour le frère consanguin.</p>

<li><p><strong>Al-'Ishrîniyyah :</strong> [ainsi nommée] par rapport à vingt, car elle se corrige à partir de vingt. C'est [le cas de] un grand-père, une germaine et deux sœurs consanguines. Sa base est de cinq, le nombre des têtes, comme celle qui précède : le grand-père en a deux parts par partage (muqâsamah), la germaine [reçoit] la moitié des biens, et il n'y a pas de moitié entière pour cinq ; on multiplie donc le dénominateur de la moitié, deux, par la base du cas, cinq, ce qui donne dix : le grand-père [reçoit] de sa base deux multiplié par deux, soit quatre ; la sœur [reçoit] la moitié, soit cinq ; il reste un pour les deux sœurs consanguines, [à partager] entre elles par moitié, et cela ne se divise pas entre elles ; on multiplie donc le nombre de leurs têtes, deux, par le chiffre auquel le cas se corrige, dix, ce qui donne vingt : le grand-père [reçoit] quatre multiplié par deux, soit huit ; la germaine, cinq multiplié par deux, soit dix ; les deux sœurs consanguines, un multiplié par deux, soit deux, une chacune.</p>

<p>Et tu peux dire à son sujet : sa base est de cinq ; le grand-père en a deux par partage ; la germaine [reçoit] la moitié, soit deux et demi ; il reste une demie pour les deux sœurs consanguines, un quart pour chacune ; le dénominateur du quart est quatre, que tu multiplies par la base du cas, cinq, ce qui donne vingt : le grand-père [reçoit] de sa base deux multiplié par quatre, soit huit ; la germaine [reçoit] la moitié, soit dix ; les deux sœurs consanguines, deux, une chacune.</p></li>
<li><p><strong>Mukhtasarat Zayd :</strong> c'est [le cas de] une mère, un grand-père, une germaine, un frère consanguin et une sœur consanguine. Elle a été ainsi nommée parce que sa correction est de cent huit en tenant compte du partage, et qu'elle se corrige par abréviation à partir de cinquante-quatre. Sa base était de six : à la mère un sixième, soit un ; il reste cinq pour le grand-père et les frères et sœurs, par partage, et leurs têtes sont de six, ce qui ne se divise pas ; on multiplie donc le nombre des têtes, six, par la base du cas, six, ce qui donne trente-six : à la mère, de sa base, un multiplié par six, soit six ; et le reste, cinq multiplié par six, soit trente, dont le grand-père [reçoit] par partage dix ; il reste vingt, dont la germaine [reçoit] la moitié des biens, soit dix-huit ; il reste deux pour le frère et la sœur consanguins, et leurs têtes sont de trois, ce qui ne se divise pas et est en disjonction ; on multiplie donc trois par trente-six, ce qui donne cent huit : à la mère, six multiplié par trois, soit dix-huit ; au grand-père, dix multiplié par trois, soit trente ; à la germaine, dix-huit multiplié par trois, soit cinquante-quatre ; au frère et à la sœur consanguins, deux multiplié par trois, soit six : quatre pour le frère et deux pour la sœur. Puis nous examinons, et nous trouvons entre les parts et le chiffre de correction du cas une concordance de moitié ; le cas revient donc à sa moitié, soit cinquante-quatre ; la part de la germaine revient à sa moitié, soit vingt-sept ; la part du grand-père revient à sa moitié, soit quinze ; la part du frère consanguin revient à sa moitié, soit deux ; et la part de la sœur consanguine revient à sa moitié, soit un.</p>

<li><p><strong>Tis'îniyyat Zayd :</strong> c'est [le cas de] une mère, un grand-père, une germaine, deux frères consanguins et une sœur consanguine. Elle a été ainsi nommée par rapport à quatre-vingt-dix, car elle se corrige à partir de lui. La raison de sa correction à partir de quatre-vingt-dix est que le plus avantageux pour le grand-père ici est le tiers du reste après le sixième de la mère ; sa base est donc de dix-huit si l'on prend en compte le tiers du reste avec le sixième ; et il est valable de prendre pour base six, dénominateur du sixième : à la mère un, il reste cinq, qui n'ont pas de tiers entier ; on multiplie donc le dénominateur du tiers, trois, par six, ce qui donne dix-huit : à la mère, de sa base, le sixième, soit un multiplié par trois, soit trois ; il reste quinze, dont le grand-père [reçoit] le tiers du reste, soit cinq ; la sœur germaine [reçoit] la moitié des biens, soit neuf ; il reste un pour les frères consanguins, qui ne se divise pas ; on multiplie donc le nombre de leurs têtes, cinq, par la base du cas ou par son chiffre de correction, dix-huit, ce qui donne quatre-vingt-dix, et à partir de lui [le cas] se corrige : à la mère, trois multiplié par cinq, soit quinze ; au grand-père, cinq multiplié par cinq, soit vingt-cinq ; à la sœur germaine, neuf multiplié par cinq, soit quarante-cinq ; aux frères consanguins, un multiplié par cinq, soit cinq : à chacun des deux frères deux, et à la femelle un.</p>

<p>Voilà ; et il reste ce que l'on appelle le calcul des héritages (Hisâb al-Mawârîth), qui se compose du chapitre du calcul, du chapitre des Munâsakhât, et du chapitre du partage des successions ; et cela relève des livres des Farâ'id.</p>
