<p><strong>Chapitre sur l'héritage de la grand-mère</strong></p>
<p>⁕ Ce que l'on entend ici par grand-mère est la grand-mère authentique (héritière), c'est-à-dire toute grand-mère rattachée au défunt uniquement par des femmes, comme la mère de la mère et ses ascendantes rattachées par des femmes pures, et comme la mère du père, ainsi que toute grand-mère rattachée uniquement par des hommes, comme la mère du père du père et la mère du père du père du père, ou rattachée par des femmes puis des hommes, comme la mère de la mère du père et la mère de la mère de la mère du père. Quant à la grand-mère rattachée par des hommes puis des femmes, comme la mère du père de la mère et la mère du père de la mère du père, celle-ci n'hérite pas, car elle fait partie des Dhawû al-Arhâm (les proches parents non héritiers à part prescrite ni agnats).</p>
<p>⁕ La règle de la grand-mère héritière est : celle qui se rattache par des femmes pures, ou par des hommes purs, ou par des femmes puis des hommes. Et la règle de la grand-mère non héritière est : celle qui se rattache par des hommes puis des femmes ; ou, en d'autres termes : celle qui se rattache par un homme placé entre deux femmes, dont elle est l'une d'elles.</p>
<p>⁕ La preuve de l'héritage de la grand-mère est la Sunna et le consensus (Ijmâ') :</p>
<ul>
<li>Quant à la Sunna, c'est notamment le hadith de Qabîsah ibn Dhu'ayb<a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a>. Il a dit : « Une grand-mère vint trouver Abû Bakr et lui demanda sa part d'héritage. Il dit : Tu n'as rien dans le Livre d'Allah, et je ne connais rien pour toi dans la Sunna du Messager d'Allah ﷺ ; retourne donc, jusqu'à ce que j'interroge les gens. Il interrogea les gens, et Al-Mughîrah ibn Shu'bah dit : J'étais présent lorsque le Messager d'Allah ﷺ lui a donné le sixième. Il dit : Y a-t-il quelqu'un d'autre avec toi ? Muhammad ibn Maslamah se leva et dit la même chose que ce qu'avait dit Al-Mughîrah ibn Shu'bah ; Abû Bakr la lui appliqua donc. » Il dit : « Puis l'autre grand-mère vint trouver 'Umar et lui demanda sa part d'héritage. Il dit : Tu n'as rien dans le Livre d'Allah, mais c'est ce sixième ; si vous êtes réunies, il sera partagé entre vous deux, et celle de vous deux qui reste seule l'aura pour elle. » Rapporté par les Cinq, sauf An-Nasâ'î, et At-Tirmidhî l'a jugé authentique. Et d'après Buraydah : « Le Prophète ﷺ a donné à la grand-mère le sixième lorsqu'il n'y a pas de mère en dessous d'elle. » Rapporté par Abû Dâwud, et Ibn as-Sakan, Ibn Khuzaymah et Ibn al-Jârûd l'ont jugé authentique<a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a>.</li>
</ul>
<p>Ces deux hadiths indiquent que la grand-mère a droit au sixième, et c'est - comme l'ont dit As-Siddîq et 'Umar (qu'Allah les agrée) : « elle n'a rien dans le Livre d'Allah » ; car la mère mentionnée dans le Livre d'Allah est liée par des restrictions qui imposent que le jugement soit propre à la mère proche (la mère directe). La grand-mère, même si elle est appelée mère, n'entre pas dans le terme « mère » mentionné dans les parts légales (Al-Farâ'id), même si elle entre dans le terme « les mères » dans la parole d'Allah le Très-Haut : ﴿حُرِّمَتْ عَلَيْكُمْ أُمَّهَاتُكُمْ﴾ [النساء: 23] ; mais le Messager d'Allah ﷺ lui a donné le sixième. Son héritage est donc établi par la Sunna.</p>
<ul>
<li>De même, son héritage est établi par le consensus des savants : il n'y a pas de divergence entre les gens de science sur l'héritage de la mère de la mère et de la mère du père, mais ils ont divergé sur les autres. Ibn 'Abbâs et un groupe de savants ont fait hériter les grands-mères même si elles sont nombreuses, lorsqu'elles sont au même degré, sauf celle qui se rattache par un ascendant non héritier, comme la mère du père de la mère. Certains d'entre eux ont fait hériter seulement trois grands-mères : la mère de la mère, la mère du père, et la mère du grand-père paternel.</li>
</ul>
<p>⁕ Pour que la grand-mère hérite, il est requis qu'il n'y ait pas de mère, car la grand-mère se rattache par elle ; et quiconque se rattache par un intermédiaire, cet intermédiaire l'exclut, sauf ce qui a été excepté. Cela est conforme au consensus des gens de science selon lequel la mère exclut la grand-mère de tous les côtés.</p>
<p><strong>La manière de faire hériter les grand-mères :</strong></p>
<p>⁕ Si une seule grand-mère est seule et qu'il n'y a pas de mère en dessous d'elle, elle prend le sixième comme cela a précédé, et elle n'a pas davantage ; et l'avis selon lequel elle a le tiers en l'absence d'enfant et en l'absence d'un groupe de frères est, à ce sujet, comme la mère, un avis isolé (Shâdhdh) sur lequel on ne s'appuie pas.</p>
<p>⁕ Et si l'on trouve un groupe de grand-mères : si elles sont égales en degré, elles se partagent le sixième, car les Compagnons les ont associées entre elles, et parce qu'elles sont des femmes de même nombre à qui aucun homme ne s'associe : leur grand nombre et leur unicité sont donc égaux, comme les épouses, et en raison de l'absence de ce qui donne la préférence à l'une d'elles. Quant à celle d'entre elles qui est plus proche du défunt, le sixième lui revient seule, qu'elle soit du côté de la mère ou du côté du père, et la plus éloignée est écartée ; car elles sont des mères qui héritent d'un même héritage, et lorsqu'elles sont réunies avec une différence de degré, l'héritage revient donc à la plus proche d'entre elles.</p>
<p>⁕ La grand-mère, mère du père, hérite en présence du père, et la grand-mère, mère du grand-père, hérite en présence du grand-père ; et celle qui se rattache par eux dans ce cas n'est pas exclue, contrairement à la règle selon laquelle celui qui se rattache par un intermédiaire est exclu par cet intermédiaire, d'après ce que rapporte Ibn Mas'ûd (qu'Allah l'agrée) : au sujet de la grand-mère avec son fils, il a dit : « C'est la première grand-mère à qui le Messager d'Allah ﷺ a fait donner nourriture : un sixième avec son fils, alors que son fils était vivant. » Rapporté par At-Tirmidhî<a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a>. Et la raison en est qu'elle n'hérite pas de l'héritage de celui par qui elle se rattache, au point d'être exclue par lui s'il existe.</p>
<p>Le Cheikh de l'Islam Ibn Taymiyyah (qu'Allah lui fasse miséricorde) a dit<a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a> : « La parole de celui qui dit : "Celui qui se rattache à une personne est exclu par elle" est invalide, dans le sens direct comme dans le sens inverse : invalide dans le sens direct, comme l'enfant de la mère avec la mère, et dans le sens inverse, comme les enfants du fils avec leur oncle paternel et les enfants du frère avec leur oncle paternel, et leurs semblables, parmi ce en quoi une personne est exclue par une personne par laquelle elle ne se rattache pas. La raison est plutôt qu'elle (la grand-mère) hérite de son héritage ; or quiconque hérite de l'héritage d'une personne est exclu par elle lorsqu'elle est plus proche que lui. Les grand-mères tiennent la place de la mère et sont donc exclues par elle, même si elles ne se rattachent pas par elle. Et Allah sait mieux. »</p>
