<p><strong>Chapitre sur les règles des testaments (Al-Wasâyâ)</strong></p>
<p>⁕ Le testament (Al-Wasiyyah) est, en langue, un terme dérivé de « wassaytu ash-shay' » lorsque je l'ai joint (wasaltuhu) ; il a été ainsi nommé parce qu'il relie ce qui a eu lieu durant la vie à ce qui a lieu après la mort ; car le testateur (Al-Mûsî) a relié une part des actes de disposition qui lui sont permis durant sa vie à ce qui suit sa mort, afin qu'elle se poursuive après son décès.</p>
<p>⁕ Et le testament (Al-Wasiyyah), dans la terminologie des juristes, est : l'ordre de disposer [d'un bien] après la mort ; ou, en d'autres termes : c'est la libéralité en biens après la mort.</p>
<p>⁕ Et la preuve de sa légitimité est : le Livre, la Sunna et le consensus (Ijmâ').</p>
<ul>
<li>Allah le Très-Haut a dit :</li>
</ul>
<p class="ar">﴿كُتِبَ عَلَيْكُمْ إِذَا حَضَرَ أَحَدَكُمُ الْمَوْتُ إِنْ تَرَكَ خَيْرًا الْوَصِيَّةُ لِلْوَالِدَيْنِ وَالْأَقْرَبِينَ بِالْمَعْرُوفِ حَقًّا عَلَى الْمُتَّقِينَ﴾ [البقرة: 180]</p>
<p>« Il vous est prescrit, quand la mort se présente à l'un de vous, s'il laisse des biens, de faire un testament en faveur de ses père et mère et de ses plus proches, conformément à l'usage ; c'est un devoir pour les pieux. » [Sourate Al-Baqarah : 180].</p>
<p>Et Il, le Très-Haut, a dit :</p>
<p class="ar">﴿مِنْ بَعْدِ وَصِيَّةٍ يُوصِي بِهَا أَوْ دَيْنٍ﴾ [النساء: 11]</p>
<p>« après exécution du testament qu'il aurait fait ou [acquittement] d'une dette » [Sourate An-Nisâ' : 11].</p>
<ul>
<li>Et le Prophète ﷺ a dit :</li>
</ul>
<p class="ar">«إِنَّ اللهَ تَصَدَّقَ عَلَيْكُمْ بِثُلُثِ أَمْوَالِكُمْ عِنْدَ وَفَاتِكُمْ زِيَادَةً فِي أَعْمَالِكُمْ»</p>
<p>« Allah a fait l'aumône de vous accorder, au moment de votre mort, le tiers de vos biens, en supplément à vos œuvres. »<a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a></p>
<ul>
<li>Et les savants ont réalisé le consensus sur sa permission.</li>
</ul>
<p>⁕ Et le testament est tantôt obligatoire, tantôt recommandé :</p>
<ul>
<li>Le testament est obligatoire pour ce qui est dû à la personne et ce qu'elle doit, parmi les droits qui ne sont pas établis par des preuves écrites, afin que cela ne se perde pas. Le Prophète ﷺ a dit :</li>
</ul>
<p class="ar">«مَا حَقُّ امْرِئٍ مُسْلِمٍ لَهُ شَيْءٌ يُوصِي بِهِ يَبِيتُ لَيْلَتَيْنِ؛ إِلَّا وَوَصِيَّتُهُ مَكْتُوبَةٌ عِنْدَهُ»</p>
<p>« Il n'appartient pas à un musulman qui a quelque chose dont il veut faire un testament de passer deux nuits sans que son testament soit écrit auprès de lui. »<a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a> Si donc il détient des dépôts appartenant à des gens, ou si des droits à leur profit pèsent sur lui, il doit les écrire et les expliciter.</p>
<ul>
<li>Et le testament est recommandé lorsqu'il consiste à léguer une part de son bien, qui sera dépensée dans les voies du bien et de la bienfaisance, afin que sa récompense lui parvienne après sa mort ; car le Législateur lui a permis de disposer, à la mort, du tiers du bien ; et cela fait partie de la bienveillance d'Allah envers Ses serviteurs, afin de multiplier pour eux les bonnes œuvres.</li>
</ul>
<p>⁕ Et le testament est valable même de la part de l'enfant doué de raison, de même que la prière est valable de sa part ; et il est établi par le témoignage et par l'écrit connu, de l'écriture du testateur.</p>
<p>⁕ Et parmi les règles du testament : il est permis dans la limite du tiers du bien ou moins ; et certains savants jugent recommandé qu'il n'atteigne pas le tiers ; car il est rapporté d'Abû Bakr As-Siddîq, de 'Alî Ibn Abî Tâlib et de 'Abdullâh Ibn 'Abbâs (qu'Allah les agrée) :</p>
<ul>
<li><p>Abû Bakr (qu'Allah l'agrée) a dit : « Je me contente de ce dont Allah s'est contenté pour Lui-même » ; c'est-à-dire, dans Sa parole, le Très-Haut : ﴿وَاعْلَمُوا أَنَّمَا غَنِمْتُمْ مِنْ شَيْءٍ فَأَنَّ لِلَّهِ خُمُسَهُ﴾ [الأنفال: 41] [« Sachez que tout butin que vous aurez pris, le cinquième appartient à Allah » (Sourate Al-Anfâl : 41)].</p></li>
<li><p>Et 'Alî (qu'Allah l'agrée) a dit : « Que je fasse un testament du cinquième m'est plus cher que de le faire du quart. »</p></li>
<li><p>Et Ibn 'Abbâs (qu'Allah l'agrée) a dit : « Si seulement les gens réduisaient du tiers au quart » ; car le Messager d'Allah ﷺ a dit : « Le tiers, et le tiers est beaucoup. »<a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a></p></li>
</ul>
<p>⁕ Et le testament n'est pas permis pour plus du tiers en faveur de celui qui a un héritier ; sauf par l'approbation des héritiers ; car ce qui dépasse le tiers est un droit qui leur appartient ; s'ils approuvent donc l'excédent, cela est valable ; et leur approbation est prise en considération pour lui après la mort.</p>
<p>⁕ Et parmi les règles des testaments : qu'ils ne sont pas valables en faveur de l'un des héritiers ; en raison de sa parole ﷺ :</p>
<p class="ar">«لَا وَصِيَّةَ لِوَارِثٍ»</p>
<p>« Pas de testament en faveur d'un héritier. » Rapporté par Ahmad, Abû Dâwud et At-Tirmidhî, qui l'a jugé bon (hasan) ; et il a des témoignages concordants<a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a>. Et Shaykh Taqî ad-Dîn a dit : « La communauté s'est accordée dessus. » Et Ash-Shâfi'î a mentionné qu'il est mutawâtir (rapporté par un grand nombre de voies), et il a dit : « Nous avons trouvé les gens de la fatwa et ceux dont nous avons retenu [la science] parmi les gens de science en matière de campagnes militaires (maghâzî), parmi les Quraysh et autres, qui ne divergent pas sur le fait que le Prophète ﷺ a dit, l'année de la conquête : "Pas de testament en faveur d'un héritier", et ils le rapportent de ceux qu'ils ont rencontrés parmi les gens de science » ; sauf si les héritiers approuvent le testament en faveur de l'héritier ; il n'est alors valable que parce que le droit leur appartient ; et la validité de leur approbation est prise en considération pour l'excédent sur le tiers pour un non-héritier, et leur approbation du testament en faveur de l'héritier lorsque l'approbation émane d'eux durant la maladie dont meurt le testateur ou après son décès...</p>
<p>⁕ Et parmi les règles du testament : qu'il n'est recommandé que pour celui qui possède beaucoup de biens et dont les héritiers ne sont pas dans le besoin ; en raison de Sa parole, le Très-Haut : ﴿كُتِبَ عَلَيْكُمْ إِذَا حَضَرَ أَحَدَكُمُ الْمَوْتُ إِنْ تَرَكَ خَيْرًا الْوَصِيَّةُ﴾ [البقرة: 180] [« Il vous est prescrit, quand la mort se présente à l'un de vous, s'il laisse des biens, de faire un testament » (Sourate Al-Baqarah : 180)], et le « bien » (al-khayr), dans l'usage, est la grande richesse ; le testament est donc détesté de la part de celui dont le bien est peu abondant et dont les héritiers sont dans le besoin ; car il se serait ainsi détourné de ses proches parents nécessiteux au profit d'étrangers ; et en raison de la parole du Prophète ﷺ à Sa'd Ibn Abî Waqqâs : « Que tu laisses tes héritiers riches vaut mieux que de les laisser dans la pauvreté, tendant la main aux gens »<a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a>. Et Ash-Sha'bî a dit : « Il n'est aucun bien dont la récompense soit plus grande que le bien qu'un homme laisse à ses enfants et par lequel il les rend indépendants des gens. » Et 'Alî a dit à un homme : « Tu n'as laissé qu'un peu de chose ; laisse-le donc à tes héritiers. » Et beaucoup de Compagnons du Prophète ﷺ n'ont pas fait de testament.</p>
<p>⁕ Et si l'intention du testateur est de nuire à l'héritier et de le mettre dans la gêne, cela lui est interdit et il commet un péché par là ; en raison de Sa parole, le Très-Haut : ﴿غَيْرَ مُضَارٍّ﴾ [النساء: 12] [« sans préjudice [pour les héritiers] » (Sourate An-Nisâ' : 12)] ; et dans le hadith : « Certes, l'homme accomplit l'œuvre de l'obéissance à Allah pendant soixante ans, puis la mort se présente à lui, et il porte préjudice [aux héritiers] dans le testament, et le Feu lui devient obligatoire. »<a href="#fn6" class="footnote-ref" id="fnref6" role="doc-noteref"><sup>6</sup></a> Et Ibn 'Abbâs a dit : « Le préjudice dans le testament fait partie des grands péchés. »</p>
<p>L'imam Ash-Shawkânî (qu'Allah lui fasse miséricorde) a dit : « Sa parole : ﴿غَيْرَ مُضَارٍّ﴾ (« sans préjudice ») ; c'est-à-dire : qu'il fasse un testament alors qu'il ne porte pas préjudice à ses héritiers par une quelconque forme de préjudice ; par exemple qu'il reconnaisse [devoir] une chose qui n'est pas à sa charge, ou qu'il fasse un testament dont il n'a pas d'autre but que de porter préjudice aux héritiers, ou qu'il fasse un testament en faveur d'un héritier de façon absolue, ou en faveur d'un autre avec un excédent sur le tiers que les héritiers n'ont pas approuvé ; et cette restriction, je veux dire sa parole : ﴿غَيْرَ مُضَارٍّ﴾, se rapporte au testament et à la dette mentionnés ; elle est donc une restriction pour les deux ; ainsi, ce qui émane de reconnaissances de dettes ou de testaments interdits, ou ceux dont le propriétaire n'a d'autre but que de porter préjudice à ses héritiers, est nul et rejeté ; rien n'en est exécuté, ni le tiers ni moins. » Fin de la parole d'Ash-Shawkânî (qu'Allah lui fasse miséricorde).</p>
<p>⁕ Et parmi les règles des testaments : la permission de faire un testament portant sur la totalité du bien en faveur de celui qui n'a pas d'héritier ; en raison de la parole du Prophète ﷺ : « Que tu laisses tes héritiers riches vaut mieux que de les laisser dans la pauvreté, tendant la main aux gens »<a href="#fn7" class="footnote-ref" id="fnref7" role="doc-noteref"><sup>7</sup></a> ; et cela est rapporté d'Ibn Mas'ûd (qu'Allah l'agrée), et un groupe de savants l'a soutenu ; car l'interdiction du testament pour ce qui excède le tiers est à cause du droit des héritiers ; or, s'ils font défaut, l'empêchement a disparu ; puisqu'aucun droit d'héritier ni de créancier n'y est rattaché ; cela ressemble donc à ce qu'il aurait donné en aumône de ses biens durant son état de santé.</p>
<p>L'imam Ibn al-Qayyim<a href="#fn8" class="footnote-ref" id="fnref8" role="doc-noteref"><sup>8</sup></a> a dit : « Le [point de vue] authentique est que cela lui est permis ; car le Législateur ne l'a interdit pour ce qui excède le tiers que s'il a des héritiers ; or celui qui n'a pas d'héritier ne peut être contesté pour ce qu'il a fait de son bien... » Fin de la parole d'Ibn al-Qayyim.</p>
<p>⁕ Et parmi les règles des testaments : que si le tiers du bien du testateur ne suffit pas pour les [legs] qu'il a faits et que les héritiers n'approuvent pas l'excédent sur le tiers, la diminution touche l'ensemble au prorata, et ils se partagent donc [le tiers] proportionnellement ; et il n'y a pas de différence entre celui qui est mentionné en premier et celui qui l'est en dernier ; car ils sont tous des libéralités après la mort, devenues obligatoires en une seule fois ; leurs bénéficiaires sont à égalité quant au principe et diffèrent quant au montant ; le partage proportionnel est donc devenu obligatoire ; comme les cas de ‘Awl (réduction proportionnelle des parts) dans les parts légales (Al-Farâ'id) lorsqu'elles excèdent la base du calcul (Asl al-Mas'alah).</p>
<p>Exemple de cela : s'il a légué cent riyals à une personne, cent riyals à une autre, cinquante riyals à une troisième, trente riyals à une quatrième et vingt riyals à une cinquième, alors que le tiers de son bien n'est que de cent riyals, et que le total des testaments est de trois cents riyals : si tu rapportes le montant du tiers au montant total des testaments, il en représente le tiers ; on donne donc à chacun le tiers de ce qui lui a été légué, et rien de plus.</p>
<p>⁕ Et parmi les règles des testaments : que ce qui est pris en considération, pour sa validité et son invalidité, est l'état au moment de la mort ; si donc il a fait un testament en faveur d'un héritier et qu'il est devenu, au moment de la mort, un non-héritier ; comme un frère exclu par un fils qui est venu à exister ; le testament est valable, en considération de l'état au moment de la mort ; car c'est l'état dans lequel se réalise le transfert à l'héritier et au légataire ; et inversement, s'il a fait un testament en faveur d'un non-héritier et qu'il est devenu, au moment de la mort, un héritier, le testament n'est pas valable ; comme s'il avait fait un testament en faveur de son frère alors que son fils existait au moment du testament, puis que son fils est mort : le testament est alors nul, si les héritiers ne l'approuvent pas ; car son frère est devenu, au moment de la mort, un héritier.</p>
<p>Et il en découle aussi, pour cette règle, que l'acceptation du testament n'est pas valable et que le légataire (Al-Mûsâ lahu) ne possède pas le bien légué (al-'ayn) avant la mort du testateur ; car c'est le moment où son droit est établi ; et l'acceptation n'est pas valable avant la mort du testateur.</p>
<p>Al-Muwaffaq<a href="#fn9" class="footnote-ref" id="fnref9" role="doc-noteref"><sup>9</sup></a> a dit : « Nous ne connaissons pas de divergence entre les gens de science sur le fait que la prise en considération du testament [se fait] à la mort ; même si le testament est fait en faveur d'une personne non déterminée, comme les pauvres et les nécessiteux, ou en faveur de ceux dont on ne peut pas dénombrer les membres, comme les Banû Tamîm, ou pour un intérêt, comme les mosquées ; il n'a pas besoin d'une acceptation, et il devient obligatoire par la seule mort ; mais s'il est en faveur d'une personne déterminée, il devient obligatoire par l'acceptation après la mort. »</p>
<p>⁕ Et parmi les règles du testament : qu'il est permis au testateur de revenir sur lui, de l'annuler ou de revenir sur une partie de celui-ci ; en raison de la parole de 'Umar : « L'homme modifie de son testament ce qu'il veut » ; et cela fait l'objet d'un accord entre les gens de science. S'il dit donc : « Je suis revenu sur mon testament », ou : « Je l'ai annulé », ou autre formule semblable ; il est annulé ; car il a été établi précédemment que la prise en considération se fait selon l'état au moment de la mort du testateur quant à l'acceptation et au caractère contraignant du testament ; de même, il est permis au testateur de revenir sur lui durant sa vie. Si, par exemple, il dit : « Si Zayd arrive, il aura ce que j'ai légué à 'Amr. » Et que Zayd arrive durant la vie du testateur, le testament est alors pour [Zayd], et le testateur est ainsi revenu sur le testament en faveur de 'Amr ; et si Zayd n'arrive qu'après le décès du testateur, le testament est pour 'Amr ; car, lorsque le testateur est mort avant son arrivée, le testament s'est stabilisé pour le premier, c'est-à-dire 'Amr.</p>
<p>⁕ Et parmi les règles du testament : que l'on prélève sur la succession du défunt, en premier lieu, ce qui est obligatoire parmi les dettes, les obligations légales comme la zakât, le pèlerinage (Hajj), les vœux et les expiations, même s'il n'en a pas été fait de testament ; en raison de Sa parole, le Très-Haut : ﴿مِنْ بَعْدِ وَصِيَّةٍ يُوصِي بِهَا أَوْ دَيْنٍ﴾ [النساء: 11] [« après exécution du testament qu'il aurait fait ou [acquittement] d'une dette » (Sourate An-Nisâ' : 11)], et en raison de la parole de 'Alî (qu'Allah l'agrée) : « Le Messager d'Allah ﷺ a jugé que la dette passe avant le testament. » Rapporté par At-Tirmidhî, Ahmad et d'autres<a href="#fn10" class="footnote-ref" id="fnref10" role="doc-noteref"><sup>10</sup></a> ; cela indique donc que la dette est placée avant le testament ; et dans le « Sahîh » : « Acquittez [la dette due à] Allah ; car Allah est plus en droit qu'on s'acquitte [envers Lui]. »<a href="#fn11" class="footnote-ref" id="fnref11" role="doc-noteref"><sup>11</sup></a> On commence donc par la dette, puis le testament, puis l'héritage ; par consensus (Ijmâ').</p>
<p>Et la sagesse dans le fait de placer en premier la mention du testament avant la dette dans le noble verset, bien qu'il soit retardé dans l'exécution, est la suivante : puisque l'héritage ressemble au testament en ce qu'il est sans contrepartie, la sortie [du bien] est pénible pour l'héritier ; il a donc été placé en premier dans la mention, afin d'inciter à le faire sortir et en signe d'attention à son égard ; et il a été employé le mot « ou » (aw), qui sert à marquer l'égalité, afin qu'ils soient à égalité quant à l'attention [à y porter], même si la dette lui est préalable.</p>
<p>⁕ Et de là, l'affaire du testament est importante ; car Allah l'a mise en valeur dans Son noble Livre, l'a placée avant les autres dans la mention, par attention pour elle, et a incité à son exécution, tant qu'elle se conforme à la voie légale ; et Allah a menacé celui qui la traite avec négligence, la modifie ou la change sans motif légitime ; Il a dit, Gloire à Lui :</p>
<p class="ar">﴿فَمَنْ بَدَّلَهُ بَعْدَمَا سَمِعَهُ فَإِنَّمَا إِثْمُهُ عَلَى الَّذِينَ يُبَدِّلُونَهُ إِنَّ اللَّهَ سَمِيعٌ عَلِيمٌ﴾ [البقرة: 181]</p>
<p>« Quiconque le modifie après l'avoir entendu, le péché en incombera à ceux qui l'auront modifié. Allah est Audient et Omniscient. » [Sourate Al-Baqarah : 181].</p>
<p>L'imam Ash-Shawkânî a dit dans son Tafsîr : « Et la modification (at-tabdîl) est le changement (at-taghyîr) ; et ceci est une menace pour celui qui change un testament conforme à la vérité, dans lequel il n'y a ni déviation ni préjudice ; et le péché retombera sur lui ; et rien de cela n'incombe au testateur ; il s'est en effet délivré de ce qui lui incombait par le testament... » Fin de citation.</p>
<p>⁕ Et parmi les règles du testament : sa validité pour toute personne dont la possession est valable, qu'elle soit musulmane ou mécréante ; en raison de Sa parole, le Très-Haut : ﴿إِلَّا أَنْ تَفْعَلُوا إِلَى أَوْلِيَائِكُمْ مَعْرُوفًا﴾ [الأحزاب: 6] [« à moins que vous ne fassiez un bienfait à vos alliés » (Sourate Al-Ahzâb : 6)] ; Muhammad Ibn al-Hanafiyyah a dit : « C'est le testament du musulman en faveur du juif et du chrétien. » Et 'Umar Ibn al-Khattâb (qu'Allah l'agrée) a habillé un frère à lui qui était polythéiste ; et Asmâ' a entretenu les liens avec sa mère, qui se détournait de l'islam ; et Safiyyah, la mère des croyants, a fait un testament du tiers [de son bien] en faveur d'un frère à elle qui était juif ; et en raison de Sa parole, le Très-Haut : ﴿لَا يَنْهَاكُمُ اللَّهُ عَنِ الَّذِينَ لَمْ يُقَاتِلُوكُمْ فِي الدِّينِ وَلَمْ يُخْرِجُوكُمْ مِنْ دِيَارِكُمْ أَنْ تَبَرُّوهُمْ وَتُقْسِطُوا إِلَيْهِمْ إِنَّ اللَّهَ يُحِبُّ الْمُقْسِطِينَ﴾ [الممتحنة] [« Allah ne vous interdit pas d'être bons et équitables envers ceux qui ne vous ont pas combattus pour la religion et ne vous ont pas expulsés de vos demeures. Allah aime les équitables. » (Sourate Al-Mumtahanah)].</p>
<p>⁕ Et le testament du musulman en faveur du mécréant déterminé n'est valable que comme il a été rapporté ; quant au mécréant non déterminé, le testament n'est pas valable en sa faveur ; comme s'il avait fait un testament en faveur des juifs, des chrétiens ou de leurs pauvres ; et de même, le testament n'est pas valable en faveur du mécréant déterminé pour ce qu'il n'est pas permis de lui faire posséder ni de lui donner [en pouvoir] ; comme le Mushaf, l'esclave musulman ou l'arme.</p>
<p>⁕ Et le testament est valable en faveur d'un enfant conçu dont l'existence est avérée avant la formulation du testament ; et cela se connaît par le fait que sa mère l'ait mis au monde avant l'achèvement de six mois depuis la formulation du testament, si elle avait un époux ou un maître, ou qu'elle l'ait mis au monde en moins de quatre ans si elle n'avait ni époux ni maître ; car un tel enfant conçu hérite ; le testament en sa faveur est donc valable à plus forte raison ; et s'il est mis au monde mort, le testament est nul.</p>
<p>Et le testament n'est pas valable en faveur d'un enfant conçu qui n'existe pas à ce moment-là ; comme s'il disait : « J'ai fait un testament en faveur de celui dont cette femme sera enceinte » ; car c'est un testament en faveur d'un inexistant.</p>
<p>⁕ Et s'il a fait un testament portant sur une somme importante afin qu'on accomplisse le pèlerinage (Hajj) à sa place ; on affecte alors, sur celle-ci, un pèlerinage après un autre jusqu'à épuisement ; et si la somme est faible, on accomplit le pèlerinage avec elle depuis l'endroit où elle suffit ; et s'il a stipulé que la somme importante soit entièrement dépensée pour un seul pèlerinage, on la dépense pour un seul pèlerinage ; car son intention par là est de procurer un bénéfice à celui qui accomplira le pèlerinage ; et le pèlerinage du légataire testamentaire (Al-Wasî) ou de l'héritier n'est pas valable à sa place dans ces situations ; car le testateur a visé, en apparence, quelqu'un d'autre qu'eux.</p>
<p>⁕ Et le testament n'est pas valable en faveur de celui à qui il n'est pas valable de faire posséder ; comme le djinn, la bête et le mort.</p>
<p>⁕ Et le testament n'est pas valable pour une cause de désobéissance ; comme le testament en faveur des églises, des temples de la mécréance et des lieux de culte des polythéistes, et comme le testament pour la construction de mausolées, pour leur éclairage ou pour leur service, que le testateur soit musulman ou mécréant.</p>
<p>Le Shaykh de l'Islam Ibn Taymiyyah a dit : « Si le dhimmî a immobilisé [en waqf] quelque chose de son bien sur leurs lieux de culte, il n'est pas permis aux musulmans de juger de sa validité ; car il ne leur est pas permis de juger autrement que par ce qu'Allah a révélé ; et parmi ce qu'Allah a révélé, il y a qu'on ne s'entraide pas dans quoi que ce soit de la mécréance, de la perversité et de la désobéissance ; comment donc s'entraideraient-ils par l'immobilisation [en waqf] sur les lieux où l'on commet la mécréance ?!?! »</p>
<p>Et le testament n'est pas valable pour l'impression des livres abrogés, comme la Torah et l'Évangile, ni pour l'impression des livres déviés, comme les livres de l'hérésie (zandaqah) et de l'athéisme.</p>
<p>⁕ Et parmi les règles du testament : on pose comme condition que le bien légué (Al-Mûsâ bihi) soit un bien ou un usage permis, même s'il fait partie de ce qu'on est incapable de livrer ; comme l'oiseau dans l'air, l'enfant conçu dans le ventre et le lait dans le pis ; ou qu'il soit inexistant ; comme s'il avait fait un testament portant sur ce que son animal portera, ou sur le fruit de son arbre, à jamais ou pendant une durée déterminée comme une année ; si quelque chose de l'inexistant se réalise, cela revient au légataire ; et si rien ne se réalise, le testament est nul ; car il n'a pas rencontré d'objet.</p>
<p>⁕ Et le testament est valable pour un objet indéterminé ; comme s'il a fait un testament portant sur un esclave ou un mouton ; on donne alors au légataire ce que le nom désigne, au sens propre ou selon l'usage.</p>
<p>⁕ Et parmi les règles des testaments : s'il a fait un testament portant sur le tiers de son bien, puis qu'il a acquis des biens après le testament ; ils entrent dans le testament ; car le tiers n'est pris en considération, à la mort, que sur le bien existant à ce moment-là.</p>
<p>⁕ Parmi les règles des testaments : s'il a fait un testament en faveur d'une personne portant sur une chose déterminée de son bien, et que cette chose déterminée a péri avant la mort du testateur ou après elle, le testament est nul ; en raison de la disparition du droit du légataire par la perte de ce qui a fait l'objet du testament en sa faveur.</p>
<p>⁕ Parmi les règles des testaments : s'il n'a pas précisé le montant du bien légué ; comme s'il a fait un testament portant sur une « part » (sahm) de son bien ; elle est alors interprétée comme le sixième ; car la « part » dans le langage des Arabes est le sixième, et c'est ce qu'ont dit 'Alî et Ibn Mas'ûd ; et parce que le sixième est la plus petite part prescrite ; le testament s'oriente donc vers lui ; et s'il a fait un testament portant sur quelque chose de son bien sans en préciser le montant, l'héritier donne au légataire ce qu'il veut parmi ce qui a valeur de bien ; car la chose n'a pas de limite, ni dans la langue ni dans la législation ; cela s'applique donc à la plus petite des choses qui a valeur de bien ; et ce qui n'a pas valeur de bien ne réalise pas le but visé. Et Allah sait mieux.</p>
<p><strong>Les règles relatives au mandataire testamentaire (le superviseur du testament et autres) :</strong></p>
<p>⁕ Le mandataire testamentaire (Al-Mûsâ ilayhi) est celui qui est chargé de disposer, après la mort, des biens et autres choses dont le testateur pouvait disposer durant sa vie, et la représentation (an-niyâbah) y entre ; car le mandataire testamentaire est un représentant du testateur en cela.</p>
<p>⁕ Et l'entrée du mandataire testamentaire dans cette représentation et son acceptation de celle-ci sont recommandées et un rapprochement [d'Allah] pour lequel on est récompensé ; mais cela est prescrit à celui qui en a la capacité pour l'œuvre et qui sent en lui-même la fiabilité en matière de dépôt ; en raison de Sa parole, le Très-Haut : ﴿وَتَعَاوَنُوا عَلَى الْبِرِّ وَالتَّقْوَى﴾ [المائدة: 2] [« Entraidez-vous dans l'accomplissement du bien et de la piété » (Sourate Al-Mâ'idah : 2)], et de sa parole ﷺ : « Allah est en aide au serviteur tant que le serviteur est en aide à son frère. »<a href="#fn12" class="footnote-ref" id="fnref12" role="doc-noteref"><sup>12</sup></a> Et en raison de l'action des Compagnons (qu'Allah les agrée) : un groupe de Compagnons a fait un testament en faveur d'Az-Zubayr (qu'Allah l'agrée) ; Abû 'Ubaydah a fait un testament en faveur de 'Umar (qu'Allah l'agrée) ; et 'Umar a fait un testament en faveur de sa fille Hafsah (qu'Allah l'agrée), puis des aînés de ses enfants.</p>
<p>Quant à celui qui n'a pas la force d'assumer le testament, ou qui n'a pas confiance en lui-même pour le préserver, il ne lui est pas permis d'entrer dans le mandat testamentaire.</p>
<p>⁕ Et l'on pose comme condition, pour le mandataire testamentaire, qu'il soit musulman ; le testament n'est donc pas valable en faveur d'un mécréant.</p>
<p>⁕ Et l'on pose aussi comme condition qu'il soit astreint aux obligations légales (mukallaf) ; le testament en faveur d'un enfant n'est donc pas valable, ni en faveur d'un fou, ni d'un faible d'esprit ; car ceux-ci ne font pas partie des gens de tutelle et de disposition ; mais la subordination du testament à la puberté d'un enfant est valable ; en raison de sa parole ﷺ : « Votre émir est Zayd ; s'il est tué, [ce sera] Ja'far. »<a href="#fn13" class="footnote-ref" id="fnref13" role="doc-noteref"><sup>13</sup></a></p>
<p>⁕ Et le testament en faveur de la femme est valable lorsqu'elle a la compétence pour s'occuper des affaires du testament ; car 'Umar (qu'Allah l'agrée) a fait un testament en faveur de Hafsah (qu'Allah l'agrée) ; et parce que la femme fait partie des gens du témoignage ; le testament en sa faveur est donc valable comme pour l'homme.</p>
<p>⁕ Et le testament est valable en faveur de celui qui n'est pas capable d'accomplir le travail, mais qui possède une bonne réflexion ; et on lui adjoint une personne capable et digne de confiance qui l'aide.</p>
<p>⁕ Et il est valable de faire un testament en faveur de plus d'une personne, qu'il ait fait un testament en leur faveur en une seule fois ou qu'il ait fait un testament en faveur de l'un d'eux après l'autre, s'il n'a pas destitué le premier.</p>
<p>⁕ Et s'il a fait un testament en faveur d'un groupe, ils sont associés dans le travail, et aucun d'eux n'a, dans le testament, le pouvoir de disposer à l'exclusion de l'autre ; et si l'un d'eux meurt ou s'absente, le juge (Al-Hâkim) place à sa place quelqu'un qui convient.</p>
<p>⁕ Et l'acceptation par le mandataire testamentaire du testament est valable durant la vie du testateur et après sa mort ; et il a la possibilité de se destituer lui-même quand il le veut, durant la vie du testateur et après sa mort ; et le testateur a aussi la possibilité de destituer le mandataire testamentaire quand il le veut ; car c'est un mandataire (wakîl).</p>
<p>⁕ Et il n'est pas permis au mandataire testamentaire de faire un testament en faveur d'un autre ; sauf si cela lui a été confié, de sorte que le testateur lui ait permis de faire un testament en faveur d'un autre quand il le veut ; par exemple s'il dit : « Je t'ai permis de faire un testament en faveur de qui tu voudras. »</p>
<p>⁕ Et l'on pose comme condition, pour la validité du testament, qu'il porte sur un acte de disposition connu ; afin que le mandataire testamentaire sache ce qui lui a été confié, de sorte qu'il se charge de le préserver et d'en disposer.</p>
<p>⁕ Et l'on pose aussi comme condition que l'acte de disposition faisant l'objet du testament fasse partie de ce qu'il est valable pour le testateur d'accomplir lui-même ; comme l'acquittement de ses dettes, la répartition de son tiers, la supervision de ses enfants en bas âge... et autres choses semblables ; car le mandataire testamentaire dispose par autorisation ; il ne lui est donc permis de disposer que dans ce que le testateur possède ; comme le mandat (al-wakâlah) ; et parce que le testateur est l'origine et le tuteur testamentaire (Al-Wasî) est une branche ; et la branche ne possède pas ce que l'origine ne possède pas ; le testament n'est donc pas valable pour ce que le testateur ne possède pas ; comme le fait de confier à la femme la supervision des enfants en bas âge qu'elle a ; car elle n'a aucune tutelle sur eux, à la différence du père.</p>
<p>⁕ Et le testament est limité à ce qui a été précisé en lui ; celui à qui l'on a confié quelque chose n'est pas tuteur testamentaire pour autre chose ; si donc quelqu'un reçoit un testament portant sur l'acquittement de ses dettes, il n'est pas tuteur testamentaire de ses enfants ; car son acte de disposition se limite à ce pour quoi il a été autorisé, comme le mandataire (wakîl).</p>
<p>⁕ Et le testament du mécréant en faveur d'un musulman est valable si sa succession fait partie des choses permises ; mais si elle fait partie des choses interdites, comme le vin et le porc, il n'est pas valable ; car il n'est pas permis au musulman de s'en charger.</p>
<p>⁕ Et si le testateur a dit au mandataire testamentaire : « Place mon tiers où tu veux », ou : « Fais-en l'aumône à qui tu veux », il n'est pas permis au tuteur testamentaire d'en prendre quoi que ce soit ; car il ne l'y a pas autorisé ; et il ne lui est pas permis non plus de le donner à son enfant ni à ses héritiers ; car il est suspecté à leur égard.</p>
<p>⁕ Et parmi les règles des testaments : que celui qui meurt dans un endroit où il n'y a ni juge ni tuteur testamentaire ; comme celui qui meurt en plein désert ; il est permis à certains des musulmans présents de prendre en charge sa succession et d'accomplir ce qui est le plus convenable, par la vente et autres ; car c'est un lieu de nécessité ; en effet, la laisser entraînerait sa perte, et sa préservation fait partie des obligations suffisantes (furûd al-kifâyât) ; et ils l'enveloppent dans un linceul, le préparent [pour l'inhumation] à partir de sa succession.</p>
