<p><strong>Chapitre sur l'héritage par la redistribution (Ar-Radd)</strong></p>
<p>⁕ Le Radd, sur le plan de la langue, est l'écartement (sarf) et le renvoi (irjâ'). On dit : « radda-hu raddan » : il l'a fait revenir et l'a écarté. Et l'« irtidâd » est le retour ; c'est de là qu'a été nommée l'apostasie (ar-riddah), car elle est un retour hors de la religion authentique.</p>
<p>⁕ <strong>Le Radd, dans la terminologie des spécialistes des parts légales (Al-Faradiyyîn)</strong>, est le fait d'écarter le reste de la succession des parts des héritiers, lorsqu'il n'y a pas d'héritier agnat ('âsib) qui y ait droit, vers les héritiers à part prescrite, à proportion de leurs parts.</p>
<p>⁕ Cela, parce qu'Allah Gloire à Lui a fixé les parts des héritiers : la moitié, le quart, le huitième, les deux tiers, le tiers et le sixième, et a expliqué la manière dont héritent les agnats, hommes et femmes. Et le Prophète ﷺ a dit :</p>
<p class="ar">«أَلْحِقُوا الفَرَائِضَ بِأَهْلِهَا؛ فَمَا بَقِيَ؛ فَلِأَوْلَى رَجُلٍ ذَكَرٍ»</p>
<p>« Attribuez les parts prescrites à leurs ayants droit ; ce qui reste revient alors au plus proche homme mâle. »<a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a></p>
<p>Ce noble hadith a ainsi été une explication du Coran et un ordonnancement des héritiers selon leurs deux catégories : les héritiers à part prescrite et les agnats. Lorsqu'il se trouve des héritiers à part prescrite et des agnats, la règle est claire : les ayants droit aux parts reçoivent leurs parts, et ce qui reste après elles est donné à l'agnat ; et s'il ne reste rien, l'agnat tombe, en application de ce noble hadith. Et s'il ne se trouve que des agnats, ils prennent le bien par agnation (Ta'sîb), selon le nombre de leurs têtes.</p>
<p>⁕ La difficulté ne se présente que lorsqu'il se trouve des héritiers à part prescrite dont les parts n'épuisent pas la succession, et qu'il n'existe pas d'agnat qui prenne le reste. Dans cette situation, le reste est redistribué aux héritiers à part prescrite à proportion de leurs parts, à l'exclusion des deux conjoints. Et cela, pour les preuves suivantes :</p>
<p><strong>Premièrement :</strong> la parole d'Allah le Très-Haut :</p>
<p class="ar">﴿وَأُوْلُوا الْأَرْحَامِ بَعْضُهُمْ أَوْلَىٰ بِبَعْضٍ فِي كِتَابِ اللَّهِ﴾ [الأنفال: 75]</p>
<p>« Et les liens du sang ont priorité les uns sur les autres, dans le Livre d'Allah » [Sourate Al-Anfâl : 75],</p>
<p>et les héritiers à part prescrite parmi les proches parents (Dhawû al-Arhâm) du défunt ont donc priorité sur son bien, et y ont plus de droit que les autres.</p>
<p><strong>Deuxièmement :</strong> la parole du Prophète ﷺ :</p>
<p class="ar">«مَنْ تَرَكَ مَالاً؛ فَهُوَ لِوَرَثَتِهِ»</p>
<p>« Celui qui laisse un bien, celui-ci revient à ses héritiers. » Rapporté par Al-Bukhârî et Muslim.<a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a> Cela est général pour l'ensemble du bien que laisse le défunt, y compris ce qui reste après les parts prescrites ; les héritiers à part prescrite y ont donc plus de droit, car il provient du bien de celui dont ils héritent.</p>
<p><strong>Troisièmement :</strong> il est rapporté dans le hadith de Sa'd ibn Abî Waqqâs (qu'Allah l'agrée) qu'il dit au Prophète ﷺ lorsque celui-ci vint lui rendre visite pendant une maladie qui l'avait atteint :</p>
<p class="ar">«يَا رَسُولَ اللهِ! لَا يَرِثُنِي إِلَّا ابْنَةٌ لِي»</p>
<p>« Ô Messager d'Allah ! Seule une fille à moi m'héritera. »<a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a></p>
<p>Et le Prophète ﷺ n'a pas désapprouvé qu'il limite l'héritage à sa fille ; si cela avait été une erreur, il ne l'aurait pas approuvé. Le hadith indique donc que l'ayant droit à une part prescrite prend ce qui reste après sa part s'il n'y a pas d'agnat, et c'est cela le Radd.</p>
<p>⁕ Ceux auxquels le Radd s'applique sont tous les héritiers à part prescrite, à l'exception des deux conjoints, car les deux conjoints font partie des non-proches parents (ghayr dhawî al-arhâm) ; ils n'entrent donc pas dans la généralité de Sa parole, le Très-Haut : « Et les liens du sang ont priorité les uns sur les autres, dans le Livre d'Allah » [Sourate Al-Anfâl : 75].</p>
<p>⁕ Les gens de science se sont accordés sur le fait qu'il n'y a pas de Radd au profit des deux conjoints, sauf ce qui est rapporté de 'Uthmân (qu'Allah l'agrée) : qu'il a fait un Radd au profit d'un époux. Cela s'explique probablement par une cause autre que le Radd, par exemple parce qu'il était agnat ou proche parent ; il le lui a donc donné pour cela, et non en raison du Radd. Et Allah sait mieux.</p>
