<p><strong>Chapitre sur l'héritage de l'enfant conçu (Al-Haml)</strong></p>
<p>⁕ Il se peut que, parmi l'ensemble des héritiers, il y ait un enfant conçu (Haml). On sait alors l'ambiguïté qui en résulte du fait de l'ignorance de l'état dans lequel il se trouve : vie ou mort, pluralité ou unicité, féminité ou masculinité ; et le jugement diffère le plus souvent selon la différence de ces possibilités. C'est pourquoi les savants (qu'Allah leur fasse miséricorde) s'y sont intéressés et lui ont consacré un chapitre particulier dans les livres des héritages.</p>
<p>⁕ Le « haml » est ce que l'on porte dans le ventre, parmi les enfants ; et ce qui est visé ici est ce qui se trouve dans le ventre de la femme lorsque le défunt est mort alors qu'elle est enceinte de lui, et qui hériterait ou serait exclu dans toutes les suppositions, ou hériterait ou serait exclu dans certaines suppositions, s'il se détachait vivant.</p>
<p>⁕ L'enfant conçu qui hérite, par consensus (Ijmâ'), est celui chez qui deux conditions se réalisent :</p>
<p><strong>La première condition :</strong> son existence dans l'utérus au moment de la mort du défunt, ne serait-ce que sous forme de goutte de sperme (nutfah).</p>
<p><strong>La deuxième condition :</strong> sa séparation vivant, d'une vie stable, d'après la parole du Prophète ﷺ :</p>
<p class="ar">«إِذَا اسْتَهَلَّ الْمَوْلُودُ؛ وُرِّثَ».</p>
<p>« Lorsque le nouveau-né pousse un cri (istahalla), il hérite. » Rapporté par Abû Dâwûd, et il a été rapporté d'Ibn Hibbân qu'il l'a jugé authentique.<a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a> Le sens du cri (istihlâl) du nouveau-né est son pleur à sa naissance en élevant sa voix. Et il a été dit : le sens du cri (istihlâl) est que l'on trouve chez lui un indice de vie, par un pleur, un éternuement ou un mouvement, et cela ne se limite pas au pleur. Le cri après la naissance est donc un indice de sa séparation vivant, d'une vie stable, et c'est par lui que se réalise la deuxième condition.</p>
<p>Quant à la première condition — qui est son existence dans l'utérus au moment de la mort du défunt —, on en déduit la réalisation par le fait que la mère l'accouche dans la durée fixée pour la grossesse, qui a un minimum et un maximum selon les cas. Cela tient à ce que l'enfant conçu qui naît après le décès du défunt a trois situations :</p>
<p><strong>La première situation :</strong> que la mère l'accouche vivant avant qu'il se soit écoulé un temps inférieur à la durée minimale de la grossesse depuis la mort du défunt. Dans ce cas, il hérite absolument, car sa vie après la naissance pendant cette période est un indice qu'il existait avant la mort du défunt. La durée minimale de la grossesse est de six mois, par consensus des savants, d'après la parole d'Allah le Très-Haut :</p>
<p class="ar">﴿وَحَمْلُهُ وَفِصَالُهُ ثَلَاثُونَ شَهْرًا﴾ [الأحقاف: 15]</p>
<p>« Sa gestation et son sevrage durent trente mois » [Sourate Al-Ahqâf : 15],</p>
<p>avec la parole d'Allah le Très-Haut :</p>
<p class="ar">﴿وَالْوَالِدَاتُ يُرْضِعْنَ أَوْلَادَهُنَّ حَوْلَيْنِ كَامِلَيْنِ﴾ [البقرة: 233]</p>
<p>« Les mères allaitent leurs enfants deux années complètes » [Sourate Al-Baqarah : 233].</p>
<p>Si l'on retire les deux années, qui font vingt-quatre mois, de trente mois, il reste six mois, et c'est la durée minimale de la grossesse.</p>
<p><strong>La deuxième situation :</strong> que la mère l'accouche après qu'il s'est écoulé un temps supérieur à la durée maximale de la grossesse depuis la mort du défunt. Dans ce cas, il n'hérite pas, car sa naissance après cette période indique qu'il est apparu après la mort du défunt.</p>
<p>⁕ Les savants ont divergé sur la détermination de la durée maximale de la grossesse selon trois avis :</p>
<p><strong>Le premier :</strong> que la durée maximale de la grossesse est de deux ans, d'après la parole de la Mère des croyants 'Â'ichah (qu'Allah l'agrée) :</p>
<p class="ar">«لَا يَبْقَى الْوَلَدُ فِي بَطْنِ أُمِّهِ أَكْثَرَ مِنْ سَنَتَيْنِ».</p>
<p>« L'enfant ne reste pas dans le ventre de sa mère plus de deux ans. »<a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a></p>
<p>Une telle parole ne laisse pas de place à l'effort d'interprétation (ijtihâd) ; elle a donc le statut de ce qui est rapporté au Prophète ﷺ.</p>
<p><strong>Le deuxième :</strong> que la durée maximale de la grossesse est de quatre ans, car ce qui n'a pas de texte se rapporte à l'existence constatée, et l'on a constaté la persistance de la grossesse dans le ventre de sa mère jusqu'à quatre ans.</p>
<p><strong>Le troisième :</strong> que la durée maximale de la grossesse est de cinq ans.</p>
<p>Et le plus juste des avis — et Allah sait mieux — est que la durée maximale de la grossesse est de quatre ans, car aucune preuve n'a été établie pour la fixer ; on se réfère donc à l'existence constatée, et quatre ans ont été constatés. Et Allah sait mieux.</p>
<p><strong>La troisième situation :</strong> que la mère l'accouche dans un temps situé au-dessus de la limite minimale de la durée de la grossesse et en dessous de sa limite maximale. Dans ce cas, s'il s'agit d'une femme qui est sous l'autorité d'un époux ou d'un maître qui a des rapports avec elle durant cette période, l'enfant conçu n'hérite pas du défunt ; car son existence n'est pas certaine au moment de la mort du défunt, du fait de la possibilité qu'il soit apparu d'un rapport survenu après la mort du défunt. Et si elle n'a pas eu de rapports durant cette période, en raison de l'absence de l'époux ou du maître, ou de leur éloignement, ou de leur abstention de rapports par incapacité ou par refus, l'enfant conçu hérite, car son existence est certaine.</p>
<p>⁕ Les savants se sont accordés sur le fait que le nouveau-né, lorsqu'il pousse un cri après sa naissance, a vu sa naissance vivant d'une vie stable se réaliser ; et ils ont divergé sur ce qui est autre que le cri : comme le mouvement, la tétée ou la respiration. Parmi les savants, il y a celui qui se limite au cri et ne lui associe aucune autre de ces choses ; et parmi eux, il y a celui qui généralise et associe au cri tout ce qui indique la vie du nouveau-né, et c'est l'avis le plus juste, car le cri ne se limite pas, dans son explication, au pleur seulement, mais comprend le mouvement et ce qui lui ressemble selon certains savants ; et même si l'explication du cri se limitait à la voix et au pleur, cela n'empêcherait pas de tirer une preuve des autres signes. Et Allah sait mieux.</p>
<p><strong>De la manière de faire hériter l'enfant conçu :</strong></p>
<p>⁕ S'il y a parmi les héritiers un enfant conçu, et qu'ils demandent le partage avant sa naissance et la connaissance de son état quant à l'héritage ou à l'absence d'héritage, ce qu'il convient de faire dans ce cas est d'attendre jusqu'à ce que l'issue de l'enfant conçu soit connue, afin de sortir de la divergence, et pour que le partage soit effectué en une seule fois.</p>
<p>⁕ Si les héritiers ne consentent pas au retard et à l'attente de la naissance de l'enfant conçu, peut-on alors les laisser procéder au partage ? Les savants (qu'Allah leur fasse miséricorde) ont divergé à ce sujet en deux avis :</p>
<p><strong>Le premier avis :</strong> qu'on ne les laisse pas procéder, et cela en raison du doute concernant la situation de l'enfant conçu, de l'ignorance de son état et de la multiplicité des possibilités à son sujet, multiplicité dont résulte une grande différence quant au montant de sa part d'héritage et de l'héritage de ceux qui sont avec lui.</p>
<p><strong>Le deuxième avis :</strong> que les héritiers sont autorisés à demander le partage et qu'on ne les contraint pas à attendre, car il y a en cela un préjudice pour eux, puisqu'il se peut qu'ils soient pauvres, ou que certains d'entre eux le soient, et que la durée de la grossesse puisse se prolonger ; quant à l'enfant conçu, on prend des précautions pour lui : on met donc de côté pour lui ce qui garantit la sauvegarde de sa part, et il n'y a donc pas lieu de retarder.</p>
<p>Et c'est là l'avis le plus juste, à ce qui apparaît. Mais les partisans de cet avis ont divergé sur la quantité que l'on met de côté pour lui : car l'enfant conçu dans le ventre, on ne connaît sa réalité que par Allah, et de nombreuses possibilités se le disputent : sa vie et sa mort, sa pluralité et son unicité, sa masculinité et sa féminité. Il n'y a aucun doute que ces nombreuses possibilités influencent le montant de sa part d'héritage et l'héritage de ceux qui sont avec lui ; c'est pourquoi ils ont divergé sur la quantité que l'on met de côté pour l'enfant conçu, selon plusieurs avis :</p>
<p><strong>Le premier avis :</strong> qu'il n'y a pas de limite fixe au nombre d'enfants conçus, car on ne sait pas quel est le plus grand nombre que la femme peut porter dans le ventre ; mais on examine la situation des héritiers qui héritent avec l'enfant conçu : celui qui hérite dans certaines suppositions et non dans d'autres, ou dont la part n'est pas déterminée, comme l'héritier agnat ('âsib), on ne lui donne rien ; et celui qui hérite dans toutes les suppositions, avec des parts différentes, on lui donne la plus petite ; et celui dont la part ne diffère pas dans toutes les suppositions, on lui donne sa part en entier. Puis le reste est suspendu après la prise en compte de ces considérations, jusqu'à ce que le cas de l'enfant conçu se dévoile.</p>
<p><strong>Le deuxième avis :</strong> que l'on traite l'enfant conçu de la manière la plus favorable pour lui, et que l'on traite les héritiers avec lui de la manière la plus défavorable : on met donc de côté pour l'enfant conçu la plus grande des deux parts, celle de deux mâles ou de deux femelles, et l'on donne à l'héritier qui est avec lui ce qui est certain de sa part. Lorsque l'enfant conçu naît et que son cas est clarifié, on prend de ce qui a été mis de côté ce qu'il mérite, et l'on restitue le reste, si cela dépasse sa part, ou on le prend en entier si cela était égal à sa part ; et si cela était inférieur à sa part, il revient sur les héritiers pour ce qui manque.</p>
<p><strong>Le troisième avis :</strong> que l'on met de côté pour l'enfant conçu la part d'un seul fils ou d'une seule fille, celui des deux qui est le plus grand, car ce qui est habituel et le plus fréquent est que la femelle n'enfante pas plus d'un enfant dans un seul ventre ; le jugement est donc fondé sur le plus fréquent. Et le juge prend des héritiers un garant pour ce qui excède la part d'un seul, car l'enfant conçu est incapable de veiller à lui-même ; le juge veille donc pour lui par précaution.</p>
<p>Et le plus juste de ces avis est celui où il y a le plus de précaution, et c'est le deuxième avis, car la naissance de deux dans un seul ventre est très fréquente, et ce qui dépasse deux est rare, et la prise d'un garant, comme dans le troisième avis, peut s'avérer impossible, et même si l'on trouve le garant, ce qui l'atteint peut l'atteindre : il devient alors incapable de supporter la charge, et le droit de l'enfant conçu se perd s'il apparaît qu'il y en a plus d'un.</p>
<p>Selon l'avis retenu, on établit pour l'enfant conçu six suppositions, car soit il se sépare vivant d'une vie stable, soit il se sépare mort ; et lorsqu'il se sépare vivant d'une vie stable, soit il est seulement un mâle, soit seulement une femelle, soit un mâle et une femelle, soit deux mâles, soit deux femelles ; ce sont donc six suppositions. On établit pour chaque supposition un cas de calcul (mas'alah), on y applique l'opération arithmétique, et l'on examine la situation des héritiers : celui qui hérite de manière égale dans tous les cas, on lui donne sa part en entier ; celui qui hérite avec des différences, on lui donne la plus petite ; et celui qui hérite dans certaines suppositions et non dans d'autres, on ne lui donne rien ; et le reste est suspendu jusqu'à ce que le cas de l'enfant conçu s'éclaircisse, comme précédemment. Et Allah sait mieux.</p>
