<p><strong>Chapitre sur l'héritage des époux et des épouses</strong></p>
<p>⁕ À l'époux revient la moitié en l'absence d'enfant et d'enfant du fils, et le quart en présence d'un enfant ou d'un enfant du fils :</p>
<p>en raison de Sa parole le Très-Haut :</p>
<p class="ar">﴿وَلَكُمْ نِصْفُ مَا تَرَكَ أَزْوَاجُكُمْ إِنْ لَمْ يَكُنْ لَهُنَّ وَلَدٌ ۚ فَإِنْ كَانَ لَهُنَّ وَلَدٌ فَلَكُمُ الرُّبُعُ مِمَّا تَرَكْنَ ۚ مِنْ بَعْدِ وَصِيَّةٍ يُوصِينَ بِهَا أَوْ دَيْنٍ﴾ [النساء: 12]</p>
<p>« À vous revient la moitié de ce que laissent vos épouses, si elles n'ont pas d'enfant. Si elles ont un enfant, à vous revient le quart de ce qu'elles laissent, après exécution du legs qu'elles auraient fait ou après règlement d'une dette » [Sourate An-Nisâ' : 12].</p>
<p>⁕ Et à l'épouse, ou aux épouses, revient le quart en l'absence de la descendance héritière, et le huitième en sa présence :</p>
<p>en raison de Sa parole le Très-Haut :</p>
<p class="ar">﴿وَلَهُنَّ الرُّبُعُ مِمَّا تَرَكْتُمْ إِنْ لَمْ يَكُنْ لَكُمْ وَلَدٌ ۚ فَإِنْ كَانَ لَكُمْ وَلَدٌ فَلَهُنَّ الثُّمُنُ مِمَّا تَرَكْتُمْ ۚ مِنْ بَعْدِ وَصِيَّةٍ تُوصُونَ بِهَا أَوْ دَيْنٍ﴾ [النساء: 12]</p>
<p>« Et à elles revient le quart de ce que vous laissez, si vous n'avez pas d'enfant. Si vous avez un enfant, à elles revient le huitième de ce que vous laissez, après exécution du legs que vous auriez fait ou après règlement d'une dette » [Sourate An-Nisâ' : 12].</p>
<p>Et par la descendance héritière (al-far' al-wârith), on entend les enfants du défunt et les enfants de ses fils.</p>
