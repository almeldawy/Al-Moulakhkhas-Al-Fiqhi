<p><strong>Chapitre sur l'héritage par estimation et par précaution</strong></p>
<p>⁕ Tout ce qui précède traitait du cas où la mort du défunt est établie et où l'existence de l'héritier au moment de la mort du défunt est également établie ; cela est clair et ne pose aucune difficulté.</p>
<p>Mais il existe ici des situations dans lesquelles l'affaire est confuse, de sorte que l'état du défunt et celui de l'héritier ne sont pas connus : certains héritiers peuvent se trouver dans des états où ils oscillent entre l'existence et l'inexistence, comme l'enfant conçu (encore dans le ventre), les noyés, ceux morts sous des décombres et leurs semblables, et le disparu ; et dans des états où ils oscillent entre le fait que l'héritier soit un mâle ou une femelle, comme l'hermaphrodite douteux (Al-Khunthâ al-Mushkil) et l'enfant dans le ventre.</p>
<p>Et sur la base de cette hésitation dans ces états et ces catégories parmi les héritiers et les défunts, on a consacré des chapitres particuliers, appelés chapitres de l'héritage par estimation et par précaution, qui sont :</p>
<ol type="1">
<li>Le chapitre de l'hermaphrodite douteux (Al-Khunthâ al-Mushkil).</li>
<li>Et le chapitre de l'enfant conçu (Al-Haml).</li>
<li>Et le chapitre du disparu (Al-Mafqûd).</li>
<li>Et le chapitre des noyés et de ceux morts sous des décombres (Al-Gharqâ wa-l-Hadmâ).</li>
</ol>
