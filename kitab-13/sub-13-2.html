<p><strong>Chapitre sur les transactions financières du malade (Tasarrufât al-Marîd al-Mâliyyah)</strong></p>
<p>⁕ L'état de santé diffère de l'état de maladie quant à la validité des actes de disposition de l'homme sur son bien, dans les limites de la législation et de la rectitude, sans qu'on puisse y revenir contre lui ; et l'aumône, dans cet état [de santé], est meilleure et plus grande en récompense que l'aumône faite durant l'état de maladie.</p>
<p>Allah le Très-Haut a dit :</p>
<p class="ar">﴿وَأَنْفِقُوا مِنْ مَا رَزَقْنَاكُمْ مِنْ قَبْلِ أَنْ يَأْتِيَ أَحَدَكُمُ الْمَوْتُ فَيَقُولَ رَبِّ لَوْلَا أَخَّرْتَنِي إِلَى أَجَلٍ قَرِيبٍ فَأَصَّدَّقَ وَأَكُنْ مِنَ الصَّالِحِينَ ۝ وَلَنْ يُؤَخِّرَ اللَّهُ نَفْسًا إِذَا جَاءَ أَجَلُهَا وَاللَّهُ خَبِيرٌ بِمَا تَعْمَلُونَ﴾ [المنافقون]</p>
<p>« Et dépensez de ce que Nous vous avons attribué, avant que la mort ne vienne à l'un de vous et qu'il dise : "Ô mon Seigneur, si seulement Tu m'accordais un court délai, je ferais l'aumône et je serais parmi les gens de bien !" Mais Allah ne retarde jamais [la mort d']une âme lorsque son terme est arrivé. Et Allah est Parfaitement Connaisseur de ce que vous faites. » [Sourate Al-Munâfiqûn]</p>
<p>⁕ Et dans les deux « Sahîh » : lorsque le Prophète ﷺ fut interrogé : « Quelle aumône est la meilleure ? », il répondit :</p>
<p class="ar">«أَنْ تَصَدَّقَ وَأَنْتَ صَحِيحٌ شَحِيحٌ؛ تَأْمُلُ الْغِنَى، وَتَخْشَى الْفَقْرَ، وَلَا تُمْهِلْ حَتَّى إِذَا بَلَغَتِ الْحُلْقُومَ؛ قُلْتَ: لِفُلَانٍ كَذَا، وَلِفُلَانٍ كَذَا، وَقَدْ كَانَ لِفُلَانٍ»</p>
<p>« Que tu fasses l'aumône alors que tu es en bonne santé et avare, espérant la richesse et craignant la pauvreté ; et ne tarde pas jusqu'à ce que, lorsque [l'âme] atteint la gorge, tu dises : "Pour un tel, telle chose, et pour un tel, telle chose", alors que cela est déjà devenu à un tel. »<a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a></p>
<p>⁕ La maladie se divise en deux catégories :</p>
<p><strong>Premièrement : une maladie non redoutée (maradh ghayr makhûf) :</strong> c'est-à-dire une maladie dont on ne craint pas, d'ordinaire, qu'elle entraîne la mort ; comme une douleur de molaire, une douleur des yeux et un léger mal de tête ; pour cette catégorie, l'acte de disposition du malade est contraignant, comme l'acte de disposition de celui qui est en bonne santé, et son don est valable sur la totalité de son bien ; et même si elle évoluait vers une maladie redoutée et qu'il en mourait, [le don reste valable], en considération de son état au moment du don ; car, au moment du don, il est dans le statut de celui qui est en bonne santé.</p>
<p><strong>Deuxièmement : une maladie redoutée (maradh makhûf) :</strong> au sens où l'on s'attend, d'ordinaire, à ce que la mort en résulte ; les libéralités du malade dans cette maladie et ses dons s'exécutent à hauteur de son tiers, et non à partir du capital du bien : si elles sont dans la limite du tiers ou moins, elles sont exécutées ; et si elles dépassent cela, elles ne sont exécutées que par l'approbation des héritiers après la mort ; en raison de sa parole ﷺ : « Allah a fait l'aumône de vous accorder, au moment de votre mort, le tiers de vos biens, en supplément à vos œuvres. » Rapporté par Ibn Mâjah et Ad-Dâraqutnî<a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a>. Ce hadith, et ce qui est rapporté dans le même sens, indiquent donc l'autorisation de disposer du tiers du bien au moment du décès ; et c'est l'avis de la majorité des savants ; et [aussi] parce que, dans l'état de la maladie redoutée, la mort est ce qui prédomine chez lui ; son don est donc prélevé sur le capital du bien, ce qui lèse l'héritier, et il est donc ramené au tiers, comme le testament.</p>
<p>Et l'état de danger est semblable à la maladie redoutée quant au statut de la disposition financière ; comme celui qui voit l'épidémie se déclarer dans sa ville, ou qui se trouve entre les deux rangs [des armées] dans le combat, ou qui se trouve en haute mer lorsqu'elle est agitée : sa libéralité, dans cet état, n'est pas exécutée pour ce qui excède le tiers, sauf par l'approbation des héritiers après la mort ; et sa libéralité n'est pas valable, dans cet état, au profit de l'un de ses héritiers au moyen de quoi que ce soit, sauf par l'approbation des héritiers s'il meurt dans cet état ; mais s'il guérit de la maladie redoutée, tous ses dons sont exécutés, faute d'obstacle.</p>
<p>Et celui dont la maladie est chronique et qui n'est pas contraint de garder le lit : ses libéralités sont valables sur la totalité de son bien, comme les libéralités de celui qui est en bonne santé ; car on ne craint pas de sa part une mort précipitée ; il est donc comme celui qui est âgé. Mais s'il est contraint de garder le lit à cause d'une maladie chronique qui l'y retient, il est comme celui dont la maladie est redoutée : ses testaments ne sont valables que dans les limites du tiers, et pour un non-héritier ; sauf si les héritiers l'approuvent ; car c'est un malade qui ne quitte pas le lit, dont on craint la perte.</p>
<p>⁕ Et le montant du tiers est pris en considération au moment de sa mort ; car c'est le moment où les testaments deviennent contraignants et le moment où ils deviennent exigibles ; les testaments et les dons sont donc alors exécutés à partir de son tiers ; et si celui-ci est insuffisant pour eux, les dons sont placés avant les testaments ; car ils sont contraignants à l'égard du malade, et ils sont donc placés avant le testament ; comme le don fait durant l'état de santé.</p>
<p>⁕ Et il y a ici des différences entre le testament (Al-Wasiyyah) et le don (Al-'Atiyyah) ; les juristes (qu'Allah leur fasse miséricorde) ont dit : le testament se distingue du don en quatre choses :</p>
<p><strong>La première :</strong> que l'on traite à égalité, dans le testament, celui qui est mentionné en premier et celui qui l'est en dernier ; car c'est une libéralité après la mort, qui devient exigible en une seule fois ; quant au don, on commence par le premier, puis par le suivant ; car il intervient de manière contraignante à l'égard du donateur.</p>
<p><strong>La deuxième :</strong> que le donateur n'a pas la possibilité de revenir sur le don après que celui-ci a été reçu ; à la différence du testament : le testateur a la possibilité d'y revenir ; car il ne devient contraignant qu'avec la mort.</p>
<p><strong>La troisième :</strong> que l'acceptation est prise en considération pour le don au moment de son existence ; car il transmet la propriété immédiatement ; à la différence du testament : il transmet la propriété après la mort ; l'acceptation est donc prise en considération au moment de son existence ; il n'y a donc aucun effet de l'acceptation avant la mort.</p>
<p><strong>La quatrième :</strong> que, dans le don, la propriété est établie au moment de son acceptation ; à la différence du testament : il n'est pas possédé avant la mort ; car il transmet la propriété après elle ; il ne la précède donc pas.</p>
