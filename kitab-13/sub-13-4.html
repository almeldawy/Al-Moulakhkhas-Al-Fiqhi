<p><strong>Chapitre sur les règles des héritages (Al-Mawârîth)</strong></p>
<p>⁕ Le sujet des héritages (Al-Mawârîth) est un sujet important, digne d'attention ; le Prophète ﷺ a en effet exhorté, dans de nombreux hadiths, à l'apprendre et à l'enseigner.</p>
<ul>
<li>Parmi eux, sa parole ﷺ :</li>
</ul>
<p class="ar">«تَعَلَّمُوا الْفَرَائِضَ، وَعَلِّمُوهَا النَّاسَ؛ فَإِنَّهَا نِصْفُ الْعِلْمِ، وَهُوَ يُنْسَى، وَهُوَ أَوَّلُ عِلْمٍ يُنْزَعُ مِنْ أُمَّتِي»</p>
<p>« Apprenez les parts légales (Al-Farâ'id) et enseignez-les aux gens ; car elles sont la moitié de la science, elle sera oubliée, et c'est la première science qui sera arrachée de ma communauté. » Rapporté par Ibn Mâjah. Et dans une autre version :</p>
<p class="ar">«فَإِنِّي امْرُؤٌ مَقْبُوضٌ، وَإِنَّ الْعِلْمَ سَيُقْبَضُ وَتَظْهَرُ الْفِتَنُ، حَتَّى يَخْتَلِفَ اثْنَانِ فِي الْفَرِيضَةِ، فَلَا يَجِدَانِ مَنْ يَفْصِلُ بَيْنَهُمَا»</p>
<p>« Car je suis un homme qui sera rappelé à Allah, la science sera retirée et les épreuves apparaîtront, au point que deux personnes divergeront au sujet d'une part légale sans trouver quelqu'un pour les départager. » Rapporté par Ahmad, At-Tirmidhî et Al-Hâkim.<a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a></p>
<p>Ce que le Prophète ﷺ a annoncé s'est réalisé : cette science a été délaissée et oubliée ; on n'en trouve plus d'enseignement dans les mosquées, sauf rarement, ni dans les écoles des musulmans, sinon dans certains établissements d'enseignement, sous une forme faible qui ne répond pas à l'objectif et ne garantit pas la préservation de cette science.</p>
<p>⁕ Il incombe donc aux musulmans de se hâter de raviver cette science et de la préserver dans les mosquées, les écoles et les universités ; car ils en ont un besoin des plus pressants, et ils seront interrogés à son sujet.</p>
<ul>
<li>Il est établi également qu'il ﷺ a dit :</li>
</ul>
<p class="ar">«الْعِلْمُ ثَلَاثَةٌ، وَمَا سِوَى ذَلِكَ فَضْلٌ: آيَةٌ مُحْكَمَةٌ، وَسُنَّةٌ قَائِمَةٌ، وَفَرِيضَةٌ عَادِلَةٌ»</p>
<p>« La science est de trois sortes, et ce qui est en dehors de cela est un surplus : un verset clair, une Sunna établie et un partage légal équitable (Farîdah). »<a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a></p>
<p>Et d'après 'Umar (qu'Allah l'agrée) : « Apprenez les parts légales (Al-Farâ'id) ; car elles font partie de votre religion. » Et 'Abdullâh a dit : « Que celui qui apprend le Coran apprenne les parts légales (Al-Farâ'id). »</p>
<p>Quant au sens de sa parole ﷺ au sujet des parts légales (Al-Farâ'id) : « Elles sont la moitié de la science », c'est que l'être humain a deux états : l'état de vie et l'état de mort. Les parts légales (Al-Farâ'id) renferment la plupart des règles relatives à la mort, tandis que le reste de la science se rapporte aux règles de la vie. On a dit aussi : elles sont devenues la moitié de la science parce que tous les gens en ont besoin. On a dit encore autre chose quant à son sens. L'essentiel est qu'il y a là une orientation vers l'intérêt à porter à cette science.</p>
<p>⁕ Cette science est appelée « les parts légales » (Al-Farâ'id), pluriel de « farîdah », dérivé de « al-fard », qui signifie la détermination (at-taqdîr), car les parts des héritiers sont déterminées. La farîdah est une part déterminée légalement pour celui qui y a droit. Et la science des parts légales (Al-Farâ'id) est la science du partage des héritages (Al-Mawârîth), du point de vue de la compréhension de leurs règles et de la connaissance du calcul qui conduit à leur partage.</p>
<p>⁕ Cinq droits se rattachent à la succession du défunt : on commence par les frais de préparation du défunt : le prix du linceul, les frais de la toilette mortuaire et le salaire du creusement de sa tombe ; puis ses dettes sont réglées, qu'elles soient dues à Allah, comme les zakâts, les expiations, les vœux et le pèlerinage obligatoire, ou qu'elles soient dues aux êtres humains ; puis ses legs sont prélevés, à condition qu'ils soient dans la limite du tiers ou moins ; puis le reste est partagé après cela entre les héritiers selon ce qu'Allah ﷻ a légiféré : on donne la priorité aux héritiers à part prescrite (Ashâb al-Furûd), et s'il reste quelque chose, cela revient aux héritiers agnats ('Asabah), comme son exposé viendra.</p>
<p>⁕ Il n'est pas permis de modifier les héritages par rapport à leur disposition légale, et cela constitue une mécréance envers Allah. Allah le Très-Haut a dit :</p>
<p class="ar">﴿تِلْكَ حُدُودُ اللَّهِ وَمَنْ يُطِعِ اللَّهَ وَرَسُولَهُ يُدْخِلْهُ جَنَّاتٍ تَجْرِي مِنْ تَحْتِهَا الْأَنْهَارُ خَالِدِينَ فِيهَا وَذَلِكَ الْفَوْزُ الْعَظِيمُ ۝ وَمَنْ يَعْصِ اللَّهَ وَرَسُولَهُ وَيَتَعَدَّ حُدُودَهُ يُدْخِلْهُ نَارًا خَالِدًا فِيهَا وَلَهُ عَذَابٌ مُهِينٌ﴾ [النساء]</p>
<p>« Telles sont les limites fixées par Allah. Quiconque obéit à Allah et à Son messager, Il le fera entrer dans des jardins sous lesquels coulent les ruisseaux, pour y demeurer éternellement. Et c'est là la grande réussite. Quiconque désobéit à Allah et à Son messager et transgresse Ses limites, Il le fera entrer dans un Feu où il demeurera éternellement, et il aura un châtiment avilissant. » [Sourate An-Nisâ']</p>
<p>L'imam Ash-Shawkânî (qu'Allah lui fasse miséricorde) a dit dans son « Tafsîr » : « L'allusion contenue dans Sa parole ﴿تِلْكَ﴾ (« Telles ») renvoie aux règles précédentes (c'est-à-dire concernant les héritages), et Il les a nommées « limites », car il n'est pas permis de les dépasser ni licite de les transgresser. ﴿وَمَنْ يُطِعِ اللَّهَ وَرَسُولَهُ﴾ (« Quiconque obéit à Allah et à Son messager ») en matière de partage des héritages et autres règles légales, comme l'indique la généralité du terme ; ﴿يُدْخِلْهُ جَنَّاتٍ تَجْرِي مِنْ تَحْتِهَا الْأَنْهَارُ﴾ (« Il le fera entrer dans des jardins sous lesquels coulent les ruisseaux »)... » jusqu'à ce qu'il dise : « Et Ibn Mâjah<a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a> a rapporté d'après Anas, qui a dit : Le Messager d'Allah ﷺ a dit : "Celui qui coupe l'héritage de son héritier, Allah coupera son héritage du Paradis le Jour de la Résurrection." » Fin de citation.</p>
<p>Ainsi, celui qui dispose des héritages en les détournant de leur cours légal, en faisant hériter quelqu'un qui n'est pas héritier, ou en privant l'héritier de la totalité de son droit ou d'une partie de celui-ci, ou en établissant l'égalité entre l'homme et la femme dans l'héritage, comme dans certains systèmes légaux mécréants, en contredisant par là le jugement d'Allah qui a établi pour le mâle l'équivalent de la part de deux femelles, celui-là est un mécréant, éternellement dans le Feu — et nous cherchons refuge auprès d'Allah — à moins qu'il ne se repente à Allah avant sa mort.</p>
<p>Les gens de la Jâhiliyyah privaient les femmes et les enfants de l'héritage et le réservaient aux grands hommes, ceux qui montent les chevaux et portent les armes. L'Islam est venu l'invalider. Allah le Très-Haut a dit :</p>
<p class="ar">﴿لِلرِّجَالِ نَصِيبٌ مِمَّا تَرَكَ الْوَالِدَانِ وَالْأَقْرَبُونَ وَلِلنِّسَاءِ نَصِيبٌ مِمَّا تَرَكَ الْوَالِدَانِ وَالْأَقْرَبُونَ مِمَّا قَلَّ مِنْهُ أَوْ كَثُرَ نَصِيبًا مَفْرُوضًا﴾ [النساء]</p>
<p>« Aux hommes revient une part de ce que laissent les père et mère et les proches parents, et aux femmes revient une part de ce que laissent les père et mère et les proches parents, que ce soit peu ou beaucoup : une part obligatoire. » [Sourate An-Nisâ']</p>
<p>Cela, pour repousser ce qui existait dans la Jâhiliyyah, à savoir ne pas faire hériter les femmes et les enfants. Et dans Sa parole le Très-Haut :</p>
<p class="ar">﴿يُوصِيكُمُ اللَّهُ فِي أَوْلَادِكُمْ لِلذَّكَرِ مِثْلُ حَظِّ الْأُنثَيَيْنِ﴾ [النساء: 11]</p>
<p>« Allah vous recommande, au sujet de vos enfants : au garçon, la part de deux filles » [Sourate An-Nisâ' : 11],</p>
<p>et dans Sa parole :</p>
<p class="ar">﴿وَإِنْ كَانُوا إِخْوَةً رِجَالًا وَنِسَاءً فَلِلذَّكَرِ مِثْلُ حَظِّ الْأُنثَيَيْنِ﴾ [النساء: 176]</p>
<p>« S'il y a des frères, hommes et femmes, au mâle revient la part de deux femelles » [Sourate An-Nisâ' : 176],</p>
<p>il y a une invalidation de ce que certaines Jâhiliyyât contemporaines ont adopté, à savoir l'égalité de la femme avec l'homme dans l'héritage, en s'opposant à Allah et à Son messager et en transgressant les limites d'Allah. La Jâhiliyyah ancienne a empêché la femme d'hériter totalement, et la Jâhiliyyah contemporaine lui a donné ce qu'elle ne mérite pas, tandis que la religion de l'Islam est la plus équitable envers elle, la plus respectueuse d'elle, et lui a donné le droit qui lui convient. Allah a combattu les mécréants, les hypocrites et les impies, ceux qui :</p>
<p class="ar">﴿يُرِيدُونَ أَنْ يُطْفِئُوا نُورَ اللَّهِ بِأَفْوَاهِهِمْ وَيَأْبَى اللَّهُ إِلَّا أَنْ يُتِمَّ نُورَهُ وَلَوْ كَرِهَ الْكَافِرُونَ﴾ [التوبة]</p>
<p>« veulent éteindre de leurs bouches la lumière d'Allah, alors qu'Allah ne veut que parachever Sa lumière, quelque répulsion qu'en aient les mécréants. » [Sourate At-Tawbah]</p>
