<p><strong>Chapitre sur l'héritage des mères</strong></p>
<p>⁕ La mère a trois situations.</p>
<p><strong>La première situation :</strong> Elle reçoit le sixième (1/6). Cela, en présence de la descendance héritière parmi les enfants du défunt ou les enfants de ses fils, ou en présence de deux frères ou plus ; car Allah le Très-Haut a dit :</p>
<p class="ar">﴿وَلِأَبَوَيْهِ لِكُلِّ وَاحِدٍ مِنْهُمَا السُّدُسُ مِمَّا تَرَكَ إِنْ كَانَ لَهُ وَلَدٌ ...﴾ jusqu'à Sa parole :</p>
<p class="ar">﴿فَإِنْ كَانَ لَهُ إِخْوَةٌ فَلِأُمِّهِ السُّدُسُ﴾ [النساء: 11].</p>
<p>« Et pour ses père et mère, à chacun des deux le sixième de ce qu'il laisse, s'il a un enfant ... » jusqu'à Sa parole : « Mais s'il a des frères, alors à sa mère revient le sixième » [Sourate An-Nisâ' : 11].</p>
<p><strong>La deuxième situation :</strong> Elle reçoit le tiers (1/3). Cela, en l'absence de la descendance héritière parmi les enfants et les enfants des fils, et en l'absence d'un groupe de frères et de sœurs ; car Allah le Très-Haut a dit :</p>
<p class="ar">﴿فَإِنْ لَمْ يَكُنْ لَهُ وَلَدٌ وَوَرِثَهُ أَبَوَاهُ فَلِأُمِّهِ الثُّلُثُ فَإِنْ كَانَ لَهُ إِخْوَةٌ فَلِأُمِّهِ السُّدُسُ﴾ [النساء: 11].</p>
<p>« S'il n'a pas d'enfant et que ses père et mère l'héritent, alors à sa mère revient le tiers ; mais s'il a des frères, alors à sa mère revient le sixième » [Sourate An-Nisâ' : 11].</p>
<p><strong>La troisième situation :</strong> Elle reçoit le tiers du reste, lorsque se réunissent un époux, un père et une mère, ou une épouse, un père et une mère. Ces deux cas sont appelés Al-'Umariyyatân (les deux cas de 'Umar), car 'Umar ibn al-Khattâb (qu'Allah l'agrée) a jugé à leur sujet que la mère reçoit le tiers du reste après la part de l'un des deux conjoints.</p>
<p>Le Cheikh de l'Islam Ibn Taymiyyah (qu'Allah lui fasse miséricorde) a dit<a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a> : « Et son avis est le plus juste ; car Allah n'a donné à la mère le tiers que lorsque ses père et mère l'héritent, c'est-à-dire dans Sa parole, le Très-Haut : ﴿فَإِنْ لَمْ يَكُنْ لَهُ وَلَدٌ وَوَرِثَهُ أَبَوَاهُ فَلِأُمِّهِ الثُّلُثُ﴾ ; et le reste, après la part prescrite des deux conjoints, constitue l'héritage des deux parents : ils se le partagent comme ils se partagent le capital, et comme si le défunt avait eu une dette ou un legs, ils se partageraient alors ce qui resterait par tiers. » Fin de citation.</p>
