<p><strong>Chapitre sur l'héritage de l'hermaphrodite (Al-Khunthâ)</strong></p>
<p>⁕ Le mot « khunthâ » est dérivé de « al-inkhinâth », qui signifie la souplesse, le fait de se plier et de se replier. On dit : « khanatha fam as-siqâ' » lorsqu'on a plié son embouchure vers l'extérieur et qu'on a bu par là. Dans la terminologie des spécialistes des parts légales (Al-Farâ'id), c'est : une personne qui possède à la fois un organe masculin et un organe féminin, ou qui n'a aucun organe du tout.</p>
<p>⁕ Les liens de parenté dans lesquels sa présence est possible sont : la filiation (Al-Bunûwah), la fraternité (Al-Ukhuwwah), l'oncle paternel (Al-'Umûmah) et le Walâ' (le lien d'affranchissement), car chacun des cas mentionnés peut être de sexe masculin ou de sexe féminin. Il n'est pas possible que l'hermaphrodite dont le cas est ambigu soit un père, ni une mère, ni un grand-père, ni une grand-mère ; car s'il en était ainsi, son cas deviendrait clair et il ne demeurerait pas ambigu. Il n'est pas possible non plus que l'hermaphrodite dont le cas est ambigu soit un époux ou une épouse, car son mariage n'est pas valable tant qu'il demeure ambigu.</p>
<p>⁕ Allah a créé les fils d'Adam mâles et femelles, comme Allah le Très-Haut a dit :</p>
<p class="ar">﴿يَا أَيُّهَا النَّاسُ اتَّقُوا رَبَّكُمُ الَّذِي خَلَقَكُمْ مِنْ نَفْسٍ وَاحِدَةٍ وَخَلَقَ مِنْهَا زَوْجَهَا وَبَثَّ مِنْهُمَا رِجَالًا كَثِيرًا وَنِسَاءً﴾ [النساء: 1]</p>
<p>« Ô hommes ! Craignez votre Seigneur qui vous a créés d'un seul être, et qui, de celui-ci, a créé son épouse, et qui, de ces deux-là, a fait répandre (sur la terre) beaucoup d'hommes et de femmes » [Sourate An-Nisâ' : 1].</p>
<p>Et Allah le Très-Haut a dit :</p>
<p class="ar">﴿لِلَّهِ مُلْكُ السَّمَاوَاتِ وَالْأَرْضِ يَخْلُقُ مَا يَشَاءُ يَهَبُ لِمَنْ يَشَاءُ إِنَاثًا وَيَهَبُ لِمَنْ يَشَاءُ الذُّكُورَ﴾ [الشورى: 49]</p>
<p>« À Allah appartient la royauté des cieux et de la terre. Il crée ce qu'Il veut. Il fait don de filles à qui Il veut, et Il fait don de garçons à qui Il veut » [Sourate Ach-Chûrâ : 49].</p>
<p>Il (qu'Il soit glorifié) a exposé le statut de chacun des deux, et Il n'a pas exposé le statut de celui qui est à la fois mâle et femelle ; cela indique donc que les deux caractéristiques ne se réunissent pas en une seule personne. Comment cela serait-il possible, alors qu'il existe entre eux une contradiction ? Il a placé entre les deux des signes distinctifs pour les différencier ; et malgré cela, la confusion peut survenir lorsqu'on trouve chez la personne à la fois un organe masculin et un organe féminin.</p>
<p>⁕ Les savants ont été unanimes sur le fait que l'hermaphrodite hérite selon ce qui apparaît chez lui comme signes distinctifs :</p>
<p>Par exemple : s'il urine par l'endroit par lequel urine l'homme, il hérite comme hérite un homme ; et s'il urine par l'endroit par lequel urine la femme, il hérite comme hérite une femme ; car l'indication que constitue l'urine quant à la masculinité ou à la féminité est la plus claire et la plus générale des indications, du fait de sa présence chez le petit comme chez le grand. Son urine par l'un des deux organes seulement indique donc qu'il en est le véritable organe, et l'organe par lequel il n'urine pas est comme un membre superflu et un défaut de la création. S'il urine par les deux organes ensemble, on tient compte de celui par lequel il urine le plus. Et si, au début, il urinait par un seul organe, puis s'est mis à uriner par les deux, on tient compte de l'organe par lequel il a commencé à uriner. Si les deux organes sont égaux quant à la sortie de l'urine, en durée et en quantité, on attend alors l'apparition d'un autre signe parmi les signes qui apparaissent à la puberté, et il demeure ambigu jusqu'à ce moment-là ; mais on espère que son cas s'éclaircira à la puberté.</p>
<p>Parmi les signes que l'on trouve à la puberté, certains sont propres aux hommes, comme la pousse de la moustache, la pousse de la barbe et l'émission de sperme par son organe masculin ; si l'un de ces signes se manifeste chez lui, c'est un homme. Et parmi eux, il y a des signes propres aux femmes, à savoir les menstrues, la grossesse et l'arrondissement des seins ; si l'un de ces signes se manifeste chez lui, c'est une femme.</p>
<p>⁕ Si rien ne se manifeste chez lui, ni parmi les signes des hommes ni parmi les signes des femelles à la puberté, il demeure ambigu, sans espoir que son cas s'éclaircisse. Les savants ont, quant à la manière de le faire hériter et de faire hériter ceux qui sont avec lui dans les deux situations, plusieurs avis :</p>
<ul>
<li><p>Parmi eux, il y a celui qui est d'avis que l'hermaphrodite ambigu est traité de la manière la plus défavorable pour lui, sans ceux qui sont avec lui ; on lui donne donc la moindre de ses deux parts, s'il est supposé mâle ou s'il est supposé femelle ; et s'il n'hérite pas dans l'une des deux suppositions, on ne lui donne rien.</p></li>
<li><p>Et parmi les savants, il y a celui qui est d'avis que l'hermaphrodite et ceux qui sont avec lui dans les deux situations sont traités de la manière la plus défavorable ; le reste est suspendu jusqu'à ce que le cas de l'hermaphrodite s'éclaircisse ou que les héritiers s'accordent sur son partage.</p></li>
<li><p>Et parmi les savants, il y a celui qui est d'avis que l'hermaphrodite ambigu reçoit la moitié de la part d'un mâle et la moitié de la part d'une femelle, s'il hérite dans les deux cas, avec une différence entre les deux parts ; et s'il hérite dans l'une des deux suppositions seulement, sans l'autre, il a la moitié de la supposition dans laquelle il hérite. Cette règle est appliquée, que l'on espère l'éclaircissement du cas de l'hermaphrodite ou que l'on ne l'espère pas.</p></li>
<li><p>Et parmi les savants, il y a celui qui est d'avis qu'il faut distinguer : si l'on espère l'éclaircissement du cas de l'hermaphrodite, lui et ceux qui sont avec lui sont traités de la manière la plus défavorable ; on leur donne, à lui et à ceux qui sont avec lui, ce qui est certain de leur héritage, et le reste est suspendu jusqu'à l'éclaircissement de son cas. Et si l'on n'espère pas l'éclaircissement de son cas, l'hermaphrodite reçoit la moitié de la part d'un mâle et la moitié de la part d'une femelle s'il hérite dans les deux suppositions ; et s'il hérite dans l'une des deux suppositions seulement, on lui donne la moitié de ce qu'il mérite par celle-ci. Et Allah le Très-Haut sait mieux.</p></li>
</ul>
