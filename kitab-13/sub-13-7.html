<p><strong>Chapitre sur l'héritage des pères et des grands-pères</strong></p>
<p>⁕ À chacun du père et du grand-père revient le sixième, à titre de part prescrite, en présence des enfants mâles et des enfants du fils ; en raison de Sa parole le Très-Haut :</p>
<p class="ar">﴿وَلِأَبَوَيْهِ لِكُلِّ وَاحِدٍ مِنْهُمَا السُّدُسُ مِمَّا تَرَكَ إِنْ كَانَ لَهُ وَلَدٌ﴾ [النساء: 11]</p>
<p>« Et pour ses père et mère, à chacun d'eux le sixième de ce qu'il laisse, s'il a un enfant » [Sourate An-Nisâ' : 11].</p>
<p>⁕ Le père et le grand-père héritent par agnation (Ta'sîb) en l'absence d'enfant et d'enfant du fils ; en raison de Sa parole le Très-Haut :</p>
<p class="ar">﴿فَإِنْ لَمْ يَكُنْ لَهُ وَلَدٌ وَوَرِثَهُ أَبَوَاهُ فَلِأُمِّهِ الثُّلُثُ﴾ [النساء: 11]</p>
<p>« S'il n'a pas d'enfant et que ses père et mère héritent de lui, à sa mère le tiers » [Sourate An-Nisâ' : 11]. Il a donc rattaché l'héritage aux deux parents, le père et la mère, a déterminé la part de la mère et n'a pas déterminé la part du père ; le reste lui revient donc par agnation (Ta'sîb).</p>
<p>⁕ Le père et le grand-père héritent à la fois par la part prescrite et par agnation, en présence des filles et des filles du fils ; en raison de sa parole ﷺ :</p>
<p class="ar">«أَلْحِقُوا الْفَرَائِضَ بِأَهْلِهَا؛ فَمَا بَقِيَ؛ فَلِأَوْلَى رَجُلٍ ذَكَرٍ»</p>
<p>« Attribuez les parts légales à leurs ayants droit ; ce qui reste revient à l'homme mâle le plus proche. »<a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a> C'est-à-dire : à l'homme le plus proche du défunt ; et le père est le mâle le plus proche après le fils et le fils du fils.</p>
<p>⁕ Il en résulte que le père a trois situations :</p>
<p><strong>La première situation :</strong> il hérite par la part prescrite uniquement, et cela en présence du fils du défunt issu de ses reins, ou du fils de son fils, même s'il descend.</p>
<p><strong>La deuxième situation :</strong> il hérite par agnation (Ta'sîb) uniquement, en l'absence d'enfant et d'enfant du fils.</p>
<p><strong>La troisième situation :</strong> il hérite à la fois par la part prescrite et par agnation, en présence des femelles parmi les enfants du défunt ou parmi les enfants de son fils.</p>
<p>⁕ Le grand-père est comme le père dans de telles situations, en raison de l'application des textes à son égard en l'absence du père. Et le grand-père s'ajoute au père par une quatrième situation, qui est celle où il se trouve avec des frères germains ou de même père : on a divergé dans cette situation sur le point de savoir s'il est alors comme le père, qui exclut les frères, ou s'il ne les exclut pas et partage avec eux l'héritage, de sorte qu'il est comme l'un d'eux, ils se partagent les biens ou ce que les parts prescrites ont laissé, selon des modalités connues dans ce chapitre ; parce que le grand-père et les frères sont égaux dans le fait de se rattacher par le père : le grand-père est son père, et les frères sont ses fils, et ils sont donc égaux dans l'héritage ; comme l'ont soutenu un groupe de Compagnons, tels que 'Alî, Ibn Mas'ûd et Zayd Ibn Thâbit, et c'est l'avis de l'imam Mâlik, d'Ash-Shâfi'î, des deux disciples d'Abû Hanîfah et d'Ahmad selon l'avis connu rapporté de lui. Ils ont argumenté par des preuves, des orientations et de nombreuses analogies mentionnées dans les ouvrages volumineux.</p>
<p>Et le second avis : le grand-père fait tomber les frères, comme le fait le père. C'est ce qu'ont soutenu Abû Bakr As-Siddîq, Ibn 'Abbâs et Ibn Az-Zubayr ; et cela a été rapporté de 'Uthmân, de 'Â'ishah, d'Ubayy Ibn Ka'b, de Jâbir et d'autres. C'est l'avis de l'imam Abû Hanîfah, ainsi qu'une version rapportée de l'imam Ahmad, et c'est ce qu'ont choisi le Cheikh de l'Islam Ibn Taymiyyah, Ibn al-Qayyim et le Cheikh Muhammad Ibn 'Abd al-Wahhâb (qu'Allah leur fasse miséricorde à tous) ; ils ont de nombreuses preuves. Et cet avis est plus proche de la vérité que le premier avis. Et Allah est plus savant.</p>
