<p><strong>Chapitre sur l'héritage des noyés et de ceux morts sous des décombres</strong></p>
<p>⁕ Cette question est de survenue fréquente et d'une immense difficulté : c'est la question de la mort collective d'un groupe de personnes qui héritent les unes des autres, dont on ne sait pas qui est décédé en premier pour être le défunt, ni qui est décédé en dernier pour être l'héritier. Cela se produit souvent à notre époque à la suite des accidents de la route sur lesquels périssent des groupes de gens, tels que les accidents de voitures, d'avions et de trains, ainsi que les accidents d'effondrement, d'incendie, de noyade, de bombardement lors des guerres, et autres.</p>
<p>⁕ Lorsque quelque chose de cela survient, l'affaire ne sort pas de cinq situations :</p>
<p><strong>La première situation :</strong> que l'on sache que tous les membres du groupe sont morts au même instant, sans que l'un d'eux n'ait précédé l'autre. Dans cette situation, il n'y a pas d'héritage entre eux, par consensus (Ijmâ'), car l'une des conditions de l'héritage est que l'héritier soit assurément vivant après la mort du défunt, et cette condition est ici absente.</p>
<p><strong>La deuxième situation :</strong> que l'on sache précisément lequel d'entre eux est mort le dernier après la mort de l'autre, et que cela ne soit pas oublié. Celui qui est mort en dernier hérite alors de celui qui l'a précédé, par consensus, afin que soit réalisée la vie de l'héritier après la mort du défunt.</p>
<p><strong>La troisième situation :</strong> que l'on sache que certains sont morts après les autres, sans désignation de celui qui est mort en premier et de celui qui est mort en dernier.</p>
<p><strong>La quatrième situation :</strong> que l'on sache que certains sont morts après les autres, de façon précise, mais que cela ait été oublié.</p>
<p><strong>La cinquième situation :</strong> que l'on ignore comment ils sont morts : on ne sait pas s'ils sont tous morts en même temps ou s'ils sont morts à des moments différents.</p>
<p>⁕ Dans ces trois dernières situations, il y a matière à éventualité et champ ouvert à l'effort de réflexion (ijtihâd) et à l'examen. Les savants (qu'Allah leur fasse miséricorde) ont divergé à ce sujet en deux avis :</p>
<p><strong>Le premier avis :</strong> L'absence d'héritage mutuel dans ces trois situations toutes ensemble. C'est l'avis d'un groupe de compagnons, parmi lesquels Abû Bakr As-Siddîq, Zayd ibn Thâbit et Ibn 'Abbâs (qu'Allah les agrée). C'est aussi l'avis des trois imams, Abû Hanîfah, Mâlik et Ach-Châfi'î, et c'est une déduction dans l'école d'Ahmad. Car parmi les conditions de l'héritage figure la réalisation de la vie de l'héritier après la mort du défunt, et cette condition n'est pas réalisée ici : elle est au contraire douteuse, et il n'y a pas d'héritage avec le doute. De plus, les tués de la bataille d'Al-Yamâmah, les tués de la bataille de Siffîn et les tués d'Al-Harrah n'ont pas hérité les uns des autres.</p>
<p><strong>Le second avis :</strong> Chacun hérite de l'autre. C'est l'avis d'un groupe de compagnons, parmi lesquels 'Umar ibn Al-Khattâb et 'Alî (qu'Allah les agrée), et c'est l'apparent de l'école d'Ahmad (qu'Allah lui fasse miséricorde). L'argument de cet avis est que la vie de chacun d'eux était établie avec certitude, et que le principe est qu'elle se soit maintenue jusqu'après la mort de l'autre. En outre, 'Umar (qu'Allah l'agrée), lorsque la peste survint à Ach-Châm, [vit] les gens d'une même maisonnée se mettre à mourir jusqu'au dernier ; on lui écrivit à ce sujet, et il ordonna qu'ils héritent les uns des autres.</p>
<p>Pour qu'il y ait héritage, il est requis que les héritiers des morts dont l'ordre de décès est incertain ne divergent pas, de sorte que les héritiers de chaque défunt prétendent que leur défunt est mort après l'autre, sans qu'il y ait de preuve ; car alors ils se font prêter serment les uns aux autres, et il n'y a pas d'héritage entre eux.</p>
<p>Et la manière de procéder à l'héritage selon cet avis : que chacun hérite de ce que l'autre a acquis de nouveau, c'est-à-dire de son bien ancien, à l'exclusion de son bien nouveau, c'est-à-dire de son bien récent dont il a hérité de ceux qui sont morts avec lui dans l'accident. Cela, en supposant que l'un d'eux est mort en premier : son bien ancien est partagé entre ses héritiers vivants et celui qui est mort avec lui. Ce qui revient, sur ce partage, à celui qui est mort avec lui de la part de son bien, tu le partages entre ses seuls héritiers vivants, à l'exclusion de ceux qui sont morts avec lui, afin qu'il n'hérite pas de son propre bien. Puis tu inverses l'opération avec l'autre : tu supposes qu'il est mort en premier, et tu procèdes avec lui comme tu as procédé avec le premier.</p>
<p>⁕ L'avis le plus juste dans cette question est le premier, à savoir l'absence d'héritage mutuel, car l'héritage ne s'établit pas par l'éventualité et le doute, et la situation de ces morts dans cette question est inconnue, et l'inconnu est comme l'inexistant ; l'antériorité de la mort de l'un d'eux dans cette situation est inconnue, et elle est donc comme l'inexistante. De plus, l'héritage n'est acquis au vivant que pour qu'il soit un successeur du défunt qui profite de son bien après lui, et celui-ci est ici un disparu, avec ce que l'avis de l'héritage mutuel entraîne de contradiction : car faire hériter l'un d'eux de son compagnon impose qu'il soit mort après lui, et faire hériter son compagnon de lui impose qu'il soit mort avant, de sorte que chacun d'eux serait à la fois antérieur et postérieur. Selon cet avis le plus juste, qui est l'absence d'héritage mutuel, le bien de chacun d'eux revient à ses seuls héritiers vivants, à l'exclusion de ceux qui sont morts avec lui, en s'appuyant sur la certitude et en s'écartant du doute. Et Allah sait mieux.</p>
