<p>⁕ Les femmes interdites au mariage sont de deux catégories :</p>
<h3 id="la-première-catégorie-celles-qui-sont-interdites-de-manière-permanente."><strong>La première catégorie :</strong> Celles qui sont interdites de manière permanente. </h3>
<p>Elles sont au nombre de quatorze : sept sont interdites par les liens du sang (la parenté), et sept sont interdites par cause (alliance ou allaitement). Ce sont celles qui sont mentionnées dans la parole d'Allah d'Exalté :</p>
<p class="ar"><span dir="rtl">﴿وَلَا تَنْكِحُوا...﴾ [النساء: ٢٢ - ٢٣] الآيَتَيْن.</span></p>
<p><em><strong>{Et n'épousez pas...}</strong></em> [Sourate An-Nisâ : 22 - 23], jusqu'à la fin des deux versets.</p>
<h4 id="premièrement-celles-qui-sont-interdites-par-la-parenté-les-liens-du-sang-et-dont-voici-le-détail"><strong>Premièrement : Celles qui sont interdites par la parenté (les liens du sang), et dont voici le détail :</strong></h4>
<p>⁃ La mère et la grand-mère, conformément à la parole d'Allah l'Exalté :</p>
<p class="ar"><span dir="rtl">﴿حُرِّمَتْ عَلَيْكُمْ أُمَّهَاتُكُمْ﴾ [النساء: ٢٣]</span></p>
<p><em><strong>{Vous sont interdites vos mères}</strong></em> [Sourate An-Nisâ : 23].</p>
<p>⁃ La fille, la fille du fils, la fille de la fille, et la fille de la fille du fils, conformément à la parole d'Allah l'Exalté :</p>
<p class="ar"><span dir="rtl">﴿وَبَنَاتُكُمْ﴾ [النساء: ٢٣]</span></p>
<p><em><strong>{ainsi que vos filles}</strong></em> [Sourate An-Nisâ : 23].</p>
<p>⁃ La sœur, qu'elle soit germaine (de même père et même mère), consanguine (du côté du père) ou utérine (du côté de la mère), conformément à la parole d'Allah l'Exalté :</p>
<p class="ar"><span dir="rtl">﴿وَأَخَوَاتُكُمْ﴾ [النساء: ٢٣]</span></p>
<p><em><strong>{vos sœurs}</strong></em> [Sourate An-Nisâ : 23].</p>
<p>⁃ La fille de la sœur, la fille de son fils, et la fille de sa fille, conformément à la parole d'Allah l'Exalté :</p>
<p class="ar"><span dir="rtl">﴿وَبَنَاتُ الْأُخْتِ﴾ [النساء: ٢٣]</span></p>
<p><em><strong>{les filles de vos sœurs}</strong></em> [Sourate An-Nisâ : 23].</p>
<p>⁃ La fille du frère, la fille de la fille du frère, et la fille de son fils, conformément à la parole d'Allah l'Exalté :</p>
<p class="ar"><span dir="rtl">﴿وَبَنَاتُ الْأَخِ﴾ [النساء: ٢٣]</span></p>
<p><em><strong>{les filles de vos frères}</strong></em> [Sourate An-Nisâ : 23].</p>
<p>⁃ La tante paternelle et la tante maternelle, conformément à la parole d'Allah l'Exalté :</p>
<p class="ar"><span dir="rtl">﴿وَعَمَّاتُكُمْ وَخَالَاتُكُمْ﴾ [النساء: ٢٣]</span></p>
<p><em><strong>{vos tantes paternelles et vos tantes maternelles}</strong></em> [Sourate An-Nisâ : 23].</p>
<h4 id="deuxièmement-celles-qui-sont-interdites-par-cause-indirecte-et-dont-voici-le-détail"><strong>Deuxièmement : Celles qui sont interdites par cause (indirecte), et dont voici le détail :</strong></h4>
<p>⁃ La femme qui a subi le serment d'anathème (<em>Al-Mulâ'anah</em>) devient interdite à celui qui l'a désavouée (<em>Al-Mulâ'in</em>). Cela s'appuie sur ce qu'a rapporté Al-Jûzajânî, d'après Sahl ibn Sa'd qui a dit : <em>« La Sounnah établie concernant les deux conjoints ayant pratiqué l'anathème est qu'ils soient séparés, puis ils ne se réuniront plus jamais (par le mariage). »</em><a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a> Al-Muwaffaq (Ibn Qoudâmah) a dit : <em>« Nous ne connaissons personne qui ait soutenu un avis contraire à cela. »</em></p>
<p>⁃ Deviennent interdites par l'allaitement les mêmes catégories que celles interdites par la parenté (liens du sang) mentionnées précédemment. Ainsi, chaque femme qui était interdite par la parenté voit son équivalente interdite par l'allaitement, comme les mères et les sœurs (de lait). Cela est conforme à la parole d'Allah l'Exalté :</p>
<p class="ar"><span dir="rtl">﴿وَأُمَّهَاتُكُمُ اللَّاتِي أَرْضَعْنَكُمْ وَأَخَوَاتُكُمْ مِنَ الرَّضَاعَةِ﴾ [النساء: ٢٣]</span></p>
<p><em><strong>{et vos mères qui vous ont allaités, et vos sœurs de lait}</strong></em> [Sourate An-Nisâ : 23], et d'après la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«يَحْرُمُ مِنَ الرَّضَاعِ مَا يَحْرُمُ مِنَ النَّسَبِ»</span></p>
<p><em><strong>« L'allaitement interdit ce que la parenté interdit. »</strong></em> (Rapporté par Al-Boukhârî et Muslim).<a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a></p>
<p>⁃ Deviennent interdites, par le simple fait de la conclusion du contrat de mariage (<em>Al-'Aqd</em>), l'épouse de son père ainsi que l'épouse de son grand-père, conformément à la parole d'Allah l'Exalté :</p>
<p class="ar"><span dir="rtl">﴿وَلَا تَنْكِحُوا مَا نَكَحَ آبَاؤُكُمْ مِنَ النِّسَاءِ﴾ [النساء: ٢٢]</span></p>
<p><em><strong>{Et n'épousez pas les femmes que vos pères ont épousées}</strong></em> [Sourate An-Nisâ : 22].</p>
<p>⁃ Devient interdite l'épouse de son fils, ainsi que des descendants de celui-ci (petits-fils...), conformément à la parole d'Allah l'Exalté :</p>
<p class="ar"><span dir="rtl">﴿وَحَلَائِلُ أَبْنَائِكُمُ الَّذِينَ مِنْ أَصْلَابِكُمْ﴾ [النساء: ٢٣]</span></p>
<p><em><strong>{ainsi que les femmes de vos fils nés de vos reins}</strong></em> [Sourate An-Nisâ : 23].</p>
<p>⁃ Deviennent interdites pour lui la mère de son épouse ainsi que ses grands-mères, par le simple fait de la conclusion du contrat de mariage (<em>Al-'Aqd</em>), conformément à la parole d'Allah l'Exalté :</p>
<p class="ar"><span dir="rtl">﴿وَأُمَّهَاتُ نِسَائِكُمْ﴾ [النساء: ٢٣]</span></p>
<p><em><strong>{les mères de vos femmes}</strong></em> [Sourate An-Nisâ : 23].</p>
<p>⁃ Deviennent interdites la fille de l'épouse (la belle-fille/belle-fille par alliance) ainsi que les filles de ses enfants (ses petites-filles), à condition qu'il ait consommé le mariage avec la mère. Cela est conforme à la parole d'Allah l'Exalté :</p>
<p class="ar"><span dir="rtl">﴿وَرَبَائِبُكُمُ اللَّاتِي فِي حُجُورِكُمْ مِنْ نِسَائِكُمُ اللَّاتِي دَخَلْتُمْ بِهِنَّ فَإِنْ لَمْ تَكُونُوا دَخَلْتُمْ بِهِنَّ فَلَا جُنَاحَ عَلَيْكُمْ﴾ [النساء: ٢٣]</span></p>
<p><em><strong>{les filles de vos femmes ayant été sous votre tutelle, nées des femmes avec lesquelles vous avez consommé le mariage ; si le mariage n'a pas été consommé, ceci ne vous est pas un péché}</strong></em> [Sourate An-Nisâ : 23].</p>
<p>C'est pourquoi, il convient à présent de citer ce noble verset dans son intégralité et sa continuité, après avoir détaillé les différentes catégories de femmes interdites au mariage qui y sont mentionnées. Allah l'Exalté a dit :</p>
<p class="ar"><span dir="rtl">﴿حُرِّمَتْ عَلَيْكُمْ أُمَّهَاتُكُمْ وَبَنَاتُكُمْ وَأَخَوَاتُكُمْ وَعَمَّاتُكُمْ وَخَالَاتُكُمْ وَبَنَاتُ الْأَخِ وَبَنَاتُ الْأُخْتِ وَأُمَّهَاتُكُمُ اللَّاتِي أَرْضَعْنَكُمْ وَأَخَوَاتُكُمْ مِنَ الرَّضَاعَةِ وَأُمَّهَاتُ نِسَائِكُمْ وَرَبَائِبُكُمُ اللَّاتِي فِي حُجُورِكُمْ مِنْ نِسَائِكُمُ اللَّاتِي دَخَلْتُمْ بِهِنَّ فَإِنْ لَمْ تَكُونُوا دَخَلْتُمْ بِهِنَّ فَلَا جُنَاحَ عَلَيْكُمْ وَحَلَائِلُ أَبْنَائِكُمُ الَّذِينَ مِنْ أَصْلَابِكُمْ وَأَنْ تَجْمَعُوا بَيْنَ الْأُخْتَيْنِ إِلَّا مَا قَدْ سَلَفَ إِنَّ اللَّهَ كَانَ غَفُوراً رَحِيماً﴾ [النساء: ٢٣].</span></p>
<p><em><strong>{Vous sont interdites vos mères, vos filles, vos sœurs, vos tantes paternelles, vos tantes maternelles, les filles de vos frères, les filles de vos sœurs, vos mères qui vous ont allaités, vos sœurs de lait, les mères de vos femmes, les filles de vos femmes ayant été sous votre tutelle, nées des femmes avec lesquelles vous avez consommé le mariage – si le mariage n'a pas été consommé, ceci ne vous est pas un péché – ainsi que les femmes de vos fils nés de vos reins, de même que d'unir deux sœurs (dans le mariage), exception faite des cas passés. Certes, Allah est Pardonneur et Miséricordieux.}</strong></em> [Sourate An-Nisâ : 23].</p>
<h3 id="la-deuxième-catégorie-celles-dont-linterdiction-est-temporaire."><strong>La deuxième catégorie : Celles dont l'interdiction est temporaire.</strong></h3>
<p>Elle se divise en deux types :</p>
<p><strong>Le premier type :</strong> Ce qui est interdit en raison de la simultanéité (le fait de cumuler deux personnes en même temps sous un même contrat de mariage) :</p>
<p>⁃ Il est ainsi interdit d'unir deux sœurs (dans un même mariage), conformément à la parole d'Allah l'Exalté :</p>
<p class="ar"><span dir="rtl">﴿وَأَنْ تَجْمَعُوا بَيْنَ الْأُخْتَيْنِ﴾ [النساء: ٢٣]</span></p>
<p><em><strong>{de même que d'unir deux sœurs}</strong></em> [Sourate An-Nisâ : 23]. De la même manière, il est interdit d'unir une femme avec sa tante paternelle, ou une femme avec sa tante maternelle, conformément à la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«لَا يُجْمَعُ بَيْنَ الْمَرْأَةِ وَعَمَّتِهَا وَلَا بَيْنَ الْمَرْأَةِ وَخَالَتِهَا»</span></p>
<p><em><strong>« On ne doit pas unir la femme avec sa tante paternelle, ni la femme avec sa tante maternelle. »</strong></em> (Rapporté par Al-Boukhârî et Muslim).<a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a></p>
<p>Le Prophète <span dir="rtl">ﷺ</span> a certes explicité la sagesse derrière cette interdiction lorsqu'il a dit :</p>
<p class="ar"><span dir="rtl">«إِنَّكُمْ إِذَا فَعَلْتُمْ ذَلِكَ؛ قَطَعْتُمْ أَرْحَامَكُمْ»</span></p>
<p><em><strong>« Si vous faites cela, vous romprez vos liens de parenté. »</strong></em><a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a> En effet, cela s'explique par la jalousie qui s'installe naturellement entre co-épouses. Si l'une d'elles fait partie des proches parentes de l'autre, cela provoquerait une rupture de leurs liens de sang. En revanche, si la femme est divorcée et que sa période de viduité (<em>'Iddah</em>) est terminée, sa sœur, sa tante paternelle ou sa tante maternelle deviennent alors permises (au mariage), car le motif d'interdiction n'existe plus.</p>
<p>⁃ Il n'est pas permis non plus de réunir plus de quatre épouses en même temps, conformément à la parole d'Allah l'Exalté :</p>
<p class="ar"><span dir="rtl">﴿فَانْكِحُوا مَا طَابَ لَكُمْ مِنَ النِّسَاءِ مَثْنَى وَثُلَاثَ وَرُبَاعَ﴾ [النساء: ٣]</span></p>
<p><em><strong>{Il vous est permis d'épouser deux, trois ou quatre parmi les femmes qui vous plaisent}</strong></em> [Sourate An-Nisâ : 3]. De plus, le Prophète <span dir="rtl">ﷺ</span> a ordonné à quiconque embrassait l'islam alors qu'il avait plus de quatre épouses sous sa tutelle de se séparer de celles qui dépassaient ce nombre de quatre.<a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a></p>
<p><strong>Le deuxième type :</strong> Ce dont l'interdiction est due à un empêchement temporaire (accidentel) appelé à disparaître :</p>
<p>⁃ Il est ainsi interdit d'épouser une femme qui est dans sa période de viduité (<em>'Iddah</em>) consécutive à une séparation d'avec un autre homme, conformément à la parole d'Allah l'Exalté :</p>
<p class="ar"><span dir="rtl">﴿وَلَا تَعْزِمُوا عُقْدَةَ النِّكَاحِ حَتَّى يَبْلُغَ الْكِتَابُ أَجَلَهُ﴾ [البقرة: ٢٣٥]</span></p>
<p><em><strong>{Et ne décidez pas le contrat de mariage avant que le délai prescrit n'arrive à son terme}</strong></em> [Sourate Al-Baqarah : 235]. Parmi les sagesses de cette règle, il y a le fait qu'on ne peut s'assurer qu'elle ne soit pas enceinte ; un mariage prématuré conduirait alors au mélange des eaux et à la confusion des généalogies (filiation).</p>
<p>⁃ Il est également interdit d'épouser la fornicatrice si sa fornication est avérée, et ce, jusqu'à ce qu'elle se repente et que sa période de viduité (de purification) soit achevée, conformément à la parole d'Allah l'Exalté :</p>
<p class="ar"><span dir="rtl">﴿وَالزَّانِيَةُ لَا يَنْكِحُهَا إِلَّا زَانٍ أَوْ مُشْرِكٌ وَحُرِّمَ ذَلِكَ عَلَى الْمُؤْمِنِينَ﴾ [النور: ٣].</span></p>
<p><em><strong>{et la fornicatrice ne sera épousée que par un fornicateur ou un associateur. Et cela a été interdit aux croyants}</strong></em> [Sourate An-Nûr : 3].</p>
<p>⁃ Il est interdit à l'homme de réépouser la femme qu'il a divorcée trois fois, jusqu'à ce qu'elle soit épousée et consommée par un autre époux dans le cadre d'un mariage valide, conformément à la parole d'Allah l'Exalté :</p>
<p class="ar"><span dir="rtl">﴿الطَّلَاقُ مَرَّتَانِ...﴾ [البقرة: ٢٢٩] إِلَى قَوْلِهِ: ﴿فَإِنْ طَلَّقَهَا﴾ [البقرة: ٢٣٠]</span></p>
<p><em><strong>{Le divorce est permis pour deux fois...}</strong></em> [Sourate Al-Baqarah : 229] jusqu'à Sa parole : <em><strong>{S'il divorce avec elle}</strong></em> [Sourate Al-Baqarah : 230] — c'est-à-dire : la troisième fois —</p>
<p class="ar"><span dir="rtl">﴿فَلَا تَحِلُّ لَهُ مِنْ بَعْدُ حَتَّى تَنْكِحَ زَوْجاً غَيْرَهُ﴾ [البقرة: ٢٣٠].</span></p>
<p><em><strong>{alors elle ne lui est plus licite tant qu'elle n'a pas épousé un autre homme}</strong></em> [Sourate Al-Baqarah : 230].</p>
<p>⁃ Il est interdit d'épouser une femme en état de sacralisation (<em>Muhrimah</em>) tant qu'elle n'a pas quitté son état de sacralisation (<em>Ihram</em>). De la même manière, il n'est pas permis à l'homme en état de sacralisation de conclure un contrat de mariage avec une femme alors qu'il est en état d'Ihram, conformément à la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«لَا يَنْكِحُ الْمُحْرِمُ وَلَا يُنْكَحُ وَلَا يَخْطُبُ»</span></p>
<p><em><strong>« L'homme en état de sacralisation ne se marie pas, on ne le marie pas et il ne fait pas de demande en mariage. »</strong></em> (Rapporté par le groupe de rapporteurs de Hadiths, à l'exception d'Al-Boukhârî).<a href="#fn6" class="footnote-ref" id="fnref6" role="doc-noteref"><sup>6</sup></a></p>
<p>⁃ Il n'est pas licite qu'un mécréant épouse une femme musulmane, conformément à la parole d'Allah l'Exalté :</p>
<p class="ar"><span dir="rtl">﴿وَلَا تُنْكِحُوا الْمُشْرِكِينَ حَتَّى يُؤْمِنُوا﴾ [البقرة: ٢٢١]</span></p>
<p><em><strong>{Et ne donnez pas d'épouses aux associateurs tant qu'ils n'ont pas la foi}</strong></em> [Sourate Al-Baqarah : 221].</p>
<p>⁃ Et le musulman n'épouse pas une femme mécréante, conformément à la parole d'Allah l'Exalté :</p>
<p class="ar"><span dir="rtl">﴿وَلَا تَنْكِحُوا الْمُشْرِكَاتِ حَتَّى يُؤْمِنَّ﴾ [البقرة: ٢٢١]</span></p>
<p><em><strong>{Et n'épousez pas les femmes associatrices tant qu'elles n'ont pas la foi}</strong></em> [Sourate Al-Baqarah : 221], et Sa parole :</p>
<p class="ar"><span dir="rtl">﴿وَلَا تُمْسِكُوا بِعِصَمِ الْكَوَافِرِ﴾ [الممتحنة: ١٠]</span></p>
<p><em><strong>{Et ne gardez pas de liens conjugaux avec les mécréantes}</strong></em> [Sourate Al-Mumtahanah : 10]. Fait exception à cela la femme libre parmi les gens du Livre (<em>Al-Kitâbiyyah</em> : juive ou chrétienne), qu'il est permis au musulman d'épouser, conformément à la parole d'Allah l'Exalté :</p>
<p class="ar"><span dir="rtl">﴿وَالْمُحْصَنَاتُ مِنَ الَّذِينَ أُوتُوا الْكِتَابَ مِنْ قَبْلِكُمْ﴾ [المائدة: ٥]</span></p>
<p><em><strong>{Et [vous sont permises] les femmes vertueuses parmi ceux auxquels le Livre a été donné avant vous}</strong></em> [Sourate Al-Mâ'idah : 5] — c'est-à-dire : elles vous sont licites. Ce verset vient ainsi spécifier la portée générale des deux versets précédents concernant l'interdiction aux musulmans d'épouser des femmes mécréantes. Les gens de science sont certes unanimes (<em>Ijmâ'</em>) sur ce point.</p>
<p>⁃ Il est interdit à l'homme libre musulman d'épouser une esclave musulmane, car cela conduit à la réduction en esclavage des enfants qu'il aura avec elle. Exception est faite s'il craint de succomber à la fornication (<em>Zinâ</em>) et qu'il n'a pas les moyens d'offrir la dot (<em>Mahr</em>) d'une femme libre, ni le prix d'achat d'une esclave. Dans ce cas précis, il lui est permis d'épouser une esclave musulmane, conformément à la parole du Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿وَمَن لَّمْ يَسْتَطِعْ مِنكُمْ طَوْلًا أَن يَنكِحَ الْمُحْصَنَاتِ الْمُؤْمِنَاتِ...﴾ [النساء: ٢٥] إِلَى قَوْلِهِ: ﴿ذَلِكَ لِمَنْ خَشِيَ الْعَنَتَ مِنكُمْ﴾ [النساء: ٢٥].</span></p>
<p><strong>« Et quiconque parmi vous n'a pas les moyens d'épouser des femmes libres croyantes... »</strong> [An-Nisâ' : 25] jusqu'à Sa parole : <strong>« Cela est accordé à celui d'entre vous qui craint de tomber dans le péché (la fornication). »</strong> [An-Nisâ' : 25].</p>
<p>⁃ Il est interdit à l'esclave d'épouser sa maîtresse, en raison du consensus (<em>Ijmâ'</em>) et parce que le fait qu'elle soit sa maîtresse est incompatible avec le fait qu'il soit son époux, car chacun de ces deux statuts implique des règles juridiques spécifiques .</p>
<p>⁃ Il est interdit au maître d'épouser l'esclave qui lui appartient (<em>Mamlûkah</em>), car le contrat de possession (de propriété) est plus fort que le contrat de mariage, et un contrat ne peut s'associer avec un autre contrat qui lui est inférieur en force.</p>
<p>⁃ Les rapports intimes découlant de la possession légitime (<em>Milk al-Yamîn</em>) sont régis par les mêmes règles que les rapports intimes découlant du contrat de mariage concernant les interdictions temporaires mentionnées précédemment. Ainsi, toute femme dont les rapports sont interdits par contrat de mariage — comme la femme en période de viduité (<em>Mu'taddah</em>), celle en état de sacralité (<em>Muhrimah</em> pour le pèlerinage), la femme adultère (<em>Zâniyah</em>) ou la femme divorcée trois fois — voit également ses rapports interdits par la possession légitime. En effet, si le contrat de mariage est interdit parce qu'il constitue une voie vers les rapports intimes, alors l'interdiction directe des rapports intimes s'impose à plus forte raison .</p>
