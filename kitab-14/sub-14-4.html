<p>⁕ Il est recommandé, lors de la volonté de conclure le contrat de mariage, de faire précéder celui-ci d'un prône (discours) appelé "le prône d'Ibn Mas'ûd". Celui qui l'énonce est soit celui qui conclut le contrat (l'officiant), soit une autre personne parmi les assistants. Sa formulation est la suivante :</p>
<p class="ar"><span dir="rtl">«إِنَّ الْحَمْدَ لِلَّهِ؛ نَحْمَدُهُ، وَنَسْتَعِينُهُ، وَنَسْتَغْفِرُهُ، وَنَتُوبُ إِلَيْهِ، وَنَعُوذُ بِاللَّهِ مِنْ شُرُورِ أَنْفُسِنَا وَسَيِّئَاتِ أَعْمَالِنَا، مَنْ يَهْدِهِ اللَّهُ؛ فَلَا مُضِلَّ لَهُ، وَمَنْ يُضْلِلْ؛ فَلَا هَادِيَ لَهُ، وَأَشْهَدُ أَنْ لَا إِلَهَ إِلَّا اللَّهُ، وَأَشْهَدُ أَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُولُهُ»</span></p>
<p><em><strong>« Certes, la louange est à Allah ; nous Le louons, nous implorons Son secours, nous demandons Son pardon et nous nous repentons à Lui. Et nous cherchons refuge auprès d'Allah contre les maux de nos âmes et les méfaits de nos actions. Quiconque Allah guide, nul ne peut l'égarer, et quiconque Il égare, nul ne peut le guider. Et j'atteste qu'il n'y a de divinité digne d'adoration qu'Allah, et j'atteste que Muhammad est Son serviteur et Son messager »</strong></em>. Rapporté par les cinq (imams) et authentifié (Jugé bon / Hassan) par Al-Tirmidhî <a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a>. Et il récite, après ce prône, trois versets du Livre d'Allah :</p>
<p><strong>Le premier :</strong> La parole d'Allah Tout-Haut :</p>
<p class="ar"><span dir="rtl">﴿يَأَيُّهَا الَّذِينَ ءَامَنُواْ اتَّقُواْ اللَّهَ حَقَّ تُقَاتِهِۦ وَلَا تَمُوتُنَّ إِلَّا وَأَنتُم مُّسْلِمُونَ﴾ [آل عمران : ١٠٢]</span></p>
<p><em><strong>« Ô vous qui avez cru ! Craignez Allah de Sa vraie crainte. Et ne mourez qu'en étant musulmans (soumis). »</strong></em> [Al 'Imran : 102].</p>
<p><strong>Le deuxième :</strong> La parole d'Allah Tout-Haut :</p>
<p class="ar"><span dir="rtl">﴿يَٰأَيُّهَا النَّاسُ اتَّقُواْ رَبَّكُمُ الَّذِى خَلَقَكُم مِّن نَّفْسٍ وَٰحِدَةٍ وَخَلَقَ مِنْهَا زَوْجَهَا وَبَثَّ مِنْهُمَا رِجَالًا كَثِيرًا وَنِسَآءً ۚ وَاتَّقُواْ اللَّهَ الَّذِى تَسَآءَلُونَ بِهِۦ وَالْأَرْحَامَ ۚ إِنَّ اللَّهَ كَانَ عَلَيْكُمْ رَقِيبًا﴾ [النساء : ١]</span></p>
<p><em>« <strong>Ô hommes ! Craignez votre Seigneur qui vous a créés d'un seul être, et a créé de celui-ci son épouse, et qui de ces deux-là a fait proliférer bon nombre d'hommes et de femmes. Craignez Allah au nom de qui vous vous implorez les uns les autres, et respectez les liens du sang. Certes Allah vous observe parfaitement. »</strong></em> [An-Nisa : 1].</p>
<p><strong>Le troisième :</strong> La parole d'Allah Tout-Haut :</p>
<p class="ar"><span dir="rtl">﴿يَٰأَيُّهَا الَّذِينَ ءَامَنُواْ اتَّقُواْ اللَّهَ وَقُولُواْ قَوْلًا سَدِيدًا * يُصْلِحْ لَكُمْ أَعْمَٰلَكُمْ وَيَغْفِرْ لَكُمْ ذُنُوبَكُمْ ۗ وَمَن يُطِعِ اللَّهَ وَرَسُولَهُۥ فَقَدْ فَازَ فَوْزًا عَظِيمًا﴾ [الأحزاب : ٧٠ - ٧١]</span></p>
<p><em><strong>« Ô vous qui avez cru ! Craignez Allah et parlez avec droiture, afin Qu'Il réforme vos actions et vous pardonne vos péchés. Quiconque obéit à Allah et à Son messager obtient certes un immense succès. »</strong></em> [Al-Ahzab : 70-71].</p>
<p>Quant aux piliers du contrat de mariage, ils sont au nombre de trois :</p>
<p><strong>Le premier pilier :</strong> La présence des deux époux exempts de tout empêchement qui ferait obstacle à la validité du mariage. Par exemple, que la femme ne fasse pas partie de celles qui sont interdites à cet homme en raison d'un lien de parenté (généalogique), de l'allaitement, d'une période de viduité (Iddah), ou autre. Et que l'homme ne soit pas, par exemple, mécréant alors que la femme est musulmane... ainsi que d'autres empêchements légitimes que nous détaillerons si Allah le veut.</p>
<p><strong>Le deuxième pilier :</strong> La formulation de la proposition (Al-Îjâb). Il s'agit des paroles prononcées par le tuteur légal (Al-Walî) ou celui qui le remplace, en disant par exemple à l'époux : <em>« Je te marie à une telle »</em> ou <em>« Je te la donne en mariage »</em>.</p>
<p><strong>Le troisième pilier :</strong> L'expression de l'acceptation (Al-Qabûl). Il s'agit des paroles prononcées par l'époux ou celui qui le remplace, en disant par exemple : <em>« J'accepte ce mariage »</em> ou <em>« J'accepte cette union »</em>.</p>
<p>Cheikh Al-Islam Ibn Taymiyyah et son élève Ibn Al-Qayyim ont opté pour l'avis selon lequel le mariage se conclut par toute formulation qui l'indique clairement, et qu'il ne se restreint pas uniquement aux termes d'« union » (Inkâh) et de « mariage » (Tazwîj).</p>
<p>L'argument de ceux qui limitent [le contrat] aux termes d'« union » (Inkâh) et de « mariage » (Tazwîj) repose sur le fait que ce sont les deux seuls termes mentionnés dans le Coran. Comme la parole d'Allah Tout-Haut :</p>
<p class="ar"><span dir="rtl">﴿فَلَمَّا قَضَىٰ زَيْدٌ مِّنْهَا وَطَرًا زَوَّجْنَٰكَهَا﴾ [الأحزاب : ٣٧]</span></p>
<p><em><strong>« Puis quand Zayd eut cessé toute relation avec elle, Nous t'avons marié avec elle »</strong></em> [Al-Ahzab : 37], et Sa parole Tout-Haut :</p>
<p class="ar"><span dir="rtl">﴿وَلَا تَنكِحُواْ مَا نَكَحَ ءَابَاؤُكُم مِّنَ النِّسَاءِ﴾ [النساء : ٢٢]</span></p>
<p><em><strong>« Et n'épousez pas les femmes que vos pères ont épousées »</strong></em> [An-Nisa : 22]. Cependant, cela n'implique pas en réalité une restriction exclusive à ces deux termes. Et Allah est Le plus Savant.</p>
<p>⁕ Le mariage de la personne muette se conclut par le biais de l'écrit ou par un geste compréhensible.</p>
<p>⁕ Dès lors que la proposition (Al-Îjâb) et l'acceptation (Al-Qabûl) ont eu lieu, le mariage est conclu, et ce, même si celui qui a prononcé les paroles plaisantait (ou ironisait) sans avoir l'intention réelle d'en appliquer le sens. Cela en raison de la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«ثَلَاثٌ هَزْلُهُنَّ جِدٌّ، وَجِدُّهُنَّ جِدٌّ: الطَّلَاقُ، وَالنِّكَاحُ، وَالرَّجْعَةُ»</span></p>
<p><em><strong>« Il est trois choses pour lesquelles le fait de plaisanter est pris au sérieux, et le fait d'être sérieux est pris au sérieux : le divorce, le mariage et la reprise de l'épouse (après un divorce révocable). »</strong></em> Rapporté par At-Tirmidhî <a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a>.</p>
<p>⁕ Quant aux conditions de validité (Shuroût) du mariage, elles sont au nombre de quatre :</p>
<p><strong>La première condition :</strong> La désignation précise de chacun des deux conjoints. Ainsi, il ne suffit pas que [le tuteur] dise : <em>« Je te marie ma fille »</em>, s'il possède plusieurs filles, ou qu'il dise : <em>« Je la marie à ton fils »</em>, alors que ce dernier a plusieurs fils.</p>
<p>La désignation s'établit soit en désignant du doigt la personne qui se marie, soit en la nommant, soit en la décrivant par un trait qui la distingue clairement.</p>
<p><strong>La deuxième condition :</strong> Le consentement de chacun des deux conjoints envers l'autre. Le mariage n'est pas valide si l'un d'eux y a été contraint, en raison du hadith d'Abû Hurayrah :</p>
<p class="ar"><span dir="rtl">«لَا تُنْكَحُ الْأَيِّمُ حَتَّى تُسْتَأْمَرَ، وَلَا الْبِكْرُ حَتَّى تُسْتَأْذَنَ»</span></p>
<p><em><strong>« On ne marie pas la femme ayant déjà été mariée (Al-Ayyim) sans lui demander son ordre, et on ne marie pas la femme vierge sans lui demander son consentement »</strong></em>, unanimement approuvé [par al-Bukhârî et Muslim] <a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a>. Font exception le mineur n'ayant pas atteint l'âge de la puberté ainsi que l'aliéné mental ; il revient alors à leur tuteur de les marier sans leur consentement.</p>
<p><strong>La troisième condition :</strong> Que le contrat soit conclu par le tuteur (Wâlî) de la femme, en raison de la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«لَا نِكَاحَ إِلَّا بِوَلِيٍّ»</span></p>
<p><em><strong>« Pas de mariage sans tuteur »</strong></em>, rapporté par les cinq [auteurs de Sunan] à l'exception d'an-Nasâ'î <a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a>. Si la femme se marie elle-même sans son tuteur, son mariage est alors nul (Bâtil), car cela constitue un prétexte menant à la fornication, et parce que la femme manque de discernement pour choisir ce qui est le plus bénéfique pour elle. De plus, Allah de par Sa transcendance S'est adressé aux tuteurs concernant le mariage, Il a dit :</p>
<p class="ar"><span dir="rtl">﴿وَأَنكِحُواْ ٱلۡأَيَٰمَىٰ مِنكُمۡ﴾</span></p>
<p><strong>« Mariez les célibataires d'entre vous »</strong> [An-Nûr : 32]</p>
<p>Et Il a dit :</p>
<p class="ar"><span dir="rtl">﴿فَلَا تَعۡضُلُوهُنَّ﴾</span></p>
<p><strong>« [...] alors ne leur empêchez pas [de se remarier] »</strong> [Al-Baqarah : 232], ainsi que d'autres versets similaires.</p>
<p>Le tuteur (Wâlî) de la femme est : son père, puis celui que le père a mandaté par testament pour s'occuper d'elle, puis son grand-père paternel même s'il remonte haut [dans la généalogie], puis son fils, puis les fils de son fils même s'ils descendent bas, puis son frère germain (de mêmes parents), puis son frère consanguin (du même père), puis les fils de ces deux-là, puis son oncle paternel germain, puis son oncle paternel consanguin, puis les fils de ces deux-là, puis le plus proche de ses parents agnats (Asabah) par le sang, suivant l'ordre des successions, puis l'affranchisseur, puis le gouvernant (le juge).</p>
<p><strong>La quatrième condition :</strong> Le témoignage lors du contrat de mariage, en raison du hadith de Jâbir attribué textuellement au Prophète (Marfû‘) :</p>
<p class="ar"><span dir="rtl">«لَا نِكَاحَ إِلَّا بِوَلِيٍّ وَشَاهِدَيْ عَدْلٍ»</span></p>
<p><em><strong>« Pas de mariage sans tuteur et deux témoins intègres »</strong></em> <a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a>. Le mariage n'est donc valide qu'en présence de deux témoins intègres (‘Adlayn). At-Tirmidhî a dit : <em>« C'est cela qui est mis en pratique chez les gens de science parmi les compagnons du Prophète <span dir="rtl">ﷺ</span> ainsi que ceux qui les ont suivis parmi les successeurs (Tâbi‘în) et d'autres. Ils ont dit : "Pas de mariage sans témoins". Et aucun de ceux qui sont passés parmi eux n'a divergé sur cela, à l'exception d'un groupe de savants parmi les contemporains (les plus tardifs). »</em></p>
