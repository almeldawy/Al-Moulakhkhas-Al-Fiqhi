<p>⁕ À l'origine, le mot <em>Walîmah</em> désigne la complétude d'une chose et son rassemblement. On dit : <em>"L'homme a accompli son Awlama"</em> lorsque sa raison et ses mœurs se sont stabilisées et réunies. Ce sens a ensuite été transposé pour désigner le repas de noces, en raison de l'union (le rassemblement) de l'homme et de la femme par le mariage. D'un point de vue linguistique et selon l'usage des juristes (<em>Al-Fuqahâ'</em>), le terme <em>Walîmah</em> ne s'applique à aucun autre repas que celui des noces.</p>
<p>Il existe par ailleurs d'autres repas préparés pour diverses occasions, chacun d'eux portant un nom spécifique.</p>
<p>⁕ Concernant le statut juridique du repas de noces, il s'agit d'une tradition prophétique (<em>Sunnah</em>) à l'unanimité des gens de science. Certains d'entre eux ont même penché vers son obligation, en raison de l'ordre donné par le Prophète <span dir="rtl">ﷺ</span> à ce sujet, et du caractère obligatoire de répondre à son invitation. En effet, le Prophète <span dir="rtl">ﷺ</span> a dit à 'Abd ar-Rahmân ibn 'Awf , lorsque ce dernier l'informa qu'il s'était marié :</p>
<p class="ar"><span dir="rtl">«أَوْلِمْ وَلَوْ بِشَاةٍ»</span></p>
<p><strong>« Offre un repas de noces, ne serait-ce qu'avec un ovin (un mouton ou une chèvre) »</strong>, (Rapporté par Al-Bukhârî et Muslim)<a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a>. De plus, le Prophète <span dir="rtl">ﷺ</span> a lui-même offert un repas de noces lors de ses mariages avec ses épouses Zaynab, Safiyyah et Maymûnah bint Al-Hârith.</p>
<p>⁕ Le moment fixé pour organiser le repas de noces est large : il commence dès la conclusion du contrat de mariage (<em>'Aqd an-Nikâh</em>) et s'étend jusqu'à la fin des jours de réjouissances des noces.</p>
<p>⁕ Quant à la quantité du repas de noces, certains juristes ont dit qu'elle ne devrait pas être inférieure à un ovin, et qu'il est préférable de faire plus, en se basant sur le sens apparent du hadith de 'Abd ar-Rahmân ibn 'Awf :</p>
<p class="ar"><span dir="rtl">«أَوْلِمْ وَلَوْ بِشَاةٍ»</span></p>
<p><em><strong>« Offre un repas de noces, ne serait-ce qu'avec un ovin »</strong></em><a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a>. Cela s'applique si la personne en a les moyens faciles, sinon, cela se fait en fonction de sa capacité financière. En effet, le Prophète <span dir="rtl">ﷺ</span> a offert pour [le mariage de] Safiyyah un repas composé de <em>Hays</em> <a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a> — qui est un mélange de farine (ou de dattes), de beurre clarifié (<em>Samen</em>) et de fromage séché (<em>Aqiṭ</em>), mélangés les uns aux autres — qu'il disposa sur une petite nappe en cuir. Cela prouve ainsi qu'un repas de noces est tout à fait valable et suffisant sans avoir recours au sacrifice d'une bête.</p>
<p>⁕ Il est illicite de commettre des excès (le gaspillage) lors du repas de noces, à l'instar de ce qui se fait de nos jours : sacrifier de nombreux ovins et camelins, et surcharger la table de nourriture par pure ostentation et gaspillage, pour qu'au final elle ne soit pas consommée. Le sort de ces aliments et de ces viandes est plutôt d'être jeté aux ordures et gaspillé. Cela fait partie de ce que la Législation islamique (<em>Chari'ah</em>) interdit et que les esprits sains ne peuvent accepter. Il est à craindre pour celui qui commet cela, ou qui l'agrée, de s'exposer au châtiment et à la disparition des bienfaits. De plus, ces somptueux festins s'accompagnent souvent d'arrogance, de vanité et de rassemblements qui n'échappent généralement pas aux blâmables. Ces repas sont parfois organisés dans des hôtels, où se produisent le relâchement des femmes vis-à-vis du voile et de la pudeur, ainsi que la mixité avec les hommes, dont les conséquences funestes sont à redouter. Ces célébrations peuvent également être entremêlées de chants et d'instruments de musique, et l'on y fait venir des chanteurs pervers ainsi que des photographes injustes qui photographient les femmes et les mariés. Ainsi, d'importantes sommes d'argent sont gaspillées dans ces fêtes sans aucune utilité, mais plutôt par voie de corruption et de perversion. Que ceux qui accomplissent ces actes craignent donc Allah et redoutent Son châtiment ! Le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿وَكَمْ أَهْلَكْنَا مِن قَرْيَةٍ بَطِرَتْ مَعِيشَتَهَا﴾ [القصص: ٥٨]</span></p>
<p><em><strong>{Et que de villes Nous avons exterminées, qui vivaient dans l'insouciance et l'arrogance de leurs moyens d'existence !}</strong></em> [Sourate Al-Qasas : 58].</p>
<p>Le Très-Haut a dit également :</p>
<p class="ar"><span dir="rtl">﴿وَكُلُوا وَاشْرَبُوا وَلَا تُسْرِفُوا ۚ إِنَّهُ لَا يُحِبُّ الْمُسْرِفِينَ﴾ [الأعراف: ٣١]</span></p>
<p><em><strong>{Et mangez et buvez, et ne commettez pas d'excès, car Il n'aime pas ceux qui commettent des excès}</strong></em> [Sourate Al-A'râf : 31].</p>
<p>Et le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿كُلُوا وَاشْرَبُوا مِن رِّزْقِ اللَّهِ وَلَا تَعْثَوْا فِي الْأَرْضِ مُفْسِدِينَ﴾ [البقرة: ٦٠]</span></p>
<p><strong>{Mangez et buvez de ce qu'Allah vous attribue, et ne semez pas la corruption sur terre}</strong> [Sourate Al-Baqarah : 60]... et les versets à ce sujet sont nombreux et bien connus.</p>
<p>⁕ Il est obligatoire pour quiconque est invité à assister au repas de noces de répondre à l'invitation si les conditions suivantes sont réunies :</p>
<p><strong>La première condition :</strong> Qu'il s'agisse du premier repas de noces. Si l'organisation des repas se répète pour cette même occasion, il ne lui est plus obligatoire d'assister à ce qui dépasse le premier. Cela s'appuie sur la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«الْوَلِيمَةُ أَوَّلُ يَوْمٍ حَقٌّ، وَالثَّانِي مَعْرُوفٌ، وَالثَّالِثُ رِيَاءٌ وَسُمْعَةٌ»</span></p>
<p><em><strong>« Le repas de noces le premier jour est un devoir, le deuxième jour est une bonne coutume (convenable), et le troisième jour est pure ostentation et recherche de notoriété »</strong></em>, rapporté par Abû Dâwûd et d'autres <a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a>.</p>
<p>Et le Cheikh Taqî ad-Dîn [Ibn Taymiyyah] <a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a> a dit : <em>"Il est interdit de manger et de procéder à des sacrifices qui dépassent la normale durant le reste des jours, même si cela est devenu une habitude ou que cela est fait pour réjouir sa famille ; et [l'auteur] se verra infliger une peine correctionnelle (Ta'zîr) s'il récidive."</em></p>
<p><strong>La deuxième condition :</strong> Que la personne qui invite soit musulmane.</p>
<p><strong>La troisième condition :</strong> Que la personne qui invite ne fasse pas partie des pécheurs qui commettent leurs désobéissances publiquement, envers qui le boycott (<em>Hajr</em>) est obligatoire.</p>
<p><strong>La quatrième condition :</strong> Que l'hôte désigne personnellement l'invité et le spécifie, c'est-à-dire que l'invitation ne soit pas générale (publique).</p>
<p><strong>La cinquième condition :</strong> Qu'il n'y ait aucun acte blâmable (<em>Munkar</em>) lors du repas de noces, comme de l'alcool, des chants, des instruments de musique et des chanteurs, à l'instar de ce qui se passe de nos jours dans certains festins.</p>
<p>Lorsque ces conditions sont réunies, il devient obligatoire de répondre à l'invitation, conformément à la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«شَرُّ الطَّعَامِ طَعَامُ الْوَلِيمَةِ، يُمنَعُهَا مَنْ يَأْتِيهَا، وَيُدْعَى إِلَيْهَا مَنْ يَأْبَاهَا، وَمَنْ لَا يُجِبْ فَقَدْ عَصَى اللَّهَ وَرَسُولَهُ»</span></p>
<p><em><strong>« Le pire des repas est le repas de noces auquel on refuse l'accès à ceux qui s'y rendent (les pauvres), et auquel on invite ceux qui le refusent (les riches). Et quiconque ne répond pas à l'invitation a certes désobéi à Allah et à Son messager »</strong></em>, rapporté par Muslim <a href="#fn6" class="footnote-ref" id="fnref6" role="doc-noteref"><sup>6</sup></a>.</p>
<p>⁕ Et il est recommandé de publier le mariage — c'est-à-dire de le manifester et de le faire connaître — en raison de la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«وَأَعْلِنُوا النِّكَاحَ»</span></p>
<p><em><strong>« Et annoncez le mariage »</strong></em>,</p>
<p>et dans une autre version :</p>
<p class="ar"><span dir="rtl">«أَظْهِرُوا النِّكَاحَ»</span></p>
<p><em><strong>« Manifestez le mariage »</strong></em>, rapporté par Ibn Mâjah <a href="#fn7" class="footnote-ref" id="fnref7" role="doc-noteref"><sup>7</sup></a>.</p>
<p>⁕ Et il est recommandé de battre du tambourin (<em>Duft</em>) à cette occasion, conformément à la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«فَصْلُ مَا بَيْنَ الْحَلَالِ وَالْحَرَامِ الصَّوْتُ وَالدُّفُّ فِي النِّكَاحِ»</span></p>
<p><em><strong>« Ce qui sépare le licite de l'illicite [dans le mariage], c'est le chant (l'annonce vocale) et le tambourin »</strong></em>, rapporté par An-Nasâ'î, Ahmad et At-Tirmidhî qui l'a qualifié de bon <a href="#fn8" class="footnote-ref" id="fnref8" role="doc-noteref"><sup>8</sup></a>.</p>
