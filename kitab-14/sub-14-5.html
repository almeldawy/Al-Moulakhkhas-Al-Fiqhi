<p>⁕ <strong>L'équivalence (Al-Kafâ'ah) au sens linguistique :</strong> Signifie l'égalité et la similitude. Ce qui est visé ici [dans la jurisprudence], c'est l'égalité entre les deux conjoints à travers cinq critères :</p>
<ol type="1">
<li><blockquote>
<p><strong>La religion (et la piété) :</strong> Ainsi, l'homme débauché ou pervers (<em>Al-Fâjir / Al-Fâsiq</em>) n'est pas l'équivalent de la femme chaste et intègre (<em>Al-‘Afîfah Al-‘Adl</em>), car son témoignage et sa transmission [de récits] sont rejetés, et cela constitue une faille dans sa valeur humaine.</p>
</blockquote></li>
<li><blockquote>
<p><strong>Le rang social, à savoir la lignée (An-Nasab) :</strong> Ainsi, le non-Arabe (<em>Al-‘Ajamî</em> — qui désigne celui qui ne fait pas partie des Arabes) n'est pas l'équivalent de la femme arabe.</p>
</blockquote></li>
<li><blockquote>
<p><strong>La liberté :</strong> Ainsi, l'esclave ainsi que l'esclave partiellement affranchi (<em>Al-Muba‘‘ad</em>) ne sont pas l'équivalent de la femme libre, car l'esclavage constitue une diminution de statut.</p>
</blockquote></li>
<li><blockquote>
<p><strong>Le métier (ou l'artisanat) :</strong> Ainsi, celui qui exerce un métier jugé inférieur ou modeste, à l'instar du ventouseur (celui qui pratique la <em>Hijâmah</em>) ou du tisserand, n'est pas l'équivalent de la fille d'un homme exerçant une noble profession, tel qu'un commerçant.</p>
</blockquote></li>
<li><blockquote>
<p><strong>L'aisance financière :</strong> En fonction de ce qui incombe comme dot (<em>Mahr</em>) et dépenses d'entretien (<em>Nafaqa</em>). Ainsi, l'homme en difficulté financière n'est pas l'équivalent de la femme aisée, car la pauvreté de celui-ci lui causerait un tort en raison du manquement à son obligation de subvenir à ses besoins.</p>
</blockquote></li>
</ol>
<p>⁕ <strong>Par conséquent, si l'un des deux conjoints diffère de l'autre</strong> sur l'un de ces cinq points, l'équivalence est alors rompue. Cependant, <strong>cela n'impacte en rien la validité du mariage</strong>, car l'équivalence n'est pas une condition de validité du contrat. Ceci s'appuie sur l'ordre donné par le Prophète <span dir="rtl">ﷺ</span> à Fâtimah bint Qays d'épouser Oussâmah ibn Zayd, qu'elle épousa donc sur son ordre, un hadith unanimement approuvé [par al-Bukhârî et Muslim] <a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a>. Néanmoins, l'équivalence demeure une condition pour le caractère exécutoire et contraignant (<em>Luzûm</em>) du mariage uniquement. Ainsi, si une femme est mariée à un homme qui n'est pas son équivalent, quiconque n'a pas consenti à cela — que ce soit la femme elle-même ou ses tuteurs — a le droit de demander l'annulation (<em>Faskh</em>) du mariage. En effet, un homme avait marié sa fille au fils de son frère afin de rehausser par elle le rang social de ce dernier ; le Prophète <span dir="rtl">ﷺ</span> lui a alors laissé le choix [d'annuler ou de maintenir le mariage] <a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a>. Par ailleurs, certains savants estiment que l'équivalence est une condition de validité du mariage, ce qui constitue une version rapportée d'après l'imam Ahmad.</p>
