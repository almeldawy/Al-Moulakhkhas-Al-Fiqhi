<p>On entend par "conditions dans le mariage" ce que l'un des deux conjoints stipule à l'autre au moment du contrat de mariage et qui comporte un intérêt [pour lui]. Le moment de leur formulation se situe soit au cours de la conclusion du contrat, soit par accord mutuel avant celui-ci. Elles se divisent en deux catégories : les conditions valides (sahîh) et les conditions invalides (fâsid).</p>
<h2 id="premièrement-les-conditions-valides-dans-le-mariage"><strong>Premièrement : Les conditions valides dans le mariage :</strong></h2>
<p>⁃ Fait partie des conditions valides selon la majorité [des savants] : le fait qu'elle [la future épouse] stipule le divorce de sa co-épouse, car elle y trouve un intérêt. Cependant, certains savants ont d'un autre avis estimé que cette condition n'est pas valide, car le Prophète <span dir="rtl">ﷺ</span> a interdit qu'une femme demande le divorce de sa sœur [en religion] afin de renverser [et s'approprier] ce que contient son récipient<a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a>, et l'interdiction implique l'invalidité.</p>
<p>⁃ Fait également partie des conditions valides dans le mariage : le fait qu'elle stipule qu'il ne prenne pas de concubine ou qu'il ne se marie pas avec une autre femme en plus d'elle. S'il respecte cet engagement, tant mieux, sinon elle a le droit de demander la dissolution du mariage (al-faskh), en raison du hadith :</p>
<p class="ar"><span dir="rtl">«أَحَقُّ مَا أَوْفَيْتُمْ مِنَ الشُّرُوطِ أَنْ تُوفُوا بِهِ مَا اسْتَحْلَلْتُمْ بِهِ الْفُرُوجَ».</span></p>
<p><em><strong>« Les conditions qui méritent le plus d'être respectées sont celles par lesquelles vous avez rendu les relations conjugales licites. »</strong></em><a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a></p>
<p>⁃ De même, si elle stipule qu'il ne doit pas la faire sortir de sa maison ou de son pays ; cette condition est valide, et il ne lui sera pas permis de la faire sortir sans son autorisation.</p>
<p>⁃ De même, si elle stipule qu'il ne doit pas la séparer de ses enfants ou de ses parents ; cette condition est valide, et s'il y contrevient, elle a le droit de demander la dissolution du mariage (al-faskh).</p>
<p>⁃ Et si elle stipule une augmentation de sa dot, ou que celle-ci soit payée dans une devise précise ; cette condition est valide et devient exécutoire (obligatoire). Il est alors obligatoire de la respecter, et elle a le droit de demander la dissolution du mariage (al-faskh) en cas de non-respect. Son droit d'option [de rompre le contrat] à ce sujet n'est pas limité dans le temps (dans l'immédiat) : elle peut donc annuler le mariage quand elle le souhaite, tant qu'il n'émane pas d'elle un acte ou une parole indiquant son consentement alors qu'elle a connaissance de la violation de la condition qu'elle lui avait imposée. Dans ce cas précis, son droit d'option s'annule.</p>
<p>'Omar ibn al-Khattâb (qu'Allah l'agrée) a dit à un homme contre qui il avait jugé de l'obligation de respecter ce que son épouse avait stipulé, ce à quoi l'homme répondit : « Dans ce cas, elles vont nous contraindre au divorce ! ». 'Omar répliqua alors : <strong>« Les droits s'arrêtent là où les conditions sont fixées. »</strong><a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a> Et en raison du hadith :</p>
<p class="ar"><span dir="rtl">«الْمُؤْمِنُونَ عَلَى شُرُوطِهِمْ»</span></p>
<p><strong>« Les croyants respectent leurs conditions. »</strong><a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a></p>
<p>L'érudit Ibn al-Qayyim a dit <a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a>: <em>« Il est obligatoire de respecter ces conditions, qui sont les plus en droit d'être honorées. Cela est conforme aux exigences de la législation religieuse (ash-Shar'), de la raison et de l'analogie correcte (al-qiyâs as-sahîh). En effet, la femme n'a consenti à s'offrir [intimement] à son époux qu'à travers cette condition. Si le respect de celle-ci n'était pas obligatoire, le contrat ne reposerait plus sur un consentement mutuel, et cela reviendrait à lui imposer ce à quoi elle ne s'est pas engagée, et ce qu'Allah et Son Messager ne lui ont pas imposé. »</em></p>
<h2 id="deuxièmement-les-conditions-invalides-corrompues-dans-le-mariage"><strong>Deuxièmement : Les conditions invalides (corrompues) dans le mariage :</strong></h2>
<p>Et les conditions invalides dans le mariage sont de deux types :</p>
<h3 id="les-conditions-invalides-qui-annulent-le-contrat-de-mariage"><strong>1 - Les conditions invalides qui annulent le contrat de mariage :</strong> </h3>
<p>Elles sont de trois types :</p>
<p><strong>Le premier type : Le mariage d'échange (<em>Nikâh ash-Shighâr</em>) :</strong> Il consiste pour un tuteur à marier la femme sous sa tutelle à un homme, à la condition que ce dernier lui marie également la femme sous sa propre tutelle, sans qu'aucune dot ne soit versée entre eux.</p>
<p>Il a été nommé <em>Shighâr</em> à partir du mot <em>al-Shoughoûr</em>, qui signifie la vacuité (l'absence) de contrepartie. Il a aussi été dit qu'il tire son nom de l'expression <em>« Shaghara al-Kalb »</em> lorsqu'un chien lève la patte pour uriner, comparant ainsi la laideur de cet acte à la laideur de l'urine du chien.</p>
<p>Dans ce type de mariage, une femme est placée en contrepartie d'une autre femme. Les savants sont unanimement d'accord sur son interdiction. C'est un mariage nul (<em>bâtil</em>), et la séparation [des conjoints] y est obligatoire, que l'annulation de la dot y ait été explicitement formulée ou qu'elle ait été passée sous silence.</p>
<p>Cela s'appuie sur le hadith d'Ibn 'Omar : <em><strong>« Le Prophète <span dir="rtl">ﷺ</span> a interdit le Shighâr. Et le Shighâr consiste à ce qu'un homme marie sa fille à un autre homme à condition que celui-ci lui marie sa propre fille, sans qu'il n'y ait de dot entre elles. »</strong></em> (Rapporté par al-Boukhari et Muslim)<a href="#fn6" class="footnote-ref" id="fnref6" role="doc-noteref"><sup>6</sup></a>.</p>
<p>Le Cheikh Taqî ad-Dîn [Ibn Taymiyyah] a dit : <em>« La conclusion décisive est qu'Allah a interdit le mariage d'échange (Nikâh ash-Shighâr) car le tuteur a l'obligation de marier la femme sous sa tutelle dès lors qu'un homme d'un rang équivalent la demande en mariage. Le regard qu'il porte sur elle doit être guidé par son intérêt [à elle] et non par une passion personnelle. De plus, la dot est un droit qui lui revient à elle, et non à lui. Il n'appartient ni au tuteur ni au père de la marier si ce n'est dans son intérêt exclusif, et il ne lui est pas permis de la marier pour son propre intérêt au détriment du sien. Par un tel comportement, sa tutelle devient caduque. Dès lors que son objectif est d'échanger l'intimité de cette femme contre l'intimité d'une autre, il ne prend plus en compte l'intérêt de celle-ci, et il devient semblable à celui qui la marie en échange d'un bien d'argent qui lui reviendrait à lui et non à elle — et ces deux cas sont interdits. Par conséquent, si une dot est formellement mentionnée par ruse alors que l'intention réelle demeure l'échange (al-Moushâgharah), cela n'est pas permis, comme l'a stipulé expressément [l'imam] Ahmad. En effet, son but réel est de la marier en contrepartie du mariage de l'autre femme, alors que la Législation a mis en évidence que cela ne se produit que pour servir l'intérêt personnel du tuteur et non celui de la femme, qu'une dot ait été explicitement mentionnée ou non, comme l'ont affirmé Mou'âwiyah et d'autres. Quant à Ahmad, il l'a autorisé lorsqu'une dot est réellement visée [pour la femme] sans qu'il n'y ait</em> <strong>de ruse, afin de préserver le droit et l'intérêt de la femme concernant sa dot. »</strong> Fin de citation.</p>
<p>Ainsi, si une dot distincte et complète est fixée pour chacune d'elles, sans aucune ruse, et que le consentement des deux femmes est obtenu, cela devient alors valide en raison de l'absence de tout préjudice.</p>
<p><strong>Le deuxième type : Le mariage du Mouhallil (<em>Nikâh al-Mouhallil</em>) :</strong> Il consiste à ce qu'un homme l'épouse [une femme définitivement divorcée de son premier mari] à la condition que, dès qu'il l'aura rendue de nouveau licite pour le premier mari, il la divorce. Il en va de même s'il a simplement l'intention de la rendre licite [au premier époux] sans qu'une condition ne soit expressément mentionnée dans le contrat, ou s'ils se sont mis d'accord à ce sujet avant le contrat. Dans toutes ces situations, le mariage est nul, en raison de la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«أَلَا أُخْبِرُكُمْ بِالتَّيْسِ الْمُسْتَعَارِ؟»، قَالُوا: بَلَى يَا رَسُولَ اللَّهِ! قَالَ: «هُوَ الْمُحَلِّلُ، لَعَنَ اللَّهُ الْمُحَلِّلَ وَالْمُحَلَّلَ لَهُ»</span></p>
<p><strong>« Ne vous informerai-je pas du bouc de location ? »</strong> Ils répondirent : « Certes oui, ô Messager d'Allah ! ». Il dit : <strong>« C'est le <em>Mouhallil</em> (celui qui épouse la femme pour la rendre licite à son ex-mari). Allah a maudit le <em>Mouhallil</em> et le <em>Mouhallal lahou</em> (le premier mari pour qui cette ruse est faite). »</strong> Rapporté par Ibn Mâjah, al-Hâkim et d'autres<a href="#fn7" class="footnote-ref" id="fnref7" role="doc-noteref"><sup>7</sup></a>.</p>
<p><strong>Le troisième type : Lorsque la conclusion du contrat de mariage est suspendue à une condition future :</strong> Comme le fait de dire : « Je te la marie lorsque le début du mois arrivera », ou : « si sa mère est d'accord ». Dans de tels cas, le mariage ne prend pas effet, car le mariage est un contrat d'échange [de droits mutuels], il n'est donc pas valide de suspendre sa conclusion à une condition future.</p>
<p>De même, s'il lui marie la femme pour une durée déterminée. Comme le fait de dire : <em>« Je te la marie et dès que demain arrivera, divorce d'elle »</em>, ou s'il dit : <em>« Je te la marie pour un mois ou pour un an »</em>. Ce mariage temporaire est nul, et c'est ce qu'on appelle <strong>le mariage de jouissance (<em>Nikâh al-Mout'ah</em>)</strong>.</p>
<p>Le Cheikh Taqî ad-Dîn [Ibn Taymiyyah] <a href="#fn8" class="footnote-ref" id="fnref8" role="doc-noteref"><sup>8</sup></a> a dit : <em>« Les narrations abondantes (al-moustafîdah) et notoires (al-moutawâtirah) s'accordent à l'unanimité sur le fait qu'Allah l'Très-Haut a interdit le mariage de jouissance (al-Mout'ah) après l'avoir [auparavant] autorisé. »</em></p>
<p>[L'imam] al-Qourtoubî <a href="#fn9" class="footnote-ref" id="fnref9" role="doc-noteref"><sup>9</sup></a> a dit : <em>« Toutes les narrations concordent sur le fait que la période d'autorisation du mariage de jouissance (al-Mout'ah) n'a pas duré longtemps, et qu'il a été interdit. Ensuite, les prédécesseurs (as-Salaf) et les successeurs (al-Khalaf) se sont unanimement accordés (ajma'a) sur son interdiction ; à l'exception de ceux dont on ne prête aucune attention parmi les Rawâfidh (les chiites duodécimains). »</em></p>
<h3 id="les-conditions-invalides-qui-nannulent-pas-le-mariage"><strong>2 - Les conditions invalides qui n'annulent pas le mariage :</strong></h3>
<p>⁃ <strong>Si une condition est stipulée dans le contrat de mariage visant à annuler l'un des droits de la femme ;</strong> comme le fait de conditionner qu'elle n'ait pas de dot (<em>Mahr</em>), qu'elle n'ait pas de pension alimentaire (<em>Nafaqah</em>), ou de conditionner qu'il lui accorde un temps de partage (dans la polygamie) inférieur à celui de sa coépouse : dans toutes ces situations, la condition est nulle (invalide) mais le mariage reste valide. Cela s'explique par le fait que cette condition porte sur un élément accessoire du contrat, dont la mention n'est pas obligatoire et dont l'ignorance ne nuit pas à la validité de l'acte.</p>
<p><strong>⁃ Fait également partie de cela le cas où il pose comme condition qu'elle soit musulmane, puis qu'il s'avère qu'elle est chrétienne ou juive (<em>Kitâbiyyah</em>) :</strong> le mariage est alors valide, et il possède le droit d'annuler le mariage (<em>Khiyâr al-Faskh</em>).</p>
<p><strong>⁃</strong> <strong>Fait également partie de cela le cas où il pose comme condition qu'elle soit vierge, belle, ou issue d'un lignage (noble), puis qu'elle s'avère être le contraire de ce qu'il a stipulé :</strong> il a alors le droit d'annuler le mariage (<em>Al-Faskh</em>) en raison du non-respect de sa condition.</p>
<p><strong>⁃</strong> <strong>Fait également partie de cela le cas où il épouse une femme en pensant qu'elle est libre, puis qu'il apparaît qu'elle est une esclave :</strong> si le mari fait partie de ceux à qui il n'est pas permis d'épouser des esclaves, ils sont alors séparés. En revanche, s'il fait partie de ceux à qui cela est permis, il possède le droit d'option (le choix d'annuler ou de maintenir le mariage).</p>
<p><strong>⁃</strong> <strong>De même, si une femme épouse un homme en le pensant libre, puis qu'il s'avère être un esclave :</strong> elle possède le droit d'option. Enfin, si une femme esclave mariée à un esclave est affranchie, elle possède également le droit d'option, car lorsque Barîrah fut affranchie alors qu'elle était sous la tutelle maritale d'un esclave, elle choisit de se séparer de lui, comme l'a rapporté Al-Bukhârî et d'autres.<a href="#fn10" class="footnote-ref" id="fnref10" role="doc-noteref"><sup>10</sup></a></p>
