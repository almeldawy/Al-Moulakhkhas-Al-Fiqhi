<p>⁕ <strong>Au sens linguistique, <em>Al-'Ishrah</em> (<span dir="rtl">العِشْرَة</span>) signifie :</strong> le regroupement et la fréquentation (la mixité/le fait de se côtoyer). C'est pourquoi on utilise les termes <em>'Ishrah</em> et <em>Ma'shar</em> pour désigner tout groupe de personnes.</p>
<p><strong>Et ce qui est visé ici (au sens religieux/juridique),</strong> c'est l'harmonie, l'affection et l'union qui lient les deux époux. En effet, il incombe à chacun des conjoints de se comporter envers l'autre de manière convenable (avec bienveillance). Ainsi, aucun d'eux ne doit retarder (faire traîner) l'acquittement du droit de l'autre, ni manifester de la répugnance à le lui accorder, ni faire suivre son geste d'un tort ou d'un rappel de sa générosité (reproche).</p>
<p>Ceci conformément à la parole d'Allah le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿وَعَاشِرُوهُنَّ بِالْمَعْرُوفِ﴾ [النساء : ١٩]</span></p>
<p><strong>﴾ Et comportez-vous convenablement envers elles. ﴿</strong> [Le Coran, Sourate An-Nisâ' : 19]</p>
<p>Et la parole du Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿وَلَهُنَّ مِثْلُ الَّذِي عَلَيْهِنَّ بِالْمَعْرُوفِ﴾ [البقرة : ٢٢٨]</span></p>
<p><strong>﴾ Quant aux femmes, elles ont des droits équivalents à leurs obligations, conformément à la bienséance. ﴿</strong> [Le Coran, Sourate Al-Baqarah : 228]</p>
<p>Le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="rtl">«خَيْرُكُمْ خَيْرُكُمْ لِأَهْلِهِ»</span></p>
<p><em><strong>« Le meilleur d'entre vous est celui qui est le meilleur envers sa famille (ses épouses). »</strong></em><a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a></p>
<p>Il <span dir="rtl">ﷺ</span> a également dit :</p>
<p class="ar"><span dir="rtl">«لَوْ كُنْتُ آمِرًا أَحَدًا أَنْ يَسْجُدَ لِأَحَدٍ؛ لَأَمَرْتُ المَرْأَةَ أَنْ تَسْجُدَ لِزَوْجِهَا؛ لِعِظَمِ حَقِّهِ عَلَيْهَا»</span></p>
<p><em><strong>« Si j'avais à ordonner à quiconque de se prosterner devant un autre, j'aurais ordonné à la femme de se prosterner devant son mari, en raison de l'immensité du droit qu'il a sur elle. »</strong></em><a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a></p>
<p>Et il <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="rtl">«إِذَا بَاتَتِ المَرْأَةُ هَاجِرَةً فِرَاشَ زَوْجِهَا؛ لَعَنَتْهَا المَلَائِكَةُ حَتَّى تُصْبِحَ»</span></p>
<p><em><strong>« Si la femme passe la nuit en désertant le lit de son mari, les anges la maudissent jusqu'au matin. »</strong></em><a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a></p>
<p>⁕ <strong>Il est recommandé (sunnah) à chacun des deux époux de parfaire son comportement envers son conjoint,</strong> de faire preuve de douceur à son égard et d'endurer (ses manquements ou ses torts).</p>
<p>Ceci en raison de la parole d'Allah le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿وَبِالْوَالِدَيْنِ إِحْسَانًا﴾ [النساء : ٣٦] إِلَى قَوْلِهِ: ﴿وَالصَّاحِبِ بِالْجَنبِ﴾ [النساء : ٣٦]</span></p>
<p><strong>﴾ Agissez avec bonté envers vos père et mère » jusqu'à Sa parole : « ainsi que le compagnon proche ﴿</strong> [Sourate An-Nisâ' : 36].</p>
<p>Il a été dit (par les exégètes) : <em><strong>« le compagnon proche »</strong></em> désigne chacun des deux conjoints (l'un envers l'autre).</p>
<p>Et le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="rtl">«اسْتَوْصُوا بِالنِّسَاءِ خَيْرًا؛ فَإِنَّهُنَّ عوانٍ عِنْدَكُمْ»</span></p>
<p><em><strong>« Prenez le plus grand soin des femmes (soyez bons envers elles), car elles sont comme des captives auprès de vous. »</strong></em><a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a></p>
<p>⁕ <strong>Il convient à l'époux de garder sa femme, même s'il éprouve de l'aversion (du dégoût) pour elle, en raison de la parole d'Allah le Très-Haut :</strong></p>
<p class="ar"><span dir="rtl">﴿وَعَاشِرُوهُنَّ بِالْمَعْرُوفِ فَإِن كَرِهْتُمُوهُنَّ فَعَسَى أَن تَكْرَهُوا شَيْئًا وَيَجْعَلَ اللَّهُ فِيهِ خَيْرًا كَثِيرًا﴾ [النساء : ١٩]</span></p>
<p><strong>﴾ Et comportez-vous convenablement envers elles. Si vous avez de l'aversion pour elles, il se peut que vous ayez de l'aversion pour une chose où Allah a déposé un grand bien. ﴿</strong> [Sourate An-Nisâ' : 19].</p>
<p>Ibn 'Abbâs a dit concernant le sens de ce noble verset :</p>
<p class="ar"><span dir="rtl">«رُبَّمَا رُزِقَ مِنْهَا وَلَدًا، فَجَعَلَ اللَّهُ فِيهِ خَيْرًا كَثِيرًا»</span></p>
<p><em><strong>« Il se peut qu'il obtienne d'elle un enfant par lequel Allah lui accordera un grand bien. »</strong></em></p>
<p>Et il est rapporté dans le hadith authentique :</p>
<p class="ar"><span dir="rtl">«لَا يَفْرَكْ مُؤْمِنٌ مُؤْمِنَةً، إِنْ سَخِطَ مِنْهَا خُلُقًا؛ رَضِيَ مِنْهَا آخَرَ»</span></p>
<p><em><strong>« Qu'un croyant ne déteste pas une croyante. S'il a du mécontentement pour l'un de ses traits de caractère, il sera satisfait d'un autre. »</strong></em> <a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a></p>
<p>⁕ <strong>Il est interdit à chacun des deux époux de faire traîner (retarder) l'acquittement de ce qu'il doit à l'autre conjoint,</strong> tout comme il lui est interdit de manifester de la répugnance à le lui accorder.</p>
<p>⁕ <strong>Dès lors que le contrat de mariage est conclu, il devient obligatoire de remettre l'épouse</strong> – qui est en âge de consommer le mariage – au domicile conjugal si le mari demande à la recevoir chez lui, sauf si elle a stipulé comme condition dans le contrat de rester dans sa propre demeure ou dans son pays.</p>
<p>⁕ <strong>Le mari a le droit de voyager avec elle pour un voyage qui ne comporte aucun péché ni aucun danger,</strong> car le Prophète <span dir="rtl">ﷺ</span> et ses compagnons voyageaient avec leurs femmes. Cependant, la majorité des voyages habituels à notre époque sont des voyages vers des pays étrangers mécréants, des pays de libertinage et de corruption. <strong>Il n'est donc pas permis de voyager vers ces pays pour le simple divertissement ou le tourisme, en raison du grave danger que cela représente pour la religion et les mœurs. Il est alors obligatoire pour la femme ainsi que pour ses tuteurs (<em>awliyâ'</em>) de refuser qu'elle voyage avec son mari vers ces pays</strong>.</p>
<p>⁕ <strong>Et ce qui est devenu une coutume à notre époque chez beaucoup de jeunes aisés et de personnes fortunées, à savoir le fait de voyager au lendemain du mariage vers les pays mécréants étrangers pour y passer ce qu'ils appellent "la lune de miel"</strong> — qui est en réalité "un mois de poison" car c'est un mois interdit —, cela mène à de nombreux maux : comme le fait de retirer le hijab, de se vêtir à la manière des mécréants, de regarder les actes des mécréants et leurs traditions absurdes, et de visiter des lieux de divertissement. À tel point que la femme revient imprégnée de ces mœurs méprisables, éprouvant du dédain pour les valeurs morales de sa propre société musulmane. <strong>Certes, ce voyage est strictement interdit (haram)</strong>, et il est obligatoire de retenir la main de ceux qui le commettent et de les en empêcher. Et il est obligatoire pour les tuteurs (awliyâ) de la femme de lui interdire ce voyage, et de la délivrer de ce mari insouciant. Car elle est un dépôt (amanah) qui pèse sur leurs épaules, et ce, même si elle-même y consentait. En effet, elle manque de clairvoyance (de recul) quant à son propre intérêt, et le tuteur n'a été institué comme protecteur et responsable d'elle que pour l'empêcher de commettre de telles choses.</p>
<p>⁕ <strong>Et il est interdit au mari d'avoir des rapports intimes avec son épouse pendant ses menstrue</strong>s, conformément à la parole d'Allah le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿وَيَسْأَلُونَكَ عَنِ الْمَحِيضِ قُلْ هُوَ أَذًى فَاعْتَزِلُوا النِّسَاءَ فِي الْمَحِيضِ وَلَا تَقْرَبُوهُنَّ حَتَّى يَطْهُرْنَ فَإِذَا تَطَهَّرْنَ فَأْتُوهُنَّ مِنْ حَيْثُ أَمَرَكُمُ اللهُ إِنَّ اللهَ يُحِبُّ التَّوَّابِينَ وَيُحِبُّ الْمُتَطَهِّرِينَ﴾ [البقرة: ٢٢٢].</span></p>
<p><strong>﴾ Et ils t'interrogent sur les menstrues. Dis : "C'est un mal". Éloignez-vous donc des femmes pendant les menstrues, et ne les approchez que quand elles sont pures. Quand elles se sont purifiées, alors cohabitez avec elles suivant les prescriptions d'Allah, car Allah aime ceux qui se repentent, et Il aime ceux qui se purifient. ﴿</strong> [Al-Baqarah : 222].</p>
<p>⁕ Le mari a le droit d'exiger de son épouse qu'elle élimine la saleté, qu'elle retire ce qui rebute l'âme parmi les poils qu'il est permis d'enlever ainsi que les ongles, et de lui interdire de consommer ce qui dégage une odeur désagréable ; car cela l'éloigne d'elle (suscite de la répulsion chez lui).</p>
<p>⁕ Et il l'oblige à laver toute impureté rituelle (najassah) et à accomplir les obligations telles que les cinq prières quotidiennes. Si elle refusait de les accomplir, il l'y contraindrait et la corrigerait. Si elle prie, [tant mieux], sinon, il lui est interdit de continuer à vivre avec elle. De même, il a le devoir de l'obliger à délaisser les interdits et à s'en écarter, conformément à la parole d'Allah le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿الرِّجَالُ قَوَّامُونَ عَلَى النِّسَاءِ بِمَا فَضَّلَ اللهُ بَعْضَهُمْ عَلَى بَعْضٍ﴾ [النساء: ٣٤]</span></p>
<p><strong>﴾ Les hommes ont autorité sur les femmes, en raison des faveurs qu'Allah accorde à ceux-là sur celles-ci ﴿</strong> [An-Nisa : 34]</p>
<p>et le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿يَا أَيُّهَا الَّذِينَ آمَنُوا قُوا أَنفُسَكُمْ وَأَهْلِيكُمْ نَارًا وَقُودُهَا النَّاسُ وَالْحِجَارَةُ عَلَيْهَا مَلَائِكَةٌ غِلَاظٌ شِدَادٌ لَّا يَعْصُونَ اللهَ مَا أَمَرَهُمْ وَيَفْعَلُونَ مَا يُؤْمَرُونَ﴾ [التحريم: ٦]</span></p>
<p><strong>﴾ Ô vous qui avez cru ! Préservez vos personnes et vos familles d'un Feu dont le combustible sera les gens et les pierres, surveillé par des Anges rudes, durs, ne désobéissant jamais à Allah en ce qu'Il leur commande, et faisant strictement ce qu'on leur ordonne. ﴿</strong> [Al-Tahrim : 6]</p>
<p>et le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿وَأْمُرْ أَهْلَكَ بِالصَّلَاةِ وَاصْطَبِرْ عَلَيْهَا﴾ [طه: ١٣٢]</span></p>
<p><strong>﴾ Et commande à ta famille la prière, et fais-la avec persévérance. ﴿</strong> [Taha : 132].</p>
<p>Et Allah a fait l'éloge de Son prophète Isma'îl <span dir="rtl">ﷺ</span> en disant :</p>
<p class="ar"><span dir="rtl">﴿وَاذْكُرْ فِي الْكِتَابِ إِسْمَاعِيلَ إِنَّهُ كَانَ صَادِقَ الْوَعْدِ وَكَانَ رَسُولًا نَّبِيًّا * وَكَانَ يَأْمُرُ أَهْلَهُ بِالصَّلَاةِ وَالزَّكَاةِ﴾ [مريم: ٥٤، ٥٥]</span></p>
<p><strong>﴾ Et mentionne Isma'îl, dans le Livre. Il était fidèle à ses promesses et c'était un Messager, un Prophète.</strong> * <strong>Et il commandait à sa famille la prière et la Zakat. ﴿</strong> [Maryam : 54, 55]. »</p>
<p>⁕ <strong>Le mari est donc responsable de son épouse</strong> ; il a la charge de veiller sur elle et il est responsable de son troupeau (sa famille). C'est d'autant plus vrai qu'elle éduque ses enfants et dirige son foyer. Ainsi, si ses mœurs à elle se corrompent et que sa pratique religieuse s'altère, elle corrompra pour lui ses enfants et les gens de sa maison. Il incombe donc aux musulmans de craindre Allah vis-à-vis de leurs femmes et de surveiller leur comportement.</p>
<p>Et le Prophète <span dir="rtl">ﷺ</span> a certes dit :</p>
<p class="ar"><span dir="rtl">«اسْتَوْصُوا بِالنِّسَاءِ خَيْرًا»</span></p>
<p><em><strong>"Prenez grand soin des femmes"</strong></em>.<a href="#fn6" class="footnote-ref" id="fnref6" role="doc-noteref"><sup>6</sup></a></p>
<p>⁕ <strong>Il est obligatoire pour le mari de passer la nuit chez son épouse</strong> — si elle est libre — une nuit sur quatre si elle le lui demande. Car le nombre maximum de femmes qui peuvent être associées avec elle [dans la polygamie] est de trois autres semblables à elle. De plus, Ka'b ibn Siwâr a jugé ainsi en présence de 'Umar ibn Al-Khattâb, cela s'est propagé et personne ne l'a réprouvé. Ceci est l'avis de certains juristes, avec sa preuve et son argumentation. Cependant, cette argumentation et cette déduction textuelle font l'objet d'une réserve (ndlr: discussion/objection) chez Cheikh Taqī ad-Dīn [Ibn Taymiyyah] ; en effet, il estime que le fait de pouvoir épouser quatre femmes n'implique pas que s'il n'en épouse qu'une seule, la situation d'unicité soit traitée de la même manière que la situation de pluralité. Et Allah sait mieux.</p>
<p>⁕ <strong>Il est obligatoire pour le mari d'avoir des rapports intimes [avec son épouse]</strong>, s'il en est capable, au moins une fois tous les tiers de l'année (quatre mois) si l'épouse le demande. Car Allah le Très-Haut a fixé cette durée à quatre mois concernant le droit de celui qui prête le serment d'abstinence (al-mûlî) ; il en va donc de même pour les autres cas. Et Cheikh al-Islâm Ibn Taymiyyah a opté pour l'avis que cela est obligatoire selon le besoin de l'épouse (ce qui lui suffit), tant que cela ne nuit pas au mari ou ne le détourne pas de la recherche de sa subsistance, et ce, sans limitation précise de durée.</p>
<p>⁕ <strong>Et si le mari voyage pour une durée supérieure à six mois (une demi-année), et que l'épouse réclame son retour, cela devient pour lui une obligation</strong> ; sauf s'il s'agit d'un voyage pour un pèlerinage (Hajj) obligatoire, d'une expédition militaire obligatoire, ou s'il se trouve dans l'incapacité de revenir. Mais s'il refuse de revenir sans aucune excuse valable qui l'en empêche, et que l'épouse demande la séparation entre eux, le juge prononcera alors la séparation après l'avoir contacté (par correspondance). En effet, il a délaissé un droit qui lui incombe et dont le délaissement cause un préjudice à l'épouse.</p>
<p>Et Cheikh Taqī ad-Dīn [Ibn Taymiyyah] a dit : "<em>Le préjudice subi par l'épouse en raison de l'absence de rapports intimes est un motif qui exige l'annulation du mariage (al-faskh) dans tous les cas. Que cela soit intentionnel de la part du mari ou involontaire, et qu'il en soit capable ou incapable ; cela s'apparente au droit à la pension alimentaire (an-nafaqah), voire de manière plus impérative encore."</em></p>
<p>⁕ Et il est interdit à chacun des deux époux de raconter ce qui se passe entre eux parmi les affaires de l'intimité (le plaisir charnel). En effet, Muslim a rapporté que le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="rtl">«شَرُّ النَّاسِ مَنْزِلَةً عِنْدَ اللهِ يَوْمَ الْقِيَامَةِ الرَّجُلُ يُفْضِي إِلَى الْمَرْأَةِ وَتُفْضِي إِلَيْهِ، ثُمَّ يَنْشُرُ سِرَّهَا»</span></p>
<p><em><strong>"Certes, parmi les personnes qui auront la pire des places auprès d'Allah au Jour de la Résurrection, il y a l'homme qui s'unit à sa femme et elle s'unit à lui, puis il divulgue son secret."</strong></em><a href="#fn7" class="footnote-ref" id="fnref7" role="doc-noteref"><sup>7</sup></a> . Cela prouve donc l'interdiction pour les époux de divulguer ce qui se passe entre eux concernant les aspects de l'intimité, qu'il s'agisse de paroles ou d'actes.</p>
<p>⁕ <strong>Le mari a le droit d'interdire à son épouse de sortir de sa maison sans un besoin impérieux (nécessité). Il ne doit pas la laisser aller où bon lui semble, et il lui est interdit à elle de sortir sans sa permission sauf en cas de force majeure.</strong> Cependant, il est recommandé au mari de lui accorder la permission de sortir pour veiller (soigner) un de ses mahrams malades, comme son frère ou son oncle paternel, en raison du maintien des liens de parenté (silat ar-rahim) que cela comporte.</p>
<p>⁕ Et il n'a pas le droit de lui interdire de recevoir la visite de ses parents chez lui, sauf s'il craint un préjudice de leur part, comme le fait qu'ils la corrompent contre lui à cause de leur visite. Dans ce cas précis, il lui est alors permis de leur interdire de lui rendre visite.</p>
<p>⁕ <strong>Et il a le droit de lui interdire de louer ses services (de travailler pour autrui) et d'intégrer des emplois.</strong> En effet, c'est lui qui subvient pleinement à ses besoins, et parce que cela lui ferait perdre le droit qu'il a sur elle, entraverait l'éducation qu'elle doit donner à ses enfants et l'exposerait à un danger moral. C'est d'autant plus vrai à notre époque où la pudeur et la réserve se font rares, où les prêcheurs du mal et de la dépravation se multiplient, et où les femmes en sont venues à se mélanger aux hommes dans les bureaux et les différents secteurs professionnels, pouvant parfois mener à l'isolement interdit (al-khalwah). Le danger est donc grand, et s'en éloigner est un devoir absolu.</p>
<p>⁕ Et il a le droit de lui interdire d'allaiter l'enfant d'un autre que lui, sauf en cas de nécessité absolue.</p>
<p>⁕ Et il n'incombe pas à l'épouse d'obéir à ses parents s'ils lui demandent de se séparer de son mari, ni de leur obéir pour leur rendre visite si son mari n'y consent pas. Bien au contraire, l'obéissance à son mari est plus prioritaire.</p>
<p>Et l'Imam Ahmad ainsi que d'autres ont certes rapporté que la tante paternelle de Husayn s'est rendue chez le Prophète <span dir="rtl">ﷺ</span>, et il lui a dit : "As-tu un époux ?" Elle répondit : "Oui." Il dit alors :</p>
<p class="ar"><span dir="rtl">«انْظُرِي أَيْنَ أَنْتِ مِنْهُ؛ فَإِنَّمَا هُوَ جَنَّتُكِ وَنَارُكِ»</span></p>
<p><em><strong>"Observe bien comment tu te comportes avec lui, car il est certes ton Paradis ou ton Enfer."</strong></em> <a href="#fn8" class="footnote-ref" id="fnref8" role="doc-noteref"><sup>8</sup></a></p>
<p>⁕ <strong>Il est obligatoire pour le mari, s'il a plus d'une épouse, d'établir l'équité entre elles dans le partage du temps (al-qasm) en répartissant ses moments de présence entre elles</strong>, conformément à la parole d'Allah le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿وَعَاشِرُوهُنَّ بِالْمَعْرُوفِ﴾ [النساء: ١٩]</span></p>
<p><strong>﴾ Et comportez-vous convenablement envers elles. ﴿</strong> [An-Nisa : 19]</p>
<p>et la parole du Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿فَلَا تَمِيلُوا كُلَّ الْمَيْلِ فَتَذَرُوهَا كَالْمُعَلَّقَةِ﴾ [النساء: ١٢٩]</span></p>
<p><strong>﴾ Ne vous penchez pas tout à fait [vers l'une d'elles] au point de laisser l'autre comme en suspens. ﴿</strong> [An-Nisa : 129].</p>
<p>Privilégier l'une d'elles par rapport aux autres constitue un penchant (une injustice) qui laisse l'autre comme en suspens. Le fondement du partage repose sur la nuit et la nuitée, car la nuit est le moment où l'homme se retire dans son foyer, trouve la sérénité auprès de sa famille et dort habituellement dans son lit avec son épouse. Quant à celui dont le gagne-pain se fait de nuit, comme le gardien ou autre, il procède alors au partage entre ses femmes durant le jour, et le jour devient à son égard l'équivalent de la nuit pour les autres.</p>
<p>⁕ <strong>Il doit également accorder sa part de nuitée à celles de ses épouses qui ont leurs menstrues, leurs lochies, ou qui sont malades.</strong> En effet, le but recherché est la quiétude du foyer et la compagnie chaleureuse, et cela se réalise par le fait de passer la nuit chez elle, même s'il n'y a pas de rapport intime. Il ne lui est pas permis de privilégier l'une d'elles au détriment des autres pour commencer le cycle de répartition, si ce n'est par un tirage au sort (al-qur'ah) ou avec leur consentement mutuel. Car débuter par l'une d'elles plutôt qu'une autre est une marque de favoritisme, alors que l'égalité entre elles est obligatoire. De même, il ne lui est pas permis de voyager en compagnie de l'une d'elles sans procéder à un tirage au sort ou obtenir leur accord, car le Prophète <span dir="rtl">ﷺ</span> : <em><strong>"Lorsqu'il voulait entreprendre un voyage, il tirait au sort entre ses épouses, et celle dont le sort désignait la part, il partait avec elle."</strong></em> <a href="#fn9" class="footnote-ref" id="fnref9" role="doc-noteref"><sup>9</sup></a>.</p>
