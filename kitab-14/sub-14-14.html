<p>⁕ Lorsque la femme voyage sans la permission de son mari, ou qu'elle voyage avec sa permission mais pour un besoin qui lui est propre, son droit au partage des nuits et à la prise en charge financière s'annule. <strong>En effet, si son voyage a lieu sans son autorisation, elle est alors désobéissante, au même titre que la femme rebelle (<em>Nâshiz</em>).</strong> Et si son voyage a lieu avec son autorisation mais pour un besoin personnel, le mari s'est vu alors dans l'impossibilité de jouir d'elle pour une cause qui provient de son côté à elle.</p>
<p>⁕ Fait partie de cela [les cas d'annulation] : <strong>si le mari souhaite qu'elle voyage avec lui et qu'elle s'y refuse, elle n'a plus droit à la prise en charge financière, car elle devient désobéissante par cet acte.</strong></p>
<p>⁕ Fait également partie de cela : <strong>si elle refuse de passer la nuit avec lui dans son lit, son droit à la prise en charge financière ainsi qu'au partage des nuits s'annule, car elle devient par cela désobéissante, à l'image de la femme rebelle (<em>Nâshiz</em>).</strong></p>
<p>⁕ Il est interdit au mari de se rendre chez l'une de ses épouses durant la nuit qui ne lui est pas attribuée, sauf en cas de nécessité (<em>Darûrah</em>). Il en est de même durant la journée de celle-ci, sauf en cas de besoin (<em>Hâjah</em>).</p>
<p>⁕ Si une épouse fait don de son tour (de nuit) à sa co-épouse avec la permission du mari, ou qu'elle en fait don au mari qui l'attribue ensuite à une autre épouse, cela est autorisé. En effet, le droit dans ce domaine leur appartient à tous deux, et ils ont consenti à ce don. Sawdah (qu'Allah l'agrée) avait d'ailleurs fait don de son tour à 'Âishah (qu'Allah l'agrée) <a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a>; ainsi, le Prophète <span dir="rtl">ﷺ</span> attribuait deux jours à cette dernière. Cependant, si celle qui a fait le don se rétracte et réclame à nouveau son tour, le mari devra lui accorder son partage à l'avenir.</p>
<p>⁕ Il est permis à l'épouse de faire grâce à son mari de son droit au partage des nuits et à la prise en charge financière afin qu'il la garde et qu'elle reste sous son lien conjugal. Cela est fondé sur la parole de l'Incommensurable :</p>
<p class="ar"><span dir="rtl">﴿وَإِنِ امْرَأَةٌ خَافَتْ مِنْ بَعْلِهَا نُشُوزًا أَوْ إِعْرَاضًا فَلَا جُنَاحَ عَلَيْهِمَا أَنْ يُصْلِحَا بَيْنَهُمَا صُلْحًا وَالصُّلْحُ خَيْرٌ﴾ [النساء: ١٢٨]</span></p>
<p><strong>﴾ Et si une femme craint de son mari une rupture ou un détachement, alors il n'y a pas de péché sur eux deux s'ils se réconcilient par un accord entre eux ; et la réconciliation est meilleure. ﴿</strong> [An-Nisâ : 128].</p>
<p>'Âishah (qu'Allah l'agrée) a dit <a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a>: <em>« Cela concerne la femme qui est mariée à un homme qui se lasse d'elle et veut divorcer d'avec elle. Elle lui dit alors : "Garde-moi et ne me divorce pas, et tu es dispensé de ma prise en charge financière et de mon partage de nuit." »</em> De même pour Sawdah <a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a> qui, lorsqu'elle a atteint un âge avancé et a craint que le Messager d'Allah <span dir="rtl">ﷺ</span> ne se sépare d'elle, a dit : <em>« Mon jour est attribué à 'Âishah. »</em></p>
<p>⁕ Celui qui épouse une femme vierge alors qu'il a déjà une ou d'autres épouses, réside chez elle durant sept nuits consécutives. Après ces sept nuits, il reprend le tour de rôle parmi ses épouses, et il ne comptabilise pas ces sept nuits contre elle. S'il épouse une femme non vierge (<em>Thayyib</em>), il réside chez elle durant trois nuits, puis il reprend le tour de rôle parmi ses épouses, et il ne comptabilise pas non plus ces trois nuits contre elle. Cela repose sur le hadith d'Abû Qilâbah, d'après Anas (qu'Allah l'agrée) :</p>
<p class="ar"><span dir="rtl">«مِنَ السُّنَّةِ إِذَا تَزَوَّجَ البِكْرَ عَلَى الثَّيِّبِ؛ أَقَامَ عِنْدَهَا سَبْعًا وَقَسَمَ، وَإِذَا تَزَوَّجَ الثَّيِّبَ؛ أَقَامَ عِنْدَهَا ثَلَاثًا ثُمَّ قَسَمَ»</span></p>
<p><em>« Fait partie de la Sunnah, lorsque l'on épouse une vierge alors que l'on a déjà une épouse non vierge, de résider chez elle sept nuits puis de procéder au partage des nuits. Et lorsque l'on épouse une non vierge, de résider chez elle trois nuits puis de procéder au partage des nuits »</em> <a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a> . Abû Qilâbah a ajouté : <em>« Si je le voulais, je dirais qu'Anas l'a directement attribué au Prophète</em> <span dir="rtl">ﷺ</span><em>. »</em> Rapporté par les deux Cheikhs [Al-Bukhârî et Muslim].</p>
<p>⁕ Si l'épouse non vierge préfère que le mari passe sept nuits chez elle, il le fait, mais il devra alors accorder un nombre égal de sept nuits à chacune de ses autres co-épouses. Ensuite, il recommencera le partage des nuits entre elles, nuit par nuit. Ceci est justifié par le hadith d'Umm Salamah (qu'Allah l'agrée) : lorsque le Prophète <span dir="rtl">ﷺ</span> l'a épousée, il a passé trois jours chez elle et a dit :</p>
<p class="ar"><span dir="rtl">«إِنَّهُ لَيْسَ بِكِ هَوَانٌ عَلَىٰ أَهْلِكِ، فَإِنْ شِئْتِ؛ سَبَّعْتُ لَكِ، وَإِنْ سَبَّعْتُ لَكِ؛ سَبَّعْتُ لِنِسَائِي»</span></p>
<p><em><strong>« Tu n'as pas à craindre de mépris de la part de ton époux. Si tu le désires, je t'accorde sept nuits. Mais si je t'accorde sept nuits, j'accorderai également sept nuits à mes autres épouses. »</strong></em> Rapporté par Ahmad, Muslim <a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a> et d'autres.</p>
<p>⁕ <strong>Se rattache également à ce sujet l'étude de la rébellion conjugale (<em>Nushûz</em>), qui désigne la désobéissance de l'épouse envers son mari dans ce qui lui incombe obligatoirement vis-à-vis de lui.</strong> Le terme est dérivé de <em>an-Nashz</em>, qui désigne ce qui s'élève au-dessus du sol, c'est donc comme si elle s'élevait et se plaçait au-dessus des obligations de vie commune convenable (<em>al-Mu'âsharah bil-Ma'rûf</em>) qui lui ont été imposées.</p>
<p>⁕ Il est interdit à l'épouse d'agir ainsi [de se rebeller] sans motif valable. Si le mari constate de la part de sa femme un signe parmi les indices de la rébellion (<em>Nushûz</em>) — comme le fait de ne pas répondre à sa demande de jouissance conjugale, ou de se montrer nonchalante lorsqu'il l'appelle —, il doit alors, à ce moment-là, l'exhorter, lui faire craindre Allah, lui rappeler son droit qui lui incombe ainsi que le péché qu'elle encourt en lui désobéissant. Si elle persiste dans sa rébellion après l'exhortation, il s'éloigne d'elle dans le lit en cessant de partager sa couche et en ne lui parlant pas pendant une durée de trois jours. Si elle persiste encore après l'éloignement, il lui inflige une correction physique non violente (c'est-à-dire : non sévère) ; cela est fondé sur la parole de l'Incommensurable :</p>
<p class="ar"><span dir="rtl">﴿وَالَّاتِي تَخَافُونَ نُشُوزَهُنَّ فَعِظُوهُنَّ وَاهْجُرُوهُنَّ فِي الْمَضَاجِعِ وَاضْرِبُوهُنَّ﴾ [النساء: ٣٤].</span></p>
<p><strong>﴾ Et quant à celles dont vous craignez la rébellion, exhortez-les, éloignez-vous d'elles dans les lits et corrigez-les. ﴿</strong> [An-Nisâ : 34].</p>
<p>⁕ Si chacun des deux époux prétend que l'autre se montre injuste envers lui, et qu'il s'avère impossible de les réconcilier, le gouverneur (ou le juge) mandate alors deux arbitres intègres issus de leurs familles respectives. En effet, les proches parents sont les plus instruits des causes internes cachées, et les plus à même de faire preuve de loyauté et de veiller à l'intérêt supérieur du couple. Les deux arbitres doivent formuler l'intention de réconcilier ; cela est fondé sur la parole de l'Incommensurable :</p>
<p class="ar"><span dir="rtl">﴿وَإِنْ خِفْتُمْ شِقَاقَ بَيْنِهِمَا فَابْعَثُوا حَكَمًا مِّنْ أَهْلِهِ وَحَكَمًا مِّنْ أَهْلِهَا إِن يُرِيدَا إِصْلَاحًا يُوَفِّقِ اللهُ بَيْنَهُمَا إِنَّ اللهَ كَانَ عَلِيمًا خَبِيرًا﴾ [النساء: ٣٥]</span></p>
<p><strong>﴾ Si vous craignez une rupture entre les deux, envoyez alors un arbitre de la famille de l'époux et un arbitre de la famille de l'épouse. Si les deux veulent la réconciliation, Allah établira l'entente entre eux. Certes, Allah est Omniscient et Parfaitement Connaisseur. ﴿</strong> [An-Nisâ : 35]. Ces deux arbitres mettent en œuvre la solution la plus bénéfique, qu'il s'agisse de l'union (le maintien du mariage) ou de la séparation, que ce soit avec une compensation financière [le <em>Khul'</em>] ou sans compensation. La décision finale à laquelle ils parviennent est alors appliquée afin de résoudre le litige. Et Allah est le Plus Savant.</p>
