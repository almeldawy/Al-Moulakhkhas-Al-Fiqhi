<p>⁕ Le Prophète (sur lui la prière et salut) a dit :</p>
<p class="ar"><span dir="rtl">«إِذَا خَطَبَ أَحَدُكُمُ امْرَأَةً؛ فَقَدَرَ أَنْ يَرَى مِنْهَا بَعْضَ مَا يَدْعُوهُ إِلَى نِكَاحِهَا؛ فَلْيَفْعَلْ»</span></p>
<p><em><strong>« Quand l’un de vous demande une femme en mariage, s’il peut voir d'elle ce qui l'incite à l'épouser, qu’il le fasse. »</strong></em> [Rapporté par Ahmad et Abû Dâwûd]<a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a>.</p>
<p>Et dans un autre hadith :</p>
<p class="ar"><span dir="rtl">«انْظُرْ إِلَيْهَا؛ فَإِنَّهُ أَحْرَى أَنْ يُؤْدَمَ بَيْنَكُمَا»</span></p>
<p><em><strong>« Regarde-la, car cela est plus à même d'instaurer l'harmonie (et l'amour) entre vous deux. »</strong></em><a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a></p>
<p>Cela prouve l'autorisation de regarder ce qui apparaît habituellement de la femme demandée en mariage, et que cela peut se faire à son insu (sans qu'elle le sache), et sans qu'il y ait d'isolement seul à seul (<em>Khalwah</em>) avec elle.</p>
<p>Les juristes (<em>Al-Fuqahâ</em>) ont dit : <em>« Il est permis à celui qui souhaite demander une femme en mariage, et qui pense de manière prépondérante qu'elle acceptera sa demande, de regarder ce qui apparaît d'elle habituellement, sans isolement seul à seul, et s'il est à l'abri de la tentation (Fitnah). »</em> Fin de citation.</p>
<p>Et dans le hadith de Jâbir :</p>
<p class="ar"><span dir="rtl">«فَكُنْتُ أَتَخَبَّأُ لَهَا، حَتَّى رَأَيْتُ مِنْهَا بَعْضَ مَا دَعَانِي إِلَى نِكَاحِهَا»</span></p>
<p><em><strong>« Je me cachais donc pour la voir, jusqu'à ce que j'aie vu d'elle ce qui m'a incité à l'épouser. »</strong></em><a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a></p>
<p>Cela prouve donc qu'il ne doit pas s'isoler seul à seul avec elle, qu'elle n'a pas besoin d'être au courant de cela, et qu'il ne doit regarder d'elle que ce que la coutume a rendu habituel de laisser paraître de son corps. De plus, cette dérogation (<em>Rukhṣah</em>) concerne spécifiquement celui qui pense de manière prépondérante que sa demande de mariage sera acceptée. Si le fait de la regarder directement ne lui est pas facilité, il peut envoyer vers elle une femme de confiance pour l'observer, puis la lui décrire. Ceci conformément à ce qui a été rapporté : <em><strong>« Le Prophète <span dir="rtl">ﷺ</span> a envoyé Umm Sulaym pour observer une femme. »</strong></em> [Rapporté par Ahmad].<a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a></p>
<p>⁕ Et quiconque est consulté au sujet d'un prétendant (homme) ou d'une prétendante (femme), il lui est obligatoire de mentionner ses défauts et autres caractéristiques (pertinentes). Cela ne fait pas partie de la médisance (<em>Al-Ghîbah</em>) interdite.</p>
<p>⁕ Il est interdit de formuler une demande en mariage explicite (<em>At-Taṣrîḥ</em>) à une femme qui est en période de viduité (<em>Al-Mu'taddah</em>), comme le fait de lui dire : « <em>Je veux t'épouser</em> ». Cela s'appuie sur la parole d'Allah (Le Très-Haut) :</p>
<p class="ar"><span dir="rtl">﴿وَلَا جُنَاحَ عَلَيْكُمْ فِيمَا عَرَّضْتُم بِهِ مِنْ خِطْبَةِ النِّسَاءِ﴾ [البقرة: ٢٣٥]</span></p>
<p><em><strong>« Et on ne vous reprochera pas de faire des allusions à ces femmes quant à votre intention de les demander en mariage »</strong></em> [Al-Baqarah : 235]. Allah a ainsi permis l'allusion (<em>At-Ta'rîḍ</em>) pour demander en mariage une femme en période de viduité. L'allusion consiste par exemple à dire : « <em>Je suis certes désireux d'une femme comme toi</em> », ou : « <em>Ne me laisse pas passer ma chance avec toi</em> ». Cela prouve l'interdiction de la formulation explicite, telle que : « <em>Je veux t'épouser</em> », car la formulation explicite ne laisse planer aucun doute quant à l'intention de mariage. Dès lors, on ne peut être à l'abri du fait que l'empressement de la femme la pousse à mentir en déclarant que sa période de viduité est terminée avant son expiration réelle.</p>
<p>L'Imam Ibn Al-Qayyim <a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a> a dit : « <em>Il a été interdit de demander explicitement en mariage une femme en période de viduité. Cette interdiction s'applique même lors de la période de viduité consécutive au décès du conjoint, et ce, bien que la fin de cette période ne dépende pas (du témoignage) de la femme. En effet, autoriser la demande en mariage explicite pourrait être un moyen menant la femme à s'empresser d'accepter, et à mentir sur la fin de sa période de viduité. En revanche, il est permis à l'ex-époux qui l'a divorcée d'un divorce définitif inférieur à trois (un ou deux divorces sans reprise avant la fin de la viduité) de la demander en mariage, de manière explicite comme par allusion, durant sa période de viduité, car il lui est permis de se remarier avec elle durant sa viduité.</em> »</p>
<p>Le Cheikh Taqî Ad-Dîn (Ibn Taymiyyah) <a href="#fn6" class="footnote-ref" id="fnref6" role="doc-noteref"><sup>6</sup></a> a dit : « <em>La formulation explicite ainsi que l'allusion sont permises de la part de celui qui est à l'origine de cette période de viduité, si le mariage avec elle durant cette période lui est juridiquement permis.</em> »</p>
<p>⁕ Il est également interdit de demander une femme en mariage alors qu'elle fait déjà l'objet d'une demande de la part de son frère musulman. Ainsi, quiconque demande une femme en mariage et reçoit une réponse favorable, il est interdit à un autre de la demander à son tour, jusqu'à ce que le premier prétendant le lui permette ou qu'il se désiste. Cela s'appuie sur la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«لَا يَخْطُبُ الرَّجُلُ عَلَى خِطْبَةِ أَخِيهِ حَتَّى يَنْكِحَ أَوْ يَتْرُكَ»</span></p>
<p><em><strong>« Qu'aucun homme ne fasse une demande en mariage sur la demande de son frère, jusqu'à ce que ce dernier se marie ou qu'il renonce. »</strong></em> [Rapporté par Al-Bukhârî et An-Nasâ'î] <a href="#fn7" class="footnote-ref" id="fnref7" role="doc-noteref"><sup>7</sup></a>. Et Muslim a rapporté :</p>
<p class="ar"><span dir="rtl">«لَا يَحِلُّ لِلْمُؤْمِنِ أَنْ يَخْطُبَ عَلَى خِطْبَةِ أَخِيهِ حَتَّى يَذَرَ»</span></p>
<p><em><strong>« Il n'est pas permis au croyant de faire une demande en mariage sur la demande de son frère jusqu'à ce qu'il renonce. »</strong></em> <a href="#fn8" class="footnote-ref" id="fnref8" role="doc-noteref"><sup>8</sup></a><em>.</em></p>
<p>Et dans le hadith d'Ibn 'Umar :</p>
<p class="ar"><span dir="rtl">«لَا يَخْطُبُ أَحَدُكُمْ عَلَى خِطْبَةِ أَخِيهِ»</span></p>
<p><em><strong>« Qu'aucun de vous ne fasse une demande en mariage sur la demande de son frère. »</strong></em>, Rapporté par Al-Bukhârî et Muslim <a href="#fn9" class="footnote-ref" id="fnref9" role="doc-noteref"><sup>9</sup></a>.</p>
<p>Et selon la version d'Al-Bukhârî :</p>
<p class="ar"><span dir="rtl">«لَا يَخْطُبُ الرَّجُلُ عَلَى خِطْبَةِ الرَّجُلِ حَتَّى يَتْرُكَ الخَاطِبُ قَبْلَهُ أَوْ يَأْذَنَ لَهُ»</span></p>
<p><em><strong>« Qu'un homme ne fasse pas de demande en mariage sur la demande d'un autre homme, jusqu'à ce que le premier prétendant renonce ou qu'il lui donne la permission. »</strong></em> <a href="#fn10" class="footnote-ref" id="fnref10" role="doc-noteref"><sup>10</sup></a>.</p>
<p>Ces hadiths et ceux qui abondent dans le même sens prouvent l'interdiction pour le musulman de faire une demande en mariage sur celle de son frère, en raison du tort que cela cause au premier prétendant (en gâchant ses démarches), de l'inimitié que cela sème entre les gens, et de la transgression de leurs droits.</p>
<p>Cependant, si le premier prétendant est éconduit (refusé), ou s'il accorde sa permission au deuxième, ou s'il délaisse de lui-même cette femme, il devient alors permis au second de la demander en mariage. Ceci conformément à la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«حَتَّى يَأْذَنَ أَوْ يَتْرُكَ»</span></p>
<p><em><strong>« ...jusqu'à ce qu'il donne sa permission ou qu'il renonce. »</strong></em> <a href="#fn11" class="footnote-ref" id="fnref11" role="doc-noteref"><sup>11</sup></a>. Cela relève du respect de la sacralité du musulman et de l'interdiction de lui nuire ou de transgresser ses droits.</p>
<p>Et certaines personnes ne prêtent pas attention à cela ; ils s'empressent de demander une femme en mariage alors qu'ils savent pertinemment qu'un autre les a devancés dans cette démarche et qu'une réponse favorable a déjà été donnée. Ils transgressent ainsi le droit de leur frère et gâchent ce qui avait été conclu de sa demande. Cet acte est formellement interdit, d'une interdiction stricte. De plus, il est fort probable que celui qui ose demander une femme en mariage alors qu'il a été devancé, en plus de commettre un lourd péché, soit privé de la réussite (dans ce projet) et qu'il soit châtié.</p>
<p>Le musulman doit donc être vigilant face à cela et respecter les droits de ses frères musulmans. Certes, le droit du musulman sur son frère musulman est immense : il ne fait pas de demande en mariage sur la sienne, il ne surenchérit pas sur sa vente, et il ne lui cause aucun type de tort ou de nuisance.</p>
