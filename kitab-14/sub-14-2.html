<h2 id="بسم-الله-الرحمن-الرحيم"><span dir="rtl">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيم</span>ِ</h2>
<p><strong>Chapitre sur les règles du mariage</strong></p>
<p>⁕ Ce sujet revêt une importance capitale, qui a conduit les juristes (<em>al-fuqahâ</em>) à lui accorder une place de choix dans leurs ouvrages, en y détaillant ses règles et en y explicitant ses objectifs ainsi que ses implications. En effet, il est légiféré par le Livre (le Coran), la Sunnah et le consensus (<em>al-Ijmâ'</em>) :</p>
<p>Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿فَانْكِحُوا مَا طَابَ لَكُمْ مِنَ النِّسَاءِ مَثْنَىٰ وَثُلَاثَ وَرُبَاعَ﴾ [النساء: ٣]</span></p>
<p><em><strong>« ...Il vous est permis d'épouser deux, trois ou quatre parmi les femmes qui vous plaisent... »</strong></em> [Sourate An-Nisâ : 3].</p>
<p>Et après avoir mentionné les femmes avec lesquelles le mariage est interdit, le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿وَأُحِلَّ لَكُمْ مَا وَرَاءَ ذَٰلِكُمْ أَنْ تَبْتَغُوا بِأَمْوَالِكُمْ مُحْصِنِينَ غَيْرَ مُسَافِحِينَ﴾ [النساء: ٢٤]</span></p>
<p><em><strong>« Et il vous est permis, en dehors de cela, de courir après (les autres femmes) en leur versant vos biens, avec l'intention de vous marier honnêtement et non de vous livrer à la débauche. »</strong></em> [Sourate An-Nisâ : 24].</p>
<p>Le Prophète <span dir="rtl">ﷺ</span> a également incité au mariage et a encouragé à le contracter en disant :</p>
<p class="ar"><span dir="rtl">«يَا مَعْشَرَ الشَّبَابِ! مَنِ اسْتَطَاعَ مِنْكُمُ الْبَاءَةَ؛ فَلْيَتَزَوَّجْ؛ فَإِنَّهُ أَغَضُّ لِلْبَصَرِ، وَأَحْصَنُ لِلْفَرْجِ»</span></p>
<p><em><strong>« Ô vous les jeunes ! Quiconque d'entre vous possède les capacités (financières et physiques) de se marier, qu'il le fasse, car cela aide à baisser le regard et préserve la chasteté. »</strong></em> <a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a>.</p>
<p>Il a aussi dit (sur lui la prière et le salut) :</p>
<p class="ar"><span dir="rtl">«تَزَوَّجُوا الْوَدُودَ الْوَلُودَ؛ فَإِنِّي مُكَاثِرٌ بِكُمُ الْأُمَمَ يَوْمَ الْقِيَامَةِ»</span></p>
<p><em><strong>« Épousez la femme affectueuse et féconde, car je serai fier du grand nombre que vous représenterez devant les autres communautés le Jour de la Résurrection. »</strong></em> <a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a>.</p>
<p>⁕ <strong>Et le mariage découle sur de grands intérêts (et bienfaits) :</strong></p>
<p><strong>Parmi ceux-ci :</strong> La préservation de la lignée humaine, l'augmentation du nombre de musulmans, et le fait d'irriter les mécréants en donnant naissance à des combattants dans le sentier d'Allah et à des défenseurs de Sa religion.</p>
<p><strong>Parmi ceux-ci :</strong> La préservation de la chasteté des parties intimes, leur protection, et leur sauvegarde contre les jouissances interdites qui corrompent les sociétés humaines.</p>
<p><strong>Parmi ceux-ci :</strong> Le fait que l'époux assume la responsabilité de la femme par la prise en charge (la protection) et les dépenses financières ; Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿الرِّجَالُ قَوَّامُونَ عَلَى النِّسَاءِ بِمَا فَضَّلَ اللَّهُ بَعْضَهُمْ عَلَىٰ بَعْضٍ وَبِمَا أَنْفَقُوا مِنْ أَمْوَالِهِمْ﴾ [النساء: ٣٤]</span></p>
<p><em><strong>« Les hommes ont autorité sur les femmes, en raison des faveurs qu'Allah accorde à ceux-là sur celles-ci, et aussi à cause des dépenses qu'ils font de leurs biens. »</strong></em> [Sourate An-Nisâ : 34].</p>
<p><strong>Parmi ceux-ci :</strong> L'obtention de la quiétude et de la complicité entre les deux époux, ainsi que l'obtention du repos de l'âme ; Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿وَمِنْ آيَاتِهِ أَنْ خَلَقَ لَكُمْ مِنْ أَنْفُسِكُمْ أَزْوَاجًا لِتَسْكُنُوا إِلَيْهَا﴾ [الروم: ٢١]</span></p>
<p><em><strong>« Et parmi Ses signes, Il a créé de vous, pour vous, des épouses pour que vous viviez en tranquillité auprès d'elles... »</strong></em> [Sourate Ar-Rûm : 21], et le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿هُوَ الَّذِي خَلَقَكُمْ مِنْ نَفْسٍ وَاحِدَةٍ وَجَعَلَ مِنْهَا زَوْجَهَا لِيَسْكُنَ إِلَيْهَا﴾ [الأعراف: ١٨٩].</span></p>
<p><em><strong>« C'est Lui qui vous a créés d'un seul être dont Il a tiré son épouse, pour qu'il trouve de la tranquillité auprès d'elle. »</strong></em> [Sourate Al-A'râf : 189].</p>
<p><strong>Parmi ceux-ci :</strong> Il constitue une protection pour les sociétés humaines contre le fait de sombrer dans les turpitudes comportementales qui détruisent les mœurs et anéantissent la vertu.</p>
<p><strong>Parmi ceux-ci :</strong> La préservation des lignées, le renforcement des liens de parenté les uns avec les autres, et l'établissement de familles honorables où règnent la miséricorde, l'entraide (le maintien des liens) et le soutien mutuel dans la vérité.</p>
<p><strong>Parmi ceux-ci :</strong> L'élévation de l'être humain au-dessus de la vie bestiale vers une vie humaine digne et honorable.</p>
<p>... Ainsi que bien d'autres immenses bienfaits qui découlent du mariage légiféré (<em>ach-char'î</em>), noble et pur, fondé sur le Livre d'Allah et la Sunnah de Son Messager.</p>
<p>⁕ Le mariage est un contrat légiféré qui implique la licéité pour chacun des deux époux de jouir de l'autre, comme l'a dit le Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«اسْتَوْصُوا بِالنِّسَاءِ خَيْرًا؛ فَإِنَّهُنَّ عَوْانٍ عِنْدَكُمْ، اسْتَحْلَلْتُمْ فُرُوجَهُنَّ بِكَلِمَةِ اللَّهِ»</span></p>
<p><em><strong>« Prenez grand soin des femmes, car elles sont comme des captives auprès de vous. Vous avez rendu leurs parties intimes licites par la parole d'Allah. »</strong></em> <a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a>.</p>
<p>⁕ <strong>Le contrat de mariage est un pacte entre les deux époux ;</strong> Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿وَأَخَذْنَ مِنْكُمْ مِيثَاقًا غَلِيظًا﴾ [النساء: ٢١]</span></p>
<p><em><strong>« ...et qu'elles ont obtenu de vous un engagement solennel ? »</strong></em> [Sourate An-Nisâ : 21].</p>
<p>C'est donc un contrat qui impose à chacun des deux conjoints, envers l'autre, d'en respecter les implications et les obligations ; Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿يَا أَيُّهَا الَّذِينَ آمَنُوا أَوْفُوا بِالْعُقُودِ﴾ [المائدة: ١]</span></p>
<p><em><strong>« Ô les croyants ! Remplissez fidèlement vos engagements. »</strong></em> [Sourate Al-Mâ'idah : 1].</p>
<p>⁕ <strong>Il est permis à celui qui en a la capacité et qui est à l'abri de l'injustice (le favoritisme) d'épouser plus d'une femme ;</strong> Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿فَانْكِحُوا مَا طَابَ لَكُمْ مِنَ النِّسَاءِ مَثْنَىٰ وَثُلَاثَ وَرُبَاعَ فَإِنْ خِفْتُمْ أَلَّا تَعْدِلُوا فَوَاحِدَةً﴾ [النساء: ٣]</span></p>
<p><em><strong>« ...Il vous est permis d'épouser deux, trois ou quatre parmi les femmes qui vous plaisent. Mais, si vous craignez de n'être pas justes avec elles, alors une seule... »</strong></em> [Sourate An-Nisâ : 3]. L'équité requise ici est l'équité qui est dans la capacité de l'homme, à savoir : l'égalité entre les épouses en matière de dépenses, d'habillement, de logement et de partage des nuits.</p>
<p>⁕ Et l'autorisation de la polygamie fait partie des beautés de cette Législation (la Chari'ah) et de son adaptabilité à tout temps et à tout lieu, en raison des immenses intérêts qu'elle comporte pour les hommes, les femmes et les sociétés :</p>
<p><strong>Car il est de notoriété publique</strong> que le nombre de femmes est supérieur à celui des hommes, en plus des risques auxquels les hommes sont exposés et qui réduisent leur nombre (tels que les dangers des guerres et des voyages), ce qui amène à une diminution des hommes et à une abondance du nombre de femmes. Si l'homme était donc restreint à une seule épouse, de nombreuses femmes se retrouveraient délaissées (sans mariage).</p>
<p><strong>De même, il est bien connu</strong> ce qui survient à la femme comme menstrues et lochies. Si l'homme se voyait interdire d'en épouser une autre, il traverserait de nombreuses périodes durant lesquelles il serait privé de la jouissance et de la procréation.</p>
<p><strong>Il est également connu</strong> que la jouissance pleine et féconde de la femme prend fin lorsqu'elle atteint la ménopause, c'est-à-dire l'âge de cinquante ans. Contrairement à l'homme, dont l'aptitude à la jouissance et à la procréation se poursuit jusqu'à la vieillesse avancée. Si l'homme était restreint à une seule épouse, il manquerait un grand bien, et le bénéfice de la procréation et de la descendance se verrait freiné chez lui.</p>
<p><strong>De plus, s'il est avéré</strong> que le nombre de femmes dépasse celui des hommes dans la majorité des sociétés humaines, le fait de limiter l'homme à une seule femme laisserait beaucoup de femmes sans personne pour subvenir à leurs besoins. Par conséquent, cela conduirait à la corruption morale, à la perdition de nombreuses femmes, ou à leur privation des jouissances et des embellissements de la vie.</p>
<p>Et les sagesses profondes derrière l'autorisation de la polygamie sont nombreuses ; qu'Allah combatte (maudisse) quiconque tente de barrer cette voie et de paralyser ces intérêts (et bienfaits).</p>
<p>⁕ <strong>Du point de vue du statut juridique (char'î), le mariage se divise en cinq catégories : il est tantôt obligatoire, tantôt recommandé, tantôt interdit, et tantôt déconseillé :</strong></p>
<p><strong>Le mariage est obligatoire</strong> pour celui qui craint de tomber dans la fornication (<em>al-zinâ</em>) s'il ne se marie pas. En effet, c'est un moyen de préserver sa propre chasteté face à l'interdit. Concernant cette situation, Cheikh al-Islam Ibn Taymiyyah <a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a>— qu'Allah lui fasse miséricorde — a dit : <em><strong>« Si une personne a besoin de se marier et craint la débauche (ou la difficulté) en y renonçant, elle doit faire passer le mariage avant le pèlerinage obligatoire. »</strong></em> D'autres [savants] ont dit : <em><strong>« Le mariage est alors préférable pour lui que le pèlerinage surérogatoire, la prière surérogatoire et le jeûne surérogatoire. »</strong></em></p>
<p>Ils ont ajouté : dans ce cas précis, il n'y a pas de différence entre celui qui a les moyens de subvenir aux besoins (de son foyer) et celui qui en est incapable.</p>
<p>Cheikh Taqiyy-ud-Dîn [Ibn Taymiyyah] a dit : <em>« Il ressort manifestement des propos d'Ahmad et de la majorité [des savants] que la capacité financière (al-tawl) n'est pas une condition requise [dans cette situation précise de nécessité], car Allah a promis l'enrichissement en échange en disant :</em></p>
<p class="ar"><span dir="rtl">﴿إِنْ يَكُونُوا فُقَرَاءَ يُغْنِهِمُ اللَّهُ مِنْ فَضْلِهِ﴾ [النور: ٣٢]</span></p>
<p><em>"S'ils sont pauvres, Allah les enrichira par Sa grâce" [Sourate An-Nûr : 32].</em></p>
<p><em>De plus, il arrivait au Prophète <span dir="rtl">ﷺ</span> de débuter sa journée ou de la terminer sans rien posséder du tout, et il a pourtant marié un homme qui n'avait même pas les moyens d'offrir une bague en fer. »</em></p>
<p><strong>Le mariage est recommandé (<em>mustahabb</em>)</strong> en présence du désir (libido) mais sans crainte de tomber dans la fornication, et ce, en raison des nombreux bienfaits qu'il comporte tant pour les hommes que pour les femmes.</p>
<p><strong>Le mariage est simplement permis (<em>mubâh</em>)</strong> en l'absence de désir et d'inclinaison envers celui-ci, comme c'est le cas pour l'impuissant (<em>al-'innîn</em>) ou le vieillard. Cependant, il peut s'avérer <strong>déconseillé (<em>makrûh</em>)</strong> dans ce cas précis, car il prive la femme du but fondamental du mariage — qui est de préserver sa chasteté — et lui cause ainsi un préjudice.</p>
<p><strong>Le mariage est interdit (<em>harâm</em>)</strong> pour le musulman s'il se trouve en terre de mécréants en guerre (contre les musulmans), car cela expose sa future descendance au danger et à la domination des mécréants, et parce qu'il ne peut pas garantir la sécurité de son épouse face à eux.</p>
<p>⁕ <strong>Il est recommandé (sunnah) d'épouser une femme pieuse, chaste et de bonne lignée (bonne origine) ;</strong> en raison du hadith d'Abou Hourayrah (qu'Allah l'agrée), selon lequel le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="rtl">«تُنْكَحُ الْمَرْأَةُ لِأَرْبَعٍ: لِمَالِهَا، وَلِحَسَبِهَا، وَلِجَمَالِهَا، وَلِدِينِهَا؛ فَأَظْفَرْ بِذَاتِ الدِّينِ، تَرِبَتْ يَدَاكَ»</span></p>
<p><em><strong>« On épouse la femme pour quatre raisons : pour ses biens, pour son rang social, pour sa beauté et pour sa piété. Choisis donc la femme pieuse, que tes mains poussent dans la poussière (formule d'encouragement). »</strong></em> Rapporté par Al-Boukhari et Muslim <a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a>.</p>
<p>Il a également été rapporté une interdiction d'épouser la femme pour une autre raison que sa piété ; le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="rtl">«لَا تَنكِحُوا النِّسَاءَ لِحُسْنِهِنَّ فَلَعَلَّهُ يُرْدِيَهُنَّ، وَلَا لِمَالِهِنَّ فَلَعَلَّهُ يُطْغِيَهُنَّ، وَانْكِحُوهُنَّ لِلدِّينِ»</span></p>
<p><em><strong>« N'épousez pas les femmes pour leur beauté, car il se peut que leur beauté les perde (les rende hautaines) ; et ne les épousez pas pour leurs biens, car il se peut que leurs biens les rendent tyranniques. Épousez-les plutôt pour leur religion. »</strong></em> <a href="#fn6" class="footnote-ref" id="fnref6" role="doc-noteref"><sup>6</sup></a>.</p>
<p>⁕ <strong>Le Prophète <span dir="rtl">ﷺ</span> a certes encouragé à choisir une femme vierge,</strong> lorsqu'il a dit à Jâbir (qu'Allah l'agrée) :</p>
<p class="ar"><span dir="rtl">«فَهَلَّا بِكْرًا تُلاعِبُهَا وَتُلَاعِبُكَ»</span></p>
<p><em><strong>« Pourquoi n'as-tu pas épousé une jeune fille vierge, afin que tu badines avec elle et qu'elle badine avec toi ? »</strong></em> Rapporté par Al-Boukhari et Muslim <a href="#fn7" class="footnote-ref" id="fnref7" role="doc-noteref"><sup>7</sup></a>. De plus, le mariage avec une vierge favorise une affection totale, puisqu'elle n'a jamais été mariée auparavant à quelqu'un envers qui son cœur aurait pu s'attacher, ce qui aurait pu empêcher son attachement envers son dernier époux d'être complet.</p>
<p>⁕ <strong>Il est recommandé de choisir une épouse féconde ;</strong> c'est-à-dire qu'elle soit issue d'une famille de femmes connues pour avoir beaucoup d'enfants. Cela s'appuie sur le hadith d'Anas (qu'Allah l'agrée), d'après le Prophète <span dir="rtl">ﷺ</span>, qui a dit :</p>
<p class="ar"><span dir="rtl">«تَزَوَّجُوا الْوَدُودَ الْوَلُودَ؛ فَإِنِّي مُكَاثِرٌ بِكُمُ الْأُمَمَ يَوْمَ الْقِيَامَةِ»</span></p>
<p><em><strong>« Épousez la femme affectueuse et féconde, car je serai fier du grand nombre que vous représenterez devant les autres communautés le Jour de la Résurrection. »</strong></em> Rapporté par An-Nassâ'î et d'autres <a href="#fn8" class="footnote-ref" id="fnref8" role="doc-noteref"><sup>8</sup></a>, et plusieurs hadiths abondent dans ce même sens.</p>
<p>⁕ Le statut juridique du mariage varie selon la situation de l'individu : ses capacités physiques, ses moyens financiers, ainsi que son aptitude à assumer ses responsabilités.</p>
<p>Le Prophète <span dir="rtl">ﷺ</span> a certes incité les jeunes au mariage précoce, car ils en ont plus besoin que quiconque. Le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="rtl">«يَا مَعْشَرَ الشَّبَابِ! مَنِ اسْتَطَاعَ مِنْكُمُ الْبَاءَةَ؛ فَلْيَتَزَوَّجْ؛ فَإِنَّهُ أَغَضُّ لِلْبَصَرِ وَأَحْصَنُ لِلْفَرْجِ، وَمَنْ لَمْ يَسْتَطِعْ؛ فَعَلَيْهِ بِالصَّوْمِ؛ فَإِنَّهُ لَهُ وِجَاءٌ»</span></p>
<p><em>« <strong>Ô vous les jeunes ! Celui d'entre vous qui en a les capacités physiques et financières (Al-Bâ'ah) doit se marier, car cela aide à baisser le regard et à préserver la chasteté. Et que celui qui n'en a pas les capacités jeûne, car le jeûne sera pour lui un bouclier (une protection contre les tentations).</strong> »</em> Rapporté par Al-Boukhârî, Muslim <a href="#fn9" class="footnote-ref" id="fnref9" role="doc-noteref"><sup>9</sup></a> ainsi que d'autres.</p>
<p>Et <strong>« Al-Bâ'ah »</strong> (<span dir="rtl">الباءة</span>) : il a été dit qu'il s'agit de l'acte sexuel, et il a été dit qu'il s'agit des charges financières du mariage. Il n'y a pas de contradiction entre ces deux avis, car le sens implicite est : « celui d'entre vous qui est capable d'accomplir l'acte sexuel en raison de sa capacité à assumer les charges financières du mariage ».</p>
<p>Et sa parole : <strong>« plus à même de baisser le regard »</strong> signifie : cela détourne plus efficacement l'œil de la personne mariée de regarder la femme étrangère (non-mahram).</p>
<p>Et sa parole : <strong>« et de préserver la chasteté »</strong> signifie : cela constitue un empêchement et une protection plus forts contre le fait de tomber dans la turpitude (la fornication).</p>
<p>Ensuite, il <span dir="rtl">ﷺ</span> a dit : <strong>« Et que celui qui n'en a pas les capacités »</strong>, c'est-à-dire qui ne peut pas assumer le mariage et ses charges. <strong>« qu'il jeûne »</strong>, c'est-à-dire qu'il adopte le jeûne comme remède alternatif. <strong>« car le jeûne sera pour lui un bouclier (Wijâ') »</strong>, c'est-à-dire qu'il repousse le désir et lui évite son danger, tout comme le fait le <em>Wijâ'</em> qui désigne [à l'origine] la castration. En effet, en réduisant la nourriture et la boisson, le jeûneur voit son désir s'atténuer, et il ressent, durant son jeûne, un sentiment particulier de crainte d'Allah et de piété (Taqwa).</p>
<p>Comme l'a dit le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿يَٰأَيُّهَا ٱلَّذِينَ ءَامَنُواْ كُتِبَ عَلَيْكُمُ ٱلصِّيَامُ كَمَا كُتِبَ عَلَى ٱلَّذِينَ مِن قَبْلِكُمْ لَعَلَّكُمْ تَتَّقُونَ﴾ [البقرة: ١٨٣]</span></p>
<p><em>﴾ <strong>Ô les croyants ! On vous a prescrit le jeûne comme on l'a prescrit à ceux d'avant vous, ainsi atteindrez-vous la piété.</strong> ﴿</em> [Al-Baqarah: 183], et le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿وَأَن تَصُومُواْ خَيْرٌ لَّكُمْ إِن كُنتُمْ تَعْلَمُونَ﴾ [البقرة: ١٨٤]</span></p>
<p><em>﴾ <strong>Et jeûner est meilleur pour vous, si vous saviez !</strong> ﴿</em> [Al-Baqarah: 184].</p>
<p>Le Prophète <span dir="rtl">ﷺ</span> a donc ordonné de lutter contre le désir et de se prémunir de son danger par deux solutions ordonnées :</p>
<ul>
<li><blockquote>
<p><strong>La première chose :</strong> le mariage, lorsque l'on en a la capacité.</p>
</blockquote></li>
<li><blockquote>
<p><strong>La seconde :</strong> le jeûne, pour celui qui ne peut pas se marier.</p>
</blockquote></li>
</ul>
<p>Cela prouve qu'il n'est pas permis à l'être humain de s'abandonner et de se laisser glisser vers les voies du danger (de la tentation).</p>
<p>Et ceci est semblable à la parole du Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿وَأَنكِحُواْ ٱلْأَيَٰمَىٰ مِنكُمْ وَٱلصَّٰلِحِينَ مِنْ عِبَادِكُمْ...﴾ [النور: ٣٢] إِلَى قَوْلِهِ تَعَالَى: ﴿وَلْيَسْتَعْفِفِ ٱلَّذِينَ لَا يَجِدُونَ نِكَاحًا حَتَّىٰ يُغْنِيَهُمُ ٱللَّهُ مِن فَضْلِهِۦۗ﴾ [النور: ٣٣].</span></p>
<p><em>﴾ <strong>Mariez les célibataires d'entre vous et les gens de bien parmi vos esclaves...</strong> ﴿</em> [An-Nûr: 32] jusqu'à Sa parole : <em>﴾ <strong>Et que ceux qui n'ont pas les moyens de se marier cherchent la chasteté jusqu'à ce qu'Allah les enrichisse de Sa grâce.</strong> ﴿</em> [An-Nûr: 33].</p>
