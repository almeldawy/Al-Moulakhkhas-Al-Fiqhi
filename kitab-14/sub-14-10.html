<p>⁕ <strong>Par « non-musulmans »</strong>, on désigne les gens du Livre (Juifs et Chrétiens) ainsi que les autres, à l’instar des zoroastriens (Mages) et des idolâtres. Ce qui est visé [ici] correspond aux mariages sur lesquels ils sont maintenus s'ils embrassent l'Islam ou s'ils portent leur litige devant nous alors qu'ils sont encore dans leur état de mécréance.</p>
<p>⁕ <strong>Ainsi, le mariage des non-musulmans est régi par le même statut que le mariage des musulmans</strong> en ce qui concerne sa validité, l'effectivité du divorce (<em>Talâq</em>), de la formule de reniement (<em>Zihâr</em>), du serment de continence (<em>Îlâ’</em>), ainsi que l'obligation de subvenir aux besoins (<em>Nafaqah</em>) et du partage équitable [entre les épouses].</p>
<p>⁕ <strong>Il leur est interdit</strong> d'épouser les femmes qui sont interdites aux musulmans. En effet, il est mentionné dans le Noble Coran l'affiliation (l'annexion grammaticale) de la femme au mécréant, comme dans la parole d'Allah le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿وَامْرَأَتُهُ حَمَّالَةَ الْحَطَبِ﴾ [المسد: ٤]، وَ﴿امْرَأَتُ فِرْعَوْنَ﴾ [القصص: ٩]</span></p>
<p><strong>« Et sa femme, la porteuse de bois »</strong> [Al-Masad : 4], et <strong>« La femme de Pharaon »</strong> [Al-Qasas : 9].</p>
<p>Allah a donc affilié la femme au mécréant, et cette affiliation implique un lien conjugal valide.</p>
<p>Cheikh Al-Islam Ibn Taymiyyah — qu'Allah lui fasse miséricorde — a dit <a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a>: <em>« L'avis correct est que leurs mariages qui sont interdits en Islam sont absolument illicites : s'ils ne se convertissent pas à l'Islam, ils seront châtiés pour cela ; mais s'ils embrassent l'Islam, cela leur est pardonné en raison du fait qu'ils ne croyaient pas à leur interdiction. Quant à la validité et la nullité [de ces unions], l'avis correct est qu'elles sont valides sous un certain aspect et nulles sous un autre. Si par "validité" on entend la permission de jouir du mariage, cela ne leur devient licite qu'à la condition d'embrasser l'Islam. En revanche, si par là on entend l'effectivité du contrat et l'application des règles de la conjugalité qui en découlent — telles que le fait de rendre l'épouse divorcée trois fois à nouveau licite [pour son ex-mari après un vrai remariage], l'effectivité du divorce en son sein et l'établissement du statut de chasteté/mariage (Ihṣân) — alors il est valide. »</em> Fin de citation.</p>
<p>⁕ <strong>Parmi les règles relatives aux mariages des non-musulmans</strong>, figure le fait qu'ils sont maintenus dans leurs mariages invalides sous deux conditions :</p>
<p><strong>La première condition :</strong> Qu'ils croient en la validité de ce mariage selon leur propre législation. Quant à ce dont ils ne croient pas à la licéité, ils n'y sont pas maintenus, car cela ne fait pas partie de leur religion.</p>
<p><strong>La deuxième condition :</strong> Qu'ils ne portent pas leur litige devant nous. S'ils portent l'affaire devant nous, nous ne les maintenons pas dans cette situation [illicite], en raison de la parole d'Allah le Très-Haut :</p>
<p class="ar"><span dir="rtl">(وَأَنِ احْكُم بَيْنَهُم بِمَا أَنزَلَ اللَّهُ﴾ [المائدة: ٤٩]</span></p>
<p><strong>« Et juge entre eux d'après ce qu'Allah a fait descendre »</strong> [Al-Mâ'idah : 49].</p>
<p>⁕ <strong>S'ils croient en la validité de leur mariage selon leur propre législation</strong> et qu'ils ne portent pas de litige devant nous, nous ne nous opposons pas à eux. La preuve en est que le Prophète <span dir="rtl">ﷺ</span> a perçu la capitation (<em>Jizyah</em>) des zoroastriens (Mages) de Hajar <a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a> sans contester leurs mariages, bien qu'il sût qu'ils s'autorisaient l'union avec les femmes de leur proche parenté (les interdits consanguins). De plus, une multitude de gens ont embrassé l'Islam à l'époque du Prophète <span dir="rtl">ﷺ</span> ; il les a alors maintenus dans leurs mariages sans s'enquérir des modalités selon lesquelles ils avaient été conclus.</p>
<p>⁕ <strong>S'ils se présentent à nous avant de conclure leur acte de mariage</strong>, nous concluons alors leur mariage conformément aux règles de notre religion : par une formule d'engagement (offre) et d'acceptation (<em>Îjâb wa Qabûl</em>), en présence d'un tuteur (<em>Walî</em>) et de deux témoins intègres parmi nous. Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿وَإِنْ حَكَمْتَ فَاحْكُم بَيْنَهُم بِالْقِسْطِ﴾ [المائدة: ٤٢]</span></p>
<p><strong>« Et si tu juges, alors juge entre eux en toute équité »</strong> [Al-Mâ'idah : 42].</p>
<p>⁕ <strong>Quant au fait qu'ils se présentent à nous après avoir déjà conclu l'acte de mariage entre eux</strong>, nous ne contestons pas la manière dont il s'est déroulé.</p>
<p>⁕ <strong>Il en est de même lorsque les deux époux embrassent l'Islam alors qu'ils sont déjà mariés</strong> : nous ne contestons pas la manière dont le mariage s'est déroulé ni la réunion de ses conditions par le passé. Cependant, nous examinons la situation au moment de la saisine du tribunal ou au moment de leur conversion à l'Islam. Si, à ce moment précis, l'épouse lui est licite en raison de l'absence d'empêchements juridiques légaux, ils sont alors maintenus dans leur mariage. En effet, puisqu'il n'y a alors aucun empêchement à contracter initialement le mariage, il n'y a aucun empêchement à sa pérennisation. En revanche, si à ce moment où ils portent l'affaire en justice ou embrassent l'Islam, il n'est pas permis de contracter initialement le mariage avec elle, ils sont alors séparés ; car ce qui empêche de contracter le mariage initialement empêche également sa pérennisation.</p>
<p>Quant à la dot (<em>Mahr</em>) qui lui a été fixée à l'époque de leur mécréance, si elle est valide, l'épouse la perçoit, car elle est devenue obligatoire par le contrat et rien ne s'oppose à ce qu'elle l'obtienne pleinement. Mais si la dot est invalide (illicite) — comme du vin ou du porc — :</p>
<p>Si elle l'a déjà perçue, la situation est définitivement établie et elle n'a droit à rien d'autre. En effet, elle l'a perçue sous le régime de l'associationnisme (<em>Shirk</em>) ; la responsabilité du débiteur en est donc dégagée. De plus, remettre cela en question engendrerait une gêne et un motif d'éloignement de l'Islam ; cela est donc pardonné, tout comme sont pardonnés les autres actes commis à l'époque de la mécréance.</p>
<p>Si elle n'a pas encore perçu cette dot invalide, on lui attribue alors une dot d'équivalence (<em>Mahr al-Mithl</em>).</p>
<p>Si elle a perçu une partie de cette dot invalide mais n'a pas touché le reste, il lui est alors dû la part proportionnelle restante basée sur la dot d'équivalence.</p>
<p>Enfin, si aucune dot ne lui avait été fixée à l'origine, on lui attribue également une dot d'équivalence, car le mariage a été conclu sans qu'une dot n'ait été spécifiée.</p>
<p>⁕ <strong>Si les deux époux embrassent l'Islam ensemble</strong>, en prononçant leur entrée en Islam simultanément, ils demeurent alors mariés, car il n'y a pas eu de divergence de religion entre eux.</p>
<p>⁕ <strong>Si le mari d'une femme du Livre (juive ou chrétienne) embrasse l'Islam</strong> alors qu'elle conserve sa religion, ils restent mariés. En effet, puisqu'il est permis au musulman de contracter initialement un mariage avec une femme du Livre, la pérennisation de son mariage avec elle est à plus forte raison autorisée.</p>
<p>⁕ <strong>Si une femme mécréante mariée à un mécréant embrasse l'Islam avant la consommation du mariage</strong>, l'union devient caduque (annulée), en raison de la parole d'Allah le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿فَلَا تَرْجِعُوهُنَّ إِلَى الْكُفَّارِ ۖ لَا هُنَّ حِلٌّ لَّهُمْ وَلَا هُمْ يَحِلُّونَ لَهُنَّ﴾ [الممتحنة: ١٠]</span></p>
<p><strong>« Ne les renvoyez pas aux mécréants. Elles ne sont pas licites pour eux et ils ne sont pas licites pour elles »</strong> [Al-Mumtahanah : 10]. Elle ne bénéficie alors d'aucune part de la dot, car la séparation provient de son fait [à elle].</p>
<p>⁕ <strong>Si le mari d'une femme qui n'est pas du Livre embrasse l'Islam avant la consommation du mariage</strong>, l'union devient caduque, en raison de la parole d'Allah le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿وَلَا تُمْسِكُوا بِعِصَمِ الْكَوَافِرِ﴾ [الممتحنة: ١٠]</span></p>
<p><strong>« Et ne gardez pas de liens conjugaux avec les mécréantes »</strong> [Al-Mumtahanah : 10]. L'homme doit alors verser la moitié de la dot, car la séparation provient de son fait [à lui].</p>
<p>⁕ <strong>Si l'un des deux époux (n'étant pas du Livre) embrasse l'Islam, ou si une femme mécréante mariée à un mécréant se convertit après la consommation du mariage</strong> : le statut du mariage reste suspendu jusqu'à l'expiration de la période de viduité (<em>‘Iddah</em>). Si l'autre conjoint embrasse l'Islam durant cette période, le mariage est maintenu. En revanche, s'il ne se convertit pas avant la fin de celle-ci, il apparaît alors rétrospectivement que le mariage s'est rompu dès la conversion du premier.</p>
<p>⁕ <strong>Quiconque embrasse l'Islam alors qu'il a sous sa tutelle plus de quatre épouses et qu'elles se convertissent aussi (ou qu'elles sont du Livre)</strong>, doit en choisir quatre parmi elles. En effet, Qays ibn al-Hârith s'est converti alors qu'il avait huit épouses, et le Prophète <span dir="rtl">ﷺ</span> lui a dit :</p>
<p class="ar"><span dir="rtl">«اخْتَرْ مِنْهُنَّ أَرْبَعاً»</span></p>
<p><strong>« Choisis-en quatre d'entre elles »</strong> <a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a>, et il a dit de même à d'autres que lui. Et Allah est plus Savant.</p>
