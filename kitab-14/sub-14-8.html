<p>⁕ Il existe des défauts qui ouvrent droit à l'option de rétractation (al-Khiyâr) dans le mariage ; parmi ceux-ci :</p>
<p>– Celle qui constate que son mari est incapable d'accomplir l'acte sexuel en raison d'une impuissance (Iinnîn) ou parce que sa verge est sectionnée, dispose du droit de faire annuler le mariage (al-Faskh). Si elle prétend qu'il est impuissant et qu'il le reconnaît, un délai d'un an lui est accordé. S'il accomplit l'acte durant cette année, [le mariage est maintenu], sinon, elle a le droit de demander l'annulation.</p>
<p>– Si l'homme constate chez son épouse un défaut empêchant les rapports intimes, tel que l'atrésie vaginale (al-Ratq), et qu'il est impossible d'y remédier, il dispose du droit d'annulation.</p>
<p>– De même, si l'un des deux conjoints découvre chez l'autre un défaut commun [pouvant affecter les deux sexes], tel que les hémorroïdes, la folie, le vitiligo (ou la lèpre blanche), la lèpre, la teigne du cuir chevelu ou la mauvaise haleine fétide, il a alors l'option de rétractation, en raison de l'aversion que cela suscite.</p>
<p>L'érudit Ibn al-Qayyim <a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a> a dit : <em>« Tout défaut qui suscite l'aversion de l'un des conjoints envers l'autre, et par lequel le but du mariage ne peut être atteint, impose le droit d'option. Et cela est encore plus légitime et prioritaire que dans le cas d'une vente. »</em> Fin de citation.</p>
<p>– Et si un défaut survient chez l'un des deux époux après la conclusion du contrat de mariage, l'autre conserve le droit d'option.</p>
<p>⁕ Le droit d'option est accordé à celui des deux conjoints qui n'a pas accepté le défaut, même s'il présente lui-même un défaut similaire ou différent, car l'être humain ne ressent pas d'aversion pour son propre défaut. Quant à celui des deux qui a accepté le défaut de l'autre — en disant par exemple : "Je l'accepte", ou si une preuve de son consentement est établie alors qu'il avait connaissance du défaut — il ne dispose plus d'aucun droit d'option après cela.</p>
<p>⁕ Dès lors que le droit d'option est établi pour l'un des deux conjoints, celui-ci ne devient effectif qu'auprès du juge (al-Hâkim) ; car cela nécessite un effort de réflexion et un examen juridique. Ainsi, le juge prononce l'annulation à la demande de celui qui détient le droit d'option, ou il autorise ce dernier à la prononcer lui-même.</p>
<p>⁕ Si l'annulation a lieu avant la consommation du mariage (al-Doukhoûl), l'épouse n'a droit à aucune dot (Mahr). En effet, si l'annulation est demandée par elle, la séparation provient de son propre fait ; et si elle est demandée par lui, c'est qu'elle lui a dissimulé le défaut, l'annulation survenant alors à cause d'elle.</p>
<p>⁕ En revanche, si l'annulation intervient après la consommation du mariage, l'épouse a droit à la dot qui a été fixée lors du contrat. Car cette dot est devenue obligatoire par le contrat et s'est confirmée par la consommation, elle ne peut donc plus s'annuler.</p>
<p>⁕ Il n'est pas valide de marier la fille mineure, la femme atteinte de folie ou la femme esclave à un homme présentant un défaut permettant l'annulation du mariage. En effet, leur tuteur (Walî) se doit de veiller exclusivement sur ce qui comporte un avantage et un intérêt pour elles. Si leur tuteur n'avait pas connaissance du défaut, il doit faire annuler le mariage dès qu'il l'apprend, afin d'écarter tout préjudice à leur encontre.</p>
<p>⁕ Si la femme majeure et jouissant de ses facultés mentales accepte d'épouser un homme dont la verge est sectionnée (Majboûb) ou un homme impuissant (Iinnîn), son tuteur n'a pas le droit de l'en empêcher, car le droit aux rapports intimes lui appartient à elle seule, et à personne d'autre.</p>
<p>Cependant, si elle accepte de se marier avec un homme fou, lépreux ou atteint de vitiligo (lèpre blanche), son tuteur a le droit de l'en empêcher. Car cela comporte un préjudice dont on craint la transmission à la descendance, et cela constitue également un déshonneur (une diminution) pour sa famille.</p>
