<p>⁕ <em>Al-Sadâq</em> (la dot) est un terme dérivé de <em>Al-Sidq</em> (la sincérité), car elle témoigne du désir sincère de l'époux envers l'épouse. Sur le plan de la législation islamique (<em>Shar'an</em>), il s'agit d'une contrepartie financière (ou matérielle) qui est spécifiée lors de la conclusion du contrat de mariage ou après celle-ci.</p>
<p>⁕ Quant à son statut juridique, elle est <strong>obligatoire</strong>. Les preuves de cette obligation se trouvent dans le Livre (le Coran), la Sunnah et le consensus (<em>Al-Ijmâ'</em>).</p>
<p>⁃ Allah - Qu'Il soit Exalté - a dit :</p>
<p class="ar"><span dir="rtl">﴿وَآتُوا النِّسَاءَ صَدُقَاتِهِنَّ نِحْلَةً فَإِن طِبْنَ لَكُمْ عَن شَيْءٍ مِّنْهُ نَفْسًا فَكُلُوهُ هَنِيئًا مَّرِيئًا﴾ [النساء: 4]</span></p>
<p><em><strong>« Et donnez aux épouses leur dot, de bonne grâce. Si de bon gré elles vous en abandonnent quelque chose, disposez-en alors à votre aise et de bon cœur. »</strong></em> [Sourate An-Nisâ' : 4].</p>
<p>⁃ Et en raison de la pratique du Prophète <span dir="rtl">ﷺ</span>, car il ne célébrait jamais un mariage sans dot, et il a dit :</p>
<p class="ar"><span dir="rtl">«الْتَمِسْ وَلَوْ خَاتَماً مِنْ حَدِيدٍ»</span></p>
<p><em><strong>« Cherche (quelque chose à donner), ne serait-ce qu'une bague en fer. »</strong></em> <a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a>.</p>
<p>⁃ Et les gens de science ont unanimement convergé (consensus) sur sa légitimité.</p>
<p>⁕ Quant à sa quantité, son minimum et son maximum ne sont pas limités par un seuil précis. Ainsi, tout ce qui peut valablement servir de prix (dans une vente) ou de salaire peut valablement servir de dot, que sa valeur soit minime ou importante. Cependant, il convient de suivre l'exemple du Prophète <span dir="rtl">ﷺ</span> en faisant en sorte qu'elle se situe aux alentours de <strong>quatre cents dirhams</strong>, ce qui correspond à la dot des filles du Prophète <a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a>.</p>
<p>Cheikh al-Islam Ibn Taymiyyah <a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a> — qu'Allah lui fasse miséricorde — a dit : <em>« La dot payée d'avance, si elle est élevée alors que l'homme en a les moyens, n'est pas détestable (Makroûh), à moins que cela ne s'accompagne d'une chose qui engendre la réprobation, comme l'ostentation, la vanité ou autre chose similaire. En revanche, s'il n'en a pas les moyens, cela devient détestable, et cela peut même devenir interdit s'il ne peut y parvenir qu'en mendiant (en demandant de l'argent aux gens) ou par d'autres voies illicites. Quant à la dot d'un montant élevé qui est reportée (dette à payer plus tard) et qui reste à sa charge, il convient de la juger détestable, car l'homme expose ainsi sa propre personne à une obligation financière pesante (une dette impayée). » Fin de sa parole.</em></p>
<p>⁕ En conclusion, la grande valeur de la dot n'est pas détestable tant qu'elle n'atteint pas le seuil de la vantardise et du gaspillage, et qu'elle ne surcharge pas les épaules de l'époux au point de le contraindre à solliciter l'aide d'autrui par la mendicité ou autre procédé similaire, ou qu'elle n'endette pas sa personne. Ce sont là des critères de grande valeur qui garantissent l'intérêt général (<em>Al-Maslahah</em>) et repoussent le préjudice (<em>Al-Madarrah</em>).</p>
<p>⁕ Il ressort de ce qui précède que la situation actuelle des gens concernant la surenchère excessive et exorbitante des dots — où la situation de l'époux démuni n'est pas prise en compte et qui est devenue un obstacle difficile à surmonter sur le chemin du mariage — ne laisse aucun doute quant à sa réprobation (<em>Karâhah</em>) ou son interdiction (<em>Tahrîm</em>). C'est d'autant plus vrai qu'elle s'accompagne d'autres frais, tels que l'achat de tissus aux prix exorbitants, de parures de grande valeur, ainsi que de fêtes et de banquets marqués par le gaspillage, la prodigalité et la perte de nourriture et de viande, sans aucun intérêt réel pour les deux époux. Il ne fait aucun doute que tout cela relève des fardeaux, des chaînes et des mauvaises coutumes qu'il est obligatoire de combattre, d'éradiquer, afin de purifier la voie du mariage de ses obstacles.</p>
<p>Et dans le hadith de 'Âïshah — qu'Allah l'agrée — rapporté de manière prophétique (<em>Marfoû'</em>), il est dit :</p>
<p class="ar"><span dir="rtl">«أَعْظَمُ النِّسَاءِ بَرَكَةً أَيْسَرُهُنَّ مُؤْنَةً»</span></p>
<p><em><strong>« Les femmes qui ont la plus grande bénédiction sont celles dont le coût (la dot et les dépenses) est le plus modéré. »</strong></em> [Rapporté par Ahmad, Al-Bayhaqî, Al-Hâkim et d'autres <a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a>].</p>
<p>Et 'Umar ibn al-Khattâb — qu'Allah l'agrée — a dit :</p>
<p class="ar"><span dir="rtl">«أَلَا لَا تُغَالُوا فِي صُدُقِ النِّسَاءِ؛ فَإِنَّهَا لَوْ كَانَتْ مَكْرُمَةً فِي الدُّنْيَا أَوْ تَقْوَى عِنْدَ اللَّهِ؛ كَانَ أَوْلَاكُمْ بِهَا رَسُولُ اللَّهِ ﷺ، مَا أَصْدَقَ رَسُولُ اللَّهِ ﷺ اِمْرَأَةً مِنْ نِسَائِهِ، وَلَا أُصْدِقَتْ اِمْرَأَةٌ مِنْ بَنَاتِهِ، أَكْثَرَ مِنِ اِثْنَتَيْ عَشْرَةَ أُوقِيَّةً، وَإِنَّ الرَّجُلَ لَيُغَالِي بِصَدَقَةِ اِمْرَأَتِهِ حَتَّى يَكُونَ لَهَا عَدَاوَةٌ فِي قَلْبِهِ، وَحَتَّى يَقُولَ: كُلِّفْتُ فِيكِ عَلَقَ الْقِرْبَةِ»</span></p>
<p><em>« Prenez garde ! N'exagérez pas dans le montant de la dot des femmes. Car si cela était une marque d'honneur dans ce bas monde ou une piété auprès d'Allah, le Messager d'Allah <span dir="rtl">ﷺ</span> y aurait été le plus en droit parmi vous. Or, le Messager d'Allah <span dir="rtl">ﷺ</span> n'a jamais donné à l'une de ses épouses, et aucune de ses filles n'a reçu, une dot supérieure à douze onces (Oûqiyyah). Certes, il arrive qu'un homme augmente tellement la dot de sa femme que cela engendre de l'animosité envers elle dans son cœur, au point qu'il finisse par dire : "J'ai été contraint pour toi de supporter de lourds fardeaux (litt. la corde de la gourde d'eau)." »</em> [Rapporté par An-Nasâ'î et Aboû Dâwoûd <a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a>].</p>
<p>À partir de cela, tu sais que l'excès de la dot peut être une cause de détestation de l'époux envers sa femme lorsqu'il se rappelle l'immensité de sa dot. C'est pour cette raison que les femmes qui ont la plus grande bénédiction sont celles dont le coût est le plus modéré, comme cela apparaît dans le hadith de 'Âïshah. Ainsi, la facilitation de la dot attire la bénédiction sur l'épouse et sème pour elle l'amour dans le cœur du mari.</p>
<p>⁕ Et la sagesse derrière la légifération de la dot réside dans le fait qu'elle constitue une contrepartie pour la jouissance (conjugale). De plus, elle contient une valorisation de la condition de l'épouse et une marque d'estime pour son statut auprès de l'époux.</p>
<p>⁕ Il est recommandé (<em>Mustahabb</em>) de nommer la dot et de la définir précisément lors de la conclusion du contrat (de mariage), afin de couper court à tout litige.</p>
<p>⁕ Et il est permis qu'elle soit nommée et fixée après le contrat de mariage, en raison de la parole d'Allah — Qu'Il soit Exalté — :</p>
<p class="ar"><span dir="rtl">﴿لَّا جُنَاحَ عَلَيْكُمْ إِن طَلَّقْتُمُ النِّسَاءَ مَا لَمْ تَمَسُّوهُنَّ أَوْ تَفْرِضُوا لَهُنَّ فَرِيضَةً﴾ [البقرة: 236]</span></p>
<p><em><strong>« Vous ne faites pas de péché si vous divorcez d'avec vos épouses sans les avoir touchées ou avant de leur avoir fixé de dot. »</strong></em> [Sourate Al-Baqarah : 236]. Ce verset prouve ainsi que la fixation de la dot peut être ultérieure au contrat de mariage.</p>
<p>⁕ Quant à la nature (le type) de la dot : comme on peut le comprendre, tout ce qui peut valablement servir de prix dans une vente, de salaire dans un louage ou de valeur pour un bien peut valablement servir de dot. Qu'il s'agisse d'un bien matériel tangible (<em>'Ayn</em>), d'une dette payable immédiatement (<em>Mu'ajjal</em>) ou à terme (<em>Mu-ajjal</em>), ou encore d'un service (usufruit) connu (<em>Manfa'ah ma'loûmah</em>). Cela démontre qu'il est demandé de faciliter la dot en fonction des conditions et des situations, afin de faciliter le mariage auquel sont rattachés de grands intérêts pour les individus et les sociétés.</p>
<p>⁕ Voici quelques-unes des questions importantes relatives à la dot :</p>
<p><strong>Premièrement :</strong> La dot est la propriété exclusive de la femme. Son tuteur (<em>Walî</em>) n'en possède absolument rien, à l'exception de ce qu'elle lui autorise de bon gré, en raison de la parole d'Allah — Qu'Il soit Exalté — :</p>
<p class="ar"><span dir="rtl">﴿وَآتُوا النِّسَاءَ صَدُقَاتِهِنَّ نِحْلَةً فَإِن طِبْنَ لَكُمْ عَن شَيْءٍ مِّنْهُ نَفْسًا فَكُلُوهُ هَنِيئًا مَّرِيئًا﴾ [النساء: 4]</span></p>
<p><em><strong>« Et donnez aux épouses leur dot, de bonne grâce. Si de bon gré elles vous en abandonnent quelque chose, disposez-en alors à votre aise et de bon cœur. »</strong></em> [Sourate An-Nisâ' : 4].</p>
<p>Et il est permis à son <strong>père exclusivement</strong> de prendre une partie de sa dot, même si elle n'en donne pas l'autorisation, à condition que cela ne lui cause aucun préjudice et qu'elle n'en ait pas un besoin impératif, en raison de la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«أَنْتَ وَمَالُكَ لِأَبِيكَ»</span></p>
<p><em><strong>« Toi et tes biens appartenez à ton père. »</strong></em> <a href="#fn6" class="footnote-ref" id="fnref6" role="doc-noteref"><sup>6</sup></a>.</p>
<p><strong>Deuxièmement :</strong> La possession de la dot par la femme débute dès la conclusion du contrat (de mariage), à l'instar d'une transaction de vente. Elle lui est définitivement et totalement acquise par les rapports charnels (<em>Al-Wat'</em>), par la retraite intime (<em>Al-Khalwah</em>) avec elle, ou par la mort de l'un des deux conjoints.</p>
<p><strong>Troisièmement :</strong> S'il divorce d'avec elle avant la consommation du mariage (<em>Al-Doukhoûl</em>) ou la retraite intime, alors qu'il lui avait déjà fixé une dot, elle a droit à la moitié de celle-ci. Cela repose sur la parole d'Allah — Qu'Il soit Exalté — :</p>
<p class="ar"><span dir="rtl">﴿وَإِن طَلَّقْتُمُوهُنَّ مِن قَبْلِ أَن تَمَسُّوهُنَّ وَقَدْ فَرَضْتُمْ لَهُنَّ فَرِيضَةً فَنِصْفُ مَا فَرَضْتُمْ﴾ [البقرة: 237]</span></p>
<p><em><strong>« Et si vous divorcez d'avec elles avant de les avoir touchées, alors que vous leur aviez déjà fixé une dot, donnez-leur la moitié de ce que vous avez fixé. »</strong></em> [Sourate Al-Baqarah : 237] ; c'est-à-dire : (le reste) est pour vous et (cette moitié) est pour elles. Cela implique donc que la moitié lui revient (au mari) et l'autre moitié lui revient (à l'épouse) par le simple fait du divorce.</p>
<p>Et si l'un des deux renonce en faveur de son compagnon à la part qui lui revient (de la dot), tout en étant pleinement apte juridiquement à disposer de ses biens, son désistement est valide. Cela s'appuie sur la parole d'Allah — Qu'Il soit Exalté — :</p>
<p class="ar"><span dir="rtl">﴿إِلَّا أَن يَعْفُونَ أَوْ يَعْفُوَ الَّذِي بِيَدِهِ عُقْدَةُ النِّكَاحِ﴾ [البقرة: 237]</span></p>
<p><em><strong>« à moins qu'elles n'y renoncent, ou que n'y renonce celui qui tient en sa main le lien du mariage. »</strong></em> [Sourate Al-Baqarah : 237]. Ensuite, Il a encouragé au pardon en disant :</p>
<p class="ar"><span dir="rtl">﴿وَأَن تَعْفُوا أَقْرَبُ لِلتَّقْوَى وَلَا تَنسَوُا الْفَضْلَ بَيْنَكُمْ﴾ [البقرة: 237]</span></p>
<p><em><strong>« Et le fait que vous pardonniez (et renonciez) est plus proche de la piété. Et n'oubliez pas votre bienveillance mutuelle. »</strong></em> [Sourate Al-Baqarah : 237] ; c'est-à-dire : que les deux époux n'oublient pas de faire preuve de bonté et de noblesse d'âme l'un envers l'autre.</p>
<p>Fait partie intégrante de cela le fait que la femme fasse preuve de générosité en faisant cadeau de sa moitié (en y renonçant), ou que l'homme fasse preuve de noblesse à son égard en lui versant la dot complète. Il s'agit là d'une orientation divine destinée aux époux, hommes et femmes, les invitant à ne pas se montrer pointilleux ni à réclamer leur dû de manière stricte les uns envers les autres, et à faire preuve d'indulgence concernant les droits de chacun sur l'autre, en considération du lien (sacré) qui a existé entre eux.</p>
<p><strong>Quatrièmement :</strong> Tout ce qui est perçu (reçu) en raison du mariage, comme un vêtement/un présent offert à son père ou à son frère, fait partie intégrante de la dot (<em>Al-Mahr</em>).</p>
<p><strong>Cinquièmement :</strong> S'il lui donne en guise de dot un bien usurpé (<em>Maghsoûb</em>) ou illicite (<em>Mouharram</em>), le mariage reste valide (<em>Sahha</em>). Cependant, il devient obligatoire de lui verser la dot d'équivalence (<em>Mahr al-Mithl</em>) en remplacement de la dot illicite.</p>
<p><strong>Sixièmement :</strong> Si le contrat de mariage est conclu sans qu'une dot (<em>Mahr</em>) n'ait été attribuée à la femme, le mariage est tout de même valide (<em>Sahha</em>). Ce cas de figure est appelé « la délégation » (<em>At-Tafwîd</em>), et on estime alors pour elle une dot d'équivalence (<em>Mahr al-Mithl</em>). Cela repose sur la parole d'Allah — Qu'Il soit Exalté — :</p>
<p class="ar"><span dir="rtl">﴿لَّا جُنَاحَ عَلَيْكُمْ إِن طَلَّقْتُمُ النِّسَاءَ مَا لَمْ تَمَسُّوهُنَّ أَوْ تَفْرِضُوا لَهُنَّ فَرِيضَةً﴾ [البقرة: ٢٣٦]</span></p>
<p><em><strong>« Vous ne faites pas de péché si vous divorcez d'avec vos épouses sans les avoir touchées ou avant de leur avoir fixé de dot. »</strong></em> [Sourate Al-Baqarah : 236] ; c'est-à-dire : ou tant que vous ne leur avez pas fixé de dot.</p>
<p>Et d'après le hadith d'Ibn Mas'oûd concernant un homme qui avait épousé une femme sans lui fixer de dot et sans avoir consommé le mariage avec elle avant de mourir. Il (Ibn Mas'oûd) — qu'Allah l'agrée — dit :</p>
<p class="ar"><span dir="rtl">«لَهَا صَدَاقُ نِسَائِهَا، لَا وَكْسَ وَلَا شَطَطَ، وَعَلَيْهَا الْعِدَّةُ، وَلَهَا الْمِيرَاثُ»</span></p>
<p><em><strong>« Elle a droit à une dot semblable à celle des femmes de sa condition, sans diminution ni excès ; elle doit accomplir la période de viduité (Al-'Iddah) et elle a droit à l'héritage. »</strong></em> C'est alors que Ma'qil ibn Sinân lui dit : <em><strong>« Le Messager d'Allah <span dir="rtl">ﷺ</span> a prononcé exactement le même jugement au sujet de Barwa' bint Wâshiq. »</strong></em> [Rapporté par At-Tirmidhî et d'autres, et il l'a authentifié <a href="#fn7" class="footnote-ref" id="fnref7" role="doc-noteref"><sup>7</sup></a>].</p>
<p>La délégation (<em>At-Tafwîd</em>) quant à la valeur de la dot peut aussi signifier qu'on la marie en s'en remettant à ce que décidera l'un des deux conjoints ou une tierce personne. Le contrat est également valide dans ce cas, et on lui attribue la dot d'équivalence. Celui qui évalue cette dot d'équivalence est le gouverneur/juge (<em>Al-Hâkim</em>). Il la fixe en se basant sur la dot des femmes de son rang, c'est-à-dire ses parentes qui lui ressemblent, comme sa mère, sa tante maternelle ou sa tante paternelle. Le juge prend ainsi en considération les parentes les plus proches qui lui sont égales par la situation financière, la beauté, l'intelligence, la bonne éducation, l'âge, la virginité ou le fait d'avoir déjà été mariée (<em>Thuyoûbah</em>)... Et si elle n'a pas de parentes (pour comparer), on l'évalue alors par rapport aux femmes de sa ville qui partagent des caractéristiques similaires.</p>
<p>Et s’il se sépare d’elle par un divorce avant la consommation du mariage, elle a alors droit à une compensation (Al-Mut'ah) proportionnelle à l'aisance ou à la gêne de son époux. Cela, conformément à la parole d'Allah le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿لَّا جُنَاحَ عَلَيْكُمْ إِن طَلَّقْتُمُ النِّسَاءَ مَا لَمْ تَمَسُّوهُنَّ أَوْ تَفْرِضُوا لَهُنَّ فَرِيضَةً ۚ وَمَتِّعُوهُنَّ عَلَى الْمُوسِعِ قَدَرُهُ وَعَلَى الْمُقْتِرِ قَدَرُهُ مَتَاعًا بِالْمَعْرُوفِ ۖ حَقًّا عَلَى الْمُحْسِنِينَ﴾ [البقرة]</span></p>
<p><em><strong>{Vous ne commettez aucun péché si vous divorcez d’avec vos épouses tant que vous ne les avez pas touchées ou que vous ne leur avez pas fixé de dot. Donnez-leur toutefois une compensation : au riche selon ses moyens et à l'indigent selon ses moyens, un bienfait convenable. C'est un devoir pour les bienfaisants}</strong></em> [Sourate Al-Baqarah]. Or, l'ordre [dans le verset] implique une obligation, et l'accomplissement d'une obligation relève de la bienfaisance.</p>
<p>Et si la séparation a lieu en raison de la mort de l'un des deux [époux] avant la consommation du mariage, la dot d'équivalence (<em>Mahr al-Mithl</em>) lui est alors définitivement acquise, et le survivant hérite de l'autre. En effet, le fait de ne pas avoir spécifié le montant de la dot ne nuit pas à la validité du mariage, et cela est également fondé sur le hadith d'Ibn Mas'ûd précédemment mentionné.</p>
<p>Et si la consommation du mariage (<em>Ad-Dukhûl</em>) ou l'isolement intime (<em>Al-Khalwah</em>) a eu lieu, la dot d'équivalence lui est alors définitivement acquise. Cela s'appuie sur ce qu'a rapporté [l'imam] Ahmad et d'autres concernant le jugement des Califes Bien Guidés :</p>
<p class="ar"><span dir="rtl">«أَنَّ مَنْ أَغْلَقَ بَاباً أَوْ أَرْخَى سِتْراً؛ فَقَدْ وَجَبَ الْمَهْرُ»</span></p>
<p><em><strong>"Quiconque ferme une porte ou tire un rideau, la dot devient alors obligatoire."</strong></em><a href="#fn8" class="footnote-ref" id="fnref8" role="doc-noteref"><sup>8</sup></a></p>
<p>En revanche, si la séparation provient de son fait à elle [l'épouse] avant la consommation du mariage, elle n'a droit à rien. C'est le cas, par exemple, si elle apostasie ou si elle demande l'annulation du mariage (<em>Faskh</em>) en raison de la présence d'un défaut chez l'époux.</p>
<p><strong>Septièmement :</strong> Avant la consommation du mariage, la femme a le droit de se refuser [à son époux] jusqu'à ce qu'elle perçoive sa dot immédiate (<em>Al-Hâll</em>). En effet, si elle se donnait à lui, puis souhaitait revenir sur sa décision jusqu'à ce qu'elle la perçoive, cela ne lui serait pas possible. Cependant, si la dot est à terme [différée, <em>Mu'ajjal</em>], elle n'a pas le droit de se refuser, car elle a consenti à son retardement. De même, si elle s'est déjà donnée à lui, puis souhaite se refuser ultérieurement jusqu'à percevoir sa dot, cela ne lui est pas permis.</p>
