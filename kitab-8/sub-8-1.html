<h3 id="بسم-الله-الرحمن-الرحيم"><span dir="rtl">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيم</span>ِ</h3>
<p><strong>Chapitre sur les règles de la réconciliation (As-Sulh)</strong></p>
<p>⁕ <strong>La réconciliation (Al-Sulh) au sens linguistique :</strong> C'est le fait de mettre fin à une dispute.</p>
<p><strong>Son sens dans la législation islamique (As-Shar‘) :</strong> C'est une convention (un contrat) par laquelle on parvient à rétablir la concorde (la paix) entre deux parties en conflit.</p>
<p>Et c'est l'un des contrats les plus bénéfiques. C'est pour cette raison qu'il est jugé bon d'y faire usage d'une part de mensonge si le besoin s'en fait sentir.</p>
<p>⁕ <strong>La preuve de la légitimité de la réconciliation (Al-Sulh) :</strong> Le Livre (le Coran), la Sunnah et le consensus (Al-Ijmâ‘) :</p>
<p><strong>Allah Le Très-Haut a dit :</strong></p>
<p class="ar"><span dir="rtl">﴿وَالصُّلْحُ خَيْرٌ﴾ [النساء: ١٢٨]</span></p>
<p><em><strong>﴾ ...et la réconciliation est meilleure… ﴿</strong></em> [Sourate An-Nisâ' : 128]</p>
<p>Et Il a dit :</p>
<p class="ar"><span dir="rtl">﴿وَإِنْ طَائِفَتَانِ مِنَ الْمُؤْمِنِينَ اقْتَتَلُوا فَأَصْلِحُوا بَيْنَهُمَا...﴾ [الحجرات: ٩] إِلَى قَوْلِهِ تَعَالَى: ﴿فأَصْلِحُوا بَيْنَهُمَا بِالْعَدْلِ وَأَقْسِطُوا إِنَّ اللَّهَ يُحِبُّ الْمُقْسِطِينَ﴾ [الحجرات: ٩]</span></p>
<p><em><strong>﴾ Et si deux groupes de croyants se combattent, faites la conciliation entre eux… ﴿</strong></em> jusqu'à Sa parole: <em><strong>﴾ ...Établissez donc la conciliation entre eux avec justice, et soyez équitables, car Allah aime les équitables. ﴿</strong></em> [Sourate Al-Hujurât : 9]</p>
<p>Et Le Très-Haut a dit:</p>
<p class="ar"><span dir="rtl">﴿لَا خَيْرَ فِي كَثِيرٍ مِنْ نَجْوَاهُمْ إِلَّا مَنْ أَمَرَ بِصَدَقَةٍ أَوْ مَعْرُوفٍ أَوْ إِصْلَاحٍ بَيْنَ النَّاسِ وَمَنْ يَفْعَلْ ذَلِكَ ابْتِغَاءَ مَرْضَاتِ اللَّهِ فَسَوْفَ نُؤْتِيهِ أَجْرًا عَظِيمًا﴾ [النساء: ١١٤]</span></p>
<p><em><strong>﴾ Il n'y a rien de bon dans la plus grande partie de leurs conversations secrètes, sauf si l'un d'eux ordonne une aumône, une bonne action, ou une réconciliation entre les gens. Et quiconque fait cela, recherchant l'agrément d'Allah, Nous lui donnerons bientôt une récompense immense.﴿</strong></em> [Sourate An-Nisâ' : 114]</p>
<p>Et le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿فَاتَّقُوا اللَّهَ وَأَصْلِحُوا ذَاتَ بَيْنِكُمْ﴾ [الأنفال: ١]</span></p>
<p><em><strong>﴾ Craignez donc Allah et maintenez la concorde entre vous...﴿</strong></em> [Sourate Al-Anfâl : 1].</p>
<p>Et le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="rtl">«الصُّلْحُ جَائِزٌ بَيْنَ الْمُسْلِمِينَ؛ إِلَّا صُلْحاً أَحَلَّ حَرَاماً أَوْ حَرَّمَ حَلَالاً»</span></p>
<p><em><strong>« La réconciliation est permise entre les musulmans, sauf une réconciliation qui rend licite un interdit ou qui rend illicite un fait licite. »</strong></em> <em>(Rapporté et) jugé authentique par At-Tirmidhî</em> <a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a>, et il <span dir="rtl">ﷺ</span> s'employait lui-même à réconcilier les gens.</p>
<p>⁕ <strong>La réconciliation autorisée est celle qui est juste</strong>, celle qu'Allah et Son Messager ont ordonnée. C'est celle par laquelle on vise l'agrément d'Allah le Très-Haut, puis la satisfaction des deux parties en litige.</p>
<p>⁕ <strong>Il est indispensable que celui qui entreprend de réconcilier les gens</strong> soit instruit des faits (de la situation), connaisseur du devoir juridique (les règles de la Loi islamique), et qu'il recherche la justice. Le degré (le mérite) de celui qui réconcilie les gens est supérieur à celui de celui qui jeûne (le jour) et prie (la nuit).<br />
En revanche, si la réconciliation est dénuée de justice, elle devient une injustice et une spoliation des droits. C'est le cas, par exemple, lorsqu'on réconcilie un homme puissant et injuste avec un homme faible et opprimé, d'une manière qui agrée le puissant, le conforte dans son injustice, lèse le droit du faible et l'empêche de recouvrer ce qui lui est dû.<br />
De plus, la réconciliation ne peut avoir lieu que concernant les droits des créatures les unes envers les autres, parmi les droits qui acceptent le renoncement (l'annulation) ou la compensation. Quant aux droits d'Allah le Très-Haut — comme les peines légales (<em>Al-Hudûd</em>) et la Zakât —, la réconciliation n'y a aucune place, car la réconciliation à leur sujet consiste à s'en acquitter pleinement.</p>
<p>⁕ <strong>La réconciliation entre les gens englobe cinq catégories :</strong></p>
<ul>
<li><blockquote>
<p><strong>La première catégorie :</strong> La réconciliation (la trêve) entre les musulmans et les gens de la guerre (<em>Ahl al-Harb</em>).</p>
</blockquote></li>
<li><blockquote>
<p><strong>La deuxième catégorie :</strong> La réconciliation entre les partisans de la justice (l'autorité légitime) et les rebelles (<em>Ahl al-Baghy</em>) parmi les musulmans.</p>
</blockquote></li>
<li><blockquote>
<p><strong>La troisième catégorie :</strong> La réconciliation entre les deux époux lorsque la rupture (la discorde) est crainte entre eux.</p>
</blockquote></li>
<li><blockquote>
<p><strong>La quatrième catégorie :</strong> La réconciliation entre deux parties en litige pour autre chose que des biens financiers.</p>
</blockquote></li>
<li><blockquote>
<p><strong>La cinquième catégorie :</strong> La réconciliation entre deux parties en litige concernant des biens financiers (le patrimoine), et c'est ce qui est visé ici. Ce type de réconciliation se divise en deux types : <strong>le premier est la réconciliation basée sur la reconnaissance (des faits/<em>Al-Iqrâr</em>)</strong>, et <strong>le second est la réconciliation basée sur la dénégation (le déni/<em>Al-Inkâr</em>)</strong>.</p>
</blockquote></li>
</ul>
<p><strong>1 - La réconciliation basée sur la reconnaissance (des faits) est de deux types :</strong> Un type qui porte sur la même nature (catégorie) que le droit dû, et un type qui porte sur une nature différente.</p>
<p><strong>‣ Celui qui porte sur la même nature est, par exemple :</strong> Le cas où une personne reconnaît devoir à une autre une dette déterminée ou posséder un bien matériel (tangible) lui appartenant.<br />
Elles se réconcilient alors sur le fait que le créancier prenne une partie de la dette et abandonne (annule) le reste, ou bien qu'il fasse don d'une partie du bien matériel et reprenne l'autre partie.</p>
<p>Ce type de réconciliation est valide à condition qu'il ne soit pas stipulé comme une condition sine qua non à la reconnaissance (de la dette). Par exemple, que le débiteur (celui qui doit le droit) dise : <em>« Je reconnais ma dette à condition que tu me donnes ou me compenses par telle chose »</em>, ou que le créancier (le titulaire du droit) dise : <em>« Je t'en décharge ou je te fais don à condition que tu me donnes telle chose »</em>. Si cette réconciliation fait l'objet d'une condition de la manière que nous venons d'évoquer, elle n'est pas valide, car le créancier est en droit de réclamer l'intégralité de son droit.</p>
<p>Il est également requis, pour la validité de ce type de réconciliation, que le débiteur ne prive pas le créancier de son droit en l'absence de cet accord. En effet, agir ainsi reviendrait à s'approprier injustement les biens d'autrui, ce qui est illicite (interdit). De plus, celui qui est redevable d'un droit a l'obligation de le restituer à son titulaire sans restriction ni condition.</p>
<p>Il est également requis, pour la validité de ce type de réconciliation, que le titulaire du droit (le créancier) soit une personne dont l'acte de donation (la libéralité) est juridiquement valide. S'il fait partie de ceux dont la donation n'est pas valide, l'accord ne sera pas valide. C'est le cas, par exemple, du tuteur légal des biens d'un orphelin ou d'une personne atteinte de folie (aliénée) ; car cet accord constitue une donation, et le tuteur n'en a pas le droit de propriété (il ne peut en disposer à sa guise).</p>
<p><strong>En conclusion</strong>, il est permis de faire une réconciliation portant sur un droit établi en échange d'une partie de sa propre nature, à deux conditions :</p>
<ol type="1">
<li><blockquote>
<p>Que le débiteur (celui qui doit le droit) ne refuse pas de s'en acquitter en l'absence de cette réconciliation.</p>
</blockquote></li>
<li><blockquote>
<p>Que le titulaire du droit soit une personne dont la donation est valide.</p>
</blockquote></li>
</ol>
<p>Lorsque ces conditions sont réunies, cette réconciliation est alors permise car elle relève du domaine de la donation (de la libéralité). Or, on n'empêche pas un être humain de renoncer à une partie de son droit, tout comme on ne lui interdit pas de le réclamer dans son intégralité. De plus, le Prophète <span dir="rtl">ﷺ</span> est intervenu lui-même auprès des créanciers de Jâbir (qu'Allah l'agrée) afin qu'ils réduisent (effacent une partie de) sa dette.</p>
<p><strong>‣ Le second type des deux catégories de réconciliation basée sur la reconnaissance :</strong> C'est le fait de se réconcilier sur un droit en échange d'une contrepartie d'une autre nature (différente du droit initial).</p>
<p>C'est le cas, par exemple, si une personne reconnaît devoir à une autre une dette ou un bien matériel, puis qu'elles s'accordent pour que le créancier reçoive en échange une compensation d'une autre nature :</p>
<ul>
<li><blockquote>
<p><strong>S'il fait une réconciliation de l'argent (devise) contre une autre monnaie :</strong> Il s'agit alors d'une opération de change (<em>Sarf</em>), soumise aux règles juridiques du change.</p>
</blockquote></li>
<li><blockquote>
<p><strong>S'il fait une réconciliation de l'argent contre un bien non monétaire :</strong> Cela est considéré comme une vente (<em>Bay‘</em>), soumise aux règles juridiques de la vente.</p>
</blockquote></li>
<li><blockquote>
<p><strong>S'il fait une réconciliation en échange d'un droit de jouissance (usufruit), comme le fait de loger dans sa maison :</strong> Cela est considéré comme un louage (un bail / <em>Ijârah</em>), soumis aux règles juridiques de la location.</p>
</blockquote></li>
<li><blockquote>
<p><strong>S'il fait une réconciliation d'un bien non monétaire contre un autre bien (patrimoine) :</strong> C'est également une vente (<em>Bay‘</em>).</p>
</blockquote></li>
</ul>
<p><strong>2 - La réconciliation basée sur la dénégation (le déni) :</strong> Son sens est qu'une personne réclame à une autre un bien matériel (tangible) qu'elle détiendrait, ou une dette dont elle serait redevable envers elle. Le défendeur (l'accusé) garde alors le silence, ignorant tout de l'objet de la réclamation, puis s'accorde avec le demandeur (le plaignant) pour régler le litige moyennant une somme d'argent payable immédiatement ou à terme.</p>
<p>Cette forme de réconciliation est valide selon l'avis de la majorité des gens de science, en raison de la parole du Prophète (sur lui la prière et le salut) :</p>
<p class="ar"><span dir="rtl">«الصُّلْحُ جَائِزٌ بَيْنَ الْمُسْلِمِينَ؛ إِلَّا صُلْحاً أَحَلَّ حَرَاماً أَوْ حَرَّمَ حَلَالاً»</span></p>
<p><em><strong>« La réconciliation est permise entre les musulmans, sauf une réconciliation qui rend illicite un fait licite ou qui rend licite un interdit. »</strong></em> Rapporté par Abû Dâwûd et At-Tirmidhî, qui a dit : « Hadith bon et authentique », et Al-Hâkim l'a également authentifié <a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a>. De plus, ‘Umar a écrit une lettre à Abû Mûsâ (qu'Allah les agrée tous deux) contenant ce hadith ; il est donc tout à fait correct de s'appuyer sur celui-ci comme argument juridique au vu de ces considérations.</p>
<p><strong>L'utilité de ce type de réconciliation :</strong></p>
<ul>
<li><blockquote>
<p><strong>Pour le défendeur (l'accusé) :</strong> C'est un moyen de se racheter (de se libérer) de la procédure judiciaire et de l'obligation de prêter serment.</p>
</blockquote></li>
<li><blockquote>
<p><strong>Pour le demandeur (le plaignant) :</strong> C'est un soulagement qui lui évite la charge d'avoir à fournir des preuves (témoignages/pièces justificatives) et lui permet d'éviter que le recouvrement du droit qu'il réclame ne traîne en longueur.</p>
</blockquote></li>
</ul>
<p>En ce qui concerne le demandeur (le plaignant), la réconciliation basée sur la dénégation a le même statut juridique qu'une vente (<em>Bay‘</em>). En effet, il considère la somme reçue comme une contrepartie (une compensation) en échange de son propre bien. Le statut légal qui découle de sa propre conviction s'applique donc à lui : c'est comme si le défendeur lui avait acheté ce bien.</p>
<p>Par conséquent, les règles relatives à la vente s'appliquent à son égard, telles que :</p>
<ul>
<li><blockquote>
<p><strong>La possibilité de restituer le bien en raison d'un vice caché</strong> (<em>Ar-Radd bi-l-‘Ayb</em>).</p>
</blockquote></li>
<li><blockquote>
<p><strong>Le droit de préemption</strong> (<em>Al-Akhdh bi-sh-Shuf‘ah</em>), si la nature du bien concerné permet l'application de la préemption.</p>
</blockquote></li>
</ul>
<p><strong>Le statut de cette réconciliation concernant le défendeur (l’accusé) :</strong> Elle est considérée comme une décharge (un affranchissement) de la plainte. En effet, il n'a versé cet argent que pour se racheter de l'obligation de prêter serment, écarter un préjudice, couper court au litige et préserver sa personne de l'avilissement et des querelles. Les âmes nobles éprouvent du dédain pour cela et le supportent difficilement ; elles versent donc de l'argent pour s'en libérer. Par conséquent, s'il découvrait un vice caché dans la contrepartie de l'accord, il n'aurait pas le droit de la restituer, et le droit de préemption ne s'appliquerait pas non plus à son encontre, puisqu'il ne considère pas avoir versé cela en échange de quelque chose.</p>
<p><strong>Le cas du mensonge de l'une des parties :</strong> Si l’un des deux contractants ment lors de cette réconciliation basée sur la dénégation — comme le demandeur qui réclame sciemment un droit qui ne lui appartient pas, ou le défendeur qui nie de mauvaise foi une dette qu’il sait pertinemment devoir —, alors la réconciliation est <strong>nulle et non avenue</strong> (<em>Bâtil</em>) au regard de la réalité cachée (auprès d'Allah) pour la partie menteuse.</p>
<p>Étant donné qu’elle connaît la vérité, qu’elle est capable de restituer le droit à qui de droit et qu’elle se sait illégitime dans son action, tout ce qu’elle perçoit en vertu de cet accord lui est <strong>strictement illicite</strong> (<em>Harâm</em>). Elle l'a en effet acquis par injustice et transgression, et non comme la contrepartie d'un droit réel. Allah Le Très Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿وَلَا تَأْكُلُوا أَمْوَالَكُمْ بَيْنَكُمْ بِالْبَاطِلِ﴾ [البقرة: ١٨٨]</span></p>
<p><em><strong>﴾ Et ne mangez pas vos biens entre vous illégalement ﴿</strong></em> [Sourate Al-Baqarah : 188]</p>
<p>Et même si cette réconciliation paraît valide aux yeux des gens — car ils ignorent le fond de la situation —, cela ne change absolument rien à la réalité auprès de Celui pour qui rien n'est caché, ni sur la terre ni dans le ciel. Il incombe donc au musulman de s'écarter de ce mauvais comportement et de ces ruses mensongères.</p>
<p>Et parmi les questions relatives à la conciliation en cas de dénégation [du droit réclamé] : si un tiers (étranger à l'affaire) conclut une conciliation au nom de celui qui dénie [la dette ou le droit], et ce, sans sa permission ; cette conciliation est tout de même valide.</p>
<p>En effet, le tiers vise par cela à innocenter le défendeur (l'accusé) et à mettre fin au litige qui pèse sur lui. C'est donc comparable au fait de rembourser une dette à sa place.</p>
<p>Cependant, il [le tiers] ne peut rien lui réclamer de ce qu'il a payé, car il n'a pas le droit de se retourner contre lui pour obtenir un remboursement, étant donné qu'il a agi en tant que donateur bénévole.</p>
<p>⁕ Et il est valide de conclure une conciliation concernant un droit inconnu (dont le montant ou la nature n'est pas précisément déterminé), que ce droit soit mutuel (chacun devant quelque chose à l'autre) ou qu'il ne soit dû qu'à l'un des deux. Cela est permis lorsque la connaissance précise de cet élément inconnu est impossible à établir ; comme un compte partagé entre eux sur lequel une longue période s'est écoulée, sans que chacun d'eux ne sache ce qu'il doit exactement à son compagnon.</p>
<p>Ceci s'appuie sur la parole du Prophète <span dir="rtl">ﷺ</span> adressée à deux hommes qui se disputaient au sujet d'héritages anciens et oubliés entre eux :</p>
<p class="ar"><span dir="rtl">«اسْتَهِمَا، وَتَوَاخَيَا الحَقَّ، وَلْيُحَلِّلْ أَحَدُكُمَا صَاحِبَهُ»</span></p>
<p><strong>"Tirez au sort, recherchez la vérité (et la justice) avec fraternité, et que chacun d'entre vous pardonne et libère son compagnon (de toute obligation envers lui)"</strong>. Rapporté par Abû Dâwûd et d'autres <a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a>.</p>
<p>Et parce qu'il s'agit d'une renonciation à un droit, cela a été validé concernant ce qui est inconnu par nécessité, et afin que cela ne conduise pas à la perte des biens ou au maintien d'une dette non acquittée (la charge de la conscience).</p>
<p>⁕ Et il est valide de conclure une conciliation pour renoncer à la loi du talion (<em>Qisâs</em>) en échange du prix du sang (<em>Diya</em>) fixé par la Loi religieuse, ou pour un montant inférieur ou supérieur. Et puisque la compensation financière n'est pas obligatoirement prédéterminée [dans ce cas de désistement mutuel], la contrepartie financière [convenue] ne fait pas l'objet d'une stricte équivalence [avec la Diya légale].</p>
<p>⁕ En revanche, il n'est pas valide de conclure une conciliation pour abandonner les peines légales (<em>Hudûd</em>). En effet, celles-ci ont été légiférées à des fins de dissuasion, et parce qu'elles constituent à la fois un droit d'Allah le Très-Haut et un droit de la société. Par conséquent, transiger à leur sujet reviendrait à les annuler, à priver la société de leurs bienfaits, et à laisser le champ libre aux semeurs de troubles et aux personnes malveillantes.</p>
