<p>Les juristes ont traité des règles du voisinage et de celles des voies publiques en raison de la très grande importance de ce sujet :</p>
<p>⁕ <strong>En effet, des problèmes peuvent survenir entre voisins qu'il est obligatoire de résoudre et de trancher afin qu'ils ne mènent pas à la dispute et à l'animosité. Leur résolution se fait par plusieurs moyens :</strong></p>
<p><strong>Parmi ceux-ci :</strong> L'application d'une conciliation (Sulh) entre eux d'une manière qui réalise la justice et l'intérêt commun.</p>
<p><strong>En fait également partie :</strong> Le cas où un voisin a besoin de faire passer de l'eau à travers le terrain de son voisin ou sur son toit, et qu'ils se mettent d'accord sur cela moyennant une contrepartie financière. Cette conciliation est alors permise en raison du besoin qui appelle à cela. Ensuite, si cette contrepartie est accordée en échange de la simple jouissance (du passage de l'eau) tout en maintenant la propriété du propriétaire initial sur le terrain ou le toit, ce contrat est alors considéré comme une location (<em>Ijârah</em>). En revanche, si cela implique le transfert de la propriété (de la portion de terrain), il est alors considéré comme une vente (<em>Bay'</em>).</p>
<p><strong>Et si le voisin a besoin d'un droit de passage</strong> à travers la propriété de son voisin, et que celui-ci le lui accorde par le biais d'une vente ou d'une conciliation (<em>Sulh</em>), cela est permis en raison du besoin qui l'exige.</p>
<p>Il ne convient pas au propriétaire d'exploiter le besoin de son voisin en l'accablant financièrement par une contrepartie excessive, ou de refuser l'utilisation de ce passage, mettant ainsi son voisin dans la gêne et lui barrant l'accès à son intérêt.</p>
<p><strong>Et si la branche de son arbre s'étend</strong> dans l'espace aérien de son voisin ou sur le sol de sa propriété, il est obligatoire pour le propriétaire de la branche de la retirer : soit en la coupant, soit en la détournant vers une autre direction afin de libérer la propriété d'autrui.</p>
<p>Si le propriétaire de la branche refuse de faire quoi que ce soit, il appartient alors au propriétaire de l'espace aérien (ou du sol) de faire cesser le préjudice subi par l'un de ces procédés. En effet, cette branche est comparable à un agresseur (<em>Sâ'il</em>), on la repousse donc par le moyen le plus simple et le moins dommageable possible.</p>
<p>Cependant, s'ils se concilient pour laisser la branche en l'état, cela est permis ; que ce soit en échange d'une compensation financière — selon l'avis authentique (<em>Al-Sahîh</em>) — ou à la condition que les fruits de cette branche soient partagés entre eux.</p>
<p><strong>Le statut de la racine</strong>, lorsqu'elle s'introduit dans le terrain du voisin, est identique au statut de la branche, conformément à ce qui a été expliqué précédemment.</p>
<p><strong>Il n'est pas permis à l'individu de créer</strong> dans sa propriété ce qui nuit à son voisin, comme un bain public (Hammam), une boulangerie, une cuisine, un café dont la nuisance se propage, une usine dont les mouvements et les bruits perturbent le voisin, ou encore le fait d'ouvrir des fenêtres qui donnent (directement) sur la maison de son voisin.</p>
<p><strong>S'il y a un mur mitoyen (partagé)</strong> entre lui et son voisin, il lui est interdit d'y faire des modifications, comme y percer une ouverture ou y planter un piquet, sauf avec sa permission.</p>
<p>De même, il ne lui est pas permis de poser des poutres en bois sur le mur mitoyen, ou sur le mur appartenant exclusivement au voisin, <strong>sauf en cas de nécessité absolue</strong> : c'est-à-dire s'il lui est impossible de construire son toit autrement, et que le mur est capable de supporter la charge de ce bois. Dans ce cas précis, on lui permet d'y poser ses poutres, en raison du Hadith d'Abû Hurayrah (qu'Allah l'agrée) qui le rapporte textuellement du Prophète (<span dir="rtl">صَلَّى اللَّهُ عَلَيْهِ وَسَلَّم</span>َ) :</p>
<p><strong>« Qu'un voisin n'interdise pas à son voisin de poser sa poutre de bois sur son mur. »</strong> Abû Hurayrah disait ensuite : <em>« Pourquoi donc vous vois-je vous en détourner ? Par Allah, je la jetterai certes entre vos épaules (pour vous forcer à l'entendre et l'appliquer) ! »</em> [Rapporté par Al-Bukhârî et Muslim]<a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a>.</p>
<p>Ce Hadith prouve donc qu'il n'est pas permis à un voisin d'interdire à son voisin de poser des poutres en bois sur son mur, et le gouverneur (ou le juge) l'y contraint s'il refuse, car c'est un droit établi en faveur de son voisin par le statut du voisinage.</p>
<p><strong>Ceci constitue une partie des règles relatives au voisinage.</strong></p>
<p>⁕ <strong>Quant à ce qui concerne les voies publiques (les routes) :</strong></p>
<p><strong>Il n'est pas permis d'entraver ou de gêner</strong> les musulmans sur leurs voies publiques. Au contraire, il est obligatoire de libérer le passage et d'en retirer tout ce qui nuit (<em>Imâtat al-adhâ</em>), car cela fait partie de la foi, comme l'a enseigné le Prophète (<span dir="rtl">صَلَّى اللَّهُ عَلَيْهِ وَسَلَّم</span>َ).</p>
<p><strong>Il n'est pas permis de construire</strong> dans sa propre propriété ce qui viendrait encombrer ou rétrécir la voie publique, comme le fait de bâtir au-dessus de la rue un auvent (ou une avancée de toit) qui empêcherait le passage des montures et des cargaisons, ou de construire un banc en pierre (<em>Dakkah</em>) pour s'y asseoir.</p>
<p><strong>De même, il ne lui est pas permis de s'approprier</strong> un espace de stationnement pour sa bête ou sa voiture sur le passage des piétons (et des passants), car cela rétrécit la voie publique ou provoque des accidents.</p>
<p>Et Cheikh al-Islam Ibn Taymiyyah (qu'Allah lui fasse miséricorde) a dit :</p>
<p>« <em>Il n'est permis à personne de faire déborder un élément de construction sur la voie publique des musulmans. Au point qu'il est même interdit de crépir (ou plâtrer) le mur [extérieur], à moins que le propriétaire du mur n'en recule l'épaisseur d'autant à l'intérieur de sa propre limite...</em> »<a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a> Fin de citation.</p>
<p><strong>De même, il est interdit d'effectuer sur la voie publique</strong> des plantations, des constructions, des excavations (creuser), d'y entreposer du bois, d'y procéder à des sacrifices (égorgements), d'y jeter des détritus, des cendres, ou tout autre acte de nature à nuire aux passants.</p>
<p>Il est du devoir des responsables de l'aménagement urbain, parmi les agents municipaux, d'empêcher ces agissements et de sanctionner les contrevenants par des mesures dissuasives. Malheureusement, le relâchement s'est amplifié à l'égard de cette question cruciale. Ainsi, de nombreuses personnes s'approprient désormais les voies publiques pour leurs intérêts personnels : ils y stationnent leurs véhicules, y déposent des pierres, du fer et du ciment pour leurs chantiers, y creusent des fosses, et bien d'autres choses encore.</p>
<p>D'autres personnes rejettent des nuisances dans les marchés, telles que des déchets, des impuretés (Najâsât) et des ordures, sans aucun souci du tort causé aux musulmans. Tout cela fait partie de ce qu'Allah et Son Messager ont interdit. Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿وَالَّذِينَ يُؤْذُونَ الْمُؤْمِنِينَ وَالْمُؤْمِنَاتِ بِغَيْرِ مَا اكْتَسَبُوا فَقَدِ احْتَمَلُوا بُهْتَاناً وَإِثْماً مُبِيناً ٥٨﴾ [الأحزاب]</span></p>
<p><strong>﴾ Et ceux qui offensent les croyants et les croyantes sans qu'ils l'aient mérité, se chargent d'une calomnie et d'un péché évident.﴿</strong> [Sourate Al-Ahzâb, verset 58].</p>
<p>Et le Prophète (<span dir="rtl">صَلَّى اللَّهُ عَلَيْهِ وَسَلَّم</span>َ) a dit :</p>
<p class="ar"><span dir="rtl">«الْمُسْلِمُ مَنْ سَلِمَ الْمُسْلِمُونَ مِنْ لِسَانِهِ وَيَدِهِ»</span></p>
<p><em><strong>« Le musulman est celui dont les musulmans sont à l'abri de sa langue et de sa main. »</strong></em><a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a></p>
<p>Et il (<span dir="rtl">صَلَّى اللَّهُ عَلَيْهِ وَسَلَّم</span>َ) a dit également :</p>
<p class="ar"><span dir="rtl">«الْإِيمَانُ بِضْعٌ وَسَبْعُونَ شُعْبَةً: أَعْلَاهَا قَوْلُ: لَا إِلَٰهَ إِلَّا اللَّهُ، وَأَدْنَاهَا إِمَاطَةُ الْأَذَىٰ عَنِ الطَّرِيقِ، وَالْحَيَاءُ شُعْبَةٌ مِنَ الْإِيمَانِ»</span></p>
<p><em><strong>« La foi est composée de soixante-dix et quelques branches (ou quatre-vingt et quelques branches) : la plus haute est la parole "Il n'y a de divinité digne d'adoration qu'Allah" (Lâ ilâha illa Allâh), et la plus basse est le fait de retirer ce qui nuit de la voie publique. Et la pudeur est une branche de la foi. »</strong></em><a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a></p>
<p>...ainsi que d'autres hadiths qui exhortent au respect des droits des musulmans et à l'interdiction de leur nuire. Or, l'une des plus grandes nuisances causées aux musulmans consiste à entraver leur circulation sur les voies publiques et à y dresser des obstacles.</p>
