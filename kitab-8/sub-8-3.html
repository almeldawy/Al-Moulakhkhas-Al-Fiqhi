<p>⁕ Définition de la préemption (<em>As-Shouf'ah</em>) au sens linguistique : <em>As-Shouf'ah</em> — avec une <em>soukoon</em> sur la lettre <em>Fâ'</em> — est dérivé du mot <em>As-Shaf'</em> (le pair), qui s'oppose à l'impair. En effet, par le biais de la préemption, le bénéficiaire (le préempteur) joint le bien vendu à sa propre propriété, qui était jusqu'alors isolée (seule).</p>
<p>⁕ Le droit de préemption est établi par la Sounnah authentique. Allah l'a légiféré afin de bloquer les voies menant aux préjudices liés à la copropriété (l'indivision).</p>
<p>L'éminent Imam Ibn al-Qayyim — qu'Allah lui fasse miséricorde — a dit <a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a>: « <em>C'est une marque de la beauté de la Législation, de sa justice et de sa prise en compte des intérêts des serviteurs que d'avoir institué la préemption. En effet, la sagesse du Législateur a exigé de dissiper le tort causé aux assujettis autant que possible. Et comme la copropriété est généralement la source du préjudice, ce préjudice a été écarté tantôt par le partage (de la propriété), tantôt par la préemption. Ainsi, lorsque (le copropriétaire) souhaite vendre sa part pour en obtenir la contrevaleur, son associé y a plus de droit qu'un étranger. De cette façon, le préjudice lié à la copropriété est écarté de lui, sans que le vendeur n'en pâtisse, puisqu'il perçoit son dû sur le prix de vente. Cela relève ainsi de la plus grande justice et des meilleures règles, en parfaite adéquation avec la saine raison, la nature innée (al-Fitrah) et l'intérêt des serviteurs.</em> »</p>
<p>C'est pourquoi on comprend que le recours aux ruses juridiques pour annuler le droit de préemption est en totale contradiction et en opposition absolue avec l'objectif visé par le Législateur.</p>
<p>⁕ <em>La Shouf'ah</em> (le droit de préemption) était connue chez les Arabes durant la période de la <em>Jâhilîyah</em> (l'ère pré-islamique). Lorsqu'un homme voulait vendre sa maison ou son verger, son voisin, son associé ou son compagnon venait à lui concernant ce qu'il vendait. Le vendeur acceptait alors son intercession et faisait de lui la personne la plus prioritaire pour l'acquérir. C'est pourquoi cela fut appelé <em>Shouf'ah</em>, et celui qui la demande fut nommé <em>Shâfi'</em> (le préempteur).</p>
<p>⁕ Et <em>la Shouf'ah</em> (le droit de préemption) selon la terminologie des juristes (<em>Fouqahâ</em>) est : le droit légitime de l'associé de retirer [racheter obligatoirement] la part de son coassocié à qui cette part a été transférée en contrepartie d'une compensation financière. Ainsi, le bénéficiaire de la préemption (<em>al-Shafî'</em>) prend la part de son associé vendeur au prix sur lequel le contrat s'est définitivement conclu en réalité.</p>
<p>⁕ Il est donc obligatoire pour l'acheteur de remettre la part [du bien] faisant l'objet du droit de préemption (<em>al-shiqs al-mashfû' fîh</em>) au bénéficiaire de la préemption (<em>al-shâfi'</em>), au prix sur lequel ils se sont mis d'accord en secret (ou en privé). Cela est fondé sur ce qu'ont rapporté [les imams] Ahmad et al-Bukhârî d'après Jâbir (qu'Allah l'agrée) :</p>
<p class="ar"><span dir="rtl">«أَنَّ النَّبِيَّ ﷺ قَضَى بِالشُّفْعَةِ فِي كُلِّ مَا لَمْ يُقْسَمْ، فَإِذَا وَقَعَتِ الْحُدُودُ وَصُرِّفَتِ الطُّرُقُ؛ فَلَا شُفْعَةَ»</span></p>
<p>"<em><strong>Le Prophète <span dir="rtl">ﷺ</span> a décrété le droit de préemption (al-shuf'ah) sur tout bien qui n'a pas encore été partagé. Mais dès lors que les limites sont fixées et que les voies d'accès sont tracées, il n'y a plus de droit de préemption.</strong></em>"<a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a></p>
<p>Ce hadith constitue une preuve établissant le droit de préemption en faveur de l'associé (ou copropriétaire). Il prouve également que ce droit ne s'applique impérativement que sur les terres et les biens immobiliers, à l'exclusion de tout autre bien, marchandise, meuble, animal ou autre élément similaire.</p>
<p>Le Prophète <span dir="rtl">ﷺ</span> a également dit :</p>
<p class="ar"><span dir="rtl">«لَا يَحِلُّ لَهُ أَنْ يَبِيعَ حَتَّى يُؤْذِنَ شَرِيكَهُ»</span></p>
<p>"<em><strong>Il ne lui est pas licite de vendre avant d'en avoir informé son associé.</strong></em>"<a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a></p>
<p>Ce hadith démontre ainsi qu'il ne lui est pas permis de vendre avant d'avoir proposé l'offre à son associé.</p>
<p>Ibn al-Qayyim a dit <a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a>: "<em>Il a été interdit à l'associé de vendre avant d'en informer son associé. S'il vend sans l'en avoir informé, cet associé est alors le plus en droit de l'acquérir. En revanche, s'il lui donne l'autorisation de vendre et dit : 'Je n'ai aucun intérêt (ou intention d'achat) à cet égard', il ne pourra plus réclamer [son droit de préemption] après la vente. Ceci est l'exigence même du jugement de la législation islamique (al-Shar'), et rien ne vient s'y opposer de quelque manière que ce soit. C'est la vérité absolue sur laquelle il n'y a aucun doute.</em>" Fin de citation.</p>
<p>Et ce qu'a mentionné Ibn al-Qayyim — à savoir que le droit de préemption s'annule si son titulaire y renonce avant la vente — est l'un des deux avis existants sur cette question.</p>
<p>Le second avis — qui est l'avis de la majorité des savants (<em>al-Jumhûr</em>) — stipule que le droit de préemption ne s'annule pas par cela, et que la simple autorisation donnée [à l'associé] pour vendre ne rend pas caduc son droit de préemption. Et Allah est Le plus Savant (<em>Wa Allâhu a'lam</em>).</p>
<p>⁕ Le droit de préemption (<em>al-shuf'ah</em>) est un droit légiféré (un droit de la charia) qu'il est obligatoire de respecter. Il est strictement interdit d'avoir recours à des ruses (<em>al-tahayyul</em>) pour l'annuler. En effet, le droit de préemption a été institué pour écarter tout préjudice envers l'associé (ou le copropriétaire). Ainsi, si une ruse est employée pour l'annuler, le préjudice l'atteindra (l'associé) et cela constituera une transgression manifeste contre son droit légitime.</p>
<p>⁕ L'imam Ahmad (qu'Allah lui fasse miséricorde) a dit : "Il n'est permis d'utiliser aucune forme de ruse pour l'annuler (le droit de préemption), ni pour annuler le droit d'un musulman."</p>
<p>Et le Prophète <span dir="rtl">ﷺ</span> a certes dit :</p>
<p class="ar"><span dir="rtl">«لَا تَرْتَكِبُوا مَا ارْتَكَبَتِ الْيَهُودُ فَتَسْتَحِلُّوا مَحَارِمَ اللَّهِ بِأَدْنَى الْحِيَلِ»</span></p>
<p>"<em><strong>Ne commettez pas ce qu'ont commis les Juifs, en rendant licites les interdits d'Allah par les plus infimes ruses.</strong></em>" <a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a></p>
<p>⁕ Parmi les ruses qui sont employées pour l'annulatif du droit de préemption, il y a le fait de faire apparaître (ou de simuler) qu'il a fait don de sa part à un tiers, alors qu'en réalité, il la lui a vendue. Une autre ruse pour l'annulatif du droit de préemption consiste à gonfler artificiellement le prix en apparence, de sorte que l'associé ne soit pas en mesure de le payer.</p>
<p>Cheikh al-Islâm Ibn Taymiyyah a dit <a href="#fn6" class="footnote-ref" id="fnref6" role="doc-noteref"><sup>6</sup></a>: "<em>Toutes les dispositions (ou transactions) entreprises dans le but de ruser pour l'annulatif du droit de préemption sont nulles (bâtil). La réalité profonde des contrats ne saurait être modifiée par le simple changement de formulation (ou des termes employés).</em>" Fin de citation.</p>
<p>⁕ L'objet du droit de préemption (<em>al-shuf'ah</em>) est la terre qui n'a pas encore fait l'objet d'un partage. Sont inclus de fait dans ce droit les plantations et les constructions qui s'y trouvent. Si le partage de la terre a eu lieu, mais qu'il subsiste des services communs (ou dépendances partagées) entre les voisins — tels qu'un chemin, l'accès à l'eau ou autre élément similaire —, le droit de préemption demeure alors valable selon le plus authentique des deux avis des savants.</p>
<p>Cela découle du sens implicite (<em>mafhûm</em>) de sa parole <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«فَإِذَا وَقَعَتِ الْحُدُودُ وَصُرِّفَتِ الطُّرُقُ؛ فَلَا شُفْعَةَ»</span></p>
<p>"<em><strong>Mais dès lors que les limites sont fixées et que les voies d'accès sont tracées, il n'y a plus de droit de préemption.</strong></em>" <a href="#fn7" class="footnote-ref" id="fnref7" role="doc-noteref"><sup>7</sup></a></p>
<p>en effet, son sens implicite indique que si les limites ont été fixées mais que les voies d'accès n'ont pas encore été tracées (ou restent communes), le droit de préemption demeure alors maintenu.</p>
<p>Ibn al-Qayyim a dit <a href="#fn8" class="footnote-ref" id="fnref8" role="doc-noteref"><sup>8</sup></a>: "<em>Et c'est le plus authentique des avis concernant le droit de préemption de voisinage (shuf'at al-jiwâr). C'est également la doctrine (madhhab) des savants de Bassora, l'une des deux voies de l'école de l'imam Ahmad, ainsi que l'avis choisi par le Cheikh [Ibn Taymiyyah].</em>" Fin de citation.</p>
<p>Et le Cheikh Taqî ad-Dîn [Ibn Taymiyyah] a dit <a href="#fn9" class="footnote-ref" id="fnref9" role="doc-noteref"><sup>9</sup></a>: "<em>Le droit de préemption de voisinage (shuf'at al-jiwâr) est établi lorsqu'il y a une copropriété (ou un partage) sur un droit parmi les droits de propriété, tel qu'un chemin, l'accès à l'eau ou autre élément similaire. C'est ce qu'a textuellement stipulé [l'imam] Ahmad, et c'est l'avis choisi par Ibn 'Aqîl, Abû Muhammad et d'autres encore.</em></p>
<p><em>Al-Hârithî a dit : "C'est la position qu'il convient impérativement d'adopter, car elle permet de concilier l'ensemble des hadiths. En effet, le simple voisinage ne saurait être un motif exigeant le droit de préemption, à moins qu'il n'y ait une mise en commun du chemin ou d'un élément similaire. Car l'institution légale du droit de préemption a pour but d'écarter le préjudice ; or, le préjudice survient le plus souvent en raison de la promiscuité (ou de l'indivision) dans le bien possédé lui-même, ou dans son chemin d'accès et ses dépendances similaires.</em>" Fin de citation.</p>
<p>⁕ Le droit de préemption (<em>al-shuf'ah</em>) n'est établi que si la réclamation en est faite immédiatement dès la prise de connaissance de la vente. S'il (le bénéficiaire) ne le réclame pas au moment où il apprend la vente, ce droit devient caduc (s'annule). En revanche, s'il n'était pas au courant de la vente, son droit de préemption reste maintenu, même si plusieurs années se sont écoulées. Ibn Hubayrah a dit : "<em>Ils (les savants) se sont accordés sur le fait que s'il était absent, il lui est permis de réclamer le droit de préemption dès son retour.</em>"</p>
<p>Le droit de préemption est établi en faveur des associés au prorata de leur part de propriété, car c'est un droit dont on bénéficie en raison de la propriété elle-même ; il est donc proportionnel aux parts possédées. Si l'un des associés renonce à son droit, l'autre associé doit soit acquérir la totalité [du bien mis en vente], soit renoncer à la totalité. En effet, n'en acquérir qu'une partie causerait un préjudice à l'acheteur, et un préjudice ne peut être éliminé par un autre préjudice.</p>
