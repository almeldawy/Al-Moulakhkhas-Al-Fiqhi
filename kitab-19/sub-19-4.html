<p>⁕ La chasse (<em><span dir="rtl">الصَّيْد</span>ُ</em>) est le nom d'action (<em>Masdar</em>) du verbe ( <span dir="rtl">صَادَ يَصِيدُ صَيْدا</span>ً ) (chasser). Il désigne le fait de capturer un animal licite (à la consommation), sauvage par nature, et que l'on n'est pas capable de maîtriser . Ce terme est également employé pour désigner le gibier lui-même ; on dit ainsi d'un animal : « c'est un gibier ( <span dir="rtl">صَيْد</span>ٌ ) », en nommant l'objet de l'action par le nom du nom d'action (<em>Masdar</em>).</p>
<p>⁕ Le statut juridique de la chasse est le suivant : si elle est pratiquée pour subvenir aux besoins de l'homme, elle est alors autorisée sans aucune détestation. En revanche, si elle est pratiquée par simple divertissement et par jeu, et non par besoin, elle est alors détestable (<em>Makrûh</em>). Et si elle engendre une injustice envers les gens en portant atteinte à leurs cultures ou à leurs biens, elle est alors interdite (<em>Harâm</em>).</p>
<p>⁕ La preuve de son autorisation, en dehors de ce dernier cas, réside dans :</p>
<p>- La parole d'Allah le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿وَإِذَا حَلَلْتُمْ فَاصْطَادُوا﴾ [المائدة: ٢]</span></p>
<p><strong>﴾ Et lorsque vous sortez de l'état d'ihram, alors chassez ﴿</strong> [Al-Mâ'idah : 2]</p>
<p>et Sa parole :</p>
<p class="ar"><span dir="rtl">﴿وَمَا عَلَّمْتُمْ مِنَ الْجَوَارِحِ مُكَلِّبِينَ تُعَلِّمُونَهُنَّ مِمَّا عَلَّمَكُمُ اللَّهُ فَكُلُوا مِمَّا أَمْسَكْنَ عَلَيْكُمْ وَاذْكُرُوا اسْمَ اللَّهِ عَلَيْهِ﴾ [المائدة: ٤].</span></p>
<p><strong>﴾ ...et ce que capturent les carnassiers que vous avez dressés, leur enseignant ce qu'Allah vous a appris. Mangez donc de ce qu'ils capturent pour vous et prononcez-y le nom d'Allah ﴿</strong> [Al-Mâ'idah : 4].</p>
<p>- Et le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="rtl">«إِذَا أَرْسَلْتَ كَلْبَكَ الْمُعَلَّمَ، وَذَكَرْتَ اسْمَ اللَّهِ عَلَيْهِ؛ فَكُلْ»</span></p>
<p><em><strong>« Lorsque tu lâches ton chien dressé en ayant prononcé le nom d'Allah, alors mange »</strong></em>, Rapporté par Al-Bukhârî et Muslim.<a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a></p>
<p>⁕ Une fois le gibier touché et capturé, deux situations peuvent se présenter :</p>
<p><strong>Le premier cas :</strong> Qu'il soit rattrapé alors qu'il est encore vivant, d'une vie stable. Dans ce cas, son immolation rituelle légiférée — dont l'explication a précédé — est obligatoire, et le simple fait de l'avoir chassé ne suffit pas à le rendre licite.</p>
<p><strong>Le deuxième cas :</strong> Qu'il soit rattrapé déjà mort suite à l'acte de chasse, ou vivant mais d'une vie instable (agonisant). <strong>Dans ce cas précis, il est licite à condition que soient réunies les conditions requises :</strong></p>
<p><strong>La première condition :</strong> Que le chasseur fasse partie des personnes aptes à pratiquer l'immolation rituelle (<em>Ahl adh-Dhakât</em>) ; c'est-à-dire : de ceux dont la bête égorgée est licite à la consommation. En effet, le chasseur occupe le même statut que celui qui égorge la bête. L'aptitude légale est donc requise en sa personne : il doit être doué de raison, musulman ou faisant partie des gens du Livre (juif ou chrétien). Ainsi, le gibier chassé par un fou ou une personne ivre n'est pas licite, en raison de l'absence de facultés mentales. De même, le gibier chassé par un majoussi (zoroastrien), un idolâtre ou tout autre mécréant similaire n'est pas licite, tout comme les bêtes qu'ils égorgent ne sont pas licites.</p>
<p><strong>La deuxième condition :</strong> L'outil (l'instrument de chasse), qui se divise en deux catégories :</p>
<p><strong>La première :</strong> Un objet tranchant ou pointu. Il est exigé pour celui-ci les mêmes conditions que pour l'instrument d'égorgement rituel, à savoir : qu'il fasse couler le sang abondamment, qu'il ne soit pas composé d'une dent ou d'un ongle, et qu'il blesse le gibier par son tranchant ou sa pointe, et non par l'impact de son poids.</p>
<p>Par conséquent, si l'instrument avec lequel le gibier a été tué n'est ni tranchant ni pointu — à l'instar d'un caillou, d'un bâton, d'un piège, d'un filet ou d'un morceau de fer épais —, le gibier mort par ce moyen n'est pas licite à la consommation.</p>
<p>En effet, [pour être licite, l'outil doit posséder] une force de propulsion qui perfore [la chair] et fait couler le sang, à l'instar de l'objet tranchant ou plus intensément encore.</p>
<p><strong>La seconde :</strong> L'animal prédateur (<em>Al-Jârihah</em>) parmi les chiens et les oiseaux utilisés pour la chasse. Le gibier qu'il tue est donc autorisé s'il est dressé, qu'il s'agisse d'un animal qui chasse avec ses crocs — comme le chien — ou avec ses serres — comme l'oiseau (rapace). Cela est dû à la parole d'Allah le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿وَمَا عَلَّمْتُمْ مِنَ الْجَوَارِحِ مُكَلِّبِينَ تُعَلِّمُونَهُنَّ مِمَّا عَلَّمَكُمُ اللَّهُ فَكُلُوا مِمَّا أَمْسَكْنَ عَلَيْكُمْ وَاذْكُرُوا اسْمَ اللَّهِ عَلَيْهِ﴾ [المائدة: ٤]</span></p>
<p><strong>﴾ ...et ce que capturent les carnassiers que vous avez dressés, leur enseignant ce qu'Allah vous a appris. Mangez donc de ce qu'ils capturent pour vous et prononcez-y le nom d'Allah ﴿</strong> [Al-Mâ'idah : 4].</p>
<p>Et le sens de Sa parole : <strong>﴾ leur enseignant ce qu'Allah vous a appris ﴿</strong> signifie : vous leur apprenez les règles de capture du gibier selon la science qu'Allah vous a enseignée. Et le dressage de l'animal prédateur consiste en ceci : lorsqu'on le lâche, il s'élance ; lorsqu'on le rappelle, il revient ; et lorsqu'il attrape le gibier, il le garde pour son maître jusqu'à ce que celui-ci vienne à lui, et il ne le garde pas pour lui-même (en le mangeant).</p>
<p><strong>La troisième :</strong> C'est qu'il lâche (ou propulse) l'outil avec l'intention de chasser. Cela se fonde sur la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«إِذَا أَرْسَلْتَ كَلْبَكَ الْمُعَلَّمَ، وَذَكَرْتَ اسْمَ اللَّهِ عَلَيْهِ؛ فَكُلْ»</span></p>
<p><em><strong>« Lorsque tu lâches ton chien dressé en ayant prononcé le nom d'Allah, alors mange »</strong></em>, Rapporté par Al-Bukhârî et Muslim.<a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a></p>
<p>Ce hadith démontre que le fait de lâcher l'animal prédateur équivaut à l'égorgement rituel ; l'intention (<em>Al-Qasd</em>) y est donc requise. Ainsi, si l'outil échappe des mains du chasseur (par accident) et tue un gibier, celui-ci n'est pas licite en raison de l'absence d'intention de sa part. Il en va de même si le chien s'élance de lui-même et tue un gibier : il n'est pas licite, car son maître ne l'a pas lâché volontairement et n'en avait pas l'intention. En revanche, quiconque vise un gibier particulier mais en touche un autre — comme le fait de tuer tout un groupe de gibiers (d'un seul coup) —, l'ensemble est licite, en raison de la présence initiale de l'intention de chasser.</p>
<p><strong>La quatrième :</strong> La prononciation du nom d'Allah (<em>At-Tasmîyah</em>) au moment de décocher la flèche ou de lâcher l'animal prédateur, en disant : « Bismillah » (Au nom d'Allah). Cela s'appuie sur la parole d'Allah le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿وَلَا تَأْكُلُوا مِمَّا لَمْ يُذْكَرِ اسْمُ اللَّهِ عَلَيْهِ﴾ [الأنعام: ١٢١]</span></p>
<p><strong>﴾ Et ne mangez pas de ce sur quoi le nom d'Allah n'a pas été prononcé ﴿</strong> [Al-An'âm : 121]</p>
<p>et Sa parole :</p>
<p class="ar"><span dir="rtl">﴿فَكُلُوا مِمَّا أَمْسَكْنَ عَلَيْكُمْ وَاذْكُرُوا اسْمَ اللَّهِ عَلَيْهِ﴾ [المائدة: ٤]</span></p>
<p><strong>﴾ Mangez donc de ce qu'ils capturent pour vous et prononcez-y le nom d'Allah ﴿</strong> [Al-Mâ'idah : 4].</p>
<p>De plus, le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="rtl">«إِذَا أَرْسَلْتَ كَلْبَكَ الْمُعَلَّمَ، وَذَكَرْتَ اسْمَ اللَّهِ عَلَيْهِ؛ فَكُلْ»</span></p>
<p><em><strong>« Lorsque tu lâches ton chien dressé en ayant prononcé le nom d'Allah, alors mange »</strong></em>, Rapporté par Al-Bukhârî et Muslim<a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a>.</p>
<p>Si le chasseur omet de prononcer le nom d'Allah, le gibier n'est pas licite, conformément au sens implicite engendré par le verset et les hadiths.</p>
<p>Et il est recommandé de rajouter après le nom d'Allah : « <em>Allahu Akbar</em> » (Allah est le plus Grand), tout comme cela se dit lors de l'immolation rituelle. Car lorsque le Prophète <span dir="rtl">ﷺ</span> égorgeait une bête, il disait : « <em>Bismillah, wallahu Akbar</em> » (Au nom d'Allah, et Allah est le plus Grand) <a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a>.</p>
<p>⁕ <strong>Deux avertissements:</strong></p>
<p><strong>Le premier avertissement :</strong> Il existe des cas où la chasse est interdite :</p>
<p>- Il est interdit à la personne en état de sacralisation (<em>Al-Muhrim</em>) de tuer le gibier terrestre, de le chasser ou d'apporter une aide à sa capture, que ce soit en l'indiquant, en le montrant du doigt ou par tout autre moyen. Cela s'appuie sur la parole d'Allah le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿يَأَيُّهَا الَّذِينَ آمَنُوا لَا تَقْتُلُوا الصَّيْدَ وَأَنْتُمْ حُرُمٌ﴾ [المائدة: ٩٥]</span></p>
<p><strong>﴾ Ô les croyants ! Ne tuez pas le gibier alors que vous êtes en état d'ihram ﴿</strong> [Al-Mâ'idah : 95].</p>
<p>- De même, il lui est interdit de manger de ce qu'il a chassé lui-même, de ce qu'il a contribué à chasser, ou de ce qui a été chassé spécifiquement pour lui. Cela s'appuie sur la parole d'Allah le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿وَحُرِّمَ عَلَيْكُمْ صَيْدُ الْبَرِّ مَا دُمْتُمْ حُرُماً﴾ [المائدة: ٩٦]</span></p>
<p><strong>﴾ Et la chasse sur terre vous est interdite tant que vous êtes en état d'ihram ﴿</strong> [Al-Mâ'idah : 96].</p>
<p>- Il existe également un lieu où la chasse est interdite : ainsi, il est interdit de tuer le gibier du territoire sacré (<em>Al-Haram</em>), que l'on soit en état de sacralisation ou non, et ce, par consensus (<em>Ijmâ'</em>). Cela repose sur le hadith d'Ibn 'Abbâs (qu'Allah l'agrée, lui et son père) qui a dit : Le Messager d'Allah <span dir="rtl">ﷺ</span> a dit le jour de la conquête de la Mecque :</p>
<p class="ar"><span dir="rtl">«إِنَّ هَذَا الْبَلَدَ حَرَّمَهُ اللَّهُ يَوْمَ خَلَقَ السَّمَاوَاتِ وَالْأَرْضَ، فَهُوَ حَرَامٌ بِحُرْمَةِ اللَّهِ إِلَى يَوْمِ الْقِيَامَةِ؛ لَا يُعْضَدُ شَوْكُهُ، وَلَا يُخْتَلَى خَلَاهُ، وَلَا يُنَفَّرُ صَيْدُهُ...»</span></p>
<p><em><strong>« Certes, cette ville, Allah l’a rendue sacrée le jour où Il a créé les cieux et la terre. Elle reste donc sacrée par la sacralisation d’Allah jusqu’au Jour de la Résurrection. On ne doit pas couper ses épines, on ne doit pas faucher son herbe fraîche, et on ne doit pas faire fuir son gibier... »</strong></em>, jusqu'à la fin du hadith <a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a>.</p>
<p><strong>Le deuxième avertissement :</strong> Il est interdit de posséder un chien pour une autre raison que celles autorisées par le Messager <span dir="rtl">ﷺ</span>, à savoir l'une de ces trois choses : soit pour la chasse, soit pour la garde du bétail, soit pour la garde des cultures.</p>
<p>Le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="rtl">«مَنِ اتَّخَذَ كَلْبًا؛ إِلَّا كَلْبَ مَاشِيَةٍ أَوْ صَيْدٍ أَوْ زَرْعٍ؛ انْتَقَصَ مِنْ أَجْرِهِ كُلَّ يَوْمٍ قِيرَاطٌ»</span></p>
<p><em><strong>« Quiconque acquiert un chien, sauf un chien de troupeau, de chasse ou de culture, verra sa récompense diminuer chaque jour d'un qîrât »</strong></em>, Rapporté par Al-Bukhârî et Muslim <a href="#fn6" class="footnote-ref" id="fnref6" role="doc-noteref"><sup>6</sup></a>.</p>
<p>Pourtant, certaines personnes ne prêtent pas attention à cette menace et acquièrent un chien en dehors de ces trois motifs autorisés par le Messager <span dir="rtl">ﷺ</span>, par simple ostentation (fierté) ou pour imiter les mécréants. Ils ne se soucient guère de la diminution de récompense qui en découle. En revanche, si une telle perte touchait un bien de leur vie d'ici-bas, ils ne le supporteraient pas. Il n'y a de force ni de puissance qu'en Allah.</p>
<p>Et le Prophète <span dir="rtl">ﷺ</span> a certes informé que les Anges n'entrent pas dans une maison où se trouve un chien ou une image (représentation figurée). Que le musulman craigne donc son Seigneur, et qu'il ne se lèse pas lui-même en l'exposant au péché et en la privant de la récompense. Et c'est auprès d'Allah que l'on cherche l'aide.</p>
