<p>⁕ Étant donné que la condition de licéité de l'animal terrestre est qu'il soit soumis à l'égorgement rituel légal, et que tout animal n'ayant pas subi cet égorgement rituel est une bête morte (Maytah) illicite, l'étude de l'égorgement rituel et la connaissance de ses obligations revêtent une importance capitale.</p>
<p>⁕ Les juristes (Fuqahâ) — qu'Allah leur fasse miséricorde — l'ont définie comme étant : l'égorgement (Dhabh) ou la saignée (Nahr) de l'animal terrestre dont la consommation est licite, en coupant sa trachée et son œsophage, ou en blessant mortellement celui qui s'échappe (par la chasse). Elle a été nommée ainsi en référence à son sens linguistique, car l'égorgement rituel (« <span dir="rtl">الذَّكَاة</span>ِ ») signifie linguistiquement le fait de parachever une chose. En effet, égorger l'animal signifie parachever l'extraction de son âme. Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">حُرِّمَتْ عَلَيْكُمُ الْمَيْتَةُ ...﴾ إِلَى قَوْلِهِ: ﴿إِلَّا مَا ذَكَّيْتُمْ﴾ [المائدة: ٣]</span></p>
<p><strong>﴾ Vous sont interdits la bête morte... ﴿</strong> jusqu'à Sa parole : <strong>﴾ ...sauf celle que vous égorgez pieusement ﴿</strong> [Al-Mâ'idah : 3] ; c'est-à-dire : vous l'avez rattrapée alors qu'elle était encore en vie, et vous avez parachevé la sortie de son âme. Ce terme a ensuite été employé pour désigner le sacrifice en soi, que ce soit après une blessure préalable ou dès le départ.</p>
<p>⁕ La règle juridique de l'égorgement rituel est qu'il est obligatoire. Aucun animal sur lequel on a le contrôle n'est licite sans cela, car ce qui n'a pas subi l'égorgement rituel est considéré comme une bête morte. Les gens de science se sont accordés à l'unanimité sur le fait que la bête morte est illicite, sauf pour celui qui est contraint par la nécessité.</p>
<p>Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿حُرِّمَتْ عَلَيْكُمُ الْمَيْتَةُ﴾ [المائدة: ٣]</span></p>
<p><strong>﴾ Vous sont interdits la bête morte ﴿</strong> [Al-Mâ'idah : 3].</p>
<p>Sont exclus de cette interdiction le poisson, le criquet, et tout ce qui ne vit que dans l'eau ; ceux-là sont licites sans égorgement rituel, car leur cadavre est licite. Cela s'appuie sur le hadith d'Ibn 'Umar (qu'Allah l'agrée) qui le rapporte du Prophète :</p>
<p class="ar"><span dir="rtl">«أُحِلَّتْ لَنَا مَيْتَتَانِ وَدَمَانِ؛ فَأَمَّا الْمَيْتَتَانِ: فَالْحُوتُ وَالْجَرَادُ، وَأَمَّا الدَّمَانِ: فَالْكَبِدُ وَالطِّحَالُ»</span></p>
<p><em><strong>« Deux bêtes mortes et deux sangs nous ont été rendus licites. Les deux bêtes mortes sont le poisson et le criquet, et les deux sangs sont le foie et la rate. »</strong></em> (Rapporté par Ahmad et d'autres) <a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a>.</p>
<p>De plus, le Prophète <span dir="rtl">ﷺ</span> a dit au sujet de la mer :</p>
<p class="ar"><span dir="rtl">«هُوَ الطَّهُورُ مَاؤُهُ الْحِلُّ مَيْتَتُهُ»</span></p>
<p><em><strong>« Son eau est purificatrice et ses bêtes mortes sont licites. »</strong></em> (Rapporté par At-Tirmidhî et d'autres) <a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a>.</p>
<p>⁕ Quatre conditions sont requises pour la validité de l'égorgement rituel :</p>
<p><strong>La première condition :</strong> La capacité de la personne qui effectue l'égorgement. Elle doit être douée de raison et professer une religion céleste, en étant soit musulmane, soit de Gens du Livre (juifs ou chrétiens). Ainsi, la bête immolée par un fou, une personne ivre ou un enfant n'ayant pas atteint l'âge de discernement (Tamyîz) n'est pas licite à la consommation, car l'intention d'accomplir l'égorgement rituel n'est pas valable de leur part en raison de leur absence de facultés mentales. De même, n'est pas licite ce qui est immolé par un mécréant idolâtre, un mage (mazdéen), un apostat ou un adorateur des tombes (Qoubôrî) faisant partie de ceux qui invoquent les morts, cherchent refuge auprès des mausolées et réclament le secours (Al-Madad) de leurs occupants ; car cela constitue du polythéisme majeur (Chirk Akbar).</p>
<p>Quant au mécréant scripturaire (Kitâbî), à savoir le juif ou le chrétien, sa bête immolée est licite, conformément à la parole d'Allah le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿وَطَعَامُ الَّذِينَ أُوتُوا الْكِتَابَ حِلٌّ لَكُمْ﴾ [المائدة: ٥]</span></p>
<p><strong>﴾ La nourriture de ceux auxquels le Livre a été donné est licite pour vous ﴿</strong> [Al-Mâ'idah : 5] ; c'est-à-dire : les bêtes immolées par les Gens du Livre parmi les juifs et les chrétiens vous sont licites, ô musulmans. Et cela relève du consensus (Ijmâ') des musulmans.</p>
<p>L'Imam Al-Bukhârî — qu'Allah lui fasse miséricorde — a rapporté d'après Ibn 'Abbâs (qu'Allah l'agrée) :</p>
<p class="ar"><span dir="rtl">«طَعَامُهُمْ ذَبَائِحُهُمْ».</span></p>
<p></p>
<p><em><strong>« Leur nourriture désigne leurs bêtes immolées. »</strong></em></p>
<p>Le sens implicite (Mafhûm) de ce noble verset indique que la bête immolée par un mécréant qui n'appartient pas aux Gens du Livre n'est pas licite, et cela fait également l'objet d'un consensus.</p>
<p>La sagesse résidant dans la permission de la bête immolée par le mécréant scripturaire, à l'exclusion des autres catégories de mécréants, est que les Gens du Livre croient en l'interdiction d'immoler pour un autre qu'Allah ainsi qu'en l'interdiction des bêtes mortes, conformément à ce que leurs prophètes leur ont apporté. Il en va autrement pour le reste des mécréants, qui immolent pour les idoles et considèrent les bêtes mortes comme licites.</p>
<p><strong>La deuxième condition :</strong> La disponibilité de l'instrument adéquat. L'égorgement rituel est ainsi permis avec tout instrument tranchant qui fait couler le sang par son tranchant, qu'il soit en fer, en pierre ou autre, à l'exception de la dent et de l'ongle. Il n'est pas licite d'égorger avec ces deux derniers en raison de la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«مَا أَنْهَرَ الدَّمَ؛ فَكُلْ، لَيْسَ السِّنَّ وَالظُّفْرَ»</span></p>
<p><em><strong>« Consommez ce dont le sang a été versé [par un outil tranchant], tant qu'il ne s'agit pas d'une dent ou d'un ongle. »</strong></em> (Rapporté par Al-Bukhârî et Muslim) <a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a>.</p>
<p>L'Imam Ibn al-Qayyim — qu'Allah lui fasse miséricorde — a dit <a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a> : <em>« C'est un avertissement indiquant qu'il ne faut pas procéder à l'égorgement rituel avec des os : soit en raison de l'impureté (Najâsah) de certains d'entre eux, soit pour éviter de les souiller au détriment des croyants parmi les djinns. La suite du hadith énonce :</em></p>
<p class="ar"><span dir="rtl">«وَسَأُحَدِّثُكُمْ عَنْ ذَلِكَ: أَمَّا السِّنُّ؛ فَعَظْمٌ»</span></p>
<p><em><strong>"Et je vais vous en expliquer la raison : quant à la dent, c'est un os"</strong> ; c'est-à-dire que la dent étant un os, il n'est pas licite d'égorger avec elle.</em></p>
<p><em>Et il a dit :</em></p>
<p class="ar"><span dir="rtl">«وَأَمَّا الظُّفُرُ؛ فَمُدَى الْحَبَشَةِ»</span></p>
<p><em><strong>"Quant à l'ongle, c'est le couteau des Abyssins"</strong></em> <a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a><em>, c'est-à-dire qu'il s'agit du couteau utilisé par les Éthiopiens, il n'est donc pas licite d'égorger avec lui. »</em></p>
<p><strong>La troisième condition :</strong> La section de la trachée (Hulqûm), qui est le conduit de la respiration, la section de l'œsophage (Marî'), qui est le conduit de la nourriture et de la boisson, ainsi que l'une des deux jugulaires (Wadajayn), qui sont les deux veines du cou.</p>
<p>Cheikh al-Islâm Ibn Taymiyyah a dit <a href="#fn6" class="footnote-ref" id="fnref6" role="doc-noteref"><sup>6</sup></a>: <em>« L'œsophage, la trachée et les deux jugulaires doivent être coupés. L'avis le plus fort est que la section de trois de ces quatre éléments rend la viande licite, que la trachée en fasse partie ou non ; car sectionner les deux jugulaires est plus radical que de couper la trachée, et cela permet de faire couler le sang de manière plus abondante. »</em></p>
<p>La Sunnah consiste à pratiquer la saignée (Nahr) pour les chameaux, en les piquant avec un outil tranchant au niveau du creux de la gorge (Lubbah), qui est la dépression située entre la base du cou et la poitrine ; et à pratiquer l'égorgement (Dhabh) au niveau du haut de la gorge (Halq) pour les autres animaux.</p>
<p>La sagesse dans la spécification de l'égorgement rituel à cet endroit précis et dans la section de ces éléments particuliers réside dans l'évacuation du sang fluide. En effet, cette zone constitue le point de confluence des vaisseaux sanguins. De plus, cela accélère la sortie de l'âme, ce qui rend la viande meilleure et s'avère plus doux pour l'animal. Le Prophète <span dir="rtl">ﷺ</span> a d'ailleurs dit :</p>
<p class="ar"><span dir="rtl">«إِذَا ذَبَحْتُمْ فَأَحْسِنُوا الذِّبْحَةَ»</span></p>
<p><em><strong>« Quand vous égorgez, égorgez de la meilleure manière. »</strong></em> <a href="#fn7" class="footnote-ref" id="fnref7" role="doc-noteref"><sup>7</sup></a>.</p>
<p>Quant à l'animal qu'il est impossible d'égorger à l'endroit spécifié en raison d'un manque de contrôle sur lui — comme le gibier de chasse, le bétail devenu sauvage ou l'animal tombé dans un puits et ses équivalents —, son égorgement rituel s'accomplit en le blessant en n'importe quel endroit de son corps, et cela suffit à valider son égorgement rituel. Cela s'appuie sur le hadith de Râfi' [ibn Khadîj] qui a dit : « Un chameau s'est enfui, un homme a alors visé vers lui avec une flèche et l'a immobilisé [en le tuant]. Le Prophète <span dir="rtl">ﷺ</span> a alors dit :</p>
<p class="ar"><span dir="rtl">مَا نَدَّ عَلَيْكُمْ؛ فَاصْنَعُوا بِهِ هَكَذَا»</span></p>
<p><em><strong>« Pour tout animal qui s'enfuit ainsi loin de vous [et vous échappe], agissez de cette manière avec lui. »</strong></em> (Rapporté par Al-Bukhârî et Muslim) <a href="#fn8" class="footnote-ref" id="fnref8" role="doc-noteref"><sup>8</sup></a>. Et cela a été rapporté d'après 'Alî, Ibn Mas'ûd, Ibn 'Umar, Ibn 'Abbâs et 'Â'ishah (qu'Allah les agrée tous).</p>
<p>De même, pour les animaux accidentés ou blessés — comme la bête étranglée, la bête assommée (ou battue à mort), la bête précipitée (tombée d'un point haut), la bête encornée, ou celle qu'un fauve a partiellement dévorée —, si on les rattrape alors qu'elles possèdent encore une vie stable et qu'on procède à leur égorgement rituel, elles deviennent licites. Cela s'appuie sur la parole d'Allah le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿حُرِّمَتْ عَلَيْكُمُ الْمَيْتَةُ ...﴾ إِلَى قَوْلِهِ: ﴿وَالْمُنْخَنِقَةُ وَالْمَوْقُوذَةُ وَالْمُتَرَدِّيَةُ وَالنَّطِيحَةُ وَمَا أَكَلَ السَّبُعُ إِلَّا مَا ذَكَّيْتُمْ﴾ [المائدة: ٣]</span></p>
<p><strong>﴾ Vous sont interdits la bête morte... ﴿</strong> jusqu'à Sa parole : <strong>﴾ ...la bête étranglée, la bête assommée, la bête précipitée, la bête encornée, et celle qu'un fauve a dévorée, sauf celle que vous égorgez pieusement ﴿</strong> [Al-Mâ'idah : 3] ; c'est-à-dire : sauf celle que vous avez rattrapée alors qu'elle était encore en vie et que vous avez soumise à l'égorgement rituel ; celle-ci n'est pas interdite.</p>
<p><em>La bête étranglée</em> (<em>Al-Munkhaniqah</em>) : c'est celle autour du cou de laquelle s'est enroulée une corde ou un objet similaire, provoquant sa strangulation. <em>La bête assommée</em> (<em>Al-Mawqûdhah</em>) : c'est celle qui a été frappée par un objet lourd. <em>La bête précipitée</em> (<em>Al-Mutaraddiyah</em>) : c'est celle qui fait une chute depuis un endroit élevé. <em>La bête encornée</em> (<em>An-Natîhah</em>) : c'est celle qu'un autre animal a frappée de la tête (ou avec ses cornes). <em>Et celle qu'un fauve a dévorée</em> : c'est-à-dire celle qui a été attaquée par un loup ou un prédateur similaire.</p>
<p>Cheikh al-Islâm Ibn Taymiyyah — qu'Allah lui fasse miséricorde — a dit au sujet de l'égorgement rituel valable pour ces types d'animaux <a href="#fn9" class="footnote-ref" id="fnref9" role="doc-noteref"><sup>9</sup></a> : <em>« Dès lors que l'animal est égorgé et qu'il en sort le sang rouge vif qui coule habituellement de la bête sacrifiée — et non le sang stagnant d'une bête morte —, sa consommation est licite. Et cela est valable, selon l'avis le plus authentique, même si l'animal ne bouge ni une patte antérieure, ni une patte postérieure, ni la paupière, ni ne remue la queue, ou autre signe similaire... »</em>. Fin de citation.</p>
<p><strong>La quatrième condition :</strong> Que la personne qui égorge dise au moment où sa main s'active pour le sacrifice : « <em>Bismillâh</em> » (Au nom d'Allah), conformément à la parole d'Allah le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿وَلَا تَأْكُلُوا مِمَّا لَمْ يُذْكَرِ اسْمُ اللَّهِ عَلَيْهِ وَإِنَّهُ لَفِسْقٌ﴾ [الأنعام: ١٢١].</span></p>
<p><strong>﴾ Et ne mangez pas de ce sur quoi le nom d'Allah n'a pas été prononcé, car ce serait assurément de la perversité ﴿</strong> [Al-An'âm : 121].</p>
<p>L'Imam Ibn al-Qayyim a dit <a href="#fn10" class="footnote-ref" id="fnref10" role="doc-noteref"><sup>10</sup></a> : <em>« Il ne fait aucun doute que la mention du nom d'Allah sur la bête sacrifiée la rend bonne (et pure) et chasse le diable de celui qui égorge ainsi que de l'animal égorgé. En revanche, lorsque cette mention fait défaut, le diable s'associe à l'égorgeur et à la bête, ce qui produit une souillure spirituelle chez l'animal. De plus, le Prophète <span dir="rtl">ﷺ</span> prononçait toujours le nom d'Allah lorsqu'il égorgeait. Ainsi, ce verset démontre que la bête immolée n'est pas licite si le nom d'Allah n'a pas été prononcé sur elle, et ce, même si la personne qui effectue l'égorgement est musulmane... ». Fin de citation.</em></p>
<p>Et il est recommandé (Sunnah) de prononcer le <em>Takbîr</em> (« <em>Allâhu Akbar</em> ») en même temps que la formule du nom d'Allah (<em>Al-Basmalah</em>).</p>
<p>⁕ L'égorgement rituel comporte des règles de bienséance (Âdâb) :</p>
<p>- Il est ainsi détestable (Makrûh) d'égorger l'animal à l'aide d'un instrument émoussé (qui ne coupe pas bien), en raison de la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«وَلْيُحِدَّ أَحَدُكُمْ شَفْرَتَهُ، وَلْيُرِحْ ذَبِيحَتَهُ»</span></p>
<p><em><strong>« Que chacun d'entre vous aiguise sa lame et qu'il ménage sa bête sacrifiée. »</strong></em><a href="#fn11" class="footnote-ref" id="fnref11" role="doc-noteref"><sup>11</sup></a>.</p>
<p>- Il est également détestable d'aiguiser la lame sous le regard de l'animal, car le Messager d'Allah <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«أَمَرَ أَنْ تُحَدَّ الشِّفَارُ، وَأَنْ تُوَارَى عَنِ الْبَهَائِمِ»</span></p>
<p><em><strong>« a ordonné d'aiguiser les lames et de les dissimuler à la vue des bêtes. »</strong></em> (Rapporté par Ahmad) <a href="#fn12" class="footnote-ref" id="fnref12" role="doc-noteref"><sup>12</sup></a>.</p>
<p>- Il est détestable d'orienter l'animal dans une direction autre que la Qiblah.</p>
<p>- Il est détestable de lui briser le cou ou de commencer à le dépouiller avant que son corps ne se soit complètement refroidi (c'est-à-dire avant l'arrêt total des spasmes et la mort complète).</p>
<p>⁕ La Sunnah consiste à pratiquer la saignée (Nahr) des chameaux en position debout, en ayant leur patte antérieure gauche attachée (repliée). Quant aux bovins et aux ovins (ovins et caprins), la Sunnah est de les égorger couchés sur leur flanc gauche. Et Allah est Le plus Savant.</p>
