<h2 id="بسم-الله-الرحمن-الرحيم"><span dir="rtl">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</span></h2>
<blockquote>
<p><strong>Chapitre sur les règles relatives aux nourritures</strong></p>
</blockquote>
<p>⁕ Puisque la nourriture alimente le corps de l'être humain et que son impact se répercute sur ses mœurs et son comportement, les bonnes et pures nourritures ont ainsi un bon effet sur l'homme, tandis que les mauvaises et impures nourritures ont l'effet inverse. C'est pourquoi Allah a ordonné à Ses serviteurs de manger des choses bonnes et pures, et leur a interdit les choses mauvaises et impures :</p>
<p>- <strong>Le Très-Haut a dit :</strong></p>
<p class="ar"><span dir="rtl">﴿يَأَيُّهَا النَّاسُ كُلُوا مِمَّا فِي الْأَرْضِ حَلَالًا طَيِّبًا...﴾ [البقرة: ١٦٨]</span></p>
<p><strong>﴾ Ô gens ! De ce qui existe sur la terre, mangez le licite et le pur... ﴿</strong> [Al-Baqarah : 168].</p>
<p>- <strong>Le Très-Haut a dit :</strong></p>
<p class="ar"><span dir="rtl">﴿يَأَيُّهَا الَّذِينَ ءَامَنُوا كُلُوا مِن طَيِّبَاتِ مَا رَزَقْنَاكُمْ وَاشْكُرُوا لِلَّهِ إِن كُنتُمْ إِيَّاهُ تَعْبُدُونَ﴾ [البقرة : ١٧٢]</span></p>
<p><strong>﴾ Ô vous qui croyez ! Mangez des bonnes choses dont Nous vous avons pourvus, et remerciez Allah si c'est Lui que vous adorez. ﴿</strong> [Al-Baqarah : 172].</p>
<p>- <strong>Le Très-Haut a dit :</strong></p>
<p class="ar"><span dir="rtl">﴿يَأَيُّهَا الرُّسُلُ كُلُوا مِنَ الطَّيِّبَاتِ وَاعْمَلُوا صَالِحًا﴾ [المؤمنون: ٥١]</span></p>
<p><strong>﴾ Ô Messagers ! Mangez des choses bonnes et pures, et accomplissez les bonnes oeuvres. ﴿</strong> [Al-Mu'minûn : 51].</p>
<p>- <strong>Le Très-Haut a dit :</strong></p>
<p class="ar"><span dir="rtl">﴿قُلْ مَنْ حَرَّمَ زِينَةَ اللَّهِ الَّتِي أَخْرَجَ لِعِبَادِهِ وَالطَّيِّبَاتِ مِنَ الرِّزْقِ﴾ [الأعراف: ٣٢]</span></p>
<p><strong>﴾ Dis : "Qui a interdit la parure d'Allah qu'Il a produite pour Ses serviteurs, ainsi que les bonnes choses de la subsistance ?" ﴿</strong> [Al-A'râf : 32].</p>
<p>⁕ « <em>Al-At'imah</em> » (les nourritures) est le pluriel de « <em>Ta'âm</em> », et cela désigne tout ce qui se mange et se boit.</p>
<p>⁕ Et la règle d'origine concernant celles-ci est la licéité (l'autorisation), conformément à la parole du Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿هُوَ الَّذِي خَلَقَ لَكُم مَّا فِي الْأَرْضِ جَمِيعًا﴾ [البقرة: ٢٩]</span></p>
<p><strong>﴾ C'est Lui qui a créé pour vous tout ce qui est sur la terre ﴿</strong> [Al-Baqarah : 29], ainsi que d'autres textes du Livre et de la Sunnah qui démontrent que le principe de base concernant les nourritures est la licéité, à l'exception de ce qui a été exclu (par une preuve).</p>
<p>Cheikh al-Islâm Ibn Taymiyyah <a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a> a dit : <em>« La règle d'origine à leur sujet est la licéité pour tout musulman qui accomplit des œuvres pieuses ; car Allah le Très-Haut n'a rendu licites les bonnes choses qu'à celui qui s'en sert comme aide pour Lui obéir, et non pour Lui désobéir. Ceci en raison de Sa parole (Le Très-Haut) :</em></p>
<p class="ar"><span dir="rtl">﴿لَيْسَ عَلَى الَّذِينَ ءَامَنُوا وَعَمِلُوا الصَّالِحَاتِ جُنَاحٌ فِيمَا طَعِمُوا﴾ [المائدة: ٩٣]</span></p>
<p><strong>﴾ Ce n'est pas un péché pour ceux qui ont cru et accompli de bonnes œuvres en ce qu'ils ont consommé ﴿</strong> <em>[Al-Mâ'idah : 93].</em></p>
<p><em>C'est pourquoi il n'est pas permis d'utiliser une chose autorisée (mubâh) pour accomplir un péché, comme celui qui donnerait de la viande et du pain à quelqu'un qui consommera du vin avec, ou s'en servira pour commettre des turpitudes. Quant à celui qui mange de bonnes choses sans se montrer reconnaissant, il est blâmable.</em></p>
<p><em>Le Très-Haut a dit :</em></p>
<p class="ar"><span dir="rtl">﴿ثُمَّ لَتُسْأَلُنَّ يَوْمَئِذٍ عَنِ النَّعِيمِ﴾ [التكاثر: ٨]</span></p>
<p><strong>﴾ Puis, vous serez interrogés, ce jour-là, sur les délices ﴿</strong> <em>[Al-Takâthur : 8], c'est-à-dire : sur la reconnaissance due pour ces délices. Fin (de la citation).</em></p>
<p>Allah le Très-Haut a donc rendu licites les bonnes choses à Ses serviteurs croyants afin qu'ils en profitent.</p>
<p>Le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿يَسْأَلُونَكَ مَاذَا أُحِلَّ لَهُمْ قُلْ أُحِلَّ لَكُمُ الطَّيِّبَاتُ﴾ [المائدة: ٤].</span></p>
<p><strong>﴾ Ils t'interrogent sur ce qui leur est permis. Dis : "Vous sont permises les bonnes nourritures" ﴿</strong> [Al-Mâ'idah : 4].</p>
<p>⁕ Et Allah a certes exposé clairement à Ses serviteurs ce qu'Il leur a interdit parmi les nourritures et les boissons.</p>
<p>Le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿وَقَدْ فَصَّلَ لَكُم مَّا حَرَّمَ عَلَيْكُمْ إِلَّا مَا اضْطُرِرْتُمْ إِلَيْهِ﴾ [الأنعام: ١١٩]</span></p>
<p><strong>﴾ Alors qu'Il vous a détaillé ce qu'Il vous a interdit, à moins que vous ne soyez contraints d'y recourir ﴿</strong> [Al-An'âm : 119].</p>
<p>Ce dont l'interdiction n'a pas été explicitée est donc licite (halâl), comme l'a dit le Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«إِنَّ اللَّهَ فَرَضَ فَرَائِضَ؛ فَلَا تُضَيِّعُوهَا، وَحَدَّ حُدُوداً؛ فَلَا تَعْتَدُوهَا، وَحَرَّمَ أَشْيَاءَ؛ فَلَا تَنْتَهِكُوهَا، وَسَكَتَ عَنْ أَشْيَاءَ رَحْمَةً لَكُمْ مِنْ غَيْرِ نِسْيَانٍ؛ فَلَا تَبْحَثُوا عَنْهَا»</span></p>
<p><em><strong>« Certes, Allah a prescrit des obligations, ne les négligez pas ; Il a fixé des limites, ne les transgressez pas ; Il a interdit des choses, ne les violez pas ; et Il a tu des choses par miséricorde pour vous, sans oubli, ne cherchez donc pas à les scruter. »</strong></em> L'imam Al-Nawawî (qu'Allah lui fasse miséricorde) a dit : c'est un hadith bon (hassan), rapporté par Al-Dâraqutnî et d'autres <a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a>.</p>
<p>Ainsi, pour tout ce dont Allah et Son Messager n'ont pas explicité l'interdiction concernant les nourritures, les boissons et les vêtements, il n'est pas permis de le déclarer interdit. Car Allah nous a détaillé ce qu'Il a interdit. Ce qui est illicite (harâm) fait donc nécessairement l'objet d'une interdiction détaillée. Et de même qu'il n'est pas permis de rendre licite ce qu'Allah a interdit, il n'est pas permis non plus d'interdire ce dont Allah a dispensé (exempté de jugement) et qu'Il n'a pas interdit.</p>
<p>⁕ Et la règle en la matière est que toute nourriture pure qui ne présente aucun préjudice est autorisée (mubâh) ; contrairement à la nourriture impure (najis), telle que la bête morte, le sang, les excréments, l'urine, le vin, le cannabis (le hachich), ainsi que la nourriture souillée par une impureté (<em>al-mutanajjis</em>), qui est celle mélangée à une impureté, car celle-ci est certes interdite ; parce qu'elle est mauvaise (khabîth) et nuisible ; conformément à la parole du Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿حُرِّمَتْ عَلَيْكُمُ الْمَيْتَةُ وَالدَّمُ وَلَحْمُ الْخِنزِيرِ...﴾ الْآيَةَ [المائدة: ٣]</span></p>
<p><strong>﴾ Vous sont interdits la bête morte, le sang, la chair de porc... ﴿</strong> [Al-Mâ'idah : 3].</p>
<p>- Quant à la bête morte (<em>al-maytah</em>), il s'agit de ce qui a perdu la vie sans abattage rituel conforme à la législation islamique (<em>dhakât shar'iyyah</em>). Elle a été interdite en raison de la mauvaise nature de sa substance nutritive, car celui qui se nourrit s'assimile à ce dont il se nourrit. C'est donc l'une des beautés de la Législation islamique (<em>al-sharî'ah</em>) que de l'avoir interdite.</p>
<p>Cependant, si une personne y est contrainte (par nécessité absolue), elle lui devient alors permise, et l'aspect nuisible/mauvais s'efface en situation de nécessité. En effet, cet impact n'agit pas de manière indépendante au sein de l'organisme qui s'en nourrit, mais résulte plutôt de la conjonction entre le récepteur (le corps) et l'agent (l'aliment). Or, l'état de nécessité absolue de l'individu empêche le corps de s'imprégner de la mauvaise nature présente dans ce qu'il consomme ; ainsi, le préjudice (<em>al-mafsadah</em>) ne se produit pas. Car ce préjudice dépend de la situation de libre choix, situation par laquelle l'organisme accepte la nocivité de la nourriture. Dès lors que le libre choix disparaît, la condition d'acceptation disparaît également, et le préjudice ne se réalise plus du tout.</p>
<p>- Quant au sang, ce qui est visé ici est <strong>le sang épanché (versé)</strong>. Les gens de l'époque préislamique (<em>al-Jâhiliyyah</em>) le mettaient dans des boyaux, le grillaient et le mangeaient. Quant à ce qui reste dans les interstices de la chair après l'abattage ainsi que ce qui reste dans les vaisseaux sanguins, cela est autorisé (licite). Même si on le touchait avec la main et qu'il y laissait une trace, ou qu'on le touchait avec un morceau de coton, cela ne la rendrait pas impure.</p>
<p>Cheikh al-Islâm Ibn Taymiyyah (qu'Allah lui fasse miséricorde) a dit <a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a> : <em>« L'avis authentique est que seul le sang épanché, versé et écoulé est interdit. Quant à ce qui subsiste dans les veines de la viande, aucun savant ne l'a interdit. »</em> Fin de la citation.</p>
<p>⁕ Et il n'est pas licite, parmi les substances consommables, de prendre ce qui présente un caractère nuisible ; comme le poison, le vin, le cannabis (le hachich) et la fumée (le tabac). Ceci en raison de la parole du Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿وَلَا تُلْقُوا بِأَيْدِيكُمْ إِلَى التَّهْلُكَةِ﴾ [البقرة: ١٩٥]</span></p>
<p><strong>﴾ Et ne vous jetez pas de vos propres mains dans la destruction ﴿</strong> [Al-Baqarah : 195]. Ce noble verset démontre ainsi l'interdiction de manger ou de boire tout ce qui comporte une nuisance, parallèlement à d'autres preuves qui indiquent l'interdiction des nourritures et des boissons préjudiciables à la raison et aux corps.</p>
<p>⁕ Et les nourritures autorisées (licites) se divisent en deux catégories : les animaux et les végétaux, comme les céréales et les fruits. Est donc permis, parmi celles-ci, tout ce qui ne présente aucune nuisance.</p>
<p>⁕ Et les animaux se divisent en deux catégories : les animaux qui vivent sur la terre ferme, et les animaux qui vivent dans la mer.</p>
<p>⁕ Les animaux terrestres sont autorisés (licites), à l'exception de certaines catégories que le Législateur a interdites :</p>
<p>- <strong>Parmi celles-ci :</strong> Les ânes domestiques, conformément au hadith de Jâbir (qu'Allah l'agrée) :</p>
<p class="ar"><span dir="rtl">«أَنَّ النَّبِيَّ ﷺ نَهَى يَوْمَ خَيْبَرَ عَنْ لُحُومِ الْحُمُرِ الْأَهْلِيَّةِ؛ وَأَذِنَ فِي لُحُومِ الْخَيْلِ»</span></p>
<p><em><strong>« Le Prophète <span dir="rtl">ﷺ</span> a interdit, le jour de Khaybar, la chair des ânes domestiques et a autorisé la chair des chevaux. »</strong></em> Rapporté par Al-Bukhârî et Muslim <a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a>.</p>
<p>Ibn al-Mundhir a dit : <em>« Il n'y a aucune divergence aujourd'hui parmi les gens de science quant à leur interdiction. »</em></p>
<p>- Est également interdit, parmi les animaux terrestres, tout spécimen possédant un croc avec lequel il chasse (les carnivores). Ceci en raison de la parole d'Abû Tha'labah al-Khushanî (qu'Allah l'agrée) :</p>
<p class="ar"><span dir="rtl">«نَهَى رَسُولُ اللَّهِ ﷺ عَنْ أَكْلِ كُلِّ ذِي نَابٍ مِنَ السِّبَاعِ»</span></p>
<p><em><strong>« Le Messager d'Allah <span dir="rtl">ﷺ</span> a interdit la consommation de tout animal féroce doté de crocs. »</strong></em> Rapporté par Al-Bukhârî et Muslim <a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a>.</p>
<p>La hyène est exclue de cette interdiction et est donc licite, conformément au hadith de Jâbir :</p>
<p class="ar"><span dir="rtl">«أَمَرَنَا رَسُولُ اللَّهِ ﷺ بِأَكْلِ الضَّبُعِ»</span></p>
<p><em><strong>« Le Messager d'Allah <span dir="rtl">ﷺ</span> nous a ordonné de manger de la hyène. »</strong></em> <a href="#fn6" class="footnote-ref" id="fnref6" role="doc-noteref"><sup>6</sup></a>.</p>
<p>L'érudit Ibn al-Qayyim <a href="#fn7" class="footnote-ref" id="fnref7" role="doc-noteref"><sup>7</sup></a> (qu'Allah lui fasse miséricorde) a dit : <em>« N'a été interdit que ce qui réunit ces deux caractéristiques : posséder un croc et faire partie des fauves qui attaquent naturellement, à l'instar du lion. Quant à la hyène, elle ne possède que l'une des deux caractéristiques, à savoir le fait d'avoir un croc, mais elle ne fait pas partie des fauves qui attaquent (l'homme). Or, le fauve n'a été interdit qu'en raison de sa force féroce qui se transmet par mimétisme à celui qui s'en nourrit. Et la hyène n'est pas considérée comme un fauve agressif, que ce soit sur le plan linguistique ou coutumier... »</em> Fin (de la citation).</p>
<p>- <strong>Les oiseaux sont autorisés (licites), à l'exception de ce qui a été exclu :</strong> Est ainsi interdit, parmi les oiseaux, tout rapace possédant une serre avec laquelle il chasse (les animaux), c'est-à-dire l'ongle agrippeur servant à capturer les proies, tels que l'aigle, le faucon et le vautour. Ceci en raison de la parole d'Ibn 'Abbâs :</p>
<p class="ar"><span dir="rtl">«نَهَى رَسُولُ اللَّهِ ﷺ عَنْ أَكْلِ كُلِّ ذِي نَابٍ مِنَ السِّبَاعِ، وَعَنْ كُلِّ ذِي مِخْلَبٍ مِنَ الطَّيْرِ»</span></p>
<p><em><strong>« Le Messager d'Allah <span dir="rtl">ﷺ</span> a interdit la consommation de tout animal féroce doté de crocs et de tout oiseau doté de serres. »</strong></em> <a href="#fn8" class="footnote-ref" id="fnref8" role="doc-noteref"><sup>8</sup></a>, rapporté par Abû Dâwûd et d'autres.</p>
<p>L'imam Ibn al-Qayyim <a href="#fn9" class="footnote-ref" id="fnref9" role="doc-noteref"><sup>9</sup></a> (qu'Allah lui fasse miséricorde) a dit : <em>« Les récits du Prophète <span dir="rtl">ﷺ</span> se sont certes succédé par voie de récurrence (tawâtur) concernant l'interdiction de tout animal féroce doté de crocs et de tout oiseau doté de serres. Ils ont été authentifiés d'une authenticité incontestable à travers les hadiths de 'Alî, Ibn 'Abbâs, Abû Hurayrah et Abû Tha'labah al-Khushanî. »</em> Fin de citation.</p>
<p>- Est également interdit, parmi les oiseaux, ce qui consomme des charognes ; comme le vautour, le percnoptère et le corbeau. Cela s'explique par la nature impure et mauvaise de ce dont il se nourrit.</p>
<p>- Et il est interdit, parmi les animaux, ce qui est considéré comme répugnant (khabîth) ; comme le serpent, la souris et les insectes.</p>
<p>Cheikh al-Islâm Ibn Taymiyyah <a href="#fn10" class="footnote-ref" id="fnref10" role="doc-noteref"><sup>10</sup></a> (qu'Allah lui fasse miséricorde) a dit : <em>« La consommation des serpents et des scorpions est interdite à l'unanimité. Quiconque les mange en les considérant comme licites doit être invité au repentir ; et quiconque reconnaît leur interdiction mais les mange tout de même est un désobéissant (fâsiq), rebelle à Allah et à Son Messager. »</em></p>
<p>- Les insectes sont interdites, car elles font partie des choses impures et répugnantes (<em>al-khabâ'ith</em>).</p>
<p>- Est également interdit, parmi les animaux, ce qui est né du croisement entre un animal dont la chair est licite et un autre dont la chair ne l'est pas ; à l'instar du mulet, issu (du croisement) du cheval et de l'âne domestique, et ce, par application de la règle de prévalence du côté de l'interdiction (<em>taghlîban li-jânibi at-tahrîm</em>).</p>
<p>⁕ Certain savants ont résumé ce qui est interdit parmi les animaux de la terre ferme en six catégories, qui sont :</p>
<p><strong>1 -</strong> Ce qui a fait l'objet d'un texte mentionnant textuellement son identité (nommément), à l'instar des ânes domestiques.</p>
<p><strong>2 -</strong> Ce pour quoi une limite ou une règle générale restrictive (<em>dâbit</em>) a été établie, comme ce qui possède un croc parmi les fauves ou une serre parmi les oiseaux.</p>
<p><strong>3 -</strong> Ce qui consomme des charognes, à l'instar du percnoptère et du corbeau.</p>
<p><strong>4 -</strong> Ce qui est considéré comme répugnant et impur (<em>khabîth</em>), à l'instar de la souris et du serpent.</p>
<p><strong>5 -</strong> Ce qui est né du croisement entre un animal dont la chair est licite et un autre dont la chair est illicite, à l'instar du mulet.</p>
<p><strong>6 -</strong> Ce que le Législateur a ordonné de tuer ou a interdit de tuer, à l'instar des cinq animaux nuisibles (<em>al-fawâsiq al-khams</em>)<a href="#fn11" class="footnote-ref" id="fnref11" role="doc-noteref"><sup>11</sup></a>, de la huppe (<em>al-hudhud</em>) et de la pie-grièche (<em>al-surad</em>).</p>
<p>⁕ Et en dehors de ce qui a été mentionné parmi les animaux et les oiseaux, le reste est licite (halâl) selon le principe fondamental de la permission d'origine. C'est le cas par exemple des chevaux, des bestiaux (<em>bahîmat al-an'âm</em>), des poules, des ânes sauvages (zèbres), des gazelles, de l'autruche, du lièvre et des autres animaux sauvages (non carnivores). En effet, tout cela fait partie des bonnes choses pures (<em>mustatâb</em>), entrant ainsi dans la parole du Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿وَيُحِلُّ لَهُمُ الطَّيِّبَاتِ﴾ [الأعراف: ١٥٧]</span></p>
<p><strong>﴾ Et Il leur rend licites les bonnes choses ﴿</strong> [Al-A'râf : 157].</p>
<p>⁕ <strong>Et fait exception à cela :</strong> L'animal al-jallâlah (parmi les bovins, les ovins ou les camelins), qui désigne la bête dont la majeure partie de la nourriture est constituée d'impuretés (<em>najâsah</em>). Il est alors interdit de consommer sa chair.</p>
<p>Cela s'appuie sur ce qu'ont rapporté Ahmad, Abû Dâwûd et d'autres d'après le hadith d'Ibn 'Umar :</p>
<p class="ar"><span dir="rtl">«نَهَى عَنْ أَكْلِ الْجَلَّالَةِ وَأَلْبَانِهَا»</span></p>
<p><strong><em>« Il a interdit de manger la jallâlah et de boire son lait »</em>.</strong><a href="#fn12" class="footnote-ref" id="fnref12" role="doc-noteref"><sup>12</sup></a></p>
<p>De même, d'après le hadith de 'Amr ibn Shu'ayb :</p>
<p class="ar"><span dir="rtl">«نَهَى عَنْ لُحُومِ الْحُمُرِ الْأَهْلِيَّةِ، وَعَنْ رُكُوبِ الْجَلَّالَةِ وَأَكْلِ لُحُومِهَا»</span></p>
<p><em><strong>« Il a interdit la chair des ânes domestiques, ainsi que le fait de monter la jallâlah et d'en consommer la chair »</strong></em> <a href="#fn13" class="footnote-ref" id="fnref13" role="doc-noteref"><sup>13</sup></a>.</p>
<p>La règle s'applique de manière identique, qu'il s'agisse de bestiaux, de volailles ou de créatures similaires. Son lait et ses œufs sont considérés comme impurs tant que la bête n'a pas été mise en quarantaine durant trois jours pour être nourrie exclusivement d'aliments purs.</p>
<p>Ibn al-Qayyim <a href="#fn14" class="footnote-ref" id="fnref14" role="doc-noteref"><sup>14</sup></a> a dit : <em>« Les musulmans s'accordent à l'unanimité sur le fait que si une bête s'est nourrie d'impuretés, puis qu'elle est enfermée pour être nourrie d'aliments purs, son lait et sa chair deviennent alors licites. Il en va de même pour les cultures et les fruits : s'ils ont été irrigués avec de l'eau impure puis qu'on les arrose avec de l'eau pure, ils deviennent licites, en raison de la transformation de la caractéristique impure (al-khabîth) qui s'est convertie en une bonne nature (at-tayyib). »</em> Fin de citation.</p>
<p>⁕ <strong>Il est détestable (makrûh)</strong> de consommer de l'oignon, de l'ail ou d'autres aliments dégageant une odeur désagréable, particulièrement au moment de se rendre aux mosquées. Cela est dû à la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«مَنْ أَكَلَ مِنْ هَذِهِ الشَّجَرَةِ؛ فَلَا يَقْرَبَنَّ مُصَلَّانَا»</span></p>
<p><em><strong>« Quiconque mange de cet arbre, qu'il ne s'approche pas de notre lieu de prière. »</strong></em>.<a href="#fn15" class="footnote-ref" id="fnref15" role="doc-noteref"><sup>15</sup></a></p>
<p>⁕ Quiconque se trouve contraint par la nécessité de recourir à une chose interdite — par la peur de périr s'il ne la consomme pas —, à l'exception du poison, il lui devient alors licite d'en consommer ce qui suffit à le maintenir en vie (c'est-à-dire : ce qui préserve sa force et la maintient). Ceci en raison de la parole du Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿فَمَنِ اضْطُرَّ غَيْرَ بَاغٍ وَلَا عَادٍ فَلَا إِثْمَ عَلَيْهِ﴾ [البقرة : ١٧٣]</span></p>
<p><strong>﴾ Quiconque est contraint par la nécessité, sans pour autant être rebelle ni transgresseur, il n'y a pas de péché sur lui ﴿</strong> [Al-Baqarah : 173].</p>
<p>De même, quiconque est contraint de recourir à la nourriture d'autrui, alors que le propriétaire de cette nourriture n'en a pas lui-même un besoin impérieux, ce dernier a l'obligation de la lui céder à hauteur de ce qui maintient sa vie, contre sa valeur financière.</p>
<p>Cheikh al-Islâm Ibn Taymiyyah <a href="#fn16" class="footnote-ref" id="fnref16" role="doc-noteref"><sup>16</sup></a> (qu'Allah lui fasse miséricorde) a dit : <em>« Si la personne en situation de nécessité absolue est pauvre, aucune contrepartie financière ne lui incombe. En effet, nourrir l'affamé et vêtir celui qui est nu relèvent de l'obligation communautaire (Fard Kifâyah), et cela devient une obligation individuelle (Fard 'Ayn) pour une personne précise si personne d'autre ne s'en charge. »</em> Fin de citation.</p>
<p>⁕ Quiconque se trouve contraint d'utiliser un bien appartenant à autrui sans pour autant que ce bien ne se consume (l'usage du bien avec préservation de son intégrité), comme des vêtements pour se protéger du froid, une corde ou un seau pour puiser de l'eau, ou une marmite pour cuisiner, le propriétaire a l'obligation de lui prêter gratuitement, tant qu'il n'en a pas lui-même besoin. Car Allah le Très-Haut a blâmé ceux qui refusent ce prêt à travers Sa parole :</p>
<p class="ar"><span dir="rtl">﴿وَيَمْنَعُونَ الْمَاعُونَ﴾ [الماعون : ٧].</span></p>
<p><strong>﴾ Et qui refusent l'ustensile ﴿</strong> [Al-Mâ'ûn : 7].</p>
<p>Ibn 'Abbâs, Ibn Mas'ûd et d'autres ont dit : <em>« Al-Mâ'ûn ( <span dir="rtl">الْمَاعُون</span>َ ) désigne les objets du quotidien que les gens s'échangent et se prêtent mutuellement, tels que la hache, la marmite, le seau et les choses similaires. »</em></p>
<p>⁕ Quiconque passe près des fruits d’un verger, qu'ils soient encore sur l'arbre ou tombés au sol, alors qu’il n'y a ni clôture autour du verger, ni gardien pour surveiller, il lui est alors permis d’en manger gratuitement sans rien emporter. Cela a été rapporté d'après Ibn 'Abbâs, Anas ibn Mâlik et d’autres. Cependant, il ne lui est pas permis de monter sur un arbre, ni de lui jeter un projectile [pour faire tomber les fruits], ni de manger des fruits déjà cueillis et rassemblés, sauf en cas de nécessité absolue.</p>
<p>Il en résulte donc que le passant a le droit de manger des fruits du verger sous certaines conditions :</p>
<p><strong>Premièrement :</strong> Qu'il n'y ait pas de clôture autour du verger et qu'il n'y ait pas de gardien sur place.</p>
<p><strong>Deuxièmement :</strong> Que les fruits soient encore sur l'arbre ou tombés d'eux-mêmes, et non pas déjà cueillis et rassemblés.</p>
<p><strong>Troisièmement :</strong> Qu'il n'ait pas besoin de grimper sur l'arbre, mais qu'il puisse les attraper sans y monter.</p>
<p><strong>Quatrièmement :</strong> Qu'il n'emporte rien avec lui.</p>
<p><strong>Cinquièmement :</strong> Il est conditionné selon la majorité des savants (<em>al-Jumhûr</em>) que le passant soit dans le besoin.</p>
<p>Si l’une de ces conditions fait défaut, il ne lui est alors plus permis d’en manger.</p>
<p>⁕ Il incombe obligatoirement au musulman d'accorder l'hospitalité au musulman qui passe par chez lui dans les villages, durant un jour et une nuit. Quant aux villes, l'hospitalité n'y est pas obligatoire, car le voyageur y trouve des restaurants et des hôtels et n'a donc pas besoin de l'hospitalité, contrairement aux villages et aux campagnes.</p>
<p>⁕ La preuve de l’obligation de l'hospitalité dans la situation susmentionnée réside dans la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«مَنْ كَانَ يُؤْمِنُ بِاللَّهِ وَالْيَوْمِ الْآخِرِ؛ فَلْيُكْرِمْ ضَيْفَهُ جَائِزَتَهُ»، قَالُوا: وَمَا جَائِزَتُهُ يَا رَسُولَ اللَّهِ؟ قَالَ: «يَوْمُهُ وَلَيْلَتُهُ»</span></p>
<p><strong>« Quiconque croit en Allah et au Jour dernier, qu'il honore son invité en lui accordant sa récompense (Jâ'izah). »</strong> Ils dirent : <em>« Et quelle est sa récompense, ô Messager d’Allah ? »</em> Il répondit : <strong>« Un jour et une nuit. »</strong> [Rapporté par Al-Bukhârî et Muslim] <a href="#fn17" class="footnote-ref" id="fnref17" role="doc-noteref"><sup>17</sup></a>. Ce hadith prouve l'obligation de l'hospitalité en raison de sa parole : <strong>« Quiconque croit en Allah... »</strong> etc., car le fait de lier la foi à l'honneur fait à l'invité démontre son caractère obligatoire.</p>
<p>De plus, il est rapporté dans les deux recueils authentiques (<em>Al-Sahîhayn</em>) :</p>
<p class="ar"><span dir="rtl">«إِنْ نَزَلْتُمْ بِقَوْمٍ، فَأَمَرُوا لَكُمْ بِمَا يَنْبَغِي لِلضَّيْفِ؛ فَاقْبَلُوا، وَإِنْ لَمْ يَفْعَلُوا؛ فَخُذُوا مِنْهُمْ حَقَّ الضَّيْفِ الَّذِي يَنْبَغِي لَهُ».</span></p>
<p><strong>« Si vous faites halte auprès d'un peuple et qu'ils ordonnent pour vous ce qui convient à un invité, acceptez. Mais s'ils ne le font pas, prenez alors d'eux le droit de l'invité qui lui revient légitimement. »</strong> <a href="#fn18" class="footnote-ref" id="fnref18" role="doc-noteref"><sup>18</sup></a>.</p>
<p>⁕ L'histoire d'Ibrahim le confident (<em>Al-Khalîl</em>) <span dir="rtl">ﷺ</span> avec ses invités, et le fait qu'il leur ait présenté un veau, prouve que l'hospitalité fait partie de la religion d'Ibrahim. Cela prouve également qu'il convient de présenter à l'invité plus que ce qu'il ne mange. Ceci fait partie des beautés de cette religion et des nobles caractères qui n'ont cessé de se transmettre successivement au sein de sa descendance, jusqu'à ce que l'Islam vienne les confirmer et inciter à les pratiquer. Bien plus encore, la religion de l'Islam a accordé au voyageur (<em>Ibn al-Sabîl</em>) un droit parmi les dix droits mentionnés dans la parole d'Allah le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿وَاعْبُدُوا اللَّهَ وَلَا تُشْرِكُوا بِهِ شَيْئاً﴾ إِلَى قَوْلِهِ: ﴿وَابْنِ السَّبِيلِ﴾ [النساء: ٣٦]</span></p>
<p><strong>﴾ Adorez Allah et ne Lui associez rien ﴿</strong> jusqu’à Sa parole : <strong>﴾ et le voyageur ﴿</strong> [Sourate An-Nisâ : 36].</p>
<p>Et le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿فَآتِ ذَا الْقُرْبَى حَقَّهُ وَالْمِسْكِينَ وَابْنَ السَّبِيلِ﴾ [الروم: ٣٨]</span></p>
<p><strong>﴾ Donne donc au proche parent son dû, ainsi qu'au pauvre et au voyageur ﴿</strong> [Sourate Ar-Rûm : 38].</p>
<p>L'Islam lui a même accordé un droit sur la Zakat parmi les huit catégories de bénéficiaires ; et le voyageur (<em>Ibn al-Sabîl</em>) est celui dont les ressources ont été coupées durant son voyage.</p>
<p>À Allah seul reviennent les louanges pour cette religion parfaite et cette législation sage, qui est une guidance et une miséricorde.</p>
