<p>⁕ Cheikh Al-Islam Ibn Taymiyyah, qu'Allah lui fasse miséricorde, a dit <a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a>: <em>« Il est obligatoire de considérer l'exercice de la fonction de juge (Wilāyat al-Qadā) comme un acte religieux et un moyen de se rapprocher d'Allah ; car elles comptent parmi les meilleures œuvres de dévotion. La situation de la plupart des gens ne s'est corrompue qu'à cause de la recherche du pouvoir et des richesses à travers elle... »</em> Fin de citation.</p>
<p>⁕ Le fondement juridique de cela repose sur le Livre (le Coran), la Sunnah et le Consensus :</p>
<p>- Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿وَأَنِ احْكُم بَيْنَهُم بِمَا أَنزَلَ اللَّهُ﴾ [المائدة: ٤٩]</span></p>
<p><strong>﴾ Et juge entre eux d'après ce qu'Allah a fait descendre ﴿</strong> [Al-Mā'idah : 49]</p>
<p>Et le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿يَادَاوُودُ إِنَّا جَعَلْنَاكَ خَلِيفَةً فِي الْأَرْضِ فَاحْكُم بَيْنَ النَّاسِ بِالْحَقِّ﴾ [ص: ٢٦]</span></p>
<p><strong>﴾ Ô David, Nous avons fait de toi un calife sur la terre. Juge donc entre les gens en toute équité ﴿</strong> [Sād : 26].</p>
<p>- Le Prophète <span dir="rtl">ﷺ</span> a lui-même exercé cette fonction et a nommé des juges dans les régions passées sous gouvernance islamique, et ses califes ont fait de même après lui.</p>
<p>- Et les Musulmans ont unanimement convenu (Consensus) de la nécessité d'établir des juges pour trancher les litiges entre les gens.</p>
<p>⁕ <em>Al-Qadā</em> (la sentence / le jugement) <strong>au sens linguistique</strong> signifie : parfaire une chose et l'accomplir (en finir avec elle).</p>
<p class="ar"><span dir="rtl">( إِحْكَامُ الشَّيْءِ وَالفَرَاغُ مِنْهُ )</span></p>
<p>Le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿فَقَضَاهُنَّ سَبْعَ سَمَاوَاتٍ فِي يَوْمَيْنِ﴾ [فصلت: ١٢]</span></p>
<p><strong>﴾ Il les décréta (parfusa/acheva) sous forme de sept cieux en deux jours ﴿</strong> [Fussilat : 12].</p>
<p>Ce terme possède également d'autres sens.</p>
<p>Quant à <strong>sa définition terminologique [en droit islamique]</strong>, c'est : l'élucidation du jugement légal, son application obligatoire et le règlement des litiges</p>
<p class="ar"><span dir="rtl">( تَبْيِينُ الحُكْمِ الشَّرْعِيِّ وَالإِلْزَامُ بِهِ وَفَصْلُ الخُصُومَاتِ )</span></p>
<p>Cheikh Al-Islam Ibn Taymiyyah, qu'Allah lui fasse miséricorde, a dit concernant le juge <a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a>: <em>« Du point de vue de l'établissement des faits, il est un témoin ; du point de vue de l'ordre et de l'interdiction, il est un mufti (jurisconsulte) ; et du point de vue de la contrainte à l'application, il est détenteur de l'autorité (le souverain)... »</em> Fin de citation.</p>
<p>⁕ Et le statut juridique de la magistrature en Islam est qu'elle constitue une obligation de suffisance communautaire (<em>Fard Kifāyah</em>) ; car les affaires des gens ne sauraient s'ordonner convenablement sans elle.</p>
<p>L'Imam Ahmad a dit <a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a>: <em>« Les gens doivent impérativement avoir un juge afin que les droits ne se perdent pas. »</em></p>
<p>Cheikh Al-Islam Ibn Taymiyyah a dit <a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a>: <em>« Le Prophète <span dir="rtl">ﷺ</span> a certes rendu obligatoire la désignation d'un chef lors d'un rassemblement mineur et temporaire durant un voyage, et ceci est une indication pour toutes les autres formes de regroupements... »</em> Fin de citation.</p>
<p>⁕ Et il est obligatoire pour quiconque est apte à la magistrature de l'assumer s'il n'y a personne d'autre que lui. En cela réside un immense mérite pour celui qui a la force de l'accomplir, mais cela comporte aussi un immense danger pour celui qui ne s'en acquitte pas de manière équitable.</p>
<p>⁕ Et il incombe au dirigeant des Musulmans de nommer les juges en fonction de l'intérêt public (<em>al-Maslahah</em>) qui l'exige, afin que les droits ne soient pas bafoués. Il se doit de choisir le meilleur qu'il puisse trouver en termes de science et de piété scrupuleuse (<em>Wara'</em>). Quant à celui dont il ignore l'aptitude, il doit se renseigner à son sujet.</p>
<p>⁕ Et il est obligatoire pour le juge de s'efforcer d'établir la justice entre les gens au maximum de ses capacités, et il n'est pas tenu par ce qui dépasse ses forces. Le détenteur de l'autorité (<em>Wali al-Amr</em>) lui alloue, à partir du Trésor Public (<em>Bayt al-Māl</em>), une rémunération suffisante pour qu'il puisse se consacrer pleinement à l'exercice de la justice. Les Califes Bien Guidés attribuaient d'ailleurs aux juges, sur les fonds du Trésor Public, de quoi subvenir largement à leurs besoins.</p>
<p>⁕ Et pour ce qui est des prérogatives (compétences) du juge, on s'en remet à la coutume (<em>al-'Urf</em>) propre à chaque époque.</p>
<p>Cheikh Al-Islam Ibn Taymiyyah, qu'Allah lui fasse miséricorde, a dit : <em>« Ce qu'il tire de son mandat (c'est-à-dire : comme prérogatives) n'a pas de limite fixée par la législation (Shar'), mais cela se définit plutôt à travers les termes (de sa nomination), les contextes et la coutume. Car tout ce qui n'a pas été délimité par la Loi religieuse est renvoyé à l'usage coutumier, à l'instar de la notion de garde sécurisée (al-Hirz) ou de la prise de possession (al-Qabd). »</em></p>
<p>Il [Ibn Taymiyyah] a dit <a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a>: <em>« Le mandat judiciaire (Wilāyat al-Ahkām) peut être fragmenté (divisé), et il n'est pas obligatoire pour le juge d'être savant dans un domaine qui sort de sa juridiction. En effet, la fonction de l'effort d'interprétation juronaturel (al-Ijtihād) est divisible. Au point que s'il est nommé pour gérer les successions (al-Mawārīth), il ne lui est pas obligatoire de connaître autre chose que les règles de l'héritage, les testaments et ce qui s'y rapporte. Et s'il est nommé pour gérer les contrats de mariage et leur annulation, il ne lui est obligatoire de connaître que cela. Sur cette base, si l'on [le gouverneur] lui dit : "Juge dans ce que tu sais", tout comme on dirait : "Donne des avis juridiques (Fatwa) dans ce que tu sais", cela est tout à fait permis. Et ce qu'il ignore sera alors considéré comme étant hors de sa juridiction (compétence). C'est identique à ce que nous disons concernant l'arbitre au jugement duquel les non-musulmans acceptent de se soumettre, ou concernant les deux arbitres désignés pour évaluer la compensation du gibier tué en état de sacralisation (Jazā' as-Sayd)... »</em> Fin de citation.</p>
<p>⁕ À notre époque, le Ministère de la Justice a mis en place un règlement que les juges suivent dans le cadre de leurs fonctions, et par lequel leurs prérogatives (compétences) sont précisément définies. Il est donc obligatoire de s'y référer et de s'y conformer. Car cela permet une saine organisation des affaires ainsi qu'une délimitation claire des compétences. De plus, ce règlement ne contredit aucun texte du Livre d'Allah (le Coran) ni de la Sunnah de Son Messager ; il est donc obligatoire de le mettre en pratique.</p>
<p>⁕ Et il est conditionné, pour quiconque assume la fonction de juge, qu'il réunisse dix caractéristiques, prises en considération selon la possibilité :</p>
<p>- Qu'il soit religieusement responsable (Mukallaf) – c'est-à-dire : pubère et doué de raison – ; car celui qui n’est pas responsable est sous la tutelle d'autrui, il ne peut donc pas exercer d'autorité sur autrui.</p>
<p>- Qu'il soit de sexe masculin ; en raison de la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«مَا أَفْلَحَ قَوْمٌ وَلَّوْا أَمْرَهُمُ امْرَأَةً»</span></p>
<p><em><strong>« Jamais ne réussira un peuple qui confie ses affaires à une femme »</strong></em> <a href="#fn6" class="footnote-ref" id="fnref6" role="doc-noteref"><sup>6</sup></a>.</p>
<p>- Qu'il soit libre ; car l'esclave est occupé par les droits de son maître.</p>
<p>- Qu'il soit musulman ; car l'Islam est une condition pour la probité (l'équité), et parce qu'il est requis de ne pas élever le mécréant, or lui confier la magistrature constituerait pour lui une élévation et un honneur.</p>
<p>- Qu'il soit probe (<em>intègre, honnête</em>) ; il n'est donc pas permis de nommer un pervers (Fâsiq), conformément à la parole de Allah l'Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿يَا أَيُّهَا الَّذِينَ آمَنُوا إِن جَاءَكُمْ فَاسِقٌ بِنَبَإٍ فَتَبَيَّنُوا﴾ [الحجرات: ٦]</span></p>
<p><strong>﴾ Ô vous qui avez cru ! Si un pervers vous apporte une nouvelle, voyez bien clair [vérifiez-en l'authenticité] ﴿</strong> [Al-Hujurât : 6]. Et si son information n'est pas acceptée, le refus de son jugement est, à plus forte raison, prioritaire.</p>
<p>- Qu'il soit doté de l'ouïe ; car le sourd n'entend pas la parole des deux parties en litige.</p>
<p>- Qu'il soit doté de la vue ; car l'aveugle ne distingue pas le demandeur du défendeur.</p>
<p>Et Cheikh Al-Islam Ibn Taymiyyah a dit <a href="#fn7" class="footnote-ref" id="fnref7" role="doc-noteref"><sup>7</sup></a>: <em>« L'analogie de l'école juridique (le Madhhab) veut que sa nomination soit autorisée, tout comme son témoignage est autorisé. En effet, il ne lui manque que la connaissance physique de l'adversaire, et il n'en a pas besoin ; il juge plutôt sur la base d'une description, tout comme [le Prophète] David a jugé entre les deux anges. Il convient donc que cela soit absolument valide, et il peut être informé de l'identité des témoins et des adversaires de la même manière qu'il prend connaissance du sens de leurs propos par la traduction, car la connaissance de sa parole ou de sa personne physique revient au même... »</em>. Fin de citation.</p>
<p>- Et il est conditionné pour le juge qu'il soit doué de parole ; car le muet ne peut pas prononcer le jugement, et sa langue des signes n'est pas comprise par tout le monde.</p>
<p>- Qu'il soit un moujtahid (capable d'effort d'interprétation juridique), ne serait-ce qu'au sein de son école dans laquelle il suit un des imams ; de sorte qu'il soit capable d'y distinguer l'avis prépondérant (Râjih) de l'avis minoritaire ou faible (Marjoûh).</p>
<p>Cheikh al-Islâm Ibn Taymiyyah — qu'Allah lui fasse miséricorde — a dit <a href="#fn8" class="footnote-ref" id="fnref8" role="doc-noteref"><sup>8</sup></a>: <em>« Et ces conditions sont prises en considération selon la possibilité. Il est obligatoire de confier l'autorité au meilleur [disponible], puis au suivant par ordre de mérite (le plus exemplaire puis le plus exemplaire). C'est ce qu'indiquent les propos d'Ahmad et d'autres. Ainsi, on nommera le plus utile des deux pervers (Fâsiq) et le moins nuisible d'entre eux, ou encore le plus juste des deux imitateurs (Muqallid) et celui des deux qui maîtrise le mieux l'imitation. »</em></p>
<p>L'auteur du livre <em>« Al-Furû' »</em> a dit <a href="#fn9" class="footnote-ref" id="fnref9" role="doc-noteref"><sup>9</sup></a>: <em>« Et il en est ainsi, comme il l'a dit. »</em></p>
<p>Et il est dit dans <em>« Al-Insâf »</em> concernant la nomination de l'imitateur (Al-Mouqallid) <a href="#fn10" class="footnote-ref" id="fnref10" role="doc-noteref"><sup>10</sup></a>: <em>« Et c'est ainsi que l'on procède (la pratique est basée sur cela) depuis une longue période ; autrement, les jugements et les affaires des gens se retrouveraient paralysés. »</em></p>
<p>Et Ibn al-Qayyim a mentionné que le Mujtahid est celui qui savant (qui a la science) du Livre (le Coran) et de la Sunnah. Le fait qu'il imite parfois un autre n'est pas incompatible avec son statut de Mujtahid ; ainsi, tu ne trouveras aucun des imams sans qu'il n'ait imité, dans certains jugements, quelqu'un de plus savant que lui.</p>
