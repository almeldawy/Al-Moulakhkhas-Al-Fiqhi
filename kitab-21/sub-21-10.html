  <!-- ▼ CONTENU DU CHAPITRE ▼ -->
  <template id="chapter-content">
<p>⁕ Le serment fait partie de l'ensemble des voies de procédure judiciaire ; en effet, le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="rtl">«وَاليَمِينُ عَلَىٰ مَنْ أَنْكَرَ»</span></p>
<p><em><strong>« Et le serment incombe à celui qui nie »</strong></em> <a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a>.</p>
<p>⁕ Le serment est requis de la part du défendeur (celui qui nie) lorsque le demandeur ne possède pas de preuve flagrante . Ce serment met fin au litige lors de la dispute, mais il ne supprime pas le droit en soi. Ainsi, si le demandeur parvient à produire une preuve par la suite, cela lui est permis, sa preuve est entendue, et le jugement est rendu en sa faveur. De même, si celui qui a juré revient sur son serment après l'avoir prêté et s'acquitte du droit qu'il devait, cela est accepté de sa part, et il devient licite pour le demandeur de le prendre.</p>
<p>⁕ Le domaine d'application du serment concerne exclusivement les affaires liées aux droits des êtres humains ; c'est dans ce cadre qu'on demande de prêter serment. Quant aux droits d'Allah le Très-Haut, on ne demande pas de serment à leur sujet, comme pour les actes d'adoration et les peines légales ( <span dir="rtl">الحدود</span> - Al-Hudûd). Par exemple, si une personne dit : « J'ai versé ma Zakat » ou « ce que je devais comme expiation ou vœu », cela est accepté de sa part et on ne lui demande pas de jurer. De même, on ne demande pas de prêter serment à celui qui nie un acte passible d'une peine légale parmi les peines d'Allah, car il est recommandé de dissimuler ces fautes, et parce que si l'individu les confessait puis revenait sur ses aveux, son rétractation serait acceptée et il serait relâché. Par conséquent, le fait de ne pas lui demander de jurer en l'absence d'aveu est encore plus évident.</p>
<p>⁕ Le serment n'est pas pris en considération dans les litiges relatifs aux droits des êtres humains, sauf s'il est ordonné par le juge après la demande du plaignant, et il doit correspondre précisément à la réponse apportée au demandeur.</p>
<p>⁕ La prestation du serment doit obligatoirement avoir lieu au sein de l'assemblée du juge (le tribunal).</p>
<p>⁕ Le serment ne peut être prêté que par Allah le Très-Haut, car jurer par un autre qu'Allah constitue un acte de polythéisme (Chirk).</p>
<p>⁕ Il suffit, pour prêter serment, de prononcer le Nom de Majesté (Lafdh al-Jalâlah). Ainsi, s'il dit : « Par Allah ! » (Wallâhi), cela suffit. Car cette forme de serment figure dans le Livre d'Allah le Très-Haut, comme dans Sa parole :</p>
<p class="ar"><span dir="rtl">﴿وَأَقْسَمُواْ بِٱللَّهِ جَهْدَ أَيْمَٰنِهِمْ﴾ [الأنعام: ١٠٩]</span></p>
<p><strong>﴾ Et ils jurent par Allah de toute la force de leurs serments ﴿</strong> [Al-An'âm: 109],</p>
<p class="ar"><span dir="rtl">﴿فَيُقْسِمَانِ بِٱللَّهِ﴾ [المائدة: ١٠٦]</span></p>
<p><strong>﴾ Ils jureront alors par Allah ﴿</strong> [Al-Mâ'idah: 106]</p>
<p>ou</p>
<p class="ar"><span dir="rtl">﴿أَرْبَعُ شَهَٰدَٰتٍۭ بِٱللَّهِ﴾ [النور: ٦]</span></p>
<p><strong>﴾ quatre attestations par Allah ﴿</strong> [An-Nûr: 6].</p>
<p>De plus, le Nom de Majesté (Allah) est le nom propre par excellence d'Allah le Très-Haut, et nul autre que Lui ne peut être nommé ainsi.</p>
<p>⁕ Le serment n'est accentué (ou solennisé) que dans les affaires d'une importance majeure, comme un crime n'entraînant pas le talion (Qawad) ou pour une question d'affranchissement d'esclave. Le juge a alors le droit d'en accentuer les termes, en faisant dire par exemple :</p>
<p class="ar"><span dir="rtl">" وَاللهِ الَّذِي لَا إِلَٰهَ إِلَّا هُوَ، عَالِمِ الغَيْبِ وَالشَّهَادَةِ، الطَّالِبِ، الغَالِبِ، الضَّارِّ، النَّافِعِ، الَّذِي يَعْلَمُ خَائِنَةَ الأَعْيُنِ وَمَا تُخْفِي الصُّدُورُ. "</span></p>
<p><em>« Par Allah, en dehors de qui il n'y a pas d'autre divinité digne d'adoration, le Connaisseur du visible et de l'invisible, Celui qui demande des comptes, le Dominant, Celui qui peut nuire, le Bénéfique, Celui qui connaît la trahison des yeux et ce que cachent les poitrines. »</em></p>
<p>⁕ Quiconque est redevable d'un droit envers un groupe de personnes doit prêter un serment distinct pour chacune d'elles, car le droit de chacun est indépendant de celui de l'autre. Sauf s'ils acceptent un seul et unique serment, auquel cas celui-ci suffit, puisque le droit leur appartient et qu'ils ont consenti à renoncer à la multiplicité des serments.</p>
