<p>⁕ <strong>La correspondance d'un juge à un autre juge peut s'avérer nécessaire.</strong> En effet, quiconque détient un droit dans une autre ville que la sienne ne peut le prouver et le réclamer qu'en le faisant valoir auprès du juge de cette ville, et en écrivant à ce dernier à ce sujet afin de finaliser le reste des procédures judiciaires. En effet, il est parfois difficile de faire voyager les témoins, et il se peut qu'ils soient connus (et jugés crédibles) dans une ville et pas dans une autre. Ainsi, l'établissement du droit devient impossible sans la correspondance d'un juge à un autre juge.</p>
<p>⁕ <strong>La communauté (Oumma) est unanime quant à l'acceptation de la correspondance d'un juge à un autre juge pour établir les droits et les appliquer.</strong> [Le prophète] Souleymane (Salomon), que la paix soit sur lui, a écrit à Balqîs (la reine de Saba), et le Prophète Mouhammad <span dir="rtl">ﷺ</span> a écrit au Négus (d'Abyssinie), à Héraclius (l'empereur byzantin) et à Khosro (l'empereur perse) pour les inviter à l'Islam. De même, le Prophète <span dir="rtl">ﷺ</span> correspondait avec ses gouverneurs et ses collecteurs de la Zakat. Tout cela prouve la légitimité de la mise en pratique de ce procédé.</p>
<p>⁕ <strong>Elle est acceptée pour tout droit relevant des êtres humains, mais elle n'est pas acceptée concernant les peines légales de Dieu (Houdoud)</strong>, telles que la peine pour adultère/fornication ou pour la consommation de vin (alcool). En effet, les droits d'Allah - qu'Il soit Exalté - reposent sur la dissimulation (des péchés) et sur l'annulation des peines en cas de doute.</p>
<p>⁕ <strong>La correspondance d'un juge à un autre juge est de deux types :</strong></p>
<p><strong>Le premier type :</strong> Il s'agit de ce que le juge expéditeur a déjà jugé, afin que le juge destinataire l'exécute. Cela est accepté, même si le juge expéditeur et le juge destinataire se trouvent dans la même ville, car le jugement d'un magistrat doit impérativement être appliqué en toute circonstance. Dans le cas contraire, l'application des lois s'interromprait et les litiges se multiplieraient.</p>
<p><strong>Le second type :</strong> Que le juge écrive à un autre juge au sujet de ce qui a été établi auprès de lui afin que ce dernier rende son jugement en fonction de cela.</p>
<p>Pour que ce type soit accepté, il est conditionné que la distance séparant l'expéditeur du destinataire soit égale ou supérieure à la distance permettant le raccourcissement des prières (<em>Masâfat Qasr</em>). En effet, cela s'apparente au transfert d'un témoignage vers le juge destinataire, ce qui n'est pas permis en cas de stricte proximité géographique.</p>
<p><strong>La formule de l'établissement (des faits) consiste à dire :</strong> « Il a été établi auprès de moi que tel individu doit à tel autre individu telle et telle chose. »</p>
<p><strong>L'établissement (des faits) n'est pas un jugement en soi</strong>, mais plutôt une information attestant que les faits ont été établis.</p>
<p><strong>Le Cheikh a dit :</strong> <em>« Il est permis de transférer cela à une distance de raccourcissement ou plus, même si le juge auprès de qui les faits ont été établis n'est pas d'avis qu'il est permis de juger par cela. En effet, celui auprès de qui la chose a été établie ne fait qu'informer du constat établi chez lui. Quant au magistrat à qui cette preuve est transmise, il lui revient de juger d'après celle-ci s'il considère qu'elle est valide. Il est également permis que le juge destinataire ne soit pas nommément désigné, comme s'il écrivait : "À tout juge parmi les juges des musulmans à qui ma lettre parviendra", sans désignation spécifique. Quiconque reçoit cette lettre est alors tenu de l'accepter, car il s'agit de la correspondance d'un magistrat dans le cadre de sa juridiction parvenue à un autre magistrat ; son acceptation est donc obligatoire, tout comme s'il avait écrit à un destinataire précis. »</em></p>
<p>⁕ <strong>Il est également requis, pour l'acceptation de la correspondance d'un juge à un autre juge, que le juge expéditeur prenne à témoin deux témoins intègres (<em>'Adlayn</em>)</strong> qui en maîtrisent parfaitement le sens ainsi que ce qui s'y rapporte en termes de jugement. Ceci est un avis. <strong>L'autre avis soutient qu'il est permis de mettre en pratique la correspondance du juge à un autre juge s'il reconnaît son écriture</strong>, même s'il n'a pas pris de témoins. C'est d'ailleurs une version rapportée de l'Imam Ahmad. De nos jours, il est possible de se contenter du sceau officiel du tribunal en guise de témoignage.</p>
<p>L'Imam Ibn Al-Qayyim (qu'Allah lui fasse miséricorde) a dit <a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a>: <em>« Les Compagnons étaient unanimes sur la mise en pratique des écrits, tout comme les califes après eux. Le recours des gens dans la science ne repose d'ailleurs que sur les livres ; si l'on n'agissait pas selon ce qu'ils contiennent, la législation (Shari'ah) se retrouverait paralysée. »</em></p>
<p>Et il [Ibn Al-Qayyim] a dit <a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a>: <em>« Les califes, les juges, les gouverneurs et les fonctionnaires n'ont cessé de se baser sur les correspondances qu'ils s'échangeaient, sans pour autant faire attester le contenu par le porteur de la lettre, ni même lui en faire la lecture. Telle est la pratique des gens depuis l'époque de leur Prophète jusqu'à nos jours. »</em></p>
<p>Il a dit <a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a>: <em>« Le but recherché est l'obtention de la certitude quant à l'attribution de l'écriture à son auteur. Dès lors qu'elle est reconnue et avérée, cela équivaut à lui attribuer une parole prononcée. Certes, Allah a placé dans l'écriture de chaque scribe ce qui la distingue de celle d'un autre, tout comme se distinguent sa voix et son apparence physique. Les gens apportent ainsi des témoignages sans le moindre doute sur le fait que telle pièce comporte l'écriture de telle personne. »</em></p>
<p>Le Cheikh Taqî Ad-Dîn [Ibn Taymiyyah] a dit <a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a>: <em>« Quiconque voit son écriture reconnue à travers un aveu, la rédaction d'un acte, un contrat ou un témoignage, alors on applique ce qu'elle contient... »</em> Fin de citation.</p>
<p>⁕ <strong>Quant au témoignage sur un témoignage (<em>Ash-Shahâdah 'alâ Ash-Shahâdah</em>) :</strong> Cela consiste à ce qu'une personne dise à une autre : « Atteste de mon témoignage sur telle chose », ou « Atteste que je témoigne de telle chose », ou toute formule similaire. Ce procédé revêt le sens d'une procuration (délégation). Le témoin d'origine est appelé <strong>"le témoin principal" (<em>Shâhid al-Asl</em>)</strong>, et son substitut est appelé <strong>"le témoin secondaire" (<em>Shâhid al-Far'</em>)</strong>.</p>
<p>Abû 'Ubayd a dit : <em>« Les savants des gens du Hedjaz et de l'Irak sont unanimes sur la validité et l'application du témoignage sur un témoignage concernant les affaires de biens (financières). »</em></p>
<p>L'Imam Ahmad a été interrogé au sujet du témoignage sur un témoignage et il a répondu : <em>« Il est parfaitement autorisé. »</em></p>
<p><strong>De plus, le besoin y invite fortement.</strong> En effet, si ce type de témoignage n'était pas accepté, l'attestation des fondations pieuses (<em>Al-Wouqoûf</em>) s'en trouverait entravée, de même que tout ce dont la preuve tarde à être établie auprès du juge, ou encore le cas où les témoins d'origine viendraient à mourir. Cela causerait un tort immense aux gens ainsi qu'une gêne considérable. Il est donc devenu obligatoire de l'accepter, au même titre que le témoignage principal.</p>
<p>⁕ <strong>L'acceptation du témoignage sur un témoignage est soumise à plusieurs conditions :</strong></p>
<p><strong>Premièrement :</strong> Que le témoin principal donne l'autorisation au témoin secondaire, car ce procédé s'apparente à une délégation, et nul ne peut se substituer à un autre sans son consentement.</p>
<p><strong>Deuxièmement :</strong> Que le litige porte sur une matière où la correspondance d'un juge à un autre juge est acceptée, à savoir les droits des êtres humains, à l'exclusion des droits d'Allah — qu'Il soit Exalté.</p>
<p><strong>Troisièmement :</strong> Que le témoignage du témoin principal soit rendu impossible en raison d'un décès, d'une maladie, d'une absence impliquant une distance de raccourcissement des prières (<em>Masâfat Qasr</em>), ou de la crainte d'une autorité injuste (<em>Sultân</em>) ou autre.</p>
<p><strong>Quatrièmement :</strong> Que l'empêchement (l'excuse valable) du témoin principal persiste jusqu'au prononcé du jugement.</p>
<p><strong>Cinquièmement :</strong> Le maintien de l'intégrité (<em>'Adâlah</em>) du témoin principal et du témoin secondaire jusqu'au prononcé du jugement.</p>
<p><strong>Sixièmement :</strong> Que le témoin secondaire désigne précisément le témoin principal dont il a reçu et pris la charge du témoignage.</p>
<p>⁕ <strong>Quant à la rétractation du témoignage (<em>Ar-Roujoû' 'an Ash-Shahâdah</em>) :</strong></p>
<p><strong>- Si les témoins dans une affaire financière se rétractent après le prononcé du jugement :</strong> Celui-ci n'est pas annulé, car il est d'ores et déjà scellé et le droit réclamé est définitivement acquis au bénéficiaire du verdict. Les témoins sont alors suspectés de vouloir casser le jugement. Le jugement est donc exécuté, mais ils se voient contraints à la réparation financière (<em>Al-Damân</em>) : ils doivent rembourser la valeur des biens faisant l'objet du témoignage, car ils ont indûment privé le propriétaire légitime de ses biens et se sont interposés entre lui et son droit.</p>
<p><strong>- Si le juge a rendu son verdict sur la base d'un seul témoin et du serment (du plaignant), puis que le témoin se rétracte :</strong> Ce témoin doit rembourser l'intégralité de la somme. En effet, c'est son témoignage qui constituait l'argument juridique fondant la plainte, tandis que le serment n'est que la parole de la partie adverse. Or, la parole d'une partie n'est pas recevable contre son adversaire, elle n'est qu'une condition nécessaire au prononcé du jugement.</p>
<p><strong>- En revanche, si les témoins se rétractent avant le prononcé du jugement :</strong> Le témoignage est purement et simplement annulé ; il n'y a alors ni jugement rendu, ni réparation financière à verser. Et Allah est Le Plus Savant.</p>
