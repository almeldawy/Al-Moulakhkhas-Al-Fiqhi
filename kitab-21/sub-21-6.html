<p>⁕ La preuve du partage entre les associés d'après le Livre (le Coran), la Sunnah et le consensus (<em>al-Ijmâ'</em>) :</p>
<p>- Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿وَنَبِّئْهُمْ أَنَّ الْمَاءَ قِسْمَةٌ بَيْنَهُمْ﴾ [القمر: ٢٨]</span></p>
<p><strong>﴾ Et informe-les que l'eau sera partagée entre eux ﴿</strong> [Al-Qamar : 28]</p>
<p>Et le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿وَإِذَا حَضَرَ الْقِسْمَةَ أُولُو الْقُرْبَىٰ...﴾ الآية [النساء: ٨]</span></p>
<p><strong>﴾ Et lorsque les proches parents assistent au partage... ﴿</strong> [An-Nisâ' : 8]</p>
<p>- Le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="rtl">«الشُّفْعَةُ فِيمَا لَمْ يُقْسَمْ»</span></p>
<p><em><strong>« Le droit de préemption (al-shuf'ah) s'applique à ce qui n'a pas été partagé »</strong></em><a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a>, et il <span dir="rtl">ﷺ</span> partageait les butins de guerre.</p>
<p>- Plus d'un savant a mentionné le consensus à ce sujet.</p>
<p>- Et la nécessité l'impose, car il n'y a aucun moyen d'attribuer aux ayants droit la part qui leur revient sur un bien commun si ce n'est par le partage.</p>
<p>⁕ Le partage consiste à individualiser (séparer) les parts les unes des autres.</p>
<p>⁕ Et il est de deux types : le partage par consentement mutuel (<em>qismatu tarâdin</em>) et le partage par contrainte (judiciaire) (<em>qismatu ijbâr</em>).</p>
<p>⁕ <strong>Le premier type : Le partage par consentement mutuel (Qismat at-Tarâdî) :</strong></p>
<p>— C’est celui sur lequel l’ensemble des associés doivent obligatoirement s'accorder, et il n'est pas permis sans leur consentement. Il s'agit du partage qui ne peut s'accomplir qu'en entraînant un préjudice (un dommage), ne serait-ce que pour l'un des associés, ou en versant une compensation financière de la part d'un associé à un autre. Ce cas se présente pour les petites maisons, les boutiques étroites, ou les terrains dont les parties diffèrent en raison d'une construction ou d'arbres situés sur l'une d'elles, ou encore parce qu'une partie suscite un intérêt spécifique et exclusif par rapport au reste.</p>
<p>— Ce type de bien commun ne peut donc être partagé qu'avec l'accord des associés et leur consentement mutuel, en raison de la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«لَا ضَرَرَ وَلَا ضِرَارَ»</span></p>
<p><em>« <strong>Il ne doit y avoir ni préjudice subi, ni préjudice infligé.</strong> »</em><a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a>, rapporté par Ahmad et d'autres. Ce hadith prouve, par sa portée générale, qu'il est interdit de partager un bien dont la division cause un tort, sauf s'il y a consentement mutuel.</p>
<p>— Ce type de partage prend le statut juridique de la vente : il est possible de restituer une part si elle comporte un vice caché, et les options de rétractation (le droit d'option lors de la session contractuelle [<em>Khiyâr al-Majlis</em>], l'option de condition [<em>Khiyâr ach-Chart</em>], etc.) s'y appliquent. De plus, l'associé qui refuse ce partage ne peut y être contraint. Cependant, dès lors que l’un des associés demande la vente de ce bien commun, celui qui s'y opposait est alors contraint de l'accepter. S'il refuse obstinément, le juge procède à la vente du bien au nom des deux, puis partage le prix de la vente entre eux proportionnellement à leurs parts respectives.</p>
<p>— Le critère (la règle de définition) du préjudice qui empêche ce partage est la diminution de la valeur marchande du bien suite à sa division, que les associés puissent en tirer profit une fois partagé ou non. Ainsi, le simple fait qu'ils ne puissent plus tirer profit du bien une fois divisé n'est pas le facteur retenu comme préjudice bloquant [si la valeur globale ne baisse pas].</p>
<p>⁕ <strong>Le deuxième type : Le partage contraignant (Qism al-Ijbâr) :</strong></p>
<p>— C'est le partage dont la division ne cause aucun préjudice et ne nécessite le versement d'aucune compensation financière de la part d'un associé à un autre. Il est nommé ainsi parce que le juge contraint l'associé qui s'y oppose dès lors que toutes ses conditions sont réunies. Cela s'applique par exemple à un village, un verger, une grande demeure, un vaste terrain, de grandes boutiques, ainsi qu'aux biens mesurables (au volume) ou pesables (au poids) de même nature.</p>
<p>— Trois conditions sont requises pour contraindre l'associé qui refuse ce partage : que la copropriété des associés soit légalement prouvée auprès du juge, qu'il soit prouvé que ce partage ne cause aucun préjudice, et qu'il soit prouvé qu'il est possible d'équilibrer (de répartir équitablement) les parts à même le bien partagé sans qu'il soit nécessaire d'y ajouter une compensation financière externe.</p>
<p>— Lorsque ces conditions sont remplies et que l'un des associés demande le partage, son coassocié y est alors contraint, même s'il s'y opposait initialement. En effet, le partage met fin au préjudice résultant de la copropriété et permet à chacun de disposer librement de sa part et d'en jouir — par exemple en y effectuant des plantations ou des constructions —, ce qui lui était impossible de faire tant que la copropriété subsistait.</p>
<p>— Si l'un des associés est juridiquement incapable (mineur ou non pleinement lucide), son tuteur légal procède au partage en son nom. S'il est absent, le juge effectue le partage à sa place à la demande de son associé.</p>
<p>— Ce partage consiste en réalité en une simple individualisation (séparation) du droit de l'un des deux associés par rapport à l'autre. Il ne prend pas le statut juridique de la vente, car il diffère de celle-ci dans ses règles d'application.</p>
<p>— Il est permis aux associés de procéder au partage par eux-mêmes, ou par l'intermédiaire d'un répartiteur (un expert chargé du partage) qu'ils désignent eux-mêmes, ou encore en demandant au juge d'en nommer un.</p>
<p>— L'ajustement (l'égalisation) des parts se fait par portions [quantitatives] si les éléments à diviser sont équivalents, comme pour les biens mesurables au volume ou pesables au poids et qui sont homogènes. En revanche, l'ajustement se fait par la valeur marchande si les parties du bien à diviser sont hétérogènes ; dans ce cas, la part constituée de biens de qualité inférieure sera plus grande en quantité que la part constituée de biens de qualité supérieure. Si l'ajustement ne peut se faire ni par portions quantitatives ni par la valeur marchande, on procède alors à un ajustement par soulte (compensation financière [<em>Radd</em>]) : on impose à celui qui reçoit la part de qualité supérieure ou la plus grande portion de verser une somme d'argent à celui qui reçoit la part de qualité inférieure ou la plus petite portion.</p>
<p>— Une fois qu'ils ont procédé au partage ou au tirage au sort, le partage devient définitif et exécutoire. En effet, le répartiteur est assimilé à un juge, et le tirage au sort est assimilé à une sentence judiciaire dont l'application est obligatoire. Quelle que soit la méthode de tirage au sort employée — par des cailloux ou autre —, elle est valide. Cependant, la méthode la plus prudente consiste à écrire le nom de chaque associé sur un morceau de papier (un bulletin), puis à les rassembler, les enrouler et les confier à une personne qui n'a pas assisté à l'opération et ne les a pas vus. On lui ordonne alors de tirer les bulletins et de les placer sur les différentes parts : celui dont le nom se trouve sur une part se la voit attribuer.</p>
<p>— Et si l'un d'eux donne le choix à l'autre [de choisir sa part], le partage devient définitif par leur consentement et leur séparation physique.</p>
<p>— Quiconque prétend qu'une erreur s'est produite dans un partage qu'ils ont effectué eux-mêmes, alors qu'ils avaient fait attester par témoins leur consentement réciproque, sa réclamation ne sera pas prise en considération. En effet, il a accepté le partage tel qu'il s'est déroulé, et son consentement vis-à-vis d'un éventuel surplus dans la part de son associé l'engage définitivement.</p>
<p>— En revanche, quiconque prétend qu'une erreur s'est produite dans un partage effectué par un répartiteur nommé par le juge ou par un répartiteur qu'ils ont eux-mêmes désigné, sa réclamation sera acceptée s'il apporte une preuve flagrante (<em>Bayyinah</em>). À défaut de preuve, la partie adverse qui conteste l'erreur devra prêter serment, car la règle de base (<em>al-Asl</em>) est l'absence d'erreur. Si le demandeur produit une preuve de l'erreur, celle-ci est acceptée et le partage est annulé (cassé). En effet, son silence initial reposait sur la présomption de compétence du répartiteur ; dès lors que la preuve de l'erreur de ce dernier est établie, il est en droit de revenir sur ce qui a fait l'objet de l'erreur.</p>
<p>— Si chacun des deux associés revendique la propriété exclusive d'une même chose en affirmant qu'elle lui appartient, ils doivent tous deux prêter serment [pour infirmer la prétention de l'autre], et le partage est annulé. Cela s'explique par le fait que l'objet du litige n'est pas sorti de leur propriété commune, et qu'aucun des deux ne dispose d'un argument prépondérant sur l'autre.</p>
<p>— Enfin, celui qui découvre dans sa part un vice caché qu'il ignorait a le choix entre l'annulation du partage (<em>Faskh</em>) ou la conservation de sa part tout en percevant une compensation financière pour la perte de valeur (<em>Arch</em>). En effet, l'apparition d'un vice dans sa part constitue un préjudice (un manque), il est donc mis devant le choix entre la compensation ou l'annulation, au même titre qu'un acheteur.</p>
<p>Et Allah est le plus Savant.</p>
