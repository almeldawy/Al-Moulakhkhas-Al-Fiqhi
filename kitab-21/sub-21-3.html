<p>⁕ Ce qui est entendu par "éthique" (bienséances) ici, ce sont les traits de caractère qu'il convient au juge d'adopter.</p>
<p>L'imam Ahmad — qu'Allah lui fasse miséricorde — a dit : <em>« Le bon comportement consiste à ne pas se mettre en colère et à ne pas nourrir de rancœur. »</em></p>
<p>L'imam Ibn al-Qayyim — qu'Allah lui fasse miséricorde — a dit <a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a>: <em>« Le juge a besoin de trois choses sans lesquelles son jugement ne peut être valide : la connaissance des preuves juridiques (al-Adillah), des causes/faits (al-Asbâb) et des éléments de preuve clairs (al-Bayyinât).</em></p>
<ul>
<li><blockquote>
<p><em>Les preuves juridiques lui font connaître le statut légal général (al-Hukm ach-Char'î al-Kullî).</em></p>
</blockquote></li>
<li><blockquote>
<p><em>Les causes/faits lui font connaître si ce statut s'applique ou non à ce cas précis.</em></p>
</blockquote></li>
<li><blockquote>
<p><em>Les éléments de preuve clairs lui indiquent la voie à suivre pour trancher lors d'un litige. Et s'il se trompe sur l'un de ces trois éléments, il commet une erreur dans son jugement. »</em> Fin de citation.</p>
</blockquote></li>
</ul>
<p>⁕ Il convient également au juge d'être fort sans être violent, afin que l'injuste ne cherche pas à profiter de lui , et d'être doux sans être faible, afin que celui qui est dans son bon droit ne soit pas intimidé par lui .</p>
<p>Cheikh Taqî ad-Dîn Ibn Taymiyyah — qu'Allah lui fasse miséricorde — a dit <a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a>: <em>« Certes, l'autorité repose sur deux piliers : la force et l'honnêteté. Et il convient au juge d'être indulgent (patient/calme), afin qu'il ne s'irrite pas des propos d'un plaideur, ce qui l'empêcherait de juger. L'indulgence (al-Hilm) est la parure de la science, son éclat et sa beauté, tandis que son opposé est l'irréflexion, la précipitation, l'emportement, la hâte et le manque de stabilité. Il lui convient également d'être doté de retenue (c'est-à-dire : de calme et de pondération), de peur que sa précipitation ne l'amène à ce qui n'est pas convenable. Il doit être doté de perspicacité, afin que certains plaideurs ne le trompent pas. Il doit être intègre/chaste (c'est-à-dire : s'abstenir de tout ce qui est illicite). Il doit être bien informé des jugements des magistrats qui l'ont précédé. Enfin, son tribunal (le lieu où il siège) doit se situer au centre de la ville, si cela est possible, afin que les habitants de la ville soient à égalité de distance pour s'y rendre. Il n'y a aucun mal à rendre la justice au sein de la mosquée ; il a d'ailleurs été rapporté d'après 'Umar, 'Uthmân et 'Alî qu'ils jugeaient dans la mosquée. De plus, il est obligatoire pour le juge d'être parfaitement équitable entre les deux parties adverses : dans son regard, dans sa parole, dans la façon de les installer assis, ainsi que lors de leur entrée chez lui. Abû Dâwûd a rapporté d'après Ibn az-Zubayr qui a dit</em> <a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a><em>: « Le Messager d'Allah <span dir="rtl">ﷺ</span> a jugé que les deux parties adverses doivent s'asseoir devant le juge ». Il est donc obligatoire qu'il soit équitable envers eux dans sa manière de les faire asseoir, dans l'attention qu'il leur porte du regard et dans sa façon de s'adresser à eux. »</em></p>
<p>L'imam Ibn al-Qayyim a dit <a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a>: <em>« Il a été interdit d'élever l'un des deux plaideurs au-dessus de l'autre, de lui accorder une attention exclusive, de le consulter en privé, ou de se lever pour lui à l'exclusion de son adversaire. Tout cela afin que cela ne devienne pas un moyen de briser le cœur de l'autre partie, de l'affaiblir dans la présentation de son argument et de paralyser sa langue. De même, [le juge] ne doit pas se montrer austère ou hostile envers les plaideurs, car une telle attitude affaiblit leur moral, brise leur cœur et rend leurs langues muettes, les empêchant d'exposer leurs arguments. »</em></p>
<p>⁕ Il est interdit au juge de chuchoter un secret à l'un des deux plaideurs, de lui souffler son argument, de l'héberger (comme invité), ou de lui enseigner comment formuler sa plainte, à moins que le plaideur n'omette un élément obligatoire et indispensable à la recevabilité de sa demande.</p>
<p>⁕ Il convient au juge de faire assister les juristes (<em>al-Fuqahâ'</em>) à ses audiences et de les consulter, si possible, sur les questions complexes qui lui posent problème. Dès que le jugement lui apparaît clairement, il tranche ; sinon, il le reporte jusqu'à ce qu'il s'éclaircisse.</p>
<p>⁕ Il est interdit au juge de rendre un jugement lorsqu'il est pris d'une grande colère, en raison du hadith authentique faisant l'unanimité (<em>Muttafaqun 'alayhi</em>) dans lequel le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="rtl">« لَا يَقْضِيَنَّ حَاكِمٌ بَيْنَ اثْنَيْنِ وَهُوَ غَضْبَانُ »</span></p>
<p><em><strong>« Qu'aucun juge ne tranche entre deux personnes alors qu'il est en colère »</strong></em> <a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a>. De plus, la colère perturbe son cœur et son esprit, l'empêche d'avoir une parfaite compréhension, fait obstacle à un examen approfondi de l'affaire et lui occulte la voie de la science et de la rectitude.</p>
<p>⁕ Et l'on applique par analogie à la colère tout ce qui perturbe la réflexion ; comme l'état de faim, de soif, de profonde préoccupation (souci intense), d'ennui (ou de lassitude), de somnolence, de froid douloureux, de chaleur incommodante, ou le fait de retenir une envie d'uriner ou d'aller à la selle. En effet, tout cela occupe l'esprit et détourne la réflexion qui permet, la plupart du temps, de parvenir à la vérité. Ces situations ont donc le même sens (et le même statut) que la colère.</p>
<p>⁕ Il est interdit au juge d'accepter un pot-de-vin (<em>Richwah</em>), en raison du hadith d'Ibn 'Amr qui a dit :</p>
<p class="ar"><span dir="rtl">« لَعَنَ رَسُولُ اللَّهِ ﷺ الرَّاشِيَ وَالمُرْتَشِيَ »</span></p>
<p><em><strong>« Le Messager d'Allah <span dir="rtl">ﷺ</span> a maudit celui qui donne un pot-de-vin et celui qui l'accepte »</strong></em>. At-Tirmidhî a dit : « C'est un hadith bon et authentique (<em>Hasan Sahîh</em>) »<a href="#fn6" class="footnote-ref" id="fnref6" role="doc-noteref"><sup>6</sup></a>.</p>
<p>⁕ Le pot-de-vin est de deux types :</p>
<ul>
<li><blockquote>
<p><strong>Le premier :</strong> qu'il reçoive [un bien] de l'une des deux parties afin de juger en sa faveur par le faux.</p>
</blockquote></li>
<li><blockquote>
<p><strong>Le second :</strong> qu'il s'abstienne de rendre le jugement de droit en faveur de celui qui le détient légitimement jusqu'à ce que ce dernier lui donne un pot-de-vin ; et cela compte parmi les plus grandes injustices.</p>
</blockquote></li>
</ul>
<p>⁕ De la même manière, il est interdit au juge d'accepter un cadeau de la part de quelqu'un qui n'avait pas pour habitude de lui en offrir avant sa nomination à la magistrature, car le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="rtl">« هَدَايَا العُمَّالِ غُلُولٌ »</span></p>
<p><em><strong>« Les cadeaux offerts aux agents de l'État sont une malversation (un gain illicite) »</strong></em>, rapporté par Ahmad <a href="#fn7" class="footnote-ref" id="fnref7" role="doc-noteref"><sup>7</sup></a>. De plus, accepter le cadeau de quiconque n'avait pas pour coutume de lui en faire est un moyen (qui conduit) à satisfaire les intérêts personnels de ce dernier.</p>
<p>⁕ Il est détestable (<em>Makrûh</em>) pour le juge de pratiquer lui-même la vente et l'achat, sauf s'il mandate un intermédiaire dont on ignore qu'il agit pour son compte. Cela est requis par crainte du favoritisme, car le favoritisme dans la vente et l'achat est comparable au cadeau.</p>
<p>⁕ Le juge ne doit pas rendre un verdict en sa propre faveur, ni en faveur d'une personne dont le témoignage ne serait pas accepté en sa faveur, comme ses parents (père et mère), ses enfants ou son épouse. Il ne doit pas non plus rendre un verdict contre son ennemi. Cela s'explique par la présence d'une présomption de partialité (suspicion) dans ces différentes situations. Dès qu'une affaire se présente concernant le juge lui-même ou une personne dont le témoignage n'est pas accepté en sa faveur, il doit la renvoyer à un autre [juge]. En effet, 'Umar a cité Ubay en justice devant Zayd ibn Thâbit ; 'Alî a cité un homme d'Irak en justice devant Chourayh ; et 'Uthmân a cité Talhah en justice devant Joubayr ibn Mouti'm — qu'Allah les agrée tous.</p>
<p>⁕ Il est recommandé au juge d'examiner en priorité les affaires dont la situation des protagonistes exige une sentence rapide, à l'instar des affaires des détenus, des litiges concernant les mineurs parmi les orphelins et les personnes atteintes de folie, suivis des affaires liées aux biens de mainmorte (<em>Awqâf</em>) ainsi qu'aux testaments qui ne disposent d'aucun tuteur (administrateur).</p>
<p>⁕ Aucun des jugements rendus par le juge ne peut être annulé, sauf s'il contredit le Livre (le Coran) et la Sunnah, ou s'il contredit un consensus général absolu (<em>Ijmâ' Qat'î</em>). Tout jugement se trouvant dans ce cas de figure doit obligatoirement être annulé en raison de sa violation du Livre, de la Sunnah ou du consensus.</p>
<p>À travers ce rapide panorama de l'éthique du juge, s'illustre la parfaite justice du système judiciaire en Islam, ainsi que le niveau d'excellence élevé auquel se hissent les magistrats musulmans, un niveau que l'ensemble des systèmes juridiques terrestres est incapable d'égaler ou même d'approcher. Et Dieu le Très-Grand a dit la vérité :</p>
<p class="ar"><span dir="rtl">﴿ أَفَحُكْمَ الْجَاهِلِيَّةِ يَبْغُونَ وَمَنْ أَحْسَنُ مِنَ اللَّهِ حُكْمًا لِّقَوْمٍ يُوقِنُونَ ﴾ [المائدة : ٥٠] .</span></p>
<p><strong>﴾ Est-ce donc le jugement du temps de l'ignorance qu'ils cherchent ? Et qui donc est meilleur qu’Allah en matière de jugement pour un peuple qui croit avec certitude ? ﴿</strong> [Sourate Al-Mâ'idah : 50].</p>
<p>Qu'Allah enlaidisse donc un peuple qui s'est détourné de cette législation divine pour lui substituer des lois sataniques.</p>
<p class="ar"><span dir="rtl">هَؤُلَاءِ قَدْ ﴿ بَدَّلُوا نِعْمَتَ اللَّهِ كُفْرًا وَأَحَلُّوا قَوْمَهُمْ دَارَ الْبَارِ ﴾ ﴿ جَهَنَّمَ يَصْلَوْنَهَا وَبِئْسَ الْقَرَارُ ﴾ [إبراهيم : ٢٨ - ٢٩] .</span></p>
<p>Ceux-là ont assurément : <strong>« ...troqué les bienfaits d'Allah contre l'ingratitude et ont installé leur peuple dans la demeure de la perdition, »</strong> <strong>« l'Enfer, dans lequel ils brûleront. Et quel détestable lieu de séjour ! »</strong> [Sourate Ibrâhîm : 28-29].</p>
