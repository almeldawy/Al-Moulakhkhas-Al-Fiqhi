  <!-- ▼ CONTENU DU CHAPITRE ▼ -->

<p>⁕ Lorsque deux parties en litige se présentent devant le juge, celui-ci les fait asseoir devant lui et dit : « Lequel de vous deux est le demandeur ? » Ou alors, il attend que le demandeur commence à parler. Une fois que ce dernier a exposé sa réclamation, le juge écoute sa demande.</p>
<p>⁕ Si celle-ci est formulée de manière correcte (selon les règles), le juge demande alors au défendeur : « Quelle est ta position vis-à-vis de cette accusation/demande ? »</p>
<ul>
<li><blockquote>
<p>S'il la reconnaît (avoue), le juge tranche en sa défaveur et donne gain de cause au demandeur.</p>
</blockquote></li>
<li><blockquote>
<p>Si le défendeur nie cette accusation, le juge dit au demandeur : « Si tu possèdes une preuve, présente-la. » Car il incombe alors au demandeur d'étayer sa demande afin que le jugement soit rendu en sa faveur. S'il produit une preuve, le juge entend le témoignage de celle-ci et rend son jugement sur cette base.</p>
</blockquote></li>
</ul>
<p>⁕ Le juge ne doit pas rendre de verdict en se basant (uniquement) sur sa connaissance personnelle (des faits) ; car cela l'exposerait au soupçon.</p>
<p>L'érudit Ibn al-Qayyim a dit <a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a>: <em>« Car cela ouvrirait la voie (serait un prétexte) pour qu'il juge de manière injuste en disant : "J'ai jugé selon ma propre connaissance". »</em></p>
<p>Il a également dit <a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a>: <em>« Il a certes été établi d'après Abû Bakr, 'Umar, 'Abd ar-Rahmân ibn 'Awf et Mu'âwiyah l'interdiction de procéder ainsi, et on ne leur connaît aucun opposant parmi les Compagnons. De plus, le maître des juges (le Prophète), que les prières de Dieu et Son salut soient sur lui, savait pertinemment des hypocrites ce qui aurait rendu leur sang et leurs biens licites, et il en avait la certitude, pourtant il n'a jamais jugé à leur sujet en se basant sur sa connaissance personnelle, malgré sa totale exemption de tout soupçon auprès d'Allah, de Ses anges et de Ses serviteurs. »</em></p>
<p>Il (Ibn al-Qayyim) a dit <a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a>: <em>« Cependant, il est permis [au juge] de rendre un jugement en se basant sur ce qui est notoire (tawâtur) à ses yeux et corroboré par les rapports, de telle sorte que la connaissance de ce fait lui soit commune ainsi qu'à autrui. Il lui est également permis de s'appuyer sur ce qu'il a entendu par voie de large notoriété (istifâdah), car cela fait partie des preuves les plus évidentes. Aucun soupçon ne peut être imputé au gouvernant (juge) lorsqu'il s'appuie sur cela ; son jugement par ce moyen est un jugement fondé sur un argument (une preuve), et non sur sa simple connaissance personnelle dans laquelle personne d'autre ne le rejoint. »</em> Fin de citation.</p>
<p>⁕ Si le demandeur dit : « Je n'ai pas de preuve », le juge l'informe alors qu'il a le droit de demander le serment de sa partie adverse. Cela s'appuie sur ce qu'ont rapporté Muslim et Abû Dâwûd : deux hommes, un Hadramite et un Kindite, se disputèrent devant le Prophète <span dir="rtl">ﷺ</span>. Le Hadramite dit : « Ô Messager d'Allah ! Cet homme s'est emparé d'une terre qui m'appartient. » Le Kindite répliqua : « C'est ma terre, elle est en ma possession et il n'y a aucun droit. » Le Prophète <span dir="rtl">ﷺ</span> dit alors au Hadramite : « As-tu une preuve ? » Il répondit : « Non. » Le Prophète dit : « Tu as alors droit à son serment. »<a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a></p>
<p>L'imam Ibn al-Qayyim a dit <a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a>: <em>« Et c'est là une règle constante de la Législation (Loi islamique). En effet, le serment incombe au défendeur lorsque le demandeur ne dispose d'aucun élément prépondérant en dehors de sa simple réclamation. Le côté du défendeur est alors plus en droit de prêter serment en raison de sa force puisée dans le principe fondamental de la présomption d'innocence (l'exonération de toute obligation). Il est ainsi la plus forte des deux parties en litige par l'application de la présomption de continuité de l'état originel (istishâb al-asl), c'est pourquoi le serment lui incombe. »</em> Fin de citation.</p>
<p>⁕ Si le demandeur exige que le défendeur prête serment, le juge fait prêter serment à ce dernier puis le laisse repartir libre, car la règle d'origine est la présomption d'innocence (l'acquittement de sa responsabilité).</p>
<p>Cependant, il est stipulé pour la validité du serment du défendeur que celui-ci soit conforme à la nature de sa réponse faite au demandeur, et qu'il intervienne après l'ordre du juge, consécutif à la demande du plaignant de lui faire prêter serment. En effet, le droit au serment appartient au demandeur, il ne peut donc être exécuté sans sa réclamation.</p>
<p>⁕ Si le défendeur refuse de prêter serment et s'y oppose, le jugement est rendu contre lui en raison de son refus (<em>al-nukûl</em>). En effet, si le demandeur ne disait pas la vérité, le défendeur aurait repoussé sa réclamation en prêtant serment. Ainsi, lorsqu'il s'en abstient, son refus constitue un indice apparent démontrant la véracité du demandeur, qui l'emporte alors sur le principe fondamental de la présomption d'innocence.</p>
<p>Le jugement par le simple refus de prêter serment (<em>al-nukûl</em>) est l'avis d'un groupe de gens de science, et c'est ainsi qu'a jugé 'Uthmân . Un autre groupe de gens de science a dit : le serment est renvoyé au demandeur (pour qu'il jure à son tour), particulièrement si sa position est forte.</p>
<p>L'imam Ibn al-Qayyim (qu'Allah lui fasse miséricorde) a dit <a href="#fn6" class="footnote-ref" id="fnref6" role="doc-noteref"><sup>6</sup></a>: <em>« Ce que la Législation a apporté, c'est que le serment est prescrit du côté de la plus forte des deux parties en litige. Ainsi, le serment est attribué à celle des deux parties dont la position s'avère prépondérante. C'est là la voie de la majorité (des savants), à l'instar des gens de Médine et des juristes du Hadith comme Ahmad, ach-Châfi'î, Mâlik et d'autres. »</em> Il a ajouté : <em>« C'est également ainsi que les Compagnons ont jugé, et c'est ce qu'Ahmad et d'autres ont jugé correct. » Il a dit aussi : « Il n'est pas improbable qu'il (le demandeur) prête serment et prenne son droit, et c'est l'avis qu'a choisi le Cheikh (Ibn Taymiyyah). »</em></p>
<p>Abû 'Ubayd a dit : <em>« Le renvoi du serment possède un fondement dans le Livre (le Coran) et la Sunnah. »</em></p>
<p>Et Cheikh al-Islâm Ibn Taymiyyah (qu'Allah lui fasse miséricorde) a dit <a href="#fn7" class="footnote-ref" id="fnref7" role="doc-noteref"><sup>7</sup></a>: <em>« Ce qui est rapporté des Compagnons concernant le refus de prêter serment (al-nukûl) et le renvoi du serment (radd al-yamîn) n'est pas contradictoire. Au contraire, chacun de ces deux cas possède un contexte propre. Ainsi, pour tout cas où il est possible au demandeur de connaître et d'avoir la science des faits : si le défendeur lui renvoie le serment, alors s'il (le demandeur) prête serment, il obtient son droit ; mais s'il ne jure pas, le jugement n'est pas rendu en sa faveur par le simple refus du défendeur. Et cela correspond au jugement rendu par 'Uthmân ibn 'Affân. »</em></p>
<p>Ibn al-Qayyim a conclu : <em>« Et cette opinion choisie par notre Cheikh est celle qui tranche définitivement le litige concernant le refus de prêter serment et son renvoi. »</em></p>
<p>Il a dit : <em>« Si le défendeur est le seul à avoir la connaissance des faits, alors s'il ne prête pas serment, le jugement est rendu contre lui. En revanche, si c'est le demandeur qui est le seul [à détenir cette connaissance], le serment lui est renvoyé ; s'il ne prête pas serment, le jugement n'est pas rendu en sa faveur sur la simple base du refus du défendeur. Cette analyse détaillée est ce qui a été dit de meilleur concernant le refus de prêter serment (al-nukûl) et son renvoi (radd al-yamîn). »</em> Fin de citation.</p>
<p>⁕ Si la partie qui nie (le défendeur) prête serment et que le juge la laisse repartir libre comme mentionné précédemment, et que le demandeur produit une preuve après cela : si ce dernier avait nié au préalable l'existence d'une telle preuve en disant : « Je n'ai pas de preuve », alors celle-ci n'est plus recevable après cela, car il s'est lui-même démenti par sa parole : « Je n'ai pas de preuve ». En revanche, s'il n'en avait pas nié l'existence (par exemple, s'il était resté silencieux à ce sujet), sa preuve est entendue et le juge rend son verdict sur cette base.</p>
<p>⁕ Le serment de celui qui nie (le défendeur) ne supprime pas le droit (fondamental de la victime), car la réclamation ne s'annule pas par le fait d'exiger le serment. Le serment du défendeur sert uniquement à mettre fin au litige (à la procédure), et non à effacer le droit. Il en est de même s'il avait dit : « Je ne sais pas si j'ai une preuve », puis qu'il la trouve par la suite ; elle est alors entendue et le jugement est rendu sur sa base, car il ne s'est pas opposé à sa propre preuve par un démenti.</p>
<p>Et Allah est Le Seul Savant.</p>
