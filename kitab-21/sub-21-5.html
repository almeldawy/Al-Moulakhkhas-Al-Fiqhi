<p>⁕ La plainte n'est valide que si elle est précisément formulée (déterminée). Si elle concerne par exemple une dette envers un défunt, le plaignant doit mentionner la mort de ce dernier, la nature de la dette, son montant, ainsi que toutes les informations par lesquelles la plainte devient claire. En effet, le jugement en dépend. C'est pourquoi le Messager d'Allah <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="rtl">«إِنَّمَا أَقْضِي عَلَى نَحْوِ مَا أَسْمَعُ»</span></p>
<p><em><strong>« Je ne juge qu'en fonction de ce que j'entends »</strong></em><a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a>. Ce hadith prouve donc l'obligation de formuler la plainte avec précision, afin que la teneur du jugement apparaisse clairement au juge.</p>
<p>⁕ De même, la plainte n'est valide que si l'objet de la réclamation (l'objet du litige) est connu. Elle n'est pas valable s'il est inconnu (indéterminé) ; il doit impérativement s'agir d'une chose connue, afin que la contrainte à son exécution soit applicable si le droit est établi. Font exception à cela les plaintes portant sur ce qui est juridiquement valable tout en étant indéterminé, comme le testament portant sur « une partie » de ses biens, ou le fait de donner « un de ses esclaves » en guise de dot, ou ce qui y ressemble. Dans de tels cas, la plainte est valide, même si l'objet est indéterminé.</p>
<p>⁕ Il est également obligatoire d'exprimer explicitement la réclamation. Il ne suffit pas que le plaignant dise : « Il me doit telle chose », tant qu'il n'a pas dit : « Et je lui en réclame le droit ». De plus, l'objet de la réclamation doit être à échéance immédiate (exigible) ; ainsi, la plainte concernant une dette à terme (non échue) n'est pas valable, car il n'est pas obligatoire d'en réclamer le paiement avant son échéance, et le débiteur ne peut être incarcéré pour cela.</p>
<p>⁕ Il est aussi conditionné pour la validité de la plainte qu'elle soit exempte de tout élément qui la démentirait de fait. Par exemple, une plainte déposée contre une personne l'accusant d'avoir tué ou volé il y a vingt ans n'est pas valable si l'âge de l'accusé est inférieur à cela, car la réalité factuelle et sensorielle la dément.</p>
<p>⁕ Et si le plaignant revendique l'existence d'un contrat de vente ou de location, il est conditionné pour la validité de sa plainte qu'il mentionne les conditions de ce contrat. En effet, les gens divergent quant aux conditions, et il se peut que ce contrat ne soit pas valide selon les critères du juge.</p>
<p>⁕ Et si le plaignant réclame un héritage, il doit obligatoirement en mentionner la cause (le lien de parenté ou d'alliance), car les causes de l'héritage varient ; il est donc indispensable d'en préciser la nature exacte.</p>
<p>⁕ Il est également requis, pour la validité de la plainte, de désigner précisément l'objet de la réclamation s'il est présent dans l'assemblée (du tribunal) ou dans la ville, afin de dissiper toute ambiguïté. Si l'objet de la réclamation est absent, il doit obligatoirement être décrit selon les critères de validité du contrat de vente à terme (<em>As-Salam</em>), en mentionnant les caractéristiques précises qui permettent de le définir sans équivoque.</p>
<p>⁕ L'honnêteté (la probité) des témoins est une condition de validité de la preuve matérielle ou testimoniale (<em>Al-Bayyinah</em>), conformément à la parole d'Allah le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿وَأَشْهِدُوا ذَوَيْ عَدْلٍ مِّنكُمْ﴾ [الطلاق: ٢]</span></p>
<p><strong>﴾ Et prenez pour témoins deux hommes intègres parmi vous ﴿</strong> [At-Talâq: 2]</p>
<p>et Sa parole :</p>
<p class="ar"><span dir="rtl">﴿مِمَّن تَرْضَوْنَ مِنَ الشُّهَدَاءِ﴾ [البقرة: ٢٨٢]</span></p>
<p><strong>﴾ parmi les témoins que vous agréez ﴿</strong> [Al-Baqarah: 282]</p>
<p>et Sa parole :</p>
<p class="ar"><span dir="rtl">﴿يَا أَيُّهَا الَّذِينَ آمَنُوا إِن جَاءَكُمْ فَاسِقٌ بِنَبَإٍ فَتَبَيَّنُوا﴾ [الحجرات: ٦]</span></p>
<p><strong>﴾ Ô vous qui avez cru ! Si un pervers vous apporte une nouvelle, voyez bien clair ﴿</strong> [Al-Hujurât: 6].</p>
<p>Les juristes — qu'Allah leur fasse miséricorde — ont divergé : l'intégrité des témoins doit-elle être avérée à la fois de manière apparente et cachée (intérieure), ou l'intégrité apparente suffit-elle ? Il existe deux avis à ce sujet, et le plus prépondérant des deux est qu'il suffit que l'intégrité soit apparente, en raison de l'acceptation par le Prophète <span dir="rtl">ﷺ</span> du témoignage du bédouin, et de la parole de 'Umar ؓ :</p>
<p class="ar"><span dir="rtl">«المُسْلِمُونَ عُدُولٌ»</span></p>
<p><em><strong>« Les musulmans sont présumés intègres les uns envers les autres »</strong></em>.</p>
<p>⁕ Le juge statue sur la base du témoignage intègre tant qu'il n'en connaît pas le contraire. S'il sait que la réalité est à l'opposé de ce qui a été attesté par le témoin, il ne lui est pas permis de rendre son jugement sur cette base.</p>
<p>⁕ Quant au témoin dont le juge ignore le degré d'intégrité, le juge doit se renseigner à son sujet auprès de quiconque possède une connaissance approfondie de sa personne, que ce soit par le biais de la fréquentation, des transactions financières ou du voisinage. 'Umar ؓ dit un jour à un homme qui faisait l'éloge d'un autre auprès de lui : <em>« Es-tu son voisin ? »</em> L'homme répondit : <em>« Non »</em>. 'Umar demanda : <em>« L'as-tu accompagné en voyage, là où se révèlent les véritables valeurs des hommes ? »</em> L'homme répondit : <em>« Non »</em>. 'Umar demanda encore : <em>« As-tu réalisé avec lui des transactions en dinars et en dirhams ? »</em> L'homme répondit : <em>« Non »</em>. 'Umar lui dit alors : <em>« Tu ne le connais donc pas »</em>.</p>
<p>⁕ En cas de contradiction concernant un témoin entre la critique réprobatrice (<em>Al-Jarh</em>) et l'attestation d'honorabilité (<em>At-Ta'dîl</em>), la critique prévaut. En effet, celui qui émet la critique détient un surplus d'information qui a échappé à celui qui fait l'éloge. De plus, le critique informe d'un fait caché (intérieur), tandis que celui qui fait l'éloge n'informe que d'un aspect apparent. Enfin, le critique affirme la présence d'un défaut alors que celui qui fait l'éloge le nie, et l'affirmation prévaut toujours sur la négation.</p>
<p>⁕ Le fait que la partie adverse atteste elle-même de l'honorabilité de la preuve (des témoins) ou qu'elle la valide équivaut à une homologation d'intégrité (<em>Ta'dîl</em>). En effet, l'investigation sur leur probité est faite pour préserver son propre droit ; de plus, reconnaître l'intégrité de la preuve revient à admettre ce qui impose le droit de son adversaire contre lui-même, et il est ainsi tenu par son propre aveu.</p>
<p>⁕ Lorsque le juge a connaissance de l'intégrité de la preuve, il statue sur cette base sans avoir besoin d'une enquête de moralité (<em>Tazkiyah</em>). De même, s'il sait qu'elle manque d'intégrité, il ne juge pas d'après elle. S'il a un doute sur les témoins, il les interroge : comment ont-ils assisté aux faits du témoignage ? Et où en ont-ils été témoins ?</p>
<p>L'Imam Ibn al-Qayyim a dit : <em>« Cela lui est obligatoire ; dès lors qu'il s'en détourne, il pèche et se montre injuste dans son jugement. Deux hommes témoignèrent auprès de 'Alî ؓ contre un homme en l'accusant de vol. Ayant un doute à leur sujet, il leur ordonna d'exécuter eux-mêmes l'amputation de sa main, et ils prirent alors la fuite »</em>.</p>
<p>⁕ Si la partie adverse conteste la moralité des témoins (<em>Jarh</em>), elle est sommée d'apporter la preuve de cette réprobation, conformément au hadith :</p>
<p class="ar"><span dir="rtl">«البَيِّنَةُ عَلَى المُدَّعِي»</span></p>
<p><em><strong>« La preuve incombe au demandeur »</strong></em><a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a>. Un délai de trois jours lui est accordé. Si elle n'apporte pas de preuve étayant cette contestation, le jugement est rendu contre elle sur la base du témoignage initial ; car son incapacité à fournir la preuve de la réprobation dans le délai mentionné prouve l'inexistence de ce qu'elle alléguait.</p>
<p>⁕ Si le juge ignore la situation (la moralité) des témoins, il demande au plaignant de présenter leur recommandation (<em>Tazkiyah</em>) afin d'établir leur honorabilité, pour ensuite statuer selon leur témoignage. Il est requis, pour recommander une personne, que deux témoins attestent de son intégrité. Il a été dit aussi : un seul témoin suffit pour la recommandation.</p>
<p>⁕ Le jugement peut être prononcé contre un absent (se trouvant à une distance permettant le raccourcissement des prières) dès lors que le droit est établi contre lui. En effet, Hind a dit : <em>« Ô Messager d'Allah ! Abû Sufyân est un homme avare, il ne me donne pas une pension suffisante pour moi et mon enfant. »</em> Il dit : <em>« Prends ce qui te suffit, à toi et à ton enfant, convenablement »</em>, rapporté par Al-Bukhârî et Muslim<a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a>. Cela prouve la validité du jugement rendu contre l'absent. Ensuite, lorsque l'absent se présente, il conserve son droit de faire valoir ses arguments, car l'empêchement a disparu.</p>
<p>⁕ Le fait de juger que le droit initial est établi n'annule pas une plainte ultérieure affirmant son acquittement , le fait d'en être déchargé, ou toute autre cause similaire qui annule ce droit.</p>
<p>⁕ Il est requis, pour pouvoir juger contre un absent, que celui-ci se trouve en dehors du territoire de juridiction du juge. En revanche, s'il est absent tout en se trouvant dans le territoire de sa juridiction et qu'il n'y a pas d'autre juge sur place, le juge écrit alors à une personne apte à trancher le litige entre eux. Si cela s'avère impossible, il écrit à quelqu'un capable de les réconcilier. Si cela s'avère également impossible, le juge dit au plaignant : « Apporte les preuves pour établir ta plainte », et s'il le fait, le juge fait comparaître son adversaire, même si la distance est lointaine.</p>
<p>L'Imam Ahmad a mentionné que la doctrine des savants de Médine consiste à juger contre l'absent, et il a dit : <em>« C'est une bonne doctrine »</em>.</p>
<p>Az-Zarkashî a dit : <em>« Ahmad n'a donc pas réprouvé le fait d'entendre la plainte ni de recevoir la preuve »</em>, et il a rapporté l'avis des savants de Médine et d'Irak, comme si cela faisait l'objet d'un consensus selon lui.</p>
<p>⁕ De même, la plainte est recevable contre une personne qui n'est pas légalement responsable (comme le mineur ou le fou), et le jugement est rendu sur cette base en vertu du hadith de Hind. Ensuite, lorsque cette personne devient légalement responsable après que le jugement a été prononcé contre elle, elle conserve son droit de faire valoir ses arguments.</p>
