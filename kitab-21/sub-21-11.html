<p>⁕ L'aveu (Al-Iqrâr) désigne la reconnaissance d'un droit. Il dérive étymologiquement du mot "Al-Maqarr" (le lieu fixe / la demeure), comme si celui qui avoue remettait le droit à sa juste place.</p>
<p>⁕ L'aveu consiste à informer d'un droit préexistant d'autrui dans la réalité des faits, et non à créer un droit nouveau. Le Cheikh Taqî ad-Dîn Ibn Taymiyyah — qu'Allah lui fasse miséricorde — a dit <a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a>: <em>« L'analyse rigoureuse amène à dire : si l'informateur rapporte une charge contre lui-même, il est alors un confessant (Muqirr). S'il rapporte une charge contre autrui à son propre profit, il est un demandeur/plaignant (Mudda'î). S'il rapporte une charge contre autrui au profit d'un tiers : s'il est investi d'un dépôt de confiance à ce sujet, il est un simple rapporteur (Mukhbir), sinon il est un témoin (Châhid). Ainsi, le juge, le mandataire, le scribe, le tuteur testamentaire et la personne autorisée sont tous dignes de confiance dans ce qu'ils accomplissent. Par conséquent, les informations qu'ils transmettent après leur destitution (ou fin de fonction) ne constituent pas un aveu juridique (Iqrâr), mais une pure transmission d'information. De plus, l'aveu n'est pas un acte créateur de droit , mais il s'agit seulement de manifester et d'informer d'une réalité déjà établie en soi. »</em> Fin de citation.</p>
<p>⁕ Il est exigé pour la validité de l'aveu que le confessant soit juridiquement responsable (Mukallaf). L'aveu n'est donc pas valable de la part d'un enfant, d'un aliéné mental ou d'une personne endormie. En revanche, l'aveu est valable de la part du mineur autorisé à commercer, dans les strictes limites de ce qui lui a été autorisé.</p>
<p>⁕ Il est également exigé que le confessant passe aux aveux de son plein gré (en état de libre choix). L'aveu fait sous la contrainte (Ikrah) n'est donc pas valide, à moins qu'il n'avoue une chose totalement différente de celle pour laquelle il a été contraint.</p>
<p>⁕ Il est de plus exigé pour la validité de l'aveu que le confessant ne soit pas frappé d'interdiction légale (Mahjûr 'alayhi). Ainsi, l'aveu relatif à des biens financiers n'est pas valable de la part d'une personne prodigue/irresponsable financièrement (Safîh).</p>
<p>⁕ Il est également exigé qu'il n'avoue pas une chose qui se trouve entre les mains d'un autre ou sous la tutelle d'autrui ; comme dans le cas où un tiers étranger ferait une reconnaissance de dette ou de droit à l'encontre d'un mineur, ou au sujet d'un bien de mainmorte (Waqf) placé sous la tutelle ou la responsabilité exclusive d'un autre.</p>
<p>⁕ Si le confessant prétend qu'il a été contraint à l'aveu et qu'il n'a pas avoué de son plein gré, cela est accepté de sa part s'il y a un indice (présomption) indiquant sa véracité ou une preuve manifeste appuyant sa version.</p>
<p>⁕ L'aveu de biens financiers fait par un malade en faveur d'une personne autre que ses héritiers est valide, en raison de l'absence de suspicion, et parce que l'état de maladie incite davantage la personne à prendre des précautions pour son âme en vue de ce qui l'attend (l'au-delà).</p>
<p>⁕ Si une personne émet une revendication à l'encontre d'un individu et que le défendeur confirme ses dires, sa confirmation est valide. Elle est alors considérée comme un aveu par lequel il est engagé, conformément à la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«لَا عُذْرَ لِمَنْ أَقَرَّ»</span></p>
<p><em><strong>« Il n'y a pas d'excuse pour celui qui a avoué »</strong></em>.</p>
<p>⁕ L'aveu est valable par toute formulation qui en exprime le sens ; comme le fait de dire à celui qui formule la revendication : « Tu as dit vrai », ou « Oui », ou « Je reconnais cela ».</p>
<p>⁕ Il est valide, lors d'un aveu, d'exclure par exception la moitié ou moins d'une somme. Ainsi, s'il dit : « Il a envers moi une créance de dix à l'exception de cinq », il lui est alors redevable de cinq. L'exception figure d'ailleurs dans le Livre d'Allah <span dir="rtl">ﷻ</span> ; Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿فَلَبِثَ فِيهِمْ أَلْفَ سَنَةٍ إِلَّا خَمْسِينَ عَاماً﴾ [العنكبوت: ١٤]</span></p>
<p><strong>﴾ Il demeura parmi eux mille ans moins cinquante années ﴿</strong> [Al-'Ankabût: 14]. De nombreux savants ont également opté pour l'avis autorisant l'exclusion par exception de plus de la moitié.</p>
<p>⁕ Il est exigé pour la validité de l'exception dans l'aveu qu'elle soit directement liée et rattachée à la parole prononcée. Ainsi, s'il dit : « Il a envers moi une créance de cent », puis se tait d'un silence durant lequel il lui était pourtant possible de parler, et qu'il dit ensuite : « en monnaie dépréciée (de mauvaise qualité) », ou « à terme (différée) » ; il reste alors redevable de cent pièces de bonne qualité et payables immédiatement. Ce qu'il a formulé après son silence est ignoré, car il tente par là d'annuler un droit qui s'est déjà imposé à lui.</p>
<p>⁕ Si une personne vend une chose, en fait don ou l'affranchit, puis reconnaît par la suite que cette chose appartenait à autrui ; son aveu n'est pas accepté et la vente (ou tout autre acte) n'est pas résiliée, car il s'agit d'un aveu préjudiciable à un tiers. En revanche, il est tenu de verser une compensation financière au bénéficiaire de l'aveu (le véritable propriétaire reconnu), puisqu'il l'a privé de son bien.</p>
<p>⁕ L'aveu formulé de manière globale ou indéterminée (Mujmal) est valide ; il s'agit de ce qui est susceptible de revêtir deux significations ou plus à parts égales selon le confessant:</p>
<p>- Ainsi, si une personne dit : « Untel détient sur moi un droit de quelque chose », ou : « Il a envers moi telle chose », l'aveu est valide. On demande alors au confessant : « Explicite-le », afin de pouvoir l'engager juridiquement à s'en acquitter. S'il refuse de l'expliciter, il est emprisonné jusqu'à ce qu'il le fasse, en raison de l'obligation qui lui incombe de clarifier son propos ; car il s'agit d'une dette à sa charge qu'il se doit d'exposer clairement et de restituer à son ayant droit. S'il dit : « Je n'ai pas connaissance de la nature exacte de ce que j'ai reconnu », il doit alors prêter serment et s'acquitter de la valeur minimale à laquelle ce terme peut s'appliquer. Enfin, s'il meurt avant d'avoir apporté cette explication, son héritier n'est tenu à rien, même s'il laisse un héritage, en raison de la possibilité que la chose reconnue ne soit pas un bien financier.</p>
<p>- S'il dit : « Il a envers moi mille, sauf un peu », l'exception est interprétée comme étant une valeur inférieure à la moitié.</p>
<p>- S'il dit : « Il a envers moi ce qu'il y a entre un dirham et dix », il est alors redevable de huit ; car c'est ce que requiert le sens littéral de sa formulation, puisque le chiffre huit correspond précisément à ce qui se trouve entre un et dix.</p>
<p>- S'il dit : « Il a envers moi ce qu'il y a entre un dirham jusqu'à dix », il est alors redevable de neuf ; en raison de la non-inclusion de la limite extrême (la borne finale) dans ce qui est délimité. Cependant, certains savants estiment que si la limite extrême est de même nature que l'élément délimité, elle y est incluse, sinon elle ne l'est pas.</p>
<p>- S'il dit : « Lui appartient ce qui se trouve entre ce mur jusqu'à ce mur », les deux murs n'y sont pas inclus ; car il a seulement reconnu ce qui se situe dans l'espace compris entre les deux.</p>
<p>⁕ Si une personne reconnaît au profit d'un tiers la propriété d'un arbre ou de plusieurs arbres, son aveu n'englobe pas le terrain sur lequel se trouvent ces arbres. Par conséquent, le bénéficiaire de l'aveu ne possède pas le droit d'y replanter si les arbres venaient à disparaître, et le propriétaire du terrain ne possède pas non plus le droit de les déraciner, car l'apparence première indique qu'ils ont été plantés de plein droit.</p>
<p>En revanche, s'il reconnaît la propriété d'un verger (Boustân), cela englobe alors les arbres, les constructions et le terrain, car ce terme désigne l'ensemble de ces éléments.</p>
<p>⁕ S'il dit : « Il a envers moi des dattes dans un sac », ou « un couteau dans un fourreau », ou « un vêtement dans un mouchoir/foulard », il est alors confessant concernant le contenu (l'élément contenu) et non le contenant. Il en va de même pour quiconque formule un aveu au sujet d'une chose en la plaçant dans un contenant ou l'élément contenu ; car il s'agit de deux choses distinctes, dont la première n'englobe pas la seconde, et parce qu'il ne découle pas obligatoirement du fait que le contenant et le contenu appartiennent à la même personne. Or, l'engagement lié à un aveu ne s'impose pas en présence d'une probabilité (ou d'une ambiguïté).</p>
<p>⁕ S'il dit : « Cette chose est partagée en commun entre moi et un tel », on s'en remet au confessant pour clarifier la part de l'associé. Et il a été dit : cela est partagé entre eux deux par moitiés égales, car c'est ce que requiert la règle fondamentale selon laquelle l'association absolue implique l'égalité entre les associés. Cela est d'ailleurs appuyé par la parole d'Allah le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿فَهُمْ شُرَكَاءُ فِي الثُّلُثِ﴾ [النساء: ١٢]</span></p>
<p><strong>﴾ ils seront alors associés dans le tiers ﴿</strong> [An-Nisâ': 12].</p>
<p>⁕ Il est obligatoire pour quiconque détient un droit (envers autrui) de le reconnaître lorsque le besoin s'en fait sentir, conformément à la parole d'Allah le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿كُونُواْ قَوَّٰمِينَ بِٱلْقِسْطِ شُهَدَاءَ لِلَّهِ وَلَوْ عَلَىٰٓ أَنفُسِكُمْ﴾ [النساء: ١٣٥]</span></p>
<p><strong>﴾ Soyez stricts dans la justice et témoins pour Allah, fût-ce contre vous-mêmes ﴿</strong> [An-Nisâ': 135]</p>
<p>et Sa parole, le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿وَلْيُمْلِلِ ٱلَّذِي عَلَيْهِ ٱلْحَقُّ وَلْيَتَّقِ ٱللَّهَ رَبَّهُۥ وَلَا يَبْخَسْ مِنْهُ شَيْـًٔاۚ فَإِن كَانَ ٱلَّذِي عَلَيْهِ ٱلْحَقُّ سَفِيهًا أَوْ ضَعِيفًا أَوْ لَا يَسْتَطِيعُ أَن يُمِلَّ هُوَ فَلْيُمْلِلْ وَلِيُّهُۥ بِٱلْعَدْلِ﴾ [البقرة: ٢٨٢].</span></p>
<p><strong>﴾ Et que celui sur qui repose le droit dicte, qu'il craigne Allah son Seigneur et ne diminue rien de sa dette. Si celui sur qui repose le droit est prodigue, faible ou incapable de dicter lui-même, que son tuteur dicte alors avec justice ﴿</strong> [Al-Baqarah: 282].</p>
<p>Al-Muwaffaq (Ibn Qoudamah) a dit dans <em>Al-Kâfî</em> <a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a>: <em>« L'action de dicter (Al-Imlâl) équivaut à l'aveu (Al-Iqrâr), et rendre un jugement fondé sur l'aveu est obligatoire, en raison de la parole du Prophète <span dir="rtl">ﷺ</span> :</em></p>
<p class="ar"><span dir="rtl">«وَٱغْدُ يَا أُنَيْسُ عَلَىٰ ٱمْرَأَةِ هَٰذَا، فَإِنِ ٱعْتَرَفَتْ؛ فَٱرْجُمْهَا»</span></p>
<p><em>"<strong>Va le matin, ô Unays, vers la femme de celui-ci, et si elle avoue, alors lapide-la"</strong></em> <a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a><em>. De même, le Prophète <span dir="rtl">ﷺ</span> a lapidé Mâ'iz ainsi que la femme de la tribu de Ghâmid en raison de leurs propres aveux. De plus, s'il est obligatoire de juger sur la base d'une preuve manifeste , il est alors d'autant plus évident d'avoir l'obligation de juger sur la base de l'aveu, celui-ci étant totalement éloigné du doute. »</em></p>
<p>Et la louange appartient à Allah, Seigneur de l'univers.</p>
<p>Ici s'achève le résumé. Nous demandons à Allah de pardonner les erreurs et les manquements qui ont pu s'y glisser, de nous faire profiter ainsi que les nobles lecteurs de ce qu'il contient de vérité, et d'accorder à tous la réussite dans l'acquisition de la science utile et la pratique des bonnes œuvres.</p>
