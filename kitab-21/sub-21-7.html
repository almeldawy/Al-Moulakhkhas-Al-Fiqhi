  <!-- ▼ CONTENU DU CHAPITRE ▼ -->

<p>⁕ <em>Ad-Da'âwâ</em> ( <span dir="rtl">الدَّعَاوَى</span> ) est le pluriel de <em>Da'wâ</em> ( <span dir="rtl">دَعْوَى</span> ). Linguistiquement, cela signifie : la demande ( <span dir="rtl">الطَّلَب</span>ُ ).</p>
<p>Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿وَلَهُم مَّا يَدَّعُونَ﴾</span></p>
<p>﴾ <strong>Et ils y auront tout ce qu’ils réclameront.</strong> ﴿ [Yâ-Sîn : 57] ; c'est-à-dire : ce qu'ils demandent et désirent.</p>
<p>Dans la terminologie des juristes (<em>Fouqahâ</em>), la <em>Da'wâ</em> est : le fait qu'une personne s'attribue le droit de propriété ou la jouissance d'une chose se trouvant entre les mains d'autrui ou à sa charge.</p>
<p class="ar"><span dir="rtl">( إِضَافَةُ الْإِنْسَانِ إِلَى نَفْسِهِ اسْتِحْقَاقَ شَيْءٍ فِي يَدِ غَيْرِهِ أَوْ ذِمَّتِهِ )</span></p>
<p>⁕ <em>Al-Bayyinât</em> est le pluriel de <em>Bayyinah</em> (la preuve). Linguistiquement, c'est le signe évident ( <span dir="rtl">الْعَلَامَةُ الْوَاضِحَة</span>ُ ).</p>
<p>Et [dans le droit musulman], c'est tout ce qui clarifie la vérité, qu'il s'agisse de témoins ou d'un serment.</p>
<p class="ar"><span dir="rtl">كُلُّ مَا يُبَيِّنُ الْحَقَّ مِنْ شُهُودٍ أَوْ يَمِينٍ</span></p>
<p>L'érudit Ibn al-Qayyim (qu'Allah lui fasse miséricorde) a dit : « <em>La Bayyinah (preuve) dans la législation est un nom générique pour tout ce qui élucide la vérité et la manifeste. Certes, Gloire à Lui, a établi pour la vérité des indices et des signes qui la signalent et la mettent en lumière. Dès lors, quiconque néglige totalement ces indices et ces signes annule de facto de nombreux jugements et cause la perte de nombreux droits...</em> ». Fin de citation.</p>
<p>⁕ La différence entre le demandeur (<em>Al-Moudda'î</em>) et le défendeur (<em>Al-Moudda'â 'alayh</em>) est la suivante :</p>
<ul>
<li><blockquote>
<p>Le <strong>demandeur</strong> est celui qui, s'il se tait (renonce), est laissé tranquille ; c'est lui qui réclame (<em>Al-Moutâlib</em>).</p>
</blockquote></li>
<li><blockquote>
<p>Le <strong>défendeur</strong> est celui qui, si le demandeur se tait, n'est pas laissé tranquille (l'action continue contre lui s'il garde le silence face à la plainte) ; c'est lui qui est réclamé (<em>Al-Moutâlab</em>).</p>
</blockquote></li>
</ul>
<p>⁕ Il est exigé, pour la validité de la plainte (la prétention) ainsi que pour la validité de sa contestation (la dénégation), que l'auteur soit juridiquement apte à disposer de ses biens (<em>Jâ'iz at-Tasarrouf</em>). Il s'agit de l'homme libre, responsable en droit (<em>Moukalaf</em>) et doué de discernement/bon sens (<em>Rachîd</em>).</p>
<p>⁕ Si deux personnes se disputent la propriété d'un bien matériel, chacun d'eux prétendant qu'il lui appartient alors que l'objet se trouve physiquement entre les mains de l'un des deux, le bien est alors attribué à celui qui le détient, sous réserve qu'il prête serment.</p>
<p>⁕ Celui qui a le bien entre ses mains est appelé « le possesseur actuel » (<em>Ad-Dâkhil</em>), tandis que celui qui ne l'a pas entre ses mains est appelé « le tiers demandeur » (<em>Al-Khârij</em>).</p>
<p>⁕ Si chacun d'eux présente sa preuve (<em>Bayyinah</em>) attestant que le bien litigieux lui appartient, le jugement est rendu en faveur du tiers demandeur (<em>Al-Khârij</em>), en raison du hadith d'Ibn 'Abbâs élevé jusqu'au Prophète (<em>Marfoû'</em>) :</p>
<p class="ar"><span dir="rtl">«لَوْ يُعْطَى النَّاسُ بِدَعْوَاهُمْ؛ لَادَّعَى نَاسٌ دِمَاءَ رِجَالٍ وَأَمْوَالَهُمْ، وَلَكِنَّ الْيَمِينَ عَلَى الْمُدَّعَى عَلَيْهِ»</span></p>
<p><em>« <strong>Si l'on donnait aux gens selon leurs prétentions, des hommes réclameraient le sang et les biens d'autres hommes. Cependant, le serment incombe au défendeur.</strong> »</em> [Rapporté par Ahmad et Muslim].<a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a></p>
<p>Et en raison de sa parole <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«الْبَيِّنَةُ عَلَى الْمُدَّعِي، وَالْيَمِينُ عَلَى مَنْ أَنْكَرَ»</span></p>
<p><em>« <strong>La preuve incombe au demandeur, et le serment incombe à celui qui nie.</strong> »</em> [Rapporté par At-Tirmidhî].<a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a></p>
<p>Les deux hadiths démontrent ainsi que la preuve incombe au demandeur : s'il la produit, le jugement est rendu en sa faveur, et que le serment incombe à celui qui nie si le demandeur ne possède pas de preuve. Cependant, la majorité des gens de science (<em>Ahl al-'Ilm</em>) est d'avis, concernant cette question, que le bien revient à celui qui le détient physiquement – appelé le possesseur actuel (<em>Ad-Dâkhil</em>) – et que le hadith s'applique dans le cas où le possesseur actuel ne dispose pas de preuve. Autrement, la possession matérielle appuyée par sa propre preuve est plus forte, et il est préférable d'adopter l'avis de la majorité.</p>
<p>⁕ Si le bien qu'ils se disputent n'est entre les mains d'aucun d'eux, qu'il n'y a aucune présomption apparente (<em>Zhâhir</em>) sur laquelle s'appuyer, et qu'aucun des deux ne possède de preuve, ils prêtent alors tous deux serment (<em>Tahâlafâ</em>) : chacun jure que l'autre n'a aucun droit sur ce bien. Ensuite, le bien est partagé équitablement entre eux deux, en raison de leur égalité dans la prétention et de l'absence d'élément prépondérant (<em>Mourajjih</em>) en faveur de l'un d'eux. Toutefois, si une présomption apparente fait pencher la balance pour l'un d'eux, on l'applique.</p>
<p>⁕ Ainsi, si les deux époux se disputent au sujet des effets de la maison (meubles, ustensiles) ou similaires : ce qui est à l'usage exclusif de l'homme revient au mari, ce qui est à l'usage exclusif de la femme revient à l'épouse, et ce qui convient aux deux leur appartient à tous les deux (partagé équitablement).</p>
