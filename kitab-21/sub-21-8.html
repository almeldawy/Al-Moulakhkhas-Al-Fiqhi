<p>⁕ Les témoignages (<span dir="rtl">الشَّهَادَات</span>ُ) dérivent du terme observation visuelle (<span dir="rtl">الْمُشَاهَدَة</span>ِ), car le témoin informe de ce qu'il a vu et de ce qu'il sait.</p>
<p>⁕ Est-il conditionné, lors de la prestation du témoignage, que cela soit formulé par les termes : « J'atteste » (<span dir="rtl">أَشْهَد</span>ُ) ou « J'ai attesté » (<span dir="rtl">شَهِدْت</span>ُ) ? Cela est l'avis célèbre au sein de l'école hanbalite. Le second avis — qui est une version rapportée d'Ahmad et l'avis d'un groupe d'imams — stipule que cela n'est pas obligatoire. Cet avis a été choisi par le Cheikh Taqiyou-Dîn Ibn Taymiyyah, son élève Ibn al-Qayyim ainsi que d'autres.</p>
<p>Le Cheikh a dit <a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a>: <em>« Le terme "J'atteste" (<span dir="rtl">أَشْهَد</span>ُ) n'est pas une condition lors de la prestation du témoignage. C'est ce qui découle de la position d'Ahmad et d'autres. Je ne connais aucun texte [scripturaire] qui s'y oppose, et l'on ne connaît aucun Compagnon (Sahâbî) ni Successeur (Tâbi'î) ayant imposé comme condition l'usage du terme de l'attestation. »</em></p>
<p>Et Ibn al-Qayyim a dit <a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a>: <em>« Le fait d'informer constitue un témoignage pur selon le plus authentique des avis, qui est d'ailleurs l'avis de la majorité [des savants]. En effet, l'emploi du terme "J'atteste" (<span dir="rtl">أَشْهَد</span>ُ) n'est pas requis pour la validité du témoignage. Dès lors que le témoin dit : "J'ai vu ceci et cela", ou "J'ai entendu", ou toute formulation similaire, cela est considéré comme un témoignage de sa part. Il n'existe pas un seul endroit dans le Livre d'Allah ni dans la Sunnah de Son Messager <span dir="rtl">ﷺ</span> indiquant le caractère obligatoire du terme de l'attestation, ni de la part d'un seul homme parmi les Compagnons. De plus, aucune analogie (Qiyâs) ni déduction juridique (Istinbât) ne l'impose. Bien au contraire, les preuves concordantes du Livre, de la Sunnah, des paroles des Compagnons et de la langue arabe réfutent cela. »</em> Fin de citation.</p>
<p>⁕ Et se charger du témoignage (en assumer la responsabilité) concernant un droit autre que celui d'Allah le Très-Haut est une obligation de suffisance communautaire (<em>Fard Kifâyah</em>). Dès lors qu'il est accompli par un nombre de personnes suffisant, [l'obligation] tombe pour le reste des musulmans, car l'objectif est atteint. En revanche, s'il ne se trouve personne d'autre que le nombre strictement nécessaire, cela devient pour eux une obligation individuelle (<em>Ta'ayyana 'alayhi</em>). Cela s'appuie sur la parole d'Allah le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿وَلَا يَأْبَ الشُّهَدَاءُ إِذَا مَا دُعُوا﴾ [البقرة: ٢٨٢]</span></p>
<p><strong>﴾ Et que les témoins ne refusent pas quand ils sont appelés ﴿</strong> [Al-Baqarah : 282] ; c'est-à-dire : lorsqu'ils sont appelés pour se charger du témoignage, il leur incombe de répondre favorablement. Ce verset est d'ailleurs général et englobe aussi bien l'invitation à se charger du témoignage qu'à le délivrer . Ibn 'Abbâs ainsi que d'autres ont dit au sujet du sens de ce verset : ce qui est visé ici, c'est le fait d'assumer le témoignage et de l'établir auprès du juge. De plus, le besoin l'exige afin de confirmer les droits et les contrats. C'est pourquoi cela est obligatoire, au même titre que l'ordonnance du bien et l'interdiction du blâmable.</p>
<p>⁕ Quant à la délivrance du témoignage (<em>Adâ as-Shahâdah</em>), elle constitue une obligation individuelle (<em>Fard 'Ayn</em>) pour quiconque l'a assumé, dès lors qu'il y est appelé. Cela s'appuie sur la parole du Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿وَلَا تَكْتُمُوا الشَّهَادَةَ وَمَنْ يَكْتُمْهَا فَإِنَّهُ آثِمٌ قَلْبُهُ﴾ [البقرة: ٢٨٣]</span></p>
<p><strong>﴾ Et ne cachez pas le témoignage. Quiconque le cache a assurément un cœur pécheur ﴿</strong> [Al-Baqarah : 283]. Le sens de ce noble verset est le suivant : si vous êtes appelés à établir le témoignage, ne le dissimulez pas et ne le modifiez pas.</p>
<p class="ar"><span dir="rtl">﴿وَمَنْ يَكْتُمْهَا فَإِنَّهُ آثِمٌ قَلْبُهُ﴾</span></p>
<p><strong>﴾ Quiconque le cache a assurément un cœur pécheur ﴿</strong> signifie : son cœur est pervers. Il s'agit là d'une menace sévère d'altération (ou de scellement) du cœur. Le cœur a été spécifiquement mentionné ici car il est le siège de la connaissance du témoignage. Ce noble verset prouve ainsi le caractère personnellement obligatoire de la délivrance du témoignage pour celui qui l'a assumé, dès lors qu'il y est invité.</p>
<p>L'imam, le grand savant Ibn al-Qayyim a dit <a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a>: <em>« Assumer [le témoignage] et le délivrer constituent un droit dont l'abandon est un péché. »</em> Il a également dit : <em>« L'analogie au sein de l'école [hanbalite] implique que si le témoin dissimule un témoignage de vérité, il en devient garant (Damina-hu / redevable financièrement du préjudice). En effet, il lui était possible de sauver le droit de son compagnon (le lésé) mais il ne l'a pas fait ; la garantie lui incombe donc, tout comme s'il avait eu la possibilité de le sauver d'une situation de perdition et qu'il ne l'avait pas fait... »</em> Fin de citation.</p>
<p>⁕ Il est également requis, pour que l'obligation d'assumer et de délivrer le témoignage s'applique, que le témoin soit préservé de tout préjudice. Si le fait de témoigner lui cause un tort à lui-même, à son honneur, à ses biens ou à sa famille, cela ne lui est plus obligatoire. Cela se fonde sur la parole du Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿وَلَا يُضَارَّ كَاتِبٌ وَلَا شَهِيدٌ﴾ [البقرة: ٢٨٢]</span></p>
<p><strong>﴾ Qu'on ne fasse de tort ni à un scribe ni à un témoin ﴿</strong> [Al-Baqarah : 282]</p>
<p>ainsi que sur le hadith :</p>
<p class="ar"><span dir="rtl">«لَا ضَرَرَ وَلَا ضِرَارَ»</span></p>
<p><strong>« Pas de préjudice causé, ni de préjudice subi en retour »</strong>. Et Allah sait mieux.</p>
<p>⁕ Il est obligatoire pour le témoin d'avoir une connaissance claire de ce qu'il atteste ; il ne lui est donc pas licite de témoigner si ce n'est d'après ce qu'il sait.</p>
<p>Le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿وَلَا تَقْفُ مَا لَيْسَ لَكَ بِهِ عِلْمٌ﴾ [الإسراء: ٣٦]</span></p>
<p><strong>﴾ Et ne poursuis pas ce dont tu n'as aucune connaissance ﴿</strong> [Al-Isrâ' : 36]</p>
<p>Et le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿إِلَّا مَنْ شَهِدَ بِالْحَقِّ وَهُمْ يَعْلَمُونَ﴾ [الزخرف: ٨٦]</span></p>
<p><strong>﴾ ...à l'exception de ceux qui témoignent de la vérité en pleine connaissance de cause ﴿</strong> [Az-Zukhruf : 86] ; c'est-à-dire : qu'il sache ce qu'il atteste avec clairvoyance et certitude. Ibn 'Abbâs (qu'Allah l'agrée, lui et son père) a rapporté : On a interrogé le Prophète <span dir="rtl">ﷺ</span> au sujet du témoignage, il dit alors : <em><strong>« Vois-tu le soleil ? »</strong></em> L'homme répondit : <em>Oui</em>. Il dit : <em><strong>« C'est sur une chose semblable que tu dois témoigner, sinon abstiens-toi »</strong></em>. Rapporté par Al-Khallâl dans son <em>Jâmi'</em>. Al-Bayhaqî a dit : <em>« Il n'est parvenu par aucune voie sur laquelle on peut s'appuyer »</em>, et Ibn Hajar a précisé : <em>« Cependant, le sens du hadith est authentique »</em> <a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a>.</p>
<p>La connaissance s'acquiert par l'un des moyens suivants : soit par l'audition, soit par la vue directe de la personne contre qui le témoignage est porté, le témoin atteste alors de ce qu'il a entendu ou vu. Soit par l'audition du témoin par la voie de la notoriété publique (<em>Al-Istifâdah</em> / la rumeur publique répandue) pour les affaires dont la connaissance est généralement impossible sans cela, à l'instar de la filiation (<em>An-Nasab</em>) et de la mort. Toutefois, il ne peut témoigner sur la base de la notoriété publique que si l'information lui est parvenue d'un nombre de personnes suffisant pour engendrer la certitude.</p>
<p>⁕ Six conditions sont requises pour que le témoignage d'une personne soit accepté :</p>
<p><strong>La première :</strong> <strong>La puberté</strong> . Le témoignage des enfants n'est pas accepté, sauf pour ce qui se passe entre eux (les litiges qui surviennent entre enfants).</p>
<p>L'érudit Ibn al-Qayyim a dit <a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a>: « <em>Les Compagnons et les juristes de Médine s'appuyaient sur le témoignage des enfants concernant les blessures qu'ils s'infligeaient les uns aux autres. En effet, les hommes adultes n'assistent pas à leurs jeux, et si leur témoignage n'était pas accepté, les droits seraient perdus, suspendus et délaissés, alors même qu'il y a une forte présomption ou une certitude quant à leur véracité. Cela est d'autant plus vrai lorsqu'ils se présentent ensemble avant de se séparer pour rejoindre leurs maisons, qu'ils s'accordent sur un même récit, qu'ils sont séparés au moment de délivrer leur témoignage, et que leurs propos concordent parfaitement. La présomption qui découle alors de leur témoignage est bien plus forte que celle issue du témoignage de deux hommes adultes. C'est là une réalité qu'il est impossible de rejeter ou de renier... »</em> Fin de citation.</p>
<p><strong>La deuxième :</strong> <strong>La raison (le discernement)</strong>. Le témoignage d'un fou ou d'un déficient mental n'est pas accepté. En revanche, le témoignage de celui qui subit des crises de démence passagères est accepté s'il a assimilé le fait et en témoigne durant ses moments de lucidité, car il s'agit alors du témoignage d'une personne jouissant de sa raison, semblable à celle qui n'a jamais été atteinte de folie.</p>
<p><strong>La troisième : La parole.</strong> Le témoignage de la personne muette n'est pas accepté, même si ses signes sont compris, car le témoignage requiert une certitude absolue. Les signes du muet ne sont considérés comme suffisants que dans les statuts juridiques qui le concernent personnellement, tels que son mariage ou son divorce, et ce par nécessité. <strong>Cependant, si le muet délivre son témoignage par écrit, celui-ci est accepté car l'écrit fait office de parole.</strong></p>
<p><strong>La quatrième : L'Islam.</strong> Cela se fonde sur la parole du Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿وَأَشْهِدُوا ذَوَيْ عَدْلٍ مِّنكُمْ﴾ [الطلاق: ٢]</span></p>
<p><strong>﴾ Et prenez pour témoins deux hommes intègres parmi vous ﴿</strong> [At-Talâq : 2]. Ainsi, le témoignage du non-musulman (<em>Al-Kâfir</em>) n'est pas accepté, excepté concernant le testament lors d'un voyage ; le témoignage de deux non-musulmans est alors accepté à ce sujet en l'absence de quiconque d'autre. Cela s'appuie sur la parole du Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿يَٰأَيُّهَا ٱلَّذِينَ ءَامَنُواْ شَهَٰدَةُ بَيْنِكُمْ إِذَا حَضَرَ أَحَدَكُمُ ٱلْمَوْتُ حِينَ ٱلْوَصِيَّةِ ٱثْنَانِ ذَوَا عَدْلٍ مِّنكُمْ أَوْ ءَاخَرَانِ مِنْ غَيْرِكُمْ إِنْ أَنتُمْ ضَرَبْتُمْ فِى ٱلْأَرْضِ فَأَصَٰبَتْكُم مُّصِيبَةُ ٱلْمَوْتِ...﴾ الْآيَةَ [المائدة: ١٠٦]</span></p>
<p><strong>﴾ Ô les croyants ! Quand la mort se présente à l'un de vous, le témoignage à faire au moment du testament est de deux hommes intègres parmi vous, ou de deux autres qui ne sont pas des votres, si vous êtes en voyage sur terre et que le malheur de la mort vous frappe… ﴿</strong> [Al-Mâ'idah : 106]. Cela a été instauré en raison de la nécessité absolue.</p>
<p><strong>La cinquième : La mémoire .</strong> Le témoignage de la personne distraite ou reconnue pour sa fréquente distraction et ses nombreuses erreurs n'est pas accepté. En effet, on ne peut accorder de confiance à sa parole et sa véracité ne peut prévaloir, en raison de la probabilité que cela provienne de ses erreurs. En revanche, le témoignage de celui chez qui la distraction et l'erreur sont rares est accepté, car personne n'en est totalement exempt.</p>
<p><strong>La sixième : L'intégrité morale (<em>Al-'Adâlah</em>).</strong></p>
<p>Au sens linguistique, <em>elle désigne la droiture</em> ( <span dir="rtl">الِاسْتِقَامَة</span>ُ ); elle dérive du terme équité (<em>Al-'Adl</em>), qui est le contraire de l'injustice ( <span dir="rtl">الْجَوْر</span>ِ ).</p>
<p>Au sens religieux (shari'ah), elle désigne <em>la régularité d'une personne dans sa pratique religieuse, ainsi que la modération de ses propos et de ses actes</em>.</p>
<p class="ar"><span dir="rtl">(اسْتِوَاءُ أَحْوَالِهِ فِي دِينِهِ؛ وَاعْتِدَالُ أَقْوَالِهِ وَأَفْعَالِهِ)</span></p>
<p>La preuve de l'exigence de l'intégrité morale chez le témoin réside dans la parole du Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿مِمَّن تَرْضَوْنَ مِنَ ٱلشُّهَدَاءِ﴾ [البقرة: ٢٨٢]</span></p>
<p><strong>﴾ ...parmi ceux que vous agréez comme témoins ﴿</strong> [Al-Baqarah : 282],</p>
<p>ainsi que Sa parole :</p>
<p class="ar"><span dir="rtl">﴿وَأَشْهِدُوا ذَوَيْ عَدْلٍ مِّنكُمْ﴾ [الطلاق: ٢]</span></p>
<p><strong>﴾ Et prenez pour témoins deux hommes intègres parmi vous ﴿</strong> [At-Talâq : 2].</p>
<p>La majorité des savants a affirmé : <em>l'intégrité morale est une caractéristique qui s'ajoute à l'Islam ; elle consiste pour l'individu à observer rigoureusement les obligations et les actes recommandés, et à s'écarter des interdits et des actes détestables.</em></p>
<p>Et Cheikh al-Islam Ibn Taymiyyah (qu'Allah lui fasse miséricorde) a dit <a href="#fn6" class="footnote-ref" id="fnref6" role="doc-noteref"><sup>6</sup></a>: <em>« Le rejet du témoignage de celui qui est connu pour mentir fait l'objet d'un consensus entre les juristes. »</em> Il a également dit : <em>« L'intégrité morale (Al-'Adl) s'évalue dans chaque époque, chaque lieu et au sein de chaque communauté selon ce qui lui est propre. Ainsi, le témoin valable au sein de chaque peuple est celui qui est considéré comme intègre parmi eux, même si, s'il se trouvait au sein d'un autre peuple, son intégrité se manifesterait d'une autre manière. C'est grâce à cela qu'il devient possible de trancher les litiges entre les gens. Autrement, si l'on exigeait concernant les témoins de chaque communauté que nul ne puisse témoigner contre eux à moins d'accomplir parfaitement les obligations et de délaisser strictement les interdits à la manière des Compagnons, tous les témoignages — ou la majeure partie d'entre eux — deviendraient caducs. »</em> Il a ajouté : <em>« Il convient, en cas de nécessité absolue, d'accepter le témoignage des personnes connues pour leur véracité, même si elles ne respectent pas scrupuleusement les limites religieuses (Al-Hudûd). C'est le cas par exemple dans les prisons, lors des incidents survenant chez les bédouins, ou pour les habitants d'un village reculé parmi lesquels on ne trouve personne doté d'une intégrité morale parfaite. »</em> Fin de citation.</p>
<p>⁕ <strong>Les juristes (qu'Allah leur fasse miséricorde) ont dit : Deux éléments sont requis pour valider l'intégrité morale (<em>Al-'Adâlah</em>) :</strong></p>
<p><strong>Le premier d'entre eux : L'accomplissement des obligations de base.</strong> C'est-à-dire les cinq prières quotidiennes et la prière du vendredi, accompagnées de leurs prières surérogatoires régulières (<em>Al-Sunan al-Râtibah</em>). Ainsi, le témoignage de celui qui persiste à délaisser les prières surérogatoires régulières et la prière du <em>Witr</em> n'est pas accepté.</p>
<p>L'Imam Ahmad (qu'Allah lui fasse miséricorde) a dit au sujet de celui qui s'obstine à abandonner les prières surérogatoires de la prière : <em>« C'est un homme mauvais, car en persistant [dans ce délaissement], il montre un désintérêt pour la Sunnah, et la suspicion plane sur lui. »</em></p>
<p>Et tout comme l'accomplissement des obligations est requis, l'éloignement des interdits l'est tout autant : de sorte qu'il ne commette aucun péché majeur (<em>Kabîrah</em>) et qu'il ne s'adonne pas de manière habituelle à un péché mineur (<em>Saghîrah</em>).</p>
<p>Allah a certes interdit d'accepter le témoignage de celui qui calomnie (en accusant faussement de fornication), et on a étendu cela par analogie à toute personne commettant un péché majeur. <strong>Le péché majeur correspond à tout acte passible d'une peine légale (<em>Hadd</em>) dans ce bas monde ou faisant l'objet d'une menace de châtiment dans l'au-delà</strong> ; à l'instar de la consommation de l'usure (<em>Al-Ribâ</em>), du faux témoignage, de la fornication (<em>Al-Zinâ</em>), du vol, de la consommation de boissons enivrantes... et d'autres actes similaires. Le témoignage du pervers (<em>Al-Fâsiq</em>) n'est donc pas accepté.</p>
<p><strong>Le second : L'adoption des bienséances morales (<em>Al-Murû'ah</em>) — c'est-à-dire la dignité humaine.</strong> Cela consiste à accomplir ce qui embellit et honore la personne, comme la générosité, le bon comportement et les bonnes relations de voisinage. De même, cela implique de s'écarter de ce qui souille et ternit habituellement sa réputation parmi les choses viles et dégradantes, telles que le fait d'être chanteur ou bouffon — ce dernier désignant celui qui cherche à faire rire les gens par ses paroles ou ses actes.</p>
<p>Le Cheikh a dit <a href="#fn7" class="footnote-ref" id="fnref7" role="doc-noteref"><sup>7</sup></a>: <em>« Il est interdit d'imiter les gens pour faire rire. L'auteur de cette imitation ainsi que celui qui lui ordonne de le faire doivent être sanctionnés , car cela constitue une nuisance. »</em></p>
<p>Je dis : Et ceci englobe de nos jours les pièces de théâtre (et comédies). De même, le chant est devenu à notre époque l'un des arts dont on encourage les adeptes et dont on fait l'éloge ; il n'y a de force ni de puissance que par Allah.</p>
<p>Dès lors que ces empêchements disparaissent chez une personne — ainsi, l'enfant atteint la puberté, le fou retrouve sa raison, le non-musulman embrasse l'Islam et le pervers se repent —, leurs témoignages sont acceptés en raison de la disparition de ce qui s'y opposait et de la réunion des conditions requises. Et Allah sait mieux.</p>
<p>⁕ Le témoignage des deux lignes directrices de la parenté (les ascendants et les descendants) — à savoir les parents et au-delà, ainsi que les enfants et en deçà — n'est pas accepté en faveur les uns des autres. Ainsi, le témoignage du père en faveur de son fils n'est pas accepté, de même que le témoignage du fils en faveur de son père, et ce en raison du soupçon de partialité (<em>Al-Tuhmah</em>) existant dans ce cas, dû à la force du lien de parenté qui les unit.</p>
<p>⁕ En revanche, le témoignage du frère en faveur de son frère est accepté, tout comme celui d'un ami en faveur de son ami, en raison de la portée générale des versets et de l'absence de soupçon de partialité.</p>
<p>⁕ Le témoignage de l'un des conjoints en faveur de l'autre n'est pas accepté, car chacun d'eux tire profit des biens de son partenaire, et en raison de la force du lien qui les unit, ce qui renforce le soupçon de partialité. Toutefois, le témoignage <em>contre</em> eux de la part de ces mêmes proches est accepté, conformément à la parole du Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿كُونُواْ قَوَّٰمِينَ بِٱلْقِسْطِ شُهَدَآءَ لِلَّهِ وَلَوْ عَلَىٰٓ أَنفُسِكُمْ أَوِ ٱلْوَٰلِدَيْنِ وَٱلْأَقْرَبِينَ﴾ [النساء: ١٣٥]</span></p>
<p><strong>﴾ Soyez stricts dans la justice et témoins pour Allah, fût-ce contre vous-mêmes, contre vos père et mère ou vos proches parents ﴿</strong> [An-Nisâ' : 135]. Par conséquent, si un homme témoigne contre son père, son fils ou son épouse, ou qu'elle témoigne contre lui, le témoignage est accepté.</p>
<p>⁕ Le témoignage de quiconque s'attire un profit par ce témoignage ou repousse par celui-ci un préjudice loin de sa personne n'est pas accepté.</p>
<p>⁕ Le témoignage d'un ennemi contre son ennemi n'est pas accepté.</p>
<p>L'érudit Ibn al-Qayyim (qu'Allah lui fasse miséricorde) a dit : <em>« La Législation islamique a interdit l'acceptation du témoignage de l'ennemi contre son ennemi, afin que cela ne soit pas utilisé comme un prétexte permettant d'assouvir ses desseins contre son ennemi au moyen d'un faux témoignage... »</em> Fin de citation.</p>
<p>Le critère de l'animosité empêchant l'acceptation du témoignage ici réside dans le fait que quiconque se réjouit du malheur d'une personne ou s'afflige de sa joie est considéré comme son ennemi.</p>
<p>Et ce qui est visé [par cela], c'est l'animosité liée aux affaires de ce bas monde. Quant à l'animosité pour des motifs religieux, elle ne constitue pas un obstacle à l'acceptation du témoignage. Ainsi, le témoignage d'un musulman contre un non-musulman (<em>Kâfir</em>) est accepté, de même que le témoignage d'un sunnite (<em>Sunnî</em>) contre un adepte de l'innovation (<em>Mubtadi'</em>), car la religion empêche de commettre ce qui est interdit.</p>
<p>⁕ Le témoignage de celui qui est connu pour son esprit de clan (le fanatisme) et pour son excès de zèle (le chauvinisme) en faveur de sa tribu n'est pas accepté, en raison du soupçon de partialité qui en découle.</p>
<p>⁕ <strong>Quant au nombre de témoins requis, il varie selon la nature du fait à attester :</strong></p>
<p><strong>– Pour l'établissement de la fornication (<em>Al-Zinâ</em>) et de l'homosexualité (<em>Al-Liwât</em>), rien n'est accepté en deçà de quatre hommes.</strong> Cela se fonde sur la parole du Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿لَّوْلَا جَآءُو عَلَيْهِ بِأَرْبَعَةِ شُهَدَآءَ﴾ [النور: ١٣]</span></p>
<p><strong>﴾ Pourquoi n'ont-ils pas produit à l'appui quatre témoins ? ﴿</strong> [An-Nûr : 13], et parce qu'il est ordonné dans ce genre de situations de préserver le secret . C'est pourquoi le quorum exigé (<em>Al-Nisâb</em>) a été rendu si rigoureux.</p>
<p><strong>– Pour prouver l'insolvabilité (la détresse financière) d'une personne initialement connue pour sa richesse et qui prétend être devenue pauvre, le témoignage de trois hommes est requis.</strong> Cela s'appuie sur le hadith :</p>
<p class="ar"><span dir="rtl">«حَتَّى يَشْهَدَ ثَلَاثَةٌ مِّنْ ذَوِي الْحِجَى مِنْ قَوْمِهِ لَقَدْ أَصَابَتْ فُلَاناً فَاقَةٌ»</span></p>
<p><em>« ...jusqu'à ce que trois hommes doués de raison parmi son peuple témoignent en disant : "Une misère extrême a certes frappé un tel" »</em>. Rapporté par Muslim <a href="#fn8" class="footnote-ref" id="fnref8" role="doc-noteref"><sup>8</sup></a>.</p>
<p><strong>– Pour l'établissement des autres peines légales (<em>Al-Hudûd</em>) en dehors de celle de la fornication — telles que la peine pour calomnie (<em>Al-Qadhf</em>), pour consommation de boissons enivrantes (<em>Al-Muskir</em>), pour vol, pour banditisme de grand chemin ainsi que pour le talion (<em>Al-Qisâs</em>) —, le témoignage de deux hommes est accepté</strong>, et le témoignage des femmes n'est pas accepté dans ces cas-là.</p>
<p><strong>– Pour ce qui ne relève ni d'une peine pénale, ni d'un bien matériel, et qui ne vise pas un but pécuniaire, mais dont les hommes ont généralement connaissance — comme le mariage (<em>Nikâh</em>), le divorce (<em>Talâq</em>) et la reprise de l'épouse (<em>Raj'ah</em>) —, le témoignage de deux hommes est requis.</strong> Néanmoins, Cheikh Al-Islam Ibn Taymiyyah et son élève Ibn al-Qayyim (qu'Allah leur fasse miséricorde) ont opté pour la validité du témoignage des femmes concernant la reprise de l'épouse, car leur présence lors de cet acte est plus aisée que leur présence lors de la rédaction des contrats administratifs.</p>
<p><strong>– Pour les affaires de biens matériels et ce qui vise un but pécuniaire — comme la vente, les transactions à terme, la location (<em>Ijârah</em>) et autres cas similaires —, le témoignage de deux hommes, ou d'un homme et de deux femmes, est accepté.</strong> Cela se fonde sur la parole du Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿وَاسْتَشْهِدُوا شَهِيدَيْنِ مِن رِّجَالِكُمْ فَإِن لَّمْ يَكُونَا رَجُلَيْنِ فَرَجُلٌ وَامْرَأَتَانِ﴾ [البقرة: ٢٨٢]</span></p>
<p><strong>﴾ Et faites-en témoigner par deux témoins d'entre vos hommes ; et à défaut de deux hommes, un homme et deux femmes ﴿</strong> [Al-Baqarah : 282], et le contexte de ce noble verset montre que cette règle est spécifique aux biens financiers.</p>
<p>L'érudit Ibn al-Qayyim (qu'Allah lui fasse miséricorde) a dit <a href="#fn9" class="footnote-ref" id="fnref9" role="doc-noteref"><sup>9</sup></a>: <em>« Les musulmans se sont accordés sur le fait qu'un homme et deux femmes sont acceptés pour témoigner dans les affaires financières, de même que pour les questions qui y sont rattachées, telles que la vente, l'échéance fixée, l'option de rétractation (Khiyâr), le gage (Rahn), le legs fait à une personne déterminée, sa donation (Hibah), la fondation pieuse (Waqf) en sa faveur, la garantie financière, la dégradation des biens, l'action en justice visant à prouver la condition d'esclave d'une personne de filiation inconnue, la fixation de la dot (Mahr) et la fixation de la compensation financière du divorce par rachat (Khul'). »</em> Fin de citation.</p>
<p>La sagesse — et Allah sait mieux — derrière l'acceptation du témoignage de la femme dans le domaine financier réside dans le fait que les transactions y sont très fréquentes et que les hommes comme les femmes y ont généralement accès. C'est pourquoi le Législateur a élargi les voies de sa recevabilité juridique.</p>
<p>De plus, Gloire à Lui, Il a placé la femme à la moitié de l'équivalent de l'homme dans plusieurs statuts juridiques : le premier est celui-ci (le témoignage), le deuxième concerne l'héritage, le troisième le prix du sang (<em>Diyah</em>), le quatrième le sacrifice de naissance (<em>'Aqîqah</em>), et le cinquième l'affranchissement de l'esclave.</p>
<p>De plus, Gloire à Lui, Il a explicité la sagesse en cela par Sa parole :</p>
<p class="ar"><span dir="rtl">﴿أَن تَضِلَّ إِحْدَىٰهُمَا فَتُذَكِّرَ إِحْدَىٰهُمَا الْأُخْرَىٰ﴾ [البقرة: ٢٨٢]</span></p>
<p><strong>﴾ Si l'une d'elles s'égare, l'autre lui rappellera [le fait] ﴿</strong> [Al-Baqarah : 282] ; c'est-à-dire qu'elle lui rappelle si elle vient à omettre, et cela est dû à la faiblesse de la mémorisation (<em>al-'aql</em> ici au sens de la rétention de mémoire). Une seule femme ne peut donc pas occuper la place d'un homme. Cependant, le fait de refuser totalement son témoignage conduirait à la perte de nombreux droits et à leur annulation ; c'est pourquoi sa semblable lui a été adjointe dans le témoignage afin de lui rafraîchir la mémoire si elle oublie. Ainsi, le témoignage de deux femmes équivaut à celui d'un homme.</p>
<p><strong>– Il est également accepté pour les affaires de biens matériels et ce qui vise un but pécuniaire : un seul témoin homme accompagné du serment du demandeur (le plaignant).</strong> Cela s'appuie sur la parole d'Ibn 'Abbâs : <em>« Le Messager d'Allah <span dir="rtl">ﷺ</span> a tranché en faveur d'un serment accompagné d'un seul témoin. »</em> Rapporté par Ahmad et d'autres.<a href="#fn10" class="footnote-ref" id="fnref10" role="doc-noteref"><sup>10</sup></a></p>
<p>L'Imam Ahmad (qu'Allah lui fasse miséricorde) a dit : <em>« La Sunnah constante veut que l'on tranche par le serment accompagné d'un seul témoin. »</em></p>
<p>Ibn al-Qayyim a dit <a href="#fn11" class="footnote-ref" id="fnref11" role="doc-noteref"><sup>11</sup></a>: « Et cela ne contredit en rien la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">"الْيَمِينُ عَلَى الْمُدَّعَى عَلَيْهِ"</span></p>
<p><em><strong>"Le serment incombe au défendeur (l'accusé)"</strong></em> <a href="#fn12" class="footnote-ref" id="fnref12" role="doc-noteref"><sup>12</sup></a>.</p>
<p><em>En effet, ce qui est visé par cette règle, c'est le cas où le demandeur n'a rien d'autre à présenter qu'une simple prétention ; on ne tranche pas en sa faveur sur la base d'une simple allégation. En revanche, si sa position se trouve renforcée par la présence d'un témoin, d'une présomption forte ou autre, on ne tranche pas en sa faveur sur la base de sa simple allégation, mais plutôt grâce à l'élément probant résultant de la conjonction du renforcement de sa position et du serment... »</em> Fin de citation.</p>
<p><strong>– Quant aux faits dont les hommes n'ont généralement pas connaissance — à l'instar des défauts physiques des femmes sous les vêtements, de la virginité ou de la non-virginité, des menstrues, de l'accouchement, de l'allaitement, du premier cri du nouveau-né à la naissance et des cas similaires —, le témoignage d'une seule femme intègre suffit à les établir.</strong> Cela s'appuie sur le hadith de Hudhayfah : <em>« Le Prophète <span dir="rtl">ﷺ</span> a validé le témoignage de la sage-femme à elle seule. »</em> Rapporté par al-Dâraqutnî et d'autres, bien que sa chaîne de transmission fasse l'objet de discussions <a href="#fn13" class="footnote-ref" id="fnref13" role="doc-noteref"><sup>13</sup></a>. De plus, le Prophète <span dir="rtl">ﷺ</span> a effectivement accepté le témoignage d'une seule femme au sujet de l'allaitement, comme cela est rapporté dans les deux recueils authentiques (<em>Al-Sahîhayn</em>) <a href="#fn14" class="footnote-ref" id="fnref14" role="doc-noteref"><sup>14</sup></a>.</p>
