<p>⁕ La reprise conjugale (Ar-Raj'ah) consiste à reprendre une épouse divorcée d'un divorce non définitif (révocable) pour la ramener à son statut conjugal antérieur, sans qu'il soit nécessaire de conclure un nouveau contrat.</p>
<p>⁕ Et sa preuve réside dans le Livre (le Coran), la Sunnah et le consensus des gens de science.</p>
<p>⁃ Dans la parole d'Allah Le Très Haut:</p>
<p class="ar"><span dir="rtl">﴿وَبُعُولَتُهُنَّ أَحَقُّ بِرَدِّهِنَّ فِي ذَٰلِكَ إِنْ أَرَادُوا إِصْلَاحًا﴾ [البقرة: ٢٢٨]</span></p>
<p><strong>﴾ Et leurs époux sont plus en droit de les reprendre durant cette période, s’ils veulent la réconciliation. ﴿</strong> [Al-Baqarah : 228]</p>
<p>Et Sa parole :</p>
<p class="ar"><span dir="rtl">﴿الطَّلَاقُ مَرَّتَانِ ۖ فَإِمْسَاكٌ بِمَعْرُوفٍ أَوْ تَسْرِيحٌ بِإِحْسَانٍ﴾ [البقرة: ٢٢٩]</span></p>
<p><strong>﴾ Le divorce [révocable] est permis deux fois. Alors, c’est soit la reprise de façon convenable, soit la libération avec gentillesse. ﴿</strong> [Al-Baqarah : 229]</p>
<p>Et Il a dit :</p>
<p class="ar"><span dir="rtl">﴿فَإِذَا بَلَغْنَ أَجَلَهُنَّ فَأَمْسِكُوهُنَّ بِمَعْرُوفٍ أَوْ فَارِقُوهُنَّ بِمَعْرُوفٍ﴾ [الطلاق: ٢]</span></p>
<p><strong>﴾ Puis, quand elles atteignent le terme de leur délai, retenez-les de façon convenable, ou séparez-vous d’elles de façon convenable. ﴿</strong> [At-Talâq : 2]</p>
<p>⁃ Et quant à la Sunnah, dans la parole du Prophète <span dir="rtl">ﷺ</span> concernant l'affaire d'Ibn 'Umar :</p>
<p class="ar"><span dir="rtl">«مُرْهُ فَلْيُرَاجِعْهَا»</span></p>
<p><em><strong>« Ordonne-le de la reprendre. »</strong></em><a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a></p>
<p>Et le Prophète <span dir="rtl">ﷺ</span> a divorcé de Hafsah puis l'a reprise.<a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a></p>
<p>⁃ Et quant au consensus, Ibn al-Mundhir a dit : <em>« Les gens de science ont unanimement convenu que si l'homme libre divorce moins de trois fois, et que l'esclave divorce moins de deux fois, ils ont tous deux le droit à la reprise conjugale durant la période de viduité ('Iddah). »</em></p>
<p>⁕ La sagesse derrière cela, c'est d'accorder à l'époux l'opportunité de réfléchir mûrement et de se rattraper s'il regrette le divorce et souhaite reprendre la vie commune avec son époque. Il trouve ainsi la porte ouverte devant lui, et cela relève de la miséricorde d'Allah envers Ses serviteurs.</p>
<p>⁕ Quant aux conditions de validité de la reprise conjugale, elles sont :</p>
<p><strong>Premièrement:</strong> Que le divorce soit inférieur au nombre total de divorces dont dispose l'époux ; par exemple, qu'un homme libre divorce moins de trois fois, et un esclave moins de deux fois. S'il a épuisé tout le quota de divorces dont il dispose, elle ne lui est plus licite jusqu'à ce qu'elle épouse un autre homme (et que ce mariage soit consommé et rompu).</p>
<p><strong>Deuxièmement :</strong> Que le mariage ait été consommé avec la femme divorcée. S'il divorce d'elle avant la consommation, il ne dispose d'aucun droit de reprise conjugale, car elle n'a pas de période de viduité (<em>'Iddah</em>) à observer. Cela est conforme à la parole de Allah le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿يَٰأَيُّهَا ٱلَّذِينَ ءَامَنُوٓاْ إِذَا نَكَحْتُمُ ٱلْمُؤْمِنَٰتِ ثُمَّ طَلَّقْتُمُوهُنَّ مِن قَبْلِ أَن تَمَسُّوهُنَّ فَمَا لَكُمْ عَلَيْهِنَّ مِنْ عِدَّةٍ تَعْتَدُّونَهَا﴾ [الأحزاب: ٤٩].</span></p>
<p><strong>﴾ Ô vous qui croyez ! Quand vous vous mariez avec des croyantes et qu'ensuite vous divorcez d'avec elles avant de les avoir touchées, vous n'avez pas de période d'attente à leur imposer ﴿</strong> [Al-Ahzâb : 49].</p>
<p><strong>Troisièmement :</strong> Que le divorce soit prononcé sans contrepartie (compensation financière). S'il a lieu moyennant une contrepartie, elle ne lui est plus licite qu'à travers un nouveau contrat de mariage et avec son plein consentement. En effet, elle n'a offert cette contrepartie financière que pour se racheter et se libérer de lui, et son objectif ne serait pas atteint si le droit de reprise conjugale était maintenu pour le mari.</p>
<p><strong>Quatrièmement :</strong> Que le mariage initial ait été valide (<em>Sahîh</em>). En revanche, s'il divorce dans le cadre d'un mariage invalide (<em>Fâsid</em>), il n'a pas de droit de reprise conjugale, car elle se sépare définitivement de lui dès la prononciation du divorce.</p>
<p><strong>Cinquièmement :</strong> Que la reprise conjugale ait lieu pendant la période de viduité (<em>'Iddah</em>), conformément à la parole de Allah le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿وَبُعُولَتُهُنَّ أَحَقُّ بِرَدِّهِنَّ فِي ذَٰلِكَ﴾ [البقرة: ٢٢٨]</span></p>
<p><strong>﴾ Et leurs époux ont plus de droit à les reprendre pendant cette période ﴿</strong> [Al-Baqarah : 228] ; c'est-à-dire qu'ils sont prioritaires et plus en droit de faire leur reprise conjuguale tant qu'elles se trouvent en période de viduité.</p>
<p><strong>Sixièmement :</strong> Que la reprise conjugale soit effective et immédiate (<em>Mounjazah</em>). Elle n'est pas valable si elle est suspendue à une condition future, comme s'il disait : « S'il se passe telle chose, alors j'effectue ma reprise conjugale ».</p>
<p>⁕ <strong>Est-il conditionné que les deux époux visent la réconciliation à travers la reprise conjugale ?</strong></p>
<p>Certains savants ont dit : Cela est conditionné, car Allah dit :</p>
<p class="ar"><span dir="rtl">﴿إِنْ أَرَادُوا إِصْلَاحًا﴾ [البقرة: ٢٢٨]</span></p>
<p><strong>« S'ils veulent la réconciliation » [Al-Baqarah : 228].</strong></p>
<p>Cheikh al-Islam Ibn Taymiyyah a dit : <em>« On ne permet la reprise conjuguale qu'à celui qui veut la réconciliation et le comportement convenable (pour maintenir l'union).»</em></p>
<p>D'autres ont dit : Cela n'est pas conditionné, car le verset indique seulement une incitation à la réconciliation et l'interdiction de nuire, et non le fait d'en faire une condition de validité. Cependant, le premier avis est le plus évident. Et Allah sait mieux.</p>
<p>⁕ La reprise conjugale s'effectue par une formulation explicite, telle que : « Je reprends mon épouse », ou des expressions similaires comme : « Je la réintègre », « Je la garde », « Je la ramène »... et tout ce qui y ressemble. La reprise conjugale s'effectue également par le rapport charnel, si l'époux en a l'intention, selon l'avis authentique.</p>
<p>⁕ Lorsqu'il la reprend, il est recommandé (<em>Sunnah</em>) de prendre des témoins pour cela. Il a aussi été dit que le témoignage est obligatoire, conformément à la parole d'Allah le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿وَأَشْهِدُوا ذَوَيْ عَدْلٍ مِّنكُمْ﴾ [الطلاق: ٢]</span></p>
<p><strong>﴾ Et prenez pour témoins deux hommes intègres parmi vous ﴿</strong> [At-Talâq : 2]. C'est d'ailleurs une version rapportée de l'Imam Ahmad. Le Cheikh Taqiyiddîn (Ibn Taymiyyah) a dit : <em>« La reprise conjugale n'est en aucun cas valable si elle est gardée secrète »</em>.</p>
<p>⁕ La femme divorcée d'un divorce révocable (<em>Raj'iyyah</em>) conserve son statut d'épouse tant qu'elle est en période de viduité (<em>'Iddah</em>). Elle a les mêmes droits que les épouses en matière de prise en charge financière, de vêtement et de logement. Elle a également les mêmes devoirs que l'épouse, à savoir l'obligation de demeurer dans le domicile conjugal. Elle s'embellit pour son mari afin que, peut-être, il la reprenne. De plus, chacun d'eux hérite de l'autre si l'un vient à mourir durant la période de viduité. Le mari a le droit de voyager avec elle, de s'isoler avec elle (<em>Khalwah</em>), et d'avoir des rapports charnels avec elle.</p>
<p>⁕ Le délai pour la reprise conjugale prend fin avec l'expiration de la période de viduité. Ainsi, dès que la femme divorcée d'un divorce révocable se purifie de ses troisièmes menstrues, elle ne lui est plus licite, sauf par un nouveau contrat de mariage, impliquant la présence d'un tuteur (<em>Walî</em>) et de deux témoins intègres. Ceci découle du sens implicite (<em>Mafhûm</em>) de la parole d'Allah le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿وَبُعُولَتُهُنَّ أَحَقُّ بِرَدِّهِنَّ فِي ذَٰلِكَ﴾ [البقرة: ٢٢٨]</span></p>
<p><strong>﴾ Et leurs époux seront plus en droit de les reprendre pendant cette période ﴿</strong> [Al-Baqarah : 228], c'est-à-dire : durant la période de viduité. Le sens implicite du verset indique donc que lorsque sa période de viduité est terminée, elle ne lui est plus permise, sauf par un nouveau contrat remplissant toutes ses conditions. Et s'il la reprend durant la période de viduité par une reprise conjugale valide et conforme à ses conditions, il ne disposera plus, concernant le nombre de divorces possibles, que de ce qu'il lui restait.</p>
<p>⁕ Et s'il a épuisé le nombre de divorces dont il disposait (trois divorces), elle lui devient interdite jusqu'à ce qu'un autre époux ait des rapports charnels avec elle dans le cadre d'un mariage valide. Ainsi, trois conditions sont requises pour qu'elle redevienne licite au premier époux : qu'elle épouse un autre mari que lui, que ce mariage soit valide, et que le second époux consomme le mariage par un rapport charnel (dans le sexe). Ceci conformément à la parole d'Allah le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿فَإِن طَلَّقَهَا فَلَا تَحِلُّ لَهُ مِن بَعْدُ حَتَّىٰ تَنكِحَ زَوْجًا غَيْرَهُ ۗ فَإِن طَلَّقَهَا فَلَا جُنَاحَ عَلَيْهِمَا أَن يَتَرَاجَعَا إِن ظَنَّا أَن يُقِيمَا حُدُودَ اللَّهِ﴾ [البقرة: ٢٣٠].</span></p>
<p><strong>﴾ S’il divorce d’avec elle (la troisième fois), alors elle ne lui sera plus licite tant qu’elle n’aura pas épousé un autre homme. Et si ce dernier divorce d’avec elle, alors il n’y a aucun grief à ce qu’ils se reprennent (par une reprise conjugale via un nouveau contrat), pourvu qu’ils pensent pouvoir observer les lois d'Allah ﴿</strong> [Al-Baqarah : 230].</p>
<p>L'érudit Ibn al-Qayyim a dit <a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a>: <em>« Le fait qu'elle lui redevienne permise après avoir épousé un autre homme compte parmi les plus grands bienfaits. La législation de la Thora permettait à l'homme de reprendre sa femme après le divorce tant qu'elle ne s'était pas remariée..., puis la législation de l'Évangile est venue interdire définitivement le divorce. Quant à notre législation (l'Islam), elle est plus parfaite et plus droite concernant les intérêts des serviteurs : elle a rendu licite pour l'homme d'avoir jusqu'à quatre épouses, et de jouir de l'intimité de ses esclaves selon son bon vouloir [par le droit de propriété], et lui a accordé le droit de se séparer d'elle (par le divorce). Puis, si son âme aspire de nouveau à elle, il trouve un moyen de la récupérer (pendant la viduité). Mais s'il divorce d'avec elle la troisième fois, il n'a plus aucun moyen de la récupérer, si ce n'est après qu'elle ait contracté un second mariage par inclination réelle et désir sincère »</em>. Fin de citation.</p>
<p>C'est-à-dire : il est indispensable que le mariage du second époux avec elle soit un mariage fondé sur le désir sincère de l'épouser, et non un mariage de ruse visant à la rendre de nouveau licite au premier mari. Autrement, cet homme ne serait qu'un "bouc de location", comme l'a qualifié le Prophète <span dir="rtl">ﷺ</span>. Un tel mariage est nul (<em>Bâtil</em>) et ne la rend pas licite au premier époux. Et Allah est Le plus Savant.</p>
