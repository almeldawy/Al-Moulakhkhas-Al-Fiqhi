<p>⁕ Le <em>Zhihâr</em> désigne ici le fait qu'un homme dise à son épouse, lorsqu'il souhaite s'abstenir de jouir d'elle : <em>« Tu es pour moi comme le dos de ma mère »</em>, ou de ma sœur, ou de toute femme qui lui est interdite par les liens du sang (parenté), de l'allaitement ou de l'alliance. Ainsi, dès lors qu'il assimile son épouse – ou une partie d'elle – à une femme qui lui est interdite, il commet le <em>Zhihâr</em> à son encontre.</p>
<p>⁕ Son statut juridique est qu'il est strictement interdit, conformément à la parole d'Allah le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿الَّذِينَ يُظَاهِرُونَ مِنْكُمْ مِنْ نِسَائِهِمْ مَا هُنَّ أُمَّهَاتِهِمْ إِنْ أُمَّهَاتُهُمْ إِلَّا اللَّائِي وَلَدْنَهُمْ وَإِنَّهُمْ لَيَقُولُونَ مُنْكَرًا مِنَ الْقَوْلِ وَزُورًا...﴾ [المجادلة: ٢]</span></p>
<p><strong>﴾ Ceux d'entre vous qui répudient leurs femmes par le Zhihâr [en les comparant à leurs mères]... Elles ne sont pas leurs mères. Leurs mères ne sont que celles qui les ont enfantés. Ils prononcent certes une parole blâmable et un mensonge... ﴿</strong> [Al-Mujâdalah : 2]. C'est-à-dire qu'ils prononcent des paroles obscènes et vaines, non reconnues par la législation islamique. C'est plutôt un pur mensonge, une interdiction absolue et un propos blâmable. En effet, celui qui commet le <em>Zhihâr</em> s'interdit ce qu'Allah ne lui a pas interdit, et assimile à cet égard son épouse à sa propre mère, alors qu'elle ne l'est pas.</p>
<p>⁕ Le <em>Zhihâr</em> faisait office de divorce à l'époque préislamique (<em>Al-Jâhilîyyah</em>). À l'avènement de l'Islam, cette pratique a été réprouvée et considérée comme un serment nécessitant une expiation (<em>Kaffârah</em>). Il est donc interdit à l'auteur du <em>Zhihâr</em> ainsi qu'à son épouse de jouir l'un de l'autre – que ce soit par les rapports intimes ou ce qui y conduit – avant que le mari n'ait expié son acte. Cela repose sur la parole d'Allah le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿وَالَّذِينَ يُظَاهِرُونَ مِنْ نِسَائِهِمْ ثُمَّ يَعُودُونَ لِمَا قَالُوا فَتَحْرِيرُ رَقَبَةٍ مِنْ قَبْلِ أَنْ يَتَمَاسَّا...﴾ [المجادلة: ٣]</span></p>
<p><strong>﴾ Ceux qui comparent leurs femmes au dos de leurs mères, puis reviennent sur ce qu'ils ont dit, doivent affranchir un esclave avant d'avoir tout contact charnel... ﴿</strong> [Al-Mujâdalah : 3].</p>
<p>De plus, le Prophète <span dir="rtl">ﷺ</span> a dit à celui qui avait commis le <em>Zhihâr</em> :</p>
<p class="ar"><span dir="rtl">«لَا تَقْرَبْهَا حَتَّى تَفْعَلَ مَا أَمَرَكَ اللهُ بِهِ»</span></p>
<p><em><strong>« Ne t'approche pas d'elle jusqu'à ce que tu accomplisses ce qu'Allah t'a ordonné »</strong></em>. Rapporté et authentifié par Al-Tirmidhî <a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a>.</p>
<p>⁕ Il incombe donc à l'auteur du <em>Zhihâr</em>, dès lors qu'il est résolu à avoir un rapport charnel avec l'épouse envers qui il l'a commis, d'accomplir l'expiation (<em>Al-Kaffârah</em>) avant cela. Ceci conformément à la parole d'Allah le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿فَتَحْرِيرُ رَقَبَةٍ مِنْ قَبْلِ أَنْ يَتَمَاسَّا ذَلِكُمْ تُوعَظُونَ بِهِ وَاللهُ بِمَا تَعْمَلُونَ خَبِيرٌ ۝ فَمَنْ لَمْ يَجِدْ فَصِيَامُ شَهْرَيْنِ مُتَتَابِعَيْنِ مِنْ قَبْلِ أَنْ يَتَمَاسَّا﴾ [المجادلة: ٣، ٤]</span></p>
<p><strong>﴾ ...doivent affranchir un esclave avant d'avoir tout contact charnel. C'est ce à quoi vous êtes exhortés. Et Allah est Parfaitement Connaisseur de ce que vous faites. Quiconque n'en trouve pas les moyens doit jeûner deux mois consécutifs avant d'avoir tout contact charnel. ﴿</strong> [Al-Mujâdalah : 3-4].</p>
<p>Ces deux nobles versets prouvent ainsi l'obligation de l'expiation du <em>Zhihâr</em> en cas de rapport avec l'épouse visée, et qu'il est impératif de s'en acquitter avant le rapport sexuel dès que l'on est résolu à le faire. De même, l'interdiction de son épouse à son égard persiste tant qu'il n'a pas expié son acte ; et ceci est l'avis de la majorité des gens de science.</p>
<p>⁕ <strong>L'expiation du <em>Zhihâr</em> doit obligatoirement être accomplie selon un ordre précis (graduel) :</strong></p>
<ol type="1">
<li><blockquote>
<p>l'affranchissement d'un esclave.</p>
</blockquote></li>
<li><blockquote>
<p>Si l'homme ne trouve pas d'esclave ou n'en a pas les moyens financiers, il doit alors jeûner deux mois consécutifs.</p>
</blockquote></li>
<li><blockquote>
<p>S'il est incapable de jeûner en raison d'une maladie ou d'un motif semblable, il doit alors nourrir soixante pauvres.</p>
</blockquote></li>
</ol>
<p>Cela repose sur la parole d'Allah le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿وَالَّذِينَ يُظَاهِرُونَ مِنْ نِسَائِهِمْ ثُمَّ يَعُودُونَ لِمَا قَالُوا فَتَحْرِيرُ رَقَبَةٍ مِنْ قَبْلِ أَنْ يَتَمَاسَّا ذَلِكُمْ تُوعَظُونَ بِهِ وَاللهُ بِمَا تَعْمَلُونَ خَبِيرٌ ۝ فَمَنْ لَمْ يَجِدْ فَصِيَامُ شَهْرَيْنِ مُتَتَابِعَيْنِ مِنْ قَبْلِ أَنْ يَتَمَاسَّا فَمَنْ لَمْ يَسْتَطِعْ فَإِطْعَامُ سِتِّينَ مِسْكِينًا﴾ [المجادلة: ٣، ٤]</span></p>
<p><strong>﴾ Ceux qui comparent leurs femmes au dos de leurs mères, puis reviennent sur ce qu'ils ont dit, doivent affranchir un esclave avant d'avoir tout contact charnel. C'est ce à quoi vous êtes exhortés. Et Allah est Parfaitement Connaisseur de ce que vous faites. Quiconque n'en trouve pas les moyens doit jeûner deux mois consécutifs avant d'avoir tout contact charnel. Mais s'il ne peut le faire, il doit alors nourrir soixante pauvres. ﴿</strong> [Al-Mujâdalah : 3-4].</p>
<p>Et le sens de : <strong>﴾ ...comparent leurs femmes au dos de leurs mères... ﴿</strong> est que l'un d'entre eux dise à son épouse : <em>« Tu es pour moi comme le dos de ma mère »</em>, ou une formule semblable.</p>
<p><strong>﴾ ...puis reviennent sur ce qu'ils ont dit... ﴿</strong> ; c'est-à-dire qu'ils désirent avoir des rapports charnels avec leurs épouses envers qui ils ont commis le <em>Zhihâr</em>.</p>
<p><strong>﴾ ...doivent affranchir un esclave avant d'avoir tout contact charnel... ﴿</strong> ; c'est-à-dire qu'il leur est obligatoire d'accomplir l'expiation avant le rapport intime, en libérant une âme de l'esclavage s'il la possède déjà, ou s'il est capable de l'acheter à un prix qui excède ses propres besoins vitaux ainsi que les besoins de ceux qui sont à sa charge.</p>
<p>⁕ Il est exigé, concernant l'esclave, qu'il soit croyant. Ceci en raison de la parole d'Allah le Très-Haut au sujet de l'expiation du homicide involontaire :</p>
<p class="ar"><span dir="rtl">﴿وَمَنْ قَتَلَ مُؤْمِنًا خَطَأً فَتَحْرِيرُ رَقَبَةٍ مُؤْمِنَةٍ﴾ [النساء: ٩٢]</span></p>
<p><strong>﴾ Quiconque tue par erreur un croyant doit affranchir un esclave croyant ﴿</strong> [An-Nisâ' : 92]. L'expiation du <em>Zhihâr</em> est donc établie par analogie (<em>Qiyâs</em>) avec celle-ci, appliquant ainsi la règle qui consiste à porter l'énoncé absolu (<em>Mutlaq</em>) sur l'énoncé restreint (<em>Muqayyad</em>).</p>
<p>De même, il est exigé que l'esclave soit exempt de tout défaut physique nuisant de manière évidente à sa capacité de travailler. En effet, le but recherché par l'affranchissement est de restituer à l'esclave la pleine jouissance de ses capacités et de lui permettre d'agir pour son propre compte. Or, cet objectif ne peut être atteint en présence d'une infirmité qui entrave manifestement le travail, telle que la cécité, la paralysie d'une main ou d'une jambe, ou tout autre handicap similaire.</p>
<p>⁕ <strong>Il est exigé, pour la validité de l'expiation par le jeûne :</strong></p>
<ul>
<li><blockquote>
<p><strong>Premièrement :</strong> Qu'il ne soit pas capable d'affranchir un esclave.</p>
</blockquote></li>
<li><blockquote>
<p><strong>Deuxièmement :</strong> Qu'il jeûne deux mois consécutifs, de sorte qu'il n'interrompe pas les jours de jeûne au cours de ces deux mois, sauf par un jeûne obligatoire, comme le jeûne de Ramadan, ou par une rupture obligatoire du jeûne, comme la rupture lors du jour de l'Aïd et des jours de <em>Tashrîq</em> (les trois jours suivant l'Aïd al-Adha), ou encore par une rupture due à une excuse valable qui la permet, comme le voyage ou la maladie. La rupture du jeûne dans ces situations-là n'interrompt pas la continuité.</p>
</blockquote></li>
<li><blockquote>
<p><strong>Troisièmement :</strong> Qu'il formule l'intention de jeûner pour l'expiation depuis la nuit (avant l'aube).</p>
</blockquote></li>
</ul>
<p>⁕ <strong>Et s'il s'acquitte de l'expiation par la nourriture, il est exigé pour sa validité :</strong></p>
<ul>
<li><blockquote>
<p><strong>Premièrement :</strong> Qu'il ne soit pas capable de jeûner.</p>
</blockquote></li>
<li><blockquote>
<p><strong>Deuxièmement :</strong> Que le pauvre nourri soit un musulman libre à qui il est permis de donner la Zakat.</p>
</blockquote></li>
<li><blockquote>
<p><strong>Troisièmement :</strong> Que la quantité donnée à chaque pauvre ne soit pas inférieure à un <em>Mudd</em> de blé, ou à un demi-<em>Sâ'</em> s'il s'agit d'une autre denrée.</p>
</blockquote></li>
</ul>
<p>⁕ Et il est exigé, pour la validité de l'expiation de manière générale, d'en avoir l'intention (<em>An-Niyyah</em>). Ceci conformément à la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«إِنَّمَا الْأَعْمَالُ بِالنِّيَّاتِ، وَإِنَّمَا لِكُلِّ امْرِئٍ مَا نَوَى»</span></p>
<p><em><strong>« Les actions ne valent que par les intentions, et chaque personne n'aura que ce qu'elle a eu l'intention d'accomplir »</strong></em> <a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a>.</p>
<p>⁕ <strong>La preuve tirée de la Sunnah purifiée</strong> – venant s'ajouter à la preuve du Coran – concernant l'expiation du <em>Zhihâr</em> et son accomplissement selon cet ordre précis, réside dans ce qu'a rapporté Khawlah bint Mâlik ibn Tha'labah (qu'Allah l'agrée). Elle a dit : <strong>« Aws ibn As-Sâmit a commis le <em>Zhihâr</em> à mon encontre. Je me suis donc rendue chez le Messager d'Allah <span dir="rtl">ﷺ</span> pour lui exprimer ma plainte, tandis que le Messager d'Allah <span dir="rtl">ﷺ</span> argumentait avec moi à ce sujet en me disant : "Crains Allah, car il est le fils de ton oncle". Je ne cessai de discuter jusqu'à ce que le Coran descende :</strong></p>
<p class="ar"><em><strong><span dir="rtl">﴿قَدْ سَمِعَ اللهُ قَوْلَ الَّتِي تُجَادِلُكَ فِي زَوْجِهَا﴾ [المجادلة: ١]</span></strong></em></p>
<p><strong><em>﴾ Allah a bien entendu la parole de celle qui discutait avec toi à propos de son époux... ﴿</em> [Al-Mujâdalah : 1].</strong></p>
<p><strong>Le Prophète dit alors : "Qu'il affranchisse un esclave". Elle répondit : "Il n'en trouve pas". Il dit : "Qu'il jeûne alors deux mois consécutifs". » Elle dit : « Ô Messager d'Allah ! C'est un vieil homme, il n'a pas la force de jeûner ». Il dit : « Qu'il nourrisse alors soixante pauvres ». Elle dit : « Il n'a rien à donner en aumône ». Il dit : « Je vais donc l'aider avec un <em>'Araq</em> (grand panier) de dattes ». Elle dit : « Ô Messager d'Allah ! Et moi je vais l'aider avec un autre <em>'Araq</em> ». Il dit : « Tu as bien agi. Va, nourris de sa part soixante pauvres avec cela, puis retourne auprès du fils de ton oncle »</strong>. Le <em>'Araq</em> équivaut à soixante <em>Sâ'</em>. Rapporté par Abû Dâwûd <a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a>.</p>
<p>Telle est notre immense religion : elle renferme une solution à chaque problème, y compris les différends conjugaux. Ainsi, la voilà qui résout le problème du <em>Zhihâr</em>, qui était pourtant un problème inextricable à l'époque préislamique (<em>Al-Jâhilîyyah</em>), au point qu'ils n'y trouvaient d'autre issue que la séparation définitive des époux et l'éclatement de la famille. Quelle magnifique religion !</p>
<p>De plus, nous constatons que dans l'obligation de cette expiation, la religion a pris en considération la situation financière et physique du mari. Elle a légiféré pour chaque situation ce qui lui correspond parmi ce que l'époux est capable d'accomplir : de l'affranchissement, au jeûne, jusqu'à la nourriture. À Allah seul revient la louange.</p>
