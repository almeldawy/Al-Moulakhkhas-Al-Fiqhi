<p>⁕ Parmi les effets du divorce figure la période de viduité (<em>Al-Iddah</em>), par laquelle on désigne l'attente temporaire définie par la législation islamique.</p>
<p>⁕ Et sa preuve réside dans le Livre (le Coran), la Sunnah et le consensus (<em>Al-Ijmâ'</em>) :</p>
<p>⁃ Quant au Livre, il y a la parole d'Allah le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿وَالْمُطَلَّقَاتُ يَتَرَبَّصْنَ بِأَنْفُسِهِنَّ ثَلَاثَةَ قُرُوءٍ﴾ [البقرة: ٢٢٨]</span></p>
<p><strong>﴾ Et les femmes divorcées doivent observer un délai d'attente de trois cycles menstruels. ﴿</strong> [Al-Baqarah : 228]</p>
<p>Et Sa parole, le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿وَاللَّائِي يَئِسْنَ مِنَ الْمَحِيضِ مِنْ نِسَائِكُمْ إِنِ ارْتَبْتُمْ فَعِدَّتُهُنَّ ثَلَاثَةُ أَشْهُرٍ وَاللَّائِي لَمْ يَحِضْنَ وَأُولَاتُ الْأَحْمَالِ أَجَلُهُنَّ أَنْ يَضَعْنَ حَمْلَهُنَّ﴾ [الطلاق: ٤]</span></p>
<p><strong>﴾ Si vous avez des doutes au sujet de celles de vos femmes qui n'espèrent plus avoir de menstrues, leur délai d'attente est de trois mois. Il en est de même pour celles qui n'ont pas encore de menstrues. Quant à celles qui sont enceintes, leur période d'attente se termine par leur accouchement. ﴿</strong> [At-Talâq : 4]</p>
<p>Et la preuve tirée de la Sunnah est le hadith d'Aïcha, qu'Allah l'agrée, qui a dit :</p>
<p class="ar">«<span dir="rtl">أُمِرَتْ بَرِيرَةُ أَنْ تَعْتَدَّ بِثَلَاثِ حِيَض</span>ٍ»</p>
<p>« Il a été ordonné à Barîrah d'observer une période de viduité de trois menstrues. » Rapporté par Ibn Mâjah <a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a>, ainsi que d'autres hadiths.</p>
<p>⁕ Quant à la sagesse derrière la légifération de la période de viduité (<em>Al-Iddah</em>), elle réside dans la sûreté de la vacuité de l'utérus de la femme de toute grossesse, afin d'éviter la confusion des filiations. De même, elle permet d'offrir l'opportunité au mari ayant divorcé de reprendre son épouse s'il regrette son acte, dans le cas où le divorce est révocable (<em>Raj'î</em>). Parmi ses sagesses figurent également la mise en valeur de la grandeur du contrat de mariage et de son caractère sacré, ainsi que la considération du droit du mari divorcé. Elle contient aussi la préservation du droit du fœtus dans le cas où la femme séparée est enceinte. En somme, la période de viduité constitue une enceinte protectrice pour le mariage précédent.</p>
<p>⁕ Quant à celles à qui incombe la période de viduité (<em>Al-Iddah</em>) : <strong>la période de viduité s'impose à toute femme qui s'est séparée de son mari par un divorce, ou par un <em>Khoul'</em> (divorce par rachat), ou par une annulation de mariage (<em>Faskh</em>), ou s'il est mort en la laissant</strong> ; ceci à condition que le mari qui se sépare d'elle se soit isolé seul avec elle alors qu'elle était consentante, tout en ayant connaissance de sa présence et la capacité d'avoir des rapports intimes avec elle. Et ce, que l'épouse soit libre ou esclave, et qu'elle soit pubère ou jeune fille en âge d'avoir des rapports.</p>
<p>⁕ Quant à celle dont le mari s'est séparé de son vivant par un divorce ou autre, avant la consommation du mariage (<em>Ad-Dukhûl</em>) : elle n'a pas de période de viduité à observer. Ceci en raison de la parole d'Allah le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿يَا أَيُّهَا الَّذِينَ آمَنُوا إِذَا نَكَحْتُمُ الْمُؤْمِنَاتِ ثُمَّ طَلَّقْتُمُوهُنَّ مِنْ قَبْلِ أَنْ تَمَسُّوهُنَّ فَمَا لَكُمْ عَلَيْهِنَّ مِنْ عِدَّةٍ تَعْتَدُّونَهَا﴾ [الأحزاب: ٤٩]</span></p>
<p><strong>﴾ Ô vous qui croyez ! Quand vous mariez de croyantes et que vous divorcez d'avec elles avant de les avoir touchées, vous n'avez pas de période d'attente à leur imposer. ﴿</strong> [Al-Ahzâb : 49]</p>
<p>Et le sens de : <em><strong>« à leur imposer »</strong></em> (<span dir="rtl">تَعْتَدُّونَهَا</span>) signifie : vous n'avez pas à compter pour elles ce délai en cycles menstruels ou en mois. Et le sens de : <em><strong>« de les avoir touchées »</strong></em> (<span dir="rtl">تَمَسُّوهُن</span>َّ) signifie : avoir eu des rapports intimes avec elles. Ce noble verset démontre donc qu'il n'y a pas de période de viduité pour celle qui est divorcée avant la consommation du mariage, et il n'y a aucune divergence à ce sujet parmi les gens de science. De plus, la mention des « croyantes » ici relève de la figure de style de la prépondérance (<em>At-Taghlîb</em>), car il n'y a aucune différence dans cette règle entre les épouses croyantes et celles issues des gens du Livre (juives ou chrétiennes), et ce, par consensus des gens de science.</p>
<p>⁕ Quant à celle séparée [de son mari] en raison du décès : elle doit absolument observer une période de viduité, que le décès soit survenu avant la consommation du mariage ou après. Cela s'applique en raison de la portée générale de la parole d'Allah le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿وَالَّذِينَ يُتَوَفَّوْنَ مِنْكُمْ وَيَذَرُونَ أَزْوَاجاً يَتَرَبَّصْنَ بِأَنْفُسِهِنَّ أَرْبَعَةَ أَشْهُرٍ وَعَشْراً﴾ [البقرة: ٢٣٤]</span></p>
<p><strong>﴾ Ceux d'entre vous que la mort frappe et qui laissent des épouses : celles-ci doivent observer une période d'attente de quatre mois et dix jours. ﴿</strong> [Al-Baqarah : 234]</p>
<p>Et il n'est parvenu aucun texte textuel pour en restreindre la portée.</p>
<p>Quant aux catégories de femmes soumises à la période de viduité, elles sont globalement au nombre de six :</p>
<ol type="1">
<li><blockquote>
<p>La femme enceinte.</p>
</blockquote></li>
<li><blockquote>
<p>La femme dont le mari est décédé sans qu'elle ne porte de grossesse de lui.</p>
</blockquote></li>
<li><blockquote>
<p>La femme non enceinte qui a ses menstrues et dont la séparation a eu lieu du vivant du mari.</p>
</blockquote></li>
<li><blockquote>
<p>La femme non enceinte qui n'a pas ses menstrues en raison de son jeune âge ou de la ménopause, et qui est séparée de son vivant.</p>
</blockquote></li>
<li><blockquote>
<p>Celle dont les menstrues se sont interrompues sans qu'elle n'en connaisse la cause.</p>
</blockquote></li>
<li><blockquote>
<p>L'épouse de l'homme disparu.</p>
</blockquote></li>
</ol>
<p>Et voici l'explication détaillée de cela :</p>
<p>⁕ La femme enceinte observe sa période de viduité jusqu'à son accouchement, que la séparation ait eu lieu de son vivant (par le divorce) ou par la mort. Cela s'applique en raison de la parole d'Allah le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿وَأُولَاتُ الْأَحْمَالِ أَجَلُهُنَّ أَنْ يَضَعْنَ حَمْلَهُنَّ﴾ [الطلاق: ٤]</span></p>
<p><strong>﴾ Quant à celles qui sont enceintes, leur période d'attente se termine par leur accouchement. ﴿</strong> [At-Talâq : 4]</p>
<p>Ce noble verset démontre ainsi que la période de viduité de la femme enceinte prend fin au moment où elle dépose son fardeau (accouche), qu'elle soit veuve ou séparée de son vivant. Cependant, certains parmi les prédécesseurs (<em>Al-Salaf</em>) étaient d'avis que la femme enceinte dont le mari est décédé devait observer le plus long des deux délais. Malgré cela, un consensus (<em>Ijmâ'</em>) s'est établi par la suite sur le fait que sa période de viduité prend fin dès son accouchement.</p>
<p>⁃ Cependant, toute expulsion de fœtus ne met pas fin à la période de viduité. Ce qui est visé ici, c'est uniquement la grossesse par laquelle la forme humaine est devenue distincte. Quant au cas où la femme expulserait un embryon (<em>Mudghah</em>) dont les traits humains ne sont pas encore formés, sa période de viduité ne prend pas fin par cela.</p>
<p>⁃ De même, il est conditionné pour que la période de viduité prenne fin par l'accouchement que cette grossesse soit légalement affiliée au mari qui s'est séparé d'elle. Si cette grossesse ne peut lui être affiliée – du fait que ce mari est trop jeune pour procréer ou en raison d'une infirmité congénitale, ou parce qu'elle a accouché moins de six mois après la conclusion du contrat de mariage alors que la cohabitation était possible, et que le nouveau-né a survécu –, sa période de viduité vis-à-vis de lui ne prend pas fin par cet accouchement, car la filiation avec lui n'est pas établie.</p>
<p>⁃ Et la durée minimale d'une grossesse est de six mois. Cela s'appuie sur la parole d'Allah le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿وَحَمْلُهُ وَفِصَالُهُ ثَلَاثُونَ شَهْراً﴾ [الأحقاف: ١٥]</span></p>
<p><strong>﴾ ... et sa gestation ainsi que son sevrage durent trente mois... ﴿</strong> [Al-Ahqâf : 15]</p>
<p>conjointement avec Sa parole, le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿وَالْوَالِدَاتُ يُرْضِعْنَ أَوْلَادَهُنَّ حَوْلَيْنِ كَامِلَيْنِ﴾ [البقرة: ٢٣٣]</span></p>
<p><strong>﴾ Et les mères allaitent leurs enfants deux années complètes... ﴿</strong> [Al-Baqarah : 233]</p>
<p>Ainsi, si l'on soustrait la durée de l'allaitement – qui est de deux ans, soit vingt-quatre mois – des trente mois, il reste six mois, ce qui constitue la durée minimale de la gestation ; et en deçà de ce terme, aucun enfant ne peut naître viable.</p>
<p>Quant à la durée maximale de la grossesse, elle fait l'objet d'une divergence parmi les gens de science. L'avis prépondérant (<em>Al-Râjih</em>) est qu'il convient de se référer, à ce sujet, à la réalité constatée (l'existence factuelle). Al-Muwaffaq Ibn Qudâmah a dit : « Ce pour quoi il n'existe pas de texte scripturaire explicite (<em>Nass</em>), on se réfère à la réalité constatée ; or, il a déjà été constaté des grossesses de cinq ans et plus. »</p>
<p>Et la durée de grossesse la plus courante est de neuf mois, car la majorité des femmes accouchent au cours de ce terme ; c'est donc cela qui a été pris en considération.</p>
<p>⁃ Par ailleurs, le fœtus bénéficie d'un caractère sacré au sein de la législation islamique (<em>Al-Shari'ah</em>). Il n'est donc pas permis de lui porter atteinte ni de lui nuire. Si, à la suite d'une agression contre lui, il est expulsé mort après que l'âme lui a été insufflée, le prix du sang (<em>Al-Diyah</em>) ainsi que l'expiation (<em>Al-Kaffârah</em>) deviennent alors obligatoires. De même, si une peine légale (<em>Hadd</em>) impliquant la flagellation ou la lapidation est requise à l'encontre de la femme enceinte, l'application de cette peine est suspendue jusqu'à ce qu'elle accouche. De plus, il n'est pas permis à sa mère de l'avorter en absorbant un médicament ou par tout autre procédé similaire.</p>
<p>Tout cela démontre l'exhaustivité et la globalité de cette législation, qui prend en considération jusqu'aux fœtus dans les matrices en leur accordant un statut sacré. Louange donc à Allah, Seigneur de l'univers, pour cette législation parfaite et juste. Et nous Lui demandons de nous accorder de nous y cramponner fermement et d'agir en conformité avec ses règles, en Lui vouant un culte exclusif, en toute sincérité, dussent les mécréants en avoir de l'aversion.</p>
<p>⁕ Quant à la femme dont le mari est décédé, si elle n'est pas enceinte : elle doit observer une période de viduité de quatre mois et dix jours, que le décès soit survenu avant la consommation du mariage ou après, et que l'épouse soit en âge d'avoir des rapports intimes ou non. Cela s'applique en raison de la portée générale de la parole d'Allah le Très-Haut :</p>
<p>« Ceux d'entre vous que la mort frappe et qui laissent des épouses : celles-ci doivent observer une période d'attente de quatre mois et dix jours. » [Al-Baqarah : 234]</p>
<p>L'érudit Ibn Al-Qayyim a dit <a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a>: <em>« La période de viduité consécutive au décès est rendue obligatoire par la mort elle-même, que le mariage ait été consommé ou non, en raison de la portée générale du Coran, de la Sunnah et de l'accord unanime des gens. Le but de la période de viduité liée au décès n'est pas uniquement de s'assurer de la vacuité de l'utérus, et elle n'est pas non plus un acte d'adoration purement abstrait (sans raison apparente). En effet, il n'existe pas une seule règle dans la législation islamique qui ne possède un sens profond et une sagesse, compris par celui à qui Allah a accordé la compréhension, et ignorés par celui à qui cela a échappé. »</em> Fin de citation.</p>
<p>Le ministre (Ibn Hubayrah) ainsi que d'autres ont dit : <em>« Ils (les savants) se sont accordés sur le fait que la période de viduité de la femme dont le mari est décédé, tant qu'elle n'est pas enceinte, est de quatre mois et dix jours. »</em> Fin de citation.</p>
<p>⁃ Et l'esclave [femme] dont le mari est décédé observe une période de viduité (`Iddah) égale à la moitié de cette période mentionnée [celle de la femme libre]. Sa période de viduité est donc de deux mois et cinq jours, nuits comprises ; car les Compagnons (qu'Allah les agrée tous) se sont accordés à l'unanimité sur la réduction de moitié de la période de viduité de l'esclave en cas de divorce ; il en va de même pour la période de viduité suite à un décès.</p>
<p>Al-Muwaffaq Ibn Qudâmah a dit : <em>"Selon l'avis de la majorité des gens de science, parmi lesquels : Mâlik, as-Shâfi'î, et les gens de l'avis (Ahl ar-Ra'y)".</em></p>
<p>Et il est dit dans Al-Mubdi' : <em>"Les Compagnons se sont accordés à l'unanimité sur le fait que la période de viduité de l'esclave est réduite de moitié par rapport à celle de la femme libre".</em> Sans cela [cette unanimité], le sens apparent du verset indiquerait une portée générale.</p>
<p>⁕ Ceci étant dit, le délai de viduité consécutif au décès (la <em>‘Iddah</em> de deuil) comporte des règles qui lui sont propres :</p>
<p>⁃ <strong>Parmi ses règles :</strong> Il est obligatoire pour la femme dont le mari est décédé de passer sa période d'attente dans la demeure où son époux est mort alors qu'elle s'y trouvait. Il ne lui est pas permis de la quitter, sauf pour une excuse valable, conformément à la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«امْكُثِي فِي بَيْتِكِ»</span></p>
<p><strong><em>« Reste dans ta maison »</em>.</strong><a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a></p>
<p>Dans une autre version :</p>
<p class="ar"><span dir="rtl">«اعْتَدِّي فِي الْبَيْتِ الَّذِي أَتَاكِ فِيهِ نَعْيُ زَوْجِكِ»</span></p>
<p><strong><em>« Accomplis ta période d'attente dans la maison où t'est parvenue l'annonce de la mort de ton époux »</em>.</strong></p>
<p>Et dans une autre version :</p>
<p class="ar"><span dir="rtl">«حَيْثُ أَتَاكِ الْخَبَرُ»</span></p>
<p><em><strong>« Là où t'est parvenue la nouvelle »</strong></em>. Rapporté par les auteurs des <em>Sunan</em>.</p>
<p>⁃ <strong>Si elle est contrainte de déménager dans une autre maison :</strong> Si elle craint pour sa sécurité en y restant, si elle en est expulsée par la force, ou si la maison était louée et que le propriétaire l'oblige à partir ou exige un loyer supérieur à sa valeur, alors, dans ces situations, elle se déplace là où elle le souhaite afin de repousser le préjudice.</p>
<p>⁃ <strong>Il est permis à la femme en viduité suite à un décès</strong> de sortir de sa maison pendant la journée pour ses besoins, mais pas la nuit, car la nuit est un moment propice à l'insécurité (ou aux troubles). Cela s'appuie également sur la parole du Prophète <span dir="rtl">ﷺ</span> adressée aux femmes en viduité suite à un décès :</p>
<p class="ar"><span dir="rtl">«تَحَدَّثْنَ عِنْدَ إِحْدَاكُنَّ، حَتَّى إِذَا أَرَدْتُنَّ النَّوْمَ؛ فَلْتَؤُبْ كُلُّ وَاحِدَةٍ إِلَى بَيْتِهَا»</span></p>
<p><em><strong>« Entretenez-vous (discutez) chez l'une d'entre vous, puis, lorsque vous souhaitez dormir, que chacune rejoigne sa propre maison ».</strong></em><a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a></p>
<p>⁃ <strong>Et parmi les règles relatives à la période de viduité de la femme veuve :</strong> l'obligation de porter le deuil (<em>al-Ihdâd</em>) pour la femme en période d'attente, et ce, pendant toute la durée de la <em>‘Iddah</em>. Le deuil consiste à s'abstenir de tout ce qui appelle à l'acte charnel ou incite à la regarder.</p>
<p>L'imam, le grand savant, Ibn al-Qayyim <a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a>, qu'Allah lui fasse miséricorde, a dit : <em>« Cela fait partie de la perfection des beautés de cette législation (Chari'ah), de sa sagesse et de sa préservation des intérêts des serviteurs de la manière la plus parfaite. En effet, le deuil (al-Ihdâd) pour le défunt relève de l'amplification du malheur de la mort, dans laquelle les gens de l'époque préislamique (al-Jâhiliyyah) s'enfonçaient avec la plus grande exagération : la femme demeurait alors dans la pièce la plus étroite et la plus lugubre, ne touchant aucun parfum, ne s'enduisant d'aucune huile, ne se lavant pas... et bien d'autres pratiques qui traduisaient un mécontentement face au Seigneur et à Ses décrets. Allah a donc aboli, par Son jugement, la coutume de la Jâhiliyyah, et nous l'a remplacée par la patience, la louange et la formule de retour à Allah (al-Istirjâ' : dire que nous appartenons à Allah et que c'est à Lui que nous retournons). Et comme le malheur de la mort provoque inévitablement chez la personne affligée une part d'angoisse, de douleur et de tristesse imposée par la nature humaine, Le Sage, Le Parfaitement Connaisseur (Al-Hakîm Al-Khabîr) a toléré une mesure légère de cela (c'est-à-dire pour une autre que l'épouse, à savoir trois jours), par laquelle elle trouve une sorte de répit et assouvit un besoin de deuil. Quant à ce qui dépasse les trois jours, son méfait l'emporte, c'est pourquoi cela a été interdit. L'objectif est qu'Il a autorisé pour elles le deuil de leurs morts pendant trois jours. Quant au deuil pour l'époux, il dépend de la période d'attente (al-'Iddah) ; il fait partie de ses exigences et de ses compléments. Pour ce qui est de la femme enceinte, dès que sa grossesse prend fin, l'obligation du deuil tombe ; et il a été mentionné qu'il se poursuit jusqu'au moment de l'accouchement, car il découle de la période d'attente. C'est pourquoi il est délimité par sa durée. C'est une règle parmi les règles de la période d'attente et une obligation parmi ses obligations, liée à elle tant dans son existence que dans son absence... »</em></p>
<p>Jusqu'à ce qu'il dise : <em>« De plus, elle n'a besoin de se parer que pour se faire aimer de son époux. Si celui-ci meurt alors qu'elle n'en a pas encore rejoint un autre, l'accomplissement total du droit du premier mari, ainsi que la stricte interdiction vis-à-vis du second avant que le délai prescrit n'atteigne son terme, exigent qu'elle soit privée de ce que les femmes font habituellement pour leurs époux. À cela s'ajoute le fait de couper les voies menant à ce qu'elle convoite les hommes ou que ceux-ci la convoitent à travers la parure. »</em> Fin de ses propos, qu'Allah lui fasse miséricorde.</p>
<p>Il est donc obligatoire pour la femme en période d'attente suite à un décès (<em>al-Mou'taddah mina-l-Wafât</em>), durant ce deuil (<em>al-Ihdâd</em>), d'éviter de s'embellir le corps par des produits cosmétiques, du henné (<em>al-Khidâb</em>) ou autre procédé similaire. Elle doit également éviter de porter des bijoux sous toutes leurs formes, éviter le parfum sous toutes ses variétés — c'est-à-dire tout ce qui est qualifié de parfum —, et éviter la parure dans les vêtements. Elle ne doit pas porter d'habits qui contiennent des ornements ou de la coquetterie, et doit se limiter aux vêtements qui ne comportent aucune parure. Elle doit ainsi s'abstenir de tout cela pendant toute la durée de la période d'attente.</p>
<p>⁃ Le deuil ne requiert pas de vêtement spécifique (comme une couleur particulière imposée). La femme en deuil (<em>al-Mouhiddah</em>) peut donc porter ce qu'elle a l'habitude de mettre couramment, tant que cela ne constitue pas une parure.</p>
<p>⁃ Et lorsqu'elle termine sa période d'attente, il ne lui incombe de faire ou de dire quoi que ce soit de particulier (pour marquer la fin du deuil), contrairement à ce que s'imaginent certains gens de la masse (<em>al-'Awâmm</em>).</p>
<p>⁕ Et la période d'attente (<em>'Iddah</em>) de la femme ménopausée (<em>al-Âyisah</em>) est de trois mois, conformément à la parole d'Allah le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿وَالَّائِي يَئِسْنَ مِنَ الْمَحِيضِ مِن نِّسَائِكُمْ إِنِ ارْتَبْتُمْ فَعِدَّتُهُنَّ ثَلَاثَةُ أَشْهُرٍ﴾ [الطلاق: 4].</span></p>
<p><strong>﴾ Si vous avez des doutes à propos de celles de vos femmes qui n'espèrent plus avoir de règles, leur délai est de trois mois... ﴿</strong> [At-Talâq : 4].</p>
<p>⁕ Quant à la femme divorcée qui a encore ses règles et qui n'est pas enceinte, sa période d'attente est de trois cycles menstruels (<em>Hiyad</em>), conformément à la parole d'Allah le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿وَالْمُطَلَّقَاتُ يَتَرَبَّصْنَ بِأَنفُسِهِنَّ ثَلَاثَةَ قُرُوءٍ وَلَا يَحِلُّ لَهُنَّ أَن يَكْتُمْنَ مَا خَلَقَ اللَّهُ فِي أَرْحَامِهِنَّ﴾ [البقرة: 228]</span></p>
<p><strong>﴾ Et les femmes divorcées doivent observer un délai d'attente de trois cycles menstruels (Qouroû') ; et il ne leur est pas permis de cacher ce qu'Allah a créé dans leurs matrices... ﴿</strong> [Al-Baqarah : 228]. C'est-à-dire : les femmes divorcées patientent et chacune d'elles demeure, après le divorce prononcé par son époux, pendant « <strong>trois cycles</strong> » (<em>Thalâthata Qouroû'</em>), à savoir trois menstrues. Ensuite, après cela, elle peut se remarier si elle le souhaite. L'explication du terme <em>al-Aqrâ'</em> (pluriel de <em>Qour'</em>) par les menstrues est rapportée d'après 'Omar, 'Alî et Ibn 'Abbâs (qu'Allah les agrée). De plus, l'explication d'<em>al-Aqrâ'</em> par les menstrues est celle qui est établie dans la terminologie de la Législation islamique (<em>Lisân ach-Char'</em>). En effet, dans le hadith, le Prophète <span dir="rtl">ﷺ</span> a dit à la femme atteinte de métrorragie (<em>al-Moustahâdah</em>) :</p>
<p class="ar"><span dir="rtl">«فَإِذَا أَتَى قُرْؤُكِ؛ فَلَا تُصَلِّي»</span></p>
<p><em><strong>« Lorsque ton cycle menstruel arrive, alors délaisse la prière. »</strong></em><a href="#fn6" class="footnote-ref" id="fnref6" role="doc-noteref"><sup>6</sup></a></p>
<p>⁃ Et il est indispensable que les menstrues soient complètes. Ainsi, elle ne compte pas la menstruation au cours de laquelle elle a été divorcée. En effet, le divorce prononcé pendant les règles est effectif malgré l'interdiction, mais elle ne comptabilise pas cette menstruation-là dans sa période d'attente.</p>
<p>⁃ Et si la femme divorcée est une esclave (<em>Amah</em>), sa période d'attente est de deux menstruations, en raison de ce qui a été rapporté :</p>
<p class="ar"><span dir="rtl">«قُرْءُ الْأَمَةِ حَيْضَتَانِ»</span></p>
<p><em><strong>« Le cycle de l'esclave est de deux menstruations »</strong></em><a href="#fn7" class="footnote-ref" id="fnref7" role="doc-noteref"><sup>7</sup></a>.</p>
<p>De plus, cela correspond à l'avis de 'Omar, de son fils (Ibn 'Omar) et de 'Alî ibn Abî Tâlib, et aucun contradicteur parmi les Compagnons ne leur est connu. Cela vient donc spécifier la portée générale de la parole d'Allah le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿وَالْمُطَلَّقَاتُ يَتَرَبَّصْنَ بِأَنفُسِهِنَّ ثَلَاثَةَ قُرُوءٍ﴾ [البقرة: 228]</span></p>
<p><strong>﴾ Et les femmes divorcées doivent observer un délai d'attente de trois cycles menstruels (Qouroû') ﴿</strong> [Al-Baqarah) : 228].</p>
<p>Le raisonnement par analogie (<em>al-Qiyâs</em>) aurait voulu que sa période d'attente soit d'une menstruation et demie, mais la menstruation ne se divise pas ; elle est donc passée à deux menstruations complètes.</p>
<p>⁃ Quant à la femme divorcée ménopausée qui n'a plus ses règles en raison de son âge avancé, ainsi que la jeune fille qui n'a pas encore atteint l'âge d'avoir ses menstrues, leur période d'attente (<em>'Iddah</em>) est de trois mois, conformément à la parole d'Allah le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿وَاللَّائِي يَئِسْنَ مِنَ الْمَحِيضِ مِن نِّسَائِكُمْ إِنِ ارْتَبْتُمْ فَعِدَّتُهُنَّ ثَلَاثَةُ أَشْهُرٍ وَاللَّائِي لَمْ يَحِضْن﴾ [الطلاق: 4]</span></p>
<p><strong>﴾ Si vous avez des doutes à propos de celles de vos femmes qui n'espèrent plus avoir de règles, leur délai est de trois mois. De même pour celles qui n'ont pas encore de règles ﴿</strong> [At-Talâq : 4]. C'est-à-dire : et celles de vos femmes qui n'ont pas encore eu de règles, leur période d'attente est également de trois mois.</p>
<p>L'imam Mouwaffaq ad-Dîn Ibn Qoudâmah et d'autres ont dit : <em>« Les gens de science se sont accordés à l'unanimité (Ijmâ') sur le fait que la période d'attente de la femme libre ménopausée, ainsi que de la jeune fille qui n'a pas encore ses règles, est de trois mois. »</em></p>
<p>⁕ Et celle qui a atteint l'âge de la puberté mais n'a jamais eu ses règles, sa période d'attente (<em>'Iddah</em>) est identique à celle de la femme ménopausée, à savoir trois mois, en raison de son inclusion dans la portée générale de la parole d'Allah le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿وَاللَّائِي لَمْ يَحِضْن﴾ [الطلاق: 4]</span></p>
<p><strong>﴾ De même pour celles qui n'ont pas encore de règles ﴿</strong> [At-Talâq : 4].</p>
<p>Et si la femme divorcée — qu'elle soit ménopausée ou jeune fille n'ayant pas encore l'âge d'avoir ses règles — est une esclave ayant enfanté de son maître (<em>Oumm Walad</em>), sa période d'attente est de deux mois, conformément à la parole de 'Omar (qu'Allah l'agrée) :</p>
<p class="ar"><span dir="rtl">«عِدَّةُ أُمِّ الْوَلَدِ حَيْضَتَانِ، وَلَوْ لَمْ تَحِضْ؛ كَانَتْ عِدَّتُهَا شَهْرَيْنِ»</span></p>
<p><em><strong>« La période d'attente de la Oumm Walad est de deux menstruations, et si elle n'a pas ses règles, sa période d'attente est de deux mois. »</strong></em> Et ce, parce que les mois se substituent aux cycles menstruels (<em>al-Qouroû'</em>). Cependant, certains savants ont été d'avis que sa période d'attente est d'un mois et demi, car la période d'attente de la femme esclave équivaut à la moitié de celle de la femme libre ; or, la période d'attente de la femme libre qui n'a pas ses règles est de trois mois, la période d'attente de la femme esclave ménopausée serait donc d'un mois et demi.</p>
<p>⁕ Quant à la femme divorcée qui avait ses règles, puis dont les menstrues ont cessé et se sont interrompues de manière soudaine/accidentelle (et non en raison de la vieillesse), celle-ci se trouve dans l'une de ces deux situations :</p>
<p><strong>La première situation :</strong> qu'elle ignore la cause qui a provoqué l'arrêt de ses règles. Dans ce cas, sa période d'attente (<em>'Iddah</em>) est d'une année : neuf mois pour s'assurer de l'absence de grossesse, et trois mois pour la période d'attente proprement dite (c'est-à-dire la durée requise pour une femme ménopausée).</p>
<p>L'imam ach-Châfi'î, qu'Allah lui fasse miséricorde, a dit : <em>« Ceci est le jugement rendu par 'Omar en présence des Émigrés (al-Mouhâjirîn) et des Auxiliaires (al-Ansâr), sans qu'aucun d'entre eux ne s'y soit opposé à notre connaissance. Et aussi parce que l'objectif de la période d'attente est de s'assurer de la vacuité de son utérus de toute grossesse. Ainsi, lorsque les neuf mois se sont écoulés, cela prouve la vacuité de son utérus vis-à-vis d'un fœtus. Elle accomplit alors à ce moment-là la période d'attente de la femme ménopausée, qui est de trois mois. Le total s'élève donc à douze mois, et c'est par ce biais que l'on obtient la certitude que son utérus est exempt de grossesse et de menstrues. »</em></p>
<p><strong>La deuxième situation</strong> : qu'elle connaisse la cause qui a interrompu ses règles, comme une maladie, l'allaitement ou la prise d'un médicament qui supprime les menstrues. Celle-ci doit attendre la disparition de cet empêchement. Si les règles reviennent après sa disparition, elle effectue sa période d'attente sur cette base. Si l'empêchement disparaît mais que les règles ne reviennent pas, l'avis correct est qu'elle doit observer une période d'attente d'un an, à l'instar de celle dont les règles ont cessé sans qu'elle n'en connaisse la cause. C'est l'avis choisi par Cheikh al-Islâm Ibn Taymiyyah, et c'est également une narration rapportée de l'Imam Ahmad.</p>
<p>⁕ Quant à la femme atteinte de métrorragie (<em>al-Mustahâdah</em>), elle se trouve dans l'une de ces situations :</p>
<p><strong>La première situation :</strong> qu'elle connaisse la durée des jours de son cycle habituel avant l'apparition de la métrorragie, ainsi que sa période. Pour celle-ci, sa période d'attente s'achève par l'écoulement du laps de temps nécessaire pour atteindre l'équivalent de trois cycles menstruels, selon les jours de son cycle habituel.</p>
<p><strong>La deuxième situation :</strong> qu'elle ait oublié les jours de son cycle habituel, mais que son sang présente des caractéristiques distinctives (<em>Mutamayyiz</em>). Celle-ci considère alors le sang distinctif comme étant ses menstrues sur lesquelles elle fonde sa période d'attente, si tant est que ce sang réunit les conditions pour être qualifié de menstrues.</p>
<p><strong>La troisième situation :</strong> qu'elle ait oublié son cycle habituel et qu'elle ne dispose d'aucune distinction sanguine valable. Celle-ci observe alors la période d'attente de la femme ménopausée, à savoir trois mois.</p>
<p>⁕ Parmi les règles relatives à la période d'attente figure la question de la demande en mariage de la femme qui l'observe. Ainsi, pour la femme en période d'attente suite à un décès ou suite à un divorce définitif (<em>Bâ'in</em>), il est interdit de formuler une demande en mariage de manière explicite (<em>at-Tasrîh</em>), comme le fait de dire : <em>« Je veux t'épouser »</em> ou autre formulation similaire. En revanche, l'allusion (<em>at-Ta'rîdh</em>) est permise, comme le fait de lui dire : <em>« Je serais certes désireux d'une femme comme toi »</em>, conformément à la parole d'Allah le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿وَلَا جُنَاحَ عَلَيْكُمْ فِيمَا عَرَّضْتُم بِهِ مِنْ خِطْبَةِ النِّسَاءِ﴾ [البقرة: ٢٣٥]</span></p>
<p><strong>﴾ Et on ne vous tiendra pas rigueur de faire des allusions à une demande en mariage à ces femmes... ﴿</strong> [Al-Baqarah : 235].</p>
<p>⁕ Et il est permis à l'homme de formuler une demande en mariage — de façon explicite ou par allusion — à la femme qu'il a séparée par un divorce définitif inférieur à trois, ainsi qu'à celle qu'il a divorcée d'un divorce révocable (<em>Raj'î</em>). En effet, il lui est permis de se remarier avec celle qu'il a séparée définitivement en deçà de trois divorces (par un nouvel acte), et de reprendre son épouse divorcée d'un divorce révocable tant qu'elle se trouve encore dans sa période d'attente.</p>
<p>⁕ Quant à l'épouse de l'homme disparu (<em>al-Mafqoûd</em>) — qui est celui dont on n'a plus de nouvelles, de sorte qu'on ignore s'il est vivant ou mort —, sa femme doit attendre son retour ou la clarification de sa situation pendant un délai fixé par le juge (<em>al-Qâdhî</em>), suffisant pour agir avec précaution à son sujet. Elle demeure sous sa protection maritale durant cette période, car le principe de base (<em>al-Asl</em>) est qu'il est vivant. Puis, lorsque le délai d'attente fixé est révolu, son décès est prononcé juridiquement, et son épouse observe alors la période d'attente du décès (<em>'Iddat al-Wafât</em>), à savoir quatre mois et dix jours. Et c'est ainsi que les Compagnons (qu'Allah les agrée) ont statué.</p>
<p>L'imam Ibn al-Qayyim <a href="#fn8" class="footnote-ref" id="fnref8" role="doc-noteref"><sup>8</sup></a> a dit : <em>« Les califes ont statué au sujet de la femme de l'homme disparu comme cela est authentifié d'après 'Omar. Et [l'imam] Ahmad a dit : "Je n'ai aucun doute là-dessus, cinq parmi les Compagnons lui ont ordonné de patienter [d'observer un délai]". »</em></p>
<p>Ibn al-Qayyim <a href="#fn9" class="footnote-ref" id="fnref9" role="doc-noteref"><sup>9</sup></a> a dit : <em>« L'avis de 'Omar est le plus authentique des avis et le plus conforme au raisonnement par analogie (al-Qiyâs) ». Et Cheikh al-Islâm Ibn Taymiyyah a dit : « C'est cela qui est la vérité »</em>. Fin [de la citation].</p>
<p>Puis, lorsque sa période d'attente (<em>'Iddah</em>) prend fin, elle devient licite au mariage pour d'autres hommes. Elle n'a nullement besoin d'un divorce prononcé par le tuteur de son époux après avoir accompli sa période d'attente pour décès. Si elle se remarie, et que son premier mari réapparaît, l'avis authentique est qu'il a le choix entre la reprendre ou valider son mariage avec le second mari en récupérant la dot (<em>Sadâq</em>) qu'il avait versée. Cela s'applique de la même manière, que son retour ait lieu avant ou après la consommation du mariage par le second époux.</p>
<p>Cheikh al-Islâm Ibn Taymiyyah <a href="#fn10" class="footnote-ref" id="fnref10" role="doc-noteref"><sup>10</sup></a>, qu'Allah lui fasse miséricorde, a dit : <em>« L'avis correct concernant l'épouse de l'homme disparu est l'école juridique (Madhhab) de 'Omar et d'autres parmi les Compagnons. Celle-ci consiste à ce qu'elle patiente pendant quatre ans, puis observe la période d'attente du décès, après quoi il lui est permis de se marier. Elle devient alors l'épouse du second mari, tant sur le plan apparent que sur le plan intérieur (juridiquement et spirituellement). Ensuite, si son premier mari réapparaît après son remariage, il a le choix entre récupérer sa femme ou récupérer sa dot (Mahr), sans aucune distinction que ce soit avant ou après la consommation du mariage ; et c'est là l'avis apparent de l'école de l'imam Ahmad. »</em> Puis il a dit : <em>« Offrir le choix dans ce cas précis entre la femme et la dot constitue le plus juste des avis. »</em> Fin [de la citation].</p>
