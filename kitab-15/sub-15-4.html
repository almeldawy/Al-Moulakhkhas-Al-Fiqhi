<p>⁕ <strong>Le divorce conforme à la Sunnah</strong> est le divorce qui a lieu de la manière légiférée par Allah et Son Messager <span dir="rtl">ﷺ</span>. Cela consiste à ce que l'homme divorce son épouse par une seule répudiation, durant une période de pureté (entre deux menstrues) au cours de laquelle il n'a pas eu de rapport intime avec elle, puis qu'il la laisse ainsi jusqu'à la fin de sa période de viduité (Iddah). Ce divorce est alors conforme à la Sunnah sur le plan du <strong>nombre</strong>, puisqu'il ne l'a répudiée qu'une seule fois puis l'a laissée jusqu'au terme de sa viduité ; et il est conforme à la Sunnah sur le plan du <strong>moment</strong>, puisqu'il l'a répudiée durant une période de pureté où il ne l'a pas touchée. Conformément à la parole d'Allah le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿يَأَيُّهَا النَّبِيُّ إِذَا طَلَّقْتُمُ النِّسَاءَ فَطَلِّقُوهُنَّ لِعِدَّتِهِنَّ﴾ [الطلاق : ١]</span></p>
<p><strong>﴾ Ô Prophète ! Quand vous répudiez les femmes, répudiez-les conformément à leur période de viduité prescrite ﴿</strong> [Sourate At-Talâq : 1].</p>
<p>Ibn Mas'ûd (qu'Allah l'agrée) a dit concernant le sens de ce noble verset : <em>« C'est-à-dire : (qu'elles soient) en période de pureté, sans qu'il n'y ait eu de rapport intime. »</em></p>
<p>Et 'Alî (qu'Allah l'agrée) a dit : <em>« Si les gens s'en prenaient à ce qu'Allah a ordonné en matière de divorce, aucun homme ne regretterait jamais d'avoir laissé son épouse [ne se consumerait de chagrin après elle]. Il la répudie d'une seule répudiation, puis la laisse durant le temps qu'elle traverse ses trois menstrues. S'il le souhaite, il la reprend [pendant cette période]. »</em></p>
<p>C'est-à-dire : tant qu'elle se trouve encore dans sa période de viduité (Iddah). En effet, Allah a accordé à celui qui divorce une opportunité lui permettant de reprendre son épouse s'il regrette sa décision, tant qu'il n'a pas épuisé le nombre de divorces qui lui sont autorisés (trois) et qu'elle est encore en période de viduité. En revanche, s'il épuise la totalité du nombre de divorces qui lui sont impartis, il ferme alors définitivement la porte du retour (reprise de l'épouse) sur lui-même.</p>
<p>⁕ <strong>Le divorce innové</strong> est celui que son auteur prononce d'une manière interdite. Cela consiste à ce qu'il la répudie trois fois en une seule parole, ou qu'il la répudie alors qu'elle a ses menstrues ou ses lochies, ou qu'il la répudie pendant une période de pureté au cours de laquelle il a eu un rapport intime avec elle sans que sa grossesse ne soit encore avérée. Le premier type est qualifié d'innové (bid'î) sur le plan du <strong>nombre</strong>, tandis que le second type est qualifié d'innové (bid'î) sur le plan du <strong>moment</strong>.</p>
<p>⁃ Le divorce innové quant au nombre rend la femme interdite à son mari jusqu'à ce qu'elle épouse un autre homme que lui, conformément à la parole d'Allah le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿فَإِن طَلَّقَهَا﴾ ؛ يَعْنِي : الثَّالِثَةَ ؛ ﴿فَلَا تَحِلُّ لَهُۥ مِنۢ بَعْدُ حَتَّىٰ تَنكِحَ زَوْجًا غَيْرَهُۥۗ﴾ [البقرة : ٢٣٠] .</span></p>
<p><strong>﴾ S’il la répudie ﴿</strong> – c'est-à-dire : la troisième fois – <strong>﴾ alors elle ne lui est plus licite tant qu’elle n’a pas épousé un autre homme. ﴿</strong> [Sourate Al-Baqarah : 230].</p>
<p>⁃ Concernant le divorce innové quant au moment, il lui est recommandé de reprendre son épouse, en raison du hadith d'Ibn 'Umar (qu'Allah l'agrée, lui et son père) : <em><strong>« Il avait répudié sa femme alors qu'elle avait ses menstrues, le Prophète <span dir="rtl">ﷺ</span> lui ordonna alors de la reprendre. »</strong></em> Rapporté par le groupe (Al-Jamâ'ah)<a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a>. Et s'il la reprend, il lui est alors obligatoire de la garder jusqu'à ce qu'elle devienne pure, puis, s'il le souhaite, il la répudiera.</p>
<p>⁕ Il est interdit à l'époux de prononcer un divorce innové (bid'î), que ce soit par rapport au nombre ou au moment. Cela, conformément à la parole d'Allah le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿ٱلطَّلَٰقُ مَرَّتَانِۖ فَإِمْسَاكٌۢ بِمَعْرُوفٍ أَوْ تَسْرِيحٌۢ بِإِحْسَٰنٍۗ﴾ [البقرة : ٢٢٩]</span></p>
<p><strong>﴾ Le divorce est permis pour deux fois. Alors, c'est soit le maintien dans la fidélité selon le bon usage, soit la libération avec gentillesse ﴿</strong> [Sourate Al-Baqarah : 229]</p>
<p>et à Sa parole le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿يَٰٓأَيُّهَا ٱلنَّبِيُّ إِذَا طَلَّقْتُمُ ٱلنِّسَاءَ فَطَلِّقُوهُنَّ لِعِدَّتِهِنَّ﴾ [الطلاق : ١]</span></p>
<p><strong>﴾ Ô Prophète ! Quand vous répudiez les femmes, répudiez-les conformément à leur période de viduité prescrite ﴿</strong> [Sourate At-Talâq : 1], c'est-à-dire : en période de pureté sans qu'il n'y ait eu de rapport intime. De plus, lorsqu'il fut rapporté au Prophète <span dir="rtl">ﷺ</span> qu'un homme avait divorcé sa femme trois fois (en une seule fois), il dit :</p>
<p class="ar"><span dir="rtl">« أَيُلْعَبُ بِكِتَابِ اللَّهِ وَأَنَا بَيْنَ أَظْهُرِكُمْ ؟ ! »</span></p>
<p><strong><em>« Se joue-t-on du Livre d'Allah alors que je suis encore parmi vous ?! »</em>.</strong><a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a></p>
<p>Et lorsque l'on amenait à 'Umar un homme ayant divorcé trois fois (en une fois), il lui infligeait une correction douloureuse. Enfin, lorsqu'il fut mentionné au Prophète <span dir="rtl">ﷺ</span> qu'Ibn 'Umar avait divorcé son épouse alors qu'elle avait ses menstrues, il se mit en colère et lui ordonna de la reprendre.<a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a></p>
<p>Tout cela démontre l'obligation de se conformer strictement aux règles du divorce, tant sur le plan du nombre que du moment, et d'éviter le divorce interdit dans ces deux aspects. Cependant, beaucoup d'hommes ne comprennent pas cela ou n'y prêtent pas attention. Ils tombent alors dans la gêne et le regret, puis cherchent après coup des issues de secours à la situation dans laquelle ils se sont mis, embarrassant ainsi les muftis (les savants qui délivrent les avis juridiques). Et tout cela n'est que la conséquence du fait de badiner avec le Livre d'Allah.</p>
<p>Certains hommes font du divorce une arme pour menacer leur épouse lorsqu'ils veulent la contraindre à faire quelque chose ou l'en empêcher. D'autres en font un substitut de serment (jurement) dans leurs transactions et leurs discussions quotidiennes avec les gens. Que ceux-là craignent donc Allah ! Qu'ils éloignent de leurs langues le fait de prononcer le divorce, sauf en cas de réel besoin, et ce, en respectant scrupuleusement le moment et le nombre fixés (par la législation).</p>
<p>⁕ <strong>Et les formulations (les termes employés pour) le divorce se divisent en deux catégories :</strong></p>
<p><strong>La première catégorie : Les formulations explicites :</strong> Ce sont les termes qui ont été initialement institués pour désigner le divorce et qui ne portent à aucune autre interprétation. Il s'agit du mot « divorce » (At-Talâq) et de ses dérivés juridiquement valides :</p>
<ul>
<li><blockquote>
<p>Le verbe au passé, comme lorsqu'il dit : (<span dir="rtl">طَلَّقْتُك</span>ِ) « Je t'ai divorcée ».</p>
</blockquote></li>
<li><blockquote>
<p>Le participe actif, comme lorsqu'il dit : (<span dir="rtl">أَنْتِ طَالِق</span>ٌ) « Tu es divorcée ».</p>
</blockquote></li>
<li><blockquote>
<p>Le participe passé, comme lorsqu'il dit : (<span dir="rtl">أَنْتِ مُطَلَّقَة</span>ٌ) « Tu es une femme divorcée ».</p>
</blockquote></li>
</ul>
<p>À l'exclusion toutefois du verbe au présent/futur (Al-Mudâri') ou à l'impératif (Al-Amr), tels que : (<span dir="rtl">تَطْلُقِين</span>َ) « Tu vas divorcer » ou (<span dir="rtl">اطْلُقِي</span>) « Divorce ! », ainsi que du participe actif issu d'un verbe de forme quadrilatère, tel que : (<span dir="rtl">أَنْتِ مُطْلِقَة</span>ٌ). Le divorce ne prend pas effet avec ces trois dernières formulations, car elles n'indiquent pas l'exécution immédiate (l'acte de prononcer la répudiation effective).</p>
<p><strong>La seconde catégorie : Les formulations implicites :</strong> Ce sont les termes qui peuvent désigner le divorce ou autre chose (selon le contexte). C'est le cas s'il lui dit par exemple : « Tu es libre », « Tu es quitte (de tout lien) », « Tu es séparée », « Tu es maîtresse de toi-même », ou encore : « Sors d'ici et retourne dans ta famille ! »... et toutes les expressions similaires.</p>
<p>⁕ <strong>La différence entre les formulations explicites et implicites dans le divorce :</strong> Avec les termes explicites, le divorce prend effet même si l'homme n'en avait pas l'intention (la Niyyah), qu'il ait été sérieux, qu'il ait plaisanté ou qu'il se soit amusé. Cela s'appuie sur la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">« ثَلَاثٌ جِدُّهُنَّ جِدٌّ وَهَزْلُهُنَّ جِدٌّ : النِّكَاحُ ، وَالطَّلَاقُ ، وَالرَّجْعَةُ »</span></p>
<p><em><strong>« Il est trois choses pour lesquelles le sérieux est sérieux, et la plaisanterie est prise au sérieux : le mariage (An-Nikâh), le divorce (At-Talâq) et la reprise de l'épouse (Ar-Raj'ah). »</strong></em> Rapporté par les cinq, à l'exception d'An-Nasâ'î.<a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a></p>
<p>Quant aux termes implicites (métaphoriques), le divorce ne prend pas effet par leur biais sauf s'il en a eu l'intention au moment précis où il a prononcé la parole. En effet, ces expressions portent à la fois le sens du divorce et d'autres significations ; elles ne s'appliquent donc spécifiquement au divorce que par l'intention de l'auteur. S'il n'avait pas l'intention de divorcer, le divorce ne prend pas effet, <strong>sauf dans trois situations spécifiques :</strong></p>
<p><strong>La première :</strong> S'il prononce cette formulation implicite au cours d'une dispute (querelle) entre lui et son épouse.</p>
<p><strong>La deuxième :</strong> S'il la prononce dans un état de colère.</p>
<p><strong>La troisième :</strong> S'il la prononce en guise de réponse à sa femme qui lui demandait le divorce.</p>
<p>Dans ces situations bien précises, le divorce par le biais de termes implicites prend effet, même s'il affirme par la suite : <em>« Je n'en avais pas l'intention »</em>. En effet, le contexte (la présomption matérielle) démontre qu'il en avait bel et bien l'intention, et sa parole disant <em>« Je n'en avais pas l'intention »</em> n'est alors pas acceptée (juridiquement). Et Allah est le Plus Savant.</p>
<p>⁕ Il est permis à l’époux de mandater (donner procuration à) quelqu'un pour prononcer le divorce en son nom, que ce mandataire soit une personne tierce ou l’épouse elle-même. Il lui est ainsi permis de lui donner procuration à ce sujet et de remettre sa situation [le choix de divorcer] entre ses mains. Le mandataire remplace alors le mari dans l’usage des termes explicites, des termes implicites et quant au nombre de divorces, tant que le mari ne lui a pas fixé de limite précise en la matière.</p>
<p>⁕ Le divorce ne prend pas effet, qu’il émane du mari ou de son mandataire, sans qu'il ne soit prononcé de vive voix. Ainsi, s’il en a seulement l’intention dans son cœur, le divorce n’a pas lieu tant qu’il ne le formule pas verbalement et ne remue pas la langue pour le dire. Cela s'appuie sur la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">« إِنَّ اللَّهَ تَجَاوَزَ عَنْ أُمَّتِي مَا حَدَّثَتْ بِهِ أَنْفُسَهَا مَا لَمْ تَعْمَلْ أَوْ تَتَكَلَّمْ »</span></p>
<p><em><strong>« Certes, Allah a pardonné à ma communauté ce que l'âme se suggère tant que cela n’est pas mis en pratique ou exprimé par la parole. »</strong></em><a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a> Le divorce ne prend donc pas effet sans énonciation verbale, <strong>sauf dans deux situations :</strong></p>
<p><strong>Le premier cas :</strong> S’il écrit le divorce en termes explicites de manière lisible. S’il en avait l’intention (en écrivant), le divorce prend effet. S’il n’en avait pas l’intention, il existe alors deux avis chez les savants, mais l'avis de la majorité est que le divorce prend tout de même effet.</p>
<p><strong>Le second cas :</strong> La situation où le divorce prend effet sans prononciation verbale est le signe de la personne muette indiquant le divorce, à condition que ce signe soit compréhensible.</p>
<p>⁕ Quant au nombre de divorces (autorisés), il est déterminé par le statut de l'homme — qu'il soit libre ou esclave — et non par celui de la femme. En effet, c'est aux hommes qu'Allah s'est adressé spécifiquement, comme Il le dit dans le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿يَٰٓأَيُّهَا ٱلنَّبِيُّ إِذَا طَلَّقْتُمُ ٱلنِّسَاءَ فَطَلِّقُوهُنَّ لِعِدَّتِهِنَّ﴾ [الطلاق : ١]</span></p>
<p><strong>﴾ Ô Prophète ! Quand vous répudiez les femmes, répudiez-les conformément à leur période de viduité prescrite ﴿</strong> [Sourate At-Talâq : 1]</p>
<p>et Il dit également :</p>
<p class="ar"><span dir="rtl">﴿وَإِذَا طَلَّقْتُمُ ٱلنِّسَاءَ فَبَلَغْنَ أَجَلَهُنَّ﴾ [البقرة : ٢٣١]</span></p>
<p><strong>﴾ Et quand vous répudiez les femmes et qu’elles atteignent le terme de leur viduité ﴿</strong> [Sourate Al-Baqarah : 231].</p>
<p>De plus, le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="rtl">« إِنَّمَا الطَّلَاقُ لِمَنْ أَخَذَ بِالسَّاقِ »</span></p>
<p><em><strong>« Le divorce n'appartient qu'à celui qui prend par la jambe [c'est-à-dire le mari qui a le droit d'avoir des rapports avec elle]. »</strong></em><a href="#fn6" class="footnote-ref" id="fnref6" role="doc-noteref"><sup>6</sup></a> Par conséquent, l'homme libre dispose de trois répudiations, même s'il est marié à une esclave. L'esclave, quant à lui, dispose de deux répudiations, même s'il est marié à une femme libre. Ainsi, lorsque les deux époux sont libres, le mari possède trois divorces sans aucune divergence. Lorsque les deux époux sont esclaves, le mari possède deux divorces sans aucune divergence. La divergence ne porte que sur le cas où l'un des conjoints est libre et l'autre est esclave. L'avis authentique (râjih) reste que l'on prend en considération le statut de l'époux (libre ou esclave) comme mentionné précédemment, car le divorce est un droit exclusif du mari ; c'est donc à lui que l'on se réfère.</p>
<p>⁕ Il est permis de recourir à l'exception (<em>Al-Istithnâ'</em>) dans le divorce. On entend par là le fait d'exclure une partie d'un ensemble au moyen de la particule « excepté » (<em>Illâ</em>) ou ce qui en tient lieu. L'exception ici porte soit sur le nombre de répudiations, comme lorsqu'il dit : « <em>Tu es divorcée trois fois moins une</em> » ; soit sur le nombre de femmes répudiées, comme s'il dit par exemple : « <em>Mes femmes sont divorcées, sauf Fâtimah</em> ». Dans les deux cas, la validité de cette exception est soumise à la condition que la quantité exclue (<em>Al-Mustathnâ</em>) soit égale ou inférieure à la moitié de l'ensemble global (<em>Al-Mustathnâ minhu</em>). Si la quantité exclue dépasse la moitié de l'ensemble, l'exception est invalide. Par exemple, s'il dit : « <em>Tu es divorcée trois fois sauf deux</em> », l'exception n'est pas valide (et les trois divorces comptent).</p>
<p>Il est également requis de formuler verbalement l'exception lorsque celle-ci concerne le nombre de répudiations. Ainsi, s'il dit : « Tu es divorcée trois fois » tout en ayant l'intention dans son cœur d'en exclure une (« moins une »), les trois divorces prennent tout de même effet. En effet, le chiffre énoncé est un texte explicite (<em>Nass</em>) quant à ce qu'il englobe ; sa portée ne peut donc être annulée par une simple intention, car le mot prononcé est plus fort que l'intention seule. En revanche, il est permis de faire une exception par la seule intention lorsqu'il s'agit des épouses. Si l'homme dit : « Mes femmes sont divorcées », en ayant l'intention d'exclure un telle, l'exception est tout à fait valide. Celle qu'il a eu l'intention d'exclure ne sera donc pas divorcée, car le terme général « mes femmes » peut s'appliquer à la totalité comme à une partie d'entre elles. Il obtient alors ce qu'il a eu l'intention de formuler.</p>
<p>⁕ Il est permis de suspendre le divorce à des conditions. Le sens de cette pratique est de faire dépendre le divorce de la réalisation ou de la non-réalisation d'un événement, au moyen de la particule « si » (<em>In</em>) ou de l’un de ses équivalents. C'est le cas s’il dit par exemple : « Si tu entres dans cette maison, tu es divorcée. » Il a ainsi fait dépendre l’effectivité du divorce de la réalisation de la condition, qui est ici le fait d'entrer dans la maison. C’est cela que l’on nomme la suspension (<em>At-Ta'lîq</em>).</p>
<p>⁕ La suspension du divorce n'est valable que si elle émane d'un homme déjà marié (à la femme visée). Ainsi, si un homme dit : « Si j'épouse un telle, elle est divorcée », puis qu'il l'épouse par la suite, le divorce ne prend pas effet. En effet, au moment où il a énoncé cette suspension, il n'était pas son époux. Cela s'appuie sur le hadith de 'Amr ibn Shu'ayb, d'après son père, d'après son grand-père, rapporté de manière prophétique (<em>Marfû'</em>) :</p>
<p class="ar"><span dir="rtl">« لَا نَذْرَ لِابْنِ آدَمَ فِيمَا لَا يَمْلِكُ ، وَلَا عِتْقَ فِيمَا لَا يَمْلِكُ ، وَلَا طَلَاقَ فِيمَا لَا يَمْلِكُ »</span></p>
<p><em>« Le fils d'Adam ne peut faire de vœu concernant ce qu'il ne possède pas, il ne peut affranchir ce qu'il ne possède pas, et il ne peut divorcer de ce qu'il ne possède pas. »</em> Rapporté par Ahmad, Abû Dâwûd et At-Tirmidhî qui l'a qualifié de bon (<em>Hasan</em>)<a href="#fn7" class="footnote-ref" id="fnref7" role="doc-noteref"><sup>7</sup></a>.</p>
<p>De plus, Allah le Très-Haut dit :</p>
<p class="ar"><span dir="rtl">﴿يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوٓاْ إِذَا نَكَحْتُمُ ٱلْمُؤْمِنَٰتِ ثُمَّ طَلَّقْتُمُوهُنَّ﴾ [الأحزاب : ٤٩]</span></p>
<p><strong>« Ô vous qui croyez ! Quand vous vous mariez avec les croyantes et qu’ensuite vous les répudiez »</strong> [Sourate Al-Ahzâb : 49]. Le verset et le hadith démontrent donc que le divorce ne peut s'appliquer à une femme étrangère (qui n'est pas son épouse). Cela fait l'objet d'un consensus (<em>Ijmâ'</em>) absolu s'il s'agit d'un divorce à effet immédiat (<em>Munajjaz</em>), et c'est l'avis de la majorité des savants (<em>Al-Jumhûr</em>) s'il s'agit d'un divorce suspendu à son mariage avec elle ou toute autre formulation similaire.</p>
<p>⁕ Lorsque le divorce est suspendu à une condition, l'épouse n'est pas divorcée tant que celle-ci ne s'est pas réalisée. Et si un doute survient au sujet du divorce — entendons par là : un doute sur l'existence même de sa prononciation, un doute sur son nombre, ou un doute sur la réalisation de sa condition :</p>
<p>⁃ Quant au fait de douter si le divorce a été prononcé ou non, l'épouse ne sera pas divorcée par ce simple doute. En effet, le mariage est un fait certain (établi avec certitude), et ce qui est certain ne peut être annulé par un doute.</p>
<p>⁃ S'il doute de la réalisation de la condition à laquelle il a suspendu le divorce — comme s'il dit : « Si tu entres dans la maison, tu es divorcée », puis qu'il doute ensuite qu'elle y soit entrée —, elle ne sera pas divorcée par ce seul doute, pour la raison mentionnée précédemment.</p>
<p>⁃ S'il est certain d'avoir prononcé le divorce, mais qu'il doute du nombre (de répudiations), seule une répudiation s'impose à lui. En effet, celle-ci est certaine, alors que ce qui va au-delà est douteux, et la certitude ne s'efface pas devant le doute. C'est là une règle générale grandement bénéfique dans l'ensemble des statuts juridiques. Elle est tirée de la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">« دَعْ مَا يَرِيبُكَ إِلَى مَا لَا يَرِيبُكَ »</span></p>
<p><em><strong>« Laisse ce qui te fait douter pour ce qui ne te fait pas douter »</strong></em> <a href="#fn8" class="footnote-ref" id="fnref8" role="doc-noteref"><sup>8</sup></a>, ainsi que de sa parole adressée à celui qui est en état de pureté certaine mais qui a un doute sur la survenue d'un élément annulateur :</p>
<p class="ar"><span dir="rtl">« لَا يَنْصَرِفْ حَتَّى يَسْمَعَ صَوْتاً أَوْ يَجِدَ رِيحاً »</span></p>
<p><em><strong>« Qu'il ne l'interrompe pas [sa prière] tant qu'il n'entend pas un bruit ou ne perçoit une odeur »</strong></em> <a href="#fn9" class="footnote-ref" id="fnref9" role="doc-noteref"><sup>9</sup></a>, parmi d'autres hadiths.</p>
<p>Et ceci fait partie de ce qui démontre la flexibilité (la tolérance) de cette législation (la Sharî'ah) et sa perfection. Louange donc à Allah, le Seigneur des mondes.</p>
