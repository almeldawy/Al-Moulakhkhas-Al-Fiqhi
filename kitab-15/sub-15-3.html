<p>⁕ <strong>Le divorce (Al-Talâq) au sens linguistique :</strong> C'est le fait de libérer ou de relâcher ( <span dir="rtl">التَّخْلِيَة</span>ُ ). On dit : « La chamelle a été libérée (talaqat) » lorsqu'elle broute librement là où elle le souhaite ( <span dir="rtl">طَلَقَتِ النَّاقَةُ: إِذَا سَرَحَتْ حَيْثُ شَاءَت</span>ْ ).</p>
<p><strong>Et son sens sur le plan religieux (Législation islamique) :</strong> C'est la dissolution du lien conjugal, en totalité ou en partie.</p>
<p>⁕ <strong>Quant à son statut juridique (Hukm) :</strong> Il varie selon les circonstances et les situations. Parfois il est autorisé (<em>Mubâh</em>), parfois détestable (<em>Makrûh</em>), parfois recommandé (<em>Mustahabb</em>), parfois obligatoire (<em>Wâjib</em>), et parfois interdit (<em>Harâm</em>). Les cinq statuts juridiques s'appliquent donc à lui.</p>
<p>⁃ <strong>Il est autorisé (<em>Mubâh</em>)</strong> lorsque l'époux en a besoin, en raison du mauvais comportement de la femme et du préjudice qu'elle cause, et que l'objectif du mariage ne peut plus être atteint en restant avec elle.</p>
<p>⁃ <strong>Et le divorce est détestable (<em>Makrûh</em>)</strong> s'il a lieu sans aucun besoin, comme dans le cas où la situation du couple est stable et harmonieuse. Selon certains imams, il est même interdit (<em>Harâm</em>) dans ce cas de figure. Cependant, l'avis prépondérant (<em>Al-Râjih</em>) est qu'il est autorisé tout en étant détestable, en raison du hadith :</p>
<p class="ar"><span dir="rtl">«أَبْغَضُ الْحَلَالِ إِلَى اللهِ الطَّلَاقُ»</span></p>
<p><em><strong>« L'acte licite le plus détestable auprès d'Allah est le divorce »</strong></em>, rapporté par Abou Dawoud et Ibn Majah, et ses rapporteurs sont dignes de confiance (<em>Thiqât</em>) <a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a>. Le Prophète <span dir="rtl">ﷺ</span> l'a ainsi qualifié de "licite" (<em>Halâl</em>) dans ce hadith, tout en mentionnant qu'il est détesté par Allah. Cela prouve donc qu'il est détestable dans cette situation précise, tout en restant permis. La raison de son caractère détestable réside dans le fait qu'il rompt une union conjugale qui comporte pourtant des intérêts bénéfiques recherchés par la législation islamique.</p>
<p>⁃ <strong>Et le divorce est recommandé (<em>Mustahabb</em>)</strong> en cas de besoin, lorsque le maintien du lien conjugal cause un préjudice à l'épouse ; comme en cas de discorde profonde (<em>Shiqâq</em>) entre elle et son époux, ou lorsqu'elle éprouve de l'aversion envers lui. En effet, préserver le mariage dans une telle situation est nuisible pour la femme, alors que le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="rtl">«لَا ضَرَرَ وَلَا ضِرَارَ»</span></p>
<p><em><strong>« Il ne doit y avoir ni préjudice subi, ni préjudice infligé »</strong></em>. <a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a></p>
<p>⁃ <strong>Et le divorce est obligatoire (<em>Wâjib</em>)</strong> pour l'époux si l'épouse ne fait pas preuve de droiture dans sa pratique religieuse ; par exemple si elle délaisse la prière ou la retarde au-delà de son temps prescrit, et qu'il n'arrive pas à la réformer, ou si elle n'est pas chaste (porte atteinte à son honneur). Il lui est alors obligatoire de divorcer d'elle dans ce cas de figure, selon le plus authentique des deux avis des savants.</p>
<p><strong>Cheikh al-Islam Ibn Taymiyyah (qu'Allah lui fasse miséricorde) a dit :</strong> <em>« Si elle commet l'adultère, il ne lui est pas permis de la garder auprès de lui dans cette situation, sinon il serait un Dayyoûth (un homme jaloux de son honneur qui tolère la perversité dans son foyer). »</em></p>
<p><strong>De même, si c'est l'époux qui ne fait pas preuve de droiture dans sa religion :</strong> il est obligatoire pour l'épouse de lui demander le divorce, ou de se séparer de lui par le biais du <em>Khoul'</em> (divorce par rachat) en versant une compensation financière (<em>Fidyah</em>). Elle ne doit pas rester avec lui alors qu'il néglige et perd sa religion.</p>
<p><strong>De la même manière, le divorce devient obligatoire pour le mari s'il pratique le serment de continence (<em>Îlâ'</em>) envers sa femme :</strong> c'est-à-dire s'il jure de ne plus avoir de rapports intimes avec elle, et que quatre mois s'écoulent alors qu'il refuse de reprendre les rapports et d'expier son serment, persistant dans son refus. Dans ce cas, il lui est obligatoire de divorcer, et on l'y contraint, conformément à la parole d'Allah le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿ لِّلَّذِينَ يُؤْلُونَ مِن نِّسَائِهِمْ تَرَبُّصُ أَرْبَعَةِ أَشْهُرٍ ۖ فَإِن فَاءُوا فَإِنَّ اللَّهَ غَفُورٌ رَّحِيمٌ * وَإِنْ عَزَمُوا الطَّلَاقَ فَإِنَّ اللَّهَ سَمِيعٌ عَلِيمٌ ﴾ [البقرة: ٢٢٦-٢٢٧]</span></p>
<p><strong>﴾ Pour ceux qui font le serment de se priver de leurs femmes, il y a un délai d'attente de quatre mois. S'ils reviennent (sur leur serment), Allah est certes Pardonneur et Miséricordieux. Mais s'ils se décident au divorce, Allah est certes Audient et Omniscient. ﴿</strong> [Al-Baqarah: 226-227]</p>
<p>⁃ <strong>Et le divorce est interdit (<em>Harâm</em>)</strong> pour le mari lorsque sa femme est en période de menstrues (<em>Hayd</em>) ou de lochies (<em>Nifâs</em>), ainsi que durant une période de pureté au cours de laquelle il a eu des rapports intimes avec elle alors qu'une grossesse n'est pas encore apparente. De même, il est interdit de prononcer le divorce trois fois (simultanément). L'explication détaillée de cela viendra, si Allah le veut.</p>
<p>⁕ <strong>La preuve de la légitimité du divorce :</strong> Le Livre (le Coran), la Sunnah et le consensus (<em>Al-Ijmâ'</em>).</p>
<p>⁃ Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿يَا أَيُّهَا النَّبِيُّ إِذَا طَلَّقْتُمُ النِّسَاءَ فَطَلِّقُوهُنَّ لِعِدَّتِهِنَّ﴾ [البقرة : ٢٢٩]</span></p>
<p></p>
<p><strong>﴾ Le divorce est permis pour deux fois. ﴿</strong> [Al-Baqarah: 229]</p>
<p><strong>Et Allah le Très-Haut a dit :</strong></p>
<p class="ar"><span dir="rtl">﴿ يَا أَيُّهَا النَّبِيُّ إِذَا طَلَّقْتُمُ النِّسَاءَ فَطَلِّقُوهُنَّ لِعِدَّتِهِنَّ ﴾ [الـطَّلَاق : ١]</span></p>
<p><strong>﴾ Ô Prophète ! Quand vous divorcez des femmes, divorcez d’elles en tenant compte de leur période d'attente prescrite ('Iddah*). ﴿</strong> [At-Talâq: 1]</p>
<p>⁃ Et le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="rtl">«إِنَّمَا الطَّلَاقُ لِمَنْ أَخَذَ بِالسَّاقِ»</span></p>
<p><em><strong>« Le divorce n'appartient qu'à celui qui prend par la jambe (c'est-à-dire le mari) »</strong></em>, rapporté par Ibn Mâjah et Al-Dâraqutnî <a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a>, ainsi que pour d'autres ahadiths.</p>
<p>⁃ Et plus d'un parmi les gens de science ont rapporté le consensus (<em>Ijmâ'</em>) sur la légitimité du divorce.</p>
<p>⁕ Et la sagesse en cela est apparente, et cela fait partie des beautés de cette immense religion musulmane. En effet, il contient une solution au problème conjugal en cas de besoin.</p>
<p>Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿فَإِمْسَاكٌ بِمَعْرُوفٍ أَوْ تَسْرِيحٌ بِإِحْسَٰنٍ﴾ [البقرة: ٢٢٩]</span></p>
<p><strong>﴾ Le comportement convenable ou la libération avec gentillesse ﴿</strong> [Al-Baqarah : 229]</p>
<p>et le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿وَإِن يَتَفَرَّقَا يُغْنِ اللَّهُ كُلًّا مِّن سَعَتِهِۦ ۚ وَكَانَ اللَّهُ وَٰسِعًا حَكِيمًا﴾ [النساء: ١٣٠]</span></p>
<p><strong>﴾ Si les deux se séparent, Allah enrichira chacun d'eux de Sa largesse. Allah est Plein de largesses et Sage ﴿</strong> [An-Nisâ' : 130].</p>
<p>Ainsi, lorsqu'il n'y a plus d'intérêt à maintenir le mariage, ou qu'un préjudice est causé à l'épouse en restant avec l'homme, ou que l'un des deux a des mœurs corrompues et n'est pas droit dans sa religion, le divorce constitue alors un soulagement et une issue.</p>
<p>Et combien les sociétés qui interdisent le divorce souffrent de malheurs, de corruptions, de suicides et de la destruction des familles ! C'est pourquoi l'Islam grandiose a autorisé le divorce et lui a fixé des règles par lesquelles l'intérêt est réalisé et le tort est repoussé, comme c'est le cas pour toutes ses législations magnifiques qui englobent les intérêts immédiats et futurs. La louange revient donc à Allah pour Sa grâce et Sa bienfaisance.</p>
<p>⁕ Quant à celui de qui l'application du divorce est valable : c'est l'époux doué de discernement, libre de son choix, qui en comprend le sens, ou son mandataire ; en raison de la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«إِنَّمَا الطَّلَاقُ لِمَنْ أَخَذَ بِالسَّاقِ»</span></p>
<p><em><strong>« Le divorce n'appartient qu'à celui qui prend par la jambe »</strong></em>.</p>
<p>⁃ Quant à celui qui a perdu la raison tout en étant excusable pour cela ; comme le fou, la personne évanouie, le dormeur, et celui qui est atteint d'une maladie ayant fait disparaître sa conscience — comme la pleurésie (le délire fébrile) —, ainsi que celui qui a été contraint à boire un intoxiquant, ou qui a pris un anesthésiant ou autre pour un traitement médical : le divorce de toutes ces personnes ne prend pas effet s'ils le prononcent alors qu'ils ont perdu la raison à cause de l'un de ces motifs. Cela repose sur la parole de 'Alî :</p>
<p class="ar"><span dir="rtl">«كُلُّ الطَّلَاقِ جَائِزٌ؛ إِلَّا طَلَاقَ الْمَعْتُوهِ»</span></p>
<p><em><strong>« Tout divorce est exécutoire, sauf le divorce du dément »</strong></em>, mentionné par Al-Boukhârî dans son « Sahîh » <a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a>, et parce que la raison est le fondement de l'application des statuts juridiques.</p>
<p>⁃ Quant à celui qui perd la raison en consommant volontairement un intoxiquant de son propre choix, puis divorce dans cet état : l'effectivité de son divorce fait l'objet d'une divergence parmi les gens de science, selon deux avis. Le premier : il prend effet, et c'est l'avis des quatre imams ainsi que d'un groupe parmi les gens de science.</p>
<p>⁃ Et s'il est contraint au divorce injustement, et qu'il divorce pour repousser la contrainte et l'injustice, son divorce ne prend pas effet, conformément au hadith :</p>
<p class="ar"><span dir="rtl">«لَا طَلَاقَ وَلَا عِتَاقَ فِي إِغْلَاقٍ»</span></p>
<p><em><strong>« Il n'y a ni divorce ni affranchissement sous la contrainte (Ighlâq) »</strong></em>, rapporté par Ahmad, Abû Dâwûd et Ibn Mâjah <a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a>; l'<em>Ighlâq</em> désigne ici la contrainte.</p>
<p>Et en raison de la parole d'Allah le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿ مَن كَفَرَ بِاللَّهِ مِن بَعْدِ إِيمَانِهِ إِلَّا مَنْ أُكْرِهَ وَقَلْبُهُ مُطْمَئِنٌّ بِالْإِيمَانِ ﴾ [النحل: ١٠٦]</span></p>
<p><strong>﴾ Quiconque renie Allah après avoir cru... sauf celui qui y a été contraint alors que son cœur demeure plein de sérénité par la foi ﴿</strong> [An-Nahl : 106].</p>
<p>La mécréance étant plus grave que le divorce, et la personne contrainte en étant dispensée, le divorce l'est alors à plus forte raison. En revanche, si la contrainte au divorce est légitime, comme pour celui qui a fait le serment d'abstinence conjugale (<em>Al-Mu'lî</em>) et refuse de reprendre la vie commune, alors son divorce prend effet.</p>
<p>⁃ Le divorce prend effet de la part de l'homme en colère qui est conscient de ce qu'il dit. Quant à l'homme en colère que la rage a submergé au point qu'il ne sait plus ce qu'il dit, son divorce ne prend pas effet.</p>
<p>⁃ Le divorce prend effet de la part de celui qui plaisante, car il a eu l'intention de prononcer ces paroles, même s'il n'avait pas l'intention d'en appliquer les conséquences. Et Allah sait mieux.</p>
