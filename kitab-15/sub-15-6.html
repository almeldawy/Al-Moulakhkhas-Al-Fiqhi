<p>⁕ <strong>Al-Îlâ' :</strong> C'est le fait de jurer. C'est le nom d'action (<em>Masdar</em>) du verbe <em>Âlâ</em>, <em>Yu'lî</em>, <em>Îlâ'an</em>. Et <em>Al-Aliyyah</em> signifie le serment. On dit : « Il a fait un <em>Îlâ'</em> envers son épouse » lorsqu'il a juré de ne plus avoir de rapports intimes avec elle.</p>
<p>C'est pourquoi les juristes (<em>Al-Fuqahâ'</em>) l'ont défini comme étant : <em>Le serment d'un époux en capacité d'accomplir l'acte charnel, jurant par Allah ou par l'un de Ses attributs, de délaisser le rapport intime avec son épouse (par la voie naturelle) pour toujours, ou pour une durée supérieure à quatre mois.</em></p>
<p>⁕ À partir de cette définition, nous pouvons déduire que l'îlâ' (le serment de continence) n'est effectif que si cinq conditions sont réunies :</p>
<p><strong>La première :</strong> Qu'il émane d'un époux en capacité d'accomplir l'acte charnel.</p>
<p><strong>La deuxième :</strong> Qu'il jure par Allah ou par l'un de Ses attributs, et non par un divorce, une affranchissement ou un vœu pieux.</p>
<p><strong>La troisième :</strong> Qu'il jure de délaisser le rapport intime par la voie naturelle (le vagin).</p>
<p><strong>La quatrième :</strong> Qu'il jure de délaisser le rapport intime pour une période supérieure à quatre mois.</p>
<p><strong>La cinquième :</strong> Que l'épouse soit en condition de pouvoir subir l'acte charnel.</p>
<p>Si ces conditions sont pleinement remplies, l'époux devient alors un <em>mûlî</em> (auteur d'un îlâ') et la règle juridique de l'îlâ' s'applique à lui. En revanche, si l'une de ces conditions fait défaut, il n'est pas considéré comme un <em>mûlî</em>.</p>
<p>⁕ La preuve de la légitimité de l'îlâ' réside dans la parole d'Allah Le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿لِلَّذِينَ يُؤْلُونَ مِنْ نِسَائِهِمْ تَرَبُّصُ أَرْبَعَةِ أَشْهُرٍ فَانْ فَاءُوا فَإِنَّ اللَّهَ غَفُورٌ رَحِيمٌ * وَإِنْ عَزَمُوا الطَّلَاقَ فَإِنَّ اللَّهَ سَمِيعٌ عَلِيمٌ﴾ [البقرة].</span></p>
<p><strong>﴾ Pour ceux qui font le serment de se priver de leurs femmes, il y a un délai d'attente de quatre mois. S'ils reviennent (sur leur serment), alors Allah est Pardonneur et Miséricordieux. Mais s'ils se décident au divorce, alors Allah est Audient et Omniscient. ﴿</strong> [Al-Baqarah, v. 226-227].</p>
<p>C'est-à-dire : les époux qui jurent de délaisser les rapports intimes avec leurs femmes bénéficient d'un délai de quatre mois. S'ils accomplissent l'acte charnel avec leurs épouses et s'acquittent de l'expiation de leur serment, Allah leur pardonne alors ce qui a émané d'eux. En revanche, si cette période s'écoule alors qu'ils persistent à refuser tout rapport avec leurs épouses, ils sont alors assignés à comparaître : on leur ordonne d'avoir des rapports intimes avec leurs femmes et d'expier leur serment. S'ils s'y refusent, l'ordre leur est donné de divorcer, suite à la réclamation de la femme.</p>
<p>Ceci constitue une abolition des pratiques de l'époque préislamique (<em>Al-Jâhiliyyah</em>), durant laquelle ils prolongeaient indéfiniment la durée de l'îlâ'. Cette législation sage et équitable permet ainsi de dissiper le préjudice subi par la femme et de lever l'injustice qui pesait sur elle.</p>
<p>⁕ Le serment de continence (<em>Al-Îlâ'</em>) est interdit en Islam, car il s'agit d'un serment prêté pour délaisser une obligation (le devoir conjugal).</p>
<p>⁕ L’îlâ’ est valide de la part de tout époux dont le divorce est juridiquement valable, qu'il soit musulman ou mécréant, libre ou esclave, et qu'il ait atteint la puberté ou qu'il soit un enfant discernant (<em>mumayyiz</em>) – auquel cas il sera sommé d'agir après sa puberté. Il est également valable de la part de l'homme en colère ou du malade dont on espère la guérison, et ce, en raison de la portée générale du noble verset. Il est même valable à l'égard de l'épouse avec laquelle le mariage n'a pas été consommé, toujours en raison de la portée générale du verset.</p>
<p>⁕ En revanche, l’îlâ’ n'est pas valable de la part d'un époux fou ou évanoui (inconscient), car ils ne conçoivent pas ce qu'ils disent ; l'intention (<em>al-qasd</em>) est donc inexistante chez eux.</p>
<p>⁕ De même, l’îlâ’ n'est pas valable de la part d'un époux incapable d'accomplir l'acte sexuel en raison d'un empêchement physique flagrant, comme l'émasculé (<em>al-majbûb</em>) ou le paralysé, car l'abstention de rapports dans leur cas n'est pas causée par le serment.</p>
<p>⁕ Ainsi, s’il dit à son épouse : <em>« Par Allah, je ne t’approcherai jamais »</em>, ou s’il fixe une période supérieure à quatre mois, ou s’il lie le terme du serment à un événement dont la réalisation n’est pas envisageable avant quatre mois – comme la descente d'Issa (Jésus) fils de Maryam (Marie), que la paix soit sur lui, ou la sortie de l'Antéchrist (<em>Ad-Dajjâl</em>) –, il est alors considéré comme auteur d'un îlâ' (<em>mûlî</em>) dans toutes ces situations. Il en va de même s’il lie la fin de son serment à l'accomplissement par l'épouse d'un acte interdit ou au délaissement d'une obligation, comme s’il disait : « <em>Par Allah, je ne t’approcherai pas tant que tu ne délaisseras pas la prière, ou tant que tu ne boiras pas de vin. »</em> Dans ce cas, il est aussi considéré comme auteur d'un îlâ', car il a suspendu la reprise des rapports à une condition religieusement interdite, ce qui s'apparente ici à un empêchement physique.</p>
<p>⁕ Dans toutes ces situations, la période de l'îlâ' est fixée (à quatre mois), en raison de la parole d'Allah Le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿لِلَّذِينَ يُؤْلُونَ مِنْ نِسَائِهِمْ تَرَبُّصُ أَرْبَعَةِ أَشْهُرٍ﴾ [البقرة : ٢٢٦]</span></p>
<p><strong>﴾ Pour ceux qui font le serment de se priver de leurs femmes, il y a un délai d'attente de quatre mois ﴿</strong> [Al-Baqarah : 226].</p>
<p>Et il est rapporté dans le <em>Sahîh</em> d'après Ibn 'Umar <a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a> qu'il a dit :</p>
<p class="ar"><span dir="rtl">« إِذَا مَضَى أَرْبَعَةُ أَشْهُرٍ مِمَّنْ حَلَفَ عَلَى مُدَّةٍ تَزِيدُ عَلَيْهَا ؛ فَهُوَ مُؤْلٍ ؛ يُوقَفُ حَتَّى يُطَلِّقَ ، وَلَا يَقَعُ بِهِ الطَّلَاقُ حَتَّى يُطَلِّقَ »</span></p>
<p><em><strong>« Lorsque les quatre mois se sont écoulés pour celui qui a juré pour une période supérieure à cela, il est considéré comme auteur d'un îlâ' (mûlî) : il est alors assigné à comparaître jusqu'à ce qu'il divorce, et le divorce ne devient effectif que lorsqu'il le prononce. »</strong></em> Al-Bukhârî a mentionné cette opinion d'après plus d'une dizaine de compagnons.</p>
<p>De plus, Sulaymân Ibn Yasâr a dit : <em><strong>« J'ai connu plus d'une dizaine de compagnons du Messager d'Allah, et tous assignaient à comparaître l'auteur de l'îlâ'. »</strong></em> C'est d'ailleurs l'avis de la grande majorité des savants (<em>jamâhîr al-'ulamâ'</em>), tout comme cela correspond au sens apparent du noble verset.</p>
<p>⁕ Lorsque les quatre mois à compter de son serment se sont écoulés — sans que l'on ne comptabilise dans ce délai les jours de ses menstrues (ses excuses légales) — une fois cette période passée :</p>
<p>Si un rapport charnel a lieu avec son épouse, il est alors revenu sur son serment (<em>fâ'a</em>), car le retour (<em>al-fay'ah</em>) désigne ici l'acte sexuel, et il l'a accompli. Ibn al-Mundhir a dit : <em><strong>« Tous ceux dont nous avons mémorisé l'avis s'accordent à dire que le retour (al-fay') est le rapport sexuel. »</strong></em> Et l'origine linguistique du terme <em>al-fay'</em> signifie le fait de revenir à l'accomplissement de ce que l'on avait délaissé. C'est par ce biais que la femme obtient le droit qui lui est dû de sa part.</p>
<p>En revanche, si l'auteur du serment refuse d'avoir des rapports avec elle après l'écoulement de la période mentionnée, le juge (<em>al-hâkim</em>) lui ordonne alors de divorcer si la femme en fait la demande, et ce, conformément à la parole d'Allah Le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿وَإِنْ عَزَمُوا الطَّلَاقَ فَإِنَّ اللَّهَ سَمِيعٌ عَلِيمٌ﴾ [البقرة : ٢٢٧]</span></p>
<p><strong>﴾ Mais s'ils se décident au divorce, alors Allah est Audient et Omniscient. ﴿</strong> [Al-Baqarah : 227]. C'est-à-dire : s'il ne revient pas sur son serment, mais qu'il se résout et concrétise la rupture, le divorce devient effectif. Si l'époux refuse à la fois de revenir sur son serment et de prononcer le divorce, le juge prononce alors le divorce à sa place ou annule le mariage (<em>yafsakh</em>), car il se substitue à l'auteur de l'îlâ' en cas de refus de sa part, et le divorce est une procédure qui admet la substitution.</p>
<p>⁕ Les juristes (<em>Al-Fuqahâ'</em>) ont assimilé à l'auteur de l'îlâ' (<em>mûlî</em>), dans ces mêmes règles, celui qui délaisse le rapport charnel avec son épouse dans le but de lui nuire (<em>idrâran bihâ</em>), sans avoir prêté de serment, pour une période supérieure à quatre mois alors qu'il n'a pas d'excuse valable. De même, ils ont assimilé à l'auteur de l'îlâ' celui qui formule un <em>zihâr</em> (assimilation de son épouse à sa mère) à l'égard de sa femme, ne s'acquitte pas de l'expiation, et persiste dans cette situation durant plus de quatre mois. En effet, chacun de ces deux profils délaisse le rapport charnel avec son épouse dans le but de lui nuire ; ils s'apparentent donc à l'auteur de l'îlâ'. Et Allah Ta'âlâ est Le plus Savant.</p>
<p>⁕ Ils (les juristes) ont dit : Si la période de l'îlâ' arrive à son terme alors que l'un des deux époux présente une excuse légitime empêchant l'acte charnel, il est alors ordonné à l'époux de formuler son retour (<em>fay'ah</em>) verbalement, en disant par exemple : <em><strong>« Dès que j'en serai capable, j'aurai des rapports avec toi »</strong></em>. La finalité du retour étant d'abandonner son intention initiale de nuire à l'épouse, le fait de présenter ses excuses démontre qu'il renonce à lui porter préjudice. Par la suite, dès qu'il en retrouve la capacité, soit il accomplit l'acte charnel, soit il divorce, en raison de la disparition de l'incapacité pour laquelle le délai avait été prolongé. Et Allah est Le plus Savant.</p>
