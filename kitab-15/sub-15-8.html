<p>⁕ Certes, Allah – Gloire à Lui – a interdit la calomnie (<em>Al-Qadhf</em>, qui consiste à accuser à tort une personne innocente de commettre l'adultère ou la fornication) et a proféré à cet égard les plus sévères menaces.</p>
<p>Le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿إِنَّ الَّذِينَ يَرْمُونَ الْمُحْصَنَاتِ الْغَافِلَاتِ الْمُؤْمِنَاتِ لُعِنُوا فِي الدُّنْيَا وَالْآخِرَةِ وَلَهُمْ عَذَابٌ عَظِيمٌ * يَوْمَ تَشْهَدُ عَلَيْهِمْ أَلْسِنَتُهُمْ وَأَيْدِيهِمْ وَأَرْجُلُهُم بِمَا كَانُوا يَعْمَلُونَ * يَوْمَئِذٍ يُوَفِّيهِمُ اللَّهُ دِينَهُمُ الْحَقَّ وَيَعْلَمُونَ أَنَّ اللَّهَ هُوَ الْحَقُّ الْمُبِينُ﴾ [النور: ٢٣ - ٢٥]</span></p>
<p></p>
<p><strong>﴾ Ceux qui lancent des accusations contre des femmes vertueuses, chastes (insouciantes) et croyantes sont maudits ici-bas comme dans l'au-delà ; et ils auront un énorme châtiment, le jour où leurs langues, leurs mains et leurs pieds témoigneront contre eux de ce qu'ils faisaient. Ce jour-là, Allah leur paiera pleinement leur juste rétribution, et ils sauront qu'Allah est la Vérité Éclatante. ﴿</strong> [Sourate An-Nûr : 23-25]</p>
<p>Et Il a rendu obligatoire le fait de flageller le calomniateur de quatre-vingts coups de fouet s'il ne peut apporter la preuve en produisant quatre témoins qui attestent de la véracité de ses propos, ainsi que de le considérer comme un pervers (<em>fâsiq</em>) dont le témoignage n'est plus accepté, à moins qu'il ne se repente et se réforme.</p>
<p>Le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿وَالَّذِينَ يَرْمُونَ الْمُحْصَنَاتِ ثُمَّ لَمْ يَأْتُوا بِأَرْبَعَةِ شُهَدَاءَ فَاجْلِدُوهُمْ ثَمَانِينَ جَلْدَةً وَلَا تَقْبَلُوا لَهُمْ شَهَادَةً أَبَدًا وَأُولَٰئِكَ هُمُ الْفَاسِقُونَ * إِلَّا الَّذِينَ تَابُوا مِن بَعْدِ ذَٰلِكَ وَأَصْلَحُوا فَإِنَّ اللَّهَ غَفُورٌ رَّحِيمٌ﴾ [النور: ٤ - ٥]</span></p>
<p><strong>﴾ Et ceux qui lancent des accusations contre des femmes chastes sans produire quatre témoins, fouettez-les de quatre-vingts coups de fouet, et n'acceptez plus jamais leur témoignage. Et ceux-là sont les pervers, à l'exception de ceux qui, après cela, se repentent et se réforment, car Allah est Pardonneur et Miséricordieux. ﴿</strong> [Sourate An-Nûr : 4-5]</p>
<p>Cela s'applique lorsqu'il calomnie une autre personne que son épouse : ces mesures strictes sont alors prises à son encontre. En revanche, s'il accuse son épouse d'adultère (<em>zinâ</em>), une autre solution s'offre à lui, consistant à remplacer ces procédures par ce que l'on appelle le <em>Li'ân</em> (le serment d'anathème réciproque). Il s'agit de témoignages solennels renforcés par des serments de part et d'autre, associés à l'invocation de la malédiction et de la colère [d'Allah], comme cela sera exposé par la suite.</p>
<p>⁕ Ainsi, lorsqu’un homme accuse son épouse d’adultère et qu’il ne peut en apporter la preuve, il lui est possible d’écarter de lui la peine légale de la calomnie en recourant au serment d’anathème réciproque (<em>Al-Mulâ'anah</em>), conformément à la parole du Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿وَالَّذِينَ يَرْمُونَ أَزْوَاجَهُمْ وَلَمْ يَكُن لَّهُمْ شُهَدَاءُ إِلَّا أَنفُسُهُمْ فَشَهَادَةُ أَحَدِهِمْ أَرْبَعُ شَهَادَاتٍ بِاللَّهِ ۙ إِنَّهُ لَمِنَ الصَّادِقِينَ * وَالْخَامِسَةُ أَنَّ لَعْنَتَ اللَّهِ عَلَيْهِ إِن كَانَ مِنَ الْكَاذِبِينَ * وَيَدْرَأُ عَنْهَا الْعَذَابَ أَن تَشْهَدَ أَرْبَعَ شَهَادَاتٍ بِاللَّهِ ۙ إِنَّهُ لَمِنَ الْكَاذِبِينَ * وَالْخَامِسَةَ أَنَّ غَضَبَ اللَّهِ عَلَيْهَا إِن كَانَ مِنَ الصَّادِقِينَ﴾ [النور: ٦ - ٩]</span></p>
<p><strong>﴾ Et quant à ceux qui lancent des accusations contre leurs propres épouses sans avoir d’autres témoins qu'eux-mêmes, le témoignage de l'un d'eux consiste à jurer quatre fois par Allah qu'il est certes du nombre des véridiques, et la cinquième fois, que la malédiction d'Allah soit sur lui s'il est du nombre des menteurs. Et le châtiment sera écarté de l'épouse si elle jure quatre fois par Allah que son mari est certes du nombre des menteurs, et la cinquième fois, que la colère d'Allah soit sur elle s'il est du nombre des véridiques. ﴿</strong> [Sourate An-Nûr : 6-9]</p>
<p>L’époux dit alors à quatre reprises : <em><strong>« Je prends Allah à témoin que mon épouse que voici a certes commis l'adultère »</strong></em>, et il la désigne du doigt si elle est présente, ou la nomme par ce qui permet de l'identifier clairement si elle est absente. Puis, il ajoute au cinquième témoignage : <em><strong>« que la malédiction d'Allah soit sur lui s'il est du nombre des menteurs. »</strong></em></p>
<p>Ensuite, elle dit à quatre reprises : <em><strong>« Je prends Allah à témoin qu'il a certes menti dans l'accusation d'adultère qu'il a portée contre moi »</strong></em>, puis elle dit à la cinquième fois : <em><strong>« et que la colère d'Allah soit sur elle s'il est du nombre des véridiques. »</strong></em> Et la colère a été spécifiquement attribuée à la femme car celui qui encourt la colère est celui qui commet le tort tout en connaissant la vérité mais la nie indûment.</p>
<p>⁕ <strong>Et il est exigé pour la validité du serment d'anathème réciproque :</strong></p>
<ul>
<li><blockquote>
<p>qu'il ait lieu entre deux époux légalement responsables (<em>mukallafayn</em>)</p>
</blockquote></li>
<li><blockquote>
<p>qu'il l'accuse d'adultère, qu'elle le démante à ce sujet et que son démenti persiste jusqu'au terme de la procédure du serment</p>
</blockquote></li>
<li><blockquote>
<p>et enfin que cela s'accomplisse par la décision d'un juge.</p>
</blockquote></li>
</ul>
<p>⁕ Ainsi, lorsque le serment d'anathème réciproque est accompli selon la forme que nous avons mentionnée, en remplissant toutes ses conditions de validité, <strong>il en découle les conséquences suivantes :</strong></p>
<p><strong>Premièrement :</strong> L'annulation de la peine légale pour calomnie (hadd al-qadhf) à l'encontre de l'époux.</p>
<p><strong>Deuxièmement :</strong> L'établissement de la séparation entre eux et l'interdiction définitive et perpétuelle de l'épouse pour lui.</p>
<p><strong>Troisièmement :</strong> La négation de la filiation de l'enfant de celle-ci à son égard s'il l'a renié durant le serment d'anathème réciproque, en disant par exemple : <em><strong>« Cet enfant n'est pas de moi. »</strong></em></p>
<p>⁕ Et l'époux a recours au serment d'anathème réciproque lorsqu'il voit son épouse commettre l'adultère et qu'il ne lui est pas possible d'en apporter la preuve, ou lorsque s'accumulent chez lui des présomptions fortes de sa pratique de l'adultère, comme dans le cas où il verrait un homme connu pour sa débauche s'introduire chez elle.</p>
<p>⁕ Et la sagesse de la légifération du serment d'anathème réciproque en faveur de l'époux réside dans le fait que le déshonneur lui retombe dessus par l'adultère de celle-ci, que cela souille son lit conjugal, et afin que ne lui soit pas attribué l'enfant d'un autre. De plus, il lui est généralement impossible d'établir la preuve contre elle, alors qu'elle-même n'avoue pas son crime et que la parole du mari n'est pas acceptée contre elle. Il ne restait donc plus d'autre recours que leur prestation mutuelle de serments par les jurements les plus solennels ; ainsi, la légifération du serment d'anathème réciproque fut une solution à son problème et une suppression de la gêne qui pesait sur lui.</p>
<p>Et étant donné qu'il n'avait d'autre témoin que lui-même, la femme a été mise en mesure de s'opposer aux serments du mari par des serments répétés similaires, par lesquels elle écarte d'elle-même la peine légale. Si le mari refuse de prêter serment (<em>nakala</em>), la peine légale pour calomnie (<em>hadd al-qadhf</em>) lui est alors imposée. En revanche, si c'est elle qui refuse de prêter serment après que lui a juré, les serments du mari, combinés au refus de l'épouse, deviennent une preuve puissante et incontestable.</p>
<p>⁕ L'éminent savant Ibn Al-Qayyim a dit : <em>« Et c'est cela qui est appuyé par la preuve. Le madhab de Mâlik, Al-Shâfi'î, Ahmad et d'autres encore est de prononcer la peine légale (Al-Hadd) contre elle si elle refuse de prêter serment (nakalat). C'est cela l'avis authentique, le Coran l'indique, et c'est ce qu'a affirmé de manière catégorique le Cheikh [Ibn Taymiyyah] ainsi que d'autres. »</em> Fin de citation.</p>
<p>⁕ Et la preuve tirée de la Sunnah quant à la légifération du serment d'anathème réciproque en cas de besoin est ce sur quoi les deux Cheikhs (Al-Bukhârî et Muslim)<a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a> se sont accordés, d'après Ibn 'Umar ; lorsqu'il fut interrogé au sujet des deux conjoints qui accomplissent le serment : « Doit-on les séparer ? », il répondit : « Gloire à Allah ! Oui, certes, le premier à avoir interrogé à ce sujet fut un tel, fils d'un tel. Il dit : "Ô Messager d'Allah ! Vois-tu, si l'un de nous surprenait son épouse en plein acte de turpitude (adultère), que devrait-il faire ? S'il parle, il profère une chose grave, et s'il se tait, il garde le silence sur une chose tout aussi grave." » Il (Ibn 'Umar) dit : « Le Prophète <span dir="rtl">ﷺ</span> garda le silence et ne lui répondit pas. Plus tard, l'homme revint vers lui et dit : "Ce sur quoi je t'interrogeais, j'y suis désormais confronté (j'en suis éprouvé)."</p>
<p>Allah <span dir="rtl">ﷻ</span> révéla alors ces versets dans la sourate An-Nûr :</p>
<p class="ar"><span dir="rtl">﴿وَالَّذِينَ يَرْمُونَ أَزْوَاجَهُمْ﴾ [النور: ٦]</span></p>
<p><strong>﴾ Et quant à ceux qui lancent des accusations contre leurs propres épouses</strong>… <strong>﴿</strong> [Sourate An-Nûr : 6].</p>
<p>Le Prophète les lui récita, l'exhorta, lui rappela [les préceptes d'Allah] et l'informa que le châtiment d'ici-bas est bien plus léger que le châtiment de l'au-delà. L'homme dit alors : "Non, par Celui qui t'a envoyé avec la vérité en tant que prophète, je n'ai pas menti sur elle !" Ensuite, le Prophète fit venir l'épouse, l'exhorta, et l'informa que le châtiment d'ici-bas est bien plus léger que le châtiment de l'au-delà. Elle répondit : "Non, par Celui qui t'a envoyé avec la vérité en tant que prophète, il ment sûrement !" Le Prophète commença alors par l'homme, qui témoigna quatre fois par Allah qu'il était du nombre des véridiques, et la cinquième fois, que la malédiction d'Allah soit sur lui s'il était du nombre des menteurs. Puis il passa à la femme, qui témoigna quatre fois par Allah que son mari était du nombre des menteurs, et la cinquième fois, que la colère d'Allah soit sur elle s'il était du nombre des véridiques. Enfin, il prononca la séparation entre eux." »</p>
