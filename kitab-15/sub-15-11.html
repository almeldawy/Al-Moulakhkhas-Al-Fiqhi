  <!-- ▼ CONTENU DU CHAPITRE ▼ -->
  <template id="chapter-content">
<p>⁕ L'Istibrâ’ est une période d'attente par laquelle on vise à s'assurer de la vacuité (l'absence de grossesse) de l'utérus d'une esclave possédée. Ce terme est dérivé de "Al-Barâ'ah" (l'innocence/la vacuité), qui signifie la distinction et la coupure nette.</p>
<p>⁕ Quiconque entre en possession d'une esclave en âge d'avoir des rapports sexuels—que ce soit par vente, don, capture de guerre ou autre—il lui est interdit d'avoir des rapports avec elle, ainsi que les préliminaires, avant d'avoir procédé à son <em>Istibrâ’</em>. Cela s'appuie sur la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«مَنْ كَانَ يُؤْمِنُ بِاللَّهِ وَالْيَوْمِ الْآخِرِ؛ فَلَا يَسْقِ بِ مَاءَهُ زَرْعَ غَيْرِهِ»</span></p>
<p><em><strong>« Quiconque croit en Allah et au Jour dernier, qu'il n'irrigue pas de son eau la culture d'un autre »</strong></em>, rapporté par Ahmad, At-Tirmidhî et Abû Dâwud.</p>
<p>Et dans un autre hadith rapporté par Abû Dâwud :</p>
<p class="ar"><span dir="rtl">«لَا تُوطَأُ حَامِلٌ حَتَّىٰ تَضَعَ»</span></p>
<p><em><strong>« On n'a pas de rapports avec une femme enceinte jusqu'à ce qu'elle accouche »</strong></em><a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a></p>
<p>⁕ L'<em>Istibrâ’</em> de l'esclave enceinte prend fin avec l'accouchement, en raison de la portée générale de la parole d'Allah Le Très Haut :</p>
<p class="ar"><span dir="rtl">﴿وَأُولَاتُ الْأَحْمَالِ أَجَلُهُنَّ أَنْ يَضَعْنَ حَمْلَهُنَّ﴾ [الطلاق: ٤]</span></p>
<p><strong>﴾ Et quant à celles qui sont enceintes, leur période d'attente se termine par leur accouchement ﴿</strong> [Al-Talâq : 4].</p>
<p>⁕ Et pour celle qui n'est pas enceinte, si elle a ses menstrues, son <em>Istibrâ’</em> se fait par une seule menstruation, conformément à la parole du Prophète <span dir="rtl">ﷺ</span> concernant les captives d'Awtâs :</p>
<p class="ar"><span dir="rtl">«لَا تُوطَأُ حَامِلٌ حَتَّىٰ تَضَعَ، وَلَا غَيْرُ حَامِلٍ حَتَّىٰ تَحِيضَ حَيْضَةً»</span></p>
<p><em><strong>« On n'a pas de rapports avec une femme enceinte jusqu'à ce qu'elle accouche, ni avec une femme non enceinte jusqu'à ce qu'elle ait une menstruation »</strong></em>, rapporté par Ahmad et Abû Dâwud <a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a>.</p>
<p>Ce hadith prouve l'obligation de l'<em>Istibrâ’</em> de l'esclave captive (et autre qu'elle) avant d'avoir des rapports avec elle, et il clarifie la modalité de l'<em>Istibrâ’</em> pour la femme enceinte et celle qui a ses menstrues parmi les captives.</p>
<p>⁕ Quant à l'esclave ménopausée (qui n'a plus ses règles) et la jeune esclave impubère, leur <em>Istibrâ’</em> se fait par l'écoulement d'un mois, car le mois remplace la menstruation dans le calcul du délai de viduité (Al-'Iddah).</p>
<p>⁕ Et la sagesse derrière l'obligation de l'Istibrâ’ de l'esclave avant d'avoir des rapports avec elle est clarifiée par sa parole <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«مَنْ كَانَ يُؤْمِنُ بِاللَّهِ وَالْيَوْمِ الْآخِرِ؛ فَلَا يَسْقِ مَاءَهُ زَرْعَ غَيْرِهِ»</span></p>
<p><em><strong>« Quiconque croit en Allah et au Jour dernier, qu'il n'irrigue pas de son eau la culture d'un autre »</strong></em>.</p>
<p>Il a ainsi mis en évidence que le but de l'Istibrâ’ est d'éviter le mélange des eaux (les spermes de différents hommes) et la confusion dans les filiations (les généalogies).</p>
