<h1 id="بسم-الله-الرحمن-الرحيم"><strong><span dir="rtl">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</span></strong></h1>
<p><strong>Chapitre sur les règles du Khoul‘ (la répudiation moyennant compensation)</strong></p>
<p>⁕ Le <em>Khoul‘</em> est la séparation de l'époux d'avec son épouse moyennant une compensation financière, en utilisant des termes spécifiques. Il a été nommé ainsi parce que la femme se défait (se détache) de son époux tout comme on enlève un vêtement, car chacun des deux conjoints est un vêtement pour l'autre. Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿هُنَّ لِبَاسٌ لَّكُمْ وَأَنتُمْ لِبَاسٌ لَّهُنَّ﴾ [البقرة: ١٨٧]</span></p>
<p><strong>﴾ Elles sont un vêtement pour vous et vous êtes un vêtement pour elles ﴿</strong> [Al-Baqarah : 187].</p>
<p>⁕ Il est bien connu que le mariage est un lien entre les deux conjoints et une vie commune convenable, dont découle la construction d'une famille et l'éducation d'une génération. Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿وَمِنْ آيَاتِهِ أَنْ خَلَقَ لَكُم مِّنْ أَنفُسِكُمْ أَزْوَاجًا لِّتَسْكُنُوا إِلَيْهَا وَجَعَلَ بَيْنَكُم مَّوَدَّةً وَرَحْمَةً﴾ [الروم: ٢١]</span></p>
<p><strong>﴾ Et parmi Ses signes, Il a créé de vous, pour vous, des épouses pour que vous viviez en tranquillité auprès d'elles et Il a mis entre vous de l'affection et de la bonté ﴿</strong> [Ar-Rûm : 21]. Dès lors, si ce sens profond du mariage ne se concrétise plus, au point que l'affection disparaisse des deux côtés, ou du côté de l'époux seul, que la cohabitation s'altère et que tout remède s'avère difficile, l'époux a alors l'ordre de libérer son épouse avec bonté.</p>
<p>Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿فَإِمْسَاكٌ بِمَعْرُوفٍ أَوْ تَسْرِيحٌ بِإِحْسَانٍ﴾ [البقرة: ٢٢٩]</span></p>
<p><strong>﴾ C'est soit le maintien dans la bienséance, soit la libération avec gentillesse ﴿</strong> [Al-Baqarah : 229]</p>
<p>et Il a dit également :</p>
<p class="ar"><span dir="rtl">﴿وَإِن يَتَفَرَّقَا يُغْنِ اللَّهُ كُلًّا مِّن سَعَتِهِ ۚ وَكَانَ اللَّهُ وَاسِعًا حَكِيمًا﴾ [النساء: ١٣٠].</span></p>
<p><strong>﴾ Si les deux se séparent, Allah enrichira chacun d'eux de Sa largesse. Allah est Plein de largesses et Sage ﴿</strong> [An-Nisâ : 130].</p>
<p>En revanche, si l'affection est présente du côté de l'époux mais absente du côté de l'épouse — par exemple si elle répugne le comportement de son mari, son apparence physique, ou le manquement dans sa pratique religieuse, ou encore si elle craint de commettre un péché en transgressant ses droits —, il lui est permis dans ce cas de demander la séparation en contrepartie d'une compensation financière qu'elle lui verse pour racheter sa liberté. Cela conformément à la parole d'Allah le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿فَإِنْ خِفْتُمْ أَلَّا يُقِيمَا حُدُودَ اللَّهِ فَلَا جُنَاحَ عَلَيْهِمَا فِيمَا افْتَدَتْ بِهِ﴾ [البقرة: ٢٢٩]</span></p>
<p><strong>﴾ Si vous craignez de ne pas observer les lois d'Allah, alors aucune faute n'est imputée aux deux conjoints si la femme se rachète avec quelque bien ﴿</strong> [Al-Baqarah : 229]. Autrement dit : si le mari ou la femme sait que s'ils maintiennent le lien conjugal, chacun d'eux n'accomplira pas le devoir qui lui incombe envers l'autre, entraînant de ce fait une injustice du mari envers son épouse, ou que la femme craigne de désobéir à son mari ; alors il n'y a aucun grief à ce que l'épouse rachète sa liberté auprès du mari moyennant compensation, et il n'y a aucun grief à ce que le mari accepte cette compensation et la laisse suivre sa voie.</p>
<p>⁕ La sagesse de cela réside dans le fait que l'épouse se libère de son époux d'une manière définitive sans possibilité de reprise conjugale (sans <em>Raj'ah</em>). C'est donc une solution équitable pour les deux parties, et il est recommandé (selon la Sunnah) à l'époux d'accepter sa demande à ce moment-là. Toutefois, si le mari l'aime, il est alors préférable (recommandé) pour elle de patienter et de ne pas demander le rachat de sa liberté (<em>Khoul‘</em>).</p>
<p>⁕ Le <em>Khoul‘</em> est autorisé lorsque sa cause, mentionnée dans le noble verset, est présente : à savoir la crainte des deux conjoints, s'ils maintiennent le mariage, de ne pas respecter les limites d'Allah. En revanche, s'il n'y a aucun besoin d'y recourir, le <em>Khoul‘</em> est alors détestable (<em>Makrûh</em>), et selon certains savants, il est même interdit (<em>Harâm</em>) dans ce cas de figure, en raison de la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><strong><span dir="rtl">«أَيُّمَا امْرَأَةٍ سَأَلَتْ زَوْجَهَا الطَّلَاقَ مِنْ غَيْرِ مَا بَأْسٍ؛ فَحَرَامٌ عَلَيْهَا رَائِحَةُ الْجَنَّةِ»</span></strong></p>
<p><strong>« Toute femme qui demande le divorce à son mari sans motif valable, l'odeur du Paradis lui sera interdite. »</strong> (Rapporté par les cinq, à l'exception d'An-Nassâ'î) <a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a>.</p>
<p>Cheikh Taqî ad-Dîn (Ibn Taymiyyah) a dit : <strong>« Le <em>Khoul‘</em> instauré par la Sunnah consiste à ce que la femme éprouve de l'aversion envers l'homme, et qu'elle rachète ainsi sa liberté auprès de lui à la manière d'un prisonnier. »</strong></p>
<p>⁕ Et si le mari ne l'aime pas, mais qu'il la retient dans le but qu'elle se lasse (de cette situation) et qu'elle rachète sa liberté auprès de lui, il se montre alors injuste envers elle. Il lui est interdit de prendre d'elle une compensation, et le <em>Khoul‘</em> n'est pas valable, conformément à la parole d'Allah le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿وَلَا تَعْضُلُوهُنَّ لِتَذْهَبُوا بِبَعْضِ مَا آتَيْتُمُوهُنَّ﴾ [النساء: ١٩]</span></p>
<p><strong>﴾ Et ne les contraignez pas (ne leur causez pas de tort) afin de leur ravir une partie de ce que vous leur aviez donné ﴿</strong> [An-Nisâ : 19]. C'est-à-dire : ne leur causez pas de préjudice dans la vie commune afin qu'elle abandonne une partie ou la totalité de la dot que tu lui as versée, ou qu'elle renonce à l'un de ses droits qui lui reviennent de la part de son mari. Sauf si la contrainte exercée sur elle dans ce cas précis est due au fait qu'elle ne soit pas chaste (coupable d'adultère), et qu'il agisse ainsi pour récupérer d'elle la dot qu'il lui avait donnée ; cela lui est alors permis, selon la parole d'Allah le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿إِلَّا أَن يَأْتِينَ بِفَاحِشَةٍ مُّبَيِّنَةٍ﴾ [النساء: ١٩]</span></p>
<p><strong>﴾ à moins qu'elles ne commettent une turpitude prouvée ﴿</strong> [An-Nisâ : 19]. Ibn 'Abbâs a dit concernant le sens de ce verset : <em>« Cela s'applique à l'homme qui est marié à une femme et qui répugne sa compagnie alors qu'il lui est redevable d'une dot. Il lui cause alors du tort afin qu'elle se rachète (financièrement) auprès de lui. Allah le Très-Haut a donc interdit cela, puis Il a dit : "à moins qu'elles ne commettent une turpitude prouvée", c'est-à-dire : l'adultère. Dans ce cas, il est en droit de récupérer d'elle la dot qu'il lui a donnée, et de lui mener la vie dure jusqu'à ce qu'elle la lui abandonne, et qu'il se sépare d'elle par Khoul‘. »</em></p>
<p>⁕ La preuve de la permission du <em>Khoul‘</em> (le divorce par rachat à l'initiative de l'épouse), lorsqu'une cause légitime le justifiant se présente, se trouve dans le Livre (le Coran), la Sunnah et le consensus (<em>Al-Ijmâ‘</em>).</p>
<p>⁃ Quant au Livre, il s'agit du verset que nous avons précédemment cité, à savoir la parole d'Allah le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿فَإِنْ خِفْتُمْ أَلَّا يُقِيمَا حُدُودَ اللَّهِ فَلَا جُنَاحَ عَلَيْهِمَا فِيمَا افْتَدَتْ بِهِ﴾ [البقرة: ٢٢٩]</span></p>
<p><strong>﴾ Si vous craignez de ne pas observer les lois d’Allah, alors aucun grief ne leur sera fait pour ce par quoi elle se rachète. ﴿</strong> [Sourate Al-Baqarah : 229].</p>
<p>⁃ Quant à la Sunnah, il est rapporté dans l'authentique (<em>Al-Boukhari</em>) que l'épouse de Thâbit ibn Qays (qu'Allah l'agrée) a dit : <em><strong>« Ô Messager d'Allah ! Je n'ai rien à lui reprocher concernant sa religion ni son comportement, mais je déteste l'ingratitude en Islam (c'est-à-dire : l'ingratitude envers le conjoint qui est interdite, et le fait de manquer à ses devoirs envers lui en raison d'une aversion intense à son égard). »</strong></em> Le Messager d'Allah <span dir="rtl">ﷺ</span> lui dit alors : <em><strong>« Lui rendras-tu son jardin ? »</strong></em> Elle répondit : <em><strong>« Oui. »</strong></em> Le Messager d'Allah <span dir="rtl">ﷺ</span> dit alors [au mari] : <em><strong>« Accepte le jardin et divorce d'elle par une répudiation. »</strong></em> Rapporté par Al-Boukhari <a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a>.</p>
<p>⁃ Quant au consensus, Ibn 'Abd Al-Barr a dit : <em>« Nous ne connaissons personne qui ait divergé à ce sujet, excepté Al-Muzanî. Ce dernier a prétendu que le verset a été abrogé par la parole d'Allah le Très-Haut :</em></p>
<p class="ar"><span dir="rtl">﴿وَإِنْ أَرَدْتُمُ اسْتِبْدَالَ زَوْجٍ مَكَانَ زَوْجٍ وَآتَيْتُمْ إِحْدَاهُنَّ قِنْطَارًا فَلَا تَأْخُذُوا مِنْهُ شَيْئًا﴾ [النساء: ٢٠]</span></p>
<p><strong>﴾ Si vous voulez substituer une épouse à une autre, et que vous ayez donné à l'une d'elles un quintar, n'en reprenez rien. ﴿</strong> <em>[Sourate An-Nisâ' : 20]. »</em></p>
<p>⁕ Sont stipulées pour la validité du <em>Khoul‘</em> [les conditions suivantes] :</p>
<ul>
<li><blockquote>
<p>Le versement d'une compensation de la part d'une personne dont le don gratuit est légalement valable.</p>
</blockquote></li>
<li><blockquote>
<p>Qu'il émane d'un époux dont la répudiation (<em>Talâq</em>) est juridiquement valide.</p>
</blockquote></li>
<li><blockquote>
<p>Qu'il ne la maltraite pas (ou ne la contraigne pas) injustement pour la pousser à verser cette compensation.</p>
</blockquote></li>
<li><blockquote>
<p>Qu'il soit prononcé avec les termes explicites du <em>Khoul‘</em>. En revanche, s'il est prononcé avec les termes de la répudiation (<em>Talâq</em>) ou par une formulation métaphorique accompagnée de l'intention de répudier, il s'agit alors d'une répudiation (<em>Talâq</em>).</p>
</blockquote></li>
</ul>
<p>⁕ Quant au cas où il (le divorce) a lieu en utilisant les termes du <em>Khoul‘</em>, de l'annulation (<em>Al-Faskh</em>) ou du rachat (<em>Al-Fidâ’</em>), sans qu'il n'ait eu l'intention d'effectuer une répudiation, il est alors considéré comme une annulation (<em>Faskh</em>). Le nombre de répudiations (auxquelles l'époux a le droit) n'est pas diminué par cet acte. Cela a été rapporté d'après Ibn ‘Abbâs (qu'Allah l'agrée), qui s'est basé sur la preuve textuelle suivante, à savoir la parole d'Allah le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿الطَّلَاقُ مَرَّتَانِ﴾ [البقرة: ٢٢٩]</span></p>
<p><strong>﴾ La répudiation est permise deux fois. ﴿</strong> [Sourate Al-Baqarah : 229], puis le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿فَلَا جُنَاحَ عَلَيْهِمَا فِيمَا افْتَدَتْ بِهِ﴾ [البقرة: ٢٢٩]</span></p>
<p><strong>﴾ Alors aucun grief ne leur sera fait pour ce par quoi elle se rachète. ﴿</strong> [Sourate Al-Baqarah : 229], puis le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿فَإِنْ طَلَّقَهَا فَلَا تَحِلُّ لَهُ مِنْ بَعْدُ حَتَّى تَنْكِحَ زَوْجًا غَيْرَهُ﴾ [البقرة: ٢٣٠]</span></p>
<p><strong>﴾ S’il la répudie (pour la troisième fois), alors elle ne lui sera plus licite tant qu’elle n’aura pas épousé un autre homme. ﴿</strong> [Sourate Al-Baqarah : 230]. Il (Allah) a ainsi mentionné deux répudiations, puis il a mentionné le <em>Khoul‘</em>, puis il a mentionné une répudiation après cela. Si le <em>Khoul‘</em> avait été une répudiation, cela aurait constitué une quatrième répudiation. Et Allah est le Plus Savant.</p>
