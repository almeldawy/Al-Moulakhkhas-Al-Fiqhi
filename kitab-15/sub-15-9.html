<p>⁕ Si l'épouse d'une personne ou sa servante donne naissance à un nouveau-né dont la conception est possible de sa part, sa filiation lui est alors affiliée et l'enfant est le sien. Cela correspond au fait qu'elle accouche dans son lit conjugal (Firâsh), conformément à la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«الْوَلَدُ لِلْفِرَاشِ»</span></p>
<p><em><strong>« L'enfant appartient au lit conjugal »</strong></em><a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a>.</p>
<p>⁕ La possibilité que l'enfant provienne de lui se présente dans plusieurs situations :</p>
<p><strong>La première situation :</strong> Qu'elle soit sous le lien du mariage avec son époux, et qu'elle accouche après six mois (une demi-année) à compter du moment où les rapports intimes et la cohabitation ont été possibles, qu'il ait été présent ou absent. Cela s'applique car la possibilité que l'enfant vienne de lui est avérée, et qu'il n'existe aucun élément contradictoire.</p>
<p><strong>La deuxième situation :</strong> Qu'elle ne soit plus sous le lien du mariage avec son époux, et qu'elle accouche moins de quatre ans après qu'il se soit séparé d'elle (par divorce définitif). La filiation du nouveau-né lui est alors attribuée, car la durée maximale de la grossesse est de quatre ans. Ainsi, si elle accouche avant cette limite, il est possible que l'enfant provienne de celui qui l'a divorcée, il lui est donc affilié.</p>
<p>Il est toutefois conditionné, pour affilier l'enfant à l'époux ou à celui qui a divorcé dans ces deux situations : que chacun d'eux soit en âge de procréer, c'est-à-dire qu'il ait atteint l'âge de dix ans ou plus. Cela s'appuie sur la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«مُرُوا أَوْلَادَكُمْ بِالصَّلَاةِ لِسَبْعٍ، وَاضْرِبُوهُمْ عَلَيْهَا لِعَشْرٍ، وَفَرِّقُوا بَيْنَهُمْ فِي الْمَضَاجِعِ»</span></p>
<p><strong>« Ordonnez à vos enfants d'accomplir la prière à l'âge de sept ans, corrigez-les pour elle à dix ans, et séparez-les dans les couches »</strong><a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a>.</p>
<p>L'ordre du Prophète <span dir="rtl">ﷺ</span> de les séparer dans les lits à cet âge constitue une preuve de la possibilité des rapports intimes, qui sont la cause de la naissance. Cela prouve donc qu'il est possible d'attribuer la filiation à un garçon de dix ans, même si on ne statue pas sur sa puberté légale à cet âge. En effet, le statut de puberté n'est effectif qu'avec la confirmation de ses signes distinctifs. Nous nous sommes simplement contentés de la possibilité des rapports intimes de sa part pour lui affilier la lignée, afin de préserver la filiation du nouveau-né et par mesure de précaution à son égard.</p>
<p><strong>La troisième situation :</strong> S’il divorce de son épouse d’un divorce révocable (<em>Raj‘î</em>), et qu’elle accouche après l’écoulement de quatre ans depuis le jour où il a divorcé d’elle, mais avant l’expiration de son délai de viduité (<em>‘Iddah</em>) ; la filiation de l’enfant lui est alors attribuée. Il en est de même si la femme divorcée d’un divorce révocable accouche avant l’écoulement de quatre ans à compter de l’expiration de sa période de viduité ; la filiation de son nouveau-né lui est également affiliée. Cela s’explique par le fait que la femme divorcée d’un divorce révocable conserve juridiquement le statut d’épouse ; la période consécutive au divorce est ainsi assimilée à celle qui la précédait.</p>
<p>⁕ Parmi les cas par lesquels le nouveau-né d'une servante est affilié à son maître : qu'une personne reconnaisse (avoue) avoir eu des rapports intimes avec sa servante, ou que la preuve irréfutable (<em>Al-Bayyinah</em>) en soit établie contre lui. Si, par la suite, cette servante accouche après six mois ou plus à compter de ce rapport intime — dont la réalité a été établie par son propre aveu ou par la preuve —, la filiation de ce nouveau-né lui est alors attribuée. En effet, par cet acte, elle est devenue son lit conjugal (<em>Firâsh</em>), entrant ainsi dans la portée générale de la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«الْوَلَدُ لِلْفِرَاشِ»</span></p>
<p><strong>« L'enfant appartient au lit conjugal »</strong><a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a>.</p>
<p>⁕ Et parmi ces cas : qu'un maître reconnaisse avoir eu des rapports intimes avec sa servante, puis qu'il la vende ou l'affranchisse après avoir formulé cet aveu. Si elle accouche ensuite moins de six mois après sa vente ou son affranchissement, et que le nouveau-né survit, la filiation de l'enfant lui est alors attribuée. En effet, la durée minimale d'une grossesse étant de six mois, si elle accouche en deçà de ce terme et que son enfant vit, on sait par conséquent qu'elle l'a conçu avant qu'il ne la vende. Elle constituait alors, à ce moment-là, son lit conjugal (<em>Firâsh</em>), et le Prophète <span dir="rtl">ﷺ</span> a certes dit :</p>
<p class="ar"><span dir="rtl">«الْوَلَدُ لِلْفِرَاشِ»</span></p>
<p><strong>« L'enfant appartient au lit conjugal »</strong><a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a>.</p>
<p>⁕ Et le fait que l'enfant provienne de l'époux est exclu (nié) dans deux situations :</p>
<p><strong>La première situation :</strong> Si elle accouche de lui moins de six mois après son mariage et que l'enfant survit ; car il n'est pas possible qu'elle conçoive et accouche durant cette période. Elle était donc, à ce moment-là, déjà enceinte de lui avant qu'il ne l'épouse.</p>
<p><strong>La deuxième situation :</strong> S'il divorce d'elle d'un divorce irrévocable (<em>Bâ'in</em>), puis qu'elle accouche après l'écoulement de plus de quatre ans à compter de son divorce ; la filiation de ce nouveau-né ne lui est alors pas attribuée, car nous savons [avec certitude] qu'elle est tombée enceinte après ce mariage (c'est-à-dire après la fin de cette union).</p>
<p>⁕ La filiation de l'enfant d'une servante n'est pas attribuée au maître si celui-ci affirme qu'il a observé sa période de viduité d'épuration (<em>Istibrâ'</em>) après avoir eu des rapports avec elle. En effet, par cette épuration, la vacuité de son utérus (l'absence de grossesse de sa part) est confirmée avec certitude, ce qui implique que ce nouveau-né provient d'un autre que lui. La parole retenue concernant l'accomplissement de l'épuration est celle du maître, car il s'agit d'une affaire cachée dont il est difficile et pénible de prendre connaissance. Cependant, sa parole à ce sujet n'est acceptée que s'il prête serment, car en agissant ainsi, il nie le droit de l'enfant à la filiation ; son serment est donc indispensable concernant son affirmation de l'épuration.</p>
<p>⁕ Si un litige (une ambiguïté) survient à propos d'un nouveau-né, la présomption du lit conjugal (<em>Al-Firâsh</em>) prévaut sur le rapport par ambiguïté (<em>Ash-Shubhah</em>). Par exemple : si un maître revendique la paternité de l'enfant de sa servante, tandis qu'un homme ayant eu un rapport par ambiguïté la revendique également, l'enfant est alors attribué au maître, en application de la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«الْوَلَدُ لِلْفِرَاشِ»</span></p>
<p><strong>« L'enfant appartient au lit conjugal »</strong><a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a>.</p>
<p>⁕ L'enfant suit son père en matière de filiation, conformément à la parole de Allah (Le Très-Haut) :</p>
<p class="ar"><span dir="rtl">﴿ادْعُوهُمْ لِآبَائِهِمْ﴾ [الأحزاب: ٥]</span></p>
<p><strong>﴾ Appelez-les du nom de leurs pères ﴿</strong> [Al-Ahzâb : 5].</p>
<p>⁕ En matière de religion, l'enfant suit celui de ses deux parents qui a la meilleure religion. Ainsi, si un chrétien épouse une païenne (idolâtre), ou inversement, l'enfant suivra alors le chrétien d'entre les deux.</p>
<p>⁕ L'enfant suit sa mère concernant la liberté ou l'esclavage, sauf en cas de condition préalable [stipulée lors du mariage] ou de tromperie (Ghiss/Gharar).</p>
<p>À travers ce rapide exposé des règles de l'affiliation de la filiation, nous percevons le grand intérêt que porte l'Islam à la préservation des généalogies, en raison des bénéfices qui en découlent pour le maintien des liens de parenté (Sîlat ar-Rahim), les successions (l'héritage), la tutelle légale (Al-Wilâyah) et d'autres aspects encore. Allah (Le Très-Haut) a dit :</p>
<p class="ar"><span dir="rtl">﴿يَٰأَيُّهَا ٱلنَّاسُ إِنَّا خَلَقْنَٰكُم مِّن ذَكَرٍ وَأُنثَىٰ وَجَعَلْنَٰكُمْ شُعُوباً وَقَبَائِلَ لِتَعَارَفُواْ إِنَّ أَكْرَمَكُمْ عِندَ ٱللَّهِ أَتْقَىٰكُمْ إِنَّ ٱللَّهَ عَلِيمٌ خَبِيرٌ﴾ [الحجرات: ١٣]</span></p>
<p><strong>﴾ Ô hommes ! Nous vous avons créés d'un mâle et d'une femelle, et Nous avons fait de vous des nations et des tribus, pour que vous vous entre-connaissiez. Le plus noble d'entre vous, auprès d'Allah, est le plus pieux. Allah est Certes Omniscient et Parfaitement Connaisseur ﴿</strong> [Al-Houjourât : 13]. L'objectif de la connaissance des lignées n'est donc pas la vanité, la fierté tribale ni le fanatisme de l'époque de l'ignorance (Al-Jâhiliyyah), mais le but recherché est plutôt l'entraide, le maintien des liens et la miséricorde mutuelle.</p>
<p>Qu'Allah accorde à tous la réussite vers ce qu'Il aime et agrée.</p>
