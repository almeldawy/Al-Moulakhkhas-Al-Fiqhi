<h3 id="premièrement-la-société-basée-sur-la-notoriété-sharikat-al-wujûh"><strong>Premièrement : La société basée sur la notoriété (<em>Sharikat al-Wujûh</em>)</strong></h3>
<p>⁕ <strong>La société basée sur la notoriété</strong> consiste en l'association de deux personnes ou plus pour acheter des marchandises à crédit (sur la base de leur seule responsabilité financière / engagement), le profit réalisé étant partagé entre elles selon les conditions fixées. Elle a été nommée ainsi parce qu'elle ne possède pas de capital initial ; ce qui y est engagé, ce sont uniquement les responsabilités financières, la notoriété (le statut social) et la confiance que les commerçants leur accordent. C'est par ce biais qu'ils achètent et vendent, et ils partagent le gain qu'ils en retirent conformément à leur accord, en raison de la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«الْمُسْلِمُونَ عَلَى شُرُوطِهِمْ»</span></p>
<p><em><strong>« Les musulmans doivent respecter les conditions qu'ils ont acceptées »</strong></em>.<a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a></p>
<p>Ce type de société s'apparente à la société d'association par participation (<em>Sharikat al-'Inân</em>), c'est pourquoi le même statut juridique lui a été appliqué.</p>
<p>⁕ Chacun des deux associés est à la fois le mandataire (<em>Wakîl</em>) de son partenaire et son garant (<em>Kafîl</em>) pour le paiement du prix, car ce genre de société repose entièrement sur le mandat (<em>Al-Wakâlah</em>) et la garantie (<em>Al-Kafâlah</em>).</p>
<p>⁕ <strong>La part que chacun d'eux possède dans cette société est déterminée selon les termes du contrat</strong> ; qu'elle soit partagée par moitié (à parts égales), ou qu'elle soit inférieure ou supérieure pour l'un d'eux.</p>
<p>Et chacun d’eux supporte la perte financière à hauteur de sa quote-part de propriété dans la société. Ainsi, celui qui possède la moitié de la société doit assumer la moitié de la perte... et il en va de même pour le reste (proportionnellement).</p>
<p>De même, chacun des associés a droit à une part des bénéfices conformément aux conditions stipulées (dans le contrat) : que ce soit la moitié, le quart ou le tiers. En effet, l'un d'eux peut s'avérer plus digne de confiance, plus sollicité par les commerçants ou plus clairvoyant dans les méthodes de commerce que l'autre. De plus, le travail fourni par chacun d'eux peut différer de celui de l'autre, ce qui peut amener l'un à aspirer à une augmentation de sa part en contrepartie. On se réfère donc, pour cela, aux conditions en vigueur fixées entre eux.</p>
<p>⁕ <strong>Et chacun des associés dans la société basée sur la notoriété (<em>Sharikat al-Wujûh</em>) dispose des mêmes prérogatives / pouvoirs</strong> que ceux détenus par les associés dans la société d'association par participation (<em>Sharikat al-'Inân</em>).</p>
<h3 id="deuxièmement-la-société-basée-sur-le-travail-corporel-sharikat-al-abdân"><strong>Deuxièmement : La société basée sur le travail corporel (<em>Sharikat al-Abdân</em>)</strong></h3>
<p>⁕ <strong>La société basée sur le travail corporel</strong> consiste en l'association de deux personnes ou plus pour acquérir des gains par l'effort de leurs propres corps (leur force de travail). Elle a été nommée ainsi parce que les associés engagent leurs corps dans les travaux afin de générer des revenus, et s'associent ainsi dans le gain qu'ils en obtiennent.</p>
<p>⁕ <strong>La preuve de la licéité de ce type de société</strong> réside dans ce qu'ont rapporté Abû Dâwûd, an-Nasâ'î et d'autres, d'après Ibn Mas'ûd (qu'Allah l'agrée) qui a dit : « Nous nous sommes associés, moi, 'Ammâr et Sa'd, concernant ce que nous obtiendrions le jour de Badr. Sa'd est alors venu avec deux prisonniers, tandis que 'Ammâr et moi n'avions rien apporté »<a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a>. L'imam Ahmad a dit : « <em>Le Prophète <span dir="rtl">ﷺ</span> a validé leur association</em> ». Ce hadith prouve donc la validité de la société portant sur les gains issus du travail corporel.</p>
<p>⁕ <strong>Une fois que l'accord est conclu entre eux</strong>, tout travail accepté par l'un d'eux engage le reste des associés à l'accomplir. Ainsi, chaque associé peut être sollicité (par le client) pour exécuter les travaux que son partenaire a acceptés, car cela fait partie des exigences et des implications de ce contrat.</p>
<p>⁕ <strong>La société basée sur le travail corporel est valable même si les métiers des associés diffèrent</strong>, comme l'association d'un tailleur avec un forgeron... et ainsi de suite. Chacun des associés a le droit de réclamer le salaire du travail que lui-même ou son compagnon a accepté. De même, il est permis au client (le locuteur d'ouvrage) de verser le salaire à n'importe lequel d'entre eux, car chacun d'eux agit comme le mandataire de l'autre. Par conséquent, tout ce qu'ils obtiennent comme ouvrage ou comme rémunération est partagé de manière commune entre eux.</p>
<p>⁕ <strong>La société basée sur le travail corporel est également valable pour l'appropriation des biens libres d'accès (autorisés à tous)</strong> ; comme le ramassage du bois (bûcheronnage), la cueillette des fruits sauvages dans les montagnes, ainsi que l'extraction des minerais.</p>
<p>⁕ <strong>Et si l'un des associés de la société de travail corporel tombe malade</strong>, le gain obtenu par l'autre associé reste partagé entre eux. En effet, Sa'd, 'Ammâr et Ibn Mas'ûd s'étaient associés : Sa'd était revenu avec deux prisonniers tandis que les deux autres n'avaient rien rapporté, et le Prophète <span dir="rtl">ﷺ</span> a tout de même maintenu leur association.</p>
<p>Cependant, si l'associé bien portant exige de l'associé malade qu'il désigne un remplaçant pour travailler à sa place, ce dernier est tenu de le faire. En effet, ils se sont engagés mutuellement à travailler ; si l'un d'eux se trouve dans l'incapacité d'accomplir le travail lui-même, il lui incombe d'établir un remplaçant afin de respecter les obligations du contrat. Si l'associé incapable de travailler refuse de désigner un remplaçant après qu'on le lui a demandé, son partenaire est alors en droit de résilier le contrat de société.</p>
<p>⁕ <strong>De même, si des propriétaires de montures ou de véhicules s'associent</strong> pour effectuer des transports de marchandises contre rémunération, et que le gain obtenu est partagé entre eux, cela est tout à fait valable car il s'agit d'une forme d'activité lucrative. Il est également valable de confier une monture ou un véhicule à une personne pour qu'elle l'exploite, le gain généré étant alors partagé entre elles deux. Enfin, si trois personnes s'associent — la première fournissant la monture, la deuxième l'outil (ou la machine) et la troisième le travail — à condition que le gain obtenu soit partagé entre elles, cette forme d'association est valide.</p>
<p>La société entre courtiers (intermédiaires / démarcheurs) est également valable si leur rôle consiste à faire la criée pour la vente des marchandises, à les exposer et à amener les clients, le gain ainsi généré étant partagé entre eux.</p>
<h3 id="troisièmement-la-société-à-responsabilité-illimitée-universelle-sharikat-al-mufâwadah"><strong>Troisièmement : La société à responsabilité illimitée / universelle (<em>Sharikat al-Mufâwadah</em>)</strong></h3>
<p>⁕ <strong>La société à responsabilité universelle</strong> consiste à ce que chacun des associés délègue à son partenaire le plein pouvoir pour toute gestion financière et corporelle parmi les différents types de sociétés. Elle constitue ainsi la combinaison des sociétés d'association par participation (<em>'Inân</em>), de commandite (<em>Mudârabah</em>), basée sur la notoriété (<em>Wujûh</em>) et sur le travail corporel (<em>Abdân</em>), ou encore (on peut la définir comme le fait) qu'ils s'associent dans tout ce qui leur est dû (droits/gains) et tout ce qui leur incombe (dettes/obligations).</p>
<p>⁕ <strong>Ce type de société est tout à fait valable</strong>, car il réunit des formes de sociétés qui sont chacune valides individuellement ; elles restent donc valides lorsqu'elles sont combinées ensemble.</p>
<p>⁕ <strong>Le profit est réparti dans cette société selon ce qu'ils ont stipulé (dans le contrat)</strong>, tandis qu'ils supportent la perte financière proportionnellement à la quote-part que chacun d'eux possède dans la société, d'après un calcul exact.</p>
<p>C'est ainsi que la législation de l'Islam a élargi le champ des activités lucratives dans les limites du licite. Elle a permis à l'être humain d'acquérir des biens de manière individuelle ou en s'associant avec autrui, et elle traite les gens selon leurs conditions, tant que celles-ci ne sont pas injustes ou interdites. C'est à travers cela que se manifeste l'adéquation et l'universalité de cette législation pour chaque époque et chaque lieu.</p>
<p>Nous demandons à Allah de nous accorder la fermeté dans son attachement et de nous guider à marcher sur sa voie. Certes, Il est Celui qui entend tout et qui exauce les prières.</p>
