<h1 id="section">﷽</h1>
<p><strong>Chapitre sur les règles du partenariat et les différents types de sociétés.</strong></p>
<p>⁕ Le sujet des sociétés est une chose dont il convient de connaître les règles en raison de la fréquence de son application. En effet, l'association dans le commerce et dans d'autres domaines ne cesse de se perpétuer entre les gens. Cela relève de l'entraide mutuelle pour l'accomplissement des intérêts communs, à travers la fructification des biens, leur investissement et le partage des compétences.</p>
<p>⁕ Ainsi, la société dans le commerce et dans d'autres domaines fait partie des choses dont la légitimité (la permission) est établie par les textes du Livre (le Coran) et de la Sunnah.</p>
<p>⁕ Allah Le Très Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿وَإِنَّ كَثِيرًا مِّنَ الْخُلَطَاءِ لَيَبْغِي بَعْضُهُمْ عَلَىٰ بَعْضٍ﴾ [ص: ٢٤]</span></p>
<p><strong>« Et beaucoup d'associés se font certainement du tort les uns aux autres »</strong> [Sâd : 24].</p>
<p>Les « associés » (<em>Al-Khulatâ'</em>) désignent ici les partenaires. Et le sens de <strong>« se font du tort les uns aux autres »</strong> signifie qu'ils se causent de l'injustice mutuellement. Ce noble verset prouve donc la permission de s'associer, tout en interdisant à un associé de faire preuve d'injustice envers son partenaire.</p>
<p>Et la preuve tirée de la Sunnah concernant la légitimité de l'association réside dans la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«قَالَ اللهُ تَعَالَى: أَنَا ثَالِثُ الشَّرِيكَيْنِ»</span></p>
<p><strong>« Allah — Le Très Haut — a dit : "Je suis le troisième des deux associés" »</strong> <a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a></p>
<p>c'est-à-dire : qu'Il est avec eux par Sa protection, Sa préservation, Son soutien et par la descente de la bénédiction dans leur commerce ;</p>
<p class="ar"><span dir="rtl">«مَا لَمْ يَخُنْ أَحَدُهُمَا صَاحِبَهُ، فَإِذَا خَانَهُ؛ خَرَجْتُ مِنْ بَيْنِهِمَا»</span></p>
<p><strong>« tant que l'un d'eux ne trahit pas son compagnon. Mais s'il le trahit, Je me retire d'entre eux deux »</strong></p>
<p>c'est-à-dire : que la bénédiction est retirée de leur commerce. Il y a donc dans ce hadith la légitimation de la société et l'incitation à y recourir, à condition d'exclure toute trahison, car elle renferme une entraide mutuelle ; et Allah vient en aide au serviteur tant que le serviteur vient en aide à son frère.</p>
<p>⁕ Il convient de choisir pour partenaire une personne dont les biens sont licites (Halâl), et de s'écarter de celle dont les biens sont illicites (Harâm) ou dont les biens sont mélangés entre le licite et l'illicite.</p>
<p>⁕ Et il est permis au musulman de s'associer avec un non-musulman (<em>Kâfir</em>), à condition que le non-musulman ne détienne pas l'exclusivité de la gestion (des opérations). Celle-ci doit plutôt se faire sous la supervision du musulman, afin que le non-musulman ne pratique pas l'usure (<em>Ribâ</em>) ou des transactions illicites s'il venait à agir seul, à l'insu de la surveillance du musulman.</p>
<p>⁕ Et la société se divise en deux catégories : la société de biens (copropriété / <em>Sharikat Amlâk</em>) et la société contractuelle (<em>Sharikat 'Uqûd</em>).</p>
<p>La société de biens (<em>Sharikat al-Amlâk</em>) est une association de droit de propriété (indivision) ; comme l'association dans la possession d'un bien immobilier, d'une usine, de voitures ou autre chose semblable.</p>
<p>Et la société contractuelle (<em>Sharikat al-'Uqûd</em>) est l'association dans la gestion et les transactions ; comme l'association dans la vente, l'achat, la location ou autre. Elle consiste soit en une association par les biens et le travail, soit en une association par le travail sans apport financier. Elle se décline en cinq types :</p>
<p><strong>Le premier type :</strong> que l'association porte à la fois sur le capital et le travail, et ce type est appelé la société d'association contractuelle (<em>Sharikat Al-'Inân</em>).</p>
<p><strong>Le deuxième type :</strong> une association par le capital d'un côté et par le travail de l'autre côté, et c'est ce que l'on appelle la commandite (<em>Al-Mudârabah</em>).</p>
<p><strong>Le troisième type :</strong> une association basée sur la responsabilité financière et la réputation (<em>Al-Dhimam</em>), sans apport de capital. C'est ce que l'on appelle la société basée sur la notoriété (<em>Sharikat Al-Wujûh</em>).</p>
<p><strong>Le quatrième type :</strong> une association dans ce qu'ils acquièrent par le labeur de leurs propres corps (leur force de travail), et c'est ce que l'on appelle la société par le travail corporel (<em>Sharikat Al-Abdân</em>).</p>
<p><strong>Le cinquième type :</strong> une association qui regroupe tout ce qui a précédé ; de sorte que l'un d'eux délègue à l'autre toute gestion financière et corporelle. Elle englobe ainsi la société d'al-'Inân, de la Mudârabah, d'al-Wujûh et d'al-Abdân. Ce type est appelé l'association universelle (<em>Sharikat Al-Mufâwadhah</em>).</p>
<p>Tel est le résumé des types de sociétés. Nous allons maintenant les exposer en détail, une par une, en raison du besoin d'en clarifier le sens. Nous disons donc : (<em>NDT: voir chapitre suivant</em>)</p>
