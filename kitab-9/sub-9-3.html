<p>⁕ Le mot se prononce avec une <em>Kasrah</em> sur la lettre <em>'Ayn</em> (<em>'Inân</em>). Elle a été nommée ainsi en raison de l'égalité des deux associés dans le capital et la gestion ; à l'image de deux cavaliers lorsqu'ils alignent leurs deux montures et avancent au même rythme, de sorte que les deux brides (<em>'Inânâ</em>) de leurs chevaux se trouvent au même niveau. En effet, chacun des deux associés est l'égal de l'autre dans l'apport de son capital et de son travail au sein de la société.</p>
<p>⁕ La réalité de la société d'al-'Inân consiste en l'association de deux personnes ou plus avec leurs capitaux respectifs, de manière à ce qu'ils fusionnent en un capital unique dans lequel ils travaillent ensemble de leurs propres mains, ou bien l'un d'eux y travaille seul tout en bénéficiant d'une part de profit supérieure à celle de l'autre.</p>
<p>⁕ Et la société d'al-'Inân, sous cette considération mentionnée, est licite à l'unanimité (<em>Bils-Ijmâ'</em>), comme l'a rapporté Ibn al-Mundhir — qu'Allah lui fasse miséricorde —. Les divergences n'ont porté que sur certaines de ses conditions secondaires.</p>
<p>⁕ La gestion de chacun des deux associés est exécutoire sur les biens de la société, au titre du droit de propriété concernant sa propre part, et au titre du mandat de procuration (<em>Al-Wikâlah</em>) concernant la part de son associé. En effet, le terme même de "société" dispense d'une autorisation explicite de l'un envers l'autre.</p>
<p>⁕ Et ils (les savants) se sont accordés sur le fait qu'il est permis que le capital de la société soit constitué des deux métaux monnayés (l'or et l'argent). Car les gens se sont associés par ce biais depuis l'époque du Prophète <span dir="rtl">ﷺ</span> jusqu'à nos jours, sans la moindre désapprobation.</p>
<p>⁕ Ils ont en revanche divergé sur le fait que le capital de la société d'al-'Inân puisse être constitué de marchandises (biens de commerce autres que l'or et l'argent). Certains d'entre eux ont dit : "Cela n'est pas permis, car la valeur de l'un des deux biens peut augmenter avant sa vente tandis que la valeur de l'autre n'augmente pas, ce qui amènerait l'un d'eux à partager indûment avec l'autre la croissance de son propre bien." Le second avis stipule : La permission de cela, et c'est l'avis authentique (<em>Al-Sahîh</em>). En effet, l'objectif de la société réside dans leur gestion commune des deux patrimoines et dans le partage du profit généré par ces deux avoirs entre eux. Or, cet objectif est tout aussi réalisable avec des marchandises qu'avec des espèces monétaires.</p>
<p>⁕ Et il est exigé, pour la validité de la société d'al-'Inân, qu'ils stipulent pour chacun des deux associés une quote-part de profit qui soit proportionnelle et connue, telle qu'un tiers ou un quart. En effet, le profit est commun entre eux ; la part de chacun ne peut donc se distinguer que par une stipulation et une définition préalables.</p>
<p>⁕ Dès lors, si la part de profit de chacun d'eux demeurait indéterminée, ou s'il était stipulé en faveur de l'un d'eux le gain provenant d'une marchandise spécifique, le gain d'une période précise, ou le profit d'un voyage déterminé, l'association serait nulle dans toutes ces configurations. En effet, il se peut que seul l'élément spécifié génère du profit, ou qu'il n'en génère aucun, ou encore qu'aucun gain ne soit réalisé en dehors des quelques dirhams spécifiés. Cela mènerait inévitablement à la dispute et à la perte du labeur de l'un d'eux au détriment de l'autre. Or, c'est là une chose que la législation de tolérance (la <em>Shari'ah</em>) interdit, puisqu'elle est venue pour éliminer l'aléa trompeur (<em>Al-Gharar</em>) et le préjudice (<em>Al-Dharar</em>).</p>
