<p>⁕ La société de <strong>Mudârabah</strong> (<em>Al-Mudârabah</em>) a été nommée ainsi en référence à l'expression « <em>Ad-Darbi fil-Ard</em> » (le fait de parcourir la terre), qui signifie voyager pour le commerce.</p>
<p>Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿وَءَاخَرُونَ يَضْرِبُونَ فِي الْأَرْضِ يَبْتَغُونَ مِن فَضْلِ اللهِ﴾ [المزمل: ٢٠]</span></p>
<p><strong>« [...] et d'autres qui parcourent la terre en quête des faveurs d'Allah »</strong> [Sourate Al-Muzzammil, verset 20] ; c'est-à-dire : ils recherchent la subsistance d'Allah à travers les commerces et les gains.</p>
<p>Le sens de la <strong>Mudârabah</strong> dans la législation islamique (<em>Shar'an</em>) est : le fait de confier un capital déterminé à une personne qui va commercer avec, en contrepartie d'une part fixée de son profit.</p>
<p>⁕ Ce type de transaction est autorisé par consensus (<em>Ijmâ'</em>). Il existait déjà à l'époque du Prophète <span dir="rtl">ﷺ</span> qui l'a approuvé. Cela a également été rapporté d'après 'Umar, 'Uthmân, 'Alî, Ibn Mas'ûd et d'autres encore, et aucun avis contraire ne leur est connu parmi les Compagnons — que Allah soit satisfait d'eux tous.</p>
<p>La sagesse implique la légitimité de la <em>Mudârabah</em> financière, car les gens en ont un réel besoin. En effet, les dirhams et les dinars ne fructifient pas sans être mis en circulation et investis dans le commerce.</p>
<p>L'éminent savant Ibn al-Qayyim a dit :</p>
<p>« <em>Le gestionnaire (Al-Mudârib) est à la fois un dépositaire de confiance (Amîn), un employé (Ajîr), un mandataire (Wakîl) et un associé (Sharîk). Il est un <strong>dépositaire de confiance</strong> lorsqu'il réceptionne le capital, un <strong>mandataire</strong> lorsqu'il en dispose [pour commercer], un <strong>employé</strong> pour le travail qu'il accomplit lui-même, et un <strong>associé</strong> dès lors que le profit se réalise. De plus, il est stipulé comme condition de validité de la Mudârabah que la part de gain du travailleur soit préalablement définie, car il n'y a droit que par cette clause contractuelle.</em> »</p>
<p>Et Ibn al-Mundhir a dit :</p>
<p>« <em>Les gens de science ont unanimement convenu que le travailleur est en droit de stipuler, à la charge du propriétaire du capital, le tiers du profit, sa moitié, ou toute autre proportion sur laquelle ils s'accordent, à condition que cette part soit connue sous forme de fraction déterminée (un pourcentage ou une quote-part). Dès lors, s'il lui attribuait la totalité du profit, ou une somme fixe en dirhams, ou encore une part inconnue, le contrat de Mudârabah deviendrait caduc (Fasadat).</em> » Fin de citation.</p>
<p>⁕ La détermination de la part de profit revenant au travailleur dépend de l'accord mutuel entre les deux parties. Ainsi, si le propriétaire du capital dit au travailleur : <em>« Commerces avec [ce capital] et le profit sera entre nous »</em>, chacun d'eux aura droit à la moitié du profit. En effet, le propriétaire a attribué le profit à eux deux de manière équivalente, sans donner de préférence à l'un par rapport à l'autre, ce qui implique par conséquent une égalité des droits. C'est exactement comme s'il avait dit : <em>« Cette maison est entre toi et moi »</em>, elle serait alors partagée entre eux deux par moitié.</p>
<p>Et si le propriétaire du capital dit au travailleur : <em>« Commerces avec et j'aurai les trois quarts de son profit, ou son tiers »</em>, ou s'il lui dit : <em>« Commerces avec et tu auras les trois quarts de son profit, ou son tiers »</em>, cela est tout à fait valable. Car dès lors que la part de l'un des deux est connue, il la prend, et le reste revient à l'autre. En effet, le profit leur revient de droit à tous deux ; par conséquent, dès lors que la part de l'un est définie, le reste revient nécessairement à l'autre par simple déduction logique du sens des termes employés.</p>
<p>En revanche, s'ils divergent sur la question de savoir à qui revient la fraction de profit stipulée [dans le contrat sans précision explicite], celle-ci revient au travailleur, qu'elle soit minime ou importante. La raison en est que le travailleur mérite sa part en contrepartie de son travail, et celle-ci peut être petite ou grande : on peut lui stipuler une petite part en raison de la facilité du travail, tout comme on peut lui stipuler une grande part en raison de sa difficulté. De même, cette estimation peut varier selon que le travailleur soit habile (expérimenté) ou non. Ainsi, la part du travailleur n'est déterminée que par la stipulation [du contrat], contrairement au propriétaire du capital qui, lui, mérite sa part de profit de droit en raison de son capital et non par une clause contractuelle.</p>
<p>⁕ Si la <em>Mudârabah</em> devient caduque (invalide), son profit revient [entièrement] au propriétaire du capital, car il s'agit de la fructification de son propre bien. Quant au travailleur, il a droit à un salaire équivalent à celui du marché (<em>Ujratu-l-mithl</em>). En effet, il ne méritait sa part de profit qu'en vertu de la clause stipulée dans le contrat, or cette clause est devenue caduque suite à l'invalidité de la <em>Mudârabah</em>.</p>
<p>⁕ Il est tout à fait valable que la <em>Mudârabah</em> soit temporaire, c'est-à-dire limitée à une période définie. Par exemple, que le propriétaire du capital dise : <em>« Je m'associe avec toi en Mudârabah avec ces dirhams pour une durée d'un an »</em>.</p>
<p>De même, il est valable que la <em>Mudârabah</em> soit suspendue à une condition future. Par exemple, que le détenteur des fonds dise : <em>« Lorsque viendra tel mois, commerce alors avec cet argent en Mudârabah »</em>, ou qu'il dise : <em>« Dès que je récupérerai mon argent auprès de Zayd, il sera à ta disposition en Mudârabah »</em>. La raison en est que la <em>Mudârabah</em> est une autorisation d'engager des transactions (une délégation de gestion) ; il est donc permis de la suspendre à une condition future.</p>
<p>⁕ Il n'est pas permis au travailleur d'accepter une [autre] <em>Mudârabah</em> de la part d'une tierce personne si cela porte préjudice au premier investisseur, sauf avec son autorisation. C'est le cas, par exemple, si le second capital est important au point d'absorber tout le temps du travailleur et de le détourner de la gestion commerciale du premier capital, ou si le capital du premier investisseur est déjà conséquent et occupe tout son temps. Dès lors que le travailleur s'en détourne au profit d'un autre, une partie des transactions liées à ce premier capital se retrouve paralysée. Cependant, si le premier investisseur donne son accord, ou s'il n'en résulte aucun préjudice pour lui, il est alors permis au travailleur de contracter une <em>Mudârabah</em> avec un autre.</p>
<p>En revanche, si le travailleur s'engage dans une <em>Mudârabah</em> avec un tiers au détriment du premier investisseur et sans son autorisation, le travailleur doit alors verser la part de profit qu'il a perçue de cette seconde affaire dans les comptes de sa société avec le premier investisseur. Ainsi, on attribue au propriétaire de la seconde <em>Mudârabah</em> sa part de profit légitime, tandis que la part qui devait revenir au travailleur est prélevée pour être intégrée aux bénéfices de la première <em>Mudârabah</em>. Ce montant est ensuite partagé entre le travailleur et le premier investisseur selon les proportions qu'ils avaient stipulées dans leur contrat. La raison en est que l'effort et le travail fournis par le travailleur dans la seconde <em>Mudârabah</em> revenaient de plein droit à la première <em>Mudârabah</em>.</p>
<p>⁕ Le travailleur ne doit rien dépenser du capital de la <em>Mudârabah</em>, que ce soit pour un voyage ou pour toute autre raison, à moins qu'il n'ait stipulé cette condition au propriétaire du capital. En effet, il travaille avec ce capital en contrepartie d'une part du profit ; il ne mérite donc aucun supplément au-delà de celle-ci sans condition préalable, sauf s'il existe un usage commercial établi (<em>'Âdah</em>) à ce sujet, auquel cas on s'y conforme.</p>
<p>⁕ Le profit de la <em>Mudârabah</em> ne doit pas être partagé avant le dénouement et la fin du contrat entre les deux parties, sauf s'ils y consentent mutuellement. La raison en est que le profit sert de protection (de bouclier) au capital, car on n'est jamais à l'abri d'une perte lors d'une transaction, perte qui serait alors compensée par le profit. Si le profit était partagé alors que le contrat de <em>Mudârabah</em> est toujours en cours, il ne resterait plus de réserve pour couvrir les pertes. Le profit est donc une protection pour le capital, et le travailleur n'a droit à rien de ce profit tant que l'intégralité du capital initial n'est pas préservée.</p>
<p>⁕ Le travailleur est un dépositaire de confiance (<em>Amîn</em>). Il lui incombe de craindre Allah dans les responsabilités qui lui ont été confiées. Sa parole est acceptée lorsqu'il affirme qu'il y a eu une perte ou une dégradation des biens. De même, il doit être cru lorsqu'il déclare avoir acheté une marchandise pour son propre compte et non pour la <em>Mudârabah</em>, ou inversement, lorsqu'il affirme l'avoir achetée pour la <em>Mudârabah</em> et non pour lui-même, car il a reçu une marque de confiance pour cela.</p>
<p>Et Allah est Le plus Savant.</p>
