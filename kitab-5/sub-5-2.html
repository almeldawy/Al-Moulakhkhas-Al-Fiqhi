<h3 id="بسم-الله-الرحمن-الرحيم"><span dir="rtl">بِسْمِ اللهِ الرَّحْمَنِ الرَّحِيمِ</span></h3>
<p><strong>Chapitre sur le pèlerinage et sur qui il est obligatoire</strong></p>
<p>⁕ Le pèlerinage est l'un des piliers de l'Islam et l'un de ses grands fondements. Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="ltr">﴿</span><strong><span dir="rtl">وَلِلَّهِ عَلَى النَّاسِ حِجُّ الْبَيْتِ مَنِ اسْتَطَاعَ إِلَيْهِ سَبِيلًا ۚ وَمَنْ كَفَرَ فَإِنَّ اللَّهَ غَنِيٌّ عَنِ الْعَالَمِينَ</span></strong><span dir="ltr">﴾</span></p>
<p>« <em><strong>Et c'est un devoir envers Allah pour les gens qui en ont les moyens d'aller faire le pèlerinage à la Maison. Et quiconque ne croit pas... Allah Se passe largement des mondes</strong></em> » (Al-Imran : 97).</p>
<p>Cela signifie qu'Allah a imposé aux gens le pèlerinage à la Maison comme une obligation, car l'emploi du terme « sur » (<strong><span dir="rtl">عَلَى</span></strong>) exprime l'obligation. Cette prescription est renforcée par la suite du verset : « <em><strong>Et quiconque ne croit pas...</strong></em> », où le Très-Haut qualifie celui qui le délaisse de mécréant. Ceci prouve l'obligation et l'importance capitale du pèlerinage ; ainsi, quiconque n'en reconnaît pas le caractère obligatoire est considéré comme mécréant selon le consensus (Ijmâ').</p>
<p>Allah a également dit à Son Ami intime (Ibrahim) :</p>
<p class="ar"><span dir="rtl">﴿وَأَذِّنْ فِي النَّاسِ بِالْحَجِّ﴾</span></p>
<p>« <em><strong>Et fais aux gens une annonce pour le pèlerinage</strong></em> » (Al-Hajj : 27).</p>
<p>At-Tirmidhi et d'autres ont rapporté, selon un récit attribué à 'Ali — qu'Allah l'agrée :</p>
<p class="ar"><span dir="ltr">«</span> <strong><span dir="rtl">مَنْ مَلَكَ زَادًا وَرَاحِلَةً تُبَلِّغُهُ إِلَى بَيْتِ اللَّهِ، وَلَمْ يَحُجَّ؛ فَلَا عَلَيْهِ أَنْ يَمُوتَ يَهُودِيًّا أَوْ نَصْرَانِيًّا</span></strong> <span dir="ltr">»</span></p>
<p>« <em><strong>Celui qui possède les provisions et une monture lui permettant d'atteindre la Maison d'Allah, mais qui n'accomplit pas le pèlerinage, peu importe qu'il meure juif ou chrétien</strong></em> ».<a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a></p>
<p>Le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="ltr">«</span> <span dir="rtl"><strong>بُنِيَ الْإِسْلَامُ عَلَى خَمْسٍ : شَهَادَةِ أَنْ لَا إِلَهَ إِلَّا اللَّهُ وَأَنَّ مُحَمَّدًا رَسُولُ اللَّهِ، وَإِقَامِ الصَّلَاةِ، وَإِيتَاءِ الزَّكَاةِ، وَصَوْمِ رَمَضَانَ، وَحَجِّ الْبَيْتِ مَنِ اسْتَطَاعَ إِلَيْهِ سَبِيلًا</strong></span> <span dir="ltr">»</span></p>
<p>« <em><strong>L'Islam est bâti sur cinq [piliers] : le témoignage qu'il n'y a de divinité digne d'adoration qu'Allah et que Muhammad est le Messager d'Allah, l'accomplissement de la prière, l'acquittement de la Zakat, le jeûne de Ramadan et le pèlerinage à la Maison pour celui qui en a les moyens</strong></em> ». <a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a></p>
<p>Par « <em><strong>moyens</strong></em> » (as-Sabil), on entend la possession des provisions et du moyen de transport permettant de se rendre à la Maison et d'en revenir auprès de sa famille.</p>
<p>⁕ Et la sagesse de la prescription du pèlerinage est telle qu'Allah l'a exposée dans Sa parole :</p>
<p class="ar"><span dir="ltr">﴿</span><strong><span dir="rtl">لِيَشْهَدُوا مَنَافِعَ لَهُمْ وَيَذْكُرُوا اسْمَ اللَّهِ فِي أَيَّامٍ مَعْلُومَاتٍ عَلَى مَا رَزَقَهُمْ مِنْ بَهِيمَةِ الْأَنْعَامِ ...</span></strong><span dir="rtl">﴾ إِلَى قَوْلِهِ : ﴿<strong>ثُمَّ لْيَقْضُوا تَفَثَهُمْ وَلْيُوفُوا نُذُورَهُمْ وَلْيَطَّوَّفُوا بِالْبَيْتِ الْعَتِيقِ</strong></span><span dir="ltr">﴾</span></p>
<p>« <em><strong>pour participer aux avantages qui leur ont été accordés et pour invoquer le nom d'Allah, aux jours fixés, sur la bête de cheptel qu'Il leur a attribuée...</strong></em> » jusqu'à Sa parole : « <em><strong>Puis qu'ils mettent fin à leurs interdits (nettoient leur crasse), qu'ils remplissent leurs vœux, et qu'ils fassent les circuits autour de l'Antique Maison</strong></em> » (Al-Hajj : 28 - 29).</p>
<p>L'utilité du pèlerinage revient donc aux serviteurs et ne revient pas à Allah le Très-Haut, car Il est :</p>
<p class="ar"><span dir="ltr">﴿</span><strong><span dir="rtl">غَنِيٌّ عَنِ الْعَالَمِينَ</span></strong><span dir="ltr">﴾</span></p>
<p></p>
<p>« <em><strong>Celui qui Se passe largement des mondes</strong></em> » (Al-Imran : 97).</p>
<p>Il n'a nul besoin des pèlerins comme une créature aurait besoin de celui qui la sollicite et l'honore ; au contraire, ce sont les serviteurs qui ont besoin de Lui، ils se rendent donc auprès de Lui en raison de leur propre besoin envers Lui.</p>
<p>⁕ Et la sagesse derrière le fait que l'obligation du Hajj (pèlerinage) ait été décrétée après celle de la prière, de la Zakat et du jeûne est que la prière est le pilier de la religion et qu'elle se répète cinq fois par jour et par nuit ، puis vient la Zakat car elle lui est associée dans de nombreux passages [du Coran] ، puis le jeûne car il se répète chaque année.</p>
<p>⁕ <strong>Le Hajj a été rendu obligatoire en Islam en l'an neuf de l'Hégire</strong>, selon l'avis de la majorité [des savants]. <strong>Le Prophète <span dir="rtl">ﷺ</span> n'a accompli qu'un seul pèlerinage, qui est le "Pèlerinage d'Adieu" (Hajjat al-Wada'), en l'an dix de l'Hégire. Et il <span dir="rtl">ﷺ</span> a accompli quatre 'Umras (petits pèlerinages)</strong>.</p>
<p>⁕ Le but du Hajj et de la 'Umra est l'adoration d'Allah dans les lieux où Allah a ordonné qu'Il soit adoré.</p>
<p>Le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="ltr">«</span><strong><span dir="rtl">إِنَّمَا جُعِلَ رَمْيُ الْجِمَارِ وَالسَّعْيُ بَيْنَ الصَّفَا وَالْمَرْوَةِ لِإِقَامَةِ ذِكْرِ اللهِ</span></strong><span dir="ltr">»</span></p>
<p>"<em><strong>La lapidation des stèles (Ramy al-Jimar) et la procession (as-Sa'y) entre as-Safa et al-Marwa n'ont été instituées que pour établir le rappel d'Allah.</strong></em>"<a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a></p>
<p>⁕ Le Hajj (pèlerinage) est une obligation selon le consensus des musulmans et l'un des piliers de l'Islam. C'est une obligation à accomplir une fois dans la vie pour celui qui en a la capacité, et c'est une obligation communautaire (<em>fard kifaya</em>) pour les musulmans chaque année. Tout pèlerinage effectué au-delà de l'obligation individuelle pour chaque musulman est considéré comme un acte surérogatoire (<em>tatawwu'</em>).</p>
<p>⁕ Quant à la 'Umra, elle est obligatoire selon l'avis de nombreux savants ، en raison de la parole du Prophète <span dir="rtl">ﷺ</span> lorsqu'il fut questionné :</p>
<p class="ar"><strong><span dir="rtl">هَلْ عَلَى النِّسَاءِ مِنْ جِهَادٍ؟ قَالَ: «نَعَمْ؛ عَلَيْهِنَّ جِهَادٌ لَا قِتَالَ فِيهِ: الْحَجُّ وَالْعُمْرَةُ»</span></strong></p>
<p>"<em><strong>Les femmes doivent-elles accomplir le Jihad ?" Il répondit : "Oui ، elles ont un Jihad dans lequel il n'y a point de combat : le Hajj et la 'Umra.</strong></em>" Rapporté par Ahmad et Ibn Majah avec une chaîne de transmission authentique. <a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a></p>
<p>Et s'il est prouvé que la 'Umra est obligatoire pour les femmes , elle l'est alors à plus forte raison pour les hommes. Le Prophète <span dir="rtl">ﷺ</span> a également dit à celui qui l'interrogeait en disant :</p>
<p class="ar"><strong><span dir="rtl">إِنَّ أَبِي شَيْخٌ كَبِيرٌ، لَا يَسْتَطِيعُ الْحَجَّ وَالْعُمْرَةَ وَلَا الظَّعَنَ؟ فَقَالَ: «حُجَّ عَنْ أَبِيكَ وَاعْتَمِرْ»</span></strong></p>
<p>"<em><strong>Mon père est un vieil homme qui ne peut ni accomplir le Hajj ، ni la 'Umra ، ni voyager ?" Il répondit : "Accomplis le Hajj et la 'Umra pour ton père.</strong></em>" Rapporté par les cinq et authentifié par at-Tirmidhi.<a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a></p>
<p>Ainsi ، le Hajj et la 'Umra sont obligatoires pour le musulman une seule fois dans sa vie ، en raison de la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="ltr">«</span><strong><span dir="rtl">الْحَجُّ مَرَّةً، فَمَنْ زَادَ؛ فَهُوَ تَطَوُّعٌ</span></strong><span dir="ltr">»</span></p>
<p><em><strong>"Le Hajj se fait une seule fois ; celui qui en rajoute [un second] ، cela est un acte surérogatoire.</strong></em>" Rapporté par Ahmad et d'autres.</p>
<p><a href="#fn6" class="footnote-ref" id="fnref6" role="doc-noteref"><sup>6</sup></a>Et dans le "Sahih Mouslim" et d'autres d'après Abou Hourayra <span dir="rtl">رضي الله عنه</span> ، selon une parole rapportée au Prophète :</p>
<p class="ar"><span dir="ltr">«</span><strong><span dir="rtl">أَيُّهَا النَّاسُ! قَدْ فُرِضَ عَلَيْكُمُ الْحَجُّ، فَحُجُّوا»، فَقَالَ رَجُلٌ: أَكُلَّ عَامٍ؟ فَقَالَ: «لَوْ قُلْتُ: نَعَمْ؛ لَوَجَبَتْ، وَلَمَا اسْتَطَعْتُمْ</span></strong><span dir="ltr">».</span></p>
<p>"<em><strong>Ô gens ! Le Hajj vous a été prescrit ، accomplissez donc le Hajj." Un homme demanda : "Est-ce chaque année ?" Il répondit : "Si je disais oui ، cela deviendrait obligatoire et vous ne pourriez l'accomplir.</strong></em>"<a href="#fn7" class="footnote-ref" id="fnref7" role="doc-noteref"><sup>7</sup></a></p>
<p>⁕ Il est obligatoire pour le musulman de s'empresser d'accomplir le Hajj obligatoire dès qu'il en a la possibilité. Il commet un péché s'il le retarde sans excuse valable.</p>
<p>Ceci est basé sur la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="ltr">«</span><strong><span dir="rtl">تَعَجَّلُوا إِلَى الحَجِّ (يَعْنِي: الفَرِيضَةَ)؛ فَإِنَّ أَحَدَكُمْ لَا يَدْرِي مَا يَعْرِضُ لَهُ</span></strong><span dir="ltr">»</span></p>
<p>« <em><strong>Pressez-vous d'accomplir le Hajj (c'est-à-dire l'obligation), car l'un de vous ne sait pas quel obstacle peut survenir</strong></em> » (Rapporté par Ahmad).<a href="#fn8" class="footnote-ref" id="fnref8" role="doc-noteref"><sup>8</sup></a></p>
<p>⁕ Le Hajj n'est obligatoire qu'à travers <strong>cinq conditions</strong> : <strong>l'Islam</strong>, <strong>la raison</strong>, <strong>la puberté</strong>, <strong>la liberté</strong> et <strong>la capacité (physique/financière)</strong>. Quiconque réunit ces conditions a l'obligation de s'empresser d'accomplir le Hajj.</p>
<p>⁕ L'accomplissement du Hajj et de la 'Umra par l'enfant est valide en tant qu'acte surérogatoire (<em>nafl</em>) ، conformément au hadith d'Ibn 'Abbas : une femme a présenté un enfant au Prophète <span dir="rtl">ﷺ</span> et a demandé :</p>
<p class="ar"><strong><span dir="rtl">أَلِهَذَا حَجٌّ؟ قَالَ: «نَعَمْ، وَلَكِ أَجْرٌ</span></strong><span dir="ltr">»</span></p>
<p>"<em><strong>Celui-ci peut-il accomplir le Hajj ?" Il répondit : "Oui , et tu en auras une récompense.</strong></em>" Rapporté par Mouslim. »<a href="#fn9" class="footnote-ref" id="fnref9" role="doc-noteref"><sup>9</sup></a></p>
<p>Les gens de science sont unanimes sur le fait que si l'enfant accomplit le Hajj avant d'avoir atteint la puberté , il devra tout de même l'accomplir [à nouveau] une fois pubère et s'il en a la capacité. Ce pèlerinage ne le dispense pas du Hajj obligatoire de l'Islam (Hajjat al-Islam) , et il en est de même pour sa 'Umra.</p>
<p>⁕ Si l'enfant n'a pas encore atteint l'âge de la distinction (<em>tamyîz</em>) ، son tuteur contracte l'état d'ihrâm en son nom en formulant l'intention pour lui. Il doit lui éviter les interdits de l'ihrâm ، effectuer le Tawâf et le Sa'y en le portant ، l'emmener avec lui à 'Arafah ، Mouzdalifah et Minâ ، et lancer les pierres aux stèles (<em>jamarât</em>) à sa place.</p>
<p>Si l'enfant a atteint l'âge de la distinction ، il formule lui-même l'intention de l'ihrâm avec la permission de son tuteur et accomplit les rites du Hajj dont il est capable. Ce qu'il est incapable de faire ، son tuteur le fait à sa place ، comme le lancer des stèles. Le Tawâf et le Sa'y sont effectués pour lui alors qu'il est monté ou porté s'il est incapable de marcher.</p>
<p>Tout ce que le petit enfant — qu'il soit doué de distinction ou non — est capable de faire par lui-même ، comme la station (<em>wuqûf</em>) et le passage de la nuit (<em>mabît</em>) ، il est tenu de le faire. Cela signifie qu'il n'est pas valide que cela soit fait à sa place car il n'y a pas de nécessité à cela. De plus ، il doit s'abstenir des mêmes interdits que l'adulte.</p>
<p>⁕ Celui qui est capable d'accomplir le Hajj est celui qui peut s'en acquitter physiquement et financièrement. Cela signifie qu'il doit être en mesure d'utiliser un moyen de transport, de supporter le voyage, et de posséder les moyens financiers suffisants pour couvrir ses frais de voyage aller-retour. Il doit également disposer de quoi subvenir aux besoins de ses enfants et de toutes les personnes dont il a la charge jusqu'à son retour. Ces conditions doivent impérativement être remplies après s'être acquitté de ses dettes et des droits d'autrui qu'il pourrait avoir à sa charge. Enfin, cela est conditionné par le fait que le chemin vers le Hajj soit sûr pour sa personne et pour ses biens.</p>
<p>⁕ S'il en a la capacité financière mais pas la capacité physique — par exemple s'il est très âgé ou atteint d'une maladie chronique dont on n'espère pas la guérison — il est alors tenu de mandater quelqu'un pour accomplir en son nom le Hajj et la 'Umra obligatoires de l'Islam ، et ce ، à partir de son pays ou du pays où il a acquis ses moyens financiers.</p>
<p>Ceci est basé sur ce qu'a rapporté Ibn 'Abbas <span dir="rtl">رضي الله عنهما</span> : une femme de la tribu de Khath'am a dit :</p>
<p class="ar"><strong><span dir="rtl">يَا رَسُولَ اللهِ! إِنَّ أَبِي أَدْرَكَتْهُ فَرِيضَةُ اللهِ فِي الْحَجِّ شَيْخاً كَبِيراً لَا يَسْتَطِيعُ أَنْ يَثْبُتَ عَلَى الرَّاحِلَةِ؛ أَفَأَحُجُّ عَنْهُ؟ قَالَ: «حُجِّي عَنْهُ</span></strong><span dir="ltr">»</span></p>
<p>"<em><strong>Ô Messager d'Allah ! L'obligation d'Allah concernant le Hajj a atteint mon père alors qu'il est un vieil homme qui ne peut se maintenir sur sa monture. Puis-je accomplir le Hajj pour lui ?" Il répondit : "Accomplis le Hajj pour lui.</strong></em>" (Rapporté par al-Boukhari et Mouslim).<a href="#fn10" class="footnote-ref" id="fnref10" role="doc-noteref"><sup>10</sup></a></p>
<p>⁕ Il est <strong>exigé</strong> de celui qui accomplit le <strong>Hajj pour autrui</strong> qu'il ait déjà effectué le pèlerinage obligatoire de l'Islam pour <strong>lui-même</strong>. Ceci est fondé sur le hadith d'Ibn 'Abbas <span dir="rtl">رضي الله عنهما</span> :</p>
<p class="ar"><strong><span dir="rtl">أَنَّهُ ﷺ سَمِعَ رَجُلًا يَقُولُ: لَبَّيْكَ عَن شُبْرُمَةَ، قَالَ: «حَجَجْتَ عَنْ نَفْسِكَ؟»، قَالَ: لَا، قَالَ: «حُجَّ عَنْ نَفْسِكَ»</span></strong></p>
<p><em><strong>le Prophète <span dir="rtl">ﷺ</span> entendit un homme dire : "Me voici, mon Dieu, [pour accomplir le Hajj] pour Shoubroumah." Il lui demanda : "As-tu déjà accompli le Hajj pour toi-même ?" L'homme répondit : "Non." Le Prophète <span dir="rtl">ﷺ</span> lui dit alors : "Accomplis d'abord le Hajj pour toi-même</strong></em>." Sa chaîne de transmission est jugée bonne (<em>jayyid</em>) et il a été authentifié par al-Bayhaqi.<a href="#fn11" class="footnote-ref" id="fnref11" role="doc-noteref"><sup>11</sup></a></p>
<p>⁕ On doit donner au mandataire (an-na'ib) la somme d'argent nécessaire pour couvrir ses frais de voyage aller et retour.</p>
<p>Il n'est pas permis de faire du Hajj une prestation de service rémunérée (location), ni de l'utiliser comme un moyen de gagner de l'argent.</p>
<p>L'intention du mandataire doit être d'aider son frère musulman, d'accomplir le pèlerinage à la Maison Sacrée d'Allah et de visiter ces lieux grandioses.</p>
<p>Ainsi, son Hajj doit être fait pour Allah et non pour des gains mondains ; s'il effectue le Hajj dans le seul but d'obtenir de l'argent, son Hajj n'est alors pas valide.</p>

<li id="fn4"><p>Rapporté par Ahmad (6/165), Ibn Majah (2901), Ibn Khuzaymah (3074), et son origine se trouve dans al-Boukhari (1861) avec la formulation : « Mais le meilleur et le plus beau des Jihad est le Hajj, un Hajj accepté (Mabrour) ».<a href="#fnref4" class="footnote-back" role="doc-backlink">↩︎</a></p></li>
<li id="fn5"><p>Rapporté par at-Tirmidhi (930) qui a dit : « [Hadith] bon et authentique (Hasan Sahih) », ainsi que par Abou Daoud (1810), an-Nasa'i (3617), Ibn Majah (2906) et Ahmad (4/10, 11). L'imam Ahmad a déclaré : « Je ne connais pas de hadith concernant l'obligation de la 'Umra qui soit meilleur ou plus authentique que celui-ci ». [Source :] Touhfat al-Mouhtaj (2/47), et Ibn Hibban l'a authentifié (7/57).<a href="#fnref5" class="footnote-back" role="doc-backlink">↩︎</a></p></li>
<li id="fn6"><p>Rapporté par Ahmad (1/255, 290), Abou Daoud (1721), Ibn Majah (2886) et al-Hakim (2/321), qui a précisé : « Authentique selon les conditions des deux Cheikhs [al-Boukhari et Mouslim] ».<a href="#fnref6" class="footnote-back" role="doc-backlink">↩︎</a></p></li>
<li id="fn7"><p>Rapporté par Mouslim (1337).<a href="#fnref7" class="footnote-back" role="doc-backlink">↩︎</a></p></li>
<li id="fn8"><p>Rapporté par Ahmad (1/313), Ibn Majah (2883) et Abou Daoud (1732).<a href="#fnref8" class="footnote-back" role="doc-backlink">↩︎</a></p></li>
<li id="fn9"><p>Rapporté par Mouslim (1336).<a href="#fnref9" class="footnote-back" role="doc-backlink">↩︎</a></p></li>
<li id="fn10"><p>Rapporté par al-Boukhari (1513) et Mouslim (1334).<a href="#fnref10" class="footnote-back" role="doc-backlink">↩︎</a></p></li>
<li id="fn11"><p>Rapporté par Abou Daoud (1181), Ibn Majah (2903) et al-Bayhaqi (4/336) qui a déclaré : « Sa chaîne de transmission est authentique ». Il a également été authentifié par Ibn al-Jaroud (499), Ibn Khuzaymah (3039), Ibn Hibban (3988) et ad-Diya (10/247/261). De même, il a été authentifié par Ibn Abd al-Barr (9/138) et Ibn al-Moullaqin dans « al-Touhfa » (2/135).<a href="#fnref11" class="footnote-back" role="doc-backlink">↩︎</a></p></li>
