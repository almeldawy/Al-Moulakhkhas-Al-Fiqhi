<p>⁕ Le premier des rites du Hajj est l'Ihram. Il consiste en l'intention d'entrer dans les rites. Il a été nommé ainsi car, par son intention, le musulman s'interdit ce qui lui était licite avant l'Ihram, comme le mariage, le parfum, la coupe des ongles, le rasage de la tête et certains types de vêtements.</p>
<p>Cheikh al-Islam Ibn Taymiyyah — qu'Allah lui fasse miséricorde — a dit : "<em>L'homme ne devient pas en état de sacralisation (muhrim) par la simple présence dans son cœur de l'objectif du Hajj et de son intention ؛ car cet objectif n'a cessé d'être dans le cœur depuis qu'il a quitté son pays. Il est plutôt indispensable qu'il y ait une parole ou un acte par lequel il devient muhrim</em>". Fin de citation <a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a></p>
<p>⁕ Et avant l'entrée en état de sacralisation (Ihram), il lui est recommandé d'accomplir certaines choses par lesquelles il accueille ce grand acte d'adoration, qui sont :</p>
<p><strong>Premièrement : Le lavage (Ghusl) de tout le corps.</strong> En effet, le Prophète <span dir="rtl">ﷺ</span> s'est lavé pour son entrée en Ihram <a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a> ; et parce que cela est plus complet et plus efficace pour le nettoyage et l'élimination des odeurs. Le lavage lors de l'Ihram est requis, même pour la femme en état de menstrues (haid) ou de lochies (nifas).</p>
<p>Car le Prophète <span dir="rtl">ﷺ</span> a ordonné à Asma bint 'Umays, alors qu'elle était en période de lochies, de se laver (rapporté par Muslim) <a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a>. Il <span dir="rtl">ﷺ</span> a également ordonné à 'Aïcha de se laver pour l'entrée en Ihram du Hajj alors qu'elle avait ses règles. La sagesse derrière ce lavage réside dans la propreté, l'élimination des mauvaises odeurs et l'allègement de l'état d'impureté rituelle (hadath) pour la femme réglée ou accouchée.</p>
<p><strong>Deuxièmement :</strong> Il est recommandé à celui qui veut entrer en état de sacralisation (Ihram) de se nettoyer ; en retirant ce qu'il est légiféré de retirer parmi les poils ؛ comme les poils de la moustache, des aisselles et du pubis ; selon ce qu'il est nécessaire de retirer.</p>
<p>Ceci afin qu'il n'ait pas besoin de le faire durant son état d'Ihram alors qu'il ne pourra plus le faire. Si toutefois il n'a pas besoin de retirer quoi que ce soit de cela, il ne le fait pas ; car cela ne se fait qu'en cas de besoin. Cela ne fait pas partie des caractéristiques propres à l'Ihram (en soi), mais c'est une pratique légiférée en fonction du besoin</p>
<p><strong>Troisièmement :</strong> Il est recommandé à celui qui veut entrer en état de sacralisation de se parfumer le corps avec ce qui est disponible comme types de parfums ؛ tels que le musc, l'encens, l'eau de rose ou le bois de oud. Ceci en raison de la parole de 'Aïcha — qu'Allah l'agrée — : "Je parfumais le Messager d'Allah <span dir="rtl">ﷺ</span> pour son entrée en sacralisation avant qu'il ne soit en état d'Ihram, et pour sa désacralisation avant qu'il ne fasse les circuits (Tawaf) autour de la Maison" <a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a>.</p>
<p>Cheikh al-Islam Ibn Taymiyyah — qu'Allah lui fasse miséricorde — a dit : "<em>Si celui qui va entrer en Ihram souhaite se parfumer le corps, alors c'est une bonne chose. Cependant, on n'ordonne pas à celui qui va entrer en Ihram de le faire ؛ car le Prophète <span dir="rtl">ﷺ</span> l'a certes fait, mais il ne l'a pas ordonné aux gens</em>" <a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a>.</p>
<p><strong>Quatrièmement :</strong> Il est recommandé à l'homme, avant l'entrée en état de sacralisation, de <strong>se dépouiller de tout vêtement cousu (al-makhît)</strong>. Cela désigne tout ce qui est cousu à la mesure du membre qu'il couvre ou d'une partie de celui-ci ؛ comme la chemise ou le pantalon. En effet, le Prophète <span dir="rtl">ﷺ</span> s'est dépouillé de ses vêtements pour son entrée en sacralisation (Ihlâl). Il remplace alors les vêtements cousus par un pagne (Izâr) et un manteau (Ridâ') tous deux blancs et propres. Il est toutefois permis de porter d'autres couleurs que le blanc, parmi ce que les hommes ont l'habitude de porter.</p>
<p>La sagesse derrière cela est qu'il s'éloigne du luxe et qu'il revête l'apparence de celui qui est recueilli et humble. C'est aussi pour qu'il se rappelle à chaque instant qu'il est en état d'Ihram, afin qu'il évite les interdits de la sacralisation ؛ et pour qu'il se rappelle la mort, le port du linceul, ainsi que la Résurrection et le Rassemblement... ainsi que d'autres sagesses encore.</p>
<p>⁕ Se dépouiller des vêtements cousus <strong>avant</strong> l'intention de l'état de sacralisation (Ihrâm) est une <strong>tradition prophétique (Sunna)</strong> ; quant à le faire <strong>après</strong> l'intention de l'état de sacralisation, c'est une <strong>obligation (Wâjib)</strong>.</p>
<p>⁕ Et s'il formule l'intention de l'état de sacralisation (Ihrâm) alors qu'il porte ses vêtements cousus, son état de sacralisation est <strong>valide</strong>, mais il a l'<strong>obligation</strong> d'enlever les vêtements cousus.</p>
<p>⁕ Lorsqu'il a accompli ces actes, il s'est alors préparé pour l'état de sacralisation (l'Ihrâm). Le fait d'accomplir ces choses ne constitue pas en soi l'entrée en état d'Ihrâm, contrairement à ce que pensent beaucoup de gens du commun. En effet, l'Ihrâm est l'intention d'entrer et de débuter les rites. Ainsi, on ne devient pas "Muhrim" (en état de sacralisation) par le simple fait de se dépouiller des vêtements cousus et de revêtir les habits de l'Ihrâm sans avoir l'intention d'entrer dans les rites ; ceci conformément à la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">"إِنَّمَا الْأَعْمَالُ بِالنِّيَّاتِ"</span></p>
<p>"<em><strong>Certes, les actions ne valent que par les intentions</strong></em>"<a href="#fn6" class="footnote-ref" id="fnref6" role="doc-noteref"><sup>6</sup></a>.</p>
<p>⁕ Quant à la prière avant l'entrée en état de sacralisation (l'Ihrâm), l'avis le plus correct est qu'il n'existe pas de prière spécifique à l'Ihrâm. Cependant, si cela coïncide avec l'heure d'une prière obligatoire, il entre en état d'Ihrâm après celle-ci, car le Prophète <span dir="rtl">ﷺ</span> a formulé la Talbiya (débuté l'Ihrâm) à l'issue de la prière. D'après Anas, il [le Prophète] a prié le Dhouhr puis est monté sur sa monture <a href="#fn7" class="footnote-ref" id="fnref7" role="doc-noteref"><sup>7</sup></a>. »</p>
<p>L'illustre savant Ibn al-Qayyim (qu'Allah lui fasse miséricorde) a dit : "<em>Il n'a pas été rapporté de lui <span dir="rtl">ﷺ</span> qu'il ait prié deux unités de prière (rak'atayn) spécifiquement pour l'Ihrâm, en dehors de la prière obligatoire du Dhouhr</em>" <a href="#fn8" class="footnote-ref" id="fnref8" role="doc-noteref"><sup>8</sup></a>.</p>
<p>⁕ <strong>Et il y a ici une mise en garde nécessaire :</strong> c’est que beaucoup de pèlerins pensent qu’il est indispensable que l’entrée en état de sacralisation (l’Ihrâm) se fasse depuis la mosquée bâtie au point de passage (Mîqât). On les voit alors s’y précipiter, hommes et femmes, s’y bousculer, et parfois même y retirer leurs vêtements pour revêtir les habits de l’Ihrâm. Or, cela n’a aucun fondement.</p>
<p>Ce qui est demandé au musulman, c’est d’entrer en état d’Ihrâm depuis le Mîqât, en n’importe quel endroit de celui-ci, et non dans un lieu précis. Il doit plutôt entrer en état d'sacralisation là où cela lui est facilité, là où c’est le plus commode pour lui et ses compagnons, et là où il est le mieux à l’abri des regards et de la cohue.</p>
<p>Ces mosquées situées aux points de passage n’existaient pas à l’époque du Prophète <span dir="rtl">ﷺ</span> et n’ont pas été construites pour qu’on y débute l’Ihrâm. Elles ont seulement été édifiées pour que ceux qui résident aux alentours puissent y accomplir la prière. Voilà ce que nous souhaitions souligner. Et c'est d'Allah que vient le succès.</p>
<p>⁕ Il a le choix d'entrer en état de sacralisation (Ihrâm) pour l'un des trois rites qu'il souhaite, à savoir : le Tamattou‘, le Qirân et l'Ifrâd :</p>
<p>- Le (Tamattou‘) consiste à entrer en état de sacralisation pour la ‘Omra durant les mois du Hajj, à s'en acquitter totalement, puis à entrer de nouveau en état de sacralisation pour le Hajj la même année.</p>
<p>- L' (Ifrâd) consiste à entrer en état de sacralisation uniquement pour le Hajj depuis le Miqât, et à rester en état de sacralisation jusqu'à l'accomplissement des rites du Hajj.</p>
<p>- Le (Qirân) consiste à entrer en état de sacralisation pour la ‘Omra et le Hajj simultanément, ou à entrer en état de sacralisation pour la ‘Omra puis d'y inclure le Hajj avant de commencer le Tawâf de celle-ci. Il formule ainsi l'intention de la ‘Omra et du Hajj depuis le Miqât ou avant de débuter le Tawâf de la ‘Omra, et il effectue un seul Tawâf et un seul Sa‘y pour les deux.</p>
<p>Le pèlerin effectuant le Tamattou‘ ou le Qirân est redevable d'une offrande (Fidya), à condition qu'il ne soit pas résident de la zone de la Mosquée Sacrée.</p>
<p>Le meilleur de ces trois rites est le Tamattou‘, et ce, en vertu de nombreuses preuves.</p>
<p>⁕ Une fois qu'il est entré en état de sacralisation (Ihrâm) pour l'un de ces rites, il doit prononcer la Talbiya immédiatement après sa sacralisation en disant :</p>
<p class="ar"><span dir="rtl">لَبَّيْكَ اللَّهُمَّ لَبَّيْكَ، لَبَّيْكَ لَا شَرِيكَ لَكَ لَبَّيْكَ، إِنَّ الْحَمْدَ وَالنِّعْمَةَ لَكَ وَالْمُلْكَ، لَا شَرِيكَ لَكَ</span></p>
<p>« Me voici, Ô Allah, me voici. Me voici, Tu n'as aucun associé, me voici. Certes, la louange, la grâce et la royauté T'appartiennent, Tu n'as aucun associé ».</p>
<p>Il doit multiplier cette formule et élever la voix en la prononçant.</p>
