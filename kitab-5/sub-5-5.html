<p>⁕ Al-Mawâqît : pluriel de Mîqât.</p>
<p><strong>Linguistiquement</strong>, cela signifie : la limite.</p>
<p><strong>Religieusement</strong>, c'est le lieu de l'acte d'adoration ou son moment déterminé.</p>
<p>⁕ Le Hajj possède des moments fixés (temporels) et des lieux fixés (spatiaux) :</p>
<p>‣ <em><strong>Les moments temporels</strong></em> ont été mentionnés par Allah dans Sa parole :</p>
<p class="ar"><span dir="ltr">﴿</span><strong><span dir="rtl">الْحَجُّ أَشْهُرٌ مَّعْلُومَاتٌ فَمَن فَرَضَ فِيهِنَّ الْحَجَّ فَلَا رَفَثَ وَلَا فُسُوقَ وَلَا جِدَالَ فِي الْحَجِّ</span></strong><span dir="rtl">﴾ [البقرة : ١٩٧]</span></p>
<p>« <em><strong>Le Pèlerinage a lieu en des mois connus. Si l'on se décide à l'accomplir, alors point de rapports charnels, point de perversité, point de querelle pendant le Pèlerinage</strong></em> » [Al-Baqarah : 197].</p>
<p>Ces mois sont : <strong>Shawwâl, Dhul-Qi'dah et les dix premiers jours de Dhul-Hijjah</strong>. C’est-à-dire que celui qui entre en état de sacralisation (Ihrâm) pour le Hajj durant ces mois se doit d'éviter tout ce qui pourrait nuire à son pèlerinage parmi les paroles et les actes blâmables ، de s'occuper par des œuvres de bien et de s'attacher à la piété.</p>
<p>‣ <em><strong>Quant aux lieux fixés (spatiaux)</strong></em> , ce sont les limites que le pèlerin n'a pas le droit de franchir vers La Mecque sans être en état de sacralisation (Ihrâm). Le Messager d'Allah <span dir="rtl">ﷺ</span> les a clarifiées ، comme cela figure dans le hadith d'Ibn 'Abbâs (qu'Allah l'agrée) qui a dit :</p>
<p class="ar"><span dir="rtl">« وَقَّتَ رَسُولُ اللهِ ﷺ لِأَهْلِ المَدِينَةِ ذَا الحُلَيْفَةِ ، وَلِأَهْلِ الشَّامِ الجُحْفَةَ ، وَلِأَهْلِ نَجْدٍ قَرْنَ المَنَازِلِ ، وَلِأَهْلِ اليَمَنِ يَلَمْلَمَ ، وَقَالَ : هُنَّ لَهُنَّ وَلِمَنْ أَتَى عَلَيْهِنَّ مِنْ غَيْرِ أَهْلِهِنَّ مِمَّنْ أَرَادَ الحَجَّ أَوِ العُمْرَةَ ، وَمَنْ كَانَ دُونَ ذَلِكَ ؛ فَمِنْ حَيْثُ أَنْشَأَ ، حَتَّى أَهْلُ مَكَّةَ مِنْ مَكَّةَ »</span></p>
<p>« <em><strong>Le Messager d'Allah <span dir="rtl">ﷺ</span> a fixé comme lieu pour les gens de Médine "Dhul-Hulayfah" ، pour les gens du Shâm "Al-Juhfah" ، pour les gens du Najd "Qarn Al-Manâzil" et pour les gens du Yémen "Yalamlam". Il a dit : "Ces lieux sont pour leurs habitants ainsi que pour ceux qui y passent sans en être originaires parmi ceux qui veulent accomplir le Hajj ou l'Omra. Quant à celui qui réside en deçà de ces limites ، alors son point de départ est son lieu de résidence ، jusqu'aux habitants de La Mecque qui débutent de La Mecque"</strong></em> » (Rapporté par Al-Bukhârî et Muslim)<a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a>.</p>
<p>Et dans la version de Muslim d'après le hadith de Jâbir :</p>
<p class="ar"><span dir="ltr">«</span> <strong><span dir="rtl">وَمُهَلُّ أَهْلِ العِرَاقِ ذَاتُ عِرْقٍ</span></strong> <span dir="ltr">»</span></p>
<p>« <em><strong>Et le lieu d'entrée en Ihrâm pour les gens de l'Irak est "Dhât 'Irq</strong></em>" ».<a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a></p>
<p>Et la sagesse derrière cela est que, puisque la Maison Sacrée d'Allah est magnifiée et honorée ، Allah lui a assigné un <strong>rempart (une forteresse)</strong> qui est La Mecque ، un domaine protégé qui est le <em>Haram</em> (territoire sacré) ، et le <em>Haram</em> possède lui-même un sanctuaire qui sont les <em>Mawâqît</em> (points de passage fixés) qu'il n'est pas permis de franchir pour s'y rendre sans être en état de sacralisation (Ihram) ، ceci afin de magnifier la Maison Sacrée d'Allah.</p>
<p>Le plus éloigné de ces points de passage est <strong>Dhul-Hulayfah</strong> ، le point des gens de Médine ; entre celui-ci et La Mecque ، il y a une marche de dix jours. Le point des gens du Shâm (Levant), d'Égypte et du Maghreb est <strong>Al-Juhfah</strong> ، situé près de Râbigh ; il y a entre lui et La Mecque trois étapes (<em>marâhil</em>) et certains savants disent plus que cela. Le point des gens du Yémen est <strong>Yalamlam</strong> ، situé à deux étapes de La Mecque. Le point des gens du Najd est <strong>Qarn Al-Manâzil</strong> ، connu aujourd'hui sous le nom d'As-Sayl ، situé à deux étapes de La Mecque. Enfin, le point des gens d'Irak et des gens de l'Orient est <strong>Dhât 'Irq</strong> ، situé à deux étapes de La Mecque.</p>
<p>⁕ Ainsi, c'est à partir de ces points de passage (Mawâqît) que leurs habitants mentionnés entrent en état de sacralisation (Ihrâm) ; et c'est aussi de là que doit entrer en Ihrâm quiconque y passe sans en être originaire, dès lors qu'il a l'intention d'accomplir le Hajj ou l'Omra.</p>
<p>⁕ Quant à celui qui a sa demeure en deçà de ces points de passage fixés (<em>Mawâqît</em>), il entre en état de sacralisation (<em>Ihram</em>) depuis son domicile pour le Hajj comme pour l'Omra. De même, les habitants de La Mecque qui accomplissent le Hajj entrent en état de sacralisation depuis La Mecque même ; ils n'ont ainsi pas besoin de sortir vers un point de passage pour y débuter leur <em>Ihram</em> pour le Hajj. En revanche, pour l'Omra, ils doivent sortir pour entrer en état de sacralisation depuis l'endroit licite le plus proche (<em>Adna al-Hill</em>).</p>
<p>⁕ Quiconque ne passe pas par l'un de ces points de passage (Mawâqît) sur son chemin doit entrer en état de sacralisation (Ihrâm) dès qu'il sait qu'il arrive à la hauteur du point le plus proche de lui.</p>
<p>'Umar (qu'Allah l'agrée) a dit à ce sujet :</p>
<p class="ar"><span dir="ltr">«</span><strong><span dir="rtl">انْظُرُوا إِلى حَذْوِها مِن طَرِيقِكُم</span></strong><span dir="ltr">»</span></p>
<p>« <em><strong>Regardez l'endroit qui se trouve à leur hauteur sur votre chemin</strong></em> », rapporté par Al-Bukhârî.<a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a></p>
<p>⁕ Il en va de même pour celui qui voyage en avion ; il doit entrer en état de sacralisation (<em>Ihram</em>) lorsqu'il arrive à la hauteur de l'un de ces points de passage (<em>Mawâqît</em>) depuis les airs. Il convient donc qu'il se prépare en faisant ses grandes ablutions (<em>Ghusl</em>) et en se purifiant avant de monter dans l'avion. Une fois à la hauteur du point de passage, il formule l'intention de l'Ihram et prononce la <em>Talbiyah</em> en plein vol. Il ne lui est pas permis de retarder l'Ihram jusqu'à l'atterrissage à l'aéroport de Djeddah pour n'entrer en Ihram qu'à Djeddah ou à Bahrah, comme le font certains pèlerins. En effet, Djeddah n'est pas un point de passage (<em>Miqât</em>) ni un lieu d'entrée en Ihram, sauf pour ses propres habitants ou pour celui qui a formulé l'intention du Hajj ou de l'Omra depuis cette ville. Ainsi, quiconque parmi les autres pèlerins entre en Ihram depuis Djeddah a délaissé une obligation, à savoir l'entrée en Ihram depuis le <em>Miqât</em>, et doit par conséquent s'acquitter d'une compensation (<em>Fidyah</em>).</p>
<p>C'est une erreur dans laquelle tombent beaucoup de gens, et il est obligatoire d'attirer l'attention sur ce point. Certains pensent que le grand lavage est indispensable pour l'Ihram et disent : « Je ne peux pas me laver dans l'avion, ni faire ceci ou cela... ». Or, il est impératif que ces personnes sachent que l'Ihram signifie l'intention d'entrer dans les rites tout en évitant les interdits de l'Ihram selon ses capacités. Le lavage, le parfum et autres ne sont que des actes recommandés (<em>Sunan</em>). Le musulman peut les accomplir avant de monter dans l'avion ; et s'il entre en Ihram sans les avoir faits, il n'y a aucun mal. Il doit donc formuler l'intention et prononcer la <em>Talbiyah</em> tout en étant assis sur son siège dans l'avion lorsqu'il arrive à la hauteur du <em>Miqât</em> ou un peu avant. On peut savoir cela en interrogeant le personnel de bord, ou par recherche et estimation. En agissant ainsi, il aura fait ce qui est en son pouvoir. Cependant, s'il fait preuve de négligence et ne s'en soucie pas, il commet une erreur et délaisse une obligation sans excuse, ce qui diminue la valeur de son Hajj ou de son Omra.</p>
<p>⁕ Quiconque franchit le point de passage (<em>Miqât</em>) sans être en état de sacralisation (<em>Ihram</em>) a l'obligation d'y retourner pour y débuter son <em>Ihram</em>. Cela est dû au fait qu'il s'agit d'une obligation qu'il est encore possible de rattraper ; il n'est donc pas permis de la délaisser. Si la personne ne retourne pas au <em>Miqât</em> et entre en <em>Ihram</em> en deçà de celui-ci (depuis Djeddah ou ailleurs), elle est alors redevable d'une compensation (<em>Fidyah</em>). Cette compensation consiste à sacrifier un ovin (mouton ou chèvre), ou à prendre un septième d'un camélidé (<em>Badanah</em>) ou d'une vache. La viande doit être distribuée aux nécessiteux du Sanctuaire (<em>Al-Haram</em>), et le pèlerin ne doit rien en consommer lui-même.</p>
<p>Le musulman se doit d'accorder une grande importance aux affaires de sa religion en accomplissant chaque acte d'adoration selon la manière prescrite. À ce titre, l'entrée en <em>Ihram</em> pour le Hajj et l'Omra doit impérativement s'effectuer depuis le lieu désigné par le Messager d'Allah <span dir="rtl">ﷺ</span>. Le musulman doit s'y conformer strictement et ne pas franchir ces limites sans être en état d'acralisation.</p>
