<p>⁕ Le Hajj est obligatoire pour tout musulman, qu'il soit un homme ou une femme. Cependant, pour qu'il soit obligatoire pour la femme, il est stipulé — en plus des conditions précédemment mentionnées — la présence d'un Mahram (un garant légal) voyageant avec elle pour l'accomplir ; car il ne lui est pas permis de voyager pour le Hajj, ni pour tout autre motif, sans un Mahram.</p>
<p>En raison de la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">« لَا تُسَافِرُ المَرْأَةُ إِلَّا مَعَ مَحْرَمٍ، وَلَا يَدْخُلُ عَلَيْهَا رَجُلٌ إِلَّا وَمَعَهَا مَحْرَمٌ »</span></p>
<p>« <em><strong>La femme ne doit voyager qu'avec un Mahram, et aucun homme ne doit entrer chez elle sans qu'elle ne soit accompagnée d'un Mahram.</strong></em> », rapporté par Ahmad avec une chaîne de transmission authentique (Sahîh).<a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a></p>
<p>Un homme a dit au Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«إِنِّي أُرِيدُ أَنْ أَخْرُجَ فِي جَيْشِ كَذَا، وَامْرَأَتِي تُرِيدُ الْحَجَّ؟» فَقَالَ: «اخْرُجْ مَعَهَا»، وَفِي «الصَّحِيحَيْنِ»: «إِنَّ امْرَأَتِي خَرَجَتْ حَاجَّةً، وَإِنِّي اكْتُتِبْتُ فِي غَزْوَةِ كَذَا؟» قَالَ: «انْطَلِقْ فَحُجَّ مَعَ امْرَأَتِكَ».</span></p>
<p><em><strong>« Je souhaite partir avec telle armée, mais ma femme veut accomplir le Hajj ? ». Il répondit : « Pars avec elle ». Et dans les deux recueils authentiques (Al-Bukhari et Muslim) : « Ma femme est partie pour le pèlerinage alors que je me suis inscrit pour telle bataille ? ». Il dit : « Va et accomplis le Hajj avec ta femme »</strong></em>.<a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a></p>
<p>Et dans le "Sahîh" et d'autres sources :</p>
<p class="ar"><span dir="rtl">«لَا يَحِلُّ لِامْرَأَةٍ تُسَافِرُ مَسِيرَةَ يَوْمٍ وَلَيْلَةٍ لَيْسَ مَعَهَا مَحْرَمٌ».</span></p>
<p>« <em><strong>Il n'est pas permis à une femme de voyager la distance d'un jour et d'une nuit sans être accompagnée d'un Mahram</strong></em> ».<a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a></p>
<p>Voici donc un ensemble de textes du Messager d'Allah <span dir="rtl">ﷺ</span> qui interdisent à la femme de voyager sans un Mahram qui l'accompagne, que le voyage soit pour le Hajj ou pour autre chose. <strong>Cela a pour but de fermer la porte (prévenir) à toute corruption ou tentation, qu'elle en soit la cause ou qu'elle la subisse.</strong></p>
<p>L'Imam Ahmad (qu'Allah lui fasse miséricorde) a dit :</p>
<p>« <em>Le Mahram fait partie de la "capacité de voyager" (as-sabîl). Par conséquent, celle qui n'a pas de Mahram n'est pas tenue d'accomplir le Hajj par elle-même, ni par l'intermédiaire d'un délégué.</em> »<a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a></p>
<p>⁕ Le <strong>Mahram</strong> d'une femme est : son mari, ou toute personne à qui le mariage avec elle est interdit de manière permanente en raison de la parenté. Cela inclut par exemple :</p>
<ul>
<li><blockquote>
<p>Son frère.</p>
</blockquote></li>
<li><blockquote>
<p>Son père.</p>
</blockquote></li>
<li><blockquote>
<p>Son oncle paternel.</p>
</blockquote></li>
<li><blockquote>
<p>Le fils de son frère (son neveu).</p>
</blockquote></li>
<li><blockquote>
<p>Son oncle maternel.</p>
</blockquote></li>
</ul>
<p>Sont également inclus ceux dont l'interdiction de mariage provient d'une cause légale, comme :</p>
<ul>
<li><blockquote>
<p>Un frère de lait.</p>
</blockquote></li>
<li><blockquote>
<p>Par alliance, comme le mari de sa mère (son beau-père) ou le fils de son mari (son beau-fils).</p>
</blockquote></li>
</ul>
<p>Ceci est basé sur ce qui est rapporté dans le <strong>« Sahîh Muslim »</strong> :</p>
<p class="ar"><span dir="rtl">«لَا يَحِلُّ لِامْرَأَةٍ تُؤْمِنُ بِاللَّهِ أَنْ تُسَافِرَ إِلَّا وَمَعَهَا أَبُوهَا أَوِ ابْنُهَا أَوْ زَوْجُهَا أَوْ أَخُوهَا أَوْ ذُو مَحْرَمٍ مِنْهَا»</span></p>
<p>« <em><strong>Il n'est pas permis à une femme qui croit en Allah de voyager sans être accompagnée de son père, de son fils, de son mari, de son frère ou d'un de ses Mahrams</strong></em> ».<a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a></p>
<p>⁕ Les dépenses de son Mahram durant le voyage sont à sa charge. Il est donc une condition pour que le Hajj lui soit obligatoire qu'elle possède de quoi subvenir à ses propres besoins ainsi qu'à ceux de son Mahram pour le trajet aller et retour.</p>
<p>⁕ Celle qui avait trouvé un Mahram mais qui a négligé d'accomplir le Hajj en retardant son départ jusqu'à perdre ce Mahram, tout en ayant les capacités financières nécessaires :</p>
<ul>
<li><blockquote>
<p>Elle doit attendre d'en trouver un nouveau.</p>
</blockquote></li>
<li><blockquote>
<p>Si elle désespère d'en trouver un, elle doit alors mandater quelqu'un (une tierce personne) pour accomplir le Hajj en son nom.</p>
</blockquote></li>
</ul>
<p>⁕ Celui pour qui le Hajj est devenu obligatoire mais qui décède avant de l'avoir accompli, on doit prélever de sa succession, sur le capital principal, le montant suffisant pour le pèlerinage, et mandater une personne pour l'accomplir en son nom.</p>
<p>Cela s'appuie sur ce qu'a rapporté Al-Bukhari d'après Ibn 'Abbas : <em><strong>une femme a dit : « Ô Messager d'Allah, ma mère avait fait le vœu d'accomplir le Hajj mais elle est morte avant de le faire ; puis-je l'accomplir pour elle ? ». Il répondit : « Oui, accomplis le Hajj pour elle. Vois-tu, si ta mère avait une dette, ne l'aurais-tu pas remboursée ? Remboursez Allah, car Allah mérite plus que quiconque que l'on s'acquitte de ce qui Lui est dû</strong></em> ».<a href="#fn6" class="footnote-ref" id="fnref6" role="doc-noteref"><sup>6</sup></a></p>
<p>Ce hadith démontre que si une personne meurt en ayant le Hajj à sa charge, il incombe à son tuteur (héritier) de l'accomplir pour elle ou de financer quelqu'un pour le faire à partir du capital des biens du défunt, tout comme le tuteur doit rembourser ses dettes.</p>
<p>Les savants sont d'ailleurs unanimes sur le fait que la dette humaine est remboursée sur le capital principal ; il en va de même pour ce qui y est assimilé (le Hajj) concernant son acquittement.</p>
<p>Dans un autre hadith, il est dit : « <em><strong>Ma sœur a fait le vœu d'accomplir le Hajj</strong></em> »<a href="#fn7" class="footnote-ref" id="fnref7" role="doc-noteref"><sup>7</sup></a>, et dans les <em>Sunan</em> de Ad-Daraqutni : « <em><strong>Mon père est mort alors qu'il devait accomplir le Hajj de l'Islam (obligatoire)</strong></em> »<a href="#fn8" class="footnote-ref" id="fnref8" role="doc-noteref"><sup>8</sup></a>. L'évidence qui en ressort est qu'il n'y a aucune différence entre ce qui est obligatoire par l'essence de la Législation (le Hajj obligatoire) et ce qui est devenu obligatoire par un engagement personnel (le vœu), que le défunt l'ait stipulé dans son testament ou non.</p>
<p>⁕ Le pèlerinage accompli pour autrui est comptabilisé pour la personne représentée comme si elle l'avait accompli elle-même. Celui qui l'exécute agit en tant que mandataire. Le remplaçant (le délégué) doit formuler l'intention de l'état de sacralisation (<em>Ihram</em>) au nom de la personne et prononcer la <em>Talbiya</em> en son nom. Il suffit qu'il ait l'intention d'accomplir le rite pour elle, même s'il ne mentionne pas son nom explicitement. S'il ignore le nom ou la lignée de la personne, il prononce la <em>Talbiya</em> au nom de celui qui lui a remis l'argent pour accomplir ce Hajj.</p>
<p>⁕ Il est recommandé au musulman d'accomplir le Hajj pour ses parents s'ils sont décédés ou s'ils sont vivants mais incapables de l'accomplir eux-mêmes. Dans ce cas, il doit donner la priorité à sa mère, car elle est la plus digne de piété filiale.</p>
