<p>⁕ Après le Tawâf al-Ifâdah le jour de l'Aïd, il [le pèlerin] retourne à Minâ et doit obligatoirement y passer la nuit , en raison du hadith d'Ibn 'Abbâs qui a dit : « <em><strong>Le Messager d'Allah <span dir="rtl">ﷺ</span> n'a autorisé personne à passer la nuit à La Mecque , sauf à al-'Abbâs en raison de sa fonction consistant à fournir de l'eau [aux pèlerins]</strong></em> » , rapporté par Ibn Mâjah. <a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a></p>
<p>Il passe donc trois nuits à Minâ s'il n'est pas pressé de partir [at-ta'ajjul] , et s'il est pressé , il y passe deux nuits : la nuit du onzième jour et la nuit du douzième jour.</p>
<p>⁕ Et il y accomplit les prières en les <strong>raccourcissant</strong> (qasr) sans les <strong>regrouper</strong> (jam‘) ; au contraire, chaque prière doit être faite en son temps.</p>
<p>⁕ Et il [le pèlerin] lance les pierres sur les trois stèles (al-Jamarât) chaque jour parmi les jours d'at-Tashrîq après le déclin du soleil (az-Zawâl) , ceci en raison du hadith de Jâbir (qu'Allah l'agrée) qui a dit : "<em><strong>Le Messager d'Allah <span dir="rtl">ﷺ</span> a lapidé la stèle le jour du Sacrifice (le 10ème jour) en début de matinée (Duhâ) , quant aux jours suivants , il le faisait une fois que le soleil avait décliné</strong></em>" , rapporté par le Groupe (al-Jamâ'ah).<a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a></p>
<p>Et Ibn 'Umar a dit : "<em><strong>Nous guettions le moment précis , et lorsque le soleil déclinait , nous procédions à la lapidation</strong></em>" , rapporté par al-Bukhârî et Aboû Dâwoûd.<a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a></p>
<p>Et sa parole : "<em><strong>Nous guettions</strong></em>" (natahayyanu) signifie : nous surveillions le moment requis.</p>
<p>Et cela conformément à la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="ltr">«</span> <strong><span dir="rtl">لِتَأْخُذُوا عَنِّي مَنَاسِكَكُمْ</span></strong> <span dir="ltr">»</span></p>
<p>"<em><strong>Prenez de moi vos rites de pèlerinage</strong></em>".<a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a></p>
<p>⁕ Ainsi , le moment pour effectuer la lapidation le onzième jour et les jours suivants débute après le déclin du soleil (az-Zawâl) , et l'accomplir avant cela n'est pas valable [ne suffit pas] , en raison de ces hadiths.</p>
<p>En effet ، le Prophète <span dir="rtl">ﷺ</span> en a fixé le moment ainsi par son action ، et il a dit : "<em><strong>Prenez de moi vos rites de pèlerinage</strong></em>"<a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a>. Tout comme la prière n'est pas autorisée avant son heure , la lapidation n'est pas autorisée avant son heure , et ce , parce que les actes d'adoration sont "Tawqîfiyyah" (fondés strictement sur les textes religieux).</p>
<p><strong>L'Imam, le grand savant Ibn al-Qayyim (qu'Allah lui fasse miséricorde) a dit</strong> <a href="#fn6" class="footnote-ref" id="fnref6" role="doc-noteref"><sup>6</sup></a><strong>, en décrivant la lapidation du Prophète <span dir="rtl">ﷺ</span> telle qu'elle est rapportée dans la Sunna purifiée :</strong></p>
<p>« <em>Puis, le Prophète <span dir="rtl">ﷺ</span> retourna à Minâ après le [Tawâf] al-Ifâdah le jour même , il y passa la nuit. Au matin, il attendit le déclin du soleil (az-Zawâl). Lorsque le soleil déclina , il se rendit à pied de sa demeure vers les stèles (al-Jamarât) sans utiliser de monture. Il commença par la première stèle , celle qui suit la mosquée d'al-Khayf , et la lapida avec sept cailloux , l'un après l'autre , en disant à chaque lancer : "Allâhu Akbar" (Allah est le plus Grand). Ensuite , il s'avança devant la stèle jusqu'à atteindre un terrain plat , se tint debout face à la Qibla , leva les mains et fit une longue invocation d'une durée équivalente à la lecture de la sourate Al-Baqarah. Puis , il se rendit à la stèle médiane (al-Wustâ) et la lapida de la même manière. Ensuite , il descendit vers la gauche du côté de la vallée , s'arrêta face à la Qibla en levant les mains. Il se plaça au cœur de la vallée , faisant face à la stèle [de profil] , plaçant la Maison (la Kaaba) à sa gauche et Minâ à sa droite , et il la lapida également de sept cailloux...</em> »</p>
<p><strong>Jusqu'à ce qu'il dise :</strong></p>
<p>« <em>Lorsqu'il eut terminé la lapidation , il s'en retourna immédiatement sans s'arrêter près d'elle (c'est-à-dire la stèle d'al-'Aqabah). Il a été dit que c'était à cause de l'étroitesse du lieu due à la montagne , et il a été dit — ce qui est plus exact — que son invocation se faisait au cœur même de l'acte d'adoration avant d'en avoir terminé. Or , lorsqu'il a lapidé la stèle d'al-'Aqabah , l'acte de lapidation était achevé. L'invocation au sein même de l'adoration avant de la finir est préférable à celle faite après l'avoir terminée. C'est ainsi qu'était sa Sunna pour l'invocation durant la prière ؛ puisqu'il invoquait en son sein même.</em> » Fin de citation.</p>
<p>⁕ Il est impératif de respecter l'ordre des stèles (Jamarât) de la manière suivante : il commence par la première stèle , qui est celle située à Minâ près de la mosquée d'al-Khayf , puis la stèle médiane (al-Wustâ) , qui est celle qui suit la première ، puis la grande stèle ، appelée "Jamrat al-'Aqabah" , qui est la dernière du côté de La Mecque.</p>
<p>Il lapide chaque stèle avec sept cailloux successifs , en levant la main à chaque lancer et en disant "Allâhu Akbar" (Allah est le plus Grand). Il est impératif que chaque caillou tombe dans le bassin , qu'il y reste ou qu'il en ressorte [tombe en dehors] après cela. En revanche , si le caillou ne tombe pas [du tout] dans le bassin , le lancer n'est pas valable.</p>
<p>⁕ Il est permis au malade, à la personne âgée, à la femme enceinte ou à celle pour qui l'on craint les conséquences d'une bousculade intense sur le chemin ou au moment de la lapidation ; il est permis à ces personnes de mandater (déléguer) quelq'un pour lapider à leur place.</p>
<p>⁕ Le mandataire (celui qui remplace) lapide chaque stèle pour son mandant (celui qu'il remplace) en un seul et même endroit. Il n'est pas tenu de terminer toute la série des stèles pour lui-même avant de recommencer la série pour son mandant ; ceci en raison de la difficulté et de la gêne que cela représenterait durant les jours de grande affluence. Et Allah est plus savant.</p>
<p>Cependant , si le mandataire est lui-même en train d'accomplir son pèlerinage obligatoire , il doit impérativement lapider chaque stèle pour lui-même <strong>en premier</strong> , puis la lapider ensuite pour son mandant [avant de passer à la stèle suivante].</p>
<p>⁕ Ensuite , après avoir lapidé les trois stèles le douzième jour , s'il le souhaite ، il peut se hâter [de partir] et quitter Minâ avant le coucher du soleil. Et s'il le souhaite , il peut prolonger son séjour [en restant une nuit de plus] , y passer la nuit et lapider les trois stèles après le déclin du soleil (az-Zawâl) le treizième jour. Cette dernière option est préférable ، conformément à la parole du Très-Haut :</p>
<p class="ar"><span dir="ltr">﴿</span><strong><span dir="rtl">فَمَن تَعَجَّلَ فِي يَوْمَيْنِ فَلَا إِثْمَ عَلَيْهِ وَمَن تَأَخَّرَ فَلَا إِثْمَ عَلَيْهِ لِمَنِ اتَّقَىٰ</span></strong><span dir="rtl">﴾ [البَقَرَة : ٢٠٣]</span></p>
<p><strong>« <em>Quiconque se hâte de partir en deux jours ، ne commet pas de péché. Et quiconque retarde son départ ne commet pas de péché non plus ، pour celui qui est pieux.</em> »</strong> [Sourate Al-Baqarah : 203].</p>
<p>⁕ Et si le soleil se couche alors qu'il [le pèlerin] n'a pas encore quitté Minâ , il est alors dans l'obligation de prolonger son séjour , d'y passer la nuit et d'effectuer la lapidation le treizième jour.</p>
<p>Car Allah le Très-Haut dit :</p>
<p class="ar"><span dir="ltr">﴿</span><strong><span dir="rtl">فَمَن تَعَجَّلَ فِي يَوْمَيْنِ</span></strong><span dir="ltr">﴾</span></p>
<p><strong>« <em>Quiconque se hâte de partir en deux jours</em> »</strong></p>
<p>or le terme "<em><strong>jour</strong></em>" (yawm) désigne la période diurne [le jour par opposition à la nuit]. Ainsi , celui qui est rattrapé par la nuit ne s'est pas hâté de partir en deux jours.</p>
<p>⁕ Si la femme a ses menstrues ou ses lochies avant d'entrer en état d'Ihram puis qu'elle formule son intention ، ou si elle entre en état d'Ihram alors qu'elle est pure puis que les menstrues ou les lochies surviennent alors qu'elle est déjà en état d'Ihram ؛ elle doit rester dans son état d'Ihram. Elle accomplit alors ce que le pèlerin accomplit , comme la station à 'Arafat , la nuitée à Muzdalifah , la lapidation des stèles et la nuitée à Minâ. Cependant , elle ne doit ni effectuer le Tawâf autour de la Maison (la Kaaba) , ni effectuer le Sa'y entre as-Safâ et al-Marwah ، jusqu'à ce qu'elle soit purifiée de ses menstrues ou de ses lochies.</p>
<p>⁕ Cependant , si l'on suppose qu'elle a effectué le Tawâf en étant en état de pureté ، puis que ses menstrues surviennent après le Tawâf , alors elle peut accomplir le Sa'y entre as-Safâ et al-Marwah. Les menstrues ne l'en empêchent pas , car la pureté n'est pas une condition [de validité] pour le Sa'y.</p>
<p>⁕ Lorsque le pèlerin souhaite quitter La Mecque pour retourner dans son pays ou ailleurs, il ne doit pas partir avant d'avoir effectué sept tours autour de la Demeure (la Ka'bah)، une fois qu'il a terminé toutes ses affaires et qu'il ne lui reste plus qu'à monter en monture pour le voyage؛ ceci afin que son dernier acte soit lié à la Demeure. Cependant, la femme en état de menstrues est exemptée de cette obligation, elle peut donc voyager sans effectuer l'adieu.</p>
<p>Cela est conforme à ce qui a été rapporté d'après <strong>Ibn 'Abbâs</strong> (qu'Allah l'agrée, lui et son père) qui a dit : « <em><strong>Il a été ordonné aux gens que leur dernier acte soit lié à la Demeure، sauf qu'une dispense a été accordée à la femme en état de menstrues.</strong></em> » (Rapporté par Al-Bukhârî et Muslim).<a href="#fn7" class="footnote-ref" id="fnref7" role="doc-noteref"><sup>7</sup></a></p>
<p>Dans une autre version de lui، il a dit : « <em><strong>Les gens partaient dans toutes les directions. Le Prophète <span dir="rtl">ﷺ</span> a alors dit : "Que personne ne parte avant que son dernier acte ne soit lié à la Demeure."</strong></em> » (Rapporté par Ahmad, Muslim, Abû Dâwûd et Ibn Mâjah).<a href="#fn8" class="footnote-ref" id="fnref8" role="doc-noteref"><sup>8</sup></a></p>
<p>D'après <strong>Ibn 'Abbâs</strong> encore : « <em><strong>Le Prophète <span dir="rtl">ﷺ</span> a autorisé la femme menstruée à partir avant de circumambuler autour de la Demeure, à condition qu'elle ait déjà effectué le Tawâf al-Ifâdah.</strong></em> » (Rapporté par Ahmad).<a href="#fn9" class="footnote-ref" id="fnref9" role="doc-noteref"><sup>9</sup></a></p>
<p>D'après <strong>'Âïshah</strong> (qu'Allah l'agrée) qui a dit : « <em><strong>Safiyyah bint Huyay a eu ses menstrues après avoir effectué le Tawâf al-Ifâdah. J'ai mentionné cela au Messager d'Allah <span dir="rtl">ﷺ</span> qui a demandé : "Va-t-elle nous retarder ?" J'ai répondu : "Ô Messager d'Allah ! Elle a déjà accompli l'Ifâdah et tourné autour de la Demeure, puis ses menstrues sont arrivées après l'Ifâdah." Il a alors dit : "Qu'elle parte donc."</strong></em> » (Rapporté par Al-Bukhârî et Muslim).<a href="#fn10" class="footnote-ref" id="fnref10" role="doc-noteref"><sup>10</sup></a></p>
