<p>⁕ Certes, les rites (types de pèlerinage) pour lesquels le voyageur entre en état de sacralisation (Ihrâm) lorsqu'il arrive au point de rencontre (Mîqât) sont au nombre de trois:</p>
<p><strong>L’Ifrâd :</strong> Cela consiste à formuler l’intention de l’entrée en Ihrâm pour le Hajj uniquement. Le pèlerin reste en état de sacralisation jusqu'à ce qu'il lance les pierres à la Stèle (Jamrah) le jour de l'Aïd, qu'il se rase la tête, qu'il effectue le Tawâf de déferlement (Al-Ifâdah) et qu'il accomplisse le Sa’y entre As-Safâ et Al-Marwah, s'il ne l'a pas déjà fait après le Tawâf d’arrivée (Al-Qudoûm).</p>
<p><strong>Le Qirân :</strong> Cela consiste à formuler l’intention de l’entrée en Ihrâm pour la 'Omra et le Hajj simultanément depuis le Mîqât. Ses actes sont identiques à ceux de celui qui pratique l’Ifrâd, à la différence qu'il a l'obligation d'offrir un sacrifice (Hady) comme pour le Tamattu'.</p>
<p><strong>Le Tamattu' :</strong> Cela consiste à entrer en Ihrâm pour la 'Omra depuis le Mîqât, puis à s'en désacraliser une fois arrivé à la Mecque en accomplissant ses rites (le Tawâf, le Sa’y et le rasage ou la coupe des cheveux). Ensuite, il quitte son état d’Ihrâm et reste en état de désacralisation jusqu’à ce qu'il entre en Ihrâm pour le Hajj.</p>
<p>Le meilleur de ces rites est le Tamattu'. Il est donc recommandé à celui qui est entré en Ihrâm sous la forme de l’Ifrâd ou du Qirân, et qui n'a pas emmené avec lui d'animal pour le sacrifice, de changer son rite pour celui du Tamattu' et d'agir comme le pèlerin en mode Tamattu'.</p>
<p>⁕ Il est recommandé pour celui qui pratique le Tamattu', ou pour celui qui pratiquait l’Ifrâd ou le Qirân et s'est transformé en Tamattu' (en se désacralisant de sa 'Omra), ainsi que pour tous les autres résidents de la Mecque ou de ses environs qui ne sont pas en état de sacralisation : d’entrer en état d’Ihrâm pour le Hajj le jour de At-Tarwiya, qui est le huitième jour du mois de Dhul-Hijja.</p>
<p>Ceci est basé sur la parole de Jâbir (qu'Allah l'agrée) décrivant le pèlerinage du Prophète <span dir="rtl">ﷺ</span> : « <em><strong>Tous les gens se sont alors désacralisés et ont coupé leurs cheveux, à l'exception du Prophète <span dir="rtl">ﷺ</span> et de ceux qui avaient avec eux une bête de sacrifice (Hady). Puis, quand vint le jour de At-Tarwiya, ils se dirigèrent vers Mina et formulèrent leur intention (Talbiya) pour le Hajj</strong></em> » <a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a>.</p>
<p>⁕ Le pèlerin entre en état d'Ihram pour le Hajj depuis l'endroit où il réside, que ce soit à l'intérieur de la Mecque, à l'extérieur de celle-ci, ou à Mina. Une fois en état d'Ihram, il ne se rend pas à la Maison (la Kaaba) pour y effectuer un Tawaf.</p>
<p>Cheikh al-Islam Ibn Taymiyya (qu'Allah lui fasse miséricorde) a dit <a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a>: « <em>Lorsque vient le jour de At-Tarwiya, il entre en état d'Ihram et procède comme il l'a fait au point de rencontre (Mîqât). S'il le souhaite, il entre en Ihram depuis la Mecque, et s'il le souhaite, depuis l'extérieur de la Mecque. C'est cela l'avis correct. Les compagnons du Prophète <span dir="rtl">ﷺ</span> sont entrés en Ihram, comme le Prophète <span dir="rtl">ﷺ</span> le leur avait ordonné, depuis Al-Batha. La Sunna est d'entrer en Ihram depuis l'endroit où l'on réside. De même, l'habitant de la Mecque entre en Ihram depuis sa demeure, conformément à la parole du Prophète <span dir="rtl">ﷺ</span> : <strong>"Celui dont la demeure est en deçà de la Mecque, son lieu d'entrée en Ihram est sa propre demeure, jusqu'aux habitants de la Mecque qui entrent en Ihram depuis la Mecque</strong>".</em><a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a> » Fin de citation.</p>
<p>Ibn al-Qayyim (qu'Allah lui fasse miséricorde) a dit : « <em>Le jeudi en milieu de matinée (Dhouha), il (c'est-à-dire le Prophète <span dir="rtl">ﷺ</span>) se dirigea avec les musulmans qui l'accompagnaient vers Mina. Ceux qui s'étaient désacralisés entrèrent alors en Ihram pour le Hajj depuis leurs campements. Ils ne sont pas entrés dans la Mosquée pour y commencer leur Ihram, mais ils sont entrés en Ihram en laissant la Mecque derrière leur dos.</em> » Fin de citation.<a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a></p>
<p>⁕ Après être entré en état d’Ihram, le pèlerin s'occupe de la Talbiya. Il la prononce au moment même de la sacralisation, puis continue de la réciter par intervalles par la suite. Il doit élever la voix en récitant la Talbiya, et ce, jusqu'à ce qu'il lance les pierres à la Stèle d’al-’Aqaba (Jamrat al-’Aqaba) le jour de l’Aïd.</p>
<p>⁕ Ensuite, celui qui se trouve à la Mecque en état d'Ihram se rend à Mina le jour de At-Tarwiya. Le mieux est qu'il s'y rende avant le zénith (Az-Zawâl). Il y prie alors le Dhohr ainsi que les autres prières suivantes jusqu'au Fajr, et il y passe la nuit précédant le neuvième jour. Ceci est basé sur la parole de Jâbir (qu'Allah l'agrée) : « <em><strong>Le Prophète <span dir="rtl">ﷺ</span> monta sa monture [c'est-à-dire vers Mina], il y pria le Dhohr, l'Asr, le Maghrib, l'Icha et le Fajr. Puis, il y resta un court instant jusqu'au lever du soleil</strong></em> » <a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a>. Tout cela n'est pas une obligation (Wâjib) mais une Sunna. De même, l'entrée en Ihram spécifiquement le jour de At-Tarwiya n'est pas obligatoire : si le pèlerin entre en Ihram pour le Hajj avant ou après ce jour, cela est permis.</p>
<p>Le fait de passer la nuit à Mina la veille du neuvième jour (de Dhul-Hijja), ainsi que d'y accomplir les cinq prières quotidiennes, relèvent de la Sunna (tradition prophétique recommandable). Ceci n'est pas une obligation (Wâjib).</p>
<p>⁕ Ensuite, les pèlerins se dirigent au matin du neuvième jour, après le lever du soleil, de Mina vers Arafat. Arafat tout entier est un lieu de stationnement, à l'exception de la vallée d'Urana (Batn 'Urana) <a href="#fn6" class="footnote-ref" id="fnref6" role="doc-noteref"><sup>6</sup></a>. Quel que soit l'endroit où le pèlerin stationne parmi les esplanades d'Arafat, son stationnement est valide, sauf dans ce que le Prophète <span dir="rtl">ﷺ</span> a exclu, à savoir la vallée d'Urana. Les limites d'Arafat ont été explicitées par des panneaux et des inscriptions qui distinguent Arafat de ce qui l'entoure. Ainsi, quiconque se trouve à l'intérieur des limites indiquées est considéré à Arafat. Celui qui se trouve à l'extérieur de ces limites risque de ne pas être considéré comme étant à Arafat. Le pèlerin doit donc s'en assurer et identifier ces limites afin de confirmer sa présence effective à Arafat.</p>
<p>⁕ Lorsque le soleil décline (au zénith), ils prient le Dhohr et l'Asr en les raccourcissant (Qasr) et en les regroupant (Jam'), avec un seul appel à la prière (Adhân) et deux appels imminents (Iqâma). De même, la prière de quatre unités (Rak'ahs) est raccourcie à Arafat, à Muzdalifa et à Mina. Cependant, à Arafat et à Muzdalifa, on regroupe et on raccourcit les prières. À Mina, on raccourcit les prières mais on ne les regroupe pas ; au contraire, on prie chaque prière à son heure respective, car il n'y a pas de nécessité de les regrouper.</p>
<p>⁕ Ensuite, après que les pèlerins ont accompli les prières du Dhohr et de l'Asr en les raccourcissant (Qasr) et en les regroupant par anticipation (Jam' Taqdim) dès le début de l'heure du Dhohr ; Ils se consacrent entièrement à l'invocation (Dou'a), à la supplication et à l'imploration d'Allah le Très-Haut, tout en restant dans leurs campements à Arafat. Il ne leur est pas obligatoire de se rendre au Mont de la Miséricorde (Jabal ar-Rahmah), ni de le voir ou de l'observer. Ils ne doivent pas non plus faire face à la montagne lors de leurs invocations ; ils doivent au contraire faire face à la Noble Kaaba.</p>
<p>Il convient de s'efforcer dans l'invocation, la supplication et le repentir en ce lieu grandiose (Arafat), et d'y persévérer.</p>
<p>Peu importe que l'on invoque en étant sur une monture, en marchant, debout, assis ou allongé, quel que soit l'état dans lequel on se trouve.</p>
<p>Il est préférable de choisir les invocations rapportées (de la Sunna) et les formules concises et complètes.</p>
<p>Ceci en raison de la parole du Prophète <span dir="rtl">ﷺ</span> : « La meilleure des invocations est celle du jour d'Arafat. Et la meilleure parole que j'ai prononcée, ainsi que les prophètes avant moi, est :</p>
<p class="ar"><span dir="ltr">«</span><strong><span dir="rtl">أَفْضَلُ الدُّعَاءِ دُعَاءُ يَوْمِ عَرَفَةَ، وَأَفْضَلُ مَا قُلْتُ أَنَا وَالنَّبِيُّونَ مِن قَبْلِي : لَا إِلَهَ إِلَّا اللهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ المُلْكُ، وَلَهُ الحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ</span></strong><span dir="ltr">»</span></p>
<p>"<em><strong>Nul ne mérite d'être adoré en dehors d'Allah, Seul, sans associé. À Lui appartient la royauté et à Lui appartient la louange, et Il est Capable de toute chose</strong></em>" » <a href="#fn7" class="footnote-ref" id="fnref7" role="doc-noteref"><sup>7</sup></a>.</p>
<p>⁕ Le pèlerin doit continuer à rester à Arafat et à invoquer jusqu'au coucher du soleil.</p>
<p>Il ne lui est pas permis d'en partir avant le coucher du soleil. S'il en part avant le coucher du soleil, il a l'obligation d'y retourner afin d'y rester jusqu'au crépuscule.</p>
<p>S'il n'y retourne pas, il est alors redevable d'un sacrifice de sang (Damm) pour avoir délaissé une obligation. Ce sacrifice consiste à égorger une brebis (ou un mouton) dont la viande sera distribuée aux nécessiteux du Sanctuaire (Al-Haram), ou bien un septième de vache, ou encore un septième de chamelle.</p>
<p>⁕ Le temps du stationnement à Arafat commence au déclin du soleil (zénith) le jour d'Arafat, selon l'avis authentique. Il se poursuit jusqu'à l'aube de la nuit du dixième jour (de Dhul-Hijja). Quiconque stationne durant la journée a l'obligation de rester jusqu'au coucher du soleil. Quant à celui qui stationne durant la nuit, cela est suffisant pour lui, ne serait-ce qu'un instant. Ceci conformément à la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="ltr">«</span><strong><span dir="rtl">مَنْ أَدْرَكَ عَرَفَاتٍ بِلَيْلٍ؛ فَقَدْ أَدْرَكَ الحَجَّ</span></strong><span dir="ltr">»</span></p>
<p>« <em><strong>Quiconque atteint Arafat de nuit a certes accompli le Hajj</strong></em> » <a href="#fn8" class="footnote-ref" id="fnref8" role="doc-noteref"><sup>8</sup></a>.</p>
<p>⁕ Le statut juridique (Hukm) du stationnement à Arafat est qu'il constitue un pilier parmi les piliers du Hajj. C'est même le pilier le plus important du Hajj, conformément à la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><strong><span dir="rtl">«الحَجُّ عَرَفَةُ»</span></strong></p>
<p>« <em><strong>Le Hajj, c'est Arafat</strong></em> » <a href="#fn9" class="footnote-ref" id="fnref9" role="doc-noteref"><sup>9</sup></a>.</p>
<p>Le lieu du stationnement est Arafat dans toute son étendue délimitée. Par conséquent, quiconque stationne en dehors de ses limites, son stationnement n'est pas valide.</p>
<p>Qu'Allah nous accorde à tous la réussite dans les actes et les paroles qu'Il aime et agréé. Certes, Il est Celui qui entend tout et qui exauce les prières.</p>
