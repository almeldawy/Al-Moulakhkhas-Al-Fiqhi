<p>⁕ <strong>L'offrande (Al-Hady) :</strong> C'est ce qui est offert au Sanctuaire (le Haram) et qui y est sacrifié, qu'il s'agisse de bétail ou autre. Elle a été nommée ainsi car elle est offerte à Allah <span dir="rtl">ﷻ</span>.</p>
<p><strong>Le sacrifice (Al-Oudhiyah) — avec le son "ou" ou "i" sur la lettre Hamza (Al-Oudhiyah ou Al-Idhiyah) :</strong> C'est ce qui est sacrifié au sein des foyers le jour de l'Aïd ainsi que durant les jours de <em>Tachrîq</em> (les trois jours suivant l'Aïd), afin de se rapprocher d'Allah.</p>
<p>⁕ Les musulmans font l'unanimité (consensus) sur la légitimité de ces deux pratiques (le <em>Hady</em> et l'<em>Oudhiyah</em>).</p>
<p>L'éminent savant Ibn al-Qayyim a dit : "<em>L'offrande (sacrificielle) pour le Créateur tient lieu de rançon pour l'âme qui mérite la perte (la mort).</em></p>
<p><em>Et Allah le Très-Haut a dit :</em></p>
<p class="ar"><em><span dir="rtl">﴿وَلِكُلِّ أُمَّةٍ جَعَلْنَا مَنْسَكًا لِيَذْكُرُوا اسْمَ اللَّهِ عَلَى مَا رَزَقَهُمْ مِنْ بَهِيمَةِ الْأَنْعَامِ﴾ [الحج: ٣٤]</span></em></p>
<p><em>{À chaque communauté, Nous avons assigné un rite sacrificiel afin qu'ils prononcent le nom d'Allah sur ce qu'Il leur a octroyé comme bétail} [Al-Hajj : 34].</em></p>
<p><em>Ainsi, l'égorgement rituel et le fait de faire couler le sang au nom d'Allah n'ont cessé d'être légiférés dans toutes les religions (révélées)</em>". Fin de citation.</p>
<p>⁕ La meilleure des offrandes (Hady) est le chameau, puis la vache — à condition qu'ils soient offerts en entier — en raison de leur coût élevé et de leur plus grande utilité pour les pauvres. Viennent ensuite les ovins (moutons/chèvres).</p>
<p>⁕ Et le meilleur au sein de chaque espèce est celui qui est le plus charnu (le plus gras), puis celui qui a la plus grande valeur marchande (le plus cher) ; ceci conformément à la parole du Très-Haut :</p>
<p class="ar"><span dir="ltr">﴿</span><strong><span dir="rtl">وَمَن يُعَظِّمْ شَعَائِرَ اللَّهِ فَإِنَّهَا مِن تَقْوَى الْقُلُوبِ</span></strong><span dir="rtl">﴾ [الحج : ٣٢]</span></p>
<p>{<em><strong>Et quiconque exalte les rites sacrés d'Allah, cela provient de la piété des cœurs</strong></em>} [Al-Hajj : 32].</p>
<p>⁕ <strong>Ne sont valables pour le sacrifice que :</strong></p>
<ul>
<li><blockquote>
<p><strong>Le <em>Jadha’</em> parmi les ovins (moutons) :</strong> c’est celui qui a atteint l’âge de <strong>six mois</strong>.</p>
</blockquote></li>
<li><blockquote>
<p><strong>Le <em>Thaniyy</em> pour les autres espèces (chameaux, bovins et chèvres) :</strong></p>
</blockquote>
<ul>
<li><blockquote>
<p><strong>Pour les chameaux :</strong> celui qui a atteint l’âge de <strong>cinq ans</strong>.</p>
</blockquote></li>
<li><blockquote>
<p><strong>Pour les bovins (vaches/bœufs) :</strong> celui qui a atteint l’âge de <strong>deux ans</strong>.</p>
</blockquote></li>
<li><blockquote>
<p><strong>Pour les chèvres :</strong> celle qui a atteint l’âge d’<strong>un an</strong>.</p>
</blockquote></li>
</ul></li>
</ul>
<p>⁕ <strong>Une brebis (ou un mouton) suffit, dans le cadre de l'offrande (<em>Al-Hady</em>), pour une seule personne. Quant au sacrifice de l'Aïd (<em>Al-Oudhiyah</em>), elle suffit pour un homme ainsi que pour les membres de son foyer.</strong></p>
<p><strong>Le chameau et la vache suffisent, tant pour l'offrande que pour le sacrifice de l'Aïd, pour sept personnes.</strong> Ceci conformément à la parole de Jâbir (qu'Allah l'agrée) : <em>"<strong>Le Messager d'Allah <span dir="rtl">ﷺ</span> nous a ordonné de nous associer pour les chameaux et les vaches, à raison d'un animal pour chaque groupe de sept d'entre nous.</strong>"</em> (Rapporté par Muslim).<a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a></p>
<p>Abû Ayyûb (qu'Allah l'agrée) a dit : <em>"<strong>À l'époque du Messager d'Allah <span dir="rtl">ﷺ</span>, l'homme sacrifiait une brebis pour lui-même et pour les membres de son foyer ; ils en mangeaient et en donnaient à manger.</strong>"</em> (Rapporté par Abû Dâwûd, Ibn Mâjah et At-Tirmidhî qui l'a authentifié).<a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a></p>
<p><strong>Et le sacrifice d'une brebis (entière) est meilleur que de prendre une part d'un septième (<em>soubou'</em>) d'un chameau ou d'une vache.</strong></p>
<p><strong>⁕ Ne sont valables, pour l'offrande (<em>Al-Hady</em>) et le sacrifice (<em>Al-Oudhiyah</em>), que les animaux exempts de maladie, de mutilation (manque d'un membre) ou de maigreur extrême.</strong></p>
<p>Ainsi, <strong>ne sont pas valables :</strong></p>
<ul>
<li><blockquote>
<p>L'animal borgne dont le défaut est manifeste, ni l'animal aveugle.</p>
</blockquote></li>
<li><blockquote>
<p>L'animal chétif (<em>Al-'Ajfâ</em>) : c'est l'animal si maigre qu'il n'a plus de moelle dans les os.</p>
</blockquote></li>
<li><blockquote>
<p>L'animal boiteux qui n'est pas capable de suivre la cadence des animaux sains lors de la marche.</p>
</blockquote></li>
<li><blockquote>
<p>L'animal édenté (<em>Al-Hatmâ</em>) qui a perdu ses incisives à la racine.</p>
</blockquote></li>
<li><blockquote>
<p>L'animal dont les mamelles sont taries (<em>Al-Jaddâ</em>) et ne produisent plus de lait à cause de son âge avancé.</p>
</blockquote></li>
<li><blockquote>
<p>L'animal malade dont la maladie est apparente.</p>
</blockquote></li>
</ul>
<p>Ceci en raison du hadith d'Al-Barâ ibn 'Âzib (qu'Allah l'agrée) qui a dit : "Le Messager d'Allah <span dir="rtl">ﷺ</span> s'est levé parmi nous et a dit : « <em><strong>Quatre (types d'animaux) ne sont pas permis pour le sacrifice : l'animal borgne dont le défaut est manifeste, l'animal malade dont la maladie est apparente, l'animal boiteux dont la boiterie est évidente, et l'animal chétif qui n'a plus de moelle.</strong></em> »" (Rapporté par Abû Dâwûd et An-Nassâ'î).<a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a></p>
<p>⁕ Le moment (prescrit) pour l'égorgement de l'offrande du bénéficiaire du Tamattou' (<em>Hady at-Tamattou'</em>) ainsi que pour les sacrifices de l'Aïd (<em>Al-Adhâhi</em>) débute après la prière de l'Aïd et s'étend jusqu'à la fin des jours de <em>Tachrîq</em>, selon l'avis prépondérant.</p>
<p>⁕ <strong>Il est recommandé (mustahabb) de manger de son offrande s'il s'agit d'un <em>Hady</em> de type <em>Tamattou’</em> ou <em>Qirân</em>, ainsi que de son sacrifice de l'Aïd (<em>Oudhiyah</em>).</strong> On en offrira également (aux proches/voisins) et on en donnera en aumône (aux pauvres), en répartissant le tout en trois tiers. Ceci conformément à la parole du Très-Haut :</p>
<p class="ar"><span dir="ltr">﴿</span><strong><span dir="rtl">فَكُلُوا مِنْهَا وَأَطْعِمُوا</span></strong><span dir="rtl">﴾ [الحج: ٢٨]</span></p>
<p>{<em><strong>Mangez-en donc et nourrissez-en...</strong></em>} [Al-Hajj : 28].</p>
<p>Quant à l'offrande de compensation (<em>Hady al-Jubrân</em>) — qui est celle due suite à l'accomplissement d'un interdit parmi les interdits de l'état d'Ihram ou pour le délaissement d'une obligation (du Hajj) — le fidèle n'en mangera absolument rien.</p>
<p>⁕ <strong>Quiconque a l'intention de sacrifier : dès l'entrée des dix (premiers) jours de Dhul-Hijjah, il ne doit rien couper de ses cheveux ni de ses ongles, et ce, jusqu'à ce qu'il procède au sacrifice.</strong></p>
<p>Ceci conformément à la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="ltr">«</span><strong><span dir="rtl">إِذَا دَخَلَ الْعَشْرُ، وَأَرَادَ أَحَدُكُمْ أَنْ يُضَحِّيَ؛ فَلَا يَأْخُذْ مِنْ شَعْرِهِ وَلَا مِنْ أَظْفَارِهِ شَيْئاً، حَتَّى يُضَحِّيَ</span></strong><span dir="ltr">»،</span></p>
<p><em>"<strong>Lorsque les dix jours commencent et que l'un d'entre vous a l'intention de sacrifier, qu'il ne coupe rien de ses cheveux ni de ses ongles jusqu'à ce qu'il ait sacrifié</strong>."</em> (Rapporté par Muslim).<a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a></p>
<p><strong>Si toutefois il venait à le faire (par oubli ou ignorance), il devra demander pardon à Allah, mais aucune compensation (<em>fidya</em>) n'est requise de sa part.</strong></p>
