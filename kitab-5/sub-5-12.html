  <!-- ▼ CONTENU DU CHAPITRE ▼ -->

<p>⁕ La 'Aqîqah fait partie des droits de l'enfant sur son père. Il s'agit de la bête sacrifiée pour lui afin de se rapprocher d'Allah <span dir="rtl">ﷺ</span>. C'est une Sunna (tradition prophétique) instaurée par le Messager d'Allah <span dir="rtl">ﷺ</span> ,il a en effet pratiqué la 'Aqîqah pour al-Hasan et al-Hussein, comme l'a rapporté Aboû Dâwoûd et d'autres<a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a>. Ses nobles compagnons ont également agi ainsi, ils sacrifiaient pour leurs enfants, et les Tâbi'oûn (suivants) ont fait de même.</p>
<p>⁕ Certains gens de science ont d'ailleurs penché vers son obligation, en se basant sur ce qu'al-Hasan a rapporté de Samurah : le Messager d'Allah <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="ltr">«</span><strong><span dir="rtl">كلُّ غُلامٍ مُرْتَهَنٌ بِعَقِيقَتِهِ</span></strong><span dir="ltr">»</span></p>
<p>« <em><strong>Tout enfant est l’otage de sa 'Aqîqah.</strong></em> »<a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a></p>
<p>Ahmad a dit : « <em>Cela signifie : privé de l'intercession en faveur de ses parents. »</em><a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a></p>
<p><em>Et Ibn al-Qayyim a dit : « Elle est une cause de la bonté de son tempérament et de son caractère si elle est pratiquée pour lui.</em> »</p>
<p>⁕ <strong>L'avis correct est qu'elle est une Sunna confirmée (Sunna Mouakkada)</strong>. Le fait de sacrifier la bête est préférable au fait de donner son prix en aumône. Elle constitue un remerciement envers Allah pour le renouvellement de Son bienfait envers les parents par la naissance du nouveau-né. Elle comporte également un rapprochement vers Allah le Très-Haut, une aumône envers les pauvres et une rançon (protection) pour l'enfant.</p>
<p>⁕ La quantité à sacrifier pour un garçon est de deux moutons (ou chèvres) proches en âge et en apparence, et pour une fille, un seul mouton.</p>
<p>Cela se base sur le hadith d'Oum Kourz al-Ka'biyyah, qui a dit :</p>
<p class="ar"><span dir="rtl">سَمِعْتُ رسولَ الله ﷺ يقولُ: «عن الغُلامِ شاتانِ مُتَكافِئَتانِ، وعن الجارِيَةِ شاةٌ»</span></p>
<p>« <em><strong>J'ai entendu le Messager d'Allah <span dir="rtl">ﷺ</span> dire : "Pour le garçon, deux moutons équivalents, et pour la fille, un mouton."</strong></em> » Rapporté par Ahmad et at-Tirmidhi, qui l'a authentifié à partir du hadith d'Aïcha.<a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a></p>
<p>⁕ La sagesse derrière la différence entre le garçon et la fille concernant la quantité de la 'Aqîqah est qu'elle [la part de la fille] représente la moitié des règles s'appliquant au garçon. En effet, le bienfait accordé au père par la naissance d'un garçon est considéré comme plus complet, et la joie ainsi que le bonheur qui en découlent sont plus parfaits ; la gratitude à exprimer est donc plus importante.</p>
<p>⁕ Le moment du sacrifice de la 'Aqîqah devrait idéalement avoir lieu le septième jour suivant la naissance. Toutefois, s'il est effectué avant ou après ce septième jour, cela reste permis.</p>
<p>⁕ Le mieux est que l'enfant soit nommé ce jour-là [le septième jour]. On trouve en effet dans les recueils de « As-Sunan » et autres :</p>
<p class="ar"><span dir="ltr">«</span><strong><span dir="rtl">يُذْبَحُ عنه يومَ سابِعِه ويُسَمَّى</span></strong><span dir="ltr">»</span></p>
<p>«<em><strong>Le sacrifice est pratiqué pour lui le septième jour et il est nommé [ce jour-là]</strong></em>».<a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a></p>
<p>Quant à celui qui le nomme le jour de sa naissance, il n'y a pas de mal à cela ; c'est même, selon certains savants, un avis prévalent sur celui du septième jour.</p>
<p>⁕ Il est recommandé (Sunna) de donner un beau prénom, conformément à la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="ltr">«</span><strong><span dir="rtl">إنكم تُدْعَوْنَ بأسمائِكُمْ وأسماءِ آبائِكم؛ فأحْسِنوا أسماءَكُمْ</span></strong><span dir="ltr">»</span></p>
<p>« <em><strong>Certes, vous serez appelés au Jour de la Résurrection par vos prénoms et les prénoms de vos pères ; donnez donc de beaux prénoms.</strong></em> » Rapporté par Aboû Dâwoûd.<a href="#fn6" class="footnote-ref" id="fnref6" role="doc-noteref"><sup>6</sup></a></p>
<p>⁕ Le Prophète <span dir="rtl">ﷺ</span> aimait les beaux prénoms. Il est interdit d’attribuer une servitude (le fait d'être serviteur ou esclave) à autre qu'Allah, comme le fait de nommer : 'Abd al-Ka'bah (serviteur de la Ka'bah), 'Abd an-Nabî (serviteur du Prophète), 'Abd al-Masîh (serviteur du Messie), 'Abd 'Alî (serviteur de 'Ali) ou 'Abd al-Husayn (serviteur d'al-Husayn).</p>
<p>L’imam Ibn Hazm (qu'Allah lui fasse miséricorde) a dit : « <em>Les savants sont tombés d'accord sur l'interdiction de tout prénom impliquant une servitude envers un autre qu'Allah, tel que 'Abd 'Umar, 'Abd al-Ka'bah et ce qui y ressemble, à l'exception de 'Abd al-Mouttalib.</em> »<a href="#fn7" class="footnote-ref" id="fnref7" role="doc-noteref"><sup>7</sup></a></p>
<p>En effet, cela relève du récit de faits historiques (comme les tribus Banû 'Abd ad-Dâr ou 'Abd Shams) et non de l'attribution d'un nouveau prénom.</p>
<p>Il est détestable de donner des prénoms inappropriés, tels que : al-'Âsî (le désobéissant), Koulayb (petit chien), Hanzhalah (plante amère), Mourrah (amertume) ou Hazan (tristesse/rugosité).</p>
<p>Le Prophète <span dir="rtl">ﷺ</span> détestait d'ailleurs l'usage direct de noms laids pour les personnes ou les lieux.</p>
<p>Il a dit <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="ltr">«</span><strong><span dir="rtl">إِنَّ أَحَبَّ أَسْمائِكُمْ إلى اللهِ عبدُ اللهِ وعبدُ الرحمنِ</span></strong><span dir="ltr">»</span></p>
<p>« <em><strong>Certes, les prénoms les plus aimés d'Allah sont 'Abd Allah et 'Abd ar-Rahmân.</strong></em> » (Rapporté par Mouslim et d'autres).<a href="#fn8" class="footnote-ref" id="fnref8" role="doc-noteref"><sup>8</sup></a></p>
<p>Il convient donc d'accorder une grande importance au choix d'un beau prénom pour le nouveau-né et d'éviter les prénoms interdits ou détestables, car cela fait partie des droits de l'enfant sur son père.</p>
<p>⁕ Ce qui est valable pour la 'Aqîqah est identique à ce qui est valable pour le sacrifice de l'Aïd (al-Oudhiyah) en termes d'âge et de caractéristiques. On choisira donc une bête exempte de défauts et de maladies, complète dans sa constitution physique, et convenable quant à son âge et son embonpoint. Il est recommandé d'en manger, d'en offrir et d'en donner en aumône, par tiers, tout comme pour le sacrifice du Aïd.</p>
<p>⁕ Cependant, la 'Aqîqah diffère du sacrifice du Aïd sur le point suivant : l'association (le partage) n'y est pas valable. Ainsi, un chameau ou une vache ne sont valables que s'ils sont sacrifiés entièrement [pour un seul enfant]. En effet, la 'Aqîqah est une rançon pour une âme ؛ elle n'accepte donc pas le partage. De plus, aucun partage n'a été rapporté à ce sujet, car ni le Prophète <span dir="rtl">ﷺ</span> ni aucun de ses compagnons ne l'ont pratiqué.</p>
<p>⁕ Il convient de porter une attention particulière à ce qui concerne le nouveau-né, en lui apportant ce qui est bénéfique à son épanouissement et en l'élevant sur les nobles caractères, afin que cela soit une cause de sa piété. En effet, l'enfant a besoin que l'on soigne son comportement, car il grandit selon les habitudes que son éducateur lui a inculquées.</p>
<p>Le poète a dit :</p>
<p class="ar"><strong><span dir="rtl">وَيَنْشَأُ ناشِئُ الفِتْيانِ مِنَّا *** على ما كانَ عَوَّدَهُ أَبُوه</span>ُ</strong></p>
<p><em><strong>Le jeune parmi nous grandit *** selon ce à quoi son père l'a habitué.</strong></em></p>
<p>Il lui sera alors difficile, une fois adulte, de corriger cela. C'est pour cette raison que l'on trouve certains, voire beaucoup de gens, dont les mœurs sont déviantes à cause de l'éducation dans laquelle ils ont grandi.</p>
<p>Il est donc impératif d'écarter l'enfant des assemblées de divertissements futiles, du faux et des mauvaises fréquentations. Il est également obligatoire que le foyer dans lequel il grandit soit un environnement sain ; car la maison fait office de première école, de par la présence des parents et des membres de la famille. Il faut ainsi éloigner des foyers tout moyen menant au mal et à la corruption, particulièrement à notre époque où ces moyens se sont multipliés au point d'envahir la plupart des maisons, sauf pour celui à qui Allah a fait miséricorde. Il est donc primordial d'être vigilant à cet égard.</p>
<p>De même, il est obligatoire d'élever l'enfant dans l'adoration, l'obéissance, le respect de la religion, ainsi que l'attention et l'amour portés au Coran ; car c'est là l'un des plus grands moyens d'accéder au bonheur dans ce monde et dans l'au-delà.</p>
<p>En résumé : il incombe au père de l'enfant, ainsi qu'à toute personne responsable de lui, d'être un modèle de vertu dans son comportement, ses actes et ses habitudes.</p>
<p>Qu'Allah nous accorde à tous la réussite dans ce qu'Il aime et agréé.</p>
