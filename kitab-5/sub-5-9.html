<p>⁕ Après le coucher du soleil, les pèlerins se dirigent de 'Arafah vers Mouzdalifa avec quiétude et dignité ، conformément aux propos de Jâbir (qu'Allah l'agrée) au sujet du Prophète <span dir="rtl">ﷺ</span> : « <em><strong>Il demeura debout (en station) jusqu'au coucher du soleil ، au moment où la lueur jaune s'estompait un peu et que le disque solaire eut disparu. Il fit alors monter Oussâma derrière lui et partit. Le Messager d'Allah <span dir="rtl">ﷺ</span> avait serré la bride de al-Qaswâ' (sa chamelle) au point que sa tête touchait le devant de sa selle ، tout en faisant signe de sa main droite : "Ô gens ، la quiétude ! La quiétude !"</strong></em> » <a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a>.</p>
<p>C'est ainsi que les musulmans doivent faire preuve de calme et de douceur lors du départ de 'Arafah. Ils ne doivent pas gêner leurs frères pèlerins dans leur marche ، ni les épuiser par la bousculade ، ni les effrayer avec leurs véhicules. Ils se doivent également d'être miséricordieux envers les faibles ، les personnes âgées et les piétons.</p>
<p>⁕ Le pèlerin doit être en état de demande de pardon (Istighfâr) lors de son trajet de 'Arafah vers Mouzdalifa ، conformément à la parole du Très-Haut :</p>
<p class="ar"><span dir="ltr">﴿</span> <strong><span dir="rtl">ثُمَّ أَفِيضُوا مِنْ حَيْثُ أَفَاضَ النَّاسُ وَاسْتَغْفِرُوا اللهَ إِنَّ اللهَ غَفُورٌ رَحِيمٌ</span></strong> <span dir="rtl">﴾ [البقرة : ١٩٩]</span></p>
<p>« <em><strong>Ensuite déferlez par où les gens ont déferlé ، et demandez pardon à Allah. Car Allah est Pardonneur et Miséricordieux.</strong></em> » [Al-Baqarah : 199].</p>
<p>Mouzdalifa fut nommée ainsi à partir du terme <em>« al-Izdilâf »</em> qui signifie la proximité (ou le rapprochement). En effet ، lorsque les pèlerins déferlent de 'Arafât ، ils s'en rapprochent (<em>izdalafou</em>) ، c'est-à-dire qu'ils s'en approchent et s'y rendent. Elle est également appelée <em>« Jam' »</em> en raison du rassemblement des gens en ce lieu ، et elle est aussi nommée <em>« al-Mach'ar al-Harâm »</em> (le Sanctuaire Sacré).</p>
<p>Il est dit dans l'ouvrage <em>« Al-Moughnî »</em> : « Mouzdalifa possède trois noms : Mouzdalifa ، Jam' et al-Mach'ar al-Harâm. » <a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a>.</p>
<p>⁕ Et il (le pèlerin) invoque Allah (<strong>Dhikr</strong>) durant son trajet vers Mouzdalifa ; car il se trouve dans un temps consacré à l'effort vers les lieux saints et au déplacement entre ceux-ci.</p>
<p>⁕ Lorsqu'il arrive à Mouzdalifa, il y accomplit les prières du Maghreb et de l'Icha regroupées (jam'an), en raccourcissant la prière de l'Icha à deux unités (rak'at). Cela se fait avec un seul appel à la prière (Adhân) et deux Iqâmah, soit une Iqâmah pour chaque prière.</p>
<p>Ceci doit être fait avant même de décharger ses bagages, conformément aux paroles de Jâbir (qu'Allah l'agrée) décrivant l'acte du Prophète <span dir="rtl">ﷺ</span> : « <em><strong>Jusqu'à ce qu'il arrive à Mouzdalifa ; il y pria alors le Maghreb et l'Icha avec un seul Adhân et deux Iqâmah</strong></em> » <a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a>.</p>
<p>⁕ Ensuite, il passe la nuit à Mouzdalifa jusqu'au matin et y prie ; conformément aux propos de Jâbir : « <em><strong>Puis le Messager d'Allah <span dir="rtl">ﷺ</span> s'allongea jusqu'à l'apparition de l'aube. Il pria alors le Fajr lorsqu'il put distinguer la clarté du matin, avec un Adhân et une Iqâmah</strong></em> ».</p>
<p>L'ensemble de Mouzdalifa est appelé <em>al-Mach'ar al-Harâm</em> (le Sanctuaire Sacré). Elle s'étend entre les deux défilés (<em>ma'zamayn</em>) de 'Arafah jusqu'à la vallée de Mouhassir (<em>Batn Mouhassir</em>). Le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="ltr">«</span><strong><span dir="rtl">وَمُزْدَلِفَةُ كُلُّهَا مَوْقِفٌ، وَارْفَعُوا عَن بَطْنِ مُحَسِّرٍ</span></strong><span dir="ltr">»</span></p>
<p>« <em><strong>Tout Mouzdalifa est un lieu de stationnement, mais évitez (de stationner dans) la vallée de Mouhassir</strong></em> » <a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a>.</p>
<p>⁕ La Sounnah est de passer la nuit à Mouzdalifa jusqu'à l'apparition de l'aube. Il y prie alors le Fajr dès le début de son temps ، puis il y reste debout pour invoquer jusqu'à ce que la clarté du jour se répande (yousfir) ، ensuite il se dirige vers Mina avant le lever du soleil.</p>
<p>⁕ S'il fait partie des personnes faibles ، comme les femmes ، les enfants et leurs semblables ، il lui est alors permis de s'empresser de quitter Mouzdalifa pour Mina dès que la lune disparaît. De même ، il est permis aux personnes fortes qui ont la charge de ces personnes faibles de partir avec elles après la moitié de la nuit.</p>
<p>Quant aux personnes fortes qui ne sont pas accompagnées de personnes faibles ، il leur convient de ne pas quitter Mouzdalifa avant l'apparition de l'aube ، afin d'y prier le Fajr et d'y rester debout (pour les invocations) jusqu'à ce que la clarté du jour se répande.</p>
<p>⁕ La nuitée à Mouzdalifa est une obligation parmi les obligations du pèlerinage (Hajj). Il n'est pas permis de la délaisser pour celui qui y arrive avant le milieu de la nuit. Quant à celui qui y parvient après le milieu de la nuit ، il lui suffit d'y rester ne serait-ce qu'un court instant ، même s'il est préférable pour lui d'y demeurer jusqu'à l'aube ، d'y prier le Fajr et d'invoquer après cela.</p>
<p>Il est dit dans « Al-Mughnî » : « <em>Et celui qui n'atteint Mouzdalifa que durant la seconde moitié de la nuit ، alors il n'y a rien à sa charge (pas de compensation) ; car il n'a pas vécu une partie de la première moitié (de la nuit) ، par conséquent la règle (de l'obligation d'y rester jusqu'au bout) ne s'applique pas à son cas.</em> » <a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a>.</p>
<p>⁕ Il est permis aux personnes ayant une excuse valable de ne pas passer la nuit à Mouzdalifa. C’est le cas, par exemple, du malade dont l'état nécessite des soins hospitaliers, de celui dont le malade a besoin pour être servi, ainsi que des préposés à l'eau (souqât) et des bergers (rou'ât). En effet, le Prophète <span dir="rtl">ﷺ</span> a accordé une dispense aux bergers pour ne pas passer la nuit (à Mouzdalifa) <a href="#fn6" class="footnote-ref" id="fnref6" role="doc-noteref"><sup>6</sup></a>.</p>
<p>⁕ En résumé, la nuitée à Mouzdalifa est une obligation parmi les obligations du Hajj pour celui qui y arrive avant le milieu de la nuit. En effet, le Prophète <span dir="rtl">ﷺ</span> y a passé la nuit et a dit :</p>
<p></p>
<p class="ar"><span dir="ltr">«</span><strong><span dir="rtl">لِتَأْخُذُوا عَنِّي مَنَاسِكَكُمْ</span></strong><span dir="ltr">»</span></p>
<p>« <em><strong>Prenez de moi vos rites (de pèlerinage)</strong></em> » <a href="#fn7" class="footnote-ref" id="fnref7" role="doc-noteref"><sup>7</sup></a>.</p>
<p>Le départ après le milieu de la nuit n'a été autorisé qu'en raison de la dispense (roukhsah) mentionnée à ce sujet (pour les personnes concernées).</p>
<p>⁕ Ensuite ، il se dirige vers Mina avant le lever du soleil ، conformément aux propos de 'Umar : « <em>Les gens de l'époque pré-islamique (Al-Jâhiliyyah) ne déferlaient pas de Jam' (Mouzdalifa) tant que le soleil ne s'était pas levé ، et ils disaient : "Entre dans la lumière (du soleil) ، Ô Thabîr ، afin que nous puissions nous mettre en route" (Thabîr est le nom d'une montagne surplombant Mouzdalifa qu'ils interpellaient ainsi ; c'est-à-dire : "que le soleil se lève sur toi pour que nous puissions partir"). Le Prophète <span dir="rtl">ﷺ</span> s'est alors opposé à eux et a déferlé avant le lever du soleil.</em> » <a href="#fn8" class="footnote-ref" id="fnref8" role="doc-noteref"><sup>8</sup></a>.</p>
<p>⁕ Il (le pèlerin) s'élance avec quiétude. Lorsqu'il atteint la vallée de Mouhassir — qui est une vallée située entre Mouzdalifa et Mina، servant de séparation entre les deux sans faire partie de l'une ou de l'autre — il doit alors accélérer le pas sur une distance équivalente à un jet de pierre.</p>
<p>⁕ Il prend les cailloux pour la lapidation (Jamarat) sur son chemin avant d'arriver à Mina ، car cela est préférable. Il peut aussi les prendre à Mouzdalifa ou à Mina. Quel que soit l'endroit où il ramasse les cailloux ، cela est permis ، conformément aux propos d'Ibn 'Abbâs (qu'Allah l'agrée) : « Le Messager d'Allah <span dir="rtl">ﷺ</span> a dit au matin de la 'Aqabah ، alors qu'il était sur sa monture : "Ramasse pour moi des cailloux." J'ai alors ramassé pour lui sept cailloux ; c'étaient des cailloux de la taille de ceux que l'on lance avec les doigts (Hassa al-Khadhf) <a href="#fn9" class="footnote-ref" id="fnref9" role="doc-noteref"><sup>9</sup></a>. Il se mit à les secouer dans sa paume et dit : "Lancez des semblables à ceux-là" ، puis il dit : "<em><strong>Ô gens ، prenez garde à l'excès (al-Ghuluw) dans la religion ، car ce qui a causé la perte de ceux qui vous ont précédés est l'excès dans la religion</strong></em>" » <a href="#fn10" class="footnote-ref" id="fnref10" role="doc-noteref"><sup>10</sup></a>.</p>
<p>Ainsi ، le caillou destiné à la lapidation doit avoir la taille d'une fève (al-Bâqilâ') ، soit un peu plus gros qu'un pois chiche.</p>
<p>⁕ La lapidation (ar-ramy) n'est pas valable avec autre chose que des cailloux ، ni avec de gros cailloux que l'on appelle « pierres » (hajar) ; car le Prophète <span dir="rtl">ﷺ</span> a pratiqué la lapidation avec de petits cailloux et a dit : « <em><strong>Prenez de moi vos rites [de pèlerinage]</strong></em> » <a href="#fn11" class="footnote-ref" id="fnref11" role="doc-noteref"><sup>11</sup></a>.</p>
<p>⁕ Lorsqu'il arrive à Mina — qui s'étend de la vallée de Mouhassir jusqu'à la stèle de la 'Aqabah — il se rend à la stèle de la 'Aqabah. Il s'agit de la dernière des stèles du côté de La Mecque ، et elle est appelée la « Grande Stèle » (al-Jamrat al-Koubrâ). Il la lapide alors avec sept cailloux ، l'un après l'autre ، après le lever du soleil. Le temps imparti pour cette lapidation s'étend jusqu'au coucher du soleil.</p>
<p>⁕ Il est impératif que chaque caillou tombe dans le bassin de la stèle (Hawd al-Jamrah) ، qu'il y reste ou qu'il en ressorte après être tombé dedans. Le pèlerin doit obligatoirement viser le bassin de la stèle et non le pilier central (al-'Amoud ach-Châkhis). En effet ، ce pilier n'a pas été construit pour être visé par les tirs et il n'est pas le lieu de la lapidation. Il a seulement été édifié pour servir de repère à la stèle. Le lieu de la lapidation est bel et bien le bassin. Ainsi ، si le caillou frappe le pilier et rebondit au loin sans passer par le bassin ، l'acte n'est pas valide pour lui.</p>
<p>⁕ Les personnes faibles ainsi que celles qui sont dans la même situation qu'elles lancent [les pierres] après le milieu de la nuit. Et si d'autres que les personnes faibles lancent après le milieu de la nuit، cela leur suffit [cela est valide] ، bien que ce soit contraire à ce qui est préférable à leur égard.</p>
<p>⁕ Il est recommandé (Sunna) de ne commencer par rien d'autre, lors de son arrivée à Minâ, avant la lapidation de la stèle d'al-'Aqaba ؛ car elle constitue la salutation de Minâ. Il est également recommandé de dire "Allâhu Akbar" (Allah est le Plus Grand) avec chaque caillou lancé, et de dire :</p>
<p></p>
<p class="ar"><span dir="rtl">« اللَّهُمَّ اجْعَلْهُ حَجًّا مَبْرُورًا وَذَنْبًا مَغْفُورًا »</span></p>
<p>"Ô Allah, fais que ce soit un pèlerinage accepté et un péché pardonné". <a href="#fn12" class="footnote-ref" id="fnref12" role="doc-noteref"><sup>12</sup></a></p>
<p>Et il ne doit pas lapider d'autre stèle que celle d'al-'Aqaba le jour du sacrifice (le 10ème jour de Dhul-Hijja) ؛ c'est d'ailleurs l'une des particularités qui la distingue des autres stèles.</p>
<p>⁕ Ensuite, après la lapidation de la stèle d'al-'Aqaba ؛ le plus préférable est qu'il sacrifie son offrande (<em>Hady</em>) s'il est soumis à l'obligation de l'offrande du pèlerinage en mode <em>Tamattu'</em> ou <em>Qirân</em>. Il doit alors l'acheter, l'égorger, en distribuer la viande et en prélever une partie pour sa propre consommation.</p>
<p>⁕ Ensuite, il se rase la tête ou se coupe les cheveux, et le rasage est préférable ؛ en raison de la parole d'Allah le Très-Haut :</p>
<p class="ar"><span dir="ltr">﴿</span> <strong><span dir="rtl">مُحَلِّقِينَ رُءُوسَكُمْ وَمُقَصِّرِينَ</span></strong> <span dir="rtl">﴾ [الفتح : ٢٧]</span></p>
<p>{<em><strong>...ayant les têtes rasées et les cheveux coupés...</strong></em>} [Al-Fath : 27].</p>
<p>Et également en raison du hadith d'Ibn 'Umar : "<em><strong>Le Messager d'Allah <span dir="rtl">ﷺ</span> s'est rasé la tête lors du pèlerinage d'adieu</strong></em>" (Rapporté par Al-Bukhârî et Muslim)<a href="#fn13" class="footnote-ref" id="fnref13" role="doc-noteref"><sup>13</sup></a>. Le Prophète <span dir="rtl">ﷺ</span> a d'ailleurs invoqué en faveur de ceux qui se rasent trois fois, et une seule fois pour ceux qui se coupent les cheveux.<a href="#fn14" class="footnote-ref" id="fnref14" role="doc-noteref"><sup>14</sup></a> Et s'il choisit de se couper les cheveux ؛ il est obligatoire que cela englobe l'ensemble de sa tête. Il ne suffit pas de se limiter à une partie ou à un côté seulement ؛ car Allah le Très-Haut a dit : {<em><strong>...ayant les têtes rasées et les cheveux coupés...</strong></em>}, attribuant ainsi le rasage et la coupe à la tête dans sa globalité.</p>
<p>⁕ Pour la femme, il est impératif de se couper les cheveux [le raccourcissement], en coupant de chaque tresse la longueur d'une phalange ؛ conformément au hadith d'Ibn 'Abbâs remontant jusqu'au Prophète <span dir="rtl">ﷺ</span> (marfû') : "<em><strong>Le rasage n'incombe pas aux femmes, seul le raccourcissement leur incombe</strong></em>" (rapporté par Abû Dâwud, At-Tabarânî et Ad-Dâraqutnî)<a href="#fn15" class="footnote-ref" id="fnref15" role="doc-noteref"><sup>15</sup></a>. De plus, le rasage pour les femmes est considéré comme une mutilation. Si les cheveux de la femme ne sont pas tressés ؛ elle doit les rassembler et en couper les pointes de la longueur d'une phalange.</p>
<p>⁕ Il est recommandé à celui qui s'est rasé ou s'est coupé les cheveux [pour sortir de l'état d'ihrâm] de se couper les ongles, de se tailler la moustache et de s'épiler les poils du pubis et des aisselles. Cependant، il ne lui est pas permis de raser sa barbe ou d'en couper quoi que ce soit ؛ car le Prophète <span dir="rtl">ﷺ</span> a ordonné de laisser pousser la barbe et a interdit de la raser ou d'en retirer une partie. Le musulman se conforme à ce que le Prophète <span dir="rtl">ﷺ</span> a ordonné et s'écarte de ce qu'il a interdit ، et le pèlerin est encore plus tenu de le faire ، car il se trouve dans une adoration.</p>
<p>⁕ Quant à celui dont la tête est dépourvue de cheveux ، comme celui qui est déjà rasé ou celui chez qui les cheveux ne poussent pas du tout (le chauve) ؛ celui-ci doit faire passer le rasoir sur sa tête. Ceci en raison de la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="ltr">«</span> <strong><span dir="rtl">إِذَا أَمَرْتُكُمْ بِأَمْرٍ ؛ فَأْتُوا مِنْهُ مَا اسْتَطَعْتُمْ</span></strong> <span dir="ltr">» .</span></p>
<p>"<em><strong>Lorsque je vous ordonne une chose ، accomplissez-en ce que vous pouvez</strong></em>".<a href="#fn16" class="footnote-ref" id="fnref16" role="doc-noteref"><sup>16</sup></a></p>
<p>⁕ Ensuite, après avoir lapidé la stèle d'al-'Aqaba et s'être rasé ou coupé les cheveux ، tout ce qui lui était interdit en raison de l'état d'ihrâm lui devient licite ، comme le parfum ، les vêtements [habituels] et autres ؛ à l'exception des rapports avec les femmes. Ceci en raison du hadith d'Aïcha (qu'Allah l'agrée) : "<em><strong>Lorsque vous avez lapidé et que vous vous êtes rasé ، le parfum ، les vêtements et toute chose vous deviennent licites ؛ à l'exception des femmes</strong></em>" (rapporté par Sa'îd)<a href="#fn17" class="footnote-ref" id="fnref17" role="doc-noteref"><sup>17</sup></a>. Et selon elle également : "<em><strong>Je parfumais le Messager d'Allah <span dir="rtl">ﷺ</span> avant qu'il n'entre en état d'ihrâm ، ainsi que le jour du sacrifice avant qu'il n'effectue les circonvolutions (Tawâf) autour de la Maison ، avec un parfum contenant du musc</strong></em>" (Rapporté par Al-Bukhârî et Muslim).<a href="#fn18" class="footnote-ref" id="fnref18" role="doc-noteref"><sup>18</sup></a></p>
<p>⁕ Et ceci constitue la première désacralisation (<em>at-tahallul al-awwal</em>). Elle s'obtient par l'accomplissement de deux des trois actes suivants : la lapidation de la stèle d'al-'Aqaba ، le rasage ou le raccourcissement des cheveux ، et la circumambulation du déferlement (<em>Tawâf al-Ifâdah</em>) accompagnée du parcours (<em>Sa'y</em>) qui le suit pour celui qui est tenu d'accomplir le Sa'y.</p>
<p>⁕ Après avoir lapidé la stèle d'al-'Aqaba ، sacrifié son offrande et s'être rasé ou coupé les cheveux ، il se rend à la Mecque [déferle] pour effectuer la circumambulation du déferlement (Tawâf al-Ifâdah). Ensuite, il accomplit le parcours (Sa'y) entre as-Safâ et al-Marwah s'il est en mode Tamattu' ، ou bien s'il est en mode Qirân ou Ifrâd mais n'a pas effectué le Sa'y après la circumambulation d'arrivée (Tawâf al-Qudûm). Quant au pèlerin en mode Qirân ou Ifrâd ayant déjà effectué le Sa'y après le Tawâf al-Qudûm ؛ ce premier Sa'y lui suffit ، et il se limite alors au Tawâf al-Ifâdah.</p>
<p>⁕ L'ordonnancement de ces quatre actions selon ce modèle : la lapidation de la stèle d'al-'Aqaba ، puis le sacrifice de l'offrande ، puis le rasage ou le raccourcissement des cheveux ، puis la circumambulation (Tawâf) et le parcours (Sa'y) ؛ cet ordre est une Sunna. Si le pèlerin y contrevient en accomplissant l'une de ces actions avant l'autre ؛ il n'y a aucun grief contre lui. En effet, il n'a pas été demandé au Prophète <span dir="rtl">ﷺ</span> ce jour-là quoi que ce soit qui ait été avancé ou reculé [dans l'ordre] sans qu'il ne réponde :</p>
<p class="ar"><span dir="ltr">«</span> <strong><span dir="rtl">افْعَلْ وَلَا حَرَجَ</span></strong> <span dir="ltr">»</span></p>
<p>"<em><strong>Fais-le, il n'y a aucun grief</strong></em>". <a href="#fn19" class="footnote-ref" id="fnref19" role="doc-noteref"><sup>19</sup></a></p>
<p>Cependant, respecter leur ordre est préférable ، car c'est ainsi que le Prophète <span dir="rtl">ﷺ</span> les a ordonnées.</p>
<p>⁕ La description de la circumambulation (<em>Tawâf</em>) autour de la Maison est qu'elle débute au niveau de la Pierre Noire. Le pèlerin se place face à elle et la salue (<em>istilâm</em>) de la main ؛ en la touchant de sa main droite et en la baisant si cela est possible. S'il ne peut atteindre la Pierre en raison de la forte affluence ؛ il se contente alors de faire un signe dans sa direction avec sa main. Il ne doit pas bousculer les autres pour toucher la Pierre ou la baiser. Il place la Maison [la Ka'ba] à sa gauche ، puis commence le premier tour. Il s'occupe alors par l'évocation (<em>Dhikr</em>) ، l'invocation (<em>Du'â</em>) ou la récitation du Coran. Lorsqu'il atteint le Coin Yéménite (<em>ar-Rukn al-Yamânî</em>) ؛ il le touche de la main si cela est possible ، mais il ne le baise pas. Entre le Coin Yéménite et la Pierre Noire, il dit :</p>
<p class="ar"><span dir="rtl">﴿ رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ ﴾ [البقرة : ٢٠١]</span></p>
<p><strong>{Seigneur ! Accorde-nous belle part ici-bas, et belle part aussi dans l'au-delà ; et protège-nous du châtiment du Feu}</strong> [Al-Baqarah : 201].</p>
<p>Lorsqu'il atteint de nouveau la Pierre Noire ؛ le premier tour est alors terminé. Il salue alors la Pierre ou fait un signe vers elle ، puis entame le deuxième tour... et ainsi de suite jusqu'à accomplir sept tours.</p>
<p>⁕ Treize conditions sont requises pour la validité de la circumambulation (<em>Tawâf</em>) : <strong>l'Islam</strong> ، <strong>la raison</strong> ، <strong>l'intention</strong> ، <strong>le fait de couvrir sa nudité</strong> ، <strong>la purification</strong> ، <strong>l'accomplissement complet des sept tours</strong> ، <strong>le fait de placer la Maison à sa gauche</strong> ، et <strong>d'effectuer la circumvolution autour de l'intégralité de la Maison</strong> ؛ de sorte qu'il n'entre pas dans l'espace du <em>Hijr</em> [Ismâ'îl] et qu'il ne marche pas sur son muret . De même ، <strong>il doit tourner en marchant s'il en a la capacité</strong> ، <strong>respecter la continuité entre les tours</strong> ؛ sauf si la prière obligatoire commence ou qu'un convoi funèbre se présente ؛ dans ce cas il prie ، puis reprend là où il s'était arrêté après avoir recommencé le tour durant lequel il a dû interrompre sa marche . Enfin ، <strong>il doit circuler à l'intérieur de la mosquée</strong> ، et <strong>débuter par la Pierre Noire pour finir par elle</strong> .</p>
<p>⁕ Ensuite ، après avoir terminé la circumambulation (<em>Tawâf</em>) ، il prie deux unités de prière (<em>rak'atayn</em>) . Le plus préférable est qu'elles soient accomplies derrière le Maqâm d'Ibrahim . Il est cependant permis de les prier en n'importe quel endroit de la mosquée ou ailleurs dans l'enceinte sacrée (<em>al-Haram</em>) . Elles constituent une Sunna confirmée . Il récite dans la première unité ، après la Fatiha : <strong>{Dis : "Ô vous les infidèles !"}</strong> [Al-Kâfirûn] ، et dans la seconde : <strong>{Dis : "Il est Allah, l'Unique"}</strong> [Al-Ikhlâs] .</p>
<p>⁕ Ensuite, il sort vers <strong>as-Safa</strong> pour effectuer le parcours (as-Sa'y) entre celui-ci et <strong>al-Marwah</strong>. Il monte alors sur as-Safa, proclame la grandeur d'Allah (le Takbir) trois fois, et dit :</p>
<p class="ar"><span dir="rtl">«لَا إِلَهَ إِلَّا اللهُ وَحْدَهُ، لَا شَرِيكَ لَهُ، لَهُ المُلْكُ، وَلَهُ الحَمْدُ، يُحْيِي وَيُمِيتُ، وَهُوَ حَيٌّ لَا يَمُوتُ، بِيَدِهِ الخَيْرُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ»</span></p>
<p>« <strong>Il n'y a de divinité digne d'adoration qu'Allah, Seul, sans associé. À Lui appartient la royauté, et à Lui appartient la louange. Il donne la vie et Il donne la mort, et Il est le Vivant qui ne meurt jamais. Le bien est dans Sa main, et Il est Puissant sur toute chose.</strong> »</p>
<p>Puis, il descend d'as-Safa en se dirigeant vers al-Marwah ; il a ainsi commencé son <strong>premier tour</strong>. Il court intensément entre les deux repères verts, et en dehors de ces deux repères, il marche d'une allure normale jusqu'à atteindre al-Marwah. Il y monte alors et dit la même chose que ce qu'il a dit sur as-Safa.</p>
<p>Par cela, il a terminé le premier tour. Il descend ensuite d'al-Marwah en se dirigeant vers as-Safa, entamant ainsi le <strong>deuxième tour</strong>. Il marche là où il faut marcher et court là où il faut courir... Et ainsi de suite jusqu'à accomplir <strong>sept tours</strong>, commençant par as-Safa et terminant à al-Marwah. Son trajet d'as-Safa vers al-Marwah compte pour un tour, et son retour d'al-Marwah vers as-Safa compte pour un autre tour.</p>
<p>⁕ Il est recommandé de s'occuper, durant le parcours (as-Sa'y), par l'invocation (ad-Du'â), le rappel (adh-Dhikr) ou la récitation du Coran.</p>
<p>Il n'existe pas d'invocation spécifique [obligatoire] pour la circumambulation (at-Tawâf) et le parcours (as-Sa'y). Au contraire, le fidèle invoque Allah par les supplications qui lui sont aisées.</p>
<p>⁕ Les conditions de validité du parcours (<strong>as-Sa'y</strong>) sont : l'intention (<strong>an-Niyyah</strong>), le fait de parcourir l'intégralité de la distance entre <strong>as-Safa</strong> et <strong>al-Marwah</strong>, et le fait d'être précédé par la circumambulation (<strong>at-Tawâf</strong>).</p>
