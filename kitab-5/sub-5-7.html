<p>⁕ Les interdits de l'Ihram sont les actes prohibés qu'il incombe au pèlerin (Al-Muhrim) d'éviter en raison de son entrée en état de sacralisation، et ces interdits sont au nombre de neuf points :</p>
<p><strong>Le premier interdit : Se raser les cheveux.</strong> Il est interdit à la personne en état de sacralisation (<em>Muhrim</em>) de les retirer de n'importe quelle partie de son corps sans excuse valable، que ce soit en rasant، en épilant ou en arrachant. Cela est dû à la parole d'Allah le Très-Haut :</p>
<p class="ar"><span dir="ltr">﴿</span><strong><span dir="rtl">وَلَا تَحْلِقُوا رُءُوسَكُمْ حَتَّىٰ يَبْلُغَ الْهَدْيُ مَحِلَّهُ</span></strong><span dir="rtl">﴾ [البقرة : ١٩٦]</span></p>
<p>« <em><strong>Et ne rasez pas vos têtes tant que l'offrande n'a pas atteint son lieu d'immolation</strong></em> » [Al-Baqarah : 196].</p>
<p>Allah le Très-Haut a ainsi textuellement mentionné le rasage de la tête, et les poils du corps y sont assimilés par consensus (par analogie), car ils entrent dans le même sens. De plus, leur retrait procure un certain confort, or le rasage des cheveux annonce une recherche d'aisance et de luxe qui est incompatible avec l'état de sacralisation. En effet, le <em>Muhrim</em> doit être ébouriffé et couvert de poussière. Cependant, si un cil pousse à l'intérieur de l'œil, il peut le retirer sans avoir à verser de compensation (<em>Fidyah</em>), car c'est un poil qui n'est pas à sa place habituelle et parce qu'il retire une nuisance.</p>
<p><strong>Le deuxième interdit :</strong> Se couper ou se tailler les ongles des mains ou des pieds sans excuse valable. Si toutefois un ongle se casse et qu'il le retire, ou qu'il part en même temps qu'un morceau de peau, aucune compensation (<em>fidyah</em>) n'est requise, car il a été enlevé de manière accessoire à autre chose, et ce qui est accessoire ne fait pas l'objet d'un jugement indépendant.</p>
<p>Ceci diffère du cas où la personne se rase les cheveux à cause des poux ou d'une migraine, conformément à la parole d'Allah (Le Très-Haut) :</p>
<p class="ar"><strong><span dir="rtl">﴿فَمَن كَانَ مِنكُم مَّرِيضًا أَوْ بِهِۦٓ أَذًى مِّن رَّأْسِهِۦ فَفِدْيَةٌ مِّن صِيَامٍ أَوْ صَدَقَةٍ أَوْ نُسُكٍ﴾ [البقرة : ١٩٦]</span></strong></p>
<p><strong>{<em>Quiconque d'entre vous est malade ou souffre d'une affection de la tête (devant se raser), devra se racheter par un jeûne, une aumône ou un sacrifice</em>}</strong> [Al-Baqarah : 196].</p>
<p>Et selon le hadith de Ka'b ibn 'Ujrah qui a dit : « Je souffrais d'une affection à la tête. On m'a transporté auprès du Messager d'Allah <span dir="rtl">ﷺ</span> alors que les poux tombaient sur mon visage. Il dit : "<em><strong>Je ne pensais pas que ton mal atteignait un tel degré. Peux-tu trouver une brebis ?</strong></em>" Je répondis : "<em>Non</em>". Alors fut révélé : <strong>{...devra se racheter par un jeûne, une aumône ou un sacrifice}</strong>. Il dit alors : "<em><strong>Il s'agit de jeûner trois jours, ou de nourrir six pauvres, ou de sacrifier une brebis.</strong></em> » (Rapporté par Al-Bukhârî et Muslim).<a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a></p>
<p>Et cela parce que la nuisance provenait d'autre chose que les cheveux eux-mêmes, à savoir les poux.</p>
<p>Il est permis à la personne en état de sacralisation (Muhrim) de se laver les cheveux avec du jujubier (Sidr) ou ce qui y ressemble ؛ car il est rapporté dans les "Deux Authentiques" (Al-Boukhârî et Muslim) d’après lui <span dir="rtl">ﷺ</span> qu’il a lavé sa tête alors qu'il était en état de sacralisation، puis qu'il a passé ses mains sur sa tête en les déplaçant d'avant en arrière <a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a>.</p>
<p>Cheikh Taqi ad-Dîn (Ibn Taymiyyah) — qu'Allah lui fasse miséricorde — a dit : "<em>Il lui est permis de faire les grandes ablutions (Ghusl) suite à un état d'impureté majeure (Janâbah) par consensus (c’est-à-dire : s’il a une pollution nocturne alors qu’il est en état de sacralisation)، et il en est de même pour ce qui n'est pas lié à l'impureté majeure</em>" <a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a>.</p>
<p><strong>Le troisième interdit :</strong> Se couvrir la tête pour l'homme (en état d'Ishrâm) ; en raison de l'interdiction du Prophète <span dir="rtl">ﷺ</span> de porter des turbans et des burnous.</p>
<p><strong>L'illustre savant Ibn Al-Qayyim (qu'Allah lui fasse miséricorde) a dit :</strong> « <em>Tout ce qui est en contact direct et attenant (à la tête) visant à la couvrir, comme le turban, le bonnet, la calotte ou autre, est interdit par consensus.</em> » <a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a>. Fin de citation.</p>
<p>Et peu importe que ce qui couvre soit habituel, comme un turban, ou inhabituel, comme du papier, de l'argile, du henné ou un bandage.</p>
<p>Toutefois, il lui est permis de s'abriter sous une tente, un arbre ou dans une maison ; car on avait dressé une tente pour le Prophète <span dir="rtl">ﷺ</span> dans laquelle il s'est installé alors qu'il était en état d'Ihram. De même, il est permis à celui qui est en état d'Ihram de s'abriter sous un parapluie (ombrelle) en cas de besoin. Il lui est aussi permis de monter dans une voiture couverte, tout comme il peut porter un bagage sur sa tête tant qu'il n'a pas l'intention de la couvrir par cela.</p>
<p><strong>Le quatrième interdit :</strong> le fait pour l'homme de porter des vêtements cousus sur l'ensemble de son corps ou sur une partie de celui-ci, comme une chemise, un turban ou un pantalon. Il en va de même pour tout ce qui est confectionné à la mesure d'un membre, tels que les deux chaussons (al-khuffayn), les gants et les chaussettes.</p>
<p>Cela s'appuie sur ce qui est rapporté dans les "Deux Authentiques" (Al-Bukhari et Muslim), à savoir qu'il fut demandé au Prophète <span dir="rtl">ﷺ</span> : "<em><strong>Que doit porter celui qui est en état d'ihrâm ?</strong></em>"</p>
<p>Il répondit :</p>
<p class="ar"><span dir="ltr">«</span> <strong><span dir="rtl">لَا يَلْبَسُ القَمِيصَ ، وَلَا العِمَامَةَ ، وَلَا البَرَانِسَ ، وَلَا السَّرَاوِيلَ ، وَلَا ثَوْباً مَسَّهُ وَرْسٌ وَلَا زَعْفَرَانٌ ، وَلَا الخُفَّيْنِ</span></strong> <span dir="ltr">»</span></p>
<p>« <em><strong>Il ne doit porter ni chemise, ni turban, ni burnous (vêtement à capuche), ni pantalon, ni vêtement ayant été touché par le wars (une plante tinctoriale odorante) ou le safran, ni de bottines (khuffayn).</strong></em> »<a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a></p>
<p>Cheikh al-Islâm Ibn Taymiyyah — qu'Allah lui fasse miséricorde — a dit <a href="#fn6" class="footnote-ref" id="fnref6" role="doc-noteref"><sup>6</sup></a>: « <em>Le Prophète <span dir="rtl">ﷺ</span> a interdit au Muhrim (celui en état de sacralisation) de porter la chemise, les burnous (manteaux à capuche), les pantalons, les khuffs (chaussons de cuir) et le turban. Il leur a également interdit de couvrir la tête du Muhrim après sa mort, et il a ordonné à celui qui était entré en état de sacralisation vêtu d'une Jubbah (longue robe) de l'enlever. Tout ce qui appartient à cette catégorie est donc considéré comme un moyen (analogue) relevant du sens de ce que le Prophète <span dir="rtl">ﷺ</span> a interdit. Ce qui a le même sens que la chemise est donc traité de la même manière. Il n'est pas permis au Muhrim de porter une chemise, qu'elle ait des manches ou non, qu'il y introduise ses bras ou non, et qu'elle soit intacte ou déchirée. De même, il ne doit porter ni la Jubbah, ni le Qabâ' (tunique) dans lequel on introduit les bras...</em> ».</p>
<p>Jusqu'à ce qu'il dise : « <em>Et c'est là le sens de la parole des juristes : "Il ne doit pas porter de Makhît (vêtement cousu/ajusté)" ; et le Makhît désigne tout vêtement confectionné à la mesure d'un membre du corps. Il ne doit pas non plus porter ce qui a le sens du pantalon, comme le Tibbân (sorte de sous-vêtement court) ou ce qui y ressemble</em> » Fin de citation.</p>
<p>Si la personne en état de sacralisation (Al-Muhrim) ne trouve pas de sandales, elle peut porter des chaussons (Khuffayn). Si elle ne trouve pas de pagne (Izâr), elle peut porter un pantalon (Sarâwîl) jusqu'à ce qu'elle en trouve un. Lorsqu'elle trouve un pagne, elle doit retirer le pantalon et revêtir le pagne ، car le Prophète <span dir="rtl">ﷺ</span> a accordé une permission (Rukhsa), à 'Arafat ، pour le port du pantalon à celui qui ne trouve pas de pagne.</p>
<p>Quant à la femme ، elle porte les vêtements qu'elle souhaite durant l'état de sacralisation (Ihrâm) en raison de son besoin de se couvrir. Cependant ، elle ne doit pas porter le burqa' — qui est un vêtement par lequel la femme couvre son visage et qui comporte deux ouvertures pour les yeux. La femme en état de sacralisation ne doit donc pas le porter ، mais elle couvre son visage avec autre chose comme le Khimar ou le Jilbab. Elle ne doit pas non plus porter de gants sur ses mains ، conformément à la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«لَا تَنْتَقِبِ الْمَرْأَةُ، وَلَا تَلْبَسُ الْقُفَّازَيْنِ»</span></p>
<p>"<em><strong>La femme ne doit pas porter le niqab ni de gants.</strong></em>" Rapporté par Al-Bukhârî et d'autres. <a href="#fn7" class="footnote-ref" id="fnref7" role="doc-noteref"><sup>7</sup></a></p>
<p>L'Imam Ibn al-Qayyim (qu'Allah lui fasse miséricorde) a dit : « <em>Le fait qu'il [le Prophète <span dir="rtl">ﷺ</span>] ait interdit à la femme [en état d'Ihram] de porter le niqab et les gants est une preuve que son visage est semblable au corps de l'homme et non à sa tête. Il lui est donc interdit d'y porter ce qui est confectionné et ajusté à la mesure du visage, comme le niqab et le bourkou' ; cela ne signifie pas qu'il ne faille pas le couvrir avec le voile (miqna'ah), le jilbab ou ce qui y ressemble. Et ceci est la plus correcte des deux opinions.</em> » Fin de citation.<a href="#fn8" class="footnote-ref" id="fnref8" role="doc-noteref"><sup>8</sup></a></p>
<p>Les gants sont une chose confectionnée pour les mains, dans laquelle on les introduit afin de les protéger du froid.</p>
<p>Et elle doit obligatoirement se couvrir le visage devant les hommes par un autre moyen que le <em>burqu’</em> (voile intégral avec ouvertures pour les yeux) ، conformément à la parole de ‘Âïshah (qu'Allah l'agrée) : "Les cavaliers passaient près de nous alors que nous étions en état de sacralisation (<em>Ihrâm</em>) avec le Messager d’Allah <span dir="rtl">ﷺ</span>. Lorsqu'ils arrivaient à notre hauteur ، l'une d'entre nous rabattait son <em>jilbâb</em> sur son visage ، et une fois qu'ils nous avaient dépassées ، nous le découvrions." Rapporté par Ahmad ، Abû Dâwûd et d'autres.<a href="#fn9" class="footnote-ref" id="fnref9" role="doc-noteref"><sup>9</sup></a></p>
<p>Et le fait que le voile rabattu touche la peau de son visage ne nuit en rien ؛ car il lui a seulement été interdit [le port du] <em>burqu’</em> et du <em>niqâb</em> uniquement ، et non le fait de se couvrir le visage par un autre moyen que ces deux-là.</p>
<p>Cheikh al-Islâm [Ibn Taymiyyah] a dit : "<em>La femme n'est pas tenue d'écarter son voile de son visage par un bâtonnet ، par sa main ou par tout autre moyen. En effet ، le Prophète <span dir="rtl">ﷺ</span> a mis sur le même plan son visage et ses mains ، et tous deux sont considérés comme le corps de l'homme et non comme sa tête. Ses épouses <span dir="rtl">ﷺ</span> rabattaient [le voile] sur leurs visages sans se soucier de maintenir un écart.</em>"</p>
<p>Et il a dit : "<em>Il lui est permis de se couvrir le visage avec ce qui est en contact direct avec la peau ؛ à l'exception du niqâb et du burqu’</em>." Fin de citation.<a href="#fn10" class="footnote-ref" id="fnref10" role="doc-noteref"><sup>10</sup></a></p>
<p><strong>Le cinquième point parmi les interdictions de l'état d'Ihrâm :</strong> le parfum. Il est ainsi interdit au Mouhrim (celui qui est en état de sacralisation) d'utiliser du parfum ou d'en faire usage sur son corps ou sur son vêtement, ou de l'utiliser dans sa nourriture ou sa boisson. Car le Prophète <span dir="rtl">ﷺ</span> a ordonné à Ya’lâ ibn Oumayyah de laver le parfum et d'enlever la Djoubbah (une longue tunique)<a href="#fn11" class="footnote-ref" id="fnref11" role="doc-noteref"><sup>11</sup></a>.</p>
<p>Il a également dit au sujet du Mouhrim dont la monture avait brisé le cou :</p>
<p class="ar"><span dir="rtl">«وَلَا تُحَنِّطُوهُ»</span></p>
<p>"<em><strong>Ne l'embaumez pas (avec des parfums)</strong></em>".</p>
<p>Ces deux récits sont rapportés de manière authentique par Al-Boukhârî et Mouslim، et dans la version de Mouslim :</p>
<p class="ar"><span dir="rtl">«وَلَا تَمَسُّوهُ بِطِيبٍ»</span></p>
<p>"<em><strong>Et ne lui faites pas toucher de parfum</strong></em>".<a href="#fn12" class="footnote-ref" id="fnref12" role="doc-noteref"><sup>12</sup></a></p>
<p>La sagesse derrière l'interdiction du parfum pour celui qui est en état de sacralisation (Al-Muhrim) est qu'il s'éloigne du luxe, de la parure de ce bas-monde ainsi que de ses plaisirs, et qu'il se tourne vers l'au-delà.</p>
<p>Il n'est pas permis au Muhrim de chercher délibérément à sentir du parfum, ni de s'enduire le corps avec des substances parfumées.</p>
<p><strong>Le sixième parmi les interdits de l'état de sacralisation (Al-Ihrâm) est :</strong> tuer le gibier terrestre ou le chasser. Cela, conformément à la parole du Très-Haut :</p>
<p class="ar"><span dir="ltr">﴿</span><strong><span dir="rtl">يَأَيُّهَا الَّذِينَ ءَامَنُوا لَا تَقْتُلُوا الصَّيْدَ وَأَنْتُمْ حُرُمٌ</span></strong><span dir="rtl">﴾ [المائدة: ٩٥]</span></p>
<p>{<em><strong>Ô les croyants ! Ne tuez pas de gibier alors que vous êtes en état de sacralisation</strong></em>} [Al-Mâ’idah : 95]</p>
<p>c’est-à-dire en état de sacralisation pour le Hajj ou la 'Omrah.</p>
<p>Et selon Sa parole :</p>
<p class="ar"><span dir="ltr">﴿</span><strong><span dir="rtl">وَحُرِّمَ عَلَيْكُمْ صَيْدُ الْبَرِّ مَا دُمْتُمْ حُرُمًا</span></strong><span dir="rtl">﴾ [المائدة: ٩٦]</span></p>
<p>{<em><strong>Et la chasse à terre vous est interdite tant que vous êtes en état de sacralisation</strong></em>} [Al-Mâ’idah : 96]</p>
<p>c’est-à-dire qu’il vous est interdit de chasser le gibier terrestre tant que vous êtes en état de sacralisation. Ainsi, la personne en état d’Ihram ne chasse pas de gibier terrestre , n'apporte aucune aide pour la chasse et ne l'égorge pas.</p>
<p>Il est également interdit à la personne en état de sacralisation de manger ce qu'elle a elle-même chassé ، ou ce qui a été chassé pour elle (à son intention) ، ou ce pour quoi elle a aidé à la chasse ، car cela est considéré comme une bête morte (non licite).</p>
<p>Quant à la pêche en mer ، elle n'est pas interdite à la personne en état de sacralisation ، conformément à la parole du Très-Haut :</p>
<p class="ar"><span dir="ltr">﴿</span><strong><span dir="rtl">أُحِلَّ لَكُمْ صَيْدُ الْبَحْرِ وَطَعَامُهُ</span></strong><span dir="rtl">﴾ [المائدة: ٩٦]</span></p>
<p>{<em><strong>La pêche en mer vous est permise ، ainsi que d'en manger</strong></em>} [Al-Mâ’idah : 96].</p>
<p>Il ne lui est pas non plus interdit d'égorger les animaux domestiques ، tels que le poulet ou le bétail (ovins, bovins, camelins) ، car ils ne sont pas considérés comme du gibier.</p>
<p>De même ، il ne lui est pas interdit de tuer les animaux dont la consommation est prohibée (les prédateurs) ، comme le lion ou le tigre ، parmi ceux qui représentent un danger pour les gens. Enfin ، il ne lui est pas interdit de tuer l'animal agresseur (As-Sâ’il) pour défendre sa propre personne ou ses biens.</p>
<p>Et si la personne en état de sacralisation (<strong>Muhrim</strong>) a besoin de commettre l'un des interdits de l'état d'<strong>Ihram</strong>, qu'elle le commette et s'acquitte d'une compensation (<strong>Fidya</strong>) ; en vertu de la parole du Très-Haut :</p>
<p class="ar"><span dir="ltr">﴿</span><strong><span dir="rtl">فَمَن كَانَ مِنكُم مَّرِيضًا أَوْ بِهِ أَذًى مِّن رَّأْسِهِ فَفِدْيَةٌ مِّن صِيَامٍ أَوْ صَدَقَةٍ أَوْ نُسُكٍ</span></strong><span dir="rtl">﴾ [البقرة : ١٩٦]</span></p>
<p><strong>{<em>Quiconque d'entre vous est malade ou souffre d'une affection de la tête (doit se racheter) par un jeûne, une aumône ou un sacrifice.</em>}</strong> [La Vache (Al-Baqarah) : 196].</p>
<p><strong>Le septième des interdits de l'état de sacralisation (Ihram) est :</strong> <strong>la conclusion du contrat de mariage</strong>. Ainsi, [le pèlerin] ne doit conclure de mariage ni pour lui-même, ni pour autrui par tutelle (<strong>wilaya</strong>) ou par procuration (<strong>wakala</strong>). Ceci en raison de ce que Muslim a rapporté d'après 'Uthman :</p>
<p class="ar"><strong><span dir="rtl">«لا يَنْكِحُ المُحْرِمُ ولا يُنْكَحُ»</span></strong></p>
<p><strong>"Celui qui est en état d'Ihram ne se marie pas et on ne le marie pas"</strong><a href="#fn13" class="footnote-ref" id="fnref13" role="doc-noteref"><sup>13</sup></a>.</p>
<p><strong>Le huitième point parmi les interdits de l'état de sacralisation :</strong> le rapport charnel ، en raison de la parole d'Allah — qu'Il soit Exalté — :</p>
<p class="ar"><span dir="ltr">﴿</span><strong><span dir="rtl">فَمَن فَرَضَ فِيهِنَّ الْحَجَّ فَلَا رَفَثَ</span></strong><span dir="rtl">﴾ [البقرة : ١٩٧]</span></p>
<p>{<em><strong>Quiconque s'est imposé le Hajj durant ces mois ne doit avoir ni rapport sexuel...</strong></em>} [Al-Baqara : 197].</p>
<p>Ibn 'Abbâs a dit : « <em>Il s'agit du coït (l'acte sexuel).</em> »<a href="#fn14" class="footnote-ref" id="fnref14" role="doc-noteref"><sup>14</sup></a></p>
<p>Ainsi, quiconque a un rapport sexuel avant la première désacralisation (<em>At-Tahallul Al-Awwal</em>) ، son rite est annulé. Il est toutefois tenu de le poursuivre et d'en accomplir les rituels ، conformément à la parole d'Allah — qu'Il soit Exalté — :</p>
<p class="ar"><span dir="ltr">﴿</span><strong><span dir="rtl">وَأَتِمُّوا الْحَجَّ وَالْعُمْرَةَ لِلَّهِ</span></strong><span dir="rtl">﴾ [البقرة : ١٩٦]</span></p>
<p>{<em><strong>Et accomplissez pour Allah le Hajj et l'Omra</strong></em>} [Al-Baqara : 196].</p>
<p>Il lui incombe également de le rattraper l'année suivante ، et il doit sacrifier une chamelle (<em>Badana</em>).</p>
<p>Si le rapport charnel a lieu après la première désacralisation ، son rite n'est pas annulé ، mais il doit sacrifier un ovin (un mouton ou une chèvre).</p>
<p><strong>Le neuvième point parmi les interdictions de l'état d'Ihram</strong> est le contact physique (attouchements) sans rapport sexuel. Il n'est pas permis au pèlerin en état d'Ihram d'avoir des contacts physiques avec la femme, car cela constitue un moyen menant à l'acte sexuel interdit. <strong>Par "contact physique" (mubâshara), on entend le fait de toucher la femme avec désir.</strong></p>
<p>Le pèlerin doit s'écarter de la grossièreté (Ar-Rafath), de la perversité (Al-Fusûq) et de la polémique (Al-Jidâl). Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="ltr">﴿</span><strong><span dir="rtl">فَمَن فَرَضَ فِيهِنَّ ٱلۡحَجَّ فَلَا رَفَثَ وَلَا فُسُوقَ وَلَا جِدَالَ فِي ٱلۡحَجِّ</span></strong><span dir="rtl">﴾ [البقرة: ١٩٧]</span></p>
<p>{<em><strong>Quiconque s'est imposé le Pèlerinage durant ces mois, ne doit alors avoir ni rapport sexuel, ni perversité, ni dispute pendant le Pèlerinage.</strong></em>} [Al-Baqarah : 197].</p>
<p>Par "Rafath", on désigne le rapport sexuel, et ce terme s'applique également à tout ce qui y mène comme les attouchements, les baisers, les clins d'œil et les paroles évoquant l'acte sexuel. La perversité (Al-Fusûq) désigne les péchés, car les péchés commis en état d'Ihram sont plus graves et plus laids, étant donné que le serviteur est dans un état de supplication.</p>
<p>La polémique (Al-Jidâl) consiste à polémiquer sur ce qui ne regarde pas la personne, à se disputer avec ses compagnons, à se quereller ou à s'insulter. Quant à la discussion visant à clarifier la vérité, à ordonner le bien ou à interdire le mal, elle est ordonnée.</p>
<p>Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="ltr">﴿</span><strong><span dir="rtl">وَجَٰدِلۡهُم بِٱلَّتِي هِيَ أَحۡسَنُ</span></strong><span dir="rtl">﴾ [النحل: ١٢٥]</span></p>
<p>{<em><strong>Et discute avec eux de la meilleure façon.</strong></em>} [An-Nahl : 125].</p>
<p>⁕ Il est recommandé (Sunna) au pèlerin en état de sacralisation (Muhrim) de peu parler, sauf pour ce qui est utile. Il est rapporté dans les deux recueils authentiques (<em>Al-Sahihayn</em> : Al-Bukhari et Muslim), d'après Abu Hurayrah :</p>
<p class="ar"><strong><span dir="rtl">«مَنْ كَانَ يُؤْمِنُ بِاللَّهِ وَاليَوْمِ الآخِرِ؛ فَلْيَقُلْ خَيْراً أَوْ لِيَصْمُتْ»</span></strong></p>
<p><em><strong>"Celui qui croit en Allah et au Jour Dernier, qu'il dise du bien ou qu'il se taise."</strong></em> <a href="#fn15" class="footnote-ref" id="fnref15" role="doc-noteref"><sup>15</sup></a></p>
<p>Et il est également rapporté de lui (Abu Hurayrah), dans une parole attribuée au Prophète (Marfu') :</p>
<p class="ar"><strong><span dir="rtl">«مِنْ حُسْنِ إِسْلَامِ المَرْءِ تَرْكُهُ مَا لَا يَعْنِيهِ»</span></strong></p>
<p><strong>"<em>Parmi les preuves de la beauté de l'Islam d'une personne, il y a le fait qu'elle délaisse ce qui ne la regarde pas.</em>"</strong> <a href="#fn16" class="footnote-ref" id="fnref16" role="doc-noteref"><sup>16</sup></a></p>
<p>⁕ Il est recommandé au pèlerin en état de sacralisation (Muhrim) de s'occuper par la Talbiya, l'évocation d'Allah (Dhikr), la lecture du Coran, le fait d'ordonner le bien et d'interdire le mal. Il doit également préserver son temps de tout ce qui pourrait le gâcher, vouer une intention sincère à Allah et aspirer à ce qui se trouve auprès de Lui. En effet, il se trouve dans un état d'Ihram, s'apprête à accomplir un acte d'adoration immense et arrive vers des lieux sacrés ainsi que des stations bénies.</p>
<p>⁕ Lorsqu'il arrive à la Mecque, s'il est en état de sacralisation pour le <em>Tamattou'</em> (pèlerinage précédé d'une 'Omra), il accomplit alors les rites de la 'Omra :</p>
<p>- Il effectue sept tours autour de la Maison (la Ka'ba).</p>
<p>- Il prie ensuite deux unités de prière (rak'at). Le mieux est de les accomplir au niveau de la Station d'Ibrahim (Maqâm Ibrâhîm) si cela est possible, sinon, il les accomplit n'importe où dans la Mosquée.</p>
<p>- Ensuite, il sort vers As-Safâ pour accomplir le parcours (As-Sa'y) entre celui-ci et Al-Marwa. Il effectue sept trajets entre les deux : il commence par As-Safâ et termine par Al-Marwa. L'aller compte pour un trajet et le retour pour un trajet.</p>
<p>Durant les tours de Tawâf et les trajets de Sa'y, il s'occupe par l'invocation (Dou'â) et la supplication envers Allah, Gloire à Lui.</p>
<p>- Lorsqu'il termine le septième trajet, l'homme coupe ses cheveux sur l'ensemble de sa tête (raccourcissement), et la femme coupe de l'extrémité de ses cheveux la longueur d'une phalange.</p>
<p>⁕ C'est ainsi que s'achèvent les rites de la 'Omra. Le pèlerin quitte alors son état de sacralisation (Ihram) ; tout ce qui lui était interdit durant l'Ihram lui devient alors licite : les rapports avec les femmes, le parfum, le port de vêtements cousus, la coupe des ongles, la taille de la moustache et l'épilation des aisselles s'il en a besoin. Il reste ainsi hors de l'état de sacralisation (halâl) jusqu'au jour de <em>At-Tarwiya</em> (le 8ème jour de Dhul-Hijja), puis il entrera de nouveau en état d'Ihram pour le Hajj selon les détails qui suivront — si Allah le veut.</p>
<p>⁕ Quant à celui qui arrive à la Mecque en mode <em>Qârin</em> (Hajj et 'Omra liés) ou <em>Mufrid</em> (Hajj seul), il effectue alors le Tawâf d'arrivée (Tawâf Al-Qudoûm). S'il le souhaite, il peut faire suivre ce Tawâf par le parcours (Sa'y) du Hajj par anticipation. Il doit ensuite rester en état de sacralisation (Ihram) jusqu'au jour du Sacrifice (Yawm An-Nahr, le 10ème jour), comme cela sera détaillé plus loin — si Allah le veut.</p>
