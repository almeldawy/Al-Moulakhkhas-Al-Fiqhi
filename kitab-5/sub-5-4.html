<p>⁕ Le Hajj comporte un mérite immense et une récompense abondante.</p>
<p>At-Tirmidhi a rapporté, en l'authentifiant, d'après Ibn Mas'ûd, une parole prophétique (marfû') :</p>
<p class="ar"><span dir="rtl">« تَابِعُوا بَيْنَ الحَجِّ وَالعُمْرَةِ؛ فَإِنَّهُمَا يَنْفِيَانِ الفَقْرَ وَالذُّنُوبَ كَمَا يَنْفِي الكِيرُ خَبَثَ الحَدِيدِ وَالذَّهَبِ وَالفِضَّةِ، وَلَيْسَ لِلحَجِّ المَبْرُورِ ثَوَابٌ إِلَّا الجَنَّةُ »</span></p>
<p>« <em>Faites suivre le Hajj et la 'Umrah ، car ils bannissent la pauvreté et les péchés comme le soufflet élimine les impuretés du fer ، de l'or et de l'argent. Et le Hajj mabrûr (accepté) n'a d'autre récompense que le Paradis.</em> »<a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a></p>
<p>Et dans le "Sahîh", d'après 'Aïcha (qu'Allah l'agrée) ، elle a dit : « Nous considérons que le Jihad est la meilleure des œuvres ؛ ne devrions-nous pas l'accomplir ? » Il répondit :</p>
<p class="ar"><span dir="rtl">« لَكِنَّ أَفْضَلَ الجِهَادِ حَجٌّ مَبْرُورٌ »</span></p>
<p>« Certes , mais le meilleur des Jihad est un Hajj mabrûr. »<a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a></p>
<p><strong>Le Hajj mabrûr est celui qui n'est entaché par aucun péché , dont les règles ont été accomplies de manière complète et de la façon la plus parfaite. Il a été dit aussi : c'est celui qui est accepté (par Allah).</strong></p>
<p>⁕ Lorsque sa détermination à accomplir le Hajj est confirmée ، il doit se repentir de tous les péchés ، se libérer des injustices en restituant les droits à leurs propriétaires ، rendre les dépôts ، les objets empruntés et les dettes qu'il a envers les gens. Il doit demander le pardon de ceux envers qui il a commis une injustice ، rédiger son testament et mandater quelqu'un pour s'acquitter des droits qu'il n'a pas pu régler lui-même. Il doit également assurer à ses enfants et aux personnes à sa charge de quoi subvenir à leurs besoins jusqu'à son retour. Il doit veiller à ce que son financement soit licite (halal) et emporter suffisamment de provisions et d'argent pour ne pas avoir à dépendre d'autrui et pour que sa subsistance soit bonne.</p>
<p>Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿يَاأَيُّهَا الَّذِينَ آمَنُوا أَنفِقُوا مِن طَيِّبَاتِ مَا كَسَبْتُمْ﴾ [البَقَرَة: ٢٦٧]</span></p>
<p>« <em><strong>Ô vous qui croyez ! Dépensez des meilleures choses que vous avez acquises</strong></em> » [Al-Baqarah : 267].</p>
<p>Enfin, il doit s'efforcer de trouver un compagnon pieux pour l'aider dans son voyage et l'accomplissement de ses rites ; un compagnon qui le guidera s'il s'égare et lui rappellera ses devoirs s'il oublie.</p>
<p>⁕ Il est obligatoire de rectifier son intention en ne recherchant, à travers son pèlerinage, que la Face d'Allah. Il doit faire preuve de douceur et de bon comportement. Il doit éviter les disputes et de gêner les gens sur les chemins (ou les routes). Il doit préserver sa langue des insultes, de la médisance et de tout ce qui déplaît à Allah et à Son Messager.</p>
