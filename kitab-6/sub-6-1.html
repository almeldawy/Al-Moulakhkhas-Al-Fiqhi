<h2 id="بسم-الله-الرحمن-الرحيم"><span dir="rtl">بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ</span></h2>
<p></p>
<p><strong>Chapitre sur les règles du Jihad</strong></p>
<p>⁕ Allah a légiféré le Jihad dans Son sentier <strong>pour élever Sa parole, secourir Sa religion et repousser Ses ennemis</strong>، Il l'a également <strong>légiféré comme une épreuve et un test pour Ses serviteurs</strong>.</p>
<p class="ar"><span dir="rtl">﴿ ذَلِكَ وَلَوْ يَشَاءُ اللَّهُ لَانْتَصَرَ مِنْهُمْ وَلَكِنْ لِيَبْلُوَ بَعْضَكُمْ بِبَعْضٍ وَالَّذِينَ قُتِلُوا فِي سَبِيلِ اللَّهِ فَلَنْ يُضِلَّ أَعْمَالَهُمْ ۝ سَيَهْدِيهِمْ وَيُصْلِحُ بَالَهُمْ ۝ وَيُدْخِلُهُمُ الْجَنَّةَ عَرَّفَهَا لَهُمْ ﴾ [محمد]</span></p>
<p>« <em><strong>Il en est ainsi. Si Allah voulait, Il se vengerait Lui-même d'eux ; mais c'est pour vous éprouver les uns par les autres. Et ceux qui seront tués dans le sentier d'Allah, Il ne rendra jamais vaines leurs actions. Il les guidera et améliorera leur condition، et les fera entrer au Paradis qu'Il leur aura fait connaître.</strong></em> » [Sourate Muhammad]</p>
<p>⁕ Le Jihad dans le sentier d'Allah revêt une importance capitale en Islam ; il constitue en effet le sommet de l'Islam. C'est l'un des meilleurs actes d'adoration, et <strong>certains savants l'ont même considéré comme le sixième pilier de l'Islam</strong>.</p>
<p>⁕ Le Jihad dans le sentier d'Allah est légiféré par le Livre (le Coran), la Sunna et le consensus (Ijma').</p>
<p>Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿كُتِبَ عَلَيْكُمُ الْقِتَالُ﴾ [البقرة: ٢١٦]</span></p>
<p>« <strong>Le combat vous a été prescrit</strong> » [Sourate Al-Baqarah : 216].</p>
<p>Le Prophète <span dir="rtl">ﷺ</span> l'a pratiqué et l'a ordonné.</p>
<p>Le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="rtl">«مَنْ مَاتَ وَلَمْ يَغْزُ وَلَمْ يُحَدِّثْ نَفْسَهُ بِالْغَزْوِ؛ مَاتَ عَلَى شُعْبَةٍ مِنَ النِّفَاقِ».</span></p>
<p>« <em><strong>Quiconque meurt sans avoir combattu (pour la cause d'Allah) et sans en avoir eu l'intention en lui-même, meurt sur une branche de l'hypocrisie.</strong></em> »<a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a></p>
<p>⁕ Le mot <em>Jihad</em> est le nom d'action (masdar) du verbe <em>jahada</em>, qui signifie : faire des efforts intenses dans le combat contre son ennemi. (<span dir="rtl">بَالَغَ فِي قِتَالِ عَدُوِّه</span>ِ)</p>
<p><strong>En terme juridique (Shar'an) :</strong> Il désigne le combat contre les mécréants.</p>
<p>Le terme Jihad s'emploie également dans un sens plus large que celui du simple combat physique.</p>
<p>⁕ L'illustre savant Ibn al-Qayyim a dit <a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a> : « <em>La pratique du Jihad est une obligation individuelle (fard 'ayn) : soit par le cœur, soit par la langue, soit par les biens, soit par la main ; il incombe donc à chaque musulman de mener le Jihad par l'une de ces formes.</em> » Fin de citation.</p>
<p>⁕ Le terme « Jihad » s'applique également à la lutte contre l'âme (le moi), contre le Diable et contre les pervers :</p>
<ul>
<li><blockquote>
<p><strong>La lutte contre l'âme</strong> : elle consiste à apprendre les préceptes de la religion, puis à les mettre en pratique, et enfin à les enseigner.</p>
</blockquote></li>
<li><blockquote>
<p><strong>La lutte contre le Diable</strong> : elle consiste à repousser les ambiguïtés (doutes) qu'il apporte et les désirs qu'il embellit.</p>
</blockquote></li>
<li><blockquote>
<p><strong>La lutte contre les mécréants</strong> : elle s'effectue par la main, les biens, la langue et le cœur.</p>
</blockquote></li>
<li><blockquote>
<p><strong>La lutte contre les pervers</strong> : elle s'effectue par la main, puis par la langue, puis par le cœur ; selon la capacité de chacun en fonction des degrés de la réprobation du mal.</p>
</blockquote></li>
</ul>
<p>⁕ <strong>Le Jihad est une obligation communautaire (fard kifaya)</strong> : Si un nombre suffisant de personnes s'en acquitte : l'obligation tombe pour les autres. Pour le reste de la communauté : cela demeure alors une pratique recommandée (sunna).</p>
<p>⁕ C'est (le Jihad) le meilleur des actes accomplis volontairement, et son mérite est immense. Les textes du Livre (le Coran) et de la Sunna qui l'ordonnent et qui incitent à sa pratique sont très nombreux.</p>
<p>Parmi eux, la parole d'Allah le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿ إِنَّ اللَّهَ اشْتَرَىٰ مِنَ الْمُؤْمِنِينَ أَنفُسَهُمْ وَأَمْوَالَهُم بِأَنَّ لَهُمُ الْجَنَّةَ ۚ يُقَاتِلُونَ فِي سَبِيلِ اللَّهِ فَيَقْتُلُونَ وَيُقْتَلُونَ ۖ وَعْدًا عَلَيْهِ حَقًّا فِي التَّوْرَاةِ وَالْإِنجِيلِ وَالْقُرْآنِ ۚ وَمَنْ أَوْفَىٰ بِعَهْدِهِ مِنَ اللَّهِ ۚ فَاسْتَبْشِرُوا بِبَيْعِكُمُ الَّذِي بَايَعْتُم بِهِ ۚ وَذَٰلِكَ هُوَ الْفَوْزُ الْعَظِيمُ ﴾ [التوبة: ١١١].</span></p>
<p>« <em><strong>Certes, Allah a acheté aux croyants leurs personnes et leurs biens en échange du Paradis. Ils combattent dans le sentier d'Allah : ils tuent, et ils sont tués. C'est une promesse authentique qu'Il a prise sur Lui-même dans la Thora, l'Évangile et le Coran. Et qui est plus fidèle qu'Allah à son engagement ? Réjouissez-vous donc de l'échange que vous avez fait. Et c'est là le très grand succès.</strong></em> » [Sourate At-Tawbah : 111]</p>
<p>⁕ <strong>Il existe des situations où le Jihad devient une obligation individuelle (<em>Wujûban 'Ayniyyan</em>), à savoir :</strong></p>
<ol type="1">
<li><blockquote>
<p><strong>Premièrement :</strong> S'il est présent sur le lieu du combat ; il a alors l'obligation de combattre et il ne lui est pas permis de s'en aller.</p>
</blockquote></li>
<li><blockquote>
<p><strong>Deuxièmement :</strong> Si l'ennemi se présente devant sa ville.</p>
</blockquote></li>
</ol>
<p>Car dans ces deux cas, il s'agit d'un Jihad de défense (<em>Jihâd Daf'</em>) et non d'un Jihad de conquête (<em>Jihâd Talab</em>). S'il s'en détournait, les mécréants s'empareraient des choses sacrées des musulmans.</p>
<ol start="3" type="1">
<li><blockquote>
<p><strong>Troisièmement :</strong> Si les musulmans ont besoin de lui pour le combat et la défense.</p>
</blockquote></li>
<li><blockquote>
<p><strong>Quatrièmement :</strong> Si le gouverneur (<em>Al-Imâm</em>) l'appelle à la mobilisation ; ceci conformément à la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
</blockquote></li>
</ol>
<p class="ar"><span dir="rtl">«وَإِذَا اسْتُنْفِرْتُمْ؛ فَانْفِرُوا»</span></p>
<p>« <em><strong>Et si l'on vous appelle à la mobilisation, alors mobilisez-vous</strong></em> ». <a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a></p>
<p>Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿يَا أَيُّهَا الَّذِينَ آمَنُوا إِذَا لَقِيتُمْ فِئَةً فَاثْبُتُوا﴾ [الأنفال: ٤٥]</span></p>
<p>« <em><strong>Ô vous qui croyez ! Lorsque vous rencontrez une troupe (ennemie), soyez fermes</strong></em> » [Sourate Al-Anfâl : 45].</p>
<p>Et Il a dit :</p>
<p class="ar"><span dir="rtl">﴿مَا لَكُمْ إِذَا قِيلَ لَكُمُ انْفِرُوا فِي سَبِيلِ اللَّهِ اثَّاقَلْتُمْ إِلَى الْأَرْضِ﴾ [التوبة: ٣٨]</span></p>
<p>« <em><strong>Qu'avez-vous ? Quand on vous dit : "Lancez-vous au combat dans le sentier d'Allah", vous vous appesantissez sur la terre</strong></em> » [Sourate At-Tawbah : 38].</p>
<p><strong>Le Cheikh de l'Islam Ibn Taymiyyah (qu'Allah lui fasse miséricorde) a dit</strong> <a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a> <strong>:</strong> « <em>Le Jihad comprend ce qui se fait par la main, ainsi que ce qui se fait par la prédication (Da'wah), l'argumentation (Hujjah), la parole, l'opinion, l'organisation et l'industrie. Il est donc obligatoire selon la mesure de ses capacités. Et il incombe à ceux qui restent en arrière pour une excuse valable de remplacer les combattants auprès de leurs familles et de leurs biens.</em> » Fin de citation.</p>
<p>⁕ Il incombe au dirigeant (<em>l'Imam</em>) de passer l'armée en revue au moment du départ pour le Jihad. Il doit écarter tout ce qui n'est pas apte à la guerre, qu'il s'agisse d'hommes, de chevaux ou d'autres moyens. À ce titre, il doit interdire la participation :</p>
<ul>
<li><blockquote>
<p><strong>Du défaitiste (<em>Al-Mukhadhil</em>)</strong> : celui qui décourage les gens de combattre et les en détourne.</p>
</blockquote></li>
<li><blockquote>
<p><strong>De l'alarmiste (<em>Al-Murjif</em>)</strong> : celui qui cherche à effrayer les combattants.</p>
</blockquote></li>
<li><blockquote>
<p><strong>De l'espion ou du semeur de troubles</strong> : celui qui fait fuiter des informations à l'ennemi ou qui provoque la discorde (<em>fitna</em>) au sein des rangs.</p>
</blockquote></li>
</ul>
<p>Enfin, il doit nommer à la tête des combattants un chef capable de diriger l'armée selon la politique religieuse (<em>as-siyâsah ash-shar‘iyyah</em>).</p>
<p>⁕ Il est obligatoire pour l'armée :</p>
<ul>
<li><blockquote>
<p><strong>De lui obéir (au chef) dans le bien</strong> ;</p>
</blockquote></li>
<li><blockquote>
<p><strong>De lui être de bon conseil</strong> ;</p>
</blockquote></li>
<li><blockquote>
<p><strong>Et de faire preuve de patience à ses côtés</strong> ;</p>
</blockquote></li>
</ul>
<p>Ceci conformément à la parole d'Allah le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿يَا أَيُّهَا الَّذِينَ آمَنُوا أَطِيعُوا اللَّهَ وَأَطِيعُوا الرَّسُولَ وَأُولِي الْأَمْرِ مِنكُمْ﴾ [النساء: ٥٩]</span></p>
<p>« <em><strong>Ô vous qui croyez ! Obéissez à Allah, obéissez au Messager et à ceux d'entre vous qui détiennent le commandement</strong></em> » [Sourate An-Nisa : 59].</p>
<p>⁕ <strong>Certes, le Jihad en Islam a été légiféré pour des objectifs élevés et une finalité noble :</strong></p>
<p><strong>⁓ Allah a légiféré le Jihad pour délivrer les serviteurs de l'adoration des faux dieux (<em>Tawâghît</em>) et des idoles vers l'adoration d'Allah Seul, sans aucun associé, Lui qui les a créés et leur a accordé leur subsistance.</strong> Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿وَقَاتِلُوهُمْ حَتَّىٰ لَا تَكُونَ فِتْنَةٌ وَيَكُونَ الدِّينُ كُلُّهُ لِلَّهِ﴾ [الأنفال: ٣٩]</span></p>
<p>« <em><strong>Et combattez-les jusqu'à ce qu'il n'y ait plus d'association (fitna) et que la religion soit entièrement à Allah.</strong></em> » [Sourate Al-Anfâl : 39].</p>
<p><strong>⁓ Allah a légiféré le Jihad pour dissiper l'injustice et rendre les droits à ceux qui les méritent.</strong> Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿أُذِنَ لِلَّذِينَ يُقَاتَلُونَ بِأَنَّهُمْ ظُلِمُوا ۚ وَإِنَّ اللَّهَ عَلَىٰ نَصْرِهِمْ لَقَدِيرٌ ۝ الَّذِينَ أُخْرِجُوا مِن دِيَارِهِم بِغَيْرِ حَقٍّ إِلَّا أَن يَقُولُوا رَبُّنَا اللَّهُ﴾ [الحج: ٣٩، ٤٠]</span></p>
<p>« <em><strong>Autorisation est donnée à ceux qui sont attaqués (de se défendre) parce qu'ils ont été injustement opprimés ; et Allah est certes Capable de les secourir. Ceux qui ont été expulsés de leurs demeures contre toute justice, simplement parce qu'ils disaient : "Allah est notre Seigneur".</strong></em> » [Sourate Al-Hajj : 39, 40].</p>
<p><strong>⁓ Le Jihad a été légiféré pour humilier les mécréants, se venger d'eux et affaiblir leur puissance.</strong> Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿قَاتِلُوهُمْ يُعَذِّبْهُمُ اللَّهُ بِأَيْدِيكُمْ وَيُخْزِهِمْ وَيَنصُرْكُمْ عَلَيْهِمْ وَيَشْفِ صُدُورَ قَوْمٍ مُّؤْمِنِينَ ۝ وَيُذْهِبْ غَيْظَ قُلُوبِهِمْ ۗ وَيَتُوبُ اللَّهُ عَلَىٰ مَن يَشَاءُ ۗ وَاللَّهُ عَلِيمٌ حَكِيمٌ﴾ [التوبة: ١٤، ١٥]</span></p>
<p>« <em><strong>Combattez-les. Allah, par vos mains, les châtiera, les couvrira d'ignominie, vous donnera la victoire sur eux et guérira les poitrines d'un peuple croyant. Et Il fera disparaître la colère de leurs cœurs. Allah accueille le repentir de qui Il veut. Et Allah est Omniscient et Sage.</strong></em> » [Sourate At-Tawbah : 14, 15].</p>
<p>⁕ Le combat ne survient qu'après la transmission de l'appel (à l'Islam), tout comme le Messager <span dir="rtl">ﷺ</span> appelait les gens à l'Islam avant de combattre, écrivait aux rois à ce sujet et recommandait aux chefs des armées islamiques d'inviter les gens à l'Islam avant de les affronter. S'ils répondaient favorablement, (on cessait), sinon, ils les combattaient.</p>
<p>Cela s'explique par le fait que le but du combat en Islam est de dissiper la mécréance (kufr) et l'association (shirk), et de permettre l'entrée dans la religion d'Allah. Par conséquent, si cet objectif est atteint sans combat, le recours à la force n'est plus nécessaire. Et Allah est plus savant.</p>
<p>⁕ Le Jihad possède des règles détaillées que l'on peut trouver dans les ouvrages plus approfondis (les livres volumineux).</p>
<p>⁕ Si ses deux parents sont musulmans et libres (ou l'un des deux), il ne doit pas s'engager dans un Jihad volontaire (<em>tatawwu'</em>) sans leur permission. Cela s'appuie sur la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«فَفِيهِمَا فَجَاهِدْ»</span></p>
<p>« <em><strong>C'est en t'occupant d'eux que tu dois lutter (faire le Jihad)</strong></em> ».<a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a></p>
<p>La raison en est que la piété filiale (<em>birr</em>) envers eux est une obligation individuelle (<em>fard 'ayn</em>), alors que le Jihad est une obligation communautaire (<em>fard kifaya</em>). Or, l'obligation individuelle prime sur l'obligation communautaire.</p>
<p>⁕ Il incombe au dirigeant des musulmans (<em>l'Imam</em>) de passer l'armée en revue au moment du départ. Il doit écarter ceux qui ne sont pas aptes au combat, qu'il s'agisse d'hommes ou de chevaux. Cela inclut :</p>
<ul>
<li><blockquote>
<p>Le défaitiste (<em>Al-Mukhadhil</em>) et l'alarmiste (<em>Al-Murjif</em>) : ceux qui découragent les gens de combattre.</p>
</blockquote></li>
<li><blockquote>
<p>Ceux qui cherchent à susciter le désintérêt pour le combat, à effrayer les musulmans.</p>
</blockquote></li>
<li><blockquote>
<p>Ceux qui propagent des nouvelles et des rumeurs de nature à terrifier les soldats.</p>
</blockquote></li>
</ul>
<p>⁕ Il incombe à l'Imam de nommer les commandants des armées. Il doit également accorder une part supplémentaire du butin (nafl) à ceux dont l'attribution présente un intérêt pour le Jihad. Enfin, il doit répartir le reste des butins entre l'ensemble des membres de l'armée.</p>
<p>⁕ L'armée a l'obligation :</p>
<ul>
<li><blockquote>
<p><strong>D'obéir à son commandant dans ce qui est convenable</strong> ;</p>
</blockquote></li>
<li><blockquote>
<p><strong>De lui être de bon conseil</strong> ;</p>
</blockquote></li>
<li><blockquote>
<p><strong>Et de faire preuve de patience à ses côtés</strong> ;</p>
</blockquote></li>
</ul>
<p>Ceci conformément à la parole d'Allah le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿يَا أَيُّهَا الَّذِينَ آمَنُوا أَطِيعُوا اللَّهَ وَأَطِيعُوا الرَّسُولَ وَأُولِي الْأَمْرِ مِنكُمْ﴾ [النساء: ٥٩]</span></p>
<p>« <em><strong>Ô vous qui croyez ! Obéissez à Allah, obéissez au Messager et à ceux d'entre vous qui détiennent le commandement</strong></em> » [Sourate An-Nisa : 59].</p>
<p>⁕ Il n'est pas permis de tuer l'enfant, la femme, le moine, le vieillard infirme, le malade chronique, ni l'aveugle ; dès lors qu'ils n'ont pas d'influence (sur le combat), qu'ils n'ont pas combattu ou qu'ils n'ont pas incité au combat. Ils deviennent des esclaves par la captivité ; car le Prophète <span dir="rtl">ﷺ</span> réduisait en esclavage les femmes et les enfants lorsqu'il les capturait.</p>
<p>⁕ <strong>Le butin devient une propriété par sa prise de contrôle en territoire de guerre (<em>Dar al-Harb</em>).</strong></p>
<p><strong>Le butin (<em>Al-Ghanimah</em>) désigne les biens pris de force à un ennemi lors d'un combat</strong>, ainsi que ce qui y est assimilé, comme ce qui est obtenu en guise de rançon.</p>
<p><strong>Il appartient à ceux qui ont été présents lors de la bataille parmi les combattants venus avec l'intention de combattre</strong>, qu'ils aient effectivement combattu ou non.</p>
<p><strong>Ceci s'explique par le fait que celui qui est présent constitue un soutien pour les combattants</strong> et se tient prêt au combat ; il est donc assimilé aux combattants actifs.</p>
<p><strong>Cela est conforme à la parole de 'Umar (qu'Allah l'agrée)</strong> :</p>
<p class="ar"><span dir="rtl">«الْغَنِيمَةُ لِمَنْ شَهِدَ الْوَقْعَةَ»</span></p>
<p>« Le butin appartient à celui qui a été présent lors de la bataille ».<a href="#fn6" class="footnote-ref" id="fnref6" role="doc-noteref"><sup>6</sup></a></p>
<p>⁕ <strong>La modalité de distribution du butin :</strong> l'Imam prélève le cinquième (Al-Khoumous) qui appartient à Allah et à Son Messager. Celui-ci est une part destinée aux proches du Messager <span dir="rtl">ﷺ</span>, aux orphelins, aux nécessiteux et aux voyageurs en détresse (Ibn As-Sabil). Ensuite, les quatre cinquièmes restants sont répartis entre les combattants : le fantassin reçoit une part, tandis que le cavalier reçoit trois parts ; une part pour lui-même et deux parts pour son cheval. En effet, le Prophète <span dir="rtl">ﷺ</span> a partagé, lors de la bataille de Khaybar, trois parts pour le cavalier : deux parts pour son cheval et une part pour lui. (Rapporté par Al-Bukhârî et Muslim).<a href="#fn7" class="footnote-ref" id="fnref7" role="doc-noteref"><sup>7</sup></a></p>
<p>⁕ Et le représentant de l'Imam (son délégué) se substitue à lui pour la distribution du butin.</p>
<p>⁕ <strong>Le détournement (Al-Ghulûl) est interdit :</strong> il consiste à dissimuler une partie de ce que le combattant a obtenu comme butin.</p>
<p>Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿وَمَا كَانَ لِنَبِيٍّ أَن يَغُلَّ ۚ وَمَن يَغْلُلْ يَأْتِ بِمَا غَلَّ يَوْمَ الْقِيَامَةِ﴾ [آل عمران: ١٦١]</span></p>
<p><em>« <strong>Il n'appartient pas à un Prophète de détourner du butin. Quiconque détourne quelque chose apportera ce qu'il a détourné le Jour de la Résurrection</strong> »</em> (Sourate Âl 'Imrân, verset 161).</p>
<p>il est obligatoire pour l'Imam de châtier (par une peine de discrétion ou <em>Ta'zîr</em>) celui qui commet un détournement, par la sentence qu'il juge apte à le dissuader, lui ainsi que ses semblables.</p>
<p>⁕ Si le butin est une terre, l'Imam a le choix entre la partager entre ceux qui l'ont conquise ou l'immobiliser en tant que bien de mainmorte (<em>Waqf</em>) pour l'intérêt général des musulmans, tout en imposant sur celle-ci un impôt foncier permanent (<em>Kharâj</em>) qui est perçu auprès de celui qui la détient.</p>
<p>⁕ Ce que les mécréants abandonnent par peur des musulmans, les biens de celui qui n'a pas d'héritier, ainsi que le cinquième du cinquième du butin — qui est la part du Messager d'Allah <span dir="rtl">ﷺ</span> — constituent le Fay’ (biens acquis sans combat), qui doit être dépensé pour l'intérêt général des musulmans.</p>
<p>⁕ Il est permis à l'imam des musulmans de conclure une trêve (<em>Al-Hudnah</em>) avec les mécréants afin de cesser les combats pour une durée déterminée selon le besoin, si la conclusion de ce contrat comporte un intérêt pour les musulmans, et ce, lorsqu'il est permis de différer le Jihad en raison de la faiblesse des musulmans ; car le Prophète <span dir="rtl">ﷺ</span> a conclu une trêve avec les mécréants lors du pacte d'Al-Hudaybiyah et a passé un accord de paix avec les Juifs à Médine. En revanche, si les musulmans sont puissants et capables de mener le Jihad, alors la conclusion d'une trêve n'est pas autorisée.</p>
<p>⁕ Si l'Imam craint une rupture de la trêve de leur part, il doit leur annoncer la fin de celle-ci avant de les combattre, conformément à la parole d'Allah le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿وَإِمَّا تَخَافَنَّ مِن قَوْمٍ خِيَانَةً فَانبِذْ إِلَيْهِمْ عَلَىٰ سَوَاءٍ ۚ إِنَّ اللَّهَ لَا يُحِبُّ الْخَائِنِينَ﴾ [الأنفال: ٥٨]</span></p>
<p><em>« <strong>Et si jamais tu crains une trahison de la part d'un peuple, dénonce alors le pacte (que tu as conclu avec eux) d'une façon équitable. Car Allah n'aime pas les traîtres</strong> »</em> (Sourate Al-Anfâl, verset 58) ; c'est-à-dire : informe-les de la rupture du pacte afin que vous soyez, vous et eux, sur un pied d'égalité quant à la connaissance de cette situation.</p>
<p>⁕ Il est permis à l'Imam de conclure un pacte de protection (<em>Dhimmah</em>) avec les gens du Livre et les Zoroastriens (<em>Al-Majous</em>). Cela signifie qu'ils sont maintenus dans leur religion à condition de s'acquitter de la capitation (<em>Al-Jizyah</em>) et de se soumettre aux lois de l'Islam, conformément à la parole d'Allah le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿قَاتِلُوا الَّذِينَ لَا يُؤْمِنُونَ بِاللَّهِ وَلَا بِالْيَوْمِ الْآخِرِ وَلَا يُحَرِّمُونَ مَا حَرَّمَ اللَّهُ وَرَسُولُهُ وَلَا يَدِينُونَ دِينَ الْحَقِّ مِنَ الَّذِينَ أُوتُوا الْكِتَابَ حَتَّىٰ يُعْطُوا الْجِزْيَةَ عَن يَدٍ وَهُمْ صَاغِرُونَ﴾ [التوبة: ٢٩]</span></p>
<p><em>« <strong>Combattez ceux qui ne croient ni en Allah ni au Jour dernier, qui n'interdisent pas ce qu'Allah et Son Messager ont interdit et qui ne pratiquent pas la religion de vérité, parmi ceux auxquels le Livre a été donné, jusqu'à ce qu'ils versent la capitation par leurs propres mains, après s'être humiliés</strong> »</em> (Sourate At-Tawbah, verset 29).</p>
<p>Ainsi, la <em>Jizyah</em> est un bien prélevé chaque année auprès d'eux dans l'humilité, en contrepartie de leur préservation physique et de leur droit de résidence sur nos terres.</p>
<p>⁕ La capitation (<em>Al-Jizyah</em>) n'est pas prélevée sur l'enfant, ni sur la femme, ni sur l'aliéné, ni sur l'infirme, ni sur l'aveugle, ni sur le vieillard décrépit, pas plus qu'elle n'est perçue auprès de l'indigent incapable de s'en acquitter.</p>
<p>⁕ Dès lors qu'ils s'acquittent de la capitation (<em>Al-Jizyah</em>), il devient obligatoire de l'accepter de leur part, il est désormais interdit de les combattre, et il est impératif de repousser quiconque chercherait à leur nuire. Cela s'appuie sur la parole d'Allah le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿حَتَّىٰ يُعْطُوا الْجِزْيَةَ﴾</span></p>
<p><em>« <strong>...jusqu'à ce qu'ils versent la capitation</strong> »</em>, établissant ainsi le paiement de la <em>Jizyah</em> comme la finalité pour cesser tout combat contre eux. Ceci est également fondé sur la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«فَاسْأَلْهُمْ الْجِزْيَةَ، فَإِنْ أَجَابُوكَ؛ فَاقْبَلْ مِنْهُمْ، وَكُفَّ عَنْهُمْ»</span></p>
<p><em>« <strong>Demande-leur la Jizyah ; s'ils acceptent, alors agrée cela de leur part et cesse tout combat contre eux</strong> »</em>. <a href="#fn8" class="footnote-ref" id="fnref8" role="doc-noteref"><sup>8</sup></a></p>
<p>Et Allah est plus savant.</p>
<p>⁕ Il est permis à tout musulman d'accorder la protection (<em>Al-Amân</em>) à un mécréant pris individuellement, à condition qu'il n'en résulte aucun préjudice pour les musulmans. La preuve en est la parole d'Allah le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿وَإِنْ أَحَدٌ مِّنَ الْمُشْرِكِينَ اسْتَجَارَكَ فَأَجِرْهُ حَتَّىٰ يَسْمَعَ كَلَامَ اللَّهِ ثُمَّ أَبْلِغْهُ مَأْمَنَهُ﴾ [التوبة: ٦]</span></p>
<p><em>« <strong>Et si l'un des associateurs te demande asile, accorde-le lui afin qu'il entende la parole d'Allah, puis fais-le parvenir à son lieu de sécurité</strong> »</em> (Sourate At-Tawbah, verset 6).</p>
<p>⁕ Il est permis à l'Imam d'accorder la protection (<em>Al-Amân</em>) à l'ensemble des polythéistes ou à une partie d'entre eux, car son autorité est générale. Ce droit n'appartient pas aux simples citoyens, à moins que l'Imam ne l'autorise. De même, il est permis au gouverneur d'une province d'accorder cette protection aux habitants d'une localité proche de lui.</p>
<p>Le premier tome s'achève ici avec l'aide d'Allah. Il sera suivi, si Allah le veut, par le second tome, dont le début traitera des règles relatives aux transactions commerciales.</p>
