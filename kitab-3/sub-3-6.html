<p>⁕ Les marchandises (<span dir="rtl">الْعُرُوض</span>ُ) est le pluriel de "<span dir="rtl">عَرْض</span>ٍ", avec un soukoûn sur la lettre "râ". Il désigne tout ce qui est préparé pour la vente et l'achat dans le but de réaliser un profit. Elles ont été nommées ainsi car elles sont exposées (<span dir="rtl">يُعْرَض</span>ُ) pour être vendues et achetées, ou parce qu'elles apparaissent (<span dir="rtl">يُعْرَض</span>ُ) puis disparaissent (cessent d'être en possession du commerçant).</p>
<p>⁕ La preuve de l'obligation de la Zakât sur les marchandises commerciales réside dans :</p>
<p>La parole d'Allah (le Très-Haut) :</p>
<p class="ar"><span dir="ltr">﴿</span><strong><span dir="rtl">خُذْ مِنْ أَمْوَالِهِمْ صَدَقَةً تُطَهِّرُهُمْ وَتُزَكِّيهِم بِهَا</span></strong><span dir="rtl">﴾ [التوبة: ١٠٣]</span></p>
<p>« <em><strong>Prélève de leurs biens une aumône par laquelle tu les purifies et les bénis</strong></em> » [Sourate At-Tawbah : 103].</p>
<p>Et Sa parole (le Très-Haut) :</p>
<p class="ar"><span dir="ltr">﴿</span><strong><span dir="rtl">وَالَّذِينَ فِي أَمْوَالِهِمْ حَقٌّ مَّعْلُومٌ (٢٤) لِّلسَّائِلِ وَالْمَحْرُومِ (٢٥)</span></strong><span dir="rtl">﴾ [المعارج]</span></p>
<p>« <em><strong>Et ceux qui assignent sur leurs biens un droit déterminé (24) au mendiant et au déshérité (25)</strong></em> » [Sourate Al-Ma’ârij].</p>
<p>Comme les marchandises commerciales constituent la majorité des types de biens (richesses), elles sont d'autant plus prioritaires pour être incluses dans la portée générale de ces versets.</p>
<p>De plus, Abû Dâwûd a rapporté d'après Samurah [ibn Jundub] : « <em><strong>Le Prophète <span dir="rtl">ﷺ</span> nous ordonnait de sortir la Zakat de ce que nous préparions pour la vente.</strong></em> »<a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a></p>
<p>Enfin, parce qu'il s'agit de biens productifs (destinés à fructifier), la Zakât y est donc obligatoire, à l'instar du bétail laissé au pâturage (As-Sâ'imah).</p>
<p><strong>Plusieurs [savants] ont rapporté le consensus (<em>ijmâ'</em>) des gens de science sur le fait que la Zakât est due sur les marchandises destinées au commerce dès lors qu'une année (<em>al-hawl</em>) s'est écoulée.</strong></p>
<p><strong>Cheikh al-Islâm Ibn Taymiyyah a dit :</strong> "<em>Les quatre imams ainsi que l'ensemble de la communauté — à l'exception de quelques avis marginaux — sont d'accord sur son obligation pour les marchandises commerciales, que le commerçant soit résident ou voyageur.</em></p>
<p><em>Cela s'applique aussi bien au commerçant <strong>spéculateur</strong> (moutarabbiṣ) — celui qui achète la marchandise quand elle est à bas prix et l'entrepose jusqu'à ce que les cours montent — qu'au commerçant <strong>circulant</strong> (moudîr) — comme les marchands dans les boutiques.</em></p>
<p><em>Peu importe la nature de la marchandise : qu'il s'agisse de tissus (neufs ou d'occasion), de nourriture (denrées de base, fruits ou condiments), de récipients (comme la poterie), ou d'animaux (esclaves, chevaux, mulets, ânes, ou ovins engraissés, etc.).</em></p>
<p><em>En effet, les activités commerciales constituent la majeure partie des <strong>biens intérieurs</strong> (amwâl bâtinah) des citadins, tout comme le bétail constitue la majeure partie des <strong>biens apparents</strong> (amwâl dhâhirah).</em>" <strong>Fin des propos du Cheikh.</strong><a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a></p>
<p>⁕ <strong>Des conditions sont requises pour que la Zakat soit obligatoire sur les marchandises commerciales :</strong></p>
<ul>
<li><blockquote>
<p><strong>Première condition :</strong> Qu'il en acquière la possession par son propre acte, comme par l'achat, l'acceptation d'un don, d'un legs (testament), d'un salaire (location), ou tout autre mode d'acquisition de revenus.</p>
</blockquote></li>
<li><blockquote>
<p><strong>Deuxième condition :</strong> Qu'il les possède avec l'<strong>intention de commercer</strong>, c'est-à-dire qu'il vise à réaliser un profit avec elles. En effet, "les actes ne valent que par les intentions", et le commerce est un acte ; il est donc obligatoire que l'intention y soit associée comme pour toutes les autres actions.</p>
</blockquote></li>
<li><blockquote>
<p><strong>Troisième condition :</strong> Que leur valeur atteigne le <strong>Nissâb</strong> (le seuil minimum) de l'une des deux monnaies (l'or ou l'argent).</p>
</blockquote></li>
<li><blockquote>
<p><strong>Quatrième condition :</strong> L'écoulement d'une <strong>année complète</strong> (<em>al-hawl</em>) sur ces biens, conformément à la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
</blockquote></li>
</ul>
<blockquote>
<p class="ar"><strong><span dir="rtl">«لَا زَكَاةَ فِي مَالٍ حَتَّى يَحُولَ عَلَيْهِ الْحَوْلُ»</span></strong></p>
<p><em>"<strong>Il n'y a pas de Zakat sur un bien tant qu'une année ne s'est pas écoulée sur lui</strong>"</em>.<a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a></p>
<p>Cependant, s'il a acheté une marchandise avec une somme d'argent atteignant déjà le Nissâb, ou avec d'autres marchandises valant déjà le Nissâb, il continue de compter l'année à partir de la date d'acquisition du capital d'origine utilisé pour l'achat.</p>
</blockquote>
<p>⁕ Quant aux modalités d'acquittement de la Zakat sur les marchandises, elles consistent à les évaluer, au terme de l'année écoulée, selon l'une des deux valeurs monétaires : l'or ou l'argent <a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a>. On doit privilégier, dans ce choix, ce qui est le plus avantageux pour les pauvres. Une fois évaluées, si leur valeur atteint le seuil minimum (Nissâb) de l'une des deux monnaies, on en prélève le quart du dixième (2,5 %). On ne prend pas en considération le prix auquel elles ont été achetées, mais on retient plutôt leur valeur réelle au moment précis où l'année s'achève, car cela constitue l'essence même de l'équité, tant pour le commerçant que pour les bénéficiaires de la Zakat.</p>
<p>⁕ Le musulman se doit d'être exhaustif, rigoureux et exigeant envers lui-même lors de l'acquittement de la Zakat sur ses marchandises, à l'image d'un associé pointilleux rendant des comptes à son partenaire. Pour ce faire, il doit recenser l'intégralité des marchandises commerciales qu'il possède, toutes catégories confondues, et les évaluer de manière équitable. Par exemple, le propriétaire d'une épicerie doit inventorier tous les articles destinés à la vente, tels que les conserves et divers types de marchandises. De même, le propriétaire de machines, de pièces de rechange ou de voitures destinées à la vente doit les recenser et les estimer à leur juste valeur. Il en va de même pour le propriétaire de terrains ou d'immeubles mis en vente, qui doit les évaluer selon ce qu'ils valent réellement. En revanche, pour les immeubles, maisons ou voitures destinés à la location, aucune Zakat n'est due sur leur valeur propre ; la Zakat ne s'applique qu'aux revenus locatifs perçus par le propriétaire, à condition qu'une année se soit écoulée sur ces gains. Quant aux maisons destinées à l'habitation, aux véhicules utilisés pour les besoins personnels, au mobilier de la maison, ainsi qu'au mobilier du magasin et aux outils du commerçant — tels que les instruments de mesure, les balances ou les flacons du parfumeur — aucune Zakat n'est due sur ces biens car ils ne sont pas destinés à la vente.</p>
<p>⁕ Ô musulman ! Acquitte la Zakat sur tes biens de bon gré et avec sincérité, et considère-la comme un gain pour toi dans ce monde et dans l'au-delà, et non comme une perte.</p>
<p>Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="ltr">﴿</span><strong><span dir="rtl">وَمِنَ الْأَعْرَابِ مَن يَتَّخِذُ مَا يُنفِقُ مَغْرَمًا وَيَتَرَبَّصُ بِكُمُ الدَّوَائِرَ ۚ عَلَيْهِمْ دَائِرَةُ السَّوْءِ ۗ وَاللَّهُ سَمِيعٌ عَلِيمٌ</span></strong> <span dir="ltr"><mark>(﻿٩٨﻿)﻿</mark></span> <strong><span dir="rtl">وَمِنَ الْأَعْرَابِ مَن يُؤْمِنُ بِاللَّهِ وَالْيَوْمِ الْآخِرِ وَيَتَّخِذُ مَا يُنفِقُ قُرُبَاتٍ عِندَ اللَّهِ وَصَلَوَاتِ الرَّسُولِ ۚ أَلَا إِنَّهَا قُرْبَةٌ لَّهُمْ ۚ سَيُدْخِلُهُمُ اللَّهُ فِي رَحْمَتِهِ ۗ إِنَّ اللَّهَ غَفُورٌ رَّحِيمٌ</span></strong><span dir="ltr">﴾</span></p>
<p>"<em><strong>Parmi les Bédouins, il en est qui considèrent ce qu'ils dépensent comme une perte et attendent pour vous un revers de fortune. Que le revers de fortune retombe sur eux ! Allah est Audient et Omniscient (98). Et parmi les Bédouins, il en est qui croient en Allah et au Jour dernier et considèrent leurs dépenses comme des moyens de se rapprocher d'Allah et d'obtenir les bénédictions du Messager. C'est bien là pour eux un moyen de rapprochement ; Allah les fera entrer dans Sa miséricorde. Certes, Allah est Pardonneur et Miséricordieux (99)</strong></em>" [Sourate At-Tawbah].</p>
<p>Ainsi, chacun de ces deux groupes s'acquitte de la Zakat, mais sera traité par Allah selon son intention et son but. Les premiers s'en acquittent en la considérant comme une charge dont ils se servent pour dissimuler leur hostilité envers l'Islam, attendant qu'un malheur frappe les musulmans pour se venger d'eux. En conséquence, le malheur s'est retourné contre eux, ils ont été privés de la récompense et ont perdu leurs biens. Quant aux croyants, ils considèrent la Zakat comme un moyen de rapprochement lorsqu'ils s'en acquittent. À ceux-là, Allah multipliera la récompense et remplacera ce qu'ils ont dépensé par quelque chose de meilleur, car "<em><strong>C'est bien là pour eux un moyen de rapprochement ; Allah les fera entrer dans Sa miséricorde</strong></em>", et ce, en raison de leur bonne intention et de leur noble objectif.</p>
<p>Crains donc Allah, ô musulman, et imprègne-toi de ces sens :</p>
<p class="ar"><span dir="ltr">﴿</span><strong><span dir="rtl">وَأَقْرِضُوا اللَّهَ قَرْضًا حَسَنًا ۚ وَمَا تُقَدِّمُوا لِأَنفُسِكُم مِّنْ خَيْرٍ تَجْدُوهُ عِندَ اللَّهِ هُوَ خَيْرًا وَأَعْظَمَ أَجْرًا ۚ وَاسْتَغْفِرُوا اللَّهَ ۖ إِنَّ اللَّهَ غَفُورٌ رَّحِيمٌ</span></strong><span dir="ltr">﴾</span></p>
<p>"<em><strong>Et faites à Allah un prêt sincère. Tout bien que vous préparez pour vous-mêmes, vous le retrouverez auprès d'Allah, meilleur et plus grand en récompense. Et implorez le pardon d'Allah. Certes, Allah est Pardonneur et Miséricordieux</strong></em>" [Sourate Al-Muzzammil : 20].</p>
