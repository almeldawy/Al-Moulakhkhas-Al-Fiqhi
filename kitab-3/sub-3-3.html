<p>⁕ Sache que parmi l’ensemble des biens sur lesquels Allah a rendu la Zakat obligatoire figure <strong>le bétail</strong> ، à savoir : <strong>les chameaux ، les bovins et les ovins</strong> . Ils sont d’ailleurs en tête des biens soumis à la Zakat ; en effet ، l’obligation de la Zakat à leur sujet a été prouvée par des hadiths authentiques et largement diffusés (mustafîdah) provenant du Prophète <span dir="rtl">ﷺ</span> . Ses écrits à ce sujet ainsi que les écrits de ses successeurs (les califes) sont connus et célèbres pour clarifier leurs parts obligatoires et l'envoi de collecteurs pour les recueillir auprès des tribus arabes autour de Médine et ailleurs , sur toute l’étendue de la sphère islamique .</p>
<p>⁕ <strong>La Zakât est obligatoire pour les chameaux, les bovins et les ovins sous deux conditions :</strong></p>
<ul>
<li><blockquote>
<p><strong>La première condition :</strong> Qu'ils soient gardés pour leur <strong>production de lait et leur reproduction</strong>, et non pour le travail. En effet, c'est dans ce cas que leurs bénéfices augmentent et que leur croissance devient fructueuse par la prise d'âge et la progéniture , justifiant ainsi l'acte de solidarité (la Zakât).</p>
</blockquote></li>
<li><blockquote>
<p><strong>La deuxième condition :</strong> Qu'ils soient « Sa'imah » – <strong>c'est-à-dire qu'ils pâturent d'eux-mêmes</strong> – , conformément à la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
</blockquote></li>
</ul>
<p class="ar"><span dir="ltr">«</span> <strong><span dir="rtl">فِي كُلِّ إِبِلٍ سَائِمَةٍ فِي كُلِّ أَرْبَعِينَ ابْنَةُ لَبُونٍ</span></strong> <span dir="ltr">»</span></p>
<p>« <em><strong>Pour chaque troupeau de chameaux pâturant (Sa'imah) ، il est dû pour chaque quarantaine une "Ibna Laboun" (une chamelle entamant sa troisième année)</strong></em> ». Rapporté par Ahmad, Abou Daoud et An-Nassa'i.<a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a></p>
<p>Le terme « <em>As-Sawm</em> » signifie le pâturage. Ainsi, la Zakât n'est pas obligatoire pour les bêtes qui sont nourries avec du fourrage acheté pour elles ou ramassé à partir de l'herbe ou autre , dans le cas où elles seraient nourries ainsi toute l'année ou la majeure partie de celle-ci.</p>
<h4 id="premièrement-la-zakat-des-chameaux"><strong>Premièrement : La Zakat des chameaux :</strong></h4>
<p>⁕ Et si les conditions sont remplies، il devient obligatoire de donner une brebis pour chaque groupe de cinq chameaux، deux brebis pour dix، trois brebis pour quinze، et quatre brebis pour vingt ; comme cela est prouvé par la Sunna et le consensus (Al-Ijmâ‘).</p>
<p>⁕ Lorsqu'ils atteignent le nombre de vingt-cinq, la redevance est une <strong>Bint Makhâd</strong> (une chamelle d'un an révolu). C'est celle qui a terminé sa première année et entamé la deuxième. Elle est ainsi nommée parce que sa mère est généralement devenue <em>makhid</em>, c'est-à-dire gestante. Le fait que la mère soit réellement gestante n'est pas une condition, il s'agit seulement d'une définition basée sur l'état le plus fréquent. S'il n'en possède pas, un <strong>Ibn Labûn</strong> (un chamelon de deux ans) peut la remplacer, selon le hadith d'Anas :</p>
<p class="ar"><span dir="ltr">«</span><strong><span dir="rtl">فَإِنْ لَمْ يَكُنْ فِيهَا بِنْتُ مَخَاضٍ؛ فَفِيهَا ابْنُ لَبُونٍ</span></strong><span dir="ltr">»</span></p>
<p>« <em><strong>S'il n'y a pas de Bint Makhâd, alors il incombe un Ibn Labûn</strong></em> » (rapporté par Abû Dâwûd)<a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a>. L'explication du terme <em>Ibn Labûn</em> suivra.</p>
<p>⁕ Lorsque les chameaux atteignent (le nombre de) trente-six, il devient obligatoire de donner une <strong>Bint Labûn</strong>, conformément au hadith d'Anas précisant :</p>
<p class="ar"><span dir="ltr">«</span><strong><span dir="rtl">فَإِذَا بَلَغَتْ سِتًّا وَثَلَاثِينَ إِلَى خَمْسٍ وَأَرْبَعِينَ؛ فَفِيهَا بِنْتُ لَبُونٍ</span></strong><span dir="ltr">»</span></p>
<p>« <em><strong>Lorsqu'ils atteignent (le nombre ) de trente-six à quarante-cinq, il incombe une Bint Labûn</strong></em> » et comme l'indique le consensus (<em>Ijmâ'</em>). La <em>Bint Labûn</em> est celle qui a terminé ses deux ans. Elle est nommée ainsi car sa mère a généralement déjà mis bas et possède donc du lait (<em>laban</em>). Ce n'est pas une condition stricte, mais une définition basée sur le cas général.</p>
<p>⁕ Lorsque les chameaux atteignent (le nombre de ) quarante-six, il devient obligatoire de donner une <strong>Hiqqah</strong>. <em>C'est celle qui a terminé ses trois ans</em>. Elle est ainsi nommée parce qu'à cet âge, elle est apte (<em>istahaqqat</em>) à être saillie par le mâle, à porter des charges et à être montée.</p>
<p>⁕ Lorsque les chameaux atteignent (le nombre de) soixante et un, il devient obligatoire de donner une <strong>Jadha'ah</strong>. C'est celle qui a terminé ses quatre ans. Elle est nommée ainsi car lorsqu'elle atteint cet âge, elle « jadha' » (perd ses dents de lait). La preuve de l'obligation de la <em>Jadha'ah</em> pour cette quantité de chameaux réside dans ce qui est rapporté dans le <em>Sahîh</em> d'après la parole du Messager <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="ltr">«</span><strong><span dir="rtl">فَإِذَا بَلَغَتْ إِحْدَى وَسِتِّينَ إِلَى خَمْسٍ وَسَبْعِينَ؛ فَفِيهَا جَذَعَةٌ</span></strong><span dir="ltr">»</span></p>
<p>« <em><strong>Lorsqu'ils atteignent (le nombre de) de soixante et un à soixante-quinze, il incombe une Jadha'ah</strong></em> ». Les savants sont unanimes à ce sujet.</p>
<p>⁕ Lorsque le total des chameaux atteint (le nombre de) soixante-seize, il devient obligatoire de donner <strong>deux Bint Labûn</strong> selon le hadith authentique disant :</p>
<p class="ar"><span dir="ltr">«</span><strong><span dir="rtl">فَإِذَا بَلَغَتْ سِتًّا وَسَبْعِينَ إِلَى تِسْعِينَ؛ فَفِيهَا بِنْتَا لَبُونٍ</span></strong><span dir="ltr">»</span></p>
<p>« <em><strong>Lorsqu'ils atteignent (le nombre) de soixante-seize à quatre-vingt-dix, il incombe deux Bint Labûn</strong></em> ».</p>
<p>⁕ Lorsque le nombre de chameaux atteint quatre-vingt-onze, il devient obligatoire de donner deux Hiqqah. Cela est dû au hadith authentique dans lequel il est rapporté :</p>
<p class="ar"><span dir="ltr">«</span><strong><span dir="rtl">فَإِذَا بَلَغَتْ إِحْدَى وَتِسْعِينَ إِلَى عِشْرِينَ وَمِئَةٍ؛ فَفِيهَا حِقَّتَانِ طَرُوقَتَا الْفَحْلِ</span></strong><span dir="ltr">»</span></p>
<p>"<em><strong>Lorsqu'ils atteignent (le nombre de) quatre-vingt-onze jusqu'à cent-vingt, il y a alors deux Hiqqah aptes à être saillies par le mâle</strong></em>". Et il y a un consensus (Ijmâ') sur cela.</p>
<p>⁕ Si le nombre total de chameaux dépasse cent-vingt d'une unité (soit 121), il devient obligatoire de donner trois <em>Banât Labûn</em>. Ceci conformément au hadith sur les aumônes (as-Sadaqât) écrit par le Prophète <span dir="rtl">ﷺ</span>, dont les termes sont :</p>
<p class="ar"><span dir="ltr">«</span><strong><span dir="rtl">فَإِذَا زَادَتْ عَلَى عِشْرِينَ وَمِئَةٍ؛ فَفِي كُلِّ خَمْسِينَ حِقَّةٌ، وَفِي كُلِّ أَرْبَعِينَ بِنْتُ لَبُونٍ</span></strong><span dir="ltr">»</span></p>
<p>"<em><strong>Si le nombre dépasse cent-vingt, alors pour chaque cinquantaine, une Hiqqah, et pour chaque quarantaine, une Bint Labûn</strong></em>". Ensuite, il incombe pour chaque quarantaine une <em>Bint Labûn</em> et pour chaque cinquantaine une <em>Hiqqah</em>.</p>
<h4 id="deuxièmement-la-zakât-des-bovins"><strong>Deuxièmement : La Zakât des bovins</strong></h4>
<p>⁕ Quant aux bovins, la Zakât y est obligatoire selon les textes scripturaires (<em>Le Qur’ân &amp; la Sounnah</em>) et le consensus (Al-Ijmâ‘). En effet, dans les deux recueils authentiques (Al-Bukhârî et Muslim), d'après Jâbir [qu'Allah l'agrée] : J'ai entendu l'Envoyé d'Allah <span dir="rtl">ﷺ</span> dire :</p>
<p class="ar"><span dir="ltr">«</span><strong><span dir="rtl">مَا مِنْ صَاحِبِ إِبِلٍ وَلَا بَقَرٍ وَلَا غَنَمٍ لَا يُؤَدِّي زَكَاتَهَا؛ إِلَّا جَاءَتْ يَوْمَ القِيَامَةِ أَعْظَمَ مَا كَانَتْ وَأَسْمَنَهُ، تَنْطَحُهُ بِقُرُونِهَا، وَتَطَؤُهُ بِأَخْفَافِهَا</span></strong><span dir="ltr">»</span></p>
<p>« <em><strong>Il n'est pas un propriétaire de chameaux, de bovins ou d'ovins qui ne s'acquitte pas de leur Zakât, sans qu'ils ne viennent au Jour de la Résurrection plus grands et plus gras qu'ils n'étaient, le frappant de leurs cornes et le piétinant de leurs sabots.</strong></em> »<a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a></p>
<p>Il a également été authentifié d'après Mu‘âdh [qu'Allah l'agrée] : « <em><strong>Lorsque le Prophète <span dir="rtl">ﷺ</span> l'envoya au Yémen, il lui ordonna de prélever la Zakât des bovins : pour chaque groupe de trente, un jeune bovin d'un an (tabî‘), et pour chaque groupe de quarante, une vache de deux ans (musinnah).</strong></em> » Rapporté par Ahmad et At-Tirmidhî.<a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a></p>
<p>⁕ Il devient alors obligatoire pour celle-ci (la catégorie des bovins), lorsqu'elle atteint le nombre de trente, de donner un <em>tabî‘</em> (mâle) ou une <em>tabî‘ah</em> (femelle) ayant chacun révolu une année entière et entamé la deuxième ; il a été nommé ainsi car il suit sa mère au pâturage.<a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a></p>
<p>⁕ Il n'y a rien à prélever (aucune Zakât) pour ce qui est en dessous de trente (têtes) ; ceci conformément au hadith de Mu‘âdh qui a dit : "<em><strong>L'Envoyé d'Allah <span dir="rtl">ﷺ</span> m'a ordonné, lorsqu'il m'a envoyé au Yémen, de ne rien prélever sur les bovins jusqu'à ce qu'ils atteignent le nombre de trente</strong></em>".<a href="#fn6" class="footnote-ref" id="fnref6" role="doc-noteref"><sup>6</sup></a></p>
<p>⁕ Et si le nombre total de bovins atteint quarante, il devient obligatoire de donner une vache <em>musinnah</em> — qui est celle ayant révolu deux années entières — et ce, conformément au hadith de Mu‘âdh qui a dit : "<em><strong>L'Envoyé d'Allah <span dir="rtl">ﷺ</span> m'a ordonné de prélever, pour chaque groupe de trente bovins, un tabî‘ ou une tabî‘ah, et pour chaque groupe de quarante, une musinnah</strong></em>". Rapporté par les cinq (Ahmad et les auteurs des Sunan), et authentifié par Ibn Hibbân et Al-Hâkim.<a href="#fn7" class="footnote-ref" id="fnref7" role="doc-noteref"><sup>7</sup></a></p>
<p>⁕ Si le nombre total de bovins dépasse quarante, il devient alors obligatoire de donner, pour chaque groupe de trente, un <em>tabî‘</em>, et pour chaque groupe de quarante, une <em>musinnah</em>.</p>
<p>La <em>musinnah</em> est celle qui est devenue une <em>thaniyyah</em> (ayant changé ses deux premières incisives) ; elle a été nommée <em>musinnah</em> en raison de l'avancement de son âge (litt. de l'augmentation de sa dentition), et elle est également appelée <em>thaniyyah</em>.</p>
<h4 id="troisièmement-la-zakat-des-ovins-moutons-et-chèvres"><strong>Troisièmement : La Zakat des ovins (moutons et chèvres)</strong></h4>
<p>⁕ Le fondement concernant l'obligation de la Zakat sur les ovins est la Sunna et le consensus (Al-Ijmâ‘) ; il est rapporté dans le « Sahîh » d'après Anas, qu'Abû Bakr lui a écrit : « <em><strong>Voici l'obligation de l'aumône (la Zakat) que le Messager d'Allah <span dir="rtl">ﷺ</span> a imposée aux musulmans, et qu'Allah a ordonnée à Son Messager...</strong></em> » jusqu'à ce qu'il dise : « <em><strong>Et concernant l'aumône sur les ovins, lorsqu'ils paissent librement (as-sâ'imah), si leur nombre est compris entre quarante et cent vingt brebis...</strong></em> »<a href="#fn8" class="footnote-ref" id="fnref8" role="doc-noteref"><sup>8</sup></a></p>
<p>⁕ Ainsi, si le total des ovins atteint quarante têtes, qu'il s'agisse de moutons (brebis) ou de chèvres, la Zakat due est d'une seule bête. Celle-ci doit être un <em>Jadha’</em> (jeune agneau) s'il s'agit d'un mouton, ou un <em>Thaniy</em> (chèvre ayant atteint un certain âge) s'il s'agit d'une chèvre. Ceci est basé sur le Hadith de Suwayd bin Ghafalah qui a dit : "<em><strong>Le collecteur de la Zakat du Messager d'Allah <span dir="rtl">ﷺ</span> est venu à nous et a dit : 'Il nous a été ordonné de prendre le Jadha’ah parmi les moutons et la Thaniyyah parmi les chèvres et le Jadha’ du mouton est celui qui a complété six mois, tandis que le Thaniy de la chèvre est celle qui a complété une année</strong></em>“ <a href="#fn9" class="footnote-ref" id="fnref9" role="doc-noteref"><sup>9</sup></a>.</p>
<p>⁕ Et il n'y a pas de Zakat à payer sur les ovins si leur nombre est inférieur à quarante. Ceci est basé sur le hadith d'Abû Bakr dans le « Sahîh », dans lequel il est dit : "<em><strong>Si le troupeau d'ovins d'un homme pâturant librement est inférieur à quarante brebis, ne serait-ce que d'une seule brebis, il n'y a rien à payer dessus, à moins que son propriétaire ne veuille [donner quelque chose de son plein gré]</strong></em>"<a href="#fn10" class="footnote-ref" id="fnref10" role="doc-noteref"><sup>10</sup></a></p>
<p>⁕ Et si le total des ovins atteint cent vingt-et-un, deux brebis deviennent obligatoires. Ceci est basé sur le hadith d'Abû Bakr mentionné précédemment, lequel stipule : "<em><strong>Si [le nombre] dépasse cent vingt, alors il y a deux brebis à payer</strong></em>"</p>
<p>⁕ Et si [le troupeau] atteint deux cent une têtes, trois brebis deviennent obligatoires. Ceci est basé sur le hadith d'Abû Bakr, lequel stipule : "<em><strong>Si [le nombre] dépasse deux cents, alors il y a trois brebis à payer</strong></em>"</p>
<p>⁕ Ensuite, l'obligation se stabilise après cette quantité : il est alors fixé une brebis pour chaque centaine de brebis supplémentaire. Ainsi, pour quatre cents brebis, quatre brebis sont dues ; pour cinq cents, cinq brebis ; pour six cents, six brebis... et ainsi de suite.</p>
<p>Il est mentionné dans le livre des aumônes (Kitâb as-Sadaqât) mis en pratique par Abû Bakr ؓ jusqu'à sa mort, puis par 'Umar ؓ jusqu'à son décès ؓ : "<em><strong>Concernant les ovins, de quarante brebis jusqu'à cent vingt, une brebis est due. Si cela augmente d'une seule brebis [121], alors deux brebis sont dues jusqu'à deux cents. Si cela augmente d'une seule [201], alors trois brebis sont dues jusqu'à trois cents. Si cela augmente par la suite [au-delà de 300], il n'y a rien de plus à ajouter jusqu'à atteindre quatre cents brebis. Lorsque le nombre d'ovins devient important, il faut alors compter une brebis pour chaque centaine.</strong></em>" Rapporté par les cinq, à l'exception d'An-Nasa'i<a href="#fn11" class="footnote-ref" id="fnref11" role="doc-noteref"><sup>11</sup></a></p>
<p>⁕ On ne doit prélever [pour la Zakat] ni animal trop vieux (<em>harimah</em>), ni animal défectueux (<em>ma'îbah</em>) qui ne serait pas valable pour le sacrifice de l'Aïd (<em>Udhiyah</em>), à moins que tout le troupeau ne soit dans cet état. On ne doit pas non plus prélever la femelle gestante, ni celle qui allaite et élève son petit (<em>ar-rubba</em>), ni celle qui a été saillie par le mâle (<em>taruqat al-fahl</em>), car elle est probablement enceinte.</p>
<p>Ceci est basé sur le hadith d'Abû Bakr dans le "Sahîh" qui dit :</p>
<p class="ar"><span dir="ltr">«</span><strong><span dir="rtl">ولا يُخْرَجُ في الصَّدَقَةِ هَرِمَةٌ، ولا ذاتُ عَوَارٍ، ولا تَيْسٌ؛ إلَّا أن يشاءَ المُصَدِّقُ</span></strong><span dir="ltr">»</span></p>
<p>"<em><strong>On ne doit pas donner pour l'aumône un animal trop vieux, ni un animal borgne ou défectueux, ni un bouc, à moins que le collecteur ne l'accepte</strong></em>" <a href="#fn12" class="footnote-ref" id="fnref12" role="doc-noteref"><sup>12</sup></a>.</p>
<p>Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="ltr">﴿</span><strong><span dir="rtl">وَلَا تَيَمَّمُوا الْخَبِيثَ مِنْهُ تُنفِقُونَ</span></strong><span dir="rtl">﴾ [البقرة: ٢٦٧]</span></p>
<p>{<em><strong>Et ne choisissez pas ce qui est mauvais pour en donner en aumône</strong></em>} [Al-Baqarah : 267].</p>
<p>Le Prophète <span dir="rtl">ﷺ</span> a également dit :</p>
<p class="ar"><span dir="ltr">«</span><strong><span dir="rtl">ولَكِن من وسَطِ أموالِكم؛ فإنَّ اللهَ لم يَسألْكم خَيْرَهُ، ولم يَأْمُرْكم بِشَرِّهِ</span></strong><span dir="ltr">»</span></p>
<p>"<em><strong>Mais [donnez] de la qualité moyenne de vos biens ; car certes Allah ne vous a pas demandé le meilleur de vos biens, et Il ne vous a pas ordonné de donner le plus mauvais</strong></em>" <a href="#fn13" class="footnote-ref" id="fnref13" role="doc-noteref"><sup>13</sup></a>.</p>
<p>De même, on ne doit pas prélever la <em>karîmah</em>, qui est la bête précieuse à laquelle son propriétaire est très attaché. On ne prélève pas non plus l'<em>akûlah</em>, qui est la bête grasse destinée à être consommée, ou celle qui mange beaucoup et devient ainsi très grasse. Le Prophète <span dir="rtl">ﷺ</span> a dit à Mu'adh ibn Jabal ؓ lorsqu'il l'a envoyé au Yémen : "<em><strong>Garde-toi de prendre les biens les plus précieux (karâ'im) des gens</strong></em>"<a href="#fn14" class="footnote-ref" id="fnref14" role="doc-noteref"><sup>14</sup></a>. Hadith faisant l'objet d'un consensus</p>
<p>⁕ Ce qui doit être prélevé pour les aumônes (la Zakat) est ce qui est juste et équitable (<em>al-'adl</em>) ; comme l'a dit le Prophète <span dir="rtl">ﷺ</span> : "<em><strong>Mais [donnez] de la qualité moyenne de vos biens</strong></em>".</p>
<p>On peut toutefois prélever un animal malade si l'ensemble du troupeau constituant le seuil d'imposition (<em>Nisâb</em>) est malade ; car la Zakat a été instituée par solidarité (<em>muwâsâh</em>), et exiger du propriétaire un animal sain pour remplacer des animaux malades serait une injustice (un préjudice) envers lui.</p>
<p>De même, on peut prélever un jeune animal si le troupeau n'est composé que de jeunes bêtes, spécifiquement pour ce qui concerne les ovins.</p>
<p>⁕ Et si le propriétaire des biens souhaite donner quelque chose de meilleure qualité que ce qui lui est obligatoirement réclamé, cela est préférable et lui vaudra une plus grande récompense.</p>
<p>⁕ Et si les biens (le troupeau) sont mélangés, composés de grands et de petits, d'animaux sains et de défectueux, ou de mâles et de femelles ; on prélève alors une femelle saine et adulte dont la valeur est proportionnelle à la valeur globale des deux types de biens. On procède donc à l'estimation des biens comme s'ils étaient tous adultes afin de savoir ce qui serait dû, puis on les estime comme s'ils étaient tous petits. Ensuite, on prélève au prorata. Il en va de même pour les autres catégories (sains et défectueux, ou mâles et femelles). Par exemple : si la valeur de la bête à prélever pour la Zakat serait de 20 si le seuil d'imposition (<em>Nisâb</em>) n'était composé que de grands animaux sains, et que sa valeur serait de 10 s'il n'était composé que de petits animaux malades ; alors on prélève la moitié de l'un et la moitié de l'autre. Autrement dit : [on prélève une bête] dont la valeur est de 15.</p>
<p>⁕ Parmi les sujets d'étude de la Zakat sur le bétail figure la connaissance de la règle du mélange (<em>Al-Khultah</em>). Cela consiste en ce que le total du bétail mélangé soit partagé entre deux personnes ou plus. Le mélange est de deux types :</p>
<p><strong>Le premier type : Le mélange des biens eux-mêmes (<em>Khultat A‘yân</em>) :</strong> Cela signifie que les biens sont partagés de manière indivise entre les deux parties, sans que la part de l'un ne soit distinguée de celle de l'autre. Par exemple, l'un possède la moitié de ce bétail, ou le quart, ou une proportion similaire.</p>
<p><strong>Le second type : Le mélange par association (<em>Khultat Awsâf</em>) :</strong> Cela signifie que la part de chacun est distincte et connue, mais que les deux troupeaux sont voisins (partageant les mêmes ressources)</p>
<p>Chacun des deux types de mélange (cités précédemment) influence la Zakat en termes d'obligation, d'exemption, d'augmentation ou d'allègement. Le mélange, sous ses deux formes, fait en sorte que les deux biens mélangés soient considérés comme un seul bien unique, sous certaines conditions :</p>
<ul>
<li><blockquote>
<p><strong>Premièrement :</strong> Que le total [des deux parts] atteigne le seuil d'imposition (<em>Nisâb</em>). Si le total est inférieur au seuil, rien n'est dû. L'objectif est que la somme atteigne le seuil, même si la part de chaque individu prise séparément est inférieure à ce seuil.</p>
</blockquote></li>
<li><blockquote>
<p><strong>Deuxième condition :</strong> Que les deux associés fassent partie de ceux pour qui la Zakat est obligatoire. Si l'un d'eux n'est pas assujetti à la Zakat (comme un mécréant, par exemple), le mélange n'a aucun effet et chaque part est soumise à sa propre règle.</p>
</blockquote></li>
<li><blockquote>
<p><strong>La troisième condition :</strong> Que les deux biens mélangés partagent le même <em>Murâh</em>, qui est le lieu de couchage et l'abri. Ils doivent également partager le même <em>Masrah</em>, qui est l'endroit où le bétail se rassemble avant de partir au pâturage. Ils doivent aussi partager le même <em>Mahlab</em>, qui est le lieu de la traite ; ainsi, si l'un des deux associés trait son bétail dans un endroit et que l'autre trait le sien ailleurs, le mélange n'est pas pris en compte. Ils doivent également partager le même mâle (<em>Fahl</em>) ; cela signifie que chaque part ne doit pas avoir un mâle indépendant, mais qu'elles doivent être saillies par le même mâle. Enfin, ils doivent partager le même pâturage (<em>Mar'â</em>) ; cela implique que l'ensemble du bétail pâture au même endroit. Si les pâturages diffèrent, et que la part de l'un pâture dans un lieu autre que celui de son associé, le mélange n'a aucun effet.</p>
</blockquote></li>
</ul>
<p>Lorsque ces conditions sont remplies, les deux biens mélangés deviennent comme un seul bien unique. Ceci est conforme à la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="ltr">«</span><strong><span dir="rtl">لا يُجْمَعُ بينَ مُتَفَرِّقٍ، ولا يُفَرَّقُ بينَ مُجْتَمِعٍ؛ خَشْيَةَ الصَّدَقَةِ، وما كانَ من خَلِيطَيْنِ فإنَّهما يَتَراجَعانِ بينَهما بالسَّوِيَّةِ</span></strong><span dir="ltr">»</span></p>
<p>"<em><strong>On ne doit pas rassembler ce qui est séparé, ni séparer ce qui est rassemblé, par crainte de [payer] l'aumône (la Zakat). Et ce qui appartient à deux associés, ils doivent le régler entre eux équitablement.</strong></em>" Rapporté par At-Tirmidhî, Abû Dâwûd et Ibn Mâjah, et authentifié (Hassan) par At-Tirmidhî.<a href="#fn15" class="footnote-ref" id="fnref15" role="doc-noteref"><sup>15</sup></a></p>
<p>Si un homme possède une brebis et un autre en possède trente-neuf, ou si quarante hommes possèdent quarante brebis (une brebis chacun), et qu'ils s'associent durant une année entière en remplissant les conditions citées, ils devront alors [à eux tous] une seule brebis, répartie selon leur propriété respective.</p>
<ul>
<li><blockquote>
<p>Dans le premier exemple : le propriétaire d'une brebis devra 1/40ème de brebis, et le propriétaire des trente-neuf autres devra le reste.</p>
</blockquote></li>
<li><blockquote>
<p>Dans le second exemple : chacun des quarante hommes devra 1/40ème de brebis.</p>
</blockquote></li>
<li><blockquote>
<p>Si trois personnes possèdent cent vingt brebis (quarante chacune), ils devront à eux tous une seule brebis, divisée en trois parts égales.</p>
</blockquote></li>
</ul>
<p>Et de même que le mélange (<em>Al-Khultah</em>) a une influence comme tu l'as vu, la dispersion (<em>At-Tafrîq</em>) a également une influence selon l'Imam Ahmad. Ainsi, si le troupeau d'un homme (pâturant librement) est dispersé, et que chaque partie est éloignée de l'autre par une distance supérieure à celle permettant de raccourcir les prières (<em>Masâfat al-Qasr</em>), alors chaque partie est régie par sa propre règle sans lien avec l'autre. Si une partie atteint le seuil d'imposition (<em>Nisâb</em>), la Zakat y est obligatoire ; mais si elle est inférieure au seuil, il n'y a rien à payer dessus. On ne regroupe donc pas chaque partie avec l'autre (pour le calcul) ; ceci est l'avis de l'Imam Ahmad.</p>
<p>Cependant, la majorité des savants (<em>Jumhûr al-'Ulamâ</em>) est d'avis que la dispersion n'a pas d'influence sur les biens d'une seule et même personne. Par conséquent, les parties sont regroupées entre elles pour le jugement légal, même si elles sont dispersées, et c'est cet avis qui prévaut (<em>Ar-Râjih</em>). Et Allah est plus savant.</p>
