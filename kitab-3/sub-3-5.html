<p>⁕ Sache, qu'Allah nous accorde ainsi qu'à toi la réussite, que ce que l'on entend par la Zakât des deux monnaies est la Zakât sur l'or et l'argent, ainsi que ce qui en découle en termes de monnaies, de bijoux, de lingots et autres.</p>
<p>⁕ La preuve de l'obligation de la Zakât sur l'or et l'argent repose sur le Livre (le Coran), la Sunna et le consensus (al-ijmâ‘).</p>
<p>Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="ltr">﴿</span><strong><span dir="rtl">وَالَّذِينَ يَكْنِزُونَ الذَّهَبَ وَالْفِضَّةَ وَلَا يُنفِقُونَهَا فِي سَبِيلِ اللَّهِ فَبَشِّرْهُم بِعَذَابٍ أَلِيمٍ</span></strong><span dir="rtl">﴾ [التوبة: ٣٤]</span></p>
<p><strong>« <em>À ceux qui thésaurisent l’or et l’argent et ne les dépensent pas dans le sentier d’Allah, annonce un châtiment douloureux.</em> »</strong> [At-Tawbah : 34]</p>
<p>Il y a dans ce noble verset une menace sévère d'un châtiment douloureux pour quiconque ne s'acquitte pas de la Zakât sur l'or et l'argent.</p>
<p>Et dans les deux recueils authentiques (Al-Bukhârî et Muslim) :</p>
<p class="ar"><strong><span dir="rtl">«مَا مِنْ صَاحِبِ ذَهَبٍ وَلَا فِضَّةٍ لَا يُؤَدِّي مِنْهَا حَقَّهَا؛ إِلَّا إِذَا كَانَ يَوْمُ الْقِيَامَةِ صُفِّحَتْ لَهُ صَفَائِحُ مِنْ نَارٍ...»</span></strong></p>
<p><strong>« <em>Tout possesseur d'or ou d'argent qui ne s'acquitte pas de son dû (la Zakât), on lui forgera, au Jour de la Résurrection, des plaques de feu...</em> »</strong><a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a></p>
<p>Les imams se sont accordés sur le fait que le terme "trésor" (al-kanz) mentionné dans le Coran et le hadith désigne tout bien soumis à la Zakât dont la Zakât n'a pas été acquittée. Quant au bien dont la Zakât a été versée, il n'est pas considéré comme un "trésor" [au sens blâmable]. Le trésor est tout ce qui est amassé, qu'il soit enfoui dans le ventre de la terre ou conservé à sa surface.</p>
<p>⁕ La Zakât est donc obligatoire sur l'or lorsqu'il atteint vingt <em>mithqâls</em>, et sur l'argent lorsqu'il atteint deux cents dirhams islamiques. Le montant à prélever est le quart du dixième (2,5 %) pour les deux, qu'ils soient sous forme de monnaie frappée ou non. Ceci d'après le hadith d'Ibn 'Umar et d'Aïcha (qu'Allah les agrée) rapporté au Prophète <span dir="rtl">ﷺ</span> : « <em><strong>Il prélevait sur chaque vingt mithqâls, un demi-mithqâl</strong></em> » [Rapporté par Ibn Mâjah]<a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a>. Et dans le hadith d'Anas (qu'Allah l'agrée) rapporté au Prophète <span dir="rtl">ﷺ</span> : « <em><strong>Sur l'argent (ar-riqah), le quart du dixième est dû</strong></em> » [Rapporté par al-Bukhârî].<a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a></p>
<p><em>Ar-Riqah</em> — avec une <em>kasra</em> sous le "Râ" et un "Qâf" léger (sans redoublement) — désigne l'argent pur, qu'il soit frappé (en monnaie) ou non.</p>
<p>Le <em>mithqâl</em> est à l'origine une unité de mesure de poids. Les juristes ont dit : « <em><strong>Son poids équivaut à soixante-douze grains d'orge, parmi les grains bien pleins et de taille moyenne</strong></em> ».</p>
<p>Le seuil (<em>Nisâb</em>) de l'or en guinées saoudiennes est de onze guinées et trois septièmes de guinée. Le seuil de l'argent en riyals arabes saoudiens est de cinquante-six riyals, ou l'équivalent de leur valeur en billets de banque utilisés à notre époque.<a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a></p>
<p>On prélève sur l'or et l'argent, dès lors que chacun d'eux atteint le seuil déterminé ou plus : le quart du dixième (2,5 %).</p>
<h4 id="ce-quil-est-permis-à-lhomme-de-porter-en-or-et-en-argent"><strong>Ce qu'il est permis à l'homme de porter en or et en argent :</strong></h4>
<p>⁕ Il est permis à l'homme (de sexe masculin) de porter une bague en argent, car le Prophète <span dir="rtl">ﷺ</span> a porté une bague en argent. [Rapporté par Al-Bukhârî et Muslim].<a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a></p>
<p>⁕ Il lui est interdit de porter une bague en or. En effet, le Prophète <span dir="rtl">ﷺ</span> a interdit aux hommes de se parer d'or et a fermement blâmé celui qui le fait, en disant <span dir="rtl">ﷺ</span> : « <em><strong>L'un d'entre vous se saisit d'une braise du feu de l'Enfer pour la mettre dans sa main.</strong></em> » [Rapporté par Muslim].<a href="#fn6" class="footnote-ref" id="fnref6" role="doc-noteref"><sup>6</sup></a></p>
<p>⁕ Il est également permis à l'homme de porter de l'or en cas de nécessité, comme pour une prothèse de nez ou des fixations dentaires. En effet, le nez de 'Arfajah ibn Sa'd fut tranché lors de la bataille d'Al-Kulâb ; il utilisa alors une prothèse en argent, mais celle-ci finit par dégager une mauvaise odeur. Le Prophète <span dir="rtl">ﷺ</span> lui ordonna alors de prendre un nez en or. [Rapporté par Abû Dâwûd et Al-Hâkim qui l'a authentifié].<a href="#fn7" class="footnote-ref" id="fnref7" role="doc-noteref"><sup>7</sup></a></p>
<h4 id="ce-quil-est-permis-aux-femmes-de-porter-comme-parures-en-or-et-en-argent"><strong>Ce qu'il est permis aux femmes de porter comme parures en or et en argent :</strong></h4>
<p>⁕ Il est permis aux femmes de porter l'or et l'argent selon ce qu'elles ont l'habitude de porter. En effet, le Législateur leur a permis de se parer de manière absolue. Le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="ltr">«</span><strong><span dir="rtl">أُحِلَّ الذَّهَبُ وَالْحَرِيرُ لِإِنَاثِ أُمَّتِي، وَحُرِّمَ عَلَى ذُكُورِهَا</span></strong><span dir="ltr">»</span></p>
<p>« <em><strong>L'or et la soie ont été rendus licites pour les femmes de ma communauté, et interdits pour ses hommes</strong></em> ». rapporté par Ahmad, Abû Dâwûd, At-Tirmidhî et An-Nasâ'î<a href="#fn8" class="footnote-ref" id="fnref8" role="doc-noteref"><sup>8</sup></a></p>
<p>Ceci démontre la permission pour les femmes de se parer d'or et d'argent, et les savants sont unanimes sur ce point.</p>
<p>⁕ Il n'y a pas de Zakât sur les bijoux des femmes en or et en argent s'ils sont destinés à l'usage personnel ou au prêt<a href="#fn9" class="footnote-ref" id="fnref9" role="doc-noteref"><sup>9</sup></a>. Cela s'appuie sur la parole du Prophète <span dir="rtl">ﷺ</span>:</p>
<p class="ar"><span dir="ltr">«</span><strong><span dir="rtl">لَيْسَ فِي الْحُلِيِّ زَكَاةٌ</span></strong><span dir="ltr">»</span></p>
<p>« <em><strong>Il n'y a pas de Zakât sur les bijoux</strong></em> », rapporté par At-Tabarânî d'après Jâbir avec une chaîne de transmission faible. <a href="#fn10" class="footnote-ref" id="fnref10" role="doc-noteref"><sup>10</sup></a></p>
<p>Cependant, cet avis est soutenu par la pratique établie et a été soutenu par un groupe de compagnons, parmi lesquels : Anas, Jâbir, Ibn 'Umar, Aïcha et sa sœur Asmâ'.</p>
<p>L'imam Ahmad a dit : « <em>Il existe sur ce sujet [l'absence de Zakât sur les bijoux] des rapports venant de cinq compagnons du Prophète <span dir="rtl">ﷺ</span></em> ». La raison est que ces bijoux ne sont plus considérés comme un bien de croissance (productif), mais comme un objet à usage licite, ressemblant ainsi aux vêtements de tous les jours, aux serviteurs ou aux résidences d'habitation.</p>
<p>⁕ Et si les bijoux sont destinés à la location, ou préparés pour servir de dépense — c'est-à-dire conservés comme réserve en cas de besoin —, ou destinés à la possession patrimoniale, ou à l'épargne, ou si aucune des intentions précédentes n'a été formulée ; alors ils conservent leur statut d'origine et la Zakât y est obligatoire.</p>
<p>En effet, la Zakât est obligatoirement due sur l'or et l'argent ; son obligation n'est tombée que pour ce qui est destiné à l'usage personnel ou au prêt.</p>
<p>Par conséquent, l'obligation subsiste pour tout le reste selon la règle d'origine, à condition d'atteindre le seuil (<em>Nisâb</em>) par lui-même ou en le combinant à d'autres biens.</p>
<p>S'il est en dessous du seuil et qu'il ne peut être combiné à un autre bien, il n'y a pas de Zakât à verser ; sauf s'il est destiné au commerce, auquel cas la Zakât est obligatoire sur sa valeur.</p>
<h4 id="règle-concernant-le-plaquage-des-murs-et-autres-à-lor-et-à-largent-ainsi-que-lutilisation-de-récipients-faits-de-ces-métaux"><strong>Règle concernant le plaquage des murs et autres à l'or et à l'argent, ainsi que l'utilisation de récipients faits de ces métaux :</strong></h4>
<p>⁕ Il est interdit de plaquer un plafond ou un mur avec de l'or ou de l'argent, ou de plaquer une partie d'une voiture ou ses clés avec ces métaux. Tout cela est interdit au musulman. Il est également interdit de plaquer un stylo ou un encrier avec de l'or ou de l'argent, car cela relève du gaspillage et de l'ostentation.</p>
<p>⁕ Il est interdit d'utiliser des récipients en or et en argent, ou de plaquer des récipients avec ces métaux. Le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="ltr">«</span><strong><span dir="rtl">الَّذِي يَشْرَبُ فِي آنِيَةِ الذَّهَبِ وَالْفِضَّةِ إِنَّمَا يُجَرْجِرُ فِي بَطْنِهِ نَارَ جَهَنَّمَ</span></strong><span dir="ltr">»</span></p>
<p>« <em><strong>Celui qui boit dans un récipient d'or ou d'argent ne fait qu'ingurgiter dans son ventre le feu de l'Enfer</strong></em> » <a href="#fn11" class="footnote-ref" id="fnref11" role="doc-noteref"><sup>11</sup></a>.</p>
<p>⁕ De même, la menace est sévère pour les hommes qui portent une bague en or. Malheureusement, nous voyons certains musulmans porter des bagues en or à leurs mains, sans se soucier de la menace ou par ignorance. Il est donc obligatoire pour ceux-là de se repentir auprès d'Allah pour s'être parés d'or, et de se contenter de ce qu'Allah a rendu licite, à savoir la bague en argent. Certes, ce qui est licite permet de se passer de ce qui est interdit.</p>
<p class="ar"><span dir="ltr">﴿</span><strong><span dir="rtl">وَمَن يَتَّقِ اللَّهَ يَجْعَل لَّهُ مَخْرَجًا (٢) وَيَرْزُقْهُ مِنْ حَيْثُ لَا يَحْتَسِبُ ۚ وَمَن يَتَوَكَّلْ عَلَى اللَّهِ فَهُوَ حَسْبُهُ ۚ إِنَّ اللَّهَ بَالِغُ أَمْرِهِ ۚ قَدْ جَعَلَ اللَّهُ لِكُلِّ شَيْءٍ قَدْرًا (٣)</span></strong><span dir="rtl">﴾ [الطلاق].</span></p>
<p><strong>« <em>Et quiconque craint Allah, Il lui donnera une issue favorable, et lui accordera Ses dons par des voies sur lesquelles il ne comptait pas. Et quiconque place sa confiance en Allah, Il lui suffit. Allah atteint certainement ce qu’Il S’est proposé, et Il a assigné une mesure à chaque chose.</em> »</strong> [At-Talaq : 2-3].</p>
<p>Nous demandons à Allah d'accorder à tous la clairvoyance dans Sa religion, la mise en pratique de Sa législation et la sincérité pour Son Visage.</p>
