<p>⁕ La Zakat al-Fitr du mois béni de Ramadan est ainsi nommée car la rupture du jeûne (al-Fitr) en est la cause. Son attribution à celle-ci relève donc de l'attribution d'une chose à sa cause.</p>
<p>⁕ La preuve de son obligation repose sur le Livre (le Coran), la Sunnah et le consensus (al-Ijmâ‘).</p>
<p>Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="ltr">﴿</span><strong><span dir="rtl">قَدْ أَفْلَحَ مَن تَزَكَّىٰ</span></strong><span dir="rtl">﴾ [الأعلى: ١٤]</span></p>
<p>« <em><strong>Réussit, certes, celui qui se purifie</strong></em> » [Al-A‘lâ : 14].</p>
<p>Certains pieux prédécesseurs (Salaf) ont dit : « <em>Ce qui est entendu par la purification ici, c'est l'acquittement de la Zakat al-Fitr</em> ».</p>
<p>Elle entre également dans la portée générale de la parole d'Allah le Très-Haut :</p>
<p class="ar"><span dir="ltr">﴿</span><strong><span dir="rtl">وَءَاتُواْ الزَّكَوٰةَ</span></strong><span dir="rtl">﴾ [البقرة : ٤٣]</span></p>
<p>« <em><strong>Et acquittez-vous de la Zakat</strong></em> » [Al-Baqarah : 43].</p>
<p>Et il est rapporté dans les deux recueils authentiques (Al-Bukhari et Muslim) ainsi qu'ailleurs :</p>
<p class="ar"><span dir="ltr">«</span><strong><span dir="rtl">فَرَضَ رَسُولُ اللهِ ﷺ زَكَاةَ الفِطْرِ صَاعاً مِن تَمْرٍ أَوْ صَاعاً مِن شَعِيرٍ ، عَلَى العَبْدِ وَالحُرِّ ، وَالذَّكَرِ وَالأُنْثَى ، وَالصَّغِيرِ وَالكَبِيرِ مِنَ المُسْلِمِينَ</span></strong><span dir="ltr">»</span></p>
<p>« <em><strong>Le Messager d'Allah <span dir="rtl">ﷺ</span> a imposé la Zakat al-Fitr [à hauteur] d'un Sâ‘ de dattes ou d'un Sâ‘ d'orge, pour l'esclave et l'homme libre, l'homme et la femme, le petit et le grand parmi les musulmans</strong></em> ».<a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a></p>
<p>Plus d'un savant a rapporté le consensus des musulmans sur son obligation.</p>
<p>⁕ La sagesse derrière son institution est qu’elle constitue une purification pour le jeûneur des paroles futiles et des propos indécents. Elle sert également de nourriture pour les nécessiteux. Enfin, elle est une expression de gratitude envers Allah le Très-Haut pour avoir permis d'accomplir l'obligation du jeûne.</p>
<p>⁕ La Zakat al-Fitr est obligatoire pour tout musulman : qu'il soit un homme ou une femme, petit ou grand, libre ou esclave. Cela s'appuie sur le hadith d'Ibn 'Umar mentionné précédemment. Dans ce hadith, il est rapporté que le Messager d'Allah <span dir="rtl">ﷺ</span> a imposé (farada) la Zakat al-Fitr à l'esclave et à l'homme libre, à l'homme et à la femme, ainsi qu'au petit et au grand parmi les musulmans. Le terme « a imposé » (farada) signifie ici : a rendu obligatoire et contraignant.</p>
<p>⁕ Le hadith contient également une explication sur la quantité à donner par personne ainsi que sur la nature de ce qui doit être donné. Sa quantité est d'un Sâ‘, ce qui équivaut à quatre Amdâd (pluriel de Mudd). La nature de ce qui doit être donné correspond à la nourriture de base majoritaire du pays, qu'il s'agisse : de froment (blé), d'orge, de dattes, de raisins secs, ou de fromage séché...</p>
<p>Cela inclut également d'autres catégories d'aliments que les gens ont l'habitude de consommer dans le pays et dont l'usage est prédominant, comme : le riz, le maïs et tout ce dont les gens se nourrissent dans chaque pays, selon leurs propres habitudes.</p>
<p>⁕ De même, le Prophète <span dir="rtl">ﷺ</span> a clarifié le moment de son acquittement : il a en effet ordonné qu'elle soit versée avant la prière de l'Aïd. Ainsi, le moment préférable pour la sortir débute au coucher du soleil la nuit de l'Aïd, bien qu'il soit permis de l'avancer d'un jour ou deux avant l'Aïd. Al-Bukhârî (qu'Allah lui fasse miséricorde) a d'ailleurs rapporté que les compagnons la donnaient un jour ou deux avant la rupture <a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a>, ce qui constituait un consensus de leur part.</p>
<p>⁕ Il est préférable de s'en acquitter le jour de l'Aïd avant la prière. Si ce moment est dépassé et que la personne retarde son acquittement au-delà de la prière de l'Aïd, elle a l'obligation de la verser à titre de rattrapage (<em>qadâ'</em>). Ceci s'appuie sur le hadith d'Ibn 'Abbas : «<em><strong>Celui qui l'accomplit avant la prière, c'est une zakat acceptée ; et celui qui l'accomplit après la prière, ce n'est qu'une aumône parmi d'autres</strong></em>»<a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a>. De plus, la personne commet un péché en retardant son versement au-delà du temps imparti, car elle contrevient ainsi à l'ordre du Messager d'Allah <span dir="rtl">ﷺ</span>.</p>
<p>⁕ Le musulman verse la Zakat al-Fitr pour lui-même ainsi que pour ceux qui sont à sa charge — c'est-à-dire ceux pour qui il subvient aux besoins — parmi ses épouses et ses proches. Cela s'appuie sur la portée générale de la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><strong><span dir="rtl">أَدُّوا الْفِطْرَةَ عَمَّنْ تُمَوِّنونَ</span></strong></p>
<p>« <em><strong>Acquittez la [Zakat al-] Fitr pour ceux qui sont à votre charge</strong></em> ».<a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a></p>
<p>⁕ Il est <strong>recommandé</strong> (<em>mustahabb</em>) de s'en acquitter pour le <strong>fœtus</strong> (l'enfant à naître), conformément à ce que faisait <strong>'Uthman</strong> (qu'Allah l'agrée).</p>
<p>⁕ Quant à celui dont la charge de la Zakat al-Fitr incombe normalement à un tiers, s'il l'acquitte lui-même sans l'autorisation de la personne qui en avait la charge, cela est valide (suffisant). En effet, l'obligation lui incombe à lui à l'origine, le tiers ne faisant que l'assumer à sa place. En revanche, si une personne l'acquitte pour une autre personne dont elle n'a pas la charge financière : si cela est fait avec son autorisation, c'est valide ; mais sans son autorisation, cela n'est pas valide (ne compte pas).</p>
<p>⁕ Celui qui a l'obligation de verser la Zakat al-Fitr pour autrui peut s'en acquitter en même temps que la sienne dans l'endroit où il se trouve lui-même, et ce, même si la personne pour laquelle il verse la Zakat réside dans un autre lieu.</p>
<p>⁕ Nous souhaitons rapporter ici les propos d'Ibn al-Qayyim <a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a> concernant la nature de ce qui doit être donné pour la Zakat al-Fitr. Il a dit (qu'Allah lui fasse miséricorde), après avoir mentionné les cinq catégories citées dans le hadith :</p>
<p>"<em>Ces catégories constituaient la nourriture de base majoritaire des gens de Médine. Quant aux habitants d'un pays ou d'une localité dont la nourriture de base est différente, ils doivent donner un Sâ‘ de leur propre nourriture. Si leur nourriture ne consiste pas en des grains (céréales), mais par exemple en du lait, de la viande ou du poisson, ils versent alors leur Zakât Al-Fitr à partir de leur nourriture habituelle, quelle qu'elle soit. C'est là l'avis de la majorité des savants, et c'est l'avis correct en dehors duquel aucun autre ne devrait être soutenu. En effet, le but recherché est de combler le besoin des nécessiteux le jour de l'Aïd et de les soutenir avec la nature de ce que les habitants de leur pays consomment. Dès lors, la farine est valable, même si aucun hadith authentique ne la mentionne spécifiquement. Quant au fait de donner du pain ou un plat cuisiné : bien que cela puisse être plus utile aux pauvres car cela demande moins de préparation et de frais, le grain brut peut parfois leur être plus bénéfique car il se conserve plus longtemps.</em>" Fin de citation.</p>
<p>Et Cheikh al-Islâm Ibn Taymiyyah a dit : "<em>On donne de la nourriture de base de son pays comme le riz ou autre, même si l'on est capable de se procurer les catégories mentionnées dans le hadith. C'est une version rapportée de l'imam Ahmad et l'avis de la plupart des savants, et c'est l'avis le plus authentique. Car la règle de base concernant les aumônes est qu'elles sont obligatoires à titre de soutien aux pauvres (selon leurs besoins).</em>" <a href="#fn6" class="footnote-ref" id="fnref6" role="doc-noteref"><sup>6</sup></a> Fin de citation.</p>
<p>⁕ <strong>Quant au fait de s'acquitter de la valeur de la Zakat al-Fitr en versant de l'argent à la place [de la nourriture], cela est contraire à la Sunnah et n'est donc pas valide (non suffisant).</strong> En effet, il n'a été rapporté ni du Prophète <span dir="rtl">ﷺ</span>, ni d'aucun de ses compagnons, qu'ils aient versé la valeur [en argent] pour la Zakat al-Fitr.</p>
<p>L'imam Ahmad a dit :</p>
<p>"<em>On ne donne pas la valeur [en argent]".</em></p>
<p>On lui dit : <em>"Certains disent qu'Umar ibn Abd al-Aziz acceptait la valeur ?"</em></p>
<p><em>Il répondit : "Ils délaissent la parole du Messager d'Allah <span dir="rtl">ﷺ</span> pour dire : 'Untel a dit', alors qu'Ibn 'Umar a rapporté :</em> “<em><strong>Le Messager d'Allah <span dir="rtl">ﷺ</span> a imposé la Zakat al-Fitr [à hauteur d'] un Sâ‘...</strong></em>” [jusqu'à la fin du] hadith ?!" <a href="#fn7" class="footnote-ref" id="fnref7" role="doc-noteref"><sup>7</sup></a></p>
<p>⁕ Il est impératif que la <strong>Sadaqat al-Fitr</strong> parvienne à celui qui y a droit dans le délai imparti pour son acquittement. Alternativement, elle doit parvenir à son mandataire (<em>wakil</em>) que l'ayant droit a chargé de la recevoir en son nom. Si le donateur ne trouve pas la personne à qui il souhaite la donner, ni son mandataire, dans le délai imparti, il a alors l'obligation de la donner à une autre personne [éligible].</p>
<p>Sur ce point, certaines personnes commettent une erreur en déposant la Zakat al-Fitr auprès d'un individu qui n'a pas été mandaté par l'ayant droit. Ceci n'est pas considéré comme un acquittement valide de la Zakat al-Fitr, il est donc impératif de mettre en garde contre cette pratique.</p>
