<p>⁕ Parallèlement à la Zakat obligatoire sur les biens, il existe une aumône recommandée qui est prescrite à tout moment, en raison de l'incitation générale à celle-ci dans le Livre et la Sunna, ainsi que de l'encouragement à la pratiquer ؛ en effet, Allah y a incité dans Son Noble Livre à travers de nombreux versets :</p>
<p>Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="ltr">﴿</span><strong><span dir="rtl">وَءَاتَى الْمَالَ عَلَىٰ حُبِّهِۦ ذَوِى الْقُرْبَىٰ وَالْيَتَٰمَىٰ وَالْمَسَٰكِينَ وَابْنَ السَّبِيلِ وَالسَّائِلِينَ وَفِي الرِّقَابِ</span></strong><span dir="rtl">﴾ [البقرة : ١٧٧].</span></p>
<p>« <em><strong>...et donne son bien, quelqu'amour qu'il en ait, aux proches, aux orphelins, aux nécessiteux, aux voyageurs de passage et à ceux qui demandent l'aide, et pour délier les jougs [affranchir les esclaves]</strong></em> » [Al-Baqarah : 177].</p>
<p>Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="ltr">﴿</span><strong><span dir="rtl">وَأَن تَصَدَّقُوا خَيْرٌ لَّكُمْ إِن كُنتُمْ تَعْلَمُونَ</span></strong><span dir="rtl">﴾ [البقرة : ٢٨٠]</span></p>
<p>« <em><strong>...et que vous fassiez remise de la dette à titre d'aumône, c'est mieux pour vous, si seulement vous saviez !</strong></em> » [Al-Baqarah : 280].</p>
<p>Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="ltr">﴿</span><strong><span dir="rtl">مَّن ذَا الَّذِى يُقْرِضُ اللَّهَ قَرْضًا حَسَنًا فَيُضَٰعِفَهُۥ لَهُۥٓ أَضْعَافًا كَثِيرَةً</span></strong><span dir="rtl">﴾ [البقرة : ٢٤٥]</span></p>
<p>« <em><strong>Quiconque prête à Allah un bon prêt, Il le lui multipliera de nombreuses fois.</strong></em> » [Al-Baqarah : 245].</p>
<p>Le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="ltr">«</span><strong><span dir="rtl">إِنَّ الصَّدَقَةَ لَتُطْفِئُ غَضَبَ الرَّبِّ وَتَدْفَعُ مِيتَةَ السُّوءِ</span></strong><span dir="ltr">»</span></p>
<p>« <em><strong>Certes, l'aumône éteint la colère du Seigneur et repousse une mauvaise fin [une mort funeste]</strong></em> » Rapporté par At-Tirmidhi qui l'a jugé bon (Hasan).<a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a></p>
<p>Et dans les deux recueils authentiques (Al-Bukhari et Muslim) :</p>
<p class="ar"><span dir="ltr">«</span><strong><span dir="rtl">سَبْعَةٌ يُظِلُّهُمُ اللهُ فِي ظِلِّهِ يَوْمَ لَا ظِلَّ إِلَّا ظِلُّهُ..</span></strong><span dir="rtl">.» ، وَذَكَرَ مِنْهُمْ : «<strong>وَرَجُلًا تَصَدَّقَ بِصَدَقَةٍ فَأَخْفَاهَا حَتَّى لَا تَعْلَمَ شِمَالُهُ مَا تُنْفِقُ يَمِينُهُ</strong></span><span dir="ltr">»</span></p>
<p>« <em><strong>Il y a sept catégories de personnes qu'Allah couvrira de Son ombre le jour où il n'y aura d'ombre que la Sienne...</strong></em> » ، et il cita parmi eux : « <em><strong>...et un homme qui a donné une aumône et l'a cachée au point que sa main gauche ne sache pas ce que sa main droite a dépensé</strong></em> ».<a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a></p>
<p>Et les hadiths à ce sujet sont nombreux.</p>
<p>⁕ L'aumône secrète est préférable ; en raison de la parole d'Allah le Très-Haut :</p>
<p class="ar"><span dir="ltr">﴿</span><strong><span dir="rtl">وَإِن تُخْفُوهَا وَتُؤْتُوهَا الْفُقَرَآءَ فَهُوَ خَيْرٌ لَّكُمْ</span></strong><span dir="rtl">﴾ [البقرة : ٢٧١]</span></p>
<p>« <em><strong>Mais si vous les cachez et les donnez aux pauvres, ce sera mieux pour vous</strong></em> » [Al-Baqarah : 271] et parce qu'elle éloigne davantage de l'ostentation (ar-riyâ') ; à moins que le fait de montrer l'aumône et de la rendre publique n'entraîne un intérêt prépondérant, comme le fait que les gens suivent cet exemple.</p>
<p>⁕ Il convient également que l'âme du donateur soit habitée par la générosité et la bienveillance lors de son don, sans qu'il ne rappelle avec condescendance sa faveur au nécessiteux.</p>
<p>Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="ltr">﴿</span><strong><span dir="rtl">يَٰأَيُّهَا الَّذِينَ ءَامَنُوا لَا تُبْطِلُوا صَدَقَٰتِكُم بِالْمَنِّ وَالْأَذَىٰ</span></strong><span dir="rtl">﴾ [البقرة : ٢٦٤]</span></p>
<p>{ <em><strong>Ô vous qui croyez ! Ne rendez pas vaines vos aumônes en rappelant vos bienfaits ou en causant un tort</strong></em> } [Al-Baqarah : 264]. »</p>
<p>⁕ L'aumône faite en période de bonne santé est meilleure. Le Prophète <span dir="rtl">ﷺ</span> a dit, lorsqu'on l'interrogea sur la meilleure des aumônes :</p>
<p class="ar"><span dir="ltr">«</span><strong><span dir="rtl">أَنْ تَصَدَّقَ وَأَنْتَ صَحِيحٌ شَحِيحٌ، تَأْمُلُ الْغِنَى وَتَخْشَى الْفَقْرَ</span></strong><span dir="ltr">»</span></p>
<p>"<em><strong>C'est que tu donnes en aumône alors que tu es en bonne santé et attaché à tes biens, espérant la richesse et redoutant la pauvreté</strong></em>".<a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a></p>
<p>⁕ L'aumône dans les deux Nobles Sanctuaires (La Mecque et Médine) est meilleure ; en raison de l'ordre d'Allah à ce sujet dans Sa parole :</p>
<p class="ar"><span dir="ltr">﴿</span><strong><span dir="rtl">فَكُلُوا مِنْهَا وَأَطْعِمُوا الْبَائِسَ الْفَقِيرَ</span></strong><span dir="rtl">﴾ [الحج : ٢٨]</span></p>
<p>{ <em><strong>Mangez-en donc vous-mêmes, et faites-en manger le besogneux misérable</strong></em> } [Al-Hajj : 28].</p>
<p>⁕ L'aumône durant le mois de Ramadan est meilleure ; en raison de la parole d'Ibn 'Abbas : "<em><strong>Le Messager d'Allah <span dir="rtl">ﷺ</span> était le plus généreux des hommes, et il l'était plus encore pendant le Ramadan, lorsqu'il rencontrait Gabriel. Il était alors plus prompt au bien que le vent envoyé [en rafales]</strong></em>"<a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a></p>
<p>⁕ L'aumône durant les périodes de besoin est meilleure.</p>
<p>Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="ltr">﴿</span><strong><span dir="rtl">أَوْ إِطْعَٰمٌ فِي يَوْمٍ ذِي مَسْغَبَةٍ * يَتِيمًا ذَا مَقْرَبَةٍ * أَوْ مِسْكِينًا ذَا مَتْرَبَةٍ</span></strong><span dir="rtl">﴾ [البلد : ١٤-١٦]</span></p>
<p>{ <em><strong>Ou nourrir, en un jour de famine, un orphelin proche parent ou un pauvre dans le dénuement</strong></em> } [Al-Balad : 14-16].</p>
<p>⁕ De même, l'aumône faite aux proches parents et aux voisins est meilleure que celle faite aux personnes éloignées ؛ en effet, Allah a enjoint de bien agir envers les proches et leur a octroyé un droit sur leur parent dans de nombreux versets ؛ à l'image de Sa parole — qu'Il soit Très-Haut — :</p>
<p class="ar"><span dir="ltr">﴿</span><strong><span dir="rtl">وَءَاتِ ذَا الْقُرْبَىٰ حَقَّهُۥ</span></strong><span dir="rtl">﴾ [الإسراء : ٢٦]</span></p>
<p>{ <em><strong>Et donne au proche parent ce qui lui revient de droit</strong></em> } [Al-Isra : 26].</p>
<p>Le Prophète <span dir="rtl">ﷺ</span> a également dit :</p>
<p class="ar"><span dir="ltr">«</span> <strong><span dir="rtl">الصَّدَقَةُ عَلَى الْمِسْكِينِ صَدَقَةٌ، وَعَلَى ذِي الرَّحِمِ اثْنَتَانِ : صَدَقَةٌ وَصِلَةٌ</span></strong> <span dir="ltr">»</span></p>
<p>"<em><strong>L'aumône faite au nécessiteux est une simple aumône, tandis que celle faite au proche parent en compte deux : une aumône et un maintien des liens de parenté", rapporté par les cinq [auteurs de recueils] et d'autres</strong></em>. <a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a></p>
<p>Et il est mentionné dans les deux Authentiques (Al-Bukhari et Muslim) :</p>
<p class="ar"><span dir="ltr">«</span> <span dir="rtl"><strong>أَجْرَانِ : أَجْرُ الْقَرَابَةِ، وَأَجْرُ الصَّدَقَةِ</strong></span> <span dir="ltr">»</span></p>
<p>"<em><strong>[Il y a pour cela] deux récompenses : la récompense du lien de parenté et la récompense de l'aumône</strong></em>"<a href="#fn6" class="footnote-ref" id="fnref6" role="doc-noteref"><sup>6</sup></a></p>
<p>⁕ Sache ensuite qu'il existe sur les biens des droits autres que la Zakat [obligatoire] ; tels que le soutien aux proches, le maintien des liens avec les frères, le don à celui qui sollicite, le prêt d'objets à celui qui est dans le besoin, le délai accordé à celui qui est en difficulté de paiement, et l'octroi d'un prêt à celui qui cherche à emprunter.</p>
<p>Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="ltr">﴿</span><strong><span dir="rtl">وَفِيٓ أَمْوَٰلِهِمْ حَقٌّ لِّلسَّآئِلِ وَالْمَحْرُومِ</span></strong><span dir="rtl">﴾ [الذاريات : ١٩]</span></p>
<p>{ <em><strong>Et dans leurs biens, il y avait un droit pour celui qui demande et pour le déshérité</strong></em> } [Al-Dhariyat : 19].</p>
<p>⁕ Et il est obligatoire de nourrir l'affamé, d'honorer l'hôte [par l'hospitalité], de vêtir celui qui est dénué d'habits et de désaltérer celui qui a soif. Bien plus, l'Imam Malik — qu'Allah lui fasse miséricorde — était d'avis qu'il est obligatoire pour les musulmans de racheter [la liberté de] leurs prisonniers, quand bien même cela épuiserait la totalité de leurs biens.</p>
<p>⁕ De même, il est prescrit à celui qui acquiert un bien en présence de pauvres et de nécessiteux de leur en faire l'aumône. Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="ltr">﴿</span><strong><span dir="rtl">وَءَاتُوا حَقَّهُ يَوْمَ حَصَادِهِ</span></strong><span dir="rtl">﴾ [الأنعام : ١٤١]</span></p>
<p>{ <em><strong>Et acquittez-en les droits le jour de la récolte</strong></em> } [Al-An'am : 141].</p>
<p>Et Il a dit :</p>
<p class="ar"><span dir="ltr">﴿</span><strong><span dir="rtl">وَإِذَا حَضَرَ الْقِسْمَةَ أُوْلُوا الْقُرْبَىٰ وَالْيَتَٰمَىٰ وَالْمَسَٰكِينُ فَارْزُقُوهُم مِّنْهُ وَقُولُوا لَهُمْ قَوْلًا مَّعْرُوفًا</span></strong><span dir="rtl">﴾ [النساء : ٨]</span></p>
<p>{ <em><strong>Et lorsque les proches parents, les orphelins et les nécessiteux assistent au partage [d'un héritage], donnez-leur-en quelque chose, et tenez-leur des propos bienveillants</strong></em> } [An-Nisa : 8].</p>
<p>Cela compte parmi les beautés de la religion musulmane ; car c'est une religion de solidarité et de miséricorde, ainsi qu'une religion d'entraide et de fraternité en Allah. Quelle magnifique religion et quelle législation pleine de sagesse !</p>
<p>Nous demandons à Allah le Très-Haut de nous accorder la clairvoyance dans Sa religion et la fermeté dans l'attachement à Sa législation. Certes, Il est Celui qui entend tout et qui exauce [les douas].</p>
