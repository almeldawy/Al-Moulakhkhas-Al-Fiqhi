<p>Sachez — qu’Allah nous accorde, à vous et à moi, la réussite — qu'il est indispensable de connaître les détails des règles de la Zakât, ses conditions, ainsi que l’explication de ceux à qui elle incombe, ceux qui y ont droit, et les types de biens sur lesquels elle est obligatoire.</p>
<p>⁕ En effet, la Zakât est l’un des piliers de l’Islam et l’une de ses bases grandioses, comme en témoignent les preuves du Livre (le Coran) et de la Sunna. Allah — qu’Il soit Exalté — l’a associée à la prière dans Son Livre en quatre-vingt-deux endroits, ce qui prouve l'importance de son rang, la perfection de son lien avec la prière et la solidité de leur corrélation. À tel point que le véridique (Siddîq) de cette communauté et premier calife du Messager, Abû Bakr As-Siddîq — qu'Allah l'agrée — a dit :</p>
<p class="ar"><span dir="ltr">«</span><strong><span dir="rtl">لَأُقَاتِلَنَّ مَنْ فَرَّقَ بَيْنَ الصَّلَاةِ وَالزَّكَاةِ</span></strong><span dir="ltr">».</span></p>
<p>« <em><strong>Je combattrai sûrement quiconque fait une distinction entre la prière et la Zakât.</strong></em> »</p>
<p>Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="ltr">﴿</span><strong><span dir="rtl">وَأَقِيمُوا الصَّلَاةَ وَآتُوا الزَّكَاةَ</span></strong><span dir="rtl">﴾ [البقرة : ٤٣]</span></p>
<p>« <em><strong>Et accomplissez la prière et acquittez la Zakât</strong></em>. » [Sourate Al-Baqarah : 43].</p>
<p>Et le Très-Haut a dit :</p>
<p class="ar"><span dir="ltr">﴿</span><strong><span dir="rtl">فَإِنْ تَابُوا وَأَقَامُوا الصَّلَاةَ وَآتُوا الزَّكَاةَ فَخَلُّوا سَبِيلَهُمْ</span></strong><span dir="rtl">﴾ [التوبة : ٥]</span></p>
<p>« <em><strong>Si donc ils se repentent, accomplissent la prière et acquittent la Zakât, alors laissez-leur la voie libre.</strong></em> » [Sourate At-Tawbah : 5].</p>
<p>Le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="ltr">«</span><strong><span dir="rtl">بُنِيَ الإِسْلَامُ عَلَى خَمْسٍ : شَهَادَةِ أَنْ لَا إِلَهَ إِلَّا اللهُ وَأَنَّ مُحَمَّداً رَسُولُ اللهِ ، وَإِقَامِ الصَّلَاةِ ، وَإِيتَاءِ الزَّكَاةِ...</span></strong><span dir="rtl">» (١) الحَدِيث .</span></p>
<p>« <em><strong>L'Islam est bâti sur cinq (piliers) : le témoignage qu'il n'y a de divinité digne d'adoration qu'Allah et que Muhammad est le Messager d'Allah, l'accomplissement de la prière, l'acquittement de la Zakât...</strong></em> » <a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a></p>
<p>Et les musulmans sont unanimes quant à son caractère obligatoire et au fait qu'elle est le troisième pilier de l'Islam. <strong>Ils sont également unanimes sur la mécréance de celui qui nie son obligation, et sur la nécessité de combattre celui qui refuse de s'en acquitter</strong>.</p>
<p>⁕ <strong>Elle (la Zakât) a été prescrite durant la deuxième année de l'Hégire prophétique</strong>. Le Messager d'Allah <span dir="rtl">ﷺ</span> envoyait des collecteurs pour la percevoir et la ramasser afin de la transmettre à ceux qui y ont droit. C’est ainsi que se sont maintenues la tradition (<em>sunna</em>) des califes bien guidés et la pratique des musulmans.</p>
<p>⁕ La Zakât constitue un acte de bienfaisance envers la création. Elle est une purification du bien contre toute souillure, une protection pour celui-ci contre les calamités, et un acte d'adoration envers le Seigneur — Gloire à Lui —. Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="ltr">﴿</span><strong><span dir="rtl">خُذْ مِنْ أَمْوَالِهِمْ صَدَقَةً تُطَهِّرُهُمْ وَتُزَكِّيهِمْ بِهَا وَصَلِّ عَلَيْهِمْ إِنَّ صَلَوتَكَ سَكَنٌ لَهُمْ وَاللَّهُ سَمِيعٌ عَلِيمٌ</span></strong><span dir="rtl">﴾ [التوبة : ١٠٣]</span></p>
<p>"<em><strong>Prélève de leurs biens une aumône par laquelle tu les purifies et les bénis, et prie pour eux. Ta prière est une source de quiétude pour eux. Et Allah est Audient et Omniscient</strong></em>" [Sourate At-Tawbah : 103].</p>
<p>Par conséquent, elle est une purification des âmes contre l'avarice et la cupidité. Elle est également une épreuve pour le riche, car il se rapproche d'Allah en donnant une partie de ses biens qui lui sont chers.</p>
<p>⁕ Allah l'a rendue obligatoire sur les biens qui permettent le partage et dans lesquels la croissance et le profit sont fréquents :</p>
<ul>
<li><blockquote>
<p>soit ce qui croît par soi-même, comme le bétail et les récoltes ;</p>
</blockquote></li>
<li><blockquote>
<p>soit ce qui croît par la gestion et l'activité commerciale, comme l'or, l'argent et les marchandises.</p>
</blockquote></li>
</ul>
<p>Allah a déterminé la proportion à prélever pour la Zakât en fonction de l'effort fourni pour obtenir le bien dont elle est issue :</p>
<ul>
<li><blockquote>
<p>Il a ainsi imposé <strong>le cinquième</strong> (1/5) pour le <em>Rikâz</em> (<em>le trésor enfoui datant de l'époque préislamique</em>).</p>
</blockquote></li>
<li><blockquote>
<p>Pour ce qui demande un effort d'un seul côté — comme ce qui est irrigué sans frais (pluie, source) — Il a imposé <strong>la moitié du cinquième</strong> (1/10).</p>
</blockquote></li>
<li><blockquote>
<p>Pour ce qui demande un effort des deux côtés (travail et frais d'irrigation), Il a imposé <strong>le quart du cinquième</strong> (1/20).</p>
</blockquote></li>
<li><blockquote>
<p>Enfin, pour ce qui nécessite beaucoup d'efforts et de transactions, comme l'argent liquide et les marchandises, Il a imposé <strong>le huitième du cinquième</strong> (1/40, soit 2,5%).</p>
</blockquote></li>
</ul>
<p>⁕ <strong>Allah l'a nommée "Zakât" car elle purifie (<em>tuzakkî</em>) l'âme et les biens</strong>. Elle n'est ni une amende, ni un impôt qui diminuerait les biens ou porterait préjudice à son propriétaire.</p>
<p>Bien au contraire, elle accroît la richesse par une croissance que les gens ne perçoivent pas. Le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="ltr">«</span><strong><span dir="rtl">مَا نَقَصَ مَالٌ مِنْ صَدَقَةٍ</span></strong><span dir="ltr">»</span></p>
<p>"<em><strong>Jamais une aumône n'a diminué un bien</strong></em>" <a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a>.</p>
<p>⁕ La Zakât, dans la Loi religieuse (<em>Shar‘</em>), est un droit obligatoire sur des biens spécifiques, destiné à une catégorie de personnes précise, à un moment déterminé qui correspond :</p>
<ul>
<li><blockquote>
<p>à l'écoulement d'une année entière (<em>al-hawl</em>) pour le bétail, l'argent liquide et les marchandises.</p>
</blockquote></li>
<li><blockquote>
<p>au durcissement du grain et l'apparition de la maturité pour les fruits.</p>
</blockquote></li>
<li><blockquote>
<p>à l’obtention de la quantité requise pour le miel.</p>
</blockquote></li>
<li><blockquote>
<p>à l'extraction pour ce qui concerne les minerais.</p>
</blockquote></li>
<li><blockquote>
<p>au coucher du soleil la veille de l'Aïd pour la <em>Zakât al-Fitr</em>.</p>
</blockquote></li>
</ul>
<p>⁕ La Zakât est obligatoire pour le musulman lorsque cinq conditions sont réunies :</p>
<p><strong>➛ La première :</strong> La liberté. Elle n'est pas obligatoire pour l'esclave, car il ne possède pas de biens. Ce qu'il possède appartient à son maître ; c'est donc au maître de s'acquitter de la Zakât sur ces biens.</p>
<p><strong>➛ La deuxième condition :</strong> Que le détenteur des biens soit musulman. Elle n'est donc pas obligatoire pour le mécréant, en ce sens qu'il n'est pas sommé de s'en acquitter (dans ce bas monde). Car la Zakât est un acte de rapprochement et d'obéissance, alors que le mécréant ne fait pas partie des gens voués à l'adoration et à l'obéissance. De plus, elle nécessite une intention (niyyah), chose qui ne peut émaner d'un non-musulman. Quant à son obligation pour lui dans le sens où il en est l'interpellé et qu'il sera puni spécifiquement pour cela dans l'au-delà, cela fait l'objet d'une divergence entre les gens de science. Et dans le hadith de Mou'âdh (qu'Allah l'agrée) : « <em><strong>Appelle-les à témoigner qu'il n'y a de divinité digne d'adoration qu'Allah et que Muhammad est l'Envoyé d'Allah »,</strong></em> puis il mentionna la prière, puis il dit : <em><strong>« S'ils t'obéissent en cela, alors informe-les qu'Allah leur a imposé une aumône (Zakât) qui sera prélevée de leurs riches pour être reversée à leurs pauvres</strong></em> ». (Rapporté par Al-Bukhârî et Muslim)<a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a> . Il a donc fait de l'Islam une condition pour l'obligation de la Zakât.</p>
<p><strong>➛ La troisième condition :</strong> La possession du seuil minimal (<em>Nissâb</em>). Elle n'est pas obligatoire en deçà du Nissâb, qui est une quantité déterminée de biens dont le détail viendra plus tard. Que le propriétaire du Nissâb soit un adulte ou un enfant, une personne saine d'esprit ou un fou, en raison de la généralité des preuves.</p>
<p><strong>➛ La quatrième condition :</strong> La stabilité de la propriété. Cela signifie qu'aucun droit d'autrui n'y est rattaché. Ainsi, il n'y a pas de Zakât sur un bien dont la propriété n'est pas stable, comme la dette de l'esclave en contrat d'affranchissement (<em>al-moukâtib</em>), car ce dernier a le pouvoir de se déclarer incapable de payer et peut ainsi s'abstenir du versement.</p>
<p><strong>➛ La cinquième condition :</strong> l'écoulement d'une année (al-hawl) sur les biens ؛ en raison du hadith d'Aïcha (qu'Allah l'agrée) :</p>
<p class="ar"><span dir="ltr">«</span> <span dir="rtl"><strong>لَا زَكَاةَ فِي مَالٍ حَتَّى يَحُولَ عَلَيْهِ الْحَوْلُ</strong></span> <span dir="ltr">»</span></p>
<p>« <em><strong>Point de Zakat sur un bien tant qu'une année ne s'est pas écoulée sur celui-ci</strong></em> » , rapporté par Ibn Majah, et At-Tirmidhi en a rapporté le sens.<a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a></p>
<p>Et cela concerne ce qui ne provient pas de la terre ؛ comme les céréales et les fruits. Quant à ce qui sort de la terre ؛ la Zakat y est obligatoire au moment de sa récolte (sa présence) ؛ l'écoulement de l'année n'y est donc pas pris en compte. L'achèvement de l'année reste cependant une condition pour l'argent (les liquidités), le bétail et les marchandises destinées au commerce, par indulgence envers le propriétaire ؛ afin que la croissance de ces biens soit complète.</p>
<p>⁕ Le produit (les petits) du bétail soumis à la Zakât ainsi que le bénéfice du commerce ont pour année de référence celle de leur base (le capital initial) ; il n'est donc pas exigé qu'une année entière et indépendante s'écoule pour eux si leur base avait déjà atteint le seuil d'imposition (Nisâb) , mais si tel n'était pas le cas ; le décompte de l'année commence dès l'instant où ils atteignent ensemble le seuil d'imposition (Nisâb).<a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a></p>
<p>⁕ Celui qui détient une créance envers une personne en difficulté financière (insolvable) ، il doit alors s'acquitter de sa Zakât pour une seule année au moment où il la récupère ، selon l'avis prépondérant. Mais s'il détient une créance envers une personne aisée et disposée à payer , alors il doit s'en acquitter chaque année.</p>
<p>⁕ Quant aux biens destinés à la possession personnelle et à l’usage, ils ne sont pas soumis à la Zakat ; comme les maisons d'habitation، les vêtements de tous les jours، les meubles de la maison، les voitures et les bêtes destinées à être montées et utilisées.</p>
<p>⁕ Quant à ce qui est destiné à la location, comme les voitures, les magasins et les maisons, il n'y a pas de Zakat à payer sur leur valeur d'origine. La Zakat est uniquement obligatoire sur le montant du loyer perçu, si celui-ci atteint le seuil (Nissâb) par lui-même ou en l'ajoutant à d'autres biens, et qu'une année lunaire s'est écoulée (Hawl).</p>
<p>⁕ Et quiconque était redevable de la Zakât, puis meurt avant de s’en être acquitté ، il est alors obligatoire de la prélever sur sa succession. Elle ne s'annule pas avec la mort ، en raison de la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><strong><span dir="rtl">«فَدَيْنُ اللهِ أَحَقُّ بِالْوَفَاءِ»</span></strong></p>
<p>"<em><strong>La dette d'Allah est plus en droit d'être acquittée</strong></em>" (Rapporté par Al-Boukhârî, Mouslim et d'autres).<a href="#fn6" class="footnote-ref" id="fnref6" role="doc-noteref"><sup>6</sup></a></p>
<p>L'héritier ou un autre doit donc la prélever sur l'héritage du défunt , car c'est un droit obligatoire qui ne tombe pas avec le décès. C'est une dette qui pèse sur la conscience du défunt dont il doit être libéré.</p>
<aside id="footnotes" class="footnotes footnotes-end-of-document" role="doc-endnotes">
<hr />
<ol>
<li id="fn1"><p>Rapporté par Al-Bukhârî (8) et Muslim (16).<a href="#fnref1" class="footnote-back" role="doc-backlink">↩︎</a></p></li>
<li id="fn2"><p>Rapporté par Al-Tirmidhî (2325), qui a dit : « (ce hadith est) bon et authentique » (Hasan Sahîh). Il figure également dans le recueil de Muslim (2588) avec la formulation : « ...une aumône prélevée sur un bien ».<a href="#fnref2" class="footnote-back" role="doc-backlink">↩︎</a></p></li>
<li id="fn3"><p>Rapporté par Al-Bukhârî (1395) et Muslim (19).<a href="#fnref3" class="footnote-back" role="doc-backlink">↩︎</a></p></li>
<li id="fn4"><p>Rapporté par Ibn Mâjah (1793) ، et rapporté par At-Tirmidhî (631) d'après le hadith d'Ibn 'Umar.</p>
<p>Il a également été rapporté de manière suspendue (mawquf) d'après 'Alî. Voir : « As-Sunan » d'Abû Dâwud (1573) ، et Ahmad (1264).<a href="#fnref4" class="footnote-back" role="doc-backlink">↩︎</a></p></li>
<li id="fn5"><p>Note du traducteur : Voici quelques exemples pour y voir plus clair :</p>
<p>1/ <strong><u>Le cas du bétail (Al-Mawâshî):</u></strong> Si vous possédez un troupeau qui atteint déjà le Nisâb, les petits qui naissent durant l'année sont comptabilisés avec les parents à la fin de l'année, même s'ils n'ont que quelques jours ou quelques mois.</p>
<p><em>Exemple concret :</em></p>
<p>1er Muharram : Vous possédez 40 moutons (le Nisâb du mouton est de 40). Votre année de Zakât commence.</p>
<p>Ramadan : 10 agneaux naissent. Vous avez maintenant 50 moutons.</p>
<p>1er Muharram (année suivante) : L'année est révolue. Vous ne payez pas la Zakât sur 40, mais sur les 50 moutons. On ne demande pas que les 10 agneaux attendent une année à part entière.</p>
<p><strong><u>2/ Le cas du bénéfice commercial (Ribh at-Tijârah):</u></strong> Le bénéfice réalisé grâce à une activité commerciale est ajouté au capital initial. On ne commence pas un nouveau décompte pour chaque euro de profit gagné en cours d'année.</p>
<p><em>Exemple concret :</em></p>
<p>1er Chawwâl : Un commerçant possède un capital de 5 000 € en marchandises et liquidités (supposons que le Nisâb est de 4 500 €). Son année commence.</p>
<p>Rajab (9 mois plus tard) : Il réalise une excellente vente et gagne 2 000 € de bénéfice net.</p>
<p>1er Chawwâl (année suivante) : Il doit sortir la Zakât (2,5 %) sur la somme totale de 7 000 €, bien que les 2 000 € de profit n'aient pas passé un an entre ses mains.</p>
<p>3<strong><u>/ Si la base n'avait pas atteint le Nisâb:</u></strong> si au départ vous n'aviez pas assez pour être imposable, le compte à rebours de l'année ne commence que le jour où, grâce aux naissances ou aux bénéfices, vous atteignez enfin le seuil.</p>
<p><em>Exemple concret:</em></p>
<p>1er Chawwâl : Vous avez 30 moutons. (Pas de Zakât car le Nisâb est de 40).</p>
<p>Rajab (9 mois plus tard) : 12 agneaux naissent. Vous avez maintenant 42 moutons.</p>
<p>Le point de départ : C'est à Rajab que votre année (Hawl) commence officiellement. Vous devrez payer la Zakât l'année suivante au mois de Rajab si vous avez toujours au moins 40 moutons à ce moment-là.<a href="#fnref5" class="footnote-back" role="doc-backlink">↩︎</a></p></li>
<li id="fn6"><p>Rapporté par Al-Bukhârî (1853) avec les termes : « mérite le plus d'être acquittée »، et par Muslim (1148) avec les termes : « a le plus de droit à être acquittée ». Et Al-Bukhârî (1852) l'a rapporté avec les termes : « ... car Allah mérite plus que tout que l'on s'acquitte de Sa dette ».<a href="#fnref6" class="footnote-back" role="doc-backlink">↩︎</a></p></li>
</ol>
