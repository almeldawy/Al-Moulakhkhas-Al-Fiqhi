<p>⁕ Sache qu'il n'est pas valable de verser la Zakât, si ce n'est aux catégories qu'Allah a déterminées dans Son Noble Livre.</p>
<p>Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="ltr">﴿</span><strong><span dir="rtl">إِنَّمَا الصَّدَقَاتُ لِلْفُقَرَاءِ وَالْمَسَاكِينِ وَالْعَامِلِينَ عَلَيْهَا وَالْمُؤَلَّفَةِ قُلُوبُهُمْ وَفِي الرِّقَابِ وَالْغَارِمِينَ وَفِي سَبِيلِ اللهِ وَابْنِ السَّبِيلِ فَرِيضَةً مِنَ اللهِ وَاللهُ عَلِيمٌ حَكِيمٌ</span></strong><span dir="rtl">﴾ [التوبة: ٦٠]</span></p>
<p>{<em><strong>Les aumônes ne sont destinées qu'aux pauvres, aux indigents, à ceux qui y travaillent, à ceux dont les cœurs sont à gagner, à l'affranchissement des esclaves, à ceux qui sont lourdement endettés, dans le sentier d'Allah, et au voyageur en détresse. C'est là une obligation d'Allah ! Et Allah est Omniscient et Sage.</strong></em>} [Le Repentir : 60]</p>
<p>Ceux qui sont mentionnés dans ce noble verset sont donc les ayants droit de la Zakât, qu'Allah a désignés comme étant les seuls récipiendaires auxquels elle doit être versée. Il n'est pas permis d'en donner quoi que ce soit à d'autres qu'eux, et ce, par consensus (Ijmâ‘).</p>
<p>Abû Dâwûd et d'autres ont rapporté d'après Ziyâd ibn al-Hârith, dans un récit attribué au Prophète (Marfû‘) :</p>
<p class="ar"><span dir="ltr">«</span><strong><span dir="rtl">إِنَّ اللهَ لَمْ يَرْضَ بِحُكْمِ نَبِيٍّ وَلَا غَيْرِهِ فِي الصَّدَقَاتِ حَتَّى حَكَمَ فِيهَا هُوَ فَجَزَّأَهَا ثَمَانِيَةَ أَجْزَاءٍ</span></strong><span dir="ltr">».</span></p>
<p>« <em><strong>Certes, Allah n'a pas agréé le jugement d'un prophète ni de quiconque d'autre concernant les aumônes (Zakât), jusqu'à ce qu'Il en juge Lui-même en les divisant en huit catégories.</strong></em> »</p>
<p>Le Prophète <span dir="rtl">ﷺ</span> a dit à celui qui l'interrogeait :</p>
<p class="ar"><span dir="ltr">«</span><strong><span dir="rtl">إِنْ كُنْتَ مِنْ تِلْكَ الأَجْزَاءِ أَعْطَيْتُكَ</span></strong><span dir="ltr">»</span></p>
<p>« <em><strong>Si tu fais partie de ces catégories (parts), je t'en donnerai.</strong></em> »<a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a></p>
<p>Ceci car, lorsque certains hypocrites ont critiqué le Prophète <span dir="rtl">ﷺ</span> au sujet de la distribution des aumônes (Zakât), Allah le Très-Haut a clarifié que c'est Lui-Même qui les a réparties, en a exposé la règle et S'est chargé de leur décret en Personne, sans confier leur répartition à quiconque d'autre.</p>
<p>Cheikh Al-Islam, Ibn Taymiyya (qu'Allah lui fasse miséricorde), a dit : « <em>Il est obligatoire de la verser aux huit catégories s'ils sont présents ; sinon, elle est versée à ceux qui sont présents parmi eux, et elle doit être transportée là où ils se trouvent.</em> »</p>
<p>Et il a dit : « <em>Il ne convient d'en donner (de la Zakât) qu'à celui qui s'en aide pour obéir à Allah. En effet, Allah l'a imposée comme un secours pour Son obéissance au profit de ceux qui, parmi les croyants, en ont besoin ou de ceux qui les assistent. <strong>Ainsi, celui qui ne prie pas parmi les nécessiteux ne doit rien en recevoir, jusqu'à ce qu'il se repente et s'engage à accomplir la prière</strong></em> » <a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a>. Fin de citation.</p>
<p>⁕ Il n'est pas permis de verser la Zakât dans d'autres voies que celles déterminées par Allah, comme d'autres projets de bienfaisance tels que la construction de mosquées ou d'écoles. Ceci en raison de la parole du Très-Haut :</p>
<p class="ar"><span dir="ltr">﴿</span><strong><span dir="rtl">إِنَّمَا الصَّدَقَاتُ لِلْفُقَرَاءِ وَالْمَسَاكِينِ...</span></strong><span dir="rtl">﴾ الآية [التوبة: ٦٠]</span></p>
<p>{<em><strong>Les aumônes ne sont destinées qu'aux pauvres et aux indigents...</strong></em>} [Le Repentir : 60].</p>
<p>L'emploi du terme <em>(Innamâ)</em> implique l'exclusivité : il confirme la règle pour ce qui le suit et l'exclut pour tout le reste.</p>
<p><strong>Le sens est donc le suivant :</strong> les aumônes ne sont pas destinées à d'autres qu'eux, mais leur sont exclusivement réservées. Si Allah a nommé précisément ces huit catégories, c'est pour signifier que l'aumône obligatoire (Zakât) ne doit pas sortir de ce cadre pour être attribuée à d'autres.</p>
<p><strong>⁕ Ces catégories se divisent en deux groupes :</strong></p>
<ul>
<li><blockquote>
<p><strong>Le premier groupe :</strong> Les nécessiteux parmi les musulmans.</p>
</blockquote></li>
<li><blockquote>
<p><strong>Le second groupe :</strong> Ceux dont l'attribution de la Zakât constitue une aide pour l'Islam et un renforcement pour celui-ci.</p>
</blockquote></li>
</ul>
<p>⁕ La parole d'Allah le Très-Haut :</p>
<p class="ar"><span dir="ltr">﴿</span><strong><span dir="rtl">إِنَّمَا الصَّدَقَاتُ لِلْفُقَرَاءِ وَالْمَسَاكِينِ وَالْعَامِلِينَ عَلَيْهَا وَالْمُؤَلَّفَةِ قُلُوبُهُمْ وَفِي الرِّقَابِ وَالْغَارِمِينَ وَفِي سَبِيلِ اللهِ وَابْنِ السَّبِيلِ فَرِيضَةً مِنَ اللهِ وَاللهُ عَلِيمٌ حَكِيمٌ</span></strong><span dir="rtl">﴾ [التوبة: ٦٠]</span></p>
<p>{<em><strong>Les aumônes ne sont destinées qu'aux pauvres, aux indigents, à ceux qui y travaillent, à ceux dont les cœurs sont à gagner, à l'affranchissement des esclaves, à ceux qui sont lourdement endettés, dans le sentier d'Allah, et au voyageur en détresse. C'est là une obligation d'Allah ! Et Allah est Omniscient et Sage.</strong></em>} [Le Repentir : 60].</p>
<p>Dans ce noble verset, il y a une énumération exclusive des catégories d'ayants droit de la Zakât auxquels il est impératif de la verser. <strong>Il n'est pas valable de la distribuer à d'autres qu'eux, et ils sont au nombre de huit catégories</strong> :</p>
<p>⁓ <strong>Le premier d'entre eux :</strong> les pauvres (al-fuqarâ'). Ils sont dans un besoin plus profond que les indigents (al-masâkîn), car Allah le Très-Haut a commencé par eux. Or, Il commence toujours par le plus important, puis ce qui suit par ordre d'importance.</p>
<p>Les pauvres sont ceux qui :</p>
<ul>
<li><blockquote>
<p>Ne trouvent rien pour subvenir à leurs besoins vitaux.</p>
</blockquote></li>
<li><blockquote>
<p>Sont incapables de gagner leur vie par le travail.</p>
</blockquote></li>
<li><blockquote>
<p>Ou bien, ne trouvent qu'une partie de ce qui leur est nécessaire.</p>
</blockquote></li>
</ul>
<p>On leur donne alors de la Zakât de quoi assurer leur subsistance s'ils n'ont absolument rien. S'ils possèdent déjà une partie de ce dont ils ont besoin, on leur donne le complément nécessaire pour couvrir la totalité de leurs besoins pour une année entière.</p>
<p>⁓ <strong>Le deuxième :</strong> Les indigents (al-masâkîn). Ils sont dans une situation meilleure que celle des pauvres (al-fuqarâ'). L'indigent est celui qui trouve plus de la moitié de ce qui lui est nécessaire, ou la moitié exactement. On lui donne alors de la Zakât le complément nécessaire pour couvrir la totalité de ses besoins pour une année entière.</p>
<p>⁓ <strong>Le troisième :</strong> Ceux qui y travaillent (al-‘âmilûna ‘alayhâ). Ce sont les agents chargés de collecter la Zakât auprès de ses possesseurs, de la garder et de la distribuer à ses ayants droit sous les ordres du dirigeant des musulmans.</p>
<p>On leur donne alors une part de la Zakât correspondant au salaire de leur travail. Toutefois, si le détenteur de l'autorité leur a déjà fixé des salaires provenant du Trésor public (Bayt al-Mâl) pour cette tâche, il ne leur est pas permis de recevoir quoi que ce soit de la Zakât.</p>
<p>C'est d'ailleurs ce qui a cours à notre époque : les employés sont rémunérés par l'État et reçoivent des indemnités de mission pour leur travail lié à la Zakât. Il leur est donc interdit de prendre quoi que ce soit de la Zakât pour leur travail, car ils ont déjà reçu leur salaire d'une autre source.</p>
<p>⁓ <strong>Le quatrième : Ceux dont les cœurs sont à gagner (al-mu'allafatu qulûbuhum).</strong> Le terme <em>mu'allaf</em> vient de <em>ta'lîf</em>, qui signifie l'unification ou le ralliement des cœurs. Cette catégorie se divise en deux groupes : les non-musulmans et les musulmans.</p>
<ul>
<li><blockquote>
<p><strong>Le non-musulman :</strong> Il reçoit une part de la Zakât si l'on espère sa conversion, afin de renforcer son intention d'entrer en Islam et d'accroître son désir pour celui-ci. On peut également lui en donner si cela permet d'écarter sa propre malveillance envers les musulmans ou celle d'autrui.</p>
</blockquote></li>
<li><blockquote>
<p><strong>Le musulman à rallier :</strong> On lui donne de la Zakât pour renforcer sa foi, ou dans l'espoir de voir ses semblables se convertir... ainsi que pour d'autres objectifs valables et bénéfiques pour les musulmans.</p>
</blockquote></li>
</ul>
<p><strong>Le don effectué pour le ralliement des cœurs n'est mis en pratique qu'en cas de nécessité absolue.</strong> En effet, 'Umar, 'Uthmân et 'Alî (qu'Allah les agrée) ont cessé de donner à cette catégorie, car le besoin ne s'en faisait pas sentir à leur époque.</p>
<p>⁓ <strong>Le cinquième :</strong> L'affranchissement des esclaves (ar-riqâb). Ce sont les esclaves ayant un contrat d'affranchissement (al-mukâtabûn) qui ne trouvent pas de quoi s'acquitter de leur dette. On donne à cet esclave la somme lui permettant d'honorer sa dette afin qu'il soit affranchi et libéré de l'esclavage. Il est également permis au musulman d'acheter un esclave avec les fonds de sa Zakât pour ensuite l'affranchir. De même, il est permis d'utiliser la Zakât pour payer la rançon d'un prisonnier musulman, car cela revient à libérer un musulman de sa captivité.</p>
<p>⁓ <strong>Le sixième : L'endetté (al-ghârim). On entend par <em>ghârim</em> la personne qui a une dette, et il en existe deux types :</strong></p>
<ol type="1">
<li><blockquote>
<p><strong>Celui qui s'est endetté pour autrui :</strong> Il s'agit de celui qui s'endette dans le but de réconcilier les gens (réformer les relations sociales). Par exemple, lorsqu'un conflit surgit entre deux tribus ou deux villages au sujet de crimes de sang ou de biens matériels, engendrant haine et animosité entre eux. Un homme intervient alors comme médiateur pour rétablir la paix en s'engageant personnellement à payer une somme d'argent pour compenser le litige et éteindre la discorde. Il a ainsi accompli une œuvre de bienfaisance immense. Il est légiféré que la Zakât prenne en charge cette dette à sa place, afin que cette responsabilité financière ne nuise pas à ses propres biens, et pour l'encourager, lui et d'autres, à entreprendre de telles actions nobles qui permettent de stopper les séditions et d'éliminer la corruption. Le Législateur a même autorisé cet endetté à demander l'aumône pour atteindre cet objectif. En effet, dans le <em>Sahîh Muslim</em>, d'après Qabîsah, celui-ci a dit : « J'avais contracté une dette pour une réconciliation », ce à quoi le Prophète <span dir="rtl">ﷺ</span> répondit : « <em><strong>Reste avec nous jusqu'à ce que nous recevions l'aumône (Zakât), afin que nous ordonnions qu'elle te soit versée</strong></em> » <a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a>.</p>
</blockquote></li>
<li><blockquote>
<p><strong>Celui qui s'est endetté pour lui-même :</strong> Comme celui qui paie une rançon pour se libérer des mécréants, ou celui qui a une dette qu'il est incapable de rembourser. On lui donne alors de la Zakât de quoi acquitter sa dette, conformément à la parole du Très-Haut : {<em><strong>et à ceux qui sont lourdement endettés</strong></em>} [Le Repentir : 60].</p>
</blockquote></li>
</ol>
<p>⁓ <strong>Le septième : Dans le sentier d'Allah (fî sabîli-Llâh).</strong> Cela consiste à donner de la Zakât aux combattants volontaires qui ne perçoivent pas de salaire du Trésor public (Bayt al-Mâl). En effet, l'expression « <em>dans le sentier d'Allah</em> », lorsqu'elle est employée de manière absolue, désigne le combat (al-ghazw).</p>
<p>Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="ltr">﴿</span><strong><span dir="rtl">إِنَّ اللهَ يُحِبُّ الَّذِينَ يُقَاتِلُونَ فِي سَبِيلِهِ</span></strong><span dir="rtl">﴾ [الصف: ٤]</span></p>
<p>{<em><strong>Allah aime ceux qui combattent dans Son sentier...</strong></em>} [Le Rang : 4].</p>
<p>Et le Très-Haut a dit :</p>
<p class="ar"><span dir="ltr">﴿</span><strong><span dir="rtl">وَقَاتِلُوا فِي سَبِيلِ اللهِ</span></strong><span dir="rtl">﴾ [البقرة: ١٩٠]</span></p>
<p>{<em><strong>Combattez dans le sentier d'Allah...</strong></em>} [La Vache : 190].</p>
<p>⁓ <strong>Le huitième : Le voyageur en détresse (ibn as-sabîl).</strong> Il s'agit du voyageur qui se retrouve bloqué durant son périple en raison de l'épuisement de ses provisions ou de leur perte. Comme le terme sabîl désigne le chemin, celui qui s'y trouve contraint a été nommé « fils du chemin ». On donne ainsi au voyageur en détresse de quoi atteindre son pays. S'il est en route vers une destination précise, on lui donne de quoi atteindre cette ville ainsi que de quoi retourner ensuite chez lui. La notion de voyageur en détresse inclut également l'hôte (l'invité), comme l'ont mentionné Ibn ‘Abbâs et d'autres. <strong>S'il reste au voyageur, au combattant, à l'endetté ou à l'esclave en contrat d'affranchissement un surplus des fonds de la Zakât par rapport à leur besoin réel, ils ont l'obligation de le restituer</strong>. En effet, ils ne possèdent pas ce qu'ils ont reçu de manière absolue, mais une possession conditionnée par l'ampleur du besoin et la persistance de la cause pour laquelle ils ont reçu ces fonds. Dès lors que la cause disparaît, le droit à ces fonds disparaît également.</p>
<p>⁕ Sache qu'il est permis de verser l'intégralité de la Zakât à une seule des catégories mentionnées précédemment.</p>
<p>Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="ltr">﴿</span><strong><span dir="rtl">وَإِن تُخْفُوهَا وَتُؤْتُوهَا الْفُقَرَاءَ فَهُوَ خَيْرٌ لَّكُمْ</span></strong><span dir="rtl">﴾ [البقرة: ٢٧١]</span></p>
<p>{<em><strong>Mais si vous les cachez et les donnez aux pauvres, ce sera mieux pour vous.</strong></em>} [La Vache : 271].</p>
<p>Ceci s'appuie également sur le hadith de Mu'âdh lorsque le Prophète <span dir="rtl">ﷺ</span> l'envoya au Yémen et lui dit :</p>
<p class="ar"><span dir="ltr">«</span><strong><span dir="rtl">أَعْلِمْهُمْ أَنَّ اللهَ قَدِ افْتَرَضَ عَلَيْهِمْ صَدَقَةً تُؤْخَذُ مِنْ أَغْنِيَائِهِمْ فَتُرَدُّ عَلَى فُقَرَائِهِمْ</span></strong><span dir="ltr">»</span></p>
<p>« <em><strong>Informe-les qu'Allah leur a imposé une aumône prélevée sur leurs riches pour être rendue à leurs pauvres</strong></em> ». Ce hadith fait l'objet d'un consensus <a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a>.</p>
<p>Comme le verset et le hadith ne mentionnent qu'une seule catégorie, cela prouve qu'il est permis de verser la Zakât exclusivement à celle-ci.</p>
<p>⁕ Il est suffisant (valable) de se limiter à une seule personne. Ceci car le Prophète <span dir="rtl">ﷺ</span> a ordonné aux Banû Zurayq de verser leur aumône (Zakât) à Salama ibn Sakhr, rapporté par Ahmad <a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a>.</p>
<p>De même, il <span dir="rtl">ﷺ</span> a dit à Qabîsa :</p>
<p class="ar"><span dir="ltr">«</span><strong><span dir="rtl">أَقِمْ يَا قَبِيصَةُ حَتَّى تَأْتِيَنَا الصَّدَقَةُ؛ فَنَأْمُرَ لَكَ بِهَا</span></strong><span dir="ltr">»</span></p>
<p>« <em><strong>Reste [avec nous], ô Qabîsa, jusqu'à ce que nous recevions l'aumône, afin que nous ordonnions qu'elle te soit versée</strong></em> » <a href="#fn6" class="footnote-ref" id="fnref6" role="doc-noteref"><sup>6</sup></a></p>
<p>Ces deux hadiths prouvent donc qu'il est permis de se limiter à une seule personne parmi les huit catégories [de bénéficiaires].</p>
<p>⁕ Il est recommandé de la verser (la Zakât) à ses proches nécessiteux dont on n'a pas la charge financière, en commençant par les plus proches parents. Ceci en raison de la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="ltr">«</span><strong><span dir="rtl">صَدَقَتُكَ عَلَى ذِي الْقَرَابَةِ صَدَقَةٌ وَصِلَةٌ</span></strong><span dir="ltr">»</span></p>
<p>« <em><strong>Ton aumône envers un membre de ta famille est à la fois une aumône et un maintien des liens de parenté</strong></em> ». Ce hadith est rapporté par les cinq (auteurs des recueils de hadiths) et Al-Tirmidhi l'a qualifié de bon (Hassan) <a href="#fn7" class="footnote-ref" id="fnref7" role="doc-noteref"><sup>7</sup></a>.</p>
<p>⁕ Il n'est pas permis de verser la Zakât aux descendants de <strong>Banû Hâshim</strong>. Cela inclut les familles suivantes :</p>
<ul>
<li><blockquote>
<p>La famille d'<strong>Al-’Abbâs</strong> ;</p>
</blockquote></li>
<li><blockquote>
<p>La famille d'<strong>‘Alî</strong> ;</p>
</blockquote></li>
<li><blockquote>
<p>La famille de <strong>Ja‘far</strong> ;</p>
</blockquote></li>
<li><blockquote>
<p>La famille d'<strong>‘Aqîl</strong> ;</p>
</blockquote></li>
<li><blockquote>
<p>La famille d'<strong>Al-Hârith ibn ‘Abd al-Muttalib</strong> ;</p>
</blockquote></li>
<li><blockquote>
<p>La famille d'<strong>Abû Lahab</strong>.</p>
</blockquote></li>
</ul>
<p>Cette interdiction repose sur la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="ltr">«</span><strong><span dir="rtl">إِنَّ الصَّدَقَةَ لَا تَنْبَغِي لِآلِ مُحَمَّدٍ وَإِنَّمَا هِيَ أَوْسَاخُ النَّاسِ</span></strong><span dir="ltr">»</span></p>
<p>« <em><strong>Certes, l'aumône (Zakât) ne convient pas à la famille de Muhammad ; elle n'est que l'impureté des gens.</strong></em> » Rapporté par Muslim.<a href="#fn8" class="footnote-ref" id="fnref8" role="doc-noteref"><sup>8</sup></a></p>
<p>⁕ Il n'est pas permis de verser la Zakât aux personnes suivantes :</p>
<ul>
<li><blockquote>
<p><strong>À une femme pauvre</strong> si elle est mariée à un époux riche qui subvient à ses besoins.</p>
</blockquote></li>
<li><blockquote>
<p><strong>À une personne pauvre</strong> si elle a un proche riche qui assure sa subsistance.</p>
</blockquote></li>
</ul>
<p>La raison invoquée est que ces personnes, grâce à la prise en charge financière (Nafaqa) dont elles bénéficient, n'ont pas le besoin de recourir à la Zakât.</p>
<p>⁕ Il n'est pas permis à une personne de verser la zakat de ses biens à ses proches parents dont elle a l'obligation d'assurer la subsistance, car elle protégerait ainsi ses propres richesses. Quant à celui dont elle assure la subsistance de manière volontaire, il lui est alors permis de lui donner de sa zakat. En effet, il est rapporté dans le <em>Sahîh</em> que l'épouse de 'Abdullâh a interrogé le Prophète <span dir="rtl">ﷺ</span> au sujet des fils de son frère, des orphelins sous sa garde : pouvait-elle leur donner sa zakat ? Il répondit : « Oui ».<a href="#fn9" class="footnote-ref" id="fnref9" role="doc-noteref"><sup>9</sup></a></p>
<p>⁕ Il n'est pas permis de verser sa zakat aux membres de sa famille appartenant aux catégories suivantes :</p>
<ul>
<li><blockquote>
<p><strong>Ses ascendants (Al-Usûl)</strong> : c'est-à-dire ses parents (pères et mères) ainsi que ses grands-parents.</p>
</blockquote></li>
<li><blockquote>
<p><strong>Ses descendants (Al-Furû’)</strong> : c'est-à-dire ses enfants ainsi que ses petits-enfants.</p>
</blockquote></li>
</ul>
<p>⁕ <strong>Il ne lui est pas permis</strong> de verser sa Zakât à son épouse car elle est dispensée de ce besoin grâce à l'obligation d'entretien financier qu'il assume déjà envers elle et parce qu'en agissant ainsi, il ne ferait qu'utiliser la Zakât pour préserver son propre patrimoine (en s'évitant des dépenses personnelles qu'il doit normalement assumer).</p>
<p>⁕ Il est obligatoire pour le Musulman de s'assurer de l'éligibilité [du receveur] lors du versement de la Zakât. S'il la verse à quelqu'un qu'il pense être un ayant droit, mais qu'il s'avère ensuite que cette personne n'y avait pas droit, alors son versement n'est pas valide. En revanche, s'il n'est pas prouvé que la personne n'y avait pas droit, alors le versement est considéré comme valide. On se contente en effet de la forte présomption (la probabilité dominante), tant que le contraire n'est pas manifeste.</p>
<p>Ceci s'appuie sur le fait que lorsque deux hommes vinrent trouver le Prophète <span dir="rtl">ﷺ</span> pour lui demander l'aumône, il les dévisagea attentivement et, les voyant vigoureux (en bonne santé), il leur dit :</p>
<p class="ar"><span dir="ltr">«</span><strong><span dir="rtl">إِنْ شِئْتُمَا أَعْطَيْتُكُمَا مِنْهَا، وَلَا حَظَّ فِيهَا لِغَنِيٍّ وَلَا لِقَوِيٍّ مُكْتَسِبٍ</span></strong><span dir="ltr">»</span></p>
<p>« <em><strong>Si vous le souhaitez, je vous en donnerai, mais sachez qu'il n'y a aucune part [dans la Zakât] pour celui qui est riche, ni pour celui qui est fort et capable de gagner sa vie</strong></em> ».<a href="#fn10" class="footnote-ref" id="fnref10" role="doc-noteref"><sup>10</sup></a></p>
