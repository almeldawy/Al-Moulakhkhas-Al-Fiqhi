<p>⁕ Certes, l'une des règles les plus importantes de la Zakât est la connaissance de ses bénéficiaires légaux، afin qu'elle soit versée à sa juste place et qu'elle parvienne à ceux qui la méritent، permettant ainsi de dégager la responsabilité de celui qui la verse.</p>
<p>⁕ Sache, ô musulman ! Qu'il est obligatoire de s'empresser d'acquitter la Zakât dès qu'elle devient exigible sur les biens؛ conformément à la parole du Très-Haut :</p>
<p class="ar"><strong><span dir="rtl">﴿وَآتُوا الزَّكَاةَ﴾</span></strong> <span dir="rtl">[البقرة: ٤٣]</span></p>
<p><strong>{Et acquittez la Zakât}</strong> [Al-Baqarah : 43].</p>
<p>Or, l'ordre absolu implique l'immédiateté. Et d'après 'Aïcha (qu'Allah l'agrée), le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="ltr">«</span><strong><span dir="rtl">مَا خَالَطَتِ الزَّكَاةُ مَالًا إِلَّا أَهْلَكَتْهُ</span></strong><span dir="ltr">»</span></p>
<p>« <em><strong>Jamais la Zakât ne s'est mélangée à un bien sans qu'elle ne le périsse</strong></em> » <a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a>.</p>
<p>Également, parce que le besoin du pauvre exige de s'empresser de lui verser, et son retardement lui porte préjudice. De plus, celui à qui elle incombe est exposé à des obstacles imprévus؛ tels que la faillite ou la mort, ce qui conduirait à ce qu'elle reste une dette à sa charge. Enfin, s'empresser de l'acquitter éloigne davantage de l'avarice et libère plus sûrement la responsabilité de la personne, tout en étant une source d'agrément du Seigneur. C'est pour ces raisons qu'il est obligatoire de s'empresser d'acquitter la Zakât et de ne pas la retarder, sauf en cas de nécessité؛ comme le fait de la retarder pour la donner à quelqu'un qui est dans un besoin plus extrême, ou en raison de l'absence (non-disponibilité immédiate) de l'argent, ou d'autres motifs similaires.</p>
<p>⁕ La Zakât est obligatoire sur les biens de l'enfant et sur les biens du fou؛ en raison de la portée générale des preuves. C'est à leur tuteur financier qu'incombe la responsabilité de l'acquitter en leur nom؛ car il s'agit d'un droit qui leur est imposé et pour lequel la représentation (par autrui) est admise.</p>
<p>⁕ Il n'est pas permis d'acquitter la Zakât sans une intention (niyya)؛ en raison de la parole du Prophète <span dir="rtl">ﷺ</span> : « Les actions ne valent que par les intentions »<a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a> , et l'acquittement de la Zakât est une action.</p>
<p>⁕ Le mieux est que le propriétaire des biens se charge lui-même de la distribution de la Zakât؛ afin d'être certain qu'elle parvienne à ses ayants droit. Il peut toutefois mandater quelqu'un pour l'acquitter en son nom. Si le dirigeant (Imam) des musulmans la réclame؛ il doit la lui remettre, ou bien la remettre au collecteur (As-Sā'ī), qui est l'agent envoyé par l'Imam pour la perception des Zakâts.</p>
<p>⁕ Il est recommandé, lors du versement de la Zakât, que le donateur et le receveur invoquent Allah.</p>
<p>Le donateur dit :</p>
<p class="ar"><span dir="rtl">«اللَّهُمَّ اجْعَلْهَا مَغْنَمًا وَلَا تَجْعَلْهَا مَغْرَمًا»</span></p>
<p>« <em>Ô Allah, fais que ce soit un gain (spirituel) et ne fais pas que ce soit une perte (financière)</em> ».</p>
<p>Le receveur dit :</p>
<p class="ar"><span dir="rtl">«آجَرَكَ اللهُ فِيمَا أَعْطَيْتَ، وَبَارَكَ لَكَ فِيمَا أَبْقَيْتَ، وَجَعَلَهُ لَكَ طَهُورًا»</span></p>
<p>« <em>Qu'Allah te récompense pour ce que tu as donné, qu'Il bénisse ce que tu as conservé, et qu'Il fasse de cela une purification pour toi</em> ».</p>
<p>Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="ltr">﴿</span><strong><span dir="rtl">خُذْ مِنْ أَمْوَالِهِمْ صَدَقَةً تُطَهِّرُهُمْ وَتُزَكِّيهِمْ بِهَا وَصَلِّ عَلَيْهِمْ</span></strong><span dir="rtl">﴾ [التوبة: ١٠٣]</span></p>
<p>{<em><strong>Prélève de leurs biens une aumône par laquelle tu les purifies et les bénis, et prie pour eux</strong></em>} [Al-Tawba : 103] ; c'est-à-dire : invoque en leur faveur.</p>
<p>'Abdullah ibn Abi Awfa a rapporté : « Lorsque des gens apportaient leur aumône au Messager d'Allah <span dir="rtl">ﷺ</span>, il disait : "<em><strong>Ô Allah, prie sur eux</strong></em>" », rapporté par Al-Boukhari et Mouslim (authentique).<a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a></p>
<p>⁕ Si la personne est dans le besoin et qu'elle a l'habitude de recevoir la Zakât ; il convient de la lui donner sans préciser : « <em>ceci est la Zakât</em> » ; afin de ne pas l'embarrasser.</p>
<p>En revanche, si elle est dans le besoin mais qu'elle n'a pas l'habitude de recevoir la Zakât ; il doit alors l'informer qu'il s'agit de la Zakât.</p>
<p>⁕ Le mieux est d'acquitter la Zakât de chaque bien dans son propre pays (localité)؛ en la distribuant aux pauvres de la localité où se trouve l'argent. Cependant, il est permis de la transférer vers un autre pays pour un intérêt religieux (maslaha shar'iyya)؛ comme le fait d'avoir des proches dans le besoin dans un autre pays, ou s'y trouvent des gens plus nécessiteux que ceux de la localité où se situe l'argent. En effet, les aumônes étaient transférées au Prophète <span dir="rtl">ﷺ</span> à Médine, et il les répartissait ensuite entre les pauvres des Mouhajirines (Émigrés) et des Ansars (Auxiliaires).</p>
<p>⁕ Il incombe au dirigeant (Imam) des musulmans d'envoyer des collecteurs (su'āt) à l'approche de la période d'exigibilité de la Zakât, afin de percevoir la Zakât sur les biens apparents； tels que le bétail de pâturage (sā'imah), les cultures et les fruits. Cela est conforme à la pratique du Prophète <span dir="rtl">ﷺ</span> et de ses califes (qu'Allah les agrée) après lui, et c'est ainsi que les musulmans ont agi à travers le temps. De plus, il existe parmi les gens certains qui, s'ils étaient laissés à eux-mêmes, ne s'acquitteraient pas de la Zakât, tandis que d'autres ignorent son caractère obligatoire. L'envoi de collecteurs permet donc de remédier à ce risque. L'envoi de ces agents constitue également un soulagement pour les gens et une aide pour les soutenir dans l'accomplissement de cette obligation.</p>
<p>⁕ Ce qui incombe au musulman est d'acquitter la Zakât dès qu'elle devient obligatoire, comme mentionné précédemment, sans retard ni hésitation.Toutefois, il est permis d'anticiper l'acquittement de la Zakât avant son échéance pour une durée allant jusqu'à deux ans ou moins. En effet, le Prophète <span dir="rtl">ﷺ</span> a perçu par avance l'aumône (Zakât) de son oncle Al-Abbas pour deux années, comme cela a été rapporté par Ahmad et Abou Daoud <a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a>. Ainsi, selon la majorité des savants (Jumhur al-Ulama), il est permis d'avancer la Zakât avant qu'elle ne soit exigible, dès lors que la cause de l'obligation est établie. Ceci s'applique qu'il s'agisse de la Zakât sur le bétail, les céréales, les deux métaux précieux (or et argent/numéraire) ou les marchandises commerciales, à condition que le seuil minimal (Nissab) soit atteint. Néanmoins, ne pas anticiper le paiement reste préférable, afin de sortir de la divergence (entre les avis juridiques).</p>
