<p>Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="ltr">﴿</span><strong><span dir="rtl">يَا أَيُّهَا الَّذِينَ آمَنُوا أَنْفِقُوا مِنْ طَيِّبَاتِ مَا كَسَبْتُمْ وَمِمَّا أَخْرَجْنَا لَكُمْ مِنَ الْأَرْضِ</span></strong><span dir="rtl">﴾ [البقرة : ٢٦٧]</span></p>
<p>« <em><strong>Ô vous qui croyez ! Dépensez des bonnes choses que vous avez acquises, et de ce que Nous avons fait sortir pour vous de la terre</strong></em> » [Al-Baqarah : 267].</p>
<p>La Zakât est appelée "<em><strong>dépense</strong></em>" (nafaqah) ، comme l'a dit le Très-Haut :</p>
<p class="ar"><span dir="ltr">﴿</span><strong><span dir="rtl">وَالَّذِينَ يَكْنِزُونَ الذَّهَبَ وَالْفِضَّةَ وَلَا يُنْفِقُونَهَا فِي سَبِيلِ اللهِ</span></strong><span dir="rtl">﴾ [التوبة : ٣٤]؛ أَي : لَا يُخْرِجُونَ زَكَاتَهَا.</span></p>
<p>« <em><strong>Et ceux qui thésaurisent l'or et l'argent et ne les dépensent pas dans le sentier d'Allah</strong></em> » [At-Tawbah : 34] ؛ c'est-à-dire : ils n'en acquittent pas la Zakât.</p>
<p>⁕ La Sunna purifiée a abondamment ordonné le prélèvement de la <strong>Zakat sur les grains et les fruits</strong>, tout en précisant son montant. Les musulmans font l'unanimité sur son obligation concernant :</p>
<ul>
<li><blockquote>
<p><strong>Le froment (blé)</strong></p>
</blockquote></li>
<li><blockquote>
<p><strong>L'orge</strong></p>
</blockquote></li>
<li><blockquote>
<p><strong>Les dattes</strong></p>
</blockquote></li>
<li><blockquote>
<p><strong>Les raisins secs</strong></p>
</blockquote></li>
</ul>
<p>Par conséquent, la Zakat est obligatoire pour <strong>tous les types de grains</strong>, tels que le blé, l'orge, le riz, le millet et tous les autres grains. Le Prophète (que la prière et la paix soient sur lui) a dit :</p>
<p class="ar"><span dir="ltr">«</span><strong><span dir="rtl">لَيْسَ فِيمَا دُونَ خَمْسَةِ أَوْسَاقٍ مِنْ حَبٍّ وَلَا تَمْرٍ صَدَقَةٌ</span></strong><span dir="ltr">»</span></p>
<p>« <em><strong>Il n'y a pas d'aumône (Zakat) à payer sur les grains ou les dattes pour une quantité inférieure à cinq Wasqs</strong></em> ».<a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a></p>
<p>Il a également dit (que la prière et la paix soient sur lui) :</p>
<p class="ar"><span dir="ltr">«</span><strong><span dir="rtl">فِيمَا سَقَتِ السَّمَاءُ وَالْعُيُونُ الْعُشْرُ</span></strong><span dir="ltr">»</span></p>
<p>« <em><strong>Pour ce qui est irrigué par le ciel (la pluie) et les sources, la taxe est d'un dixième (1/10)</strong></em> » rapporté par Al-Bukhari.<a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a></p>
<p>⁕ La Zakat est obligatoire sur les fruits, tels que les <strong>dattes</strong> et les <strong>raisins secs</strong>, ainsi que tout ce qui leur ressemble parmi ce qui peut être <strong>mesuré (au boisseau)</strong><a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a> <strong>et conservé</strong>.</p>
<p>La Zakat n'est obligatoire que si la quantité atteint le <strong>Nissab</strong> (seuil minimum), conformément au hadith d'Abu Sa'id al-Khudri (qu'Allah l'agrée) qui le rapporte du Prophète :</p>
<p class="ar"><span dir="ltr">«</span><strong><span dir="rtl">لَيْسَ فِيمَا دُونَ خَمْسَةِ أَوْسُقٍ صَدَقَةٌ</span></strong><span dir="ltr">»</span></p>
<p>« <em><strong>Il n'y a pas d'aumône (Zakat) pour une quantité inférieure à cinq Wasqs</strong></em> », rapporté par le groupe (les auteurs des recueils de hadiths).<a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a></p>
<p>Le <strong>Wasq</strong> équivaut à soixante <strong>Sa'</strong> selon le Sa' prophétique. Ce dernier (le Sa') représente la mesure de quatre poignées, en utilisant les deux mains jointes d'un homme de corpulence moyenne.</p>
<p>⁕ Il est stipulé, pour la Zakat sur les grains et les fruits, que le <strong>Nissab</strong> (le seuil minimum) doit être la propriété de la personne au <strong>moment où la Zakat devient obligatoire</strong>. Ce moment correspond à :</p>
<ul>
<li><blockquote>
<p>L'apparition des signes de <strong>maturité</strong> pour les fruits.</p>
</blockquote></li>
<li><blockquote>
<p>Le <strong>durcissement du grain</strong> pour les cultures céréalières.</p>
</blockquote></li>
</ul>
<p>Ainsi, deux conditions sont requises pour l'obligation de la Zakat sur les grains et les fruits :</p>
<ol type="1">
<li><blockquote>
<p><strong>Premièrement :</strong> Que la quantité atteigne le <strong>Nissab</strong>, conformément à ce qui a été expliqué précédemment.</p>
</blockquote></li>
<li><blockquote>
<p><strong>Deuxièmement :</strong> Que le bien soit sa propriété au moment où la Zakat devient obligatoire.</p>
</blockquote></li>
</ol>
<p>Par conséquent, si une personne entre en possession d'une quantité équivalente au Nissab <strong>après ce moment</strong>, elle n'est pas redevable de la Zakat dessus. C'est le cas par exemple si elle l'a <strong>acheté</strong>, reçu comme <strong>salaire pour sa récolte</strong>, ou s'il l'a obtenu par le <strong>glanage</strong> (récupération des restes après la récolte).</p>
<p>⁕ <strong>Le montant qu'il est obligatoire de prélever pour la Zakat sur les grains et les fruits varie selon le moyen d'irrigation utilisé :</strong></p>
<ul>
<li><blockquote>
<p><strong>S'il est irrigué sans frais</strong> par les torrents, les cours d'eau naturels ou ce qui s'abreuve par ses propres racines (culture pluviale), le montant obligatoire est d'<strong>un dixième (10%)</strong>. Ceci est basé sur le hadith d'Ibn 'Umar dans le <em>Sahih</em> : « <em><strong>Pour ce qui est irrigué par le ciel (la pluie) et les sources, ou ce qui est irrigué par ses racines, c'est le dixième</strong></em> »<a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a>. Et selon Muslim d'après Jabir : « <em><strong>Pour ce qui est irrigué par les rivières et les nuages, c'est le dixième</strong></em> »<a href="#fn6" class="footnote-ref" id="fnref6" role="doc-noteref"><sup>6</sup></a>.</p>
</blockquote></li>
<li><blockquote>
<p><strong>Il est obligatoire de donner la moitié du dixième (5%)</strong> pour ce qui est irrigué <strong>avec des frais</strong>, comme l'eau des puits ou autre. Cela est dû à la parole du Prophète <span dir="rtl">ﷺ</span> dans le hadith d'Ibn 'Umar : « <em><strong>Et pour ce qui est irrigué par puisage, c'est la moitié du dixième</strong></em> », rapporté par Al-Bukhari. Le terme <em>Nadh</em> (puisage) désigne l'irrigation effectuée à l'aide de bêtes de somme. Selon Muslim d'après Jabir : « <em><strong>Et pour ce qui est irrigué par une bête de somme (Sâniyah), c'est la moitié du dixième</strong></em> »</p>
</blockquote></li>
</ul>
<p>⁕ <strong>Le moment de l'obligation de la Zakat :</strong> Pour les grains, c'est lorsqu'ils durcissent.</p>
<p><strong>Pour les fruits :</strong> C'est lorsque leur maturité devient apparente, par exemple lorsqu'ils rougissent ou jaunissent.</p>
<p>Si le propriétaire vend sa récolte après ce stade, c'est à lui qu'incombe le paiement de la Zakat, et non à l'acheteur.</p>
<p>⁕ Il est obligatoire de donner les grains [pour la Zakât] une fois purifiés ، c'est-à-dire nettoyés de la paille et de l'écorce. De même ، on considère que les fruits doivent être donnés sous forme sèche ، car le Prophète <span dir="rtl">ﷺ</span> a ordonné l'estimation du raisin en tant que raisin sec ، et sa Zakât est prélevée sous forme de raisin sec ، tout comme la Zakât du palmier est prélevée sous forme de dattes sèches. Or , on ne les appelle "raisins secs"(<span dir="rtl">زَبِيبا</span>ً) et "dattes" (<span dir="rtl">تَمْرا</span>ً) que lorsqu'ils sont secs (<span dir="rtl">إِلَّا الْيَابِس</span>ُ).</p>
<p>⁕ La Zakât est obligatoire sur le miel lorsqu’il est récolté sur sa propre propriété ou sur des terres incultes (terres n'appartenant à personne), comme les sommets des montagnes, à condition que la quantité récoltée atteigne le seuil (Nisâb). Le Nisâb du miel est de trente Sâ' [unités de mesure] selon le Sâ' prophétique<a href="#fn7" class="footnote-ref" id="fnref7" role="doc-noteref"><sup>7</sup></a>, et le montant à prélever est le dixième (10 %).</p>
<p>⁕ La Zakât est obligatoire sur les produits minéraux (al-Ma'din), conformément à la parole du Très-Haut :</p>
<p class="ar"><span dir="ltr">﴿</span><strong><span dir="rtl">يَا أَيُّهَا الَّذِينَ آمَنُوا أَنْفِقُوا مِنْ طَيِّبَاتِ مَا كَسَبْتُمْ وَمِمَّا أَخْرَجْنَا لَكُمْ مِنَ الْأَرْضِ</span></strong><span dir="rtl">﴾ [البقرة: ٢٦٧]</span></p>
<p>"<em><strong>Ô vous qui croyez ! Dépensez des meilleures choses que vous avez acquises et de ce que Nous avons fait sortir pour vous de la terre</strong></em>" [La Vache : 267].</p>
<p>Le terme "minéral" (<span dir="rtl">الْمَعْدِن</span>ُ) désigne l'endroit où se trouve une substance précieuse extraite de la terre. Puisqu'il s'agit d'un bénéfice tiré du sol, la Zakât y est obligatoire, au même titre que pour les grains et les fruits.</p>
<ul>
<li><blockquote>
<p>Si le minéral extrait est de l'<strong>or</strong> ou de l'<strong>argent</strong>, le montant dû est de <strong>un quart de dixième (2,5 %)</strong> s'il atteint le seuil (Nisâb) ou plus.</p>
</blockquote></li>
<li><blockquote>
<p>S'il s'agit d'autres substances (comme le khôl, l'arsenic, le soufre, le sel ou le <strong>pétrole</strong>), il faut donner <strong>un quart de dixième (2,5 %)</strong> de sa valeur, à condition que cette valeur atteigne le Nisâb de l'or ou de l'argent.</p>
</blockquote></li>
</ul>
<p>⁕ La Zakât est obligatoire sur le trésor (<em>Ar-Rikâz</em>). Il s'agit de ce qui est trouvé enfoui parmi les biens des mécréants de l'époque de la période pré-islamique (<em>Al-Jâhiliyyah</em>). On l'appelle <em>Rikâz</em> parce qu'il a été caché dans la terre, de la même manière que l'on dit : "J'ai planté (<em>rakaztu</em>) la lance"<a href="#fn8" class="footnote-ref" id="fnref8" role="doc-noteref"><sup>8</sup></a>. Le prélèvement obligatoire est d'<strong>un cinquième</strong> (20 %), que la quantité soit petite ou grande. Cela est dû à la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«وَفِي الرِّكَازِ الخُمْسُ»</span></p>
<p>"<em><strong>Et sur le Rikâz, le cinquième est dû</strong></em>", (Hadith consensuel).<a href="#fn9" class="footnote-ref" id="fnref9" role="doc-noteref"><sup>9</sup></a></p>
<p>⁕ On reconnaît qu'il s'agit de biens appartenant aux mécréants par la présence d'un signe distinctif sur tout ou partie de l'objet ; comme le nom de leurs rois ou la représentation de leurs croix. Une fois que le cinquième (20 %) a été prélevé, le reste appartient à celui qui l'a trouvé.</p>
<p>⁕ Par contre, si l'on trouve sur tout ou partie de l'argent enfoui une marque appartenant aux musulmans, ou s'il n'y a aucune marque du tout, il est alors soumis aux règles de la chose trouvée (<em>Al-Luqatah</em>).</p>
<p>⁕ Ce qui est prélevé au titre de la Zakât sur le trésor (<em>Ar-Rikâz</em>) est dépensé pour l'intérêt général des musulmans, de la même manière que le butin sans combat (<em>Al-Fay'</em>).</p>
<p>⁕ De ce qui précède, il nous apparaît clairement que ce qui est produit par la terre est de plusieurs types :</p>
<ol type="1">
<li><blockquote>
<p><strong>Les grains et les fruits</strong>.</p>
</blockquote></li>
<li><blockquote>
<p><strong>Les minéraux</strong> de toutes sortes.</p>
</blockquote></li>
<li><blockquote>
<p><strong>Le miel</strong>.</p>
</blockquote></li>
<li><blockquote>
<p><strong>Le trésor enfoui</strong> (<em>Ar-Rikâz</em>).</p>
</blockquote></li>
</ol>
<p>Tous ces types sont inclus dans la parole du Très-Haut :</p>
<p class="ar"><span dir="ltr">﴿</span><strong><span dir="rtl">أَنْفِقُوا مِنْ طَيِّبَاتِ مَا كَسَبْتُمْ وَمِمَّا أَخْرَجْنَا لَكُمْ مِنَ الْأَرْضِ</span></strong><span dir="rtl">﴾ [البقرة: ٢٦٧]</span></p>
<p>« <em><strong>Dépensez des meilleures choses que vous avez acquises et de ce que Nous avons fait sortir pour vous de la terre</strong></em> » [La Vache : 267]</p>
<p>et Sa parole :</p>
<p class="ar"><span dir="ltr">﴿</span><strong><span dir="rtl">وَآتُوا حَقَّهُ يَوْمَ حَصَادِهِ</span></strong><span dir="rtl">﴾ [الأنعام: ١٤١]</span></p>
<p>« <em><strong>Et acquittez-en les droits le jour de la récolte</strong></em> » [Les Bestiaux : 141].</p>
<p>⁕ <strong>Certes, la Zakât n'est obligatoire que pour ce qui se mesure (au Sâ') et se conserve parmi les grains et les fruits.</strong> Ainsi, ce qui ne se mesure pas et ne se conserve pas n'est pas soumis à la Zakât, comme les noix, les pommes, les pêches, les coings et les grenades. De même, elle n'est pas due sur les autres légumes et herbacées, tels que les radis, l'ail, l'oignon, les carottes, les pastèques, les concombres, les cornichons, les aubergines et ce qui y ressemble. Ceci en raison du Hadith de 'Ali (qu'Allah l'agrée) remontant au Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="ltr">«</span> <strong><span dir="rtl">لَيْسَ فِي الْخَضْرَاوَاتِ صَدَقَةٌ</span></strong> <span dir="ltr">»</span></p>
<p>"<em><strong>Il n'y a pas d'aumône (Zakât) sur les légumes</strong></em>", rapporté par Ad-Dâraqutnî.<a href="#fn10" class="footnote-ref" id="fnref10" role="doc-noteref"><sup>10</sup></a></p>
<p>Et parce que le Messager <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="ltr">«</span> <span dir="rtl"><strong>لَيْسَ فِيمَا دُونَ خَمْسَةِ أَوْسُقٍ صَدَقَةٌ</strong></span> <span dir="ltr">»</span></p>
<p>" <em><strong>Il n'y a pas d'aumône (Zakat) pour une quantité inférieure à cinq Wasqs</strong></em> "<a href="#fn11" class="footnote-ref" id="fnref11" role="doc-noteref"><sup>11</sup></a>.</p>
<p>Le fait de mesurer (le volume) a donc été pris en considération pour ce qui est soumis à la Zakât, ce qui prouve qu'elle n'est pas obligatoire pour ce qui ne se mesure pas et ne se conserve pas.</p>
<p>Le fait que le Prophète <span dir="rtl">ﷺ</span> ainsi que ses califes aient délaissé [la collecte de la Zakât sur ces produits] alors qu'ils étaient cultivés à leur proximité sans qu'ils n'en perçoivent la Zakât, est une preuve de sa non-obligation. Ainsi, ne pas prélever la Zakât sur ces derniers est la Sunnah à suivre.</p>
<p>L'Imam Ahmad a dit : "<em>Ce qui est comme le concombre, le cornichon, l'oignon et les plantes aromatiques n'est pas soumis à la Zakât, à moins que cela ne soit vendu et que le prix de vente atteigne une année de possession (le Hawl)</em>".</p>
