  <!-- ▼ CONTENU DU CHAPITRE ▼ -->

<p>De même qu'il est exigé du musulman d'être en état de pureté rituelle (vis-à-vis du <em>Hadath</em>) lorsqu'il souhaite prier، il lui est également exigé la pureté du corps، du vêtement et du lieu vis-à-vis de l'impureté (<em>Najâsah</em>). Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿وَثِيَابَكَ فَطَهِّرْ﴾ [المدثر: ٤]</span></p>
<p>« <em><strong>Et tes vêtements, purifie-les</strong></em> » [Al-Muddathir : 4].</p>
<p>De plus، le Prophète <span dir="rtl">ﷺ</span> a ordonné à la femme de laver le sang des menstrues de son vêtement. <a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a></p>
<p>Puisqu'il en est ainsi, cela nécessite de notre part de mettre en lumière ce sujet, à savoir l'élimination de l'impureté, en exposant ses règles les plus importantes, dans l'espoir que nos frères musulmans qui le liront en tirent profit. Les juristes (<em>Fuqahâ</em>) — qu'Allah leur fasse miséricorde — consacraient d'ailleurs à ce sujet un chapitre spécifique qu'ils nommaient : « <em><strong>Chapitre de l'élimination de l'impureté</strong></em> » ؛ c'est-à-dire la purification des sources d'impureté qui surviennent sur un support initialement pur، qu'il s'agisse de vêtements، de récipients، de tapis، de lieux ou autres.</p>
<p>_ La base utilisée pour éliminer l'impureté est l'eau ; elle constitue l'élément fondamental de la purification, car Allah l'a décrite ainsi, comme dans Sa parole — qu'Il soit exalté :</p>
<p class="ar"><span dir="rtl">﴿وَيُنَزِّلُ عَلَيْكُم مِّنَ السَّمَاءِ مَاءً لِّيُطَهِّرَكُم بِهِ...﴾ [الأنفال: ١١]</span></p>
<p><strong>{...et Il fit descendre sur vous, du ciel, de l'eau pour vous en purifier...}</strong> [Al-Anfal : 11].</p>
<p><strong>L'impureté qu'il est obligatoire d'enlever :</strong></p>
<ul>
<li><blockquote>
<p><strong>Soit elle se trouve à la surface du sol ou sur ce qui y est rattaché</strong> (comme les murs, les bassins et les rochers) : pour purifier cela, un seul lavage suffit à faire disparaître la substance de l'impureté. Cela signifie qu'il suffit de submerger l'endroit en y versant de l'eau une seule fois. Ceci est fondé sur l'ordre du Prophète <span dir="rtl">ﷺ</span> de verser de l'eau sur l'urine du bédouin qui avait uriné dans la mosquée <a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a>.</p>
</blockquote></li>
<li><blockquote>
<p><strong>Il en est de même si l'endroit est submergé par l'eau de pluie ou par des torrents.</strong> Si l'impureté disparaît en versant de l'eau dessus, ou par l'eau de pluie qui tombe ou qui coule sur l'endroit, cela suffit à sa purification.</p>
</blockquote></li>
</ul>
<p><strong>- Si l'impureté se trouve sur autre chose que le sol et ce qui y est rattaché :</strong></p>
<ul>
<li><blockquote>
<p><strong>Si elle provient d'un chien, d'un porc ou de ce qui en est issu :</strong> sa purification se fait par <strong>sept lavages</strong>, dont l'un d'eux doit être fait avec de la <strong>terre</strong> (en mélangeant la terre à l'un des lavages). Ceci conformément à la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
</blockquote></li>
</ul>
<p class="ar"><span dir="rtl">« إِذَا وَلَغَ الكَلْبُ فِي إِنَاءِ أَحَدِكُمْ ؛ فَلْيَغْسِلْهُ سَبْعاً أُولَاهُنَّ بِالتُّرَابِ »</span></p>
<p><em>« <strong>Si le chien lape dans le récipient de l'un d'entre vous, qu'il le lave sept fois, la première d'entre elles avec de la terre</strong> »</em> (rapporté par Muslim et d'autres).<a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a></p>
<p>Cette règle est générale et s'applique au récipient comme au reste, tels que les vêtements et les tapis.</p>
<ul>
<li><blockquote>
<p><strong>S'il s'agit d'une impureté autre que celle du chien ou du porc</strong> (comme l'urine, les excréments, le sang, etc.) : elle doit être lavée à l'eau tout en frottant et en essorant, jusqu'à ce qu'elle disparaisse, de sorte qu'il n'en reste plus de trace physique (<em>'ayn</em>) ni de couleur.</p>
</blockquote></li>
</ul>
<p><strong>Les objets à laver se divisent en trois catégories :</strong></p>
<ul>
<li><blockquote>
<p><strong>La première catégorie :</strong> Ce qu'il est possible d'essorer, comme un vêtement ; il est alors indispensable de l'essorer.</p>
</blockquote></li>
<li><blockquote>
<p><strong>La deuxième catégorie :</strong> Ce qu'il est impossible d'essorer mais qu'il est possible de retourner (ou de manipuler), comme les cuirs et autres objets similaires ; il est alors indispensable de le retourner.</p>
</blockquote></li>
<li><blockquote>
<p><strong>La troisième catégorie :</strong> Ce qu'il est impossible d'essorer et de retourner ; il est alors indispensable de le presser ou de le lester. Cela se fait en plaçant dessus un objet lourd, jusqu'à ce que la majeure partie de l'eau qu'il contient s'en échappe.</p>
</blockquote></li>
</ul>
<p><strong>- Si l'emplacement d'une impureté est ignoré (caché) sur le corps, un vêtement ou un petit endroit (comme un petit tapis de prière) :</strong></p>
<p>Il est alors obligatoire de laver toute la zone où la présence de l'impureté est probable, jusqu'à avoir la certitude qu'elle a été éliminée. Et si l'on ne sait absolument pas dans quelle direction (ou partie) elle se trouve, il est alors nécessaire de laver l'objet dans sa totalité.</p>
<p><strong>_ L'urine du petit garçon qui ne mange pas encore de nourriture :</strong> il suffit, pour la purifier, de l'asperger d'eau (<em>rach</em>). Ceci est basé sur le hadith d'Umm Qays, qui vint trouver le Messager d'Allah <span dir="rtl">ﷺ</span> avec son petit fils qui ne mangeait pas encore de nourriture. Le Prophète l'installa sur ses genoux et l'enfant urina sur son vêtement. Il demanda alors de l'eau et en aspergea le vêtement sans le laver (à grande eau). (Rapporté par Al-Bukhari et Muslim)<a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a>.</p>
<p><strong>_ Si l'enfant consomme de la nourriture par envie et par choix :</strong> alors son urine est considérée comme celle d'un adulte. De même, l'urine de la petite fille (nourrisson) est considérée comme celle d'une femme adulte. Dans tous ces cas, il est obligatoire de laver l'endroit comme on lave n'importe quelle autre impureté.</p>
<h3 id="les-impuretés-najâsât-se-divisent-en-trois-catégories"><strong>Les impuretés (<em>Najâsât</em>) se divisent en trois catégories :</strong></h3>
<ol type="1">
<li><blockquote>
<p><strong>L'impureté aggravée (<em>Mughalladhah</em>) :</strong> C'est celle du chien (salive, etc.) et ce qui y ressemble.</p>
</blockquote></li>
<li><blockquote>
<p><strong>L'impureté allégée (<em>Mukhaffafah</em>) :</strong> C'est celle de l'urine du petit garçon qui ne se nourrit pas encore d'aliments solides.</p>
</blockquote></li>
<li><blockquote>
<p><strong>L'impureté intermédiaire (<em>Bayna dhalik</em>) :</strong> Elle concerne toutes les autres formes d'impuretés (excréments, sang, urine d'adulte, etc.).</p>
</blockquote></li>
</ol>
<p><strong>Il est obligatoire de savoir ce qui est pur et ce qui est impur parmi les excréments et les urines des animaux :</strong></p>
<p><strong>Ceux dont la chair est licite à la consommation :</strong> leur urine et leurs excréments sont <strong>purs</strong> (<em>tâhir</em>). C'est le cas des chameaux, des bovins, des ovins et autres animaux similaires. En effet, le Prophète <span dir="rtl">ﷺ</span> a ordonné aux gens de la tribu d'<em>Uraynah</em> de rejoindre les chameaux de l'aumône (<em>Sadaqah</em>) pour boire de leur urine et de leur lait (Hadith faisant l'objet d'un consensus)<a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a>.</p>
<p>Cela prouve la pureté de leur urine, car il n'est pas permis de se soigner avec une substance impure ni de la boire. Et si l'on objecte que cela n'a été permis que par nécessité, nous répondons : le Prophète <span dir="rtl">ﷺ</span> ne leur a pas ordonné de laver les traces de cette urine lorsqu'ils voulaient prier.</p>
<p>De plus, il est rapporté dans le « <em>Sahîh</em> » que le Prophète <span dir="rtl">ﷺ</span> priait — avant que la mosquée ne soit construite — dans les enclos des moutons, et il a ordonné d'y prier<a href="#fn6" class="footnote-ref" id="fnref6" role="doc-noteref"><sup>6</sup></a>, alors qu'il ne fait aucun doute qu'ils y urinent.</p>
<p>Cheikh al-Islam <strong>Ibn Taymiyya</strong> a dit : « <em>La règle de base concernant les excréments [des animaux] est la pureté, sauf ce qui a été explicitement excepté...</em> » <a href="#fn7" class="footnote-ref" id="fnref7" role="doc-noteref"><sup>7</sup></a>. Fin de citation.</p>
<p><strong>Le reste (<em>Su'r</em>) de l'animal dont la chair est licite est pur.</strong> Le <em>Su'r</em> désigne ce qui reste de sa nourriture ou de sa boisson après qu'il en a consommé.</p>
<p><strong>Le reste (<em>Su'r</em>) du chat est pur.</strong> Cela s'appuie sur le hadith d'Abu Qatada concernant la chatte :</p>
<p class="ar"><span dir="rtl">« إِنَّهَا لَيْسَتْ بِنَجَسٍ ، إِنَّهَا مِنَ الطَّوَّافِينَ عَلَيْكُمْ وَالطَّوَّافَاتِ »</span></p>
<p>« <em><strong>Elle n'est pas impure, elle fait partie de ceux et celles qui circulent sans cesse parmi vous</strong></em> » (Rapporté par At-Tirmidhi et d'autres, qui l'ont authentifié)<a href="#fn8" class="footnote-ref" id="fnref8" role="doc-noteref"><sup>8</sup></a>.</p>
<p>Le Prophète <span dir="rtl">ﷺ</span> l'a comparée aux serviteurs de la maison qui circulent autour de ses habitants pour le service, car il est difficile de s'en protéger ou de l'éviter. Il y a en cela un principe de levée de la gêne et de la pénibilité (<em>raf' al-haraj</em>).</p>
<p>Certains savants ont assimilé au chat les animaux de taille inférieure (oiseaux ou autres) ; leurs restes sont donc purs comme ceux du chat, en raison du point commun qui est leur circulation fréquente autour des humains.</p>
<p><strong>En dehors du chat et de ce qui lui est assimilé,</strong> tout animal dont la chair est illicite à la consommation voit ses excréments, son urine et ses restes (<em>Su'r</em>) considérés comme <strong>impurs</strong>.</p>
<p><strong>Ô musulman ! Tu te dois d'accorder une grande importance à la purification, tant intérieure qu'extérieure :</strong></p>
<ul>
<li><blockquote>
<p><strong>Intérieurement :</strong> par le Tawhîd (l'unicité d'Allah) et l'infatigable sincérité (<em>Ikhlâs</em>) envers Allah dans tes paroles et tes actes.</p>
</blockquote></li>
<li><blockquote>
<p><strong>Extérieurement :</strong> par la purification de l'état d'impureté rituelle (<em>Hadath</em>) et des souillures physiques (<em>Anjâs</em>).</p>
</blockquote></li>
</ul>
<p>En effet, notre religion est celle de la pureté, de la propreté et de la préservation contre les saletés tant matérielles que spirituelles. Le musulman est, par définition, pur, propre et attaché à la purification. Le Prophète <span dir="rtl">ﷺ</span> a d'ailleurs dit :</p>
<p class="ar"><span dir="rtl">« الطُّهُورُ شَطْرُ الإِيمَانِ... »</span></p>
<p><em><strong>« La purification est la moitié de la foi... »</strong></em><a href="#fn9" class="footnote-ref" id="fnref9" role="doc-noteref"><sup>9</sup></a></p>
<p>Ô serviteur d'Allah, tu dois accorder une grande importance à la purification et t'écarter des souillures. Le Messager d'Allah <span dir="rtl">ﷺ</span> nous a informés que la majeure partie du châtiment de la tombe est due à la négligence vis-à-vis de l'urine lorsque l'homme ne s'en préserve pas .<a href="#fn10" class="footnote-ref" id="fnref10" role="doc-noteref"><sup>10</sup></a></p>
<p>Si une impureté t'atteint, empresse-toi de la purifier autant que tu le peux afin de rester pur, particulièrement lorsque tu souhaites prier. Vérifie donc ton état vis-à-vis de la purification.</p>
<p>De même, lorsque tu veux entrer à la mosquée, examine tes sandales : si tu y trouves une souillure, essuie-les et nettoie-les. Ne pénètre pas avec elles et ne les introduis pas dans la mosquée si elles comportent une impureté.</p>
<blockquote>
<p>Qu'Allah nous accorde à tous la réussite dans ce qu'Il aime et agréé, en paroles comme en actes.</p>
</blockquote>
