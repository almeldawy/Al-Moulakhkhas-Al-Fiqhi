<p><strong>Les récipients (<em>Al-Âniyah</em>)</strong> sont les contenants dans lesquels on conserve l'eau ou autre chose, qu'ils soient en fer, en bois, en peau (cuir) ou autre.</p>
<p><strong>La règle de base</strong> concernant ces récipients est la permission (<em>Al-Ibâhah</em>). Il est donc permis d'utiliser et de posséder tout récipient pur, à l'exception de deux types que voici :</p>
<p>1 – <strong>Les récipients en or et en argent</strong>, ainsi que les récipients contenant de l'or ou de l'argent, que ce soit sous forme de placage, de dorure/argenture ou tout autre procédé intégrant de l'or ou de l'argent au récipient. L'exception à cela est <strong>la petite agrafe (ou soudure) en argent</strong> ajoutée au récipient par nécessité pour le réparer.</p>
<p>La preuve de l'interdiction des récipients en or et en argent réside dans la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">« لَا تَشْرَبُوا فِي آنِيَةِ الذَّهَبِ وَالْفِضَّةِ، وَلَا تَأْكُلُوا فِي صِحَافِهِمَا؛ فَإِنَّهَا لَهُمْ فِي الدُّنْيَا وَلَنَا فِي الْآخِرَةِ »</span></p>
<p><strong>"<em>Ne buvez pas dans des récipients d'or et d'argent, et ne mangez pas dans leurs plats ; car ils sont pour eux [les non-croyants] dans ce monde, et pour nous dans l'au-delà.</em>"</strong> Rapporté par le groupe [des auteurs de recueils]<a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a>.</p>
<p>Ainsi que sa parole <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">« الَّذِي يَشْرَبُ فِي آنِيَةِ الْفِضَّةِ إِنَّمَا يُجَرْجِرُ فِي بَطْنِهِ نَارَ جَهَنَّمَ »</span></p>
<p><strong>"<em>Celui qui boit dans un récipient d'argent ne fait qu'ingurgiter dans son ventre le feu de l'Enfer.</em>"</strong> (Unanimement reconnu authentique)<a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a>.</p>
<p>L'interdiction d'une chose s'applique qu'elle soit pure ou mélangée ; il est donc interdit d'utiliser un récipient plaqué ou doré/argenté, ou qui contient une part d'or ou d'argent, à l'exception de la petite agrafe en argent comme mentionné précédemment. Ceci conformément au hadith d'Anas (qu'Allah l'agrée) : <strong>"<em>Le vase du Prophète <span dir="rtl">ﷺ</span> s'étant fendu, il fit réparer la fissure par une chaîne (agrafe) en argent.</em>"</strong> Rapporté par Al-Bukhari<a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a>.</p>
<p>L'Imam An-Nawawi (qu'Allah lui fasse miséricorde) a dit <a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a>: « <em>Le consensus s'est établi sur l'interdiction de manger et de boire dans ces récipients [en or et en argent]. De même, tous les autres types d'utilisation sont assimilés au fait de manger et de boire, et ce, par consensus également.</em> » Fin de citation.</p>
<p>L'interdiction de l'utilisation et de la possession [des récipients en or et en argent] concerne aussi bien les hommes que les femmes, en raison de la portée générale des textes et de l'absence de preuve spécifique d'exception. Le port de bijoux n'a été autorisé aux femmes que par nécessité, pour qu'elles puissent s'embellir pour leurs époux.</p>
<p>Par ailleurs, les récipients utilisés par les non-musulmans sont autorisés tant que leur impureté n'est pas établie. Si leur impureté est avérée, ils doivent alors être lavés, après quoi ils peuvent être utilisés.</p>
<p>2 – <strong>Les peaux de bêtes mortes (non sacrifiées) :</strong> leur utilisation est interdite, sauf si elles ont été <strong>tannées</strong>. Les savants ont divergé sur la permission de les utiliser après le tannage, mais l'avis correct est la permission, ce qui est l'avis de la majorité. Cela s'appuie sur des hadiths authentiques autorisant leur usage après tannage, et parce que leur impureté est accidentelle et disparaît donc avec le tannage.</p>
<p>Comme l'a dit le Prophète <span dir="rtl">ﷺ</span> :</p>
<blockquote>
<p class="ar"><strong><span dir="rtl">«يُطَهِّرُهُ المَاءُ وَالقَرَظُ»</span></strong></p>
</blockquote>
<p><strong>« <em>L'eau et les feuilles de gousses (Al-Qarad) le purifient</em> »</strong> <a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a></p>
<p>et sa parole <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><strong><span dir="rtl">«دِبَاغُ الأَدِيمِ طَهُورُهُ»</span></strong></p>
<p><strong>« <em>Le tannage de la peau est sa purification</em> »</strong> <a href="#fn6" class="footnote-ref" id="fnref6" role="doc-noteref"><sup>6</sup></a>.</p>
