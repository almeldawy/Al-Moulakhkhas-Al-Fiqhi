<p>La Mère des croyants, 'Aïcha (qu'Allah l'agrée), a rapporté que le Prophète (que la prière et le salut d'Allah soient sur lui) a dit :</p>
<p class="ar"><strong><span dir="rtl">السِّوَاكُ مَطْهَرَةٌ لِلْفَمِ ، مَرْضَاةٌ لِلرَّبِّ</span></strong></p>
<p></p>
<p>« <em><strong>Le siwak est une purification pour la bouche et une satisfaction pour le Seigneur.</strong></em> » (Rapporté par Ahmad et d'autres)<a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a></p>
<p>Il est confirmé dans les deux recueils authentiques (Al-Boukhârî et Muslim), d'après Abou Houreyrah (qu'Allah l'agrée), qu'il a dit : Le Messager d'Allah (que la prière et le salut d'Allah soient sur lui) a dit :</p>
<p class="ar"><strong><span dir="rtl">خَمْسٌ مِنَ الْفِطْرَةِ : الِاسْتِحْدَادُ ، وَالْخِتَانُ ، وَقَصُّ الشَّارِبِ ، وَنَتْفُ الْإِبْطِ ، وَتَقْلِيمُ الْأَظْفَارِ</span></strong></p>
<p>« <em><strong>Cinq choses font partie de la nature saine (al-fitrah) : le rasage des poils du pubis, la circoncision, la taille des moustaches, l'épilation des aisselles et la coupe des ongles.</strong></em> » <a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a></p>
<p>Également dans les deux recueils authentiques, d'après Ibn 'Umar (qu'Allah l'agrée), il est rapporté du Prophète :</p>
<p class="ar"><strong><span dir="rtl">أُحْفُوا الشَّوَارِبَ ، وَأَعْفُوا اللِّحَى</span></strong></p>
<p>« <em><strong>Taillez court les moustaches et laissez pousser les barbes.</strong></em> »<a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a></p>
<p>À partir de ces hadiths et de ceux qui ont le même sens, les juristes ont déduit les règles suivantes :</p>
<p>⁕ La légitimité du siwak : il s'agit de l'utilisation d'un bâtonnet (ou ce qui y ressemble) sur les dents et les gencives, afin de faire disparaître ce qui y est attaché comme jaunisse ou odeur.</p>
<p>Il a été rapporté qu'il fait partie des traditions (Sounan) des Messagers <a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a> , ainsi, le premier à avoir utilisé le siwak fut Ibrahim (sur lui la prière et le salut). Le Messager <span dir="rtl">ﷺ</span> a clarifié qu'il est une "<em><strong>purification pour la bouche</strong></em>" ، c'est-à-dire qu'il la nettoie de ce qui est détestable. Et qu'il est une "<em><strong>satisfaction pour le Seigneur</strong></em>" , c'est-à-dire qu'il satisfait le Seigneur (Béni et Exalté soit-Il).</p>
<p>Plus de cent hadiths ont été rapportés concernant son explication et l'incitation à sa pratique, ce qui prouve qu'il s'agit d'une sounnah confirmée (mou'akkadah) sur laquelle le Législateur a insisté et à laquelle Il a incité. Il comporte des bienfaits immenses, dont les plus grands et les plus globaux sont ceux indiqués dans ce hadith : <em><strong>qu'il est une purification pour la bouche et une satisfaction pour le Seigneur</strong></em>.</p>
<p>Le brossage des dents (le tasawwouk) se fait à l'aide d'un bâtonnet souple ، qu'il soit issu de l'arak ، de l'olivier ، d'une palme de palmier ( 'urjoun) ou d'autres sources parmi ce qui ne s'effrite pas et ne blesse pas la bouche.</p>
<p>Le siwak est recommandé (sunnah) à tout moment, même pour celui qui jeûne durant toute la journée, selon l'avis prépondérant. Cependant، il est davantage souligné (mou'akkad) à des moments spécifiques :</p>
<p><strong>Lors des ablutions :</strong> en raison de sa parole <span dir="rtl">ﷺ</span> :</p>
<blockquote>
<p class="ar"><span dir="ltr">«</span><strong><span dir="rtl">لَوْلَا أَنْ أَشُقَّ عَلَى أُمَّتِي ؛ لَأَمَرْتُهُمْ بِالسِّوَاكِ عِنْدَ كُلِّ وُضُوءٍ</span></strong><span dir="ltr">»</span></p>
<p>« <em><strong>Si ce n'était pour ne pas surcharger ma communauté , je leur aurais ordonné d'utiliser le siwak à chaque ablution.</strong></em> » <a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a>.</p>
</blockquote>
<p>Ce hadith prouve le caractère fort recommandé du siwak lors des ablutions, et cela se fait au moment du rinçage de la bouche (al-madmadah) , car cela est plus efficace pour la purification et le nettoyage de la bouche.</p>
<p><strong>Lors de la prière :</strong> qu'elle soit obligatoire ou surérogatoire, car il nous est ordonné, au moment de nous rapprocher d'Allah, d'être dans un état de perfection et de propreté , afin de manifester la noblesse de l'adoration.</p>
<p><strong>Au réveil :</strong> que ce soit après un sommeil de nuit ou de jour ، car lorsqu'il <span dir="rtl">ﷺ</span> se levait la nuit، il se frottait (yashousu) la bouche avec le siwak <a href="#fn6" class="footnote-ref" id="fnref6" role="doc-noteref"><sup>6</sup></a>. Le terme <em>al-shaws</em> signifie le frottement. Cela s'explique par le fait que l'odeur de la bouche change avec le sommeil en raison de la montée des émanations de l'estomac ، et le siwak dans ce cas nettoie la bouche de leurs traces.</p>
<p><strong>En cas de changement de l'odeur de la bouche :</strong> que ce soit à cause de la nourriture ou autre chose.</p>
<p><strong>Lors de la lecture du Coran :</strong> afin de nettoyer la bouche et de la parfumer pour la récitation de la parole d'Allah (Puissant et Majestueux soit-Il).</p>
<p>La description de la manière de se brosser les dents (le tasawwouk) est de passer le siwak sur ses gencives et ses dents ; il commence ainsi par le côté droit vers le côté gauche, et il tient le siwak de sa main gauche.</p>
<p>Parmi les privilèges apportés par notre religion monothéiste droite (Al-Hanif), figurent les caractéristiques de la nature primordiale (Fitrah) mentionnées précédemment dans le hadith. Elles ont été nommées ainsi car celui qui les pratique se pare de la nature originelle sur laquelle Allah a créé Ses serviteurs. Il les a incités à les suivre et les leur a recommandées afin qu'ils atteignent les qualités les plus parfaites et les plus nobles, et pour qu'ils conservent la plus belle apparence et la meilleure forme physique.</p>
<p>C'est la tradition ancienne (Sunnah) que les prophètes ont choisie et sur laquelle les lois divines se sont accordées.</p>
<p>Ces caractéristiques sont les suivantes :</p>
<p><em><strong>1 - Le rasage du pubis (l’ 'isthidad)</strong></em> : Il s'agit du rasage de la zone pubienne, c'est-à-dire les poils qui poussent autour des parties intimes. Cette pratique est appelée <strong>isthidad</strong> (<em>étymologiquement lié au fer</em>) en raison de l'utilisation d'un outil en fer pour l'accomplir, à savoir le rasoir. Son retrait apporte embellissement et propreté ; on peut donc les enlever par le procédé de son choix, que ce soit par le rasage ou tout autre moyen.</p>
<p><em><strong>2- La circoncision (Al-Khitan)</strong></em> : Il s'agit du retrait de la peau qui recouvre le gland afin que celui-ci soit découvert. Elle se pratique durant l'enfance car la guérison est alors plus rapide, et afin que le jeune garçon grandisse dans les meilleures conditions.</p>
<p>Parmi les sagesses de la circoncision, on trouve la purification du sexe masculin des impuretés (najasah) qui s'accumulent sous le prépuce, en plus d'autres nombreux bienfaits.</p>
<p><em><strong>3- La taille de la moustache et son raccourcissement extrême (ihfâ')</strong></em> : Cela consiste à la tailler de manière prononcée, pour ce que cela comporte comme embellissement, propreté et distinction vis-à-vis des non-croyants.</p>
<p>Des hadiths ont été rapportés pour inciter à sa taille et à son raccourcissement, tout en laissant pousser la barbe (i'fâ'), en la laissant s'allonger et en l'honorant ; car le maintien de la barbe apporte beauté et apparence de virilité. <em><strong>Or, beaucoup de gens ont inversé les choses : ils se sont mis à laisser pousser leurs moustaches tout en rasant leurs barbes</strong></em>, en les coupant ou en les confinant dans un périmètre très étroit. Ce faisant, ils s'obstinent à contredire la guidance prophétique, à imiter les ennemis d'Allah et de Son Messager, et délaissent les traits de la virilité et de la noblesse de caractère pour ceux des femmes et des gens vils, au point que s'applique à eux la parole du poète :</p>
<p class="ar"><strong><span dir="rtl">يُقْضَى عَلَى المَرْءِ فِي أَيَّامِ مِحْنَتِهِ ... حَتَّى يَرَى حَسَناً مَا لَيْسَ بِالْحَسَنِ</span></strong></p>
<p><em><strong>L'homme est tellement éprouvé durant ses jours d'adversité... qu'il finit par voir comme beau ce qui ne l'est point.</strong></em></p>
<p>Et la parole de l'autre (poète) :</p>
<p class="ar"><strong><span dir="rtl">وَلَا عَجَبٌ أَنَّ النِّسَاءَ تَرَجَّلَتْ ... وَلَكِنَّ تَأْنِيثَ الرِّجَالِ عَجِيبُ</span></strong></p>
<p><strong>Il n'est pas étonnant que les femmes se masculinisent... mais ce qui est (véritablement) étonnant, c'est la féminisation des hommes.</strong></p>
<p><em><strong>4- Parmi les caractéristiques de la fitrah</strong></em> : la coupe des ongles. Cela consiste à les couper de manière à ne pas les laisser s'allonger, pour ce que cela comporte comme embellissement, ainsi que pour l'élimination de la saleté accumulée en dessous, et afin d'éviter toute ressemblance avec les bêtes de proie.</p>
<p>Pourtant, des groupes de jeunes efféminés (influencés par des modes étrangères) et de femmes primitives ont contredit cette nature primordiale prophétique ; ils se sont mis à laisser pousser leurs ongles, en opposition à la guidance prophétique et par pur acharnement dans l'imitation aveugle.</p>
<p><em><strong>5- Parmi les caractéristiques de la fitrah</strong></em> : l'épilation des aisselles. C'est-à-dire le fait d'enlever les poils qui poussent sous les aisselles. Il est recommandé (sunnah) de retirer ces poils par l'épilation, le rasage ou tout autre procédé ; car leur retrait favorise la propreté et permet d'éliminer les mauvaises odeurs qui s'accentuent avec la présence de cette pilosité.</p>
<p>Ô musulman، c'est ainsi que notre religion a légiféré ces caractéristiques ؛ en raison de la parure، du nettoyage et de la purification qu'elles contiennent ؛ afin que le musulman soit dans le meilleur état et sous la plus belle apparence ؛ se distinguant ainsi de la voie des polythéistes. Certaines de ces règles visent également à différencier les hommes des femmes ؛ afin que chacun d'eux conserve la personnalité correspondant à sa fonction dans la vie. Cependant، beaucoup de gens dupés، qui sont injustes envers eux-mêmes، ont persisté à s'opposer au Messager <span dir="rtl">ﷺ</span> et à importer des traditions qui ne s'accordent ni avec notre religion ni avec notre identité islamique. Ils ont pris pour modèles les bas-fonds de l'Occident ou de l'Orient pour forger leur personnalité ؛ ils ont ainsi échangé ce qui est meilleur contre ce qui est inférieur. Pire encore, ils ont troqué ce qui est bon contre ce qui est mauvais, et la perfection contre l'imperfection. Ils ont ainsi porté préjudice à eux-mêmes et à leur société, et ont instauré une mauvaise pratique dont ils porteront le péché, ainsi que le péché de quiconque agira selon celle-ci en les suivant. Et il n'y a de force ni de puissance qu'en Allah, le Très-Haut, l'Immense.</p>
<p>Ô Allah, accorde aux musulmans la réussite dans la réforme de leurs actes et de leurs paroles ; accorde-leur la sincérité [vouée] à Ta Noble Face, ainsi que l'attachement à la Sunna (tradition) de Ton Prophète <span dir="rtl">ﷺ</span>.</p>
