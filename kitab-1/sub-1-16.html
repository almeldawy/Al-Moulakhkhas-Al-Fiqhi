<p>Il existe certaines œuvres qu'il est interdit au musulman d'accomplir lorsqu'il n'est pas en état de pureté, en raison de leur noblesse et de leur rang élevé. Nous te les exposons avec leurs preuves afin que tu les gardes à l'esprit ; ne te lance donc dans aucune d'entre elles qu'après t'être mis en état de la pureté requise.</p>
<p>Sache, mon frère, qu'il existe des choses qui sont interdites à celui qui est en état de Hadath (impureté rituelle), que son Hadath soit majeur ou mineur, et qu'il existe d'autres choses dont l'interdiction est propre à celui qui se trouve en état de Hadath majeur.</p>
<p>⁕ Les choses qui sont interdites à celui qui se trouve dans l'un des deux Hadath (majeur ou mineur) :</p>
<p>1 – Toucher le noble Mouṣḥaf (le Coran) : celui qui est en état de Hadath ne doit donc pas le toucher sans intermédiaire, en raison de la parole du Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿لَّا يَمَسُّهُۥٓ إِلَّا ٱلْمُطَهَّرُونَ﴾</span></p>
<p><strong>﴾ Nul ne la touche, hormis les purifiés. ﴿</strong> [Sourate Al-Wâqi'a : 79]. C'est-à-dire : ceux qui se sont purifiés du Hadath, qu'il s'agisse de la Janâba (impureté majeure) ou autre, selon l'avis que ceux qui sont visés sont les êtres humains purifiés ; et il y a aussi ceux qui estiment que ce sont les nobles anges qui sont visés.</p>
<p>Et même si le verset était interprété comme visant les anges, cela inclurait néanmoins les êtres humains par « signification d'allusion » (Dalâlat al-Ichâra). De même, il est rapporté dans la lettre que le Messager d'Allah <span dir="rtl">ﷺ</span> écrivit à 'Amr ibn Hazm cette parole :</p>
<p class="ar"><span dir="rtl">«لَا يَمَسُّ الْمُصْحَفَ إِلَّا طَاهِرٌ»</span></p>
<p>« Nul ne touche le Mouṣḥaf s'il n'est pur. » Rapporté par An-Nasâ'î et d'autres, avec une chaîne ininterrompue<a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a>.</p>
<p>Ibn 'Abd al-Barr<a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a> a dit : « Il est comparable à un hadith mutawâtir, du fait que les gens l'ont accueilli avec acceptation. »</p>
<p>Cheikh al-Islâm<a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a> a dit, au sujet de l'interdiction de toucher le Mouṣḥaf pour celui qui n'est pas purifié : « C'est la doctrine des quatre Imams. »</p>
<p>Et Ibn Hubayra a dit dans « Al-Ifsâh » : « Ils [c'est-à-dire les quatre Imams] ont été unanimes à dire qu'il n'est pas permis à celui qui est en état de Hadath de toucher le Mouṣḥaf. » Fin de citation.</p>
<p>Il n'y a pas de mal à ce que celui qui n'est pas purifié porte le Mouṣḥaf dans une housse ou un sac, sans le toucher [directement]. De même, il n'y a pas de mal à ce qu'il le regarde et le feuillette sans le toucher.</p>
<p>2 – Il est interdit à celui qui est en état de Hadath d'accomplir la prière, qu'elle soit obligatoire (Fard) ou surérogatoire (Nafl). Ceci fait l'objet d'un consensus des gens de science, lorsqu'il est en mesure de se purifier, en raison de la parole du Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوٓا۟ إِذَا قُمْتُمْ إِلَى ٱلصَّلَوٰةِ فَٱغْسِلُوا۟ وُجُوهَكُمْ وَأَيْدِيَكُمْ إِلَى ٱلْمَرَافِقِ وَٱمْسَحُوا۟ بِرُءُوسِكُمْ وَأَرْجُلَكُمْ إِلَى ٱلْكَعْبَيْنِ ۚ وَإِن كُنتُمْ جُنُبًا فَٱطَّهَّرُوا۟ ۚ...﴾</span></p>
<p>« Ô vous qui croyez ! Quand vous vous levez pour accomplir la Salât, lavez vos visages et vos mains jusqu'aux coudes, passez les mains mouillées sur vos têtes, et lavez vos pieds jusqu'aux chevilles. Si vous êtes en état d'impureté majeure, purifiez-vous... » Le verset [Sourate Al-Mâ'ida : 6]. Et le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="rtl">«لَا يَقْبَلُ اللهُ صَلَاةً بِغَيْرِ طَهُورٍ»</span></p>
<p>« Allah n'accepte pas de prière sans purification. » Rapporté par Mouslim et d'autres<a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a>. Ainsi que le hadith :</p>
<p class="ar"><span dir="rtl">«لَا يَقْبَلُ اللهُ صَلَاةَ مَنْ أَحْدَثَ حَتَّى يَتَوَضَّأَ»</span></p>
<p>« Allah n'accepte pas la prière de celui qui est en état de Hadath jusqu'à ce qu'il fasse les ablutions. »<a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a> Il ne lui est donc pas permis de prier sans purification alors qu'il en est capable, et sa prière n'est pas valide, qu'il soit ignorant ou savant, par oubli ou délibérément. Toutefois, le savant qui prie délibérément sans purification commet un péché et mérite une sanction discrétionnaire (Ta'zîr) ; quant à celui qui est ignorant ou qui a oublié, il ne commet pas de péché, mais sa prière n'est pas valide pour autant.</p>
<p>3 – Il est interdit à celui qui est en état de Hadath d'effectuer le Tawâf autour de la Maison Antique (la Kaaba), en raison de la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«الطَّوَافُ بِالْبَيْتِ صَلَاةٌ؛ إِلَّا أَنَّ اللهَ أَبَاحَ فِيهِ الْكَلَامَ»</span></p>
<p>« Le Tawâf autour de la Maison est une prière, si ce n'est qu'Allah y a permis la parole. »<a href="#fn6" class="footnote-ref" id="fnref6" role="doc-noteref"><sup>6</sup></a> Et le Prophète <span dir="rtl">ﷺ</span> fit ses ablutions pour le Tawâf<a href="#fn7" class="footnote-ref" id="fnref7" role="doc-noteref"><sup>7</sup></a> ; et il est authentiquement rapporté de lui <span dir="rtl">ﷺ</span> qu'il interdit à la femme en période de menstrues d'effectuer le Tawâf autour de la Maison jusqu'à ce qu'elle soit purifiée<a href="#fn8" class="footnote-ref" id="fnref8" role="doc-noteref"><sup>8</sup></a>. Tout cela indique l'interdiction du Tawâf pour celui qui est en état de Hadath jusqu'à ce qu'il se purifie.</p>
<p>Et parmi ce qui indique son interdiction à celui qui est en état de Hadath majeur, il y a la parole du Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ لَا تَقْرَبُوا۟ ٱلصَّلَوٰةَ وَأَنتُمْ سُكَـٰرَىٰ حَتَّىٰ تَعْلَمُوا۟ مَا تَقُولُونَ وَلَا جُنُبًا إِلَّا عَابِرِى سَبِيلٍ حَتَّىٰ تَغْتَسِلُوا۟ ۚ﴾</span></p>
<p><strong>﴾ Ô vous qui croyez ! Ne vous approchez pas de la Salât alors que vous êtes ivres, jusqu'à ce que vous compreniez ce que vous dites, ni lorsque vous êtes en état d'impureté majeure, à moins que vous ne soyez en voyage [de simple passage], jusqu'à ce que vous vous soyez lavés. ﴿</strong> [Sourate An-Nisâ' : 43]. C'est-à-dire : n'entrez pas dans la mosquée pour y demeurer alors que vous êtes en état de Janâba, sauf si vous ne faites qu'y passer. Or, le fait de lui interdire d'entrer dans la mosquée pour y demeurer implique, a fortiori, de lui interdire le Tawâf.</p>
<p>Ces œuvres sont interdites à celui qui est en état de Hadath, que son Hadath soit majeur ou mineur.</p>
<p>Quant aux choses qui sont interdites spécifiquement à celui qui est en état de Hadath majeur, ce sont les suivantes :</p>
<p>1 – Il est interdit à celui qui est en état de Hadath majeur de réciter le Coran, en raison du hadith de 'Alî (qu'Allah l'agrée) :</p>
<p class="ar"><span dir="rtl">«لَا يَحْجُبُهُ (يَعْنِي: النَّبِيَّ ﷺ) عَنِ الْقُرْآنِ شَيْءٌ، لَيْسَ الْجَنَابَةَ»</span></p>
<p>« Rien ne l'empêchait (c'est-à-dire : le Prophète <span dir="rtl">ﷺ</span>) [de réciter] le Coran, hormis la Janâba. » Rapporté par At-Tirmidhî et d'autres<a href="#fn9" class="footnote-ref" id="fnref9" role="doc-noteref"><sup>9</sup></a>. Et la formulation d'At-Tirmidhî est :</p>
<p class="ar"><span dir="rtl">«يُقْرِئُنَا الْقُرْآنَ مَا لَمْ يَكُنْ جُنُبًا»</span></p>
<p>« Il nous faisait réciter le Coran tant qu'il n'était pas en état de Janâba. » Cela indique donc l'interdiction de la récitation du Coran pour celui qui est en état de Janâba, et il en va de même, selon le même sens, pour la femme en période de menstrues (Hâ'id) et celle en période de lochies (Nafsâ'). Toutefois, certains savants — tel Cheikh al-Islâm — ont accordé à la femme en période de menstrues la permission de réciter le Coran lorsqu'elle craint de l'oublier.</p>
<p>Il n'y a pas de mal à ce que celui qui est en état de Hadath prononce des paroles qui concordent avec le Coran, s'il n'a pas l'intention de [réciter] le Coran mais le fait à titre d'invocation (Dhikr), comme par exemple : « Bismillâh ar-Rahmân ar-Rahîm » (Au nom d'Allah, le Tout Miséricordieux, le Très Miséricordieux) et « Al-hamdou lillâhi Rabbi l-'âlamîn » (Louange à Allah, Seigneur des mondes), en raison du hadith de 'Â'icha (qu'Allah l'agrée) :</p>
<p class="ar"><span dir="rtl">«أَنَّ النَّبِيَّ ﷺ كَانَ يَذْكُرُ اللهَ عَلَى كُلِّ أَحْيَانِهِ»</span></p>
<p>« Le Prophète <span dir="rtl">ﷺ</span> invoquait Allah en tout temps. »<a href="#fn10" class="footnote-ref" id="fnref10" role="doc-noteref"><sup>10</sup></a></p>
<p>2 – Il est interdit à celui qui est en état de Hadath majeur, que ce soit par Janâba, menstrues ou lochies, de demeurer dans la mosquée sans avoir fait les ablutions, en raison de la parole du Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ لَا تَقْرَبُوا۟ ٱلصَّلَوٰةَ وَأَنتُمْ سُكَـٰرَىٰ حَتَّىٰ تَعْلَمُوا۟ مَا تَقُولُونَ وَلَا جُنُبًا إِلَّا عَابِرِى سَبِيلٍ حَتَّىٰ تَغْتَسِلُوا۟ ۚ﴾</span></p>
<p><strong>﴾ Ô vous qui croyez ! Ne vous approchez pas de la Salât alors que vous êtes ivres, jusqu'à ce que vous compreniez ce que vous dites, ni lorsque vous êtes en état d'impureté majeure, à moins que vous ne soyez en voyage [de simple passage], jusqu'à ce que vous vous soyez lavés. ﴿</strong> [Sourate An-Nisâ' : 43]. C'est-à-dire : n'entrez pas dans la mosquée pour y demeurer ; et en raison de sa parole <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«لَا أُحِلُّ الْمَسْجِدَ لِحَائِضٍ وَلَا جُنُبٍ»</span></p>
<p>« Je ne rends pas la mosquée licite à la femme en période de menstrues ni à celui qui est en état de Janâba. » Rapporté par Abou Dâwoud d'après le hadith de 'Â'icha, et Ibn Khouzayma l'a authentifié<a href="#fn11" class="footnote-ref" id="fnref11" role="doc-noteref"><sup>11</sup></a>.</p>
<p>Si donc celui qui est en état de Hadath majeur fait les ablutions, il lui est permis de demeurer dans la mosquée, en raison de la parole de 'Atâ' :</p>
<p class="ar"><span dir="rtl">«رَأَيْتُ رِجَالًا مِنْ أَصْحَابِ رَسُولِ اللهِ ﷺ يَجْلِسُونَ فِي الْمَسْجِدِ وَهُمْ مُجْنِبُونَ، إِذَا تَوَضَّؤُوا وُضُوءَ الصَّلَاةِ»</span></p>
<p>« J'ai vu des hommes parmi les Compagnons du Messager d'Allah <span dir="rtl">ﷺ</span> s'asseoir dans la mosquée alors qu'ils étaient en état de Janâba, lorsqu'ils avaient fait les ablutions de la prière. »<a href="#fn12" class="footnote-ref" id="fnref12" role="doc-noteref"><sup>12</sup></a> Et la sagesse de ces ablutions est l'allègement de la Janâba.</p>
<p>De même, il est permis à celui qui est en état de Hadath majeur de passer par la mosquée pour la simple traversée, sans s'y asseoir, en raison de la parole du Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿إِلَّا عَابِرِى سَبِيلٍ﴾</span></p>
<p>« ... à moins que vous ne soyez en voyage [de simple passage] » ; c'est-à-dire : en la traversant pour en sortir. Et l'exception à une interdiction constitue une permission ; elle spécifie donc la portée générale de sa parole <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«لَا أُحِلُّ الْمَسْجِدَ لِحَائِضٍ وَلَا جُنُبٍ»</span></p>
<p>« Je ne rends pas la mosquée licite à la femme en période de menstrues ni à celui qui est en état de Janâba. »<a href="#fn11" class="footnote-ref" id="fnref11-b" role="doc-noteref"><sup>11</sup></a></p>
<p>De même, le lieu de la prière de l'Aïd (Moussalla al-'Îd) : celui qui est en état de Hadath majeur n'y demeure pas sans ablutions, mais il lui est permis d'y passer, car le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="rtl">«وَلْيَعْتَزِلِ الْحُيَّضُ الْمُصَلَّى»</span></p>
<p>« Et que les femmes en période de menstrues se tiennent à l'écart du lieu de prière. »<a href="#fn13" class="footnote-ref" id="fnref13" role="doc-noteref"><sup>13</sup></a></p>
