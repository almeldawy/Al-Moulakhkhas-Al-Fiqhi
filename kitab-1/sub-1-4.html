<p>Certes, la prière (<strong>As-Salât</strong>) est le second pilier de l'Islam après les deux attestations de foi. Elle est la distinction entre le musulman et le mécréant, elle est le pilier de l'Islam et la première chose sur laquelle le serviteur sera jugé. Si elle est valide et acceptée, le reste de ses œuvres le sera aussi ; mais si elle est rejetée, le reste de ses œuvres le sera également.</p>
<p>La prière a été mentionnée dans de nombreux passages du Noble Coran sous diverses formes : tantôt Allah ordonne son accomplissement, tantôt Il en explique les vertus, tantôt Il en clarifie la récompense, et parfois Il l'associe à la patience et ordonne de chercher secours à travers elles dans les épreuves.</p>
<p>C'est pourquoi elle était "la réjouissance des yeux"<a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a> du Messager <span dir="rtl">ﷺ</span> dans ce bas monde. Elle est la parure des Prophètes, l'emblème des vertueux, et un lien entre le serviteur et le Seigneur des mondes. Elle préserve de la turpitude et du blâmable.</p>
<p>Puisque cette prière n'est valide qu'avec la purification du prieur de toute impureté rituelle (<strong>Hadath</strong>) et matérielle (<strong>Najas</strong>) selon ses capacités, et que la substance de cette purification est l'eau (ou ce qui la remplace comme le sable lors de l'ablution sèche en cas d'absence d'eau), les juristes — qu'Allah leur fasse miséricorde — ont commencé par le "Livre de la Purification". Car, comme la prière est placée avant le reste des piliers de l'Islam après les deux attestations de foi, il était convenable d'avancer ses conditions préalables, dont la purification. Elle est en effet la clé de la prière, comme mentionné dans le hadith :</p>
<p class="ar"><span dir="rtl">« مِفْتَاحُ الصَّلَاةِ الطُّهُورُ »</span></p>
<p>« <em><strong>La clé de la prière est la purification</strong></em> »<a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a> car l'état d'impureté empêche la prière.</p>
<p>L'état d'impureté est comme un verrou posé sur la personne ; dès qu'elle fait ses ablutions, le verrou se dénoue. La purification est donc la plus importante des conditions de la prière, et la condition doit nécessairement précéder ce qui est conditionné.</p>
<h3 id="définition-de-la-purification-at-tahârah"><strong>Définition de la purification (At-Tahârah)</strong></h3>
<ol type="1">
<li><blockquote>
<p><strong>Linguistiquement (Lughatan) :</strong> <em>La propreté et l'exemption de toute souillure sensorielle ou morale.</em></p>
</blockquote></li>
<li><blockquote>
<p><strong>Religieusement (Shar'an) :</strong> <em>La levée de l'état d'impureté rituelle (<strong>Al-Hadath</strong>) et la disparition de la substance impure (<strong>An-Najas</strong>).</em></p>
</blockquote></li>
</ol>
<p><strong>La levée de l'impureté rituelle (Al-Hadath)</strong> s'obtient par l'usage de l'eau avec l'intention (<strong>An-Niyyah</strong>) sur l'ensemble du corps s'il s'agit d'une impureté majeure, ou sur les quatre membres (visage, mains, tête, pieds) s'il s'agit d'une impureté mineure. En cas d'absence d'eau ou d'incapacité à l'utiliser, on utilise ce qui la remplace, à savoir la terre (<strong>At-Turâb</strong>) — selon une modalité spécifique — et l'explication de la manière de se purifier des deux types d'impuretés (mineure et majeure) viendra, si Allah le veut.</p>
<p>Notre objectif est maintenant d'expliquer la nature de l'eau par laquelle la purification est obtenue, et celle par laquelle elle ne l'est pas.</p>
<p>Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="ltr">﴿</span> <strong><span dir="rtl">وَأَنزَلْنَا مِنَ السَّمَاءِ مَاءً طَهُورًا</span></strong> <span dir="ltr">﴾</span></p>
<p>« <em><strong>...et Nous fîmes descendre du ciel une eau pure et purifiante. »</strong></em> [Souveraineté (Al-Furqân) : 48]</p>
<p>Et Il a dit :</p>
<p class="ar"><span dir="ltr">﴿</span> <strong><span dir="rtl">وَيُنَزِّلُ عَلَيْكُم مِّنَ السَّمَاءِ مَاءً لِّيُطَهِّرَكُم بِهِ</span></strong> <span dir="ltr">﴾</span></p>
<p>« <em><strong>...et Il fit descendre sur vous du ciel de l'eau pour vous en purifier...</strong></em> » [Le Butin (Al-Anfâl) : 11]</p>
<p><strong>L'eau purifiante (At-Tahûr)</strong> : est celle qui est pure en elle-même et purifiante pour autre qu'elle. C'est l'eau qui a conservé sa nature originelle, c'est-à-dire l'état dans lequel elle a été créée, qu'elle descende du ciel — comme la pluie, la neige fondue ou la grêle — ou qu'elle coule sur terre — comme l'eau des rivières, des sources, des puits, des mers ou l'eau distillée.</p>
<p>C'est par cette eau que la purification de l'impureté rituelle (<strong>Al-Hadath</strong>) et de la souillure matérielle (<strong>An-Najasah</strong>) est valide.</p>
<p>Cependant, si elle a été modifiée par une impureté, il n'est pas permis de se purifier avec elle sans divergence. Mais si elle est modifiée par quelque chose de pur qui n'est pas prédominant sur elle, l'avis correct parmi les paroles des savants est que la purification avec elle reste valide également.</p>
<p><strong>Cheikh al-Islam Ibn Taymiyyah a dit :</strong> « <em>Quant à la question du changement de l'eau (en petite ou grande quantité) par des substances pures, comme le savon, le jujubier (Sidr), la potasse (Oushnân), le safran, la farine, etc., qui peuvent modifier l'eau... l'avis le plus juste est que si l'eau est modifiée par ces substances tout en conservant le nom d'eau, alors il existe à ce sujet deux avis célèbres chez les savants.</em> » [« Majmû' al-Fatâwâ » (volume 21 / page 24)]</p>
<p>Il a ensuite mentionné ces avis tout en expliquant l'argumentation de chacun, puis il a privilégié l'avis confirmant la validité de la purification avec cette eau, car Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿ وَإِن كُنتُم مَّرْضَىٰ أَوْ عَلَىٰ سَفَرٍ أَوْ جَاءَ أَحَدٌ مِّنكُم مِّنَ الْغَائِطِ أَوْ لَامَسْتُمُ النِّسَاءَ فَلَمْ تَجِدُوا مَاءً فَتَيَمَّمُوا صَعِيدًا طَيِّبًا ﴾</span></p>
<p>« .<em><strong>..Et si vous ne trouvez pas d'eau, alors recourez à une terre pure...</strong></em> » [La Table Servie (Al-Mâ'idah) : 6]</p>
<p><em>Le terme « <strong>Eau</strong> » (mâ') dans le verset est un nom indéfini dans un contexte de négation, ce qui englobe tout ce qui est appelé "eau" sans distinction entre une sorte ou une autre</em>. Fin de citation.</p>
<p>Ainsi, si l'eau vient à manquer, ou si l'on est incapable de l'utiliser malgré sa présence, Allah a certes institué la terre comme substitut, selon une modalité d'utilisation que le Prophète <span dir="rtl">ﷺ</span> a clarifiée dans sa Sunna ; l'explication de cela viendra, si Allah le veut, dans le chapitre qui lui est consacré.</p>
<p>Ceci relève de la bienveillance d'Allah envers Ses serviteurs et de Sa volonté de leur éviter toute gêne. Le Très-Haut a dit :</p>
<p class="ar"> <span dir="rtl">﴿وَإِن كُنتُم مَّرْضَىٰ أَوْ عَلَىٰ سَفَرٍ أَوْ جَاءَ أَحَدٌ مِّنكُم مِّنَ الْغَائِطِ أَوْ لَامَسْتُمُ النِّسَاءَ فَلَمْ تَجِدُوا مَاءً فَتَيَمَّمُوا صَعِيدًا طَيِّبًا فَامْسَحُوا بِوُجُوهِكُمْ وَأَيْدِيكُمْ ۗ إِنَّ اللَّهَ كَانَ عَفُوًّا غَفُورًا﴾ [النساء : ٤٣]</span></p>
<p><strong>{<em>Si vous êtes malades, ou en voyage, ou si l'un de vous revient du lieu où il a fait ses besoins, ou si vous avez touché aux femmes et que vous ne trouviez pas d'eau, alors recourez à une terre pure, passez-en sur vos visages et vos mains. Allah, en vérité, est Indulgent et Pardonneur.</em>}</strong> [An-Nisa : 43]. »</p>
<p>Ibn Hubayra a dit : « <em>Ils [les savants] ont fait consensus sur le fait que la purification avec de l'eau est obligatoire pour toute personne tenue d'accomplir la prière dès lors que l'eau est disponible. S'il en manque ، alors il y a une alternative [le Tayammum] ؛ ceci conformément à la parole du Très-Haut : <strong>{...et que vous ne trouviez pas d'eau, alors recourez à une terre pure...}</strong> [An-Nisa : 43], et Sa parole : <strong>{...et Il fit descendre sur vous, du ciel, de l'eau pour vous en purifier...}</strong> [Al-Anfal : 11]</em> ». Fin de citation.</p>
<p>Ceci témoigne de la grandeur de cette religion qu'est l'Islam, qui est la religion de la pureté et de la propreté, tant physique que morale. La purification morale (du polythéisme et des péchés) s'obtient par le Tawhid et l'exclusivité du culte à Allah, tandis que la purification physique s'obtient par l'eau ou ce qui la remplace.</p>
<p>Sache que si l'eau demeure dans son état naturel et qu'aucune autre substance ne s'y est mélangée, elle est alors <strong>pure et purifiante (<em>Tahûr</em>)</strong> par consensus.</p>
<p>Si l'une de ses trois caractéristiques — son odeur, son goût ou sa couleur — est altérée par une <strong>impureté (<em>Najâsah</em>)</strong>, elle est alors <strong>impure</strong> par consensus, et son utilisation est interdite.</p>
<p>Cependant, si l'une de ses caractéristiques est altérée par le mélange d'une <strong>substance pure</strong> — comme des feuilles d'arbres, du savon, de la soude (<em>Ichnân</em>), du jujubier (<em>Sidr</em>) ou d'autres matières pures — sans que cette substance ne devienne prédominante sur l'eau, certains savants ont à ce sujet des avis détaillés et des divergences. L'avis correct est qu'elle reste <strong>pure et purifiante</strong> : il est permis de l'utiliser pour se purifier d'un état d'impureté rituelle (<em>Hadath</em>) ou pour éliminer une impureté physique (<em>Najas</em>).</p>
<p>Sur cette base, il nous est possible de dire que l'eau se divise en deux catégories :</p>
<p><strong>La première catégorie :</strong> L'eau pure et purifiante (Tahûr). La purification avec celle-ci est valide, qu'elle soit restée dans son état naturel ou qu'une substance pure s'y soit mélangée sans devenir prédominante et sans lui ôter son appellation d'« eau ».</p>
<p><strong>La deuxième catégorie :</strong> L'eau impure (Najas). Son utilisation est interdite ; elle ne permet ni de lever l'état d'impureté rituelle (Al-Hadath), ni d'éliminer une impureté physique (An-Najâsah). Il s'agit de l'eau dont l'une des caractéristiques a été altérée par une impureté.</p>
<p>Et Allah Très-Haut est plus savant.</p>
