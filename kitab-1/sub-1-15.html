<p><strong>Premièrement : Les menstrues et leurs règles :</strong></p>
<p>Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿وَيَسْأَلُونَكَ عَنِ الْمَحِيضِ قُلْ هُوَ أَذًى فَاعْتَزِلُوا النِّسَاءَ فِي الْمَحِيضِ وَلَا تَقْرَبُوهُنَّ حَتَّى يَطْهُرْنَ فَإِذَا تَطَهَّرْنَ فَأْتُوهُنَّ مِنْ حَيْثُ أَمَرَكُمُ اللهُ إِنَّ اللهَ يُحِبُّ التَّوَّابِينَ وَيُحِبُّ الْمُتَطَهِّرِينَ﴾ [البقرة: ٢٢٢].</span></p>
<p>« <strong>Et ils t'interrogent sur la menstruation des femmes. Dis : "C'est un mal. Éloignez-vous donc des femmes pendant les menstrues, et ne les approchez que quand elles sont pures. Quand elles se sont purifiées, alors cohabitez avec elles suivant les prescriptions d'Allah car Allah aime ceux qui se repentent, et Il aime ceux qui se purifient.</strong>" » [Al-Baqarah : 222].</p>
<p>Les menstrues (al-hayd) sont un sang naturel et inné qui sort du fond de l'utérus à des moments déterminés. Allah l'a créé par sagesse pour servir de nourriture à l'enfant dans le ventre de sa mère, car celui-ci a besoin de subsistance. S'il avait partagé la nourriture de sa mère, les forces de celle-ci auraient faibli ; Allah lui a donc assigné cette nourriture. C'est pourquoi il est rare qu'une femme enceinte ait ses menstrues.</p>
<p>Lorsqu'elle accouche, Allah transforme ce sang en lait qui coule de ses seins pour nourrir son enfant. C'est pour cette raison qu'il est rare qu'une femme qui allaite ait ses menstrues.</p>
<p>Enfin, lorsque la femme n'est ni enceinte ni en période d'allaitement, ce sang n'a plus d'utilisation ; il stagne alors dans un endroit de l'utérus, puis s'écoule généralement chaque mois pendant six ou sept jours. Cette durée peut être supérieure ou inférieure, et le cycle de la femme peut être plus long ou plus court, selon la constitution naturelle qu'Allah a placée en elle.</p>
<p>• La femme réglée est soumise, durant ses menstrues et à leur issue, à des règles détaillées dans le Coran et la Sunna :</p>
<p><strong>_ Parmi ces règles :</strong> la femme qui a ses règles ne doit ni prier ni jeûner pendant sa période de menstrues. Le Prophète (que la prière et le salut soient sur lui) a dit à Fatima bint Abi Houbaich :</p>
<p class="ar"><span dir="rtl">«إِذَا أَقْبَلَتِ الحَيْضَةُ؛ فَدَعِي الصَّلَاةَ»</span></p>
<p><em><strong>« Lorsque les menstrues arrivent, délaisse la prière »</strong></em> <a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a><em>.</em></p>
<p>Ainsi, si la femme indisposée venait à jeûner ou à prier durant ses menstrues, son jeûne et sa prière ne seraient pas valides, car le Prophète <span dir="rtl">ﷺ</span> le lui a interdit. Or, l'interdiction implique l'invalidité de l'acte ; de plus, elle commettrait par cela un acte de désobéissance envers Allah et Son Messager.</p>
<p><strong>_ Lorsqu'elle redevient pure (à la fin de ses menstrues),</strong> elle doit rattraper le jeûne mais pas la prière, et ce, selon le consensus des gens de science. 'Aïcha (qu'Allah l'agrée) a dit :</p>
<p class="ar"><span dir="rtl">كنا نَحيضُ على عهدِ رسولِ الله ﷺ؛ فكنا نُؤْمَرُ بقضاءِ الصَّومِ، ولا نُؤْمَرُ بقضاءِ الصَّلاةِ. متفقٌ عليه</span></p>
<p>« <em><strong>Nous avions nos menstrues à l'époque du Messager d'Allah <span dir="rtl">ﷺ</span> ; il nous était alors ordonné de rattraper le jeûne, mais il ne nous était pas ordonné de rattraper la prière.</strong></em> » (Rapporté par Al-Bukhari et Muslim). <a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a></p>
<p><strong>_ Parmi les règles concernant la femme réglée :</strong> il ne lui est pas permis d'effectuer les circonvolutions (Tawaf) autour de la Maison (la Kaaba), ni de lire le Coran, ni de rester assise dans la mosquée. <em><strong>Il est également interdit à son mari d'avoir des rapports sexuels avec elle jusqu'à ce que ses menstrues cessent et qu'elle accomplisse ses grandes ablutions (Ghusl)</strong></em>.</p>
<p>Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿وَيَسْأَلُونَكَ عَنِ الْمَحِيضِ قُلْ هُوَ أَذًى فَاعْتَزِلُوا النِّسَاءَ فِي الْمَحِيضِ وَلَا تَقْرَبُوهُنَّ حَتَّى يَطْهُرْنَ فَإِذَا تَطَهَّرْنَ فَأْتُوهُنَّ مِنْ حَيْثُ أَمَرَكُمُ اللهُ﴾ [البقرة: ٢٢٢]</span></p>
<p>« <strong>Et ils t'interrogent sur la menstruation des femmes. Dis : "C'est un mal. Éloignez-vous donc des femmes pendant les menstrues, et ne les approchez que quand elles sont pures. Quand elles se sont purifiées, alors cohabitez avec elles suivant les prescriptions d'Allah"</strong> » [Al-Baqarah : 222].</p>
<p>Le sens d'« <em><strong>éloignement</strong></em> » ici signifie l'arrêt des rapports sexuels.</p>
<p>Le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="rtl">«اصْنَعُوا كُلَّ شَيْءٍ إِلَّا النِّكَاحَ»</span></p>
<p><strong>« Faites tout ce que vous voulez, sauf l'acte sexuel »</strong>. Rapporté par l'ensemble des collecteurs de hadiths sauf Al-Bukhari <a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a>. Dans une autre version, il est dit : <strong>« sauf le coït »</strong>.</p>
<p><strong>_</strong> Il est donc permis au mari de la femme réglée de jouir d'elle par tout ce qui exclut le rapport sexuel vaginal, comme les baisers, les caresses et autres actes similaires.</p>
<p><strong>_</strong> Il n'est pas permis au mari de divorcer de son épouse pendant qu'elle a ses règles.</p>
<p>Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿يَأَيُّهَا النَّبِيُّ إِذَا طَلَّقْتُمُ النِّسَاءَ فَطَلِّقُوهُنَّ لِعِدَّتِهِنَّ﴾ [الطلاق: ١]</span></p>
<p><strong>« <em>Ô Prophète ! Quand vous divorcez d’avec les femmes, divorcez d’avec elles en tenant compte de leur période d’attente prescrite</em> » [Al-Talaq : 1] ;</strong> c'est-à-dire : lorsqu'elles sont en état de pureté et sans avoir eu de rapport sexuel au cours de cette période. Le Prophète <span dir="rtl">ﷺ</span> a ordonné à celui qui avait divorcé de sa femme alors qu'elle avait ses règles de la reprendre, puis de ne divorcer d'elle qu'une fois qu'elle serait redevenue pure, s'il le souhaitait toujours <a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a>.</p>
<p><strong>La pureté (at-tuhr)</strong> correspond à l'interruption de l'écoulement sanguin. Dès que le sang s'arrête, la femme est considérée comme pure et sa période de menstrues est terminée. Il lui incombe alors de pratiquer le lavage rituel (<strong>Ghusl</strong>), après quoi elle peut reprendre les activités qui lui étaient interdites à cause des menstrues.</p>
<p>Si elle constate, après avoir atteint l'état de pureté, des pertes de couleur trouble (brunâtre) ou jaunâtre, elle n'en tient pas compte. Ceci se base sur la parole d'Umm 'Atiyyah (qu'Allah l'agrée) :</p>
<p class="ar"><span dir="rtl">«كنا لا نَعُدُّ الصُّفْرَةَ والكُدْرَةَ بعدَ الطُّهْرِ شيئاً»</span></p>
<p><strong>« <em>Nous ne considérions pas les sécrétions jaunâtres ou troubles après la pureté comme étant quoi que ce soit [faisant partie des menstrues]</em> »</strong>. Rapporté par Abu Dawood et d'autres <a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a>.</p>
<p>Ce propos a le statut d'une parole prophétique (marfû'), car il constitue une approbation tacite du Prophète <span dir="rtl">ﷺ</span>.</p>
<p><strong>Avertissement important :</strong></p>
<p><strong>Si la femme réglée ou celle qui a ses lochies retrouve sa pureté avant le coucher du soleil</strong>، elle est tenue d'accomplir le Dhuhr et l'Asr de ce jour. Et celle d'entre elles qui retrouve sa pureté avant l'aube (al-fajr), elle est tenue d'accomplir le Maghrib et l'Icha de cette nuit. Car le temps de la seconde prière est aussi le temps de la première en cas d'excuse.</p>
<p>Cheikh al-Islam Ibn Taymiyyah — qu'Allah lui fasse miséricorde — a dit dans « Al-Fatawa » (22/434) : « <em>C'est pour cela que la majorité des savants، tels que Malik، Ach-Châfi'î et Ahmad، ont dit : Si la femme réglée retrouve sa pureté à la fin de la journée، elle prie le Dhuhr et l'Asr ensemble. Et si elle retrouve sa pureté à la fin de la nuit, elle prie le Maghrib et l'Icha ensemble, comme cela a été rapporté d'après 'Abd ar-Rahman ibn 'Awf, Abou Hourayrah et Ibn 'Abbas. Car le temps est commun entre les deux prières en cas d'excuse. Ainsi, si elle retrouve sa pureté à la fin de la journée, le temps du Dhuhr subsiste [encore], elle le prie donc avant l'Asr. Et si elle retrouve sa pureté à la fin de la nuit, le temps du Maghrib subsiste [encore] en cas d'excuse, elle le prie donc avant l'Icha.</em> » Fin de citation.</p>
<p><strong>Quant au cas où le temps d'une prière débute pour elle</strong>, puis que ses règles ou ses lochies surviennent avant qu'elle ne prie : l'avis prépondérant est qu'elle n'est pas tenue de rattraper cette prière dont elle a atteint le début du temps avant d'être indisposée.</p>
<p><strong>Cheikh al-Islam Ibn Taymiyyah — qu'Allah lui fasse miséricorde — a dit dans « Majmou' al-Fatawa » (23/335) concernant cette question :</strong></p>
<p>« <em>L'avis le plus probant au regard des preuves est celui des écoles d'Abou Hanifa et de Malik : à savoir qu' <strong>elle n'est tenue à rien [aucun rattrapage]</strong>. En effet, l'obligation de rattrapage (Qada') nécessite une prescription nouvelle [spécifique], et il n'existe ici aucune prescription qui l'oblige à rattraper. De plus, elle a retardé [la prière] d'un retard qui est autorisé ; elle n'a donc commis aucun manquement (<strong>tafrit</strong>). Quant à celui qui dort ou qui oublie, bien qu'il ne soit pas non plus en situation de manquement, ce qu'il accomplit [à son réveil ou lorsqu'il s'en souvient] n'est pas techniquement un rattrapage. Au contraire, le moment où il se réveille ou se souvient constitue, en ce qui le concerne, l'heure même de la prière.</em> » <em>Fin de citation.</em></p>
<p><strong>Deuxièmement : L'Istihaadhah (Métrorragie) et ses règles :</strong></p>
<p><strong>L'Istihaadhah (Métrorragie) :</strong> C'est l'écoulement de sang en dehors de la période habituelle [des règles], sous forme d'hémorragie provenant d'une veine appelée "Al-'Adhil".</p>
<p><strong>Le cas de la femme atteinte d'Istihaadhah est complexe :</strong> En raison de la ressemblance entre le sang des menstrues (Hayd) et celui de l'Istihaadhah. Si le sang coule de manière continue ou la majeure partie du temps, que doit-elle considérer comme étant ses règles et que doit-elle considérer comme de l'Istihaadhah (état pour lequel elle ne doit délaisser ni le jeûne ni la prière) ? En effet, la femme en état d'Istihaadhah est soumise aux mêmes règles que les femmes en état de pureté.</p>
<p><strong>Partant de là, la femme atteinte d'Istihaadhah peut se trouver dans l'une de ces trois situations :</strong></p>
<p><strong>Le premier cas :</strong> Qu'elle ait un cycle connu avant d'être atteinte par l'Istihaadhah. Par exemple, si avant l'Istihaadhah, ses règles duraient cinq ou huit jours, en début ou en milieu de mois. Elle connaît donc leur nombre de jours et leur période.</p>
<p>Dans ce cas, elle s'arrête [de prier] la durée de son habitude habituelle : elle délaisse la prière et le jeûne, et on lui applique les règles des menstrues. Une fois son cycle terminé, elle fait ses grandes ablutions (Ghusl) et prie, et elle considère tout sang persistant comme étant de l'Istihaadhah.</p>
<p>Ceci s'appuie sur la parole du Prophète <span dir="rtl">ﷺ</span> à Oum Habiba :</p>
<p class="ar"><span dir="rtl">«امْكُثِي قَدْرَ مَا كَانَتْ تَحْبِسُكِ حَيْضَتُكِ، ثُمَّ اغْتَسِلِي وَصَلِّي»</span></p>
<p><em>« <strong>Patiente la durée que tes règles te retenaient, puis lave-toi et prie</strong> » (Rapporté par Muslim).</em> <a href="#fn6" class="footnote-ref" id="fnref6" role="doc-noteref"><sup>6</sup></a></p>
<p>Et sa parole <span dir="rtl">ﷺ</span> à Fatima bint Abi Houbeich :</p>
<p class="ar"><span dir="rtl">«إِنَّمَا ذَلِكِ عِرْقٌ، وَلَيْسَ بِحَيْضٍ، فَإِذَا أَقْبَلَتْ حَيْضَتُكِ؛ فَدَعِي الصَّلَاةَ».</span></p>
<p><em>« <strong>Ce n'est là qu'une veine et ce ne sont pas les règles. Lorsque tes règles arrivent, délaisse la prière</strong> » (Hadith unanimement reconnu authentique).</em><a href="#fn7" class="footnote-ref" id="fnref7" role="doc-noteref"><sup>7</sup></a></p>
<p><strong>Le deuxième cas :</strong> Si elle n'a pas de cycle connu (cycle régulier), mais que son sang est distinct (présente des différences). Une partie du sang possède les caractéristiques des menstrues : par exemple, il est <strong>noir</strong>, <strong>épais</strong> ou a une <strong>odeur [forte]</strong>. Le reste du sang ne possède pas ces caractéristiques : il est <strong>rouge</strong>, sans odeur et fluide.</p>
<p>Dans ce cas, elle considère le sang qui possède les caractéristiques des menstrues comme étant son flux menstruel (Hayd) : elle s'arrête alors de prier et de jeûner. Elle considère tout le reste comme de l'Istihaadhah. Elle doit effectuer ses grandes ablutions (Ghusl) dès la fin de la phase où le sang présente les caractéristiques des menstrues, puis elle prie, jeûne et est considérée comme étant en état de pureté.</p>
<p>Ceci s'appuie sur la parole du Prophète <span dir="rtl">ﷺ</span> à Fatima bint Abi Houbeich :</p>
<p class="ar"><span dir="rtl">«إِذَا كَانَ دَمُ الْحَيْضِ؛ فَإِنَّهُ أَسْوَدُ يُعْرَفُ؛ فَأَمْسِكِي عَنِ الصَّلَاةِ، فَإِذَا كَانَ الْآخَرُ؛ فَتَوَضَّئِي وَصَلِّي»، رَوَاهُ أَبُو دَاوُدَ وَالنَّسَائِيُّ، وَصَحَّحَهُ ابْنُ حِبَّانَ وَالْحَاكِمُ</span></p>
<p><em>« <strong>Si c'est le sang des menstrues, il est noir et reconnaissable ; dans ce cas, abstiens-toi de prier. Mais si c'est l'autre [sang], fais tes ablutions et prie</strong> »</em> (Rapporté par Abou Daoud et An-Nassa'i, authentifié par Ibn Hibban et Al-Hakim)<a href="#fn8" class="footnote-ref" id="fnref8" role="doc-noteref"><sup>8</sup></a>.</p>
<p>Ce Hadith prouve que la femme atteinte d'Istihaadhah doit prendre en compte les caractéristiques du sang pour distinguer les menstrues du reste.</p>
<p><strong>Le troisième cas :</strong> Si elle n'a pas une période habituelle qu'elle connaît, ni de caractéristique permettant de distinguer le sang des menstrues d'un autre (sang) ، elle doit alors considérer comme durée de ses menstrues la durée habituelle de la majorité des femmes ، soit six ou sept jours par mois. En effet, c'est cela l'habitude de la majorité des femmes ، conformément à la parole du Prophète <span dir="rtl">ﷺ</span> à Hamnah bint Jahsh :</p>
<p class="ar"><span dir="rtl">« إِنَّمَا هِيَ رَكْضَةٌ مِنَ الشَّيْطَانِ ؛ فَتَحَيَّضِي سِتَّةَ أَيَّامٍ أَوْ سَبْعَةَ أَيَّامٍ ، ثُمَّ اغْتَسِلِي ، فَإِذَا اسْتَنْقَأْتِ ، فَصَلِّي أَرْبَعَةً وَعِشْرِينَ أَوْ ثَلَاثَةً وَعِشْرِينَ ، وَصُومِي وَصَلِّي ؛ فَإِنَّ ذَلِكَ يُجْزِئُكِ ، وَكَذَلِكَ فَافْعَلِي كَمَا تَحِيضُ النِّسَاءُ » ، رَوَاهُ الْخَمْسَةُ ، وَصَحَّحَهُ التِّرْمِذِيُّ .</span></p>
<p>« <em><strong>Ce n'est qu'un coup asséné par le Diable. Considère-toi donc en état de menstrues durant six ou sept jours ، puis accomplis le lavage rituel (Ghusl). Lorsque tu auras constaté que tu es pure ، prie pendant vingt-quatre ou vingt-trois jours ، jeûne et prie ، car cela te suffira. Agis ainsi de la même manière que les femmes ont leurs menstrues</strong></em>. » Rapporté par les cinq (Imams) et authentifié par At-Tirmidhi.<a href="#fn9" class="footnote-ref" id="fnref9" role="doc-noteref"><sup>9</sup></a></p>
<p><strong>En résumé, ce qui précède montre que :</strong></p>
<ul>
<li><blockquote>
<p>La femme ayant un <strong>cycle</strong> établie se réfère à son cycle habituel.</p>
</blockquote></li>
<li><blockquote>
<p>Celle qui peut <strong>distinguer</strong> (le sang) se réfère aux caractéristiques du sang.</p>
</blockquote></li>
<li><blockquote>
<p>Celle qui n'a ni l'un ni l'autre considère ses menstrues comme étant de <strong>six ou sept jours</strong>. Cela permet de concilier les trois traditions (<em>Sunan</em>) rapportées du Prophète <span dir="rtl">ﷺ</span> concernant la femme atteinte de métrorragie.</p>
</blockquote></li>
</ul>
<p><strong>Le Cheikh de l'Islam Ibn Taymiyya — qu'Allah lui fasse miséricorde — a dit :</strong></p>
<p>« Les signes mentionnés (pour identifier les règles) sont au nombre de six :</p>
<ol type="1">
<li><blockquote>
<p><strong>Le cycle habituel :</strong> C'est le signe le plus probant, car la base est que le temps habituel est celui des menstrues à l'exclusion de tout autre.</p>
</blockquote></li>
<li><blockquote>
<p><strong>La distinction :</strong> Car le sang noir, épais et fétide est plus à même d'être considéré comme du sang de règles que le sang rouge.</p>
</blockquote></li>
<li><blockquote>
<p><strong>La prise en compte de la norme de la majorité des femmes :</strong> Car la règle de base est de rattacher le cas individuel au cas le plus général et fréquent. Ces trois signes sont prouvés par la Sunna et la logique (<em>Al-I'tibâr</em>). »<a href="#fn10" class="footnote-ref" id="fnref10" role="doc-noteref"><sup>10</sup></a></p>
</blockquote></li>
</ol>
<p>Il a ensuite mentionné le reste des signes qui ont été proposés.</p>
<p><strong>Il est dit dans "Al-Nihâyah" :</strong></p>
<p>« <em>L'avis le plus juste consiste à prendre en compte les signes apportés par la Sunna et à écarter tout ce qui est en dehors de cela.</em> » Fin de citation.<a href="#fn11" class="footnote-ref" id="fnref11" role="doc-noteref"><sup>11</sup></a></p>
<p><strong>Ce qui incombe à la femme atteinte de métrorragie lorsqu'elle est jugée en état de pureté :</strong></p>
<p><strong>1.</strong> Elle a l'obligation de procéder au grand lavage rituel (<em>Ghusl</em>) à la fin de sa période de menstrues considérée (déterminée selon les critères expliqués précédemment).</p>
<p><strong>2.</strong> Elle doit laver ses parties intimes pour éliminer les traces de l'écoulement avant chaque prière. Elle doit placer dans l'orifice du coton (ou tout autre moyen similaire) pour contenir l'écoulement et le fixer de manière à ce qu'il ne tombe pas. Ensuite, elle doit accomplir ses ablutions (<em>Woudou</em>) au début de chaque temps de prière, conformément à la parole du Prophète <span dir="rtl">ﷺ</span> concernant la femme atteinte de métrorragie</p>
<p class="ar"><span dir="rtl">« تَدَعُ الصَّلَاةَ أَيَّامَ أَقْرَائِهَا ، ثُمَّ تَغْتَسِلُ وَتَتَوَضَّأُ عِنْدَ كُلِّ صَلَاةٍ »</span></p>
<p>« <em><strong>Elle délaisse la prière durant les jours de ses règles, puis elle effectue le lavage rituel et fait ses ablutions pour chaque prière.</strong></em> » Rapporté par Abou Daoud, Ibn Majah et At-Tirmidhi qui a dit : « <em>C'est un hadith bon (Hassan)</em> ». <a href="#fn12" class="footnote-ref" id="fnref12" role="doc-noteref"><sup>12</sup></a></p>
<p>Et il <span dir="rtl">ﷺ</span> a dit également :</p>
<p class="ar"><span dir="rtl">« أَنْعَتُ لَكِ الكُرْسُفَ »</span></p>
<p><em><strong>« Je te suggère l'usage de coton (Al-Kursuf) ، tu en rembourres l'endroit. »</strong></em> <a href="#fn13" class="footnote-ref" id="fnref13" role="doc-noteref"><sup>13</sup></a></p>
<p>Le <em>Kursuf</em> désigne le coton. Il est également possible d'utiliser les protections hygiéniques (serviettes médicales) disponibles de nos jours.</p>
<p><strong>Troisièmement : Les lochies et leurs règles :</strong></p>
<p><strong>_ Les lochies sont semblables aux menstrues concernant ce qui est autorisé :</strong> comme les préliminaires sans rapport sexuel (pénétration) ; et concernant ce qui est <strong>interdit :</strong> comme le rapport sexuel, l'interdiction du jeûne, de la prière, du divorce, des circonvolutions (<em>Tawâf</em>), de la lecture du Coran et du séjour dans la mosquée. Elles sont aussi semblables pour l'obligation du grand lavage (<em>Ghusl</em>) pour la femme accouchée dès l'arrêt du sang. Elle doit rattraper le jeûne mais pas la prière, tout comme la femme réglée.</p>
<p><strong>_ Les lochies sont le sang que l'utérus rejette lors de l'accouchement et après celui-ci.</strong> Il s'agit du reste du sang qui était retenu pendant la durée de la grossesse. Sa durée maximale, selon la majorité des savants, est de <em><strong>quarante jours</strong></em>.</p>
<p><strong>_ At-Tirmidhi a dit :</strong> « <em>Les gens de science parmi les Compagnons, les Suivants (Tabi'în) et ceux qui les ont succédés sont unanimes sur le fait que la femme accouchée délaisse la prière pendant quarante jours, à moins qu'elle ne constate sa pureté avant cela ; dans ce cas, elle accomplit le lavage rituel et prie.</em> » Fin de citation.<a href="#fn14" class="footnote-ref" id="fnref14" role="doc-noteref"><sup>14</sup></a></p>
<p>Ainsi, si le sang des lochies s'arrête avant les quarante jours, sa période de lochies est terminée. Elle doit alors se laver, prier et peut de nouveau pratiquer tout ce qui lui était interdit à cause des lochies.</p>
<p><strong>_ Si la femme enceinte expulse ce en quoi une forme humaine est apparente :</strong> C'est-à-dire qu'une ébauche de membres ou d'organes est visible, et qu'un saignement accompagne ou suit cette expulsion, elle est alors soumise aux règles des lochies (<em>Nifâs</em>). La période à partir de laquelle la forme humaine devient généralement apparente durant la grossesse est de trois mois, et au minimum de <strong>quatre-vingt-un (81) jours</strong>.</p>
<p>En revanche, si elle expulse une masse de sang adhérente (<em>'Alaqah</em>) ou un amas de chair (<em>Mudghah</em>) où aucune forme humaine n'est discernable, nous ne considérons pas le sang qui s'écoule après cela comme des lochies. Par conséquent, elle ne doit délaisser ni la prière ni le jeûne, et les règles relatives aux femmes accouchées ne s'appliquent pas à elle.</p>
<p><strong>Remarque importante :</strong></p>
<p>Il y a ici une question sur laquelle il faut attirer l'attention : certaines femmes prennent parfois des médicaments pour empêcher l'apparition des menstrues afin de pouvoir jeûner durant le mois de Ramadan ou accomplir les rites du Pèlerinage (<em>Hajj</em>).</p>
<ul>
<li><blockquote>
<p>Si ces pilules servent à <strong>empêcher l'écoulement du sang temporairement</strong> sans l'interrompre définitivement, il n'y a pas de mal à les prendre.</p>
</blockquote></li>
<li><blockquote>
<p>En revanche, si elles visent à <strong>interrompre les menstrues de façon permanente</strong>, cela n'est pas permis, sauf avec l'autorisation de l'époux, car cela entraîne l'arrêt définitif de la procréation.</p>
</blockquote></li>
</ul>
<p>Ceci constitue un aperçu des règles relatives aux menstrues que nous avons passé en revue rapidement. Leurs détails nécessiteraient beaucoup plus de temps. Cependant, toute personne rencontrant une difficulté de compréhension sur ces points (ou d'autres) se doit d'interroger les savants. Elle trouvera auprès d'eux, si Allah le veut, ce qui dissipera son ambiguïté.</p>
<p>C'est d'Allah que vient la réussite.</p>
