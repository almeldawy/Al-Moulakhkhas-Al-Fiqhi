<p>Après avoir pris connaissance des conditions de l'ablution, de ses obligations et de ses actes recommandés selon ce qui a été précédemment exposé, il est probable que tu aspires à présent à l'explication de la manière de l'accomplir, au sein de laquelle ces règles s'appliquent. Il s'agit de la description de l'ablution complète incluant les obligations et les recommandations, telle qu'elle est inspirée des textes de la législation musulmane (Charia)؛ afin que tu puisses œuvrer à sa mise en pratique, si Allah le veut.</p>
<p>Voici donc la description de l'ablution :</p>
<p>_ Qu'il formule l'intention de faire l'ablution pour ce qui la nécessite, comme la prière ou autre.</p>
<p>_ Puis qu'il dise : « Bismillah » (Au nom d'Allah).</p>
<p>_ Ensuite, il se lave les mains (jusqu'aux poignets) trois fois.</p>
<p>_ Puis, il se rince la bouche trois fois, aspire l'eau par le nez trois fois, et rejette l'eau de son nez à l'aide de sa main gauche.</p>
<p>_ Ensuite, il lave son visage trois fois. La limite du visage en longueur s'étend de la naissance habituelle des cheveux au sommet du front jusqu'au bas des mâchoires et du menton. Les mâchoires sont les deux os de la partie inférieure du visage : l'un à droite et l'autre à gauche, et le menton est leur point de jonction. Le poil de la barbe fait partie intégrante du visage ; il est donc obligatoire de le laver, même s'il est long.</p>
<p><strong>*Si la barbe est peu fournie</strong> (on voit la peau à travers), il est obligatoire d'en laver l'intérieur (la peau) et l'extérieur.</p>
<p><strong>*Si elle est épaisse</strong> (elle cache la peau), il est obligatoire d'en laver l'extérieur, et il est recommandé d'en passer l'eau à l'intérieur (le frottement/le passage des doigts), comme mentionné précédemment.</p>
<p>La limite du visage en largeur s'étend d'une oreille à l'autre. Quant aux oreilles, elles font partie de la tête ; elles sont donc essuyées avec elle, comme mentionné précédemment.</p>
<p>_ Puis, il lave ses mains (bras) en incluant les coudes trois fois. La limite de la "main" (du bras) ici s'étend : de l'extrémité des doigts (ongles inclus) jusqu'au début de l'humérus (le haut du bras).</p>
<p><strong>Il est impératif d'enlever tout ce qui est collé aux mains avant le lavage, comme de la pâte, de la boue ou de la teinture épaisse (vernis) sur les ongles, afin que l'eau de l'ablution puisse atteindre la peau.</strong></p>
<p>_ Puis, il essuie l'ensemble de sa tête et ses oreilles une seule fois, avec une nouvelle eau (en se remouillant les mains) et non avec l'humidité restante du lavage de ses bras.</p>
<p>La description de l'essuyage de la tête consiste à placer ses deux mains mouillées sur le devant de sa tête (au niveau du front), à les faire passer jusqu'à sa nuque, puis à les ramener vers l'endroit d'où il a commencé. Ensuite, il introduit ses deux index dans le conduit de ses oreilles et essuie l'extérieur de celles-ci (le pavillon) avec ses deux pouces.</p>
<p>_ Puis, il lave ses pieds trois fois en incluant les chevilles. Les chevilles (al-ka'bân) sont les deux os saillants situés à la base de la jambe.</p>
<p><strong>Quant à celui qui a une main (un bras) ou un pied amputé :</strong></p>
<ul>
<li><blockquote>
<p>Il doit laver ce qu'il reste de l'avant-bras ou de la jambe.</p>
</blockquote></li>
</ul>
<ul>
<li><blockquote>
<p>Si le membre a été coupé au niveau de l'articulation du coude, il lave l'extrémité de l'humérus (le haut du bras).</p>
</blockquote></li>
</ul>
<ul>
<li><blockquote>
<p>S'il a été coupé au niveau de la cheville, il lave l'extrémité de la jambe.</p>
</blockquote></li>
</ul>
<p>Ceci est basé sur la parole d'Allah (Le Très-Haut) :</p>
<p class="ar"><span dir="ltr">﴿</span><strong><span dir="rtl">فَاتَّقُوا اللَّهَ مَا اسْتَطَعْتُمْ</span></strong><span dir="rtl">﴾ [التغابن: ١٦]</span></p>
<p>« <em><strong>Craignez Allah autant que vous le pouvez</strong></em> » (Sourate At-Taghabun, v.16),</p>
<p>et sur la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="ltr">«</span><strong><span dir="rtl">إِذَا أَمَرْتُكُمْ بِأَمْرٍ؛ فَأْتُوا مِنْهُ مَا اسْتَطَعْتُمْ</span></strong><span dir="ltr">»</span></p>
<p>« <em><strong>Quand je vous ordonne une chose, accomplissez-en ce que vous pouvez.</strong></em> »<a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a></p>
<p>Ainsi, lorsqu'il lave ce qu'il reste de la partie obligatoire, il a accompli ce qui était en son pouvoir.</p>
<p>Ensuite, après avoir terminé l'ablution selon la description que nous avons mentionnée, il lève son regard vers le ciel et prononce les invocations rapportées du Prophète <span dir="rtl">ﷺ</span> pour cette situation, parmi lesquelles :</p>
<p class="ar"><span dir="ltr">«</span><strong><span dir="rtl">أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا اللهُ وَحْدَهُ لَا شَرِيكَ لَهُ، وَأَشْهَدُ أَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُولُهُ، اللَّهُمَّ اجْعَلْنِي مِنَ التَّوَّابِينَ، وَاجْعَلْنِي مِنَ المُتَطَهِّرِينَ، سُبْحَانَكَ اللَّهُمَّ وَبِحَمْدِكَ، أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا أَنْتَ، أَسْتَغْفِرُكَ وَأَتُوبُ إِلَيْكَ</span></strong><span dir="ltr">»</span></p>
<p>« <em>J'atteste qu'il n'y a de divinité digne d'adoration qu'Allah, Seul, sans associé, et j'atteste que Muhammad est Son serviteur et Son messager. Ô Allah, compte-moi parmi ceux qui se repentent et parmi ceux qui se purifient. Gloire et louange à Toi, ô Allah. J'atteste qu'il n'y a de divinité digne d'adoration que Toi. Je Te demande pardon et je me repens à Toi.</em> »<a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a></p>
<p><strong>La sagesse (le lien logique) dans le fait de prononcer cette évocation (<em>dhikr</em>) et cette invocation (<em>dou'â</em>) après l'ablution est la suivante :</strong></p>
<p>Puisque l'ablution constitue une purification de l'apparence (<strong>le corps</strong>), il était tout à fait approprié d'y joindre l'évocation de la purification de l'intérieur (<strong>l'âme</strong>), à travers l'Unicité (<em>Tawhîd</em>) et le repentir (<em>Tawbah</em>), qui sont les deux plus grands purificateurs.</p>
<p>Ainsi, lorsque l'individu réunit ces deux purifications :</p>
<ol type="1">
<li><blockquote>
<p>La purification de l'apparence par l'eau de l'ablution.</p>
</blockquote></li>
<li><blockquote>
<p>La purification de l'intérieur par l'Unicité et le repentir.</p>
</blockquote></li>
</ol>
<p>Il devient alors pleinement apte à se présenter devant Allah, à se tenir debout devant Lui (pour la prière) et à s'entretenir intimement avec Lui.</p>
<p>_ Il n'y a aucun mal à ce que celui qui a fait ses ablutions s'essuie les membres pour les sécher de l'eau de l'ablution, en utilisant un linge (serviette) ou autre.</p>
<p><strong>Sache ensuite, ô musulman, qu'il est obligatoire de parfaire l'ablution (<em>Isbâgh al-Woudou'</em>).</strong> Cela consiste à l'accomplir de manière complète en lavant intégralement les membres requis et en faisant couler l'eau sur chaque partie de ces membres, sans en délaisser la moindre parcelle que l'eau n'aurait pas touchée.</p>
<p>En effet, le Prophète <span dir="rtl">ﷺ</span> vit un homme qui avait laissé sur son pied un espace de la taille d'un ongle (non mouillé) ; il lui dit alors :</p>
<p class="ar"><strong><span dir="rtl">«ارْجِعْ؛ فَأَحْسِنْ وُضُوءَكَ»</span></strong></p>
<p><strong>« <em>Retourne et accomplis correctement ton ablution.</em> »</strong><a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a></p>
<p>D'après certaines épouses du Prophète <span dir="rtl">ﷺ</span>, il a été rapporté qu'il vit un homme prier alors qu'il restait sur son pied une petite zone de la taille d'un dirham (une pièce de monnaie) que l'eau n'avait pas touchée. Il lui ordonna alors de recommencer l'ablution ainsi que la prière.<a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a></p>
<p>Le Prophète <span dir="rtl">ﷺ</span> a également dit :</p>
<p class="ar"><strong><span dir="rtl">«وَيْلٌ لِلأَعْقَابِ مِنَ النَّارِ»</span></strong></p>
<p><strong>« <em>Malheur aux talons [non lavés] face au feu de l'Enfer !</em> ».</strong><a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a></p>
<p>Ceci s'explique par le fait qu'une certaine négligence peut survenir dans leur lavage (les pieds/talons) : l'eau n'y parvient pas totalement, ou il y reste des zones non couvertes par l'eau. Pour cette raison, ils (les talons) seront châtiés par le feu.</p>
<p>Le Prophète <span dir="rtl">ﷺ</span> a dit, dans le hadith rapporté par Abou Daoud et d'autres :</p>
<p class="ar"><strong><span dir="rtl">«إِنَّهَا لَا تَتِمُّ صَلَاةُ أَحَدِكُمْ حَتَّى يُسْبِغَ الوُضُوءَ كَمَا أَمَرَهُ اللهُ؛ فَيَغْسِلُ وَجْهَهُ وَيَدَيْهِ إِلَى المِرْفَقَيْنِ،ثُمَّ يَمْسَحُ بِرَأْسِهِ وَرِجْلَيْهِ إِلَى الكَعْبَيْنِ».</span></strong></p>
<p>« <em><strong>Certes, la prière de l'un d'entre vous n'est complète que s'il parfait l'ablution (yousbigh al-woudou') comme Allah le lui a ordonné ; il lave alors son visage et ses mains jusqu'aux coudes, puis il essuie sa tête et [lave] ses pieds jusqu'aux chevilles.</strong></em> »<a href="#fn6" class="footnote-ref" id="fnref6" role="doc-noteref"><sup>6</sup></a></p>
<p><strong>Sache ensuite, ô musulman, que parfaire l'ablution (<em>Isbâgh</em>) ne signifie pas verser l'eau en abondance.</strong> Cela signifie plutôt couvrir entièrement le membre en y faisant couler l'eau. Quant au fait de verser l'eau excessivement, c'est un gaspillage (<em>Isrâf</em>) interdit. Il arrive même que quelqu'un verse beaucoup d'eau sans pour autant atteindre la purification obligatoire. Le comportement prescrit est d'atteindre la perfection de l'ablution tout en utilisant peu d'eau.</p>
<p>Il est d'ailleurs confirmé dans les deux recueils authentiques (Bukhari et Muslim) que le Prophète <span dir="rtl">ﷺ</span> faisait ses ablutions avec un <strong>Mudd</strong> (<em>environ une poignée double d'eau</em>) et se lavait (le corps/Ghusl) avec un <strong>Sâ'</strong> (<em>quatre Mudds</em>) jusqu'à cinq Mudds.<a href="#fn7" class="footnote-ref" id="fnref7" role="doc-noteref"><sup>7</sup></a></p>
<p>Le Prophète <span dir="rtl">ﷺ</span> a interdit le gaspillage de l'eau. Il passa un jour près de <strong>Sa'd</strong> alors qu'il faisait ses ablutions et lui dit : <strong>« <em>Quel est ce gaspillage ?</em> »</strong>. Sa'd demanda : « Y a-t-il du gaspillage dans l'abluti<em>on ?! ».</em> Il répondit : <strong><em>« Oui, même si tu te trouves au bord d'un fleuve qui coule.</em> »</strong><a href="#fn8" class="footnote-ref" id="fnref8" role="doc-noteref"><sup>8</sup></a> <em>(Rapporté par Ahmad et Ibn Majah)</em>. Le gaspillage (<em>Saraf</em>) est l'opposé de la modération.</p>
<p>Il <span dir="rtl">ﷺ</span> a également informé qu'il y aurait dans sa communauté des gens qui outrepasseraient les limites dans la purification<a href="#fn9" class="footnote-ref" id="fnref9" role="doc-noteref"><sup>9</sup></a>, et il a dit :</p>
<p class="ar"><strong><span dir="rtl">«إِنَّ لِلْوُضُوءِ شَيْطَاناً يُقَالُ لَهُ: الوَلْهَانُ؛ فَاتَّقُوا وَسْوَاسَ المَاءِ»</span></strong></p>
<p><strong>« <em>Il y a pour l'ablution un démon appelé "Al-Walhân" ; méfiez-vous donc des insufflations (obsessionnelles) liées à l'eau.</em> »</strong><a href="#fn10" class="footnote-ref" id="fnref10" role="doc-noteref"><sup>10</sup></a></p>
<p>Le gaspillage lors de l'écoulement de l'eau — en plus du fait qu'il s'agisse d'une perte d'eau sans bénéfice — entraîne d'autres méfaits :</p>
<ul>
<li><blockquote>
<p>La personne peut se reposer sur l'abondance de l'eau et ne pas vérifier si l'eau atteint correctement tous les membres. Il se peut qu'une zone reste sèche sans qu'elle s'en aperçoive ; ses ablutions restent alors incomplètes, et elle finit par prier sans être en état de pureté.</p>
</blockquote></li>
<li><blockquote>
<p>On craint pour cette personne l'excès dans l'adoration. Or, les ablutions sont un acte d'adoration, et lorsque l'excès s'introduit dans une adoration, il la corrompt.</p>
</blockquote></li>
<li><blockquote>
<p>Le gaspillage de l'eau peut engendrer chez la personne des doutes maladifs concernant sa purification.</p>
</blockquote></li>
</ul>
<p>Tout le bien réside dans le fait de suivre l'exemple du Messager <span dir="rtl">ﷺ</span>. Les pires des choses sont les innovations. Puisse Allah nous accorder à tous la réussite dans ce qu'Il aime et agréé.</p>
<p>Tu te dois donc, ô musulman, de veiller à ce que tes ablutions et l'ensemble de tes actes d'adoration soient accomplis conformément à la voie légiférée, sans excès ni négligence. En effet, les deux extrémités d'une chose sont blâmables, et la meilleure des mesures est le juste milieu.</p>
<p>Celui qui est négligent dans l'adoration en diminue la valeur, tandis que celui qui est excessif y ajoute ce qui n'en fait pas partie. Seul celui qui suit la Tradition (<em>Sunna</em>) du Messager <span dir="rtl">ﷺ</span> est celui qui lui donne son plein droit.</p>
<p>« Ô Allah ! Montre-nous la vérité comme étant la vérité et accorde-nous de la suivre. Montre-nous le faux comme étant le faux et accorde-nous de nous en écarter. Ne le rends pas confus à nos yeux, au risque que nous ne nous égarions. »</p>

<p>Et Al-Hafiz (Ibn Hajar) a dit dans « Takhrij al-Adhkar » : « Sa chaîne de transmission est authentique (Sahih al-Isnad), ... sans aucun doute... Bien qu'il y ait une divergence sur le fait qu'il soit Marfu' (remontant directement au Prophète <span dir="rtl">ﷺ</span>) ou Mawquf (s'arrêtant à un compagnon). Même en supposant qu'il soit Mawquf, il traite d'un sujet qui ne relève pas de l'opinion personnelle ; il a donc le statut de Marfu' (ce qui signifie qu'il est considéré comme provenant de l'enseignement du Prophète <span dir="rtl">ﷺ</span>). »<a href="#fnref2" class="footnote-back" role="doc-backlink">↩︎</a></p></li>
