<p><strong>L'Introduction</strong></p>
<p>Louange à Allah, Seigneur de l'univers. Que les éloges et le salut soient sur notre Prophète Muhammad, le sceau des prophètes, ainsi que sur sa famille, ses compagnons et tous ceux qui les suivent avec excellence jusqu'au Jour de la Rétribution.</p>
<p><strong>Ensuite :</strong></p>
<p>Ceci est un résumé en matière de jurisprudence (Fiqh), accompagné de ses preuves tirées du Livre et de la Sunna. Je l'avais initialement dispensé sous forme de sessions à la radio. La demande s'est répétée de la part de ceux qui l'ont entendu, insistant pour son impression afin que le profit en soit durable, si Allah le veut. Je n'avais pas l'intention de le faire au moment de sa préparation, mais cédant au désir de beaucoup, j'ai revu son contenu, je l'ai organisé et je l'ai présenté à l'impression.</p>
<p>Et le voici entre vos mains, ô noble lecteur. Ce que vous y trouverez de juste et d'utile, alors la grâce en revient à Allah Seul. Quant à ce que vous y trouverez comme erreur, cela provient de moi-même, et je demande pardon à Allah.</p>
<p>Je l'ai résumé à partir du livre « Ar-Rawd Al-Murbi’ Sharh Zâd Al-Mustaqni’ », ainsi que de la glose (Hâshiyah) de l'éminent Cheikh ‘Abd Ar-Rahmân ibn Muhammad ibn Qâsim — qu'Allah lui fasse miséricorde — tout en y ajoutant quelques annotations de ma part lorsque cela s'avérait opportun.</p>
<p>Ceci étant dit, je demande à Allah <span dir="rtl">ﷺ</span> de nous accorder à tous la réussite vers la science utile et l'œuvre pieuse.</p>
<p>Que les éloges d'Allah et Son salut soient sur notre Prophète Muhammad, sa famille et ses compagnons.</p>
<p>Ecrit par Sheykh Sâlih Al-Fawzân</p>
