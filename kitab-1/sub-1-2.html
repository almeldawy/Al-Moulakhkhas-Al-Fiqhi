  <!-- ▼ CONTENU DU CHAPITRE ▼ -->
  <template id="chapter-content">
<p>Louange à Allah, Seigneur de l'univers. Que la prière et le salut soient sur notre Prophète Muhammad, ainsi que sur sa famille, ses compagnons et ceux qui les suivent avec excellence jusqu'au Jour de la Rétribution.</p>
<p>Ceci étant dit :</p>
<p>L'apprentissage approfondi (at-tafaqquh) de la religion compte parmi les meilleures œuvres ; c'est un signe de bienfait. Le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar">« <em><strong><span dir="rtl">مَنْ يُرِدِ اللهُ بِهِ خَيْرًا؛ يُفَقِّهْهُ فِي الدِّين</span>ِ</strong> »</em></p>
<p>«<em><strong>Celui à qui Allah veut du bien, Il lui accorde la compréhension de la religion.</strong></em>»<a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a></p>
<p>Ceci s'explique par le fait que c'est à travers la compréhension de la religion que l'on acquiert la science utile, celle sur laquelle repose l'œuvre pieuse.</p>
<p>Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="ltr">﴿</span> <strong><span dir="rtl">هُوَ الَّذِي أَرْسَلَ رَسُولَهُ بِالْهُدَى وَدِينِ الْحَقِّ</span></strong> <span dir="rtl">﴾ [التوبة : ٣٣]</span></p>
<p>« <em><strong>C'est Lui qui a envoyé Son messager avec la guidée et la religion de vérité.</strong></em> » (Sura At-Tawbah : 33)</p>
<p>La « <strong>guidée</strong> » (al-houda) est la science utile, et la « <strong>religion de vérité</strong> » (din al-haqq) est l'œuvre pieuse.</p>
<p>Allah Subḥānahu a certes ordonné à Son Prophète <span dir="rtl">ﷺ</span> de Lui demander un accroissement de science. Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="ltr">﴿</span> <strong><span dir="rtl">وَقُلْ رَبِّ زِدْنِي عِلْمًا</span></strong> <span dir="rtl">﴾ [طه : ١١٤]</span></p>
<p>«<em><strong>Et dis : "Ô mon Seigneur, accroît ma science !"</strong></em>» (Sura Taha : 114)</p>
<p>L'Hafiz Ibn Hajar a dit :</p>
<p>« Sa parole <span dir="rtl">ﷺ</span> : {<em><strong>Et dis : "Ô mon Seigneur, accroît ma science !"</strong></em>} est une preuve évidente du mérite de la science. Car Allah n'a jamais ordonné à Son Prophète <span dir="rtl">ﷺ</span> de demander l'accroissement d'une chose, si ce n'est de la science. »<a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a></p>
<p>Le Prophète <span dir="rtl">ﷺ</span> a également nommé les assemblées où l'on enseigne la science utile : « <em><strong>les jardins du Paradis</strong></em> » <a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a>, et il a informé que les savants sont les héritiers des prophètes.</p>
<p>Il ne fait aucun doute qu'avant d'entreprendre une action, l'homme doit nécessairement connaître la manière de l'accomplir correctement, afin que cette action soit valide et produise le résultat escompté. Comment alors l'homme peut-il s'engager dans l'adoration de son Seigneur — dont dépendent son salut face au Feu et son entrée au Paradis — sans science préalable ?!</p>
<p>C'est pourquoi les gens se sont divisés en trois catégories vis-à-vis de la science et de l'action :</p>
<p><u>Le premier groupe :</u> Ceux qui ont réuni la science utile et l'œuvre pieuse. Ceux-là, Allah les a guidés sur le chemin de ceux qu'Il a comblés de Ses bienfaits parmi les prophètes, les véridiques, les martyrs et les vertueux. Et quelle excellente compagnie que la leur !</p>
<p><u>Le deuxième groupe :</u> Ceux qui ont appris la science utile mais ne l'ont pas mise en pratique. Ce sont ceux qui ont encouru la colère (al-maghdoubi 'alayhim), parmi les Juifs et ceux qui suivent leur voie.</p>
<p><u>Le troisième groupe :</u> Ceux qui agissent sans science. Ce sont les égarés (al-dallîn), parmi les Chrétiens et ceux qui suivent leur voie.</p>
<p>Ces trois groupes sont évoqués dans la parole d'Allah le Très-Haut dans la sourate Al-Fatiha, que nous récitons à chaque unité de prière (rak'ah) :</p>
<p class="ar"><span dir="ltr">﴿</span> <span dir="rtl"><strong>اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ * صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلَا الضَّالِّينَ</strong></span> <span dir="ltr">﴾</span></p>
<p class="ar"> <span dir="rtl">[الفاتحة : ٦-٧]</span></p>
<p>« <em><strong>Guide-nous dans le droit chemin, le chemin de ceux que Tu as comblés de Tes bienfaits, non pas de ceux qui ont encouru Ta colère, ni des égarés.</strong></em> » (Al-Fatiha : 6-7)</p>
<p>L'Imam Cheikh Muhammad ibn Abd al-Wahhab (qu'Allah lui fasse miséricorde) a dit :</p>
<p>« <em>Quant à Sa parole — le Très-Haut — : {.<strong>.. non pas de ceux qui ont encouru Ta colère, ni des égarés</strong>} ; ceux qui ont encouru la colère sont les savants qui n'ont pas mis en pratique leur savoir, et les égarés sont ceux qui agissent sans science. La première description est celle des Juifs et la seconde est celle des Chrétiens.</em></p>
<p><em>Or, beaucoup de gens, lorsqu'ils voient dans l'exégèse (tafsir) que les Juifs ont encouru la colère et que les Chrétiens sont égarés, l'ignorant pense alors que cela les concerne exclusivement, alors qu'il récite lui-même cette invocation et que son Seigneur lui a imposé de l'invoquer par celle-ci pour se protéger du chemin des gens dotés de telles caractéristiques !! Gloire à Allah !</em></p>
<p><em>Comment Allah pourrait-Il lui enseigner cela, le choisir pour lui et lui imposer de L'invoquer par cette demande en permanence, alors qu'il n'y aurait aucun danger pour lui [de suivre leur voie] ? Imaginer une telle chose, c'est avoir une mauvaise opinion d'Allah !</em> » Fin de citation du Cheikh (qu'Allah lui fasse miséricorde).</p>
<p>Ceci nous explique la sagesse derrière l'obligation de réciter cette immense sourate — la sourate Al-Fatiha — à chaque unité de nos prières, qu'elles soient obligatoires ou surérogatoires. Cela est dû aux secrets immenses qu'elle renferme, dont, globalement, cette immense invocation : qu'Allah nous accorde le succès de suivre le chemin des gens de la science utile et de l'œuvre pieuse, qui est le chemin du salut ici-bas et dans l'au-delà, et qu'Il nous écarte du chemin des perdants, ceux qui ont délaissé soit l'œuvre pieuse, soit la science utile.</p>
<p>Sache ensuite, cher lecteur, que la science utile se puise uniquement dans le Livre (le Coran) et la Sunna, en cherchant à les comprendre et à les méditer. On s'aide pour cela des enseignants sincères, des livres d'exégèse (Tafsir), des commentaires du Hadith, des livres de jurisprudence (Fiqh), de grammaire et de langue arabe dans laquelle le Noble Coran a été révélé. Ces livres sont, en effet, des moyens permettant de comprendre le Livre et la Sunna.</p>
<p>Il est donc de ton devoir, mon frère musulman — pour que ton œuvre soit correcte — d'apprendre ce qui rend ta religion droite : ta prière, ton jeûne, ton pèlerinage. Tu dois aussi apprendre les règles de la Zakat sur tes biens, ainsi que les règles relatives aux transactions dont tu as besoin, afin de prendre ce qu'Allah t'a autorisé et d'éviter ce qu'Il t'a interdit. Ainsi, ton gain sera licite, ta nourriture sera licite, et tu seras de ceux dont les invocations sont exaucées. Tout cela fait partie des choses dont tu as besoin d'apprendre, et c'est une chose facilitée par la grâce d'Allah tant que ta détermination est sincère et ton intention pure.</p>
<p>Applique-toi donc à lire les livres utiles, reste en contact avec les savants pour les questionner sur ce qui te pose problème et recevoir d'eux les règles de ta religion. De même, veille à assister aux séminaires et aux conférences religieuses organisés dans les mosquées ou ailleurs, écoute les programmes religieux à la radio, et lis les revues et bulletins religieux qui traitent des questions de religion. Si tu t'appliques et que tu suis ces sources de bien, tes connaissances s'accroîtront et ta clairvoyance s'illuminera.</p>
<p>N'oublie pas, mon frère, que la science croît et se purifie par l'action. Si tu mets en pratique ce que tu as appris, Allah t'ajoutera de la science ; comme le dit la sagesse transmise : « Celui qui agit selon ce qu'il sait, Allah lui fera hériter la science de ce qu'il ne savait pas. » La parole d'Allah le Très-Haut en témoigne :</p>
<p class="ar"><span dir="ltr">﴿</span> <strong><span dir="rtl">وَاتَّقُوا اللَّهَ وَيُعَلِّمُكُمُ اللَّهُ وَاللَّهُ بِكُلِّ شَيْءٍ عَلِيمٌ</span></strong> <span dir="rtl">﴾ [البقرة : ٢٨٢]</span></p>
<p>« <em><strong>Craignez Allah et Allah vous enseignera. Et Allah est Omniscient.</strong></em> » (Al-Baqara : 282)</p>
<p>La science est ce à quoi les moments doivent être consacrés en priorité, et c'est pour son obtention que les doués d'intelligence doivent rivaliser. C'est par elle que les cœurs s'animent et que les œuvres se purifient.</p>
<p>Certes, Allah — que Sa mention soit magnifiée et Ses noms sanctifiés — a fait l'éloge des savants qui mettent leur savoir en pratique, et Il a élevé leur rang dans Son Livre explicite :</p>
<p>Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="ltr">﴿</span> <strong><span dir="rtl">قُلْ هَلْ يَسْتَوِي الَّذِينَ يَعْلَمُونَ وَالَّذِينَ لَا يَعْلَمُونَ إِنَّمَا يَتَذَكَّرُ أُولُو الْأَلْبَابِ</span></strong> <span dir="rtl">﴾ [الزمر : ٩]</span></p>
<p>« <em><strong>Dis : "Sont-ils égaux, ceux qui savent et ceux qui ne savent pas ?" Seuls les doués d'intelligence réfléchissent.</strong></em> » (Az-Zumar : 9)</p>
<p>Et le Très-Haut a dit :</p>
<p class="ar"><span dir="ltr">﴿</span> <strong><span dir="rtl">يَرْفَعِ اللَّهُ الَّذِينَ آمَنُوا مِنْكُمْ وَالَّذِينَ أُوتُوا الْعِلْمَ دَرَجَاتٍ وَاللَّهُ بِمَا تَعْمَلُونَ خَبِيرٌ</span></strong> <span dir="rtl">﴾ [المجادلة : ١١]</span></p>
<p>« <em><strong>Allah élèvera en degrés ceux d'entre vous qui ont cru et ceux qui ont reçu la science. Allah est Parfaitement Connaisseur de ce que vous faites.</strong></em> » (Al-Mujadala : 11)</p>
<p>Allah a ainsi mis en évidence le mérite de ceux qui ont reçu la science liée à la foi, puis Il a informé qu'Il est parfaitement Connaisseur de ce que nous faisons et qu'Il l'observe, afin de nous montrer qu'il est indispensable d'allier la science et l'action, et que tout cela doit découler de la foi et de la conscience de l'observation d'Allah Subḥānahu.</p>
<p>En application du devoir d'entraide dans la piété et la dévotion, nous allons te présenter — par la force d'Allah — à travers ce livre, quelques informations issues de l'héritage jurisprudentiel (Fiqh) que nos savants ont déduit et consigné dans leurs ouvrages. Nous te présenterons ce qui en est facilité, afin que cela soit pour toi un moteur pour en tirer profit et accroître ta science utile.</p>
<p>Nous demandons à Allah de nous accorder, ainsi qu'à toi, la science utile et de nous aider à accomplir les œuvres pieuses. Nous demandons au Très-Haut de nous montrer la vérité comme étant la vérité et de nous accorder de la suivre, et de nous montrer le faux comme étant le faux et de nous accorder de nous en écarter. Il est certes Celui qui entend tout et qui exauce les prières.</p>
