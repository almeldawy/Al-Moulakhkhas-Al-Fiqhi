  <!-- ▼ CONTENU DU CHAPITRE ▼ -->

<p>Tu as appris de ce qui précède comment s'accomplissent les ablutions avec leurs conditions et leurs pratiques recommandées (sunan), telles que le Prophète <span dir="rtl">ﷺ</span> les a expliquées. Tu as donc maintenant besoin de connaître ce qui altère ces ablutions et les annule, afin que tu ne continues pas à rester dans un état d'ablution dont l'effet est devenu caduc, et que tu n'accomplisses pas ainsi une adoration qui ne serait pas valide de ta part.</p>
<p>⁕ Sache، ô musulman : que les ablutions possèdent des éléments corrupteurs dont la présence d'un seul d'entre eux annule tout effet de l'ablution. Il devient alors nécessaire de les recommencer à nouveau lorsque l'on souhaite entreprendre l'une des œuvres pour lesquelles l'ablution est légiférée. Ces éléments corrupteurs sont appelés "annulateurs" (nawaqid) ou "invalidants" (mubtilat), et le sens est le même.</p>
<p>Ces éléments corrupteurs, annulateurs ou invalidants, sont des choses que le Législateur (Allah) a déterminées. Ce sont des causes qui influent sur le retrait de l'ablution de son but initial. Elles sont soit des "événements" (ahdath) qui annulent l'ablution par eux-mêmes : comme l'urine، les excréments et tout ce qui sort par les deux voies naturelles؛ soit des "causes d'événements" (asbab al-ahdath) qui، lorsqu'elles surviennent، constituent une probabilité de survenue d'un événement annulateur. C'est le cas de la perte de conscience ou son altération par le sommeil, l'évanouissement ou la folie. En effet, celui qui a perdu conscience ne ressent pas ce qui peut émaner de lui, ainsi la probabilité (de l'événement) a été placée au même rang que l'événement lui-même.</p>
<p>Voici l'explication de cela en détail :</p>
<p><strong>1 - Ce qui sort par l'une des deux voies ;</strong> c'est-à-dire : par l'orifice de l'urine ou des selles. Ce qui sort par ces voies peut être soit : de l'urine, du sperme (<em>maniy</em>), du liquide prostatique (<em>madhy</em>), du sang lié aux métrorragies (<em>istihâdah</em>), des selles ou des gaz.</p>
<p>Si ce qui sort est de l'urine ou des selles , cela annule les ablutions selon les textes scripturaires et le consensus (<em>ijmâ'</em>). Allah le Très-Haut a dit, concernant les causes rendant les ablutions obligatoires : <strong>﴾ ... ou si l'un de vous revient des lieux d'aisance ﴿</strong> [Al-Mâ'idah : 6].</p>
<p>S'il s'agit de <strong>sperme (<em>maniy</em>)</strong> ou de <strong>liquide prostatique (<em>madhy</em>)</strong>, cela annule les ablutions selon les preuves fournies par les hadiths authentiques. Ibn al-Mundhir <a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a> et d'autres ont rapporté le consensus (<em>ijmâ'</em>) à ce sujet.</p>
<p>De même, l'écoulement du <strong>sang de l'istihâda</strong> (métrorragies) annule les ablutions. Il s'agit d'un sang dû à une pathologie (rupture d'un vaisseau) et non du sang des menstrues. Cela est fondé sur le hadith de Fatima bint Abi Houbaish : elle souffrait de métrorragies et le Prophète <span dir="rtl">ﷺ</span> lui dit :</p>
<p class="ar"><span dir="rtl">« فَتَوَضَّئِي وَصَلِّي ، فَإِنَّمَا هُوَ دَمُ عِرْقٍ »</span></p>
<p>« <em><strong>Fais tes ablutions et prie, car ce n'est qu'un vaisseau [qui saigne].</strong></em> » (Rapporté par Abou Daoud et Al-Daraqutni, qui a précisé : « <em>Tous les narrateurs de sa chaîne de transmission sont dignes de confiance</em> » <a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a> ).</p>
<p>De même, <strong>l'émission de gaz</strong> annule les ablutions, selon les preuves des hadiths authentiques et le consensus (<em>ijmâ'</em>). Le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="rtl">«لَا يَقْبَلُ اللهُ صَلَاةَ أَحَدِكُمْ إِذَا أَحْدَثَ حَتَّى يَتَوَضَّأَ»</span></p>
<p>« <em><strong>Allah n'accepte pas la prière de l'un d'entre vous s'il a eu un empêchement rituel (hadath) tant qu'il n'a pas refait ses ablutions</strong></em> » <a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a>.</p>
<p>Et il <span dir="rtl">ﷺ</span> a dit, concernant celui qui a un doute sur le fait d'avoir eu un gaz ou non :</p>
<p class="ar">«<span dir="rtl">لَا يَنْصَرِفْ حَتَّى يَسْمَعَ صَوْتاً أَوْ يَجِدَ رِيحا</span>ً»</p>
<p>« <em><strong>Qu'il ne quitte pas [sa prière] tant qu'il n'entend pas un bruit ou qu'il ne sent pas une odeur</strong></em> » <a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a>.</p>
<p>Quant à <strong>ce qui sort du corps par une autre voie que les deux orifices naturels</strong>, comme le sang, le vomissement ou le saignement de nez (<em>ru'âf</em>), cela fait l'objet d'une divergence entre les gens de science : est-ce que cela annule les ablutions ou non ?</p>
<p>Il existe deux avis à ce sujet, mais l'avis prépondérant (<em>ar-râjih</em>) est que <strong>cela n'annule pas les ablutions</strong>. Cependant, si la personne refait ses ablutions — afin de sortir de la divergence — cela serait préférable.</p>
<p><strong>2 - Parmi les causes d'annulation : la perte de la raison ou son altération (son obscurcissement).</strong> La <strong>perte de la raison</strong> survient par la folie ou ce qui s'y apparente. Son <strong>altération</strong> survient par le sommeil, l'évanouissement ou d'autres états similaires. Ainsi, quiconque perd sa raison ou voit sa conscience altérée par le sommeil ou autre, ses ablutions sont annulées.</p>
<p>La raison en est que ces états sont des moments propices à la survenue d'un empêchement rituel (<em>hadath</em>) sans que la personne ne s'en rende compte.</p>
<p><strong>Exception faite du sommeil léger</strong>, car celui-ci n'annule pas les ablutions ; en effet, les Compagnons (qu'Allah les agrée) étaient parfois pris de somnolence alors qu'ils attendaient la prière <a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a>. Seul le <strong>sommeil profond</strong> annule [les ablutions], ceci afin de concilier l'ensemble des preuves (textes).*</p>
<p><strong>3 - Parmi les causes d'annulation des ablutions : la consommation de viande de chameau</strong>, qu'elle soit en petite ou en grande quantité. Cela est dû à l'authenticité et à la clarté du hadith rapporté à ce sujet d'après le Messager d'Allah <span dir="rtl">ﷺ</span> <a href="#fn6" class="footnote-ref" id="fnref6" role="doc-noteref"><sup>6</sup></a>.</p>
<p>L'imam Ahmad (qu'Allah lui fasse miséricorde) a dit :« <em>Il existe deux hadiths authentiques à ce sujet provenant du Messager d'Allah <span dir="rtl">ﷺ</span>.</em> » <a href="#fn7" class="footnote-ref" id="fnref7" role="doc-noteref"><sup>7</sup></a></p>
<p>Quant à la consommation de <strong>viandes autres que celle du chameau</strong>, elle n'annule pas les ablutions.</p>
<p>⁕ <strong>Il existe des choses sur lesquelles les savants ont divergé ; annulent-elles les ablutions ou non ?</strong> Ce sont : le fait de toucher son sexe, toucher une femme avec désir, laver un mort, et l'apostasie (<em>riddah</em>) de l'Islam.</p>
<p>Parmi les savants, certains ont dit que chacun de ces éléments annule les ablutions, tandis que d'autres ont affirmé qu'ils ne les annulent pas. Cette question relève de l'examen approfondi (<em>nadhar</em>) et de l'effort de réflexion juridique (<em>ijtihâd</em>). Cependant, si la personne refait ses ablutions après avoir fait l'une de ces choses — afin de sortir de la divergence — cela serait préférable.</p>
<p>⁕ <strong>Enfin, il reste une question importante liée à ce sujet, à savoir : celui qui est certain d'être en état de pureté, puis qui doute de la survenue d'une cause l'annulant ; que doit-il faire ?</strong></p>
<p>Il a été établi d'après le Messager d'Allah <span dir="rtl">ﷺ</span>, dans le hadith rapporté par Muslim selon Abu Hurayra (qu'Allah l'agrée), que le Messager d'Allah <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="rtl">«إِذَا وَجَدَ أَحَدُكُمْ فِي بَطْنِهِ شَيْئاً، فَأَشْكَلَ عَلَيْهِ أَخَرَجَ مِنْهُ شَيْءٌ أَمْ لَا؛ فَلَا يَخْرُجْ مِنَ المَسْجِدِ، حَتَّى يَسْمَعَ صَوْتاً أَوْ يَجِدَ رِيحاً»</span></p>
<p>« <em><strong>Si l'un de vous ressent quelque chose dans son ventre et qu'il a un doute sur le fait que quelque chose en soit sorti ou non, qu'il ne quitte pas la mosquée tant qu'il n'entend pas un bruit ou qu'il ne sent pas une odeur.</strong></em> » <a href="#fn8" class="footnote-ref" id="fnref8" role="doc-noteref"><sup>8</sup></a></p>
<p>Ce noble hadith, ainsi que ceux ayant le même sens, prouvent que lorsque le musulman est certain d'être en état de pureté mais qu'il doute de son annulation, il reste [considéré comme étant] en état de pureté. En effet, la pureté est l'état d'origine (<em>al-asl</em>) et elle est certaine, alors que la survenue d'un élément annulateur est douteuse. Or, <strong>la certitude ne s'efface pas par le doute</strong>.</p>
<p>Il s'agit là d'une règle majeure et universelle s'appliquant à toute chose : elles demeurent selon leur état d'origine jusqu'à ce que le contraire soit prouvé avec certitude. Il en va de même pour l'inverse : si une personne est certaine d'être en état d'impureté (<em>hadath</em>) mais doute d'avoir fait ses ablutions, elle doit alors les faire. Car ici, l'état d'origine est la persistance de l'impureté, et celle-ci ne peut être levée par un simple doute.</p>
<p>Mon frère musulman, tu te dois de préserver ta pureté pour la prière et d'y accorder une grande importance, car aucune prière n'est valide sans purification. De même, tu dois te méfier des insufflations obsessionnelles (<em>waswas</em>) et de l'emprise du Diable sur toi, lorsqu'il te fait imaginer que ta pureté est annulée pour semer la confusion en toi. Cherche alors refuge auprès d'Allah contre son mal, ne prête aucune attention à ses insufflations, et interroge les gens de science sur ce qui te semble confus concernant la pureté, afin d'agir avec clairvoyance. Veille également à la propreté de tes vêtements vis-à-vis des impuretés (<em>najasah</em>), afin que ta prière soit valide et ton adoration droite. Certes, Allah <span dir="rtl">ﷻ</span> a dit :</p>
<p class="ar"><span dir="rtl">﴿يُحِبُّ التَّوَّابِينَ وَيُحِبُّ الْمُتَطَهِّرِينَ﴾ [البقرة : ٢٢٢]</span></p>
<p><strong>﴾ Allah aime ceux qui se repentent et Il aime ceux qui se purifient ﴿</strong> [Al-Baqarah : 222].</p>
<p>Qu'Allah nous accorde à tous la réussite dans la science utile et les bonnes œuvres.</p>
