<p>Sache, qu'Allah nous accorde le succès ainsi qu'à toi et à l'ensemble des musulmans, que notre religion est parfaite et complète. Elle n'a rien laissé de ce dont les gens ont besoin dans leur religion et leur vie d'ici-bas sans l'avoir clarifié. Parmi cela figurent les règles de bienséance liées à l'accomplissement des besoins naturels, afin que l'être humain, qu'Allah a honoré, se distingue de l'animal par ce dont Allah l'a honoré. Notre religion est certes une religion de propreté et de pureté. Il existe donc des règles de bienséance législatives à appliquer lors de l'entrée aux toilettes et pendant que l'on satisfait ses besoins.</p>
<p>Ainsi, lorsque le musulman souhaite entrer au « Khalâ » — qui est l'endroit préparé pour satisfaire ses besoins — il lui est recommandé de dire :</p>
<p class="ar"><strong><span dir="rtl">بِاسْمِ اللهِ، أَعُوذُ بِاللهِ مِنَ الخُبُثِ وَالخَبَائِثِ</span></strong></p>
<p>« <em><strong>Au nom d'Allah, je cherche protection auprès d'Allah contre les démons mâles et femelles.</strong></em> » <a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a></p>
<p>Il doit avancer le pied gauche au moment d'entrer.</p>
<p>En sortant, il avance le pied droit <a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a> et dit :</p>
<p class="ar"><strong><span dir="rtl">غُفْرَانَكَ، الحَمْدُ للهِ الذِي أَذْهَبَ عَنِّي الأَذَى وَعَافَانِي</span></strong></p>
<p>«<em><strong>J'implore Ton pardon. Louange à Allah qui a éloigné de moi le mal et m'a préservé.</strong></em>» <a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a></p>
<p>Ceci est dû au fait que la main (<em>ou le côté</em>) droite est utilisée pour ce qui relève de l'honneur et de l'embellissement, tandis que la gauche est utilisée pour ce qui concerne l'élimination des impuretés et autres choses similaires.</p>
<p>Et s'il souhaite satisfaire ses besoins dans un espace ouvert — c'est-à-dire dans un endroit qui n'est pas spécifiquement aménagé à cet effet — il lui est alors recommandé de s'éloigner des gens, de sorte qu'il se trouve dans un lieu isolé, et de se dissimuler des regards derrière un mur, un arbre ou tout autre écran similaire.</p>
<p>Il est interdit de faire face à la Qibla (<em>la direction de la Kaaba</em>) ou de lui tourner le dos au moment de satisfaire ses besoins ; il doit plutôt s'en détourner (<em>s'orienter ailleurs</em>). En effet, le Prophète <span dir="rtl">ﷺ</span> a interdit de faire face à la Qibla ou de lui tourner le dos lors de l'accomplissement des besoins naturels. <a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a>(4)</p>
<p>Il doit également prendre garde aux éclaboussures d'urine, afin qu'elles ne touchent ni son corps ni ses vêtements. Pour cela, il doit choisir un endroit au sol meuble pour uriner, afin que rien ne rejaillisse sur lui.</p>
<p>Il ne lui est pas permis de toucher ses parties intimes avec sa main droite. De même, il ne lui est pas permis de satisfaire ses besoins sur le chemin des gens, ni dans les endroits où ils cherchent de l'ombre, ni près de leurs points d'eau (sources), car le Prophète <span dir="rtl">ﷺ</span> l'a interdit <a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a>(5). Cela est dû au tort et à la nuisance que cela cause aux gens.</p>
<p>Il ne doit pas entrer dans les lieux d'aisance avec un objet mentionnant le nom d'Allah <span dir="rtl">ﷻ</span> ou contenant du Coran. Toutefois, s'il craint de perdre ou de se faire voler cet objet, il lui est permis d'entrer avec, à condition de le couvrir (ou de le dissimuler).</p>
<p>Il ne convient pas non plus de parler pendant que l'on satisfait ses besoins, car il est rapporté dans le Hadith qu'Allah déteste cela <a href="#fn6" class="footnote-ref" id="fnref6" role="doc-noteref"><sup>6</sup></a>(6). Enfin, il lui est strictement interdit de lire le Coran dans cette situation.</p>
<p>Une fois qu'il a fini de satisfaire ses besoins, il doit nettoyer l'orifice par l'<strong>Istinjâ'</strong> (<em>lavage avec de l'eau</em>) ou par l'<strong>Istijmâr</strong> (<em>essuyage avec des pierres ou ce qui en tient lieu, comme du papier</em>). S'il combine les deux méthodes, c'est encore mieux ; mais s'il se contente de l'une d'entre elles, cela suffit.</p>
<p>L'Istijmâr se fait avec des pierres ou ce qui en tient lieu, comme du papier rugueux, des morceaux de tissu ou tout autre support similaire capable de purifier et de sécher l'orifice. Il est exigé d'effectuer au moins trois passages (essuyages) purificateurs, ou plus si l'on souhaite augmenter ce nombre.</p>
<p>Par ailleurs, il n'est pas permis de pratiquer l'Istijmâr avec des os ou du crottin (excréments d'animaux) ; car le Prophète <span dir="rtl">ﷺ</span> a interdit cela <a href="#fn7" class="footnote-ref" id="fnref7" role="doc-noteref"><sup>7</sup></a>(7). Il lui incombe d'éliminer toute trace d'excrétion et de sécher [la zone], afin qu'aucune trace d'impureté (Najâsa) ne subsiste sur son corps, et pour éviter que l'impureté ne se propage à une autre partie de son corps ou à ses vêtements.</p>
<p>Certains juristes (Fouqahâ) ont dit : Certes, l'Istinjâ' ou l'Istijmâr est une condition de validité des ablutions (Woudou'). Il doit impérativement les précéder. Ainsi, si quelqu'un fait ses ablutions avant de se nettoyer, ses ablutions ne sont pas valides, conformément au Hadith de Al-Miqdâd, faisant l'objet d'un consensus :</p>
<p class="ar"><strong><span dir="rtl">يَغْسِلُ ذَكَرَهُ، وَيَتَوَضَّأُ</span></strong></p>
<p>"<em><strong>Qu'il lave son sexe, puis qu'il fasse ses ablutions.</strong></em>" » <a href="#fn8" class="footnote-ref" id="fnref8" role="doc-noteref"><sup>8</sup></a>(8)</p>
<p>L'Imam Al-Nawawî a dit : « <em>La tradition (Sunna) est de pratiquer l'Istinjâ' avant les ablutions, afin de sortir de la divergence [entre les savants] et d'être certain de ne pas rompre sa pureté.</em> »<a href="#fn9" class="footnote-ref" id="fnref9" role="doc-noteref"><sup>9</sup></a>(9)</p>
<p>Ô musulman, veille scrupuleusement à te préserver de toute souillure d'urine ; car le manque de précaution à cet égard est l'une des causes du châtiment de la tombe. D'après Abou Hourayra (qu'Allah l'agrée), le Messager d'Allah <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><strong><span dir="rtl">اسْتَنْزِهُوا مِنَ البَوْلِ؛ فَإِنَّ عَامَّةَ عَذَابِ القَبْرِ مِنْهُ</span></strong></p>
<p>« <em><strong>Préservez-vous de l'urine, car la majeure partie du châtiment de la tombe en provient.</strong></em> » <a href="#fn10" class="footnote-ref" id="fnref10" role="doc-noteref"><sup>10</sup></a>(10)(Rapporté par Al-Daraqoutni.</p>
<p>Al-Hafidh a dit : « <em>Sa chaîne de transmission est authentique, il possède des preuves concordantes et son origine se trouve dans les deux recueils authentiques [Boukhari et Muslim]</em> »).</p>
<p>Ô musulman : la perfection de la purification facilite l'accomplissement de l'adoration, aide à la parachever, à la rendre complète et à en observer les prescriptions.</p>
<p>L'Imam Ahmad (qu'Allah lui fasse miséricorde) a rapporté d'après l'un des compagnons du Prophète <span dir="rtl">ﷺ</span> que le Messager d'Allah <span dir="rtl">ﷺ</span> a dirigé pour eux la prière du matin (<strong>as-Soubh</strong>). Il y récité la sourate <em>Al-Roum</em> (Les Romains), mais il fut troublé dans sa récitation. Lorsqu'il eut terminé la prière, il dit :</p>
<p class="ar"><strong><span dir="rtl">إِنَّهُ يُلَبَّسُ عَلَيْنَا القُرْآنَ، أَنَّ أَقْواماً مِنْكُمْ يُصَلُّونَ مَعَنَا لَا يُحْسِنُونَ الوُضُوءَ، فَمَنْ شَهِدَ الصَّلَاةَ مَعَنَا؛ فَلْيُحْسِنِ الوُضُوءَ</span></strong></p>
<blockquote>
<p><strong>« <em>Ce qui brouille notre récitation du Coran, c'est que certains d'entre vous prient avec nous sans accomplir leurs ablutions de manière parfaite. Que celui qui assiste à la prière avec nous accomplisse donc ses ablutions avec soin.</em> »</strong> <a href="#fn11" class="footnote-ref" id="fnref11" role="doc-noteref"><sup>11</sup></a><strong>(11)</strong></p>
</blockquote>
<p>Allah a fait l'éloge des gens de la mosquée de Qouba' en disant :</p>
<p class="ar"><strong><span dir="rtl">﴿فِيهِ رِجَالٌ يُحِبُّونَ أَنْ يَتَطَهَّرُوا وَاللَّهُ يُحِبُّ الْمُطَّهِّرِينَ﴾</span></strong> <span dir="rtl">[التوبة: ١٠٨]</span></p>
<blockquote>
<p>« <em><strong>On y trouve des gens qui aiment se purifier, et Allah aime ceux qui se purifient.</strong></em> » (Sourate At-Tawbah : 108).</p>
</blockquote>
<p>Lorsqu'ils furent interrogés sur la nature de cette purification, ils répondirent : « <em><strong>Nous faisons suivre les pierres par l'eau (nous utilisons les deux successivement)</strong></em> ». (Rapporté par Al-Bazzar).<a href="#fn12" class="footnote-ref" id="fnref12" role="doc-noteref"><sup>12</sup></a>(12)</p>
<p>Il y a ici un point important à souligner : certains parmi le commun des gens pensent que l'Istinjâ' (le lavage des parties intimes) fait partie intégrante des actes de l'ablution (Woudou'). Ainsi, lorsqu'ils veulent faire leurs ablutions, ils commencent par l'Istinjâ', même s'ils l'avaient déjà fait précédemment après avoir satisfait leurs besoins.</p>
<p>Ceci est une erreur. En effet, l'Istinjâ' ne fait pas partie des gestes du Woudou' lui-même ; c'est une condition préalable (<em><strong>en cas de présence d'impureté</strong></em>), comme mentionné plus haut. Sa place se situe immédiatement après avoir fini de satisfaire ses besoins. Il n'y a donc aucune nécessité de le répéter s'il n'y a pas de cause le justifiant (<em><strong>à savoir : avoir de nouveau satisfait ses besoins ou avoir l'orifice souillé par une impureté</strong></em>).</p>
<p>Ô musulman, telle est notre religion : une religion de pureté, de propreté et d'intégrité. Elle a apporté les meilleures règles de bienséance et les mœurs les plus nobles. Elle englobe tout ce dont le musulman a besoin et tout ce qui lui est bénéfique, sans rien négliger de ce qui est dans notre intérêt. À Allah seul appartiennent la louange et la grâce.</p>
<p>Nous Lui demandons la fermeté dans cette religion, la clairvoyance dans la compréhension de ses jugements et la mise en pratique de ses lois, avec une sincérité exclusive envers Allah, afin que nos œuvres soient justes et acceptées.</p>
