<p>Allah le Très-Haut dit :</p>
<p class="ar"><span dir="ltr">﴿</span><strong><span dir="rtl">يَا أَيُّهَا الَّذِينَ آمَنُوا إِذَا قُمْتُمْ إِلَى الصَّلَاةِ فَاغْسِلُوا وُجُوهَكُمْ وَأَيْدِيَكُمْ إِلَى الْمَرَافِقِ وَامْسَحُوا بِرُءُوسِكُمْ وَأَرْجُلَكُمْ إِلَى الْكَعْبَيْنِ...</span></strong><span dir="rtl">﴾ الآيَة: [المائدة: 6]</span></p>
<p>« <em><strong>Ô vous qui croyez ! Lorsque vous vous levez pour la prière, lavez vos visages et vos mains jusqu'aux coudes ; passez les mains mouillées sur vos têtes ; et lavez-vous les pieds jusqu'aux chevilles...</strong></em> » [Al-Ma'idah : 6].</p>
<p>Ce noble verset a rendu l'ablution obligatoire pour la prière. Il a clarifié les membres qu'il est impératif de laver ou d'essuyer lors de l'ablution, et en a délimité les zones.</p>
<p>Ensuite, le Prophète <span dir="rtl">ﷺ</span> a expliqué la description [complète] de l'ablution par ses paroles et ses actes d'une manière tout à fait suffisante.</p>
<p>Sache, ô musulman, que l'ablution comporte des conditions (shurūt), des obligations (furūd) et des pratiques prophétiques (sunan) :</p>
<p><strong>Les conditions et les obligations :</strong> Elles sont indispensables, dans la mesure du possible, pour que l'ablution soit valide.</p>
<p><strong>Les Sunan (traditions) :</strong> Elles sont les compléments de l'ablution ; elles apportent un surplus de récompense, mais leur délaissement n'empêche pas la validité de l'ablution.</p>
<p><strong>Les conditions sont au nombre de huit, à savoir :</strong></p>
<p><strong>- L'Islam, la raison, le discernement et l'intention :</strong> ainsi, l'ablution n'est pas valide de la part d'un mécréant, ni d'un fou, ni d'un enfant n'ayant pas atteint l'âge de discernement. Elle n'est pas valide non plus de la part de celui qui n'a pas formulé l'intention de faire ses ablutions ; par exemple, s'il a eu l'intention de se rafraîchir, ou s'il a lavé ses membres pour en retirer une impureté (<em>najāsa</em>) ou de la saleté.</p>
<p><strong>- Il est également requis pour l'ablution que l'eau soit pure et purifiante (<em>tahūr</em>)</strong> comme mentionné précédemment. Si elle est impure (<em>najis</em>), elle ne suffit pas. Il est aussi requis que <strong>l'eau soit licite (<em>mubāh</em>)</strong> ; si elle a été usurpée ou obtenue par une voie non conforme à la législation religieuse, l'ablution faite avec cette eau n'est pas valide.</p>
<p>De même, il est requis pour l'ablution qu'elle soit précédée de l'Istinjâ' <em>(nettoyage à l'eau</em>) ou de l'Istijmâr (<em>nettoyage avec des pierres ou équivalent</em>), conformément aux détails mentionnés précédemment.</p>
<p><strong>-</strong> Il est également requis pour l'ablution de retirer tout ce qui empêche l'eau d'atteindre la peau. Il est donc impératif que celui qui fait ses ablutions enlève, sur les membres concernés, toute trace de boue, de pâte, de cire, de saleté accumulée ou de teintures (peintures/vernis) épaisses ; afin que l'eau coule directement sur la peau du membre sans aucun obstacle.</p>
<p><strong>Quant aux obligations (<em>furūd</em>) de l'ablution — qui correspondent à ses membres [à laver] — elles sont au nombre de six :</strong></p>
<p><strong>La première : Le lavage intégral du visage.</strong> En font partie le <strong>rinçage de la bouche</strong> (<em>Al-Madmadah</em>) et l'<strong>aspiration de l'eau par le nez</strong> (<em>Al-Istinshāq</em>). Ainsi, celui qui lave son visage mais délaisse le rinçage de la bouche et l'aspiration nasale, ou l'un des deux, son ablution n'est pas valide. Car la bouche et le nez font partie du visage, et Allah le Très-Haut dit : <strong>« <em>...lavez vos visages</em> »</strong>. Il a donc ordonné de laver le visage en entier ; or, quiconque en délaisse une partie n'a pas obéi à l'ordre d'Allah le Très-Haut. De plus, le Prophète <span dir="rtl">ﷺ</span> a [systématiquement] rincé sa bouche et aspiré l'eau par son nez.</p>
<p><strong>La deuxième : Le lavage des mains (et bras) avec les coudes.</strong> En raison de la parole d'Allah le Très-Haut : <strong>« ...et vos mains jusqu'aux coudes »</strong>, c'est-à-dire : incluant les coudes. Car le Prophète <span dir="rtl">ﷺ</span> faisait couler l'eau sur ses deux coudes <a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a>, et dans un autre hadith : « <em><strong>Il lava ses mains jusqu'à entamer le haut du bras</strong></em> »<a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a>, ce qui prouve l'inclusion des coudes dans la zone à laver.</p>
<p><strong>La troisième : L'essuyage de la tête entière, dont font partie les oreilles.</strong> En raison de la parole d'Allah le Très-Haut : <strong>« ...et passez les mains mouillées sur vos têtes »</strong>. Et le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><strong><span dir="rtl">« الأُذْنَانِ مِنَ الرَّأْسِ »</span></strong> </p>
<p>« <em><strong>Les deux oreilles font partie de la tête</strong></em> » (rapporté par Ibn Majah, Al-Daraqutni et d'autres)<a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a>.</p>
<p>Par conséquent, il ne suffit pas d'essuyer seulement une partie de la tête.</p>
<p><strong>La quatrième : Le lavage des pieds avec les chevilles.</strong> En raison de la parole d'Allah le Très-Haut : <strong>« <em>...et vos pieds jusqu'aux chevilles</em> »</strong>. Ici, la préposition "<em><strong>jusqu'à</strong></em>" (<em>ila</em>) signifie "<em><strong>avec</strong></em>" (<em>ma'a</em>), et cela conformément aux hadiths décrivant la manière de faire l'ablution, car ils prouvent l'inclusion des chevilles dans la zone à laver.</p>
<p><strong>La cinquième : L'ordre chronologique (<em>At-Tartīb</em>).</strong> Cela consiste à laver d'abord le visage, puis les mains (et bras), puis à essuyer la tête, et enfin à laver les pieds. Ceci en raison de la parole d'Allah le Très-Haut : <strong>« <em>Ô vous qui croyez ! Lorsque vous vous levez pour la prière, lavez vos visages et vos mains jusqu'aux coudes ; passez les mains mouillées sur vos têtes ; et lavez-vous les pieds jusqu'aux chevilles</em> »</strong> [Al-Mā'idah : 6]. Le Prophète <span dir="rtl">ﷺ</span> a ordonné l'ablution selon cette modalité et a dit :</p>
<p class="ar"><strong><span dir="rtl">«هَذَا وُضُوءٌ لَا يَقْبَلُ اللهُ الصَّلَاةَ إِلَّا بِهِ»</span></strong></p>
<p>« <em><strong>Voici une ablution sans laquelle Allah n'accepte pas la prière</strong></em> » (rapporté par Abou Daoud et d'autres).<a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a></p>
<p><strong>La sixième : La succession immédiate (<em>Al-Muwālāh</em>).</strong> Il s'agit de laver les membres susmentionnés de manière consécutive, de sorte qu'il n'y ait pas d'interruption prolongée entre le lavage d'un membre et celui qui le précède. Au contraire, on doit enchaîner le lavage des membres l'un après l'autre dans la mesure du possible.</p>
<p><strong>Ce sont là les obligations de l'ablution qui y sont indispensables, conformément à ce qu'Allah a mentionné dans Son Livre.</strong></p>
<p>Les savants ont divergé concernant le statut de la Tasmiyah (dire "Bismillah") au début de l'ablution : est-elle obligatoire (Wājibah) ou recommandée (Sunnah) ? Elle est, chez tous, considérée comme légiférée, et il convient de ne pas la délaisser. Sa formulation consiste à dire : «<em><strong>Bismillāh</strong></em> » ( Au nom d'Allah ) ; et s'il ajoute : « <em><strong>Ar-Rahmāni Ar-Rahīm</strong></em> » (le Tout-Miséricordieux, le Très-Miséricordieux), il n'y a pas de mal à cela.</p>
<p>La sagesse — et Allah est plus Savant — dans le fait d'avoir réservé l'ablution à ces quatre membres [visage, mains, tête, pieds] réside dans le fait qu'ils sont les parties du corps les plus promptes à s'activer pour commettre des péchés. Ainsi, la purification de leur aspect extérieur est un rappel pour la purification de leur aspect intérieur. Le Prophète <span dir="rtl">ﷺ</span> a certes informé que chaque fois que le musulman lave l'un de ces membres, chaque péché commis par ce membre <strong>s'efface, et que ses fautes sortent avec l'eau ou avec la dernière goutte d'eau.</strong><a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a></p>
<p>Ensuite, après le lavage de ces membres, le Prophète <span dir="rtl">ﷺ</span> a orienté vers le fait de renouveler la foi par les deux témoignages: l'attestation de foi <a href="#fn6" class="footnote-ref" id="fnref6" role="doc-noteref"><sup>6</sup></a><span dir="rtl"></span>؛ ceci est une indication sur l'importance de réunir les deux purifications : la purification physique et la purification spirituelle.</p>
<p>Ainsi, la [purification] physique s'accomplit par l'eau selon la description qu'Allah a détaillée dans Son Livre, à travers le lavage de ces membres ; tandis que la [purification] spirituelle s'accomplit par les deux témoignages [la profession de foi] qui purifient du polythéisme (shirk). »</p>
<p>Allah le Très-Haut a certes dit à la fin du verset de l'ablution :</p>
<p class="ar"><span dir="ltr">﴿</span><strong><span dir="rtl">مَا يُرِيدُ اللهُ لِيَجْعَلَ عَلَيْكُمْ مِّنْ حَرَجٍ وَلَكِن يُرِيدُ لِيُطَهِّرَكُمْ وَلِيُتِمَّ نِعْمَتَهُ عَلَيْكُمْ لَعَلَّكُمْ تَشْكُرُونَ</span></strong><span dir="rtl">﴾ [المائدة: ٦].</span></p>
<p>"<em><strong>Allah ne veut pas vous imposer de gêne, mais Il veut vous purifier et parfaire Son bienfait sur vous afin que vous soyez reconnaissants.</strong></em>" [Al-Mā'idah : 6].</p>
<p>C'est ainsi — ô musulman — qu'Allah a institué pour toi l'ablution ; afin de te purifier par elle de tes péchés et de parfaire par elle Son bienfait sur toi. »</p>
<p>Médite également sur l'ouverture du verset de l'ablution par ce noble appel : "<em><strong>Ô vous qui croyez !</strong></em>" ; car [Allah] Gloire à Lui a adressé Son discours à ceux qui se caractérisent par la foi. En effet, c'est le croyant qui prête l'oreille aux commandements d'Allah et en tire profit. C'est pour cette raison que le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="ltr">«</span><strong><span dir="rtl">وَلَا يُحَافِظُ عَلَى الوُضُوءِ إِلَّا مُؤْمِنٌ</span></strong><span dir="ltr">»</span></p>
<p>"<em><strong>Et nul ne préserve [constamment] son ablution si ce n'est un croyant</strong></em>"<a href="#fn7" class="footnote-ref" id="fnref7" role="doc-noteref"><sup>7</sup></a>.</p>
<p>Tout ce qui s'ajoute à ce qui a été mentionné dans la description de l'ablution est considéré comme recommandé (Mustahabb) : celui qui le fait obtient un surplus de récompense, et celui qui le délaisse ne commet aucun péché. C'est pour cela que les juristes ont nommé ces actes : les Sunan (traditions) de l'ablution, c'est-à-dire ses actes recommandés.</p>
<p>Les Sunan de l'ablution sont : »</p>
<p><strong>Premièrement :</strong> Le Siwak (le bâtonnet de brossage). Son mérite ainsi que sa modalité ont déjà été expliqués précédemment. Son moment [durant l'ablution] se situe lors du rinçage de la bouche (Al-Madmadah), afin d'obtenir, par lui et par le rinçage, le nettoyage de la bouche en vue de se présenter à l'adoration et de se préparer à la récitation du Coran ainsi qu'à l'entretien privé avec Allah <span dir="rtl">ﷻ</span>.</p>
<p><strong>Deuxièmement :</strong> Le lavage des deux mains (jusqu'aux poignets) trois fois au début de l'ablution, avant le lavage du visage. Cela est dû aux hadiths rapportés à ce sujet, et parce que les mains sont l'instrument de transfert de l'eau vers les autres membres ; ainsi, leur lavage constitue une précaution pour l'ensemble de l'ablution.</p>
<p><strong>Troisièmement :</strong> Commencer par le rinçage de la bouche (Al-Madmadah) et l'aspiration de l'eau par le nez (Al-Istinshâq) avant de laver le visage ، car il est rapporté dans les Hadiths que l'on commence par ces deux actes. Il convient d'y insister (exagérer le geste) si l'on ne jeûne pas. Le sens de l'insistance pour le rinçage de la bouche est de faire circuler l'eau dans l'ensemble de la bouche , et pour l'aspiration par le nez , cela consiste à aspirer l'eau jusqu'au fond du nez.</p>
<p><strong>Quatrièmement</strong> : Parmi les Sunan des ablutions , il y a le fait de passer les doigts à travers la barbe épaisse avec de l'eau jusqu'à ce qu'elle atteigne l'intérieur , ainsi que de passer les doigts entre les orteils et les doigts des mains.</p>
<p><strong>Cinquièmement :</strong> Commencer par la droite (At-Tayâmun) , c'est-à-dire débuter par la main droite et le pied droit avant la main gauche et le pied gauche.</p>
<p><strong>Sixièmement :</strong> Augmenter le nombre de lavages au-delà d'une fois , jusqu'à trois lavages , pour le visage , les mains et les pieds.</p>
<p>Ce sont là les conditions, les obligations et les actes recommandés (sunnan) des ablutions. Il convient que tu les apprennes et que tu veilles à les appliquer lors de chaque ablution, afin que ton ablution soit conforme à la description prescrite par la religion, et pour que tu puisses obtenir la récompense.</p>
<p>Nous demandons à Allah pour nous et pour toi un surplus de science utile et d'œuvres pieuses.</p>
