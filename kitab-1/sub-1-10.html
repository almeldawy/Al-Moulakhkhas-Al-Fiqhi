<p>Certes, notre religion est une religion de facilité et non une religion de difficulté ou de gêne. Elle établit pour chaque situation les règles qui lui conviennent, afin de réaliser l'intérêt (du fidèle) et d'écarter la pénibilité. Parmi cela, ce qu'Allah a légiféré lors des ablutions lorsqu'un obstacle recouvre l'un des membres du musulman, dont le retrait serait difficile ou dont le maintien est nécessaire : soit pour la protection des pieds comme les chaussons (Khuffayn) ou ce qui y ressemble, soit pour la protection de la tête comme le turban ('Imâmah), soit pour la protection d'une blessure comme le plâtre (Jabîrah) ou autre. Le Législateur a ainsi accordé une dérogation (Rukhsah) à celui qui fait ses ablutions pour qu'il essuie sur ces obstacles, se contentant de cela au lieu de les retirer et de laver ce qu'il y a en dessous ، par allégement de la part d'Allah envers Ses serviteurs et afin de dissiper toute gêne pour eux.</p>
<p>Quant à l'essuyage sur les chaussons ou ce qui en tient lieu comme les chaussettes (Jawrabayn), et le fait de s'en contenter au lieu de laver les pieds ، cela est confirmé par des hadiths authentiques, abondants et notoires (Mutawâtir) relatant l'essuyage pratiqué par le Prophète <span dir="rtl">ﷺ</span> en étant résident ou en voyage, ainsi que son ordre et sa dérogation à ce sujet.</p>
<p>Al-Hasan (Al-Basrî) a dit :</p>
<p class="ar"><span dir="rtl">حَدَّثَنِي سَبْعُونَ مِنْ أَصْحَابِ رَسُولِ اللهِ ﷺ أَنَّهُ مَسَحَ عَلَى الْخُفَّيْنِ</span></p>
<p>"<em><strong>Soixante-dix parmi les compagnons du Messager d'Allah <span dir="rtl">ﷺ</span> m'ont rapporté qu'il a essuyé sur les chaussons.</strong></em>" <a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a></p>
<p>L'Imam An-Nawawî a dit :</p>
<p class="ar"><span dir="rtl">رَوَى المَسْحَ عَلَى الخُفَّيْنِ خَلَائِقُ لَا يُحْصَوْنَ مِنَ الصَّحَابَةِ</span></p>
<p></p>
<p>"<em><strong>L'essuyage sur les chaussons a été rapporté par une multitude innombrable de Compagnons.</strong></em>"<a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a></p>
<p>L'Imam Ahmad a dit :</p>
<p class="ar"><span dir="rtl">لَيْسَ فِي نَفْسِي شَيْءٌ مِنَ المَسْحِ ، فِيهِ أَرْبَعُونَ حَدِيثًا عَنْ رَسُولِ اللهِ ﷺ وَأَصْحَابِهِ</span></p>
<p>"<em><strong>Je n'ai aucun doute (aucune hésitation) concernant l'essuyage ; il existe à ce sujet quarante hadiths provenant du Messager d'Allah <span dir="rtl">ﷺ</span> et de ses Compagnons.</strong></em>"<a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a></p>
<p>Et Ibn al-Mubârak ainsi que d'autres ont dit :</p>
<p class="ar"><span dir="rtl">«لَيْسَ فِي الْمَسْحِ عَلَى الْخُفَّيْنِ بَيْنَ الصَّحَابَةِ اخْتِلَافٌ ، هُوَ جَائِزٌ»</span></p>
<p>"<em><strong>Il n'y a aucune divergence entre les Compagnons concernant l'essuyage sur les chaussons ; c'est une pratique autorisée.</strong></em>" <a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a></p>
<p>Ibn al-Mundhir <a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a> et d'autres ont rapporté le consensus (Ijmâ') des savants sur sa permission. Les Gens de la Sunna et du Consensus (Ahl al-Sunnah wal-Jamâ'ah) sont unanimes à ce sujet, contrairement aux innovateurs qui ne considèrent pas cela comme permis.</p>
<p><strong>⁕ Le statut de l'essuyage sur les chaussons :</strong> C'est une dérogation (Rukhsah). Le faire est préférable au fait de retirer les chaussons pour se laver les pieds, afin de saisir la dérogation d'Allah, de suivre l'exemple du Prophète <span dir="rtl">ﷺ</span> et de se distinguer des innovateurs. L'essuyage lève l'état d'impureté rituelle pour ce qui se trouve sous la surface essuyée. Le Prophète <span dir="rtl">ﷺ</span> ne s'imposait pas une contrainte contraire à l'état dans lequel se trouvaient ses pieds : s'ils étaient dans des chaussons, il essuyait dessus ; s'ils étaient nus, il les lavait. <strong>Il n'est donc pas prescrit de mettre des chaussons dans le seul but de pouvoir essuyer dessus</strong>.</p>
<p><strong>⁕ La durée de l'essuyage sur les chaussons :</strong></p>
<ul>
<li><blockquote>
<p><strong>Pour le résident</strong> (et celui dont le voyage ne permet pas de raccourcir les prières) : <strong>un jour et une nuit</strong> (24 heures).</p>
</blockquote></li>
<li><blockquote>
<p><strong>Pour le voyageur</strong> (dont le voyage permet de raccourcir les prières) : <strong>trois jours et trois nuits</strong> (72 heures).</p>
</blockquote></li>
</ul>
<p>Cela s'appuie sur ce qu'a rapporté Muslim : le Prophète <span dir="rtl">ﷺ</span> a fixé pour le voyageur trois jours et leurs nuits, et pour le résident un jour et une nuit. » <a href="#fn6" class="footnote-ref" id="fnref6" role="doc-noteref"><sup>6</sup></a></p>
<p>Le début de la durée, dans les deux cas (résident ou voyageur), commence à partir de <strong>la perte de l'état de pureté (Al-Hadath)</strong> après avoir mis les chaussons. En effet, c'est cette perte de pureté qui rend l'ablution obligatoire, et c'est à ce moment que la permission d'essuyer débute. Par conséquent, le décompte commence dès l'instant où l'essuyage devient permis.</p>
<p>Cependant, certains savants sont d'avis que le début de la durée commence à partir du <strong>premier essuyage effectif</strong> réalisé après avoir perdu sa pureté.</p>
<h3 id="les-conditions-de-lessuyage-sur-les-chaussons-et-ce-qui-y-ressemble"><strong>Les conditions de l'essuyage sur les chaussons et ce qui y ressemble :</strong></h3>
<p><strong>1 -</strong> Il est exigé, pour l'essuyage sur les chaussons (ou ce qui en tient lieu comme les chaussettes), que la personne soit <strong>en état de pureté rituelle</strong> (avoir le Wudu) au moment où elle les enfile.</p>
<p>Ceci s'appuie sur ce qui est rapporté dans les deux recueils authentiques (<em>Al-Bukhari</em> et <em>Muslim</em>) : le Prophète <span dir="rtl">ﷺ</span> a dit à un compagnon qui s'apprêtait à lui retirer ses chaussons pendant qu'il faisait ses ablutions :</p>
<p class="ar"><span dir="rtl">«دَعْهُمَا ؛ فَإِنِّي أَدْخَلْتُهُمَا طَاهِرَتَيْنِ»</span></p>
<p><em><strong>« Laisse-les, car je les ai enfilés alors que mes pieds étaient en état de pureté. »</strong></em> <a href="#fn7" class="footnote-ref" id="fnref7" role="doc-noteref"><sup>7</sup></a></p>
<p>Il y a aussi le hadith :</p>
<p class="ar"><span dir="rtl">«أُمِرْنَا أَن نَمْسَحَ عَلَى الْخُفَّيْنِ إِذَا نَحْنُ أَدْخَلْنَاهُمَا عَلَى طُهْرٍ»</span></p>
<p><strong>« Il nous a été ordonné d'essuyer sur les chaussons si nous les avons enfilés en étant en état de pureté. »</strong> <a href="#fn8" class="footnote-ref" id="fnref8" role="doc-noteref"><sup>8</sup></a></p>
<p>Ces preuves indiquent clairement que la pureté est une condition préalable au moment de mettre les chaussons. Si quelqu'un les enfile alors qu'il n'a pas ses ablutions (en état de <em>Hadath</em>), il ne lui est pas permis d'essuyer dessus par la suite.</p>
<p><strong>2 -</strong> Il est également exigé que le chausson (ou ce qui y ressemble) soit <strong>licite (mubâh)</strong>. S'il a été usurpé (volé) ou s'il est en soie (pour un homme), il n'est pas permis d'essuyer dessus. En effet, une interdiction (quelque chose de Haram) ne peut pas servir de base à l'obtention d'une dérogation (Rukhsah).</p>
<p><strong>3 -</strong> Il est exigé que le chausson (ou ce qui y ressemble) <strong>couvre entièrement le pied</strong>. On ne peut pas essuyer dessus s'il n'est pas assez couvrant pour masquer la zone qui doit obligatoirement être lavée (lors du Wudu) : par exemple, s'il s'arrête en dessous des chevilles. De même, s'il est assez haut mais qu'il ne cache pas la peau à cause de sa transparence ou de sa finesse (comme une chaussette trop fine/transparente), l'essuyage n'est pas autorisé dans tous ces cas, car le pied n'est pas considéré comme "couvert".</p>
<p>On peut également essuyer sur ce qui remplace les chaussons (<em>Khuffayn</em>) : il est ainsi permis d'essuyer sur la <strong>chaussette épaisse</strong> (<em>Al-Jawrab as-Safîq</em>) qui couvre le pied, qu'elle soit en laine ou autre. En effet, le Prophète <span dir="rtl">ﷺ</span> a essuyé sur ses deux chaussettes et ses sandales, tel que rapporté par Ahmad et d'autres, et authentifié par At-Tirmidhî <a href="#fn9" class="footnote-ref" id="fnref9" role="doc-noteref"><sup>9</sup></a>.</p>
<p>Et l'essuyage sur celui-ci [le vêtement/la chaussette] se poursuit jusqu'à la fin de la durée légale ; cela ne concerne pas ce qui est porté par-dessus, comme des bottines (<em>khuff</em>), des sandales (<em>na'l</em>) ou autre. Le fait de retirer et de remettre [ce qui est porté par-dessus] de manière répétée n'a aucune incidence, dès lors qu'il a commencé l'essuyage sur la chaussette (<em>jawrab</em>).</p>
<p><strong>Il est permis d'essuyer sur le turban à deux conditions :</strong></p>
<p><strong>La première :</strong> Qu'il couvre les parties de la tête qu'il n'est pas d'usage de laisser découvertes.</p>
<p><strong>La deuxième condition :</strong> Que le turban soit « muhannakah », c'est-à-dire dont un pan (ou plus) passe sous la mâchoire, ou qu'il soit pourvu d'une « dhu'ābah », qui est l'extrémité [du tissu] que l'on laisse pendre à l'arrière.</p>
<p>Il a été établi que le Prophète <span dir="rtl">ﷺ</span> a pratiqué l'essuyage sur le turban selon plusieurs hadiths rapportés par de nombreux imams. Et ’Umar a dit :</p>
<p class="ar"><span dir="rtl">مَنْ لَمْ يُطَهِّرْهُ المَسْحُ عَلَى العِمَامَةِ؛ فَلَا طَهَّرَهُ اللهُ</span></p>
<p>« <em><strong>Quiconque n'est pas purifié par l'essuyage sur le turban, qu'Allah ne le purifie point.</strong></em> »<a href="#fn10" class="footnote-ref" id="fnref10" role="doc-noteref"><sup>10</sup></a></p>
<p>L'essuyage sur les bottines (<em>khuffayn</em>) et le turban (<em>'imāmah</em>) n'est autorisé que pour la purification de l'<strong>impureté mineure</strong> (<em>al-hadath al-asghar</em>). Quant à l'<strong>impureté majeure</strong> (<em>al-hadath al-akbar</em>), on ne peut rien essuyer de tout cela ; il est alors obligatoire de laver ce qui se trouve en dessous.</p>
<p><strong>Et l'on essuie sur l'attelle (<em>al-jabīrah</em>),</strong> qui désigne les morceaux de bois ou autres que l'on attache sur une fracture. On essuie également sur le bandage (<em>al-dimād</em>) qui recouvre une plaie, ainsi que sur le pansement adhésif (<em>al-lusūq</em>) placé sur les ulcérations ou lésions.</p>
<p>On essuie sur toutes ces choses à <strong>condition qu'elles se limitent à la mesure du besoin</strong> ; c'est-à-dire qu'elles couvrent la fracture ou la plaie, ainsi que les zones adjacentes nécessaires à leur maintien pour remplir leur fonction.</p>
<p>Si cela dépasse la mesure du besoin, il est alors obligatoire de retirer ce qui est superflu.</p>
<p>Il est permis d'essuyer sur le plâtre (ou l'attelle) et ce qui y ressemble, aussi bien en état d'impureté mineure que majeure. Il n'y a pas de durée limitée pour cet essuyage ؛ on continue plutôt à essuyer dessus jusqu'à son retrait ou jusqu'à la guérison de ce qu'il recouvre. En effet, l'essuyage se fait par nécessité, et il est donc estimé en fonction de cette nécessité.</p>
<p>La preuve concernant l'essuyage sur le plâtre est le hadith de Jâbir (qu'Allah l'agrée) qui a dit : « Nous sommes partis en voyage et l'un de nous fut frappé par une pierre qui lui fendit le crâne. Il fit ensuite un rêve érotique (nécessitant le lavage rituel). Il demanda alors à ses compagnons : "<em><strong>Pensez-vous que je puisse bénéficier d'une dérogation pour faire le Tayammum (l'ablution sèche) ?</strong></em>" Ils répondirent : "<em><strong>Nous ne voyons aucune dérogation pour toi alors que tu es capable d'utiliser l'eau.</strong></em>" Il fit donc son lavage et mourut. Lorsque nous arrivâmes auprès du Messager d'Allah <span dir="rtl">ﷺ</span>, il fut informé de cela et dit : "<em><strong>Ils l'ont tué, qu'Allah les tue ! Pourquoi n'ont-ils pas interrogé alors qu'ils ne savaient pas ? Car certes, le remède de l'ignorance est la question. Il lui aurait suffi de faire le Tayammum et de bander sa blessure avec un morceau de tissu, puis d'essuyer dessus.</strong></em>" » Rapporté par Aboû Dâwoûd et Ibn Mâjah, et authentifié par Ibn as-Sakan.<a href="#fn11" class="footnote-ref" id="fnref11" role="doc-noteref"><sup>11</sup></a></p>
<p><strong>L'endroit de l'essuyage sur ces obstacles :</strong></p>
<p>On essuie le dessus de la pantoufle en cuir (<em>Khuff</em>) et de la chaussette (<em>Jawrab</em>). On essuie la majeure partie du turban (<em>'Imâmah</em>), en insistant particulièrement sur ses plis (enroulements). Quant au plâtre (ou attelle), on l'essuie dans sa totalité.</p>
<p><strong>La manière d'essuyer sur les deux pantoufles (ou chaussettes) :</strong> Elle consiste à poser les doigts de ses mains, préalablement mouillés à l'eau, sur les orteils de ses pieds, puis à les faire passer jusqu'au début de la jambe (la cheville). On essuie le pied droit avec la main droite, et le pied gauche avec la main gauche. Il convient d'écarter légèrement les doigts lors de l'essuyage, et de ne pas répéter le geste (un seul passage suffit).</p>
<p>Qu'Allah nous accorde à tous la réussite dans l'acquisition de la science utile et l'accomplissement des bonnes œuvres.</p>
