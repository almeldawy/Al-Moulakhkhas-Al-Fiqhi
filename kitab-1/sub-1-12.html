<p>⁕ Tu as appris, de ce qui a précédé, les règles de la purification suite à l'impureté mineure (Al-Hadath al-Asghar) ainsi que ses facteurs d'annulation. Tu as donc maintenant besoin de connaître les règles de la purification suite à l'impureté majeure (Al-Hadath al-Akbar)، qu'il s'agisse de l'état de grande impureté (Janâbah), des menstrues (Hayd) ou des lochies (Nifâs). Cette purification est appelée « <strong>Al-Ghusl</strong> » — avec une damma sur la lettre Ghayn — et elle consiste en l'usage de l'eau sur l'ensemble du corps selon une modalité spécifique dont l'explication va suivre.</p>
<p>⁕ La preuve de son obligation est la parole d'Allah (Le Très-Haut) :</p>
<p class="ar"><span dir="rtl">﴿وَإِن كُنتُمْ جُنُبًا فَاطَّهَّرُوا﴾ [المائدة: ٦]</span></p>
<p><strong>﴾ Et si vous êtes en état de grande impureté (Junub), alors purifiez-vous ﴿</strong> [Al-Mâ'idah : 6]</p>
<p>Il a été mentionné que le lavage suite à la grande impureté était déjà pratiqué durant la période de la Jâhiliyyah (période pré-islamique), et qu'il faisait partie des vestiges de la religion d'Ibrahim (sur lui la prière et le salut) qui subsistaient parmi eux.</p>
<p>⁕ <strong>Les causes qui rendent le lavage obligatoire sont au nombre de six</strong>. Si l'une d'entre elles survient, le musulman a l'obligation de procéder au lavage rituel :</p>
<p><strong>1. La sortie du sperme (ou liquide séminal)</strong> de son orifice, que ce soit chez l'homme ou la femme. Cela se présente sous deux cas : Soit il sort à l'état d'éveil, soit durant le sommeil.</p>
<ul>
<li><blockquote>
<p>S'il sort à l'<strong>état d'éveil</strong>, la condition pour que le lavage soit obligatoire est qu'il sorte avec <strong>plaisir</strong> (orgasme). S'il sort sans plaisir, le lavage n'est pas obligatoire, comme dans le cas d'une sortie due à une maladie ou à une incontinence.</p>
</blockquote></li>
<li><blockquote>
<p>Soit il sort durant le <strong>sommeil</strong>, ce qu'on appelle la pollution nocturne (rêve érotique). Dans ce cas, le lavage est <strong>obligatoire de manière absolue</strong>, car le dormeur n'a pas conscience de ce qu'il ressent et peut ne pas avoir perçu le plaisir. <strong>Ainsi, si le dormeur s'éveille et trouve des traces de sperme, le lavage lui est obligatoire. À l'inverse, s'il fait un rêve érotique mais qu'aucun liquide ne sort et qu'il n'en trouve aucune trace, le lavage ne lui est pas obligatoire.</strong></p>
</blockquote></li>
</ul>
<p><strong>2. Parmi les causes rendant le lavage obligatoire :</strong> la pénétration du sexe masculin dans le sexe féminin, même s'il n'y a pas d'éjaculation.</p>
<p>Ceci repose sur le hadith rapporté par Muslim et d'autres, d'après le Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«إذا جلسَ بين شُعَبِها الأرْبَعِ، ثم مَسَّ الخِتَانُ الخِتَانَ؛ فقد وَجَبَ الغُسْلُ»</span></p>
<p><em><strong>« Lorsqu'il s'assoit entre ses quatre membres et que les deux parties circoncises se touchent, le lavage devient obligatoire. »</strong></em><a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a></p>
<p>Le lavage est donc obligatoire pour l'homme (celui qui pénètre) et pour la femme (celle qui est pénétrée) par le simple fait de la pénétration, même s'il n'y a pas d'éjaculation, conformément à ce hadith et au consensus (<em>Ijmâ'</em>) des gens de science à ce sujet.</p>
<p><strong>3. Parmi les causes rendant le lavage obligatoire selon un groupe de savants : la conversion d'un non-musulman à l'Islam.</strong> Ainsi, lorsqu'un mécréant embrasse l'Islam, le lavage lui devient obligatoire, car le Prophète <span dir="rtl">ﷺ</span> a ordonné à certains de ceux qui s'étaient convertis de se laver <a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a>. Cependant, de nombreux gens de science sont d'avis que le lavage du converti est <strong>recommandé</strong> (<em>mustahabb</em>) et non obligatoire, car il n'a pas été rapporté que le Prophète <span dir="rtl">ﷺ</span> l'ordonnait à chaque personne qui embrassait l'Islam. L'ordre est donc interprété comme une recommandation, afin de concilier les différentes preuves. Et Allah est plus savant.</p>
<p><strong>4. Parmi les causes rendant le lavage obligatoire : la mort.</strong> Il est donc obligatoire de laver le défunt, à l'exception du martyr (<em>chahid</em>) tombé sur le champ de bataille, car celui-ci n'est pas lavé. Les détails à ce sujet seront abordés dans le chapitre des règles funéraires (<em>Al-Janâ'iz</em>), si Allah le veut.</p>
<p><strong>5 et 6. Parmi les causes rendant le lavage obligatoire : les menstrues (Al-Hayd) et les lochies (Al-Nifâs).</strong> Ceci conformément à la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«فإذا أَقْبَلَتْ حَيْضَتُكِ فَدَعِي الصَّلاةَ وإذا أَدْبَرَتْ فَاغْسِلِي عنكِ الدمَ ثم صَلِّي»</span></p>
<p><strong><em>« Lorsque tes règles arrivent, délaisse la prière, et lorsqu'elles se terminent, lave le sang qui est sur toi (fais ton Ghusl) puis prie. »</em></strong> <a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a></p>
<p>Et selon la parole d'Allah le Très-Haut :</p>
<p class="ar"><strong><span dir="rtl">﴿فَإِذَا تَطَهَّرْنَ﴾ [البقرة: ٢٢٢]</span></strong></p>
<p><strong>﴾ Puis, lorsqu'elles se sont purifiées... ﴿</strong> [Al-Baqarah : 222] ;</p>
<p>c'est-à-dire que les femmes réglées se purifient par le lavage rituel (<em>Al-Ightisâl</em>) une fois que les menstrues sont terminées.</p>
<p><strong>⁕ Description du lavage complet (Al-Ghusl al-Kâmil) :</strong></p>
<ul>
<li><blockquote>
<p>Qu'il en formule l'intention dans son cœur.</p>
</blockquote></li>
<li><blockquote>
<p>Puis qu'il prononce le nom d'Allah (<em>Bismillah</em>), lave ses mains trois fois, et lave ses parties intimes.</p>
</blockquote></li>
<li><blockquote>
<p>Ensuite, qu'il accomplisse ses ablutions de manière complète.</p>
</blockquote></li>
<li><blockquote>
<p>Puis qu'il verse de l'eau sur sa tête à trois reprises, en imprégnant bien la racine de ses cheveux.</p>
</blockquote></li>
<li><blockquote>
<p>Ensuite, qu'il généralise le lavage à l'ensemble de son corps, en le frictionnant avec ses mains afin que l'eau l'atteigne partout.</p>
</blockquote></li>
</ul>
<p>La femme indisposée (en période de menstrues) ou accouchée (en période de lochies) doit défaire ses tresses pour le lavage consécutif aux menstrues ou aux lochies. Quant à l'état de grande impureté (<em>Janâba</em>), elle n'a pas à les défaire lorsqu'elle se lave à cause de la difficulté de la répétition , mais il lui est obligatoire de bien faire parvenir l'eau jusqu'à la racine de ses cheveux.</p>
<p>Celui qui accomplit le lavage rituel, homme ou femme, doit veiller à inspecter la racine de ses cheveux, les plis de son corps, ainsi que la zone située sous le menton, les aisselles, le nombril et le pli des genoux. S'il porte une montre ou une bague, il doit les bouger afin que l'eau parvienne en dessous.</p>
<p>C'est ainsi qu'il est obligatoire de veiller à parfaire le lavage, de sorte qu'aucune partie du corps ne reste sans que l'eau ne l'ait atteinte.</p>
<p>Le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="rtl">«تَحْتَ كُلِّ شَعْرَةٍ جَنَابَةٌ؛ فَاغْسِلُوا الشَّعْرَ، وَأَنْقُوا الْبَشَرَ»</span></p>
<p><em><strong>« Sous chaque cheveu se trouve une impureté (Janâba) ؛ lavez donc les cheveux et nettoyez la peau. »</strong></em> (Rapporté par Abû Dâwûd et At-Tirmidhî).<a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a></p>
<p>Il ne convient pas de gaspiller l'eau en la versant avec excès , car ce qui est prescrit est d'utiliser peu d'eau tout en parfaissant le lavage. Le Prophète <span dir="rtl">ﷺ</span> faisait ses ablutions avec un <em>Mudd</em> (une poignée) et se lavait avec un <em>Sâ'</em> (quatre <em>Mudds</em>)<a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a>. Il convient donc de l'imiter dans la sobriété de l'usage de l'eau et l'absence de gaspillage.</p>
<p>De même, celui qui accomplit le lavage rituel (<em>Al-Mughtasil</em>) se doit de se couvrir ; il ne lui est pas permis de se laver nu au milieu des gens, conformément au hadith :</p>
<p class="ar"><span dir="rtl">« إِنَّ اللهَ عَزَّ وَجَلَّ حَيِيٌّ سِتِّيرٌ يُحِبُّ الْحَيَاءَ وَالسِّتْرَ، فَإِذَا اغْتَسَلَ أَحَدُكُمْ فَلْيَسْتَتِرْ »</span></p>
<p><em><strong>"Certes, Allah est Pudique et Discret (Sittîr), Il aime la pudeur et la discrétion. Ainsi, quand l'un de vous se lave, qu'il se couvre."</strong></em> (Rapporté par Abû Dâwûd et An-Nasâ'î). <a href="#fn6" class="footnote-ref" id="fnref6" role="doc-noteref"><sup>6</sup></a></p>
<p>Le lavage consécutif à la grande impureté (<em><span dir="rtl">الحدث الأكبر</span></em>) est un dépôt (<em>Amâna</em>) parmi les dépôts confiés au serviteur envers son Seigneur. Il est de son devoir de le préserver et d'accorder de l'importance à ses règles, afin de l'accomplir de la manière prescrite par la Loi. S'il rencontre des difficultés concernant ses règles ou ses causes obligatoires, il doit poser des questions à ce sujet.</p>
<p>Que la pudeur ne l'en empêche pas, car certes, Allah ne se gêne pas de la vérité. La pudeur qui empêche son possesseur de poser des questions sur les affaires de sa religion est une pudeur blâmable ; c'est une forme de lâcheté venant de Satan pour décourager l'être humain de parfaire sa religion et de connaître ce qui lui est obligatoire.</p>
<p>L'affaire de la purification est immense, et toute négligence à son égard est grave, car d'elle dépend la validité de la prière (<em>As-Salât</em>), qui est le pilier de l'Islam.</p>
<p>Nous demandons à Allah pour nous-mêmes et pour l'ensemble des musulmans la clairvoyance dans Sa religion, ainsi que la sincérité envers Lui dans les paroles et les actes.</p>
