<p>Certes, Allah <span dir="rtl">ﷻ</span> a prescrit la purification pour la prière, qu'il s'agisse de l'impureté mineure ou majeure, en utilisant l'eau qu'Allah nous a fait descendre comme moyen de purification. Cela est une obligation indispensable tant que cela est possible. Cependant, il peut survenir des situations où l'eau est inexistante, ou considérée comme telle, ou bien présente, mais dont l'usage est impossible pour une excuse légiférée. Dans ce cas, Allah a instauré ce qui remplace l'eau : le Tayammoum avec de la terre, afin de faciliter la tâche aux créatures et de lever toute gêne.</p>
<p>Allah le Très-Haut dit dans Son Livre explicite :</p>
<p class="ar"><span dir="rtl">﴿ يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوٓا۟ إِذَا قُمْتُمْ إِلَى ٱلصَّلَوٰةِ فَٱغْسِلُوا۟ وُجُوهَكُمْ وَأَيْدِيَكُمْ إِلَى ٱلْمَرَافِقِ وَٱمْسَحُوا۟ بِرُءُوسِكُمْ وَأَرْجُلَكُمْ إِلَى ٱلْكَعْبَيْنِ وَإِن كُنتُمْ جُنُبًا فَٱطَّهَّرُوا۟ وَإِن كُنتُم مَّرْضَىٰٓ أَوْ عَلَىٰ سَفَرٍ أَوْ جَآءَ أَحَدٌ مِّنكُم مِّنَ ٱلْغَآئِطِ أَوْ لَٰمَسْتُمُ ٱلنِّسَآءَ فَلَمْ تَجِدُوا۟ مَآءً فَتَيَمَّمُوا۟ صَعِيدًا طَيِّبًا فَٱمْسَحُوا۟ بِوُجُوهِكُمْ وَأَيْدِيكُم مِّنْهُ مَا يُرِيدُ ٱللَّهُ لِيَجْعَلَ عَلَيْكُم مِّنْ حَرَجٍ وَلَٰكِن يُرِيدُ لِيُطَهِّرَكُمْ وَلِيُتِمَّ نِعْمَتَهُۥ عَلَيْكُمْ لَعَلَّكُمْ تَشْكُرُونَ ﴾ [المائدة : ٦].</span></p>
<p><strong>﴾</strong> <strong>Ô les croyants ! Lorsque vous vous levez pour la prière, lavez vos visages et vos mains jusqu'aux coudes ; passez les mains mouillées sur vos têtes ; et lavez-vous les pieds jusqu'aux chevilles. Et si vous êtes en état d'impureté majeure (Junub), alors purifiez-vous (par un bain). Si vous êtes malades, ou en voyage, ou si l'un de vous revient du lieu où il a fait ses besoins, ou si vous avez touché aux femmes et que vous ne trouviez pas d'eau, alors recourez à de la terre pure, passez-en sur vos visages et vos mains. Allah ne veut pas vous imposer de gêne, mais Il veut vous purifier et parachever Son bienfait sur vous. Peut-être serez-vous reconnaissants.</strong> <strong>﴿</strong> [La Table Servie : 6].</p>
<p><strong>⁕ Le Tayammoum dans la langue :</strong> C'est le fait de viser (l'intention).</p>
<p><strong>⁕ Le Tayammoum dans la Législation (Chari'a) :</strong> C'est l'essuyage du visage et des mains avec de la terre d'une manière spécifique.</p>
<p>Tout comme il est établi dans le Noble Coran, il est également établi par la <strong>Sounnah du Messager d'Allah <span dir="rtl">ﷺ</span></strong> et par le <strong>consensus de la Communauté (Ijma')</strong>. C'est une vertu propre à cette Communauté Muhammadienne, qu'Allah a privilégiée par cela et qu'Il n'a pas accordée aux autres comme moyen de purification, par bonté et largesse envers elle.</p>
<p>Dans les deux recueils authentiques (Al-Boukhari et Muslim) ainsi qu'ailleurs, le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="rtl">« أُعْطِيتُ خَمْسًا لَمْ يُعْطَهُنَّ أَحَدٌ قَبْلِي : نُصِرْتُ بِالرُّعْبِ مَسِيرَةَ شَهْرٍ ، وَجُعِلَتْ لِيَ الْأَرْضُ مَسْجِدًا وَطَهُورًا ، فَأَيُّمَا رَجُلٍ مِنْ أُمَّتِي أَدْرَكَتْهُ الصَّلَاةُ ؛ فَلْيُصَلِّ »</span></p>
<p><em><strong>« Cinq choses m'ont été données qu'aucun Prophète avant moi n'a reçues : j'ai été secouru par la crainte (inspirée à mes ennemis) à une distance d'un mois de marche ; la terre m'a été donnée comme lieu de prière (masjid) et comme moyen de purification, ainsi, tout homme de ma communauté que l'heure de la prière surprend, qu'il prie. »</strong></em></p>
<p>Dans une autre version, il est dit :</p>
<p class="ar"><span dir="rtl">« فَعِنْدَهُ مَسْجِدُهُ وَطَهُورُهُ »</span></p>
<p><em><strong>«...il a alors avec lui son lieu de prière et son moyen de purification.»</strong></em><a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a></p>
<p>Le <strong>Tayammoum</strong> est donc le substitut de la purification par l'eau lorsque l'on est légalement incapable d'utiliser cette dernière. On peut accomplir, grâce à cette purification, tout ce que l'on accomplit avec la purification par l'eau, comme :</p>
<ul>
<li><blockquote>
<p>La prière (<strong>As-Salat</strong>).</p>
</blockquote></li>
<li><blockquote>
<p>Les circonvolutions autour de la Kaaba (<strong>At-Tawaf</strong>).</p>
</blockquote></li>
<li><blockquote>
<p>La lecture du Coran, et bien d'autres actes.</p>
</blockquote></li>
</ul>
<p>En effet, Allah a fait du Tayammoum un moyen de purification, tout comme Il a fait de l'eau un moyen de purification. Le Prophète (paix et bénédiction sur lui) a dit :</p>
<p class="ar"><span dir="rtl">« وَجُعِلَتْ تُرْبَتُهَا - يَعْنِي : الْأَرْضَ - لَنَا طَهُوراً ... »</span></p>
<p><em><strong>« ...et sa terre — c'est-à-dire celle de la terre (le sol) — a été faite pour nous un moyen de purification... »</strong></em> <a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a>.</p>
<p>⁕ <strong>Le Tayammoum remplace l'eau dans les cas suivants :</strong></p>
<p><strong>Premièrement :</strong> En cas d'absence d'eau, selon la parole du Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿فَلَمْ تَجِدُوا۟ مَآءً فَتَيَمَّمُوا۟﴾</span></p>
<p><strong>﴾...et que vous ne trouviez pas d'eau, alors recourez à de la terre pure ﴿</strong>.</p>
<p>Cela s'applique que l'on soit résident ou en voyage, après l'avoir cherchée sans succès.</p>
<p><strong>Deuxièmement :</strong> S'il possède de l'eau mais qu'il en a besoin pour boire ou cuisiner. S'il l'utilisait pour sa purification, cela nuirait à ses besoins vitaux au point de craindre la soif pour lui-même, pour autrui ou pour un animal dont la vie doit être préservée.</p>
<p><strong>Troisièmement :</strong> S'il craint que l'usage de l'eau ne nuise à son corps par une maladie ou n'en retarde la guérison, selon la parole du Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿وَإِن كُنتُم مَّرْضَىٰٓ ...﴾ إِلَى قَوْلِهِ : ﴿فَتَيَمَّمُوا۟ صَعِيدًا طَيِّبًا ...﴾ الآيَة.</span></p>
<p><strong>﴾ Si vous êtes malades... ﴿</strong> <em>jusqu'à</em> <strong>﴾ ...alors recourez à de la terre pure ﴿</strong>.</p>
<p><strong>Quatrièmement :</strong> S'il est incapable d'utiliser l'eau à cause d'une maladie l'empêchant de bouger, qu'il n'a personne pour l'aider à faire ses ablutions et qu'il craint que le temps de la prière ne s'écoule.</p>
<p><strong>Cinquièmement :</strong> S'il craint le froid intense en utilisant l'eau et qu'il ne trouve rien pour la chauffer. Il fait alors le Tayammoum et prie, selon la parole du Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿وَلَا تَقْتُلُوٓا۟ أَنفُسَكُمْ﴾ [النساء : ٢٩]</span></p>
<p><strong>﴾ Et ne vous tuez pas vous-mêmes ﴿</strong> [Les Femmes : 29].</p>
<p>C'est donc dans ces situations que l'on a recours au Tayammoum pour prier.</p>
<p><strong>⁕ Cas de l'eau insuffisante ou de blessures:</strong></p>
<p>. S'il trouve une quantité d'eau ne suffisant qu'à une partie de sa purification, il l'utilise pour ce qui est possible de ses membres ou de son corps, et fait le Tayammoum pour le reste que l'eau n'a pu couvrir ; cela conformément à la parole du Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿فَاتَّقُوا اللهَ مَا اسْتَطَعْتُمْ﴾ [التغابن : ١٦]</span></p>
<p><strong>﴾ Craignez Allah autant que vous le pouvez ﴿</strong> [La Grande Perte : 16].</p>
<p>. S'il présente une blessure qui serait aggravée par le lavage ou l'essuyage à l'eau, il fait le Tayammoum pour cette partie et lave le reste (du corps/des membres) ; selon la parole du Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿وَلَا تَقْتُلُوا أَنْفُسَكُمْ﴾ [النساء : ٢٩]</span></p>
<p></p>
<p><strong>﴾ Et ne vous tuez pas vous-mêmes ﴿</strong> [Les Femmes : 29].</p>
<p>. Si sa blessure ne risque pas d'être aggravée par un simple essuyage humide, il passe alors la main mouillée sur le pansement (le bandage) qui la recouvre, et cet essuyage lui suffit sans avoir besoin de recourir au Tayammoum.</p>
<p>_ Il est permis de faire le Tayammoum avec ce qui se trouve à la surface de la terre, que ce soit de la terre, du sel gemme (terrain salin), du sable ou autre. C'est l'avis le plus correct des deux opinions savantes, selon la parole du Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿فَتَيَمَّمُوا صَعِيدًا طَيِّبًا﴾ [المائدة : ٦]</span></p>
<p><strong>﴾ ...alors recourez à une surface (sol) pure ﴿</strong> [La Table Servie : 6].</p>
<p>Le Prophète <span dir="rtl">ﷺ</span> et ses compagnons, lorsque l'heure de la prière arrivait, faisaient le Tayammoum avec le sol sur lequel ils se trouvaient, qu'il s'agisse de terre ou d'autre chose, et ils ne transportaient pas de terre avec eux.</p>
<p><strong>⁕ Description du Tayammoum :</strong></p>
<p>Frapper la terre de ses deux mains, les doigts écartés, puis s'essuyer le visage avec l'intérieur de ses doigts, et s'essuyer les mains (les poignets) avec ses paumes. Il faut que l'essuyage couvre l'ensemble du visage et des mains. S'il le fait en deux frappes (l'une pour le visage et la seconde pour les mains), cela est permis, mais la première méthode <a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a> (une seule frappe) est celle rapportée du Prophète <span dir="rtl">ﷺ</span> .</p>
<p><strong>⁕ Ce qui annule le Tayammoum :</strong></p>
<p>Le Tayammoum remplaçant l'impureté mineure est annulé par ce qui annule les ablutions (<em>Woudou</em>). Celui remplaçant l'impureté majeure est annulé par ce qui impose le grand bain (<em>Ghousl</em>), comme l'état de <em>Janaba</em>, les menstrues ou les lochies ; <strong>car le substitut prend les mêmes règles que l'original</strong>. Le Tayammoum est également annulé par la présence de l'eau (si le Tayammoum a été fait par manque d'eau) ou par la disparition de l'excuse légale pour laquelle il a été prescrit, comme la guérison d'une maladie.</p>
<p><strong>⁕ Le cas de celui qui est privé des deux moyens de purification :</strong></p>
<p>Celui qui ne trouve ni eau ni terre, ou qui se trouve dans un état où il ne peut toucher sa peau ni avec de l'eau ni avec de la terre, celui-là prie selon sa condition actuelle, sans ablution (<em>woudou</em>) ni <em>tayammoum</em>. En effet, Allah n'impose à aucune âme une charge supérieure à sa capacité. Il n'a pas à refaire cette prière, car il a accompli ce qui lui était ordonné, conformément à la parole du Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿فَاتَّقُوا اللهَ مَا اسْتَطَعْتُمْ﴾ [التغابن : ١٦]</span></p>
<p><strong>﴾ Craignez Allah autant que vous le pouvez ﴿</strong> [La Grande Perte : 16],</p>
<p>et à la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«إِذَا أَمَرْتُكُمْ بِأَمْرٍ، فَأْتُوا مِنْهُ مَا اسْتَطَعْتُمْ»</span></p>
<p><strong><em>« Quand je vous ordonne une chose, accomplissez-en ce que vous pouvez. »</em></strong></p>
<p>Voici un ensemble de règles concernant le <em>tayammoum</em> que nous avons exposées pour toi. Si l'une d'entre elles, ou toute autre question, te semble ambiguë, tu te dois d'interroger les gens de science. Ne sois pas négligent dans les affaires de ta religion, tout particulièrement en ce qui concerne la prière qui est le pilier de l'Islam ; car cette affaire est d'une importance capitale.</p>
<p>Qu'Allah nous accorde à tous la réussite vers ce qui est juste et droit, dans la parole comme dans l'action, et qu'Il fasse que notre œuvre soit exclusivement vouée à Sa Face Généreuse. Il est certes Celui qui entend et qui exauce les invocations.</p>
