<p><strong>La condition (Ash-Shart) littéralement :</strong> C'est le signe.</p>
<p><strong>Religieusement :</strong> C'est ce dont l'absence entraîne l'absence [de la chose conditionnée], mais dont la présence n'entraîne pas nécessairement la présence ni l'absence de la chose en soi. Les conditions de la prière sont les éléments dont dépend la validité de celle-ci, dans la mesure du possible.</p>
<p>La prière possède des conditions sans lesquelles elle n'est pas valide. Si elles (ou l'une d'entre elles) viennent à manquer, la prière n'est pas valide. Parmi celles-ci :</p>
<h4 id="premièrement-lentrée-de-son-temps"><strong>Premièrement : L'entrée de son temps</strong></h4>
<p>Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿إِنَّ الصَّلَاةَ كَانَتْ عَلَى الْمُؤْمِنِينَ كِتَابًا مَّوْقُوتًا﴾ [النساء: ١٠٣]</span></p>
<p><em><strong>« La prière demeure, pour les croyants, une prescription à des temps déterminés. »</strong></em> [An-Nisa : 103].</p>
<p>C'est-à-dire : une obligation à des moments précis. La fixation du temps (<em>At-Tawqît</em>) signifie la délimitation. Allah a fixé le temps de la prière, au sens où Il (Gloire à Lui) lui a déterminé un créneau temporel. Les musulmans sont unanimes sur le fait que les cinq prières ont des temps spécifiques et délimités, et qu'elles ne sont pas valables si elles sont accomplies avant ceux-ci.</p>
<p><strong>L'émir des croyants, 'Umar ibn al-Khattâb (qu'Allah l'agrée), a dit :</strong></p>
<p class="ar"><span dir="rtl">«الصلاةُ لها وقتٌ شَرَطَهُ اللهُ لها لا تَصِحُّ إلَّا بِهِ».</span></p>
<p>« La prière a un temps qu'Allah a stipulé pour elle, et elle n'est valide qu'avec celui-ci. »</p>
<p>La prière devient obligatoire dès l'entrée de son temps, conformément à la parole du Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿أَقِمِ الصَّلَاةَ لِدُلُوكِ الشَّمْسِ﴾ [الإسراء: ٧٨]</span></p>
<p><strong>« Accomplis la prière au déclin du soleil »</strong> [Al-Isra : 78].</p>
<p>Les savants sont unanimement d'accord sur le mérite d'accomplir la prière au début de son temps de manière générale, en s'appuyant sur ce verset ainsi que sur les paroles du Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿فَاسْتَبِقُوا الْخَيْرَاتِ﴾ [البقرة: ١٤٨]</span></p>
<p><strong>« Rivalisez donc dans les bonnes œuvres »</strong> [Al-Baqarah : 148].</p>
<p class="ar"><span dir="rtl">﴿وَسَارِعُوا إِلَى مَغْفِرَةٍ مِّن رَّبِّكُمْ﴾ [آل عمران: ١٣٣]</span></p>
<blockquote>
<p><strong>« Et hâtez-vous vers le pardon de votre Seigneur »</strong> [Al-Imran : 133].</p>
<p class="ar"><span dir="rtl">﴿وَالسَّابِقُونَ السَّابِقُونَ * أُوْلَئِكَ الْمُقَرَّبُونَ﴾ [الواقعة: ١٠-١١]</span></p>
</blockquote>
<p><strong>« Les premiers (à suivre les ordres d'Allah sur terre) seront les premiers (dans l'au-delà) ; ce sont ceux-là les plus proches d'Allah »</strong> [Al-Waqi'a : 10-11].</p>
<p>Et dans les <strong>« deux Authentiques »</strong> (Al-Boukhari et Muslim), il est rapporté que le Prophète <span dir="rtl">ﷺ</span> fut interrogé :</p>
<p class="ar"><span dir="rtl">أيُّ العَمَلِ أَحَبُّ إِلَى اللهِ؟ قالَ: «الصلاةُ على وَقْتِهَا»</span></p>
<p>« Quelle est l'œuvre la plus aimée d'Allah ? ». Il répondit : <strong>« <em>La prière accomplie en son temps</em> »</strong>.<a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a></p>
<p>Le Très-Haut a également dit :</p>
<p class="ar"><span dir="rtl">﴿حَافِظُوا عَلَى الصَّلَوَاتِ﴾ [البقرة: ٢٣٨]</span></p>
<p></p>
<p><strong>« Soyez assidus aux prières »</strong> [Al-Baqarah : 238],</p>
<p>et l'une des formes de cette assiduité consiste à les accomplir dès le début de leur temps.</p>
<p>Les prières obligatoires sont au nombre de cinq durant le jour et la nuit. Pour chacune d'elles, Allah a choisi un moment approprié qui s'adapte à la situation des serviteurs. Ainsi, ils accomplissent ces prières à ces moments précis sans que cela ne les empêche de vaquer à leurs autres occupations ; au contraire, elles les y aident.</p>
<p>De plus, ces prières expient les péchés qu'ils commettent. Le Prophète <span dir="rtl">ﷺ</span> les a d'ailleurs comparées à une rivière au courant continu dans laquelle une personne se laverait cinq fois par jour : il ne resterait alors plus aucune trace de saleté sur elle.<a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a></p>
<p><strong>Voici ces horaires comme suit :</strong></p>
<p><strong>1 - La prière du Dhuhr (Midi) :</strong></p>
<p>Son temps commence au déclin du soleil (<em>Zawal</em>) ; c'est-à-dire lorsqu'il commence à s'incliner vers l'ouest par rapport au zénith (la ligne de culmination). C'est ce déclin qui est mentionné dans la parole du Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿أَقِمِ الصَّلَاةَ لِدُلُوكِ الشَّمْسِ﴾ [الإسراء: ٧٨]</span></p>
<p>« <strong>Accomplis la prière au déclin du soleil</strong> » [Al-Isra : 78].</p>
<p>On reconnaît le déclin par l'apparition de l'ombre du côté de l'orient (est) après qu'elle a disparu du côté de l'occident (ouest). Le temps du Dhuhr s'étend jusqu'à ce que l'ombre d'une chose devienne égale à sa propre taille, moment où il prend fin. Ceci conformément à la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«وَقْتُ الظُّهْرِ إِذَا زَالَتِ الشَّمْسُ وَكَانَ ظِلُّ الرَّجُلِ كَطُولِهِ»، رَوَاهُ مُسْلِمٌ</span></p>
<p>« <em><strong>Le temps du Dhuhr commence quand le soleil décline et que l'ombre de l'homme est égale à sa taille</strong></em> » [Rapporté par Muslim].<a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a></p>
<p>Il est recommandé de l'accomplir tôt, au début de son temps, sauf en cas de forte chaleur. Dans ce cas, il est recommandé de la retarder jusqu'à ce que la chaleur diminue, conformément à la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«إِذَا اشْتَدَّ الحَرُّ؛ فَأَبْرِدُوا بِالصَّلَاةِ؛ فَإِنَّ شِدَّةَ الحَرِّ مِن فَيْحِ جَهَنَّمَ».</span></p>
<p>« <em><strong>Quand la chaleur devient intense, attendez la fraîcheur pour prier, car l'intensité de la chaleur provient du souffle de l'Enfer</strong></em> ».<a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a></p>
<p><strong>2 - La prière de l'Asr (Après-midi) :</strong></p>
<p>Son temps commence dès la fin du temps du Dhuhr ; c'est-à-dire au moment où l'ombre de chaque chose devient égale à sa propre taille. Il s'étend jusqu'à ce que le soleil commence à jaunir (pâlir), selon l'avis le plus authentique des deux opinions des savants.</p>
<p>Il est recommandé (Sounnah) de l'accomplir au début de son temps. C'est elle la « prière médiane » (<em>Al-Salat al-Wusta</em>) qu'Allah a spécifiquement mentionnée pour souligner son mérite. Le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿حَافِظُوا عَلَى الصَّلَوَاتِ وَالصَّلَاةِ الْوُسْطَى﴾ [البقرة: ٢٣٨]</span></p>
<p><strong>« Soyez assidus aux prières et [surtout] à la prière médiane »</strong> [Al-Baqarah : 238].</p>
<p>Il a d'ailleurs été confirmé dans les Hadiths qu'il s'agit bien de la prière de l'Asr.<a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a></p>
<p><strong>3 - La prière du Maghrib (Coucher du soleil) :</strong></p>
<p>Son temps commence au coucher du soleil, c'est-à-dire lorsque l'intégralité du disque solaire disparaît, de sorte qu'on n'en voit plus rien, que ce soit depuis une plaine ou une montagne. On reconnaît également le coucher du soleil par l'apparition de l'obscurité de la nuit venant de l'Orient (Est), conformément à la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«إِذَا أَقْبَلَ اللَّيْلُ مِن هَا هُنَا، وَأَدْبَرَ النَّهَارُ مِن هَا هُنَا؛ فَقَدْ أَفْطَرَ الصَّائِمُ»</span></p>
<p>« Quand la nuit approche par ici et que le jour s'en va par là, alors celui qui jeûne peut rompre son jeûne. »<a href="#fn6" class="footnote-ref" id="fnref6" role="doc-noteref"><sup>6</sup></a></p>
<p>Le temps du Maghrib s'étend ensuite jusqu'à la disparition du <strong>crépuscule rouge</strong> (<em>Ash-Shafaq al-Ahmar</em>). Le crépuscule est une blancheur mêlée de rougeur ; puis la rougeur s'efface pour laisser place à une blancheur pure qui finit par disparaître à son tour. La disparition de cette blancheur sert ainsi d'indicateur final de la disparition de la rougeur.</p>
<p>Il est recommandé (Sounnah) de hâter l'accomplissement de la prière du Maghrib dès le début de son temps. Ceci d'après ce qu'a rapporté At-Tirmidhi (qui l'a authentifié) selon Salama : le Prophète <span dir="rtl">ﷺ</span> priait le Maghrib dès que le soleil s'était couché et s'était dérobé derrière son voile [l'horizon].<a href="#fn7" class="footnote-ref" id="fnref7" role="doc-noteref"><sup>7</sup></a> Il a ajouté : « <em>C'est l'avis de la majorité des gens de science parmi les Compagnons et les Suivants (Tabi'un) après eux.</em> »</p>
<p><strong>4 - La prière de l'Isha :</strong></p>
<p>Son temps commence à la fin du temps du Maghrib ; c'est-à-dire à la disparition du <strong>crépuscule rouge</strong>. Il s'étend jusqu'à l'apparition de l'<strong>aube véridique</strong> (le second Fajr). Ce temps se divise en deux parties :</p>
<ol type="1">
<li><blockquote>
<p><strong>Le temps de choix (préférentiel) :</strong> il s'étend jusqu'au premier tiers de la nuit.</p>
</blockquote></li>
<li><blockquote>
<p><strong>Le temps de nécessité (contrainte) :</strong> il s'étend du premier tiers de la nuit jusqu'à l'apparition de l'aube véridique.</p>
</blockquote></li>
</ol>
<p>Retarder la prière jusqu'à la fin du temps préférentiel (<strong>jusqu'au premier tiers de la nuit</strong>) est meilleur si cela est aisé. En revanche, si cela s'avère difficile pour les fidèles (ceux qui sont dirigés par l'imam), il est alors recommandé de la hâter au début de son temps, afin d'éviter toute pénibilité.</p>
<p>Il est détestable de dormir avant la prière de l'Isha, de peur que le dormeur ne s'enfonce dans son sommeil et qu'il ne la manque. Il est également détestable de discuter après celle-ci (c'est-à-dire de tenir des conversations prolongées avec les gens), car cela l'empêche de se coucher tôt afin de se réveiller de bonne heure. Il convient donc de dormir immédiatement après la prière de l'Isha, afin de pouvoir se lever à la fin de la nuit pour accomplir la prière nocturne (<em>Tahajjud</em>) et prier le Fajr avec vitalité. En effet, le Prophète <span dir="rtl">ﷺ</span> détestait dormir avant l'Isha et discuter après elle.<a href="#fn8" class="footnote-ref" id="fnref8" role="doc-noteref"><sup>8</sup></a></p>
<p>Et cela s'applique si la veille après l'Isha est sans utilité. En revanche, si elle a un but valable ou répond à un besoin bénéfique, alors il n'y a pas de mal à cela.</p>
<p><strong>5 - La prière du Fajr (L'Aube) :</strong></p>
<p>Son temps commence à l'apparition de l'<strong>aube véridique</strong> (le second Fajr) et s'étend jusqu'au lever du soleil. Il est recommandé de la hâter dès que l'apparition de l'aube est certaine.</p>
<p>Tels sont les horaires des cinq prières qu'Allah a prescrits. Il t'incombe donc de t'y conformer scrupuleusement : tu ne dois ni les accomplir avant leur temps, ni les retarder au-delà. Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿فَوَيْلٌ لِّلْمُصَلِّينَ * الَّذِينَ هُمْ عَن صَلَاتِهِمْ سَاهُونَ﴾ [الماعون: ٤-٥]</span></p>
<p><strong>« Malheur donc à ceux qui prient tout en négligeant leur prière »</strong> [Al-Ma'un : 4-5], c'est-à-dire ceux qui retardent la prière au-delà de son temps fixé.</p>
<p>Le Très-Haut a également dit :</p>
<p class="ar"><span dir="rtl">﴿فَخَلَفَ مِن بَعْدِهِمْ خَلْفٌ أَضَاعُوا الصَّلَاةَ وَاتَّبَعُوا الشَّهَوَاتِ فَسَوْفَ يَلْقَوْنَ غَيًّا * إِلَّا مَن تَابَ﴾ [مريم: ٥٩-٦٠]</span></p>
<p><strong>« Puis leur succédèrent des générations qui délaissèrent la prière et suivirent leurs passions. Ils rencontreront bientôt "Ghayy" (la perdition), sauf celui qui se repent »</strong> [Maryam : 59-60].</p>
<p>Le sens de « délaisser » ici est : la retarder par rapport à son temps. Celui qui retarde la prière, Allah l'a qualifié de négligent et de dissipateur, et l'a menacé du « Wail » (Malheur) et du « Ghayy », qui est une vallée en Enfer.</p>
<p>Quant à celui qui l'oublie ou qui s'endort sans l'avoir faite, il a l'obligation de s'empresser de la rattraper. Le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="rtl">«مَنْ نَسِيَ صَلَاةً أَوْ نَامَ عَنْهَا؛ فَلْيُصَلِّهَا إِذَا ذَكَرَهَا، لَا كَفَّارَةَ لَهَا إِلَّا ذَلِكَ»</span></p>
<p><strong>« Q<em>uiconque oublie une prière ou s'endort sans l'avoir accomplie, qu'il la prie dès qu'il s'en rappelle ; il n'y a pas d'autre expiation que cela</em> »</strong>.<a href="#fn9" class="footnote-ref" id="fnref9" role="doc-noteref"><sup>9</sup></a></p>
<p>Il est donc obligatoire de s'empresser de rattraper la prière manquée immédiatement. On ne doit pas attendre l'entrée du temps de la prière équivalente (par exemple, attendre le lendemain midi pour rattraper un Dhuhr manqué), comme le pensent à tort certains parmi le commun des gens. On ne doit pas non plus la retarder jusqu'à la fin d'un temps d'interdiction [de prière], mais on doit l'accomplir sur-le-champ.</p>
<h4 id="deuxièmement-couvrir-la-nudité-satr-al-awrah"><strong>Deuxièmement : Couvrir la nudité (<em>Satr al-'Awrah</em>)</strong></h4>
<p>Parmi les conditions de la prière figure le fait de couvrir sa nudité (<em>'Awrah</em>). Celle-ci désigne ce qu'il est obligatoire de couvrir, dont l'apparition est considérée comme indécente et dont on éprouve de la pudeur.</p>
<p>Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿يَـٰبَنِىٓ ءَادَمَ خُذُوا۟ زِينَتَكُمْ عِندَ كُلِّ مَسْجِدٍۢ﴾ [الأعراف: ٣١]</span></p>
<p><strong>« Ô enfants d'Adam, dans chaque lieu de prière, portez votre parure »</strong> [Al-A'raf : 31] ; c'est-à-dire lors de chaque prière.</p>
<p>Le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="rtl">«لَا يَقْبَلُ اللهُ صَلَاةَ حَائِضٍ -أَيْ: بَالِغٍ- إِلَّا بِخِمَارٍ»، رَوَاهُ أَبُو دَاوُدَ وَالتِّرْمِذِيُّ وَحَسَّنَهُ.</span></p>
<p><strong>« Allah n'accepte pas la prière d'une femme qui a ses règles — c'est-à-dire une femme pubère — sans qu'elle ne porte un voile (<em>Khimar</em>) »</strong>. [Rapporté par Abû Dâwud et At-Tirmidhi, qui l'a qualifié de bon (<em>Hassan</em>)].<a href="#fn10" class="footnote-ref" id="fnref10" role="doc-noteref"><sup>10</sup></a></p>
<p>Ibn Abd al-Barr a dit <a href="#fn11" class="footnote-ref" id="fnref11" role="doc-noteref"><sup>11</sup></a>: « <em>Ils [les savants] se sont accordés</em> <a href="#fn12" class="footnote-ref" id="fnref12" role="doc-noteref"><sup>12</sup></a> <em>sur la nullité de la prière de celui qui délaisse son vêtement alors qu'il est capable de se couvrir avec, et qui prie nu. Il n'y a donc pas de divergence sur l'obligation de couvrir sa nudité ('awra) durant la prière, en présence d'autrui, ni même en étant seul selon l'avis authentique.</em> »</p>
<p>Le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="rtl">« احْفَظْ عَوْرَتَكَ إِلَّا مِنْ زَوْجَتِكَ أَوْ مَا مَلَكَتْ يَمِينُكَ »، قَالَ : قُلْتُ : فَإِذَا كَانَ الْقَوْمُ بَعْضُهُمْ فِي بَعْضٍ؟ قَالَ : « فَإِنِ اسْتَطَعْتَ أَنْ لَا يَرَاهَا أَحَدٌ؛ فَلَا يَرَيَنَّهَا »، قَالَ : فَإِذَا كَانَ أَحَدُنَا خَالِيًا؟ قَالَ : « اللهُ أَحَقُّ أَنْ يُسْتَحْيَى مِنْهُ ».</span></p>
<p>« <em><strong>Préserve ta nudité, sauf devant ton épouse ou ce que ta main droite possède [tes esclaves].</strong></em> »</p>
<p>J'ai demandé [dit le narrateur] : « <strong>Et si les gens sont les uns avec les autres ?</strong> » Il répondit : « <em><strong>Si tu peux faire en sorte que personne ne la voie, alors qu'il ne la voie pas.</strong></em> » J'ai demandé : « <strong>Et si l'un de nous est seul ?</strong> » Il répondit : « <em><strong>Allah mérite plus que quiconque que l'on soit pudique envers Lui.</strong></em> » <em>Rapporté par Abu Dawud et d'autres.</em><a href="#fn13" class="footnote-ref" id="fnref13" role="doc-noteref"><sup>13</sup></a></p>
<p>Allah a qualifié le fait de dévoiler sa nudité de turpitude (<em>Fahisha</em>), en citant les mécréants :</p>
<p class="ar"><span dir="rtl">﴿ وَإِذَا فَعَلُوا۟ فَـٰحِشَةًۭ قَالُوا۟ وَجَدْنَا عَلَيْهَآ ءَابَآءَنَا وَٱللَّهُ أَمَرَنَا بِهَا ۗ قُلْ إِنَّ ٱللَّهَ لَا يَأْمُرُ بِٱلْفَحْشَآءِ ۖ أَتَقُولُونَ عَلَى ٱللَّهِ مَا لَا تَعْلَمُونَ ﴾</span></p>
<p><strong>{Et quand ils commettent une turpitude, ils disent : "Nous avons trouvé nos ancêtres la pratiquant et c'est Allah qui nous l'a ordonnée". Dis : "Certes, Allah n'ordonne point la turpitude"}</strong> [Al-A'raf : 28].</p>
<p>Ils effectuaient les circuits autour de la Kaaba (<em>Tawaf</em>) nus, en prétendant que cela faisait partie de la religion. Dévoiler sa nudité et la regarder mène à un mal grave ; c'est un moyen de sombrer dans l'obscénité et de détruire la moralité, comme on peut l'observer dans les sociétés licencieuses qui ont perdu leur dignité et dont l'éthique s'est effondrée ; le vice s'y est propagé et la vertu y a disparu.</p>
<p>Couvrir sa nudité permet de préserver la vertu et la morale. C'est pour cela que Satan s'acharne à inciter les fils d'Adam à dévoiler leur nudité. Allah nous a d'ailleurs mis en garde contre lui dans Sa parole :</p>
<p class="ar"><span dir="rtl">﴿ يٰبَنِيٓ ءَادَمَ لَا يَفْتِنَنَّكُمُ ٱلشَّيْطَـٰنُ كَمَآ أَخْرَجَ أَبَوَيْكُم مِّنَ ٱلْجَنَّةِ يَنزِعُ عَنْهُمَا لِبَاسَهُمَا لِيُرِيَهُمَا سَوْءَٰتِهِمَآ ﴾</span></p>
<p><strong>{Ô fils d'Adam ! Que le Diable ne vous tente point, comme il a fait sortir du Paradis vos père et mère, leur arrachant leur vêtement pour leur montrer leur nudité}</strong> [Al-A'raf : 27].</p>
<p>Le dévoilement des nudités est une ruse satanique dans laquelle sont tombées de nombreuses sociétés humaines aujourd'hui. Ils appellent parfois cela "progrès" ou "modernité" (<em>Raqiyyan wa Tafannunan</em>). Ainsi, des clubs de nudisme ont vu le jour, et le dévoilement (<em>Sufur</em>) s'est propagé chez les femmes, dont les corps sont exposés devant les hommes, sans pudeur ni gêne.</p>
<p>Ô musulman ! Il est certes obligatoire de couvrir la nudité (<em>'awra</em>) avec ce qui n'en laisse pas transparaître la peau. Allah — élevé soit-Il — a dit :</p>
<p class="ar"><span dir="rtl">يَـٰبَنِىٓ ءَادَمَ قَدْ أَنزَلْنَا عَلَيْكُمْ لِبَاسًۭا يُوَٰرِى سَوْءَٰتِكُمْ</span></p>
<p><strong>{ Ô fils d’Adam ! Nous avons fait descendre sur vous un vêtement pour cacher vos parties génitales }</strong> [Al-A'raf : 26].</p>
<p>Ainsi, dissimuler la nudité par un vêtement couvrant est une chose requise et obligatoire. La limite de la nudité de l'homme s'étend du nombril jusqu'aux genoux, conformément au hadith de 'Ali — qu'Allah l'agrée — :</p>
<p class="ar"><span dir="rtl">« لَا تُبْرِزْ فَخِذَكَ ، وَلَا تَنْظُرْ إِلَى فَخِذِ حَيٍّ أَوْ مَيِّتٍ »</span></p>
<p>« <em><strong>Ne laisse pas apparaître ton aide (ta cuisse), et ne regarde pas la cuisse d'un vivant ni d'un mort</strong></em> », rapporté par Abu Dawud et Ibn Majah. <a href="#fn14" class="footnote-ref" id="fnref14" role="doc-noteref"><sup>14</sup></a></p>
<p>Et dans un autre hadith :</p>
<p class="ar"><span dir="rtl">« غَطِّ فَخِذَكَ ؛ فَإِنَّ الْفَخِذَ عَوْرَةٌ »</span></p>
<p>« <em><strong>Couvre ta cuisse, car la cuisse fait certes partie de la nudité</strong></em> », rapporté par Malik, Ahmad et At-Tirmidhi qui l'a jugé bon (<em>Hasan</em>).<a href="#fn15" class="footnote-ref" id="fnref15" role="doc-noteref"><sup>15</sup></a></p>
<p>Malgré tout cela, nous voyons avec grand regret beaucoup d'hommes, lorsqu'ils pratiquent des sports, découvrir leurs cuisses et ne couvrir que la nudité majeure (<em>al-'awra al-mughalladhah</em>). Ceci est une opposition claire à ces textes. Il leur est donc obligatoire d'y prendre garde, de se conformer aux jugements de leur religion et de ne pas prêter attention à ce qui s'y oppose.</p>
<p>Et la femme est entièrement une nudité ('awra), conformément à la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">« الْمَرْأَةُ عَوْرَةٌ »</span></p>
<p>"<em><strong>La femme est une nudité</strong></em>", authentifié par At-Tirmidhi.<a href="#fn16" class="footnote-ref" id="fnref16" role="doc-noteref"><sup>16</sup></a></p>
<p>Et selon le hadith d'Oum Salama : elle demanda [au Prophète <span dir="rtl">ﷺ</span>] : "<em><strong>La femme peut-elle prier en portant une chemise (dir') et un voile (khimar) sans porter de pagne (izar) ?</strong></em>" Il répondit :</p>
<p class="ar"><span dir="rtl">« إِذَا كَانَ الدِّرْعُ سَابِغاً يُغَطِّي قَدَمَيْهَا »</span></p>
<p>"<em><strong>Si la chemise est ample et qu'elle couvre le dessus de ses pieds</strong></em>", rapporté par Abu Dawud.<a href="#fn17" class="footnote-ref" id="fnref17" role="doc-noteref"><sup>17</sup></a></p>
<p>Également chez Abu Dawud, At-Tirmidhi et Ibn Majah d'après le hadith d'Aïcha — qu'Allah l'agrée — :</p>
<p class="ar"><span dir="rtl">« لَا يَقْبَلُ اللهُ صَلَاةَ حَائِضٍ إِلَّا بِخِمَارٍ »</span></p>
<p>"<em><strong>Allah n'accepte pas la prière d'une femme pubère sans voile (khimar)</strong></em>". <a href="#fn18" class="footnote-ref" id="fnref18" role="doc-noteref"><sup>18</sup></a></p>
<p>At-Tirmidhi a dit : "<em>C'est ce qui est mis en pratique chez les gens de science : si la femme, une fois pubère, prie alors qu'une partie de sa nudité est découverte, sa prière n'est pas licite [valide].</em>"</p>
<p>Ces hadiths [cités précédemment] s'accordent avec la parole d'Allah — élevé soit-Il — :</p>
<p class="ar"><span dir="rtl">﴿ وَلَا يُبْدِينَ زِينَتَهُنَّ إِلَّا مَا ظَهَرَ مِنْهَا ۖ وَلْيَضْرِبْنَ بِخُمُرِهِنَّ عَلَىٰ جُيُوبِهِنَّ ۖ وَلَا يُبْدِينَ زِينَتَهُنَّ إِلَّا لِبُعُولَتِهِنَّا ﴾</span></p>
<p><strong>{...et de ne montrer de leurs atours que ce qui en paraît et qu'elles rabattent leurs voiles sur leurs poitrines ؛ et qu'elles ne montrent leurs atours qu'à leurs maris…</strong> <strong>}</strong>l'intégralité du verset [An-Nur : 31].</p>
<p>Et Sa parole :</p>
<p class="ar"><span dir="ltr">﴿</span> <span dir="rtl">يَـٰٓأَيُّهَا ٱلنَّبِىُّ قُل لِّأَزْوَٰجِكَ وَبَنَاتِكَ وَنِسَآءِ ٱلْمُؤْمِنِينَ يُدْنِينَ عَلَيْهِنَّ مِن جَلَـٰبِيبِهِنَّ ﴾</span></p>
<p><strong>{ Ô Prophète ! Dis à tes épouses, à tes filles, et aux femmes des croyants, de ramener sur elles leurs grands voiles (<em>Jalabib</em>)... }</strong> [Al-Ahzab : 59].</p>
<p>Et la parole d'Allah — élevé soit-Il — :</p>
<p class="ar"><span dir="rtl">﴿ وَإِذَا سَأَلْتُمُوهُنَّ مَتَـٰعًۭا فَسْـَٔلُوهُنَّ مِن وَرَآءِ حِجَابٍۢ ۚ ذَٰلِكُمْ أَطْهَرُ لِقُلُوبِكُمْ وَقُلُوبِهِنَّ ﴾</span></p>
<p><strong>{ Et si vous leur demandez quelque objet, demandez-le leur derrière un rideau (<em>Hijab</em>) : c'est plus pur pour vos cœurs et leurs cœurs }</strong> [Al-Ahzab : 53].</p>
<p>Et selon la parole de Aïcha : « <em>Nous étions avec le Prophète <span dir="rtl">ﷺ</span> en état de sacralisation (Muhrimat). Lorsque des cavaliers passaient près de nous, l'une d'entre nous rabattait son voile (Khimar) sur son visage, et une fois qu'ils nous avaient dépassées, nous le relevions.</em> »<a href="#fn19" class="footnote-ref" id="fnref19" role="doc-noteref"><sup>19</sup></a></p>
<p>Ces textes, ainsi que tous ceux qui vont dans le même sens parmi le Livre (le Coran) et la Sunna — et ils sont nombreux et célèbres — démontrent que la femme est entièrement une nudité (<em>'awra</em>) devant les hommes étrangers. Il ne lui est pas permis de laisser apparaître quoi que ce soit de son corps en leur présence, que ce soit durant la prière ou en dehors. Cependant, lorsqu'elle prie dans un lieu exempt d'hommes étrangers, elle découvre son visage durant la prière ; car celui-ci n'est pas une nudité <em>pendant la prière</em>. Mais il est considéré comme une nudité en présence d'hommes qui ne sont pas ses proches parents (<em>Maharim</em>), et il ne leur est pas permis de le regarder.</p>
<p>Il est vraiment regrettable et affligeant de voir l'état dans lequel sont tombées beaucoup de femmes musulmanes de notre époque : déshonneur, négligence de la pudeur, précipitation à exposer leurs charmes et adoption de vêtements qui ne couvrent rien, par imitation des femmes mécréantes et apostates. Il n'y a de force et de puissance qu'en Allah, le Très-Haut, l'Immense.</p>
<p>Certes, Allah le Très-Haut a ordonné une mesure supplémentaire à la simple couverture de la nudité durant la prière : il s'agit de "se parer" (<em>Akhdh al-Zinah</em>). Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿ يٰبَنِيٓ ءَادَمَ خُذُوا۟ زِينَتَكُمْ عِندَ كُلِّ مَسْجِدٍ ﴾</span></p>
<p><strong>{ Ô fils d'Adam, portez votre parure à chaque lieu de prière }</strong> [Al-A'raf : 31].</p>
<p>Il a ordonné de se parer et non de se contenter de simplement couvrir sa nudité. Cela prouve qu'il convient au musulman de porter ses plus beaux et ses plus élégants vêtements pour se tenir devant Allah — Béni et Élevé soit-Il. Ainsi, le prieur se trouve dans cette position sous sa forme la plus parfaite, tant extérieurement qu'intérieurement.</p>
<h4 id="troisièmement-lévitement-de-limpureté"><strong>Troisièmement : L’évitement de l'impureté</strong></h4>
<p>Parmi les conditions requises pour la prière figure l’évitement de l'impureté ; le prieur doit s'en éloigner et en être totalement exempt sur son corps, son vêtement et l'endroit où il se tient pour prier.</p>
<p>L'impureté est une souillure spécifique qui, par sa nature, empêche la validité de la prière, comme la charogne, le sang, le vin, l'urine et les excréments.</p>
<p>Cela s'appuie sur la parole d'Allah le Très-Haut : <strong>{ Et tes vêtements, purifie-les }</strong> [Al-Muddathir : 4]. Ibn Sirin a dit : « Lave-les avec de l'eau ».</p>
<p>Le Prophète <span dir="rtl">ﷺ</span> a dit : <strong>« Préservez-vous de l'urine, car c'est la cause majeure du châtiment de la tombe »</strong>.<a href="#fn20" class="footnote-ref" id="fnref20" role="doc-noteref"><sup>20</sup></a> Il <span dir="rtl">ﷺ</span> a également ordonné à la femme de laver son vêtement s'il est atteint par le sang des menstrues, puis de prier avec.<a href="#fn21" class="footnote-ref" id="fnref21" role="doc-noteref"><sup>21</sup></a> Il a aussi ordonné de frotter les sandales [pour les nettoyer] avant de prier avec <a href="#fn22" class="footnote-ref" id="fnref22" role="doc-noteref"><sup>22</sup></a>, et a ordonné de verser de l'eau sur l'urine qui s'était trouvée dans la mosquée <a href="#fn23" class="footnote-ref" id="fnref23" role="doc-noteref"><sup>23</sup></a>... ainsi que d'autres preuves indiquant l'obligation d'éviter l'impureté.</p>
<p>Par conséquent, la prière n'est pas valide en présence d'une impureté sur le corps du prieur, son vêtement ou l'endroit où il prie, de même s'il porte sur lui un objet contenant une impureté.</p>
<p>Celui qui s'aperçoit de la présence d'une impureté sur lui après la prière, et ne sait pas à quel moment elle est apparue : sa prière est valide. De même, s'il en avait connaissance avant la prière mais qu'il a oublié de l'enlever : sa prière demeure valide selon l'avis prépondérant (<em>al-qawl al-rajih</em>).</p>
<p>En revanche, s'il apprend l'existence de l'impureté durant la prière et qu'il lui est possible de l'enlever sans effectuer de gestes excessifs — comme le fait d'enlever ses sandales ou son turban par exemple — il doit les retirer et poursuivre sa prière. S'il n'est pas en mesure de s'en débarrasser [immédiatement sans interrompre la prière], alors sa prière devient caduque (<em>butulat</em>).</p>
<p><strong>Et la prière n’est pas valide dans un cimetière,</strong> à l’exception de la prière funéraire (<em>Janaza</em>), conformément à la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">« الأَرْضُ كُلُّهَا مَسْجِدٌ إِلَّا الْمَقْبَرَةَ وَالْحَمَّامَ »</span></p>
<p>« <strong>"La terre entière est un lieu de prière (<em>Masjid</em>), sauf le cimetière et les bains (<em>Al-Hammam</em>)"</strong>, rapporté par les cinq à l’exception d'An-Nasa'i, et authentifié par At-Tirmidhi.<a href="#fn24" class="footnote-ref" id="fnref24" role="doc-noteref"><sup>24</sup></a></p>
<p>Et il <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="rtl">« لَا تُصَلُّوا إِلَى الْقُبُورِ وَلَا تَجْلِسُوا عَلَيْهَا »</span></p>
<p><strong>"Ne priez pas vers les tombes et ne vous asseyez pas dessus"</strong>, rapporté par la communauté [des savants du hadith] sauf Al-Bukhari. <a href="#fn25" class="footnote-ref" id="fnref25" role="doc-noteref"><sup>25</sup></a></p>
<p>Et il <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="rtl">« أَلَا فَلَا تَتَّخِذُوا الْقُبُورَ مَسَاجِدَ »</span></p>
<p><strong>"Prenez garde ! Ne prenez pas les tombes comme lieux de prière"</strong>.»<a href="#fn26" class="footnote-ref" id="fnref26" role="doc-noteref"><sup>26</sup></a></p>
<p>La raison de l'interdiction de prier dans les cimetières ou auprès des tombes n'est pas la crainte de l'impureté (<em>Najasa</em>). Elle réside plutôt dans la crainte de la sacralisation excessive des tombes et du fait de les prendre pour des idoles. La raison est donc de fermer la porte à tout ce qui pourrait mener à l'adoration de ceux qui sont enterrés. La prière funéraire (<em>Janaza</em>) est exclue de cette interdiction car le Prophète <span dir="rtl">ﷺ</span> l'a pratiquée dans un cimetière <a href="#fn27" class="footnote-ref" id="fnref27" role="doc-noteref"><sup>27</sup></a>; ceci est donc une exception spécifique. Tout ce qui entre dans l'appellation de "cimetière" (ce qui entoure les tombes) est concerné par l'interdiction de prier, car celle-ci englobe le cimetière et son enceinte.</p>
<p>Cheikh al-Islam Ibn Taymiyya a dit <a href="#fn28" class="footnote-ref" id="fnref28" role="doc-noteref"><sup>28</sup></a> concernant la mosquée construite sur une tombe : "<em>On n'y accomplit ni prière obligatoire, ni prière surérogatoire. Si la mosquée a été bâtie avant la tombe, on change soit la tombe par son nivellement, soit par son exhumation si elle est récente. Si la tombe était là avant la mosquée, alors soit on détruit la mosquée, soit on retire la structure [qui surplombe] la tombe.</em>"</p>
<p><strong>Et la prière n'est pas valide dans une mosquée dont la direction (<em>Qibla</em>) fait face à une tombe</strong>, conformément à la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">« لَا تُصَلُّوا إِلَى الْقُبُورِ »</span></p>
<p><strong>"Ne priez pas vers les tombes"</strong>.<a href="#fn29" class="footnote-ref" id="fnref29" role="doc-noteref"><sup>29</sup></a></p>
<p><strong>Et la prière n'est pas valide dans les "Hushûsh"</strong>, qui sont les lieux d'aisance (toilettes) préparés pour accomplir les besoins. Il est donc interdit de prier à l'intérieur du lieu d'aisance ؛ car il est destiné à l'impureté (Najâsah), et parce que le Législateur a interdit d'y mentionner le nom d'Allah ؛ la prière est donc, par excellence, plus digne d'interdiction. De plus, les lieux d'aisance sont fréquentés par les diables.</p>
<p><strong>Et la prière n'est pas valide dans le Hammam (la salle de bain)</strong>, qui est le lieu préparé pour le lavage (les ablutions majeures) ; car c'est un lieu où l'on découvre ses parties intimes (<em>'Awrah</em>) et un refuge pour les diables. L'interdiction inclut tout ce qui se trouve derrière la porte de la salle de bain ; il n'est donc pas permis d'y prier.</p>
<p><strong>Et la prière n'est pas valide dans les enclos/parcs à chameaux</strong>, qui sont les endroits où ils résident et se réfugient.</p>
<p>Le Cheikh Taqi al-Din a dit <a href="#fn30" class="footnote-ref" id="fnref30" role="doc-noteref"><sup>30</sup></a>: "<em>Il a été interdit de prier dans leurs enclos (ceux des chameaux) car ils sont le refuge des diables, tout comme il a été interdit de prier dans la salle de bain car elle est le refuge des diables. En effet, les refuges des esprits malfaisants méritent d'autant plus que l'on évite d'y prier.</em>"</p>
<p>Et il est détestable (<em>Makrûh</em>) de prier dans un lieu contenant des <strong>représentations</strong> (images ou statues). L'Imam Ibn al-Qayyim a dit : "<em>Et cela mérite encore plus d'être détesté que de prier dans la salle de bain. Car le caractère détestable de la prière dans la salle de bain est dû soit au fait que l'on y présume la présence d'impuretés, soit au fait que ce soit la demeure du diable — ce qui est l'avis correct — alors que le lieu contenant des images est un terrain propice au <strong>polythéisme</strong> (Shirk). La majeure partie du polythéisme des nations passées provenait justement des images et des tombes.</em>" <a href="#fn31" class="footnote-ref" id="fnref31" role="doc-noteref"><sup>31</sup></a></p>
<p>Ô Musulman ! Tu te dois de porter une attention particulière à ta prière. Purifie-toi donc de toute impureté avant d'y entrer, et évite les lieux où il est interdit de prier, afin que ta prière soit valide et conforme à ce qu'Allah a légiféré. Ne néglige aucune de ses règles et ne sois pas laxiste à leur sujet. Car ta prière est le pilier de ta religion : tant qu'elle est droite, ta religion est droite ; et dès qu'elle est défaillante, ta religion l'est aussi.</p>
<p>Qu'Allah nous accorde à tous la réussite dans ce qui contient le bien et la droiture.</p>
<h4 id="quatrièmement-se-diriger-vers-la-qibla."><strong>Quatrièmement : Se diriger vers la Qibla.</strong></h4>
<p>Parmi les conditions de la prière figure l'orientation vers la Qibla, qui est l'honorable <strong>Ka'ba</strong>. Elle est nommée ainsi car les gens se dirigent vers elle et parce que celui qui prie lui fait face. Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿فَوَلِّ وَجْهَكَ شَطْرَ الْمَسْجِدِ الْحَرَامِ وَحَيْثُ مَا كُنتُمْ فَوَلُّوا وُجُوهَكُمْ شَطْرَهُ﴾ [البقرة: ١٤٤]</span></p>
<p><em>« Tourne donc ton visage vers la Mosquée Sacrée. Où que vous soyez, tournez-y vos visages. »</em> [Sourate Al-Baqarah : 144].</p>
<p>Celui qui est proche de la Ka'ba et peut la voir a l'obligation de se diriger vers le <strong>corps même de la Ka'ba</strong> avec tout son corps ; car il est capable de viser précisément sa structure, il ne lui est donc pas permis de s'en détourner.</p>
<p>Celui qui est proche d'elle mais ne la voit pas (à cause d'un obstacle) doit faire un effort de jugement (<em>Ijtihâd</em>) pour viser sa direction le plus précisément possible.</p>
<p>Et celui qui est éloigné de la Ka'ba, où qu'il soit sur terre, doit se diriger vers la <strong>direction générale</strong> où se trouve la Ka'ba. Un léger décalage vers la droite ou vers la gauche n'est pas préjudiciable, conformément au hadith : <em>"Ce qui se trouve entre l'Orient et l'Occident est une Qibla"</em>, authentifié par At-Tirmidhî <a href="#fn32" class="footnote-ref" id="fnref32" role="doc-noteref"><sup>32</sup></a>. Cela s'applique aux habitants de Médine et aux villes situées sur le même axe. Il en va de même pour les autres pays : celui qui se trouve à l'Est, par exemple, aura sa Qibla située entre le Sud et le Nord, et il en est de même pour celui qui se trouve à l'Ouest.</p>
<p>Ainsi, la prière n'est pas valide sans l'orientation vers la Qibla, conformément à la parole du Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿وَحَيْثُ مَا كُنتُمْ فَوَلُّوا وُجُوهَكُمْ شَطْرَهُ﴾ [البقرة: ١٤٤]</span></p>
<p><em><strong>« Où que vous soyez, tournez-y vos visages »</strong></em> [Al-Baqarah : 144] ; c'est-à-dire : que vous soyez sur terre, dans les airs, en mer, à l'Orient ou à l'Occident. Exception est faite pour <strong>celui qui est incapable</strong> de se diriger vers la Ka'ba, comme la personne attachée ou crucifiée dans une autre direction que la Qibla, s'il est entravé et ne peut pas s'orienter lui-même. Celui-là prie selon ses capacités, même s'il ne fait pas face à la Qibla, car cette condition tombe en cas d'incapacité selon le consensus (<em>Ijmâ'</em>) des gens de science.</p>
<p>Il en va de même en cas de combat intense (guerre), ou pour celui qui fuit une inondation, un incendie, un fauve ou un ennemi, ainsi que le malade qui n'est pas en mesure de se tourner vers la Qibla. Tous ceux-là prient selon leur situation, même vers une autre direction que la Qibla, et leur prière est valide. Puisque c'est une condition qu'ils sont incapables de remplir, elle est levée. Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿فَاتَّقُوا اللَّهَ مَا اسْتَطَعْتُمْ﴾ [التغابن: ١٦]</span></p>
<p><em><strong>« Craignez Allah autant que vous le pouvez »</strong></em> [At-Taghâbun : 16], et le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="rtl">«وَإِذَا أَمَرْتُكُمْ بِأَمْرٍ؛ فَأْتُوا مِنْهُ مَا اسْتَطَعْتُمْ»</span></p>
<p><em>"<strong>Et si je vous ordonne une chose, accomplissez-en ce que vous pouvez</strong>"</em>.<a href="#fn33" class="footnote-ref" id="fnref33" role="doc-noteref"><sup>33</sup></a></p>
<p>Il est également rapporté dans le hadith faisant l'unanimité (<em>Muttafaq 'alayhi</em>)<a href="#fn34" class="footnote-ref" id="fnref34" role="doc-noteref"><sup>34</sup></a> qu'en cas de peur intense, ils (les croyants) prient en étant face à la Qibla ou non.</p>
<p>On peut déterminer la direction de la Qibla par de nombreux moyens, parmi lesquels:</p>
<ol type="1">
<li><blockquote>
<p><strong>L'information d'autrui :</strong> Si une personne responsable (<em>Mukallaf</em>), digne de confiance (<em>Thiqa</em>) et intègre (<em>'Adl</em>) l'informe de la direction, il doit agir selon cette information, à condition que l'informateur soit lui-même certain de la direction.</p>
</blockquote></li>
<li><blockquote>
<p><strong>Les Mihrabs islamiques :</strong> De même, s'il trouve des Mihrabs (niches de prière dans les mosquées), il s'y fie pour trouver la Qibla. En effet, le fait que les gens se dirigent continuellement vers ces Mihrabs prouve l'exactitude de leur orientation.</p>
</blockquote></li>
<li><blockquote>
<p><strong>Les étoiles :</strong> On peut également déduire la Qibla grâce aux étoiles, car Allah le Très-Haut a dit :</p>
</blockquote></li>
</ol>
<p class="ar"><span dir="rtl">﴿وَبِالنَّجْمِ هُمْ يَهْتَدُونَ﴾ [النحل: ١٦].</span></p>
<p><em>« Et c'est par les étoiles qu'ils se guident. »</em> [Sourate An-Nahl : 16]. »</p>
<h4 id="cinquièmement-lintention."><strong>Cinquièmement : L'Intention.</strong> </h4>
<p>Parmi les conditions de la prière figure l'intention (<em>An-Niyyah</em>).</p>
<p><strong>Linguistiquement,</strong> elle signifie "le dessein" ou "le but".</p>
<p><strong>Religieusement,</strong> c'est la ferme résolution d'accomplir un acte d'adoration pour se rapprocher d'Allah le Très-Haut.</p>
<p>Son siège est le <strong>cœur</strong> ; il n'est donc pas nécessaire de la prononcer oralement. C'est même une innovation (<em>Bid'ah</em>), car ni le Messager d'Allah <span dir="rtl">ﷺ</span> ni ses compagnons ne l'ont fait. Le fidèle définit donc dans son cœur la prière qu'il souhaite accomplir (comme celle du Dhohr ou de l'Asr), conformément au hadith : <em>"<strong>Les actions ne valent que par les intentions</strong>"</em> <a href="#fn35" class="footnote-ref" id="fnref35" role="doc-noteref"><sup>35</sup></a>. Il doit formuler cette intention au moment de la <em>Takbîrat al-Ihrâm</em> (la sacralisation initiale) afin qu'elle accompagne l'acte d'adoration. Toutefois, si l'intention précède de peu le début de la prière (dans le temps imparti), cela ne pose pas de problème.</p>
<p>Il est également requis que l'intention persiste durant toute la durée de la prière. S'il l'interrompt (décide d'arrêter) pendant la prière, celle-ci devient nulle.</p>
<p>Et il est permis à celui qui a commencé une prière obligatoire, qu'il soit dirigé par un imam (<em>Ma'mûm</em>) ou qu'il prie seul, de transformer sa prière en une prière surérogatoire (<em>Nâfilah</em>), si cela est fait pour un motif valable ; comme par exemple s'il commence à prier seul, puis qu'il souhaite finalement prier avec le groupe (la <em>Jamâ'ah</em>).</p>
<p>Sache que certaines personnes ont introduit dans l'intention une innovation (<em>Bid'ah</em>) et une rigueur excessive pour lesquelles Allah n'a fait descendre aucune preuve. Cela consiste à dire : "J'ai l'intention de prier l'obligation de telle prière, avec tel nombre de rak'ahs, pour Allah, derrière cet imam..." et autres formules similaires. C'est une chose que le Messager d'Allah <span dir="rtl">ﷺ</span> n'a jamais faite. Il n'a jamais été rapporté qu'il ait prononcé l'intention, que ce soit à voix basse ou à voix haute, et il ne l'a pas ordonné non plus.</p>
<p>Cheikh al-Islâm Ibn Taymiyyah (qu'Allah lui fasse miséricorde) a dit : « <em>Les imams sont tombés d'accord sur le fait qu'il n'est pas légiféré de prononcer l'intention à voix haute, ni de la répéter. Au contraire, celui qui en a pris l'habitude doit être réprimandé, et celui qui la prononce à voix haute mérite une sanction après avoir été instruit, surtout si cela cause une gêne ou s'il persiste... » jusqu'à ce qu'il dise : « Certains savants tardifs ont déduit une version allant dans ce sens au sein de l'école shafi'ite, mais la grande majorité des compagnons d'Ach-Châfi'î ont déclaré cela comme une erreur. Ach-Châfi'î avait dit : "La prière nécessite obligatoirement une parole à son début", et celui qui s'est trompé a pensé qu'il visait par là la prononciation de l'intention, alors qu'il visait uniquement le Takbîr (le fait de dire Allâhou Akbar)</em> ». Fin des propos du Cheikh. <a href="#fn36" class="footnote-ref" id="fnref36" role="doc-noteref"><sup>36</sup></a></p>
<p>La prononciation de l'intention, en plus d'être une innovation (<em>bid'ah</em>), peut également relever de l'ostentation (<em>riyâ’</em>). En effet, ce qui est requis est la sincérité de l'œuvre envers Allah et sa dissimulation, sauf pour ce dont la preuve a été rapportée quant à sa manifestation. Il convient donc au musulman de s'en tenir strictement aux limites de la Législation (<em>Charia</em>), en mettant en pratique les Sunna et en délaissant les innovations, quelle que soit leur nature et quelle qu'en soit l'origine.</p>
<p>« Et Allah le Très-Haut dit :</p>
<p class="ar"><span dir="rtl">﴿ قُلْ أَتُعَلِّمُونَ اللَّهَ بِدِينِكُمْ وَاللَّهُ يَعْلَمُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ وَاللَّهُ بِكُلِّ شَيْءٍ عَلِيمٌ ﴾ [الحجرات : ١٦] .</span></p>
<p><strong>"Dis : 'Est-ce vous qui allez apprendre à Allah votre religion, alors qu'Allah sait tout ce qui est dans les cieux et sur la terre ?' Et Allah est Omniscient."</strong> [Al-Hujurât : 16]. »</p>
<p>Allah connaît donc mieux que quiconque les intentions des cœurs et leurs finalités ; il n'est donc nullement besoin de les prononcer à haute voix pour la prière, ni pour l'ensemble des adorations. Et Allah Très-Haut est plus savant.</p>
<p>Qu'Allah accorde à tous la réussite dans ce qu'Il aime et agréé.</p>
