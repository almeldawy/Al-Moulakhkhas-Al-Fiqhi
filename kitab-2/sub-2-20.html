<p><strong>* C'est un rite immense parmi les rites de l'Islam</strong> : il s'agit de la prière en groupe dans les mosquées. Les musulmans sont en effet unanimes sur le fait que l'accomplissement des cinq prières [quotidiennes] dans les mosquées compte parmi les actes d'obéissance les plus confirmés et les plus grandes œuvres de rapprochement [vers Allah] , il s'agit même du rite de l'Islam le plus grandiose et le plus apparent.</p>
<p>Allah a certes légiféré pour cette communauté le fait de se rassembler à des moments déterminés. Parmi ces rassemblements , certains ont lieu de jour comme de nuit ، à l'instar des cinq prières. En effet ,les musulmans se réunissent pour les accomplir dans les mosquées chaque jour et nuit , à cinq reprises.</p>
<p>Parmi ces rassemblements, il en est qui ont lieu une fois par semaine, comme le rassemblement pour la prière du Vendredi (<em>Al-Jumu'ah</em>), qui est un rassemblement plus important que celui des cinq prières [quotidiennes].</p>
<p>Il en est aussi qui se répètent deux fois par an, à savoir le rassemblement pour les prières des deux fêtes (<em>Al-'Aïd</em>), qui est un rassemblement plus important que celui de la prière du Vendredi, de telle sorte qu'il est légiféré pour l'ensemble des habitants de la ville d'y participer.</p>
<p>Enfin, il en est un qui a lieu une fois par an : c'est le rassemblement pour la station à Arafat [pendant le Pèlerinage], qui est encore plus important que le rassemblement des deux fêtes, car il est légiféré pour les musulmans de manière générale, venant de toutes les contrées de la terre.</p>
<p>Ces grands rassemblements n'ont été légiférés en Islam que pour l'intérêt des musulmans ; afin que s'établisse entre eux un lien empreint de bienfaisance, de compassion et de sollicitude, et pour que naissent l'affection et l'amour dans les cœurs.</p>
<p>Également pour que les uns s'enquièrent de l'état des autres : ils peuvent ainsi rendre visite aux malades, accompagner les défunts [à leur dernière demeure] et secourir ceux qui sont dans la détresse.</p>
<p>C'est aussi pour manifester la force des musulmans, leur connaissance mutuelle et leur cohésion, irritant ainsi leurs ennemis parmi les mécréants et les hypocrites. Enfin, c'est pour dissiper ce que les démons (parmi les djinns et les hommes) tissent entre eux comme inimitié, rupture et rancœur. Ainsi s'installe l'harmonie et l'union des cœurs dans la piété et la crainte d'Allah.</p>
<p>C'est pour cela que le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><strong><span dir="rtl">« لَا تَخْتَلِفُوا؛ فَتَخْتَلِفَ قُلُوبُكُمْ »</span></strong></p>
<p><em><strong>"Ne divergez pas [dans vos rangs], car vos cœurs divergeraient alors." (1)</strong></em></p>
<p>Et parmi les bienfaits de la prière en groupe : l'enseignement à l'ignorant, la multiplication de la récompense, ainsi que l'élan (la motivation) vers les bonnes œuvres lorsque le musulman voit ses frères musulmans pratiquer des actions pieuses, il prend alors exemple sur eux.</p>
<p>Et dans le hadith faisant l'objet d'un consensus (<em>Muttafaqun 'alayh</em>), le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><strong><span dir="rtl">« صَلَاةُ الجَمَاعَةِ تَفْضُلُ عَلَى صَلَاةِ الفَذِّ بِسَبْعٍ وَعِشْرِينَ دَرَجَةً » (وفي رواية: «بِخَمْسٍ وَعِشْرِينَ»)</span></strong></p>
<p><em><strong>"La prière en groupe surpasse la prière de l'individu seul de vingt-sept degrés"</strong>. Et dans une autre version : <strong>"de vingt-cinq [degrés]"</strong>. (2)</em></p>
<p><strong>* La prière en groupe est donc une obligation pour l'homme</strong>, qu'il soit résident ou en voyage, en état de sécurité ou en état de peur. C'est une obligation individuelle (<em>Wâjib 'Aynî</em>). La preuve de cela réside dans le Livre [le Coran], la Sounna, et la pratique des musulmans de génération en génération, des prédécesseurs aux successeurs.</p>
<p>C'est pour cette raison que les mosquées ont été édifiées, que des imams et des muezzins y ont été nommés, et que l'appel y a été légiféré à voix haute par le : <strong>"Accourez à la prière, accourez à la réussite"</strong>.</p>
<p>Allah le Très-Haut a dit concernant l'état de peur :</p>
<p class="ar"><strong><span dir="rtl">﴿ وَإِذَا كُنْتَ فِيهِمْ فَأَقَمْتَ لَهُمُ الصَّلَاةَ فَلْتَقُمْ طَائِفَةٌ مِنْهُمْ مَعَكَ ﴾</span></strong></p>
<p><em><strong>{Et lorsque tu te trouves parmi eux, et que tu leur diriges la prière, qu'un groupe d'entre eux se mette debout avec toi...}</strong></em> [Sourate An-Nisâ, v.102].</p>
<p>Ce noble verset démontre avec force l'obligation de la prière en groupe, car il n'a pas été accordé de concession aux musulmans pour la délaisser même en état de peur.</p>
<p>Si elle n'était pas obligatoire, l'excuse de la peur aurait été la première cause de l'annulation de cette obligation. En effet, dans la "prière de la peur" (<em>Salât al-Khawf</em>), de nombreuses obligations de la prière sont délaissées ; si l'obligation du groupe n'était pas si confirmée, on n'aurait pas délaissé ces nombreuses obligations pour elle, car de nombreux actes sont tolérés dans la prière de la peur précisément pour [maintenir] le groupe.</p>
<p>Et dans le hadith faisant l'objet d'un consensus (<em>Muttafaqun 'alayh</em>), d'après Abou Hourayra (qu'Allah l'agrée), le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><strong><span dir="rtl">« أَثْقَلُ الصَّلَاةِ عَلَى المُنَافِقِينَ صَلَاةُ العِشَاءِ وَصَلَاةُ الفَجْرِ، وَلَوْ يَعْلَمُونَ مَا فِيهِمَا لَأَتَوْهُمَا وَلَوْ حَبْوًا، وَلَقَدْ هَمَمْتُ أَنْ آمُرَ بِالصَّلَاةِ فَتُقَامَ، ثُمَّ آمُرَ رَجُلًا فَيُصَلِّيَ بِالنَّاسِ، ثُمَّ أَنْطَلِقَ مَعِي بِرِجَالٍ مَعَهُمْ حُزَمٌ مِنْ حَطَبٍ إِلَى قَوْمٍ لَا يَشْهَدُونَ الصَّلَاةَ، فَأُحْرِقَ عَلَيْهِمْ بُيُوتَهُمْ بِالنَّارِ »</span></strong></p>
<p><em><strong>"Les prières les plus pesantes pour les hypocrites sont la prière du soir ('Ichâ) et la prière de l'aube (Fajr). S'ils savaient ce qu'elles contiennent [comme récompense], ils y seraient venus, ne serait-ce qu'à quatre pattes. J'ai certes failli ordonner que l'on appelle à la prière, puis d'ordonner à un homme de diriger la prière pour les gens, pour ensuite partir avec des hommes munis de fardeaux de bois vers des gens qui n'assistent pas à la prière [en groupe], afin de brûler leurs maisons sur eux." (3)</strong></em></p>
<p>La manière dont ce hadith prouve l'obligation de la prière en groupe se décline sous deux aspects :</p>
<p><strong>Le premier aspect :</strong> C'est qu'il [le Prophète <span dir="rtl">ﷺ</span>] a qualifié ceux qui s'en abstiennent d'hypocrites. Or, celui qui délaisse une simple Sounna (acte recommandé) n'est pas considéré comme un hypocrite ; cela prouve donc qu'ils se sont abstenus d'une obligation (<em>Wâjib</em>).</p>
<p><strong>Le deuxième aspect :</strong> C'est qu'il <span dir="rtl">ﷺ</span> a failli les châtier pour leur absence. Or, le châtiment ne s'applique que pour l'abandon d'une obligation. Ce qui a empêché le Prophète <span dir="rtl">ﷺ</span> de mettre ce châtiment à exécution, c'est la présence dans les foyers de femmes et d'enfants pour qui la prière en groupe n'est pas obligatoire.</p>
<p>Et dans le <em>Sahîh Muslim</em>, un homme aveugle dit : <em><strong>"Ô Messager d'Allah ! Je n'ai personne pour me guider vers la mosquée"</strong></em>. Il demanda alors une concession pour prier chez lui. Le Prophète <span dir="rtl">ﷺ</span> la lui accorda, puis, alors que l'homme s'en allait, il le rappela et lui dit : <em><strong>"Entends-tu l'appel [à la prière] ?"</strong></em>. Il répondit : <em><strong>"Oui"</strong></em>. Le Prophète dit alors : <em><strong>"Alors réponds-y [en venant à la mosquée]" (4)</strong></em>. Le Prophète <span dir="rtl">ﷺ</span> lui a donc ordonné de se rendre à la mosquée pour la prière en groupe et de répondre à l'appel malgré la difficulté qu'il rencontrait. Cela prouve l'obligation de la prière en groupe.</p>
<p>Cette obligation était d'ailleurs une chose établie chez les premiers membres de cette communauté :</p>
<p>Ibn Mas'ûd (qu'Allah l'agrée) a dit :</p>
<p class="ar"><strong><span dir="rtl">« لَقَدْ رَأَيْتُنَا وَمَا يَتَخَلَّفُ عَنْهَا إِلَّا مُنَافِقٌ مَعْلُومُ النِّفَاقِ ، وَلَقَدْ كَانَ الرَّجُلُ يُؤْتَى بِهِ يُهَادَى بَيْنَ الرَّجُلَيْنِ حَتَّى يُقَامَ فِي الصَّفِّ »</span></strong></p>
<p><em><strong>"Certes, nous avons vu une époque où nul ne s'absentait de la prière [en groupe] si ce n'est un hypocrite dont l'hypocrisie était notoire. On amenait alors l'homme soutenu par deux autres jusqu'à ce qu'il soit placé dans le rang." (5)</strong></em></p>
<p>Tout cela prouve que son caractère obligatoire était solidement établi chez les compagnons du Messager d'Allah <span dir="rtl">ﷺ</span>, et ils ne l'ont appris que de la part du Prophète <span dir="rtl">ﷺ</span>. Or, il est bien connu que toute chose dont l'absence n'est le fait que d'un hypocrite est une obligation individuelle (<em>Wâjib 'alâ al-A'yân</em>).</p>
<p>L'imam Ahmad et d'autres ont rapporté (en tant que parole prophétique) :</p>
<p class="ar"><strong><span dir="rtl">« الجَفَاءُ كُلُّ الجَفَاءِ، وَالكُفْرُ وَالنِّفَاقُ، مَنْ سَمِعَ مُنَادِيَ اللهِ يُنَادِي بِالصَّلَاةِ يَدْعُو إِلَى الفَلَاحِ؛ وَلَا يُجِيبُهُ »</span></strong></p>
<p><em><strong>"C'est le comble de la rudesse, de la mécréance et de l'hypocrisie, que d'entendre l'appel d'Allah invitant à la prière et à la réussite, et de ne pas y répondre." (6)</strong></em></p>
<p>Il est également confirmé par le hadith :</p>
<p class="ar"><strong><span dir="rtl">« يَدُ اللهِ عَلَى الجَمَاعَةِ، فَمَنْ شَذَّ؛ شَذَّ فِي النَّارِ »</span></strong></p>
<p><strong>"La main d'Allah est avec le groupe ; et quiconque s'en écarte, s'écarte vers l'Enfer." (7)</strong></p>
<p>On questionna Ibn 'Abbâs au sujet d'un homme qui prie la nuit (<em>Tahajjud</em>) et jeûne le jour, mais n'assiste pas à la prière du Vendredi ni au groupe. Il répondit : <strong>"Il est en Enfer." (8)</strong></p>
<p>Nous demandons à Allah le salut et le succès dans la connaissance de la vérité et son suivi. Certes, Il est Celui qui entend tout et qui répond aux invocations.</p>
<p><strong>Le statut de celui qui manque la prière en groupe et ce par quoi elle est constituée</strong></p>
<p><strong>* Celui qui manque la prière en groupe et prie seul se trouve dans l'un des deux cas suivants :</strong></p>
<p><strong>Le premier cas :</strong> Qu'il soit excusé pour son absence en raison d'une maladie ou d'une peur , alors que son habitude n'est pas de s'absenter sans excuse. À celui-là ، il est inscrit la récompense de celui qui a prié en groupe ، conformément au hadith authentique :</p>
<p class="ar"><strong><span dir="rtl">« إِذَا مَرِضَ العَبْدُ أَوْ سَافَرَ؛ كُتِبَ لَهُ مَا كَانَ يَعْمَلُ صَحِيحاً مُقِيماً »</span></strong></p>
<p><em><strong>« Si le serviteur tombe malade ou voyage , il lui est inscrit ce qu'il œuvrait en étant bien portant et résident ». (9)</strong></em></p>
<p>Ainsi , celui qui avait la ferme intention de prier en groupe , mais qu'une excuse légiférée en a empêché , est considéré comme ayant prié en groupe en raison de sa bonne intention.</p>
<p><strong>Le second cas :</strong> Que son absence à la prière en groupe soit sans excuse. Celui-là , s'il prie seul , sa prière est valide selon la majorité [des savants] , mais il perd une immense récompense et un salaire conséquent. En effet , la prière en groupe surpasse la prière individuelle de vingt-sept degrés. De même , il perd la récompense des pas qu'il aurait effectués vers la mosquée. En plus de la perte de cette immense récompense , il commet un grand péché car il a délaissé une obligation qui lui incombait sans excuse. Il a commis un acte blâmable pour lequel il doit être réprimandé et sanctionné par l'autorité musulmane , jusqu'à ce qu'il revienne à la raison.</p>
<p><strong>* Ô musulman !</strong> Le lieu de la prière en groupe, ce sont les mosquées ; afin de manifester les rites de l'Islam. L'entretien [et la fréquentation] des mosquées n'ont été légiférés que pour cela, et le fait d'accomplir la prière en groupe ailleurs qu'en leur sein constitue une entrave à leur fonction. Allah le Très-Haut a dit :</p>
<p class="ar"><strong><span dir="rtl">﴿ فِي بُيُوتٍ أَذِنَ اللَّهُ أَن تُرْفَعَ وَيُذْكَرَ فِيهَا اسْمُهُ يُسَبِّحُ لَهُ فِيهَا بِالْغُدُوِّ وَالْآصَالِ * رِجَالٌ لَّا تُلْهِيهِمْ تِجَارَةٌ وَلَا بَيْعٌ عَن ذِكْرِ اللَّهِ وَإِقَامِ الصَّلَاةِ وَإِيتَاءِ الزَّكَاةِ يَخَافُونَ يَوْمًا تَتَقَلَّبُ فِيهِ الْقُلُوبُ وَالْأَبْصَارُ ﴾</span></strong></p>
<p><strong>{Dans des maisons [des mosquées] qu'Allah a permis que l'on élève, et où Son Nom est invoqué ; Le glorifient en elles, matin et soir, des hommes que ni le négoce ni le troc ne distraient de l'invocation d'Allah, de l'accomplissement de la prière et de l'acquittement de la Zakât ; et qui redoutent un jour où les cœurs et les regards seront bouleversés.}</strong> [Sourate An-Nûr : 36-37].</p>
<p>Et le Très-Haut a dit :</p>
<p class="ar"><strong><span dir="rtl">﴿ إِنَّمَا يَعْمُرُ مَسَاجِدَ اللَّهِ مَنْ آمَنَ بِاللَّهِ وَالْيَوْمِ الْآخِرِ وَأَقَامَ الصَّلَاةَ ﴾</span></strong></p>
<p><strong>{Ne peuplent [et n'entretiennent] les mosquées d'Allah que ceux qui croient en Allah et au Jour dernier, accomplissent la prière...}</strong> [Sourate At-Tawbah : 18].</p>
<p>Dans ces deux nobles versets, il y a une mise en valeur des mosquées et de ceux qui les fréquentent, ainsi qu'une promesse d'une immense récompense. Par déduction, on y trouve également le blâme de celui qui s'abstient d'y assister pour la prière.</p>
<p>Il a certes été rapporté :</p>
<p class="ar"><strong><span dir="rtl">« لَا صَلَاةَ لِجَارِ الْمَسْجِدِ إِلَّا فِي الْمَسْجِدِ »</span></strong></p>
<p><strong>"Point de prière pour le voisin de la mosquée, si ce n'est à la mosquée."</strong> (10)</p>
<p>Et d'après 'Alî (qu'Allah l'agrée), il est rapporté la même chose avec l'ajout :</p>
<p class="ar"><strong><span dir="rtl">« وَجَارُ الْمَسْجِدِ مَنْ أَسْمَعَهُ الْمُنَادِي »</span></strong></p>
<p><strong>"Et le voisin de la mosquée est celui qui entend l'appelant [le Muezzin]."</strong> Rapporté par Al-Bayhaqî avec une chaîne de transmission authentique (<em>isnâd sahîh</em>). (11)</p>
<p><strong>Ibn al-Qayyim (qu'Allah lui fasse miséricorde) a dit :</strong> « <em>Quiconque médite la Sunna comme il se doit, il lui apparaîtra clairement que l'accomplissement de la prière dans les mosquées est une obligation individuelle (fard 'ayn), sauf en cas d'empêchement permettant de délaisser la prière en groupe. Ainsi, délaisser la présence aux mosquées sans excuse est comparable au fait de délaisser la base même de la prière en groupe sans excuse. C'est ainsi que les hadiths et l'ensemble des récits concordent...</em> » Fin de citation. (12)</p>
<p><strong>Allah a certes menacé quiconque désaffecte les mosquées ou empêche d'y accomplir la prière.</strong></p>
<p>Le Très-Haut a dit :</p>
<p class="ar"><strong><span dir="rtl">﴿وَمَنْ أَظْلَمُ مِمَّنْ مَنَعَ مَسَاجِدَ اللهِ أَنْ يُذْكَرَ فِيهَا اسْمُهُ وَسَعَى فِي خَرَابِهَا أُولَئِكَ مَا كَانَ لَهُمْ أَنْ يَدْخُلُوهَا إِلَّا خَائِفِينَ لَهُمْ فِي الدُّنْيَا خِزْيٌ وَلَهُمْ فِي الآخِرَةِ عَذَابٌ عَظِيمٌ﴾ [البقرة : ١١٤] .</span></strong></p>
<p><strong><em>« Qui est plus injuste que celui qui empêche que dans les mosquées d'Allah on mentionne Son Nom, et qui s'efforce de les détruire ? De tels gens ne devraient y entrer qu'en étant craintifs. Pour eux, il y aura une ignominie ici-bas ، et dans l'au-delà ، un énorme châtiment. »</em> [Al-Baqarah : 114].</strong></p>
<p>Le fait d'accomplir la prière en groupe en dehors de la mosquée entraîne la désertion des mosquées ou la diminution du nombre de fidèles qui s'y rendent. Par conséquent, cela conduit à amoindrir l'importance de la prière dans les cœurs. Or, Allah le Très-Haut dit :</p>
<p class="ar"><strong><span dir="rtl">﴿فِي بُيُوتٍ أَذِنَ اللهُ أَنْ تُرْفَعَ وَيُذْكَرَ فِيهَا اسْمُهُ﴾ [النور : ٣٦]</span></strong></p>
<p><strong><em>« Dans des maisons [des mosquées] qu'Allah a permis que l'on élève, et où Son Nom est invoqué. »</em> [An-Nur : 36].</strong></p>
<p>Cela inclut l'élévation tant matérielle (construction, entretien) que spirituelle (prière, rappel) , et tout cela est requis.</p>
<p><strong>Cependant, si un besoin appelle à accomplir la prière en groupe en dehors de la mosquée</strong> — comme dans le cas d'employés au sein de leur administration ou de leur complexe professionnel, où prier sur place serait plus rigoureux pour la gestion du travail et permettrait d'obliger les employés à assister à la prière et à l'accomplir — et que la mosquée environnante n'est pas pour autant désertée car d'autres personnes continuent d'y prier ، alors il se peut que dans ce cas précis — et au vu de ces justifications — il n'y ait pas de grief contre eux s'ils prient au sein de leur administration.</p>
<p><strong>*</strong> <strong>Le minimum requis pour constituer une prière en groupe est de deux personnes.</strong> En effet, le terme "groupe" (<em>jama'ah</em>) est dérivé du mot "réunion" (<em>ijtima'</em>), et deux personnes constituent le plus petit nombre par lequel un rassemblement est réalisé.</p>
<p>Ceci s'appuie sur le hadith d'Abu Moussa (rapporté de manière prophétique) :</p>
<p class="ar"><strong><span dir="rtl">«الِاثْنَانِ فَمَا فَوْقَهُمَا جَمَاعَةٌ»</span></strong></p>
<p><strong>« Deux personnes ou plus constituent un groupe »</strong> (rapporté par Ibn Majah). (13)</p>
<p>Également sur le hadith où le Prophète a dit :</p>
<p class="ar"><strong><span dir="rtl">«مَنْ يَتَصَدَّقُ عَلَى هَذَا؟»، فَقَامَ رَجُلٌ فَصَلَّى مَعَهُ، فَقَالَ : «هَذَانِ جَمَاعَةٌ»</span></strong></p>
<p><strong>« Qui veut faire l'aumône à celui-ci ? »</strong>, un homme s'est alors levé pour prier avec lui, et il a dit : <strong>« Ces deux-là sont un groupe »</strong> (rapporté par Ahmad et d'autres). (14)</p>
<p>Enfin, sur la parole du Prophète <span dir="rtl">ﷺ</span> à Malik ibn al-Huwayrith :</p>
<p class="ar"><strong><span dir="rtl">«وَلْيَؤُمَّكُمَا أَكْبَرُكُمَا»</span></strong></p>
<p><strong>« Que le plus âgé de vous deux dirige la prière » (15)</strong>. Un consensus (<em>Ijma'</em>) a été rapporté sur ce point.</p>
<p><strong>*</strong> <strong>Il est permis aux femmes d'assister à la prière en groupe dans les mosquées avec la permission de leurs époux</strong>, à condition qu'elles ne soient pas parfumées, qu'elles ne fassent pas étalage de leurs parures (<em>tabarruj</em>), qu'elles soient totalement couvertes et qu'elles évitent la mixité avec les hommes. Elles doivent se placer derrière les rangs des hommes, conformément à leur pratique à l'époque du Prophète <span dir="rtl">ﷺ</span>.</p>
<p><strong>Il leur est recommandé (<em>sunna</em>) d'assister aux cercles d'exhortation et de science</strong>, en restant séparées des hommes.</p>
<p><strong>Il leur est également recommandé de prier entre elles en groupe, à l'écart des hommes</strong>, que l'imam soit l'une d'entre elles ou qu'un homme dirige leur prière. En effet, le Prophète <span dir="rtl">ﷺ</span> a ordonné à Umm Waraqa de désigner un muezzin pour elle et lui a commandé de diriger la prière pour les gens de sa maison (rapporté par Ahmad et les auteurs des Sunan) (16). D'autres compagnes ont agi de même. Cela s'appuie aussi sur la portée générale de la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><strong><span dir="rtl">«تَفْضُلُ صَلَاةُ الجَمَاعَةِ عَلَى صَلَاةِ الفَذِّ بِسَبْعٍ وَعِشْرِينَ دَرَجَةً» .</span></strong></p>
<p><strong>« La prière en groupe surpasse la prière individuelle de vingt-sept degrés »</strong>. (16)</p>
<p><strong>Il est préférable pour le musulman de prier dans la mosquée où la prière en groupe ne peut avoir lieu que par sa présence.</strong> En agissant ainsi, il obtient la récompense liée à l'entretien (et au peuplement) des mosquées. Allah le Très-Haut a dit en effet :</p>
<p class="ar"><strong><span dir="rtl">﴿إِنَّمَا يَعْمُرُ مَسَاجِدَ اللهِ مَنْ آمَنَ بِاللَّهِ وَالْيَوْمِ الآخِرِ﴾ [التوبة : ١٨]</span></strong></p>
<p><strong><em>« Seuls peuplent les mosquées d'Allah ceux qui croient en Allah et au Jour dernier. »</em> [At-Tawbah : 18].</strong></p>
<p><strong>Ensuite, ce qui est préférable après cela, c'est la prière en groupe dans la mosquée qui compte le plus grand nombre de fidèles</strong>, car sa récompense est plus grande. Cela s'appuie sur la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><strong><span dir="rtl">«صَلَاةُ الرَّجُلِ مَعَ الرَّجُلِ أَزْكَى مِنْ صَلَاتِهِ وَحْدَهُ، وَصَلَاتُهُ مَعَ الرَّجُلَيْنِ أَزْكَى مِنْ صَلَاتِهِ مَعَ الرَّجُلِ، وَمَا كَانَ أَكْثَرَ؛ فَهُوَ أَحَبُّ إِلَى اللهِ»،</span></strong></p>
<p><em><strong>« La prière d'un homme avec un autre homme est plus pure (plus méritoire) que sa prière seul ; sa prière avec deux hommes est plus pure que sa prière avec un seul ; et plus le nombre est élevé, plus cela est aimé d'Allah. » (Rapporté par Ahmad et Abu Dawood, et authentifié par Ibn Hibban). (17)</strong></em></p>
<p><strong>Cela indique que plus le rassemblement est important, plus il est vertueux</strong>, en raison de la descente de la miséricorde et de la sérénité (la <em>Sakinah</em>) lors de tels regroupements, mais aussi pour la portée collective des invocations et l'espoir d'être exaucé, particulièrement si des savants et des gens vertueux sont présents. Allah le Très-Haut a dit :</p>
<p class="ar"><strong><span dir="rtl">﴿فِيهِ رِجَالٌ يُحِبُّونَ أَنْ يَتَطَهَّرُوا وَاللَّهُ يُحِبُّ الْمُطَّهِّرِينَ﴾ [التوبة : ١٠٨]</span></strong></p>
<p><em><strong>« On y trouve des gens qui aiment se purifier, et Allah aime ceux qui se purifient. » [At-Tawbah : 108].</strong></em></p>
<p>On en déduit qu'il est recommandé de prier avec des groupes de gens pieux qui veillent scrupuleusement à la pureté et à l'accomplissement parfait des ablutions (<em>isbagh al-woudhou</em>).</p>
<p><strong>Enfin, il est préférable après cela de prier dans la mosquée la plus ancienne</strong>, car les actes d'obéissance y ont été accomplis bien avant la nouvelle mosquée.</p>
<p><strong>Ensuite, ce qui est préférable après cela, c'est de prier dans la mosquée la plus éloignée en distance</strong>, car elle est plus méritoire que la mosquée proche. Cela s'appuie sur la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><strong><span dir="rtl">«أَعْظَمُ النَّاسِ أَجْراً فِي الصَّلَاةِ أَبْعَدُهُمْ فَأَبْعَدُهُمْ مَمْشًى»</span></strong></p>
<p>« <em><strong>Les gens qui ont la plus grande récompense pour la prière sont ceux qui ont le plus long trajet à parcourir.</strong></em> » (18)</p>
<p>En effet :</p>
<p class="ar"><strong><span dir="rtl">«أَحَدَكُمْ إِذَا تَوَضَّأَ فَأَحْسَنَ الوُضُوءَ، وَأَتَى المَسْجِدَ لَا يُرِيدُ إِلَّا الصَّلَاةَ؛ لَمْ يَخْطُ خُطْوَةً؛ إِلَّا رُفِعَ لَهُ بِهَا دَرَجَةً، وَحُطَّ عَنْهُ بِهَا خَطِيئَةً، حَتَّى يَدْخُلَ المَسْجِدَ»</span></strong></p>
<p><em><strong>« Lorsque l'un d'entre vous fait ses ablutions et les fait de manière parfaite, puis se rend à la mosquée avec pour seule intention de prier, il ne fait pas un pas sans qu'on ne l'élève d'un degré et qu'on ne lui efface un péché, jusqu'à ce qu'il entre dans la mosquée. » (19)</strong></em></p>
<p>Le Prophète <span dir="rtl">ﷺ</span> a également dit :</p>
<p class="ar"><strong><span dir="rtl">«يَا بَنِي سَلَمَةَ! دِيَارَكُمْ تُكْتَبْ آثَارُكُمْ»</span></strong></p>
<p><em><strong>« Ô Banu Salimah ! Restez dans vos demeures [actuelles], vos pas seront inscrits [à votre actif]. » (20)</strong></em></p>
<p><strong>Cependant, certains savants considèrent que la plus proche des deux mosquées est prioritaire</strong>, car elle a un droit de voisinage et mérite donc davantage que l'on y prie car il a été rapporté :</p>
<p class="ar"><strong><span dir="rtl">«لَا صَلَاةَ لِجَارِ المَسْجِدِ إِلَّا فِي المَسْجِدِ»</span></strong></p>
<p><em><strong>« Point de prière pour le voisin de la mosquée, si ce n'est à la mosquée. » (21)</strong></em></p>
<p>De plus, délaisser la mosquée proche pour une plus lointaine peut susciter l'étonnement des voisins. <strong>Cet avis est sans doute préférable</strong>, car dépasser la mosquée adjacente pour une autre pourrait mener à la désertion de la première et mettre son imam dans l'embarras, au point que l'on pourrait avoir de mauvais soupçons à son égard.</p>
<p><strong>* Parmi les règles de la prière en groupe : il est interdit à quiconque, autre que l'imam officiel (attitré), de diriger la prière dans la mosquée</strong>, sauf avec sa permission ou en cas d'empêchement de sa part. On trouve en effet dans le <em>Sahih Muslim</em> et d'autres recueils :</p>
<p class="ar"><strong><span dir="rtl">«وَلَا يَؤُمَّنَّ الرَّجُلُ الرَّجُلَ فِي سُلْطَانِهِ إِلَّا بِإِذْنِهِ»</span></strong></p>
<p><em><strong>« Qu'un homme ne dirige pas la prière d'un autre homme là où ce dernier détient l'autorité, sauf avec sa permission. » (22)</strong></em></p>
<p><strong>Al-Nawawi a dit :</strong> « <em><strong>Cela signifie que le maître de maison, l'hôte d'une assemblée et l'imam de la mosquée sont plus légitimes que quiconque d'autre [pour diriger].</strong></em> » (23)</p>
<p>Agir autrement constituerait une offense envers l'imam officiel, risquerait de s'aliéner les gens à son égard et de semer la division entre les musulmans.</p>
<p><strong>Certains savants vont jusqu'à considérer que si une personne autre que l'imam officiel dirige la prière du groupe sans sa permission</strong> ou sans excuse légale valable, leur prière n'est pas valide. Cela démontre la gravité de cette question ; il ne convient donc pas d'être négligent à ce sujet.</p>
<p><strong>Il incombe à la communauté des musulmans de respecter le droit de leur imam</strong> et de ne pas empiéter sur ses prérogatives. De la même manière, il incombe à l'imam de la mosquée de respecter le droit des fidèles priant derrière lui (<em>ma'mumin</em>) et de ne pas les mettre dans l'embarras (par exemple, en retardant la prière sans raison ou en l'allongeant excessivement).</p>
<p><strong>C’est ainsi que chacun doit respecter le droit de l’autre, afin que l’harmonie et l’entente règnent entre l’imam et les fidèles.</strong> Si l'imam tarde à arriver et que le temps de la prière arrive à sa fin (ou devient restreint), ils [les fidèles] peuvent alors prier.</p>
<p><strong>Ceci est fondé sur l'acte d'Abou Bakr As-Siddiq et de 'Abd al-Rahman ibn 'Awf (qu'Allah soit satisfait d'eux).</strong> En effet, alors que le Prophète <span dir="rtl">ﷺ</span> s'était absenté pour se rendre chez les Banu 'Amr ibn 'Awf afin de réconcilier des parties, Abou Bakr (qu'Allah soit satisfait de lui) a dirigé la prière. De même, 'Abd al-Rahman ibn 'Awf a dirigé la prière pour les gens lors d'une autre circonstance où le Prophète <span dir="rtl">ﷺ</span> avait pris du retard ; le Prophète <span dir="rtl">ﷺ</span> a alors prié la dernière unité de prière (<em>rak'ah</em>) derrière lui, puis a complété sa prière et a dit : <strong>« Vous avez bien agi »</strong>. (25)</p>
<p><strong>* Parmi les règles de la prière en groupe : celui qui a déjà accompli sa prière, puis assiste à l'annonce du début de la prière (<em>Iqamah</em>) dans une mosquée, il lui est recommandé (<em>sunna</em>) de prier avec le groupe cette prière qui commence.</strong> Cela se base sur le hadith d'Abou Dharr :</p>
<p class="ar"><strong><span dir="rtl">«صَلِّ الصَّلَاةَ لِوَقْتِهَا، فَإِنْ أُقِيمَتْ وَأَنْتَ فِي المَسْجِدِ؛ فَصَلِّ، وَلَا تَقُلْ : إِنِّي صَلَّيْتُ؛ فَلَا أُصَلِّي»</span></strong></p>
<p>« <em><strong>Accomplis la prière à son heure, et si l'on appelle à la prière alors que tu es dans la mosquée, alors prie, et ne dis pas : "J'ai déjà prié, je ne prie pas [à nouveau]"</strong></em> » (Rapporté par Muslim). (26)</p>
<p><strong>Cette seconde prière sera considérée pour lui comme une prière surérogatoire (<em>nafilah</em>)</strong>, comme l'indique un autre hadith où le Prophète <span dir="rtl">ﷺ</span> a dit aux deux hommes auxquels il avait ordonné de recommencer :</p>
<p class="ar"> <strong><span dir="rtl">«فَإِنَّهُمَا لَكُمَا نَافِلَةٌ»</span></strong></p>
<p><em><strong>« Elle sera pour vous deux une prière surérogatoire ». (27)</strong></em></p>
<p>De plus, rester assis alors que les gens prient pourrait être un prétexte pour que l'on ait une mauvaise opinion de lui ou que l'on pense qu'il ne fait pas partie des priants.</p>
<p><strong>Une autre règle de la prière en groupe est que lorsque l'on appelle à la prière — c'est-à-dire quand le muezzin commence l'Iqamah — il n'est plus permis de commencer une prière surérogatoire</strong>, qu'il s'agisse d'une <em>Sunna</em> régulière (<em>ratibah</em>), de la salutation de la mosquée (<em>tahiyyat al-masjid</em>) ou autre. Ceci est dû à la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><strong><span dir="rtl">«إِذَا أُقِيمَتِ الصَّلَاةُ؛ فَلَا صَلَاةَ إِلَّا المَكْتُوبَةُ»</span></strong></p>
<p><em><strong>« Quand l'Iqamah est prononcée, il n'y a plus de prière si ce n'est la prière obligatoire »</strong></em> (Rapporté par Muslim).</p>
<p>Dans une autre version :</p>
<p class="ar"><strong><span dir="rtl">«فَلَا صَلَاةَ إِلَّا الَّتِي أُقِيمَتْ»</span></strong></p>
<p><em><strong>« il n'y a plus de prière si ce n'est celle pour laquelle l'appel a été fait ».</strong></em> (28)</p>
<p>Par conséquent, toute prière surérogatoire commencée après l'Iqamah de la prière obligatoire que l'on souhaite accomplir avec cet imam n'est pas valide.</p>
<p><strong>L'imam Al-Nawawi (qu'Allah lui fasse miséricorde) a dit :</strong> « La sagesse [derrière l'interdiction de commencer une prière surérogatoire après l'Iqamah] est que le fidèle doit se rendre entièrement disponible pour la prière obligatoire dès son commencement, afin de la débuter immédiatement après l'imam. Préserver les éléments qui complètent la prière obligatoire est prioritaire sur le fait de s'occuper d'une prière surérogatoire. De plus, le Prophète <span dir="rtl">ﷺ</span> a interdit de diverger des imams. Enfin, cela permet de saisir la <em>Takbirat al-Ihram</em> (le premier "Allahu Akbar"), dont la vertu mentionnée dans les textes ne peut être obtenue qu'en étant présent lors de la sacralisation de l'imam. »<strong>(29)</strong></p>
<p><strong>*</strong> <strong>Si l'Iqamah retentit alors qu'il est déjà en train d'accomplir une prière surérogatoire commencée auparavant :</strong> il doit la terminer rapidement (en l'allégeant) sans l'interrompre, à moins qu'il ne craigne de manquer la prière en groupe. Ceci est fondé sur la parole d'Allah le Très-Haut :</p>
<p class="ar"><strong><span dir="rtl">﴿وَلَا تُبْطِلُوا أَعْمَالَكُمْ﴾ [محمد : ٣٣]</span></strong></p>
<p><em><strong>« Et ne rendez pas vaines vos œuvres » [Muhammad : 33].</strong></em></p>
<p>Cependant, s'il craint de manquer la prière en groupe, il doit alors interrompre la prière surérogatoire, car l'obligation (<em>al-fard</em>) est plus importante.</p>
