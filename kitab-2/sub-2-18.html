<p><strong>* Les auteurs des Sunan</strong> ont rapporté que le Prophète <span dir="rtl">ﷺ</span> fut interrogé : « Quelle est la meilleure prière après les prières obligatoires ? » Il répondit : « <em><strong>La prière au cœur de la nuit.</strong></em> » (1)</p>
<p>Et il a dit <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><strong><span dir="rtl">«إِنَّ فِي اللَّيْلِ سَاعَةً، لَا يُوَافِقُهَا عَبْدٌ مُسْلِمٌ، يَسْأَلُ اللهَ خَيْراً مِنْ أَمْرِ الدُّنْيَا وَالْآخِرَةِ؛ إِلَّا أَعْطَاهُ إِيَّاهُ وَذَلِكَ كُلَّ لَيْلَةٍ»</span></strong></p>
<p>« <em><strong>Il y a certes durant la nuit une heure ، durant laquelle aucun serviteur musulman ne demande à Allah un bien de ce bas monde ou de l'au-delà sans qu'Allah ne le lui accorde ، et cela chaque nuit.</strong></em> » (2)</p>
<p>Et il a dit <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><strong><span dir="rtl">«عَلَيْكُمْ بِقِيَامِ اللَّيْلِ؛ فَإِنَّهُ دَأْبُ الصَّالِحِينَ قَبْلَكُمْ، وَهُوَ قُرْبَةٌ إِلَى رَبِّكُمْ، وَمُكَفِّرَةٌ لِلسَّيِّئَاتِ، وَمَنْهَاةٌ عَنِ الإِثْمِ»</span></strong></p>
<p>« <em><strong>Attachez-vous à la prière de nuit , car c'est la coutume des pieux avant vous , un moyen de se rapprocher de votre Seigneur , une expiation pour les péchés et un empêchement contre le péché.</strong></em> » Rapporté par Al-Hâkim. (3)</p>
<p><strong>* Et Allah a certes fait l'éloge</strong> de ceux qui se lèvent la nuit :</p>
<p>Le Très-Haut a dit :</p>
<p class="ar"><strong><span dir="rtl">قَالَ تَعَالَى: ﴿... إِنَّهُمْ كَانُوا قَبْلَ ذَلِكَ مُحْسِنِينَ ۝١٦ كَانُوا قَلِيلاً مِّنَ الَّيْلِ مَا يَهْجَعُونَ ۝١٧ وَبِالْأَسْحَارِ هُمْ يَسْتَغْفِرُونَ ۝١٨﴾ [الذاريات].</span></strong></p>
<p><em><strong>« ... car ils étaient auparavant des bienfaisants. Ils dormaient peu la nuit ، et aux premières heures de l'aube , ils demandaient pardon. » [Az-Zâriyât, 16-18].</strong></em></p>
<p>Le Très-Haut a dit :</p>
<p class="ar"><strong><span dir="rtl">وَقَالَ تَعَالَى: ﴿تَتَجَافَى جُنُوبُهُمْ عَنِ الْمَضَاجِعِ يَدْعُونَ رَبَّهُمْ خَوْفاً وَطَمَعاً وَمِمَّا رَزَقْنَهُمْ يُنفِقُونَ ۝١٦ فَلَا تَعْلَمُ نَفْسٌ مَّا أُخْفِيَ لَهُم مِّن قُرَّةِ أَعْيُنٍ جَزَاءً بِمَا كَانُوا يَعْمَلُونَ ۝١٧﴾ [السجدة].</span></strong></p>
<p><em><strong>« Leurs flancs s'arrachent de leurs lits pour invoquer leur Seigneur avec crainte et espoir , et ils dépensent de ce que Nous leur avons attribué. Aucun être ne sait ce qu'on a réservé pour eux comme réjouissance pour les yeux ، en récompense de ce qu'ils œuvraient. » [As-Sajdah, 16-17].</strong></em></p>
<p>Les textes à ce sujet sont nombreux et prouvent le mérite de la prière de nuit. La meilleure forme de prière surérogatoire absolue est donc la prière de nuit , car elle est plus propice au secret (discrétion) et plus proche de la sincérité (Ikhlâs). Elle se déroule également à un moment où les gens sont insouciants (dorment) , et elle témoigne de la préférence donnée à l'obéissance sur le sommeil et le repos.</p>
<p><strong>* Il est recommandé</strong> d'accomplir des prières surérogatoires à tout moment, à l'exception des moments d'interdiction. La prière de nuit est meilleure que la prière de jour, pour les raisons mentionnées précédemment. La meilleure partie de la nuit pour prier est le tiers de la nuit qui suit la moitié de celle-ci.</p>
<p>Conformément à ce qui est rapporté dans le <em>Sahih</em> (Al-Bukhari/Muslim) de manière prophétique :</p>
<p class="ar"><span dir="rtl">«أَفْضَلُ الصَّلَاةِ صَلَاةُ دَاوُدَ، كَانَ يَنَامُ نِصْفَ اللَّيْلِ، وَيَقُومُ ثُلُثَهُ، وَيَنَامُ سُدُسَهُ»</span></p>
<p>« <em><strong>La meilleure prière est celle de [le prophète] David : il dormait la moitié de la nuit, en priait un tiers, et dormait le dernier sixième.</strong></em> » (4)</p>
<p>Ainsi, il reposait son corps en dormant la première partie de la nuit, puis se levait au moment où Allah appelle en disant : « <em><strong>Y a-t-il quelqu'un qui m'invoque pour que je l'exauce ?</strong></em> ». Ensuite, il dormait le reste de la nuit (le dernier sixième) pour se reposer, afin d'accueillir la prière de l'aube (<em>Al-Fajr</em>) avec dynamisme. Cela est le plus méritoire ; autrement, la nuit entière est propice à la prière.</p>
<p>L'Imam Ahmad (qu'Allah lui fasse miséricorde) a dit : « <em><strong>La prière de nuit s'étend du coucher du soleil (Al-Maghrib) jusqu'à l'aube (Al-Fajr).</strong></em> » (5)</p>
<p>Par conséquent, la prière surérogatoire entre les deux prières du soir (Maghrib et 'Icha) fait partie de la prière de nuit. Cependant, retarder cette prière jusqu'à la fin de la nuit est préférable, comme mentionné plus haut. Le Très-Haut a dit :</p>
<p class="ar"><strong><span dir="rtl">﴿إِنَّ نَاشِئَةَ الَّيْلِ هِيَ أَشَدُّ وَطْئًا وَأَقْوَمُ قِيلًا ۝٦﴾ [المزمل]</span></strong></p>
<p><em><strong>« La prière pendant la nuit est plus efficace et plus propice à la concentration. » [Al-Muzzammil, 6].</strong></em></p>
<p>Le terme <em>Nashiah</em> désigne le fait de se lever après avoir dormi ; et le <em>Tahajjud</em> (prière de nuit) ne se fait précisément qu'après le sommeil.</p>
<p><strong>* Il convient donc au musulman</strong> de s'attribuer une part de prière de nuit (Qiyâm al-Layl) à laquelle il s'astreint avec régularité, même si elle est de courte durée.</p>
<p>– Et il convient d'avoir l'intention (Niyyah) de se lever pour la prière de nuit [avant de s'endormir].</p>
<p>– Lorsqu'il se réveille, il utilise le siwak (se brosse les dents), évoque Allah et dit :</p>
<p class="ar"><span dir="rtl">«لَا إِلَهَ إِلَّا اللهُ وَحْدَهُ، لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ، وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ. الْحَمْدُ للهِ، وَسُبْحَانَ اللهِ، وَلَا إِلَهَ إِلَّا اللهُ، وَاللهُ أَكْبَرُ، وَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللهِ</span></p>
<p>« <em>Il n'y a de divinité digne d'adoration qu'Allah, Seul, sans associé. À Lui la royauté et à Lui la louange, et Il est Capable de toute chose. Louange à Allah, gloire à Allah, il n'y a de divinité digne d'adoration qu'Allah, Allah est le plus Grand, et il n'y a de force ni de puissance qu'en Allah.</em> »</p>
<p>Et il dit :</p>
<p class="ar"><span dir="rtl">الْحَمْدُ للهِ الَّذِي أَحْيَانِي بَعْدَمَا أَمَاتَنِي وَإِلَيْهِ النُّشُورُ، الْحَمْدُ للهِ الَّذِي رَدَّ عَلَيَّ رُوحِي، وَعَافَانِي فِي جَسَدِي، وَأَذِنَ لِي بِذِكْرِهِ»</span></p>
<p>« <em>Louange à Allah qui m'a redonné la vie après m'avoir fait mourir, et vers Lui se fera le retour. Louange à Allah qui m'a rendu mon âme, a préservé mon corps et m'a permis de L'évoquer.</em> »</p>
<p>– Et il est recommandé de commencer son <em>Tahajjud</em> par deux unités de prière (Rak'ahs) brèves, conformément au hadith d'Abou Hourayrah :</p>
<p class="ar"><strong><span dir="rtl">« إِذَا قَامَ أَحَدُكُمْ مِنَ اللَّيْلِ ؛ فَلْيَفْتَتِحْ صَلَاتَهُ بِرَكْعَتَيْنِ خَفِيفَتَيْنِ »</span></strong></p>
<p>« <em><strong>Lorsque l'un de vous se lève la nuit, qu'il commence sa prière par deux unités brèves.</strong></em> » Rapporté par Muslim et d'autres. (6)</p>
<p>– On donne le salut final dans la prière de nuit toutes les deux unités de prière (<em>rak'atayn</em>) ، en raison de la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><strong><span dir="rtl">« صَلَاةُ اللَّيْلِ مَثْنَى مَثْنَى »</span></strong></p>
<p>« <em><strong>La prière de nuit se fait deux par deux</strong></em> » (Rapporté par l'ensemble du groupe [Al-Jamâ'ah]). (7)</p>
<p>Le sens de « <em><strong>deux par deux</strong></em> » est : deux unités suivies de deux unités ، avec un <em>Tashahhoud</em> et deux salutations finales ; elle est donc binaire et non constituée de quatre unités.</p>
<p>– Il convient de prolonger la station debout (<em>Al-Qiyâm</em>) ، l'inclinaison (<em>Ar-Roukoû'</em>) et la prosternation (<em>As-Soujoûd</em>).</p>
<p>– Il convient que sa prière de nuit (<em>Tahajjoud</em>) se fasse chez lui. En effet, les gens de science se sont accordés sur le fait que la prière volontaire à la maison est meilleure. Le Prophète <span dir="rtl">ﷺ</span> priait dans sa demeure et a dit :</p>
<blockquote>
<p class="ar"><strong><span dir="rtl">« صَلُّوا فِي بُيُوتِكُمْ ؛ فَإِنَّ أَفْضَلَ صَلَاةِ المَرْءِ فِي بَيْتِهِ ؛ إِلَّا المَكْتُوبَةَ »</span></strong></p>
</blockquote>
<p>« <em><strong>Priez dans vos maisons ; car certes, la meilleure prière de l'homme est celle accomplie dans sa maison , à l'exception de la prière obligatoire.</strong></em> » (Rapporté par Mouslim) (8). Cela est également plus proche de la sincérité (Al-Ikhlâs).</p>
<p>– La prière surérogatoire effectuée debout est meilleure que la prière effectuée assis sans excuse ، en raison de sa parole <span dir="rtl">ﷺ</span> :</p>
<blockquote>
<p class="ar"><strong><span dir="rtl">« مَنْ صَلَّى قَائِمًا ؛ فَهُوَ أَفْضَلُ ، وَمَنْ صَلَّى قَاعِدًا ؛ فَلَهُ نِصْفُ أَجْرِ صَلَاةِ القَائِمِ »</span></strong></p>
</blockquote>
<p>« <em><strong>Celui qui prie debout , cela est meilleur. Et celui qui prie assis a la moitié de la récompense de celui qui prie debout.</strong></em> » (Consensus [Al-Boukhârî et Mouslim]) (9).</p>
<p>– Quant à celui qui prie la prière surérogatoire assis en raison d'une excuse ، sa récompense est équivalente à celle de celui qui prie debout ، en raison de sa parole <span dir="rtl">ﷺ</span> :</p>
<blockquote>
<p class="ar"><strong><span dir="rtl">« إِذَا مَرِضَ العَبْدُ أَوْ سَافَرَ ؛ كُتِبَ لَهُ مِنَ العَمَلِ مَا كَانَ يَعْمَلُ مُقِيمًا صَحِيحًا »</span></strong></p>
</blockquote>
<p>« <em><strong>Lorsqu'un serviteur tombe malade ou voyage , il lui est inscrit l'équivalent des œuvres qu'il accomplissait lorsqu'il était résident et en bonne santé.</strong></em> » (10) L'autorisation de prier les actes volontaires assis tout en ayant la capacité de se tenir debout fait l'objet d'un consensus.</p>
<p>– On clôture sa prière par le <em>Witr</em>. En effet, le Prophète <span dir="rtl">ﷺ</span> faisait de la fin de sa prière nocturne un <em>Witr</em> (un nombre impair d'unités) ، et il a ordonné cela dans de nombreux hadiths.</p>
<p><strong>* Rattraper la prière de nuit :</strong> Celui qui a manqué son <strong>Tahajjoud</strong> (prière de nuit), il lui est recommandé de le rattraper avant la prière du <strong>Dhohr</strong>. Ceci en raison du hadith :</p>
<p class="ar"><strong><span dir="rtl">« مَنْ نَامَ عَنْ حِزْبِهِ ، أَوْ عَنْ شَيْءٍ مِنْهُ مِنَ اللَّيْلِ ، فَقَرَأَهُ مَا بَيْنَ صَلَاةِ الْفَجْرِ وَصَلَاةِ الظُّهْرِ ؛ كُتِبَ لَهُ ، كَأَنَّمَا قَرَأَهُ مِنَ اللَّيْلِ »</span></strong></p>
<p>« <em><strong>Celui qui s'endort sans avoir accompli sa partie habituelle de prière (Hizb), ou une partie de celle-ci durant la nuit, et qui la récite entre la prière de l'Aube (Fajr) et la prière du Dhohr, elle lui sera inscrite comme s'il l'avait récitée durant la nuit.</strong></em> » (11)(Rapporté par Muslim).</p>
<p>Ô musulman ! Ne te prive pas de participer à la prière de nuit (Qiyâm al-Layl), ne serait-ce que par une petite quantité d'adoration que tu accomplis avec régularité. Afin que tu puisses obtenir la récompense de ceux qui prient la nuit et de ceux qui implorent le pardon aux heures précédant l'aube (Al-Ashâr). Peut-être que ce peu t'amènera vers beaucoup, et Allah ne laisse pas perdre la récompense des bienfaisants.</p>
