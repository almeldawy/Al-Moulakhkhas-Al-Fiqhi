  <template id="chapter-content">
<p>Sachez que votre Seigneur <span dir="rtl">ﷻ</span> a légiféré pour vous, parallèlement aux prières obligatoires, le fait de se rapprocher de Lui par des prières surérogatoires (nawâfil). Ainsi, accomplir des prières volontaires compte parmi les meilleures œuvres de rapprochement après le Jihad dans le sentier d'Allah et la recherche de la science ؛ en raison de la persévérance du Prophète <span dir="rtl">ﷺ</span> à se rapprocher de son Seigneur par les prières surérogatoires. Et il a dit, que la prière et le salut soient sur lui : "Attachez-vous à la droiture bien que vous ne puissiez pas tout accomplir، et sachez que la meilleure de vos œuvres est la prière." (1).</p>
<p>La prière réunit diverses formes d'adoration, telles que : la récitation (du Coran), l'inclinaison, la prosternation, l'invocation, l'humilité, la soumission, l'entretien intime avec le Seigneur <span dir="rtl">ﷻ</span>, la glorification (<em>Takbîr</em>), l'exaltation (<em>Tasbîh</em>) et la prière sur le Prophète <span dir="rtl">ﷺ</span>.</p>
<p><strong>* Les prières surérogatoires (At-Tatawwu‘) sont de deux types :</strong></p>
<ol type="1">
<li><blockquote>
<p><strong>Le premier type :</strong> Des prières liées à des moments précis, que l'on appelle les <strong>actes surérogatoires restreints</strong> (ou <strong>déterminés</strong>) <strong>(An-Nawâfil Al-Muqayyadah)</strong>.</p>
</blockquote></li>
<li><blockquote>
<p><strong>Le second type :</strong> Des prières qui ne sont pas liées à des moments précis, que l'on appelle les <strong>actes surérogatoires absolus</strong> (ou <strong>libres</strong>) <strong>(An-Nawâfil Al-Mutlaqah)</strong>.</p>
</blockquote></li>
</ol>
<p>Le premier type (les prières restreintes) comprend plusieurs catégories, dont certaines sont plus recommandées (<em>âkad</em>) que d'autres. La plus importante d'entre elles est la prière de l'éclipse (<em>Al-Kusûf</em>), puis la prière pour la demande de pluie (<em>Al-Istisqâ'</em>), puis la prière du Tarâwîh, puis la prière du Witr. Chacune de ces prières fera l'objet d'une explication spécifique par la suite, si Allah le Très-Haut le veut.</p>
<h4 id="sources"><strong>Sources</strong>: </h4>
<p>(1) Rapporté par Ibn Majah (277), Ahmad (5/276), et d'après lui Al-Hakim (1/220) qui l'a authentifié.</p>
