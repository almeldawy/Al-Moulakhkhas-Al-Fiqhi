<p><strong>Le détournement (le fait de regarder ailleurs) avec le visage ou le buste est détestable (Makrûh)</strong> durant la prière, conformément à la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><strong><span dir="rtl">« هُوَ اخْتِلاسٌ يَخْتَلِسُهُ الشَّيْطَانُ مِنْ صَلاةِ الْعَبْدِ »</span></strong></p>
<p><em><strong>« C'est un vol que le Diable dérobe à la prière du serviteur » (rapporté par Al-Bukhârî).</strong></em> (1)</p>
<p>À moins que cela ne soit par nécessité ; dans ce cas, il n'y a pas de mal, comme en cas de peur (lors d'un combat) ou pour un motif valable.</p>
<p>Cependant, si la personne se détourne avec <strong>tout son corps</strong>, ou si elle tourne le dos à la Kaaba en dehors d'un cas de peur, sa prière est <strong>annulée</strong>, car elle a délaissé l'obligation de faire face à la Qibla sans excuse valable.<br />
Il apparaît donc clairement que le détournement pendant la prière en cas de peur ne pose pas de problème, car cela fait partie des nécessités du combat.</p>
<p>Si cela se produit en dehors du cas de peur :</p>
<ul>
<li><blockquote>
<p>Si c'est uniquement avec le visage et le buste, et que c'est par <strong>nécessité</strong>, il n'y a pas de mal.</p>
</blockquote></li>
<li><blockquote>
<p>Si c'est <strong>sans nécessité</strong>, c'est détestable (Makrûh).</p>
</blockquote></li>
<li><blockquote>
<p>Si c'est avec <strong>tout le corps</strong>, la prière est annulée.</p>
</blockquote></li>
</ul>
<p><strong>Il est également détestable de lever les yeux vers le ciel</strong> durant la prière. Le Prophète <span dir="rtl">ﷺ</span> a fermement désapprouvé ceux qui font cela en disant :</p>
<p class="ar"><strong><span dir="rtl">« مَا بَالُ أَقْوَامٍ يَرْفَعُونَ أَبْصَارَهُمْ إِلَى السَّمَاءِ فِي صَلاتِهِمْ ؟! لَيَنْتَهُنَّ عَنْ ذَلِكَ أَوْ لَتُخْطَفَنَّ أَبْصَارُهُمْ »</span></strong></p>
<p><em><strong>« Qu'ont donc des gens à lever leurs regards vers le ciel durant leur prière ? ». Il a insisté sur ce point jusqu'à dire : « Qu'ils cessent cela, ou alors leurs regards leur seront ravis (ils risquent de perdre la vue) » (rapporté par Al-Bukhârî).</strong></em> (2)</p>
<p>Il a déjà été mentionné précédemment que le regard de celui qui prie doit être dirigé vers <strong>l'endroit de sa prosternation</strong>.</p>
<p>Il ne convient donc pas qu'il laisse errer son regard sur ce qui se trouve devant lui, comme les murs, les motifs (décorations), les inscriptions ou autres choses semblables, car cela <strong>le distrait de sa prière</strong>.</p>
<p><strong>Il est détestable (Makrûh)</strong>, durant la prière, de <strong>fermer les yeux sans nécessité</strong>, car cela fait partie des pratiques des Juifs. Cependant, si le fait de fermer les yeux répond à un <strong>besoin</strong>, comme s'il y a devant lui quelque chose qui perturbe sa prière (tels que des ornements ou des décorations), alors il n'est pas détestable de fermer les yeux pour s'en protéger. C'est là le sens de ce qu'a mentionné <strong>Ibn al-Qayyim</strong>, que Dieu lui fasse miséricorde.</p>
<p><strong>Il est détestable (Makrûh)</strong>, durant la prière, de pratiquer l'<strong>Iq'â'</strong> lors de la position assise. Cela consiste à étaler ses pieds au sol et à s'asseoir sur ses talons.</p>
<p>Ceci conformément à la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><strong><span dir="rtl">"إِذَا رَفَعْتَ رَأْسَكَ مِنَ السُّجُودِ؛ فَلا تَقْعِ كَمَا يَقْعِي الكَلْبُ"</span></strong></p>
<p><em><strong>"Lorsque tu relèves ta tête de la prosternation, ne t'assieds pas à la manière dont s'accroupit le chien." (Rapporté par Ibn Majah (3)</strong></em></p>
<p>ainsi que d'autres hadiths allant dans le même sens).</p>
<p><strong>Il est détestable</strong>, durant la prière, de <strong>s'appuyer contre un mur</strong> (ou tout autre support similaire) pendant la station debout, sauf en cas de nécessité. En effet, cela élimine l'effort requis par la station debout. Si cela est fait par nécessité — comme pour une maladie ou autre — alors il n'y a pas de mal.</p>
<p><strong>Il est détestable,</strong> durant la prière, d'étendre ses avant-bras au moment de la prosternation (as-Sujûd) ; cela consiste à les allonger sur le sol en les y collant. Le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><strong><span dir="rtl">«اعْتَدِلُوا فِي السُّجُودِ، وَلَا يَبْسُطْ أَحَدُكُمْ ذِرَاعَيْهِ انْبِسَاطَ الْكَلْبِ»، مُتَّفَقٌ عَلَيْهِ</span></strong></p>
<p><em><strong>« Soyez équilibrés dans la prosternation, et que l'un d'entre vous n'étende pas ses avant-bras à la manière d'un chien. » (Rapporté par Al-Bukhârî et Muslim). (4)</strong></em></p>
<p>Et dans un autre hadith :</p>
<p class="ar"><strong><span dir="rtl">«اعْتَدِلُوا فِي السُّجُودِ وَلَا يَفْتَرِشْ أَحَدُكُمْ ذِرَاعَيْهِ افْتِرَاشَ الْكَلْبِ »</span></strong></p>
<p><em><strong>« Soyez équilibrés dans la prosternation et que l'un d'entre vous ne pose pas ses avant-bras au sol à la manière d'un chien. » (5)</strong></em></p>
<p><strong>Il est détestable (Makruh),</strong> durant la prière, de s'agiter inutilement (al-'Abath) — ce qui correspond au fait de jouer — et de faire des gestes sans intérêt avec la main, le pied, la barbe, le vêtement ou autre. En fait également partie le fait d'essuyer le sol sans nécessité.</p>
<p><strong>Il est également détestable</strong>, durant la prière, de poser les mains sur les hanches (<em>at-Takhassur</em>). Cela consiste à placer la main sur la taille, qui est la partie affinée située au-dessus de la crête iliaque (os de la hanche).</p>
<p>Ceci est dû au fait que cette posture est une pratique des mécréants et des orgueilleux, et il nous a été interdit de leur ressembler. Il a d'ailleurs été confirmé dans un hadith (rapporté par Al-Bukhârî et Muslim) l'interdiction pour l'homme de prier avec les mains sur les hanches. (6)</p>
<p><strong>Il est également détestable (Makruh)</strong>, durant la prière, de faire craquer ses doigts et de les croiser (en entrelaçant les doigts des deux mains).</p>
<p><strong>Il est également détestable</strong> de prier en ayant devant soi quelque chose qui dissipe l'attention ou qui distrait, car cela empêche le fidèle d'accomplir sa prière de manière complète (avec une concentration totale).</p>
<p><strong>Il est détestable</strong> de prier dans un endroit contenant des images (représentations figurées) ; en raison de la ressemblance que cela présente avec l'adoration des idoles, que l'image soit érigée (exposée) ou non, selon l'avis correct. »</p>
<p><strong>Il est également détestable</strong> de commencer la prière en ayant l'esprit préoccupé par quelque chose qui incommode le fidèle ; comme le fait de retenir une envie d'uriner, de déféquer ou des gaz, ou encore en cas de froid ou de chaleur intenses, ou de faim ou de soif excessives ; car tout cela empêche la concentration (le Khushu').</p>
<p><strong>De même, il est détestable</strong> de commencer la prière alors qu'un repas dont on a envie est servi ; conformément à la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><strong><span dir="rtl">«لَا صَلَاةَ بِحَضْرَةِ طَعَامٍ، وَلَا هُوَ يُدَافِعُهُ الْأَخْبَثَانِ»، رَوَاهُ مُسْلِمٌ.</span></strong></p>
<p><em><strong>"Nulle prière n'est complète en présence d'un repas, ni lorsque la personne lutte contre les deux impuretés (l'envie d'uriner ou de déféquer)." [Rapporté par Muslim]. (7)</strong></em></p>
<p>Tout cela a pour but de respecter le droit d'Allah, afin que le serviteur entre dans l'adoration avec un cœur présent et entièrement tourné vers son Seigneur.</p>
<p><strong>Il est détestable</strong> pour celui qui prie de réserver (spécifiquement) pour son front un objet sur lequel se prosterner ; car cela fait partie des emblèmes (signes distinctifs) des Rafidah (chiites). En agissant ainsi, on tomberait dans l'imitation de ces derniers.</p>
<p><strong>Il est détestable</strong>, durant la prière, de s'essuyer le front et le nez pour enlever les traces de prosternation qui s'y sont collées (comme de la poussière ou du sable). En revanche, il n'y a aucun mal à les essuyer une fois la prière terminée.</p>
<p><strong>Il est détestable</strong>, durant la prière, de s'agiter inutilement en touchant sa barbe, en retroussant son vêtement, en se nettoyant le nez ou autre ; car cela distrait le fidèle de sa prière.</p>
<p>Ce qui est attendu du musulman, c'est qu'il se consacre entièrement à sa prière et qu'il ne se laisse pas occuper par ce qui n'en fait pas partie. Allah Subhânahu dit :</p>
<p class="ar"><strong><span dir="rtl">﴿حَافِظُوا عَلَى الصَّلَوَاتِ وَالصَّلَاةِ الْوُسْطَىٰ وَقُومُوا لِلَّهِ قَانِتِينَ﴾ [البقرة: ٢٣٨]</span></strong></p>
<p><em><strong>"Soyez assidus aux prières et surtout à la prière médiane ; et tenez-vous debout devant Allah, avec humilité" [Sourate Al-Baqarah : 238].</strong></em></p>
<p>L'objectif est donc d'accomplir la prière avec la présence du cœur et le recueillement (Khushu'), en accomplissant ce qui est prescrit pour ces deux états et en délaissant les paroles ou les actes qui les contredisent ou les altèrent. Ceci afin que la prière soit valide, qu'elle décharge le fidèle de son obligation, et qu'elle soit une prière tant dans sa forme que dans sa réalité profonde, et non seulement dans sa forme apparente.</p>
<p>Qu'Allah nous accorde à tous la réussite dans ce qui contient le bien et le bonheur, ici-bas et dans l'au-delà.</p>
