<p>⁕ Les gens ayant des excuses sont : <em><strong>les malades, les voyageurs et ceux qui éprouvent de la peur, qui ne sont pas en mesure d'accomplir la prière selon la forme accomplie par celui qui n'a pas d'excuse</strong></em>. Le Législateur a donc allégé [les prescriptions] pour eux, et leur a demandé de prier selon leur capacité. Cela fait partie de la facilité de cette législation et de sa mansuétude ; elle est en effet venue pour lever la gêne.</p>
<p>Allah le Très-Haut a dit :</p>
<p class="ar"><strong><span dir="rtl">﴿وَمَا جَعَلَ عَلَيْكُمْ فِي الدِّينِ مِنْ حَرَجٍ﴾ [الحج: ٧٨]</span></strong></p>
<p><strong>« <em>Et Il ne vous a imposé aucune gêne dans la religion.</em> »</strong> [Al-Hajj : 78].</p>
<p>Et le Très-Haut a dit :</p>
<p class="ar"><strong><span dir="rtl">﴿يُرِيدُ اللهُ بِكُمُ الْيُسْرَ وَلَا يُرِيدُ بِكُمُ الْعُسْرَ﴾ [البقرة: ١٨٥].</span></strong></p>
<p><strong>« <em>Allah veut pour vous la facilité, et Il ne veut pas pour vous la difficulté.</em> »</strong> [Al-Baqarah : 185].</p>
<p>Et le Très-Haut a dit :</p>
<p class="ar"><strong><span dir="rtl">﴿لَا يُكَلِّفُ اللهُ نَفْسًا إِلَّا وُسْعَهَا﴾ [البقرة: ٢٨٦].</span></strong></p>
<p><strong>« <em>Allah n'impose à aucune âme une charge supérieure à sa capacité.</em> »</strong> [Al-Baqarah : 286].</p>
<p>Et le Très-Haut a dit :</p>
<p class="ar"><strong><span dir="rtl">﴿فَاتَّقُوا اللهَ مَا اسْتَطَعْتُمْ﴾ [التغابن: ١٦].</span></strong></p>
<p><strong>« <em>Craignez Allah autant que vous le pouvez.</em> »</strong> [At-Taghâbun : 16].</p>
<p>Et le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><strong><span dir="rtl">«إِذَا أَمَرْتُكُمْ بِأَمْرٍ؛ فَأْتُوا مِنْهُ مَا اسْتَطَعْتُمْ...»</span></strong></p>
<p><strong>« <em>Lorsque je vous ordonne une chose, accomplissez-en ce que vous pouvez...</em> »</strong><a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a></p>
<p>Ainsi que d'autres textes qui démontrent la grâce d'Allah envers Ses serviteurs et la facilité de Sa législation.</p>
<p>Parmi cela figure ce dont nous allons traiter : <em><strong>comment doit prier celui qui est sujet à une excuse, que ce soit la maladie, le voyage ou la peur ?</strong></em></p>
<h4 id="section"></h4>
<h4 id="section-1"></h4>
<h4 id="premièrement-la-prière-du-malade"><strong>Premièrement : La prière du malade</strong></h4>
<p>⁕ Certes, la prière n'est jamais délaissée. Le malade a donc l'obligation d'accomplir la prière debout. Et s'il a besoin de s'appuyer sur un bâton (une canne) ou autre chose de similaire durant sa station debout, il n'y a pas de mal à cela ; car ce sans quoi une obligation ne peut être accomplie devient lui-même obligatoire.</p>
<p>⁕ Si le malade ne peut pas rester debout durant la prière — soit qu'il en soit incapable, soit que cela lui soit trop pénible, ou que l'on craigne que la station debout n'aggrave sa maladie ou n'en retarde la guérison — alors, dans ces conditions citées, il prie assis.</p>
<p>Il n'est pas conditionné, pour que la position assise soit autorisée, que la station debout soit totalement impossible. Cependant, une difficulté minime ne suffit pas [pour s'asseoir] ; ce qui est pris en compte, c'est une difficulté manifeste (réelle et pénible).</p>
<p>Les savants sont tombés d'accord (consensus) sur le fait que celui qui est incapable de rester debout pour une prière obligatoire doit la prier assis. Il n'a pas à la refaire, sa récompense n'est pas diminuée, et sa manière de s'asseoir se fait selon ce qui lui est le plus facile. En effet, le Législateur n'a pas exigé de position assise particulière ; ainsi, quelle que soit la façon dont il s'assoit, cela est permis.</p>
<p>⁕ Si le malade ne peut pas prier assis — parce que la position assise lui est manifestement pénible ou qu'il en est incapable — alors il prie <strong>allongé sur le côté</strong>, en orientant son visage vers la <strong>Qibla</strong>.</p>
<p>Il est préférable qu'il soit sur son <strong>côté droit</strong>. S'il n'y a personne auprès de lui pour l'orienter vers la Qibla et qu'il ne peut pas s'y orienter lui-même, il prie alors selon sa situation, vers la direction qui lui est la plus facile.</p>
<p>⁕ Si le malade n'est pas capable de prier sur le côté, il lui incombe alors de prier <strong>sur le dos</strong>, en ayant les <strong>pieds dirigés vers la Qibla</strong>, dans la mesure du possible.</p>
<p>⁕ Lorsque le malade prie assis et qu'il ne peut pas se prosterner sur le sol, ou s'il prie sur le côté ou sur le dos comme mentionné précédemment, il effectue alors des <strong>signes de la tête</strong> pour l'inclinaison (<em>Ruku'</em>) et la prosternation (<em>Sujud</em>). Il doit faire en sorte que le signe pour la prosternation soit <strong>plus bas</strong> que celui pour l'inclinaison. Cependant, si le malade prie assis mais qu'il est capable de se prosterner au sol, cela devient pour lui une obligation ; le simple signe de la tête ne suffit pas dans ce cas.</p>
<p>La preuve autorisant la prière du malade selon ces modalités détaillées est ce qu'ont rapporté Al-Boukhârî et les auteurs des <em>Sunan</em> d'après le hadith d'Imrân ibn Husayn (qu'Allah l'agrée) qui a dit : « <em>Je souffrais d'hémorroïdes, j'ai alors interrogé le Prophète <span dir="rtl">ﷺ</span> à ce sujet. Il dit :</em></p>
<p class="ar"><strong><span dir="rtl">«صَلِّ قَائِمًا، فَإِنْ لَمْ تَسْتَطِعْ؛ فَقَاعِدًا، فَإِنْ لَمْ تَسْتَطِعْ؛ فَعَلَى جَنْبِكَ»</span></strong></p>
<p><strong><em>"Prie debout ; si tu ne peux pas, alors assis ; si tu ne peux pas, alors sur le côté.</em>"</strong> » <a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a></p>
<p>An-Nasâ'î a ajouté :</p>
<p class="ar"><strong><span dir="rtl">«فَإِنْ لَمْ تَسْتَطِعْ؛ فَمُسْتَلْقِيًا، ﴿لَا يُكَلِّفُ اللهُ نَفْسًا إِلَّا وُسْعَهَا﴾ [البقرة: ٢٨٦]».</span></strong></p>
<p><strong>« <em>Et si tu ne peux pas, alors allongé sur le dos, car "Allah n'impose à aucune âme une charge supérieure à sa capacité</em>" [Al-Baqarah : 286].</strong></p>
<p>⁕ <strong>Ici, il est impératif d'avertir contre ce que font certains malades ou ceux qui subissent des interventions chirurgicales</strong> : ils délaissent la prière sous prétexte qu'ils ne peuvent pas l'accomplir de manière complète, ou qu'ils ne peuvent pas faire leurs ablutions (<em>Wudu</em>), ou parce que leurs vêtements sont souillés (impurs), ou pour d'autres excuses similaires. Ceci est une <strong>grave erreur</strong> car, il n'est pas permis au musulman de délaisser la prière s'il est incapable d'en remplir certaines conditions, piliers ou obligations. Au contraire, il doit la prier selon sa situation actuelle. Allah le Très-Haut a dit :</p>
<p class="ar"><strong><span dir="rtl">﴿فَاتَّقُوا اللهَ مَا اسْتَطَعْتُمْ﴾ [التغابن: ١٦]</span></strong></p>
<p><strong>« Craignez Allah autant que vous le pouvez. »</strong> [At-Taghabun : 16].</p>
<p>Certains malades disent : « <em>Quand je serai guéri, je rattraperai les prières que j'ai délaissées.</em> » Ceci est dû à leur ignorance ou à leur négligence. La prière doit être accomplie <strong>en son temps</strong>, selon la capacité de la personne, <strong>et il n'est pas permis de la retarder au-delà de son temps prescrit</strong>. Il convient donc d'être vigilant sur ce point et d'en avertir les autres. Il est nécessaire qu'il y ait dans les hôpitaux une sensibilisation religieuse et un suivi de la situation des malades concernant la prière et les autres obligations religieuses qu'ils ont besoin de comprendre.</p>
<p>⁕ Ce qui a été expliqué précédemment concerne celui qui commence [sa prière] avec une excuse et dont l'excuse persiste jusqu'à la fin de celle-ci.</p>
<p>Quant à celui qui commence la prière en étant capable de rester debout, puis qu'une incapacité survient en cours de route ; ou celui qui la commence sans pouvoir se tenir debout, puis en devient capable pendant la prière ; ou celui qui la commence assis puis devient incapable de rester assis ; ou encore celui qui commence sur le côté puis devient capable de s'asseoir, alors, dans tous ces cas, il passe à l'état qui lui est légalement approprié [selon sa nouvelle capacité] et il est <strong>obligatoire</strong> qu'il la termine ainsi. Cela est basé sur la parole du Très-Haut : <strong>« Craignez Allah autant que vous le pouvez. »</strong> Ainsi, celui qui en devient capable passe à la station debout, et celui qui devient incapable de rester debout au cours de la prière passe à la position assise... et ainsi de suite.</p>
<p>⁕ Et s'il est capable de se tenir debout et de s'asseoir, mais qu'il est incapable de s'incliner (<em>Ruku'</em>) et de se prosterner (<em>Sujud</em>), alors il effectue le signe de la tête pour l'inclinaison en étant <strong>debout</strong>, et il effectue le signe pour la prosternation en étant <strong>assis</strong>, afin de marquer une distinction entre les deux gestes autant que possible.</p>
<p>⁕ Il est permis au malade de prier allongé sur le dos, même s'il est capable de rester debout, si un <strong>médecin musulman digne de confiance</strong> lui dit : "<em>Ton traitement n'est possible que si tu pries allongé</em>". En effet, le Prophète <span dir="rtl">ﷺ</span> a prié assis lorsque son flanc fut écorché [suite à une chute de cheval], et Oumm Salama a délaissé la prosternation [physique au sol] à cause d'une ophtalmie (maladie des yeux) dont elle souffrait<a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a>.</p>
<p>La place de la prière en Islam est immense ; il est demandé au musulman, et il lui est même impératif, de l'accomplir aussi bien en état de santé qu'en état de maladie. Elle n'est donc pas levée pour le malade, mais celui-ci l'accomplit selon sa condition. Le musulman a donc le devoir d'y être assidu comme Allah le lui a ordonné.</p>
<p>Qu'Allah nous accorde à tous la réussite dans ce qu'Il aime et agréé.</p>
<h4 id="deuxièmement-la-prière-de-celui-qui-est-sur-une-monture"><strong>Deuxièmement : La prière de celui qui est sur une monture</strong></h4>
<p>⁕ Fait partie des personnes ayant une excuse valable, celui qui est sur une monture s'il subit un préjudice en descendant pour prier au sol à cause de la boue ou de la pluie، ou s'il est incapable de remonter sur sa monture s'il en descend، ou s'il craint de perdre de vue ses compagnons de voyage s'il descend، ou s'il craint pour sa propre sécurité s'il descend face à un ennemi ou une bête féroce. Dans ces situations, il prie sur sa monture (qu'il s'agisse d'une bête ou autre) et ne descend pas au sol.</p>
<p>Ceci s'appuie sur le hadith de Ya'lâ Ibn Murrah : « <em><strong>Le Prophète <span dir="rtl">ﷺ</span> est arrivé à un passage étroit avec ses compagnons alors qu'il était sur sa monture. Le ciel était au-dessus d'eux (pluie) et le sol était mouillé en dessous d'eux. L'heure de la prière arriva alors. Il ordonna au mouadhin de faire l'appel (adhan) et l'iqâmah، puis le Messager d'Allah <span dir="rtl">ﷺ</span> s'avança sur sa monture et dirigea leur prière par des gestes (inclinaisons de la tête) ; en faisant en sorte que la prosternation soit plus basse que l'inclinaison (roukou').</strong></em> » Rapporté par Ahmad et At-Tirmidhi.<a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a></p>
<p>⁕ Celui qui accomplit une prière obligatoire sur sa monture, en raison d'une excuse valable parmi celles mentionnées précédemment, a l'obligation de faire face à la <strong>Qibla</strong> s'il en est capable ، conformément à la parole d'Allah le Très-Haut :</p>
<p class="ar"><strong><span dir="rtl">﴿وَحَيْثُ مَا كُنتُمْ فَوَلُّوا وُجُوهَكُمْ شَطْرَهُ﴾ [البقرة : ١٤٤]</span></strong></p>
<p><strong>« <em>Où que vous soyez, tournez-y vos visages</em> »</strong> [Al-Baqarah : 144].</p>
<p>Il doit également accomplir ce dont il est capable parmi l'inclinaison (<strong>Rukû'</strong>), la prosternation (<strong>Sujûd</strong>), le geste pour les remplacer (l'imitation du mouvement) ainsi que la quiétude ، conformément à la parole d'Allah le Très-Haut :</p>
<p class="ar"><strong><span dir="rtl">﴿فَاتَّقُوا اللهَ مَا اسْتَطَعْتُمْ﴾ [التغابن : ١٦]</span></strong></p>
<p><strong>« <em>Craignez Allah autant que vous le pouvez</em> »</strong> [At-Taghâbun : 16].</p>
<p>Quant à ce qu'il est incapable de faire, il n'en est pas tenu. S'il ne peut pas faire face à la <strong>Qibla</strong> , cette obligation tombe et il prie selon sa capacité. Il en va de même pour celui qui voyage en avion : il y prie selon ses capacités ، qu'il s'agisse de la station debout, assise, de l'inclinaison, de la prosternation ou du geste pour les remplacer ، et ce, en faisant face à la <strong>Qibla</strong> car cela est possible.</p>
<h4 id="troisièmement-la-prière-du-voyageur"><strong>Troisièmement : La prière du voyageur</strong></h4>
<p>⁕ Parmi les personnes bénéficiant d'excuses [légales] figure le voyageur. Il lui est prescrit de raccourcir la prière de quatre unités (<strong>Raka'at</strong>) à deux unités. Cela est prouvé par le Livre (le Coran), la Sunna et le consensus (<strong>Ijmâ'</strong>).</p>
<p>Allah le Très-Haut a dit :</p>
<p class="ar"><strong><span dir="rtl">﴿وَإِذَا ضَرَبْتُمْ فِي الْأَرْضِ فَلَيْسَ عَلَيْكُمْ جُنَاحٌ أَن تَقْصُرُوا مِنَ الصَّلَوةِ﴾ [النساء : ١٠١]</span></strong></p>
<p></p>
<p><strong>« <em>Et quand vous parcourez la terre, ce n'est pas un péché pour vous de raccourcir la prière</em> »</strong> [An-Nisâ' : 101].</p>
<p>De plus, le Prophète <span dir="rtl">ﷺ</span> n'a jamais prié en voyage sans raccourcir sa prière. Le raccourcissement (<strong>Qasr</strong>) est d'ailleurs préférable à l'accomplissement complet selon la majorité des savants. Il est rapporté dans les deux recueils authentiques (Al-Bukhari et Muslim) :</p>
<p></p>
<p class="ar"><strong><span dir="rtl">«فُرِضَتِ الصَّلَاةُ ركعتين ركعتين؛ فأُقِرَّتْ صَلَاةُ السَّفَرِ، وزيد في صلاةِ الحَضَرِ»</span></strong></p>
<p><strong>« <em>La prière fut prescrite à l'origine à raison de deux unités par deux unités ; elle fut maintenue ainsi pour le voyage et augmentée pour le résident.</em> »</strong> <a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a></p>
<p>Ibn 'Umar a dit :</p>
<p class="ar"><strong><span dir="rtl">«صلاة السَّفَرِ ركعتان، تمامٌ غيرُ قَصْرٍ»</span></strong></p>
<p><strong>« <em>La prière du voyageur est de deux unités ; elle est complète ainsi et n'est pas considérée comme une diminution.</em> »</strong><a href="#fn6" class="footnote-ref" id="fnref6" role="doc-noteref"><sup>6</sup></a></p>
<p>⁕ Le raccourcissement [de la prière] commence dès que le voyageur sort de la zone habitée (les limites) de sa localité. En effet, Allah a autorisé le raccourcissement pour celui qui « parcourt la terre » ; or, avant de quitter sa ville, l'individu n'est ni considéré comme quelqu'un qui parcourt la terre, ni comme un voyageur. De plus, le Prophète <span dir="rtl">ﷺ</span> ne commençait à raccourcir [ses prières] que lorsqu'il s'était mis en route (après avoir quitté son lieu de résidence).</p>
<p>Enfin, le terme linguistique « voyage » (<strong>Safar</strong>) tire son origine du sens de « dévoilement » (<strong>Isfâr</strong>) ; c'est-à-dire le fait de sortir vers le désert (<span dir="rtl">الخُرُوجُ إِلَى الصَّحَرَاء</span>ِ)<a href="#fn7" class="footnote-ref" id="fnref7" role="doc-noteref"><sup>7</sup></a>.</p>
<p>On dit par exemple :</p>
<p class="ar"><em><span dir="rtl">سَفَرَتِ المرأَةُ عَنْ وَجْهِهَا : إِذَا كَشَفَتْهُ</span></em></p>
<p>« <em>la femme a dévoilé (Safarat) son visage lorsqu'elle le découvre.</em> »</p>
<p>Ainsi, tant que l'on n'a pas émergé vers l'espace ouvert où l'on se distingue des habitations, on n'est pas considéré comme un voyageur.</p>
<p>⁕ Le voyageur raccourcit la prière, même si ses voyages sont fréquents (répétitifs) ; à l'instar du postier (agent de la poste) ou du chauffeur de taxi, parmi ceux qui passent la majeure partie de leur temps sur la route entre les villes.</p>
<p>⁕ Il est permis au voyageur de <strong>regrouper</strong> la prière du <strong>Dhohr</strong> avec celle de l'<strong>Asr</strong>, ainsi que la prière du <strong>Maghrib</strong> avec celle de l'<strong>Isha</strong>, à l'heure de l'une des deux. Ainsi, tout voyageur autorisé à raccourcir ses prières est également autorisé à les regrouper. C'est une dérogation (<strong>Rukhsah</strong>) occasionnelle qu'il utilise en cas de besoin, comme lorsqu'il est pressé par la route. Cela s'appuie sur ce qu'a rapporté Mu'adh (qu'Allah l'agrée) : lors de la bataille de Tabûk, si le Prophète <span dir="rtl">ﷺ</span> se mettait en route avant le déclin du soleil (avant l'heure du Dhohr), il retardait le Dhohr pour le joindre à l'Asr et les prier ensemble. S'il partait après le déclin du soleil, il priait le Dhohr et l'Asr ensemble avant de partir. Il faisait de même pour le Maghrib et l'Isha. (Rapporté par Abû Dâwûd et At-Tirmidhi).<a href="#fn8" class="footnote-ref" id="fnref8" role="doc-noteref"><sup>8</sup></a></p>
<p>⁕ Si le voyageur fait une halte durant son voyage pour se reposer, il est alors <strong>préférable</strong> (<strong>Afdhal</strong>) pour lui d'accomplir chaque prière à son heure respective, en les raccourcissant (<strong>Qasr</strong>) mais sans les regrouper (<strong>Jam'</strong>).</p>
<p>⁕ Il est permis de regrouper le <strong>Dhohr</strong> avec l'<strong>Asr</strong>, et le <strong>Maghrib</strong> avec l'<strong>Isha</strong>, pour le malade qui éprouverait une difficulté (<strong>Mashaqqah</strong>) s'il devait accomplir chaque prière séparément.</p>
<p>Cheikh al-Islam Ibn Taymiyya (qu'Allah lui fasse miséricorde) a dit <a href="#fn9" class="footnote-ref" id="fnref9" role="doc-noteref"><sup>9</sup></a>: « <em>Le regroupement n'a été institué que pour lever la gêne (<strong>Haraj</strong>) au sein de la communauté. Si les gens ont besoin de regrouper, ils regroupent. Tous les Hadiths indiquent qu'il [le Prophète <span dir="rtl">ﷺ</span>] regroupait dans un seul temps de prière pour épargner toute gêne à sa communauté. Le regroupement est donc permis dès que sa délaissement engendre une gêne qu'Allah a pourtant levée pour la communauté. Cela s'applique donc, à plus forte raison, au malade pour qui la séparation des prières serait pénible.</em> »</p>
<p>Il a également dit : « <em>Les malades regroupent [leurs prières] comme cela a été rapporté dans la Sunna concernant le regroupement pour la femme atteinte de métrorragie (<strong>Mustahâdah</strong>). Le Prophète <span dir="rtl">ﷺ</span> lui a ordonné le regroupement dans deux Hadiths. Il est également permis de regrouper pour celui qui est incapable de refaire sa purification pour chaque prière, comme celui qui souffre d'incontinence urinaire, d'une blessure dont le sang ne s'arrête pas de couler, ou d'épistaxis (saignement de nez) chronique, par analogie (<strong>Qiyas</strong>) avec la femme en état d'Istihâdah. En effet, le Prophète <span dir="rtl">ﷺ</span> a dit à Hamnah lorsqu'elle l'interrogea sur son cas : <strong>"Si tu as la force de retarder le Dhohr et d'avancer l'Asr, puis de te laver et de prier le Dhohr et l'Asr ensemble, puis de retarder le Maghrib et d'avancer l'Isha, de te laver et de regrouper les deux prières, alors fais-le."</strong></em> » (Rapporté par Ahmad et At-Tirmidhi qui l'a authentifié).<a href="#fn10" class="footnote-ref" id="fnref10" role="doc-noteref"><sup>10</sup></a></p>
<p>⁕ Il est permis de regrouper <strong>spécifiquement</strong> le <strong>Maghrib</strong> et l'<strong>Isha</strong> en cas de pluie qui mouille les vêtements et entraîne une difficulté (<strong>Mashaqqah</strong>). En effet, le Prophète <span dir="rtl">ﷺ</span> a regroupé le Maghrib et l'Isha lors d'une nuit pluvieuse, et cela fut également pratiqué par Abou Bakr et Omar.</p>
<p>Cheikh al-Islam Ibn Taymiyya (qu'Allah lui fasse miséricorde) a dit <a href="#fn11" class="footnote-ref" id="fnref11" role="doc-noteref"><sup>11</sup></a>: « <em>Il est permis de regrouper [les prières] en raison de la boue intense, du vent violent et froid durant une nuit sombre, ou d'autres conditions similaires, même si la pluie ne tombe pas, selon le plus correct des deux avis des savants. Cela est préférable au fait que les</em> <em>gens prient [individuellement] chez eux. Au contraire, délaisser le regroupement [à la mosquée] pour prier chez soi est une innovation (<strong>Bid’a</strong>) contraire à la Sunna. Car la Sunna veut que les cinq prières soient accomplies en congrégation (<strong>Jama'ah</strong>) dans les mosquées, ce qui est meilleur que de prier chez soi selon l'unanimité des musulmans. Prier en regroupant les offices à la mosquée est donc préférable à la prière faite à la maison de manière séparée, selon l'accord des imams qui autorisent le regroupement, tels que Mâlik, Al-Shâfi'î et Ahmad.</em> » Fin de citation.</p>
<p>⁕ Pour celui à qui le regroupement est permis, le mieux (Afdhal) est de choisir la modalité la plus commode (Arfaq) pour lui, qu'il s'agisse du regroupement avancé (Jam' Taqdim) ou retardé (Jam' Ta'khir). Toutefois, à Arafat, le mieux est de pratiquer le regroupement avancé pour le Dhohr et l'Asr. À Muzdalifa, le mieux est le regroupement retardé pour le Maghrib et l'Isha. Cela est conforme à la pratique du Prophète <span dir="rtl">ﷺ</span> : le regroupement avancé à Arafat permet la continuité de la station debout (Wouqouf), tandis que le regroupement retardé à Muzdalifa permet de poursuivre le trajet vers celle-ci sans interruption.</p>
<p>En résumé : le regroupement entre deux prières à Arafat et Muzdalifa est une <strong>Sunna</strong> (recommandée), tandis qu'ailleurs, c'est une permission (<strong>Mubah</strong>) à laquelle on a recours en cas de besoin. Si aucun besoin ne se fait sentir, il est préférable pour le voyageur d'accomplir chaque prière à son heure. En effet, le Prophète <span dir="rtl">ﷺ</span> n'a regroupé ses prières durant les jours du Pèlerinage qu'à Arafat et Muzdalifa ; il ne les a pas regroupées à <strong>Mina</strong>, car il y était installé (en halte). Il ne regroupait que lorsqu'il était pressé par la route.</p>
<p>Ceci étant dit, nous demandons à Allah d'accorder à tous la réussite dans l'acquisition de la science utile et l'accomplissement des bonnes œuvres.</p>
<h4 id="quatrièmement-la-prière-de-la-peur-salât-al-khawf"><strong>Quatrièmement : La prière de la peur (Salât al-Khawf)</strong></h4>
<p>⁕ La prière de la peur est prescrite dans tout combat licite ، tel que le combat contre les mécréants, les rebelles et les brigands ، conformément à la parole du Très-Haut :</p>
<p class="ar"><strong><span dir="rtl">﴿إِنْ خِفْتُمْ أَن يَفْتِنَكُمُ الَّذِينَ كَفَرُوا﴾ [النساء: ١٠١]</span></strong></p>
<p>« <em><strong>...si vous craignez que les mécréants ne vous mettent à l'épreuve.</strong></em> » [An-Nisâ : 101].</p>
<p>Par analogie, cela s'applique à tout autre groupe qu'il est permis de combattre. En revanche, la prière de la peur n'est pas autorisée lors d'un combat illicite.</p>
<p>⁕ La preuve de la légitimité de la prière de la peur repose sur le Livre, la Sunna et le Consensus (Ijmâ') :</p>
<p>Allah le Très-Haut a dit :</p>
<p class="ar"><strong><span dir="rtl">﴿وَإِذَا كُنتَ فِيهِمْ فَأَقَمْتَ لَهُمُ الصَّلَاةَ فَلْتَقُمْ طَائِفَةٌ مِّنْهُم مَّعَكَ وَلْيَأْخُذُوا أَسْلِحَتَهُمْ فَإِذَا سَجَدُوا فَلْيَكُونُوا مِن وَرَائِكُمْ وَلْتَأْتِ طَائِفَةٌ أُخْرَىٰ لَمْ يُصَلُّوا فَلْيُصَلُّوا مَعَكَ وَلْيَأْخُذُوا حِذْرَهُمْ وَأَسْلِحَتَهُمْ﴾ [النساء: ١٠٢].</span></strong></p>
<p>« <em><strong>Et lorsque tu te trouves parmi eux et que tu diriges la prière pour eux, qu'une partie d'entre eux se tienne debout avec toi en gardant leurs armes. Puis, lorsqu'ils se sont prosternés, qu'ils passent derrière vous, et que l'autre partie, qui n'a pas encore prié, vienne alors prier avec toi, en prenant leurs précautions et leurs armes.</strong></em> » [An-Nisâ : 102].</p>
<p>L'Imam Ahmad — qu'Allah lui fasse miséricorde — a dit <a href="#fn12" class="footnote-ref" id="fnref12" role="doc-noteref"><sup>12</sup></a>: « <em>La prière de la peur a été authentifiée d'après le Prophète <span dir="rtl">ﷺ</span> selon cinq ou six modalités, et toutes sont autorisées.</em> » Fin de citation.</p>
<p>Elle était donc prescrite à l'époque du Messager d'Allah <span dir="rtl">ﷺ</span> et sa prescription demeure valable jusqu'à la fin des temps. Les Compagnons ainsi que l'ensemble des imams sont tombés d'accord sur ce point, à l'exception d'une divergence minime dont on ne tient pas compte.</p>
<p>⁕ La prière de la peur est accomplie en cas de besoin, que l'on soit <strong>en voyage ou résident</strong>, si l'on craint une attaque de l'ennemi contre les musulmans. En effet, ce qui la rend licite est la <strong>peur</strong> et non le voyage. Cependant, lors de la prière de la peur en résidence (non-voyageur), le <strong>nombre de rak'ats n'est pas réduit</strong> ; seule la <strong>modalité</strong> (la forme) de la prière est allégée. En revanche, lors de la prière de la peur en voyage, le nombre de rak'ats est réduit (pour les prières de quatre rak'ats) en plus de l'allègement de sa modalité.</p>
<p>⁕ <strong>La prière de la peur est prescrite selon deux conditions :</strong></p>
<ul>
<li><blockquote>
<p><strong>Première condition :</strong> Que l'ennemi soit de ceux qu'il est permis de combattre (comme mentionné précédemment).</p>
</blockquote></li>
</ul>
<ul>
<li><blockquote>
<p><strong>Seconde condition :</strong> Que l'on craigne son attaque contre les musulmans pendant la prière ; conformément à la parole du Très-Haut : « <strong>...si vous craignez que les mécréants ne vous mettent à l'épreuve</strong> » [An-Nisâ : 101], et Sa parole : « <strong>Les mécréants aimeraient vous voir négliger vos armes et vos bagages afin de fondre sur vous en une seule masse.</strong> » [An-Nisâ : 102].</p>
</blockquote></li>
</ul>
<p>⁕ Parmi les descriptions de la prière de la peur (Salât al-Khawf), figure celle rapportée d'après le Prophète <span dir="rtl">ﷺ</span> dans le hadith de <strong>Sahl ibn Abî Hathma al-Ansârî</strong> (qu'Allah l'agrée). L'imam <strong>Ahmad</strong> a d'ailleurs choisi de mettre celle-ci en pratique car elle ressemble le plus à la description mentionnée dans le Noble Coran. Elle contient à la fois une précaution pour la prière, une précaution pour la guerre, et elle est plus à même de nuire à l'ennemi. Le Prophète <span dir="rtl">ﷺ</span> a accompli cette prière lors de la bataille de <strong>Dhât ar-Riqâ'</strong>.</p>
<p><em><strong>Sa description, telle que rapportée par Sahl, est la suivante :</strong></em></p>
<p>Un groupe s'est rangé derrière le Prophète <span dir="rtl">ﷺ</span> tandis qu'un autre groupe faisait face à l'ennemi. Il pria alors une unité (Rak'ah) avec ceux qui étaient avec lui, puis il resta debout pendant qu'ils terminaient leur prière seuls. Ensuite, ils s'en allèrent et se rangèrent face à l'ennemi. Le second groupe arriva alors et il [le Prophète] pria avec eux l'unité qu'il lui restait de sa propre prière, puis il resta assis tandis qu'ils terminaient leur prière seuls, puis il effectua le salut final (Taslîm) avec eux.(Hadith unanimement reconnu authentique)<a href="#fn13" class="footnote-ref" id="fnref13" role="doc-noteref"><sup>13</sup></a></p>
<p>⁕ Parmi les descriptions de la prière de la peur est celle rapportée par <strong>Jâbir</strong> [ibn Abdillah], qui a dit :</p>
<p>« <em>J'ai participé à la prière de la peur avec le Messager d'Allah <span dir="rtl">ﷺ</span>. Nous nous sommes rangés en deux rangs, alors que l'ennemi se trouvait entre nous et la Qibla (la direction de la prière).</em></p>
<p><em>Le Messager d'Allah <span dir="rtl">ﷺ</span> a prononcé le Takbîr (Allâhu Akbar) et nous l'avons tous prononcé avec lui. Puis il s'est incliné (Rukû') et nous nous sommes tous inclinés avec lui. Ensuite, il a relevé la tête de l'inclinaison et nous l'avons tous relevée.</em></p>
<p><em>Puis, il est descendu pour se prosterner (Sujûd) accompagné du premier rang (celui qui le suivait directement), tandis que le second rang (le rang arrière) restait debout face à l'ennemi [pour monter la garde]. Lorsque le Prophète <span dir="rtl">ﷺ</span> eut terminé sa prosternation et que le premier rang se fut relevé, le rang arrière descendit à son tour pour se prosterner, puis ils se relevèrent.</em></p>
<p><em>Ensuite, le rang arrière a avancé pour prendre la place du premier, et le premier rang a reculé pour prendre la place de l'arrière. Puis il [le Prophète] s'est incliné et nous nous sommes tous inclinés avec lui. Il a relevé la tête et nous l'avons tous relevée.</em></p>
<p><em>Puis il est descendu pour se prosterner avec le rang qui le suivait (et qui était le rang arrière lors de la première unité), tandis que le [nouveau] rang arrière restait debout face à l'ennemi. Lorsque le Prophète <span dir="rtl">ﷺ</span> eut terminé sa prosternation et que le rang qui le suivait se fut relevé, le rang arrière descendit pour se prosterner à son tour.</em></p>
<p><em>Enfin, le Prophète <span dir="rtl">ﷺ</span> effectua le salut final (Taslîm) et nous avons tous salué avec lui.</em> »(Rapporté par Muslim)<a href="#fn14" class="footnote-ref" id="fnref14" role="doc-noteref"><sup>14</sup></a></p>
<p>⁕ Une autre description de la prière de la peur est celle rapportée par Ibn ‘Umar [qu'Allah l'agrée], qui a dit :</p>
<p>« <em>Le Prophète <span dir="rtl">ﷺ</span> a dirigé la prière de la peur en priant avec l’un des deux groupes une unité (Rak’ah) et deux prosternations, tandis que l’autre groupe faisait face à l’ennemi.</em></p>
<p><em>Ensuite, [le premier groupe] s'en est allé pour prendre la place de leurs compagnons afin de faire face à l'ennemi. Ces derniers [le deuxième groupe] sont alors venus, et il [le Prophète] a prié avec eux une unité (Rak’ah), puis il a effectué le salut final (Taslîm).</em></p>
<p><em>Enfin, chacun des deux groupes a complété, de son côté, l'unité (Rak’ah) qui lui manquait.</em> » (Hadith unanimement reconnu authentique).<a href="#fn15" class="footnote-ref" id="fnref15" role="doc-noteref"><sup>15</sup></a></p>
<p>⁕ Une autre description de la prière de la peur consiste [pour l'imam] à accomplir une prière complète avec chaque groupe, en effectuant le salut final (Taslîm) à la fin de chaque prière. »(Rapporté par Ahmad, Abû Dâwûd et An-Nasâ'î.)<a href="#fn16" class="footnote-ref" id="fnref16" role="doc-noteref"><sup>16</sup></a></p>
<p>⁕ Une autre description de la prière de la peur est celle rapportée par Jâbir [ibn Abdillah], qui a dit : « <em>Nous sommes partis avec le Messager d'Allah <span dir="rtl">ﷺ</span> jusqu'à ce que nous arrivions à Dhât ar-Riqâ'... » [Jusqu'à ce qu'il dise] : « L'appel à la prière fut lancé ; il pria alors deux unités (rak'atayn) avec un premier groupe, puis ils se retirèrent. Ensuite, il pria deux unités avec l'autre groupe. Il dit alors : "Ainsi, le Messager d'Allah <span dir="rtl">ﷺ</span> en a accompli quatre, et pour chaque groupe de personnes, il y en eut deux."</em> »(Hadith unanimement reconnu authentique).<a href="#fn17" class="footnote-ref" id="fnref17" role="doc-noteref"><sup>17</sup></a></p>
<p>⁕ Ces [différentes] manières de procéder s'appliquent tant que la peur n'est pas à son paroxysme. Si la peur s'intensifie — par la continuité des coups de lance, des heurts et des assauts (attaques et retraites) — au point qu'il devienne impossible de diviser les troupes pour prier comme mentionné précédemment, et que l'heure de la prière arrive :</p>
<p>Ils prient alors selon leur situation, <strong>à pied ou sur leurs montures</strong>, qu'ils soient face à la Qibla ou non. Ils miment l'inclinaison (<em>Rukû'</em>) et la prosternation (<em>Sujûd</em>) selon leur capacité, et ils ne retardent pas la prière.</p>
<p>Ceci conformément à la parole du Très-Haut :</p>
<p class="ar"><strong><span dir="rtl">﴿فَإِنْ خِفْتُمْ فَرِجَالاً أَوْ رُكْبَانًا﴾ [البقرة: ٢٣٩]</span></strong></p>
<p><strong>"<em>Mais si vous craignez [un danger], alors priez à pied ou sur vos montures</em>"</strong> [Al-Baqara : 239].</p>
<p>C'est-à-dire : priez en marchant ou en étant montés. Le terme <em>Rijâlan</em> (à pied) est le pluriel de <em>Râjil</em>, qui désigne celui qui se tient sur ses deux jambes, qu'il marche ou qu'il soit debout. Et <em>Rukbânan</em> est le pluriel de <em>Râkib</em> (celui qui est monté sur une monture).</p>
<p>⁕ Il est recommandé [au fidèle], durant la prière de la peur, de porter sur lui une arme lui permettant de se défendre sans pour autant que celle-ci ne l'encombre (ou ne soit trop lourde) ; ceci conformément à la parole du Très-Haut :</p>
<p class="ar"><strong><span dir="rtl">﴿وَلْيَأْخُذُوا أَسْلِحَتَهُمْ﴾ [النساء: ١٠٢].</span></strong></p>
<p><strong>"<em>Et qu'ils prennent leurs armes</em>"</strong> [An-Nisâ' : 102].</p>
<p>⁕ Il en est de même pour la "peur extrême" dans les cas suivants : la fuite devant un ennemi, un torrent (inondation soudaine), un fauve, ou encore la crainte de laisser s'échapper un ennemi que l'on poursuit.</p>
<p>Dans toutes ces situations, le fidèle prie alors qu'il est sur sa monture ou à pied, qu'il soit face à la Qibla ou non, en mimant l'inclinaison (<em>Rukû'</em>) et la prosternation (<em>Sujûd</em>) [par des mouvements de la tête].</p>
<p>Nous tirons de la prière de la peur — avec ces modalités étonnantes et cette organisation méticuleuse — plusieurs enseignements : l'importance de la prière en Islam, et plus particulièrement l'importance de la prière en groupe (<em>Salât al-Jamâ'ah</em>). En effet, aucune des deux n'a été abandonnée même dans ces situations critiques.</p>
<p>Nous en tirons également la preuve de la perfection de cette législation islamique (<em>Charia</em>), qui a instauré pour chaque situation ce qui lui convient. Nous y voyons aussi la volonté [divine] d'écarter toute gêne de cette communauté, ainsi que la tolérance de cette législation et sa validité pour tout temps et tout lieu.</p>
<p>Nous demandons à Allah de nous accorder de nous y attacher fermement et de mourir en y étant fidèles. Il est, certes, Celui qui entend tout et qui exauce les prières.</p>
