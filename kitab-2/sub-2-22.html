<p>Certes, notre religion est complète et englobe tous nos intérêts, tant dans ce bas monde que dans l'au-delà. Elle est venue apporter le bien aux musulmans, hommes et femmes. Allah a dit :</p>
<p class="ar"><strong><span dir="rtl">﴿مَنْ عَمِلَ صَالِحًا مِّن ذَكَرٍ أَوْ أُنثَىٰ وَهُوَ مُؤْمِنٌ فَلَنُحْيِيَنَّهُ حَيَاةً طَيِّبَةً ۖ وَلَنَجْزِيَنَّهُمْ أَجْرَهُم بِأَحْسَنِ مَا كَانُوا يَعْمَلُونَ﴾ [النحل: ٩٧]</span></strong></p>
<p><strong>{<em>Quiconque fait une bonne œuvre, qu'il soit homme ou femme, tout en étant croyant, Nous lui ferons vivre une vie de pureté. Et Nous les récompenserons, certes, en fonction des meilleures de leurs actions.</em>}</strong> [An-Nahl : 97].</p>
<p>Elle a ainsi accordé une grande importance à la condition de la femme, en la plaçant dans une position d'honneur et de respect, pour peu qu'elle s'attache à sa guidée et se pare de ses vertus.</p>
<p>À ce titre, [l'Islam] lui a permis de se rendre aux mosquées pour participer au bien, tel que la prière en groupe et l'assistance aux cercles de rappel, tout en faisant preuve de pudeur et en respectant les précautions qui l'éloignent de la tentation (<em>Fitnah</em>) et préservent sa dignité.</p>
<p>Si elle demande la permission de se rendre à la mosquée, il est détestable de l'en empêcher. Le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><strong><span dir="rtl">« لَا تَمْنَعُوا إِمَاءَ اللهِ مَسَاجِدَ اللهِ، وَبِيُوتُهُنَّ خَيْرٌ لَهُنَّ، وَلْيَخْرُجْنَ تَفِلَاتٍ »</span></strong></p>
<p><strong>"<em>N'interdisez pas aux servantes d'Allah les mosquées d'Allah, bien que leurs maisons soient meilleures pour elles ; et qu'elles sortent sans être parfumées (1)</em>"</strong>. (Rapporté par Ahmad et Abou Daoud). (2)</p>
<p>Cela s'explique par le fait que l'accomplissement de la prière obligatoire en groupe comporte un immense mérite pour les hommes comme pour les femmes. De même pour le fait de marcher vers la mosquée. On trouve également dans les deux recueils authentiques (<em>Sahih al-Bukhari</em> et <em>Muslim</em>) :</p>
<p class="ar"><strong><span dir="rtl">« إِذَا اسْتَأْذَنَتْ نِسَاؤُكُمْ بِاللَّيْلِ إِلَى الْمَسْجِدِ؛ فَأْذَنُوا لَهُنَّ »</span></strong></p>
<p><em><strong>"Si vos femmes vous demandent l'autorisation d'aller à la mosquée de nuit, donnez-leur l'autorisation"</strong>. (3)</em></p>
<p>La raison pour laquelle elle doit demander l'autorisation à son mari pour cela est que la présence de l'épouse au foyer est un droit du mari, alors que sa sortie vers la mosquée est, dans ce cas précis, une chose autorisée (<em>mubāh</em>). Or, on ne délaisse pas une obligation pour un acte autorisé. Cependant, si le mari donne son accord, il renonce alors à son droit.</p>
<p>Quant à la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><strong><span dir="rtl">« ...وَبِيُوتُهُنَّ خَيْرٌ لَهُنَّ »</span></strong></p>
<p><em><strong>"...bien que leurs maisons soient meilleures pour elles"</strong></em> (4)</p>
<p>cela signifie : meilleures pour elles que la prière dans les mosquées, et ce afin d'être à l'abri de la tentation (<em>fitnah</em>) par leur maintien au sein de leurs foyers.</p>
<p>Et sa parole <span dir="rtl">ﷺ</span> : <strong>"<em>et qu'elles sortent sans être parfumées</em>"</strong> (5), signifie : sans porter de parfum. Elles ont reçu cet ordre afin que les hommes ne soient pas tentés par leur odeur, et afin qu'ils détournent leurs regards d'elles, évitant ainsi d'être séduits par elles. Est assimilé au parfum tout ce qui a le même sens (effet), comme la beauté des vêtements et l'exhibition de bijoux.</p>
<p>Par conséquent, si elle se parfume ou porte des vêtements de parure, cela lui est interdit (<em>haram</em>), et il devient obligatoire de l'empêcher de sortir. Il est rapporté dans le <em>Sahih Muslim</em> et d'autres :</p>
<p class="ar"><strong><span dir="rtl">« أَيُّمَا امْرَأَةٍ أَصَابَتْ بَخُورًا؛ فَلَا تَشْهَدَنَّ مَعَنَا الْعِشَاءَ الْآخِرَةَ »</span></strong></p>
<p><strong>"<em>Toute femme qui a utilisé de l'encens ne doit pas assister avec nous à la prière du 'Isha (la dernière)</em>"</strong> (6).</p>
<p>De même, si la femme sort vers la mosquée, elle doit s'éloigner de la promiscuité (le fait de bousculer ou de se mêler de trop près) avec les hommes.</p>
<p>L'Imam Ibn al-Qayyim (7) (qu'Allah lui fasse miséricorde) a dit : <strong>"Il incombe à l'autorité publique d'empêcher la mixité des hommes et des femmes dans les marchés et les rassemblements d'hommes. Il en est responsable, car la tentation (<em>fitnah</em>) qui en découle est immense"</strong>, comme l'a dit le Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><strong><span dir="rtl">« مَا تَرَكْتُ بَعْدِي فِتْنَةً أَضَرَّ عَلَى الرِّجَالِ مِنَ النِّسَاءِ »</span></strong></p>
<p><strong>"<em>Je n'ai pas laissé après moi de tentation plus nuisible pour les hommes que les femmes...</em>"</strong> (8).</p>
<p>Il poursuit jusqu'à dire : <strong>"Il est obligatoire de les empêcher [de sortir] si elles sont parées et embellies, de les empêcher de porter des vêtements par lesquels elles seraient 'vêtues mais nues' (« <span dir="rtl">كَاسِيَاتٍ عَارِيَات</span>ٍ » comme les habits larges et fins), et de les empêcher de parler aux hommes dans les rues (c'est-à-dire de tenir des conversations avec eux dans les chemins) et d'empêcher les hommes de faire de même."</strong> Fin de citation.</p>
<p><strong>Ainsi, si la femme s'attache aux règles de bienséance de l'Islam</strong> — telles que la nécessité de la pudeur (<em>Al-Hayâ'</em>), le fait de se couvrir convenablement, le délaissement des parures et du parfum, et l'éloignement de la mixité avec les hommes — il lui est alors permis de sortir vers la mosquée pour assister à la prière et écouter les rappels.</p>
<p>Cependant, son maintien au sein de son foyer demeure meilleur pour elle que de sortir dans cette situation, car le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><strong><span dir="rtl">« وَبِيُوتُهُنَّ خَيْرٌ لَهُنَّ »</span></strong></p>
<p><em><strong>"Et leurs maisons sont meilleures pour elles" (9).</strong></em></p>
<p><strong>Les musulmans sont unanimes</strong> sur le fait que la prière de la femme dans sa maison est meilleure pour elle que la prière dans la mosquée ; et ce, afin de s'éloigner de la tentation (<em>Fitnah</em>), de privilégier la sécurité (spirituelle et physique) et de couper court à toute source de mal.</p>
<p>Quant au cas où elle ne respecterait pas les règles de bienséance de l'Islam et n'éviterait pas ce que le Messager <span dir="rtl">ﷺ</span> a interdit — à savoir l'usage de parures et de parfum pour sortir — alors sa sortie vers la mosquée devient, dans ces conditions, <strong>interdite (<em>haram</em>)</strong>. Il incombe dès lors à son tuteur (<em>Wali</em>) et aux détenteurs de l'autorité de l'en empêcher.</p>
<p>Il est rapporté dans les deux recueils authentiques (<em>Al-Bukhari</em> et <em>Muslim</em>), d'après un hadith d'Aïcha (qu'Allah soit satisfait d'elle) :</p>
<p class="ar"><strong><span dir="rtl">« لَوْ رَأَى رَسُولُ اللهِ ﷺ مَا رَأَيْنَا؛ لَمَنَعَهُنَّ مِنَ الْمَسْجِدِ كَمَا مُنِعَتْ نِسَاءُ بَنِي إِسْرَائِيلَ »</span></strong></p>
<p><em><strong>"Si le Messager d'Allah <span dir="rtl">ﷺ</span> avait vu ce que nous voyons [aujourd'hui], il leur aurait interdit l'accès aux mosquées comme cela fut interdit aux femmes des fils d'Israël" (10).</strong></em></p>
<p>Ainsi, la sortie de la femme vers les mosquées est régie par la recherche de l'intérêt (<em>Maslaha</em>) et l'évitement du préjudice (<em>Mafsada</em>). Si le risque de préjudice devient prédominant, alors la sortie est interdite.</p>
<p><strong>S'il en est ainsi pour sa sortie vers la mosquée</strong>, alors sa sortie pour toute autre raison que la mosquée requiert, à plus forte raison, que l'on observe la plus grande prudence et que l'on s'éloigne des lieux de tentation (<em>Fitnah</em>).</p>
<p>Et s'il existe aujourd'hui des gens qui appellent à la sortie de la femme pour exercer des activités professionnelles, à l'instar de ce qui se passe en Occident et chez ceux qui suivent leur modèle, sachez que ceux-là appellent à la tentation. Ils conduisent la femme vers son malheur et la privation de sa dignité...</p>
<p>Il est donc impératif de mettre un terme aux agissements de ces personnes, et de faire taire leurs langues et leurs plumes concernant cette revendication digne de l'époque de l'ignorance (<em>Jahiliyyah</em>). Il suffit de voir les malheurs dans lesquels sont tombées la femme en Occident et celles qui ont suivi leurs traces, ainsi que la réalité douloureuse dans laquelle elles se sont embourbées et dont leurs sociétés gémissent. Que cela soit pour nous une leçon ; car l'homme heureux est celui qui tire enseignement des erreurs d'autrui.</p>
<p>Ces personnes n'ont aucun argument pour justifier leur appel, si ce n'est de dire : "La moitié de la société est paralysée et ne travaille pas". Par cela, ils veulent que la femme partage le travail de l'homme et le bouscule côte à côte. Ils ont oublié, ou feint d'oublier, ou ignoré l'œuvre grandiose que la femme accomplit à l'intérieur de son foyer, ainsi que le service immense qu'elle rend à la société, que personne d'autre qu'elle ne peut accomplir, et qui correspond à sa nature physique et à sa disposition innée (<em>Fitrah</em>).</p>
<p>Elle est l'épouse auprès de qui le mari trouve le repos, elle est la mère, celle qui porte l'enfant, celle qui allaite, l'éducatrice des enfants et celle qui gère le foyer. Si elle était sortie de sa maison pour partager les travaux des hommes, qui donc accomplirait ces tâches ?! Elles seraient délaissées, et ce jour-là, la société perdrait sa seconde moitié. Que lui rapporterait alors la moitié restante ?! Son édifice serait ébranlé et ses piliers s'effondreraient.</p>
<p>Nous disons à ces prédicateurs : Revenez à la raison, et ne soyez pas de ceux qui ont troqué les bienfaits d'Allah contre l'ingratitude et ont ainsi conduit leur peuple à la demeure de la perdition. Soyez des bâtisseurs et non des démolisseurs.</p>
<p>Ô femme musulmane ! Attache-toi aux enseignements de ta religion et ne te laisse pas tromper par la propagande des égareurs qui veulent te dépouiller de la dignité que l'Islam t'a octroyée, et nul autre que l'Islam.</p>
<p class="ar"><strong><span dir="rtl">﴿وَمَنْ يَبْتَغِ غَيْرَ الْإِسْلَامِ دِينًا فَلَنْ يُقْبَلَ مِنْهُ وَهُوَ فِي الْآخِرَةِ مِنَ الْخَاسِرِينَ﴾ [آل عمران: ٨٥]</span></strong></p>
<p><em><strong>{Et quiconque désire une religion autre que l'Islam, ne sera point agréé, et il sera, dans l'au-delà, parmi les perdants.}</strong> [Al-Imran : 85].</em></p>
<p>Qu'Allah nous accorde à tous la réussite dans ce qui comporte le bien et la droiture, dans ce bas monde et dans l'au-delà.</p>
<h4 id="sources"><strong>Sources :</strong> </h4>
<p>(1) C'est-à-dire : sans parures (vêtements de fête) et sans parfums.</p>
<p>(2) Rapporté par al-Bukhari (900) et Muslim (442) pour ce qui est de la première partie de la phrase.</p>
<p>Quant à la phrase : "bien que leurs maisons soient meilleures pour elles", elle est rapportée par Ahmad (2/438, 475), Abou Daoud (566), Ibn al-Jaroud (332) et Ibn Khuzyamah (1679). Ibn al-Mulaqqin l'a authentifiée dans son ouvrage Al-Khulasa (1/231). Le fait de sortir "sans parfum" (Tafilat) sera référencé à la page suivante.</p>
<p>(3) Rapporté par al-Bukhari (865) et Muslim (442) (138).</p>
<p>(4) Rapporté par al-Bukhari (865) et Muslim (990).</p>
<p>(5) L'expression "sortir sans parfum" (Tafilat) : rapporté par Abou Daoud (567) et Ahmad (2/76, 98). Ibn al-Mulaqqin l'a jugé authentique.</p>
<p>(6) Muslim (444). [Référence au hadith sur l'interdiction d'assister au 'Isha pour celle qui a utilisé de l'encens].</p>
<p>(7) « Al-Turuq al-Hukmiyyah » (page 406 - édition al-Madani). [Il s'agit de l'ouvrage d'Ibn al-Qayyim cité précédemment].</p>
<p>(8) Al-Bukhari (5096) et Muslim (2740). [Référence au hadith sur la tentation la plus nuisible pour les hommes].</p>
<p>(9) Précédemment cité au (1/165), note de bas de page numéro (1).</p>
<p>(10) Rapporté par Al-Bukhârî (869) et Muslim (445), et la formulation est celle de ce dernier.</p>
