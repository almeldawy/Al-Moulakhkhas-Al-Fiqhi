<p>La prière des deux Aïds — l'Aïd al-Fitr et l'Aïd al-Adha — est légiférée par le Livre (le Coran), la Sunna et le consensus des musulmans. Les polythéistes avaient l'habitude d'adopter des fêtes temporelles et spatiales، que l'Islam a annulées pour les remplacer par l'Aïd al-Fitr et l'Aïd al-Adh؛ ceci en guise de remerciement envers Allah le Très-Haut pour l'accomplissement de ces deux adorations grandioses : le jeûne de Ramadan et le pèlerinage à la Maison Sacrée d'Allah.</p>
<p>⁕ Il a été authentifié d'après le Prophète <span dir="rtl">ﷺ</span> que lorsqu'il arriva à Médine, les habitants avaient deux jours durant lesquels ils se divertissaient. Il <span dir="rtl">ﷺ</span> dit alors :</p>
<p class="ar"><strong><span dir="rtl">« قَدْ أَبْدَلَكُمُ اللَّهُ بِهِمَا خَيْرًا مِنْهُمَا : يَوْمَ النَّحْرِ ، وَيَوْمَ الْفِطْرِ »</span></strong></p>
<p><strong>"<em>Certes, Allah vous les a remplacés par deux jours meilleurs qu'eux : le jour de l'Al-Adha (le Sacrifice) et le jour de l'Al-Fitr (la Rupture).</em>"</strong><a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a></p>
<p>Il n'est donc pas permis d'ajouter à ces deux Aïds l'instauration d'autres fêtes, comme les célébrations de naissances (Mawalid) ou autres. Car cela constitue un ajout à ce qu'Allah a légiféré, une innovation (Bid'ah) dans la religion, une opposition à la Sunna du Maître des Messagers et une ressemblance aux mécréants. Que ces célébrations soient appelées "fêtes", "commémorations", "journées", "semaines" ou "années", tout cela ne fait pas partie de la Sunna de l'Islam.</p>
<p>C'est plutôt un acte de la période de l'ignorance (Jahiliyah) et une imitation des nations mécréantes parmi les pays occidentaux et autres. Le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><strong><span dir="rtl">« مَنْ تَشَبَّهَ بِقَوْمٍ ؛ فَهُوَ مِنْهُمْ »</span></strong></p>
<p><strong>"<em>Quiconque ressemble à un peuple en fait partie</em>"</strong><a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a>.</p>
<p>Et il <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><strong><span dir="rtl">« إِنَّ أَحْسَنَ الْحَدِيثِ كِتَابُ اللَّهِ ، وَخَيْرَ الْهَدْيِ هَدْيُ مُحَمَّدٍ ، وَشَرَّ الْأُمُورِ مُحْدَثَاتُهَا ، وَكُلَّ بِدْعَةٍ ضَلَالَةٌ »</span></strong></p>
<p><strong>"Certes, la meilleure parole est le Livre d'Allah, la meilleure guidance est celle de Muhammad, les pires choses sont les nouveautés [en religion], et toute innovation est égarement.</strong><a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a></p>
<p>Nous demandons à Allah de nous montrer la vérité comme étant la vérité et de nous accorder de la suivre, et de nous montrer le faux comme étant le faux et de nous accorder de l'éviter.</p>
<p>L'Aïd a été nommé ainsi (du mot arabe <em>'Awda</em> signifiant "retour") car il <strong>revient</strong> et se répète chaque année, et parce qu'il <strong>revient</strong> avec la joie et l'allégresse. Également parce qu'Allah y <strong>renouvelle</strong> Ses bienfaits envers Ses serviteurs suite à l'accomplissement de leurs actes d'obéissance que sont le jeûne et le pèlerinage.</p>
<p><strong>⁕ La preuve de la légitimité de la prière de l'Aïd</strong> réside dans la parole d'Allah le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿فَصَلِّ لِرَبِّكَ وَانْحَرْ﴾ [الكوثر: ٢]</span></p>
<p><strong>« <em>Accomplis donc la prière pour ton Seigneur et sacrifie</em> »</strong> [Al-Kawthar : 2]</p>
<p>ainsi que Sa parole :</p>
<p class="ar"><span dir="rtl">﴿قَدْ أَفْلَحَ مَن تَزَكَّىٰ وَذَكَرَ اسْمَ رَبِّهِ فَصَلَّىٰ﴾ [الأعلى: ١٤-١٥]</span></p>
<p><strong>« <em>Réussit certes celui qui se purifie, et prononce le nom de son Seigneur, puis prie</em> »</strong> [Al-A'lâ : 14-15].</p>
<p>Le Prophète <span dir="rtl">ﷺ</span>, ainsi que les califes après lui, l'ont pratiquée de manière assidue.</p>
<p>Le Prophète <span dir="rtl">ﷺ</span> a ordonné de l'accomplir, y compris pour les femmes. Il est donc recommandé (Sunna) pour la femme d'y assister, à condition qu'elle ne soit pas parfumée et qu'elle ne porte pas d'habits de parure ou de vanité (ostentatoires). Ceci conformément à la parole du Prophète <span dir="rtl">ﷺ</span> : <strong>« Qu’elles sortent sans parfum (<em>tafilât</em>) »</strong><a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a>, et elles doivent rester à l'écart des hommes. De plus, <strong>« les femmes en état de menstrues s'écartent du lieu de prière (<em>al-mousalla</em>) »</strong>.<a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a></p>
<p>Oum 'Atiyyah (qu'Allah l'agrée) a dit : <strong>« On nous ordonnait de sortir le jour de l'Aïd, au point de faire sortir la jeune vierge de sa chambre et même les femmes en état de menstrues. Elles se tenaient derrière les gens, proclamaient la grandeur d'Allah (le Takbir) avec eux et invoquaient avec eux, espérant la baraka (bénédiction) de ce jour et sa pureté. »</strong><a href="#fn6" class="footnote-ref" id="fnref6" role="doc-noteref"><sup>6</sup></a></p>
<p>⁕ Le fait de sortir pour la prière de l'Aïd et de l'accomplir selon ce modèle observé par tous constitue une manifestation des rites de l'Islam ; elle fait partie des symboles apparents de la religion. La première prière de l'Aïd que le Prophète <span dir="rtl">ﷺ</span> a accomplie fut celle de l'Aïd al-Fitr, au cours de la deuxième année de l'Hégire. Il <span dir="rtl">ﷺ</span> n'a cessé de la pratiquer assidûment jusqu'à ce qu'il quitte ce monde — que les prières et le salut d'Allah soient sur lui. Les musulmans ont perpétué cette pratique de génération en génération.</p>
<p>Si les habitants d'une ville venaient à la délaisser alors que toutes les conditions [de son obligation] sont réunies chez eux, le gouverneur (l'Imam) devrait les combattre. Car elle fait partie des symboles apparents de la religion, au même titre que l'Adhan (l'appel à la prière).</p>
<p>⁕ Il convient que la prière de l'Aïd soit accomplie dans un espace ouvert (le désert/la plaine) proche de la ville. En effet, le Prophète <span dir="rtl">ﷺ</span> priait les deux Aïds dans le <em>Mousalla</em> (lieu de prière en plein air) qui se situait à la porte de Médine. D'après Abou Sa'id : <strong>« Le Prophète <span dir="rtl">ﷺ</span> sortait le jour de la Rupture (Al-Fitr) et du Sacrifice (Al-Adha) vers le Mousalla »</strong> (Hadith unanimement reconnu authentique).<a href="#fn7" class="footnote-ref" id="fnref7" role="doc-noteref"><sup>7</sup></a></p>
<p>Il n'a pas été rapporté qu'il l'ait priée dans la mosquée sans une excuse valable. De plus, le fait de sortir dans un espace ouvert impose davantage le respect pour les musulmans et l'Islam, et manifeste plus clairement les rites de la religion. Cela ne présente pas de difficulté particulière car cet événement ne se répète pas fréquemment (contrairement à la prière du Vendredi).</p>
<p>Exception faite de La Mecque honorée, où la prière de l'Aïd s'accomplit au sein même de la Mosquée Sacrée (<em>Al-Masjid Al-Haram</em>).</p>
<p>⁕ Le temps de la prière de l'Aïd commence lorsque le soleil s'est élevé, après son lever, de la hauteur d'une lance. Car c'est le moment auquel le Prophète <span dir="rtl">ﷺ</span> la priait. Son temps s'étend jusqu'au zénith (lorsque le soleil quitte le milieu du ciel).</p>
<p>⁕ <strong>Si l'on n'apprend l'arrivée de l'Aïd qu'après le zénith (<em>Az-Zawal</em>), les gens devront accomplir la prière le lendemain matin en guise de rattrapage (<em>Qada'</em>)</strong>. Ceci conformément à ce qu'a rapporté Abou 'Umayr ibn Anas, d'après ses oncles paternels parmi les Ansars, qui dirent : "<em>Le croissant de Chawwal nous fut caché par les nuages, nous avons donc commencé la journée en jeûnant. Puis, à la fin du jour, des cavaliers arrivèrent et témoignèrent avoir vu le croissant la veille. Le Prophète <span dir="rtl">ﷺ</span> ordonna alors aux gens de rompre leur jeûne pour ce jour-là et de sortir le lendemain pour leur prière de l'Aïd.</em>" (Rapporté par Abou Daoud et Al-Daraqutni qui l'a jugé "bon", et authentifié par un groupe de savants du Hadith).<a href="#fn8" class="footnote-ref" id="fnref8" role="doc-noteref"><sup>8</sup></a></p>
<p>Si la prière pouvait être accomplie après le zénith, le Prophète <span dir="rtl">ﷺ</span> ne l'aurait pas reportée au lendemain. De plus, la prière de l'Aïd a été instituée pour être un grand rassemblement général ; il est donc nécessaire qu'elle soit précédée d'un délai permettant aux gens de se préparer.</p>
<p>⁕ Il est recommandé d'avancer la prière de l'Aïd al-Adha et de retarder celle de l'Aïd al-Fitr. Ceci se base sur ce qu'a rapporté [l'Imam] ach-Chafi'i selon une chaîne moursal : le Prophète <span dir="rtl">ﷺ</span> a écrit à 'Amrou ibn Hazm : « <em><strong>Hâte [la prière de] l'Adha et retarde celle du Fitr, et rappelle [les leçons de la religion] aux gens.</strong></em> »<a href="#fn9" class="footnote-ref" id="fnref9" role="doc-noteref"><sup>9</sup></a></p>
<p><em>[La sagesse est la suivante :]</em></p>
<ul>
<li><blockquote>
<p><strong>Pour l'Adha :</strong> afin de laisser plus de temps pour l'accomplissement du sacrifice (la Udhiyah) en avançant la prière.</p>
</blockquote></li>
</ul>
<ul>
<li><blockquote>
<p><strong>Pour le Fitr :</strong> afin de laisser plus de temps pour l'acquittement de la Zakat al-Fitr avant que ne débute la prière.</p>
</blockquote></li>
</ul>
<p>⁕ Il est recommandé (Sunna) de manger quelques dattes avant de sortir pour la prière de l'Aïd al-Fitr، et de ne rien manger le jour de l'Aïd al-Adha (le jour du sacrifice) jusqu'à ce que l'on ait prié. Cela s'appuie sur la parole de Buraydah : « <em><strong>Le Prophète <span dir="rtl">ﷺ</span> ne sortait pas le jour de l'Aïd al-Fitr sans avoir mangé، et il ne mangeait rien le jour de l'Aïd al-Adha jusqu'à ce qu'il ait prié.</strong></em> » Rapporté par Ahmad et d'autres.<a href="#fn10" class="footnote-ref" id="fnref10" role="doc-noteref"><sup>10</sup></a></p>
<p>Le Cheikh Taqî ad-Dîn (Ibn Taymiyyah) a dit <a href="#fn11" class="footnote-ref" id="fnref11" role="doc-noteref"><sup>11</sup></a>: « <em>Puisqu'Allah a mentionné la prière avant le sacrifice dans Sa parole : {<strong>Accomplis donc la prière pour ton Seigneur et sacrifie</strong>} [Al-Kawthar : 2]، et qu'Il a mentionné la purification (la Zakat) avant la prière dans Sa parole : {<strong>Certes، il réussit celui qui se purifie، et se rappelle le nom de son Seigneur، puis prie</strong>} [Al-A'lâ : 14-15] ; la Sunna veut alors que l'aumône (Zakat al-Fitr) soit donnée avant la prière lors de l'Aïd al-Fitr، et que le sacrifice ait lieu après la prière lors de l'Aïd al-Adha.</em> »</p>
<p><strong>⁕ Il est recommandé (Sunna) de se rendre tôt</strong> à la prière de l'Aïd, afin de pouvoir <strong>s'approcher de l'Imam</strong>, de bénéficier du mérite de l'attente de la prière, et ainsi d'augmenter sa récompense.</p>
<p><strong>⁕ Il est recommandé (Sunna)</strong> pour le musulman de s'embellir pour la prière de l'Aïd en portant ses <strong>plus beaux vêtements</strong>. Cela s'appuie sur le hadith de Jabir : « <em><strong>Le Prophète <span dir="rtl">ﷺ</span> possédait une parure (une Hulla) qu'il portait lors des deux fêtes et le jour du vendredi.</strong></em> » (Rapporté par Ibn Khuzaymah dans son <em>Sahih</em>)<a href="#fn12" class="footnote-ref" id="fnref12" role="doc-noteref"><sup>12</sup></a>. De même, il est rapporté d'après Ibn 'Umar qu'il portait ses plus beaux habits lors des deux fêtes. (Rapporté par Al-Bayhaqi avec une chaîne de transmission authentique).<a href="#fn13" class="footnote-ref" id="fnref13" role="doc-noteref"><sup>13</sup></a></p>
<p>⁕ <strong>La résidence permanente (<em>Al-Istîtan</em>) est une condition</strong> pour la prière de l'Aïd. Cela signifie que ceux qui l'accomplissent doivent être des résidents établis dans des habitations construites selon les usages locaux, tout comme pour la prière du Vendredi (<em>Jumu'ah</em>). Ainsi, la prière de l'Aïd n'est célébrée que là où il est permis de célébrer la prière du Vendredi. En effet, le Prophète <span dir="rtl">ﷺ</span> a rencontré un jour de l'Aïd lors de son pèlerinage [en tant que voyageur] et ne l'a pas priée, et il en fut de même pour ses califes après lui.</p>
<p>⁕ <strong>La prière de l'Aïd se compose de deux unités (Rak'at) effectuées avant le sermon (<em>Khutba</em>)</strong>. Cela s'appuie sur la parole d'Ibn 'Umar : « <em><strong>Le Messager d'Allah <span dir="rtl">ﷺ</span>, ainsi qu'Abu Bakr, 'Umar et 'Uthman, priaient les deux fêtes avant le sermon.</strong></em> » (Unanimement reconnu authentique)<a href="#fn14" class="footnote-ref" id="fnref14" role="doc-noteref"><sup>14</sup></a>. Cette pratique est largement établie dans la Sunna et suivie par la majorité des savants. At-Tirmidhi a dit : « <em>La pratique en vigueur chez les gens de science parmi les compagnons du Prophète <span dir="rtl">ﷺ</span> et d'autres est que la prière des deux fêtes se fait avant le sermon.</em> »</p>
<p><strong>La sagesse derrière le fait de retarder le sermon après la prière de l'Aïd</strong> (contrairement au Vendredi où il a lieu avant) est que le sermon du Vendredi est une <strong>condition de validité</strong> (<em>Shart</em>) de la prière ; or, la condition doit précéder l'acte qui en dépend. À l'inverse, le sermon de l'Aïd est une <strong>Sunna</strong> (un acte recommandé et non une condition obligatoire).</p>
<p>⁕ <strong>La prière des deux fêtes se compose de deux unités (Rak'at)</strong>, selon le consensus (<em>Ijma'</em>) des musulmans. Il est rapporté dans les deux recueils authentiques (<em>Al-Bukhari</em> et <em>Muslim</em>) ainsi qu'ailleurs, d'après Ibn 'Abbas, que le Prophète <span dir="rtl">ﷺ</span> est sorti le jour de l'Aïd al-Fitr et a prié deux unités, sans effectuer de prière ni avant ni après elles.<a href="#fn15" class="footnote-ref" id="fnref15" role="doc-noteref"><sup>15</sup></a> 'Umar a dit : « <em><strong>La prière de l'Aïd al-Fitr et de l'Aïd al-Adha compte deux unités ; elles sont complètes et ne sont pas une version raccourcie (de quatre unités), et ce, d'après la parole de votre Prophète <span dir="rtl">ﷺ</span>. Et certes, celui qui forge des mensonges est voué à l'échec.</strong></em> » (Rapporté par Ahmad et d'autres).<a href="#fn16" class="footnote-ref" id="fnref16" role="doc-noteref"><sup>16</sup></a></p>
<p>⁕ <strong>Il n'est pas légiféré de faire l'Adhan (l'appel à la prière) ni l'Iqama pour la prière de l'Aïd.</strong> Cela est basé sur ce que Muslim a rapporté d'après Jabir : « J<em>'ai prié l'Aïd avec le Prophète <span dir="rtl">ﷺ</span> plus d'une ou deux fois. Il commençait par la prière avant le sermon, <strong>sans Adhan ni Iqama</strong>.</em> »<a href="#fn17" class="footnote-ref" id="fnref17" role="doc-noteref"><sup>17</sup></a></p>
<p>⁕ <strong>Dans la première unité (Rak'ah), on prononce six Takbîrât</strong> après le <em>Takbîr</em> d'ouverture (<em>Al-Ihrâm</em>) et l'invocation d'ouverture (<em>Al-Istiftâh</em>), mais avant la demande de protection (<em>Al-Ta'awwudh</em>) et la récitation. Le <em>Takbîr</em> d'ouverture est un pilier (<em>Rukn</em>) indispensable sans lequel la prière n'est pas valide, tandis que les autres <em>Takbîrât</em> sont une Sunna (recommandés). On récite d'abord l'invocation d'ouverture (car elle se place au tout début de la prière), puis on enchaîne avec les <strong>six Takbîrât supplémentaires</strong>. Ensuite, on prononce le <em>Ta'awwudh</em> (le fait de dire "Je cherche protection auprès d'Allah...") juste après le sixième <em>Takbîr</em>, car cette formule est liée à la lecture du Coran et doit donc la précéder immédiatement. Enfin, on commence la récitation.</p>
<p>⁕ <strong>Dans la seconde unité (Rak'ah), on prononce cinq Takbîrât</strong> avant la récitation, en plus du <em>Takbîr</em> de transition (celui que l'on dit en se relevant de la prosternation). Cela s'appuie sur ce qu'Ahmad a rapporté d'après 'Amr ibn Shu'ayb, d'après son père, d'après son grand-père : « Le Prophète <span dir="rtl">ﷺ</span> a prononcé douze Takbîrât lors d'un Aïd : <strong>sept dans la première unité et cinq dans la seconde</strong> ». La chaîne de transmission de ce récit est jugée bonne (<em>Hasan</em>).<a href="#fn18" class="footnote-ref" id="fnref18" role="doc-noteref"><sup>18</sup></a></p>
<p>D'autres versions ont été rapportées concernant le nombre de Takbîr (proclamations de "Allahu Akbar"). L'Imam Ahmad — qu'Allah lui fasse miséricorde — a dit : « <em>Les compagnons du Prophète <span dir="rtl">ﷺ</span> ont divergé sur le nombre de Takbîr, et tout cela est permis.</em> »<a href="#fn19" class="footnote-ref" id="fnref19" role="doc-noteref"><sup>19</sup></a></p>
<p>⁕ <strong>On lève les mains à chaque Takbîr</strong> (proclamation de "Allahu Akbar") ; car le Prophète <span dir="rtl">ﷺ</span> levait les mains lors des Takbîrât.</p>
<p>⁕ Et il est recommandé de dire entre chaque deux takbîrât :</p>
<p class="ar"><span dir="rtl">اللهُ أكبرُ كبيراً، والحمدُ للهِ كثيراً، وسُبحانَ اللهِ بُكْرَةً وأَصِيلاً، وصلَّى اللهُ على محمدٍ النبيِّ وآلِهِ وسلَّمَ تسليماً كثيراً</span></p>
<p>"<em>Allah est le plus Grand en toute grandeur, la louange est à Allah en abondance, et gloire à Allah matin et soir. Que les éloges d'Allah soient sur Muhammad le Prophète, ainsi que sur sa famille, et qu'Il lui accorde un salut abondant.</em>"</p>
<p>Ceci en raison de la parole de 'Uqbah ibn 'Âmir qui a dit : "<em><strong>J'ai interrogé Ibn Mas'ûd sur ce qu'il faut dire après les takbîrât de l'Aïd ? Il répondit : 'Il [le fidèle] loue Allah, fait Ses éloges et prie sur le Prophète <span dir="rtl">ﷺ</span>'.</strong></em>"</p>
<p>Al-Bayhaqî l'a rapporté avec sa chaîne de transmission d'après Ibn Mas'ûd, en parole et en acte.</p>
<p>Et Hudhayfah a dit : "<em>Abû 'Abd ar-Rahmân [Ibn Mas'ûd] a dit vrai.</em>"<a href="#fn20" class="footnote-ref" id="fnref20" role="doc-noteref"><sup>20</sup></a></p>
<p>Et s'il prononce une autre formule de rappel (dhikr) que celle-ci, il n'y a pas de mal, car il n'y a pas de rappel spécifique [obligatoire] à ce sujet.</p>
<p>Ibn al-Qayyim a dit : "<em>Il [le Prophète <span dir="rtl">ﷺ</span>] marquait un court silence entre chaque deux takbîrât, et il n'a pas été rapporté de lui une formule de rappel spécifique entre les takbîrât</em>." Fin de citation. <a href="#fn21" class="footnote-ref" id="fnref21" role="doc-noteref"><sup>21</sup></a></p>
<p>⁕ S’il a un doute sur le nombre de <em>takbîrât</em> effectuées, il se base sur la certitude, c’est-à-dire le nombre le plus bas.</p>
<p>⁕ S’il oublie les <em>takbîrât</em> supplémentaires jusqu'à commencer la récitation [du Coran], celles-ci s'annulent (il ne les rattrape pas), car c'est une tradition (<em>sunna</em>) dont le moment opportun est passé.</p>
<p>⁕ De même, si le fidèle qui suit l’imam (<em>ma'mûm</em>) rejoint la prière alors que l'imam a déjà commencé la récitation, il ne fait pas les <em>takbîrât</em> supplémentaires. S'il le rejoint alors qu'il est en inclinaison (<em>rukû'</em>), il fait le <em>takbîr</em> d'entrée en sacralisation (<em>ihrâm</em>), puis s'incline, sans s'occuper de rattraper les <em>takbîrât</em>.</p>
<p>⁕ La prière de l'Aïd se compose de deux unités (<em>rak'ah</em>). L'imam y récite à voix haute, conformément à la parole d'Ibn 'Umar : "<em><strong>Le Prophète <span dir="rtl">ﷺ</span> récitait à voix haute lors des deux Aïds et de la prière pour la pluie (istisqâ)</strong></em>" — rapporté par Al-Dâraqutnî. <a href="#fn22" class="footnote-ref" id="fnref22" role="doc-noteref"><sup>22</sup></a>Les savants sont unanimes à ce sujet, cela a été transmis par les prédécesseurs aux successeurs, et la pratique des musulmans s'est maintenue ainsi.</p>
<p>⁕ Il est recommandé de réciter, lors de la première unité après la sourate <em>Al-Fatiha</em>, la sourate <strong>Al-A'lâ</strong> (<em>Sabbih ismi rabbika al-a'lâ</em>), et lors de la seconde, la sourate <strong>Al-Ghâshiyah</strong> ; car selon Samurah : "<em><strong>Le Prophète <span dir="rtl">ﷺ</span> récitait lors des deux Aïds : {Glorifie le nom de ton Seigneur le Très-Haut} et {T'est-il parvenu le récit de l'enveloppante ?}...</strong></em>" — rapporté par Ahmad.<a href="#fn23" class="footnote-ref" id="fnref23" role="doc-noteref"><sup>23</sup></a></p>
<p>Ou bien, il peut réciter dans la première unité la sourate <strong>Qâf</strong>, et dans la seconde la sourate <strong>Al-Qamar</strong> (<em>Iqtarabat</em>) ; conformément à ce qui est rapporté dans le "Sahîh Muslim", les "Sunan" et d'autres ouvrages, précisant que le Prophète <span dir="rtl">ﷺ</span> récitait les sourates {Qâf} et {L'Heure a approché...}. <a href="#fn24" class="footnote-ref" id="fnref24" role="doc-noteref"><sup>24</sup></a></p>
<p>Le Cheikh de l'Islam Ibn Taymiyya a dit : "<em>Peu importe ce qu'il récite, cela est permis, tout comme la récitation est permise dans les autres prières similaires. Cependant, s'il récite {Qâf} et {Al-Qamar} ou d'autres sourates mentionnées dans les récits prophétiques (Athar), cela est préférable. Sa récitation [celle du Prophète <span dir="rtl">ﷺ</span>] lors des grands rassemblements se faisait avec des sourates traitant de l'Unicité d'Allah (Tawhîd), des commandements et des interdits, du début de la création et de la résurrection, ainsi que des récits des prophètes avec leurs peuples. Elles évoquent la manière dont Allah a traité ceux qui les ont traités de menteurs et ont mécru en eux, ainsi que la destruction et le malheur qui les ont frappés, par opposition à ceux qui ont cru en eux et les ont suivis, et le salut et la préservation dont ils ont bénéficié.</em>" Fin de citation.<a href="#fn25" class="footnote-ref" id="fnref25" role="doc-noteref"><sup>25</sup></a></p>
<p>⁕ Une fois qu'il a terminé la prière par le salut final (<em>taslîm</em>), l'imam prononce deux sermons entre lesquels il s'assoit. Ceci est fondé sur ce qu'a rapporté 'Ubayd Allâh ibn 'Abd Allâh ibn 'Utbah : "<em>La tradition (sunna) veut que l'imam prononce deux sermons lors des deux Aïds, en les séparant par une assise.</em>" — rapporté par Al-Shâfi'î.<a href="#fn26" class="footnote-ref" id="fnref26" role="doc-noteref"><sup>26</sup></a></p>
<p>Ibn Mâjah rapporte d'après Jâbir : "I<em><strong>l a prêché debout, s'est assis un instant, puis s'est relevé.</strong></em>"<a href="#fn27" class="footnote-ref" id="fnref27" role="doc-noteref"><sup>27</sup></a> Et dans le "Sahîh" [de Muslim] et d'autres : "I<em><strong>l commença par la prière, puis se leva en s'appuyant sur Bilâl, ordonna la crainte d'Allah (taqwâ) et incita à Son obéissance...</strong></em>"<a href="#fn28" class="footnote-ref" id="fnref28" role="doc-noteref"><sup>28</sup></a> Et selon Muslim : "<em><strong>Puis il se tourne et se tient face aux gens, alors que ceux-ci sont restés assis dans leurs rangs.</strong></em>" <a href="#fn29" class="footnote-ref" id="fnref29" role="doc-noteref"><sup>29</sup></a></p>
<p>Lors du sermon de l'Aïd al-Fitr, l'imam encourage les fidèles à verser la <strong>Zakat al-Fitr</strong> (l'aumône de la rupture). Il leur en explique les règles : la quantité à donner, le moment propice pour le faire et la nature des denrées à offrir.</p>
<p>Lors du sermon de l'Aïd al-Adha, il les incite à procéder au <strong>sacrifice</strong> (<em>Udhhiyah</em>) et leur en expose les règles, car le Prophète <span dir="rtl">ﷺ</span> a mentionné de nombreuses prescriptions s'y rapportant durant son sermon de l'Aïd al-Adha.</p>
<p>Ainsi, il convient aux orateurs de concentrer leurs sermons sur les circonstances actuelles. Ils doivent expliquer aux gens ce qu'ils ont besoin de savoir à chaque moment opportun, après avoir recommandé la crainte d'Allah (<em>taqwâ</em>), exhorté et rappelé [les fidèles].</p>
<p>Cela est d'autant plus vrai lors de ces grands rassemblements et de ces nobles occasions. En effet, le sermon doit impérativement contenir ce qui est utile à l'auditeur, ce qui rappelle celui qui est distrait et ce qui instruit celui qui ignore.</p>
<p>⁕ Il convient que les femmes assistent à la prière de l'Aïd, comme cela a été exposé précédemment. Il convient également qu'une exhortation particulière leur soit adressée au sein du sermon de l'Aïd car le Prophète <span dir="rtl">ﷺ</span>, lorsqu'il vit qu'il n'avait pas été entendu par les femmes [pendant le sermon général], se rendit auprès d'elles, les exhorta et les incita à faire l'aumône (<em>sadaqa</em>). C'est ainsi qu'une partie du sujet du sermon de l'Aïd doit être consacrée aux femmes, en raison de leur besoin en la matière et afin de suivre l'exemple du Prophète <span dir="rtl">ﷺ</span>.</p>
<p>⁕ Parmi les règles de la prière de l'Aïd, il est détestable (<em>makrûh</em>) d'accomplir des prières surérogatoires (<em>tanafful</em>) avant ou après celle-ci sur le lieu même de la prière, jusqu'à ce que l'on quitte le lieu de rassemblement (<em>musallâ</em>).</p>
<p>Ceci en raison de la parole d'Ibn 'Abbâs (qu'Allah l'agrée) : "<em><strong>Le Prophète <span dir="rtl">ﷺ</span> est sorti le jour de l'Aïd ; il a prié deux unités (rak'ah) sans rien prier ni avant ni après.</strong></em>" — Rapporté par Al-Bukhârî et Muslim<a href="#fn30" class="footnote-ref" id="fnref30" role="doc-noteref"><sup>30</sup></a>. Cela permet également d'éviter que l'on s'imagine qu'il existe une prière régulière (<em>râtiba</em>) rattachée à l'Aïd, que ce soit avant ou après.</p>
<p>L'Imam Ahmad a dit : "<em>Les gens de Médine n'accomplissaient pas de prières volontaires (tatawwu') ni avant, ni après celle-ci</em>.”<a href="#fn31" class="footnote-ref" id="fnref31" role="doc-noteref"><sup>31</sup></a></p>
<p>Et Al-Zuhrî a dit : "<em>Je n'ai entendu aucun de nos savants mentionner qu'un seul des prédécesseurs (salaf) de cette communauté priait avant ou après cette prière [de l'Aïd]. Ibn Mas'ûd et Hudhayfah interdisaient d'ailleurs aux gens de prier avant elle.</em>"</p>
<p>⁕ Et lorsqu'il [le fidèle] retourne à son domicile, il n'y a pas de mal à ce qu'il y prie. Ceci est basé sur ce qu'a rapporté Ahmad et d'autres : "Le Prophète <span dir="rtl">ﷺ</span>, lorsqu'il rentrait chez lui après l'Aïd, priait deux unités (<em>rak'ah</em>)."<a href="#fn32" class="footnote-ref" id="fnref32" role="doc-noteref"><sup>32</sup></a></p>
<p>⁕ Il est recommandé (<em>sunna</em>) à celui qui a manqué la prière de l'Aïd, ou une partie de celle-ci, de la rattraper selon sa forme initiale : il l'accomplit en deux unités (<em>rak'ah</em>) avec ses <em>takbîrât</em> supplémentaires. En effet, le rattrapage doit reproduire la pratique initiale, conformément à la portée générale de la parole du Prophète <span dir="rtl">ﷺ</span> : "<em><strong>Priez ce que vous avez rejoint [de la prière avec l'imam], et complétez ce que vous avez manqué.</strong></em>"<a href="#fn33" class="footnote-ref" id="fnref33" role="doc-noteref"><sup>33</sup></a></p>
<p>Ainsi, s'il a manqué une unité avec l'imam, il en ajoute une autre [après le salut de l'imam]. S'il arrive alors que l'imam prononce le sermon (<em>khutbah</em>), il s'assoit pour l'écouter, puis une fois le sermon terminé, il l'accomplit en guise de rattrapage. Il n'y a pas de mal à la rattraper seul ou en groupe.</p>
<p>⁕ Il est recommandé (<em>sunna</em>) de pratiquer le <strong>Takbîr libre</strong> (<em>Al-Mutlaq</em>) lors des deux Aïds. Il s'agit de celui qui n'est pas limité à un moment précis [après les prières obligatoires]. L'homme doit élever la voix en le récitant, contrairement à la femme qui ne doit pas le faire à voix haute. On proclame ainsi le Takbîr durant les nuits précédant les deux Aïds, ainsi que durant les dix [premiers] jours de Dhul-Hijja, conformément à la parole d'Allah le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿وَلِتُكْمِلُوا الْعِدَّةَ وَلِتُكَبِّرُوا اللَّهَ عَلَىٰ مَا هَدَاكُمْ﴾ [البقرة : ١٨٥]</span></p>
<p>{<em><strong>afin que vous acheviez le nombre de jours et que vous proclamiez la grandeur d'Allah pour vous avoir guidés</strong></em>} (Sourate Al-Baqarah : 185).</p>
<p>Il est proclamé à voix haute dans les maisons, les marchés, les mosquées et tout lieu où il est permis d'évoquer Allah le Très-Haut. On le proclame également à voix haute en sortant vers le lieu de prière (<em>Musallâ</em>) selon ce qu'a rapporté Al-Dâraqutnî et d'autres d'après Ibn 'Umar : "<em><strong>Lorsqu'il sortait au matin du jour de la rupture (Al-Fitr) et du jour du sacrifice (Al-Adha), il proclamait le Takbîr à voix haute jusqu'à arriver au lieu de prière, puis il continuait jusqu'à l'arrivée de l'imam.</strong></em>"<a href="#fn34" class="footnote-ref" id="fnref34" role="doc-noteref"><sup>34</sup></a></p>
<p>Et dans le "Sahîh" : "<em><strong>Il nous était ordonné de faire sortir les femmes indisposées ; elles proclamaient alors le Takbîr en suivant celui des hommes, et elles le faisaient avec les gens.</strong></em>"<a href="#fn35" class="footnote-ref" id="fnref35" role="doc-noteref"><sup>35</sup></a> C'est donc une pratique recommandée car elle permet de manifester les rites de l'Islam.</p>
<p>Le Takbîr lors de l'Aïd al-Fitr est encore plus insisté (<em>akkad</em>), car Allah a dit :</p>
<p class="ar"><span dir="ltr">﴿</span><strong><span dir="rtl">وَلِتُكْمِلُوا الْعِدَّةَ وَلِتُكَبِّرُوا اللَّهَ عَلَىٰ مَا هَدَاكُمْ</span></strong><span dir="ltr">﴾</span></p>
<p>{<em><strong>afin que vous acheviez le nombre de jours [du Ramadan] et que vous proclamiez la grandeur d'Allah...</strong></em>}.</p>
<p>C'est donc pour cette fête qu'il est le plus souligné, car Allah l'a explicitement ordonné [dans ce contexte].</p>
<p>⁕ L'Aïd al-Adha se distingue par la légitimité du Takbîr Al-Muqayyad (restreint), qui est celui prescrit après chaque prière obligatoire accomplie en groupe. L'imam se tourne vers les fidèles, puis il proclame le Takbîr et ils le proclament après lui. Ceci est basé sur ce qu'ont rapporté ad-Dâraqutnî, Ibn Abî Chaybah et d'autres, d'après le hadith de Jâbir : "<em><strong>Lorsqu'il <span dir="rtl">ﷺ</span> priait le Sobh le matin du jour de 'Arafah, il disait : 'Allâhu Akbar...</strong></em>'" le hadith.<a href="#fn36" class="footnote-ref" id="fnref36" role="doc-noteref"><sup>36</sup></a></p>
<p>Le Takbîr restreint commence, pour celui qui n'est pas en état d'Ihrâm (sacralisation), après la prière de l'aube (Fajr) du <strong>jour de 'Arafah</strong> jusqu'à l'heure du 'Asr du <strong>dernier jour des jours d'at-Tachrîq</strong>.</p>
<p>Quant au pèlerin (Mouhrim), le Takbîr restreint commence pour lui après la prière du Dhohr du <strong>jour du Sacrifice</strong> (le 10ème jour) jusqu'au 'Asr du dernier jour d'at-Tachrîq. En effet, avant cela, il est occupé par la <em>Talbiya</em>.</p>
<p>D'après Jâbir, ad-Dâraqutnî a rapporté :</p>
<p>"<em><strong>Le Prophète <span dir="rtl">ﷺ</span> faisait le Takbîr lors de la prière du Fajr le jour de 'Arafah jusqu'à la prière du 'Asr du dernier jour d'at-Tachrîq, lorsqu'il terminait les prières obligatoires.</strong></em>"</p>
<p>Et selon une autre version :</p>
<p>"<em><strong>Lorsqu'il priait le Sobh le matin de 'Arafah, il se tournait vers ses compagnons et disait : 'Restez à vos places', puis il disait : 'Allâhu Akbar, Allâhu Akbar, Lâ ilâha illallâh, wallâhu Akbar, Allâhu Akbar, wa lillâhil-hamd'.</strong></em>"<a href="#fn37" class="footnote-ref" id="fnref37" role="doc-noteref"><sup>37</sup></a></p>
<p>Allah — le Très-Haut — a dit :</p>
<p class="ar"><span dir="ltr">﴿</span><strong><span dir="rtl">وَاذْكُرُوا اللَّهَ فِي أَيَّامٍ مَعْدُودَاتٍ</span></strong><span dir="rtl">﴾ [البقرة: ٢٠٣]</span></p>
<p>"<em><strong>Et invoquez Allah pendant des jours nommés.</strong></em>" [Al-Baqarah : 203]</p>
<p>Ce sont les jours d'at-Tachrîq.</p>
<p>L'Imam an-Nawawî a dit : "<em>C'est l'avis prépondérant (ar-Râjih) et c'est la pratique en vigueur dans les cités.</em>"<a href="#fn38" class="footnote-ref" id="fnref38" role="doc-noteref"><sup>38</sup></a></p>
<p>Cheikh al-Islâm Ibn Taymiyya a dit : "<em>Le plus authentique des avis concernant le Takbîr, celui que suit la majorité des Salaf (prédécesseurs) et des juristes, est de faire le Takbîr après chaque prière du Fajr du jour de 'Arafah jusqu'au dernier des jours d'at-Tachrîq. Car il est mentionné dans la Sunna : 'Le jour de 'Arafah, le jour du Sacrifice et les jours de Minâ sont nos jours de fête, ô gens de l'Islam, et ce sont des jours de manger, de boire et de rappel d'Allah'</em><a href="#fn39" class="footnote-ref" id="fnref39" role="doc-noteref"><sup>39</sup></a><em>.Le début du Takbîr restreint pour le pèlerin après le Dhohr du jour du Sacrifice s'explique par le fait que la Talbiya s'interrompt avec la lapidation de la stèle d'al-'Aqaba. Le temps de la lapidation pour la stèle d'al-'Aqaba se situe en matinée (Dhouha) du jour du Sacrifice ; le pèlerin est donc comme celui qui n'est pas en sacralisation à ce moment-là. Cependant, s'il a lapidé avant le Fajr, il ne commence le Takbîr qu'après la prière du Dhohr, en se basant sur la pratique majoritaire.</em>” Fin de citation.<a href="#fn40" class="footnote-ref" id="fnref40" role="doc-noteref"><sup>40</sup></a></p>
<p>⁕ La formule du Takbîr consiste à dire :</p>
<blockquote>
<p><strong>« <em>Allâhu Akbar, Allâhu Akbar, Lâ ilâha illallâh, wallâhu Akbar, Allâhu Akbar, wa lillâhil-hamd</em> »</strong> &gt; <em>(Allah est le plus Grand, Allah est le plus Grand, il n'y a de divinité digne d'adoration qu'Allah, Allah est le plus Grand, Allah est le plus Grand, et à Allah appartient la louange).</em></p>
</blockquote>
<p>⁕ Il n'y a pas de mal à ce que les gens se présentent mutuellement leurs vœux, par exemple en disant :</p>
<blockquote>
<p><strong>« Taqabbalallâhu minnâ wa minkum »</strong> &gt; <em>(Qu'Allah accepte [les bonnes œuvres] de notre part et de la vôtre).</em></p>
</blockquote>
<p>Le Cheikh al-Islâm Ibn Taymiyya a dit : « <em><strong>Il a été rapporté qu'un groupe de Compagnons le faisait, et les Imams l'ont autorisé, comme l'Imam Ahmad et d'autres.</strong></em> » Fin de citation.<a href="#fn41" class="footnote-ref" id="fnref41" role="doc-noteref"><sup>41</sup></a></p>
<p>Le but de ces félicitations est de manifester de l'affection et d'exprimer sa joie.</p>
<p>L'Imam Ahmad a dit : « <em>Je ne prends pas l'initiative de féliciter quelqu'un, mais si quelqu'un commence par me féliciter, je lui réponds.</em> »</p>
<p>Ceci est dû au fait que répondre à une salutation est une obligation (Wajib), alors que prendre l'initiative de féliciter n'est pas une Sunna qui a été formellement ordonnée, mais ce n'est pas non plus une chose interdite.</p>
<p>Il n'y a pas de mal non plus à échanger des poignées de main lors des félicitations.</p>
<p>Et Allah — le Très-Haut — est plus savant.</p>
