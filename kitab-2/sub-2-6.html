<p>Ô musulman ! Certes, la prière est un acte d'adoration immense, comprenant des paroles et des actes prescrits qui constituent sa forme complète. Elle est définie par les savants comme étant : <strong>un ensemble de paroles et d'actes commençant par le <em>Takbir</em> (dire Allahu Akbar) et se terminant par le <em>Taslim</em> (le salut final).</strong></p>
<p>Ces paroles et ces actes se divisent en trois catégories : <strong>les Piliers (Arkân)</strong>, <strong>les Obligations (Wâjibât)</strong> et <strong>les Actes recommandés (Sunnan)</strong>.</p>
<p><strong>1. Les Piliers (Arkân) :</strong></p>
<p>Si l'un d'entre eux est délaissé, la prière devient nulle, que cet oubli soit volontaire ou involontaire. Autrement, l'unité de prière (<em>Rak'ah</em>) dans laquelle le pilier a été omis est annulée, et celle qui suit prend sa place, comme cela sera expliqué plus loin.</p>
<p><strong>2. Les Obligations (Wâjibât) :</strong></p>
<p>Si l'une d'entre elles est délaissée volontairement, la prière devient nulle. En revanche, si elle est délaissée par oubli (involontairement), la prière n'est pas annulée, mais cet oubli doit être compensé par la <strong>prosternation de l'oubli</strong> (<em>Sujud as-Sahu</em>).</p>
<p><strong>3. Et les actes recommandés (Sunnan) :</strong> La prière n'est pas annulée par le délaissement de l'un d'entre eux, que ce soit volontairement ou par oubli. Cependant, la perfection de la forme de la prière s'en trouve diminuée par cela.</p>
<p>Le Prophète <span dir="rtl">ﷺ</span> a accompli une prière complète avec l'ensemble de ses piliers, de ses obligations et de ses actes recommandés, et il a dit :</p>
<p class="ar"><span dir="rtl">« صَلُّوا كَمَا رَأَيْتُمُونِي أُصَلِّي »</span></p>
<p><em><strong>« Priez comme vous m'avez vu prier... » (1).</strong></em></p>
<h3 id="section"></h3>
<h3 id="première-partie-les-piliers-de-la-prière-au-nombre-de-quatorze-qui-sont-les-suivants"><strong>Première partie : Les piliers de la prière au nombre de quatorze, qui sont les suivants :</strong></h3>
<h4 id="le-premier-pilier-la-station-debout-al-qiyâm-dans-la-prière-obligatoire."><strong>Le premier pilier : La station debout (Al-Qiyâm) dans la prière obligatoire.</strong></h4>
<p>Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿ وَقُومُوا لِلَّهِ قَانِتِينَ ﴾ [سُورَةُ البَقَرَةِ : ٢٣٨]</span></p>
<p><strong>« Et tenez-vous debout devant Allah, avec humilité »</strong> [Al-Baqarah : 238].</p>
<p>Et dans le hadith de 'Imrân, rapporté de manière attribuée au Prophète (<em>marfû'an</em>) :</p>
<p class="ar"><span dir="rtl">« صَلِّ قَائِماً، فَإِنْ لَمْ تَسْتَطِعْ فَقَاعِداً، فَإِنْ لَمْ تَسْتَطِعْ فَعَلَى جَنْبٍ »</span></p>
<p><strong>« Prie debout ; si tu ne le peux pas, alors assis ; et si tu ne le peux pas, alors sur le côté. »</strong> (2)</p>
<p>Ainsi, le verset et le hadith prouvent l'obligation de la station debout dans la prière prescrite pour quiconque en est capable.</p>
<p>Si une personne n'est pas capable de se tenir debout à cause d'une <strong>maladie</strong>, elle prie selon son état : assise ou sur le côté. Sont assimilés au malade : la personne en état de peur, la personne dévêtue (n'ayant rien pour se couvrir), ou celle dont le traitement médical nécessite de rester assise ou allongée. De même pour celui qui ne peut se tenir debout car le <strong>plafond est trop bas</strong> au-dessus de lui et qu'il ne peut pas sortir.</p>
<p>Il est également permis de délaisser la station debout pour celui qui prie derrière l'<strong>imam officiel</strong> (<em>Al-Imâm ar-Râtib</em>) lorsque celui-ci est incapable de se tenir debout. Si l'imam prie assis, ceux qui sont derrière lui prient également assis, afin de suivre leur imam. En effet, lorsque le Prophète <span dir="rtl">ﷺ</span> est tombé malade, il a prié assis et il a ordonné à ceux derrière lui de s'asseoir (3).</p>
<p><strong>Quant à la prière surérogatoire (An-Nâfila) :</strong> il est permis de la prier debout ou assis. La station debout n'y est pas obligatoire, car il est établi que le Prophète <span dir="rtl">ﷺ</span> la priait parfois assis sans motif d'excuse particulière.</p>
<h4 id="le-deuxième-pilier-le-takbîr-dentrée-en-sacralisation-takbîrat-al-ihrâm-au-début-de-celle-ci"><strong>Le deuxième pilier : Le Takbîr d'entrée en sacralisation (Takbîrat al-Ihrâm) au début de celle-ci :</strong></h4>
<p>En raison de la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">« ثُمَّ اسْتَقْبِلِ الْقِبْلَةَ وَكَبِّرْ »</span></p>
<p><em><strong>« Puis fais face à la Qibla et dis : Allahu Akbar » (4),</strong></em></p>
<p>et de sa parole <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">« تَحْرِيمُهَا التَّكْبِيرُ »</span></p>
<p><em><strong>« Sa sacralisation est le Takbîr » (5).</strong></em></p>
<p>Il n'a jamais été rapporté à son sujet <span dir="rtl">ﷺ</span> qu'il ait commencé la prière par autre chose que le Takbîr. Sa formulation est de dire : <strong>« Allahu Akbar »</strong> (Allah est le plus Grand). Rien d'autre ne peut s'y substituer, car c'est ce qui a été transmis de la part du Messager <span dir="rtl">ﷺ</span>.</p>
<h4 id="le-troisième-pilier-la-lecture-de-la-fâtiha"><strong>Le troisième pilier : La lecture de la Fâtiha :</strong></h4>
<p>En raison du hadith :</p>
<p class="ar"><span dir="rtl">« لَا صَلَاةَ لِمَنْ لَمْ يَقْرَأْ بِفَاتِحَةِ الْكِتَابِ »</span></p>
<p><em><strong>« Point de prière pour celui qui ne lit pas l'Ouverture du Livre (Al-Fâtiha) » (6).</strong></em></p>
<p>Sa récitation (la Fâtiha) est un <strong>pilier dans chaque unité de prière (<em>Rak'ah</em>)</strong>. Il est authentifié que le Prophète <span dir="rtl">ﷺ</span> la récitait dans chaque <em>Rak'ah</em>, et lorsqu'il <span dir="rtl">ﷺ</span> a enseigné à celui qui priait mal comment prier, il lui a ordonné de réciter la Fâtiha.</p>
<p><strong>Est-elle obligatoire pour chaque prieur, ou son obligation se limite-t-elle à l'imam et à celui qui prie seul ?</strong> Il existe à ce sujet une divergence entre les savants. L'avis le plus prudent est que celui qui prie derrière un imam (<em>Al-Ma'mûm</em>) doit veiller à sa récitation dans les prières où l'imam ne récite pas à voix haute (prière silencieuse), ainsi que pendant les temps de silence de l'imam lors de la prière à voix haute.</p>
<h4 id="le-quatrième-pilier-linclinaison-ar-roukû-dans-chaque-unité-de-prière"><strong>Le quatrième pilier : L'inclinaison (Ar-Roukû') dans chaque unité de prière :</strong></h4>
<p>En raison de la parole d'Allah le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿ يَا أَيُّهَا الَّذِينَ آمَنُوا ارْكَعُوا وَاسْجُدُوا ﴾</span></p>
<p><em><strong>« Ô vous qui croyez ! Inclinez-vous, prosternez-vous » [Al-Hajj : 77].</strong></em></p>
<p>L'inclinaison est également établie dans la Sunna du Messager <span dir="rtl">ﷺ</span> ; elle est donc obligatoire selon le Livre (le Coran), la Sunna et le consensus (<em>Al-Ijmâ'</em>).</p>
<p>L'inclinaison signifie linguistiquement : <strong>le fléchissement</strong>. Le degré minimum d'inclinaison requis pour celui qui prie debout est de se courber jusqu'à ce que ses paumes puissent atteindre ses genoux, s'il est de constitution physique moyenne (c'est-à-dire n'ayant pas les bras anormalement longs ou courts). Pour celui qui n'est pas de constitution moyenne, on estime l'inclinaison de la même manière. Quant à l'inclinaison minimale pour celui qui prie assis, elle consiste à ce que son visage se retrouve face à l'endroit situé au-delà de ses genoux au sol.</p>
<h4 id="les-cinquième-et-sixième-piliers-se-redresser-de-linclinaison-et-se-tenir-droit-al-itidâl"><strong>Les cinquième et sixième piliers : Se redresser de l'inclinaison et se tenir droit (Al-I'tidâl) :</strong></h4>
<p>Il s'agit de se relever après le <em>Roukû'</em> et de rester debout, dans la même position qu'avant l'inclinaison. Cela est fondé sur le fait que le Prophète <span dir="rtl">ﷺ</span> a toujours pratiqué cela, et il a dit :</p>
<p class="ar"><span dir="rtl">« صَلُّوا كَمَا رَأَيْتُمُونِي أُصَلِّي »</span></p>
<p><em><strong>« Priez comme vous m'avez vu prier » (7).</strong></em></p>
<h4 id="le-septième-pilier-la-prosternation-as-sujûd"><strong>Le septième pilier : La prosternation (As-Sujûd) :</strong></h4>
<p>Elle consiste à poser le <strong>front sur le sol</strong>. Elle doit être effectuée sur les <strong>sept membres</strong> (le front incluant le nez, les deux mains, les deux genoux et les pointes des deux pieds), et ce, deux fois dans chaque unité de prière (<em>Rak'ah</em>).</p>
<p>Ceci est basé sur la parole d'Allah le Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿ وَاسْجُدُوا ﴾</span></p>
<p><em><strong>« ...et prosternez-vous » [Al-Hajj : 77],</strong></em> ainsi que sur les hadiths mentionnant l'ordre du Prophète <span dir="rtl">ﷺ</span> à ce sujet, sa propre pratique, et sa parole :</p>
<p class="ar"><span dir="rtl">« صَلُّوا كَمَا رَأَيْتُمُونِي أُصَلِّي »</span></p>
<p><em><strong>« Priez comme vous m'avez vu prier » (7).</strong></em></p>
<p>Les <strong>sept membres</strong> [sur lesquels la prosternation doit s'effectuer] sont : <strong>le front et le nez, les deux mains, les deux genoux, et les pointes des deux pieds.</strong></p>
<p>Chacun de ces membres doit impérativement être en contact avec l'endroit de la prosternation autant que possible. La prosternation est l'un des plus grands piliers de la prière ; c'est l'état où le serviteur est le plus proche de son Seigneur. La meilleure des situations est celle où le serviteur est le plus proche d'Allah, et c'est la prosternation.</p>
<h4 id="le-huitième-pilier-se-redresser-de-la-prosternation-et-sasseoir-entre-les-deux-prosternations"><strong>Le huitième pilier : Se redresser de la prosternation et s'asseoir entre les deux prosternations :</strong></h4>
<p>En raison de la parole d'Aïcha (qu'Allah soit satisfait d'elle) :</p>
<p class="ar"><span dir="rtl">« كَانَ النَّبِيُّ ﷺ إِذَا رَفَعَ رَأْسَهُ مِنَ السُّجُودِ؛ لَمْ يَسْجُدْ حَتَّى يَسْتَوِيَ قَاعِداً »</span></p>
<p><em><strong>« Lorsque le Prophète <span dir="rtl">ﷺ</span> relevait sa tête de la prosternation, il ne se prosternait pas de nouveau avant de s'être assis bien droit » (8).</strong></em></p>
<h4 id="le-neuvième-pilier-la-quiétude-at-toumanînah-dans-tous-les-actes-précités"><strong>Le neuvième pilier : La quiétude (At-Touma'nînah) dans tous les actes précités :</strong></h4>
<p>Il s'agit de marquer un temps d'arrêt ou de repos, même bref. Le Coran et la Sunna prouvent que celui qui ne respecte pas cette quiétude dans sa prière n'est pas considéré comme ayant prié, et il lui est ordonné de la recommencer.</p>
<h4 id="les-dixième-et-onzième-piliers-le-dernier-tachahhoud-et-lassise-qui-laccompagne"><strong>Les dixième et onzième piliers : Le dernier Tachahhoud et l'assise qui l'accompagne :</strong></h4>
<p>Cela consiste à dire : « <em>At-Tahiyyât...</em> » jusqu'à « <em>Allahoumma salli 'alâ Muhammad</em> ». Il est en effet établi que le Prophète <span dir="rtl">ﷺ</span> le faisait assidûment et il a dit :</p>
<p class="ar"><span dir="rtl">« صَلُّوا كَمَا رَأَيْتُمُونِي أُصَلِّي »</span></p>
<p><em><strong>« Priez comme vous m'avez vu prier »</strong></em> (9).</p>
<p>De plus, Ibn Mas'oud (qu'Allah soit satisfait de lui) a dit :</p>
<p class="ar"><span dir="rtl">« كُنَّا نَقُولُ قَبْلَ أَنْ يُفْرَضَ عَلَيْنَا التَّشَهُّدُ »</span></p>
<p><strong>« Nous disions cela avant que le Tachahhoud ne nous soit imposé »</strong> (10).</p>
<p>L'expression « <em><strong>avant qu'il ne soit imposé</strong></em> » est une preuve de son caractère obligatoire (<em>Fard</em>).</p>
<h4 id="le-douzième-pilier-la-prière-sur-le-prophète-ﷺ-lors-du-dernier-tachahhoud"><strong>Le douzième pilier : La prière sur le Prophète <span dir="rtl">ﷺ</span> lors du dernier Tachahhoud :</strong></h4>
<p>En disant : <strong>« Allahoumma salli 'alâ Muhammad »</strong> (Ô Allah, prie sur Muhammad). Tout ce qui est ajouté à cette formule est considéré comme une <em>Sunna</em> (recommandé mais non pilier).</p>
<h4 id="le-treizième-pilier-lordre-entre-les-piliers-at-tartîb"><strong>Le treizième pilier : L'ordre entre les piliers (At-Tartîb) :</strong></h4>
<p>Car le Prophète <span dir="rtl">ﷺ</span> accomplissait les piliers de la prière de manière ordonnée et il a dit :</p>
<p class="ar"><span dir="rtl">« صَلُّوا كَمَا رَأَيْتُمُونِي أُصَلِّي »</span></p>
<p><em><strong>« Priez comme vous m'avez vu prier » (11).</strong></em></p>
<p>De plus, il a enseigné la prière à celui qui la pratiquait mal en utilisant la particule de coordination « <strong>puis</strong> » (<em>thoumma</em>), ce qui indique une succession ordonnée.</p>
<h4 id="le-quatorzième-pilier-le-salut-final-at-taslîm"><strong>Le quatorzième pilier : Le salut final (At-Taslîm) :</strong></h4>
<p>En raison de la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">« وَخِتَامُهَا التَّسْلِيمُ »</span></p>
<p><em><strong>« ...et sa conclusion est le salut » (12),</strong></em></p>
<p>et de sa parole :</p>
<p class="ar"><span dir="rtl">« وَتَحْلِيلُهَا التَّسْلِيمُ »</span></p>
<p><em><strong>« ...et sa désacralisation est le salut » (12).</strong></em></p>
<p>Le salut final a été légiféré pour sortir de l'état de sacralisation de la prière ; il en est donc la conclusion et le signe de sa fin.</p>
<h4 id="cher-lecteur-celui-qui-délaisse-un-pilier-parmi-ces-piliers"><strong>Cher lecteur ! Celui qui délaisse un pilier parmi ces piliers :</strong></h4>
<p><strong>S'il s'agit du Takbir d'entrée (Al-Ihrâm) :</strong> Sa prière n'a même pas commencé (elle est nulle dès le départ).</p>
<p><strong>S'il s'agit d'un autre pilier (ex: inclinaison, prosternation) et qu'il le délaisse volontairement :</strong> Sa prière est nulle.</p>
<p><strong>S'il le délaisse par oubli :</strong></p>
<ul>
<li><blockquote>
<p><strong>S'il s'en rappelle avant de commencer la lecture (du Coran) de la Rak'ah suivante :</strong> Il doit revenir en arrière, accomplir le pilier oublié, puis continuer sa prière normalement.</p>
</blockquote></li>
<li><blockquote>
<p><strong>S'il ne s'en rappelle qu'après avoir commencé la lecture de la Rak'ah suivante :</strong> La Rak'ah où l'oubli a eu lieu est <strong>annulée</strong>. La Rak'ah actuelle prend alors sa place (elle devient la précédente). Il termine sa prière ainsi et effectue la <strong>prosternation de l'oubli</strong> (<em>Sujud as-Sahu</em>).</p>
</blockquote></li>
<li><blockquote>
<p><strong>S'il ne s'en rappelle qu'après le salut final :</strong> * S'il s'agit du dernier Tachahhoud ou du salut, il l'accomplit, puis fait le <em>Sujud as-Sahu</em> et salue à nouveau.</p>
</blockquote></li>
<li><blockquote>
<p>S'il s'agit d'un autre pilier (inclinaison/prosternation), il doit accomplir une Rak'ah complète pour remplacer celle qui était défectueuse, puis faire le <em>Sujud as-Sahu</em>.</p>
</blockquote></li>
<li><blockquote>
<p><strong>Attention :</strong> Si le temps écoulé après la prière est trop long ou s'il a rompu ses ablutions, il doit alors <strong>refaire toute la prière</strong>. »</p>
</blockquote></li>
</ul>
<p>Quelle immense adoration que cette prière, et quels nobles paroles et actes elle contient ! Qu'Allah nous aide tous à l'accomplir et à la préserver.</p>
<h3 id="la-deuxième-partie-les-obligations-de-la-prière-et-elles-sont-au-nombre-de-huit"><strong>La deuxième partie : Les obligations de la prière, et elles sont au nombre de huit :</strong></h3>
<p><strong>Le premier :</strong> Toutes les formulations du <em>Takbîr</em> (dire <em>Allâhu Akbar</em>) durant la prière, à l'exception du <em>Takbîr</em> d'ouverture (<em>al-Ihrâm</em>), sont obligatoires. Ainsi, tous les <em>Takbîrs</em> de transition font partie des obligations et non des piliers (<em>Ar-Rukn</em>).</p>
<p><strong>Le deuxième :</strong> Le <em>Tasmî’</em> ; c'est-à-dire le fait de dire : « <em>Sami’a Allâhu liman hamidah</em> » (Allah a entendu celui qui L'a loué). Cela est obligatoire pour l'imam et celui qui prie seul. Quant à celui qui prie derrière un imam (<em>al-Ma’mûm</em>), il ne doit pas le dire.</p>
<p><strong>Le troisième :</strong> Le <em>Tahmîd</em> ; c'est-à-dire le fait de dire : « <em>Rabbanâ wa laka-l-hamd</em> » (Notre Seigneur, à Toi la louange). Cela est requis pour l'imam, celui qui prie derrière lui et celui qui prie seul ، en raison de la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«إِذَا قَالَ الإِمَامُ: سَمِعَ اللهُ لِمَنْ حَمِدَهُ؛ فَقُولُوا: رَبَّنَا وَلَكَ الحَمْدُ».</span></p>
<p><em><strong>« Lorsque l'imam dit : "Allah a entendu celui qui L'a loué", dites : "Notre Seigneur, à Toi la louange" ». (13)</strong></em></p>
<p><strong>Le quatrième :</strong> Dire : « <em>Subhâna Rabbî al-'Adhîm</em> » (Gloire à mon Seigneur l'Immense) lors de l'inclinaison, une seule fois. Il est recommandé (<em>Sunnah</em>) d'augmenter jusqu'à trois fois , ce qui constitue le minimum de la perfection , et jusqu'à dix fois , ce qui en est le maximum.</p>
<p><strong>Le cinquième :</strong> Dire : « <em>Subhâna Rabbî al-A'lâ</em> » (Gloire à mon Seigneur le Très-Haut) lors de la prosternation, une seule fois. Il est recommandé d'augmenter jusqu'à trois fois.</p>
<p><strong>Le sixième :</strong> Dire : « <em>Rabbi-ghfir lî</em> » (Seigneur, pardonne-moi) entre les deux prosternations, une seule fois. Il est recommandé d'augmenter jusqu'à trois fois.</p>
<p><strong>Le septième :</strong> Le premier <em>Tashahhud</em>. Il consiste à dire :</p>
<p class="ar"><span dir="rtl">«التَّحِيَّاتُ لِلَّهِ وَالصَّلَوَاتُ وَالطَّيِّبَاتُ، السَّلَامُ عَلَيْكَ أَيُّهَا النَّبِيُّ وَرَحْمَةُ اللهِ وَبَرَكَاتُهُ، السَّلَامُ عَلَيْنَا وَعَلَى عِبَادِ اللهِ الصَّالِحِينَ، أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا اللهُ، وَأَشْهَدُ أَنَّ مُحَمَّداً عَبْدُهُ وَرَسُولُهُ»</span></p>
<p><em><strong>« Les salutations sont pour Allah, ainsi que les prières et les bonnes paroles. Que la paix soit sur toi, ô Prophète, ainsi que la miséricorde d'Allah et Ses bénédictions. Que la paix soit sur nous et sur les serviteurs vertueux d'Allah. J'atteste qu'il n'y a de divinité [digne d'adoration] qu'Allah, et j'atteste que Muhammad est Son serviteur et Son Messager », ou toute autre formulation similaire rapportée [dans la tradition].</strong></em></p>
<p><strong>Le huitième :</strong> S'asseoir pour le premier <em>Tashahhud</em>. Cela est dû au fait que le Prophète <span dir="rtl">ﷺ</span> le faisait et s'y tenait avec constance, conformément à sa parole <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">« صَلُّوا كَمَا رَأَيْتُمُونِي أُصَلِّي »</span></p>
<p><em><strong>« Priez comme vous m'avez vu prier » (14).</strong></em></p>
<p>Et quiconque délaisse délibérément l'une de ces huit obligations — qu'elles soient verbales ou gestuelles — voit sa prière annulée, car il s'est montré désinvolte envers celle-ci. En revanche, celui qui la délaisse par oubli ou par ignorance doit accomplir les prosternations de l'oubli (Sujûd as-Sahw). En effet, il a délaissé une obligation dont l'omission est normalement interdite, et il doit donc compenser ce manque par les prosternations de l'oubli.</p>
<h3 id="la-troisième-partie-les-sunan-actes-recommandés-de-la-prière"><strong>La troisième partie : Les Sunan (actes recommandés) de la prière</strong> </h3>
<p>La troisième catégorie des actes et paroles de la prière — en dehors de ce qui a été mentionné dans les deux premières parties [piliers et obligations] — est une <strong>Sunnah</strong> (tradition recommandée). La prière ne s'annule pas par son omission</p>
<p><strong>Les Sunan de la prière sont de deux types :</strong></p>
<p><strong>Le premier type : Les Sunan verbales (paroles).</strong> Elles sont nombreuses, parmi lesquelles :</p>
<ul>
<li><blockquote>
<p>L'invocation d'ouverture (<em>al-Istiftâh</em>).</p>
</blockquote></li>
<li><blockquote>
<p>La demande de protection contre Satan (<em>at-Ta'awwudh</em>).</p>
</blockquote></li>
<li><blockquote>
<p>La <em>Basmalah</em> (dire <em>Bismillah</em>).</p>
</blockquote></li>
<li><blockquote>
<p>Le <em>Ta'mîn</em> (dire « Amine »).</p>
</blockquote></li>
<li><blockquote>
<p>La récitation de ce qui est possible du Coran après la Fatiha lors de la prière de l'aube (<em>al-Fajr</em>), de la prière du vendredi, de l'Aïd, de la prière de l'éclipse, ainsi que dans les deux premières unités (<em>Rak'ahs</em>) du Maghrib, de l'Isha, du dhuhr et de l'Asr.</p>
</blockquote></li>
</ul>
<p><em>Font également partie des Sunan verbales :</em></p>
<ul>
<li><blockquote>
<p>Dire : « [Une louange] qui emplit les cieux, qui emplit la terre et qui emplit tout ce que Tu voudras d'autre après cela » après avoir dit : « Rabbanâ wa laka-l-hamd ».</p>
</blockquote></li>
<li><blockquote>
<p>Ce qui excède la première fois lors de la glorification (Tasbîh) de l'inclinaison et de la prosternation.</p>
</blockquote></li>
<li><blockquote>
<p>Ce qui excède la première fois dans la demande de pardon : « Rabbi-ghfir lî » entre les deux prosternations.</p>
</blockquote></li>
<li><blockquote>
<p>L'invocation : « Ô Allah, je cherche protection auprès de Toi contre le châtiment de l'Enfer, contre le châtiment de la tombe, contre les épreuves de la vie et de la mort, et contre l'épreuve de l'Antéchrist (al-Masîh ad-Dajjâl) », ainsi que toutes les invocations supplémentaires lors du dernier Tashahhud.</p>
</blockquote></li>
</ul>
<p><strong>Le second type : Les Sunan gestuelles (actes).</strong> Parmi elles :</p>
<ul>
<li><blockquote>
<p>Lever les mains lors du <em>Takbîr</em> d'ouverture (<em>al-Ihrâm</em>), au moment de s'incliner (<em>Rukû'</em>) et au moment de s'en relever.</p>
</blockquote></li>
<li><blockquote>
<p>Placer la main droite sur la main gauche, et les poser sur la poitrine ou sous le nombril durant la station debout.</p>
</blockquote></li>
<li><blockquote>
<p>Regarder vers l'emplacement de la prosternation.</p>
</blockquote></li>
<li><blockquote>
<p>Poser les mains sur les genoux lors de l'inclinaison.</p>
</blockquote></li>
<li><blockquote>
<p>Écarter le ventre des cuisses, et les cuisses des jambes lors de la prosternation.</p>
</blockquote></li>
<li><blockquote>
<p>Maintenir le dos bien droit et étendu lors de l'inclinaison, en gardant la tête alignée avec le dos (sans la baisser ni la relever).</p>
</blockquote></li>
<li><blockquote>
<p>Bien appliquer le front, le nez et les autres membres sur le sol lors de la prosternation.</p>
</blockquote></li>
</ul>
<p>Et bien d'autres paroles et actes recommandés qui sont détaillés dans les ouvrages de jurisprudence (<em>Fiqh</em>).</p>
<p><strong>L'accomplissement de ces Sunan n'est pas obligatoire dans la prière.</strong> Cependant, celui qui les pratique (ou une partie d'entre elles) obtient un surplus de récompense. Quant à celui qui les délaisse (totalement ou partiellement), il ne commet aucun péché, comme c'est le cas pour toutes les autres pratiques recommandées (<em>Sunan</em>).</p>
<p><strong>C'est pourquoi nous ne voyons aucune justification au rigorisme dont font preuve certains jeunes d'aujourd'hui concernant les actes recommandés (<em>Sunan</em>) de la prière. Ce zèle les amène parfois à les appliquer de manière étrange et excessive :</strong></p>
<ul>
<li><blockquote>
<p><strong>Par exemple :</strong> l'un d'eux peut courber la tête en station debout au point d'être proche de l'inclinaison (<em>Rukû'</em>).</p>
</blockquote></li>
<li><blockquote>
<p>Ou joindre ses mains au creux de la gorge au lieu de les placer sur la poitrine ou sous le nombril, comme cela est rapporté dans la Sunnah.</p>
</blockquote></li>
<li><blockquote>
<p>Leur intransigeance au sujet de la <em>Sutrah</em> (l'écran protecteur devant soi), au point que certains quittent le rang pour accomplir une prière surérogatoire afin d'aller chercher un endroit où se trouve une <em>Sutrah</em>.</p>
</blockquote></li>
<li><blockquote>
<p>De même, le fait d'allonger la tête vers l'avant et les jambes vers l'arrière lors de la prosternation, au point de ressembler à un arc ou d'être presque couché à plat ventre.</p>
</blockquote></li>
<li><blockquote>
<p>Ou encore, le fait d'écarter excessivement les jambes en station debout, au point de gêner ses voisins.</p>
</blockquote></li>
</ul>
<p><strong>Ce sont là des comportements étranges qui risquent de les conduire à l'excès (<em>Ghuluw</em>) détestable.</strong></p>
<p>Et nous demandons à Allah, pour nous comme pour eux, la réussite dans la recherche de la vérité et sa mise en pratique.</p>
