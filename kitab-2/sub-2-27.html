<p>⁕ Elle a été nommée ainsi (Jumu'ah) car elle réunit un grand nombre de créatures، et son jour est le meilleur jour de la semaine.</p>
<p>Il est rapporté dans les deux Sahîh (Al-Bukhari et Muslim) et ailleurs :</p>
<p class="ar"><strong><span dir="rtl">« مِنْ أَفْضَلِ أَيَّامِكُمْ يَوْمُ الْجُمُعَةِ »</span></strong></p>
<p><em><strong>« Parmi vos meilleurs jours figure le jour du vendredi. »</strong></em><a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a></p>
<p>Et le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><strong><span dir="rtl">« نَحْنُ الْآخِرُونَ الْأَوَّلُونَ السَّابِقُونَ يَوْمَ الْقِيَامَةِ؛ بَيْدَ أَنَّهُمْ أُوتُوا الْكِتَابَ مِنْ قَبْلِنَا، ثُمَّ هَذَا يَوْمُهُمُ الَّذِي فَرَضَ اللَّهُ عَلَيْهِمْ، فَاخْتَلَفُوا فِيهِ، فَهَدَانَا اللَّهُ لَهُ، وَالنَّاسُ لَنَا فِيهِ تَبَعٌ »</span></strong></p>
<p><strong>« <em>Nous sommes les derniers (à être venus au monde) mais nous serons les premiers au Jour de la Résurrection، bien qu'ils aient reçu le Livre avant nous. Puis ce jour (le vendredi) est celui qui leur avait été imposé، mais ils ont divergé à son sujet. Allah nous y a alors guidés، et les gens nous suivent en cela : les Juifs ont le lendemain (samedi) et les Chrétiens ont le surlendemain (dimanche).</em> »</strong><a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a></p>
<p>Et Muslim a rapporté d'après lui <span dir="rtl">ﷺ</span> qu'il a dit :</p>
<p class="ar"><strong><span dir="rtl">« أَضَلَّ اللَّهُ عَنِ الْجُمُعَةِ مَنْ كَانَ قَبْلَنَا، فَكَانَ لِلْيَهُودِ يَوْمُ السَّبْتِ، وَلِلنَّصَارَى يَوْمُ الْأَحَدِ، فَجَاءَ اللَّهُ بِنَا، فَهَدَانَا لِيَوْمِ الْجُمُعَةِ »</span></strong></p>
<p><strong>« Allah a égaré ceux qui nous ont précédés loin du vendredi. Les Juifs eurent le samedi et les Chrétiens le dimanche. Puis Allah nous fit venir et nous guida vers le jour du vendredi. »</strong><a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a></p>
<p>Le rassemblement des musulmans ce jour-là a été légiféré pour les avertir de l'immensité des bienfaits d'Allah sur eux. Le prêche (Khutbah) y a été instauré pour leur rappeler ces bienfaits et les inciter à Sa gratitude. La prière du vendredi a été légiférée en milieu de journée afin que le rassemblement puisse se faire en une seule mosquée.</p>
<p>Allah a ordonné aux croyants d'assister à ce rassemblement, d'écouter le prêche et d'accomplir cette prière.</p>
<p>Allah le Très-Haut a dit :</p>
<p class="ar"><strong><span dir="rtl">﴿يَا أَيُّهَا الَّذِينَ آمَنُوا إِذَا نُودِيَ لِلصَّلَاةِ مِن يَوْمِ الْجُمُعَةِ فَاسْعَوْا إِلَىٰ ذِكْرِ اللَّهِ وَذَرُوا الْبَيْعَ ۚ ذَٰلِكُمْ خَيْرٌ لَّكُمْ إِن كُنتُمْ تَعْلَمُونَ﴾</span></strong></p>
<p><strong>« <em>Ô vous qui avez cru ! Quand on appelle à la prière du jour du Vendredi، accourez à l'invocation d'Allah et laissez tout négoce. Cela est bien meilleur pour vous، si vous saviez !</em> »</strong> (Sourate Al-Jumu'ah, verset 9)</p>
<p>Ibn al-Qayyim a dit :</p>
<p>« <em>Il faisait partie de la guidée du Prophète <span dir="rtl">ﷺ</span> de glorifier ce jour (le vendredi) et de l'honorer, et de le distinguer par des actes d'adoration qui lui sont propres. Les savants ont divergé : <strong>est-il meilleur que le jour d'Arafat ?</strong> Il existe deux avis à ce sujet, qui sont deux positions chez les compagnons de l'école Shafi'ite. Le Prophète <span dir="rtl">ﷺ</span> avait l'habitude de réciter, lors de la prière de l'aube (Fajr) de ce jour, les deux sourates : "<strong>Alif, Lam, Mim. La Révélation..." [As-Sajda : 1, 2]</strong> et "<strong>S'est-il écoulé pour l'homme..." [Al-Insan : 1].</strong></em> »<a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a></p>
<p>Jusqu'à ce qu'il (Ibn al-Qayyim) dise :</p>
<p>« <em>Et j'ai entendu Sheikh al-Islam Ibn Taymiyyah dire : "Le Prophète <span dir="rtl">ﷺ</span> récitait ces deux sourates lors de l'aube du vendredi uniquement parce qu'elles contiennent ce qui a eu lieu et ce qui aura lieu durant ce jour précis. En effet, elles traitent de la création d'Adam, de la mention du Jour de la Résurrection (le Retour) et du rassemblement des serviteurs, et tout cela se produit un vendredi. Sa récitation de ces sourates ce jour-là servait donc de rappel à la communauté de ce qui s'y est passé et de ce qui s'y passera. Quant à la prosternation (Sajda), elle n'est que secondaire [dans la récitation] ; elle n'est pas l'objectif visé au point que le prieur doive chercher à la faire en récitant n'importe quelle autre sourate contenant une prosternation."</em> »<a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a></p>
<p>⁕ Et parmi les caractéristiques du jour du vendredi, figure la recommandation de multiplier les prières sur le Prophète <span dir="rtl">ﷺ</span> durant ce jour et durant sa nuit (la nuit du jeudi au vendredi), en raison de sa parole <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><strong><span dir="rtl">« أَكْثِرُوا مِنَ الصَّلَاةِ عَلَيَّ يَوْمَ الْجُمُعَةِ وَلَيْلَةَ الْجُمُعَةِ »</span></strong></p>
<p><strong>«Multipliez les prières sur moi le jour du vendredi et la nuit du vendredi.»</strong> Rapporté par Al-Bayhaqi.<a href="#fn6" class="footnote-ref" id="fnref6" role="doc-noteref"><sup>6</sup></a></p>
<p>⁕ Et parmi les plus grandes caractéristiques du jour du vendredi, <strong>il y a la prière du vendredi (Salat Al-Jumu'ah)</strong>, qui compte parmi les obligations les plus impératives de l'Islam et l'un des plus grands rassemblements des musulmans. Quiconque la délaisse trois fois par négligence, Allah scelle son cœur.</p>
<p>⁕ Et parmi les caractéristiques du jour du vendredi, il y a l'ordre d'accomplir le grand lavage (Al-Ghusl). C'est une Sunna confirmée (Sunna Mou'akkada). Parmi les savants, certains l'ont rendu obligatoire de manière absolue, et d'autres l'ont rendu obligatoire pour celui qui dégage une odeur nécessitant d'être éliminée.</p>
<p>⁕ Parmi les caractéristiques du jour du Vendredi, il y a la recommandation de se parfumer ; cela est d'ailleurs plus méritoire ce jour-là que n'importe quel autre jour de la semaine.</p>
<p>⁕ Parmi les caractéristiques de ce jour : la recommandation de se rendre tôt à la mosquée pour la prière du Vendredi, de s'occuper par des prières surérogatoires, l'évocation d'Allah (dhikr) et la récitation jusqu'à ce que l'imam sorte pour le prêche. Il y a aussi l'obligation d'écouter attentivement le prêche lorsqu'on l'entend ; car celui qui ne l'écoute pas attentivement commet une futilité, et celui qui commet une futilité n'a pas de (récompense de) Vendredi. Il est interdit de parler pendant le prêche. Il est rapporté dans le "Musnad" de façon élevée (marfu') :</p>
<p class="ar"><strong><span dir="rtl">« وَالَّذِي يَقُولُ لِصَاحِبِهِ: أَنْصِتْ؛ فَلَا جُمُعَةَ لَهُ »</span></strong></p>
<p><strong>« Et celui qui dit à son compagnon : "Écoute attentivement", alors il n'y a pas de Vendredi pour lui (sa récompense est annulée).»</strong><a href="#fn7" class="footnote-ref" id="fnref7" role="doc-noteref"><sup>7</sup></a></p>
<p>⁕ Parmi les caractéristiques du jour du Vendredi, il y a la récitation de la sourate "La Caverne" (Al-Kahf). Il a été confirmé d'après le Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><strong><span dir="rtl">« مَنْ قَرَأَ سُورَةَ الْكَهْفِ يَوْمَ الْجُمُعَةِ؛ سَطَعَ لَهُ نُورٌ مِنْ تَحْتِ قَدَمِهِ إِلَىٰ عَنَانِ السَّمَاءِ، يُضِيءُ بِهِ يَوْمَ الْقِيَامَةِ، وَغُفِرَ لَهُ مَا بَيْنَ الْجُمُعَتَيْنِ »</span></strong></p>
<p>« <em><strong>Quiconque récite la sourate Al-Kahf le jour du Vendredi, une lumière jaillira de sous ses pieds jusqu'au sommet du ciel, l'éclairant le Jour de la Résurrection, et ses péchés commis entre les deux vendredis seront pardonnés.</strong></em> » Rapporté par Al-Hakim et Al-Bayhaqi.<a href="#fn8" class="footnote-ref" id="fnref8" role="doc-noteref"><sup>8</sup></a></p>
<p>⁕ Parmi les caractéristiques du jour du Vendredi, il s'y trouve une heure d'exaucement (des invocations). Dans les deux "Sahih", d'après le hadith d'Abou Houraira :</p>
<p class="ar"><strong><span dir="rtl">« إِنَّ فِي الْجُمُعَةِ لَسَاعَةً لَا يُوَافِقُهَا عَبْدٌ مُسْلِمٌ وَهُوَ قَائِمٌ يُصَلِّي يَسْأَلُ اللَّهَ شَيْئًا؛ إِلَّا أَعْطَاهُ إِيَّاهُ »</span></strong></p>
<p>« <em><strong>Il y a en ce jour une heure ; aucun serviteur musulman ne la rencontre alors qu'il est debout en train de prier et demandant quelque chose à Allah, sans qu'Il ne la lui accorde.</strong></em> » <a href="#fn9" class="footnote-ref" id="fnref9" role="doc-noteref"><sup>9</sup></a></p>
<p>Et il (le Prophète) fit un signe de la main pour indiquer qu'elle est courte.</p>
<p>⁕ Et parmi les caractéristiques du jour du Vendredi, il y a le prêche (la Khutbah), par lequel on vise à louer Allah et à Le glorifier, à témoigner de Son unicité, à témoigner du message de Son Messager <span dir="rtl">ﷺ</span>, et à rappeler (leurs devoirs) aux serviteurs.</p>
<p>⁕ Les caractéristiques de ce jour sont nombreuses ; l'imam Ibn al-Qayyim les a mentionnées dans son livre « Zad al-Ma'ad »<a href="#fn10" class="footnote-ref" id="fnref10" role="doc-noteref"><sup>10</sup></a> , et il en a dénombré trente-trois.</p>
<p>Malgré cela, beaucoup de gens font preuve de négligence vis-à-vis des droits de ce jour. Il n'a plus à leurs yeux de distinction particulière par rapport aux autres jours. Certains font de ce jour un temps pour la paresse et le sommeil, tandis que d'autres le gaspillent dans les divertissements, les jeux et l'insouciance vis-à-vis du rappel d'Allah (dhikr). À tel point que le nombre de fidèles dans les mosquées lors de l'aube (Fajr) de ce jour-là diminue de façon notable. Il n'y a de force et de puissance qu'en Allah.</p>
<p>⁕ Il est recommandé de se rendre tôt à la mosquée le jour du vendredi. Une fois entré dans la mosquée, on accomplit deux unités de prière (Rak'at) pour saluer la mosquée (Tahiyat al-Masjid).</p>
<p>⁕ Et s'il arrive tôt et souhaite accomplir davantage de prières surérogatoires, rien ne s'y oppose, car les Prédécesseurs (Salaf) arrivaient tôt et priaient jusqu'à ce que l'imam sorte [pour le sermon].</p>
<p>Cheikh al-Islâm [Ibn Taymiyyah] — qu'Allah lui fasse miséricorde — a dit <a href="#fn11" class="footnote-ref" id="fnref11" role="doc-noteref"><sup>11</sup></a>: "<em>Le plus préférable pour celui qui se rend au Vendredi est de s'occuper par la prière jusqu'à ce que l'imam sorte, conformément à ce qui figure dans le Sahîh d'après la parole du Prophète <span dir="rtl">ﷺ</span> : '<strong>...puis il prie ce qui lui a été prescrit</strong>'</em><a href="#fn12" class="footnote-ref" id="fnref12" role="doc-noteref"><sup>12</sup></a><em>. Bien plus, les termes utilisés par le Prophète <span dir="rtl">ﷺ</span> incitent à prier lorsque l'homme arrive à la mosquée le jour du Vendredi sans limitation de temps. C'est d'ailleurs ce qui est rapporté des Compagnons : lorsqu'ils arrivaient à la mosquée le jour du Vendredi, ils priaient dès leur entrée ce qu'il leur était possible de faire. Certains d'entre eux priaient dix unités de prière (rak'at), d'autres douze, d'autres huit, et certains moins que cela.</em></p>
<p><em>C'est pour cette raison que la majorité des imams s'accordent sur le fait qu'il n'existe pas, avant le Vendredi, de Sunnah fixée par un temps précis ou définie par un nombre déterminé. La prière avant le Vendredi est une bonne chose, mais ce n'est pas une Sunnah régulière (Râtibah). Que la personne l'accomplisse ou la délaisse, on ne doit pas le lui reprocher. C'est l'avis le plus juste. Dès lors, le délaissement peut parfois s'avérer préférable si les ignorants en viennent à croire qu'il s'agit d'une Sunnah régulière.</em>"</p>
<p>⁕ Voilà ce qui concerne la prière surérogatoire avant la prière du Vendredi : il n'y a pas de Sunnah régulière (Râtibah) avant celle-ci. Sa Sunnah régulière se situe plutôt après.</p>
<p>En effet, il est rapporté dans le Sahîh Muslim :</p>
<p class="ar"><strong><span dir="rtl">«إذا صلى أحدكم الجمعة؛ فليصل بعدها أربع ركعات»</span></strong></p>
<p>"<em><strong>Lorsque l'un d'entre vous a accompli la prière du Vendredi, qu'il prie quatre rak'at après elle</strong></em>" <a href="#fn13" class="footnote-ref" id="fnref13" role="doc-noteref"><sup>13</sup></a>.</p>
<p>Et dans les deux recueils authentiques (Al-Bukhârî et Muslim) : "<em><strong>Le Prophète <span dir="rtl">ﷺ</span> priait deux rak'at après le Vendredi</strong></em>" <a href="#fn14" class="footnote-ref" id="fnref14" role="doc-noteref"><sup>14</sup></a>.</p>
<p>La conciliation entre ces deux hadiths est la suivante :</p>
<ul>
<li><blockquote>
<p>S'il prie chez lui, il prie deux rak'at.</p>
</blockquote></li>
</ul>
<ul>
<li><blockquote>
<p>S'il prie à la mosquée, il prie quatre rak'at.</p>
</blockquote></li>
</ul>
<p>Et s'il le souhaite, il peut en prier six, conformément à la parole d'Ibn 'Umar : "<em><strong>Le Prophète <span dir="rtl">ﷺ</span>, lorsqu'il avait prié le Vendredi, s'avançait et priait deux rak'at, puis s'avançait de nouveau et en priait quatre</strong></em>" <a href="#fn15" class="footnote-ref" id="fnref15" role="doc-noteref"><sup>15</sup></a>.</p>
<p>⁕ <strong>La priorité concernant la place à la mosquée revient à celui qui arrive le premier physiquement.</strong></p>
<p>Quant à ce que font certaines personnes en réservant une place à la mosquée — en y posant un tapis, un bâton ou des sandales — tout en tardant à venir eux-mêmes, privant ainsi ceux qui arrivent tôt de cette place : <strong>cela est un acte non autorisé.</strong></p>
<p>Certains savants ont même explicitement déclaré que celui qui arrive à la mosquée a le droit de retirer ce qui a été posé à cet endroit et d'y prier. En effet, celui qui arrive le premier mérite de prier au premier rang. De plus, s'approprier un espace réservé à la mosquée sans être présent physiquement est considéré comme une usurpation de la place (ightisâb).</p>
<p>Cheikh al-Islâm Ibn Taymiyyah — qu'Allah lui fasse miséricorde — a dit <a href="#fn16" class="footnote-ref" id="fnref16" role="doc-noteref"><sup>16</sup></a>: "<em>Ce que font beaucoup de gens en envoyant des tapis ou autres objets à la mosquée le jour du Vendredi avant leur arrivée pour la prière est <strong>interdit selon le consensus des musulmans</strong> (ittifâq al-muslimîn), et c'est même un acte illicite (muharram).</em></p>
<p><em>La prière sur ce tapis est-elle alors valide ? Les savants divergent sur ce point. En effet, en étalant ce tapis, la personne a <strong>usurpé</strong> (ghasaba) un emplacement dans la mosquée et a empêché d'autres fidèles, arrivés avant elle, de prier à cet endroit.</em></p>
<p><em>Ce qui est ordonné, c'est que l'homme se hâte <strong>en personne</strong> vers la mosquée. S'il envoie son tapis et reste en arrière, il contrevient à la législation (Sharî'ah) de deux manières :</em></p>
<ol type="1">
<li><blockquote>
<p><em><strong>Son retard :</strong> alors qu'il lui est ordonné d'arriver tôt.</em></p>
</blockquote></li>
<li><blockquote>
<p><em><strong>L'usurpation :</strong> car il s'approprie une partie de la mosquée et bloque l'accès à ceux qui l'ont devancé, les empêchant ainsi de compléter les rangs dans l'ordre (le premier, puis le suivant).</em></p>
</blockquote></li>
</ol>
<p><em>De plus, lorsqu'il finit par arriver, il finit souvent par <strong>enjamber les cous des gens</strong> [pour atteindre sa place réservée].</em>"</p>
<p>⁕ Parmi les règles du Vendredi, il y a celle-ci : <strong>celui qui entre dans la mosquée alors que l'imam prononce le sermon ne doit pas s'asseoir avant d'avoir prié deux rak'at légères</strong> (Tahiyyat al-Masjid).</p>
<p>Ceci est basé sur la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><strong><span dir="rtl">«إذا جاء أحدُكُم يومَ الجمعةِ وقد خرجَ الإمامُ؛ فَلْيُصَلِّ ركعتين»</span></strong></p>
<p>"<em><strong>Si l'un d'entre vous arrive le jour du Vendredi alors que l'imam est déjà sorti [pour le sermon], qu'il prie deux rak'at</strong></em>" (Rapporté par Al-Bukhârî et Muslim).</p>
<p>Muslim a ajouté dans sa version : "<em><strong>Qu'il les abrège</strong></em>" <a href="#fn17" class="footnote-ref" id="fnref17" role="doc-noteref"><sup>17</sup></a>, c'est-à-dire qu'il les fasse rapidement.</p>
<p>S'il s'assoit [par oubli ou ignorance], il doit se relever pour les accomplir, car le Prophète <span dir="rtl">ﷺ</span> a ordonné à un homme qui s'était assis avant de les prier en lui disant :</p>
<p class="ar"><strong><span dir="rtl">«قُمْ فارْكَعْ ركعتين»</span></strong></p>
<p>"<em><strong>Lève-toi et accomplis deux unités de prière</strong></em>" <a href="#fn18" class="footnote-ref" id="fnref18" role="doc-noteref"><sup>18</sup></a>.</p>
<p>⁕ Parmi les règles de la prière du Vendredi, il y a le fait qu'<strong>il n'est pas permis de parler pendant que l'imam prononce le sermon.</strong></p>
<p>Ceci conformément à la parole du Très-Haut :</p>
<p class="ar"><strong><span dir="rtl">﴿وَإِذَا قُرِئَ الْقُرْآنُ فَاسْتَمِعُوا لَهُ وَأَنصِتُوا لَعَلَّكُمْ تُرْحَمُونَ﴾ [الأعراف: ٢٠٤].</span></strong></p>
<p><strong>"Et quand le Coran est récité, écoutez-le attentivement et faites silence afin d'obtenir la miséricorde."</strong> (Sourate Al-A'râf, v. 204).</p>
<p>Certains exégètes (<em>mufassirîn</em>) ont dit : "<em><strong>Ce verset a été révélé au sujet du sermon (Khutbah). Il a été appelé 'Coran' car le sermon contient des versets du Coran.</strong></em>" Et même selon l'autre avis stipulant que le verset a été révélé concernant la prière, il englobe, par sa portée générale, le sermon du Vendredi.</p>
<p>⁕ Le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><strong><span dir="rtl">«من قالَ: صَهْ؛ فقد لَغَا؛ ومَنْ لَغَا فلا جمعةَ له»</span></strong></p>
<p><strong>"Celui qui dit [à autrui] : 'Tais-toi' , a commis une futilité ; et celui qui commet une futilité n'a pas de [récompense de] Vendredi"</strong>. (Rapporté par Ahmad)<a href="#fn19" class="footnote-ref" id="fnref19" role="doc-noteref"><sup>19</sup></a>.</p>
<p>Dans un autre hadith :</p>
<p class="ar"><strong><span dir="rtl">«من تَكَلَّمَ؛ فهو كالحمارِ يَحْمِلُ أسفاراً، والذي يقولُ له: أنصِتْ؛ ليست له جمعةٌ»</span></strong></p>
<p><strong>"Celui qui parle est semblable à l'âne qui porte des livres, et celui qui lui dit : 'Écoute' n'a pas de Vendredi"</strong> <a href="#fn20" class="footnote-ref" id="fnref20" role="doc-noteref"><sup>20</sup></a>.</p>
<p>Cela signifie qu'il n'a pas de Vendredi complet [en termes de récompense].</p>
<p>Et dans les deux recueils authentiques (<em>Al-Bukhârî et Muslim</em>), d'après le hadith d'Abû Hurayrah :</p>
<p class="ar"><strong><span dir="rtl">«إذا قُلْتَ لِصاحِبِكَ يومَ الجمعةِ: أنصِتْ والإمامُ يَخْطُبُ؛ فقد لَغَوْتَ»</span></strong></p>
<p><strong>"Si tu dis à ton compagnon le jour du Vendredi : 'Écoute attentivement' pendant que l'imam fait son sermon, tu as alors commis une futilité"</strong> <a href="#fn21" class="footnote-ref" id="fnref21" role="doc-noteref"><sup>21</sup></a>.</p>
<p><em><strong>C'est-à-dire</strong></em> : tu as prononcé une parole futile (Laghou), et la futilité ici désigne le péché. Si celui qui dit au parleur "Écoute" — alors qu'il est, à l'origine, en train d'ordonner le bien — est considéré comme ayant commis une futilité et qu'on lui a interdit cela, alors tout autre type de parole est interdit à plus forte raison.</p>
<p>⁕ <strong>Il est permis à l'imam de parler à certains fidèles durant le sermon, et il est permis à autrui de lui parler pour un intérêt général (<em>maslaha</em>).</strong></p>
<p>En effet, le Prophète <span dir="rtl">ﷺ</span> a parlé à un homme qui l'interrogeait, et cet homme lui a également parlé. Cela s'est répété lors de plusieurs événements où le Messager d'Allah <span dir="rtl">ﷺ</span> a adressé la parole à certains Compagnons — et où ceux-ci lui ont parlé — pendant le sermon, pour des motifs d'intérêt général ou d'enseignement.</p>
<p>De plus, une telle interaction ne distrait pas de l'écoute globale du sermon.</p>
<p>⁕ Il n'est pas permis à celui qui écoute le sermon de faire l'aumône à un mendiant pendant que l'imam parle. En effet, le mendiant a commis un acte qui ne lui est pas autorisé [en demandant durant le sermon] ; on ne doit donc pas l'aider dans ce qui est interdit, à savoir parler pendant le sermon.</p>
<p>⁕ Il est recommandé (Sunnah) de prier sur le Prophète <span dir="rtl">ﷺ</span> lorsqu'on l'entend mentionné par le prédicateur (Khatib). Cependant, on ne doit pas élever la voix en le faisant, afin de ne pas distraire les autres fidèles.</p>
<p>⁕ Il est recommandé (Sunnah) de dire « Āmīn » lors de l'invocation de l'imam (Al-Khaṭīb), sans élever la voix ni lever les mains.</p>
<p>Cheikh Al-Islām Ibn Taymiyyah — qu'Allah lui fasse miséricorde — a dit : « <em>Élever la voix devant l'imam est détestable ou interdit par consensus ، et ni le muezzin ni un autre ne doit élever la voix par une prière sur le Prophète ou autre chose.</em> » Fin de citation. <a href="#fn22" class="footnote-ref" id="fnref22" role="doc-noteref"><sup>22</sup></a></p>
<p>On remarque que ce sur quoi le Cheikh a attiré l'attention existe encore dans certaines contrées ؛ comme le fait d'élever la voix pour prier sur le Messager ou d'autres invocations pendant le sermon, avant celui-ci ou entre les deux sermons. Il arrive même que certains imams ordonnent cela aux personnes présentes , et ceci est une ignorance et une innovation qu'il n'est pas permis de pratiquer.</p>
<p>⁕ Celui qui entre alors que l'imam prononce le sermon ne doit pas passer le salut (As-Salām) ؛ il doit plutôt rejoindre le rang avec sérénité, prier deux unités de prière (Rak'atayn) légères comme mentionné précédemment, puis s'asseoir pour écouter le sermon, sans serrer la main de celui qui est à côté de lui.</p>
<p>⁕ Il ne lui est pas permis de s'agiter (jouer avec quelque chose) pendant le sermon, que ce soit avec sa main, son pied, sa barbe, son vêtement ou autre ؛ en raison de la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><strong><span dir="rtl">«مَنْ مَسَّ الْحَصَا؛ فَقَدْ لَغَا، وَمَنْ لَغَا؛ فَلَا جُمُعَةَ لَهُ»</span></strong></p>
<p>« <em><strong>Celui qui touche les cailloux a certes commis une futilité, et celui qui commet une futilité n'a pas de [récompense de] vendredi.</strong></em> » (Rapporté et authentifié par At-Tirmidhi). <a href="#fn23" class="footnote-ref" id="fnref23" role="doc-noteref"><sup>23</sup></a></p>
<p>De plus, l'agitation empêche le recueillement (Al-Khushū').</p>
<p>⁕ De même, il ne convient pas de regarder à droite et à gauche, ni de s'occuper à regarder les gens ou autre chose ; car cela le détourne de l'écoute du sermon. Il doit plutôt s'orienter vers l'imam, tout comme les Compagnons — qu'Allah les agrée — s'orientaient vers le Prophète <span dir="rtl">ﷺ</span> pendant le sermon.<a href="#fn24" class="footnote-ref" id="fnref24" role="doc-noteref"><sup>24</sup></a></p>
<p>⁕ S'il éternue, il loue Allah (Al-HamdouliLlāh) discrètement, pour lui-même.</p>
<p>⁕ Il est permis de parler avant le sermon, après celui-ci, ou lorsque l'imam s'assoit entre les deux sermons si cela présente un intérêt (une nécessité) ; cependant, il ne convient pas de discuter des affaires de ce bas-monde.</p>
<p>En résumé ; les deux sermons du vendredi revêtent une importance majeure en Islam ; en raison de ce qu'ils contiennent comme récitation du Coran, mention des récits (Hadiths) du Messager <span dir="rtl">ﷺ</span>, ainsi que des orientations bénéfiques, des exhortations excellentes et le rappel des jours d'Allah (Ses bienfaits et Ses épreuves). Il est donc obligatoire, tant pour l'imam que pour les auditeurs, d'y accorder une grande importance ; car le sermon du vendredi n'est pas un simple discours ordinaire comme ceux prononcés dans les clubs, les célébrations ou les réunions classiques.</p>
<p>Parmi les points sur lesquels il convient d'attirer l'attention, il y a le fait que certains auditeurs des deux sermons du vendredi élèvent la voix pour chercher refuge auprès d'Allah lorsqu'ils entendent une menace (châtiment) dans le sermon, ou élèvent la voix pour demander et invoquer lorsqu'ils entendent l'évocation de la récompense ou du Paradis. Ceci est une chose qui n'est pas permise ؛ cela entre dans la catégorie des paroles interdites pendant le sermon.</p>
<p>Les textes (religieux) ont démontré que parler pendant le sermon annule la récompense, que celui qui parle n'a pas de [mérite de] vendredi, et qu'il est semblable à l'âne qui porte des livres ; il est donc obligatoire de prendre garde à cela et d'en avertir les autres.</p>
<p>⁕ Les savants — qu'Allah leur fasse miséricorde — ont mentionné que la prière du vendredi est une obligation indépendante, et non un remplacement de la prière du Dhuhr.</p>
<p>‘Umar — qu'Allah l'agrée — a dit :</p>
<p class="ar"><strong><span dir="rtl">صَلَاةُ الْجُمُعَةِ رَكْعَتَانِ، تَمَامٌ غَيْرُ قَصْرٍ، عَلَى لِسَانِ نَبِيِّكُمْ ﷺ</span></strong></p>
<p></p>
<p>« <em><strong>La prière du vendredi est de deux unités (Rak'ahs), elle est complète et non raccourcie, selon les paroles de votre Prophète <span dir="rtl">ﷺ</span>.</strong></em> »<a href="#fn25" class="footnote-ref" id="fnref25" role="doc-noteref"><sup>25</sup></a></p>
<p>Ceci car elle diffère de la prière du Dhuhr sur de nombreuses règles. Elle est meilleure que la prière du Dhuhr et plus impérative, car son délaissement fait l'objet d'une menace plus sévère. Elle possède également des conditions et des caractéristiques propres que la prière du Dhuhr n'a pas et la prière du Dhuhr ne peut s'y substituer pour celui à qui le vendredi est obligatoire, tant que son temps n'est pas écoulé. Ce n'est qu'à ce moment-là (si le temps est passé ou par empêchement légiféré) que la prière du Dhuhr devient son remplacement.</p>
<p>⁕ La prière du vendredi est une obligation individuelle (Fard 'Ayn) pour tout musulman, de sexe masculin, libre, responsable (pubère et doté de sa raison) et résidant de manière permanente (établi).</p>
<p>Abû Dâwud a rapporté avec sa chaîne de transmission, d'après Târiq ibn Shihâb, de manière prophétique (marfû') :</p>
<p class="ar"><strong><span dir="rtl">« الْجُمُعَةُ حَقٌّ وَاجِبٌ عَلَى كُلِّ مُسْلِمٍ فِي جَمَاعَةٍ ؛ إِلَّا أَرْبَعَةً : عَبْدٌ مَمْلُوكٌ ، أَوْ امْرَأَةٌ ، أَوْ صَبِيٌّ ، أَوْ مَرِيضٌ »</span></strong></p>
<p>« <em><strong>Le vendredi est un droit obligatoire pour chaque musulman en congrégation ؛ à l'exception de quatre : l'esclave possédé, la femme, l'enfant, ou le malade.</strong></em> » Ses narrateurs sont dignes de confiance et plus d'un savant l'a authentifié.<a href="#fn26" class="footnote-ref" id="fnref26" role="doc-noteref"><sup>26</sup></a></p>
<p>Ad-Dâraqutnî a rapporté avec sa chaîne de transmission, d'après Jâbir ؛ que le Messager d'Allah <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><strong><span dir="rtl">« مَنْ كَانَ يُؤْمِنُ بِاللَّهِ وَالْيَوْمِ الْآخِرِ ؛ فَعَلَيْهِ الْجُمُعَةُ يَوْمَ الْجُمُعَةِ ؛ إِلَّا مَرِيضاً ، أَوْ مُسَافِراً ، أَوْ صَبِيّاً ، أَوْ مَمْلُوكاً »</span></strong></p>
<p>« <em><strong>Quiconque croit en Allah et au Jour dernier ؛ il lui incombe de prier le vendredi le jour du vendredi ؛ sauf pour le malade, le voyageur, l'enfant, ou l'esclave.</strong></em> »<a href="#fn27" class="footnote-ref" id="fnref27" role="doc-noteref"><sup>27</sup></a></p>
<p>Cheikh Al-Islâm Ibn Taymiyyah a dit <a href="#fn28" class="footnote-ref" id="fnref28" role="doc-noteref"><sup>28</sup></a>: « <em>Tout peuple résidant de manière permanente dans des constructions rapprochées, qu'ils ne quittent ni en hiver ni en été, la prière du vendredi y est célébrée si ces habitations sont construites selon leur coutume avec de la terre, du bois, des roseaux, des branches de palmier, des palmes ou autre ؛ car les éléments de construction et les matériaux n'ont aucune influence sur cela. La base est qu'ils soient établis (résidents permanents), contrairement aux gens des tentes et des campements nomades, qui cherchent généralement les zones de pluie, se déplacent d'un lieu à l'autre et emportent leurs maisons avec eux lorsqu'ils se déplacent.</em> » Fin de citation.</p>
<p>⁕ La prière du vendredi n'est pas obligatoire pour celui qui effectue un voyage permettant le raccourcissement des prières ; car le Prophète <span dir="rtl">ﷺ</span> et ses compagnons avaient l'habitude de voyager pour le Pèlerinage (Hajj) ou pour d'autres raisons, et aucun d'entre eux ne priait le vendredi durant le voyage.</p>
<p>⁕ Quiconque sort en pleine campagne (ou dans le désert) pour une excursion ou autre, et qu'il n'y a pas autour de lui de mosquée où la prière du vendredi est célébrée, alors la prière du vendredi ne lui est pas obligatoire ; il doit alors prier le Dhuhr (la prière de la mi-journée).</p>
<p>⁕ Elle [la prière du vendredi] n'est pas obligatoire pour la femme.</p>
<p>Ibn al-Mundhir et d'autres ont dit : "<em>Il y a un consensus (Ijma‘) sur le fait que le vendredi n'est pas obligatoire pour les femmes. Ils s'accordent également sur le fait que si elles y assistent et prient le vendredi [à la mosquée], cela est valide et suffit pour elles (elles n'ont pas à prier le Dhuhr)</em>".<a href="#fn29" class="footnote-ref" id="fnref29" role="doc-noteref"><sup>29</sup></a></p>
<p>Il en est de même pour le voyageur s'il y assiste : elle est valide pour lui. De même pour le malade. En effet, l'exemption pour ces catégories de personnes vise à les soulager.</p>
<p>Par ailleurs, <strong>il n'est pas permis</strong> à celui pour qui le vendredi est obligatoire de voyager ce jour-là <strong>après le zénith (Zawal) avant de l'avoir accomplie</strong>. <strong>Avant le zénith, le voyage</strong> <strong>est détestable (Makruh)</strong> s'il n'est pas certain de pouvoir la prier en chemin.</p>
<p>⁕ <strong>Les conditions de validité de la [prière du] vendredi :</strong></p>
<p><strong>1 - L'entrée de l'heure :</strong> Car il s'agit d'une prière obligatoire ; l'entrée de son temps est donc une condition, comme pour toutes les autres prières. Elle n'est valide ni avant son heure, ni après, conformément à la parole d'Allah le Très-Haut :</p>
<p class="ar"><strong><span dir="rtl">﴿إِنَّ الصَّلَوةَ كَانَتْ عَلَى الْمُؤْمِنِينَ كِتَبًا مَّوْقُوتًا﴾ [النساء: ١٠٣]</span></strong></p>
<p><em>{<strong>Certes, la prière demeure, pour les croyants, une prescription à des temps déterminés</strong>}</em> [Les Femmes : 103].</p>
<p>L'accomplir après le zénith (<em>Zawal</em>) est préférable et plus sûr, car c'est le moment où le Messager d'Allah <span dir="rtl">ﷺ</span> la priait le plus souvent. Son accomplissement avant le zénith fait l'objet d'une divergence entre les savants. Quant à la fin de son temps, c'est sans divergence la fin du temps de la prière du <strong>Dhuhr</strong>.</p>
<p><strong>2 - Que les prieurs soient des résidents établis</strong> dans des habitations construites selon les matériaux d'usage habituels. Elle n'est donc pas valable pour les nomades vivant sous des tentes ou des maisons de poils (bédouins) qui se déplacent généralement vers les zones de pâturage et de pluie et transportent leurs demeures. En effet, des tribus arabes vivaient autour de Médine, et le Prophète <span dir="rtl">ﷺ</span> ne leur a pas ordonné de célébrer la prière du vendredi.</p>
<p>⁕ Quiconque rattrape une unité de prière (rak'ah) avec l'imam lors de la prière du vendredi doit la compléter en tant que prière du vendredi.</p>
<p>Cela se base sur le hadith d'Abû Hurayrah, rapporté de manière prophétique (marfû‘):</p>
<p class="ar"><strong><span dir="rtl">"مَنْ أَدْرَكَ ركعةً من الجمعةِ؛ فقد أدركَ الصلاةَ"</span></strong></p>
<p>"<em><strong>Quiconque rattrape une rak'ah de la prière du vendredi a certes rattrapé la prière</strong></em>". Rapporté par al-Bayhaqî, et son origine se trouve dans les deux Sahîh al-Bukhârî et Muslim. »<a href="#fn30" class="footnote-ref" id="fnref30" role="doc-noteref"><sup>30</sup></a></p>
<p>⁕ Et s'il rattrape moins d'une unité de prière (rak'ah) — c'est-à-dire que l'imam s'est déjà relevé de l'inclinaison (rukû‘) de la deuxième unité avant qu'il ne rejoigne la prière avec lui — alors il a manqué la prière du vendredi. Il doit alors rejoindre l'imam avec l'intention de faire la prière du Dhuhr. Puis, quand l'imam effectue le salut final, il [le fidèle] complète sa prière comme étant le Dhuhr.</p>
<p><strong>3 - Il est également conditionné, pour la validité du vendredi, qu'il soit précédé de deux sermons (khutbah)</strong> ; car le Prophète <span dir="rtl">ﷺ</span> les accomplissait assidûment.</p>
<p>Ibn 'Umar a dit : "<em><strong>Le Prophète <span dir="rtl">ﷺ</span> prononçait deux sermons en étant debout, et il séparait les deux par une position assise</strong></em>". [(authentifié par al-Bukhârî et Muslim)<a href="#fn31" class="footnote-ref" id="fnref31" role="doc-noteref"><sup>31</sup></a>.</p>
<p><strong>⁕ Parmi les conditions de validité des deux sermons (khutbahs) :</strong></p>
<ol type="1">
<li><blockquote>
<p>La louange d'Allah (<em>Hamdullah</em>),</p>
</blockquote></li>
<li><blockquote>
<p>L'attestation de foi (<em>Ash-Shahâdatân</em>),</p>
</blockquote></li>
<li><blockquote>
<p>La prière sur Son Messager (<em>Salât 'ala an-Nabî</em>),</p>
</blockquote></li>
<li><blockquote>
<p>L'exhortation à la piété envers Allah (<em>Taqwa</em>),</p>
</blockquote></li>
<li><blockquote>
<p>Le prêche (l'exhortation religieuse),</p>
</blockquote></li>
<li><blockquote>
<p>La récitation d'un passage du Coran, ne serait-ce qu'un seul verset.</p>
</blockquote></li>
</ol>
<p>Ceci contrairement aux sermons de certains orateurs contemporains aujourd'hui, dont les discours sont dépourvus de ces conditions ou de la plupart d'entre elles.</p>
<p><strong>L'imam Ibn al-Qayyim a dit</strong> <a href="#fn32" class="footnote-ref" id="fnref32" role="doc-noteref"><sup>32</sup></a><strong>:</strong> « <em>Quiconque médite les sermons du Prophète <span dir="rtl">ﷺ</span> et ceux de ses compagnons constatera qu'ils garantissent l'explication de la guidée et de l'Unicité (Tawhîd). Ils mentionnent les attributs du Seigneur, les fondements universels de la foi, l'appel à Allah, et l'évocation de Ses bienfaits qui Le font aimer de Ses créatures, ainsi que Ses jours [de châtiment] qui leur font craindre Sa rigueur. Ils enjoignent à Son invocation (Dhikr) et à Sa gratitude (Shukr), ce qui les rend aimables auprès de Lui. Ils évoquent la grandeur d'Allah, Ses attributs et Ses noms pour Le faire aimer de Ses créatures, et ils ordonnent une obéissance, une gratitude et une invocation qui les rendent aimables auprès de Lui. Ainsi, les auditeurs s'en vont en ayant aimé [Allah] et en étant aimés de Lui.</em></p>
<p><em>Puis, le temps a passé, la lumière de la prophétie s'est estompée, et les lois et commandements sont devenus des rites formels accomplis sans considération pour leurs réalités et leurs finalités (Maqâsid). Ils ont transformé les formes et les apparences en traditions intouchables, tout en négligeant les objectifs essentiels qui ne devraient jamais être délaissés. Ils ont alors orné les sermons de rimes (Saj‘), de prose rythmée et de fioritures rhétoriques (Badî‘). En conséquence, la part que les cœurs en retiraient a diminué — voire disparu — et l'objectif même de ces sermons a été perdu. »</em></p>
<p>Voilà ce que l'imam Ibn al-Qayyim disait sur le style des sermons à son époque. Mais la situation a empiré par rapport à ce qu'il décrivait, au point que la majorité des sermons aujourd'hui sont remplis de paroles peu utiles. Certains orateurs (<em>Khutabâ'</em>) traitent le sermon comme une rédaction scolaire, improvisant sur n'importe quel sujet, avec ou sans rapport avec l'occasion. Ils allongent le sermon de manière ennuyeuse tout en négligeant certaines conditions de validité religieuse du sermon.</p>
<p>Ils ont ainsi abaissé le sermon à un niveau tel qu'il ne remplit plus son rôle d'impact et d'utilité spirituelle. Certains orateurs insèrent dans le sermon des sujets qui ne conviennent pas à son thème, ou qu'il n'est pas sage de mentionner en cette circonstance, car la majorité de l'assemblée ne les comprend pas ou parce qu'ils dépassent leur niveau. Ils y introduisent des sujets de presse, des débats politiques ou des récits d'actualité dont les fidèles ne tirent aucun bénéfice.</p>
<p><strong>Ô vous, les orateurs !</strong> Revenez, dans vos sermons, à la guidance prophétique :</p>
<p class="ar"><strong><span dir="rtl">﴿لَقَدْ كَانَ لَكُمْ فِي رَسُولِ اللهِ أُسْوَةٌ حَسَنَةٌ﴾ [الأحزاب: ٢١]</span></strong></p>
<p><em>{<strong>En effet, vous avez dans le Messager d’Allah un excellent modèle</strong>}</em> [Les Coalisés : 21].</p>
<p>Concentrez vos sujets sur les textes du Coran et de la Sunna qui conviennent à la situation. Incluez-y l'exhortation à la piété (<em>Taqwa</em>) et la bonne prédication. Traitez les maux de vos sociétés avec un style clair et concis. Multipliez-y la récitation du Grand Coran, car en lui réside la vie des cœurs et la lumière des consciences.</p>
<p>Le but n'est pas simplement de délivrer deux sermons, mais bien leur impact sur la société.</p>
<p>Comme l'a dit Cheikh al-Islam <strong>Ibn Taymiyya</strong> (qu'Allah lui fasse miséricorde) : "<em>Il ne suffit pas, dans un sermon, de blâmer le bas-monde et de mentionner la mort. Il faut que ce qui est coutumièrement appelé 'sermon' émeuve les cœurs et les pousse vers le bien. Le blâme du bas-monde et la mise en garde contre lui sont des choses que même ceux qui rejettent les lois divines s'enjoignent mutuellement. Au contraire, il est impératif d'inciter à l'obéissance, de détourner du péché, d'appeler à Allah et de rappeler Ses bienfaits.</em>"</p>
<p>Il a aussi dit : "<em>Le sermon ne peut être accompli par une brièveté telle que l'objectif recherché soit perdu." Et lorsque le Prophète <span dir="rtl">ﷺ</span> prêchait, ses yeux rougissaient, sa voix s'élevait et son intensité augmentait, comme s'il avertissait une armée [imminente] en disant : "[L'ennemi] va vous surprendre au matin ou au soir !</em>" <a href="#fn33" class="footnote-ref" id="fnref33" role="doc-noteref"><sup>33</sup></a>.</p>
<p><strong>⁕ Les juristes (qu'Allah leur fasse miséricorde) ont mentionné qu'il est recommandé (<em>Sunna</em>), lors des deux sermons du vendredi, de prêcher sur un minbar.</strong> Cela est dû à la pratique du Prophète <span dir="rtl">ﷺ</span>, et parce que cela est plus efficace pour la communication et plus percutant pour l'exhortation, car l'assistance peut ainsi voir l'orateur devant elle.</p>
<p><strong>L'imam an-Nawawî a dit</strong> <a href="#fn34" class="footnote-ref" id="fnref34" role="doc-noteref"><sup>34</sup></a><strong>:</strong> "<em>L'usage du minbar est une Sunna faisant l'objet d'un consensus</em>".</p>
<p><strong>Il est également recommandé que l'orateur salue les fidèles lorsqu'il se présente face à eux,</strong> conformément aux propos de Jâbir : "<em><strong>Le Messager d'Allah <span dir="rtl">ﷺ</span>, lorsqu'il montait sur le minbar, saluait [l'assistance]</strong></em>". Rapporté par Ibn Mâjah et possède des témoignages confirmant sa validité <a href="#fn35" class="footnote-ref" id="fnref35" role="doc-noteref"><sup>35</sup></a>.</p>
<p><strong>⁕ Il est aussi recommandé qu'il s'assoie sur le minbar jusqu'à ce que le muezzin termine [l'appel à la prière].</strong> Ceci d'après Ibn 'Umar qui a dit : "<em><strong>Le Messager d'Allah <span dir="rtl">ﷺ</span> s'asseyait lorsqu'il montait sur le minbar jusqu'à ce que le muezzin finisse, puis il se levait pour prononcer le sermon</strong></em>". Rapporté par Abû Dâwûd <a href="#fn36" class="footnote-ref" id="fnref36" role="doc-noteref"><sup>36</sup></a>.</p>
<p>⁕ Parmi les Sunan des deux sermons du vendredi, il y a le fait de s'asseoir entre les deux ، en raison du hadith d'Ibn 'Umar : « <em><strong>Le Prophète <span dir="rtl">ﷺ</span> prononçait deux sermons en étant debout, et il les séparait en s'asseyant.</strong></em> » (Rapporté par Al-Bukhari et Muslim).<a href="#fn37" class="footnote-ref" id="fnref37" role="doc-noteref"><sup>37</sup></a></p>
<p>⁕ Il fait également partie de la Sunna de prononcer le sermon debout ، conformément à la pratique du Messager <span dir="rtl">ﷺ</span> <a href="#fn38" class="footnote-ref" id="fnref38" role="doc-noteref"><sup>38</sup></a> et à la parole d'Allah (Traduction du sens) :</p>
<p class="ar"><strong><span dir="rtl">﴿وَتَرَكُوكَ قَائِماً﴾ [الجمعة : ١١]</span></strong></p>
<p>{<em><strong>et te laissèrent debout</strong></em>} [Al-Jumu'ah : 11]</p>
<p>ainsi que la pratique constante des musulmans à ce sujet.</p>
<p>⁕ Il est recommandé de s'appuyer sur un bâton ou un objet similaire.</p>
<p>⁕ Il est recommandé [à l'imam] de regarder droit devant lui ، en raison de la pratique du Prophète <span dir="rtl">ﷺ</span>. En effet, se tourner vers un côté reviendrait à se détourner de l'autre et à s'opposer à la Sunna. Le Prophète <span dir="rtl">ﷺ</span> faisait face devant lui durant le sermon, et les assistants se tournaient vers lui avec leurs visages ، selon la parole d'Ibn Mas'ûd (qu'Allah l'agrée) : « <em><strong>Lorsqu'il s'installait sur le minbar, nous lui faisions face avec nos visages.</strong></em> » (Rapporté par At-Tirmidhi).<a href="#fn39" class="footnote-ref" id="fnref39" role="doc-noteref"><sup>39</sup></a></p>
<p>⁕ Il est recommandé de raccourcir le sermon de manière modérée ، afin que les gens ne s'ennuient pas et ne s'en détournent pas. Cependant, il ne doit pas le raccourcir au point de lui nuire, rendant le profit nul. L'imam Muslim a rapporté d'après 'Ammâr, de manière prophétique (marfû') :</p>
<p class="ar"><strong><span dir="rtl">«إِنَّ طُولَ صَلَاةِ الرَّجُلِ وَقِصَرَ خُطْبَتِهِ مَئِنَّةٌ مِنْ فِقْهِهِ؛ فَأَطِيلُوا الصَّلَاةَ، وَأَقْصِرُوا الخُطْبَةَ»</span></strong></p>
<p>« <em><strong>La longueur de la prière d'un homme et la brièveté de son sermon sont un signe de son intelligence juridique (fiqh). Prolongez donc la prière et raccourcissez le sermon.</strong></em> » <a href="#fn40" class="footnote-ref" id="fnref40" role="doc-noteref"><sup>40</sup></a></p>
<p>Le sens de « <em><strong>Ma-innatun min fiqhih</strong></em> » est : une preuve ou une marque de sa compréhension de la religion.</p>
<p>⁕ Il est recommandé d'élever la voix durant le sermon ، car le Prophète <span dir="rtl">ﷺ</span> ، lorsqu'il prêchait, élevait la voix et son intensité augmentait. Cela est plus percutant pour les âmes et plus éloquent pour l'exhortation. Il convient également de prononcer le sermon avec des expressions claires, puissantes, émouvantes et des termes éloquents.</p>
<p>⁕ Il est recommandé [à l'imam] d'<strong>élever la voix</strong> durant le sermon ; car le Prophète <span dir="rtl">ﷺ</span>, lorsqu'il prêchait, élevait la voix et son intensité (ferveur) augmentait. Cela a également un <strong>impact plus profond sur les cœurs</strong> et s'avère plus éloquent pour l'exhortation. De même, il convient de prononcer le sermon avec des <strong>termes clairs, puissants, touchants</strong> et une rhétorique soutenue.</p>
<p>⁕ Il est recommandé (Sunna) d'invoquer en faveur des musulmans pour ce qui contient la réforme de leur religion et de leur vie d'ici-bas. De même, il convient d'invoquer pour le dirigeant des musulmans et leurs gouverneurs, afin qu'ils obtiennent la droiture et la réussite. <strong>L'invocation pour les gouverneurs lors du sermon était une pratique connue chez les musulmans ، car invoquer pour les détenteurs de l'autorité parmi les musulmans afin qu'ils soient guidés et réformés fait partie de la voie des Gens de la Sunna et du Consensus (Ahl as-Sunnah wal-Jama'ah) ، tandis que son délaissement fait partie de la voie des gens de l'innovation.</strong></p>
<p>L'Imam Ahmad a dit : « <em>Si nous avions une invocation exaucée, nous l'aurions réservée au sultan (le dirigeant)</em> »<a href="#fn41" class="footnote-ref" id="fnref41" role="doc-noteref"><sup>41</sup></a> , et ce, parce que dans sa réforme réside la réforme des musulmans.</p>
<p>Certes, cette Sunna a été délaissée au point que les gens s'étonnent désormais de l'invocation pour les gouverneurs et pensent du mal de celui qui la pratique.</p>
<p>⁕ Il est recommandé (Sunna), une fois les deux sermons terminés, d'accomplir la prière immédiatement et de la commencer sans qu'il y ait un long intervalle de séparation.</p>
<p>⁕ La prière du vendredi est composée de deux unités (rak'at) selon le consensus (ijmâ'). La récitation y est faite à voix haute. Il est recommandé (Sunnah) de réciter, dans la première unité, la sourate <strong>Al-Jumu'ah</strong> après la Fatiha، et de réciter, dans la seconde unité, la sourate <strong>Al-Munâfiqûn</strong> après la Fatiha؛ car le Prophète <span dir="rtl">ﷺ</span> les récitait ainsi، comme l'a rapporté Muslim d'après Ibn 'Abbâs.<a href="#fn42" class="footnote-ref" id="fnref42" role="doc-noteref"><sup>42</sup></a></p>
<p>Ou bien، il peut réciter dans la première unité :</p>
<p class="ar"><strong><span dir="rtl">﴿سَبِّحِ اسْمَ رَبِّكَ الْأَعْلَى﴾</span></strong></p>
<p>﴾<em><strong>Glorifie le nom de ton Seigneur, le Très-Haut</strong></em>﴿ [Al-A'lâ]،</p>
<p>et dans la seconde :</p>
<p class="ar"><strong><span dir="rtl">﴿هَلْ أَتَاكَ حَدِيثُ الْغَاشِيَةِ﴾</span></strong></p>
<p>﴾<em><strong>T'est-il parvenu le récit de l'Enveloppante ?</strong></em>﴿ [Al-Ghâshiyah]؛</p>
<p>car il est authentifié que le Prophète <span dir="rtl">ﷺ</span> récitait parfois les sourates Al-Jumu'ah et Al-Munâfiqûn، et parfois ﴾<strong>Sabbih</strong>﴿ et <strong>Al-Ghâshiyah</strong>.<a href="#fn43" class="footnote-ref" id="fnref43" role="doc-noteref"><sup>43</sup></a> Il ne faut pas diviser une seule de ces sourates entre les deux unités (rak'at), car cela serait contraire à la Sunnah.</p>
<p>Quant à la sagesse derrière la récitation à voix haute lors de la prière du vendredi, elle réside dans le fait que cela est plus éloquent pour atteindre l'objectif recherché (l'exhortation et l'écoute).</p>
