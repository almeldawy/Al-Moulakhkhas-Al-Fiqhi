<p><strong>Il est recommandé (Sounnah)</strong> pour celui qui prie de repousser celui qui passe devant lui à proximité, conformément à la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><strong><span dir="rtl">«إذا كان أحدُكُم يُصلِّي؛ فلا يَدَعَنَّ أحداً يَمُرُّ بين يديه، فإن أبى؛ فليُقاتلهُ؛ فإنَّ معه القرينَ»، رواه مسلم</span></strong></p>
<p><em><strong>« Si l'un d'entre vous prie, qu'il ne laisse personne passer devant lui. S'il refuse [de s'arrêter], qu'il le repousse fermement, car il est accompagné du Qarin (le compagnon parmi les djinns) », rapporté par Muslim (1)</strong></em>.</p>
<p>Cependant, si le prieur a devant lui une Soutrah (c’est-à-dire un objet surélevé comme un mur ou autre), il n'y a pas de mal à passer derrière celle-ci. De même, si quelqu'un a besoin de passer en raison de l'étroitesse des lieux, il peut passer et le prieur ne doit pas le repousser. Il en est de même si l'on prie dans l'Enceinte Sacrée (Al-Haram [à la Mecque]) : le passage devant le prieur n'y est pas interdit, car le Prophète <span dir="rtl">ﷺ</span> priait à la Mecque alors que les gens passaient devant lui sans qu'il y ait de Soutrah entre eux. Rapporté par les cinq (2).</p>
<p>Le fait de prendre une Soutrah est une tradition recommandée (Sunnah) pour celui qui prie seul (Al-Munfarid) et pour l'imam. Cela conformément à la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><strong><span dir="rtl">«إذا صَلَّى أَحَدُكُمْ؛ فَلْيُصَلِّ إلى سُتْرَةٍ، وَلْيَدْنُ مِنْها»، رواه أبو داود وابنُ ماجه من حديث أبي سَعيدٍ</span></strong></p>
<p><em><strong>« Si l'un d'entre vous prie, qu'il prie face à une Soutrah et qu'il s'en approche », rapporté par Abou Daoud et Ibn Majah d'après le hadith d'Abou Sa'id (3).</strong></em></p>
<p>Quant à celui qui prie derrière un imam (Al-Ma'moum), sa Soutrah est celle de son imam.</p>
<p>Le fait de prendre une Soutrah n'est pas obligatoire, en raison du hadith d'Ibn Abbas selon lequel le Prophète <span dir="rtl">ﷺ</span> a prié dans un espace ouvert sans qu'il n'y ait rien devant lui. Rapporté par Ahmad et Abou Daoud (4).</p>
<p>Il convient que la Soutrah soit dressée, comme le dossier d'une selle de monture ; c'est-à-dire de la hauteur d'une coudée environ, qu'elle soit fine ou large.</p>
<p>La sagesse derrière son utilisation est d'empêcher les gens de passer devant le prieur, et d'éviter que celui-ci ne soit distrait par ce qui se passe au-delà de celle-ci.</p>
<p>S'il se trouve dans un désert (ou espace vide), qu'il prie face à un objet saillant comme un arbre, une pierre ou un bâton. S'il n'est pas possible de planter le bâton dans le sol, qu'il le pose horizontalement devant lui.</p>
<p><strong>Et si l'imam s'embrouille</strong> (hésite ou se trompe) dans sa récitation, il appartient alors au fidèle qui prie derrière lui (<em>Al-Ma'moum</em>) de lui faire entendre la récitation correcte.</p>
<p><strong>Il est autorisé</strong> pour celui qui prie de mettre un vêtement ou autre, de porter ou de poser un objet, et d'ouvrir la porte. Il lui est également permis de tuer un serpent ou un scorpion, car le Prophète <span dir="rtl">ﷺ</span> a ordonné de tuer les "deux noirs" durant la prière : le serpent et le scorpion. Rapporté par Abou Daoud et At-Tirmidhi qui l'a authentifié (5). Cependant, il ne convient pas de multiplier ces actes autorisés durant la prière, sauf par nécessité. S'il en abuse sans nécessité et de manière successive, cela annule la prière, car cela est incompatible avec la prière et en distrait le fidèle.</p>
<p><strong>Si un événement survient</strong> pour celui qui prie, comme si quelqu'un demande la permission d'entrer, ou si son imam commet une distraction (oubli), ou s'il craint qu'une personne ne tombe dans un danger mortel, il lui est permis de donner l'alerte à ce sujet : l'homme doit dire « <em><strong>Subhan Allah</strong></em> » (glorifier Allah) et la femme doit frapper dans ses mains (applaudir). Cela conformément à la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><strong><span dir="rtl">«إذَا نَابَكُمْ شيءٌ في صَلَاتِكُمْ؛ فَلْيُسَبِّحِ الرِّجَالُ، وَلْتُصَفِّقِ النِّسَاءُ»، متفقٌ عليه</span></strong></p>
<p><em><strong>« Si quelque chose survient durant votre prière, que les hommes disent Subhan Allah et que les femmes frappent dans leurs mains », rapporté par Al-Boukhari et Muslim (unanimement reconnu authentique). (6)</strong></em></p>
<p><strong>Il n'est pas détestable</strong> de passer le salut (Salam) à celui qui prie s'il sait comment y répondre. Dans ce cas, le prieur peut rendre le salut pendant sa prière par un geste et non par la parole. Il ne doit donc pas dire : « Wa 'alaykum as-salam ». S'il répond verbalement, sa prière est annulée, car il s'agit alors d'une parole humaine (adressée à un homme). Il lui est également permis de différer la réponse jusqu'après la fin de sa prière.</p>
<p><strong>Il est permis</strong> au prieur de réciter plusieurs sourates en une seule unité de prière (rak'ah), conformément à ce qui est rapporté dans le « Sahih » : le Prophète <span dir="rtl">ﷺ</span> a récité, lors de la station debout d'une seule rak'ah, [les sourates] Al-Baqara, Al-Imran et An-Nisa (7). Il lui est également permis de répéter la même sourate dans deux rak'ahs différentes, ou de diviser une seule sourate entre deux rak'ahs. De même, il lui est permis de réciter la fin ou le milieu des sourates, car Ahmad et Muslim (8) rapportent d'après Ibn Abbas que le Prophète <span dir="rtl">ﷺ</span> récitait, dans la première rak'ah de l'aube (Al-Fajr), la parole d'Allah : « Dites : Nous croyons en Allah et en ce qui nous a été révélé... » [Al-Baqara : 136], et dans la seconde, le verset d'Al-Imran : « Dis : Ô gens du Livre, venez à une parole commune entre nous et vous... » [Al-Imran : 64]. Cela s'appuie aussi sur le sens général du verset : « Récitez donc ce qui [vous] est possible du Coran » [Al-Muzzammil : 20]. Cependant, il ne convient pas d'en abuser ; cela doit être fait occasionnellement.</p>
<p><strong>Il est permis</strong> au prieur de demander la protection [d'Allah] lors de la lecture d'un verset mentionnant un châtiment, et de solliciter la [grâce d'Allah] lors de la lecture d'un verset mentionnant une miséricorde. De même, il lui est permis de prier sur le Prophète <span dir="rtl">ﷺ</span> lorsque son nom est mentionné, car il est fortement recommandé de prier sur lui chaque fois qu'il est évoqué.</p>
<p>Ceci est un ensemble de points qu'il vous est recommandé ou autorisé d'accomplir durant la prière. Nous vous les avons présentés dans l'espoir que vous en tiriez profit et que vous les mettiez en pratique, afin que vous agissiez avec clairvoyance dans votre religion. Nous demandons à Allah pour nous, comme pour vous, un surplus de science utile et d'œuvres pieuses.</p>
<p>Sachez que la prière est un acte d'adoration immense ; il n'est permis d'y accomplir des gestes ou d'y prononcer des paroles que dans les limites de la législation transmise par le Messager <span dir="rtl">ﷺ</span>. Il vous incombe donc d'y accorder une grande importance et d'apprendre ce qui la complète ainsi que ce qui la diminue (ou lui porte atteinte), afin de l'accomplir de la manière la plus parfaite.</p>
<h4 id="sources"><strong>Sources:</strong> </h4>
<p>1. Rapporté par Muslim (n° 506).</p>
<p>2. Rapporté par Abou Daoud (n° 2016) et d'autres.</p>
<p>Consultez aussi : « Sunan Ibn Majah » (n° 2958), An-Nasa'i (n° 834) et Ahmad ; leurs formulations diffèrent. Ibn Majah a précisé : « Ceci s'applique spécifiquement à la Mecque ».</p>
<p>3. Rapporté par Abou Daoud (n° 698), Ibn Majah (n° 954) et Ibn Khouzaïmah (n° 841) dans son « Sahih » où il a affirmé son authenticité. Il a également été authentifié par Al-Hakim (1/381) d'après le hadith de Sahl, ainsi que par Ibn Khouzaïmah (2/26).</p>
<p>4. Rapporté par Ahmad (1/224) ; Al-Haythami l'a déclaré faible dans « Al-Majma' » (2/63). Rapporté également par Abou Daoud (n° 718). Al-Mundhiri et An-Nasa'i (n° 829) l'ont rapporté avec un sens similaire.</p>
<p>5. Rapporté par At-Tirmidhi (n° 390) qui a dit : « Hadith bon et authentique (Hassan Sahih) ». Rapporté aussi par Abou Daoud (n° 921), An-Nasa'i (n° 520), Ibn Majah (n° 1245) et Ahmad (2/233). Il a été authentifié par Ibn Khouzaïmah (n° 869), Ibn Hibban (n° 2351) et Al-Hakim (1/386).</p>
<p>6. Rapporté par Al-Boukhari (n° 684) et Muslim (n° 421).</p>
<p>7. Voir : Muslim (n° 772) d'après le hadith de Houzayfa ; il (le Prophète) avait commencé par [la sourate] Al-Baqara, puis An-Nisa, puis Al-Imran.</p>
<p>8. Muslim (n° 727).</p>
