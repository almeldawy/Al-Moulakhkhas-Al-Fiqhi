  <!-- ▼ CONTENU DU CHAPITRE ▼ -->
  <template id="chapter-content">
<p>C'est une fonction religieuse importante que le Messager d'Allah <span dir="rtl">ﷺ</span> a assurée lui-même, tout comme ses califes bien guidés après lui.</p>
<p>De nombreux hadiths ont été rapportés concernant le mérite de l'imamat, parmi lesquels la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><strong><span dir="rtl">« ثَلَاثَةٌ عَلَى كُثْبَانِ المِسْكِ يَوْمَ القِيَامَةِ »</span></strong></p>
<p>« <em><strong>Trois personnes seront sur des collines de musc le Jour de la Résurrection</strong></em> »</p>
<p>et il mentionna parmi eux un homme qui a dirigé la prière pour un peuple alors que ceux-ci étaient satisfaits de lui. Dans un autre hadith, il est mentionné qu'il obtient une récompense équivalente à celle de tous ceux qui ont prié derrière lui. <a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a></p>
<p>C'est pour cette raison que certains compagnons ؓ disaient au Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><strong><span dir="rtl">« اجْعَلْنِي إِمَامَ قَوْمِي »</span></strong></p>
<p>« <em><strong>Désigne-moi comme imam pour mon peuple</strong></em> »<a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a></p>
<p>en raison de la vertu et de la récompense qu'ils savaient s'y trouver.</p>
<p>Cependant, à notre grand regret, nous voyons à notre époque beaucoup d'étudiants en sciences religieuses se détourner de l'imamat, s'en désintéresser et renoncer à l'assumer, privilégiant ainsi la paresse et manquant d'aspiration au bien ; ceci n'est rien d'autre qu'une manœuvre de découragement provenant du Diable.</p>
<p>Ce qu'il leur convient de faire, c'est de l'assumer avec sérieux, dynamisme et en espérant la récompense auprès d'Allah. En effet, les étudiants en sciences religieuses sont les personnes les plus dignes d'assumer cette fonction, ainsi que les autres bonnes œuvres.</p>
<p>Plus les qualifications requises pour l'imamat sont réunies chez une personne, plus celle-ci est prioritaire pour l'assumer par rapport à quelqu'un qui en a moins. Il lui incombe même (cela devient une obligation personnelle) de s'en charger si personne d'autre n'est trouvé:</p>
<p>⁕ Le plus digne de l'imamat est celui qui a la meilleure lecture du Livre d'Allah le Très-Haut. Il s'agit de celui qui maîtrise la récitation du Coran en connaissant les points d'articulation des lettres (makhârij), sans faire de fautes de langage (lahn), et en appliquant les règles de récitation sans affectation ni excès. Il doit, en plus de cela, connaître la jurisprudence (fiqh) de sa prière et ce qu'elle implique, comme ses conditions, ses piliers, ses obligations et ses facteurs d'annulation. Ceci conformément à la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><strong><span dir="rtl">« يَؤُمُّ القَوْمَ أَقْرَؤُهُمْ لِكِتَابِ اللهِ »</span></strong></p>
<p>« <em><strong>Celui qui doit diriger la prière pour un peuple est celui qui connaît le mieux la lecture du Livre d'Allah</strong></em> »<a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a></p>
<p>ainsi que les autres hadiths authentiques de même sens. Cela prouve que l'on doit mettre en avant pour l'imamat celui qui a la meilleure récitation du Noble Coran et qui connaît la jurisprudence de la prière, car à l'époque du Prophète <span dir="rtl">ﷺ</span>, celui qui lisait le mieux était aussi le plus savant.</p>
<p>⁕ S'ils sont égaux dans la lecture, on met en avant le plus savant (<em>al-afqah</em>, c'est-à-dire celui qui a le plus de connaissances en jurisprudence). Cela est dû au fait qu'il réunit deux qualités : la lecture et la jurisprudence, conformément à la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><strong><span dir="rtl">« فَإِنْ كَانُوا فِي القِرَاءَةِ سَوَاءً؛ فَأَعْلَمُهُمْ بِالسُّنَّةِ »</span></strong></p>
<p>« <em><strong>S'ils sont égaux dans la lecture, alors le plus savant d'entre eux en ce qui concerne la Sunna</strong></em> »</p>
<p><strong>c'est-à-dire le plus versé dans la religion d'Allah</strong>. De plus, le prieur a davantage besoin de jurisprudence que de lecture, car ce qui est obligatoire dans la lecture durant la prière est limité, tandis que les incidents pouvant survenir durant celle-ci ne le sont pas.</p>
<p>⁕ S'ils sont égaux dans la jurisprudence et la lecture, on met en avant celui qui a accompli l'émigration (<em>al-hijrah</em>) en premier. <em><strong>La hijrah étant le fait de passer d'une terre d'association (shirk) vers une terre d'Islam.</strong></em></p>
<p>⁕ S'ils sont égaux dans la lecture, la jurisprudence et l'hégire, on met en avant le plus âgé, conformément à la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><strong><span dir="rtl">« وَلْيَؤُمَّكُمْ أَكْبَرُكُمْ »</span></strong></p>
<p>« <em><strong>Et que le plus âgé d'entre vous dirige votre prière</strong></em> » (Rapporté par Al-Bukhârî et Muslim).<a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a></p>
<p>En effet, l'ancienneté d'âge dans l'Islam est une vertu, et cela est plus propice au recueillement (<em>khushû’</em>) et à l'exaucement des invocations.</p>
<p>La preuve de cet ordre de priorité est le hadith rapporté par Muslim d'après Abû Mas’ûd al-Badrî ؓ, d'après le Prophète <span dir="rtl">ﷺ</span> qui a dit :</p>
<p class="ar"><strong><span dir="rtl">« يَؤُمُّ القَوْمَ أَقْرَؤُهُمْ لِكِتَابِ اللهِ، فَإِنْ كَانُوا فِي القِرَاءَةِ سَوَاءً؛ فَأَعْلَمُهُمْ بِالسُّنَّةِ، فَإِنْ كَانُوا فِي السُّنَّةِ سَوَاءً؛ فَأَقْدَمُهُمْ هِجْرَةً، فَإِنْ كَانُوا فِي الهِجْرَةِ سَوَاءً؛ فَأَقْدَمُهُمْ سِنّاً » .</span></strong></p>
<p>« <em><strong>Celui qui doit diriger la prière pour un peuple est celui qui connaît le mieux la lecture du Livre d'Allah. S'ils sont égaux dans la lecture, alors le plus savant d'entre eux en ce qui concerne la Sunna. S'ils sont égaux concernant la Sunna, alors celui qui a accompli l'hégire le premier. S'ils sont égaux concernant l'hégire, alors le plus âgé d'entre eux.</strong></em> »</p>
<p><strong>Cheikh al-Islam Ibn Taymiyya — qu'Allah lui fasse miséricorde — a dit</strong> <a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a> <strong>:</strong></p>
<p>« <em>Le Prophète <span dir="rtl">ﷺ</span> a ainsi donné la priorité selon le mérite dans la <strong>connaissance du Livre et de la Sunna</strong>. S'ils sont égaux en science, la priorité est donnée à celui qui a <strong>devancé les autres dans les bonnes œuvres</strong>.</em></p>
<p><em>De plus, celui qui a pris l'initiative par son propre choix de devancer les autres dans les bonnes œuvres (<strong>c'est-à-dire le Mouhajir / celui qui a fait la Hijrah</strong>) est placé devant celui qui a devancé les autres par le simple fait de la création d'Allah (<strong>c'est-à-dire celui qui est plus âgé</strong>).</em> » Fin de citation.</p>
<p>⁕ Il existe des considérations selon lesquelles certains individus sont prioritaires pour l'imamat sur les personnes présentes, même si ces dernières sont plus méritantes (plus savantes) qu'eux. Ces cas sont :</p>
<ul>
<li><blockquote>
<p><strong>Premièrement : L'imam attitré du Masjid (l'imam ratib).</strong> S'il est apte à diriger la prière, nul autre n'a le droit de passer devant lui, même si cet autre est plus méritant, sauf avec sa permission.</p>
</blockquote></li>
</ul>
<ul>
<li><blockquote>
<p><strong>Deuxièmement : Le maître de maison.</strong> S'il est apte à diriger la prière, personne n'a le droit de prendre sa place pour l'imamat, sauf avec sa permission.</p>
</blockquote></li>
<li><blockquote>
<p><strong>Troisièmement : Le Sultan (le dirigeant),</strong> c'est-à-dire le chef suprême ou son représentant. Personne ne doit le précéder pour l'imamat, sauf avec son accord, à condition qu'il soit apte à diriger la prière.</p>
</blockquote></li>
</ul>
<p>La preuve de la priorité accordée à ces personnes sur les autres réside dans ce qu'a rapporté Abû Dâwud d'après la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><strong><span dir="rtl">« لَا يَؤُمَّنَّ الرَّجُلُ الرَّجُلَ فِي بَيْتِهِ وَلَا فِي سُلْطَانِهِ إِلَّا بِإِذْنِهِ »</span></strong></p>
<p>« <em><strong>Qu'un homme ne dirige pas la prière d'un autre homme dans sa propre maison, ni là où il exerce son autorité, sauf avec sa permission.</strong></em> » <a href="#fn6" class="footnote-ref" id="fnref6" role="doc-noteref"><sup>6</sup></a></p>
<p>Et dans le « Sahîh Muslim » :</p>
<p class="ar"><strong><span dir="rtl">« وَلَا يَؤُمَّنَّ الرَّجُلُ الرَّجُلَ فِي بَيْتِهِ وَلَا فِي سُلْطَانِهِ إِلَّا بِإِذْنِهِ »</span></strong></p>
<p>« <em><strong>Qu'un homme ne dirige pas la prière d'un autre homme dans sa propre demeure, ni là où il détient l'autorité, sauf avec sa permission.</strong></em> » <a href="#fn7" class="footnote-ref" id="fnref7" role="doc-noteref"><sup>7</sup></a></p>
<p>Et son "autorité" (<em>sultânuhu</em>) désigne le lieu de sa juridiction ou ce qu'il possède.</p>
<p><strong>Al-Khattâbî a dit :</strong> « <em>Cela signifie que le maître de maison est le plus digne de diriger la prière chez lui, dès lors qu'il possède un niveau de lecture ou de science lui permettant d'accomplir la prière [correctement]</em> <a href="#fn8" class="footnote-ref" id="fnref8" role="doc-noteref"><sup>8</sup></a><em>.</em></p>
<p><em>De même, si l'imam de la mosquée a été nommé par le Sultan (l'autorité), par son représentant, ou que les gens de la mosquée se sont accordés pour le placer à leur tête, alors il est le plus légitime [pour diriger].</em></p>
<p><em>Car il s'agit d'une autorité spécifique (privée), et parce que passer devant lui [sans son accord] nuirait à sa réputation (en provoquant de mauvaises conjectures à son sujet) et ferait fuir les gens de lui.</em> »</p>
<p>⁕ De ce qui précède, la noblesse de l'imamat dans la prière, son mérite et son rang en Islam t'apparaissent clairement. Car l'imam, durant la prière, est un modèle à suivre (<em>qudwah</em>). L'imamat est un rang honorable : c'est une manière de devancer les autres dans le bien, une aide à l'obéissance et à l'assiduité au groupe (<em>jamâ'ah</em>), et c'est par elle que les mosquées sont vivifiées par l'adoration.</p>
<p>Elle rentre dans la portée générale de la parole d'Allah le Très-Haut, lorsqu'Il rapporte l'invocation des "Serviteurs du Tout-Miséricordieux" :</p>
<p class="ar"><strong><span dir="rtl">﴿وَالَّذِينَ يَقُولُونَ رَبَّنَا هَبْ لَنَا مِنْ أَزْوَاجِنَا وَذُرِّيَّاتِنَا قُرَّةَ أَعْيُنٍ وَاجْعَلْنَا لِلْمُتَّقِينَ إِمَامًا﴾ [الفرقان: ٧٤].</span></strong></p>
<p>{<em><strong>Et ceux qui disent : "Seigneur, donne-nous, en nos épouses et nos descendants, la joie des yeux, et fais de nous un guide (imam) pour les pieux"</strong></em>} (Sourate Al-Furqân, v. 74).</p>
<p>Ainsi, l'imamat dans la prière fait partie de l'imamat (la direction) dans la religion, tout particulièrement si l'imam prodigue conseils, sermons et rappels à ceux qui l'entourent à la mosquée. Il fait alors partie des prêcheurs vers Allah, ceux qui joignent la parole droite à la bonne œuvre.</p>
<p class="ar"><strong><span dir="rtl">﴿وَمَنْ أَحْسَنُ قَوْلًا مِمَّنْ دَعَا إِلَى اللَّهِ وَعَمِلَ صَالِحًا وَقَالَ إِنَّنِي مِنَ الْمُسْلِمِينَ﴾ [فصلت: ٣٣]</span></strong></p>
<p><strong>{<em>Et qui apporte de meilleures paroles que celui qui appelle vers Allah, fait bonne œuvre et dit : "Je suis du nombre des Musulmans" ?</em>}</strong> (Sourate Fussilat, v. 33).</p>
<p>Personne ne se détourne de la fonction d'imam, si ce n'est celui qui est privé [d'un grand bien]. Et il n'y a de force et de puissance qu'en Allah.</p>
