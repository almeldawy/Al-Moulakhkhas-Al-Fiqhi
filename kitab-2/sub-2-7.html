<p>Après avoir exposé les piliers de la prière, ses obligations et ses actes recommandés (<em>Sunan</em>) — qu'ils soient verbaux ou gestuels —, nous souhaitons décrire la manière d'accomplir la prière en intégrant tous ces éléments, telle qu'elle est rapportée dans les textes décrivant la prière du Prophète <span dir="rtl">ﷺ</span>. Ceci afin qu'elle serve de modèle au musulman, conformément à sa parole <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><strong><span dir="rtl">«صَلُّوا كَمَا رَأَيْتُمُونِي أُصَلِّي»</span></strong></p>
<p><em><strong>« Priez comme vous m'avez vu prier ». (1)</strong></em></p>
<p>Voici donc le déroulement de celle-ci :</p>
<p><strong>Lorsque le Messager d'Allah <span dir="rtl">ﷺ</span> se levait pour la prière :</strong> il se dirigeait vers la Qibla, levait les mains en orientant la paume de ses doigts vers la Qibla, et disait : « <em>Allâhu Akbar</em> » (Allah est le Plus Grand).</p>
<p><strong>Ensuite,</strong> il saisissait sa main gauche avec sa main droite et les plaçait sur sa poitrine.</p>
<p><strong>Puis, il récitait l'invocation d'ouverture (<em>al-Istiftâh</em>).</strong> Le Prophète <span dir="rtl">ﷺ</span> ne s'en tenait pas à une seule formule constante ; il est donc permis d'utiliser n'importe laquelle des invocations d'ouverture authentiquement rapportées de sa part. Parmi elles :</p>
<blockquote>
<p class="ar"><strong><span dir="rtl">«سُبْحَانَكَ اللَّهُمَّ وَبِحَمْدِكَ، وَتَبَارَكَ اسْمُكَ، وَتَعَالَى جَدُّكَ، وَلَا إِلَهَ غَيْرُكَ»</span></strong></p>
<p><em><strong>« Gloire et pureté à Toi, ô Allah, et à Toi la louange. Béni soit Ton nom, exaltée soit Ta grandeur, et il n'y a d'autre divinité [digne d'adoration] que Toi ». (2)</strong></em></p>
</blockquote>
<p><strong>Ensuite, il dit :</strong></p>
<p class="ar"><strong><span dir="rtl">أَعُوذُ بِاللهِ مِنَ الشَّيْطَانِ الرَّجِيمِ، بِسْمِ اللهِ الرَّحْمَنِ الرَّحِيمِ</span></strong></p>
<p><em><strong>« Je cherche protection auprès d'Allah contre Satan le lapidé. Au nom d'Allah, le Tout Miséricordieux, le Très Miséricordieux. »</strong></em></p>
<p><strong>Puis, il récite la "Fâtiha" (l'Ouverture du Livre).</strong> Lorsqu'il l'a terminée, il dit : « Âmîn » (Amine).</p>
<p><strong>Ensuite, il récitait après cela une sourate,</strong> tantôt longue, tantôt courte, et tantôt de longueur moyenne. Il prolongeait la récitation de la prière de l'aube (<em>al-Fajr</em>) plus que celle des autres prières. <strong>Il récitait à voix haute</strong> lors de la prière du <em>Fajr</em> et dans les deux premières unités (<em>Rak'ahs</em>) du <em>Maghrib</em> et de l'<em>Isha</em>. <strong>Il récitait à voix basse</strong> pour le reste. <strong>Le Prophète <span dir="rtl">ﷺ</span> avait également pour habitude</strong> de rendre la première <em>Rak'ah</em> de chaque prière plus longue que la seconde.</p>
<p><strong>Ensuite, il lève les mains</strong> de la même manière qu'il l'a fait lors de l'ouverture de la prière, puis il dit : « <em>Allâhu Akbar</em> » (Allah est le Plus Grand). <strong>Il s'incline alors pour le <em>Rukû'</em></strong> : il place ses mains sur ses genoux en écartant les doigts et en les y appuyant fermement. Il maintient son dos bien droit et étendu, et garde sa tête dans le prolongement de son dos (sans la relever ni la baisser). Puis, il dit : « <em>Subhâna Rabbî al-'Adhîm</em> » (Gloire à mon Seigneur l'Immense).</p>
<p><strong>Puis, il relève la tête en disant :</strong> « <em>Sami'a Allâhu liman hamidah</em> » (Allah a entendu celui qui L'a loué), tout en levant les mains comme il l'a fait au moment de l'inclinaison.</p>
<p><strong>Lorsqu'il est redressé et parfaitement stable en station debout, il dit :</strong> « <em>Rabbanâ laka-l-hamd</em> » (Notre Seigneur, à Toi la louange). Et le Prophète <span dir="rtl">ﷺ</span> avait pour habitude de faire durer ce redressement.</p>
<p><strong>Ensuite, il dit le Takbîr (<em>Allâhu Akbar</em>) et se prosterne</strong> sans lever les mains. Il se prosterne sur sept membres : le front (incluant le nez), les deux mains, les deux genoux et la pointe des pieds. Il oriente ses doigts et ses orteils vers la Qibla. Il adopte une position équilibrée, appuie fermement son front et son nez au sol, s'appuie sur ses paumes tout en relevant ses coudes. Il écarte ses bras de ses flancs, son ventre de ses cuisses, et ses cuisses de ses jambes. Il disait durant sa prosternation : « <em>Subhâna Rabbî al-A'lâ</em> » (Gloire à mon Seigneur le Très-Haut).</p>
<p><strong>Puis, il relève la tête en disant :</strong> « <em>Allâhu Akbar</em> ». Il pose ensuite son pied gauche à plat pour s'asseoir dessus, tout en maintenant son pied droit redressé (les orteils vers la Qibla). Il place ses mains sur ses cuisses et dit :</p>
<p class="ar"><strong><span dir="rtl">«اللَّهُمَّ اغْفِرْ لِي، وَارْحَمْنِي، وَاجْبُرْنِي، وَاهْدِنِي، وَارْزُقْنِي».</span></strong></p>
<p><em><strong>« Ô Allah, pardonne-moi, fais-moi miséricorde, panse mes blessures (ou secours-moi), guide-moi et accorde-moi ma subsistance »</strong></em>.</p>
<p><strong>Ensuite, il dit le Takbîr et se prosterne une seconde fois,</strong> en faisant exactement la même chose que lors de la première.</p>
<p><strong>Puis, il relève la tête en disant le Takbîr</strong> et se lève en s'appuyant sur l'avant de ses pieds, tout en prenant appui sur ses genoux et ses cuisses.</p>
<p><strong>Une fois totalement debout,</strong> il commence sa récitation et accomplit la deuxième <em>Rak'ah</em> de la même manière que la première.</p>
<p><strong>Ensuite, il s'assoit pour le premier <em>Tashahhud</em></strong> dans la position de l'<em>Iftirâsh</em> (assis sur le pied gauche à plat, le pied droit redressé), tout comme il le fait entre les deux prosternations. <strong>Il place sa main droite sur sa cuisse droite</strong> et sa main gauche sur sa cuisse gauche. Il joint le pouce de sa main droite avec son majeur pour former un cercle, et il pointe son index [vers la Qibla] tout en le regardant. <strong>Il dit alors :</strong></p>
<p class="ar"><strong><span dir="rtl">«التَّحِيَّاتُ لِلَّهِ، وَالصَّلَوَاتُ، وَالطَّيِّبَاتُ، السَّلَامُ عَلَيْكَ أَيُّهَا النَّبِيُّ وَرَحْمَةُ اللهِ وَبَرَكَاتُهُ، السَّلَامُ عَلَيْنَا وَعَلَى عِبَادِ اللهِ الصَّالِحِينَ، أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا اللهُ وَحْدَهُ لَا شَرِيكَ لَهُ، وَأَشْهَدُ أَنَّ مُحَمَّداً عَبْدُهُ وَرَسُولُهُ»</span></strong></p>
<p><em><strong>« Les salutations sont pour Allah, ainsi que les prières et les bonnes paroles. Que la paix soit sur toi, ô Prophète, ainsi que la miséricorde d'Allah et Ses bénédictions. Que la paix soit sur nous et sur les serviteurs vertueux d'Allah. J'atteste qu'il n'y a de divinité [digne d'adoration] qu'Allah, Seul et sans associé, et j'atteste que Muhammad est Son serviteur et Son Messager. »</strong></em></p>
<p><strong>Le Prophète <span dir="rtl">ﷺ</span> avait pour habitude</strong> de ne pas faire durer cette assise (il la faisait avec légèreté/brièveté).</p>
<p><strong>Ensuite, il se relève en disant le Takbîr (<em>Allâhu Akbar</em>)</strong> pour accomplir la troisième et la quatrième unités de prière (<em>Rak'ahs</em>). Il les rend plus brèves que les deux premières et n'y récite que la sourate Al-Fâtiha.</p>
<p><strong>Puis, il s'assoit pour son dernier <em>Tashahhud</em> dans la position du <em>Tawarruk</em> :</strong> il pose son pied gauche à plat en plaçant le dessus du pied contre le sol, et il maintient son pied droit redressé. Autrement dit, il fait passer son pied gauche sous sa jambe droite pour qu'il ressorte du côté droit, tout en posant son fessier directement sur le sol.</p>
<p><strong>Ensuite, il récite le dernier <em>Tashahhud</em>.</strong> Celui-ci est identique au premier, mais il y ajoute la prière abrahamique :</p>
<p class="ar"><strong><span dir="rtl">«اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ، كَمَا صَلَّيْتَ عَلَى آلِ إِبْرَاهِيمَ؛ إِنَّكَ حَمِيدٌ مَجِيدٌ، وَبَارِكْ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ، كَمَا بَارَكْتَ عَلَى آلِ إِبْرَاهِيمَ؛ إِنَّكَ حَمِيدٌ مَجِيدٌ».</span></strong></p>
<p><em><strong>« Ô Allah, prie sur Muhammad et sur la famille de Muhammad, comme Tu as prié sur la famille d'Ibrahim ; Tu es certes digne de louanges et de gloire. Et bénis Muhammad et la famille de Muhammad, comme Tu as béni la famille d'Ibrahim ; Tu es certes digne de louanges et de gloire. »</strong></em></p>
<p><strong>Il cherche ensuite la protection d'Allah</strong> contre le châtiment de l'Enfer, contre le châtiment de la tombe, contre les épreuves de la vie et de la mort, et contre l'épreuve de l'Antéchrist (<em>al-Masîh ad-Dajjâl</em>). Puis, il invoque avec les formules rapportées dans le Coran et la Sunnah.</p>
<p><strong>Ensuite, il salue sur sa droite</strong> en disant : « <em>As-salâmu ‘alaykum wa rahmatu-llâh</em> » (Que la paix et la miséricorde d'Allah soient sur vous), puis il fait de même sur sa gauche. Il commence la salutation en étant face à la Qibla et la termine au moment où il a fini de tourner la tête.</p>
<p><strong>Une fois qu'il a salué, il dit :</strong></p>
<p class="ar"><strong><span dir="rtl">«أَسْتَغْفِرُ اللهَ (ثَلَاثاً)، اللَّهُمَّ أَنْتَ السَّلَامُ، وَمِنْكَ السَّلَامُ، تَبَارَكْتَ يَا ذَا الجَلَالِ وَالإِكْرَامِ»</span></strong></p>
<p><em><strong>« Astaghfiru-llâh » (Je demande pardon à Allah) trois fois, puis : « Ô Allah, Tu es la Paix (as-Salâm) et de Toi vient la paix. Béni sois-Tu, ô Détenteur de la majesté et de la générosité. »</strong></em></p>
<p>Ensuite, il invoque Allah avec les formules de rappel (<em>Dhikr</em>) rapportées par la tradition.</p>
<p><strong>Ô Musulman !</strong> Ceci est un résumé concis de la description de la prière tel qu'il apparaît dans les textes scripturaires. Il t'incombe d'accorder à ta prière la plus grande attention et de veiller à ce qu'elle soit, autant que possible, conforme à la prière du Prophète <span dir="rtl">ﷺ</span>. Allah le Très-Haut a dit :</p>
<p class="ar"><strong><span dir="rtl">﴿لَّقَدْ كَانَ لَكُمْ فِي رَسُولِ اللَّهِ أُسْوَةٌ حَسَنَةٌ لِّمَن كَانَ يَرْجُو اللَّهَ وَالْيَوْمَ الْآخِرَ وَذَكَرَ اللَّهَ كَثِيرًا﴾ [الأحزاب: ٢١].</span></strong></p>
<p><em><strong>« En effet, vous avez dans le Messager d’Allah un excellent modèle [à suivre], pour quiconque espère en Allah et au Jour dernier et invoque Allah fréquemment. » (Sourate Al-Ahzâb, v. 21).</strong></em></p>
<p>Et nous demandons à Allah, pour tous, la réussite et l'acceptation.</p>
<h3 id="sources">Sources:</h3>
<p>(1) Rapporté par Al-Bukhârî (Hadith n° 631).</p>
<p>(2) Rapporté par Ahmad (3/50), Abû Dâwud (775), At-Tirmidhî (242), An-Nasâ'î (889), Ibn Mâjah (804) ; et voir aussi : « Sahîh Muslim » (398).</p>
