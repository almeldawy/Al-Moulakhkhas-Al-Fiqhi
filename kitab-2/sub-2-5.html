<p><strong>Ô musulman !</strong> Tu as un besoin pressant de connaître les règles de bienséance prescrites qui précèdent la prière, afin de t'y préparer. Car la prière est un acte d'adoration immense qui doit être précédé d'une préparation et d'une disposition appropriées, afin que le musulman entre dans cette adoration sous la meilleure des formes.</p>
<p><strong>Lorsque tu marches vers la mosquée</strong> pour accomplir la prière avec la communauté des musulmans, fais-le avec sérénité (<em>Sakînah</em>) et dignité (<em>Waqâr</em>).</p>
<ul>
<li><blockquote>
<p><strong>La sérénité (<em>as-Sakînah</em>) :</strong> C'est la tranquillité et la modération dans la marche.</p>
</blockquote></li>
<li><blockquote>
<p><strong>La dignité (<em>al-Waqâr</em>) :</strong> C'est le sérieux, la tempérance, le fait de baisser le regard, de baisser la voix et de ne pas trop se retourner.</p>
</blockquote></li>
</ul>
<p>Il a été rapporté dans les « Deux Authentiques » (al-Bukhârî et Muslim) que le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="rtl">«إِذَا أُقِيمَتِ الصَّلَاةُ (وَفِي لَفْظٍ: إِذَا سَمِعْتُمُ الإِقَامَةَ)؛ فَامْشُوا وَعَلَيْكُمُ السَّكِينَةُ؛ فَمَا أَدْرَكْتُمْ فَصَلُّوا، وَمَا فَاتَكُمْ فَأَتِمُّوا»،</span></p>
<p>« <em><strong>Si la prière commence (et dans une autre version : si vous entendez l'appel de l'Iqâmah), marchez pour vous y rendre avec sérénité. Priez ce que vous avez rattrapé de la prière, et complétez ce que vous avez manqué.</strong></em> » <a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a></p>
<p>Et l'Imam Muslim a rapporté :</p>
<p class="ar"><span dir="rtl">«إِنَّ أَحَدَكُمْ إِذَا كَانَ يَعْمِدُ إِلَى الصَّلَاةِ؛ فَهُوَ فِي صَلَاةٍ»،</span></p>
<p><strong>« Certes, lorsque l'un de vous se dirige vers la prière, il est déjà [considéré comme étant] en prière. »</strong> <a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a></p>
<p><strong>Ô musulman, que ton départ vers la mosquée se fasse tôt</strong>, afin d'atteindre le Takbîr al-Ihrâm (le premier Takbîr qui ouvre la prière) et d'assister à la prière en groupe dès son commencement. Rapproche tes pas lorsque tu marches vers la prière, afin d'augmenter tes bonnes actions (hassanates) ; Car il est rapporté dans les « Deux Authentiques » (al-Bukhârî et Muslim) que le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="rtl">«إِذَا تَوَضَّأَ أَحَدُكُمْ فَأَحْسَنَ الوُضُوءَ، ثُمَّ خَرَجَ إِلَى المَسْجِدِ؛ لَمْ يَخْطُ خُطْوَةً؛ إِلَّا رُفِعَتْ لَهُ بِهَا دَرَجَةٌ، وَحُطَّتْ عَنْهُ بِهَا خَطِيئَةٌ»</span></p>
<p><em><strong>« Lorsque l'un de vous fait ses ablutions et les accomplit de manière excellente, puis sort vers la mosquée, il ne fait pas un pas sans qu'il ne soit élevé d'un degré par celui-ci, et qu'un péché ne lui soit effacé. »</strong></em> <a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a></p>
<p><strong>Lorsque tu arrives à la porte de la mosquée</strong>, avance ton pied droit en entrant et dis :</p>
<p class="ar"><span dir="rtl">بِاسْمِ اللهِ، أَعُوذُ بِاللهِ العَظِيمِ وَبِوَجْهِهِ الكَرِيمِ وَسُلْطَانِهِ القَدِيمِ مِنَ الشَّيْطَانِ الرَّجِيمِ، اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ، اللَّهُمَّ اغْفِرْ لِي ذُنُوبِي، وَافْتَحْ لِي أَبْوَابَ رَحْمَتِكَ.</span></p>
<p></p>
<p><strong>« Au nom d'Allah. Je cherche protection auprès d'Allah l'Immense, par Son noble Visage et Son autorité éternelle, contre Satan le lapidé. Ô Allah, prie sur Muhammad. Ô Allah, pardonne-moi mes péchés et ouvre-moi les portes de Ta miséricorde. »</strong></p>
<p><strong>Et quand tu souhaites sortir</strong>, avance ton pied gauche et récite l'invocation que tu as dite à l'entrée, mais dis à la place de</p>
<p class="ar"><span dir="rtl">«وَافْتَحْ لِي أَبْوَابَ رَحْمَتِكَ»: «وَافْتَحْ لِي أَبْوَابَ فَضْلِكَ»</span></p>
<p><strong>« ouvre-moi les portes de Ta miséricorde » : « ouvre-moi les portes de Ta grâce (<em>fadlik</em>) ».</strong></p>
<p>Ceci car la mosquée est le lieu de la miséricorde, alors que l'extérieur de la mosquée est le lieu de la subsistance (<em>rizq</em>), qui est une grâce venant d'Allah.</p>
<p><strong>Une fois que tu es entré dans la mosquée,</strong> ne t'assieds pas avant d'avoir accompli deux unités de prière (<em>rak'atayn</em>) en guise de salutation de la mosquée (<em>Tahiyyat al-Masjid</em>) ; ceci conformément à la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«إِذَا دَخَلَ أَحَدُكُمُ المَسْجِدَ؛ فَلَا يَجْلِسْ حَتَّى يُصَلِّيَ رَكْعَتَيْنِ»</span></p>
<p></p>
<p><em><strong>« Lorsque l'un de vous entre à la mosquée, qu'il ne s'assoie pas avant d'avoir prié deux unités de prière. »</strong></em> <a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a><em><strong>.</strong></em></p>
<p>Ensuite, tu t'assieds pour attendre la prière. Durant ton assise à la mosquée en attente de la prière, occupe-toi par l'évocation d'Allah (<em>dhikr</em>) et la récitation du Coran. Évite les gestes futiles, comme le fait de croiser les doigts (entrelacer les mains) ou autre ; car l'interdiction à ce sujet a été rapportée concernant celui qui attend la prière. Le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="rtl">«إِذَا كَانَ أَحَدُكُمْ فِي المَسْجِدِ؛ فَلَا يُشَبِّكَنَّ؛ فَإِنَّ التَّشْبِيكَ مِنَ الشَّيْطَانِ»</span></p>
<p><em><strong>« Lorsque l'un de vous est à la mosquée, qu'il ne croise surtout pas ses doigts, car l'entrelacement [des doigts] vient du Diable »</strong></em> <a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a><em><strong>.</strong></em></p>
<p>Quant à celui qui se trouve à la mosquée pour une raison autre que l'attente de la prière, il ne lui est pas interdit de croiser les doigts ; car il a été confirmé que le Prophète <span dir="rtl">ﷺ</span> a croisé ses doigts dans la mosquée après avoir terminé la prière par le salut final (<em>taslim</em>) <a href="#fn6" class="footnote-ref" id="fnref6" role="doc-noteref"><sup>6</sup></a>.</p>
<p><strong>Et lorsque tu attends la prière dans la mosquée</strong>, ne t'engage pas dans des discussions mondaines (frivoles) ; car il a été rapporté dans le hadith que cela consume les bonnes actions comme le feu consume le bois <a href="#fn7" class="footnote-ref" id="fnref7" role="doc-noteref"><sup>7</sup></a>.</p>
<p>Il a également été rapporté dans un autre hadith <a href="#fn8" class="footnote-ref" id="fnref8" role="doc-noteref"><sup>8</sup></a> que le serviteur est [considéré comme étant] en prière tant qu'il attend la prière, et les Anges demandent le pardon pour lui. Ne néglige donc pas, ô musulman, cette récompense et ne la gaspille pas par la futilité ou en t'occupant de commérages (« on dit » et « il a dit »).</p>
<p><strong>Et lorsque l'appel à la prière (<em>Iqâmah</em>) est lancé</strong>, lève-toi quand le muezzin dit : « <em><strong>La prière est certes établie</strong></em> » (<em><strong>Qad qâmat as-salât</strong></em>), car le Prophète <span dir="rtl">ﷺ</span> agissait ainsi. Toutefois, si tu te lèves dès le début de l'Iqâmah, il n'y a pas de mal à cela. Ceci s'applique si le fidèle (<em>ma’moum</em>) voit l'imam. S'il ne le voit pas pendant l'Iqâmah, alors il est préférable qu'il ne se lève pas tant qu'il ne l'a pas vu.</p>
<p>Ô musulman ! Veille scrupuleusement à être au premier rang ; car le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="rtl">«لَوْ يَعْلَمُ النَّاسُ مَا فِي النِّدَاءِ وَالصَّفِّ الأَوَّلِ، ثُمَّ لَمْ يَجِدُوا إِلَّا أَنْ يَسْتَهِمُوا عَلَيْهِ؛ لَاسْتَهَمُوا»، مُتَّفَقٌ عَلَيْهِ</span></p>
<p><em><strong>« Si les gens savaient ce que recèlent l'appel à la prière et le premier rang, et qu'ils ne trouvaient d'autre moyen [pour y accéder] que de tirer au sort, ils tireraient au sort », [Hadith] faisant l'unanimité</strong></em> <a href="#fn9" class="footnote-ref" id="fnref9" role="doc-noteref"><sup>9</sup></a><em><strong>.</strong></em></p>
<p>Et il <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="rtl">«خَيْرُ صُفُوفِ الرِّجَالِ أَوَّلُهَا»</span></p>
<p><em><strong>« Les meilleurs rangs pour les hommes sont les premiers »</strong></em> <a href="#fn10" class="footnote-ref" id="fnref10" role="doc-noteref"><sup>10</sup></a><em><strong>.</strong></em></p>
<p>Veille également à être proche de l'imam ; car il <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="rtl">«لِيَلِنِي مِنْكُمْ أُولُو الأَحْلَامِ وَالنُّهَى»</span></p>
<p><em><strong>« Que ceux d'entre vous qui sont doués de raison et de maturité se placent juste derrière moi »</strong></em> <a href="#fn11" class="footnote-ref" id="fnref11" role="doc-noteref"><sup>11</sup></a><em><strong>.</strong></em></p>
<p>Ceci concerne l'homme. Quant à la femme, le dernier rang des femmes est meilleur pour elle, conformément à sa parole <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«وَخَيْرُ صُفُوفِ النِّسَاءِ آخِرُهَا»</span></p>
<p><em><strong>« Et les meilleurs rangs pour les femmes sont les derniers » ;</strong></em>car cela l'éloigne davantage de la vue des hommes.</p>
<p><strong>Il incombe impérativement à l'imam et aux fidèles</strong> de veiller à l'alignement des rangs. Le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="rtl">«سَوُّوا صُفُوفَكُمْ؛ فَإِنَّ تَسْوِيَةَ الصُّفُوفِ مِنْ تَمَامِ الصَّلَاةِ»</span></p>
<p><em><strong>« Égalisez vos rangs, car l'égalisation des rangs fait partie de la perfection de la prière »</strong></em> <a href="#fn12" class="footnote-ref" id="fnref12" role="doc-noteref"><sup>12</sup></a><em><strong>, [Hadith] faisant l'unanimité.</strong></em></p>
<p>Et dans un autre hadith :</p>
<p class="ar"><span dir="rtl">«لَتُسَوُّنَّ صُفُوفَكُمْ أَوْ لَيُخَالِفَنَّ اللهُ بَيْنَ وُجُوهِكُمْ»</span></p>
<p><em><strong>« Alignez bien vos rangs, sinon Allah créera la discorde entre vos visages (vos cœurs) »</strong></em> <a href="#fn13" class="footnote-ref" id="fnref13" role="doc-noteref"><sup>13</sup></a><em><strong>.</strong></em></p>
<p>L'égalisation des rangs consiste à les rectifier en alignant les épaules et les chevilles.</p>
<p>Il incombe aux fidèles de combler les espaces vides et de se serrer dans les rangs, conformément à la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«أَقِيمُوا صُفُوفَكُمْ وَتَرَاصُّوا»</span></p>
<p><em><strong>« Alignez vos rangs et serrez-vous »</strong></em> <a href="#fn14" class="footnote-ref" id="fnref14" role="doc-noteref"><sup>14</sup></a><em><strong>.</strong></em></p>
<p>Cela signifie : joignez les rangs pour qu’il n’y ait plus d’espaces entre vous. Le fait de se serrer (<em>al-murâssah</em>) consiste à ce que les fidèles se collent les uns aux autres afin d’établir une continuité entre eux et de combler les brèches, pour ne laisser aucun espace au Diable.</p>
<p>Le Prophète <span dir="rtl">ﷺ</span> accordait une importance extrême à l’alignement des rangs et au fait que les fidèles y soient serrés, ce qui prouve l’importance et l’utilité de cette pratique. Cependant, se serrer dans les rangs ne signifie pas ce que font certains ignorants aujourd’hui, en écartant exagérément les jambes au point de gêner leurs voisins ; car cet acte crée [au contraire] des vides dans les rangs <a href="#fn15" class="footnote-ref" id="fnref15" role="doc-noteref"><sup>15</sup></a>, indispose les autres fidèles et n’a aucun fondement dans la Loi religieuse (<em>Charî'ah</em>). Il convient donc aux musulmans d'accorder de l'importance à cela et d'y veiller, par imitation de leur Prophète et pour parfaire leur prière.</p>
