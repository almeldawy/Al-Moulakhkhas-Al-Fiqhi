<p>Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿ هُوَ الَّذِي جَعَلَ الشَّمْسَ ضِيَاءً وَالْقَمَرَ نُورًا وَقَدَّرَهُ مَنَازِلَ لِتَعْلَمُوا عَدَدَ السِّنِينَ وَالْحِسَابَ ۚ مَا خَلَقَ اللَّهُ ذَٰلِكَ إِلَّا بِالْحَقِّ ۚ يُفَصِّلُ الْآيَاتِ لِقَوْمٍ يَعْلَمُونَ ﴾ [يونس : ٥] .</span></p>
<p>« <em><strong>C'est Lui qui a fait du soleil une clarté et de la lune une lumière, et Il en a déterminé les phases afin que vous sachiez le nombre des années et le calcul (du temps). Allah n'a créé cela qu'en toute vérité. Il expose ainsi les signes pour les gens doués de savoir.</strong></em> » [Yûnus : 5]</p>
<p>Et Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿ وَمِنْ آيَاتِهِ اللَّيْلُ وَالنَّهَارُ وَالشَّمْسُ وَالْقَمَرُ ۚ لَا تَسْجُدُوا لِلشَّمْسِ وَلَا لِلْقَمَرِ وَاسْجُدُوا لِلَّهِ الَّذِي خَلَقَهُنَّ إِن كُنتُمْ إِيَّاهُ تَعْبُدُونَ ﴾ [فصلت : ٣٧] .</span></p>
<p>« <em><strong>Parmi Ses signes, il y a la nuit et le jour, le soleil et la lune. Ne vous prosternez ni devant le soleil ni devant la lune، mais prosternez-vous devant Allah qui les a créés، si c'est Lui que vous adorez.</strong></em> » [Foussilat : 37]</p>
<p>⁕ La prière de l'éclipse est une Sunna confirmée (Mu'akkada) selon l'unanimité des savants. Sa preuve réside dans la Sunna authentique rapportée du Messager d'Allah <span dir="rtl">ﷺ</span>.</p>
<p>⁕ L'éclipse est l'un des signes d'Allah par lequel Il inspire la crainte à Ses serviteurs. Le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿ وَمَا نُرْسِلُ بِالْآيَاتِ إِلَّا تَخْوِيفًا ﴾ [الإسراء : ٥٩]</span></p>
<p>« <em><strong>Nous n'envoyons des signes qu'à titre de menace (pour avertir et effrayer).</strong></em> » [Al-Isrâ : 59]</p>
<p>⁕ Lorsque le soleil s'est éclipsé à l'époque du Messager d'Allah <span dir="rtl">ﷺ</span>, il se précipita vers la mosquée, avec crainte, en laissant traîner son manteau [sous l'effet de la précipitation]. Il dirigea alors la prière pour les gens et les informa que l'éclipse est l'un des signes d'Allah par lequel Il effraie Ses serviteurs. Il précisa qu'elle peut être la cause de la descente d'un châtiment sur les gens et ordonna ce qui permet de le dissiper : il commanda ainsi de prier lors de son apparition, d'invoquer, de demander pardon (Istighfar), de donner l'aumône, de libérer des esclaves et d'accomplir d'autres bonnes œuvres jusqu'à ce que l'éclipse se dissipe. L'éclipse est donc un avertissement pour les hommes et une source de crainte afin qu'ils reviennent vers Allah et qu'ils se sentent sous Sa surveillance.</p>
<p>À l'époque de la Jâhiliyyah (l'ère pré-islamique), les gens croyaient que l'éclipse ne se produisait qu'à la naissance ou à la mort d'une personne importante. Le Messager d'Allah <span dir="rtl">ﷺ</span> a invalidé cette croyance et a expliqué la sagesse divine derrière la survenue de l'éclipse.</p>
<p>En effet, Al-Bukhârî et Muslim ont rapporté<a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a>, selon le hadith d'Abû Mas'ûd al-Ansârî, qu'il a dit : « Le soleil s'est éclipsé le jour de la mort d'Ibrahim, le fils du Prophète <span dir="rtl">ﷺ</span>. Les gens dirent alors : "Le soleil s'est éclipsé à cause de la mort d'Ibrahim". Le Messager d'Allah <span dir="rtl">ﷺ</span> dit alors :</p>
<p class="ar"><span dir="rtl">«إِنَّ الشَّمْسَ وَالقَمَرَ آيَتَانِ مِنْ آيَاتِ اللهِ، لَا يَنْكَسِفَانِ لِمَوْتِ أَحَدٍ وَلَا لِحَيَاتِهِ، فَإِذَا رَأَيْتُمْ ذَلِكَ؛ فَافْزَعُوا إِلَى ذِكْرِ اللهِ وَإِلَى الصَّلَاةِ».</span></p>
<p><strong>"<em>Certes, le soleil et la lune sont deux signes parmi les signes d'Allah. Ils ne s'éclipsent ni pour la mort de quelqu'un, ni pour sa naissance. Si donc vous voyez cela, empressez-vous d'évoquer Allah et d'accomplir la prière.</em>"</strong> »</p>
<p>Dans un autre hadith présent dans les deux recueils authentiques (<em>Al-Bukhârî et Muslim</em>) :</p>
<p class="ar"><strong><span dir="rtl">«فَادْعُوا اللهَ وَصَلُّوا حَتَّى يَنْجَلِيَ».</span></strong></p>
<p><strong>« <em>Invoquez donc Allah et priez jusqu'à ce qu'elle [l'éclipse] se dissipe.</em> »</strong><a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a></p>
<p>Et dans le <em>Sahîh al-Bukhârî</em>, d'après Abû Mûsâ [al-Ash'arî], il a dit :</p>
<p class="ar"><strong><span dir="rtl">«هَذِهِ الآيَاتُ الَّتِي يُرْسِلُ اللهُ لَا تَكُونُ لِمَوْتِ أَحَدٍ وَلَا لِحَيَاتِهِ، وَلَكِنَّ اللهَ يُخَوِّفُ بِهَا عِبَادَهُ، فَإِذَا رَأَيْتُمْ شَيْئاً مِنْ ذَلِكَ؛ فَافْزَعُوا إِلَى ذِكْرِ اللهِ وَدُعَائِهِ وَاسْتِغْفَارِهِ»</span></strong></p>
<p><strong>« Ces signes qu'Allah envoie ne surviennent pas pour la mort ou la naissance de quiconque, mais Allah effraie Ses serviteurs par eux. Si donc vous voyez quoi que ce soit de cela, empressez-vous avec ferveur d'évoquer Allah, de L'invoquer et de Lui demander pardon. »</strong><a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a></p>
<p>Allah le Très-Haut fait donc subir à ces deux signes immenses que sont le soleil et la lune l'éclipse totale (<em>Kousouf</em>) ou partielle (<em>Khousouf</em>), afin que les serviteurs en tirent une leçon et sachent qu'ils sont deux créatures sujettes à la diminution et au changement, à l'instar des autres créatures. Par cela, Il démontre à Ses serviteurs Sa puissance absolue et le fait qu'Il est le Seul à mériter l'adoration, comme le Très-Haut l'a dit :</p>
<p class="ar"><span dir="rtl">﴿ وَمِنْ آيَاتِهِ اللَّيْلُ وَالنَّهَارُ وَالشَّمْسُ وَالْقَمَرُ ۚ لَا تَسْجُدُوا لِلشَّمْسِ وَلَا لِلْقَمَرِ وَاسْجُدُوا لِلَّهِ الَّذِي خَلَقَهُنَّ إِن كُنتُمْ إِيَّاهُ تَعْبُدُونَ ﴾ [فصلت : ٣٧] .</span></p>
<p><strong>« <em>Parmi Ses signes, il y a la nuit et le jour, le soleil et la lune. Ne vous prosternez ni devant le soleil ni devant la lune, mais prosternez-vous devant Allah qui les a créés, si c'est Lui que vous adorez.</em> »</strong> [Foussilat : 37]</p>
<p>⁕ Le moment (horaire) de la prière de l'éclipse s'étend du début de l'éclipse jusqu'à sa dissipation totale (lorsque l'astre retrouve son éclat), car le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="ltr">«</span><strong><span dir="rtl">فَإِذَا رَأَيْتُمْ مِنْهَا شَيْئاً؛ فَصَلُّوا</span></strong><span dir="ltr">»</span></p>
<p>« <em><strong>Si vous en voyez quoi que ce soit, alors priez.</strong></em> » (Unanimement reconnu authentique).<a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a></p>
<p>[Et dans] un autre hadith :</p>
<p class="ar"><span dir="ltr">«</span><strong><span dir="rtl">وَإِذَا رَأَيْتُمْ شَيْئاً مِنْ ذَلِكَ؛ فَصَلُّوا حَتَّى يَنْجَلِيَ</span></strong><span dir="ltr">»</span></p>
<p>« <em><strong>Et si vous voyez quoi que ce soit de cela, alors priez jusqu'à ce qu'elle [l'éclipse] se dissipe.</strong></em> », rapporté par Muslim.<a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a></p>
<p>⁕ La prière de l'éclipse ne se rattrape pas après la dissipation [de l'éclipse], car son moment légal est passé. Ainsi, si l'éclipse se dissipe avant même que les gens n'en aient eu connaissance, ils ne prient pas pour elle.</p>
<p>⁕ La description de la prière de l’éclipse consiste à prier deux unités de prière (rak'ât) en récitant à voix haute, selon l’avis le plus correct des deux opinions des savants. Dans la première rak'ah, il récite la Fatiha puis une longue sourate, comme la sourate Al-Baqarah ou d’une longueur équivalente. Ensuite, il s’incline d’une inclinaison (roukoû') prolongée. Puis, il relève la tête en disant :</p>
<p class="ar"><span dir="rtl">«سَمِعَ اللهُ لِمَنْ حَمِدَهُ، رَبَّنَا لَكَ الحمدُ»</span></p>
<p>"Sami'a Allahou liman hamidah, Rabbanâ laka-l-hamd" (Allah a entendu celui qui L'a loué, notre Seigneur, à Toi la louange) après s'être redressé comme pour les autres prières.</p>
<p>Ensuite, il récite à nouveau la Fatiha et une longue sourate, mais moins longue que la première, de la durée de la sourate Âl 'Imrân. Puis, il s'incline à nouveau longuement, d’une durée moindre que la première inclinaison. Il relève ensuite la tête en disant :</p>
<p class="ar"><span dir="rtl">«سَمِعَ اللهُ لِمَنْ حَمِدَهُ، رَبَّنَا ولكَ الحمدُ حمداً كثيراً طيباً مباركاً فيه، ملء السماءِ وملء الأرضِ وملء ما شئتَ من شيءٍ بعدُ»</span></p>
<p>"Sami'a Allahou liman hamidah, Rabbanâ wa laka-l-hamd, hamdan kathîran tayyiban moubârakan fîh, mil'a-s-samâ'i wa mil'a-l-ardi wa mil'a mâ chi'ta min chay'in ba'd" (Allah a entendu celui qui L'a loué, notre Seigneur, à Toi la louange, une louange abondante, pure et bénie, remplissant les cieux, remplissant la terre et remplissant tout ce que Tu voudras d'autre après cela).</p>
<p>Puis, il se prosterne pour deux longues prosternations, sans prolonger l’assise entre les deux. Ensuite, il accomplit la seconde rak'ah comme la première, avec deux inclinaisons prolongées et deux prosternations prolongées, exactement comme il l’a fait dans la première rak'ah. Enfin, il récite le Tashahhoud et salue.</p>
<p>Telle est la description de la prière de l'éclipse, conformément à ce qu'a fait le Messager d'Allah <span dir="rtl">ﷺ</span> et tel que cela a été rapporté de lui par plusieurs voies, dont certaines figurent dans les deux recueils authentiques (Al-Boukhârî et Mouslim). Parmi celles-ci, ce qu'a rapporté 'Âïcha (qu'Allah l'agrée) :</p>
<p>"<em><strong>Le soleil s'est éclipsé à l'époque du Messager d'Allah <span dir="rtl">ﷺ</span>. Le Messager d'Allah <span dir="rtl">ﷺ</span> sortit alors, se tint debout et prononça le Takbîr, et les gens se rangèrent derrière lui. Le Messager d'Allah <span dir="rtl">ﷺ</span> fit une longue récitation, puis il s'inclina longuement. Ensuite, il releva la tête et dit : 'Sami'a Allahou liman hamidah, Rabbanâ wa laka-l-hamd'. Puis il resta debout et fit une longue récitation, mais moindre que la première. Ensuite, il prononça le Takbîr et s'inclina longuement, mais d'une durée moindre que la première inclinaison. Puis il dit : 'Sami'a Allahou liman hamidah, Rabbanâ wa laka-l-hamd'. Puis il se prosterna. Il fit ensuite la même chose dans la seconde unité de prière, jusqu'à totaliser quatre inclinaisons et quatre prosternations. Le soleil s'était dégagé avant qu'il ne termine la prière.</strong></em>" Rapporté par Al-Boukhârî et Mouslim.<a href="#fn6" class="footnote-ref" id="fnref6" role="doc-noteref"><sup>6</sup></a></p>
<p>⁕ Et il est recommandé (<em>Sunna</em>) de la prier en <strong>groupe</strong>, conformément à la pratique du Prophète <span dir="rtl">ﷺ</span>. Il est toutefois permis de la prier <strong>individuellement</strong>, comme les autres prières surérogatoires (<em>nawâfil</em>), mais l'accomplir en groupe est préférable.</p>
<p>⁕ Et il est recommandé (<em>Sunna</em>) que l'imam exhorte les gens après la prière de l'éclipse, qu'il les mette en garde contre l'insouciance et l'illusion (face aux plaisirs mondains), et qu'il leur ordonne de multiplier les invocations et les demandes de pardon (<em>Istighfâr</em>).</p>
<p>En effet, il est rapporté dans le "Sahîh" d'après 'Âïcha (qu'Allah l'agrée) que le Prophète <span dir="rtl">ﷺ</span> termina la prière alors que le soleil s'était dégagé. Il fit alors un discours aux gens, loua Allah et fit Son éloge, puis dit :</p>
<p>"<em><strong>Le soleil et la lune sont deux signes parmi les signes d'Allah ; ils ne s'éclipsent ni pour la mort de quelqu'un, ni pour sa naissance. Par conséquent, si vous voyez cela, invoquez Allah, priez et donnez l'aumône...</strong></em>" (jusqu'à la fin du hadith).<a href="#fn7" class="footnote-ref" id="fnref7" role="doc-noteref"><sup>7</sup></a></p>
<p>⁕ Si la prière se termine avant que l'éclipse ne soit dissipée, on doit invoquer Allah et Le mentionner (<em>dhikr</em>) jusqu'à ce qu'elle se dissipe, mais on ne recommence pas la prière.</p>
<p>En revanche, si l'éclipse se termine alors que l'on est encore en train de prier, on achève la prière de manière allégée (plus courte) sans l'interrompre, conformément à la parole du Très-Haut :</p>
<p class="ar"><strong><span dir="rtl">﴿وَلَا تُبْطِلُوا أَعْمَالَكُمْ﴾ [محمد: ٣٣]</span></strong></p>
<p><strong>"<em>Et ne rendez pas vaines vos œuvres</em>"</strong> [Sourate Muhammad : 33].</p>
<p>La prière doit en effet coïncider avec la durée de l'éclipse, selon les paroles du Prophète <span dir="rtl">ﷺ</span> : "<em><strong>Jusqu'à ce qu'elle se dissipe</strong></em>"<a href="#fn8" class="footnote-ref" id="fnref8" role="doc-noteref"><sup>8</sup></a> et "<em><strong>Jusqu'à ce que ce qui vous arrive soit levé</strong></em>".<a href="#fn9" class="footnote-ref" id="fnref9" role="doc-noteref"><sup>9</sup></a></p>
<p>Sheikh al-Islam Ibn Taymiyya a dit : "<em>L'éclipse dure parfois longtemps et parfois peu de temps, selon l'ampleur de l'occultation ; elle peut être totale, ou seulement de moitié, ou d'un tiers. Si l'éclipse est importante, on prolonge la prière au point de réciter la sourate Al-Baqarah (ou l'équivalent) dans la première inclinaison, et après le second redressement, on récite moins que cela.</em></p>
<p><em>Les hadiths authentiques rapportés du Prophète <span dir="rtl">ﷺ</span> confirment ce que nous avons mentionné. Il est prescrit d'alléger la prière si la cause (l'éclipse) disparaît. De même, si l'on sait que l'éclipse ne durera pas longtemps, ou si elle commence à s'estomper avant même de débuter la prière, on l'entreprend tout de même mais de manière brève. C'est l'avis de la majorité des savants, car cette prière a été instituée pour une cause précise. Si cette cause disparaît [totalement] avant de commencer, alors on ne prie pas.</em>” Fin de citation.<a href="#fn10" class="footnote-ref" id="fnref10" role="doc-noteref"><sup>10</sup></a></p>
