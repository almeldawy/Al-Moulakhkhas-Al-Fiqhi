<p><strong>L'avis prépondérant</strong> parmi les deux avis des savants est que celui qui est en retard (Al-Masbûq) n'atteint pas la prière en groupe sauf s'il parvient à accomplir une unité de prière (Rak'ah) complète. S'il parvient à accomplir moins que cela, il n'est pas considéré comme ayant atteint le groupe. Cependant, il doit rejoindre l'imam dans l'état où il le trouve, et il obtiendra par son intention la récompense du groupe. C'est comme s'il trouvait les gens ayant déjà terminé la prière : il obtient alors, grâce à son intention, la récompense de celui qui a prié en groupe. Comme cela est rapporté dans les hadiths : celui qui a l'intention de faire un bien mais n'est pas en mesure de l'accomplir, il lui est inscrit une récompense semblable à celui qui l'a fait.</p>
<p><strong>L'unité de prière (Rak'ah) est considérée comme accomplie si l'on rattrape l'inclinaison (Rukû')</strong>, selon l'avis authentique, conformément à la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><strong><span dir="rtl">«مَنْ أَدْرَكَ الركوعَ؛ فقد أَدْرَكَ الركعة»</span></strong></p>
<p>« <em><strong>Celui qui rattrape l'inclinaison a certes rattrapé la Rak'ah</strong></em> » (Rapporté par Abu Daoud) (1).</p>
<p>Cela est également appuyé par le hadith d'Abu Bakrah présent dans le <em>Sahih</em> : il était arrivé alors que le Prophète <span dir="rtl">ﷺ</span> était en inclinaison, il s'est donc incliné avant de rejoindre le rang, et le Prophète <span dir="rtl">ﷺ</span> ne lui a pas ordonné de recommencer cette Rak'ah (2). Cela prouve donc qu'elle est valide et suffisante.</p>
<p>Ainsi, si quelqu'un rejoint l'imam alors que ce dernier est en inclinaison :</p>
<ul>
<li><blockquote>
<p>Il doit prononcer le <strong>Takbir d'entrée en sacralisation (Takbirat al-Ihram) tout en étant debout</strong>.</p>
</blockquote></li>
<li><blockquote>
<p>Puis, il s'incline avec l'imam en prononçant un <strong>deuxième Takbir</strong> (pour l'inclinaison) ; ceci est la meilleure façon de faire.</p>
</blockquote></li>
<li><blockquote>
<p>S'il se contente uniquement du Takbir d'entrée en sacralisation, cela suffit et remplace le Takbir de l'inclinaison.</p>
</blockquote></li>
</ul>
<p><strong>Lorsque celui qui est en retard (Al-Masbûq) trouve l'imam dans n'importe quel état de la prière, il doit le rejoindre immédiatement.</strong> Ceci se base sur le hadith d'Abu Hurayrah (et d'autres) :</p>
<p class="ar"><strong><span dir="rtl">«إِذَا جِئْتُم إِلَى الصَّلَاةِ، وَنَحْنُ سُجُودٌ؛ فَاسْجُدُوا، وَلَا تَعُدُّوهَا شَيْئاً».</span></strong></p>
<p>« <em><strong>Si vous venez à la prière alors que nous sommes en prosternation, prosternez-vous, mais ne comptez pas cela comme une unité de prière (Rak'ah) accomplie.</strong></em> » (3)</p>
<p><strong>Une fois que l'imam a effectué la deuxième salutation (Taslim), celui qui est en retard se lève pour accomplir ce qu'il a manqué de la prière.</strong> Il ne doit pas se lever avant la fin de la deuxième salutation de l'imam.</p>
<p><strong>Ce que le fidèle rattrape avec son imam constitue le début de sa propre prière</strong>, selon l'avis authentique. Ce qu'il accomplit seul après le salut de l'imam constitue donc la fin de sa prière. Ceci se base sur la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><strong><span dir="rtl">«وَمَا فَاتَكُمْ؛ فَأَتِمُّوا»</span></strong></p>
<p>« <em><strong>Et ce que vous avez manqué, complétez-le (fa-atimmû)</strong></em> ». (4)</p>
<p>C'est l'avis de la majorité des savants en raison de ce hadith, car le fait de "<em><strong>compléter</strong></em>" une chose ne survient qu'après en avoir déjà accompli le début.</p>
<p>Quant à la version du hadith qui dit :</p>
<p class="ar"><strong><span dir="rtl">«وَمَا فَاتَكُمْ؛ فَاقْضُوا»</span></strong></p>
<p>« <em><strong>Et ce que vous avez manqué, rattrapez-le (fa-qdû)</strong></em> », elle ne contredit pas la version « <em><strong>complétez-le</strong></em> ». En effet, le terme "Qada" (souvent traduit par rattraper) peut signifier ici "l'accomplissement" ou "l'exécution"(5), comme dans les versets du Coran :</p>
<blockquote>
<p class="ar"><strong><span dir="rtl">﴿فَإِذَا قُضِيَتِ الصَّلَوةُ﴾ [الجمعة: ١٠]</span></strong></p>
</blockquote>
<p><em>« <strong>Puis quand la prière est achevée (qudiyat)...</strong> »</em> [Al-Jumu'ah : 10]</p>
<p class="ar"><strong><span dir="rtl">﴿فَإِذَا قَضَيْتُمْ مَّنَاسِكَكُمْ﴾ [البقرة: ٢٠٠]</span></strong></p>
<p><em>« <strong>Et quand vous avez achevé (qadaytum) vos rites...</strong> »</em> [Al-Baqarah : 200]</p>
<p>Ainsi, sa parole « <em><strong>rattrapez-le</strong></em> » doit être comprise dans le sens d'accomplir la tâche jusqu'à son terme. Et Dieu est Le plus Savant.</p>
<p><strong>Lorsque la prière est effectuée à voix haute (<em>jahriyya</em>), il est obligatoire pour celui qui suit l'imam (le <em>ma'mûm</em>) d'écouter sa récitation.</strong> Il ne lui est pas permis de réciter pendant que l'imam récite, que ce soit la sourate Al-Fatiha ou une autre, conformément à la parole du Très-Haut :</p>
<p class="ar"><strong><span dir="rtl">﴿وَإِذَا قُرِئَ الْقُرْءَانُ فَاسْتَمِعُوا لَهُ وَأَنصِتُوا لَعَلَّكُمْ تُرْحَمُونَ﴾ [الأعراف: ٢٠٤]</span></strong></p>
<p><em>« <strong>Et quand on récite le Coran, écoutez-le attentivement et faites silence, afin que vous obteniez la miséricorde</strong> »</em> [Al-A'raf : 204].</p>
<p>L'imam Ahmad (qu'Allah lui fasse miséricorde) a dit : « <em><strong>Ils [les savants] sont unanimes sur le fait que ce verset concerne la prière.</strong></em> »</p>
<p>Si la récitation était obligatoire pour celui qui suit l'imam [dans ces circonstances], on ne lui aurait pas ordonné de la délaisser au profit de la tradition (<em>Sunna</em>) de l'écoute. De plus, si le fidèle était occupé par sa propre récitation, la récitation à voix haute de l'imam n'aurait plus d'utilité. Enfin, le fait que le fidèle dise "Amine" après la récitation de l'imam équivaut à sa propre récitation. À ce sujet, le Très-Haut a dit à Moïse et Aaron :</p>
<p class="ar"><strong><span dir="rtl">﴿قَدْ أُجِيبَت دَّعْوَتُكُمَا﴾ [يونس: ٨٩]</span></strong></p>
<p><strong>« <em>Ta prière est exaucée</em> »</strong> [Yunus : 89] (littéralement : <em>votre prière à tous les deux</em>).</p>
<p>Pourtant, c'est Moïse qui avait formulé l'invocation en disant :</p>
<p class="ar"><strong><span dir="rtl">﴿رَبَّنَا إِنَّكَ ءَاتَيْتَ فِرْعَوْنَ وَمَلَأَهُ زِينَةً وَأَمْوَلاً فِي الْحَيَوةِ الدُّنْيَا﴾ الآية [يونس: ٨٨]</span></strong></p>
<p><em>« <strong>Ô notre Seigneur, Tu as donné à Pharaon et ses notables des parures et des biens dans la vie présente...</strong> »</em> [Yunus : 88].</p>
<p>Aaron, quant à lui, s'était contenté de dire "<em><strong>Amine</strong></em>" à cette invocation.</p>
<p>Ainsi, son "<em><strong>Amine</strong></em>" a été placé au même rang que celui qui invoque. C'est pour cela que le Très-Haut a dit :</p>
<p class="ar"><strong><span dir="rtl">﴿قَدْ أُجِيبَت دَّعْوَتُكُمَا﴾</span></strong></p>
<p><strong>« <em>Votre prière à tous les deux est exaucée</em> »</strong>.</p>
<p>Cela prouve que celui qui dit "Amine" à une invocation est considéré comme s'il l'avait lui-même prononcée.</p>
<p><strong>Quant à la prière silencieuse (<em>sirriyya</em>)</strong>, ou si le fidèle n'entend pas l'imam, il doit dans ce cas réciter la Fatiha. C'est ainsi que l'on concilie les preuves : l'obligation pour le fidèle de réciter la Fatiha s'applique aux prières silencieuses, mais pas aux prières à voix haute. Et Dieu est Le plus Savant.</p>
<p><strong>Parmi les règles importantes de la prière en groupe : l'obligation pour le fidèle de suivre l'imam par une imitation parfaite</strong>, et l'interdiction de le devancer. En effet, le fidèle suit son imam et prend exemple sur lui ; or, celui qui suit ne doit pas précéder celui qu'il suit.</p>
<p>Le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><strong><span dir="rtl">«أَمَا يَخْشَى أَحَدُكُمْ إِذَا رَفَعَ رَأْسَهُ قَبْلَ الإِمَامِ أَنْ يُحَوِّلَ اللهُ رَأْسَهُ رَأْسَ حِمَارٍ، أَوْ يَجْعَلَ صُورَتَهُ صُورَةَ حِمَارٍ؟!» مُتَّفَقٌ عَلَيْهِ</span></strong></p>
<p>« <em><strong>L'un d'entre vous ne craint-il pas, lorsqu'il lève la tête avant l'imam, qu'Allah ne transforme sa tête en tête d'âne ou ne lui donne l'apparence d'un âne ?</strong></em> » (Rapporté par Al-Bukhari et Muslim). (6)</p>
<p>Celui qui devance son imam est semblable à l'âne qui ne comprend pas le sens de ses actes, et celui qui agit ainsi mérite une sanction.</p>
<p>Dans le hadith authentique :</p>
<p class="ar"><strong><span dir="rtl">«إِنَّمَا جُعِلَ الإِمَامُ لِيُؤْتَمَّ بِهِ؛ فَلَا تَرْكَعُوا حَتَّى يَرْكَعَ، وَلَا تَسْجُدُوا حَتَّى يَسْجُدَ»</span></strong></p>
<p>« <em><strong>L'imam n'a été instauré que pour être suivi ; ne vous inclinez donc pas tant qu'il ne s'est pas incliné, et ne vous prosternez pas tant qu'il ne s'est pas prosterné.</strong></em> » (7)</p>
<p>L'imam Ahmad et Abu Daoud ont rapporté :</p>
<p class="ar"><strong><span dir="rtl">«إِنَّمَا جُعِلَ الإِمَامُ لِيُؤْتَمَّ بِهِ، فَإِذَا رَكَعَ؛ فَارْكَعُوا، وَلَا تَرْكَعُوا حَتَّى يَرْكَعَ، وَإِذَا سَجَدَ؛ فَاسْجُدُوا، وَلَا تَسْجُدُوا حَتَّى يَسْجُدَ»</span></strong></p>
<p>« <em><strong>L'imam n'a été instauré que pour être suivi. S'il s'incline, inclinez-vous, et ne vous inclinez pas tant qu'il ne s'est pas incliné. S'il se prosterne, prosternez-vous, et ne vous prosternez pas tant qu'il ne s'est pas prosterné.</strong></em> » (8)</p>
<p>Les Compagnons, derrière le Prophète <span dir="rtl">ﷺ</span>, ne courbaient le dos que lorsque le Messager d'Allah <span dir="rtl">ﷺ</span> était déjà en position de prosternation ; ce n'est qu'ensuite qu'ils se prosternaient après lui. (9)</p>
<p>Lorsque 'Umar (qu'Allah l'agrée) vit un homme devancer l'imam [dans ses mouvements], il le frappa et lui dit :</p>
<p class="ar"><strong><span dir="rtl">«لَا وَحْدَكَ صَلَّيْتَ، وَلَا بِإِمَامِكَ اقْتَدَيْتَ»</span></strong></p>
<p>« <em><strong>Tu n'as ni prié seul, ni suivi ton imam.</strong></em> »</p>
<p>C'est une chose que certains prieurs négligent ou ignorent ؛ ils devancent l'imam et s'exposent ainsi à une menace sévère، et l'on craint même que leur prière ne soit pas valide.</p>
<p>Muslim a rapporté d'après le Prophète <span dir="rtl">ﷺ</span> qu'il a dit :</p>
<p class="ar"><strong><span dir="rtl">«لَا تَسْبِقُونِي بِالرُّكُوعِ وَلَا بِالسُّجُودِ وَلَا بِالِانْصِرَافِ»</span></strong></p>
<p>« <em><strong>Ne me devancez pas dans l'inclinaison, ni dans la prosternation, ni dans la fin de la prière (le salut).</strong></em> » (10)</p>
<p>Cheikh al-Islâm Ibn Taymiyya a dit : « <em><strong>Devancer l'imam est interdit (harâm) selon l'accord unanime des imams. Il n'est permis à personne de s'incliner avant son imam, ni de se relever avant lui, ni de se prosterner avant lui. Les hadiths du Prophète <span dir="rtl">ﷺ</span> interdisant cela sont d'ailleurs très nombreux.</strong></em> » (11)</p>
<p>Le fait de devancer l'imam est un jeu du Diable avec certains prieurs afin de corrompre leur prière. Autrement، quel profit tire celui qui devance l'imam ؟ Puisqu'il ne sortira de toute façon de la prière qu'après le salut de l'imam ?!</p>
<p>Le musulman doit donc être attentif à cela et s'attacher scrupuleusement aux règles de l'imitation (<em>al-i'timâm</em>) et du suivi.</p>
<p>Nous demandons à Allah pour tous la compréhension de Sa religion et la clairvoyance dans Ses règles. Certes, Il est Celui qui entend tout et qui exauce les invocations. Car celui à qui Allah veut du bien, Il lui accorde la compréhension de la religion.</p>
<h4 id="sources"><strong>Sources:</strong> </h4>
<p>(1) [Cette citation] n'a pas de source avec ces termes exacts. La formulation présente dans le « Sahih Muslim » (607) est : « Quiconque rattrape une unité de prière (Rak'ah) de la prière [avec l'imam] a certes rattrapé la prière ». Cette version existe sans l'ajout [avec l'imam] chez Abu Daoud (1121).</p>
<p>(2) Voir : Al-Bukhari (783).</p>
<p>(3) Rapporté par Abu Daoud (893), Ibn Khuzaymah (1622), et Al-Hakim (1/336) qui a dit : [ce hadith est] authentique !</p>
<p>(4) Rapporté par Al-Bukhari (636) et Muslim (602). Quant à la version utilisant le terme « Rattrapez » (fa-qdû), elle est rapportée par Ibn al-Jarud (305), Ibn Khuzaymah (1065 et 1505) et Ibn Hibban (2145).</p>
<p>(5) C'est-à-dire : l'achèvement et la finalisation de l'acte.</p>

<p>(8) Rapporté par Abu Daoud (603) et l'Imam Ahmad (2/341).</p>
