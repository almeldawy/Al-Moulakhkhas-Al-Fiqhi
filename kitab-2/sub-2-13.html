<p>Commençons à présent par traiter de la prière du <strong>Witr</strong> en raison de son importance. En effet, il a été dit qu'elle est l'acte surérogatoire le plus recommandé (<em>âkad</em>). Certains savants ont même été d'avis qu'elle est obligatoire (<em>Wâjib</em>). Or, ce dont l'obligation fait l'objet d'une divergence est plus souligné que ce dont la non-obligation fait l'unanimité.</p>
<p><strong>*</strong> Les musulmans s'accordent sur la légitimité du Witr ; il ne convient donc pas de le délaisser. Quant à celui qui s'obstine à le délaisser, son témoignage doit être rejeté. L'imam Ahmad a dit : <strong>"<em>Celui qui délaisse le Witr volontairement est un homme de peu de vertu (un homme mauvais), dont le témoignage ne devrait pas être accepté.</em>"</strong> Ahmad et Abou Daoud ont rapporté (dans un hadith attribué au Prophète) :</p>
<p class="ar"><strong><span dir="rtl">«مَنْ لم يُوتِرْ؛ فليسَ مِنَّا»</span></strong></p>
<p><em><strong>"Celui qui ne prie pas le Witr n'est pas des nôtres" (1).</strong></em></p>
<p><strong>*</strong> Le terme <strong>Witr</strong> désigne :</p>
<ul>
<li><blockquote>
<p>La rak'ah (unité de prière) isolée de ce qui la précède.</p>
</blockquote></li>
<li><blockquote>
<p>L'ensemble des trois, cinq, sept, neuf ou onze rak'ât, <strong>si ces rak'ât sont enchaînées avec une seule salutation finale (<em>taslîm</em>)</strong>.</p>
</blockquote></li>
</ul>
<p>En revanche, si ces rak'ât sont accomplies avec deux salutations ou plus, alors le nom "Witr" s'applique uniquement à la rak'ah finale qui est isolée (séparée des autres).</p>
<p><strong>* Le temps du Witr</strong> commence après la prière de l'Icha (la dernière prière obligatoire de la nuit) et se prolonge jusqu'à l'aube (<em>Fajr</em>). Il est rapporté dans les deux recueils authentiques (<em>Al-Boukhari et Muslim</em>) d'après Aïcha (qu'Allah l'agrée) qu'elle a dit :</p>
<p class="ar"><strong><span dir="rtl">من كلِّ الليلِ أَوْتَرَ رسولُ الله ﷺ؛ من أولِهِ، وأَوْسَطِه، وآخِرِه، وانتهى وِتْرُهُ إلى السَّحَرِ</span></strong></p>
<p><em><strong>"À tous les moments de la nuit, le Messager d'Allah <span dir="rtl">ﷺ</span> a prié le Witr : au début, au milieu et à la fin. Finalement, son Witr se stabilisa vers la fin de la nuit (au moment du Sahar)." (2)</strong></em></p>
<p>De nombreux hadiths indiquent que toute la nuit est un moment propice pour le Witr, à l'exception de ce qui précède la prière de l'Icha.</p>
<ul>
<li><blockquote>
<p><strong>Pour celui qui est sûr de se réveiller</strong> à la fin de la nuit : il est préférable pour lui de retarder le Witr jusqu'à la fin de la nuit.</p>
</blockquote></li>
<li><blockquote>
<p><strong>Pour celui qui craint de ne pas se réveiller</strong> : il doit alors prier le Witr avant de s'endormir.</p>
</blockquote></li>
</ul>
<p>C'est ce qu'a recommandé le Prophète <span dir="rtl">ﷺ</span>. Muslim a rapporté d'après Jabir que le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><strong><span dir="rtl">«أيُّكُمْ خافَ ألَّا يقومَ من آخِرِ الليلِ؛ فَلْيُوتِرْ ثم لِيَرْقُدْ، ومَنْ وَثِقَ بقيامِه في آخِرِ الليلِ؛ فَلْيُوتِرْ مِنْ آخِرِهِ؛ فإن قراءةَ آخِرِ الليلِ مَشهودةٌ، وذلِكَ أَفْضَلُ»</span></strong></p>
<p><em><strong>"Celui d'entre vous qui craint de ne pas se lever à la fin de la nuit, qu'il prie le Witr puis qu'il dorme. Et celui qui a l'assurance de se lever à la fin de la nuit, qu'il prie le Witr à ce moment-là, car la récitation à la fin de la nuit bénéficie de la présence des anges, et cela est préférable." (3)</strong></em></p>
<p><strong>* Le minimum pour le Witr</strong> est d'une seule rak'ah, conformément aux hadiths à ce sujet et au fait que cela a été confirmé par dix des Compagnons (qu'Allah les agrée). Cependant, le mieux et le plus préférable est qu'elle soit précédée par le <em>Chaf'</em> (une paire de rak'ât).</p>
<p><strong>* Le maximum pour le Witr</strong> est de onze ou treize rak'ât.</p>
<p><strong>La première méthode (la meilleure) :</strong> Il les prie deux par deux, puis termine par une seule rak'ah pour conclure le Witr. D'après Aïcha (qu'Allah l'agrée) :</p>
<p class="ar"><strong><span dir="rtl">«كانَ رسولُ اللهِ ﷺ يصلي بالليلِ إحدى عشرةَ ركعةً، يُوتِرُ منها بواحدةٍ» وفي لفظٍ: «يُسَلِّمُ بينَ كُلِّ ركعتينِ ويُوتِرُ بواحدةٍ»</span></strong></p>
<p><em><strong>"Le Messager d'Allah <span dir="rtl">ﷺ</span> priait la nuit onze rak'ât, dont une servait de Witr." Rapporté par Muslim (4). Dans une autre version : "Il saluait (taslîm) entre chaque paire de rak'ât et terminait par une seule."</strong></em></p>
<p><strong>La deuxième méthode :</strong> Il peut les enchaîner (<em>yasrudahâ</em>) : il s'assoit après la dixième rak'ah pour le premier tashahhoud sans saluer, puis se lève pour la onzième, fait le dernier tashahhoud et salue.</p>
<p><strong>La troisième méthode :</strong> Il peut les enchaîner sans s'asseoir du tout, sauf après la onzième rak'ah pour le tashahhoud et la salutation. <strong>La première méthode reste la meilleure.</strong></p>
<p><strong>* Il peut aussi prier neuf rak'ât :</strong> il enchaîne les huit premières, s'assoit après la huitième pour faire le premier tashahhoud sans saluer, puis se lève pour la neuvième, fait le dernier tashahhoud et salue.</p>
<p><strong>* Et il lui est possible</strong> d'accomplir le Witr en sept unités de prière ou en cinq unités de prière، sans s'asseoir qu'à la dernière d'entre elles، où il récitera alors le Tashahhoud et effectuera la salutation finale (le Taslîm) ؛ et ceci conformément à la parole d'Oumm Salama (qu'Allah l'agrée) :</p>
<p class="ar"><strong><span dir="rtl">«كَانَ رَسُولُ اللَّهِ ﷺ يُوتِرُ بِسَبْعٍ وَبِخَمْسٍ لَا يَفْصِلُ بَيْنَهُنَّ بِسَلَامٍ وَلَا كَلَامٍ»</span></strong></p>
<p>« Le Messager d'Allah <span dir="rtl">ﷺ</span> accomplissait le Witr en sept et en cinq [unités] sans les séparer ni par une salutation ni par une parole »</p>
<p><strong>* Il est également possible</strong> d'accomplir le Witr en trois unités de prière : il prie deux unités, effectue la salutation finale (le Taslîm), puis prie la troisième unité seule. Il est recommandé de réciter dans la première : <strong>"Glorifie le nom de ton Seigneur, le Très-Haut"</strong> (Sourate Al-A'lâ), dans la deuxième : <strong>"Dis : Ô vous les infidèles"</strong> (Sourate Al-Kâfirûn), et dans la troisième : <strong>"Dis : Il est Allah, l'Unique"</strong> (Sourate Al-Ikhlâs)...</p>
<p>Il ressort de ce qui a été exposé que tu peux accomplir le Witr avec :</p>
<ul>
<li><blockquote>
<p>Onze unités, ou treize.</p>
</blockquote></li>
<li><blockquote>
<p>Neuf unités, ou sept, ou cinq, ou trois.</p>
</blockquote></li>
<li><blockquote>
<p>Ou même une seule unité.</p>
</blockquote></li>
</ul>
<p>Ainsi, la perfection maximale est de <strong>onze</strong> unités, la perfection minimale est de <strong>trois</strong> unités, et ce qui est suffisant (le minimum légal) est <strong>une seule</strong> unité.</p>
<p><strong>* Il est recommandé</strong> de faire le <strong>Qunût</strong> après l'inclinaison (<em>Rukû'</em>) dans le Witr ; en invoquant Allah — Gloire à Lui — en levant les mains, et en disant : <strong>"Ô Allah, guide-moi parmi ceux que Tu as guidés..."</strong> jusqu'à la fin de l'invocation transmise [par la tradition]*.</p>
