<h4 id="بسم-الله-الرحمن-الرحيم"><span dir="rtl">بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيم</span>ِ</h4>
<h4 id="au-nom-dallah-le-tout-miséricordieux-le-très-miséricordieux.">Au nom d'Allah, le Tout Miséricordieux, le Très Miséricordieux.</h4>
<p><strong>Chapitre sur l'obligation des cinq prières</strong></p>
<p>La prière est le pilier le plus essentiel de l'Islam après les deux témoignages de foi (la Chahada). Elle a été prescrite sous la forme la plus parfaite et la plus belle des adorations. Cette prière comprend de nombreux types d'actes d'adoration : le rappel d'Allah (dhikr), la récitation de Son Livre, la station debout devant Allah, l'inclinaison, la prosternation, l'invocation, la glorification (tasbih) et la proclamation de Sa grandeur (takbir). Elle est à la tête des adorations corporelles, et aucune législation apportée par un messager d'Allah n'en a été exempte.</p>
<p>Allah l'a imposée à Son Prophète Muhammad <span dir="rtl">ﷺ</span>, le sceau des messagers, lors de la nuit de l'Ascension (Al-Mi'raj) dans le ciel ، contrairement à toutes les autres prescriptions légales. Cela prouve son importance immense, le caractère impératif de son obligation et son rang élevé auprès d'Allah.</p>
<p>De nombreux hadiths ont été rapportés concernant ses mérites et son caractère obligatoire pour chaque individu. Son obligation fait partie des fondements de la religion de l'Islam connus par nécessité. Ainsi, quiconque renie son obligation a certes apostasié de la religion de l'Islam. On lui demande alors de se repentir ، s'il se repent (tant mieux) ، sinon il est exécuté selon le consensus des musulmans.</p>
<p><strong>Définition de la Prière:</strong></p>
<p><strong>_ Linguistiquement,</strong> la prière (As-Salat) signifie l'invocation (<strong>Ad-Du'a</strong>).</p>
<p>Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿وَصَلِّ عَلَيْهِمْ﴾ [التوبة: ١٠٣]</span></p>
<p><em>« <strong>Et prie pour eux</strong> »</em> [Sourate At-Tawbah : 103], c'est-à-dire : <strong>invoque en leur faveur.</strong></p>
<p><strong>_ Juridiquement (dans la Shari'a)</strong>, elle se définit comme <em><strong>un ensemble de paroles et d'actes spécifiques, commençant par le Takbir (dire "Allahou Akbar") et se terminant par le Taslim (la salutation finale)</strong></em>.</p>
<p>Elle a été nommée ainsi car elle contient l'invocation ; en effet, celui qui prie ne cesse d'être dans une invocation d'adoration, d'éloge ou de demande. C'est pour cette raison qu'elle est appelée "prière". Cinq prières par jour et par nuit ont été prescrites lors de la nuit du Voyage Nocturne (<em>Al-Isra</em>), avant l'Hégire. Elles deviennent obligatoires pour chaque musulman responsable (<em>moukallaf</em>) dès lors que leurs horaires respectifs commencent.</p>
<p>Le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿إِنَّ الصَّلَوةَ كَانَتْ عَلَى الْمُؤْمِنِينَ كِتَبًا مَّوْقُوتًا﴾ [النساء:١٠٣]</span></p>
<p>« <em><strong>La prière demeure, pour les croyants, une prescription à des temps déterminés.</strong></em> » [An-Nisa : 103].</p>
<p>C'est-à-dire : <em>une obligation à accomplir selon les horaires que le Messager d'Allah <span dir="rtl">ﷺ</span> a clarifiés par ses paroles et ses actes.</em></p>
<p>Le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿وَمَا أُمِرُوا إِلَّا لِيَعْبُدُوا اللَّهَ مُخْلِصِينَ لَهُ الدِّينَ حُنَفَاءَ وَيُقِيمُوا الصَّلَوٰةَ﴾ [البينة: ٥].</span></p>
<p>« <em><strong>Il ne leur a été commandé, cependant, que d'adorer Allah, Lui vouant un culte exclusif, d'accomplir la prière...</strong></em> » [Al-Bayyinah : 5].</p>
<p>Le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿وَأَقِيمُوا الصَّلَوةَ﴾ [البقرة: ٤٣].</span></p>
<p>« <em><strong>Et accomplissez la prière</strong></em> » [Al-Baqarah : 43],</p>
<p>et cela figure dans de nombreux passages de Son Noble Livre.</p>
<p></p>
<p>Le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿قُل لِّعِبَادِيَ الَّذِينَ ءَامَنُوا يُقِيمُوا الصَّلَوٰةَ﴾ [إبراهيم: ٣١].</span></p>
<p>« <em><strong>Dis à Mes serviteurs qui ont cru d'accomplir la prière.</strong></em> » [Ibrahim : 31].</p>
<p>Le Souverain a dit :</p>
<p class="ar"><span dir="rtl">﴿فَسُبْحَنَ اللَّهِ حِينَ تُمْسُونَ وَحِينَ تُصْبِحُونَ (١٧) وَلَهُ الْحَمْدُ فِي السَّمَوَاتِ وَالْأَرْضِ وَعَشِيًّا وَحِينَ تُظْهِرُونَ (١٨)﴾ [الروم].</span></p>
<p>« <em><strong>Glorifiez Allah donc, soir et matin ! À Lui la louange dans les cieux et la terre, encore au crépuscule et au moment de votre sieste (midi).</strong></em> » [Ar-Rum : 17-18].</p>
<p>Ainsi, quiconque voit l'heure de la prière arriver alors qu'il est pubère et jouit de sa raison, celle-ci devient pour lui une obligation. Sont exceptées la femme réglée (en période de menstrues) et l'accouchée (en période de lochies) ; elle ne leur est pas obligatoire et elles n'ont pas à la rattraper une fois purifiées, et ce, selon le consensus (des savants).</p>
<p>Quant à celui qui a perdu conscience par le sommeil, l'évanouissement ou autre cas similaire, il a l'obligation de rattraper la prière dès qu'il reprend ses esprits.</p>
<p>Le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿وَأَقِمِ الصَّلَوٰةَ لِذِكْرِي﴾ [طه: ١٤].</span></p>
<p>« <em><strong>Et accomplis la prière pour te souvenir de Moi.</strong></em> » [Taha : 14].</p>
<p>Le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="rtl">«مَن نَامَ عَن صَلَاةٍ أَوْ نَسِيَهَا؛ فَلْيُصَلِّهَا إِذَا ذَكَرَهَا»</span></p>
<p>« <em><strong>Quiconque oublie une prière ou s'endort sans l'avoir accomplie, qu'il la prie dès qu'il s'en rappelle.</strong></em> » (Rapporté par Muslim).<a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a></p>
<p><strong>L'éducation des enfants à la prière:</strong></p>
<p>Il incombe au tuteur de l'enfant de lui ordonner d'accomplir la prière dès l'âge de <strong>sept ans</strong>, bien qu'elle ne lui soit pas encore obligatoire. Cela a pour but qu'il y accorde de l'importance et qu'il s'y exerce (prenne l'habitude). De plus, la récompense est inscrite en faveur de l'enfant ainsi que de son tuteur lorsqu'il prie, conformément à la portée générale de la parole du Très-Haut :</p>
<p class="ar"><span dir="rtl">﴿مَن جَاءَ بِالْحَسَنَةِ فَلَهُ عَشْرُ أَمْثَالِهَا﴾ [الأنعام: ١٦٠]</span></p>
<p><em>« <strong>Quiconque viendra avec un bien aura dix fois son équivalent.</strong> »</em> [Al-An'am : 160].</p>
<p>Et selon la parole du Prophète <span dir="rtl">ﷺ</span> lorsqu'une femme lui présenta un jeune enfant en demandant : « <em><strong>Y a-t-il un pèlerinage (Hajj) pour celui-là ?</strong></em> », il répondit : <em>« <strong>Oui, et tu en auras la récompense</strong> »</em><a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a>. Ainsi, son tuteur doit lui enseigner la prière ainsi que les règles de purification (ablutions) nécessaires à celle-ci.</p>
<p>Il est du devoir du tuteur de corriger (frapper) l'enfant s'il néglige la prière alors qu'il a atteint l'âge de <strong>dix ans</strong> ; conformément à la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«مُرُوا أَبْنَاءَكُمْ بِالصَّلَاةِ وَهُمْ أَبْنَاءُ سَبْعِ سِنِينَ، وَاضْرِبُوهُمْ عَلَيْهَا لِعَشْرٍ، وَفَرِّقُوا بَيْنَهُمْ فِي الْمَضَاجِعِ»</span></p>
<p><em>« <strong>Ordonnez à vos enfants d'accomplir la prière dès l'âge de sept ans, et corrigez-les (si nécessaire) pour elle à dix ans, et séparez-les dans leurs lits.</strong> »</em> (Rapporté par Ahmad, Abou Daoud, Al-Tirmidhi et d'autres).<a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a></p>
<p><strong>L'interdiction de retarder la prière:</strong></p>
<p>Il n'est pas permis de retarder la prière au-delà de son temps.</p>
<h3 id="allah-le-très-haut-a-dit">Allah le Très-Haut a dit : </h3>
<h3 id="إن-الصلوة-كانت-على-المؤمنين-كتبا-موقوتا-النساء-١٠٣"><span dir="rtl">﴿إِنَّ الصَّلَوةَ كَانَتْ عَلَى الْمُؤْمِنِينَ كِتَبًا مَّوْقُوتًا﴾ [النساء: ١٠٣]</span></h3>
<h3 id="la-prière-demeure-pour-les-croyants-une-prescription-à-des-temps-déterminés.-an-nisa-103"><em>« <strong>La prière demeure, pour les croyants, une prescription à des temps déterminés.</strong> »</em> [An-Nisa : 103] ; </h3>
<h3 id="cest-à-dire-une-obligation-à-des-moments-précis-dont-il-nest-pas-permis-de-sécarter-en-les-retardant.-sauf-pour-celui-qui-souhaite-la-regrouper-avec-la-suivante-par-un-regroupement-retardé-jam-takhir-à-condition-quil-sagisse-de-prières-qui-peuvent-être-regroupées-et-que-la-personne-fasse-partie-de-celles-autorisées-à-pratiquer-le-regroupement-comme-le-voyageur.-quant-au-fait-de-retarder-une-prière-de-nuit-jusquau-jour-ou-une-prière-de-jour-jusquà-la-nuit-ou-la-prière-de-laube-al-fajr-jusquaprès-le-lever-du-soleil-cela-nest-permis-sous-aucun-prétexte-ni-pour-cause-détat-de-grande-impureté-janaba-ni-pour-une-impureté-najassa-ni-pour-toute-autre-raison.-au-contraire-il-doit-laccomplir-dans-son-temps-imparti-selon-sa-capacité-du-moment.">c'est-à-dire : <em><strong>une obligation à des moments précis dont il n'est pas permis de s'écarter en les retardant.</strong></em> Sauf pour celui qui souhaite la regrouper avec la suivante par un "regroupement retardé" (<em>jam' ta'khir</em>), à condition qu'il s'agisse de prières qui peuvent être regroupées et que la personne fasse partie de celles autorisées à pratiquer le regroupement (comme le voyageur). Quant au fait de retarder une prière de nuit jusqu'au jour, ou une prière de jour jusqu'à la nuit, ou la prière de l'aube (<em>Al-Fajr</em>) jusqu'après le lever du soleil, cela n'est permis sous aucun prétexte : ni pour cause d'état de grande impureté (<em>janaba</em>), ni pour une impureté (<em>najassa</em>), ni pour toute autre raison. Au contraire, il doit l'accomplir dans son temps imparti selon sa capacité du moment.</h3>
<p>Certains ignorants, se trouvant en cours de traitement à l'hôpital sur un lit dont ils ne peuvent descendre, ou ne pouvant changer leurs vêtements souillés par une impureté, ou n'ayant pas de terre pour le <em>Tayammum</em> (ablutions sèches), ou ne trouvant personne pour leur en apporter, retardent la prière au-delà de son temps prescrit en disant : « <em>Je la prierai plus tard, lorsque cet empêchement aura disparu</em> ». <strong>C'est une grave erreur et une perte de la prière, causée par l'ignorance et le fait de ne pas s'être renseigné</strong>. Ce qu'il incombe à une telle personne, c'est de prier selon sa capacité dans le temps imparti. Sa prière est alors valide dans cet état, même s'il prie sans <em>Tayammum</em> ou avec des vêtements impurs. Allah le Très-Haut a dit : <em>« <strong>Craignez Allah autant que vous le pouvez</strong> »</em> [At-Taghabun : 16]. Même s'il prie dans une direction autre que la <em>Qibla</em> (la Mecque) parce qu'il est incapable de s'orienter vers elle, sa prière demeure valide.</p>
<p><strong>Le délaissement de la prière:</strong></p>
<p>Et quiconque délaisse la prière par négligence ou par paresse, sans pour autant renier son obligation, tombe dans la mécréance (<em>kufr</em>) selon l'avis le plus authentique des deux avis des savants. C'est même l'avis correct que les preuves appuient, comme le hadith :</p>
<p class="ar"><span dir="rtl">«بَيْنَ الرَّجُلِ وَبَيْنَ الْكُفْرِ تَرْكُ الصَّلَاةِ»</span></p>
<p><em>« <strong>Entre l'homme et la mécréance, il y a l'abandon de la prière</strong> »</em>, rapporté par Muslim<a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a>, ainsi que d'autres preuves.</p>
<p>Il convient de faire savoir qu'une personne délaisse la prière afin de l'exposer (socialement) jusqu'à ce qu'elle prie. Il convient de ne pas lui passer le salam, ni de répondre à son invitation, jusqu'à ce qu'elle se repente et accomplisse la prière. Car la prière est le pilier de la religion et l'élément de distinction entre le musulman et le mécréant. Quelles que soient les œuvres que le serviteur accomplit, elles ne lui seront d'aucune utilité tant qu'il négligera la prière.</p>
<p>Nous demandons à Allah la préservation (le salut).</p>
