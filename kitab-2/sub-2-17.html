<p><strong>*</strong> <strong>Parmi les actes prophétiques (as-Sunan)</strong>, il y a la prosternation de la récitation. Elle est ainsi nommée par l'attribution de l'effet à sa cause, car la récitation en est la cause. C'est une prosternation qu'Allah et Son Messager ont légiférée comme un acte d'adoration lors de la récitation des versets ou de leur écoute ، afin de se rapprocher de Lui — Gloire à Lui — , par soumission à Sa grandeur et par humilité devant Lui.</p>
<p><strong>* La prosternation de la récitation</strong> est recommandée pour le lecteur et l'auditeur, et les savants sont unanimes (Ijmâ') sur sa légitimité.</p>
<p>Ibn 'Umar (qu'Allah l'agrée، lui et son père) a dit : « <em><strong>Le Prophète <span dir="rtl">ﷺ</span> nous récitait une sourate contenant une prosternation. Il se prosternait alors et nous nous prosternions avec lui, au point que l'un d'entre nous ne trouvait parfois plus de place pour poser son front.</strong></em> » (Rapporté par Al-Bukhârî et Muslim) (1).</p>
<p>L'Imam Ibn al-Qayyim (qu'Allah lui fasse miséricorde) a dit : « <em><strong>Les passages de prosternation sont soit des récits, soit des ordres. Les récits sont des informations venant d'Allah concernant la prosternation de Ses créatures pour Lui, de manière générale ou spécifique. Il est donc recommandé au lecteur et à l'auditeur de les imiter lors de la récitation ou de l'écoute du verset de prosternation. Quant aux versets contenant un ordre (c'est-à-dire ceux qui ordonnent de se prosterner)، cela s'applique à plus forte raison.</strong></em> » (2)</p>
<p>D'après Abû Hurayrah، dans un hadith prophétique (marfû') :</p>
<p class="ar"><strong><span dir="rtl">«إِذَا قَرَأَ ابْنُ آدَمَ السَّجْدَةَ، فَسَجَدَ؛ اعْتَزَلَ الشَّيْطَانُ يَبْكِي، يَقُولُ: يَا وَيْلَهُ! أُمِرَ ابْنُ آدَمَ بِالسُّجُودِ، فَسَجَدَ؛ فَلَهُ الْجَنَّةُ، وَأُمِرْتُ بِالسُّجُودِ، فَأَبَيْتُ؛ فَلِيَ النَّارُ»</span></strong></p>
<p>« <em><strong>Quand le fils d'Adam récite un verset de prosternation et se prosterne، le Diable s'isole en pleurant et dit : "Malheur à moi ! Le fils d'Adam a reçu l'ordre de se prosterner et il s'est prosterné, il aura donc le Paradis. Et j'ai reçu l'ordre de me prosterner mais j'ai refusé, j'aurai donc le Feu."</strong></em> » (Rapporté par Muslim et Ibn Mâjah). (3)</p>
<p><strong>* La prosternation de la récitation</strong> est prescrite pour le <strong>lecteur</strong> et l'<strong>auditeur attentif</strong> (<em>al-mustami'</em>), c'est-à-dire celui qui a l'intention d'écouter la lecture.</p>
<p>Dans le hadith d'Ibn 'Umar : « <em><strong>Le Prophète <span dir="rtl">ﷺ</span> nous récitait une sourate contenant une prosternation ; il se prosternait alors et nous nous prosternions avec lui</strong></em> ». (4) Ce récit constitue une preuve de la légitimité de la prosternation pour l'auditeur attentif.</p>
<p>Quant à l'<strong>auditeur fortuit</strong> (<em>as-sâmi'</em>), à savoir celui qui n'avait pas l'intention d'écouter (qui entend simplement le son par hasard), la prosternation de la récitation ne lui est pas prescrite.</p>
<p>Cela s'appuie sur ce qu'a rapporté Al-Bukhârî : 'Uthmân (qu'Allah l'agrée) passa près d'un lecteur qui récitait un verset de prosternation afin que 'Uthmân se prosterne avec lui ; mais il ne se prosterna pas et dit : « <em>La prosternation n'incombe qu'à celui qui <strong>écoute attentivement</strong></em> »(5). Cela a également été rapporté de la part d'autres compagnons.</p>
<p><strong>*</strong> <strong>Les prosternations de la récitation dans le Coran se trouvent dans les sourates suivantes :</strong> Al-A'râf, Ar-Ra'd, An-Nahl, Al-Isrâ', Maryam, Al-Hajj, Al-Furqân, An-Naml, As-Sajdah (Alif-Lâm-Mîm Tanzîl), Fussilat (Hâ-Mîm As-Sajdah), An-Najm, Al-Inshiqâq, et Al-'Alaq (Iqra' bi-ismi Rabbika). Quant à la prosternation de la sourate <strong>Sâd (<span dir="rtl">ص</span>)</strong>, il existe une divergence entre les savants : est-ce une prosternation de gratitude (<em>shukr</em>) ou de récitation ? Et Allah sait mieux.</p>
<p><strong>*</strong> <strong>Il convient de dire "Allâhu Akbar" (le Takbîr) au moment de se prosterner</strong> pour la récitation, conformément au hadith d'Ibn 'Umar : « <em><strong>Le Prophète <span dir="rtl">ﷺ</span> nous récitait le Coran, et lorsqu'il passait par un verset de prosternation, il disait "Allâhu Akbar", se prosternait, et nous nous prosternions avec lui.</strong></em> » (Rapporté par Abû Dâwûd).(6)</p>
<p><strong>* Il dit durant sa prosternation : "Gloire à mon Seigneur le Très-Haut"</strong> (<em>Subhâna Rabbiyal-A'lâ</em>), comme il le fait dans la prière.</p>
<p>S'il dit la formule suivante, il n'y a pas de mal non plus :</p>
<p class="ar"><span dir="rtl">«سَجَدَ وَجْهِي لِلَّذِي خَلَقَهُ وَصَوَّرَهُ، وَشَقَّ سَمْعَهُ وَبَصَرَهُ، بِحَوْلِهِ وَقُوَّتِهِ، اللَّهُمَّ اكْتُبْ لِي بِهَا أَجْراً، وَضَعْ عَنِّي بِهَا وِزْراً، وَاجْعَلْهَا لِي عِنْدَكَ ذُخْراً، وَتَقَبَّلْهَا مِنِّي كَمَا تَقَبَّلْتَهَا مِنْ عَبْدِكَ دَاوُدَ»</span></p>
<p>« <em>Mon visage s'est prosterné devant Celui qui l'a créé, lui a donné sa forme et a ouvert son ouïe et sa vue par Sa puissance et Sa force. Ô Allah, inscris-moi pour cela une récompense, décharge-moi par elle d'un péché, fais-en pour moi un trésor auprès de Toi et accepte-la de ma part comme Tu l'as acceptée de Ton serviteur Dâwûd (David).</em> »</p>
<p><strong>* Accomplir la prosternation de la récitation en partant de la position debout</strong> est préférable à l'accomplir en partant de la position assise.</p>
<p><strong>Ô Musulman !</strong> Certes, les voies du bien sont nombreuses. Applique-toi donc avec sérieux et effort, avec sincérité dans tes paroles et tes actes. Puisse Allah t'inscrire parmi les bienheureux.</p>
