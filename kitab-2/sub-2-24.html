<p>⁕ Certes, la direction de la prière (al-imāmah) est une grande responsabilité. Tout comme elle nécessite des compétences qui doivent être présentes chez l'imam ou dont il est recommandé qu'il soit paré ، il est également impératif que l'imam soit exempt de caractéristiques qui l'empêcheraient d'occuper ce poste ou qui diminueraient sa capacité à l'assumer :</p>
<p>⁕ Il n'est pas permis de confier la direction de la prière à un pervers (fāsiq). Le pervers est celui qui sort du cadre de la droiture en commettant un des grands péchés situés en deçà de l'association (ash-shirk).</p>
<p><strong>La perversité est de deux types :</strong> une <em><strong>perversité dans les actes</strong></em> et une <em><strong>perversité dans la croyance</strong></em>. La perversité dans les actes consiste , par exemple , à commettre l'adultère , le vol , la consommation d'alcool... et ce qui y ressemble. Quant à la perversité dans la croyance ، elle inclut [les innovations telles que] le chiisme (ar-rafḍ) ، le mutazilisme (al-iʿtizāl) et le jahmisme (at-tajahhum).</p>
<p>Il n'est donc pas permis de nommer un pervers comme imam pour la prière ، car la parole du pervers n'est pas acceptée. Allah le Très-Haut a dit :</p>
<p class="ar"><strong><span dir="rtl">﴿يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوٓاْ إِن جَآءَكُمۡ فَاسِقُۢ بِنَبَإٖ فَتَبَيَّنُوٓاْ﴾ [الحجرات: ٦]</span></strong></p>
<p>{<em><strong>Ô vous qui avez cru ! Si un pervers vous apporte une nouvelle, voyez bien clair [avant d'agir]</strong></em>} [Al-Hujurāt : 6].</p>
<p>On ne peut donc pas se fier à lui concernant les conditions et les règles de la prière. De plus , il représenterait un mauvais exemple pour les autres , et sa nomination comporterait des méfaits.</p>
<p>Le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><strong><span dir="rtl">« لَا تَؤُمَّنَّ امْرَأَةٌ رَجُلًا ، وَلَا أَعْرَابِيٌّ مُهَاجِرًا ، وَلَا فَاجِرٌ مُؤْمِنًا ؛ إِلَّا أَنْ يَقْهَرَهُ بِسُلْطَانٍ يَخَافُ سَوْطَهُ ».</span></strong></p>
<p><strong>« <em>Qu'une femme ne dirige pas la prière d'un homme, ni qu'un bédouin ne dirige celle d'un émigré (mouhajir), ni qu'un débauché (fâjir) ne dirige celle d'un croyant ; à moins qu'il ne le contraigne par un pouvoir dont il craindrait le fouet</em> »</strong>. Rapporté par Ibn Mâjah<a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a>.</p>
<p>Le point de preuve ici réside dans sa parole : <strong>« <em>ni qu'un débauché ne dirige celle d'un croyant</em> »</strong>. La débauche (<em>al-foujoûr</em>) consiste à s'écarter de la vérité.</p>
<p>Ainsi, prier derrière un pervers (<em>fâsiq</em>) est une chose interdite, et il n'est pas permis de le mettre en avant (pour l'imamat) si l'on a la capacité [de choisir quelqu'un d'autre] ; il est donc <strong>interdit</strong> aux responsables de nommer une personne perverse comme imam pour les prières. En effet, ils ont pour mission de veiller à l'intérêt général ; il ne leur est donc pas permis d'engager les gens dans une prière détestable (<em>makroûha</em>).</p>
<p>Mieux encore, les savants ont divergé sur la validité même de la prière effectuée derrière un pervers. Dès lors qu'il en est ainsi, il est impératif d'éviter aux gens de tomber dans cette situation [de doute].</p>
<p><strong>⁕ L'imamat de celui qui est incapable</strong> de s'incliner (<em>roukoû'</em>), de se prosterner (<em>soujoûd</em>) ou de s'asseoir <strong>n'est pas valide</strong>, sauf pour quelqu'un qui se trouve dans la même situation que lui (c'est-à-dire ayant la même incapacité concernant un pilier ou une condition).</p>
<p>De même, l'imamat de celui qui est incapable de rester debout (<strong>la station debout</strong>) n'est pas valide pour celui qui en est capable, <strong>sauf s'il s'agit de l'imam régulier (<em>râtib</em>) d'une mosquée</strong> et qu'il est frappé d'une incapacité temporaire dont on espère la guérison. Dans ce cas précis, la prière derrière lui est autorisée, et les fidèles prient alors derrière lui <strong>assis</strong>.</p>
<p>Cela s'appuie sur la parole d'Aïcha (qu'Allah l'agrée) : « <em>Le Prophète <span dir="rtl">ﷺ</span> a prié chez lui alors qu'il était souffrant ; il a prié assis tandis que des gens derrière lui priaient debout. Il leur fit signe de s'asseoir. Une fois la prière terminée, il dit : <strong>"L'imam n'a été instauré que pour être suivi..."</strong> [jusqu'à la fin du hadith], où il est dit : <strong>"et s'il prie assis, priez tous assis."</strong></em> »<a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a> Ceci s'explique par le fait que l'imam régulier a préséance pour diriger la prière.</p>
<p>Et s'ils prient derrière lui debout, ou si certains d'entre eux prient debout dans cette situation, leur prière est <strong>valide</strong> selon l'avis le plus correct (<em>al-sahih</em>). Toutefois, si l'imam désigne, dans ce cas précis, quelqu'un pour diriger la prière à sa place en restant debout, cela est <strong>préférable</strong> (<em>ahsan</em>). Ceci afin de sortir de la divergence [entre les savants] et parce que le Prophète <span dir="rtl">ﷺ</span> a lui-même désigné un remplaçant. Il a ainsi pratiqué les deux méthodes pour démontrer que les deux sont permises. Et Allah est plus Savant.</p>
<p><strong>⁕ L'imamat de celui qui est en état d'impureté permanente</strong> (<em>hadath dâ'im</em>) n'est pas valide. C'est le cas, par exemple, de celui qui souffre d'incontinence urinaire ou de gaz intestinaux continus (ou autre cas similaire).</p>
<p>Son imamat n'est valide que pour une personne souffrant de la <strong>même pathologie</strong> que lui.</p>
<p>Quant à la personne bien portante (<em>as-sahîh</em>), sa prière derrière lui <strong>n'est pas valide</strong>. En effet, la prière de l'imam comporte un défaut qui n'est pas compensé par une alternative, car il prie alors que l'impureté (qui contredit l'état de pureté rituelle) continue de sortir.</p>
<p>Sa propre prière n'est considérée comme valide qu'en raison de la <strong>nécessité</strong> (<em>darûrah</em>). Elle est également valide pour celui qui lui ressemble, car ils sont au même niveau d'égalité concernant cette sortie continue d'impuretés.</p>
<p>⁕ <strong>Si l'on a prié derrière un imam en état d'impureté rituelle</strong> (<em>mouhdith</em>) ou portant une impureté physique (<em>moutanajjis</em>) sur son corps, ses vêtements ou son emplacement, et que ni l'imam ni le fidèle ne s'en sont rendu compte avant la fin de la prière : <strong>la prière du fidèle est valide</strong>, mais pas celle de l'imam.</p>
<p>Cela s'appuie sur la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><strong><span dir="rtl">«إِذَا صَلَّى الجُنُبُ بِالقَوْمِ؛ أَعَادَ صَلَاتَهُ، وَتَمَّتْ لِلْقَوْمِ صَلَاتُهُمْ»</span></strong></p>
<p><strong>« <em>Si une personne en état d'impureté majeure (jounoub) dirige la prière des gens, elle doit recommencer sa prière, mais la prière des gens est complète (valide).</em> »</strong> <a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a>.</p>
<p>Cheikh al-Islâm Ibn Taymiyya a dit <a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a>: « <em>C'est ainsi qu'ont agi les Califes bien guidés. Ils ont parfois dirigé la prière, puis ont constaté après coup qu'ils étaient en état d'impureté majeure ; ils ont alors recommencé leur propre prière sans ordonner aux gens de recommencer la leur. Cependant, si l'imam ou le fidèle s'aperçoit de l'impureté ou de l'état d'impureté rituelle <strong>pendant</strong> la prière, alors leur prière est annulée</em> »<a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a>.</p>
<p><strong>⁕ L'imamat de l'« illettré » (<em>Al-Ummiyy</em>) n'est pas valide.</strong> On entend par là, dans ce contexte, celui qui ne connaît pas la sourate <strong>Al-Fātiḥah</strong> par cœur, ou qui la connaît mais ne la récite pas correctement.</p>
<p>C'est le cas de celui qui commet des erreurs de langage (<em>laḥn</em>) qui <strong>altèrent le sens</strong>. Par exemple :</p>
<ul>
<li><blockquote>
<p>Prononcer le <em>Kāf</em> de <em>« Iyyāka »</em> avec une <em>Kasra</em> (i).</p>
</blockquote></li>
<li><blockquote>
<p>Prononcer le <em>Tā</em> de <em>« An'amta »</em> avec une <em>Ḍamma</em> (ou).</p>
</blockquote></li>
<li><blockquote>
<p>Prononcer la <em>Hamza</em> de <em>« Ihdinā »</em> avec une <em>Fatḥa</em> (a).</p>
</blockquote></li>
</ul>
<p>Cela inclut aussi celui qui remplace une lettre par une autre (le zézaiement ou trouble de l'élocution, <em>Al-Althagh</em>), comme celui qui remplace le <em>Rā</em> par un <em>Ghayn</em> ou un <em>Lām</em>, ou le <em>Sīn</em> par un <em>Tā</em>... etc.</p>
<p>L'imamat de cet « illettré » n'est valide que pour une personne <strong>dans la même situation que lui</strong>, car ils sont alors sur un pied d'égalité, à condition qu'ils soient tous deux incapables de corriger leur récitation.</p>
<p>En revanche, si cet « illettré » est <strong>capable de corriger sa récitation</strong> mais ne le fait pas, sa prière est invalide, tout comme celle de ceux qui prient derrière lui. En effet, il aurait alors délaissé un pilier de la prière (la récitation correcte de la Fātiḥah) alors qu'il avait la capacité de l'accomplir.</p>
<p><strong>⁕ Il est détestable (<em>makroûh</em>) qu'un homme dirige la prière</strong> d'un groupe de personnes dont la majorité le déteste à juste titre (c'est-à-dire que leur aversion soit justifiée par un manquement dans sa pratique religieuse).</p>
<p>Cela s'appuie sur la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><strong><span dir="rtl">«ثَلَاثَةٌ لَا تُجَاوِزُ صَلَاتُهُم آذَانَهُم: العَبْدُ الآبِقُ حَتَّى يَرْجِعَ، وَامْرَأَةٌ بَاتَتْ وَزَوْجُهَا عَلَيْهَا سَاخِطٌ، وَإِمَامُ قَوْمٍ وَهُم لَهُ كَارِهُونَ».</span></strong></p>
<p><strong>« <em>Il y a trois personnes dont la prière ne dépasse pas leurs oreilles (n'est pas élevée vers Allah) : l'esclave fugitif jusqu'à ce qu'il revienne, une femme qui passe la nuit alors que son mari est en colère contre elle, et l'imam d'un peuple alors que ceux-ci éprouvent de l'aversion pour lui.</em> »</strong> Rapporté par Al-Tirmidhî qui l'a qualifié de bon (<em>hassan</em>) <a href="#fn6" class="footnote-ref" id="fnref6" role="doc-noteref"><sup>6</sup></a>.</p>
<p><strong>Cheikh al-Islâm Ibn Taymiyya a dit</strong> <a href="#fn7" class="footnote-ref" id="fnref7" role="doc-noteref"><sup>7</sup></a> <strong>:</strong> « <em>S'ils le détestent pour une raison liée à sa pratique religieuse — comme le mensonge, l'injustice, l'ignorance ou l'innovation (bid'a)... et ce qui y ressemble — et qu'ils préfèrent un autre plus intègre que lui, par exemple quelqu'un de plus véridique, de plus savant ou de plus pieux : <strong>alors il est obligatoire de nommer celui qu'ils aiment</strong>. Cet homme qu'ils détestent n'a pas le droit de diriger leur prière.</em> »</p>
<p>Comme il est rapporté dans le hadith du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><strong><span dir="rtl">«ثَلَاثَةٌ لَا تُجَاوِزُ صَلَاتُهُمْ آذَانَهُمْ: رَجُلٌ أَمَّ قَوْماً وَهُمْ لَهُ كَارِهُونَ، وَرَجُلٌ لَا يَأْتِي الصَّلَاةَ إِلَّا دِبَاراً، وَرَجُلٌ اعْتَبَدَ مُحَرَّراً»</span></strong></p>
<p>« <em><strong>Il y a trois personnes dont la prière ne dépasse pas leurs oreilles : un homme qui dirige la prière d'un peuple alors qu'ils ont de l'aversion pour lui, un homme qui ne vient à la prière qu'avec un retard excessif (dibâran), et un homme qui réduit en esclavage une personne libre.</strong></em> » <a href="#fn8" class="footnote-ref" id="fnref8" role="doc-noteref"><sup>8</sup></a>.</p>
<p><strong>Il a également dit :</strong></p>
<p>« S'il existe entre eux une hostilité de la nature de celle qui oppose les gens des passions (ahwâ') et des sectes, il ne convient pas qu'il dirige leur prière. Car le but de la prière en groupe est de réaliser l'union et l'harmonie. Le Prophète <span dir="rtl">ﷺ</span> a d'ailleurs dit :</p>
<p class="ar"><strong><span dir="rtl">«لَا تَخْتَلِفُوا؛ فَتَخْتَلِفَ قُلُوبُكُمْ»</span></strong></p>
<p>"<em><strong>Ne divergez pas (dans vos rangs), car vos cœurs divergeraient alors.</strong></em>"<a href="#fn9" class="footnote-ref" id="fnref9" role="doc-noteref"><sup>9</sup></a> » <a href="#fn10" class="footnote-ref" id="fnref10" role="doc-noteref"><sup>10</sup></a>. Fin de citation.</p>
<p>Cependant, si l'imam est un homme de religion et de tradition (Sounnah), et qu'ils ne l'aiment que pour cette raison, alors l'imamat n'est pas détestable en ce qui le concerne. Le tort revient uniquement à ceux qui le détestent.</p>
<p>Dans tous les cas, l'harmonie doit régner entre l'imam et les fidèles. Ils doivent s'entraider dans la piété et la dévotion, et délaisser les querelles et la haine issues des passions et des desseins sataniques. L'imam a le devoir de respecter les droits des fidèles, de ne pas leur rendre les choses difficiles et de respecter leurs sentiments. De même, les fidèles ont le devoir de respecter les droits de l'imam et de l'honorer.</p>
<p>En résumé, il convient que chacun supporte les critiques de l'autre tant qu'elles ne portent pas atteinte à la religion ou à la bienséance (mouroû'a), car l'être humain est par nature sujet à l'imperfection.</p>
<p class="ar"><strong><span dir="rtl">وَمَنْ ذَا الَّذِي تُرْضَى سَجَايَاهُ كُلُّهَا *** كَفَى المَرْءَ نُبْلًا أَنْ تُعَدَّ مَعَايِبُهُ</span></strong></p>
<p><em><strong>Qui donc possède des traits de caractère tous appréciés *** C'est déjà une noblesse pour l'homme que ses défauts puissent être comptés.</strong></em></p>
<p>Voilà. Nous demandons à Allah pour tous la guidance et le succès.</p>
