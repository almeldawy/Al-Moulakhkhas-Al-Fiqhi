<p><strong>Allah le Très-Haut a dit :</strong></p>
<p class="ar"><strong><span dir="rtl">﴿يَا أَيُّهَا الَّذِينَ آمَنُوا اذْكُرُوا اللهَ ذِكْراً كَثِيراً * وَسَبِّحُوهُ بُكْرَةً وَأَصِيلاً﴾ [الأحزاب]</span></strong></p>
<p><em><strong>« Ô vous qui croyez ! Évoquez Allah d'une façon abondante, et glorifiez-Le à la pointe de l'aurore et au coucher du soleil. » [Sourate Al-Ahzâb].</strong></em></p>
<p><strong>Allah a spécifiquement ordonné de L'évoquer après l'accomplissement des actes d'adoration :</strong></p>
<p>Il a ordonné de L'évoquer après avoir terminé les prières ; le Très-Haut a dit :</p>
<p class="ar"><strong><span dir="rtl">﴿فَإِذَا قَضَيْتُمُ الصَّلَاةَ فَاذْكُرُوا اللهَ قِيَاماً وَقُعُوداً وَعَلَى جُنُوبِكُمْ﴾ [النساء: ١٠٣]</span></strong></p>
<p><em><strong>« Quand vous avez accompli la prière, invoquez le nom d'Allah, debout, assis ou couchés sur vos côtés. » [Sourate An-Nisâ' : 103].</strong></em></p>
<p>Et Il a dit :</p>
<p class="ar"><strong><span dir="rtl">﴿فَإِذَا قُضِيَتِ الصَّلَاةُ فَانْتَشِرُوا فِي الأَرْضِ وَابْتَغُوا مِن فَضْلِ اللهِ وَاذْكُرُوا اللهَ كَثِيراً لَعَلَّكُمْ تُفْلِحُونَ﴾ [الجمعة]</span></strong></p>
<p><em><strong>« Puis quand la prière est achevée, dispersez-vous sur terre, et recherchez quelque effet de la grâce d'Allah, et invoquez beaucoup Allah afin que vous réussissiez. » [Sourate Al-Jumu'ah].</strong></em></p>
<p>Il a ordonné de L'évoquer après avoir complété le jeûne du Ramadan ; le Très-Haut a dit :</p>
<p class="ar"><strong><span dir="rtl">﴿وَلِتُكْمِلُوا العِدَّةَ وَلِتُكَبِّرُوا اللهَ عَلَى مَا هَدَاكُمْ وَلَعَلَّكُمْ تَشْكُرُونَ﴾ [البقرة: ١٨٥]</span></strong></p>
<p><em><strong>« ... afin que vous acheviez le nombre [de jours] et que vous proclamiez la grandeur d'Allah pour vous avoir guidés, et afin que vous soyez reconnaissants. » [Sourate Al-Baqarah : 185].</strong></em></p>
<p>Il a ordonné de L'évoquer après avoir accompli les rites du Pèlerinage (Hajj) ; le Très-Haut a dit :</p>
<p class="ar"><strong><span dir="rtl">﴿فَإِذَا قَضَيْتُم مَنَاسِكِيكُمْ فَاذْكُرُوا اللهَ كَذِكْرِكُمْ آبَاءَكُمْ أَوْ أَشَدَّ ذِكْراً﴾ [البقرة: ٢٠٠]</span></strong></p>
<p><strong>« Et quand vous aurez achevé vos rites, invoquez Allah comme vous invoquez vos pères, et plus intensément encore. » [Sourate Al-Baqarah : 200].</strong></p>
<p>Ceci est — et Allah sait mieux — une compensation pour les manques et les suggestions sataniques (<em>wasâwis</em>) qui surviennent durant l'adoration, et c'est aussi pour faire ressentir à l'être humain qu'il est tenu de poursuivre l'évocation et l'adoration ; afin qu'il ne s'imagine pas qu'une fois l'acte d'adoration terminé, il s'est acquitté de tout ce qu'il devait.</p>
<p>Et le rappel (dhikr) prescrit après la prière obligatoire doit se faire selon la manière rapportée d'après le Prophète <span dir="rtl">ﷺ</span>, et non selon la manière innovée et inventée que pratiquent les soufis innovateurs.</p>
<p>Ainsi, dans le « Sahîh Muslim », d'après Thawbân (qu'Allah l'agrée), il a dit :</p>
<p class="ar"><strong><span dir="rtl">كَانَ رَسُولُ اللهِ ﷺ إِذَا انْصَرَفَ مِنْ صَلَاتِهِ ؛ اسْتَغْفَرَ اللهَ ثَلَاثاً ، وَقَالَ : « اللَّهُمَّ أَنْتَ السَّلَامُ وَمِنْكَ السَّلَامُ ، تَبَارَكْتَ يَا ذَا الْجَلَالِ وَالْإِكْرَامِ »</span></strong></p>
<p><em><strong>« Quand le Messager d'Allah <span dir="rtl">ﷺ</span> terminait sa prière, il demandait pardon à Allah (istighfâr) trois fois, puis disait : « Ô Allah, Tu es la Paix et de Toi vient la paix. Béni sois-Tu, ô Détenteur de la majesté et de la générosité. »</strong></em> (1)</p>
<p>« Allâhumma Antas-Salâm wa minkas-salâm, tabârakta yâ dhal-jalâli wal-ikrâm. »</p>
<p>Et dans les <strong>« Deux Authentiques »</strong> (Al-Bukhârî et Muslim) (2), d'après Al-Mughîrah ibn Shu'bah (qu'Allah l'agrée) ; le Messager d'Allah <span dir="rtl">ﷺ</span> disait, lorsqu'il terminait la prière :</p>
<p class="ar"><strong><span dir="rtl">لَا إِلَهَ إِلَّا اللهُ وَحْدَهُ لَا شَرِيكَ لَهُ ، لَهُ الْمُلْكُ ، وَلَهُ الْحَمْدُ ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ ، اللَّهُمَّ لَا مَانِعَ لِمَا أَعْطَيْتَ ، وَلَا مُعْطِيَ لِمَا مَنَعْتَ ، وَلَا يَنْفَعُ ذَا الْجَدِّ مِنْكَ الْجَد</span>ُّ ».</strong></p>
<p><strong>« Il n'y a de divinité digne d'adoration qu'Allah, Seul, sans associé. À Lui appartient la royauté, à Lui la louange, et Il est Capable de toute chose. Ô Allah, nul ne peut retenir ce que Tu as donné, et nul ne peut donner ce que Tu as retenu. Et la fortune du fortuné ne lui sert à rien contre Toi. »</strong></p>
<p>« Lâ ilâha illâ l-Lâhu wahdahu lâ sharîka lah, lahu-l-mulku wa lahu-l-hamd, wa huwa 'alâ kulli shay'in qadîr. Allâhumma lâ mâni'a limâ a'tayt, wa lâ mu'tiya limâ mana't, wa lâ yanfa'u dhal-jaddi minka-l-jadd. »</p>
<p>Et dans le <strong>« Sahîh Muslim »</strong> (3), d'après 'Abdallâh ibn az-Zubayr (qu'Allah l'agrée) ; le Messager d'Allah <span dir="rtl">ﷺ</span> proclamait l'unicité d'Allah (<em>tahlîl</em>) à la fin de chaque prière, juste après les salutations finales, par ces paroles :</p>
<p class="ar"><strong><span dir="rtl">« لَا إِلَهَ إِلَّا اللهُ وَحْدَهُ لَا شَرِيكَ لَهُ ، لَهُ الْمُلْكُ ، وَلَهُ الْحَمْدُ ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ ، لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللهِ ، لَا إِلَهَ إِلَّا اللهُ ، وَلَا نَعْبُدُ إِلَّا إِيَّاهُ ، لَهُ النِّعْمَةُ ، وَلَهُ الْفَضْلُ ، وَلَهُ الثَّنَاءُ الْحَسَنُ ، لَا إِلَهَ إِلَّا اللهُ ، مُخْلِصِينَ لَهُ الدِّينَ ، وَلَوْ كَرِهَ الْكَافِرُونَ ».</span></strong></p>
<blockquote>
<p><strong>« Il n'y a de divinité digne d'adoration qu'Allah, Seul, sans associé. À Lui appartient la royauté, à Lui la louange, et Il est Capable de toute chose. Il n'y a de force ni de puissance que par Allah. Il n'y a de divinité digne d'adoration qu'Allah, et nous n'adorons que Lui. À Lui appartiennent les bienfaits, la grâce et les plus belles louanges. Il n'y a de divinité digne d'adoration qu'Allah, en Lui vouant un culte exclusif, n'en déplaise aux mécréants. »</strong></p>
</blockquote>
<p><em>« Lâ ilâha illâ l-Lâhu wahdahu lâ sharîka lah, lahu-l-mulku wa lahu-l-hamd, wa huwa 'alâ kulli shay'in qadîr. Lâ hawla wa lâ quwwata illâ bi-l-Lâh. Lâ ilâha illâ l-Lâhu wa lâ na'budu illâ iyyâh. Lahu-n-ni'matu wa lahu-l-fadlu wa lahu-th-thanâ'u-l-hasan. Lâ ilâha illâ l-Lâhu mukhlisîna lahu-d-dîna wa law kariha-l-kâfirûn. »</em></p>
<p>Et dans les <strong>« Sunan »</strong>, d'après un hadith d'Abû Dharr : le Messager d'Allah <span dir="rtl">ﷺ</span> a dit :</p>
<blockquote>
<p class="ar"><strong><span dir="rtl">«مَنْ قَالَ فِي دُبُرِ صَلَاةِ الفَجْرِ وَهُوَ ثَانٍ رِجْلَيْهِ قَبْلَ أَنْ يَتَكَلَّمَ: لَا إِلَهَ إِلَّا اللهُ وَحْدَهُ، لَا شَرِيكَ لَهُ، لَهُ المُلْكُ، وَلَهُ الحَمْدُ، يُحْيِي وَيُمِيتُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ؛ عَشْرَ مَرَّاتٍ؛ كُتِبَتْ لَهُ عَشْرُ حَسَنَاتٍ، وَمُحِيَ عَنْهُ عَشْرُ سَيِّئَاتٍ، وَرُفِعَ لَهُ عَشْرُ دَرَجَاتٍ، وَكَانَ يَوْمَهُ ذَلِكَ كُلَّهُ فِي حِرْزٍ مِنْ كُلِّ مَكْرُوهٍ، وَحُرِسَ مِنَ الشَّيْطَانِ، وَلَمْ يَنْبَغِ لِذَنْبٍ أَنْ يُدْرِكَهُ فِي ذَلِكَ اليَوْمِ؛ إِلَّا الشِّرْكَ بِاللهِ»، قَالَ التِّرْمِذِيُّ: «هَذَا حَدِيثٌ حَسَنٌ صَحِيحٌ»</span></strong></p>
<p><strong>« Quiconque dit à la fin de la prière de l'Aube (<em>Fajr</em>), tout en ayant encore les jambes pliées [en position assise] et avant de parler : "Il n'y a de divinité digne d'adoration qu'Allah, Seul, sans associé. À Lui appartient la royauté et à Lui la louange, Il donne la vie et Il donne la mort, et Il est Capable de toute chose", dix fois ; il lui sera inscrit dix bonnes actions, dix péchés lui seront effacés, il sera élevé de dix degrés, il sera en ce jour à l'abri de tout mal, il sera protégé de Satan et aucun péché ne pourra le perdre ce jour-là, sauf le polythéisme (<em>Shirk</em>). »</strong> At-Tirmidhî a dit : « C'est un hadith bon et authentique (<em>Hasan Sahîh</em>) ». (4)</p>
</blockquote>
<p>Et il a été rapporté que ces dix proclamations d'unicité (<em>tahlîlât</em>) se disent aussi après la prière du Coucher du soleil (<em>Maghrib</em>), selon le hadith d'Umm Salama chez Ahmad (5), et le hadith d'Abû Ayyûb al-Ansârî dans le « Sahîh Ibn Hibbân » (6)</p>
<p>Et il dit également après le Coucher du soleil (<em>Maghrib</em>) et l'Aube (<em>Fajr</em>) :</p>
<blockquote>
<p class="ar"><strong><span dir="rtl">« رَبِّ ! أَجِرْنِي مِنَ النَّارِ » ؛ سَبْعَ مَرَّاتٍ ؛ لِمَا رَوَاهُ أَحْمَدُ وَأَبُو دَاوُدَ وَالنَّسَائِيُّ وَابْنُ مَاجَه وَغَيْرُهُم</span></strong></p>
<p><strong>« Seigneur ! Préserve-moi du Feu. »</strong></p>
</blockquote>
<p>Sept fois ; conformément à ce qu'ont rapporté Ahmad, Abû Dâwûd, An-Nasâ'î, Ibn Mâjah et d'autres (7).</p>
<p><em>« Rabbi ! Ajirnî min an-nâr. »</em></p>
<p>Ensuite, il glorifie Allah après chaque prière trente-trois fois, Le loue trente-trois fois et L'exalte trente-trois fois, puis il dit pour compléter la centaine :</p>
<blockquote>
<p class="ar"><strong><span dir="rtl">« لَا إِلَهَ إِلَّا اللهُ ، وَحْدَهُ لَا شَرِيكَ لَهُ ، لَهُ المُلْكُ ، وَلَهُ الحَمْدُ ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ » ؛ لِمَا رَوَى مُسْلِمٌ</span></strong></p>
<p><em><strong>« Il n'y a de divinité digne d'adoration qu'Allah, Seul, sans associé. À Lui appartient la royauté, à Lui la louange, et Il est Capable de toute chose. »</strong></em></p>
</blockquote>
<p>Ceci conformément à ce que Muslim a rapporté (8), que le Messager d'Allah <span dir="rtl">ﷺ</span> a dit :</p>
<blockquote>
<p class="ar"><strong><span dir="rtl">« مَنْ سَبَّحَ اللهَ فِي دُبُرِ كُلِّ صَلَاةٍ ثَلَاثاً وَثَلَاثِينَ ، وَحَمِدَ اللهَ ثَلَاثاً وَثَلَاثِينَ ، وَكَبَّرَ اللهَ ثَلَاثاً وَثَلَاثِينَ ؛ فَتِلْكَ تِسْعَةٌ وَتِسْعُونَ ، ثُمَّ قَالَ تَمَامَ المِئَةِ : لَا إِلَهَ إِلَّا اللهُ وَحْدَهُ لَا شَرِيكَ لَهُ ، لَهُ المُلْكُ ، وَلَهُ الحَمْدُ ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ ؛ غُفِرَتْ لَهُ خَطَايَاهُ ، وَإِنْ كَانَتْ مِثْلَ زَبَدِ البَحْرِ ».</span></strong></p>
<p><em><strong>« Quiconque glorifie Allah après chaque prière trente-trois fois (Subhânallâh), loue Allah trente-trois fois (Al-hamdu lillâh) et exalte Allah trente-trois fois (Allâhu Akbar) — ce qui fait quatre-vingt-dix-neuf — puis dit pour compléter la centaine : "Il n'y a de divinité digne d'adoration qu'Allah, Seul, sans associé. À Lui appartient la royauté, à Lui la louange, et Il est Capable de toute chose" ; ses péchés lui seront pardonnés, même s'ils sont aussi nombreux que l'écume de la mer. »</strong></em></p>
</blockquote>
<p>Ensuite, il récite le verset du Trône (<em>Âyat al-Kursî</em>), ainsi que [les sourates] « Dis : Il est Allah, l'Unique », « Dis : Je cherche protection auprès du Seigneur de l'aube naissante » et « Dis : Je cherche protection auprès du Seigneur des hommes ».</p>
<p>Ceci conformément à ce qu'ont rapporté An-Nasâ'î et At-Tabarânî d'après Abû Umâmah (qu'Allah l'agrée) qui a dit : Le Messager d'Allah <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><strong><span dir="rtl">«مَنْ قَرَأَ آيَةَ الكُرْسِيِّ دُبُرَ كُلِّ صَلَاةٍ؛ لَمْ يَمْنَعْهُ مِنْ دُخُولِ الجَنَّةِ إِلَّا أَنْ يَمُوتَ»</span></strong></p>
<blockquote>
<p><em><strong>« Quiconque récite le verset du Trône (Âyat al-Kursî) à la fin de chaque prière, rien ne l'empêchera d'entrer au Paradis si ce n'est la mort. » (9)</strong></em></p>
</blockquote>
<p>Cela signifie : il n'y a entre lui et l'entrée au Paradis que la mort. Et dans un autre hadith :</p>
<p class="ar"><strong><span dir="rtl">«كَانَ فِي ذِمَّةِ اللهِ إِلَى الصَّلَاةِ الأُخْرَى»</span></strong></p>
<p><em><strong>« Il reste sous la protection d'Allah jusqu'à la prière suivante » (10).</strong></em></p>
<p>Et dans les « Sunan », d'après 'Uqbah ibn 'Âmir (qu'Allah l'agrée), il a dit :</p>
<p class="ar"><strong><span dir="rtl">«أَمَرَنِي رَسُولُ اللهِ ﷺ أَنْ أَقْرَأَ المُعَوِّذَتَيْنِ دُبُرَ كُلِّ صَلَاةٍ»</span></strong></p>
<p><em><strong>« Le Messager d'Allah <span dir="rtl">ﷺ</span> m'a ordonné de réciter les deux sourates protectrices (Al-Mu'awwidhatayn) à la fin de chaque prière. » (11)</strong></em></p>
<p>Ces nobles hadiths ont démontré la légitimité de ces rappels après les prières obligatoires, ainsi que la récompense et les mérites obtenus par celui qui les récite. Il nous convient donc d'être assidus à les accomplir selon la forme rapportée du Prophète <span dir="rtl">ﷺ</span>, et de les réciter immédiatement après les salutations finales, avant même de quitter l'endroit où nous avons prié, en respectant l'ordre suivant :</p>
<ul>
<li><blockquote>
<p>Une fois les salutations de la prière terminées, nous demandons pardon à Allah (Istighfâr) trois fois.</p>
</blockquote></li>
</ul>
<ul>
<li><blockquote>
<p>Ensuite, nous disons : « Ô Allah, Tu es la Paix et de Toi vient la paix. Béni sois-Tu, ô Détenteur de la majesté et de la générosité. »</p>
</blockquote></li>
</ul>
<ul>
<li><blockquote>
<p>Ensuite, nous disons : « Il n'y a de divinité digne d'adoration qu'Allah, Seul, sans associé. À Lui appartient la royauté, à Lui la louange, et Il est Capable de toute chose. Ô Allah, nul ne peut retenir ce que Tu as donné, et nul ne peut donner ce que Tu as retenu. Et la fortune du fortuné ne lui sert à rien contre Toi » ; c'est-à-dire que sa richesse ne lui est d'aucune utilité auprès de Toi, seule l'œuvre pieuse lui est utile.</p>
</blockquote></li>
</ul>
<ul>
<li><blockquote>
<p>Ensuite, nous disons : « Il n'y a de force ni de puissance que par Allah. Il n'y a de divinité digne d'adoration qu'Allah, et nous n'adorons que Lui. À Lui appartiennent les bienfaits, la grâce et les plus belles louanges. Il n'y a de divinité digne d'adoration qu'Allah, en Lui vouant un culte exclusif, n'en déplaise aux mécréants. »</p>
</blockquote></li>
</ul>
<ul>
<li><blockquote>
<p>Ensuite, nous glorifions Allah (Subhânallâh) 33 fois, nous Le louons (Al-hamdu lillâh) 33 fois, nous L'exaltons (Allâhu Akbar) 33 fois, et nous disons pour compléter la centaine : « Il n'y a de divinité digne d'adoration qu'Allah, Seul, sans associé. À Lui appartient la royauté, à Lui la louange, et Il est Capable de toute chose. »</p>
</blockquote></li>
<li><blockquote>
<p><strong>Après les prières du Maghrib et du Fajr</strong>, nous récitons les dix proclamations d'unicité (<em>tahlîlât</em>), et nous disons : <strong>« Seigneur, préserve-moi du Feu »</strong> sept fois.</p>
</blockquote></li>
<li><blockquote>
<p><strong>Ensuite, après avoir terminé ces rappels selon cet ordre</strong>, nous récitons le <strong>Verset du Trône</strong> (<em>Âyat al-Kursî</em>), la sourate <strong>« Al-Ikhlâs »</strong> (Dis : Il est Allah l'Unique) et <strong>les deux sourates protectrices</strong> (<em>Al-Mu'awwidhatayn</em>).</p>
</blockquote></li>
</ul>
<p>Il est recommandé de répéter la lecture de ces [trois] sourates trois fois après les prières du Maghrib et du Fajr.</p>
<p>Il est recommandé de prononcer à voix haute le <em>tahlîl</em>, le <em>tasbîh</em>, le <em>tahmîd</em> et le <em>takbîr</em> après la prière. Cependant, cela ne doit pas être fait d'une voix collective (en chœur) ; chaque personne doit élever la voix individuellement.</p>
<p>On s'aide des phalanges des doigts pour compter le nombre de <em>tahlîlât</em>, de <em>tasbîh</em>, de <em>tahmîd</em> et de <em>takbîr</em>, car les doigts seront interrogés et doués de parole le Jour de la Résurrection.</p>
<p>L'utilisation du chapelet (<em>Subha</em>) est autorisée pour compter les rappels et les glorifications, sans croire qu'il possède une vertu particulière en soi. Certains savants l'ont désapprouvé. Si l'on croit qu'il a une vertu spéciale, son usage devient alors une innovation (<em>bid'a</em>), à l'exemple des chapelets utilisés par les soufis qui les pendent à leur cou ou les portent comme des bracelets. En plus d'être une innovation, cela comporte de l'ostentation (<em>riyâ'</em>) et de l'affectation superflue.</p>
<ul>
<li><blockquote>
<p><strong>Ensuite, après avoir terminé ces rappels (<em>adhkâr</em>)</strong>, il invoque Allah intérieurement (en secret) pour ce qu'il souhaite. En effet, l'invocation après cet acte d'adoration et ces rappels grandioses est plus à même d'être exaucée. Cependant, il ne lève pas les mains pour l'invocation après la prière obligatoire comme le font certaines personnes, car cela est une innovation (<em>bid'a</em>). On ne fait cela qu'après une prière surérogatoire (<em>nâfila</em>) de temps à autre. De même, il ne fait pas ses invocations à voix haute, mais il les dissimule, car cela est plus proche de la sincérité (<em>ikhlâs</em>) et de la concentration (<em>khushû'</em>), et plus éloigné de l'ostentation (<em>riyâ'</em>).</p>
</blockquote></li>
</ul>
<p>Ce que font certaines personnes dans certains pays, à savoir l'invocation collective à voix haute après les prières en levant les mains, ou le fait que l'imam invoque pendant que les fidèles disent « Amîn » en levant les mains, cet acte est une <strong>innovation blâmable</strong>. En effet, il n'a pas été rapporté du Prophète <span dir="rtl">ﷺ</span> que lorsqu'il dirigeait la prière, il invoquait de cette manière après avoir terminé, que ce soit pour le Fajr, l'Asr ou toute autre prière. Aucun des imams [des quatre écoles] n'a jugé cela recommandé.</p>
<p>Cheikh al-Islam Ibn Taymiyya a dit (13) :</p>
<p class="ar"><strong><span dir="rtl">« مَنْ نَقَلَ ذَلِكَ عَنِ الإِمَامِ الشَّافِعِيِّ ؛ فَقَدْ غَلِطَ عَلَيْهِ »</span></strong></p>
<p><strong>« <em>Quiconque rapporte cela de l'Imam Ach-Châfi'î s'est trompé à son sujet.</em> »</strong></p>
<p>Il est donc obligatoire de se conformer à ce qui a été rapporté du Prophète <span dir="rtl">ﷺ</span> à ce sujet ainsi que pour le reste. Car Allah le Très-Haut dit :</p>
<blockquote>
<p class="ar"><strong><span dir="rtl">﴿ وَمَا آتَاكُمُ الرَّسُولُ فَخُذُوهُ وَمَا نَهَاكُمْ عَنْهُ فَانتَهُوا وَاتَّقُوا اللهَ إِنَّ اللهَ شَدِيدُ الْعِقَابِ ﴾ [الحشر : ٧]</span></strong></p>
<p><em><strong>« Ce que le Messager vous donne, prenez-le ; et ce qu’il vous interdit, abstenez-vous-en. Et craignez Allah, car Allah est dur en punition. » (Sourate Al-Hachr, verset 7)</strong></em></p>
</blockquote>
<p>Et Il dit également (Gloire à Lui) :</p>
<p class="ar"><strong><span dir="rtl">﴿ لَّقَدْ كَانَ لَكُمْ فِي رَسُولِ اللهِ أُسْوَةٌ حَسَنَةٌ لِّمَن كَانَ يَرْجُو اللهَ وَالْيَوْمَ الْآخِرَ وَذَكَرَ اللهَ كَثِيراً ﴾ [الأحزاب : ٢١]</span></strong></p>
<blockquote>
<p><em><strong>« En effet, vous avez dans le Messager d’Allah un excellent modèle [à suivre], pour quiconque espère en Allah et au Jour dernier et invoque Allah fréquemment. » (Sourate Al-Ahzâb, verset 21)</strong></em></p>
</blockquote>
