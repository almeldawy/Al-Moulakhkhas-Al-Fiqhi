<p>Puisque les cinq prières sont prescrites à des moments précis et qu'il n'est pas permis de les accomplir avant l'entrée de ces horaires، et comme beaucoup de gens ne savent pas quand l'heure arrive ou peuvent être occupés au point de ne pas y prêter attention ، Allah a légiféré l'Adhân (l'appel à la prière) afin d'informer de l'entrée de son temps.</p>
<p>L'Adhân a été prescrit durant la première année de l'Hégire prophétique. La cause de sa légifération est que, lorsqu'il devint difficile pour les compagnons de connaître les horaires, ils se consultèrent pour établir un signe distinctif. C'est alors que 'Abdullâh ibn Zayd vit cet appel en rêve, et la Révélation le confirma.</p>
<p>Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوٓاْ إِذَا نُودِيَ لِلصَّلَوٰةِ مِن يَوْمِ ٱلْجُمُعَةِ فَٱسْعَوْاْ إِلَىٰ ذِكْرِ ٱللَّهِ وَذَرُواْ ٱلْبَيْعَ﴾ [الجمعة: ٩]</span></p>
<p><strong>{Ô vous qui avez cru ! Quand on appelle à la prière du jour du Vendredi, accourez à l'invocation d'Allah et laissez tout négoce}</strong> [Al-Jumu'ah : 9]،</p>
<p>et Il a dit aussi :</p>
<p class="ar"><span dir="rtl">﴿وَإِذَا نَادَيْتُمْ إِلَى ٱلصَّلَوٰةِ﴾ [المائدة: ٥٨].</span></p>
<p><strong>{Et lorsque vous faites l'appel à la prière}</strong> [Al-Mâ'idah : 58].</p>
<p>L'Adhân tout comme l'Iqâmah possèdent des formules de rappel (Dhikr) spécifiques. C'est un discours qui englobe les fondements de la foi : ils débutent par le Takbîr (Allah est le plus Grand)، qui est une glorification d'Allah <span dir="rtl">ﷻ</span>. Vient ensuite l'affirmation de l'Unicité d'Allah <span dir="rtl">ﷻ</span>، puis l'affirmation du message de notre Prophète Muhammad <span dir="rtl">ﷺ</span> par les deux témoignages (Attashahoud). Suit l'appel à la prière، qui est le pilier de l'Islam، puis l'appel au succès (Al-Falâh)، qui représente la réussite et la demeure éternelle dans les délices permanents. Enfin, il se conclut par la grandeur et la glorification d'Allah ainsi que par la parole de l'exclusivité du culte (Lâ ilâha illa Allah). Cette parole est l'une des meilleures et des plus illustres formules de rappel؛ celle qui، si elle était pesée face aux sept cieux et leurs habitants — en dehors d'Allah — ainsi que les sept terres et leurs habitants، l'emporterait sur eux par sa grandeur et son mérite.</p>
<p>Des hadiths ont été rapportés au sujet du mérite de l'Adhân (l'appel à la prière), mentionnant que les mouadhinounes (ceux qui font l'Adhân) seront les personnes ayant les cous les plus longs le Jour de la Résurrection <a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a>.</p>
<p>L'Adhân et l'Iqâmah sont <strong>deux obligations de suffisance communautaire (Fard Kifâyah)</strong>. <em>L'obligation de suffisance est ce qu'il incombe à l'ensemble des musulmans d'accomplir ; si un nombre suffisant de personnes s'en acquitte, le péché est levé pour le reste d'entre eux</em>.</p>
<p><strong>Ils font partie des rites apparents de l'Islam</strong>. Ils sont prescrits pour les hommes, qu'ils soient résidents ou en voyage, pour les cinq prières [quotidiennes]. On combattrait les habitants d'une contrée qui les délaisseraient, car ils font partie des rites manifestes de l'Islam ; il n'est donc pas permis de les suspendre.</p>
<p><strong>Les qualités requises chez le mouadhine sont :</strong></p>
<ul>
<li><blockquote>
<p><strong>Qu'il ait une voix forte et portante (<em>sayyitan</em>)</strong>, car cela est plus efficace pour la transmission de l'appel.</p>
</blockquote></li>
<li><blockquote>
<p><strong>Qu'il soit honnête et digne de confiance (<em>amînan</em>)</strong>, car il occupe une position de responsabilité : les gens se fient à son appel pour déterminer l'entrée du temps de la prière, le début du jeûne et l'heure de la rupture du jeûne.</p>
</blockquote></li>
<li><blockquote>
<p><strong>Qu'il connaisse les horaires [de prière]</strong>, afin de pouvoir lancer l'appel dès le début du temps prescrit.</p>
</blockquote></li>
</ul>
<p><strong>L'Adhân est composé de quinze phrases</strong>, tel que Bilal le récitait toujours en présence du Messager d'Allah <span dir="rtl">ﷺ</span>. Il est recommandé de prononcer les termes de l'Adhân avec calme et lenteur, sans traîner excessivement sur les voyelles ni prolonger les sons de manière démesurée, en marquant une pause après chaque phrase.</p>
<p>Il est également recommandé :</p>
<ul>
<li><blockquote>
<p>De faire face à la <strong>Qibla</strong> pendant l'appel.</p>
</blockquote></li>
<li><blockquote>
<p>De placer ses <strong>doigts dans ses oreilles</strong>, car cela aide à porter la voix plus haut.</p>
</blockquote></li>
<li><blockquote>
<p>De tourner la tête à <strong>droite</strong> lors de la formule : <em>« Hayya 'alâ-s-salâh »</em> (Venez à la prière).</p>
</blockquote></li>
<li><blockquote>
<p>De tourner la tête à <strong>gauche</strong> lors de la formule : <em>« Hayya 'alâ-l-falâh »</em> (Venez au succès).</p>
</blockquote></li>
</ul>
<p>Lors de l'appel de l'aube (<strong>Fajr</strong>) spécifiquement, le mouadhine doit dire après le second <em>« Hayya 'alâ-l-falâh »</em> : <strong>« La prière est meilleure que le sommeil »</strong> (<em>As-salâtu khayrun mina-n-nawm</em>), deux fois. Cela est dû à l'ordre du Prophète <span dir="rtl">ﷺ</span>, car c'est un moment où les gens dorment généralement.</p>
<p><strong>Il n'est pas permis d'ajouter d'autres formules de rappel (dhikr) avant ou après l'Adhân</strong> en élevant la voix, car cela fait partie des innovations religieuses (<em>bid'ah</em>). Tout ce qui est pratiqué en dehors de l'Adhân tel qu'il a été établi par le Messager d'Allah <span dir="rtl">ﷺ</span> est une <strong>innovation interdite</strong>, comme :</p>
<ul>
<li><blockquote>
<p>Le fait de glorifier Allah (<em>Tasbîh</em>), de chanter des hymnes (<em>Nashîd</em>) ou de faire des douas à voix haute.</p>
</blockquote></li>
<li><blockquote>
<p>Le fait de prier sur le Prophète ou de le saluer (<strong>Salât wa Salâm</strong>) à voix haute juste avant ou après l'Adhân. Tout cela est une invention nouvelle dont la pratique est illicite (<em>harâm</em>), et il est obligatoire de désapprouver celui qui le fait.</p>
</blockquote></li>
</ul>
<p>[L'Iqâmah est composée de onze phrases. Il convient de la réciter rapidement (yahduruhâ) ; car elle sert à informer les personnes déjà présentes [dans la mosquée] ; il n'est donc pas nécessaire de la réciter avec lenteur.</p>
<p>Il est recommandé que celui qui fait l'Iqâmah soit celui-là même qui a fait l'Adhân. Il ne doit pas lancer l'Iqâmah sans l'autorisation de l'Imam, car le moment de l'Iqâmah dépend de la décision de l'Imam ; elle ne doit donc être effectuée que sur son signal.]</p>
<p><strong>L'Adhân n'est pas valable s'il est effectué avant l'heure [de la prière]</strong>, car il a été institué pour informer de l'entrée du temps prescrit ; l'objectif ne serait donc pas atteint. De plus, cela induirait en erreur ceux qui l'entendent.</p>
<p><strong>L'exception est l'Adhân du Fajr (l'aube)</strong> : il est permis de l'avancer avant l'heure légale de la prière du matin (<em>as-Soubh</em>), afin que les gens puissent se préparer pour la prière. Cependant, il convient de lancer un <strong>second appel</strong> au moment précis de l'apparition de l'aube, pour que les gens sachent que le temps est entré, que la prière est désormais de mise et que le jeûne commence.</p>
<p><strong>Il est recommandé</strong> à celui qui entend le mouadhin (celui qui appelle à la prière) de lui répondre , en répétant les mêmes paroles que lui.</p>
<p>Cependant ، lorsqu'il dit : <em>Hayya 'alâ-s-salâh , Hayya 'alâ-l-falâh</em> (Accourez à la prière ، accourez au succès ),</p>
<p>on doit dire : «<span dir="rtl">لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِالله</span>ِ» ( Il n'y a de force ni de puissance qu'en Allah ).</p>
<p>Puis ، une fois que le mouadhin a terminé ، on dit :</p>
<p class="ar"><span dir="rtl">«اللَّهُمَّ رَبَّ هَذِهِ الدَّعْوَةِ التَّامَّةِ، وَالصَّلَاةِ القَائِمَةِ، آتِ مُحَمَّدًا الوَسِيلَةَ وَالفَضِيلَةَ، وَابْعَثْهُ المَقَامَ المَحْمُودَ الَّذِي وَعَدْتَهُ»</span></p>
<p>« Ô Allah ، Seigneur de cet appel parfait et de la prière qui va être accomplie ، accorde à Muhammad la place éminente (al-Wassîlah) et la supériorité (al-Fadhîlah) ، et ressuscite-le au rang louable que Tu lui as promis ».</p>
<p>Il est interdit de sortir de la mosquée après l'Adhân sans excuse valable ou sans l'intention d'y revenir. De plus , si le mouadhin commence l'Adhân alors qu'une personne est assise , il ne convient pas qu'elle se lève ; elle doit plutôt patienter jusqu'à la fin de l'appel , afin de ne pas ressembler au Diable.</p>
<p>Le musulman se doit , lorsqu'il entend l'Adhân ، de se diriger vers la mosquée et de délaisser toutes les autres occupations mondaines.</p>
<p>Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿فِي بُيُوتٍ أَذِنَ اللَّهُ أَن تُرْفَعَ وَيُذْكَرَ فِيهَا اسْمُهُ يُسَبِّحُ لَهُ فِيهَا بِالْغُدُوِّ وَالْآصَالِ ۝ رِجَالٌ لَّا تُلْهِيهِمْ تِجَارَةٌ وَلَا بَيْعٌ عَن ذِكْرِ اللَّهِ وَإِقَامِ الصَّلَاةِ وَإِيتَاءِ الزَّكَاةِ يَخَافُونَ يَوْمًا تَتَقَلَّبُ فِيهِ الْقُلُوبُ وَالْأَبْصَارُ﴾ الآيَات [النور].</span></p>
<p>« <em><strong>Dans des maisons (des mosquées) qu'Allah a permis que l'on élève , et où Son Nom est invoqué ; Le glorifient en elles , matin et soir , des hommes que ni le négoce , ni le troc ne distraient de l'invocation d'Allah , de l'accomplissement de la prière et de l'acquittement de la Zakât ; et qui redoutent un jour où les cœurs et les regards seront bouleversés</strong></em> » [Sourate An-Nûr , versets 36-37].</p>
