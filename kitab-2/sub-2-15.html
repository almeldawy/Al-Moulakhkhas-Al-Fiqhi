<p>* Sachez, ô frères, que l'accomplissement des Sunan régulières (Ar-Rawâtib) est fortement recommandé (confirmé) et qu'il est détestable de les délaisser. Quiconque persiste à les délaisser voit sa probité (<em>'Adâlah</em>) s'annuler selon certains imams, et il commet un péché par cela ، car la persistance dans leur délaissement prouve la faiblesse de sa pratique religieuse et son manque de considération [pour ces actes].</p>
<p>* Le nombre total des Sunan régulières est de dix unités de prière (<em>Rak'ât</em>), et leur détail est le suivant :</p>
<ul>
<li><blockquote>
<p>Deux unités de prière avant le <em>Dhouhr</em>. Cependant, selon un groupe de savants, il s'agit de quatre unités avant le <em>Dhouhr</em> ؛ dès lors, le total des Sunan régulières s'élève à douze unités de prière.</p>
</blockquote></li>
</ul>
<ul>
<li><blockquote>
<p>Et deux unités de prière après le <em>Dhouhr</em>.</p>
</blockquote></li>
</ul>
<ul>
<li><blockquote>
<p>Et deux unités de prière après le <em>Maghrib</em>.</p>
</blockquote></li>
</ul>
<ul>
<li><blockquote>
<p>Et deux unités de prière après l'<em>Ishâ'</em>.</p>
</blockquote></li>
</ul>
<ul>
<li><blockquote>
<p>Et deux unités de prière avant la prière du <em>Fajr</em>, après l'apparition de l'aube.</p>
</blockquote></li>
</ul>
<p>La preuve concernant ces prières régulières selon le détail mentionné est le hadith d'Ibn 'Umar (qu'Allah l'agrée, lui et son père) qui a dit : "<em><strong>J'ai mémorisé du Messager d'Allah <span dir="rtl">ﷺ</span> dix unités de prière : deux unités avant le Dhouhr, deux unités après celui-ci, deux unités après le Maghrib dans sa maison, deux unités après l'Ishâ' dans sa maison, et deux unités avant le Soubh. C'était un moment où l'on n'entrait pas chez le Prophète <span dir="rtl">ﷺ</span> ؛ Hafsah m'a rapporté que lorsque le muezzin faisait l'appel et que l'aube se levait ، il [le Prophète] priait deux unités de prière.</strong></em>" Rapporté par Al-Bukhârî et Muslim (1).</p>
<p>* Et dans le "Sahîh Muslim", d'après Aïcha (qu'Allah l'agrée) : "Il [le Prophète <span dir="rtl">ﷺ</span>] priait quatre unités de prière avant le <em>Dhouhr</em> dans ma maison, puis il sortait pour diriger la prière avec les gens, puis il revenait dans ma maison et priait deux unités de prière." (2)</p>
<p>On en déduit de cela que l'accomplissement des prières régulières (<em>Ar-Râtibah</em>) à la maison est meilleur que leur accomplissement à la mosquée. Cela est dû aux bénéfices qui en découlent, notamment : l'éloignement de l'ostentation (<em>Ar-Riyâ'</em>) et de l'autosatisfaction, ainsi que le fait de cacher ses œuvres aux yeux des gens. Parmi ces bénéfices également : cela favorise une parfaite concentration (<em>Khushû'</em>) et la sincérité. De plus, cela permet d'animer la maison par le rappel d'Allah et la prière, ce qui fait descendre la miséricorde sur les habitants de la maison et en éloigne le Diable.</p>
<p>Et le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><strong><span dir="rtl">«اجْعَلُوا مِنْ صَلَاتِكُمْ فِي بُيُوتِكُمْ، وَلَا تَجْعَلُوهَا قُبُوراً»</span></strong></p>
<p><em><strong>"Accomplissez une partie de vos prières dans vos maisons, et ne les transformez pas en tombes." (3)</strong></em></p>
<p>* <strong>La plus importante de ces Sunan régulières est celle des deux unités (<em>Rak'ât</em>) de l'aube (<em>Al-Fajr</em>)</strong> ; en raison de la parole de Aïcha (qu'Allah l'agrée) : "<em><strong>Le Prophète <span dir="rtl">ﷺ</span> n'était pour aucune des prières surérogatoires plus assidu que pour les deux unités de l'aube.</strong></em>" (Rapporté par Al-Bukhârî et Muslim) (4).</p>
<p>Et il [le Prophète] <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><strong><span dir="rtl">«رَكْعَتَا الْفَجْرِ خَيْرٌ مِنَ الدُّنْيَا وَمَا فِيهَا»</span></strong></p>
<p><strong>"<em>Les deux unités de l'aube sont meilleures que ce bas-monde et tout ce qu'il contient.</em>"</strong> (5)</p>
<p>C'est pourquoi le Prophète <span dir="rtl">ﷺ</span> les accomplissait avec constance, ainsi que la prière du <em>Witr</em>, qu'il soit résident [chez lui] ou en voyage.</p>
<p>* Quant aux autres Sunan régulières en dehors des deux unités de l'aube et du <em>Witr</em>, il n'a pas été rapporté que le Prophète <span dir="rtl">ﷺ</span> ait prié une <em>Râtibah</em> (prière régulière) en voyage, à l'exception de la Sunna de l'aube et du <em>Witr</em>.</p>
<p>Et Ibn 'Umar (qu'Allah l'agrée, lui et son père), lorsqu'il fut interrogé sur la Sunna du <em>Dhouhr</em> pendant le voyage, répondit :</p>
<p class="ar"><strong><span dir="rtl">لَوْ كُنْتُ مُسَبِّحاً؛ لَأَتْمَمْتُ</span></strong></p>
<p><em><strong>"Si je devais prier [des prières surérogatoires], j'aurais plutôt accompli ma prière [obligatoire] de manière complète."</strong></em></p>
<p>Et Ibn al-Qayyim (qu'Allah lui fasse miséricorde) a dit (6) : <strong>"<em>Il faisait partie de la pratique guidée du Prophète <span dir="rtl">ﷺ</span>, lors de ses voyages, de se limiter à la prière obligatoire. Il n'a pas été rapporté de lui qu'il priait les sunan (prières facultatives régulières) ni avant ni après les prières obligatoires, à l'exception de la prière du Witr et de la Sunna de l'aube (Fajr).</em>"</strong></p>
<p>* La Sunna consiste à alléger les deux unités de prière de l'aube (<em>Fajr</em>) ; conformément à ce qui est rapporté dans les deux Sahîh [Al-Bukhârî et Muslim] et d'autres, d'après Aïcha (qu'Allah l'agrée) : "<strong><em>Le Prophète <span dir="rtl">ﷺ</span> allégeait les deux unités qui précèdent la prière du matin (As-Soubh).</em>"</strong> (7)</p>
<p>Il récitait dans la première unité de la Sunna du Fajr, après la Fatiha : <strong>"Dis : Ô vous les infidèles" [Sourate Al-Kâfirûn]</strong>, et dans la seconde : <strong>"Dis : Il est Allah, l'Unique" [Sourate Al-Ikhlâs]</strong>.</p>
<p>Ou bien, il récitait dans la première des deux : <strong>"Dites : Nous croyons en Allah et en ce qui nous a été révélé..."</strong> [Sourate Al-Baqarah, verset 136], et dans la seconde unité : <strong>"Dis : Ô gens du Livre, venez à une parole commune entre nous..."</strong> [Sourate Âl 'Imrân, verset 64].</p>
<p>De même, il récitait dans les deux unités après le <em>Maghrib</em> [les sourates] <strong>Al-Kâfirûn</strong> et <strong>Al-Ikhlâs</strong> ; selon ce qu'ont rapporté Al-Bayhaqî, At-Tirmidhî et d'autres d'après Ibn Mas'ûd qui a dit : "Je ne saurais compter le nombre de fois où j'ai entendu le Messager d'Allah <span dir="rtl">ﷺ</span> réciter dans les deux unités après le <em>Maghrib</em> et dans les deux unités avant le <em>Fajr</em> : <strong>'Dis : Ô vous les infidèles'</strong> et <strong>'Dis : Il est Allah, l'Unique'</strong>." (8)</p>
<p>* <strong>Si l'une de ces Sunan régulières (Rawâtib) t’échappe, il t’est recommandé (Sunna) de la rattraper.</strong> De même, si la prière du <em>Witr</em> t’échappe durant la nuit, il t’est recommandé de la rattraper pendant la journée ; car le Prophète <span dir="rtl">ﷺ</span> a rattrapé les deux unités de l'aube (<em>Fajr</em>) en même temps que la prière obligatoire du matin lorsqu'il s'était endormi [et les avait manquées], et il a rattrapé les deux unités qui précèdent le <em>Dhouhr</em> après la prière de l'<em>Asr</em> [lorsqu'il en avait été empêché par une occupation].</p>
<p>Par analogie avec ce qui est explicitement mentionné dans les textes, le reste des Sunan régulières peut également être rattrapé si elles sont manquées.</p>
<p>Le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><strong><span dir="rtl">«مَنْ نَامَ عَنْ وِتْرِهِ أَوْ نَسِيَهُ؛ فَلْيُصَلِّهِ إِذَا أَصْبَحَ أَوْ ذَكَرَ»</span></strong></p>
<p><em><strong>"Quiconque s'endort sans avoir prié le Witr ou l'oublie, qu'il le prie lorsqu'il se réveille ou s'en souvient."</strong></em> (Rapporté par At-Tirmidhî et Abû Dâwûd). (9)</p>
<p><strong>* Le <em>Witr</em> se rattrape en le rendant pair (<em>Shaf'</em>).</strong> Conformément à ce qui est rapporté dans le "Sahîh" d'après Aïcha (qu'Allah l'agrée) : "<em><strong>Lorsque le Prophète <span dir="rtl">ﷺ</span> était empêché de prier la nuit par le sommeil ou la douleur, il priait douze unités de prière pendant la journée.</strong></em>" » <em>(Note du traducteur : On ajoute une unité pour que le total soit pair car le Witr, prière impaire, est spécifique à la nuit).</em></p>
<p>Ô musulman ! Préserve avec assiduité ces Sunan régulières, car cela constitue une imitation du Prophète <span dir="rtl">ﷺ</span>. Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="ltr">﴿</span><strong><span dir="rtl">لَقَدْ كَانَ لَكُمْ فِي رَسُولِ اللَّهِ أُسْوَةٌ حَسَنَةٌ لِمَنْ كَانَ يَرْجُو اللَّهَ وَالْيَوْمَ الْآخِرَ وَذَكَرَ اللَّهَ كَثِيرًا</span></strong><span dir="rtl">﴾ [الأحزاب: ٢١].</span></p>
<p>"<em><strong>En effet, vous avez dans le Messager d'Allah un excellent modèle à suivre, pour quiconque espère en Allah et au Jour dernier et invoque Allah fréquemment.</strong></em>" [Sourate Al-Ahzâb : 21].</p>
<p>De plus, l'assiduité à ces Sunan permet de <strong>compenser les manques et les imperfections</strong> qui surviennent durant la prière obligatoire. L'être humain est sujet à l'erreur et au manque, et il a besoin de ce qui comble ses lacunes. Ne néglige donc pas ces prières régulières, ô musulman, car elles font partie du surplus de bien que tu trouveras auprès de ton Seigneur.</p>
<p>Ainsi, pour chaque obligation, il a été instauré à ses côtés un acte surérogatoire de même nature : comme pour la prière, la Zakat, le jeûne et le Pèlerinage. Chacune de ces obligations s'accompagne d'un acte volontaire qui vient combler ses manques et corriger ses failles. <strong>Cela relève de la grâce d'Allah envers Ses serviteurs</strong> : Il a diversifié pour eux les actes d'obéissance afin d'élever leurs rangs et d'effacer leurs péchés.</p>
<p>Nous demandons donc à Allah pour nous tous la réussite dans ce qu'Il aime et agréé. Certes, Il est Celui qui entend tout et qui exauce !</p>
