<p>Nous avons précédemment exposé un ensemble de règles relatives à la prière surérogatoire، et il convient à présent d'attirer l'attention sur le fait qu'il existe des moments durant lesquels il est interdit d'accomplir la prière؛ à l'exception de ce qui a été exclu (par des preuves spécifiques)، et ces moments sont au nombre de cinq :</p>
<p>* <strong>Le premier :</strong> De l'apparition de l'aube (le second Fajr) jusqu'au lever du soleil. Cela s'appuie sur la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><strong><span dir="rtl">« إِذَا طَلَعَ الفَجْرُ؛ فَلَا تَنْعَقِدُ صَلَاةٌ إِلَّا رَكْعَتَيِ الفَجْرِ »</span></strong></p>
<p>« <em><strong>Quand l'aube se lève, il n'y a plus de prière sauf les deux rak'ats de l'aube (la sunna du Fajr)</strong></em> » [Rapporté par Ahmad, Abou Daoud et d'autres] (1).</p>
<p>Ainsi, une fois l'aube levée, on ne prie pas de prières surérogatoires volontaires, à l'exception de la prière régulière de l'aube (<em>ratibat al-fajr</em>).</p>
<p>* <strong>Le deuxième :</strong> Du lever du soleil jusqu'à ce qu'il s'élève de la hauteur d'une lance à l'œil nu.</p>
<p>* <strong>Le troisième :</strong> Au moment où le soleil est au zénith jusqu'à ce qu'il commence à décliner. Le zénith se reconnaît par l'arrêt de l'ombre (elle ne diminue plus et ne commence pas encore à augmenter vers l'est). Cela est dû à la parole d'Uqbah ibn 'Amir :</p>
<p class="ar"><strong><span dir="rtl">« ثَلَاثُ سَاعَاتٍ كَانَ رَسُولُ اللهِ ﷺ يَنْهَانَا أَنْ نُصَلِّيَ فِيهِنَّ وَأَنْ نَقْبَرَ فِيهِنَّ مَوْتَانَا : حِينَ تَطْلُعُ الشَّمْسُ بَازِغَةً حَتَّى تَرْتَفِعَ، وَحِينَ يَقُومُ قَائِمُ الظَّهِيرَةِ حَتَّى تَزُولَ، وَحِينَ تَتَضَيَّفُ الشَّمْسُ لِلْغُرُوبِ حَتَّى تَغْرُبَ »</span></strong></p>
<p><em><strong>« Il est trois moments durant lesquels le Messager d'Allah <span dir="rtl">ﷺ</span> nous interdisait de prier ou d'enterrer nos morts : quand le soleil se lève explicitement jusqu'à ce qu'il s'élève, quand il est au zénith en plein milieu de la journée jusqu'à ce qu'il décline, et quand le soleil décline vers le couchant jusqu'à ce qu'il se couche »</strong></em> [Rapporté par Muslim] (2).</p>
<p><strong>* Le quatrième :</strong> De la prière de l'Asr jusqu'au coucher du soleil. Ceci d'après la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><strong><span dir="rtl">« لَا صَلَاةَ بَعْدَ الفَجْرِ حَتَّى تَطْلُعَ الشَّمْسُ، وَلَا صَلَاةَ بَعْدَ العَصْرِ حَتَّى تَغِيبَ الشَّمْسُ »</span></strong></p>
<p>« <em><strong>Point de prière après le Fajr jusqu'à ce que le soleil se lève, et point de prière après l'Asr jusqu'à ce que le soleil disparaisse</strong></em> » [Unanimement reconnu authentique] (3).</p>
<p>* <strong>Le cinquième moment :</strong> Lorsque le disque solaire commence à se coucher jusqu'à ce qu'il disparaisse totalement.</p>
<p>* <em><strong>(Note importante :)</strong></em> Il est permis de <strong>rattraper les prières obligatoires manquées</strong> durant ces moments, conformément à la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><strong><span dir="rtl">« مَنْ نَامَ عَنْ صَلَاةٍ أَوْ نَسِيَهَا؛ فَلْيُصَلِّهَا إِذَا ذَكَرَهَا »</span></strong></p>
<p>« <em><strong>Celui qui oublie une prière ou s'endort sans l'avoir faite, qu'il l'accomplisse dès qu'il s'en rappelle.</strong></em> » [Unanimement reconnu authentique] (4).</p>
<h3 id="autres-exceptions-autorisées"><em><strong>(Autres exceptions autorisées)</strong></em></h3>
<p><strong>- Les deux rak'ats du Tawaf :</strong> Il est permis de les accomplir à tout moment, suite à la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><strong><span dir="rtl">« يَا بَنِي عَبْدِ مَنَافٍ ، لَا تَمْنَعُوا أَحَداً طَافَ بِهَذَا البَيْتِ ، وَصَلَّى أَيَّةَ سَاعَةٍ شَاءَ مِنْ لَيْلٍ أَوْ نَهَارٍ »</span></strong></p>
<p>« <em><strong>Ô descendants de 'Abd Manaf ! N'empêchez personne de faire le tour de cette Demeure (la Kaaba) et de prier à l'heure qu'il veut, de nuit comme de jour.</strong></em> » [Rapporté par At-Tirmidhi qui l'a authentifié] (5).</p>
<p><strong>- Les prières ayant une cause spécifique (<em>dhawat al-asbab</em>) :</strong> Selon l'avis le plus correct des savants, il est permis d'accomplir durant ces moments les prières liées à une cause, telles que :</p>
<ul>
<li><blockquote>
<p>La prière funéraire (<em>Janaza</em>).</p>
</blockquote></li>
<li><blockquote>
<p>La salutation de la mosquée (<em>Tahiyat al-Masjid</em>).</p>
</blockquote></li>
<li><blockquote>
<p>La prière de l'éclipse (<em>Kousouf</em>).</p>
</blockquote></li>
</ul>
<p>Ceci en raison des preuves indiquant cela, car elles viennent spécifier la portée générale de l'interdiction de prier durant ces périodes. Par conséquent, l'interdiction porte sur la prière pour laquelle il n'y a aucune caus;؛ il n'est donc pas permis d'entamer une prière surérogatoire absolue (<em>tatawwu'</em>) sans motif durant ces moments.</p>
<p><strong>. Il est permis de rattraper la Sunna du Fajr après la prière du Fajr</strong> (si elle n'a pas été faite avant). De même, il est permis de rattraper la Sunna du Dohr après la prière de l'Asr, particulièrement en cas de regroupement des prières (Dohr et Asr), car il est rapporté que le Prophète <span dir="rtl">ﷺ</span> a rattrapé la Sunna du Dohr après l'Asr.</p>
<h4 id="sources"><strong>Sources:</strong> </h4>
<p>(1) : Ce hadith (concernant l'interdiction après l'aube) a été rapporté par At-Tabarani dans son ouvrage Al-Awsat (sous le numéro 816). On le retrouve également chez l'imam Ahmad (Volume 2, page 104), Abou Daoud (n°1278) et At-Tirmidhi (n°419).</p>
<p>(2) : Rapporté par Muslim (n°831). Il s'agit généralement du hadith d'Uqbah ibn 'Amir sur les trois moments précis de la journée (lever, zénith, coucher).</p>
<p>(3) : Rapporté par Al-Boukhari (n°586) et Muslim (n°827). C'est la référence pour le hadith faisant consensus (Muttafaq 'alayhi) qui interdit la prière après le Fajr et après l'Asr.</p>
<p>(4) : Rapporté par Al-Boukhari (n°597) et Muslim (n°684). Cette référence correspond au hadith sur l'obligation de rattraper une prière oubliée ou manquée à cause du sommeil dès que l'on s'en rappelle.</p>
<p>(5) : Cette longue liste de références concerne le hadith adressé aux descendants de 'Abd Manaf sur l'autorisation de prier et faire le Tawaf à toute heure à la Mecque : At-Tirmidhi (n°868) qui a précisé : « Hadith Hassan Sahih » (Bon et authentique). Abou Daoud (n°1894). An-Nasa'i (n°1561). Ibn Majah (n°1254). Ahmad dans son Musnad (Volume 4, page 80). Ibn Hibban dans son Sahih (n°1553 et 1554). Al-Hakim dans son Mustadrak (Volume 1, page 617) qui a précisé : « Authentique selon les critères de l'imam Muslim ».</p>
