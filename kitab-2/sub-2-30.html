<p>⁕ L'Istisqâ signifie ici le fait de demander l'abreuvement (la pluie) à Allah le Très-Haut ; car les âmes sont naturellement disposées à solliciter celui qui peut les secourir, et c'est Allah Seul. Cela était connu chez les nations passées et fait partie des traditions (Sounan) des prophètes, que la prière et le salut soient sur eux. Allah le Très-Haut a dit :</p>
<p class="ar"><strong><span dir="rtl">﴿وَإِذِ اسْتَسْقَى مُوسَى لِقَوْمِهِ﴾ [البقرة: ٦٠]</span></strong></p>
<p><strong>« Et [rappelez-vous] quand Moïse demanda de l'eau pour son peuple »</strong> [Al-Baqarah : 60].</p>
<p>De même, le sceau des prophètes, notre prophète Muhammad <span dir="rtl">ﷺ</span>، a demandé la pluie pour sa communauté à plusieurs reprises et de diverses manières ، et les musulmans sont unanimes quant à sa légitimité.</p>
<p><strong>⁕ L'Istisqâ est légiféré lorsque la terre devient aride</strong> — c'est-à-dire qu'elle se dessèche — que la pluie cesse de tomber et que cela cause un préjudice aux gens.</p>
<p>Dans cette situation, il n'y a pour eux d'autre issue que de s'humilier devant leur Seigneur, de Lui demander l'abreuvement et de l'appeler au secours par diverses formes de supplications :</p>
<ul>
<li><blockquote>
<p><strong>Parfois par la prière</strong>, qu'elle soit accomplie en groupe ou individuellement.</p>
</blockquote></li>
<li><blockquote>
<p><strong>Parfois par l'invocation (Dou'a) lors du sermon du vendredi</strong> ; l'imam invoque Allah et les musulmans disent « Amine » à sa suite.</p>
</blockquote></li>
<li><blockquote>
<p><strong>Parfois par l'invocation à la suite des prières obligatoires ou dans l'intimité (en privé)</strong>, sans qu'il n'y ait ni prière spécifique ni sermon.</p>
</blockquote></li>
</ul>
<p>Toutes ces formes ont été rapportées d'après le Prophète <span dir="rtl">ﷺ</span>.</p>
<p>⁕ Le statut de la prière de l'Istisqâ est qu'elle est une Sunna confirmée (Sunna Mou'akkada).</p>
<p>Cela s'appuie sur la parole de 'Abdullah ibn Zayd (qu'Allah l'agrée) qui a dit :</p>
<p>« <em><strong>Le Prophète <span dir="rtl">ﷺ</span> est sorti pour demander la pluie ; il s'est alors tourné vers la Qibla en invoquant, il a retourné son manteau (Ridâ'), puis il a prié deux unités de prière (rak'at) au cours desquelles il a récité à voix haute.</strong></em> »</p>
<p>Ce hadith est rapporté par Al-Boukhari et Muslim (unanimement reconnu authentique)<a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a>, et il en existe d'autres similaires.</p>
<p>⁕ La description de la prière de l'Istisqâ, son lieu et ses règles sont identiques à ceux de la prière de l'Aïd. Il est ainsi recommandé de l'accomplir dans le <em>Mousallâ</em> (un espace ouvert à l'extérieur de la ville), tout comme la prière de l'Aïd.</p>
<p>Ses règles sont les mêmes que celles de la prière de l'Aïd concernant :</p>
<ul>
<li><blockquote>
<p><strong>Le nombre d'unités de prière</strong> (deux rak'at).</p>
</blockquote></li>
<li><blockquote>
<p><strong>La récitation à voix haute</strong>.</p>
</blockquote></li>
<li><blockquote>
<p><strong>Le fait qu'elle soit accomplie AVANT le sermon</strong> (khoutba).</p>
</blockquote></li>
<li><blockquote>
<p><strong>Les takbîrs supplémentaires</strong> dans la première et la deuxième rak'at avant la récitation, comme cela a été expliqué précédemment pour la prière de l'Aïd.</p>
</blockquote></li>
</ul>
<p>Ibn 'Abbâs (qu'Allah l'agrée) a dit :</p>
<p>« <em><strong>Le Prophète <span dir="rtl">ﷺ</span> a prié deux rak'at de la même manière qu'il priait pour l'Aïd.</strong></em> » <em>At-Tirmidhi a dit : « C'est un hadith bon et authentique (Hasan Sahîh) », et Al-Hâkim ainsi que d'autres l'ont également authentifié.</em><a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a></p>
<p>⁕ Il [l'imam] récite lors de la première unité de prière (rak'at) la sourate : <em><strong>« Glorifie le nom de ton Seigneur, le Très-Haut »</strong></em> (Sourate Al-A'lâ), <strong>et lors de la seconde, la sourate :</strong> <em><strong>« L'Enveloppante »</strong></em> (Sourate Al-Ghâshiyah).</p>
<p>⁕ <strong>Les habitants de la ville doivent l'accomplir (la prière) en plein désert (en terrain découvert)</strong> ; car le Prophète <span dir="rtl">ﷺ</span> ne l'a jamais accomplie ailleurs que dans le désert, et parce que cela est plus éloquent pour manifester l'indigence et le besoin total envers Allah le Très-Haut.</p>
<p>⁕ <strong>Lorsque l'imam souhaite sortir pour la prière de l'Istisqâ</strong>, il convient que cela soit précédé d'une exhortation des gens par ce qui adoucit leurs cœurs, en leur rappelant la récompense d'Allah et Son châtiment. Il doit leur ordonner de se repentir des péchés et de mettre fin aux injustices en rendant les droits à ceux qui les méritent ؛ car les péchés sont une cause de la rétention de la pluie et de l'interruption des bénédictions ، alors que le repentir et la demande de pardon (Istighfâr) sont des causes de l'exaucement des invocations.</p>
<p>Allah le Très-Haut a dit :</p>
<p class="ar"><strong><span dir="rtl">﴿وَلَوْ أَنَّ أَهْلَ الْقُرَىٰ آمَنُوا وَاتَّقَوْا لَفَتَحْنَا عَلَيْهِم بَرَكَاتٍ مِّنَ السَّمَاءِ وَالْأَرْضِ وَلَٰكِن كَذَّبُوا فَأَخَذْنَاهُم بِمَا كَانُوا يَكْسِبُونَ﴾ [الأعراف: ٩٦]</span></strong></p>
<p><strong>« Si les habitants des cités avaient cru et avaient été pieux, Nous leur aurions certainement ouvert des bénédictions du ciel et de la terre. Mais ils ont crié au mensonge et Nous les avons donc saisis pour ce qu'ils avaient acquis. »</strong> [Al-A'râf : 96].</p>
<p>Il doit aussi leur ordonner de faire l'aumône aux pauvres et aux nécessiteux ؛ car cela est une cause de miséricorde.</p>
<p>Ensuite, il leur fixe un jour pour sortir afin qu'ils se préparent et s'apprêtent pour cette noble occasion selon la description rapportée par la Sounna.</p>
<p>Ils sortent alors au rendez-vous fixé vers le <em>Mousallâ</em> avec humilité ، modestie et en manifestant leur total besoin envers Allah le Très-Haut.</p>
<p>Et ce, conformément à la parole d'Ibn 'Abbâs (qu'Allah l'agrée) : <strong>« <em>Le Prophète <span dir="rtl">ﷺ</span> est sorti pour la demande de pluie d'une manière humble, modeste, recueillie et implorante.</em> »</strong> At-Tirmidhi a dit : « C'est un hadith bon et authentique ».<a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a></p>
<p>Il convient qu'aucun musulman capable de sortir ne reste en arrière ، y compris les enfants et les femmes pour lesquelles on ne craint pas de tentation (fitna) par leur sortie.</p>
<p>L'imam dirige ensuite la prière avec eux en deux unités (rak'at) comme mentionné précédemment , puis il prononce <strong>un seul sermon</strong>.</p>
<p>Certains savants sont d'avis qu'il doit en prononcer deux , et la question est souple (le choix est large) , mais se limiter à un seul sermon est plus prépondérant au regard des preuves.</p>
<p>De même, le fait que le sermon ait lieu <strong>après la prière</strong> de l'Istisqâ correspond à la pratique la plus fréquente du Prophète <span dir="rtl">ﷺ</span> et c'est ce que les musulmans ont continué à pratiquer. Cependant, il a été rapporté qu'il <span dir="rtl">ﷺ</span> a parfois fait le sermon avant la prière , et certains savants ont suivi cet avis , mais le premier est plus prépondérant. Et Allah est plus Savant.</p>
<p>⁕ <strong>Il convient de multiplier, lors du sermon de l'Istisqâ, les demandes de pardon (Istighfâr)</strong> ainsi que la récitation des versets qui l'ordonnent ؛ car c'est une cause de la descente de la pluie.</p>
<p>L'imam doit également multiplier les invocations pour demander la pluie à Allah le Très-Haut, <strong>en levant les mains</strong> ؛ car le Prophète <span dir="rtl">ﷺ</span> levait ses mains lors de ses invocations pour l'Istisqâ, au point que l'on voyait la blancheur de ses aisselles.</p>
<p>Il doit prier sur le Prophète <span dir="rtl">ﷺ</span> (la Salât 'ala an-Nabi) ؛ car cela fait partie des causes d'exaucement des prières.</p>
<p>Il doit utiliser les invocations rapportées du Prophète <span dir="rtl">ﷺ</span> pour cette circonstance précise ، afin de suivre son exemple.</p>
<p>Allah le Très-Haut a dit :</p>
<p class="ar"><strong><span dir="rtl">﴿لَّقَدْ كَانَ لَكُمْ فِي رَسُولِ اللَّهِ أُسْوَةٌ حَسَنَةٌ لِّمَن كَانَ يَرْجُو اللَّهَ وَالْيَوْمَ الْآخِرَ﴾ [الأحزاب : ٢١] .</span></strong></p>
<p><strong>« En effet, vous avez dans le Messager d'Allah un excellent modèle [à suivre], pour quiconque espère en Allah et au Jour dernier. »</strong> [Al-Ahzâb : 21].</p>
<p>⁕ <strong>Il est recommandé (Sunna) de faire face à la Qibla à la fin de l'invocation et de retourner son manteau (<em>Ridâ'</em>)</strong> ; il place ainsi la partie droite sur l'épaule gauche et la partie gauche sur l'épaule droite. Il en va de même pour les vêtements similaires au manteau, comme la <em>'Abâ'ah</em> ou autre.</p>
<p>Cela s'appuie sur ce qui est rapporté dans les deux recueils authentiques (<em>Al-Boukhari et Muslim</em>) : <strong>« <em>Le Prophète <span dir="rtl">ﷺ</span> a tourné le dos aux gens, s'est face à la Qibla pour invoquer, puis a retourné son manteau...</em> »</strong><a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a></p>
<p>La sagesse derrière cela — et Allah est plus Savant — est <strong>l'optimisme quant au changement de situation</strong> : passer de la détresse (sécheresse) à l'aisance et à la descente de la pluie.</p>
<p>Les gens (l'assemblée) doivent également retourner leurs manteaux, car l'Imam Ahmad a rapporté : <strong>« <em>Et les gens ont retourné leurs manteaux avec lui</em> »</strong><a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a>. De plus, ce qui est établi comme règle pour le Prophète <span dir="rtl">ﷺ</span> l'est aussi pour sa communauté, à moins d'une preuve indiquant que cela lui était exclusif.</p>
<p>Enfin, si Allah accorde la pluie aux musulmans (tant mieux), <strong>sinon, ils recommencent l'Istisqâ une deuxième et une troisième fois</strong>, car le besoin l'exige.</p>
<p>⁕ <strong>Lorsque la pluie tombe, il est recommandé (Sunna) de s'exposer à son début</strong> afin qu'elle nous touche, et de dire :</p>
<p class="ar"><span dir="rtl">«اللَّهُمَّ صَيِّباً نَافِعاً»</span></p>
<p><em>« Ô Allah, fais que ce soit une pluie abondante et bénéfique »</em></p>
<p>On doit aussi dire :</p>
<p class="ar"><span dir="rtl">«مُطِرْنَا بِفَضْلِ اللهِ وَرَحْمَتِهِ»</span></p>
<p><em>« Nous avons reçu la pluie par la grâce d'Allah et Sa miséricorde. »</em></p>
<p>⁕ <strong>Si les eaux augmentent au point que l'on craigne un préjudice</strong>, il est recommandé de dire :</p>
<p class="ar"><span dir="rtl">«اللَّهُمَّ حَوَالَيْنَا وَلَا عَلَيْنَا، اللَّهُمَّ عَلَى الظِّرَابِ وَالآكَامِ وَبُطُونِ الأَوْدِيَةِ وَمَنَابِتِ الشَّجَرِ»</span></p>
<p>« <em>Ô Allah, [fais qu'elle tombe] autour de nous et non sur nous. Ô Allah, sur les collines, les monticules, les lits des vallées et les lieux où poussent les arbres.</em> »</p>
<p>Car c'est ainsi que le Prophète <span dir="rtl">ﷺ</span> disait (Hadith faisant l'unanimité). Et Allah est plus Savant.</p>
