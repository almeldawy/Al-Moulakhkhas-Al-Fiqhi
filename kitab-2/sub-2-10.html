<p>Puisque l'être humain est sujet à l'oubli et à la distraction, et que le Diable s'acharne à perturber sa prière en suscitant des pensées et en occupant son esprit afin de l'en détourner، il arrive que cela entraîne un manque ou un surplus dans la prière par l'effet de l'oubli et de l'inattention. Allah a donc légiféré pour le prieur d'accomplir deux prosternations à la fin de sa prière؛ ceci afin de remédier à cela, de contrarier le Diable, de compenser le manque et de satisfaire le Tout-Miséricordieux. Cette prosternation est ce que les savants appellent : la prosternation de l'oubli (Sujûd as-Sahw).</p>
<p>L'inattention (<em>As-Sahw</em>), c'est l'oubli. Le Prophète <span dir="rtl">ﷺ</span> a effectivement eu des oublis durant la prière, et son oubli faisait partie de la complétude des bienfaits d'Allah sur sa communauté et de la perfection de leur religion ; afin qu'ils l'imitent dans ce qu'il a légiféré pour eux en cas d'oubli.</p>
<p>En effet, on a mémorisé de lui <span dir="rtl">ﷺ</span> plusieurs cas d'oubli durant la prière :</p>
<ul>
<li><blockquote>
<p>Il a fait la salutation finale (<em>taslim</em>) après seulement deux unités de prière (<em>rak'ah</em>), puis s'est prosterné.</p>
</blockquote></li>
<li><blockquote>
<p>Il a fait la salutation après trois unités, puis s'est prosterné.</p>
</blockquote></li>
<li><blockquote>
<p>Il s'est levé après deux unités sans effectuer le premier témoignage (<em>tashahhud</em>), puis s'est prosterné (1).</p>
</blockquote></li>
<li><blockquote>
<p>Et d'autres cas encore.</p>
</blockquote></li>
</ul>
<p>Et il <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><strong><span dir="rtl">«إِذَا سَهَا أَحَدُكُمْ؛ فَلْيَسْجُدْ»</span></strong></p>
<p><em><strong>« Si l'un de vous oublie, qu'il se prosterne »</strong> (2).</em></p>
<p>La prosternation de l'oubli est légiférée pour l'une des trois raisons suivantes :</p>
<ol type="1">
<li><blockquote>
<p><strong>Premièrement :</strong> S'il y a eu un <strong>ajout</strong> dans la prière par oubli.</p>
</blockquote></li>
<li><blockquote>
<p><strong>Deuxièmement :</strong> S'il y a eu un <strong>manque</strong> dans la prière par oubli.</p>
</blockquote></li>
<li><blockquote>
<p><strong>Troisièmement :</strong> S'il y a eu un <strong>doute</strong> concernant un ajout ou un manque.</p>
</blockquote></li>
</ol>
<p>Il [le prieur] se prosterne donc pour l'une de ces trois raisons conformément à ce qui a été rapporté dans les preuves (textes religieux), et non pour n'importe quel ajout, manque ou doute.</p>
<p>La prosternation de l'oubli est légiférée dès lors que sa cause est présente, que la prière soit <strong>obligatoire</strong> (<em>farîdah</em>) ou <strong>surérogatoire</strong> (<em>nâfilah</em>) ; et ce, en raison de la portée générale des preuves [textuelles].</p>
<p><strong>Le premier cas parmi ceux pour lesquels la prosternation de l'oubli est légiférée est celui de l'ajout (<em>Az-Ziyâdah</em>) dans la prière. Il peut s'agir d'un ajout d'actes ou d'un ajout de paroles.</strong></p>
<p><strong>– L'ajout d'actes :</strong> Lorsqu'il s'agit d'un ajout de la même nature que les gestes de la prière, comme se tenir debout au moment de s'asseoir, s'asseoir au moment de se tenir debout, ou ajouter une inclinaison (<em>rukoo'</em>) ou une prosternation (<em>sujood</em>). S'il fait cela par oubli, il doit accomplir la prosternation de l'oubli, conformément à la parole du Prophète <span dir="rtl">ﷺ</span> dans le hadith d'Ibn Mas'ûd :</p>
<p class="ar"><strong><span dir="rtl">«إِنْ زَادَ الرَّجُلُ أَوْ نَقَصَ فِي صَلَاتِهِ؛ فَلْيَسْجُدْ سَجْدَتَيْنِ»، رَوَاهُ مُسْلِمٌ</span></strong></p>
<p><em><strong>« Si l'homme ajoute ou diminue dans sa prière, qu'il accomplisse deux prosternations » (rapporté par Muslim). (3)</strong></em></p>
<p>De plus, l'ajout dans la prière constitue, au sens figuré, une altération de sa forme initiale ; la prosternation a donc été légiférée pour compenser ce manque.</p>
<p>De même, s'il ajoute par oubli une unité entière (<em>rak'ah</em>) et ne s'en rend compte qu'après l'avoir terminée, il doit se prosterner pour l'oubli. En revanche, s'il s'en aperçoit pendant l'unité supplémentaire, il doit s'asseoir immédiatement, réciter le <em>Tashahhud</em> s'il ne l'avait pas encore fait, puis se prosterner pour l'oubli et faire la salutation finale (<em>Taslim</em>).</p>
<p>S'il est l'imam, ceux parmi les fidèles qui remarquent l'ajout doivent l'en avertir : les hommes en disant <em>« Subhân Allâh »</em> et les femmes en frappant dans leurs mains. L'imam est alors tenu de suivre leur avertissement s'il n'est pas absolument certain d'avoir raison, car c'est un retour vers la vérité. Ils doivent également l'avertir en cas de manque.</p>
<p><strong>– L'ajout de paroles :</strong> Comme réciter le Coran pendant l'inclinaison ou la prosternation, ou lire une sourate [après la Fatiha] lors des deux dernières unités d'une prière de quatre, ou lors de la troisième de la prière du Maghrib. S'il fait cela par oubli, il lui est <strong>recommandé</strong> (<em>mustahabb</em>) d'accomplir la prosternation de l'oubli.</p>
<p><strong>Quant au deuxième cas, il s'agit du manque dans la prière par oubli, par le fait d'en avoir délaissé un élément :</strong></p>
<p>Si l'élément délaissé est un <strong>pilier</strong> (<em>Rukn</em>) et que ce pilier est la <strong>Takbîrat al-Ihrâm</strong> (le premier "Allahu Akbar" qui ouvre la prière), alors sa prière n'a même pas commencé (elle est invalide dès le départ) et la prosternation de l'oubli ne peut en aucun cas compenser cela.</p>
<p>Si l'élément délaissé est un pilier <strong>autre que</strong> la Takbîrat al-Ihrâm — comme l'inclinaison (<em>Rukû'</em>) ou la prosternation (<em>Sujûd</em>) — et qu'il se rappelle de cet oubli <strong>avant</strong> d'avoir commencé la récitation de l'unité (<em>Rak'ah</em>) suivante :</p>
<ul>
<li><blockquote>
<p>Il a l'obligation de revenir en arrière pour accomplir ce pilier, puis de poursuivre ce qui vient après.</p>
</blockquote></li>
</ul>
<p>S'il s'en rappelle <strong>après</strong> avoir commencé la récitation de l'unité suivante :</p>
<ul>
<li><blockquote>
<p>L'unité de prière où le pilier a été oublié devient <strong>caduque (annulée)</strong>.</p>
</blockquote></li>
<li><blockquote>
<p>L'unité de prière actuelle prend alors la place de l'unité annulée. Ceci car il a délaissé un pilier qu'il ne peut plus rattraper, étant donné qu'il s'est déjà engagé dans l'unité suivante.</p>
</blockquote></li>
</ul>
<p>S'il ne se rend compte du pilier délaissé qu'<strong>après la salutation finale</strong> : cela est considéré comme l'omission d'une unité de prière (<em>rak'ah</em>) complète.</p>
<ul>
<li><blockquote>
<p>Si le temps écoulé est court et qu'il est toujours en état de pureté (<em>Woudou</em>), il accomplit une unité complète, fait la prosternation de l'oubli, puis salue.</p>
</blockquote></li>
<li><blockquote>
<p>Si le temps écoulé est long ou si ses ablutions ont été rompues, il doit recommencer la prière depuis le début.</p>
</blockquote></li>
<li><blockquote>
<p><strong>Exception :</strong> Si l'élément délaissé est le dernier <em>Tashahhud</em> ou la salutation finale, cela n'est pas considéré comme l'omission d'une unité complète ; il lui suffit de l'accomplir, de se prosterner [pour l'oubli] et de saluer.</p>
</blockquote></li>
</ul>
<p>S'il oublie le <strong>premier Tashahhud</strong> et se lève pour la troisième unité :</p>
<ol type="1">
<li><blockquote>
<p>Il est tenu de redescendre pour l'accomplir tant qu'il n'est pas <strong>complètement redressé</strong> debout.</p>
</blockquote></li>
<li><blockquote>
<p>S'il est complètement redressé debout, il est <strong>déconseillé</strong> (<em>makrouh</em>) de redescendre. S'il redescend tout de même, sa prière n'est pas annulée.</p>
</blockquote></li>
<li><blockquote>
<p>S'il a commencé la <strong>récitation [de la Fatiha]</strong>, il lui est <strong>interdit</strong> (<em>haram</em>) de redescendre, car il est désormais engagé dans un autre pilier qu'il ne doit pas interrompre.</p>
</blockquote></li>
</ol>
<p>S'il oublie la glorification (<em>Tasbih</em>) pendant l'inclinaison ou la prosternation : il est tenu de revenir pour l'accomplir tant qu'il ne s'est pas redressé debout dans l'unité suivante. Dans tous ces cas, il doit effectuer la prosternation de l'oubli.</p>
<p><strong>Quant au troisième cas — qui est celui du doute (<em>Ash-Shakk</em>) pendant la prière — :</strong></p>
<p>S'il doute du <strong>nombre d'unités (<em>rak'ahs</em>)</strong> accomplies — par exemple s'il hésite entre avoir prié deux ou trois unités — il doit se baser sur le nombre le plus petit, car c'est la seule certitude. Ensuite, il effectue la prosternation de l'oubli <strong>avant</strong> la salutation finale (<em>taslîm</em>). En effet, la règle de base est de considérer que l'élément faisant l'objet du doute n'a pas eu lieu. Cela s'appuie sur le hadith d'Abd al-Rahmân ibn 'Awf :</p>
<p class="ar"><strong><span dir="rtl">«إِذَا شَكَّ أَحَدُكُمْ فِي صَلَاتِهِ، فَلَمْ يَدْرِ وَاحِدَةً صَلَّى أَم ثِنْتَيْنِ؛ فَلْيَجْعَلْهَا وَاحِدَةً، وَإِذَا لَم يَدْرِ ثِنْتَيْنِ صَلَّى أَوْ ثَلَاثاً؛ فَلْيَجْعَلْهَا ثِنْتَيْنِ»، رَوَاهُ أَحْمَدُ وَمُسْلِمٌ وَالتِّرْمِذِيُّ</span></strong></p>
<p><em><strong>« Si l'un de vous a un doute pendant sa prière et ne sait plus s'il a prié une ou deux unités, qu'il considère n'en avoir fait qu'une. Et s'il ne sait plus s'il en a prié deux ou trois, qu'il considère n'en avoir fait que deux » (Rapporté par Ahmad, Muslim et al-Tirmidhî). (4)</strong></em></p>
<p>Si le <strong>fidèle (priant derrière un imam)</strong> doute : est-il entré en prière avec l'imam lors de la première ou de la deuxième unité ? Il doit considérer que c'est la deuxième. S'il doute : a-t-il rattrapé l'inclinaison (et donc l'unité) ou non ? Il ne compte pas cette unité et effectue la prosternation de l'oubli.</p>
<p>Si le fidèle doute d'avoir <strong>délaissé un pilier (<em>rukn</em>)</strong>, on traite cela comme s'il l'avait réellement délaissé : il doit donc l'accomplir ainsi que ce qui suit, selon les détails mentionnés précédemment.</p>
<p>En revanche, s'il doute d'avoir <strong>délaissé une obligation (<em>wâjib</em>)</strong>, il ne tient pas compte de ce doute et ne se prosterne pas pour l'oubli. De même, s'il doute d'avoir effectué un <strong>ajout</strong>, il ne prête aucune attention à ce doute, car la règle de base est l'absence d'ajout.</p>
<p>Ceci constitue un ensemble de règles relatives à la prosternation de l'oubli. Quiconque souhaite davantage de précisions [ou approfondir le sujet] doit se référer aux ouvrages de jurisprudence (<em>Kutub al-Ahkâm</em>). Et c'est Allah qui accorde le succès.</p>
<h4 id="sources"><strong>Sources:</strong> </h4>
<p>(1) Voir : « Sahih al-Bukhari » (n° 829), et Muslim (n° 570).</p>
<p>(2) Rapporté par Ibn Khuzaymah (n° 1055), et il figure dans [le Sahih de] Muslim (n° 572 / 94) avec les termes : « il a oublié » (nasiya).</p>
<p>(3) Rapporté par Muslim (572) (96).</p>
<p>(4) Rapporté par Ahmad (1/190) et la formulation lui appartient ; et par sa voie [rapporté par] « Al-Diyâ’ » (899), et par la voie de Abû Ya'lâ (900), Al-Tirmidhî (398), Ibn Mâjah (1209). Al-Dhahabî l'a déclaré « bon » (hassan) dans « Al-Siyar » (1/72). Il se trouve également chez Muslim, d'après le hadith d'Abû Sa'îd, sous le numéro (571).</p>
