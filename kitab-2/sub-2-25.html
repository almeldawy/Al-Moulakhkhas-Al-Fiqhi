<p>⁕ L'imam porte une immense responsabilité et il est garant [de la prière de ceux qu'il dirige]. Il obtiendra un bien abondant s'il agit avec excellence. Le mérite de l'imamat est célèbre ; le Prophète <span dir="rtl">ﷺ</span> ainsi que ses califes l'ont assumée, et ils ne choisissaient pour cette fonction que les meilleurs.</p>
<p>Il est rapporté dans le hadith :</p>
<p class="ar"><strong><span dir="rtl">« ثَلَاثَةٌ عَلَى كُثْبَانِ المِسْكِ يَوْمَ القِيَامَةِ: رَجُلٌ أَمَّ قَوْماً وَهُمْ بِهِ رَاضُونَ... »</span></strong> </p>
<p>« <em><strong>Trois personnes seront sur des dunes de musc le Jour de la Résurrection : un homme qui a dirigé un peuple en prière alors qu'ils étaient satisfaits de lui...</strong></em> » <a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a>.</p>
<p>Et dans un autre hadith, il est mentionné qu'il a une récompense semblable à celle de tous ceux qui prient derrière lui.</p>
<p>⁕ <strong>Celui qui se sait compétent pour l'imamat, rien ne l'empêche de la solliciter.</strong> En effet, l'un des compagnons a dit au Prophète <span dir="rtl">ﷺ</span> : « <em><strong>Désigne-moi comme imam pour mon peuple.</strong></em> »</p>
<p>Il <span dir="rtl">ﷺ</span> répondit :</p>
<p class="ar"><strong><span dir="rtl">« أَنْتَ إِمَامُهُمْ، وَاقْتَدِ بِأَضْعَفِهِمْ »</span></strong></p>
<p>« <em><strong>Tu es leur imam، et prends en considération le plus faible d'entre eux.</strong></em> ». <a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a></p>
<p>Cela est également appuyé par la parole d'Allah le Très-Haut :</p>
<p class="ar"><strong><span dir="rtl">﴿وَاجْعَلْنَا لِلْمُتَّقِينَ إِمَامًا﴾</span></strong></p>
<p>« <em><strong>...et fais de nous un guide (imam) pour les pieux.</strong></em> » [Sourate Al-Furqan : 74].</p>
<p>⁕ <strong>Il convient à celui qui assume l'imamat d'y accorder une grande importance et de s'en acquitter au mieux</strong>, selon ses capacités. Il obtiendra pour cela une immense récompense.</p>
<p>Il doit prendre en considération la situation des fidèles (<strong>Al-Ma'mûmîn</strong>), évaluer leurs circonstances et éviter de les mettre en difficulté. Il doit les encourager et non les faire fuir, conformément à la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><strong><span dir="rtl">« إِذَا صَلَّى أَحَدُكُمْ بِالنَّاسِ فَلْيُخَفِّفْ ، فَإِنَّ فِيهِمُ السَّقِيمَ وَالضَّعِيفَ وَذَا الْحَاجَةِ ، وَإِذَا صَلَّى لِنَفْسِهِ فَلْيُطَوِّلْ مَا شَاءَ »</span></strong></p>
<p><strong>« <em>Quand l'un d'entre vous dirige la prière pour les gens, qu'il l'allège, car il y a parmi eux le malade, le faible et celui qui a une nécessité à accomplir. Et lorsqu'il prie seul, qu'il prolonge autant qu'il le souhaite.</em> »</strong> <em>(Rapporté par l'ensemble du groupe [Al-Jama'ah] d'après le hadith d'Abû Hurayrah).</em> <a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a></p>
<p>On trouve également dans le <em>Sahîh</em> (Boukhari/Muslim), d'après le hadith d'Abî Mas'ûd :</p>
<p class="ar"><strong><span dir="rtl">« أَيُّهَا النَّاسُ ! إِنَّ مِنْكُمْ مُنَفِّرِينَ ؛ فَأَيُّكُمْ أَمَّ النَّاسَ فَلْيُوجِزْ ؛ فَإِنَّ فِيهِمُ الضَّعِيفَ وَالْكَبِيرَ وَذَا الْحَاجَةِ »</span></strong></p>
<p><strong>« <em>Ô gens ! Il y a certes parmi vous des personnes qui font fuir les autres. Quiconque parmi vous dirige la prière pour les gens, qu'il soit bref [concis], car il y a parmi eux le faible, le âgé et celui qui a une nécessité.</em> »</strong> <a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a></p>
<p>L'un des compagnons a dit :</p>
<p class="ar"><strong><span dir="rtl">« مَا صَلَّيْتُ خَلْفَ إِمَامٍ قَطُّ أَخَفَّ صَلَاةً وَلَا أَتَمَّ صَلَاةً مِنَ النَّبِيِّ ﷺ »</span></strong></p>
<p><strong>« Je n'ai jamais prié derrière un imam une prière plus légère et plus complète que celle du Prophète <span dir="rtl">ﷺ</span>. »</strong></p>
<p>Il est l'exemple à suivre en cela, comme pour tout le reste.<a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a></p>
<p>Le Hâfidh [Ibn Hajar] a dit : « <em>Quiconque suit la voie du Prophète <span dir="rtl">ﷺ</span> en matière de brièveté (Iyjâz) et de complétude (Itmâm), on ne se plaindra pas de la longueur de sa prière. L'allègement requis est celui qui est accompagné de l'accomplissement complet de la prière, en exécutant ses piliers (Arkân), ses obligations (Wâjibât) et ses sounan (Sunan) de la manière requise. L'allègement commandé est une notion relative qui se réfère à ce que le Prophète <span dir="rtl">ﷺ</span> faisait, ce sur quoi il a été assidu et ce qu'il a ordonné ; il ne se réfère pas aux désirs [ou passions] des fidèles (Shahwat al-Ma'mûmîn).</em> »</p>
<p>Certains savants ont dit : « <em>Le sens de l'allègement requis est de se limiter au minimum de la perfection dans les glorifications (Tasbîh) et les autres piliers de la prière. Le minimum de la perfection dans le Tasbîh lors de l'inclinaison (Rukû') et de la prosternation (Sujûd) consiste à accomplir trois glorifications.</em> <em>Cependant, si les fidèles préfèrent la prolongation (<strong>At-Tatwîl</strong>) et que leur nombre est limité (déterminé), de sorte qu'ils soient tous unanimes pour demander une prière plus longue, alors il n'y a pas de mal à ce que l'imam prolonge la prière. En effet, dans ce cas précis, la cause de nuisance (le fait de faire fuir les gens par la longueur) disparaît.</em>»</p>
<p>L’imam Ibn Daqiq al-’Id a dit <a href="#fn6" class="footnote-ref" id="fnref6" role="doc-noteref"><sup>6</sup></a>: « <em>La parole des juristes (Al-Fuqaha) disant : "L’imam ne doit pas ajouter plus de trois glorifications dans l'inclinaison et la prosternation" ne contredit pas ce qui a été rapporté au sujet du Prophète <span dir="rtl">ﷺ</span>, à savoir qu’il ajoutait parfois davantage. En effet, le désir des Compagnons pour le bien [et l'adoration] impliquait que cela ne soit pas considéré [à leurs yeux] comme une prolongation excessive.</em> » Fin de citation.</p>
<p>Cheikh al-Islâm Ibn Taymiyya a dit <a href="#fn7" class="footnote-ref" id="fnref7" role="doc-noteref"><sup>7</sup></a>: « <em>Il ne lui appartient pas [à l'imam] d'ajouter au-delà de la mesure prescrite (Al-Mashrû'). Il convient qu'il accomplisse la plupart du temps ce que le Prophète <span dir="rtl">ﷺ</span> faisait habituellement. Il peut cependant augmenter ou diminuer [cette mesure] en fonction de l'intérêt général (Al-Maslahah), tout comme le Prophète <span dir="rtl">ﷺ</span> augmentait ou diminuait parfois selon l'intérêt visé.</em> »</p>
<p>L'imam An-Nawawi a dit <a href="#fn8" class="footnote-ref" id="fnref8" role="doc-noteref"><sup>8</sup></a>: « <em>Les savants ont dit : la variation de la longueur de la récitation rapportée dans les hadiths dépendait des circonstances. Le Prophète <span dir="rtl">ﷺ</span> savait que, par moments, les croyants préféraient une prière longue, il la prolongeait donc avec eux. À d'autres moments, il savait qu'ils ne le souhaitaient pas à cause d'une excuse (un empêchement) ou autre, il l'allégeait alors. Parfois même, il entamait la prière avec l'intention de la prolonger, puis il entendait les pleurs d'un enfant et l'allégeait, comme cela est authentifié dans le Sahîh</em><a href="#fn9" class="footnote-ref" id="fnref9" role="doc-noteref"><sup>9</sup></a><em>.</em> » Fin de citation.</p>
<p>⁕ <strong>Il est détestable (</strong> <em>Makrûh</em> <strong>) que l'imam allège la prière au point d'empêcher le fidèle (</strong> <em>Al-Ma'mûm</em> <strong>) d'accomplir ce qui est recommandé (</strong> <em>Al-Masnûn</em> <strong>).</strong></p>
<p>Par exemple :</p>
<ul>
<li><blockquote>
<p>Empêcher le fidèle de lire une sourate (après la Fatiha).</p>
</blockquote></li>
<li><blockquote>
<p>L'empêcher de prononcer les trois glorifications (<strong>Tasbîh</strong>) lors de l'inclinaison (<strong>Rukû'</strong>) et de la prosternation (<strong>Sujûd</strong>).</p>
</blockquote></li>
</ul>
<p>⁕ <strong>Il est recommandé (Sunna) qu’il [l’imam] récite avec psalmodie et qu’il prenne son temps lors des glorifications (Tasbîh) et du Tashahhud</strong>، de manière à permettre à ceux qui sont derrière lui d’accomplir les actes recommandés tels que les glorifications et autres، et de pouvoir effectuer correctement leur inclinaison et leur prosternation.</p>
<p>⁕ Il est recommandé (Sunna) pour l'imam de prolonger la première unité de prière (Rak'ah) ; en raison de la parole d'Abu Qatadah : "<em><strong>Le Prophète <span dir="rtl">ﷺ</span> prolongeait la première Rak'ah.</strong></em>" (Al-Bukhari et Muslim)<a href="#fn10" class="footnote-ref" id="fnref10" role="doc-noteref"><sup>10</sup></a>.</p>
<p>⁕ <strong>Il est recommandé à l'imam</strong>, s'il ressent l'arrivée de quelqu'un alors qu'il est en position d'inclinaison (<em>Rukūʿ</em>), de prolonger celle-ci afin que l'arrivant puisse le rejoindre et ainsi rattraper la <em>Rak'ah</em> (l'unité de prière). Cela constitue une aide pour lui.</p>
<p>Ceci se base sur ce qu'ont rapporté Ahmad et Abou Daoud, d'après le Hadith d'Ibn Abi Awfa décrivant la prière du Prophète <span dir="rtl">ﷺ</span> : <strong>"Il restait debout dans la première Rak'ah de la prière du Dhuhr jusqu'à ce qu'il n'entende plus de bruits de pas."</strong><a href="#fn11" class="footnote-ref" id="fnref11" role="doc-noteref"><sup>11</sup></a></p>
<p>Ceci est valable tant que cette attente ne cause pas de gêne aux fidèles déjà présents (<em>Ma'mūm</em>). Si cela leur devient pénible, l'imam doit y renoncer, car le droit (le respect dû) de celui qui est déjà en prière avec lui est prioritaire sur le droit de celui qui ne l'a pas encore rejoint.</p>
<p><strong>En résumé</strong>, il est du devoir de l'imam de prendre en compte la situation des fidèles (<em>Ma’mūmīn</em>), de veiller à accomplir la prière de manière complète et parfaite, en suivant la guidance du Prophète <span dir="rtl">ﷺ</span> et en mettant en pratique ses conseils et ses ordres ; c'est en cela que réside le bien pour tous.</p>
<p>⁕ <strong>Cependant, certains imams se montrent négligents</strong> vis-à-vis de la fonction d'imamat et de sa responsabilité. Ils s'absentent souvent de la mosquée ou arrivent en retard, ce qui met les fidèles dans l'embarras, provoque des divisions et perturbe les prieurs. Un tel imam devient un mauvais exemple pour les paresseux et ceux qui manquent de sens des responsabilités.</p>
<p>Il est donc impératif de <strong>réprimander un tel individu</strong> (de le ramener à l'ordre) jusqu'à ce qu'il accomplisse sa mission avec fermeté, afin qu'il ne fasse pas fuir les fidèles et n'entrave pas le bon fonctionnement de la mosquée. S'il ne retrouve pas la raison, il doit être écarté de l'imamat.</p>
<p>Ô Allah, accorde-nous la réussite dans ce que Tu aimes et agrées.</p>
