<p>*</p>
<p>* Sache, ô musulman, qu'il a été rapporté de nombreux hadiths concernant la prière de Douhâ :</p>
<p>Parmi ceux-là, ce qui figure dans les « Deux Authentiques » (Al-Bukhari et Muslim), d'après Abu Hurayrah (qu'Allah l'agrée) qui a dit :</p>
<p class="ar"><strong><span dir="rtl">«أَوْصَانِي خَلِيلِي رَسُولُ اللهِ ﷺ بِثَلَاثٍ : صِيَامِ ثَلَاثَةِ أَيَّامٍ مِنْ كُلِّ شَهْرٍ ، وَرَكْعَتِي الضُّحَى ، وَأَنْ أُوتِرَ قَبْلَ أَنْ أَنَامَ» .</span></strong></p>
<p>« <em><strong>Mon ami intime, le Messager d'Allah <span dir="rtl">ﷺ</span>, m'a recommandé trois choses : le jeûne de trois jours par mois, les deux unités de prière de Douhâ, et de prier le Witr avant de m'endormir.</strong></em> » (1)</p>
<p>Et dans le hadith d'Abu Sa'id : « Le Prophète <span dir="rtl">ﷺ</span> priait le Douhâ au point que nous nous disions : "<em><strong>Il ne la délaisse plus</strong></em>" ، et il la délaissait au point que nous nous disions : "<em><strong>Il ne la prie plus</strong></em>". » (2)</p>
<p>* <strong>Le minimum</strong> pour la prière de Douhâ est de deux unités de prière (rak'at) ، conformément à la parole du Prophète <span dir="rtl">ﷺ</span> dans le hadith d'Abu Hurayrah cité précédemment : « <em><strong>...et les deux unités de prière de Douhâ</strong></em> ».</p>
<p>Également selon le hadith d'Anas :</p>
<p class="ar"><strong><span dir="rtl">«مَنْ قَعَدَ فِي مُصَلَّاهُ حِينَ يَنْصَرِفُ مِنَ الصُّبْحِ ، حَتَّى يُسَبِّحَ رَكْعَتِي الضُّحَى ، لَا يَقُولُ إِلَّا خَيْراً ؛ غُفِرَتْ لَهُ خَطَايَاهُ ، وَإِنْ كَانَتْ أَكْثَرَ مِنْ زَبَدِ البَحْرِ»</span></strong></p>
<p></p>
<p>« <em><strong>Quiconque reste assis à l'endroit où il a prié après avoir terminé la prière du Sobh (l'aube), jusqu'à ce qu'il accomplisse les deux unités de prière de Douhâ, en ne disant que du bien ، ses péchés lui seront pardonnés, même s'ils sont plus nombreux que l'écume de la mer.</strong></em> » (Rapporté par Abu Dawud). (3)</p>
<p>* <strong>Son maximum</strong> est de huit unités de prière ، d'après ce qu'a rapporté Umm Hani : « <em><strong>Le Prophète <span dir="rtl">ﷺ</span>, l'année de la conquête (de la Mecque), pria huit unités de prière lors du Douhâ.</strong></em> » (Rapporté par le groupe de traditionnistes)(4). Et selon Muslim, d'après Aïcha (qu'Allah l'agrée) : « <em><strong>Il <span dir="rtl">ﷺ</span> priait le Douhâ en quatre unités et en ajoutait autant qu'Allah le voulait</strong></em>. » (5)</p>
<p>* <strong>Le temps de la prière du Douhâ</strong> commence dès que le soleil s'est levé d'une hauteur équivalente à une lance, et il s'étend jusqu'à peu de temps avant le zénith (<em>Az-Zawal</em>) ; c'est-à-dire au moment où le soleil est au milieu du ciel.</p>
<p>Et il est préférable de la prier lorsque la chaleur s'intensifie, conformément au hadith:</p>
<p class="ar"><strong><span dir="rtl">«صَلَاةُ الأَوَّابِينَ حِينَ تَرْمَضُ الفِصَالُ»</span></strong></p>
<p>"<em><strong>La prière des repentants (Al-Awwâbîn) a lieu quand les jeunes chameaux ressentent la chaleur du sol</strong></em>", rapporté par Muslim (6); c'est-à-dire quand le sol devient brûlant, obligeant les jeunes chameaux à s'accroupir à cause de la forte chaleur.</p>
<h4 id="sources"><strong>Sources :</strong></h4>
<p>(1) Rapporté par Al-Bukhari (1981) et Muslim (721).</p>
<p>(2) Rapporté par Ahmad (3/21, 26), At-Tirmidhi (477) qui a dit : [hadith] "Bon étrange" (Hassan Gharib). Et [rapporté par] Abou Ya'la (1270), Ibn al-Ja'd (2029), et 'Abd bin Hamid (1891).</p>
<p>(3) Rapporté par Abou Daoud (1287) et Al-Bayhaqi (3/49).</p>
<p>(4) Rapporté par Al-Bukhari (357) et Muslim (336).</p>
<p>(5) Muslim (719).</p>
<p>(6) Muslim (748).</p>
