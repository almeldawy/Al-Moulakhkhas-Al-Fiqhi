<p>Parmi ce que le Prophète de la guidée, Muhammad <span dir="rtl">ﷺ</span>, a instauré durant le mois béni de Ramadan, il y a la prière des Tarawih*. Elle est une Sunna confirmée (Mu'akkadah). Elle a été nommée « Tarawih » (repos) car les gens avaient l'habitude de se reposer toutes les quatre unités de prière (Rak'at) (1)، car ils prolongeaient la prière.</p>
<p><strong>*</strong> Et l'accomplir en groupe à la mosquée est préférable. En effet, le Prophète <span dir="rtl">ﷺ</span> l'a priée avec ses compagnons à la mosquée pendant plusieurs nuits, puis il a cessé de la diriger par crainte qu'elle ne leur devienne obligatoire. Comme cela est confirmé dans les « Deux Authentiques » (Bukhari et Muslim) d'après 'Aïcha (qu'Allah l'agrée) : <em><strong>« Le Prophète <span dir="rtl">ﷺ</span> pria une nuit à la mosquée et des gens prièrent derrière lui. Puis il pria la nuit suivante et les gens furent plus nombreux. Puis ils se rassemblèrent la troisième ou la quatrième nuit, mais il ne sortit pas vers eux. Au matin, il dit : "J'ai vu ce que vous avez fait, et rien ne m'a empêché de sortir vers vous si ce n'est que j'ai craint que cela ne vous soit imposé comme une obligation."</strong></em> » (2). Et cela se passait durant le Ramadan. Ses compagnons l'ont pratiquée après lui, et sa communauté l'a accueillie avec acceptation. Le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><strong><span dir="rtl">«مَنْ قَامَ مَعَ الْإِمَامِ حَتَّى يَنْصَرِفَ؛ كُتِبَ لَهُ قِيَامُ لَيْلَةٍ»</span></strong></p>
<p><em><strong>« Quiconque prie avec l'imam jusqu'à ce qu'il termine, il lui sera inscrit la récompense d'une nuit complète de prière. » (3).</strong></em></p>
<p>Et il a dit (sur lui la prière et le salut) :</p>
<p class="ar"><strong><span dir="rtl">«مَنْ قَامَ رَمَضَانَ إِيمَاناً وَاحْتِسَاباً؛ غُفِرَ لَهُ مَا تَقَدَّمَ مِنْ ذَنْبِهِ»</span></strong></p>
<p><em><strong>« Quiconque prie (le qiyâm) durant le Ramadan avec foi et en espérant la récompense, ses péchés passés lui seront pardonnés. » Rapporté par Bukhari et Muslim (4).</strong></em></p>
<p><strong>C'est donc une Sunna établie qu'il ne convient pas au musulman de délaisser.</strong></p>
<p>*Quant au nombre de ses unités de prière (Rak'at) : rien n'a été [strictement] fixé à ce sujet de la part du Prophète <span dir="rtl">ﷺ</span>, et il y a une certaine souplesse en la matière.</p>
<p>Cheikh al-Islam Ibn Taymiyya (qu'Allah lui fasse miséricorde) a dit (5): « Il est permis de prier <strong>vingt unités</strong>, comme cela est célèbre dans les écoles (Madhab) d'Ahmad et d'Al-Shafi'i. Il est aussi permis de prier <strong>trente-six unités</strong>, comme cela est l'avis de l'école de Malik. On peut également prier <strong>onze unités</strong> ou <strong>treize unités</strong>. Tout cela est bien, et l'augmentation ou la diminution du nombre de Rak'at dépend de la longueur ou de la brièveté de la station debout (récitation).</p>
<p>Et lorsque 'Umar (qu'Allah l'agrée) a réuni les gens derrière Ubayy [ibn Ka'b], celui-ci dirigea pour eux <strong>vingt unités</strong>. Parmi les Compagnons (qu'Allah les agrée), certains en faisaient peu et d'autres beaucoup, car il n'existe pas de texte du Législateur (Allah ou Son Prophète) fixant une limite précise.</p>
<p><strong>De nombreux imams (c'est-à-dire les imams des mosquées) accomplissent, pour les Tarawih, une prière qu'ils ne conçoivent même pas.</strong> Ils ne marquent pas de temps de pause (quiétude/apaisement) ni dans l'inclinaison (<em>Ruku'</em>), ni dans la prosternation (<em>Sujud</em>), alors que la quiétude (<em>Touma'nina</em>) est un pilier de la prière. Ce qui est requis dans la prière, c'est la présence du cœur devant Allah le Très-Haut, et qu'il soit exhorté par la parole d'Allah lorsqu'elle est récitée. Or, cela ne peut se réaliser avec une rapidité détestable.</p>
<p>Prier <strong>dix unités</strong> avec une récitation longue et avec quiétude est préférable à <strong>vingt unités</strong> effectuées avec une rapidité détestable. Car l'essence même de la prière et son âme résident dans l'élan du cœur vers Allah <span dir="rtl">ﷻ</span>. Parfois, une petite quantité vaut mieux qu'une grande. De même, la récitation psalmodiée (<em>Tartîl</em>) est préférable à la rapidité. La rapidité autorisée est celle qui n'entraîne pas l'omission de certaines lettres ; si l'imam omet des lettres à cause de sa vitesse, cela n'est pas permis et doit être interdit. En revanche, s'il récite d'une manière claire dont profitent ceux qui prient derrière lui, alors c'est une bonne chose.</p>
<p><strong>Allah a blâmé ceux qui lisent le Coran sans en comprendre le sens,</strong> Il a dit :</p>
<p class="ar"><strong><span dir="rtl">﴿وَمِنْهُمْ أُمِّيُّونَ لَا يَعْلَمُونَ الْكِتَابَ إِلَّا أَمَانِيَّ﴾ [البقرة: ٧٨]</span></strong></p>
<p><em>« <strong>Et il y a parmi eux des illettrés qui ne connaissent du Livre que des prétentions (Amâniyya)</strong> »</em> [Al-Baqarah : 78], c'est-à-dire une récitation sans compréhension. Le but de la révélation du Coran est la compréhension de ses sens et la mise en pratique, et non la simple récitation. » Fin de ses propos (d'Ibn Taymiyya), qu'Allah lui fasse miséricorde.</p>
<p><strong>Certains imams de mosquées n'accomplissent pas les Tarawih de la manière légiférée.</strong> En effet, ils récitent avec une rapidité qui nuit à la diction correcte du Coran. De plus, ils ne marquent pas de temps de repos (quiétude) lors de la station debout, de l'inclinaison et de la prosternation, alors que la quiétude (<em>Touma'nina</em>) est l'un des piliers de la prière. Ils choisissent également le nombre le plus réduit d'unités de prière (<em>Rak'at</em>), cumulant ainsi : un faible nombre de Rak'at, une prière écourtée et une mauvaise récitation.</p>
<p>Ceci est considéré comme un jeu (un manque de sérieux) vis-à-vis de l'adoration (6). Il leur est donc obligatoire de craindre Allah et de parfaire leur prière, afin de ne pas se priver eux-mêmes, ainsi que ceux qui prient derrière eux, d'accomplir les Tarawih selon la manière légiférée (7).</p>
<p>Qu'Allah nous accorde à tous la réussite dans ce qui contient la droiture et le succès.</p>
<h4 id="sources"><strong>Sources</strong>:</h4>
<p>*NDT: Tarâwîh (<span dir="rtl">تَرَاوِيح</span>) est le pluriel du mot arabe Tarwîhah (<span dir="rtl">تَرْوِيحَة</span>), qui désigne une pause ou un moment de repos.</p>
<p>(1) C'est-à-dire : entre chaque deux salutations (Taslîm) ; car les Tarawih se prient deux par deux (unités), tout comme la prière du Tahajjud. Certains imams de mosquées qui manquent de connaissances juridiques (Fiqh) commettent parfois l'erreur de ne pas saluer toutes les deux unités dans les Tarawih ou le Tahajjud, ce qui est contraire à la Sunna. Les savants ont stipulé que celui qui se lève pour une troisième unité dans les Tarawih ou le Tahajjud est comme celui qui se lève pour une troisième unité lors de la prière de l'Aube (Fajr) ; c'est-à-dire que sa prière est annulée. Le Cheikh Abdel Aziz bin Baz a d'ailleurs émis une réponse réfutant ces personnes et démontrant leur erreur.</p>
<p>(2) Rapporté par Al-Bukhari (1129) et Muslim (761).</p>
<p>(3) Rapporté par Al-Tirmidhi (806), qui a dit : "Hasan Sahih" (Bon et authentique), Al-Nasa'i (1298), Ahmad (5/ 159, 163), Abu Dawud (1375), Ibn Majah (1327) ; authentifié par Ibn Khuzaymah (2205) et Ibn Hibban (2547).</p>
<p>(4) Rapporté par Al-Bukhari (37) et Muslim (759).</p>
<p>(5) Voir : « Al-Fatawa al-Kubra » (4/ 427).</p>
<p>(6) Certains [imams] diffusent leur voix lors de la récitation à l'extérieur de la mosquée via le microphone (haut-parleur), ce qui perturbe les mosquées environnantes, et cela n'est pas permis.</p>
<p>Cheikh al-Islam Ibn Taymiyya a dit : « <em>Celui qui récite le Coran alors que les gens accomplissent des prières surérogatoires ne doit pas réciter à voix haute d'une manière qui les distrait. En effet, le Prophète <span dir="rtl">ﷺ</span> sortit rejoindre ses compagnons alors qu'ils priaient dans la mosquée et dit : "Ô gens ! Chacun de vous s'entretient avec son Seigneur ; que l'un d'entre vous ne couvre donc pas la voix de l'autre par sa récitation."</em> » Fin de citation. Majmu' al-Fatawa (23/ 61-64).</p>
<p>(7) Certains imams de mosquées récitent trop rapidement et prolongent la récitation afin de clôturer le Coran au début ou au milieu des dix dernières nuits. Une fois la clôture terminée, l'imam délaisse sa mosquée et part pour la 'Omra (petit pèlerinage), laissant derrière lui quelqu'un qui n'est peut-être pas apte à diriger la prière. C'est une grande erreur, un manquement majeur et un abandon de la mission qui lui a été confiée, à savoir diriger les fidèles jusqu'à la fin du mois. Sa présence est pour lui une obligation (Wajib), tandis que la 'Omra est recommandée (Mustahabb). Comment peut-on délaisser une obligation pour un acte recommandé ?! Certes, rester dans sa mosquée et mener sa tâche à bien est préférable pour lui que de partir en 'Omra.</p>
<p>Et certains d'entre eux, une fois le Coran clôturé, allègent la prière et réduisent la récitation durant les nuits restantes du mois, qui sont pourtant les nuits de l'affranchissement de l'Enfer. On dirait que ceux-là considèrent que le but des Tarawih et du Tahajjud est uniquement de finir le Coran, et non de faire vivre ces nuits bénies par la prière nocturne, suivant en cela l'exemple du Prophète <span dir="rtl">ﷺ</span> et recherchant ses mérites. C'est une marque d'ignorance de leur part et un jeu avec l'adoration. Nous demandons à Allah de les ramener vers la justesse.</p>
