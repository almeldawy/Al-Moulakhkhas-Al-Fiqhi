<p>⁕ Certes, notre législation — et la louange revient à Allah — est complète et globale, englobant les intérêts de l'être humain durant sa vie et après sa mort. Parmi cela, figure ce qu'Allah a légiféré comme règles relatives aux funérailles ، depuis l'instant de la maladie et de l'agonie jusqu'à l'enterrement du défunt dans sa tombe ؛ qu'il s'agisse de la visite du malade, de l'exhortation à prononcer l'attestation de foi (talqîn), du lavage mortuaire, de la mise dans le linceul, de la prière funèbre, de l'enterrement, ainsi que ce qui en découle comme acquittement de ses dettes, exécution de ses testaments, répartition de son héritage et la tutelle sur ses enfants mineurs.</p>
<p>L'imam Ibn al-Qayyim — qu'Allah lui fasse miséricorde — a dit <a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a>: "<em>La conduite du Prophète <span dir="rtl">ﷺ</span> concernant les funérailles était la plus parfaite des conduites. Elle se distinguait de celle des autres nations en incluant l'accomplissement de la servitude envers Allah le Très-Haut de la manière la plus complète ، ainsi que la bienfaisance envers le défunt en agissant envers lui par ce qui lui sera utile dans sa tombe et au Jour du Retour. Cela va de la visite [durant sa maladie] à l'exhortation (talqîn), en passant par sa purification et sa préparation pour le retour vers Allah le Très-Haut dans le meilleur et le plus excellent des états. Ainsi, les gens se tiennent en rangs pour sa prière funèbre ، ils louent Allah, Lui adressent des éloges, prient sur Son Prophète <span dir="rtl">ﷺ</span> et demandent pour le défunt le pardon, la miséricorde et l'indulgence. Ensuite, ils se tiennent devant sa tombe ؛ demandant pour lui la fermeté, puis vient la visite de sa tombe et l'invocation en sa faveur ؛ tout comme le vivant prend soin de son compagnon dans ce bas-monde. Enfin, vient la bienfaisance envers la famille du défunt, ses proches et d'autres choses encore.</em>" Fin de citation.</p>
<p>⁕ <strong>Il est recommandé (sunna)</strong> de se souvenir fréquemment de la mort et de s'y préparer par le repentir des péchés, la restitution des droits à leurs propriétaires (réparer les torts), et de s'empresser d'accomplir de bonnes œuvres avant que la mort ne survienne par surprise.</p>
<p>Le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><strong><span dir="rtl">«أَكْثِرُوا مِن ذِكْرِ هَاذِمِ اللَّذَّاتِ»</span></strong></p>
<p><strong>"<em>Multipliez le rappel de celle qui brise les plaisirs</em>"</strong>. Rapporté par les cinq [imams] avec des chaînes de transmission authentiques, et authentifié par Ibn Hibban, Al-Hakim et d'autres<a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a>.</p>
<p>"<em>Celle qui brise les plaisirs</em>" (<span dir="rtl">هَاذِمِ اللَّذَّات</span>ِ) désigne la mort.</p>
<p>Le Messager d'Allah <span dir="rtl">ﷺ</span> a dit : <strong>"<em>Ayez de la pudeur envers Allah comme il se doit.</em>"</strong> Nous avons dit : "Ô Messager d'Allah ! Nous avons certes de la pudeur, et la louange est à Allah." Il répondit : <strong>"<em>Ce n'est pas cela. La véritable pudeur envers Allah consiste à préserver la tête et ce qu'elle contient (les sens, les pensées), le ventre et ce qu'il renferme (la nourriture illicite), et à se souvenir de la mort et de la décomposition [du corps]. Quiconque désire l'au-delà délaisse les parures de ce bas-monde. Celui qui agit ainsi a alors fait preuve de pudeur envers Allah comme il se doit.</em>"</strong><a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a></p>
<h4 id="premièrement-les-règles-concernant-le-malade-et-lagonisant"><strong>Premièrement : Les règles concernant le malade et l'agonisant :</strong></h4>
<p>⁕ Lorsque l'être humain est atteint d'une maladie, il se doit de patienter et d'en espérer la récompense auprès d'Allah (<strong>yahtasib</strong>). Il ne doit ni s'alarmer, ni s'indigner contre le décret d'Allah et Sa prédestination.</p>
<p>Il n'y a pas de mal à informer les gens de son mal et de la nature de sa maladie, à condition de rester satisfait du décret d'Allah. Le fait de s'en remettre à Allah le Très-Haut (Lui confier sa plainte) et de Lui demander la guérison ne contredit en rien la patience. Au contraire, cela est requis par la législation religieuse et recommandé.</p>
<p>En effet, Job (Ayyoub), que la paix soit sur lui, invoqua son Seigneur en disant :</p>
<p class="ar"><strong><span dir="rtl">﴿أَنِّي مَسَّنِيَ الضُّرُّ وَأَنْتَ أَرْحَمُ الرَّاحِمِينَ﴾ [الأنبياء: ٨٣]</span></strong></p>
<p><strong>"<em>Le mal m'a touché, mais Toi, Tu es le plus Miséricordieux des miséricordieux</em>"</strong> (Sourate Al-Anbiya, verset 83).</p>
<p>⁕ De même, il n'y a aucun mal à se soigner avec des remèdes licites (<strong>mubâhah</strong>). Certains savants sont même d'avis que cela est fortement recommandé, au point d'être proche de l'obligation.</p>
<p>En effet, les hadiths confirment [le principe de] la relation entre les causes et les effets (<strong>al-asbâb wa al-musabbibât</strong>), ainsi que l'ordre de se soigner. Cela ne contredit en rien la confiance en Allah (<strong>al-tawakkul</strong>), tout comme le fait de combler la faim et la soif par la nourriture et la boisson ne la contredit pas.</p>
<p><strong>⁕ Il n'est pas permis de se soigner avec ce qui est illicite (muharram)</strong>, conformément à ce qui est rapporté dans le "Sahih" d'après Ibn Mas'oud (qu'Allah l'agréé) qui a dit :</p>
<p class="ar"><strong><span dir="rtl">«إِنَّ اللهَ لَمْ يَجْعَلْ شِفَاءَكُمْ فِيمَا حَرَّمَ عَلَيْكُمْ»</span></strong></p>
<p><strong>"Certes, Allah n'a pas placé votre guérison dans ce qu'Il vous a interdit."</strong><a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a></p>
<p>Abu Daoud et d'autres ont rapporté d'après Abu Hurayra, dans une parole attribuée au Prophète (marfou') :</p>
<p class="ar"><strong><span dir="rtl">«إِنَّ اللهَ أَنْزَلَ الدَّوَاءَ، وَأَنْزَلَ الدَّاءَ، وَجَعَلَ لِكُلِّ دَاءٍ دَوَاءً، وَلَا تَدَاوَوْا بِحَرَامٍ»</span></strong></p>
<p><strong>"Certes Allah a fait descendre le remède et a fait descendre la maladie ; Il a créé pour chaque maladie un remède. Ne vous soignez donc pas avec ce qui est illicite."</strong><a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a></p>
<p>Et dans le "Sahih Muslim", le Prophète <span dir="rtl">ﷺ</span> a dit à propos de l'alcool (al-khamr) :</p>
<p class="ar"><strong><span dir="rtl">«إِنَّهُ لَيْسَ بِدَوَاءٍ وَلَكِنَّهُ دَاءٌ»</span></strong></p>
<p><strong>"Ce n'est pas un remède, mais c'est plutôt un mal (une maladie)."</strong><a href="#fn6" class="footnote-ref" id="fnref6" role="doc-noteref"><sup>6</sup></a></p>
<p>⁕ De même, il est interdit de se soigner par des procédés qui portent atteinte à la croyance ('Aqîdah) ، tels que l'accrochage d'amulettes contenant des paroles de polythéisme (shirk), des noms inconnus, des talismans, des perles, des fils, des colliers ou des anneaux portés sur le bras, l'avant-bras ou ailleurs, avec la conviction qu'ils apportent la guérison ou repoussent le mauvais œil et les afflictions. Tout cela implique un attachement du cœur à un autre qu'Allah pour obtenir un bienfait ou repousser un préjudice ، et cela relève soit du polythéisme (shirk), soit des moyens y menant. Parmi ces interdits figure également le fait de se soigner auprès des charlatans parmi les devins, les astrologues, les sorciers et ceux qui utilisent les djinns ؛ car la croyance du musulman est plus importante pour lui que sa santé. Certes, Allah a placé la guérison dans les choses licites bénéfiques pour le corps, la raison et la religion , et à leur tête figure le Noble Coran, ainsi que l'exorcisme (Ruqyah) pratiqué par celui-ci et par les invocations légiférées.</p>
<p>Ibn al-Qayyim a dit : « <em>Parmi les plus grands remèdes figurent la pratique du bien, l'excellence (al-Ihsân), le rappel (adh-Dhikr), l'invocation, la supplication envers Allah et le repentir. Son effet est plus grand que celui des médicaments, mais cela dépend de la disposition de l'âme et de sa capacité à les accepter</em> ».<a href="#fn7" class="footnote-ref" id="fnref7" role="doc-noteref"><sup>7</sup></a> Fin de citation.</p>
<p>⁕ Il est recommandé (Sunnah) de visiter les malades, conformément à ce qui est rapporté dans les deux recueils authentiques (Al-Bukhârî et Muslim) et ailleurs : « <em><strong>Cinq choses sont dues par le musulman envers son frère</strong></em> »<a href="#fn8" class="footnote-ref" id="fnref8" role="doc-noteref"><sup>8</sup></a>, et parmi elles fut mentionnée la visite du malade.</p>
<p>Lorsqu'on lui rend visite, on doit l'interroger sur son état ; car le Prophète <span dir="rtl">ﷺ</span> s'approchait du malade, l'interrogeait sur sa situation, et la visite avait lieu tous les deux jours ou tous les trois jours, à moins que le malade ne souhaite une visite quotidienne.</p>
<p>Il ne faut pas prolonger l'assise auprès de lui, sauf si le malade le désire. On doit dire au malade :</p>
<p class="ar"><span dir="rtl">«لَا بَأْسَ عَلَيْكَ، طَهُورٌ إِنْ شَاءَ اللهُ»</span></p>
<p><strong>« Pas de mal, que cela soit une purification pour toi, si Allah le veut »</strong> <a href="#fn9" class="footnote-ref" id="fnref9" role="doc-noteref"><sup>9</sup></a>.</p>
<p>On doit lui apporter de la joie, invoquer la guérison en sa faveur et pratiquer sur lui la <em>Ruqyah</em> (exorcisme légiféré) par le Coran, en particulier avec la sourate <strong>Al-Fâtihah</strong>, la sourate <strong>Al-Ikhlâs</strong> et les <strong>deux protectrices</strong> (<em>Al-Falaq</em> et <em>An-Nâs</em>).</p>
<p>⁕ <strong>Il est recommandé (Sunnah) au malade de léguer par testament une partie de ses biens pour des œuvres de bienfaisance.</strong> De même, il est <strong>obligatoire</strong> qu'il fasse part dans son testament de ses biens, de ses dettes, ainsi que des dépôts et des dépôts de confiance (<em>amanat</em>) qu'il détient. Cela est requis, même pour une personne en bonne santé, en raison de la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><strong><span dir="rtl">«مَا حَقُّ امْرِئٍ مُسْلِمٍ لَهُ شَيْءٌ يُوصِي بِهِ يَبِيتُ لَيْلَتَيْنِ إِلَّا وَوَصِيَّتُهُ مَكْتُوبَةٌ عِنْدَهُ»</span></strong></p>
<p>« <em><strong>Il n'appartient pas à un musulman, possédant quelque chose devant faire l'objet d'un testament, de passer deux nuits sans que son testament ne soit écrit auprès de lui.</strong></em> » (Rapporté par Al-Bukhârî et Muslim).<a href="#fn10" class="footnote-ref" id="fnref10" role="doc-noteref"><sup>10</sup></a></p>
<p>La mention des « <em><strong>deux nuits</strong></em> » est une <strong>insistance</strong> (pour souligner l'urgence) et non une limite stricte ; il ne convient donc pas qu'un laps de temps s'écoule, aussi court soit-il, sans que son testament ne soit écrit auprès de lui, car il ne sait pas à quel moment la mort le surprendra.</p>
<p>⁕ Le malade doit avoir une bonne opinion d'Allah (avoir bon espoir en Lui) ; car Allah <span dir="rtl">ﷻ</span> dit [dans un hadith divin] :</p>
<p class="ar"><strong><span dir="rtl">«أَنَا عِنْدَ ظَنِّ عَبْدِي بِي»</span></strong></p>
<p>« <em><strong>Je suis tel que Mon serviteur pense que Je suis.</strong></em> »</p>
<p>Et cela devient encore plus impératif lorsqu'il sent que le moment de la rencontre avec Allah (la mort) approche.</p>
<p>⁕ <strong>Il est recommandé à celui qui assiste une personne [à l'article de la mort] de l'inciter à espérer en la miséricorde d'Allah.</strong> Dans cette situation précise, on fait prévaloir l'<strong>espoir</strong> (Ar-Rajâ') sur la <strong>crainte</strong> (Al-Khawf).</p>
<p>Quant à l'état de bonne santé, la crainte et l'espoir doivent être <strong>égaux</strong>. En effet, celui chez qui la crainte prédomine risque de tomber dans une forme de désespoir, tandis que celui chez qui l'espoir prédomine risque de tomber dans une forme d'insouciance face au stratagème d'Allah (le sentiment d'être à l'abri de Son châtiment).</p>
<p>⁕ <strong>Lorsque le malade entre en agonie</strong>, il est recommandé (Sunnah) à celui qui l'assiste de lui suggérer de dire : <strong>« Lâ ilâha illa Allâh »</strong> (Il n'y a de divinité digne d'adoration qu'Allah). Cela est dû à la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><strong><span dir="rtl">«لَقِّنُوا مَوْتَاكُمْ لَا إِلَهَ إِلَّا اللهُ»</span></strong></p>
<p>« <em><strong>Incitez à dire à vos mourants la formule : Lâ ilâha illa Allâh.</strong></em> » (Rapporté par Muslim).<a href="#fn11" class="footnote-ref" id="fnref11" role="doc-noteref"><sup>11</sup></a></p>
<p>Ceci afin qu'il meure sur cette parole de sincérité et qu'elle soit son ultime parole. En effet, selon Mu'âdh, le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><strong><span dir="rtl">«مَن كَانَ آخِرُ كَلَامِهِ لَا إِلَهَ إِلَّا اللهُ؛ دَخَلَ الجَنَّةَ»</span></strong></p>
<p>« <em><strong>Celui dont la dernière parole est "Lâ ilâha illa Allâh" entrera au Paradis.</strong></em> »<a href="#fn12" class="footnote-ref" id="fnref12" role="doc-noteref"><sup>12</sup></a></p>
<p>Cette suggestion (<em>Talqîn</em>) doit être faite avec <strong>douceur</strong>. Il ne faut pas trop insister ou répéter la formule de manière excessive, afin de ne pas l'irriter ou le fatiguer alors qu'il se trouve dans cet état difficile.</p>
<p>⁕ Il est recommandé (Sunnah) que [le mourant] soit orienté vers la Qibla.</p>
<p>⁕ <strong>Il est également recommandé de réciter à ses côtés la sourate <em>Yâ-Sîn</em></strong>, conformément à la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="ltr">«</span><strong><span dir="rtl">اقْرَأُوا يس عَلَى مَوْتَاكُمْ</span></strong><span dir="ltr">»</span></p>
<p>« <em><strong>Récitez Yâ-Sîn sur vos morts.</strong></em> » (Rapporté par Abû Dâwud et Ibn Mâjah, et authentifié par Ibn Hibbân).<a href="#fn13" class="footnote-ref" id="fnref13" role="doc-noteref"><sup>13</sup></a></p>
<p>Le sens visé par l'expression <strong>« vos morts »</strong> désigne ici ceux qui sont au seuil de la mort (en agonie). Quant à celui qui est déjà décédé, on ne récite rien sur lui. En effet, la récitation sur le défunt <strong>après sa mort</strong> est une <strong>innovation (<em>Bid'ah</em>)</strong>, contrairement à la récitation sur celui qui est en train de rendre l'âme, laquelle est une Sunnah.</p>
<p>Ainsi, la récitation lors des funérailles, sur la tombe ou pour l'âme du défunt sont toutes des innovations pour lesquelles Allah n'a fait descendre aucune preuve. Le devoir du musulman est donc de mettre en pratique la Sunnah et de délaisser l'innovation.</p>
<h4 id="deuxièmement-les-règles-relatives-au-décès"><strong>Deuxièmement : Les règles relatives au décès</strong></h4>
<p>⁕ Il est recommandé, lorsque le défunt meurt, de lui fermer les yeux. En effet, le Prophète <span dir="rtl">ﷺ</span> a fermé les yeux d'Abû Salama (qu'Allah l'agrée) lorsqu'il est décédé, et il a dit :</p>
<p class="ar"><span dir="ltr">«</span><strong><span dir="rtl">إن الروحَ إذا قُبِضَ؛ تَبِعَه البَصَرُ؛ فلا تَقُولوا إلا خيراً؛ فإن الملائكةَ يُؤَمِّنون على ما تَقُولون</span></strong><span dir="ltr">»</span></p>
<p>« <em><strong>Certes, quand l'âme est reprise, le regard la suit. Ne dites alors que du bien, car les anges disent "Amine" (exaucent) à ce que vous dites.</strong></em> » (Rapporté par Muslim).<a href="#fn14" class="footnote-ref" id="fnref14" role="doc-noteref"><sup>14</sup></a></p>
<p>⁕ Et il est recommandé de couvrir le mort après son décès avec un vêtement ; car Aïcha (qu'Allah l'agrée) a rapporté que : "<em><strong>Lorsque le Prophète <span dir="rtl">ﷺ</span> mourut, il fut recouvert d'un manteau de type Hibara [un manteau yéménite brodé].</strong></em>" Hadith unanimement reconnu authentique<a href="#fn15" class="footnote-ref" id="fnref15" role="doc-noteref"><sup>15</sup></a>.</p>
<p>⁕ Il convient de se hâter pour la préparation [funéraire] du défunt dès lors que sa mort est confirmée ; en raison de la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><strong><span dir="rtl">« لَا يَنْبَغِي لِجِيفَةِ مُسْلِمٍ أَنْ تُحْبَسَ بَيْنَ ظَهْرَانَيْ أَهْلِهِ »</span></strong></p>
<p>"<em><strong>Il ne convient pas que la dépouille d'un musulman soit retenue au milieu de sa famille</strong></em>", rapporté par Abou Daoud.<a href="#fn16" class="footnote-ref" id="fnref16" role="doc-noteref"><sup>16</sup></a></p>
<p>Et parce que cela permet de préserver le mort de toute altération [décomposition]. L'imam Ahmad a dit : "<em>L'honneur du mort réside dans sa hâte [vers sa tombe]</em>". Et il n'y a pas de mal à attendre que son tuteur ou d'autres personnes soient présents s'ils sont proches, à condition que l'on ne craigne pas d'altération du corps.</p>
<p>⁕ Et il est permis d'annoncer la mort d'un musulman ; afin de s'empresser de le préparer, d'assister à ses funérailles, de prier sur lui et d'invoquer en sa faveur. Quant à l'annonce du décès faite sur le ton de l'affliction extrême (lamentations) et de l'énumération de ses titres de gloire ; cela relève des pratiques de l'ère pré-islamique (<em>Jahiliyya</em>), tout comme les cérémonies d'éloge funèbre et l'organisation de grands deuils (réunions formelles de condoléances avec faste).</p>
<p>⁕ Et il est recommandé de se hâter d'exécuter son legs testamentaire (<em>Wasiyya</em>) ; car cela permet d'accélérer l'obtention de la récompense [pour le défunt]. Allah — qu'Il soit exalté — l'a d'ailleurs mentionné [le legs testamentaire] avant la dette dans le Coran, par importance pour son statut et pour inciter à s'en acquitter.</p>
<p>⁕ Et il est obligatoire de s’empresser de rembourser ses dettes, qu’elles soient dues à Allah — qu’Il soit Exalté — comme la Zakat, le Hajj, un vœu d’obéissance ou une expiation (kaffârah) ، ou qu’il s’agisse de dettes envers des êtres humains ؛ telles que la restitution des dépôts (amanat), des biens spoliés ou des objets empruntés. Cela est requis, qu’il l’ait stipulé dans son testament ou non ، en raison de la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><strong><span dir="rtl">« نَفْسُ المُؤْمِنِ مُعَلَّقَةٌ بِدَيْنِهِ حَتَّى يُقْضَى عَنْهُ »</span></strong></p>
<p><strong>"<em>L'âme du croyant reste suspendue à sa dette jusqu'à ce qu'elle soit acquittée pour lui.</em>"</strong>(Rapporté par Ahmad et At-Tirmidhi qui l’a jugé bon) <a href="#fn17" class="footnote-ref" id="fnref17" role="doc-noteref"><sup>17</sup></a></p>
<p>C’est-à-dire qu’elle est réclamée pour la dette dont elle est redevable et qu'elle en est retenue. Il y a donc en cela une incitation à s’empresser de rembourser la dette du défunt. Ceci concerne celui qui a laissé des biens permettant de régler sa dette. Quant à celui qui ne possède rien mais qui est mort avec la ferme intention de rembourser , il est certes parvenu dans les Hadiths ce qui indique qu’Allah l’en acquittera.</p>
<h3 id="section"></h3>
<h3 id="section-1"></h3>
<h4 id="troisièmement-le-lavage-du-défunt-al-ghusl"><strong>Troisièmement : Le lavage du défunt (Al-Ghusl)</strong></h4>
<p>Parmi les règles relatives aux funérailles, il y a l'obligation de laver le mort pour quiconque en a connaissance et a la possibilité de le faire. Le Prophète <span dir="rtl">ﷺ</span> a dit, au sujet de l'homme dont la monture avait brisé le cou : <strong>« Lavez-le avec de l'eau et du jujubier (sidr)... »</strong> ; ce hadith fait l'objet d'un consensus <a href="#fn18" class="footnote-ref" id="fnref18" role="doc-noteref"><sup>18</sup></a>.</p>
<p>La pratique du lavage mortuaire a été transmise de manière continue (<em>tawâtur</em>) en Islam, tant par la parole que par l'acte. Le Prophète <span dir="rtl">ﷺ</span> lui-même a été lavé alors qu'il est celui qui est pur en lui-même et purifié [par Allah].. ; qu'en est-il alors des autres?</p>
<p>Le lavage du défunt est donc une <strong>obligation communautaire</strong> (<em>fard kifâya</em>) pour les musulmans qui ont connaissance de sa situation.</p>
<p>⁕ L'homme doit être lavé par un homme. Il est préférable et prioritaire de choisir, pour le lavage du défunt, une personne de confiance (fiable) connaissant les règles du lavage mortuaire. En effet, il s'agit d'une prescription légale (Chari'a) ayant des modalités spécifiques que seul celui qui les maîtrise peut appliquer conformément à la voie légiférée.</p>
<p>En ce qui concerne la responsabilité du lavage, la priorité est donnée au mandataire (celui désigné par testament). Ainsi, si le défunt a recommandé qu'une personne précise le lave, et que cette personne est intègre et fiable, elle passe en premier pour accomplir cette tâche. La preuve en est qu'Abû Bakr (qu'Allah l'agrée) a recommandé que son épouse, Asmâ' bint 'Umays, le lave ; il est donc permis à la femme de laver son mari, tout comme il est permis à l'homme de laver son épouse. De même, Anas (qu'Allah l'agrée) a recommandé que Muhammad Ibn Sîrîn le lave.</p>
<p>Après le mandataire, c'est le père du défunt qui vient en second pour le lavage ; il est le plus à même de laver son fils en raison de la tendresse et de la compassion particulière qu'il lui porte. Vient ensuite le grand-père, car il partage avec le père cette même affection. Puis, on suit l'ordre de proximité des parents masculins (les 'Asabât), du plus proche au moins proche, et enfin une personne étrangère à la famille.</p>
<p>Cet ordre de priorité s'applique si toutes les personnes concernées maîtrisent correctement le lavage et le revendiquent. Dans le cas contraire, celui qui connaît les règles du lavage mortuaire est prioritaire sur celui qui ne possède pas cette science.</p>
<p>⁕ La femme doit être lavée par des femmes. La priorité pour laver la femme défunte revient à celle qu'elle a désignée par testament. Ainsi, si elle a recommandé qu'une femme précise la lave, celle-ci prime sur les autres, à condition qu'elle soit apte à le faire. Après elle, la responsabilité du lavage revient aux parentes les plus proches par ordre de parenté.</p>
<p>⁕ Ainsi, les femmes se chargent du lavage de la femme selon cet ordre [de priorité], et les hommes se chargent du lavage de l'homme selon ce qui a été précédemment mentionné.</p>
<p>Toutefois, chacun des deux époux a le droit de laver son conjoint : l'homme est autorisé à laver son épouse, et la femme est autorisée à laver son mari. Cela s'appuie sur le fait qu'Abû Bakr (qu'Allah l'agrée) a recommandé que sa femme le lave, et que 'Alî (qu'Allah l'agrée) a lavé Fâtima [son épouse]. Des faits similaires ont également été rapportés concernant d'autres compagnons du Prophète.</p>
<p>⁕ Il est permis, aussi bien aux hommes qu'aux femmes, de laver tout enfant âgé de moins de sept ans, qu'il s'agisse d'un garçon ou d'une fille.</p>
<p>Ibn al-Moundhir a déclaré : "<em>Tous les gens de science dont nous avons recueilli l'avis sont unanimes sur le fait que la femme peut laver le petit garçon</em>". (Fin de citation)<a href="#fn19" class="footnote-ref" id="fnref19" role="doc-noteref"><sup>19</sup></a>.</p>
<p>En effet, l'enfant ne possède pas de nudité (<em>'awra</em>) impérative de son vivant [dans le cadre de ces soins] ; il en est donc de même après sa mort. De plus, les femmes ont lavé Ibrahim, le fils du Prophète <span dir="rtl">ﷺ</span> [lors de son décès en bas âge].</p>
<p>⁕ Il n'appartient pas à une femme de laver un garçon de sept ans ou plus, et il n'appartient pas à un homme de laver une fille de sept ans ou plus.</p>
<p>⁕ Il n'est pas permis au musulman de laver un mécréant (<em>kâfir</em>), de porter son cercueil, de l'envelopper dans un linceul, de prier sur lui ou de suivre son cortège funèbre. Cela conformément à la parole du Très-Haut :</p>
<p class="ar"><strong><span dir="rtl">﴿يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُواْ لَا تَتَوَلَّوۡاْ قَوۡمًا غَضِبَ ٱللَّهُ عَلَيۡهِمۡ﴾ [الممتحنة: ١٣]</span></strong></p>
<p><strong>{<em>Ô vous qui avez cru ! Ne prenez pas pour alliés des gens contre qui Allah est courroucé</em>}</strong> [Al-Mumtahina : 13]. Ce noble verset indique, par sa portée générale, l'interdiction de le laver, de le porter ou de suivre ses funérailles.</p>
<p>Allah le Très-Haut a également dit :</p>
<p class="ar"><strong><span dir="rtl">﴿وَلَا تُصَلِّ عَلَىٰٓ أَحَدٖ مِّنۡهُم مَّاتَ أَبَدٗا وَلَا تَقُمۡ عَلَىٰ قَبۡرِهِۦٓۖ إِنَّهُمۡ كَفَرُواْ بِٱللَّهِ﴾ [التوبة: ٨٤]</span></strong></p>
<p><strong>{<em>Et ne prie jamais sur l'un d'entre eux qui meurt, et ne te tiens pas debout auprès de sa tombe, car ils ont mécru en Allah</em>}</strong> [At-Tawba : 84].</p>
<p>Et Il a dit :</p>
<p class="ar"><strong><span dir="rtl">﴿مَا كَانَ لِلنَّبِيِّ وَٱلَّذِينَ ءَامَنُوٓاْ أَن يَسۡتَغۡفِرُواْ لِلۡمُشۡرِكِينَ﴾ [التوبة: ١١٣]</span></strong></p>
<p><strong>{<em>Il n'appartient pas au Prophète et aux croyants d'implorer le pardon pour les associateurs</em>}</strong> [At-Tawba : 113].</p>
<p>De même, il ne doit pas l'enterrer [selon les rites musulmans]. Toutefois, s'il ne se trouve personne parmi les mécréants pour l'enterrer, le musulman doit alors dissimuler son corps en le déposant dans une fosse, afin d'éviter les nuisances causées par la décomposition de la dépouille, et à l'exemple des morts [polythéistes] de la bataille de Badr qui furent jetés dans le puits (<em>al-qalîb</em>).</p>
<p>Ce jugement s'applique de la même manière à l'apostat, tel que celui qui délaisse la prière volontairement ou l'auteur d'une innovation majeure rendant mécréant (<em>bid'a mukaffira</em>). C'est ainsi que doit être la position du musulman vis-à-vis du mécréant, de son vivant comme après sa mort : une position de désaveu et d'aversion.</p>
<p>Allah le Très-Haut a dit, relatant les propos de Son ami intime Ibrahim et de ceux qui étaient avec lui :</p>
<p class="ar"><strong><span dir="rtl">﴿إِذْ قَالُواْ لِقَوْمِهِمْ إِنَّا بُرَءَٰٓؤُاْ مِنكُمْ وَمِمَّا تَعْبُدُونَ مِن دُونِ اللَّهِ كَفَرْنَا بِكُمْ وَبَدَا بَيْنَنَا وَبَيْنَكُمُ الْعَدَٰوَةُ وَالْبَغْضَآءُ أَبَدًا حَتَّىٰ تُؤْمِنُواْ بِاللَّهِ وَحْدَهُۥ﴾ [الممتحنة : ٤]</span></strong></p>
<p><strong>{<em>Lorsqu'ils dirent à leur peuple : "Nous vous désavouons, vous et ce que vous adorez en dehors d'Allah. Nous vous renions. Entre vous et nous, l'inimitié et la haine sont à jamais déclarées jusqu'à ce que vous croyiez en Allah seul</em>"}</strong> [Al-Mumtahina : 4].</p>
<p class="ar"><strong><span dir="rtl">﴿لَّا تَجِدُ قَوْمًا يُؤْمِنُونَ بِاللَّهِ وَالْيَوْمِ الْآخِرِ يُوَآدُّونَ مَنْ حَآدَّ اللَّهَ وَرَسُولَهُۥ وَلَوْ كَانُوٓاْ ءَابَآءَهُمْ أَوْ أَبْنَآءَهُمْ أَوْ إِخْوٰنَهُمْ أَوْ عَشِيرَتَهُمْ﴾ [المجادلة : ٢٢]</span></strong></p>
<p><strong>{<em>Tu n'en trouveras pas, parmi les gens qui croient en Allah et au Jour dernier, qui prennent pour amis ceux qui s'opposent à Allah et à Son Messager, fussent-ils leurs pères, leurs fils, leurs frères ou les gens de leur clan</em>}</strong> [Al-Mujâdala : 22].</p>
<p>Ceci s'explique par l'opposition radicale qui existe entre la mécréance et la foi, et en raison de l'hostilité des mécréants envers Allah, Ses messagers et Sa religion. Par conséquent, il n'est pas permis de s'allier à eux, qu'ils soient vivants ou morts.</p>
<p>Nous demandons à Allah de raffermir nos cœurs sur la vérité et de nous guider vers Son droit chemin.</p>
<p>⁕ Il est exigé (une condition) que l'eau utilisée pour le lavage soit purifiante (<em>tahoûr</em>) et licite (<em>mubâh</em>). Il est préférable qu'elle soit fraîche, sauf en cas de nécessité — par exemple pour éliminer une saleté sur le corps du défunt ou en cas de grand froid ; dans ces cas-là, il n'y a pas de mal à la chauffer.</p>
<p>⁕ Le lavage doit s'effectuer dans un endroit à l'abri des regards et couvert d'un toit, que ce soit une maison, une tente ou tout autre lieu similaire, si cela est possible.</p>
<p>⁕ Il est obligatoire de couvrir la zone située entre le nombril et les genoux du défunt avant le lavage. Ensuite, on lui retire ses vêtements, puis on le place sur la table (lit) de lavage dans une position légèrement inclinée vers ses pieds, afin que l'eau et tout ce qui s'écoule du corps puissent s'évacuer facilement.</p>
<p>⁕ Doivent assister au lavage [uniquement] celui qui lave (le laveur) et ceux qui l'aident dans cette tâche. Il est détestable (<em>makrûh</em>) que toute autre personne y assiste.</p>
<p>⁕ <strong>Le lavage s'effectue ainsi <em>:</em></strong> le laveur relève la tête du défunt pour la mettre presque en position assise, puis il passe sa main sur son ventre et le presse avec douceur afin d'en faire sortir ce qui est prêt à être évacué. À ce moment-là, il verse de l'eau en abondance pour emporter les excrétions.</p>
<p>Ensuite, le laveur enroule un morceau de tissu rugueux autour de sa main, procède au nettoyage des parties intimes du défunt (Istinjâ) et purifie les orifices avec de l'eau.</p>
<p>Puis, il formule l'intention (Niyya) du lavage, prononce le nom d'Allah (Basmala) et lui fait les ablutions (Woudhoû) comme pour la prière, à l'exception du rinçage de la bouche et du nez. Pour ces deux-là, il suffit que le laveur essuie les dents et les narines du défunt avec deux doigts mouillés, ou avec un chiffon humide enroulé autour des doigts ; il ne doit pas introduire d'eau dans sa bouche ni dans son nez.</p>
<p>Ensuite, il lave sa tête et sa barbe avec de l'écume de jujubier (Sidr) ou du savon. Il lave après cela le côté droit de son corps : le côté droit du cou, puis la main et l'épaule droites, puis la partie droite de la poitrine, le flanc droit, la cuisse droite, la jambe et le pied droits.</p>
<p>Puis, il le bascule sur son flanc gauche pour laver la partie droite de son dos.</p>
<p>Ensuite, il lave son côté gauche de la même manière [qu'à droite] : il le bascule sur son flanc droit pour laver la partie gauche de son dos. Il utilise le jujubier ou le savon durant le lavage. Il est également recommandé que le laveur garde un morceau de tissu enroulé sur sa main pendant toute la durée du lavage.</p>
<p>⁕ L'obligation (<em>wâjib</em>) consiste en un seul lavage si la propreté est obtenue. Cependant, il est recommandé (<em>mustahabb</em>) de procéder à trois lavages. Si la propreté n'est toujours pas atteinte, on augmente le nombre de lavages jusqu'à ce que le corps soit propre, et ce, jusqu'à sept lavages.</p>
<p>Il est recommandé d'ajouter du <strong>camphre</strong> lors du dernier lavage, car il raffermit le corps du défunt, le parfume et lui apporte de la fraîcheur. C'est pour ces raisons qu'on l'utilise lors de l'ultime lavage, afin que son effet perdure.</p>
<p>⁕ Ensuite, on sèche le défunt avec un linge ou autre. On lui taille la moustache et on lui coupe les ongles s'ils sont longs. On retire également les poils de ses aisselles, et tout ce qui a été ainsi prélevé [ongles, poils] est placé avec lui dans le linceul. Quant aux cheveux de la femme, ils sont tressés en trois nattes (ou couettes) et rejetés derrière elle.</p>
<p>⁕ Quant aux cas où le lavage du défunt s'avère impossible par manque d'eau, ou si l'on craint que le corps ne se désagrège lors du lavage (comme pour une personne atteinte de la lèpre ou une personne brûlée) ; ou encore si le défunt est une femme parmi des hommes étrangers (sans son mari), ou un homme parmi des femmes étrangères (sans son épouse) : dans toutes ces situations, on procède au <strong>Tayammum</strong> (l'ablution sèche avec du sable).</p>
<p>On essuie alors son visage et ses mains à l'aide d'un linge (barrière) placé sur la main de celui qui effectue le geste. S'il est seulement impossible de laver une partie du corps, on lave ce qu'il est possible de laver et l'on effectue le <em>Tayammum</em> pour la partie restante.</p>
<p>⁕ Il est recommandé (<em>mustahabb</em>) à celui qui a lavé un mort de faire lui-même ses grandes ablutions (<em>ghusl</em>) après avoir terminé le lavage, mais cela n'est pas une obligation (<em>wâjib</em>).</p>
<h4 id="quatrièmement-les-règles-de-lenveloppement-dans-le-linceul-al-takfîn"><strong>Quatrièmement : Les règles de l'enveloppement dans le linceul (Al-Takfîn) :</strong> </h4>
<p>Une fois le lavage et le séchage terminés, il est prescrit d'envelopper le mort dans son linceul.</p>
<p>⁕ Il est exigé que le linceul soit couvrant, et il est recommandé qu'il soit blanc et propre, qu'il soit neuf — ce qui est préférable — ou bien déjà lavé.</p>
<p>⁕ La mesure obligatoire du linceul consiste en une étoffe qui couvre l'intégralité du corps du défunt. Quant à ce qui est recommandé (la Sunna), l'homme est enveloppé dans trois draps (enveloppes). La femme، elle، est enveloppée dans cinq pièces : un pagne (Izâr)، un voile (Khimâr)، une chemise (Qamîs) et deux draps.</p>
<p>Le petit garçon est enveloppé dans un seul vêtement, mais il est permis d'en utiliser trois. La petite fille est enveloppée dans une chemise et deux draps. Enfin, il est recommandé de parfumer les linceuls avec de l'encens après les avoir aspergés d'eau de rose ou autre substance similaire, afin que l'odeur de l'encens s'y imprègne durablement.</p>
<p>⁕ L'enveloppement de l'homme s'effectue en étalant les trois draps (enveloppes) les uns sur les autres. Ensuite، on apporte le défunt dont la nudité doit obligatoirement être couverte par un vêtement ou autre، et on le dépose sur le dos par-dessus les draps.</p>
<p>On apporte alors le <em>Hanout</em> (un mélange de parfums) que l'on place sur du coton entre les fesses du défunt، et on serre par-dessus un morceau de tissu. Le reste du coton parfumé est ensuite placé sur ses yeux، ses narines، sa bouche، ses oreilles، ainsi que sur les membres de la prosternation : son front، son nez، ses mains، ses genoux et les extrémités de ses pieds. On en applique également sur les plis du corps : les aisselles، le creux des genoux et le nombril. On met aussi du parfum entre les draps du linceul et sur la tête du mort.</p>
<p>Ensuite، on rabat le bord du drap supérieur du côté gauche vers son flanc droit، puis son bord droit vers son flanc gauche. On procède de la même manière pour le deuxième drap، puis pour le troisième. Le surplus de longueur des draps doit être plus important au niveau de la tête qu'au niveau des pieds. Ce surplus au niveau de la tête est ensuite rassemblé et rabattu sur son visage، et le surplus au niveau des pieds est rassemblé et rabattu sur ses pieds. Enfin، on noue des liens autour des draps pour éviter qu'ils ne s'ouvrent، et ces nœuds seront déliés une fois dans la tombe.</p>
<p>⁕ Quant à la femme, elle est enveloppée dans cinq pièces : un pagne (Izâr) dont on l'entoure, puis on lui fait porter une chemise (Qamîs), puis on lui couvre la tête avec un voile (Khimâr), et enfin elle est enveloppée dans deux grands draps.</p>
<h4 id="cinquièmement-les-règles-de-la-prière-funéraire-sur-le-mort"><strong>Cinquièmement : Les règles de la prière funéraire sur le mort :</strong></h4>
<p>Ensuite، il est prescrit après cela d'accomplir la prière sur le mort musulman :</p>
<p>⁕ D'après Abou Houraïra (qu'Allah l'agrée), le Messager d'Allah (<span dir="rtl">ﷺ</span>) a dit : « <em><strong>Celui qui assiste aux funérailles jusqu'à ce que l'on prie sur le défunt aura un Qirat (de récompense). Et celui qui y assiste jusqu'à ce qu'il soit enterré aura deux Qirats.</strong></em> » On demanda : « Et que sont les deux Qirats ? » Il répondit : « <em><strong>Comme deux immenses montagnes.</strong></em> » (Rapporté par Boukhari et Muslim)<a href="#fn20" class="footnote-ref" id="fnref20" role="doc-noteref"><sup>20</sup></a></p>
<p>⁕ La prière sur le mort est une obligation de suffisance communautaire (<em>Fard Kifaya</em>) : si certains l'accomplissent, le péché est levé pour les autres, et elle demeure une tradition recommandée (<em>Sunna</em>) pour ceux qui ne l'ont pas faite. Mais si tous la délaissent, ils commettent tous un péché.</p>
<p>⁕ <strong>Les conditions requises pour la prière sur le mort sont : »</strong></p>
<ul>
<li><blockquote>
<p><strong>L'intention</strong> (<em>An-Niyya</em>).</p>
</blockquote></li>
<li><blockquote>
<p><strong>L'orientation vers la Qibla</strong> (la direction de la Mecque).</p>
</blockquote></li>
<li><blockquote>
<p><strong>Le fait de couvrir les parties privées</strong> (<em>Satr al-'Awrah</em>).</p>
</blockquote></li>
<li><blockquote>
<p><strong>La pureté rituelle</strong> de celui qui prie (l'officiant/les fidèles) et de celui sur qui l'on prie (le défunt).</p>
</blockquote></li>
<li><blockquote>
<p><strong>L'évitement de toute impureté</strong> (<em>Najassa</em>).</p>
</blockquote></li>
<li><blockquote>
<p><strong>L'appartenance à l'Islam</strong> de celui qui prie et du défunt.</p>
</blockquote></li>
<li><blockquote>
<p><strong>La présence de la dépouille</strong> (<em>Al-Janaza</em>), si celle-ci se trouve dans la localité.</p>
</blockquote></li>
<li><blockquote>
<p><strong>La capacité légale</strong> de celui qui prie (être <em>Mukallaf</em>, c'est-à-dire pubère et doté de sa raison).</p>
</blockquote></li>
</ul>
<p>⁕ <strong>Quant à ses piliers, ils sont : »</strong></p>
<ol type="1">
<li><blockquote>
<p><strong>La station debout</strong> (<em>Al-Qiyam</em>) durant la prière.</p>
</blockquote></li>
<li><blockquote>
<p><strong>Les quatre Takbirs</strong> (dire "Allahu Akbar" quatre fois).</p>
</blockquote></li>
<li><blockquote>
<p><strong>La récitation de la Fatiha</strong> .</p>
</blockquote></li>
<li><blockquote>
<p><strong>La prière sur le Prophète</strong> (<span dir="rtl">ﷺ</span>) (la prière abrahamique).</p>
</blockquote></li>
<li><blockquote>
<p><strong>L'invocation (dou'a) en faveur du défunt.</strong></p>
</blockquote></li>
<li><blockquote>
<p><strong>L'ordre successif</strong> (<em>At-Tartib</em>) des étapes citées.</p>
</blockquote></li>
<li><blockquote>
<p><strong>La salutation finale</strong> (<em>At-Taslim</em>).</p>
</blockquote></li>
</ol>
<p>⁕ <strong>Quant à ses actes recommandés (Sunan), ils sont : »</strong></p>
<ul>
<li><blockquote>
<p><strong>Lever les mains</strong> à chaque <em>Takbir</em> (chaque fois que l'on dit "Allahu Akbar").</p>
</blockquote></li>
<li><blockquote>
<p><strong>Chercher refuge auprès d'Allah</strong> (<em>Al-Isti'adha</em>) avant la récitation (dire : <em>A'oudhou billahi min ash-shaytani r-rajim</em>).</p>
</blockquote></li>
<li><blockquote>
<p><strong>Invoquer pour soi-même et pour les musulmans</strong> (en plus des invocations pour le défunt).</p>
</blockquote></li>
<li><blockquote>
<p><strong>Réciter à voix basse</strong> (<em>Al-Israr</em>).</p>
</blockquote></li>
<li><blockquote>
<p><strong>Marquer une légère pause</strong> après le quatrième <em>Takbir</em> et avant la salutation finale.</p>
</blockquote></li>
<li><blockquote>
<p><strong>Placer la main droite sur la main gauche</strong> au niveau de la poitrine.</p>
</blockquote></li>
<li><blockquote>
<p><strong>Tourner la tête vers la droite</strong> lors de la salutation finale (<em>At-Taslim</em>).</p>
</blockquote></li>
</ul>
<p>⁕ La prière sur le mort s'accomplit ainsi : l'imam (ou celui qui prie seul) se tient au niveau de la poitrine de l'homme et au milieu de la femme. Les fidèles se tiennent derrière l'imam, et il est recommandé de les disposer en trois rangs. Ensuite, il fait le premier Takbîr (de sacralisation), puis cherche refuge auprès d'Allah (Isti'âdha) immédiatement après, sans réciter d'invocation d'ouverture (Istiftâh). Il dit la Basmala et récite la Fatiha. Puis, il fait le deuxième Takbîr et prie sur le Prophète (<span dir="rtl">ﷺ</span>) comme on le fait durant le Tachahhoud de la prière. Enfin, il fait le troisième Takbîr et invoque pour le défunt avec ce qui a été rapporté, dont :</p>
<p class="ar"><span dir="rtl">« اللَّهُمَّ اغْفِرْ لِحَيِّنَا وَمَيِّتِنَا، وَشَاهِدِنَا وَغَائِبِنَا، وَصَغِيرِنَا وَكَبِيرِنَا، وَذَكَرِنَا وَأُنْثَانَا، إِنَّكَ تَعْلَمُ مُنْقَلَبَنَا وَمَثْوَانَا، وَأَنْتَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، اللَّهُمَّ مَنْ أَحْيَيْتَهُ مِنَّا؛ فَأَحْيِهِ عَلَى الإِسْلَامِ وَالسُّنَّةِ، وَمَنْ تَوَفَّيْتَهُ مِنَّا؛ فَتَوَفَّهُ عَلَيْهِمَا , اللَّهُمَّ اغْفِرْ لَهُ، وَارْحَمْهُ، وَعَافِهِ، وَاعْفُ عَنْهُ، وَأَكْرِمْ نُزُلَهُ، وَوَسِّعْ مُدْخَلَهُ، وَاغْسِلْهُ بِالمَاءِ وَالثَّلْجِ وَالبَرَدِ، وَنَقِّهِ مِنَ الذُّنُوبِ وَالخَطَايَا كَمَا يُنَقَّى الثَّوْبُ الأَبْيَضُ مِنَ الدَّنَسِ، وَأَبْدِلْهُ دَارًا خَيْرًا مِنْ دَارِهِ، وَزَوْجًا خَيْرًا مِنْ زَوْجِهِ، وَأَدْخِلْهُ الجَنَّةَ، وَأَعِذْهُ مِنْ عَذَابِ القَبْرِ وَعَذَابِ النَّارِ، وَافْسَحْ لَهُ فِي قَبْرِهِ، وَنَوِّرْ لَهُ فِيهِ »</span></p>
<p>« <em>Ô Allah ! Pardonne à nos vivants et à nos morts, à ceux qui sont présents et à ceux qui sont absents, à nos jeunes et à nos vieux, à nos hommes et à nos femmes.</em><a href="#fn21" class="footnote-ref" id="fnref21" role="doc-noteref"><sup>21</sup></a> <em>Certes, Tu connais nos va-et-vient et notre demeure finale, et Tu es Capable de toute chose. Ô Allah ! Celui d'entre nous que Tu maintiens en vie, fais-le vivre sur l'Islam et la Sunna ; et celui d'entre nous à qui Tu reprends la vie, fais-le mourir sur ces deux-là.</em><a href="#fn22" class="footnote-ref" id="fnref22" role="doc-noteref"><sup>22</sup></a> <em>Ô Allah ! Pardonne-lui, fais-lui miséricorde, accorde-lui Ton salut, efface ses fautes, rends son séjour honorable et élargis son entrée. Lave-le avec de l'eau, de la neige et de la grêle, et purifie-le de ses péchés et de ses fautes comme on nettoie le vêtement blanc de sa souillure. Accorde-lui en échange une demeure meilleure que la sienne, un conjoint meilleur que le sien. Fais-le entrer au Paradis et préserve-le du châtiment de la tombe et du châtiment du Feu. Élargis sa tombe et illumine-la lui.</em> »</p>
<p>Si la personne pour qui l'on prie est une femme, on dit :</p>
<p class="ar"><span dir="rtl">« اللَّهُمَّ اغْفِرْ لَهَا »</span></p>
<p>"<em>Ô Allah ! Pardonne-lui (Laha)</em>", en utilisant le féminin pour tous les pronoms de l'invocation.</p>
<p>S'il s'agit d'un enfant, on dit :</p>
<p class="ar"><span dir="rtl">« اللَّهُمَّ اجْعَلْهُ ذُخْرًا لِوَالِدَيْهِ، وَفَرَطًا، وَأَجْرًا، وَشَفِيعًا مُجَابًا، اللَّهُمَّ ثَقِّلْ بِهِ مَوَازِينَهُمَا، وَأَعْظِمْ بِهِ أُجُورَهُمَا، وَأَلْحِقْهُ بِصَالِحِ [سَلَفِ] المُؤْمِنِينَ، وَاجْعَلْهُ فِي كَفَالَةِ إِبْرَاهِيمَ، وَقِهِ بِرَحْمَتِكَ عَذَابَ الجَحِيمِ »</span></p>
<p>"<em>Ô Allah ! Fais de lui un trésor pour ses parents, une récompense devancée, un salaire et un intercesseur dont l'intercession est exaucée. Ô Allah ! Alourdis par lui leurs balances et augmente par lui leurs récompenses. Joins-le aux pieux [prédécesseurs] des croyants, place-le sous la protection d'Ibrahim et préserve-le, par Ta miséricorde, du châtiment de l'Enfer.</em>"</p>
<p>Ensuite, il fait le quatrième Takbîr, marque une courte pause, puis effectue une seule salutation finale (Taslîm) vers sa droite.</p>
<p>⁕ <strong>Celui qui rate une partie de la prière funéraire :</strong> il rejoint l'imam pour ce qu'il en reste. Puis, lorsque l'imam salue, il rattrape ce qu'il a manqué en respectant la description (de la prière). S'il craint que la dépouille ne soit enlevée (avant d'avoir fini), il enchaîne les <em>Takbirats</em> restants (c'est-à-dire sans séparation entre eux), puis il salue.</p>
<p>⁕ <strong>Celui qui a manqué la prière sur le mort avant son enterrement :</strong> il prie alors sur sa tombe.</p>
<p>⁕ <strong>Celui qui est absent de la localité où se trouve le défunt :</strong> s'il apprend son décès, il lui est permis d'accomplir sur lui la prière de l'absent (<em>Salat al-Gha'ib</em>) par l'intention.</p>
<p>⁕ <strong>Le fœtus de la femme s'il sort mort (fausse couche) :</strong> s'il a atteint l'âge de quatre mois ou plus, on accomplit sur lui la prière funéraire. S'il a moins de quatre mois, on ne prie pas sur lui.</p>
<h4 id="sixièmement-porter-le-mort-et-lenterrer"><strong>Sixièmement : Porter le mort et l'enterrer:</strong></h4>
<p>⁕ <strong>Porter le défunt et l'enterrer</strong> fait partie des obligations de suffisance communautaire (<strong>Fard al-Kifaya</strong>) pour les musulmans qui ont connaissance de sa situation.</p>
<p>Son enterrement est prescrit par le <strong>Livre</strong> (le Coran) et la <strong>Sunna</strong> :</p>
<p>Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿أَلَمْ نَجْعَلِ الْأَرْضَ كِفَاتًا * أَحْيَاءً وَأَمْوَاتًا﴾ [المرسلات]</span></p>
<p>« <em><strong>N'avons-Nous pas fait de la terre un lieu de rassemblement, pour les vivants aussi bien que pour les morts ?</strong></em> » (Sourate Al-Mursalat).</p>
<p>Allah le Très-Haut a également dit :</p>
<p class="ar"><span dir="rtl">﴿ثُمَّ أَمَاتَهُ فَأَقْبَرَهُ﴾ [عبس]</span></p>
<p>« <em><strong>Puis Il lui donne la mort et le fait mettre au tombeau</strong></em> » (Sourate 'Abasa) ; c'est-à-dire qu'Il a fait de lui quelqu'un qui possède une sépulture.</p>
<p>Les <strong>hadiths</strong> concernant l'enterrement du mort sont nombreux et détaillés.</p>
<p>C'est un acte de <strong>bienfaisance</strong>, d'<strong>obéissance</strong>, d'<strong>honneur</strong> rendu au défunt et de <strong>soin</strong> apporté à son égard.</p>
<p>⁕ <strong>Il est recommandé (Sunna)</strong> de suivre le cortège funèbre et d'accompagner le défunt jusqu'à sa tombe.</p>
<p>Il est rapporté dans les deux recueils authentiques (<strong>Al-Bukhari et Muslim</strong>) : « <em><strong>Quiconque assiste à une <span dir="rtl">جنازة</span> (convoi funèbre) jusqu'à ce que la prière soit accomplie sur le mort obtient un Qirat (une part de récompense) ; et quiconque y assiste jusqu'à ce qu'il soit enterré obtient deux Qirat</strong></em> ». <em>On demanda : « Que représentent les deux Qirat ? ». Il (le Prophète <span dir="rtl">ﷺ</span>) répondit : « <strong>Comme deux énormes montagnes </strong></em>».</p>
<p>Al-Bukhari utilise les termes : « <em><strong>Celui qui accompagne</strong></em> », et Muslim : « <em><strong>Celui qui sort avec elle (la <span dir="rtl">جنازة</span>), puis la suit jusqu'à ce qu'elle soit enterrée</strong></em> ». <a href="#fn23" class="footnote-ref" id="fnref23" role="doc-noteref"><sup>23</sup></a></p>
<p>Ce hadith, à travers ses différentes versions, <strong>incite fortement à accompagner le cortège funèbre jusqu'à la tombe</strong>.</p>
<p>⁕ <strong>Il est recommandé (Sunna)</strong> à celui qui suit le cortège funèbre de participer au transport du défunt si cela est possible. <strong>Il n'y a pas de mal</strong> à le transporter dans une voiture ou sur une monture, surtout si le cimetière est éloigné.</p>
<p>⁕ <strong>Il est recommandé (Sunna) de hâter le pas</strong> lors du cortège funèbre, conformément à la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«أَسْرِعُوا بالجنازةِ، فإن تَكُ صالحةً؛ فخيرٌ تُقَدِّمُونَها إليه، وإن تَكُ سوى ذلك؛ فشرٌّ تَضَعُونَهُ عن رقابكم»</span></p>
<p>« <em><strong>Hâtez-vous de porter la <span dir="rtl">جنازة</span> (le corps). Car si elle était vertueuse, c'est un bien vers lequel vous l'avancez ; et si elle était autrement, c'est un mal dont vous vous déchargez de vos cous.</strong></em> » (Rapporté par Al-Bukhari et Muslim).<a href="#fn24" class="footnote-ref" id="fnref24" role="doc-noteref"><sup>24</sup></a></p>
<p>Cependant, <strong>l'allure ne doit pas être excessivement rapide</strong>. Les porteurs et ceux qui accompagnent le cortège doivent garder <strong>la sérénité (as-Sakina)</strong>. Ils ne doivent pas élever la voix, que ce soit par la récitation (du Coran) ou par d'autres formes de <em>Tahlil</em> (dire : La ilaha illa Allah), de <em>Dhikr</em> (évocations) ou en disant : « Demandez le pardon pour lui », ou des expressions similaires ; car <strong>cela est une innovation (Bid'a)</strong>.</p>
<p>⁕ <strong>Il est interdit (Haram)</strong> aux femmes de sortir avec les cortèges funèbres. Cela s'appuie sur le hadith d'Umm 'Atiyya : « <em><strong>Il nous a été interdit de suivre les convois funèbres</strong></em> »<a href="#fn25" class="footnote-ref" id="fnref25" role="doc-noteref"><sup>25</sup></a>. Les femmes ne sortaient pas avec les convois funèbres à l'époque du Messager d'Allah <span dir="rtl">ﷺ</span>. <strong>Par conséquent, l'accompagnement des convois funèbres est un acte exclusivement réservé aux hommes</strong>.</p>
<p>⁕ <strong>Il est recommandé (Sunna)</strong> que la tombe soit profonde et spacieuse. Cela s'appuie sur la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><strong><span dir="rtl">«احْفِروا وأوْسِعوا وعَمِّقوا»</span></strong></p>
<p>« <em><strong>Creusez, élargissez et approfondissez</strong></em> ». At-Tirmidhi a déclaré à propos de ce hadith qu'il est « Bon et Authentique » (Hasan Sahih).<a href="#fn26" class="footnote-ref" id="fnref26" role="doc-noteref"><sup>26</sup></a></p>
<p>⁕ <strong>Il est recommandé (Sunna)</strong> de couvrir la tombe d'une femme au moment où on l'y dépose, car elle est une nudité (<em>'awra</em>).</p>
<p>⁕ <strong>Il est recommandé (Sunna)</strong> que celui qui dépose le défunt dans la tombe dise :</p>
<p>« <em>Au nom d'Allah, et selon la religion du Messager d'Allah</em> ».</p>
<p>Cela s'appuie sur la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><strong><span dir="rtl">«إذا وضَعْتُم مَوتاكم في القبورِ؛ فقولوا: باسمِ اللهِ، وعلى مِلَّةِ رسولِ اللهِ ﷺ»</span></strong></p>
<p>« <em><strong>Lorsque vous placez vos morts dans les tombes, dites : "Au nom d'Allah, et selon la religion du Messager d'Allah <span dir="rtl">ﷺ</span>"</strong></em> ».</p>
<p>Ce hadith est rapporté par les cinq (auteurs de recueils de Sunan), à l'exception d'An-Nasa'i, et At-Tirmidhi l'a qualifié de bon (<em>Hasan</em>).<a href="#fn27" class="footnote-ref" id="fnref27" role="doc-noteref"><sup>27</sup></a></p>
<p>⁕ <strong>Le défunt est placé dans son <em>Lahd</em> (alvéole latérale de la tombe) sur son côté droit, face à la Qibla</strong>. Cela est basé sur la parole du Prophète <span dir="rtl">ﷺ</span> concernant la Kaaba :</p>
<p class="ar"><strong><span dir="rtl">«قِبْلَتُكُمْ أحياءً وأمواتاً»</span></strong></p>
<p>« <em><strong>Elle est votre Qibla, que vous soyez vivants ou morts</strong></em> ». Ce hadith est rapporté par Abou Daoud et d'autres.<a href="#fn28" class="footnote-ref" id="fnref28" role="doc-noteref"><sup>28</sup></a></p>
<p>⁕ <strong>On place sous sa tête une brique, une pierre ou de la terre</strong>. <strong>On le rapproche de la paroi frontale de la tombe</strong>. <strong>On dispose derrière son dos un support de terre pour le caler</strong>, afin qu'il ne bascule pas sur son visage ni ne se retourne sur son dos.</p>
<p>⁕ <strong>Ensuite, l'ouverture du <em>Lahd</em> (l'alvéole) est scellée</strong> avec des briques de terre cuite et de l'argile jusqu'à ce qu'elle soit bien close. <strong>Ensuite, la terre est versée sur lui</strong>. <strong>On n'y ajoute pas de terre</strong> provenant d'un autre endroit que celle de la tombe elle-même.</p>
<p>⁕ <strong>La tombe doit être surélevée par rapport au sol d'environ un empan (<em>shibr</em>)</strong>. Elle doit avoir une forme de bosse (<strong>mousannaman</strong>) — c'est-à-dire bombée comme une bosse de chameau — afin que les eaux de pluie s'en écoulent. <strong>On y dépose des petits cailloux et on l'arrose d'eau</strong> pour que sa terre reste compacte et ne s'envole pas. <strong>La sagesse derrière sa surélévation à cette hauteur</strong> est de faire savoir qu'il s'agit d'une tombe afin qu'elle ne soit pas piétinée. <strong>Il n'y a pas de mal à placer des pierres tombales (<em>nasa'ib</em>) à ses deux extrémités</strong> pour en délimiter les contours et pour qu'elle soit reconnue, mais sans rien écrire dessus.</p>
<p>⁕ <strong>Il est recommandé</strong>, une fois l'enterrement terminé, que les musulmans se tiennent debout près de la tombe pour invoquer en faveur du défunt et demander le pardon pour lui. En effet, lorsque le Prophète <span dir="rtl">ﷺ</span> finissait d'enterrer un mort, il se tenait debout près de lui et disait :</p>
<p class="ar"><span dir="rtl">«اسْتَغْفِروا لأخيكم، واسألوا له التثبيتَ؛ فإنه الآنَ يُسأَلُ»</span></p>
<p>« <em><strong>Demandez le pardon pour votre frère et demandez pour lui la fermeté (dans ses réponses), car il est en train d'être interrogé en ce moment même</strong></em> ». (Rapporté par Abou Daoud).<a href="#fn29" class="footnote-ref" id="fnref29" role="doc-noteref"><sup>29</sup></a></p>
<p>Quant à la <strong>lecture d'une partie du Coran auprès de la tombe</strong>, cela est considéré comme une <strong>innovation (Bid'a)</strong>. La raison est que ni le Messager d'Allah <span dir="rtl">ﷺ</span> ni ses nobles compagnons ne l'ont fait, et toute innovation est un égarement.</p>
<p>⁕ <strong>Il est interdit (Haram) de construire sur les tombes</strong>, de les plâtrer (ou les enduire de chaux) et d'y écrire. Cela s'appuie sur le témoignage de Jabir : « <em><strong>Le Messager d'Allah <span dir="rtl">ﷺ</span> a interdit que la tombe soit plâtrée, qu'on s'assoie dessus et que l'on construise par-dessus</strong></em> » (Rapporté par Muslim).<a href="#fn30" class="footnote-ref" id="fnref30" role="doc-noteref"><sup>30</sup></a></p>
<p>At-Tirmidhi a également rapporté et authentifié un hadith <em>marfu'</em> (remontant au Prophète) d'après Jabir : « <em><strong>Il a interdit que les tombes soient plâtrées, qu'il y soit écrit et qu'elles soient piétinées</strong></em> ».<a href="#fn31" class="footnote-ref" id="fnref31" role="doc-noteref"><sup>31</sup></a></p>
<p><strong>La raison de cette interdiction</strong> est que ces actes constituent des moyens menant au polythéisme (<em>Shirk</em>) et à l'attachement excessif aux mausolées. En effet, lorsque les gens ignorants voient des constructions et des décorations sur les tombes, ils finissent par s'y attacher spirituellement.</p>
<p>⁕ <strong>Il est interdit d'éclairer les tombes</strong> ; c'est-à-dire de les illuminer avec des lumières électriques ou autres.</p>
<p><strong>Il est interdit de prendre les tombes comme lieux de culte (mosquées)</strong> ; c'est-à-dire d'y construire des mosquées, d'y prier à proximité ou en leur direction.</p>
<p><strong>Il est interdit aux femmes de visiter les tombes</strong>, conformément à la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><strong><span dir="rtl">«لعَنَ اللهُ زَوَّاراتِ القُبُورِ والمُتَّخِذينَ عليها المَساجِدَ والسُّرُجَ»</span></strong></p>
<p>« <em><strong>Allah a maudit les femmes qui visitent fréquemment les tombes, ainsi que ceux qui y établissent des mosquées et des lampes</strong></em> » (Rapporté par les auteurs des Sunan).<a href="#fn32" class="footnote-ref" id="fnref32" role="doc-noteref"><sup>32</sup></a></p>
<p>Il est rapporté dans le « Sahih » :</p>
<p class="ar"><strong><span dir="rtl">«لعنَ اللهُ اليهودَ والنَّصارى؛ اتَّخَذوا قُبُورَ أنبيائهم مَساجِدَ»</span></strong></p>
<p>« <em><strong>Qu'Allah maudisse les Juifs et les Chrétiens ; ils ont pris les tombes de leurs prophètes comme lieux de culte</strong></em> ».<a href="#fn33" class="footnote-ref" id="fnref33" role="doc-noteref"><sup>33</sup></a></p>
<p>La raison en est que <strong>la glorification des tombes par la construction par-dessus ou d'autres actes similaires est l'origine du polythéisme (<em>shirk</em>) dans le monde</strong>.</p>
<p>⁕ <strong>Il est interdit d'outrager les tombes</strong> en marchant dessus, en les piétinant avec des chaussures, en s'asseyant dessus, en les utilisant comme dépotoir pour les ordures ou en y déversant des eaux usées.</p>
<p>Cela s'appuie sur ce que Muslim a rapporté d'après Abu Hurayra (que le Prophète <span dir="rtl">ﷺ</span> a dit) :</p>
<p class="ar"><strong><span dir="rtl">«لأن يَجْلِسَ أحدُكُم على جَمْرَةٍ فَتَحْرِقَ ثيابَه، فَتَخْلُصَ إلى جلده، خيرٌ من أن يَجْلِسَ على قَبْرٍ»</span></strong></p>
<p>« <em><strong>S'asseoir sur une braise qui brûle vos vêtements jusqu'à atteindre la peau est préférable pour l'un d'entre vous que de s'asseoir sur une tombe</strong></em> ».<a href="#fn34" class="footnote-ref" id="fnref34" role="doc-noteref"><sup>34</sup></a></p>
<p>⁕ L'Imam Ibn al-Qayyim (qu'Allah lui fasse miséricorde) a dit : « <em>Quiconque médite sur l'interdiction de s'asseoir sur une tombe, de s'y adosser ou de la piétiner, saura que cette interdiction n'a été instaurée que par respect pour ses occupants, afin que leurs têtes ne soient pas foulées par les semelles des chaussures</em> ».<a href="#fn35" class="footnote-ref" id="fnref35" role="doc-noteref"><sup>35</sup></a></p>
<h4 id="septièmement-les-règles-des-condoléances-et-de-la-visite-des-tombes."><strong>Septièmement : Les règles des condoléances et de la visite des tombes.</strong></h4>
<p>⁕ Il est recommandé (Sunna) de présenter ses condoléances à la personne touchée par un décès, de l'inciter à la patience et d'invoquer en faveur du défunt. Ceci en raison de ce qu'a rapporté Ibn Mâjah — avec une chaîne de transmission composée de narrateurs de confiance — d'après 'Amr ibn Hazm, dans un hadith attribué au Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><strong><span dir="rtl">«ما مِنْ مؤمنٍ يُعَزِّي أخاه بمصيبةٍ؛ إلا كَسَاه اللهُ من حُلَلِ الكَرَامةِ يومَ القيامةِ»</span></strong></p>
<p>« <em><strong>Il n'est pas un croyant qui présente ses condoléances à son frère suite à une épreuve, sans qu'Allah ne le vête des parures de l'honneur le Jour de la Résurrection</strong></em> »<a href="#fn36" class="footnote-ref" id="fnref36" role="doc-noteref"><sup>36</sup></a>. D'autres hadiths ont été rapportés avec le même sens.</p>
<p>⁕ La formulation des condoléances consiste à dire :</p>
<p class="ar"><span dir="rtl">«أعْظَمَ اللهُ أجْرَكَ، وأحْسَنَ عَزَاءَكَ، وغَفَرَ لِمَيِّتِكَ»</span></p>
<p>« <em>Qu'Allah augmente ta récompense, qu'Il t'accorde la meilleure des consolations et qu'Il pardonne à ton défunt</em>. »</p>
<p>⁕ Il ne convient pas de s'asseoir spécialement pour recevoir les condoléances ni d'en faire l'annonce, comme le font certaines personnes aujourd'hui. En revanche, il est recommandé de préparer un repas pour la famille du défunt et de le leur envoyer, conformément à la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><strong><span dir="rtl">«اصْنَعُوا لآلِ جعفر طعاماً؛ فقد جاءَهُم ما يَشْغَلُهم»</span></strong></p>
<p>« <em><strong>Préparez de la nourriture pour la famille de Ja'far, car il leur est arrivé ce qui les occupe (leur propre épreuve)</strong></em> ». Rapporté par Ahmad et At-Tirmidhi, qui l'a jugé bon (Hassan).<a href="#fn37" class="footnote-ref" id="fnref37" role="doc-noteref"><sup>37</sup></a></p>
<p>⁕ Quant à ce que font certaines personnes aujourd'hui, à savoir que la famille du défunt prépare un lieu pour rassembler les gens chez eux, prépare de la nourriture, loue les services de récitateurs pour lire le Coran et supporte pour cela des frais financiers ; ceci fait partie des veillées funèbres (funérailles organisées) interdites et innovées. Cela s'appuie sur ce qu'a rapporté l'Imam Ahmad d'après Jarir ibn 'Abdillah, qui a dit : "<em><strong>Nous considérions le fait de se rassembler chez la famille du défunt et la préparation de nourriture après son enterrement comme une forme de lamentation (Niyaha).</strong></em>" Et sa chaîne de transmission est composée de narrateurs de confiance.<a href="#fn38" class="footnote-ref" id="fnref38" role="doc-noteref"><sup>38</sup></a></p>
<p>⁕ Cheikh al-Islâm Ibn Taymiyya — qu'Allah lui fasse miséricorde — a dit : "<em>Le fait que la famille du défunt rassemble les gens autour d'un repas pour qu'ils lisent [le Coran] et lui en offrent la récompense n'était pas une pratique connue chez les Pieux Prédécesseurs (as-Salaf). Des groupes parmi les gens de science l'ont détesté pour plusieurs raisons</em>". Fin de citation.</p>
<p>At-Tartoûshî a dit : "<em>Quant aux veillées funèbres (al-Ma'âtim), elles sont interdites par consensus des savants. La veillée funèbre consiste à se rassembler suite à l'épreuve [du décès] ; c'est une innovation blâmable au sujet de laquelle rien n'a été rapporté [des textes]. Il en est de même pour ce qui suit, comme le rassemblement le deuxième, troisième, quatrième, septième jour, ou au bout d'un mois ou d'un an ; tout cela est un fléau. Et si cela est financé par l'héritage alors que parmi les héritiers se trouve une personne sous tutelle (mineur/incapable) ou quelqu'un n'ayant pas donné son accord, alors cet acte est interdit, tout comme il est interdit d'en manger</em>". Fin de citation.</p>
<p>⁕ La visite des tombes est recommandée pour les hommes spécifiquement, afin d'en tirer des leçons et une exhortation, ainsi que pour invoquer en faveur des morts et demander le pardon pour eux. Ceci conformément à la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><strong><span dir="rtl">«كنتُ نَهَيْتُكم عن زيارةِ القُبُورِ؛ فَزُوروها»</span></strong></p>
<p>"<em><strong>Je vous avais interdit la visite des tombes, désormais visitez-les</strong></em>". Rapporté par Muslim et At-Tirmidhi, ce dernier ayant ajouté :</p>
<p class="ar"><strong><span dir="rtl">«فإنها تُذَكِّرُ الآخرةَ»</span></strong></p>
<p>"<em><strong>car elle rappelle l'au-delà</strong></em>". <a href="#fn39" class="footnote-ref" id="fnref39" role="doc-noteref"><sup>39</sup></a></p>
<p>Cela doit se faire sans voyage [spécifique] ; ainsi, <strong>la visite des tombes est recommandée sous trois conditions :</strong></p>
<p>1- Que le visiteur soit un homme et non une femme, car le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><strong><span dir="rtl">«لعنَ اللهُ زَوَّاراتِ القُبُورِ»</span></strong></p>
<p><strong>"<em>Qu'Allah maudisse les femmes qui visitent fréquemment les tombes</em>".</strong><a href="#fn40" class="footnote-ref" id="fnref40" role="doc-noteref"><sup>40</sup></a></p>
<p>2- Que cela se fasse sans voyage [entrepris spécifiquement pour la tombe] ; conformément à la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><strong><span dir="rtl">«لا تُشَدُّ الرحالُ إلا إلى ثلاثةِ مَسَاجِدَ».</span></strong><a href="#fn41" class="footnote-ref" id="fnref41" role="doc-noteref"><sup>41</sup></a></p>
<p>"<em><strong>On n'entreprend de voyage [pour un lieu sacré] que vers trois mosquées</strong></em>". »<a href="#fn42" class="footnote-ref" id="fnref42" role="doc-noteref"><sup>42</sup></a></p>
<p>3 - Que le but de la visite soit d'en tirer une leçon, une exhortation et d'invoquer pour les morts. Si le but est de rechercher la bénédiction (Tabarruk) auprès des tombes et des mausolées, de demander l'accomplissement des besoins ou la dissipation des afflictions auprès des morts, alors il s'agit d'une visite innovée et polythéiste (shirkiyya).</p>
<p>Cheikh al-Islâm Ibn Taymiyya — qu'Allah lui fasse miséricorde — a dit <a href="#fn43" class="footnote-ref" id="fnref43" role="doc-noteref"><sup>43</sup></a>: "<em>La visite des tombes est de deux types : légiférée (char'iyya) et innovée (bid'iyya).</em></p>
<p><em><strong>La visite légiférée :</strong> son but est de passer le salut au mort et d'invoquer en sa faveur, tout comme on le vise par la prière funéraire (Janaza), et ce, sans entreprendre de voyage. »</em></p>
<p><em><strong>La visite innovée :</strong> c'est lorsque l'intention du visiteur est de demander l'accomplissement de ses besoins à ce mort, et ceci est du polythéisme majeur (shirk akbar). Ou bien qu'il vise à invoquer [Allah] auprès de sa tombe, ou à invoquer par son intermédiaire ; ceci est une innovation blâmable, un moyen menant au polythéisme, cela ne fait pas partie de la Sunna du Prophète <span dir="rtl">ﷺ</span> et aucun des Pieux Prédécesseurs de la communauté ni aucun de ses imams ne l'a recommandé</em>". Fin de citation. »</p>
<p>Et Allah Ta'âla est plus Savant. Qu'Allah prie sur notre Prophète Muhammad, sa famille et ses compagnons, et leur accorde le salut.</p>
