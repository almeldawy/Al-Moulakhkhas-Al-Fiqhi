<p>⁕ Certes, Allah <span dir="rtl">ﷻ</span> a rendu obligatoire le jeûne de Ramadan pour les musulmans ; comme une pratique à accomplir en son temps pour ceux qui n'ont pas d'excuse valable, et comme une dette à rattraper pour ceux qui ont des excuses mais qui sont capables de jeûner ultérieurement. Il existe cependant une troisième catégorie de personnes qui ne peuvent jeûner ni en son temps, ni plus tard : comme le vieillard très âgé ou le malade dont on n'espère plus la guérison. Pour cette catégorie, Allah a allégé la charge en leur imposant, en remplacement du jeûne, de nourrir un pauvre pour chaque jour manqué, à hauteur d'un demi-Sa' de nourriture.</p>
<p>Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="ltr">﴿</span><strong><span dir="rtl">لَا يُكَلِّفُ اللَّهُ نَفْسًا إِلَّا وُسْعَهَا</span></strong><span dir="rtl">﴾ [البقرة: ٢٨٦]</span></p>
<p><strong>« <em>Allah n'impose à aucune âme une charge supérieure à sa capacité.</em> »</strong> [Sourate Al-Baqarah : 286]</p>
<p>Le Très-Haut a également dit :</p>
<p class="ar"><span dir="ltr">﴿</span><strong><span dir="rtl">وَعَلَى الَّذِينَ يُطِيقُونَهُ فِدْيَةٌ طَعَامُ مِسْكِينٍ</span></strong><span dir="rtl">﴾ [البقرة: ١٨٤]</span></p>
<p><strong>« <em>Mais pour ceux qui ne pourraient l'assumer (qu'avec grande difficulté), il y a une compensation : nourrir un pauvre.</em> »</strong> [Sourate Al-Baqarah : 184]</p>
<p>Ibn 'Abbâs <span dir="rtl">رَضِيَ اللهُ عَنْهُمَا</span> a dit :</p>
<p class="ar"><strong><span dir="rtl">«هِيَ لِلكَبِيرِ الذِي لَا يَسْتَطِيعُ الصَّومَ»</span></strong></p>
<p><strong>« <em>(Ce verset) concerne l'homme âgé qui n'est plus capable de jeûner.</em> »</strong> (Rapporté par Al-Bukhârî).<a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a></p>
<p>⁕ Et le malade dont on n'espère pas la guérison de sa maladie est régi par le même statut que la personne âgée : il doit donc nourrir un pauvre pour chaque jour (de jeûne manqué).</p>
<p>⁕ <strong>Quant à celui qui rompt le jeûne pour une excuse temporaire</strong> :</p>
<ul>
<li><blockquote>
<p>Comme le <strong>voyageur</strong> ou le <strong>malade</strong> dont on espère la guérison.</p>
</blockquote></li>
<li><blockquote>
<p>La femme <strong>enceinte</strong> et celle qui <strong>allaite</strong>, si elles craignent pour elles-mêmes ou pour leurs enfants.</p>
</blockquote></li>
<li><blockquote>
<p>La femme ayant ses <strong>règles</strong> (menstrues) ou ses <strong>lochies</strong>.</p>
</blockquote></li>
</ul>
<p>Pour chacune de ces personnes, le <strong>rattrapage (Al-Qada') est obligatoire</strong> :</p>
<ul>
<li><blockquote>
<p>Elles doivent jeûner ultérieurement un nombre de jours égal à ceux qui ont été manqués.</p>
</blockquote></li>
</ul>
<p>Le Très-Haut a dit :</p>
<p class="ar"><span dir="ltr">﴿</span><strong><span dir="rtl">وَمَن كَانَ مَرِيضًا أَوْ عَلَى سَفَرٍ فَعِدَّةٌ مِّنْ أَيَّامٍ أُخَرَ</span></strong><span dir="rtl">﴾ [البقرة: ١٨٥]</span></p>
<p><strong>« <em>Quiconque est malade ou en voyage, alors qu'il jeûne un nombre égal d'autres jours.</em> »</strong> [Sourate Al-Baqarah : 185].</p>
<p>⁕ La rupture du jeûne est une Sunna (recommandée) pour le malade à qui le jeûne nuit et pour le voyageur autorisé à raccourcir ses prières.</p>
<p>Cela s'appuie sur la parole du Très-Haut à leur sujet :</p>
<p class="ar"><span dir="ltr">﴿</span><strong><span dir="rtl">فَعِدَّةٌ مِّنْ أَيَّامٍ أُخَرَ</span></strong><span dir="ltr">﴾</span></p>
<p>« <em><strong>...alors qu'il jeûne un nombre égal d'autres jours</strong></em> », ce qui signifie : qu'il rompe son jeûne et qu'il rattrape le nombre de jours manqués.</p>
<p>Le Très-Haut a dit :</p>
<p class="ar"><span dir="ltr">﴿</span><strong><span dir="rtl">يُرِيدُ اللَّهُ بِكُمُ الْيُسْرَ وَلَا يُرِيدُ بِكُمُ الْعُسْرَ</span></strong><span dir="rtl">﴾ [البقرة: ١٨٥]</span></p>
<p>« <em><strong>Allah veut pour vous la facilité, Il ne veut pas pour vous la difficulté</strong></em> » [Sourate Al-Baqarah : 185].</p>
<p>De plus, chaque fois que le Prophète <span dir="rtl">ﷺ</span> avait le choix entre deux options, il choisissait toujours la plus facile des deux.</p>
<p>Il est également rapporté dans les deux recueils authentiques (Al-Bukhârî et Muslim):</p>
<p class="ar"><span dir="ltr">«</span><strong><span dir="rtl">لَيْسَ مِنَ الْبِرِّ الصِّيَامُ فِي السَّفَرِ</span></strong><span dir="ltr">»</span></p>
<p>« <em><strong>Il ne relève pas de la piété de jeûner en voyage</strong></em> ».<a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a></p>
<p>⁕ <strong>Si le voyageur ou le malade pour qui le jeûne est pénible choisissent de jeûner</strong> :</p>
<ul>
<li><blockquote>
<p>Leur jeûne est considéré comme valide, bien que cela soit jugé détestable (<em>Makrûh</em>).</p>
</blockquote></li>
</ul>
<p><strong>Quant à la femme ayant ses règles ou ses lochies</strong> :</p>
<ul>
<li><blockquote>
<p>Le jeûne lui est interdit (<em>Harâm</em>) pendant la durée des menstrues ou des lochies.</p>
</blockquote></li>
<li><blockquote>
<p>S'il est accompli, ce jeûne n'est pas valide.</p>
</blockquote></li>
</ul>
<p>⁕ <strong>La femme qui allaite et la femme enceinte</strong> ont l'obligation de rattraper les jours qu'elles ont manqués en jeûnant ultérieurement.</p>
<p><strong>En plus du rattrapage</strong>, celle qui a rompu le jeûne par crainte pour son enfant <strong>a l'obligation de nourrir un pauvre pour chaque jour manqué</strong>.</p>
<p>L'éminent savant Ibn al-Qayyim (qu'Allah lui fasse miséricorde) a dit <a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a>: « <em>Ibn 'Abbâs ainsi que d'autres Compagnons ont émis l'avis juridique suivant concernant la femme enceinte et celle qui allaite : Si elles craignent pour leurs enfants, elles peuvent rompre le jeûne et nourrir un pauvre pour chaque jour manqué ; en substituant ainsi la nourriture au jeûne.</em> »</p>
<p>Cela signifie : [<em>nourrir un pauvre</em>] en tant qu'acte immédiat, tout en ayant l'obligation de rattraper ultérieurement les jours de jeûne.</p>
<p>⁕ Il est obligatoire de rompre le jeûne pour celui qui en a besoin afin de sauver une personne en danger de mort, comme quelqu'un qui se noie ou un cas similaire.</p>
<p>Ibn al-Qayyim a dit : « <em>Les causes permettant de rompre le jeûne sont au nombre de quatre : le voyage, la maladie, les menstrues, et la crainte de la perte de celui pour qui l'on redoute la mort à cause du jeûne ; comme la femme qui allaite et la femme enceinte, et il en va de même pour le cas de la personne qui se noie</em> » <a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a>.</p>
<p>⁕ Il est obligatoire pour le musulman de définir l'intention du jeûne obligatoire dès la nuit, comme pour le jeûne du Ramadan, le jeûne d'expiation (Kaffâra), ou le jeûne consécutif à un vœu (Nadhr) ; cela consiste à avoir la ferme conviction qu'il jeûne pour le Ramadan (ou son rattrapage), pour un vœu ou pour une expiation.</p>
<p>Ceci s'appuie sur la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="ltr">«</span><strong><span dir="rtl">إِنَّمَا الأَعْمَالُ بِالنِّيَّاتِ، وَإِنَّمَا لِكُلِّ امْرِئٍ مَا نَوَى</span></strong><span dir="ltr">»</span></p>
<p>« <em><strong>Les actions ne valent que par les intentions, et chacun n'aura que ce qu'il a eu l'intention de faire</strong></em> » <a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a>.</p>
<p>De plus, selon 'Aïcha, dans un hadith élevé (marfû') :</p>
<p class="ar"><span dir="ltr">«</span><strong><span dir="rtl">مَن لَم يُبَيِّتِ الصِّيَامَ قَبْلَ طُلُوعِ الفَجْرِ؛ فَلَا صِيَامَ لَهُ</span></strong><span dir="ltr">»</span></p>
<p>« <em><strong>Celui qui n'a pas consacré son intention de jeûner avant l'aube, son jeûne n'est pas valide</strong></em> » <a href="#fn6" class="footnote-ref" id="fnref6" role="doc-noteref"><sup>6</sup></a>.</p>
<p>Il est donc impératif de formuler l'intention du jeûne obligatoire durant la nuit. Ainsi, quiconque prend l'intention de jeûner durant la journée — par exemple celui qui se réveille sans avoir rien mangé après l'aube, puis décide de jeûner — son jeûne ne sera pas valide, sauf s'il s'agit d'un jeûne surérogatoire (Tatawwu').</p>
<p>Quant au jeûne obligatoire, il ne peut être validé par une intention prise en cours de journée, car l'obligation du jeûne doit couvrir la totalité de la journée et l'intention ne peut avoir d'effet rétroactif sur le temps déjà écoulé.</p>
<p>⁕ Quant au jeûne surérogatoire (An-Nafl), il est permis de le commencer avec une intention prise durant la journée.</p>
<p>Cela s'appuie sur le hadith de 'Aïcha (qu'Allah l'agrée) qui rapporte : « <em><strong>Le Prophète <span dir="rtl">ﷺ</span> entra chez moi un jour et demanda : "Avez-vous quelque chose [à manger] ?" Nous répondîmes : "Non". Il dit alors : "Dans ce cas, je jeûne"</strong></em> ».</p>
<p>Ce hadith est rapporté par l'ensemble du groupe (Al-Jamâ'ah) à l'exception d'Al-Bukhârî.<a href="#fn7" class="footnote-ref" id="fnref7" role="doc-noteref"><sup>7</sup></a></p>
<p>Il ressort de ce hadith que le Prophète <span dir="rtl">ﷺ</span> ne jeûnait pas au préalable puisqu'il avait demandé de la nourriture.</p>
<p>Ceci constitue une preuve de la permission de retarder l'intention du jeûne lorsqu'il s'agit d'un acte volontaire (Tatawwu'), ce qui vient spécifier les preuves qui l'interdisent [pour le jeûne obligatoire].</p>
<p><strong>La condition de validité du jeûne surérogatoire avec une intention prise en journée est qu'aucun acte incompatible avec le jeûne, tel que manger ou boire, n'ait eu lieu avant cette intention.</strong></p>
<p>Si la personne a commis un acte qui rompt le jeûne avant d'en avoir formulé l'intention, son jeûne n'est pas valide, et cela sans divergence [entre les savants].</p>
