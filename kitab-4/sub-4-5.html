<p>⁕ Quiconque rompt le jeûne durant le mois de Ramadan pour une raison autorisée، telle que les excuses religieuses (légales) qui permettent la rupture du jeûne، ou pour une raison interdite، comme celui qui annule son jeûne par un rapport charnel ou autre، il lui est alors obligatoire de rattraper ce jeûne، conformément à la parole d'Allah (le Très-Haut) :</p>
<p class="ar"><span dir="ltr">﴿</span><strong><span dir="rtl">فَعِدَّةٌ مِّنْ أَيَّامٍ أُخَرَ</span></strong><span dir="rtl">﴾ [البقرة: ١٨٤]</span></p>
<p>{<em><strong>Alors، il devra jeûner un nombre égal d'autres jours</strong></em>} [Al-Baqarah : 184].</p>
<p>⁕ Il lui est recommandé (Mustahabb) de s'empresser d'accomplir le rattrapage afin de s'acquitter de sa dette envers Allah. Il est également recommandé que le rattrapage soit effectué de manière consécutive، car le rattrapage suit la règle de l'accomplissement initial (l'acte de base). S'il ne rattrape pas immédiatement، il a alors l'obligation d'en avoir la ferme intention (Al-'Azm). Il lui est permis de retarder [le rattrapage] car le temps imparti pour celui-ci est étendu، et tout acte obligatoire dont le temps est étendu peut être retardé à condition d'avoir la ferme intention de l'accomplir. De même، il est permis de le fractionner en jeûnant les jours de manière séparée. Cependant، s'il ne reste du mois de Sha'bân que l'équivalent du nombre de jours qu'il doit rattraper، la consécutivité devient alors obligatoire à l'unanimité (Ijmâ') en raison de la restriction du temps. Il n'est pas permis de retarder le rattrapage au-delà du Ramadan suivant sans excuse valable، conformément à la parole de 'Âïsha (qu'Allah l'agrée) :</p>
<p class="ar"><span dir="ltr">«</span><strong><span dir="rtl">كَانَ يَكُونُ عَلَيَّ الصَّوْمُ مِنْ رَمَضَانَ، فَمَا أَسْتَطِيعُ أَنْ أَقْضِيَهُ إِلَّا فِي شَعْبَانَ؛ لِمَكَانِ رَسُولِ اللهِ ﷺ</span></strong><span dir="ltr">»</span></p>
<p>"<em><strong>Il m'arrivait d'avoir des jours de jeûne à rattraper du mois de Ramadan et je n'étais capable de les rattraper qu'en Sha'bân، en raison de la place qu'occupait le Messager d'Allah <span dir="rtl">ﷺ</span>.</strong></em>" Rapporté par Al-Bukhârî et Muslim.<a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a></p>
<p>Ceci prouve donc que le temps du rattrapage est étendu jusqu'à ce qu'il ne reste de Sha'bân que la durée correspondant aux jours dus ; il devient alors obligatoire de les jeûner avant l'entrée du nouveau mois de Ramadan.</p>
<p>⁕ Si la personne retarde le rattrapage (Al-Qadâ) jusqu'à ce que le nouveau Ramadan arrive، elle doit alors jeûner le Ramadan actuel، puis rattraper les jours qu'elle doit après cela. Ensuite :</p>
<ul>
<li><blockquote>
<p>Si ce retard était dû à une excuse valable ne lui ayant pas permis de rattraper son jeûne durant cette période، elle n'a alors que le rattrapage à effectuer (sans compensation).</p>
</blockquote></li>
<li><blockquote>
<p>Mais si ce retard était sans excuse valable، elle a alors l'obligation، en plus du rattrapage، de nourrir un pauvre pour chaque jour dû، à raison d'un demi-Sâ' de la nourriture locale de base.</p>
</blockquote></li>
</ul>
<p>⁕ Si une personne qui doit des jours de rattrapage meurt avant l'entrée du nouveau mois de Ramadan, elle n'est redevable de rien ; car il lui était permis de retarder [le rattrapage] durant cette période au cours de laquelle elle est décédée.</p>
<p>Si elle meurt après l'entrée du nouveau Ramadan :</p>
<ul>
<li><blockquote>
<p>Si le fait d'avoir retardé le rattrapage était dû à une excuse valable — comme la maladie ou le voyage — jusqu'à ce que le nouveau Ramadan ne la surprenne, elle n'est redevable de rien non plus.</p>
</blockquote></li>
<li><blockquote>
<p>Mais si elle a retardé sans excuse valable, l'expiation (Kaffâra) devient alors obligatoire et doit être prélevée de son héritage ; cela consiste à nourrir un pauvre pour chaque jour dû en son nom.</p>
</blockquote></li>
</ul>
<p>⁕ Si une personne décède alors qu'elle devait accomplir un jeûne d'expiation, comme le jeûne de l'expiation du <strong>Dhihâr</strong> <a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a>(une forme de désaveu conjugal) ou le jeûne obligatoire remplaçant le sacrifice (le sang) dû pour le <strong>Hajj al-Tamattu'</strong> : Il faut alors nourrir un pauvre en son nom pour chaque jour dû, et on ne jeûne pas à sa place. Cette nourriture doit être prélevée de son héritage (succession) car 'il s'agit d'un jeûne pour lequel la délégation (le remplacement par autrui) n'est pas admise durant la vie ; il en est donc de même après la mort. Telle est l'opinion de la majorité des gens de science (savants).</p>
<p>⁕ Si une personne décède alors qu'elle devait accomplir un jeûne suite à un vœu (Nadhr)، il est recommandé (Mustahabb) à son tuteur (Walî) de jeûner pour elle. Ceci en raison de ce qui est authentifié dans les "Deux Sahîhs" (Al-Bukhârî et Muslim) : une femme vint voir le Prophète <span dir="rtl">ﷺ</span> et dit : "<em><strong>Ma mère est morte alors qu'elle devait un jeûne de vœu ; puis-je jeûner pour elle ?</strong></em>" Il répondit : "<em><strong>Oui</strong></em>" <a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a>. Et le tuteur (Walî) est l'héritier.</p>
<p><strong>Ibn al-Qayyim (qu'Allah lui fasse miséricorde) a dit :</strong> « <em>On jeûne à sa place pour le vœu (Nadhr) mais pas pour l'obligation originelle (le jeûne du Ramadan). C'est là l'école (Madhhab) d'Ahmad et d'autres، et c'est ce qui est rapporté textuellement d'Ibn 'Abbâs et de 'Âïsha. C'est également ce qu'impliquent la preuve et l'analogie (Qiyâs) ; car le vœu n'est pas obligatoire à l'origine de la Législation، mais c'est la personne elle-même qui se l'est imposé. Il prend donc le statut d'une dette، et c'est pour cela que le Prophète <span dir="rtl">ﷺ</span> l'a comparé à une dette. Quant au jeûne qu'Allah lui a imposé initialement (le Ramadan)، il constitue l'un des piliers de l'Islam ; la délégation (le fait d'être remplacé par autrui) n'y est donc aucunement admise، tout comme elle n'est pas admise pour la prière ou les deux témoignages de foi. En effet، l'objectif de ces actes est l'obéissance du serviteur par lui-même et son accomplissement du droit de l'adoration pour lequel il a été créé et ordonné. Or، personne d'autre ne peut accomplir cela à sa place، tout comme personne d'autre ne peut prier à sa place</em> .»<a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a></p>
<p><strong>Cheikh al-Islâm Ibn Taymiyyah (qu'Allah lui fasse miséricorde) a dit :</strong> « <em>On nourrit en son nom un pauvre pour chaque jour [manqué]. C'est l'avis qu'ont adopté Ahmad, Ishâq et d'autres qu'eux. Cela est conforme au raisonnement déductif tout comme cela est requis par les textes (Al-Athar). En effet, le vœu (An-Nadhr) est une obligation qui demeure à la charge [du défunt], elle doit donc être accomplie après sa mort. Quant au jeûne de Ramadan, Allah ne l'a pas imposé à celui qui en est incapable ; Il a plutôt ordonné à la personne incapable de verser une compensation (Al-Fidyah) consistant à nourrir un pauvre. Le rattrapage (Al-Qadâ') ne s'impose qu'à celui qui en a eu la capacité, non à celui qui en a été incapable. Il n'est donc pas nécessaire que quiconque rattrape [le jeûne de Ramadan] pour autrui. Quant au jeûne lié à un vœu et aux autres actes promis par vœu, ils sont accomplis au nom [du défunt] sans divergence, conformément aux hadiths authentiques.</em> »</p>

<li id="fn2"><p>Note du traducteur : Le Dhihâr (<span dir="rtl">الظِّهَار</span>) est une pratique datant de l'époque pré-islamique (la Jâhiliyyah) qui consiste, pour un mari, à assimiler sa femme à une femme qui lui est éternellement interdite (comme sa mère ou sa sœur) afin de rendre les rapports conjugaux illicites. Le terme vient du mot arabe Dahr (le dos). Historiquement, l'homme disait à son épouse : "Tu es pour moi comme le dos de ma mère". Par cette parole, il déclarait que son épouse était désormais aussi interdite pour lui que sa propre mère. L'Islam a fermement condamné cette pratique, la qualifiant dans le Coran de "parole blâmable et mensongère" (Sourate Al-Mujadilah, verset 2).<a href="#fnref2" class="footnote-back" role="doc-backlink">↩︎</a></p></li>
<li id="fn3"><p>Rapporté par Al-Bukhârî (1953) et Muslim (1148).<a href="#fnref3" class="footnote-back" role="doc-backlink">↩︎</a></p></li>

</ol>
