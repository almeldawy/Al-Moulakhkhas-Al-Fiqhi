<h2 id="بسم-الله-الرحمن-الرحيم"><span dir="rtl">بِسْمِ اللهِ الرَّحْمَنِ الرَّحِيم</span>ِ</h2>
<p><strong>Chapitre sur l'obligation du jeûne de Ramadan et son moment</strong></p>
<p>⁕ Le jeûne du mois de Ramadan est l'un des piliers de l'Islam et une obligation parmi les obligations d'Allah ; c'est un fait connu de la religion par nécessité (évidence).</p>
<p>⁕ Les preuves en sont : le Livre (le Coran), la Sunna et le Consensus (Al-ijmâ')</p>
<p>Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="ltr">﴿</span><strong><span dir="rtl">يَا أَيُّهَا الَّذِينَ آمَنُوا كُتِبَ عَلَيْكُمُ الصِّيَامُ كَمَا كُتِبَ عَلَى الَّذِينَ مِنْ قَبْلِكُمْ...﴾ إِلَى قَوْلِهِ تَعَالَى: ﴿شَهْرُ رَمَضَانَ الَّذِي أُنْزِلَ فِيهِ الْقُرْآنُ هُدًى لِلنَّاسِ وَبَيِّنَاتٍ مِنَ الْهُدَى وَالْفُرْقَانِ فَمَنْ شَهِدَ مِنْكُمُ الشَّهْرَ فَلْيَصُمْهُ...</span></strong><span dir="rtl">﴾ الآيَة [البقرة: ١٨٣ - ١٨٥]</span></p>
<p>{<em><strong>Ô vous qui croyez ! Le jeûne vous est prescrit comme il a été prescrit à ceux qui vous ont précédés...} jusqu'à Sa parole : {Le mois de Ramadan au cours duquel le Coran a été descendu comme guide pour les gens, et preuves claires de la bonne direction et du discernement. Donc, quiconque d'entre vous est présent en ce mois, qu'il jeûne...</strong></em>} [La Vache : 183-185].</p>
<p>Le sens de {<em><strong>prescrit</strong></em>} (kutiba) est "rendu obligatoire" (furida), et Sa parole {<em><strong>qu'il jeûne</strong></em>} est un impératif qui implique l'obligation.</p>
<p>Et le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="ltr">«</span><strong><span dir="rtl">بُنِيَ الإِسْلَامُ عَلَى خَمْسٍ</span></strong><span dir="ltr">»</span></p>
<p>« <em><strong>L'Islam est bâti sur cinq [piliers]</strong></em> »<a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a>, et il a cité parmi eux le jeûne de Ramadan.</p>
<p>Les hadiths prouvant son caractère obligatoire et ses mérites sont nombreux et célèbres.</p>
<p>Et les musulmans sont unanimes (Consensus) sur l'obligation de le jeûner, et sur le fait que celui qui le nie est devenu mécréant.</p>
<p>⁕ La sagesse derrière la prescription du jeûne réside dans le fait qu’il contient une purification de l’âme, ainsi qu'un assainissement et un nettoyage de celle-ci contre les mauvais mélanges et les mœurs viles. En effet, il [le jeûne] rétrécit les conduits du Diable dans le corps de l'être humain, car le Diable circule chez le fils d'Adam comme circule le sang. Ainsi, lorsqu'il mange ou boit, son âme s'épanouit pour les plaisirs charnels, sa volonté s'affaiblit et son désir pour les actes d'adoration diminue ; tandis que le jeûne produit l'effet inverse de cela.</p>
<p>Le jeûne incite au renoncement à ce bas-monde et à ses plaisirs, et encourage [à œuvrer pour] l'au-delà. Il contient également un motif poussant à la compassion envers les pauvres et au ressenti de leurs douleurs, en raison de ce que le jeûneur goûte comme souffrance de la faim et de la soif. Car l<strong>e jeûne, selon la législation islamique, est le fait de s'abstenir, avec l'intention (Niyyah), de choses spécifiques telles que manger, boire, avoir des rapports charnels et autres éléments mentionnés par la Loi, et cela s'accompagne de l'abstention des propos grossiers et de la perversité</strong>.</p>
<p>⁕ L'obligation du jeûne quotidien commence à l'apparition de la seconde aube, qui est la blancheur s'étendant horizontalement à l'horizon, et elle se termine au coucher du soleil. Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="ltr">﴿</span><strong><span dir="rtl">فَالآنَ بَاشِرُوهُنَّ</span></strong><span dir="rtl">﴾ (يَعْنِي: الزَّوْجَاتِ) ﴿<strong>وَابْتَغُوا مَا كَتَبَ اللَّهُ لَكُمْ وَكُلُوا وَاشْرَبُوا حَتَّى يَتَبَيَّنَ لَكُمُ الْخَيْطُ الْأَبْيَضُ مِنَ الْخَيْطِ الْأَسْوَدِ مِنَ الْفَجْرِ ثُمَّ أَتِمُّوا الصِّيَامَ إِلَى اللَّيْلِ</strong></span><span dir="rtl">﴾ [البقرة: ١٨٧]</span></p>
<p>{<em><strong>Cohabitez donc avec elles maintenant</strong></em>} (c'est-à-dire : les épouses) {<em><strong>et cherchez ce qu'Allah a prescrit pour vous. Mangez et buvez jusqu'à ce que se distingue, pour vous, le fil blanc du fil noir de l'aube. Puis accomplissez le jeûne jusqu'à la nuit</strong></em>} [La Vache : 187].</p>
<p>Le sens de {<em><strong>jusqu'à ce que se distingue, pour vous, le fil blanc du fil noir de l'aube</strong></em>} est : que la blancheur du jour devienne claire par rapport à la noirceur de la nuit.</p>
<p>⁕ L'obligation de jeûner le mois de Ramadan commence dès que son début (son entrée) est connu.</p>
<p>⁕ <strong>Il existe trois méthodes pour connaître son commencement :</strong></p>
<p><strong>⁃ La première méthode :</strong> La vision de son croissant lunaire.</p>
<p>Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="ltr">﴿</span><strong><span dir="rtl">فَمَن شَهِدَ مِنكُمُ الشَّهْرَ فَلْيَصُمْهُ</span></strong><span dir="rtl">﴾ [البقرة: ١٨٥]</span></p>
<p>{<em><strong>Donc, quiconque d'entre vous est présent en ce mois, qu'il jeûne</strong></em>} [La Vache : 185].</p>
<p>Et le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="ltr">«</span><strong><span dir="rtl">صُومُوا لِرُؤْيَتِهِ</span></strong><span dir="ltr">»</span></p>
<p>« <em><strong>Jeûnez à sa vision</strong></em> »<a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a>.</p>
<p>Ainsi, quiconque voit le croissant par lui-même, le jeûne devient pour lui une obligation.</p>
<p><strong>⁃</strong> <strong>La deuxième méthode : Le témoignage de la vision ou l'information transmise à ce sujet.</strong> On jeûne donc sur la base de la vision d'une personne intègre et responsable (moukalaf), et son information suffit à cet effet. Ceci conformément aux paroles d'Ibn 'Umar :</p>
<p class="ar"><span dir="ltr">«</span><strong><span dir="rtl">تَرَاءَى النَّاسُ الهِلَالَ، فَأَخْبَرْتُ رَسُولَ اللهِ ﷺ أَنِّي رَأَيْتُهُ، فَصَامَ، وَأَمَرَ النَّاسَ بِصِيَامِهِ</span></strong><span dir="ltr">»</span></p>
<p>« <em><strong>Les gens cherchaient à voir le croissant, j'ai alors informé le Messager d'Allah <span dir="rtl">ﷺ</span> que je l'avais vu ; il a donc jeûné et a ordonné aux gens de le jeûner.</strong></em> » Rapporté par Abou Daoud et d'autres(1), et authentifié par Ibn Hibbân et Al-Hâkim.<a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a></p>
<p><strong>⁃ La troisième méthode : Compléter la durée du mois de Sha'bân à trente jours.</strong></p>
<p>Ceci s'applique lorsque le croissant n'est pas vu la nuit du trentième jour de Sha'bân, qu'il y ait ou non des obstacles à la vision comme des nuages ou de la poussière. Cela est dû à la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="ltr">«</span><strong><span dir="rtl">إِنَّمَا الشَّهْرُ تِسْعَةٌ وَعِشْرُونَ يَوْماً؛ فَلَا تَصُومُوا حَتَّى تَرَوُا الهِلَالَ، وَلَا تُفْطِرُوا حَتَّى تَرَوُهُ، فَإِنْ غُمَّ عَلَيْكُمْ؛ فَاقْدُرُوا لَهُ</span></strong><span dir="ltr">»</span></p>
<p>« <em><strong>Le mois est de vingt-neuf jours ; ne jeûnez donc pas jusqu'à ce que vous voyiez le croissant, et ne rompez pas le jeûne jusqu'à ce que vous le voyiez. Et s'il vous est caché par les nuages, alors évaluez-le</strong></em> ».<a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a></p>
<p>Le sens de « <em><strong>évaluez-le</strong></em> » signifie : <em><strong>complétez le mois de Sha'bân à trente jours</strong></em>.</p>
<p>Ceci est conforme à ce qui est établi dans le hadith d'Abu Hurayrah :</p>
<p class="ar"><span dir="ltr">«</span><strong><span dir="rtl">فَإِنْ غُمَّ عَلَيْكُمْ؛ فَعُدُّوا ثَلَاثِينَ</span></strong><span dir="ltr">»</span></p>
<p>« <em><strong>Si cela vous est caché par les nuages, alors comptez trente jours</strong></em> ».<a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a></p>
<p>⁕ <strong>Le jeûne de Ramadan incombe à tout musulman responsable (<em>moukalaf</em>) et capable</strong> :</p>
<ul>
<li><blockquote>
<p>Il n'est pas obligatoire pour le non-musulman (<em>kâfir</em>), et il ne serait pas valide de sa part.</p>
</blockquote></li>
<li><blockquote>
<p>S'il se convertit (se repent) au cours du mois, il doit jeûner le reste.</p>
</blockquote></li>
<li><blockquote>
<p>Il n'est pas tenu de rattraper ce qui a précédé lorsqu'il était dans l'état de mécréance.</p>
</blockquote></li>
</ul>
<p>⁕ <strong>Le jeûne n'est pas obligatoire pour l'enfant</strong> (mineur). Toutefois, le jeûne est valide de la part d'un enfant doué de discernement (<em>mumayyiz</em>). Et il est considéré, à son égard, comme un acte surérogatoire (<em>nâfilah</em>).</p>
<p>⁕ Le jeûne n'est pas obligatoire pour l'aliéné (le fou). S'il venait à jeûner alors qu'il est dans un état de folie, son jeûne ne serait pas valide. Ceci est dû à l'absence d'intention (niyyah).</p>
<p>⁕ L'accomplissement du jeûne n'est pas obligatoire pour le malade qui en est incapable, ni pour le voyageur. Ils doivent tous deux le rattraper lorsque l'excuse de la maladie ou du voyage prend fin.</p>
<p>Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="ltr">﴿</span><strong><span dir="rtl">فَمَن كَانَ مِنكُم مَّرِيضًا أَوْ عَلَى سَفَرٍ فَعِدَّةٌ مِّنْ أَيَّامٍ أُخَرَ</span></strong><span dir="rtl">﴾ [البقرة: ١٨٤]</span></p>
<p>{<em><strong>Quiconque d'entre vous est malade ou en voyage, devra jeûner un nombre égal d'autres jours</strong></em>} [La Vache : 184].</p>
<p>⁕ L'injonction concernant l'obligation du jeûne englobe le résident et le voyageur, celui qui est en bonne santé et le malade, la femme en état de pureté ainsi que celle qui a ses menstrues ou ses lochies, et celui qui est évanoui. En effet, le jeûne est une obligation qui pèse sur leur conscience à tous, de sorte qu'ils sont tous concernés par cet appel au jeûne afin qu'ils croient fermement en son caractère obligatoire et qu'ils aient la ferme intention de l'accomplir, que ce soit en temps voulu (<em>adâ-an</em>) ou en rattrapage (<em>qadâ-an</em>) :</p>
<ul>
<li><blockquote>
<p><strong>Certains sont appelés à accomplir le jeûne durant le mois même (en temps voulu) :</strong> il s'agit de la personne en bonne santé et résidente, à l'exception de la femme ayant ses menstrues ou ses lochies.</p>
</blockquote></li>
<li><blockquote>
<p><strong>Certains ne sont appelés qu'au rattrapage uniquement :</strong> il s'agit de la femme ayant ses menstrues ou ses lochies, ainsi que du malade incapable d'accomplir le jeûne en temps voulu mais capable de le rattraper plus tard.</p>
</blockquote></li>
<li><blockquote>
<p><strong>Certains ont le choix entre les deux options :</strong> il s'agit du voyageur et du malade pour qui le jeûne est possible malgré une difficulté, sans pour autant craindre pour sa vie.</p>
</blockquote></li>
</ul>
<p>⁕ <strong>Quiconque a rompu le jeûne pour une excuse valable, puis voit cette excuse disparaître au cours de la journée de Ramadan :</strong></p>
<ul>
<li><blockquote>
<p>Comme le voyageur qui rentre de son voyage.</p>
</blockquote></li>
<li><blockquote>
<p>La femme ayant ses menstrues ou ses lochies qui retrouve son état de pureté.</p>
</blockquote></li>
<li><blockquote>
<p>Le non-musulman qui se convertit à l'Islam.</p>
</blockquote></li>
<li><blockquote>
<p>L'aliéné qui retrouve la raison.</p>
</blockquote></li>
<li><blockquote>
<p>Et l'enfant qui atteint la puberté.</p>
</blockquote></li>
</ul>
<p><strong>Chacun d'entre eux est tenu de s'abstenir de manger pour le reste de la journée et devra rattraper ce jour.</strong></p>
<p><strong>Il en est de même si la preuve du début du mois est établie au cours de la journée :</strong></p>
<ul>
<li><blockquote>
<p>Les musulmans doivent alors s'abstenir pour le reste de la journée.</p>
</blockquote></li>
<li><blockquote>
<p>Et ils devront rattraper ce jour après le mois de Ramadan.</p>
</blockquote></li>
</ul>
