<p>Le jeûne possède des facteurs d'annulation qu'il incombe au musulman de connaître afin de les éviter et de s'en méfier ؛ car ils rompent le jeûne de celui qui jeûne et corrompent sa pratique ، et parmi ces facteurs de rupture, il y a :</p>
<p><strong>1 - Le rapport charnel :</strong> dès lors que celui qui jeûne a un rapport charnel ؛ son jeûne devient caduc ، et il a l'obligation de rattraper ce jour durant lequel il a eu ce rapport ، et il lui incombe, en plus du rattrapage, l'expiation (Al-Kaffârah). Celle-ci consiste à : affranchir un esclave. S'il n'en trouve pas ou n'en a pas les moyens ؛ il doit alors jeûner deux mois consécutifs. S'il n'est pas capable de jeûner deux mois consécutifs ؛ en raison d'une incapacité liée à une excuse législative (valable) ؛ il doit alors nourrir soixante pauvres, en donnant à chaque pauvre un demi-Sâ' de la nourriture consommée dans le pays.</p>
<p><strong>2 - L'émission de sperme provoquée par un baiser, un contact physique, la masturbation ou la répétition de regards.</strong> Si l'une de ces choses se produit, son jeûne est corrompu. Il doit alors uniquement rattraper le jour, sans avoir à s'acquitter d'une expiation (kaffârah), car l'expiation est spécifique au rapport charnel.</p>
<p>Quant à celui qui dort et fait un rêve érotique entraînant une émission (pollution nocturne), il n'y a aucun grief contre lui et son jeûne est valide. En effet, cela s'est produit indépendamment de sa volonté. Cependant, il doit obligatoirement effectuer le lavage rituel (ghousl) pour sortir de l'état d'impureté majeure (janâba).</p>
<p><strong>3 - Le fait de manger ou de boire délibérément</strong> ؛ en raison de la parole d'Allah le Très-Haut :</p>
<p class="ar"><span dir="ltr">﴿</span><strong><span dir="rtl">وَكُلُوا وَاشْرَبُوا حَتَّىٰ يَتَبَيَّنَ لَكُمُ الْخَيْطُ الْأَبْيَضُ مِنَ الْخَيْطِ الْأَسْوَدِ مِنَ الْفَجْرِ ۖ ثُمَّ أَتِمُّوا الصِّيَامَ إِلَى اللَّيْلِ</span></strong><span dir="rtl">﴾ [البقرة : ١٨٧]</span></p>
<p>{<em><strong>Et mangez et buvez jusqu'à ce que se distingue pour vous le fil blanc du fil noir de l'aube. Puis accomplissez le jeûne jusqu'à la nuit.</strong></em>} [Al-Baqarah : 187] .</p>
<p>Quant à celui qui mange ou boit par oubli ؛ cela n'affecte pas son jeûne. Il est rapporté dans le hadith :</p>
<p class="ar"><span dir="ltr">«</span><strong><span dir="rtl">مَنْ أَكَلَ أَوْ شَرِبَ نَاسِيّاً ؛ فَلْيُتِمَّ صَوْمَهُ ، فَإِنَّمَا أَطْعَمَهُ اللهُ وَسَقَاهُ</span></strong><span dir="ltr">»</span></p>
<p>« <em><strong>Celui qui mange ou boit par oubli ؛ qu'il parachève son jeûne, car c'est Allah qui l'a nourri et lui a donné à boire</strong></em> » <a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a>.</p>
<p>Fait également partie de ce qui rompt le jeûne : l'introduction d'eau ou autre dans le corps par le nez ;ce qu'on appelle l'installation nasale (<span dir="rtl">السَّعُوط</span>), ainsi que l'administration de solutés nutritifs par voie veineuse ou la transfusion sanguine. Tout cela corrompt le jeûne car cela constitue une nutrition. Il en va de même pour les injections nutritives ؛ car elles remplacent la nourriture, et cela annule le jeûne. Quant aux injections non nutritives ؛ il convient également au jeûneur de les éviter afin de préserver son jeûne, et conformément à la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="ltr">«</span><strong><span dir="rtl">دَعْ مَا يَرِيبُكَ إِلَى مَا لَا يَرِيبُكَ</span></strong><span dir="ltr">»</span></p>
<p>« <em><strong>Délaisse ce qui te fait douter pour ce qui ne te fait pas douter</strong></em> »<a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a> ,et qu'il les reporte à la nuit.</p>
<p><strong>4 - L'extraction de sang du corps par la hijama (ventouses), la saignée ou un prélèvement sanguin pour un don afin de secourir un malade</strong> ; tout cela rompt le jeûne.</p>
<p>Quant à l'extraction d'une petite quantité de sang, comme celle prélevée pour une analyse, cela n'affecte pas le jeûne. De même, l'écoulement de sang involontaire, tel qu'un saignement de nez, une blessure ou l'extraction d'une dent, n'affecte pas le jeûne.</p>
<p><strong>5 - Le vomissement volontaire fait partie des facteurs qui rompent le jeûne.</strong> Il s'agit du fait d'extraire délibérément ce qui se trouve dans l'estomac, qu'il s'agisse de nourriture ou de boisson, par la bouche. Dans ce cas, le jeûneur rompt son jeûne.</p>
<p><strong>En revanche, si le vomissement survient de manière involontaire et incontrôlable :</strong> Cela n'affecte pas la validité de son jeûne. Ceci est basé sur la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="ltr">«</span><strong><span dir="rtl">من ذرعه القيء؛ فليس عليه قضاءٌ، ومن استقاء عمداً؛ فليقضِ</span></strong><span dir="ltr">»</span></p>
<p>« <em><strong>Celui qui est gagné par le vomissement n'a pas à rattraper son jeûne, mais celui qui se fait vomir volontairement doit le rattraper.</strong></em> » <a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a></p>
<p>Le sens de <strong>“<em>Celui qui est gagné par le vomissement”</em> ( <span dir="rtl">من ذرعه القيء</span> )</strong> est que le vomissement est sorti indépendamment de sa volonté.</p>
<p>Le sens de “<strong><em>qui se fait vomir”</em> ( <span dir="rtl">استقاء</span> )</strong> est qu'il a provoqué délibérément le vomissement.</p>
<p>⁕ Il convient à celui qui jeûne d'éviter l'application du khôl (Al-Iktihâl) ainsi que le traitement des yeux par des gouttes ou autre pendant le temps du jeûne, afin de préserver son jeûne.</p>
<p>⁕ <strong>Et il ne doit pas exagérer (abuser) dans le rinçage de la bouche (Al-Madmadah) et l'aspiration de l'eau par le nez (Al-Istinshâq)</strong> ; car il se peut que l'eau parvienne à l'intérieur de son corps.</p>
<p>Le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><strong><span dir="rtl">«وَبَالِغْ فِي الِاسْتِنْشَاقِ إِلَّا أَنْ تَكُونَ صَائِمًا»</span></strong></p>
<p><strong>« <em>Et exagère dans l'aspiration de l'eau par le nez, sauf si tu es en état de jeûne</em> »</strong> <a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a>.</p>
<p>⁕ L'utilisation du siwak n'affecte pas le jeûne. Au contraire, il est recommandé (mustahabb) et encouragé pour celui qui jeûne, ainsi que pour les autres, aussi bien au début qu'à la fin de la journée, selon l'avis authentique.</p>
<p>⁕ Et si de la poussière ou une mouche venait à voler jusqu'à sa gorge ; cela n'affecterait pas son jeûne.</p>
<p>⁕ <strong>Il incombe à celui qui jeûne d'éviter le mensonge, la médisance et l'insulte.</strong> Si quelqu'un l'injurie ou l'insulte, qu'il dise : « <em>Je jeûne</em> ». En effet, il peut être facile pour certaines personnes de délaisser la nourriture et la boisson, mais il ne leur est pas facile de délaisser leurs mauvaises habitudes en paroles et en actes. C'est pour cela que certains parmi les prédécesseurs (Salaf) ont dit : « <em>Le degré le plus bas du jeûne est de délaisser la nourriture et la boisson</em> ».</p>
<p><strong>Le musulman doit donc craindre Allah, avoir peur de Lui et avoir conscience de la grandeur de son Seigneur</strong> ainsi que du fait qu'Il l'observe à tout moment et dans toutes les situations. Il doit ainsi préserver son jeûne de ce qui l'annule ou de ce qui en diminue la valeur, afin que son jeûne soit valide (correct).</p>
<p>⁕ <strong>Il convient à celui qui jeûne de s'occuper par l'évocation d'Allah (Dhikr), la récitation du Coran et la multiplication des œuvres surérogatoires.</strong> En effet, lorsque les prédécesseurs (Salaf) jeûnaient, ils s'asseyaient dans les mosquées et disaient : « <em>Nous préservons notre jeûne et ne médisons de personne</em> ». Le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="ltr">«</span><strong><span dir="rtl">مَنْ لَمْ يَدَعْ قَوْلَ الزُّورِ وَالْعَمَلَ بِهِ؛ فَلَيْسَ لِلَّهِ حَاجَةٌ فِي أَنْ يَدَعَ طَعَامَهُ وَشَرَابَهُ</span></strong><span dir="ltr">»</span></p>
<p>« <em><strong>Celui qui ne délaisse pas les paroles mensongères et leur mise en pratique, Allah n'a que faire qu'il délaisse sa nourriture et sa boisson</strong></em> ». <a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a></p>
<p>Cela s'explique par le fait que le rapprochement vers Allah le Très-Haut, par le délaissement de ces passions qui sont autorisées en dehors du jeûne, ne peut s'accomplir qu'après s'être rapproché de Lui en délaissant ce qu'Allah a interdit en toute circonstance : comme le mensonge, l'injustice et l'agression envers les gens, que ce soit concernant leur sang, leurs biens ou leur honneur.</p>
<p>Il a été rapporté d'après Abou Houreirah, de manière élevée (marfou') :</p>
<p class="ar"><span dir="ltr">«</span><strong><span dir="rtl">الصَّائِمُ فِي عِبَادَةٍ مَا لَمْ يَغْتَبْ مُسْلِماً أَوْ يُؤْذِهِ</span></strong><span dir="ltr">»</span></p>
<p>« <em><strong>Celui qui jeûne est en état d'adoration tant qu'il ne médit pas d'un musulman ou ne lui cause pas de tort</strong></em> ».<a href="#fn6" class="footnote-ref" id="fnref6" role="doc-noteref"><sup>6</sup></a></p>
<p>Et d'après Anas :</p>
<p class="ar"><span dir="ltr">«</span><strong><span dir="rtl">مَا صَامَ مَنْ ظَلَّ يَأْكُلُ لُحُومَ النَّاسِ</span></strong><span dir="ltr">»</span></p>
<p>« <em><strong>N'a pas jeûné celui qui persiste à manger la chair des gens (par la médisance)</strong></em> ».<a href="#fn7" class="footnote-ref" id="fnref7" role="doc-noteref"><sup>7</sup></a></p>
<p><strong>Ainsi, puisque celui qui jeûne délaisse des choses qui étaient licites en dehors du jeûne, il est prioritaire qu'il délaisse les choses qui ne lui sont licites en aucune circonstance</strong>, afin qu'il soit compté parmi les véritables jeûneurs.</p>
