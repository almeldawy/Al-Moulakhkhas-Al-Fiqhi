<p>⁕ Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="ltr">﴿</span> <span dir="rtl"><strong>أُحِلَّ لَكُمْ لَيْلَةَ الصِّيَامِ الرَّفَثُ إِلَىٰ نِسَائِكُمْ ۚ هُنَّ لِبَاسٌ لَّكُمْ وَأَنتُمْ لِبَاسٌ لَّهُنَّ ۗ عَلِمَ اللَّهُ أَنَّكُمْ كُنتُمْ تَخْتَانُونَ أَنفُسَكُمْ فَتَابَ عَلَيْكُمْ وَعَفَا عَنكُمْ ۖ فَالْآنَ بَاشِرُوهُنَّ وَابْتَغُوا مَا كَتَبَ اللَّهُ لَكُمْ ۚ وَكُلُوا وَاشْرَبُوا حَتَّىٰ يَتَبَيَّنَ لَكُمُ الْخَيْطُ الْأَبْيَضُ مِنَ الْخَيْطِ الْأَسْوَدِ مِنَ الْفَجْرِ ۖ ثُمَّ أَتِمُّوا الصِّيَامَ إِلَى اللَّيْلِ</strong></span> <span dir="rtl">﴾ [البقرة : ١٨٧].</span></p>
<p>"<em><strong>On vous a permis, la nuit du jeûne, d'avoir des rapports avec vos femmes ; elles sont un vêtement pour vous et vous êtes un vêtement pour elles. Allah sait que vous aviez clandestinement des rapports avec vos épouses. Il vous a pardonné et vous a graciés. Cohabitez donc avec elles maintenant, et cherchez ce qu'Allah a décrété pour vous. Mangez et buvez jusqu'à ce que se distingue, pour vous, le fil blanc de l'aube du fil noir de la nuit. Puis accomplissez le jeûne jusqu'à la nuit.</strong></em>" » [Al-Baqarah : 187].</p>
<p>L'Imam Ibn Kathîr (qu'Allah lui fasse miséricorde) a dit <a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a>: « <em>Ceci est une permission (dispense) de la part d'Allah le Très-Haut pour les musulmans, et une abrogation de ce qui était en vigueur au début de l'Islam. En effet, lorsqu'un d'entre eux rompait son jeûne, il ne lui était permis de manger, de boire et d'avoir des rapports que jusqu'à la prière de l'Isha ou jusqu'à ce qu'il s'endorme avant cela. Dès qu'il dormait ou priait l'Isha, la nourriture, la boisson et les rapports lui devenaient interdits jusqu'à la nuit suivante. Ils éprouvèrent de ce fait une grande difficulté. Ce verset fut alors révélé, et ils en furent extrêmement joyeux, car Allah a rendu licites la nourriture, la boisson et les rapports à n'importe quel moment de la nuit que le jeûneur souhaite, jusqu'à ce que la clarté du matin se distingue de l'obscurité de la nuit.</em> »</p>
<p>Il ressort donc de ce noble verset la délimitation du jeûne quotidien dans son début et sa fin : son début commence dès le lever de la seconde aube (l'aube véridique), et sa fin se situe au coucher du soleil.</p>
<p>⁕ Et le fait qu’Allah le Très-Haut ait autorisé de manger et de boire jusqu'au lever de l'aube est une preuve du caractère recommandé du <em>Suhûr</em> (repas de fin de nuit).</p>
<p>Et dans les "Deux Sahîh" (Al-Bukhari et Muslim), d'après Anas, il a dit : Le Messager d'Allah <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="ltr">«</span> <span dir="rtl"><strong>تَسَحَّرُوا فَإِنَّ فِي السَّحُورِ بَرَكَةً</strong></span> <span dir="ltr">»</span></p>
<p>"<em><strong>Prenez le repas du Suhûr ;car il y a certes dans le Suhûr une bénédiction.</strong></em>"<a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a></p>
<p>Il a été rapporté de nombreux mérites concernant l'incitation au <em>Suhûr</em>, ne serait-ce que par une gorgée d'eau, et il est recommandé de le retarder jusqu'au moment de l'apparition de l'aube.</p>
<p>Si une personne se réveille en état de <em>janaba</em> (impureté majeure) ou si une femme voit ses menstrues cesser avant le lever de l'aube, alors ils commencent par prendre le <em>Suhûr</em> et jeûnent, tout en retardant le bain rituel (<em>ghusl</em>) jusqu'après le lever de l'aube.</p>
<p>⁕ Et certaines personnes prennent le repas du <em>Suhûr</em> très tôt car elles veillent une grande partie de la nuit. Elles mangent alors le <em>Suhûr</em> et s'endorment plusieurs heures avant l'aube (<em>Fajr</em>). Ces personnes commettent plusieurs erreurs :</p>
<p><strong>Premièrement :</strong> Parce qu'elles commencent à jeûner avant l'heure prescrite du jeûne.</p>
<p><strong>Deuxièmement :</strong> Elles délaissent la prière de l'aube (Fajr) en groupe. Elles désobéissent ainsi à Allah en délaissant ce qu'Il leur a rendu obligatoire concernant la prière en groupe.</p>
<p><strong>Troisièmement :</strong> Il arrive qu'elles retardent la prière de l'aube au-delà de son temps prescrit, ne la priant qu'après le lever du soleil. Ceci est un crime encore plus grave et un péché plus immense.</p>
<p>Allah le Très-Haut a dit :</p>
<p class="ar"><strong><span dir="rtl">﴿ فَوَيْلٌ لِّلْمُصَلِّينَ ۝ الَّذِينَ هُمْ عَن صَلَاتِهِمْ سَاهُونَ ﴾</span></strong> <span dir="rtl">[الماعون : ٤-٥]</span></p>
<p><strong>"Malheur donc à ceux qui prient tout en étant négligents vis-à-vis de leur prière"</strong> [Al-Mâ'ûn : 4-5]. »</p>
<p>⁕ Il est impératif de formuler l'intention pour le jeûne obligatoire pendant la nuit. Ainsi, si une personne a eu l'intention de jeûner mais ne s'est réveillée qu'après le lever de l'aube, elle doit s'abstenir [de manger et boire]. Son jeûne est alors valide et complet, si Allah le veut.</p>
<p>⁕ Il est recommandé de hâter la rupture du jeûne (<em>Al-Iftâr</em>) dès que le coucher du soleil est confirmé, soit par sa vision directe, soit par la forte présomption résultant de l'information d'une personne de confiance (par l'appel à la prière ou autre). D'après Sahl ibn Sa'd (qu'Allah l'agrée), le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="ltr">«</span> <strong><span dir="rtl">لَا يَزَالُ النَّاسُ بِخَيْرٍ مَا عَجَّلُوا الفِطْرَ</span></strong> <span dir="ltr">»</span></p>
<p>"<em><strong>Les gens ne cesseront d'être dans le bien tant qu'ils hâteront la rupture du jeûne.</strong></em>" (Rapporté par Al-Bukhari et Muslim).<a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a></p>
<p>Et le Prophète <span dir="rtl">ﷺ</span> a dit, dans ce qu'il rapporte de son Seigneur Puissant et Majestueux :</p>
<p class="ar"><span dir="rtl">وَقَالَ ﷺ فِيمَا يَرْوِيهِ عَن رَبِّهِ ﷻ : « <strong>إِنَّ أَحَبَّ عِبَادِي إِلَيَّ أَعْجَلُهُمْ فِطْرًا</strong></span> <span dir="ltr">»</span></p>
<p>"<em><strong>Certes, Mes serviteurs que J'aime le plus sont ceux qui hâtent le plus la rupture du jeûne.</strong></em>"<a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a></p>
<p>⁕ La Sunna est de rompre le jeûne avec des dattes fraîches (<em>rutab</em>). S'il n'en trouve pas, alors avec des dattes sèches (<em>tamr</em>). S'il n'en trouve pas, alors avec de l'eau. En raison de la parole d'Anas (qu'Allah l'agrée) :</p>
<p class="ar"><span dir="ltr">«</span> <strong><span dir="rtl">كَانَ النَّبِيُّ ﷺ يُفْطِرُ قَبْلَ أَنْ يُصَلِّيَ عَلَى رُطَبَاتٍ، فَإِنْ لَمْ تَكُنْ رُطَبَاتٌ؛ فَتَمَرَاتٌ، فَإِنْ لَمْ تَكُنْ تَمَرَاتٌ؛ حَسَا حَسَواتٍ مِن مَاءٍ..</span></strong><span dir="ltr">. »</span></p>
<p>"<em><strong>Le Prophète <span dir="rtl">ﷺ</span> rompait le jeûne avant de prier avec quelques dattes fraîches. S'il n'y avait pas de dattes fraîches, alors avec des dattes sèches. S'il n'y avait pas de dattes sèches, il buvait quelques gorgées d'eau...</strong></em>". Rapporté par Ahmad, Abou Daoud et Al-Tirmidhi. <a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a></p>
<p>Et s'il ne trouve ni dattes fraîches, ni dattes sèches, ni eau, il rompt le jeûne avec ce qu'il a à sa disposition comme nourriture ou boisson.</p>
<p>⁕ Il y a ici une question sur laquelle il est impératif d'attirer l'attention : c'est le fait que certaines personnes s'installent à leur table d'Iftar pour dîner et délaissent ainsi la prière du Maghreb en groupe à la mosquée. Elles commettent par cela une erreur immense, consistant à être en retard pour la prière en groupe à la mosquée, se privant elles-mêmes d'une immense récompense et s'exposant à un châtiment. Ce qui est prescrit au jeûneur est de rompre son jeûne d'abord, puis de se rendre à la prière, et enfin de dîner après cela.</p>
<p>⁕ Il est recommandé [au jeûneur] d'invoquer Allah par ce qu'il aime au moment de la rupture de son jeûne. Le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="ltr">«</span> <strong><span dir="rtl">إِنَّ لِلصَّائِمِ عِنْدَ فِطْرِهِ دَعْوَةً مَا تُرَدُّ</span></strong> <span dir="ltr">»</span></p>
<p>"<em><strong>Certes, le jeûneur a, au moment de rompre son jeûne, une invocation qui n'est pas rejetée</strong></em>". <a href="#fn6" class="footnote-ref" id="fnref6" role="doc-noteref"><sup>6</sup></a></p>
<p>Parmi les invocations rapportées, il y a le fait de dire :</p>
<p class="ar"><span dir="rtl">« اللَّهُمَّ لَكَ صُمْتُ ، وَعَلَى رِزْقِكَ أَفْطَرْتُ »</span></p>
<p>"<em>Ô Allah, pour Toi j'ai jeûné et avec Ta subsistance j'ai rompu mon jeûne</em>". <a href="#fn7" class="footnote-ref" id="fnref7" role="doc-noteref"><sup>7</sup></a></p>
<p>Et lorsqu'il <span dir="rtl">ﷺ</span> rompait le jeûne, il disait :</p>
<p class="ar"><span dir="rtl">« ذَهَبَ الظَّمَأُ ، وَابْتَلَّتِ الْعُرُوقُ ، وَثَبَتَ الأَجْرُ إِنْ شَاءَ اللهُ »</span></p>
<p>"<em>La soif est partie, les veines se sont abreuvées et la récompense est confirmée, si Allah le veut</em>".<a href="#fn8" class="footnote-ref" id="fnref8" role="doc-noteref"><sup>8</sup></a></p>
<p>C’est ainsi qu’il convient au musulman d’apprendre les règles du jeûne et de sa rupture, tant en ce qui concerne le moment que la manière de l’accomplir, afin qu’il pratique son jeûne selon la modalité prescrite et conforme à la Sunna du Messager <span dir="rtl">ﷺ</span>, et pour que son jeûne soit valide et son œuvre acceptée auprès d’Allah. En effet, cela compte parmi les choses les plus importantes ;</p>
<p>Allah le Très-Haut a dit</p>
<p class="ar"><span dir="ltr">﴿</span> <strong><span dir="rtl">لَّقَدْ كَانَ لَكُمْ فِي رَسُولِ اللَّهِ أُسْوَةٌ حَسَنَةٌ لِّمَن كَانَ يَرْجُو اللَّهَ وَالْيَوْمَ الْآخِرَ وَذَكَرَ اللَّهَ كَثِيرًا</span></strong> <span dir="rtl">﴾ [الأحزاب : ٢١]</span></p>
<p>: {<em><strong>En effet, vous avez dans le Messager d’Allah un excellent modèle [à suivre], pour quiconque espère en Allah et au Jour dernier et invoque Allah fréquemment</strong></em>} [Al-Ahzâb : 21].</p>
