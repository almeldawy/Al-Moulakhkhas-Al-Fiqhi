<h2 id="بسم-الله-الرحمن-الرحيم"><span dir="rtl">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</span></h2>
<blockquote>
<p><strong>Chapitre sur les règles de la course (et des compétitions)</strong></p>
</blockquote>
<p>⁕ <strong>La compétition (<em>Al-Musâbaqah</em>) :</strong> C'est la course (le fait de rivaliser de vitesse) entre des animaux ou autre chose, de même que la compétition de tir aux flèches.</p>
<p>⁕ Et elle est autorisée par le Livre (le Coran), la Sunnah et le consensus (<em>Al-Ijmâ'</em>) :</p>
<p>⁃ Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿وَأَعِدُّوا لَهُم مَّا اسْتَطَعْتُم مِّن قُوَّةٍ﴾ [الْأَنْفَال: ٦٠]</span></p>
<p><strong>{Et préparez [pour lutter] contre eux tout ce que vous pouvez comme force}</strong> [Al-Anfâl : 60]</p>
<p>et le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="rtl">«أَلَا إِنَّ الْقُوَّةَ الرَّمْيُ»</span></p>
<p><em><strong>« Certes, la force réside dans le tir »</strong></em> <a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a><em><strong>.</strong></em></p>
<p>Et [Allah] le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿إِنَّا ذَهَبْنَا نَسْتَبِقُ﴾ [يُوسُف: ١٧]</span></p>
<p><strong>{Nous sommes allés jouer à la course}</strong> [Yûsuf : 17], c'est-à-dire : en nous défiant au tir de flèches ou en faisant une course à pied.</p>
<p>⁃ Et d'après Abû Hurayrah, dans un hadith attribué au Prophète (<em>Marfû'</em>) :</p>
<p class="ar"><span dir="rtl">«لَا سَبْقَ إِلَّا فِي خُفٍّ أَوْ نَصْلٍ أَوْ حَافِرٍ»</span></p>
<p><em><strong>« Il n'y a pas de prix (ou de récompense financière) pour une compétition, si ce n'est pour les camélidés (les chameaux), le tir (les flèches/armes) ou les équidés (les chevaux) »</strong></em>. Rapporté par les cinq [auteurs des Sunans et Ahmad] <a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a>; ce hadith est ainsi une preuve de la permission de la compétition assortie d'un prix (ou d'un gain).</p>
<p>⁃ Et plus d'un parmi les gens de science ont rapporté le consensus (<em>Al-Ijmâ'</em>) quant à sa permission de manière globale.</p>
<p><strong>Et Cheikh al-Islâm Ibn Taymiyyah (qu'Allah lui fasse miséricorde) a dit :</strong> <em>« La course de chevaux, le tir à l'arc et les autres moyens de guerre similaires font partie de ce qu'Allah et Son Messager <span dir="rtl">ﷺ</span> ont ordonné, et de ce qui aide au combat dans le sentier d'Allah. »</em> <strong>Il a également dit :</strong> <em>« La course, la lutte et ce qui y ressemble constituent une obéissance [à Allah] dès lors que l'intention visée est le triomphe de l'Islam. Et percevoir le prix de la compétition (c'est-à-dire la compensation financière) est une perception de droit. Il est permis de jouer à ce qui comporte un intérêt sans causer de tort, tandis qu'il est détestable de jouer à la balançoire. »</em></p>
<p><strong>Et le Cheikh a dit :</strong> <em>« Tout ce qui distrait et détourne de ce qu'Allah a ordonné est interdit, même si sa nature d'origine n'est pas illicite — comme la vente et le commerce. Quant au reste des distractions auxquelles s'adonnent les oisifs parmi les types de divertissements et les différentes formes de jeux qui ne sont d'aucune aide pour accomplir un droit légiféré (Shar'î), alors tout cela est interdit (Harâm) »</em> <a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a>. Fin de citation.</p>
<p><strong>Certes, les savants ont accordé une grande importance à ce chapitre,</strong> qu'ils ont nommé "Le chapitre de la cavalerie" (<em>Al-Furûsiyyah</em>), et ils ont rédigé à ce sujet des ouvrages célèbres.</p>
<p>⁕ <strong>La cavalerie (<em>Al-Furûsiyyah</em>) comprend quatre catégories :</strong></p>
<ol type="1">
<li><blockquote>
<p>La première : la monte des chevaux, ainsi que la charge et le repli tactique avec eux.</p>
</blockquote></li>
<li><blockquote>
<p>La deuxième : le tir à l'arc, ainsi qu'avec les outils utilisés à chaque époque selon ce qui convient.</p>
</blockquote></li>
<li><blockquote>
<p>La troisième : le combat à la lance (le joute).</p>
</blockquote></li>
<li><blockquote>
<p>La quatrième : le maniement (l'escrime) des épées. Et quiconque maîtrise parfaitement ces quatre catégories a ainsi parachevé la chevalerie.</p>
</blockquote></li>
</ol>
<p>⁕ <strong>Et il est permis de faire la course</strong> à pied, ainsi que sur le reste des animaux et des moyens de transport (véhicules/montures).</p>
<p>L'Imam Al-Qurtubî (qu'Allah lui fasse miséricorde) a dit <a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a>: <em>« Il n'y a pas de divergence quant à la permission de la compétition à cheval et sur les autres bêtes de somme, ainsi qu'à pied. Il en est de même pour le fait de se défier au tir de flèches et l'utilisation des armes, en raison de ce que cela comporte comme entraînement à la guerre. »</em> Fin de citation.</p>
<p>Et le Prophète <span dir="rtl">ﷺ</span> a certes fait la course à pied avec 'Âishah (qu'Allah l'agrée), il a lutté contre Rukânah et l'a terrassé, et Salamah ibn al-Akwâ' a fait la course contre un homme parmi les Ansârs en présence du Messager d'Allah <span dir="rtl">ﷺ</span>.</p>
<p>⁕ <strong>Et il n'est pas permis de faire une compétition comportant une contrepartie financière (un prix / un gain),</strong> sauf s'il s'agit d'une compétition de camélidés (chameaux), d'équidés (chevaux) ou de tir aux flèches, en raison de la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«لَا سَبْقَ إِلَّا فِي نَضْلٍ أَوْ خُفٍّ أَوْ حَافِرٍ»،</span></p>
<p><em><strong>« Il n'y a pas de prix pour une compétition, si ce n'est pour le tir, les camélidés ou les équidés »,</strong></em> rapporté par les cinq d'après Abû Hurayrah <a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a>. C’est-à-dire : il n'est pas permis de percevoir une rémunération (un prix) pour une compétition, sauf si celle-ci porte sur les chameaux, les chevaux ou le tir aux flèches, car ces éléments font partie des instruments de guerre qu'il est ordonné d'apprendre et de maîtriser. L'implication textuelle (Mafhûm) du hadith indique qu'il est interdit de percevoir une contrepartie financière pour toute autre compétition que celles-ci. Et il a été dit : il est possible que le hadith signifie plutôt que ces trois catégories sont les plus en droit de voir un prix attribué pour elles, en raison de leur parfaite utilité et de la globalité de leur intérêt public ; ainsi, y entrerait tout défi autorisé s'avérant bénéfique pour la religion, conformément à l'histoire de Rukânah et de Abû Bakr.</p>
<p><strong>Et l'Imam Ibn al-Qayyim a dit :</strong> <em>« Les paris (ou prix attribués) sur ce qui permet la manifestation de l'Islam, ses preuves et ses arguments, font partie du droit le plus légitime, et sont encore plus en droit d'être permis que les paris sur le tir à l'arc et la course de chevaux »</em> <a href="#fn6" class="footnote-ref" id="fnref6" role="doc-noteref"><sup>6</sup></a>. Fin de citation.</p>
<p>⁕ <strong>Et cinq conditions sont requises pour la validité de la compétition :</strong></p>
<p><strong>La première condition :</strong> La détermination visuelle (par la vue) des deux montures engagées dans la course.</p>
<p><strong>La deuxième condition :</strong> L'égalité de nature (le même type) entre les deux montures, ainsi que la désignation des tireurs, car le but recherché est de connaître leur adresse et leur habileté au tir.</p>
<p><strong>La troisième condition :</strong> La délimitation de la distance, afin que soient connus le vainqueur de la course et celui qui atteint la cible. Cela se fait en fixant pour son début et sa fin une limite sur laquelle ils ne divergent pas, car l'objectif est de connaître le plus rapide, ce qui ne peut s'accomplir que par l'égalité de la ligne d'arrivée.</p>
<p><strong>La quatrième condition :</strong> Que la contrepartie financière (le prix) soit connue et licite (<em>Mubâh</em>).</p>
<p><strong>La cinquième condition :</strong> S'écarter de toute ressemblance avec le pari mutuel (jeu de hasard / <em>Qimâr</em>), en faisant en sorte que le prix provienne d'un tiers autre que les deux compétiteurs, ou de l'un d'eux seulement. En revanche, si le prix est fourni par les deux compétiteurs ensemble, cela fait l'objet d'une divergence : est-ce permis, ou bien est-ce interdit sauf en introduisant un tiers tiers-parti (<em>Muhallil</em>) ? Ce dernier est l'intervenant extérieur qui devient un partenaire dans le gain tout en étant exempt de toute perte. Et Cheikh al-Islâm Ibn Taymiyyah (qu'Allah lui fasse miséricorde) a choisi l'avis stipulant que la présence du <em>Muhallil</em> n'est pas une condition. Il a dit : <em>« L'absence de Muhallil est préférable et plus proche de la justice que le fait que le prix provienne d'un seul des deux [compétiteurs]. C'est également plus efficace pour atteindre l'objectif de chacun d'eux, à savoir mettre en évidence l'incapacité de l'autre, et le fait de percevoir de l'argent de cette manière est une perception de droit... » jusqu'à ce qu'il dise : « Et je ne connais aucun Compagnon (Sahâbî) ayant posé le Muhallil comme condition. Ceci est seulement connu de Sa'îd ibn al-Musayyib, et c'est de lui que les gens l'ont transmis. »</em> Fin de citation.</p>
<p>⁕ <strong>Et de ce qui précède, il ressort que la compétition autorisée se divise en deux catégories :</strong></p>
<p><strong>La première catégorie :</strong> Ce qui engendre un intérêt légiféré (<em>Maslahah Shar'iyyah</em>), comme l'entraînement au combat (dans le sentier d'Allah) et l'entraînement sur les questions de la science religieuse.</p>
<p><strong>La deuxième catégorie :</strong> Ce dont le but est le simple jeu qui ne comporte aucun tort.</p>
<p>Ainsi, la première catégorie est celle pour laquelle il est permis de percevoir une contrepartie financière (un prix / un gain) selon ses conditions précédemment mentionnées.</p>
<p>Quant à la deuxième catégorie, elle est autorisée à condition qu'elle ne détourne pas d'une obligation, ou qu'elle ne distrait pas du rappel d'Allah (<em>Dhikr</em>) et de la prière. Et pour cette catégorie, il n'est pas permis de percevoir de contrepartie financière. Les gens ont d'ailleurs beaucoup trop élargi la pratique de cette dernière catégorie de nos jours, y dépensant énormément de temps et d'argent, alors qu'elle fait partie de ce qui ne présente aucune utilité pour les musulmans. Et il n'y a de force ni de puissance que par Allah.</p>
