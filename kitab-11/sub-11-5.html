<p>⁕ Certes, Allah a interdit de transgresser le droit des gens sur leurs biens et de les leur extorquer injustement. Il a également légiféré l'obligation de compenser (garantir) ce qui a été dégradé ou détruit parmi ces biens sans droit, et ce, même si cela s'est produit par erreur.</p>
<p>⁕ Ainsi, quiconque détruit un bien appartenant à autrui, alors que ce bien est protégé (par la législation), et l'a détruit sans l'autorisation de son propriétaire, il lui incombe obligatoirement d'en verser la compensation.</p>
<p>L'Imam Al-Muwaffaq [Ibn Qoudâmah] a dit : <em>« Nous ne connaissons aucune divergence à ce sujet. Et il en est de même que l'acte soit intentionnel ou par mégarde, et que l'auteur soit légalement responsable (adulte et sain d'esprit) ou non. »</em></p>
<p>⁕ De même, quiconque est la cause de la destruction d'un bien [en assume la responsabilité]. C'est le cas, par exemple, de celui qui ouvre une porte, entraînant la perte de ce qui y était enfermé, ou de celui qui dénoue un récipient, provoquant le déversement et la perte de son contenu : il doit compenser cela. De même, s'il détache le lien ou l'entrave d'une bête et que celle-ci s'en va et se perd, il doit la compenser. De même, s'il attache une bête dans un chemin étroit et qu'en conséquence, une personne trébuche sur elle, décède ou subit un dommage, il doit compenser [ce dommage], car il a commis une transgression en l'attachant au milieu du chemin.</p>
<p>De même, s'il gare un véhicule au milieu de la route et qu'en conséquence, un autre véhicule ou un piéton le percute, entraînant un dommage, il doit le compenser. Cela se base sur ce qu'a rapporté Ad-Dâraqoutnî ainsi que d'autres :</p>
<p class="ar"><span dir="rtl">«مَنْ أَوْقَفَ دَابَّةً فِي سَبِيلٍ مِنْ سُبُلِ المُسْلِمِينَ، أَوْ فِي سُوقٍ مِنْ أَسْوَاقِهِمْ، فَوَطِئَتْ بِيَدٍ أَوْ رِجْلٍ؛ فَهُوَ ضَامِنٌ»</span></p>
<p><em><strong>« Quiconque immobilise une bête sur une voie parmi les voies des musulmans, ou dans un de leurs marchés, et que celle-ci piétine [quelque chose ou quelqu'un] de sa patte avant ou arrière, il en est alors garant (responsable) »</strong></em>. Il en va de même s'il laisse sur le chemin de la boue, une pièce de bois, une pierre, ou s'il y creuse un trou, et qu'il en résulte le décès ou la blessure d'un passant ; ou s'il jette sur le chemin une peau de pastèque ou autre chose similaire, ou s'il y déverse de l'eau, provoquant la glissade d'une personne qui décède ou se blesse : l'auteur de ces actes est garant (responsable) dans toutes ces situations, en raison de la transgression qu'il a commise par cela.</p>
<p>Et combien le laisser-aller est fréquent de nos jours concernant ces questions ! Combien de trous sont creusés sur les routes, combien de voies sont obstruées et combien d'obstacles y sont déposés ! Et que de dommages résultent de ces comportements, sans que personne ne demande de comptes ni ne surveille, au point que l'un d'eux s'approprie la rue, l'utilise pour ses besoins personnels, importune les passants et leur cause du tort, sans se soucier du péché qu'il encourt à cause de cela.</p>
<p>⁕ Parmi les situations qui imposent également une compensation (la responsabilité financière) : le cas d'une personne qui acquiert un chien agressif , et que celui-ci attaque les passants ou blesse (mord) quelqu'un. Le propriétaire doit alors compenser le dommage, en raison de sa transgression [liée à la possession ou au manque de contrôle] de ce chien.</p>
<p>⁕ Si une personne creuse un puits dans sa cour pour son propre intérêt, elle est garante (responsable) de ce qui s'y détruit ou de quiconque y tombe. En effet, il lui incombe obligatoirement de le sécuriser afin de prévenir tout danger pour les passants. S'il le laisse sans protection, il est alors considéré comme transgresseur.</p>
<p>⁕ De même, s'il possède du bétail (des bêtes), il lui est obligatoire de le surveiller et de le garder durant la nuit pour l'empêcher de ravager les cultures des gens. S'il le délaisse et que le bétail cause des dégradations, il doit compenser les pertes. Cela s'appuie sur le fait que le Prophète <span dir="rtl">ﷺ</span> a décrété qu'il incombe aux propriétaires des cultures de surveiller leurs biens pendant le jour, et que les dommages causés par le bétail durant la nuit sont à la charge [et sous la responsabilité] des propriétaires de ce bétail. (Rapporté par Ahmad, Aboû Dâwoûd et Ibn Mâjah)<a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a>. Par conséquent, le propriétaire de la bête n'est pas responsable de ce qu'elle dégrade durant le jour, à moins qu'il ne l'ait lui-même lâchée à proximité de ce qu'elle a l'habitude de dégrader.</p>
<p>L'Imam Al-Baghawî (qu'Allah lui fasse miséricorde) a dit : <em>« Les gens de science sont d'avis que ce que le bétail, laissé libre de circuler durant le jour, dégrade parmi les biens d'autrui n'incombe pas à la responsabilité de son propriétaire. En revanche, ce qu'il dégrade durant la nuit est à la charge de son propriétaire (qui doit le compenser). En effet, la coutume veut que les propriétaires de vergers et de jardins les surveillent pendant le jour, tandis que les propriétaires de bétail gardent leurs bêtes durant la nuit. Ainsi, quiconque contrevient à cette habitude s'écarte de la coutume établie. Cela s'applique si le propriétaire de la bête n'était pas présent avec elle ; car s'il se trouvait en sa compagnie, il lui incombe alors obligatoirement de compenser tout ce qu'elle a dégradé. »</em> Fin de citation.</p>
<p>Et Allah a certes mentionné le récit de David (Dâwoûd) et de Salomon (Souleymân) ainsi que leur jugement à ce sujet, en disant (Exalté soit-Il) :</p>
<p class="ar"><span dir="rtl">وَدَاوُدَ وَسُلَيْمَانَ إِذْ يَحْكُمَانِ فِي الْحَرْثِ إِذْ نَفَشَتْ فِيهِ غَنَمُ الْقَوْمِ وَكُنَّا لِحُكْمِهِمْ شَاهِدِينَ * فَفَهَّمْنَاهَا سُلَيْمَانَ وَكُلًّا آتَيْنَا حُكْمًا وَعِلْمًا﴾ [الأنبياء: ٧٨، ٧٩.</span></p>
<p><strong>« Et David et Salomon, quand ils eurent à juger au sujet d'un champ cultivé où des moutons appartenant à des gens s'étaient éparpillés (la nuit) pour y paître ; et Nous étions Témoin de leur jugement. Nous en fîmes comprendre le sens à Salomon. Et à chacun d'eux Nous donnâmes la faculté de juger et le savoir. »</strong> [Sourate Al-Anbiyâ, Versets 78 et 79].</p>
<p>Cheikh al-Islam Ibn Taymiyyah (qu'Allah lui fasse miséricorde) a dit <a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a>: <em>« Il est avéré par le texte même du Coran l'éloge fait à Salomon (Souleymân) pour avoir compris comment appliquer la compensation par l'équivalent (Al-Mithl). En effet, l'éparpillement des bêtes (An-Nafch) désigne le fait pour les moutons de paître durant la nuit, et cela s'était produit dans un vignoble.</em></p>
<p><em>David (Dâwoûd) avait alors jugé en estimant la valeur du bien détruit ; il évalua donc la valeur des moutons et constata qu'elle équivalait à la valeur des pertes. Il attribua alors [la propriété de] ces moutons aux propriétaires du champ cultivé.</em></p>
<p><em>Salomon, quant à lui, trancha en faveur d'une compensation par l'équivalent : [les propriétaires du bétail] devaient réhabiliter et entretenir le vignoble jusqu'à ce qu'il redevienne comme il était initialement. De plus, il ne priva pas les propriétaires du vignoble de leurs revenus (récoltes) durant la période s'écoulant entre la dégradation et la remise en état ; au contraire, il confia le bétail des premiers aux propriétaires du vignoble afin qu'ils tirent profit de ses produits (lait, laine, portées) à hauteur de ce que le vignoble aurait dû leur rapporter. Ainsi, ils percevaient des produits du bétail l'équivalent exact de ce qu'ils avaient perdu comme production de leur culture. Il compara alors les deux types de compensation et constata qu'elles étaient équitables. Et c'est là précisément la science qu'Allah lui a spécifiquement accordée et pour la compréhension de laquelle Il a fait son éloge. »</em> Fin de citation.</p>
<p>⁕ Si la bête est sous le contrôle d'un cavalier (qui la monte), d'un conducteur (qui la tire par devant) ou d'un guide (qui la pousse par derrière), celui-ci est garant (financièrement responsable) des dommages causés par la partie avant de l'animal, comme ses sabots antérieurs (ses pattes avant) ou sa bouche. En revanche, il n'est pas responsable des dommages causés par sa partie arrière, comme un coup de sabot de ses pattes postérieures (arrière). Cela s'appuie sur le hadith :</p>
<p class="ar"><span dir="rtl">«الرِّجْلُ جُبَارٌ»</span></p>
<p><em><strong>« Le coup de sabot de la patte arrière est nul (sans obligation de compensation) »</strong></em> <a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a><em><strong>.</strong></em></p>
<p>Et dans la version d'Aboû Hourayrah :</p>
<p class="ar"><span dir="rtl">«رِجْلُ العَجْمَاءِ جُبَارٌ»</span></p>
<p><em><strong>« La patte de l'animal est joubâr ».</strong></em></p>
<p>Le terme <em>Al-'Ajmâ'</em> (<span dir="rtl">العَجْمَاء</span>) désigne la bête ; elle a été nommée ainsi parce qu'elle ne parle pas. Et le mot <em>Joubâr</em> (<span dir="rtl">جُبَار</span>) — avec une Dammah sur la lettre Jîm — signifie que le dommage causé par l'animal est sans valeur (c'est-à-dire qu'il ne donne pas lieu à une compensation ou à des poursuites).</p>
<p>Cheikh al-Islam Ibn Taymiyyah (qu'Allah lui fasse miséricorde) a dit <a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a>: <em>« Tout animal est une bête brute ('Ajmâ'), à l'instar des bovins, des ovins et autres. Ainsi, le dommage causé par les bêtes n'est pas sujet à compensation lorsqu'elles agissent d'elles-mêmes. C'est le cas, par exemple, si l'animal s'échappe des mains de celui qui le tenait et cause des dégradations : personne n'est alors tenu de compenser, tant que la bête n'est pas intrinsèquement agressive (mordeuse/dangereuse) et que son propriétaire n'a pas fait preuve de négligence dans sa garde durant la nuit, ou au sein des marchés et des rassemblements des musulmans. De même, plusieurs savants ont affirmé : "Le dommage n'est considéré comme nul et non avenu (Joubâr) que si la bête s'est échappée et erre à l'abandon, sans personne pour la guider par devant ni la pousser par derrière, à l'exception de la bête notoirement dangereuse/habituée à nuire". »</em> Fin de citation.</p>
<p>⁕ Si un être humain ou un animal l'attaque (commet une agression contre lui - <em>Sâla</em>), et que cette agression ne peut être repoussée que par la mise à mort, et qu'il le tue : il n'y a alors aucune compensation (ni responsabilité financière ou pénale) à sa charge. En effet, il l'a tué pour se défendre, et la légitime défense est autorisée ; il n'est donc pas garant des conséquences qui en découlent. De plus, il l'a tué pour repousser son mal, et lorsqu'on tue une personne pour repousser son mal, c'est l'agresseur lui-même qui est considéré comme le meurtrier de sa propre personne.</p>
<p>Le Cheikh Taqî ad-Dîn [Ibn Taymiyyah] <a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a>a dit : <em>« Il lui incombe de repousser l'agresseur qui s'en prend à lui. Si l'agression ne peut être repoussée que par la mise à mort, cela lui est permis à l'unanimité des juristes (Al-Fouqahâ). »</em></p>
<p>⁕ Parmi les choses dont la destruction n'entraîne aucune compensation (responsabilité financière) : les instruments de divertissement [interdits], la croix, les récipients contenant du vin, ainsi que les livres d'égarement, de superstitions, d'obscénité et de débauche. Cela s'appuie sur ce qu'a rapporté [l'Imam] Ahmad d'après Ibn 'Omar : <em><strong>« Le Prophète <span dir="rtl">ﷺ</span> lui ordonna de prendre un grand couteau, puis il sortit vers les marchés de Médine où se trouvaient des outres de vin importées du Cham (la grande Syrie). Elles furent alors fendues [et vidées] en sa présence, et il ordonna à ses compagnons d'en faire de même »</strong></em> <a href="#fn6" class="footnote-ref" id="fnref6" role="doc-noteref"><sup>6</sup></a>. Ce hadith démontre ainsi l'exigence de détruire ces choses et l'absence de compensation [pour leur perte]. <strong>Cependant, il est indispensable que leur destruction se fasse sur ordre de l'autorité politique (gouvernementale) et sous sa supervision, afin de garantir l'intérêt public et de repousser tout désordre (chaos/corruption).</strong></p>
