<p>⁕ L'usurpation (<em>Al-Ghasb</em>) au sens linguistique signifie : prendre une chose injustement.</p>
<p>Et son sens dans le jargon des juristes (<em>Fouqahâ</em>) est : <em><strong>la mainmise par la force et de manière illégitime sur le droit d'autrui.</strong></em></p>
<p>⁕ L'usurpation est interdite par consensus (<em>Ijmâ'</em>) des musulmans, en raison de la parole d'Allah Soubhânahou wa Ta'âlâ :</p>
<p class="ar"><span dir="rtl">﴿وَلَا تَأْكُلُوا أَمْوَالَكُم بَيْنَكُم بِالْبَاطِلِ﴾ [البقرة: ١٨٨]</span></p>
<p></p>
<p><strong>« Et ne menez pas de transactions financières injustes entre vous » [Al-Baqarah : 188]</strong></p>
<p>Et l'usurpation fait partie des formes les plus graves de consommation illicite des biens d'autrui, et en raison de la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«إِنَّ دِمَاءَكُمْ وَأَمْوَالَكُمْ وَأَعْرَاضَكُمْ عَلَيْكُمْ حَرَامٌ»</span></p>
<p></p>
<p><em><strong>« Certes, votre sang, vos biens et votre honneur vous sont sacrés (interdits). »</strong></em><a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a></p>
<p>Et le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="rtl">«لَا يَحِلُّ مَالُ امْرِئٍ مُسْلِمٍ إِلَّا بِطِيبِ نَفْسِهِ»</span></p>
<blockquote>
<p><em><strong>« Le bien d'un musulman n'est licite qu'avec son plein consentement. »</strong></em><a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a></p>
</blockquote>
<p>⁕ Le bien usurpé peut être un bien immobilier (un terrain, une maison) ou un bien meuble (transportable), en raison de la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«مَنِ اقْتَطَعَ شِبْراً مِنَ الْأَرْضِ ظُلْماً؛ طُوِّقَهُ مِنْ سَبْعِ أَرَضِينَ»</span></p>
<p><em><strong>« Quiconque s'approprie injustement l'équivalent d'un empan de terre, il lui sera suspendu (autour du cou) sous forme de collier provenant de sept terres. »</strong></em><a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a>.</p>
<p>⁕ Il est donc obligatoire pour l'usurpateur de se repentir à Allah <span dir="rtl">ﷻ</span>, de restituer le bien usurpé à son propriétaire, et de lui demander pardon. Le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="rtl">«مَنْ كَانَتْ لَهُ مَظْلَمَةٌ لِأَحَدٍ مِنْ عِرْضِهِ أَوْ شَيْءٍ فَلْيَتَحَلَّلْهُ مِنْهُ الْيَوْمَ قَبْلَ أَنْ لَا يَكُونَ دِينَارٌ وَلَا دِرْهَمٌ (يَعْنِي يَوْمَ الْقِيَامَةِ) إِنْ كَانَ لَهُ عَمَلٌ صَالِحٌ أُخِذَ مِنْهُ بِقَدْرِ مَظْلَمَتِهِ، وَإِنْ لَمْ تَكُنْ لَهُ حَسَنَاتٌ أُخِذَ مِنْ سَيِّئَاتِ صَاحِبِهِ فَحُمِلَ عَلَيْهِ» رَوَاهُ الْبُخَارِيُّ</span></p>
<p><em><strong>« Quiconque a commis une injustice envers son frère concernant son honneur ou autre chose, qu'il lui demande de l'en absoudre aujourd'hui, avant que ne vienne un jour où il n'y aura ni dinar ni dirham (c'est-à-dire le Jour de la Résurrection). S'il a de bonnes œuvres, on en prendra à hauteur de son injustice, et s'il n'a pas de bonnes actions, on prendra des péchés de sa victime pour les lui charger. »</strong></em> Rapporté par Al-Boukhârî.<a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a></p>
<p>Ainsi, si le bien usurpé existe toujours, il doit le restituer en l'état. S'il a été détruit ou endommagé, il doit restituer son équivalent (ou sa valeur).</p>
<p>L'Imam Al-Mouaffaq a dit : <em>« Les savants sont unanimes (consensus) sur l'obligation de restituer le bien usurpé si celui-ci est encore en l'état et n'a pas subi d'altération. »</em> Fin de citation.</p>
<p>⁕ De même, il est obligatoire pour l'usurpateur de restituer le bien usurpé accompagné de son surplus (de son gain), que ce surplus soit lié (comme la prise de poids d'un animal) ou distinct (comme des fruits ou des petits nés de l'animal) ; car il s'agit d'une croissance du bien usurpé, elle appartient donc à son propriétaire au même titre que le bien d'origine.</p>
<p>⁕ Et si l'usurpateur a construit ou planté sur le terrain usurpé, il a l'obligation de démolir la construction et de déraciner les plantations si le propriétaire le lui demande, en raison de la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«لَيْسَ لِعِرْقٍ ظَالِمٍ حَقٌّ»</span></p>
<p><em><strong>« Un droit issu d'une racine injuste n'a aucune valeur juridique. »</strong></em><a href="#fn5" class="footnote-ref" id="fnref5" role="doc-noteref"><sup>5</sup></a> Rapporté par At-Tirmidhî et d'autres, qui l'a qualifié de bon (Hassan). Et si ce déracinement ou cette démolition détériore le terrain, l'usurpateur doit payer une compensation financière pour cette dépréciation. Il est également tenu de faire disparaître les traces restantes des plantations et des constructions, afin de restituer le terrain sain et intact à son propriétaire.</p>
<p>⁕ Il est aussi obligatoire pour lui de payer le prix de sa location depuis le moment de son usurpation jusqu'à sa restitution, c'est-à-dire la valeur locative équivalente du marché ; car il a privé injustement son propriétaire de bénéficier de son bien durant toute cette période.</p>
<p>⁕ S'il a usurpé une chose et l'a retenue jusqu'à ce que son prix sur le marché baisse, il doit obligatoirement compenser cette perte de valeur, selon l'avis authentique.</p>
<p>⁕ Si l'usurpateur a mélangé le bien usurpé avec une autre denrée dont il est possible de le dissocier — comme du blé mélangé à de l'orge —, l'usurpateur est obligé de trier le mélange pour extraire le bien et le restituer.</p>
<p>Mais s'il l'a mélangé à une denrée dont il est impossible de le dissocier — comme s'il a mélangé du blé avec un blé identique —, il doit restituer une quantité équivalente (en volume ou en poids) prise sur une autre denrée non mélangée.</p>
<p>Et s'il l'a mélangé avec une qualité inférieure, supérieure, ou avec une matière de nature totalement différente et impossible à dissocier ; le mélange est alors vendu, et chacun reçoit sa part respective du prix de vente. Si, dans cette situation, la valeur du bien usurpé est devenue inférieure à ce qu'elle était lorsqu'il était isolé, l'usurpateur doit obligatoirement compenser cette baisse de valeur.</p>
<p>⁕ Et parmi ce que les juristes ont mentionné dans ce chapitre, figure leur dicton :</p>
<p class="ar"><span dir="rtl">«وَالْأَيْدِي الْمُتَرَتِّبَةُ عَلَى يَدِ الْغَاصِبِ كُلُّهَا أَيْدِي ضَمَانٍ»</span></p>
<p>« Et toutes les mains qui se succèdent après celle de l'usurpateur sont des mains engagées par la responsabilité de garantie (<em>Aydî Damân</em>). »</p>
<p>Et sa signification est la suivante : toutes les mains vers lesquelles le bien usurpé est transféré par l'intermédiaire de l'usurpateur sont tenues de garantir le bien usurpé s'il vient à être détruit ou perdu en leur possession. Et ces mains sont au nombre de dix : La main de l'acheteur (qui achète le bien à l'usurpateur) et ce qui est de même nature, La main du locataire, La main de celui qui prend possession du bien pour se l'approprier sans contrepartie financière, comme le bénéficiaire d'un don (<em>Al-Mouttahib</em>), La main de celui qui prend possession du bien dans l'intérêt du donateur/transmetteur, comme le mandataire (<em>Al-Wakîl</em>), La main de l'emprunteur (<em>Al-Moustâ'îr</em>), La main de l'usurpateur (un second usurpateur qui usurperait le bien au premier), La main de celui qui gère et fait fructifier l'argent, comme l'investisseur dans un partenariat (<em>Al-Moudârib</em>), La main de l'époux à qui l'on a donné une femme esclave usurpée (ou un bien usurpé en guise de dot), La main de celui qui prend possession du bien à titre de compensation ou dédommagement en dehors d'une vente, Et la main de celui qui détruit le bien usurpé pour le compte ou au nom de l'usurpateur. Dans toutes ces situations : si la seconde personne (celle qui reçoit le bien) connaît la réalité de la situation et sait que celui qui lui transmet le bien est un usurpateur, alors la responsabilité définitive de la garantie lui incombe directement, car elle a transgressé de manière délibérée un bien pour lequel elle sait pertinemment qu'aucune autorisation n'a été donnée par son propriétaire légitime. En revanche, si elle ignorait la réalité de la situation (de bonne foi), alors la responsabilité de la garantie incombe au premier usurpateur.</p>
<p>⁕ Et si le bien usurpé fait partie de ce qu'il est d'usage (habituel) de louer, l'usurpateur a l'obligation de payer sa valeur locative équivalente pour toute la période où le bien est resté entre ses mains. Car l'usufruit (le bénéfice ou la jouissance d'un bien) constitue un bien de valeur quantifiable ; sa garantie est donc obligatoire au même titre que la garantie du bien matériel lui-même.</p>
<p>⁕ Et tous les actes juridiques de l'usurpateur (concernant le bien usurpé) sont nuls et non avenus, en raison de l'absence d'autorisation du propriétaire.</p>
<p>⁕ Et s'il a usurpé une chose dont il ignore l'identité du propriétaire, et qu'il lui est impossible de la lui restituer, il la remet alors au gouverneur (ou à l'autorité compétente) qui la placera à l'endroit qui convient, ou bien il en fait aumône au nom de son propriétaire. S'il en fait aumône, la récompense de celle-ci reviendra à son propriétaire, et l'usurpateur se sera ainsi libéré de cette responsabilité.</p>
<p>⁕ Et l'usurpation des biens ne se limite pas seulement à la s'en emparer par la force ; cela englobe plutôt le fait de s'en emparer par le biais de litiges mensongers (fausses procédures judiciaires) et de serments parjures.</p>
<p>Allah le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿وَلَا تَأْكُلُوا أَمْوَالَكُم بَيْنَكُم بِالْبَاطِلِ وَتُدْلُوا بِهَا إِلَى الْحُكَّامِ لِتَأْكُلُوا فَرِيقًا مِّنْ أَمْوَالِ النَّاسِ بِالْإِثْمِ وَأَنتُمْ تَعْلَمُونَ﴾ [البقرة: ١٨٨]</span></p>
<p><strong><em>« Et ne devorez pas mutuellement vos biens de façon illicite, et ne les introduisez pas auprès des juges pour dévorer sciemment et pénalement une partie des biens des gens. »</em> [Sourate Al-Baqarah : 188]</strong></p>
<p>Et le Très-Haut a dit :</p>
<p class="ar"><span dir="rtl">﴿إِنَّ الَّذِينَ يَشْتَرُونَ بِعَهْدِ اللَّهِ وَأَيْمَانِهِمْ ثَمَنًا قَلِيلًا أُولَٰئِكَ لَا خَلَاقَ لَهُمْ فِي الْآخِرَةِ وَلَا يُكَلِّمُهُمُ اللَّهُ وَلَا يَنظُرُ إِلَيْهِمْ يَوْمَ الْقِيَامَةِ وَلَا يُزَكِّيهِمْ وَلَهُمْ عَذَابٌ أَلِيمٌ﴾ [آل عمران: ٧٧]</span></p>
<p><strong><em>« Ceux qui vendent à vil prix leur engagement envers Allah ainsi que leurs serments, ceux-là n'auront aucune part dans l'au-delà ; Allah ne leur adressera pas la parole, ne les regardera pas au Jour de la Résurrection, et ne les purifiera pas ; et ils auront un châtiment douloureux. »</em> [Sourate Âl 'Imrân : 77]</strong> ; l'affaire est donc d'une immense gravité et le jugement sera sévère.</p>
<p>Et il [le Prophète] <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="rtl">«مَنِ اقْتَطَعَ شِبْراً مِنَ الْأَرْضِ طُوِّقَهُ مِنْ سَبْعِ أَرَضِينَ»</span></p>
<p><em><strong>« Quiconque s'approprie injustement la valeur d'un empan de terre se le verra enrouler [autour du cou] sous forme de carcan issu de sept terres [au Jour de la Résurrection]. »</strong></em><a href="#fn6" class="footnote-ref" id="fnref6" role="doc-noteref"><sup>6</sup></a></p>
<p>Et il [le Prophète] <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="rtl">«مَنْ قَضَيْتُ لَهُ بِحَقِّ أَخِيهِ؛ فَلَا يَأْخُذْهُ؛ فَإِنَّمَا أَقْطَعُ لَهُ قِطْعَةً مِنَ نَارٍ»</span></p>
<p><em><strong>« Celui en faveur de qui je tranche [un litige] en lui accordant un droit qui appartient en réalité à son frère, qu'il ne le prenne pas ; car je ne fais en vérité que lui attribuer un morceau de feu. »</strong></em> <a href="#fn7" class="footnote-ref" id="fnref7" role="doc-noteref"><sup>7</sup></a></p>
