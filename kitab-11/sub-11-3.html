<p>⁕ Les juristes (Fuqahâ) — qu'Allah leur fasse miséricorde — ont défini le prêt à usage (<em>Al-'Âriyyah</em>) comme étant : <em><strong>« L'autorisation de tirer profit d'un bien dont l'usage est licite, et qui subsiste après la jouissance de son utilité, afin qu'il soit restitué à son propriétaire. »</strong></em></p>
<p>Est donc exclu de cette définition ce dont l'usage n'est pas licite ; il n'est donc pas permis de le prêter. De même, en est exclu ce dont il n'est pas possible de tirer profit sans la consommation (la destruction) de sa substance même, comme la nourriture et les boissons.</p>
<p>⁕ Le prêt à usage (<em>Al-'Âriyyah</em>) est légiféré par le Livre (le Coran), la Sunnah et le consensus (Al-Ijmâ') :</p>
<p>⁃ Allah — Qu'Il soit Exalté — a dit :</p>
<p class="ar"><span dir="rtl">﴿وَيَمْنَعُونَ الْمَاعُونَ﴾ [المَاعُون : ٧]</span></p>
<p><strong>« Et qui refusent l'ustensile (Al-Mâ'ûn) »</strong> [Sourate Al-Mâ'ûn : 7] ; c'est-à-dire : les biens d'usage courant que les gens s'échangent entre eux. Il (Allah) a donc blâmé ceux qui en privent celui qui a besoin de les emprunter. Et ceux qui considèrent que le prêt est obligatoire se sont appuyés sur ce noble verset, et c'est l'avis qu'a choisi Cheikh al-Islâm Ibn Taymiyyah — qu'Allah lui fasse miséricorde — lorsque le propriétaire est riche (et n'est pas dans le besoin de son bien).</p>
<p>⁃ De plus, le Prophète <span dir="rtl">ﷺ</span> a emprunté un cheval appartenant à Abû Talhah, et il <span dir="rtl">ﷺ</span> a également emprunté des armures à Safwân ibn Umayyah.</p>
<p>⁕ Accorder un prêt à usage à celui qui en a besoin est un acte de dévotion (un rapprochement vers Allah) par lequel le prêteur obtient une immense récompense, car cela entre dans le cadre général de l'entraide dans le bien et la piété.</p>
<p>⁕ <strong>Quatre conditions sont requises</strong> pour la validité du prêt à usage :</p>
<p><strong>La première :</strong> La capacité juridique du prêteur à faire une donation, car le prêt comporte une forme de donation (de l'usage du bien). Ainsi, il n'est pas valide de la part d'un enfant, d'un fou ou d'une personne mentalement inapte (le prodigue/l'insensé).</p>
<p><strong>La deuxième condition :</strong> La capacité juridique de l'emprunteur à recevoir une donation, de sorte que son acceptation soit juridiquement valable.</p>
<p><strong>La troisième condition :</strong> Que l'utilité du bien prêté soit licite. Ainsi, il n'est pas permis de prêter un esclave musulman à un mécréant, ni un gibier (ou équivalent) à une personne en état de sacralisation (<em>Muhrim</em>), en raison de la parole d'Allah — Le Très-Haut — :</p>
<p class="ar"><span dir="rtl">﴿وَلَا تَعَاوَنُوا عَلَى الْإِثْمِ وَالْعُدْوَانِ﴾ [المَائِدَة: ٢]</span></p>
<p><strong>« Et ne vous entraidez pas dans le péché et la transgression »</strong> [Sourate Al-Mâ'idah : 2].</p>
<p><strong>La quatrième condition :</strong> Que le bien prêté fasse partie de ce dont il est possible de tirer profit tout en préservant sa substance (sans qu'il ne se consume), comme cela a été mentionné précédemment.</p>
<p>⁕ Le prêteur a le droit de reprendre le bien prêté quand il le souhaite, sauf si cela entraîne un préjudice pour l'emprunteur. C'est le cas, par exemple, s'il lui a permis d'occuper (ou d'utiliser) le bien pour une chose telle que l'emprunteur subirait un dommage si le bien prêté était repris.</p>
<p>Comme s'il lui avait prêté un navire pour transporter ses marchandises : il ne peut alors pas se rétracter tant que le navire se trouve en mer. Et comme s'il lui avait prêté un mur pour qu'il y pose les extrémités de ses poutres en bois : il ne peut alors pas se rétracter concernant le mur tant que les extrémités des poutres s'y trouvent.</p>
<p>⁕ Il est obligatoire pour l'emprunteur de préserver le bien prêté encore plus rigoureusement qu'il ne préserve ses propres biens, afin de le restituer sain et sauf à son propriétaire. Cela est conforme à la parole d'Allah — Le Très-Haut — :</p>
<p class="ar"><span dir="rtl">﴿إِنَّ اللَّهَ يَأْمُرُكُمْ أَن تُؤَدُّوا الْأَمَانَاتِ إِلَىٰ أَهْلِهَا﴾ [النساء: ٥٨]</span></p>
<p><strong>« Certes, Allah vous commande de rendre les dépôts confiés à leurs ayants droit »</strong> [Sourate An-Nisâ' : 58]. Ce verset prouve l'obligation de restituer les dépôts de confiance, et le prêt à usage en fait partie. De plus, le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="rtl">«عَلَى اليَدِ مَا أَخَذَتْ حَتَّى تُؤَدِّيَهُ»</span></p>
<p><em><strong>« La main est responsable de ce qu'elle a pris jusqu'à ce qu'elle le restitue »</strong></em><a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a>, et il <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="rtl">«أَدِّ الأَمَانَةَ إِلَى مَنِ ائْتَمَنَكَ»</span></p>
<p><em><strong>« Acquitte-toi du dépôt envers celui qui t'a fait confiance »</strong></em><a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a>. Ces textes prouvent l'obligation de préserver ce qui est confié à l'homme, ainsi que l'obligation de le restituer intact à son propriétaire. Le prêt à usage entre dans cette généralité car l'emprunteur en est le dépositaire de confiance, et la restitution lui est demandée. Il ne lui a été permis d'en jouir que dans les limites fixées par l'usage coutumier (<em>Al-'Urf</em>). Il ne lui est donc pas permis d'en abuser de manière excessive au point de provoquer sa détérioration (ou sa destruction), ni de l'utiliser dans ce pour quoi il n'est pas approprié d'être utilisé, car son propriétaire ne lui a pas donné l'autorisation pour cela. Or, Allah — Le Très-Haut — a dit :</p>
<p class="ar"><span dir="rtl">﴿هَلْ جَزَاءُ الْإِحْسَانِ إِلَّا الْإِحْسَانُ﴾ [الرحمن: ٦٠]</span></p>
<p><strong>« Y a-t-il d'autre récompense pour le bien que le bien ? »</strong> [Sourate Ar-Rahmân : 60].</p>
<p>Si l'emprunteur utilise le bien dans un but autre que celui pour lequel il a été emprunté et qu'il subit un dommage (ou est détruit), il est alors impérativement tenu d'en rembourser la valeur (garantie financière). Cela s'appuie sur la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">«عَلَى اليَدِ مَا أَخَذَتْ حَتَّى تُؤَدِّيَهُ»</span></p>
<p><em><strong>« La main est responsable de ce qu'elle a pris jusqu'à ce qu'elle le restitue »</strong></em><a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a>, rapporté par les cinq (auteurs de Sunan et Ahmad) et authentifié par Al-Hâkim. Cela démontre donc l'obligation de restituer ce qu'une personne a pris alors que cela appartient à autrui, et elle ne se décharge de sa responsabilité que lorsque le bien parvient à son propriétaire ou à son représentant légal.</p>
<p>Et si le bien est endommagé (ou détruit) au cours d'une utilisation conforme à l'usage normal (et convenable), l'emprunteur n'en est pas garant (il n'a pas à le rembourser). En effet, le prêteur lui a accordé l'autorisation pour cet usage précis, et tout ce qui découle d'un acte autorisé ne fait pas l'objet d'une garantie (financière en cas de préjudice involontaire).</p>
<p>⁕ Il n'est pas permis à l'emprunteur de sous-prêter le bien qui lui a été prêté. En effet, quiconque se voit accorder l'autorisation d'utiliser une chose n'a pas le droit d'en accorder l'autorisation à un autre, et parce qu'un tel acte exposerait le bien à la détérioration.</p>
<p>⁕ Ceci étant dit, les savants ont divergé concernant la responsabilité financière (la garantie) de l'emprunteur vis-à-vis du bien prêté si celui-ci subit un dommage (ou est détruit) entre ses mains sans qu'il ne l'ait utilisé dans un but autre que celui prévu.</p>
<ul>
<li><blockquote>
<p>Un groupe de savants est d'avis qu'il est obligatoire pour lui d'en rembourser la valeur, qu'il ait commis un manquement (ou une transgression) ou non, en raison de la portée générale de la parole du Prophète <span dir="rtl">ﷺ</span> :</p>
</blockquote></li>
</ul>
<blockquote>
<p class="ar"><span dir="rtl">«عَلَى اليَدِ مَا أَخَذَتْ حَتَّى تُؤَدِّيَهُ»</span></p>
<p><em><strong>« La main est responsable de ce qu'elle a pris jusqu'à ce qu'elle le restitue »</strong></em><a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a>. C'est le cas, par exemple, si la bête venait à mourir, que le vêtement brûlait ou que l'objet prêté était volé.</p>
</blockquote>
<ul>
<li><blockquote>
<p>Un autre groupe de savants est d'avis qu'il n'en est pas garant s'il n'a commis aucun manquement, car le bien ne fait l'objet d'une garantie qu'en cas de transgression à son encontre. <strong>Et c'est cet avis qui est vraisemblablement l'avis prépondérant (<em>Ar-Râjih</em>)</strong> ; car l'emprunteur a pris possession du bien avec l'autorisation de son propriétaire, il s'agit donc d'un dépôt de confiance (<em>Amânah</em>) entre ses mains, au même titre que le dépôt de biens (<em>Al-Wadî'ah</em>).</p>
</blockquote></li>
</ul>
<p>⁕ En outre, il est obligatoire pour l'emprunteur de préserver le bien prêté, d'en prendre grand soin, de s'empresser de le restituer à son propriétaire dès que son besoin a pris fin, de ne pas faire preuve de négligence à son sujet et de ne pas l'exposer à la détérioration. En effet, ce bien constitue un dépôt de confiance auprès de lui, et son propriétaire a agi avec bienfaisance à son égard. Or, Allah dit :</p>
<p class="ar"><span dir="rtl">﴿هَلْ جَزَاءُ الْإِحْسَانِ إِلَّا الْإِحْسَانُ﴾ [الرَّحْمَن]</span></p>
<p><strong>« Y a-t-il d'autre récompense pour le bien que le bien ? »</strong> [Sourate Ar-Rahmân : 60].</p>
