<p>⁕ <strong>Le fait de déposer (<em>Al-Îdâ'</em>) au sens religieux (Chari'ah) :</strong> C'est le fait de mandater quelqu'un pour la garde d'un bien, à titre bénévole.</p>
<p>⁕ <strong>Le dépôt (<em>Al-Wadî'ah</em>) au sens linguistique :</strong> Cela vient du verbe <em>Wada'a</em> qui signifie « laisser une chose ». Elle a été nommée ainsi parce qu'elle est laissée auprès de la personne qui la reçoit (<em>Al-Mûda'</em>).</p>
<p><strong>Au sens religieux :</strong> C’est le nom donné au bien qui est déposé chez une personne pour qu'elle le garde sans contrepartie (gratuitement).</p>
<p>⁕ Est exigé pour la validité du dépôt ce qui est exigé pour le mandat (<em>Al-WAKÂLAH</em>), à savoir : la puberté, la raison (la pleine possession de ses facultés mentales) et le discernement (la maturité financière) ; car le dépôt est un mandat visant la préservation du bien.</p>
<p>⁕ Il est recommandé d'accepter le dépôt pour celui qui se sait digne de confiance et capable de le préserver, car il y a en cela une immense récompense. Cela se base sur le hadith du Prophète <span dir="rtl">ﷺ</span> :</p>
<p class="ar"><span dir="rtl">وَاللهُ فِي عَوْنِ الْعَبْدِ مَا كَانَ الْعَبْدُ فِي عَوْنِ أَخِيهِ »</span></p>
<p><strong>« Allah aide le serviteur tant que le serviteur aide son frère »</strong><a href="#fn1" class="footnote-ref" id="fnref1" role="doc-noteref"><sup>1</sup></a>, et en raison du besoin qu'ont les gens de ce service. Quant à celui qui ne se sait pas capable de le préserver, il lui est détestable de l'accepter.</p>
<p>⁕ Parmi les règles du dépôt, il y a le fait que s'il subit une détérioration (ou une perte) chez le dépositaire sans que celui-ci n'ait commis de négligence, il n'en est pas garant (il n'a pas à le rembourser). C’est comparable au cas où ce bien périrait au milieu de ses propres biens. En effet, le dépôt est un dépôt de confiance (<em>Amânah</em>), et celui à qui l'on fait confiance n'est pas garant tant qu'il ne transgresse pas (les limites) ou ne commet pas d'abus.</p>
<p>Il est rapporté dans un hadith comportant une faiblesse que le Prophète <span dir="rtl">ﷺ</span> a dit :</p>
<p class="ar"><span dir="rtl">« مَنْ أُوْدِعَ وَدِيعَةً ، فَلَا ضَمَانَ عَلَيْهِ »</span></p>
<p><strong>« Quiconque reçoit un dépôt n'en est pas garant »</strong> (Rapporté par Ibn Mâjah)<a href="#fn2" class="footnote-ref" id="fnref2" role="doc-noteref"><sup>2</sup></a>.</p>
<p>Ad-Dâraqutnî l’a également rapporté avec les termes :</p>
<p class="ar"><span dir="rtl">« لَيْسَ عَلَى الْمُسْتَوْدَعِ غَيْرِ الْمُغِلِّ ضَمَانٌ »</span></p>
<p><strong>« Le dépositaire n'est pas garant, sauf s'il est un <em>Mughill</em> »</strong><a href="#fn3" class="footnote-ref" id="fnref3" role="doc-noteref"><sup>3</sup></a> — le <em>Mughill</em> étant le traître.</p>
<p>Et dans une autre version :</p>
<p class="ar"><span dir="rtl">« لَا ضَمَانَ عَلَى مُؤْتَمَنٍ »</span></p>
<p><strong>« Pas de garantie pour celui à qui l'on a fait confiance »</strong><a href="#fn4" class="footnote-ref" id="fnref4" role="doc-noteref"><sup>4</sup></a>.</p>
<p>De plus, le dépositaire garde ce bien à titre bénévole. Si on lui imposait une garantie (en cas de perte involontaire), les gens refuseraient d'accepter les dépôts, ce qui causerait du tort aux gens et paralyserait l'intérêt public.</p>
<p>Quant à celui qui transgresse à l'égard du dépôt (en l'utilisant sans permission par exemple) ou qui se montre négligent dans sa garde, il en devient le garant (il doit le rembourser) s'il vient à périr ; car il est alors considéré comme le destructeur des biens d'autrui.</p>
<p>⁕ Parmi les règles du dépôt : il est obligatoire pour le dépositaire de le conserver dans un lieu sûr approprié (un endroit adéquat pour ce type de bien), tout comme il préserve ses propres biens. En effet, Allah le Très-Haut a ordonné de restituer les dépôts dans Son verset :</p>
<p class="ar"><span dir="rtl">﴿ إِنَّ اللهَ يَأْمُرُكُمْ أَن تُؤَدُّوا الْأَمَانَاتِ إِلَىٰ أَهْلِهَا ﴾ [النساء : ٥٨]</span></p>
<p><strong>« Certes, Allah vous commande de rendre les dépôts confiés à leurs ayants droit »</strong> [Sourate An-Nisâ' : 58].</p>
<p>Or, il est impossible de restituer un bien sans l'avoir préservé au préalable. De plus, lorsque le dépositaire a accepté le dépôt, il s'est engagé à le garder ; il est donc tenu de respecter l'engagement qu'il a pris.</p>
<p>⁕ Si le dépôt est un animal, le dépositaire est dans l'obligation de le nourrir. S'il cesse de lui donner sa nourriture sans l'ordre de son propriétaire et que l'animal meurt, il en est garant (il doit le rembourser). En effet, nourrir l'animal est une obligation ordonnée. En plus d'en être garant financièrement, il commet un péché en délaissant sa nourriture ou son abreuvement jusqu'à ce qu'il meure, car il lui était obligatoire de le nourrir et de l'abreuver pour s'acquitter d'un droit envers Allah le Très-Haut, cet animal possédant une sacralité (en tant qu'être vivant).</p>
<p>⁕ Il est permis au dépositaire de remettre le dépôt à la personne qui garde habituellement ses propres biens, comme son épouse, son serviteur, son intendant ou son domestique. Si le bien subit une détérioration chez l'un d'entre eux sans qu'il n'y ait eu de transgression ni de négligence, il n'y a pas de garantie (pas de remboursement). En effet, le dépositaire a le droit d'assurer la garde par lui-même ou par l'intermédiaire de celui qui le remplace. De même, s'il remet le dépôt à la personne qui garde habituellement les biens du propriétaire du dépôt lui-même, il est dégagé de toute responsabilité, car cela est conforme à la coutume locale (<em>'Arf</em>).</p>
<p>En revanche, s'il confie le dépôt à un tiers (une personne étrangère à lui-même et au propriétaire) et que le bien périt, le dépositaire en devient garant. En effet, il ne lui est pas permis de confier ce dépôt à autrui sans excuse valable. Sauf si le fait de le déposer chez ce tiers est motivé par une excuse de force majeure qui l'y contraint, comme s'il sent la mort l'approcher, ou s'il s'apprête à voyager et craint pour la sécurité du bien s'il l'emporte avec lui. Dans ces cas précis, il n'y a aucun grief contre lui, et il ne sera pas garant si le bien vient à périr.</p>
<p>⁕ Si une situation de peur ou de danger survient, ou si le dépositaire veut voyager, il est alors obligatoire pour lui de restituer le dépôt à son propriétaire ou à son mandataire. S’il ne trouve ni le propriétaire ni son mandataire, il l’emporte avec lui en voyage si cela s'avère plus sûr pour la préservation du bien.</p>
<p>Mais si le voyage n'est pas la solution la plus sûre pour le bien, il le remet au gouverneur (ou au juge/à l'autorité compétente) ; car le gouverneur se substitue au propriétaire en cas d'absence de ce dernier. Et s'il n'est pas possible de le déposer chez le gouverneur, il le confie à une personne digne de confiance (<em>Thiqah</em>).</p>
<p>En effet, lorsque le Prophète <span dir="rtl">ﷺ</span> a voulu émigrer (faire la Hégire), il a confié les dépôts qu’il possédait à Umm Ayman (qu'Allah l'agrée) et a ordonné à 'Alî (qu'Allah l'agrée) de les restituer à leurs ayants droit.</p>
<p>Il en va de même pour celui qui sent la mort l'approcher alors qu'il détient des dépôts appartenant à des tiers : il est obligatoire pour lui de les restituer à leurs propriétaires. S’il ne les trouve pas, il les remet au gouverneur ou à une personne digne de confiance.</p>
<p>⁕ La transgression (l'abus) à l’égard du dépôt rend obligatoire sa garantie (son remboursement) s’il vient à périr. C'est le cas par exemple si on lui confie un animal et qu’il le monte pour une autre raison que celle de le nourrir ou de l'abreuver. Ou si on lui confie un vêtement et qu'il le porte sans que ce soit par peur qu'il ne soit rongé par les mites.</p>
<p>De même, si on lui confie des dirhams placés dans un lieu sûr (<em>Hirz</em>) et qu'il les sort de ce lieu, ou si l'argent était emballé/noué et qu'il défait le nœud. Dans toutes ces situations, il devient garant du dépôt s'il est endommagé ou perdu, car il a commis une transgression par un tel comportement.</p>
<p>⁕ Le dépositaire est une personne de confiance (<em>Amîn</em>). Sa parole est acceptée (juridiquement) s'il prétend avoir restitué le dépôt à son propriétaire ou à son représentant. De même, sa parole est acceptée s'il prétend que le bien a péri sans qu'il n'ait commis de négligence, à condition qu'il prête serment. En effet, il est un homme de confiance, car Allah le Très-Haut a qualifié ce bien de dépôt de confiance (<em>Amânah</em>) dans Son verset :</p>
<p class="ar"><span dir="rtl">﴿ إِنَّ اللهَ يَأْمُرُكُمْ أَن تُؤَدُّوا الْأَمَانَاتِ إِلَىٰ أَهْلِهَا ﴾ [النساء : ٥٨]</span></p>
<p><strong>« Certes, Allah vous commande de rendre les dépôts confiés à leurs ayants droit »</strong> [Sourate An-Nisâ' : 58].</p>
<p>Et le principe de base est sa présomption d'innocence tant qu'aucune preuve n'est établie pour démontrer son mensonge. En revanche, s'il prétend que le bien a péri à cause d'un événement public et visible, tel qu'un incendie, sa parole n'est acceptée que s'il apporte une preuve évidente (<em>Bayyinah</em>) démontrant que cet événement a bien eu lieu.</p>
<p>Si le propriétaire du dépôt lui réclame sa restitution et que le dépositaire retarde celle-ci sans excuse valable, jusqu'à ce que le bien périsse, il en devient alors le garant (il doit le rembourser). En effet, il a commis un acte illicite (<em>Muharram</em>) en conservant le bien après que son propriétaire l'a réclamé.</p>
<p>Et Allah est Le plus Savant (<em>Wa Allâhu a'lam</em>).</p>
